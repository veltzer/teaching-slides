<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- == CAPTURE WORKFLOW PIPELINE == -->
  <text x="60" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">Packet Capture Workflow</text>

  <!-- Step 1 -->
  <rect x="60" y="50" width="210" height="90" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="165" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">1. Capture</text>
  <text x="165" y="100" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" text-anchor="middle">Select interface</text>
  <text x="165" y="118" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" text-anchor="middle">Apply capture filter</text>
  <text x="165" y="133" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" text-anchor="middle">NIC promiscuous mode</text>

  <line x1="270" y1="95" x2="310" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="310" y="50" width="210" height="90" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="415" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">2. Filter</text>
  <text x="415" y="100" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle">BPF capture filter</text>
  <text x="415" y="118" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle">Display filter (Wireshark)</text>
  <text x="415" y="133" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle">Reduce noise</text>

  <line x1="520" y1="95" x2="560" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="560" y="50" width="210" height="90" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="665" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">3. Protocol Decode</text>
  <text x="665" y="100" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)" text-anchor="middle">Layer 2-7 dissection</text>
  <text x="665" y="118" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)" text-anchor="middle">TCP streams, HTTP</text>
  <text x="665" y="133" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)" text-anchor="middle">DNS, TLS, gRPC...</text>

  <line x1="770" y1="95" x2="810" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="810" y="50" width="210" height="90" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="915" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">4. Analysis</text>
  <text x="915" y="100" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)" text-anchor="middle">Follow streams</text>
  <text x="915" y="118" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)" text-anchor="middle">I/O graphs, stats</text>
  <text x="915" y="133" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)" text-anchor="middle">Export artifacts</text>

  <!-- Step 5 -->
  <line x1="1020" y1="95" x2="1060" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1060" y="50" width="180" height="90" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1150" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">5. Report</text>
  <text x="1150" y="100" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" text-anchor="middle">Save .pcap file</text>
  <text x="1150" y="118" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" text-anchor="middle">Document findings</text>
  <text x="1150" y="133" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" text-anchor="middle">Evidence chain</text>

  <!-- == WIRESHARK vs TCPDUMP == -->
  <text x="60" y="174" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-muted)">Wireshark vs tcpdump</text>

  <!-- Wireshark -->
  <rect x="60" y="190" width="540" height="200" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="330" y="212" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Wireshark (GUI)</text>
  <text x="80" y="234" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Graphical protocol tree: see all fields at a glance</text>
  <text x="80" y="252" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; "Follow TCP/UDP stream" reconstructs full session</text>
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Statistics: I/O graphs, protocol hierarchy, conversations</text>
  <text x="80" y="288" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Coloring rules highlight anomalies automatically</text>
  <text x="80" y="306" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Decode as: force interpretation of port/protocol</text>
  <text x="80" y="324" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; TLS decryption with session keys (SSLKEYLOGFILE)</text>
  <text x="80" y="346" font-family="monospace" font-size="11" fill="var(--text-muted)">capture filter: tcp port 80 and host 10.0.0.1</text>
  <text x="80" y="362" font-family="monospace" font-size="11" fill="var(--text-muted)">display filter: http.request.method == "POST"</text>
  <text x="80" y="378" font-family="monospace" font-size="11" fill="var(--text-muted)">display filter: tcp.flags.syn==1 &amp;&amp; tcp.flags.ack==0</text>

  <!-- tcpdump -->
  <rect x="640" y="190" width="594" height="200" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="937" y="212" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">tcpdump (CLI)</text>
  <text x="660" y="234" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Lightweight CLI: ideal for remote/headless servers</text>
  <text x="660" y="252" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; BPF filters: fast in-kernel packet selection</text>
  <text x="660" y="270" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Write to .pcap: open later in Wireshark</text>
  <text x="660" y="288" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Script-friendly: pipe to awk/grep for automation</text>
  <text x="660" y="306" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Capture on production, analyze offline safely</text>
  <text x="660" y="346" font-family="monospace" font-size="11" fill="var(--text-muted)">tcpdump -i eth0 'tcp port 443' -w out.pcap</text>
  <text x="660" y="362" font-family="monospace" font-size="11" fill="var(--text-muted)">tcpdump -i any 'host 10.0.0.5 and port 80'</text>
  <text x="660" y="378" font-family="monospace" font-size="11" fill="var(--text-muted)">tcpdump -r out.pcap 'tcp[tcpflags] &amp; tcp-syn != 0'</text>

  <!-- == BPF FILTER SYNTAX == -->
  <text x="60" y="416" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">BPF Filter Syntax Reference</text>
  <rect x="60" y="432" width="740" height="188" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <text x="80" y="454" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text-muted)">Primitives:</text>
  <text x="80" y="474" font-family="monospace" font-size="12" fill="var(--text)">host 192.168.1.1          # src or dst host</text>
  <text x="80" y="492" font-family="monospace" font-size="12" fill="var(--text)">net 10.0.0.0/24           # network range</text>
  <text x="80" y="510" font-family="monospace" font-size="12" fill="var(--text)">port 80                   # TCP or UDP port</text>
  <text x="80" y="528" font-family="monospace" font-size="12" fill="var(--text)">tcp / udp / icmp           # protocol</text>

  <text x="400" y="454" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text-muted)">Operators:</text>
  <text x="400" y="474" font-family="monospace" font-size="12" fill="var(--text)">and / or / not            # boolean</text>
  <text x="400" y="492" font-family="monospace" font-size="12" fill="var(--text)">src host 10.0.0.1         # direction</text>
  <text x="400" y="510" font-family="monospace" font-size="12" fill="var(--text)">dst port 443              # destination</text>
  <text x="400" y="528" font-family="monospace" font-size="12" fill="var(--text)">greater 1000              # packet size</text>

  <text x="80" y="552" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text-muted)">Examples:</text>
  <text x="80" y="570" font-family="monospace" font-size="12" fill="var(--text)">tcp port 80 or tcp port 443</text>
  <text x="80" y="588" font-family="monospace" font-size="12" fill="var(--text)">host 10.0.0.1 and not port 22</text>
  <text x="80" y="606" font-family="monospace" font-size="12" fill="var(--text)">icmp and src net 192.168.0.0/16</text>

  <!-- == ANALYSIS USE CASES == -->
  <rect x="830" y="432" width="404" height="188" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1032" y="454" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Common Analysis Use Cases</text>
  <text x="850" y="476" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Debug connection resets (TCP RST)</text>
  <text x="850" y="496" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Measure RTT and identify latency sources</text>
  <text x="850" y="516" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Detect retransmissions and packet loss</text>
  <text x="850" y="536" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Verify TLS handshake and cipher suites</text>
  <text x="850" y="556" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Inspect HTTP headers and payloads</text>
  <text x="850" y="576" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Find unexpected outbound connections</text>
  <text x="850" y="596" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; DNS query/response analysis</text>
  <text x="850" y="616" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; ARP spoofing / MITM detection</text>
</svg>

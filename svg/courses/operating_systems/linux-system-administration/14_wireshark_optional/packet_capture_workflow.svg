<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- == CAPTURE WORKFLOW PIPELINE == -->
  <text x="40" y="40" font-family="Arial, sans-serif" font-size="18.058771" font-weight="bold" fill="var(--primary-accent)">Packet Capture Workflow</text>

  <!-- Step 1 -->
  <rect x="40" y="55.836177" width="213.559322" height="89.078498" rx="6.53065" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.779661" y="85.52901" font-family="Arial, sans-serif" font-size="14.045687" font-weight="bold" fill="var(--bg)" text-anchor="middle">1. Capture</text>
  <text x="146.779661" y="105.324232" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--primary-accent)" text-anchor="middle">Select interface</text>
  <text x="146.779661" y="123.139932" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--primary-accent)" text-anchor="middle">Apply capture filter</text>
  <text x="146.779661" y="137.986294" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--primary-accent)" text-anchor="middle">NIC promiscuous mode</text>

  <line x1="253.559322" y1="100.375481" x2="294.237288" y2="100.375481" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="294.237288" y="55.836177" width="213.559322" height="89.078498" rx="6.53065" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="401.016949" y="85.52901" font-family="Arial, sans-serif" font-size="14.045687" font-weight="bold" fill="var(--bg)" text-anchor="middle">2. Filter</text>
  <text x="401.016949" y="105.324232" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--ok-accent)" text-anchor="middle">BPF capture filter</text>
  <text x="401.016949" y="123.139932" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--ok-accent)" text-anchor="middle">Display filter (Wireshark)</text>
  <text x="401.016949" y="137.986294" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--ok-accent)" text-anchor="middle">Reduce noise</text>

  <line x1="507.79661" y1="100.375481" x2="548.474576" y2="100.375481" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="548.474576" y="55.836177" width="213.559322" height="89.078498" rx="6.53065" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655.254237" y="85.52901" font-family="Arial, sans-serif" font-size="14.045687" font-weight="bold" fill="var(--bg)" text-anchor="middle">3. Protocol Decode</text>
  <text x="655.254237" y="105.324232" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--warn-accent)" text-anchor="middle">Layer 2-7 dissection</text>
  <text x="655.254237" y="123.139932" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--warn-accent)" text-anchor="middle">TCP streams, HTTP</text>
  <text x="655.254237" y="137.986294" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--warn-accent)" text-anchor="middle">DNS, TLS, gRPC...</text>

  <line x1="762.033898" y1="100.375481" x2="802.711864" y2="100.375481" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="802.711864" y="55.836177" width="213.559322" height="89.078498" rx="6.53065" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="909.491525" y="85.52901" font-family="Arial, sans-serif" font-size="14.045687" font-weight="bold" fill="var(--bg)" text-anchor="middle">4. Analysis</text>
  <text x="909.491525" y="105.324232" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--info-accent)" text-anchor="middle">Follow streams</text>
  <text x="909.491525" y="123.139932" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--info-accent)" text-anchor="middle">I/O graphs, stats</text>
  <text x="909.491525" y="137.986294" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--info-accent)" text-anchor="middle">Export artifacts</text>

  <!-- Step 5 -->
  <line x1="1016.271186" y1="100.375481" x2="1056.949153" y2="100.375481" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1056.949153" y="55.836177" width="183.050847" height="89.078498" rx="6.53065" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1148.474576" y="85.52901" font-family="Arial, sans-serif" font-size="14.045687" font-weight="bold" fill="var(--bg)" text-anchor="middle">5. Report</text>
  <text x="1148.474576" y="105.324232" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--danger-accent)" text-anchor="middle">Save .pcap file</text>
  <text x="1148.474576" y="123.139932" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--danger-accent)" text-anchor="middle">Document findings</text>
  <text x="1148.474576" y="137.986294" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--danger-accent)" text-anchor="middle">Evidence chain</text>

  <!-- == WIRESHARK vs TCPDUMP == -->
  <text x="40" y="178.566553" font-family="Arial, sans-serif" font-size="16.052229" font-weight="bold" fill="var(--text-muted)">Wireshark vs tcpdump</text>

  <!-- Wireshark -->
  <rect x="40" y="194.40273" width="549.152542" height="197.952218" rx="6.53065" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.576271" y="216.177474" font-family="Arial, sans-serif" font-size="15.048903" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Wireshark (GUI)</text>
  <text x="60.338983" y="237.952218" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Graphical protocol tree: see all fields at a glance</text>
  <text x="60.338983" y="255.767918" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; "Follow TCP/UDP stream" reconstructs full session</text>
  <text x="60.338983" y="273.583618" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Statistics: I/O graphs, protocol hierarchy, conversations</text>
  <text x="60.338983" y="291.399317" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Coloring rules highlight anomalies automatically</text>
  <text x="60.338983" y="309.215017" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Decode as: force interpretation of port/protocol</text>
  <text x="60.338983" y="327.030717" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; TLS decryption with session keys (SSLKEYLOGFILE)</text>
  <text x="60.338983" y="348.805461" font-size="11.035928" fill="var(--text-muted)" font-family="Courier New, monospace">capture filter: tcp port 80 and host 10.0.0.1</text>
  <text x="60.338983" y="364.641638" font-size="11.035928" fill="var(--text-muted)" font-family="Courier New, monospace">display filter: http.request.method == "POST"</text>
  <text x="60.338983" y="380.477816" font-size="11.035928" fill="var(--text-muted)" font-family="Courier New, monospace">display filter: tcp.flags.syn==1 &amp;&amp; tcp.flags.ack==0</text>

  <!-- tcpdump -->
  <rect x="629.830508" y="194.40273" width="604.067797" height="197.952218" rx="6.53065" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="931.864407" y="216.177474" font-family="Arial, sans-serif" font-size="15.048903" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">tcpdump (CLI)</text>
  <text x="650.169492" y="237.952218" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Lightweight CLI: ideal for remote/headless servers</text>
  <text x="650.169492" y="255.767918" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; BPF filters: fast in-kernel packet selection</text>
  <text x="650.169492" y="273.583618" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Write to .pcap: open later in Wireshark</text>
  <text x="650.169492" y="291.399317" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Script-friendly: pipe to awk/grep for automation</text>
  <text x="650.169492" y="309.215017" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Capture on production, analyze offline safely</text>
  <text x="650.169492" y="348.805461" font-size="11.035928" fill="var(--text-muted)" font-family="Courier New, monospace">tcpdump -i eth0 'tcp port 443' -w out.pcap</text>
  <text x="650.169492" y="364.641638" font-size="11.035928" fill="var(--text-muted)" font-family="Courier New, monospace">tcpdump -i any 'host 10.0.0.5 and port 80'</text>
  <text x="650.169492" y="380.477816" font-size="11.035928" fill="var(--text-muted)" font-family="Courier New, monospace">tcpdump -r out.pcap 'tcp[tcpflags] &amp; tcp-syn != 0'</text>

  <!-- == BPF FILTER SYNTAX == -->
  <text x="40" y="418.088737" font-family="Arial, sans-serif" font-size="16.052229" font-weight="bold" fill="var(--primary-accent)">BPF Filter Syntax Reference</text>
  <rect x="40" y="433.924915" width="752.542373" height="186.075085" rx="6.53065" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <text x="60.338983" y="455.699659" font-family="Arial, sans-serif" font-size="13.04247" font-weight="bold" fill="var(--text-muted)">Primitives:</text>
  <text x="60.338983" y="475.494881" font-size="12.039144" fill="var(--text)" font-family="Courier New, monospace">host 192.168.1.1          # src or dst host</text>
  <text x="60.338983" y="493.31058" font-size="12.039144" fill="var(--text)" font-family="Courier New, monospace">net 10.0.0.0/24           # network range</text>
  <text x="60.338983" y="511.12628" font-size="12.039144" fill="var(--text)" font-family="Courier New, monospace">port 80                   # TCP or UDP port</text>
  <text x="60.338983" y="528.94198" font-size="12.039144" fill="var(--text)" font-family="Courier New, monospace">tcp / udp / icmp           # protocol</text>

  <text x="385.762712" y="455.699659" font-family="Arial, sans-serif" font-size="13.04247" font-weight="bold" fill="var(--text-muted)">Operators:</text>
  <text x="385.762712" y="475.494881" font-size="12.039144" fill="var(--text)" font-family="Courier New, monospace">and / or / not            # boolean</text>
  <text x="385.762712" y="493.31058" font-size="12.039144" fill="var(--text)" font-family="Courier New, monospace">src host 10.0.0.1         # direction</text>
  <text x="385.762712" y="511.12628" font-size="12.039144" fill="var(--text)" font-family="Courier New, monospace">dst port 443              # destination</text>
  <text x="385.762712" y="528.94198" font-size="12.039144" fill="var(--text)" font-family="Courier New, monospace">greater 1000              # packet size</text>

  <text x="60.338983" y="552.696246" font-family="Arial, sans-serif" font-size="13.04247" font-weight="bold" fill="var(--text-muted)">Examples:</text>
  <text x="60.338983" y="570.511945" font-size="12.039144" fill="var(--text)" font-family="Courier New, monospace">tcp port 80 or tcp port 443</text>
  <text x="60.338983" y="588.327645" font-size="12.039144" fill="var(--text)" font-family="Courier New, monospace">host 10.0.0.1 and not port 22</text>
  <text x="60.338983" y="606.143345" font-size="12.039144" fill="var(--text)" font-family="Courier New, monospace">icmp and src net 192.168.0.0/16</text>

  <!-- == ANALYSIS USE CASES == -->
  <rect x="823.050847" y="433.924915" width="410.847458" height="186.075085" rx="6.53065" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1028.474576" y="455.699659" font-family="Arial, sans-serif" font-size="14.045687" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Common Analysis Use Cases</text>
  <text x="843.389831" y="477.474403" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Debug connection resets (TCP RST)</text>
  <text x="843.389831" y="497.269625" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Measure RTT and identify latency sources</text>
  <text x="843.389831" y="517.064846" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Detect retransmissions and packet loss</text>
  <text x="843.389831" y="536.860068" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Verify TLS handshake and cipher suites</text>
  <text x="843.389831" y="556.65529" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Inspect HTTP headers and payloads</text>
  <text x="843.389831" y="576.450512" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; Find unexpected outbound connections</text>
  <text x="843.389831" y="596.245734" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; DNS query/response analysis</text>
  <text x="843.389831" y="616.040956" font-family="Arial, sans-serif" font-size="12.039144" fill="var(--text)">&#x2022; ARP spoofing / MITM detection</text>
</svg>

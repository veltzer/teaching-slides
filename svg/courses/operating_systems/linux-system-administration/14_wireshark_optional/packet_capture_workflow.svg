<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.699676538728" font-weight="bold" fill="var(--primary-accent)">Packet Capture Workflow</text>

  <!-- Pipeline -->
  <rect x="40" y="92.727272727273" width="215" height="94.909090909091" rx="10.269106361049" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147" y="129.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--primary-text)">1. Capture</text>
  <text x="147" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--primary-text)">Pick NIC</text>
  <text x="147" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--primary-text)">Promisc mode</text>

  <line x1="255" y1="140.181818181818" x2="285" y2="140.181818181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="285" y="92.727272727273" width="200" height="94.909090909091" rx="10.269106361049" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385" y="129.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--ok-text)">2. Filter</text>
  <text x="385" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--ok-text)">BPF filter</text>
  <text x="385" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--ok-text)">Display filter</text>

  <line x1="485" y1="140.181818181818" x2="515" y2="140.181818181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="515" y="92.727272727273" width="200" height="94.909090909091" rx="10.269106361049" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="129.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--warn-text)">3. Decode</text>
  <text x="615" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--warn-text)">L2 to L7 dissect</text>
  <text x="615" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--warn-text)">TCP / HTTP / TLS</text>

  <line x1="715" y1="140.181818181818" x2="745" y2="140.181818181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="745" y="92.727272727273" width="200" height="94.909090909091" rx="10.269106361049" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845" y="129.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--info-text)">4. Analyze</text>
  <text x="845" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--info-text)">Follow streams</text>
  <text x="845" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--info-text)">I/O graphs</text>

  <line x1="945" y1="140.181818181818" x2="975" y2="140.181818181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="975" y="92.727272727273" width="265" height="94.909090909091" rx="10.269106361049" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1107" y="129.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--danger-text)">5. Report</text>
  <text x="1107" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--danger-text)">Save .pcap</text>
  <text x="1107" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--danger-text)">Evidence chain</text>

  <!-- Tools comparison -->
  <rect x="40" y="219.272727272727" width="590" height="189.818181818182" rx="10.269106361049" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="256.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--primary-text)">Wireshark (GUI)</text>
  <text x="60" y="293.090909090909" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--primary-text)">Protocol tree</text>
  <text x="60" y="324.727272727273" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--primary-text)">Follow stream</text>
  <text x="60" y="356.363636363636" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--primary-text)">I/O graphs</text>
  <text x="60" y="388" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--primary-text)">TLS decrypt</text>

  <rect x="650" y="219.272727272727" width="590" height="189.818181818182" rx="10.269106361049" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="256.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--ok-text)">tcpdump (CLI)</text>
  <text x="670" y="293.090909090909" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--ok-text)">Headless / remote</text>
  <text x="670" y="324.727272727273" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--ok-text)">Kernel BPF</text>
  <text x="670" y="356.363636363636" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--ok-text)">Writes .pcap</text>
  <text x="670" y="388" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--ok-text)">Script-friendly</text>

  <!-- BPF syntax -->
  <rect x="40" y="440.727272727273" width="1200" height="179.272727272727" rx="10.269106361049" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="477.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--text)">BPF Filter Syntax</text>
  <text x="60" y="514.545454545455" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text)">host 10.0.0.1</text>
  <text x="60" y="546.181818181818" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text)">net 10.0.0.0/24</text>
  <text x="60" y="577.818181818182" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text)">port 443</text>
  <text x="60" y="609.454545454545" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text)">tcp udp icmp</text>
  <text x="460" y="514.545454545455" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text)">src / dst X</text>
  <text x="460" y="546.181818181818" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text)">and / or / not</text>
  <text x="460" y="577.818181818182" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text)">greater N</text>
  <text x="460" y="609.454545454545" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text-muted)">tcpdump -w out.pcap</text>
  <text x="850" y="514.545454545455" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text)">tcp port 443</text>
  <text x="850" y="546.181818181818" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text)">host X and not 22</text>
  <text x="850" y="577.818181818182" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text)">icmp and src Y</text>
  <text x="850" y="609.454545454545" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text-muted)">combine with boolean</text>
</svg>

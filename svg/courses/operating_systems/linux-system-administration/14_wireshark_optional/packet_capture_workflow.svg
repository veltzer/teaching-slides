<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- == CAPTURE WORKFLOW PIPELINE == -->
  <text x="60" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Packet Capture Workflow</text>

  <!-- Step 1 -->
  <rect x="60" y="50" width="210" height="90" rx="10" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="165" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">1. Capture</text>
  <text x="165" y="100" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-lt)" text-anchor="middle">Select interface</text>
  <text x="165" y="118" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-lt)" text-anchor="middle">Apply capture filter</text>
  <text x="165" y="133" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-lt)" text-anchor="middle">NIC promiscuous mode</text>

  <line x1="270" y1="95" x2="310" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="310" y="50" width="210" height="90" rx="10" fill="var(--ok)" filter="url(#shadow)"/>
  <text x="415" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">2. Filter</text>
  <text x="415" y="100" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-lt)" text-anchor="middle">BPF capture filter</text>
  <text x="415" y="118" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-lt)" text-anchor="middle">Display filter (Wireshark)</text>
  <text x="415" y="133" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-lt)" text-anchor="middle">Reduce noise</text>

  <line x1="520" y1="95" x2="560" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="560" y="50" width="210" height="90" rx="10" fill="var(--warn)" filter="url(#shadow)"/>
  <text x="665" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">3. Protocol Decode</text>
  <text x="665" y="100" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-pale)" text-anchor="middle">Layer 2-7 dissection</text>
  <text x="665" y="118" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-pale)" text-anchor="middle">TCP streams, HTTP</text>
  <text x="665" y="133" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-pale)" text-anchor="middle">DNS, TLS, gRPC...</text>

  <line x1="770" y1="95" x2="810" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="810" y="50" width="210" height="90" rx="10" fill="var(--info)" filter="url(#shadow)"/>
  <text x="915" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">4. Analysis</text>
  <text x="915" y="100" font-family="Arial, sans-serif" font-size="12" fill="var(--info-tint)" text-anchor="middle">Follow streams</text>
  <text x="915" y="118" font-family="Arial, sans-serif" font-size="12" fill="var(--info-tint)" text-anchor="middle">I/O graphs, stats</text>
  <text x="915" y="133" font-family="Arial, sans-serif" font-size="12" fill="var(--info-tint)" text-anchor="middle">Export artifacts</text>

  <!-- Step 5 -->
  <line x1="1020" y1="95" x2="1060" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1060" y="50" width="180" height="90" rx="10" fill="var(--danger)" filter="url(#shadow)"/>
  <text x="1150" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">5. Report</text>
  <text x="1150" y="100" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-lt)" text-anchor="middle">Save .pcap file</text>
  <text x="1150" y="118" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-lt)" text-anchor="middle">Document findings</text>
  <text x="1150" y="133" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-lt)" text-anchor="middle">Evidence chain</text>

  <!-- == WIRESHARK vs TCPDUMP == -->
  <text x="60" y="174" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-muted)">Wireshark vs tcpdump</text>

  <!-- Wireshark -->
  <rect x="60" y="190" width="540" height="200" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="330" y="212" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Wireshark (GUI)</text>
  <text x="80" y="234" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Graphical protocol tree: see all fields at a glance</text>
  <text x="80" y="252" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; "Follow TCP/UDP stream" reconstructs full session</text>
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Statistics: I/O graphs, protocol hierarchy, conversations</text>
  <text x="80" y="288" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Coloring rules highlight anomalies automatically</text>
  <text x="80" y="306" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Decode as: force interpretation of port/protocol</text>
  <text x="80" y="324" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; TLS decryption with session keys (SSLKEYLOGFILE)</text>
  <text x="80" y="346" font-family="monospace" font-size="11" fill="var(--text-muted)">capture filter: tcp port 80 and host 10.0.0.1</text>
  <text x="80" y="362" font-family="monospace" font-size="11" fill="var(--text-muted)">display filter: http.request.method == "POST"</text>
  <text x="80" y="378" font-family="monospace" font-size="11" fill="var(--text-muted)">display filter: tcp.flags.syn==1 &amp;&amp; tcp.flags.ack==0</text>

  <!-- tcpdump -->
  <rect x="640" y="190" width="594" height="200" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="937" y="212" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">tcpdump (CLI)</text>
  <text x="660" y="234" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Lightweight CLI: ideal for remote/headless servers</text>
  <text x="660" y="252" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; BPF filters: fast in-kernel packet selection</text>
  <text x="660" y="270" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Write to .pcap: open later in Wireshark</text>
  <text x="660" y="288" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Script-friendly: pipe to awk/grep for automation</text>
  <text x="660" y="306" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Capture on production, analyze offline safely</text>
  <text x="660" y="346" font-family="monospace" font-size="11" fill="var(--text-muted)">tcpdump -i eth0 'tcp port 443' -w out.pcap</text>
  <text x="660" y="362" font-family="monospace" font-size="11" fill="var(--text-muted)">tcpdump -i any 'host 10.0.0.5 and port 80'</text>
  <text x="660" y="378" font-family="monospace" font-size="11" fill="var(--text-muted)">tcpdump -r out.pcap 'tcp[tcpflags] &amp; tcp-syn != 0'</text>

  <!-- == BPF FILTER SYNTAX == -->
  <text x="60" y="416" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)">BPF Filter Syntax Reference</text>
  <rect x="60" y="432" width="740" height="188" rx="8" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="1"/>

  <text x="80" y="454" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text-muted)">Primitives:</text>
  <text x="80" y="474" font-family="monospace" font-size="12" fill="var(--text-dark)">host 192.168.1.1          # src or dst host</text>
  <text x="80" y="492" font-family="monospace" font-size="12" fill="var(--text-dark)">net 10.0.0.0/24           # network range</text>
  <text x="80" y="510" font-family="monospace" font-size="12" fill="var(--text-dark)">port 80                   # TCP or UDP port</text>
  <text x="80" y="528" font-family="monospace" font-size="12" fill="var(--text-dark)">tcp / udp / icmp           # protocol</text>

  <text x="400" y="454" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text-muted)">Operators:</text>
  <text x="400" y="474" font-family="monospace" font-size="12" fill="var(--text-dark)">and / or / not            # boolean</text>
  <text x="400" y="492" font-family="monospace" font-size="12" fill="var(--text-dark)">src host 10.0.0.1         # direction</text>
  <text x="400" y="510" font-family="monospace" font-size="12" fill="var(--text-dark)">dst port 443              # destination</text>
  <text x="400" y="528" font-family="monospace" font-size="12" fill="var(--text-dark)">greater 1000              # packet size</text>

  <text x="80" y="552" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text-muted)">Examples:</text>
  <text x="80" y="570" font-family="monospace" font-size="12" fill="var(--text-dark)">tcp port 80 or tcp port 443</text>
  <text x="80" y="588" font-family="monospace" font-size="12" fill="var(--text-dark)">host 10.0.0.1 and not port 22</text>
  <text x="80" y="606" font-family="monospace" font-size="12" fill="var(--text-dark)">icmp and src net 192.168.0.0/16</text>

  <!-- == ANALYSIS USE CASES == -->
  <rect x="830" y="432" width="404" height="188" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="1032" y="454" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-mid)" text-anchor="middle">Common Analysis Use Cases</text>
  <text x="850" y="476" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Debug connection resets (TCP RST)</text>
  <text x="850" y="496" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Measure RTT and identify latency sources</text>
  <text x="850" y="516" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Detect retransmissions and packet loss</text>
  <text x="850" y="536" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Verify TLS handshake and cipher suites</text>
  <text x="850" y="556" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Inspect HTTP headers and payloads</text>
  <text x="850" y="576" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Find unexpected outbound connections</text>
  <text x="850" y="596" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; DNS query/response analysis</text>
  <text x="850" y="616" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; ARP spoofing / MITM detection</text>
</svg>

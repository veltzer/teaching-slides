<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="213.3333" width="302.2222" height="177.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="17.7778" y="213.3333" width="302.2222" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="17.7778" y="248.8889" width="302.2222" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="168.8889" y="241.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Internet-Connected</text>
  <text x="168.8889" y="297.7778" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Staging System</text>
  <text x="168.8889" y="324.4444" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">Download packages</text>
  <text x="168.8889" y="346.6667" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">Verify signatures</text>
  <text x="168.8889" y="368.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">Prepare media</text>
  <line x1="320" y1="302.2222" x2="398.2222" y2="302.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="400" y="151.1111" width="213.3333" height="320" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="400" y="151.1111" width="213.3333" height="44.4444" fill="var(--danger-accent)" rx="6" />
  <rect x="400" y="186.6667" width="213.3333" height="8.8889" fill="var(--danger-accent)" rx="6"/>
  <text x="506.6667" y="179.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Transfer Station</text>
  <text x="506.6667" y="240" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">USB / Diode</text>
  <text x="506.6667" y="266.6667" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">Malware scan</text>
  <text x="506.6667" y="288.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">Hash verify</text>
  <text x="506.6667" y="311.1111" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">Audit logged</text>
  <line x1="382.2222" y1="231.1111" x2="382.2222" y2="373.3333" stroke="var(--danger-border)" stroke-width="2" stroke-linecap="round" />
  <line x1="392.8889" y1="231.1111" x2="392.8889" y2="373.3333" stroke="var(--danger-border)" stroke-width="2" stroke-linecap="round" />
  <line x1="613.3333" y1="302.2222" x2="691.5556" y2="302.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="693.3333" y="213.3333" width="302.2222" height="177.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="693.3333" y="213.3333" width="302.2222" height="44.4444" fill="var(--ok-accent)" rx="6" />
  <rect x="693.3333" y="248.8889" width="302.2222" height="8.8889" fill="var(--ok-accent)" rx="6"/>
  <text x="844.4444" y="241.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Air-Gapped</text>
  <text x="844.4444" y="297.7778" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Production Systems</text>
  <text x="844.4444" y="324.4444" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">No internet access</text>
  <text x="844.4444" y="346.6667" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">Local repo server</text>
  <text x="844.4444" y="368.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">Classified/OT network</text>
</svg>
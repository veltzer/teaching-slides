<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="152.777801" width="370.909091" height="322.222201" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.153241" />
  <rect x="40" y="152.777801" width="370.909091" height="80.555399" fill="url(#grad-primary)" rx="9.153241" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="217.222401" width="370.909091" height="16.1112" fill="url(#grad-primary)" rx="9.153241" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.454545" y="204.3334" text-anchor="middle" font-size="23.863262" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Internet-Connected</text>
  <text x="225.454545" y="305.833401" text-anchor="middle" font-size="19.886025" fill="var(--text)" font-family="Arial, sans-serif">Staging System</text>
  <text x="225.454545" y="354.1666" text-anchor="middle" font-size="18.560179" fill="var(--text-muted)" font-family="Arial, sans-serif">Download packages</text>
  <text x="225.454545" y="394.444601" text-anchor="middle" font-size="18.560179" fill="var(--text-muted)" font-family="Arial, sans-serif">Verify signatures</text>
  <text x="225.454545" y="434.7224" text-anchor="middle" font-size="18.560179" fill="var(--text-muted)" font-family="Arial, sans-serif">Prepare media</text>
  <line x1="410.909091" y1="313.889" x2="506.909091" y2="313.889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="509.090909" y="40" width="261.818182" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.153241" />
  <rect x="509.090909" y="40" width="261.818182" height="80.555399" fill="var(--danger-accent)" rx="9.153241" />
  <rect x="509.090909" y="104.4446" width="261.818182" height="16.1112" fill="var(--danger-accent)" rx="9.153241"/>
  <text x="640" y="91.5558" text-anchor="middle" font-size="23.863262" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Transfer Station</text>
  <text x="640" y="201.111201" text-anchor="middle" font-size="19.886025" fill="var(--text)" font-family="Arial, sans-serif">USB / Diode</text>
  <text x="640" y="249.444601" text-anchor="middle" font-size="18.560179" fill="var(--text-muted)" font-family="Arial, sans-serif">Malware scan</text>
  <text x="640" y="289.722401" text-anchor="middle" font-size="18.560179" fill="var(--text-muted)" font-family="Arial, sans-serif">Hash verify</text>
  <text x="640" y="330.000001" text-anchor="middle" font-size="18.560179" fill="var(--text-muted)" font-family="Arial, sans-serif">Audit logged</text>
  <line x1="487.272727" y1="185.000001" x2="487.272727" y2="442.777802" stroke="var(--danger-border)" stroke-width="2" stroke-linecap="round" />
  <line x1="500.363636" y1="185.000001" x2="500.363636" y2="442.777802" stroke="var(--danger-border)" stroke-width="2" stroke-linecap="round" />
  <line x1="770.909091" y1="313.889" x2="866.909091" y2="313.889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="869.090909" y="152.777801" width="370.909091" height="322.222201" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.153241" />
  <rect x="869.090909" y="152.777801" width="370.909091" height="80.555399" fill="var(--ok-accent)" rx="9.153241" />
  <rect x="869.090909" y="217.222401" width="370.909091" height="16.1112" fill="var(--ok-accent)" rx="9.153241"/>
  <text x="1054.545338" y="204.3334" text-anchor="middle" font-size="23.863262" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Air-Gapped</text>
  <text x="1054.545338" y="305.833401" text-anchor="middle" font-size="19.886025" fill="var(--text)" font-family="Arial, sans-serif">Production Systems</text>
  <text x="1054.545338" y="354.1666" text-anchor="middle" font-size="18.560179" fill="var(--text-muted)" font-family="Arial, sans-serif">No internet access</text>
  <text x="1054.545338" y="394.444601" text-anchor="middle" font-size="18.560179" fill="var(--text-muted)" font-family="Arial, sans-serif">Local repo server</text>
  <text x="1054.545338" y="434.7224" text-anchor="middle" font-size="18.560179" fill="var(--text-muted)" font-family="Arial, sans-serif">Classified/OT network</text>
</svg>
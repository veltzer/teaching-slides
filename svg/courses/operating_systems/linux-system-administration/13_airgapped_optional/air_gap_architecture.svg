<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Internet-Connected Staging -->
  <rect x="20" y="240" width="340" height="200" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="20" y="240" width="340" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="20" y="280" width="340" height="10" fill="url(#grad-accent)"/>
  <text x="190" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Internet-Connected</text>
  <text x="190" y="335" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Staging System</text>
  <text x="190" y="365" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Download packages</text>
  <text x="190" y="390" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Verify signatures</text>
  <text x="190" y="415" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Prepare media</text>

  <!-- Arrow -->
  <line x1="360" y1="340" x2="448" y2="340" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Transfer Station -->
  <rect x="450" y="170" width="240" height="360" fill="url(#grad-surface)" stroke="#c62828" stroke-width="2.5" rx="12" filter="url(#shadow)"/>
  <rect x="450" y="170" width="240" height="50" fill="#c62828" rx="12"/>
  <rect x="450" y="210" width="240" height="10" fill="#c62828"/>
  <text x="570" y="202" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Transfer Station</text>
  <text x="570" y="270" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">USB / Diode</text>
  <text x="570" y="300" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Malware scan</text>
  <text x="570" y="325" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Hash verify</text>
  <text x="570" y="350" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Audit logged</text>
  <!-- Air gap indicator (two red lines) -->
  <line x1="430" y1="260" x2="430" y2="420" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>
  <line x1="442" y1="260" x2="442" y2="420" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>

  <!-- Arrow -->
  <line x1="690" y1="340" x2="778" y2="340" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Air-Gapped Production -->
  <rect x="780" y="240" width="340" height="200" fill="url(#grad-surface)" stroke="#2e7d32" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="780" y="240" width="340" height="50" fill="#2e7d32" rx="12"/>
  <rect x="780" y="280" width="340" height="10" fill="#2e7d32"/>
  <text x="950" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Air-Gapped</text>
  <text x="950" y="335" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Production Systems</text>
  <text x="950" y="365" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">No internet access</text>
  <text x="950" y="390" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Local repo server</text>
  <text x="950" y="415" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Classified/OT network</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="358.064516" height="266.984114" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.516905" filter="url(#shadow)" />
  <rect x="40" y="40" width="358.064516" height="50.634971" fill="var(--primary-fill)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="81.428571" width="358.064516" height="9.2064" fill="var(--primary-fill)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="219.032258" y="72.222171" text-anchor="middle" font-size="16.990113" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Internet Zone</text>
  <text x="219.032258" y="136.666629" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="sans-serif">Download station</text>
  <text x="219.032258" y="164.285714" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="sans-serif">Patch staging</text>
  <text x="219.032258" y="191.904686" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="sans-serif">CVE monitoring</text>
  <text x="219.032258" y="228.730171" text-anchor="middle" font-size="12.27068" fill="var(--text-muted)" font-family="sans-serif">Connected to internet</text>
  <text x="219.032258" y="279.365029" text-anchor="middle" font-size="12.27068" fill="var(--text-muted)" font-family="sans-serif">Highest risk zone</text>
  <line x1="398.064516" y1="178.0952" x2="473.548387" y2="178.0952" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="475.483871" y="40" width="329.032258" height="266.984114" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.516905" filter="url(#shadow)" />
  <rect x="475.483871" y="40" width="329.032258" height="50.634971" fill="var(--warn-accent)" rx="6.516905" />
  <rect x="475.483871" y="81.428571" width="329.032258" height="9.2064" fill="var(--warn-accent)" rx="6.516905"/>
  <text x="640" y="72.222171" text-anchor="middle" font-size="16.990113" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Transfer Zone</text>
  <text x="640" y="136.666629" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="sans-serif">Data diode / Kiosk</text>
  <text x="640" y="164.285714" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="sans-serif">Malware scanning</text>
  <text x="640" y="191.904686" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="sans-serif">Integrity checks</text>
  <text x="640" y="228.730171" text-anchor="middle" font-size="12.27068" fill="var(--text-muted)" font-family="sans-serif">One-way data flow</text>
  <text x="640" y="279.365029" text-anchor="middle" font-size="12.27068" fill="var(--text-muted)" font-family="sans-serif">Isolation enforced</text>
  <line x1="804.516129" y1="178.0952" x2="879.999897" y2="178.0952" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="881.935484" y="40" width="358.064516" height="266.984114" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.516905" filter="url(#shadow)" />
  <rect x="881.935484" y="40" width="358.064516" height="50.634971" fill="var(--ok-accent)" rx="6.516905" />
  <rect x="881.935484" y="81.428571" width="358.064516" height="9.2064" fill="var(--ok-accent)" rx="6.516905"/>
  <text x="1060.967742" y="72.222171" text-anchor="middle" font-size="16.990113" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Secure Zone</text>
  <text x="1060.967742" y="136.666629" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="sans-serif">Local repo server</text>
  <text x="1060.967742" y="164.285714" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="sans-serif">Configuration mgmt</text>
  <text x="1060.967742" y="191.904686" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="sans-serif">Production systems</text>
  <text x="1060.967742" y="228.730171" text-anchor="middle" font-size="12.27068" fill="var(--text-muted)" font-family="sans-serif">No internet access</text>
  <text x="1060.967742" y="279.365029" text-anchor="middle" font-size="12.27068" fill="var(--text-muted)" font-family="sans-serif">Classified network</text>
  <rect x="40" y="371.428571" width="1200" height="248.571429" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.516905" filter="url(#shadow)" />
  <rect x="40" y="371.428571" width="1200" height="46.031657" fill="var(--primary-fill)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="408.253943" width="1200" height="9.2064" fill="var(--primary-fill)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="400.8888" text-anchor="middle" font-size="16.990113" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Key Design Principles</text>
  <text x="640" y="463.492114" text-anchor="middle" font-size="15.102275" fill="var(--text)" font-family="sans-serif">One-way data flow only | No bidirectional network links</text>
  <text x="640" y="495.714286" text-anchor="middle" font-size="15.102275" fill="var(--text)" font-family="sans-serif">All transfers logged and audited | Media sanitized after use</text>
  <text x="640" y="537.142857" text-anchor="middle" font-size="14.15841" fill="var(--text-muted)" font-family="sans-serif">Physical separation enforced | No wireless in secure zone</text>
  <text x="640" y="573.968229" text-anchor="middle" font-size="14.15841" fill="var(--text-muted)" font-family="sans-serif">Strict access control | Camera-monitored transfer stations</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="64.1667" width="346.875" height="233.6111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="64.1667" width="346.875" height="44.3056" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="100.4167" width="346.875" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="232.1875" y="92.3611" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Internet Zone</text>
  <text x="232.1875" y="148.75" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Download station</text>
  <text x="232.1875" y="172.9167" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Patch staging</text>
  <text x="232.1875" y="197.0833" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">CVE monitoring</text>
  <text x="232.1875" y="229.3056" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Connected to internet</text>
  <text x="232.1875" y="273.6111" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Highest risk zone</text>
  <line x1="405.625" y1="185" x2="478.75" y2="185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="480.625" y="64.1667" width="318.75" height="233.6111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="480.625" y="64.1667" width="318.75" height="44.3056" fill="var(--warn-accent)" rx="6" />
  <rect x="480.625" y="100.4167" width="318.75" height="8.0556" fill="var(--warn-accent)" rx="6"/>
  <text x="640" y="92.3611" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Transfer Zone</text>
  <text x="640" y="148.75" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Data diode / Kiosk</text>
  <text x="640" y="172.9167" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Malware scanning</text>
  <text x="640" y="197.0833" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Integrity checks</text>
  <text x="640" y="229.3056" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">One-way data flow</text>
  <text x="640" y="273.6111" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Isolation enforced</text>
  <line x1="799.375" y1="185" x2="872.4999" y2="185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="874.375" y="64.1667" width="346.875" height="233.6111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="874.375" y="64.1667" width="346.875" height="44.3056" fill="var(--ok-accent)" rx="6" />
  <rect x="874.375" y="100.4167" width="346.875" height="8.0556" fill="var(--ok-accent)" rx="6"/>
  <text x="1047.8125" y="92.3611" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Secure Zone</text>
  <text x="1047.8125" y="148.75" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Local repo server</text>
  <text x="1047.8125" y="172.9167" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Configuration mgmt</text>
  <text x="1047.8125" y="197.0833" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Production systems</text>
  <text x="1047.8125" y="229.3056" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">No internet access</text>
  <text x="1047.8125" y="273.6111" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Classified network</text>
  <rect x="58.75" y="354.1667" width="1162.5" height="217.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="354.1667" width="1162.5" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="386.3889" width="1162.5" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="379.9444" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Key Design Principles</text>
  <text x="640" y="434.7223" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">One-way data flow only | No bidirectional network links</text>
  <text x="640" y="462.9167" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">All transfers logged and audited | Media sanitized after use</text>
  <text x="640" y="499.1667" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Physical separation enforced | No wireless in secure zone</text>
  <text x="640" y="531.3889" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Strict access control | Camera-monitored transfer stations</text>
</svg>
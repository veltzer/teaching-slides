<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="26.6667" width="328.8889" height="257.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="17.7778" y="26.6667" width="328.8889" height="48.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="17.7778" y="66.6667" width="328.8889" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="182.2222" y="57.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Internet Zone</text>
  <text x="182.2222" y="120" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Download station</text>
  <text x="182.2222" y="146.6667" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Patch staging</text>
  <text x="182.2222" y="173.3333" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">CVE monitoring</text>
  <text x="182.2222" y="208.8889" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Connected to internet</text>
  <text x="182.2222" y="257.7778" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Highest risk zone</text>
  <line x1="346.6667" y1="160" x2="416" y2="160" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="417.7778" y="26.6667" width="302.2222" height="257.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="417.7778" y="26.6667" width="302.2222" height="48.8889" fill="var(--warn-accent)" rx="6" />
  <rect x="417.7778" y="66.6667" width="302.2222" height="8.8889" fill="var(--warn-accent)" rx="6"/>
  <text x="568.8889" y="57.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Transfer Zone</text>
  <text x="568.8889" y="120" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Data diode / Kiosk</text>
  <text x="568.8889" y="146.6667" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Malware scanning</text>
  <text x="568.8889" y="173.3333" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Integrity checks</text>
  <text x="568.8889" y="208.8889" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">One-way data flow</text>
  <text x="568.8889" y="257.7778" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Isolation enforced</text>
  <line x1="720" y1="160" x2="789.3333" y2="160" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="791.1111" y="26.6667" width="328.8889" height="257.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="791.1111" y="26.6667" width="328.8889" height="48.8889" fill="var(--ok-accent)" rx="6" />
  <rect x="791.1111" y="66.6667" width="328.8889" height="8.8889" fill="var(--ok-accent)" rx="6"/>
  <text x="955.5556" y="57.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Secure Zone</text>
  <text x="955.5556" y="120" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Local repo server</text>
  <text x="955.5556" y="146.6667" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Configuration mgmt</text>
  <text x="955.5556" y="173.3333" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Production systems</text>
  <text x="955.5556" y="208.8889" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">No internet access</text>
  <text x="955.5556" y="257.7778" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Classified network</text>
  <rect x="17.7778" y="346.6667" width="1102.2222" height="240" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="17.7778" y="346.6667" width="1102.2222" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="17.7778" y="382.2222" width="1102.2222" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="375.1111" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Key Design Principles</text>
  <text x="568.8889" y="435.5556" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="sans-serif">One-way data flow only | No bidirectional network links</text>
  <text x="568.8889" y="466.6667" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="sans-serif">All transfers logged and audited | Media sanitized after use</text>
  <text x="568.8889" y="506.6667" text-anchor="middle" font-size="13.3333" fill="var(--text-muted)" font-family="sans-serif">Physical separation enforced | No wireless in secure zone</text>
  <text x="568.8889" y="542.2222" text-anchor="middle" font-size="13.3333" fill="var(--text-muted)" font-family="sans-serif">Strict access control | Camera-monitored transfer stations</text>
</svg>
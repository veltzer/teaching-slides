  <ns0:text x="568.8889" y="375.1111" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" font-family="sans-serif">Key Design Principles</ns0:text>
  <ns0:text x="568.8889" y="435.5556" text-anchor="middle" font-size="14.2222" fill="#333333" font-family="sans-serif">One-way data flow only | No bidirectional network links</ns0:text>
  <ns0:text x="568.8889" y="466.6667" text-anchor="middle" font-size="14.2222" fill="#333333" font-family="sans-serif">All transfers logged and audited | Media sanitized after use</ns0:text>
  <ns0:text x="568.8889" y="506.6667" text-anchor="middle" font-size="13.3333" fill="#555555" font-family="sans-serif">Physical separation enforced | No wireless in secure zone</ns0:text>
  <ns0:text x="568.8889" y="542.2222" text-anchor="middle" font-size="13.3333" fill="#555555" font-family="sans-serif">Strict access control | Camera-monitored transfer stations</ns0:text>

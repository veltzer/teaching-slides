  <ns0:text x="568.8889" y="208.8889" text-anchor="middle" font-size="11.5556" fill="#555555" font-family="sans-serif">One-way data flow</ns0:text>
  <ns0:text x="568.8889" y="257.7778" text-anchor="middle" font-size="11.5556" fill="#555555" font-family="sans-serif">Isolation enforced</ns0:text>
  <ns0:line x1="720" y1="160" x2="789.3333" y2="160" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-primary)" />

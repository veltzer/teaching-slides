<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="358.064516" height="266.984114" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.516905"/>
  <rect x="40" y="40" width="358.064516" height="50.634971" fill="url(#grad-primary)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="81.428571" width="358.064516" height="9.2064" fill="url(#grad-primary)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.032258" y="72.222171" text-anchor="middle" font-size="16.990113" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Internet Zone</text>
  <text x="219.032258" y="136.666629" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="Arial, sans-serif">Download station</text>
  <text x="219.032258" y="164.285714" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="Arial, sans-serif">Patch staging</text>
  <text x="219.032258" y="191.904686" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="Arial, sans-serif">CVE monitoring</text>
  <text x="219.032258" y="228.730171" text-anchor="middle" font-size="12.27068" fill="var(--text-muted)" font-family="Arial, sans-serif">Connected to internet</text>
  <text x="219.032258" y="279.365029" text-anchor="middle" font-size="12.27068" fill="var(--text-muted)" font-family="Arial, sans-serif">Highest risk zone</text>
  <line x1="398.064516" y1="178.0952" x2="473.548387" y2="178.0952" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="475.483871" y="40" width="329.032258" height="266.984114" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.516905"/>
  <rect x="475.483871" y="40" width="329.032258" height="50.634971" fill="var(--warn-accent)" rx="6.516905"/>
  <rect x="475.483871" y="81.428571" width="329.032258" height="9.2064" fill="var(--warn-accent)" rx="6.516905"/>
  <text x="640" y="72.222171" text-anchor="middle" font-size="16.990113" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Transfer Zone</text>
  <text x="640" y="136.666629" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="Arial, sans-serif">Data diode / Kiosk</text>
  <text x="640" y="164.285714" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="Arial, sans-serif">Malware scanning</text>
  <text x="640" y="191.904686" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="Arial, sans-serif">Integrity checks</text>
  <text x="640" y="228.730171" text-anchor="middle" font-size="12.27068" fill="var(--text-muted)" font-family="Arial, sans-serif">One-way data flow</text>
  <text x="640" y="279.365029" text-anchor="middle" font-size="12.27068" fill="var(--text-muted)" font-family="Arial, sans-serif">Isolation enforced</text>
  <line x1="804.516129" y1="178.0952" x2="879.999897" y2="178.0952" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="881.935484" y="40" width="358.064516" height="266.984114" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.516905"/>
  <rect x="881.935484" y="40" width="358.064516" height="50.634971" fill="var(--ok-accent)" rx="6.516905"/>
  <rect x="881.935484" y="81.428571" width="358.064516" height="9.2064" fill="var(--ok-accent)" rx="6.516905"/>
  <text x="1060.967742" y="72.222171" text-anchor="middle" font-size="16.990113" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Secure Zone</text>
  <text x="1060.967742" y="136.666629" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="Arial, sans-serif">Local repo server</text>
  <text x="1060.967742" y="164.285714" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="Arial, sans-serif">Configuration mgmt</text>
  <text x="1060.967742" y="191.904686" text-anchor="middle" font-size="14.15841" fill="var(--text)" font-family="Arial, sans-serif">Production systems</text>
  <text x="1060.967742" y="228.730171" text-anchor="middle" font-size="12.27068" fill="var(--text-muted)" font-family="Arial, sans-serif">No internet access</text>
  <text x="1060.967742" y="279.365029" text-anchor="middle" font-size="12.27068" fill="var(--text-muted)" font-family="Arial, sans-serif">Classified network</text>
  <rect x="40" y="371.428571" width="1200" height="248.571429" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.516905"/>
  <rect x="40" y="371.428571" width="1200" height="46.031657" fill="url(#grad-primary)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="408.253943" width="1200" height="9.2064" fill="url(#grad-primary)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="400.8888" text-anchor="middle" font-size="16.990113" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Key Design Principles</text>
  <text x="640" y="463.492114" text-anchor="middle" font-size="15.102275" fill="var(--text)" font-family="Arial, sans-serif">One-way data flow only | No bidirectional network links</text>
  <text x="640" y="495.714286" text-anchor="middle" font-size="15.102275" fill="var(--text)" font-family="Arial, sans-serif">All transfers logged and audited | Media sanitized after use</text>
  <text x="640" y="537.142857" text-anchor="middle" font-size="14.15841" fill="var(--text-muted)" font-family="Arial, sans-serif">Physical separation enforced | No wireless in secure zone</text>
  <text x="640" y="573.968229" text-anchor="middle" font-size="14.15841" fill="var(--text-muted)" font-family="Arial, sans-serif">Strict access control | Camera-monitored transfer stations</text>
</svg>

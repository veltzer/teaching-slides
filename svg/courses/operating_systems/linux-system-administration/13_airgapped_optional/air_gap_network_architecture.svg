  <ns0:text x="955.5556" y="208.8889" text-anchor="middle" font-size="11.5556" fill="#555555" font-family="sans-serif">No internet access</ns0:text>
  <ns0:text x="955.5556" y="257.7778" text-anchor="middle" font-size="11.5556" fill="#555555" font-family="sans-serif">Classified network</ns0:text>

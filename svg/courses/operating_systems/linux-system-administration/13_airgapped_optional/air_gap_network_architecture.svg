  <ns0:text x="955.5556" y="57.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" font-family="sans-serif">Secure Zone</ns0:text>
  <ns0:text x="955.5556" y="120" text-anchor="middle" font-size="13.3333" fill="#333333" font-family="sans-serif">Local repo server</ns0:text>
  <ns0:text x="955.5556" y="146.6667" text-anchor="middle" font-size="13.3333" fill="#333333" font-family="sans-serif">Configuration mgmt</ns0:text>

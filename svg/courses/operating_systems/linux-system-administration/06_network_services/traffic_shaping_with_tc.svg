<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Packets -->
  <rect x="20" y="190" width="220" height="300" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="20" y="190" width="220" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="20" y="235" width="220" height="10" fill="url(#grad-accent)"/>
  <text x="130" y="224" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Packets</text>
  <text x="130" y="295" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Ingress</text>
  <text x="130" y="325" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">traffic</text>
  <text x="130" y="380" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Network frames</text>

  <line x1="240" y1="340" x2="318" y2="340" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Qdisc -->
  <rect x="320" y="190" width="270" height="300" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="320" y="190" width="270" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="320" y="235" width="270" height="10" fill="url(#grad-accent)"/>
  <text x="455" y="224" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Qdisc (queue)</text>
  <text x="455" y="295" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">pfifo, fq_codel</text>
  <text x="455" y="323" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">htb, tbf, sfq</text>
  <text x="455" y="375" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Rate limiting</text>
  <text x="455" y="398" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Prioritization</text>

  <line x1="590" y1="340" x2="668" y2="340" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Classes -->
  <rect x="670" y="190" width="235" height="300" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="670" y="190" width="235" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="670" y="235" width="235" height="10" fill="url(#grad-accent)"/>
  <text x="787" y="224" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Classes</text>
  <text x="787" y="295" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">High priority</text>
  <text x="787" y="323" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Normal traffic</text>
  <text x="787" y="351" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Bulk/background</text>
  <text x="787" y="390" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Filters classify</text>

  <line x1="905" y1="340" x2="983" y2="340" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Interface -->
  <rect x="985" y="190" width="265" height="300" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="985" y="190" width="265" height="55" fill="#64b5f6" rx="12"/>
  <rect x="985" y="235" width="265" height="10" fill="#64b5f6"/>
  <text x="1117" y="224" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Interface</text>
  <text x="1117" y="295" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">eth0, wlan0</text>
  <text x="1117" y="323" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Egress traffic</text>
  <text x="1117" y="390" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">tc qdisc add...</text>
</svg>

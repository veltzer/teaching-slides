<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="214.634146" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.482203" />
  <rect x="40" y="40" width="214.634146" height="106.333426" fill="var(--primary-fill)" rx="9.482203" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="126.999987" width="214.634146" height="19.333436" fill="var(--primary-fill)" rx="9.482203" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.317073" y="105.733111" text-anchor="middle" font-size="24.720895" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Packets</text>
  <text x="147.317073" y="242.999893" text-anchor="middle" font-size="20.600719" fill="var(--text)" font-family="sans-serif">Ingress</text>
  <text x="147.317073" y="300.999964" text-anchor="middle" font-size="20.600719" fill="var(--text)" font-family="sans-serif">traffic</text>
  <text x="147.317073" y="407.333148" text-anchor="middle" font-size="17.854041" fill="var(--text-muted)" font-family="sans-serif">Network frames</text>
  <line x1="254.634146" y1="329.99988" x2="330.731707" y2="329.99988" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="332.682823" y="40" width="263.414634" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.482203" />
  <rect x="332.682823" y="40" width="263.414634" height="106.333426" fill="var(--primary-fill)" rx="9.482203" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="332.682823" y="126.999987" width="263.414634" height="19.333436" fill="var(--primary-fill)" rx="9.482203" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.39014" y="105.733111" text-anchor="middle" font-size="24.720895" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Qdisc (queue)</text>
  <text x="464.39014" y="242.999893" text-anchor="middle" font-size="20.600719" fill="var(--text)" font-family="sans-serif">pfifo, fq_codel</text>
  <text x="464.39014" y="297.133085" text-anchor="middle" font-size="20.600719" fill="var(--text)" font-family="sans-serif">htb, tbf, sfq</text>
  <text x="464.39014" y="397.666431" text-anchor="middle" font-size="17.854041" fill="var(--text-muted)" font-family="sans-serif">Rate limiting</text>
  <text x="464.39014" y="442.133143" text-anchor="middle" font-size="17.854041" fill="var(--text-muted)" font-family="sans-serif">Prioritization</text>
  <line x1="596.097457" y1="329.99988" x2="672.195122" y2="329.99988" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="674.146341" y="40" width="229.268293" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.482203" />
  <rect x="674.146341" y="40" width="229.268293" height="106.333426" fill="var(--primary-fill)" rx="9.482203" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="674.146341" y="126.999987" width="229.268293" height="19.333436" fill="var(--primary-fill)" rx="9.482203" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="788.292683" y="105.733111" text-anchor="middle" font-size="24.720895" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Classes</text>
  <text x="788.292683" y="242.999893" text-anchor="middle" font-size="20.600719" fill="var(--text)" font-family="sans-serif">High priority</text>
  <text x="788.292683" y="297.133085" text-anchor="middle" font-size="20.600719" fill="var(--text)" font-family="sans-serif">Normal traffic</text>
  <text x="788.292683" y="351.266516" text-anchor="middle" font-size="20.600719" fill="var(--text)" font-family="sans-serif">Bulk/background</text>
  <text x="788.292683" y="426.666587" text-anchor="middle" font-size="17.854041" fill="var(--text-muted)" font-family="sans-serif">Filters classify</text>
  <line x1="903.41453" y1="329.99988" x2="979.512195" y2="329.99988" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="981.463415" y="40" width="258.536585" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.482203" />
  <rect x="981.463415" y="40" width="258.536585" height="106.333426" fill="var(--primary-fill)" rx="9.482203" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="981.463415" y="126.999987" width="258.536585" height="19.333436" fill="var(--primary-fill)" rx="9.482203" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.243902" y="105.733111" text-anchor="middle" font-size="24.720895" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Interface</text>
  <text x="1110.243902" y="242.999893" text-anchor="middle" font-size="20.600719" fill="var(--text)" font-family="sans-serif">eth0, wlan0</text>
  <text x="1110.243902" y="297.133085" text-anchor="middle" font-size="20.600719" fill="var(--text)" font-family="sans-serif">Egress traffic</text>
  <text x="1110.243902" y="426.666587" text-anchor="middle" font-size="17.854041" fill="var(--text-muted)" font-family="sans-serif">tc qdisc add...</text>
</svg>
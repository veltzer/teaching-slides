<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="77.5" y="104.4444" width="496.875" height="402.7777" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" stroke-dasharray="12.4444 6.2222" />
  <text x="325.9375" y="160.8333" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">Namespace: red</text>
  <rect x="124.375" y="217.2223" width="393.75" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="321.25" y="263.9444" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)" font-family="monospace">veth-red</text>
  <text x="321.25" y="293.75" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)" font-family="monospace">10.0.0.1/24</text>
  <text x="321.25" y="386.3889" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Own routing table</text>
  <text x="321.25" y="406.5277" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Own iptables rules</text>
  <rect x="705.625" y="104.4444" width="496.875" height="402.7777" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" stroke-dasharray="12.4444 6.2222" />
  <text x="954.0625" y="160.8333" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--danger-accent)" font-family="sans-serif">Namespace: blue</text>
  <rect x="752.5" y="217.2223" width="393.75" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="949.375" y="263.9444" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)" font-family="monospace">veth-blue</text>
  <text x="949.375" y="293.75" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)" font-family="monospace">10.0.0.2/24</text>
  <text x="949.375" y="386.3889" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Own routing table</text>
  <text x="949.375" y="406.5277" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Own iptables rules</text>
  <line x1="518.125" y1="269.5833" x2="752.5" y2="269.5833" stroke="var(--text)" stroke-width="2" />
  <text x="640" y="253.4723" text-anchor="middle" font-size="15.6425" fill="var(--text)" font-family="sans-serif">veth pair</text>
  <text x="640" y="555.5556" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)" font-family="sans-serif">ip link add veth-red type veth peer name veth-blue</text>
</svg>
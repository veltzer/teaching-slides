<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="530" height="517.856941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.02648" stroke-dasharray="12.4444 6.2222" filter="url(#shadow)"/>
  <text x="305" y="112.5" text-anchor="middle" font-size="24.424747" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Namespace: red</text>
  <rect x="90" y="185.000129" width="420" height="134.642931" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.02648"/>
  <text x="300" y="245.071388" text-anchor="middle" font-size="20.354073" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">veth-red</text>
  <text x="300" y="283.392866" text-anchor="middle" font-size="18.318618" fill="var(--text-muted)" font-family="Courier New, monospace">10.0.0.1/24</text>
  <text x="300" y="402.5" text-anchor="middle" font-size="15.265496" fill="var(--text-muted)" font-family="Arial, sans-serif">Own routing table</text>
  <text x="300" y="428.392738" text-anchor="middle" font-size="15.265496" fill="var(--text-muted)" font-family="Arial, sans-serif">Own iptables rules</text>
  <rect x="710" y="40" width="530" height="517.856941" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.02648" stroke-dasharray="12.4444 6.2222" filter="url(#shadow)"/>
  <text x="975" y="112.5" text-anchor="middle" font-size="24.424747" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Namespace: blue</text>
  <rect x="760" y="185.000129" width="420" height="134.642931" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.02648"/>
  <text x="970" y="245.071388" text-anchor="middle" font-size="20.354073" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">veth-blue</text>
  <text x="970" y="283.392866" text-anchor="middle" font-size="18.318618" fill="var(--text-muted)" font-family="Courier New, monospace">10.0.0.2/24</text>
  <text x="970" y="402.5" text-anchor="middle" font-size="15.265496" fill="var(--text-muted)" font-family="Arial, sans-serif">Own routing table</text>
  <text x="970" y="428.392738" text-anchor="middle" font-size="15.265496" fill="var(--text-muted)" font-family="Arial, sans-serif">Own iptables rules</text>
  <line x1="510" y1="252.321401" x2="760" y2="252.321401" stroke="var(--text)" stroke-width="2"/>
  <text x="640" y="231.607262" text-anchor="middle" font-size="18.318618" fill="var(--text)" font-family="Arial, sans-serif">veth pair</text>
  <text x="640" y="620" text-anchor="middle" font-size="16.283164" fill="var(--text-muted)" font-family="Arial, sans-serif">ip link add veth-red type veth peer name veth-blue</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Namespace: red -->
  <rect x="40" y="80" width="530" height="500" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="18" stroke-dasharray="14 7"/>
  <text x="305" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="#1565c0" font-family="sans-serif">Namespace: red</text>

  <!-- veth-red interface card -->
  <rect x="90" y="220" width="420" height="130" fill="url(#grad-surface)" stroke="#333333" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="300" y="278" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333" font-family="monospace">veth-red</text>
  <text x="300" y="315" text-anchor="middle" font-size="18" fill="#555555" font-family="monospace">10.0.0.1/24</text>

  <!-- Routes label -->
  <text x="300" y="430" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Own routing table</text>
  <text x="300" y="455" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Own iptables rules</text>

  <!-- Namespace: blue -->
  <rect x="710" y="80" width="530" height="500" fill="#fce4ec" stroke="#c62828" stroke-width="3" rx="18" stroke-dasharray="14 7"/>
  <text x="975" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="#c62828" font-family="sans-serif">Namespace: blue</text>

  <!-- veth-blue interface card -->
  <rect x="760" y="220" width="420" height="130" fill="url(#grad-surface)" stroke="#333333" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="970" y="278" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333" font-family="monospace">veth-blue</text>
  <text x="970" y="315" text-anchor="middle" font-size="18" fill="#555555" font-family="monospace">10.0.0.2/24</text>

  <!-- Routes label -->
  <text x="970" y="430" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Own routing table</text>
  <text x="970" y="455" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Own iptables rules</text>

  <!-- veth pair line connecting them -->
  <line x1="510" y1="285" x2="760" y2="285" stroke="#333333" stroke-width="5"/>
  <text x="640" y="265" text-anchor="middle" font-size="18" fill="#333333" font-family="sans-serif">veth pair</text>

  <!-- Label below -->
  <text x="640" y="640" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">ip link add veth-red type veth peer name veth-blue</text>
</svg>

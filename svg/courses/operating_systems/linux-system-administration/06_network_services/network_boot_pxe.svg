<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="223.481697" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299"/>
  <rect x="40" y="40" width="223.481697" height="106.333425" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="126.999987" width="223.481697" height="19.333438" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.7409" y="105.73335" text-anchor="middle" font-size="24.670803" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">PXE Client</text>
  <text x="151.7409" y="223.666694" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="Arial, sans-serif">Boot from NIC</text>
  <text x="151.7409" y="277.799886" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="Arial, sans-serif">DHCP discover</text>
  <text x="151.7409" y="378.333232" text-anchor="middle" font-size="17.817863" fill="var(--text-muted)" font-family="Arial, sans-serif">No disk needed</text>
  <line x1="263.481801" y1="329.999878" x2="329.554681" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="331.497897" y="40" width="242.915001" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299"/>
  <rect x="331.497897" y="40" width="242.915001" height="106.333425" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="331.497897" y="126.999987" width="242.915001" height="19.333438" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="452.955501" y="105.73335" text-anchor="middle" font-size="24.670803" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">DHCP Server</text>
  <text x="452.955501" y="223.666694" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="Arial, sans-serif">Assigns IP</text>
  <text x="452.955501" y="277.799886" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="Arial, sans-serif">TFTP server IP</text>
  <text x="452.955501" y="331.933318" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="Arial, sans-serif">Bootfile name</text>
  <text x="452.955501" y="413.133226" text-anchor="middle" font-size="17.817863" fill="var(--text-muted)" font-family="Arial, sans-serif">Option 66/67</text>
  <line x1="574.413002" y1="329.999878" x2="640.485882" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="642.429202" y="40" width="242.915001" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299"/>
  <rect x="642.429202" y="40" width="242.915001" height="106.333425" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="642.429202" y="126.999987" width="242.915001" height="19.333438" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763.886702" y="105.73335" text-anchor="middle" font-size="24.670803" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">TFTP Server</text>
  <text x="763.886702" y="223.666694" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="Arial, sans-serif">pxelinux.0</text>
  <text x="763.886702" y="277.799886" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="Arial, sans-serif">Kernel image</text>
  <text x="763.886702" y="331.933318" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="Arial, sans-serif">initrd.img</text>
  <text x="763.886702" y="413.133226" text-anchor="middle" font-size="17.817863" fill="var(--text-muted)" font-family="Arial, sans-serif">UDP port 69</text>
  <line x1="885.344203" y1="329.999878" x2="951.417083" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="953.360299" y="40" width="286.639701" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299"/>
  <rect x="953.360299" y="40" width="286.639701" height="106.333425" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="953.360299" y="126.999987" width="286.639701" height="19.333438" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1096.194423" y="105.73335" text-anchor="middle" font-size="23.300246" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">HTTP/NFS Image</text>
  <text x="1096.194423" y="223.666694" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="Arial, sans-serif">Root filesystem</text>
  <text x="1096.194423" y="277.799886" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="Arial, sans-serif">OS install image</text>
  <text x="1096.194423" y="413.133226" text-anchor="middle" font-size="17.817863" fill="var(--text-muted)" font-family="Arial, sans-serif">Kickstart / Preseed</text>
</svg>

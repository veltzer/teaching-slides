<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="223.481697" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299" filter="url(#shadow)" />
  <rect x="40" y="40" width="223.481697" height="106.333425" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="126.999987" width="223.481697" height="19.333438" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="151.7409" y="105.73335" text-anchor="middle" font-size="24.670803" font-weight="bold" fill="var(--bg)" font-family="sans-serif">PXE Client</text>
  <text x="151.7409" y="223.666694" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="sans-serif">Boot from NIC</text>
  <text x="151.7409" y="277.799886" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="sans-serif">DHCP discover</text>
  <text x="151.7409" y="378.333232" text-anchor="middle" font-size="17.817863" fill="var(--text-muted)" font-family="sans-serif">No disk needed</text>
  <line x1="263.481801" y1="329.999878" x2="329.554681" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="331.497897" y="40" width="242.915001" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299" filter="url(#shadow)" />
  <rect x="331.497897" y="40" width="242.915001" height="106.333425" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="331.497897" y="126.999987" width="242.915001" height="19.333438" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="452.955501" y="105.73335" text-anchor="middle" font-size="24.670803" font-weight="bold" fill="var(--bg)" font-family="sans-serif">DHCP Server</text>
  <text x="452.955501" y="223.666694" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="sans-serif">Assigns IP</text>
  <text x="452.955501" y="277.799886" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="sans-serif">TFTP server IP</text>
  <text x="452.955501" y="331.933318" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="sans-serif">Bootfile name</text>
  <text x="452.955501" y="413.133226" text-anchor="middle" font-size="17.817863" fill="var(--text-muted)" font-family="sans-serif">Option 66/67</text>
  <line x1="574.413002" y1="329.999878" x2="640.485882" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="642.429202" y="40" width="242.915001" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299" filter="url(#shadow)" />
  <rect x="642.429202" y="40" width="242.915001" height="106.333425" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="642.429202" y="126.999987" width="242.915001" height="19.333438" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="763.886702" y="105.73335" text-anchor="middle" font-size="24.670803" font-weight="bold" fill="var(--bg)" font-family="sans-serif">TFTP Server</text>
  <text x="763.886702" y="223.666694" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="sans-serif">pxelinux.0</text>
  <text x="763.886702" y="277.799886" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="sans-serif">Kernel image</text>
  <text x="763.886702" y="331.933318" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="sans-serif">initrd.img</text>
  <text x="763.886702" y="413.133226" text-anchor="middle" font-size="17.817863" fill="var(--text-muted)" font-family="sans-serif">UDP port 69</text>
  <line x1="885.344203" y1="329.999878" x2="951.417083" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="953.360299" y="40" width="286.639701" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299" filter="url(#shadow)" />
  <rect x="953.360299" y="40" width="286.639701" height="106.333425" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="953.360299" y="126.999987" width="286.639701" height="19.333438" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1096.194423" y="105.73335" text-anchor="middle" font-size="23.300246" font-weight="bold" fill="var(--bg)" font-family="sans-serif">HTTP/NFS Image</text>
  <text x="1096.194423" y="223.666694" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="sans-serif">Root filesystem</text>
  <text x="1096.194423" y="277.799886" text-anchor="middle" font-size="20.558976" fill="var(--text)" font-family="sans-serif">OS install image</text>
  <text x="1096.194423" y="413.133226" text-anchor="middle" font-size="17.817863" fill="var(--text-muted)" font-family="sans-serif">Kickstart / Preseed</text>
</svg>
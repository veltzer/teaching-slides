<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Linux Kernel at top -->
  <rect x="440" y="30" width="400" height="100" fill="url(#grad-accent)" rx="10" filter="url(#shadow)"/>
  <text x="640" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">Linux Kernel</text>

  <!-- Three family boxes -->
  <rect x="80" y="200" width="300" height="110" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="230" y="265" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0" font-family="sans-serif">Debian</text>

  <rect x="490" y="200" width="300" height="110" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="640" y="265" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0" font-family="sans-serif">Red Hat</text>

  <rect x="900" y="200" width="300" height="110" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="1050" y="265" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0" font-family="sans-serif">SUSE</text>

  <!-- Connecting lines kernel to families -->
  <line x1="640" y1="130" x2="230" y2="200" stroke="#555555" stroke-width="2"/>
  <line x1="640" y1="130" x2="640" y2="200" stroke="#555555" stroke-width="2"/>
  <line x1="640" y1="130" x2="1050" y2="200" stroke="#555555" stroke-width="2"/>

  <!-- Derivative distro boxes -->
  <rect x="40" y="400" width="190" height="90" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
  <text x="135" y="452" text-anchor="middle" font-size="18" fill="#333333" font-family="sans-serif">Ubuntu</text>

  <rect x="250" y="400" width="190" height="90" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
  <text x="345" y="452" text-anchor="middle" font-size="18" fill="#333333" font-family="sans-serif">Mint</text>

  <rect x="450" y="400" width="190" height="90" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
  <text x="545" y="452" text-anchor="middle" font-size="18" fill="#333333" font-family="sans-serif">RHEL</text>

  <rect x="660" y="400" width="190" height="90" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
  <text x="755" y="452" text-anchor="middle" font-size="18" fill="#333333" font-family="sans-serif">Fedora</text>

  <rect x="870" y="400" width="190" height="90" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
  <text x="965" y="452" text-anchor="middle" font-size="18" fill="#333333" font-family="sans-serif">openSUSE</text>

  <rect x="1070" y="400" width="190" height="90" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
  <text x="1165" y="452" text-anchor="middle" font-size="18" fill="#333333" font-family="sans-serif">SLES</text>

  <!-- Lines families to derivatives -->
  <line x1="230" y1="310" x2="135" y2="400" stroke="#555555" stroke-width="1.5"/>
  <line x1="230" y1="310" x2="345" y2="400" stroke="#555555" stroke-width="1.5"/>
  <line x1="640" y1="310" x2="545" y2="400" stroke="#555555" stroke-width="1.5"/>
  <line x1="640" y1="310" x2="755" y2="400" stroke="#555555" stroke-width="1.5"/>
  <line x1="1050" y1="310" x2="965" y2="400" stroke="#555555" stroke-width="1.5"/>
  <line x1="1050" y1="310" x2="1165" y2="400" stroke="#555555" stroke-width="1.5"/>
</svg>

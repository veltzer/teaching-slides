<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="452.5" y="64.1667" width="375" height="80.5556" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="112.5" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Linux Kernel</text>
  <rect x="115" y="201.1111" width="281.25" height="88.6111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="255.6249" y="253.4723" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">Debian</text>
  <rect x="499.375" y="201.1111" width="281.25" height="88.6111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="640" y="253.4723" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">Red Hat</text>
  <rect x="883.75" y="201.1111" width="281.25" height="88.6111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="1024.3749" y="253.4723" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">SUSE</text>
  <line x1="640" y1="144.7223" x2="255.6249" y2="201.1111" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="640" y1="144.7223" x2="640" y2="201.1111" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="640" y1="144.7223" x2="1024.3749" y2="201.1111" stroke="var(--text-muted)" stroke-width="1.7778" />
  <rect x="77.5" y="362.2223" width="178.125" height="72.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="166.5625" y="404.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)" font-family="sans-serif">Ubuntu</text>
  <rect x="274.375" y="362.2223" width="178.125" height="72.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="363.4375" y="404.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)" font-family="sans-serif">Mint</text>
  <rect x="461.875" y="362.2223" width="178.125" height="72.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="550.9374" y="404.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)" font-family="sans-serif">RHEL</text>
  <rect x="658.75" y="362.2223" width="178.125" height="72.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="747.8125" y="404.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)" font-family="sans-serif">Fedora</text>
  <rect x="855.6249" y="362.2223" width="178.125" height="72.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="944.6875" y="404.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)" font-family="sans-serif">openSUSE</text>
  <rect x="1043.125" y="362.2223" width="178.125" height="72.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="1132.1875" y="404.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)" font-family="sans-serif">SLES</text>
  <line x1="255.6249" y1="289.7223" x2="166.5625" y2="362.2223" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="255.6249" y1="289.7223" x2="363.4375" y2="362.2223" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="640" y1="289.7223" x2="550.9374" y2="362.2223" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="640" y1="289.7223" x2="747.8125" y2="362.2223" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="1024.3749" y1="289.7223" x2="944.6875" y2="362.2223" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="1024.3749" y1="289.7223" x2="1132.1875" y2="362.2223" stroke="var(--text-muted)" stroke-width="1.3333" />
</svg>
  <rect x="276.033058" y="40" width="208.264463" height="96.666467" fill="var(--primary-fill)" rx="9.560247" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="276.033058" y="117.333269" width="208.264463" height="19.333436" fill="var(--primary-fill)" rx="9.560247" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.165289" y="101.866712" text-anchor="middle" font-size="24.924362" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Storage</text>
  <text x="380.165289" y="213.999976" text-anchor="middle" font-size="19.385474" fill="var(--text)" font-family="sans-serif">LVM / RAID</text>
  <text x="380.165289" y="262.333329" text-anchor="middle" font-size="19.385474" fill="var(--text)" font-family="sans-serif">Backup strategies</text>
  <text x="380.165289" y="310.666682" text-anchor="middle" font-size="19.385474" fill="var(--text)" font-family="sans-serif">Multipath I/O</text>
  <rect x="512.066116" y="40" width="208.264463" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.560247" />
  <rect x="512.066116" y="40" width="208.264463" height="96.666467" fill="var(--primary-fill)" rx="9.560247" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="512.066116" y="117.333269" width="208.264463" height="19.333436" fill="var(--primary-fill)" rx="9.560247" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="616.198347" y="101.866712" text-anchor="middle" font-size="24.924362" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Security</text>
  <text x="616.198347" y="213.999976" text-anchor="middle" font-size="19.385474" fill="var(--text)" font-family="sans-serif">PAM</text>
  <text x="616.198347" y="262.333329" text-anchor="middle" font-size="19.385474" fill="var(--text)" font-family="sans-serif">LDAP / NSS</text>
  <text x="616.198347" y="310.666682" text-anchor="middle" font-size="19.385474" fill="var(--text)" font-family="sans-serif">User management</text>
  <rect x="748.099174" y="40" width="208.264463" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.560247" />
  <rect x="748.099174" y="40" width="208.264463" height="96.666467" fill="var(--primary-fill)" rx="9.560247" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="748.099174" y="117.333269" width="208.264463" height="19.333436" fill="var(--primary-fill)" rx="9.560247" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="852.231405" y="101.866712" text-anchor="middle" font-size="24.924362" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Networking</text>
  <text x="852.231405" y="213.999976" text-anchor="middle" font-size="19.385474" fill="var(--text)" font-family="sans-serif">Namespaces</text>

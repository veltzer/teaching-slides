<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="201.1111" width="196.875" height="241.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="68.125" y="201.1111" width="196.875" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="68.125" y="233.3333" width="196.875" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="166.5625" y="226.8889" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Core System</text>
  <text x="166.5625" y="273.6111" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">Boot process</text>
  <text x="166.5625" y="293.75" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">systemd</text>
  <text x="166.5625" y="313.8889" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">Filesystem</text>
  <text x="166.5625" y="334.0277" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">Device Mapper</text>
  <rect x="291.25" y="201.1111" width="196.875" height="241.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="291.25" y="201.1111" width="196.875" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="291.25" y="233.3333" width="196.875" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="389.6875" y="226.8889" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Storage</text>
  <text x="389.6875" y="273.6111" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">LVM / RAID</text>
  <text x="389.6875" y="293.75" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">Backup strategies</text>
  <text x="389.6875" y="313.8889" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">Multipath I/O</text>
  <rect x="514.375" y="201.1111" width="196.875" height="241.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="514.375" y="201.1111" width="196.875" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="514.375" y="233.3333" width="196.875" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="612.8125" y="226.8889" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Security</text>
  <text x="612.8125" y="273.6111" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">PAM</text>
  <text x="612.8125" y="293.75" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">LDAP / NSS</text>
  <text x="612.8125" y="313.8889" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">User management</text>
  <rect x="737.5" y="201.1111" width="196.875" height="241.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="737.5" y="201.1111" width="196.875" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="737.5" y="233.3333" width="196.875" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="835.9375" y="226.8889" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Networking</text>
  <text x="835.9375" y="273.6111" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">Namespaces</text>
  <text x="835.9375" y="293.75" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">PXE boot</text>
  <text x="835.9375" y="313.8889" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">Traffic shaping</text>
  <rect x="960.625" y="201.1111" width="241.875" height="241.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="960.625" y="201.1111" width="241.875" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="960.625" y="233.3333" width="241.875" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1081.5625" y="226.8889" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Monitoring</text>
  <text x="1081.5625" y="273.6111" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">Prometheus / Grafana</text>
  <text x="1081.5625" y="293.75" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">Change management</text>
  <text x="1081.5625" y="313.8889" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">Maintenance</text>
  <line x1="265" y1="321.9444" x2="291.25" y2="321.9444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="488.125" y1="321.9444" x2="514.375" y2="321.9444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="711.2499" y1="321.9444" x2="737.5" y2="321.9444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="934.375" y1="321.9444" x2="960.625" y2="321.9444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
</svg>
  <line x1="484.297521" y1="329.99988" x2="512.066116" y2="329.99988" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="720.330473" y1="329.99988" x2="748.099174" y2="329.99988" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="956.363636" y1="329.99988" x2="984.132231" y2="329.99988" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />

  <rect x="984.132231" y="117.333269" width="255.867769" height="19.333436" fill="var(--primary-fill)" rx="9.560247" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112.066116" y="101.866712" text-anchor="middle" font-size="24.924362" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Monitoring</text>
  <text x="1112.066116" y="213.999976" text-anchor="middle" font-size="19.385474" fill="var(--text)" font-family="sans-serif">Prometheus / Grafana</text>

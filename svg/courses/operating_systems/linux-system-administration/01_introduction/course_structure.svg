<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="177.7778" width="186.6667" height="266.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="26.6667" y="177.7778" width="186.6667" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="26.6667" y="213.3333" width="186.6667" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="120" y="206.2222" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Core System</text>
  <text x="120" y="257.7778" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Boot process</text>
  <text x="120" y="280" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">systemd</text>
  <text x="120" y="302.2222" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Filesystem</text>
  <text x="120" y="324.4444" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Device Mapper</text>
  <rect x="238.2222" y="177.7778" width="186.6667" height="266.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="238.2222" y="177.7778" width="186.6667" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="238.2222" y="213.3333" width="186.6667" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="331.5556" y="206.2222" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Storage</text>
  <text x="331.5556" y="257.7778" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">LVM / RAID</text>
  <text x="331.5556" y="280" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Backup strategies</text>
  <text x="331.5556" y="302.2222" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Multipath I/O</text>
  <rect x="449.7778" y="177.7778" width="186.6667" height="266.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="449.7778" y="177.7778" width="186.6667" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="449.7778" y="213.3333" width="186.6667" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="543.1111" y="206.2222" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Security</text>
  <text x="543.1111" y="257.7778" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">PAM</text>
  <text x="543.1111" y="280" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">LDAP / NSS</text>
  <text x="543.1111" y="302.2222" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">User management</text>
  <rect x="661.3333" y="177.7778" width="186.6667" height="266.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="661.3333" y="177.7778" width="186.6667" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="661.3333" y="213.3333" width="186.6667" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="754.6667" y="206.2222" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Networking</text>
  <text x="754.6667" y="257.7778" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Namespaces</text>
  <text x="754.6667" y="280" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">PXE boot</text>
  <text x="754.6667" y="302.2222" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Traffic shaping</text>
  <rect x="872.8889" y="177.7778" width="229.3333" height="266.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="872.8889" y="177.7778" width="229.3333" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="872.8889" y="213.3333" width="229.3333" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="987.5556" y="206.2222" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Monitoring</text>
  <text x="987.5556" y="257.7778" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Prometheus / Grafana</text>
  <text x="987.5556" y="280" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Change management</text>
  <text x="987.5556" y="302.2222" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Maintenance</text>
  <line x1="213.3333" y1="311.1111" x2="238.2222" y2="311.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="424.8889" y1="311.1111" x2="449.7778" y2="311.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="636.4444" y1="311.1111" x2="661.3333" y2="311.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="848" y1="311.1111" x2="872.8889" y2="311.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
</svg>
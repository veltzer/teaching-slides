<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Request flow row -->
  <rect x="40" y="50.740740740741" width="170" height="85.925925925926" rx="8.291003602745" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="88.333333333334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--bg)">Browser</text>
  <text x="125" y="115.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--bg)">HTTPS :443</text>

  <line x1="215" y1="93.703703703704" x2="265" y2="93.703703703704" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="50.740740740741" width="260" height="85.925925925926" rx="8.291003602745" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="85.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--bg)">Reverse Proxy</text>
  <text x="400" y="109.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--bg)">nginx / HAProxy</text>
  <text x="400" y="128.074074074075" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--bg)">TLS + load balance</text>

  <line x1="535" y1="72.222222222222" x2="585" y2="56.111111111112" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="535" y1="93.703703703704" x2="585" y2="93.703703703704" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="535" y1="115.185185185185" x2="585" y2="131.296296296297" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="590" y="40" width="180" height="36.518518518519" rx="6.21825270206" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="64.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--bg)">App Server 1</text>
  <rect x="590" y="77.592592592593" width="180" height="36.518518518519" rx="6.21825270206" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="102.296296296297" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--bg)">App Server 2</text>
  <rect x="590" y="115.185185185185" width="180" height="36.518518518519" rx="6.21825270206" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="139.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--bg)">App Server 3</text>

  <!-- nginx box -->
  <rect x="800" y="50.740740740741" width="210" height="85.925925925926" rx="8.291003602745" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="905" y="82.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--bg)">nginx</text>
  <text x="905" y="106.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--bg)">event-driven</text>
  <text x="905" y="125.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--bg)">low memory</text>

  <rect x="1030" y="50.740740740741" width="210" height="85.925925925926" rx="8.291003602745" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="82.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--bg)">Apache</text>
  <text x="1135" y="106.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--bg)">thread-per-request</text>
  <text x="1135" y="125.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--bg)">.htaccess</text>

  <!-- Proxy benefits -->
  <rect x="40" y="168.888888888889" width="600" height="225.555555555555" rx="8.291003602745" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="198.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--bg)">Reverse Proxy Benefits</text>
  <text x="60" y="243.333333333333" font-family="Arial, sans-serif" font-size="14.320407608517" fill="var(--bg)">TLS termination</text>
  <text x="60" y="274.722222222222" font-family="Arial, sans-serif" font-size="14.320407608517" fill="var(--bg)">Load balancing</text>
  <text x="60" y="306.111111111111" font-family="Arial, sans-serif" font-size="14.320407608517" fill="var(--bg)">Health checks</text>
  <text x="60" y="337.5" font-family="Arial, sans-serif" font-size="14.320407608517" fill="var(--bg)">Caching, rate-limiting</text>
  <text x="60" y="379.351851851852" font-family="Courier New, monospace" font-size="12.274635093015" fill="var(--bg)">roundrobin | leastconn | ip_hash</text>

  <!-- Postfix flow -->
  <rect x="660" y="168.888888888889" width="580" height="225.555555555555" rx="8.291003602745" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="198.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--bg)">Postfix Mail Flow</text>
  <text x="950" y="243.333333333333" text-anchor="middle" font-family="Courier New, monospace" font-size="13.297521350766" fill="var(--bg)">MUA -&gt; smtpd:587 -&gt; queue</text>
  <text x="950" y="274.722222222222" text-anchor="middle" font-family="Courier New, monospace" font-size="13.297521350766" fill="var(--bg)">queue -&gt; smtp -&gt; remote MTA</text>
  <text x="950" y="306.111111111111" text-anchor="middle" font-family="Courier New, monospace" font-size="13.297521350766" fill="var(--bg)">local -&gt; /var/mail</text>
  <text x="680" y="347.962962962963" font-family="Courier New, monospace" font-size="12.274635093015" fill="var(--bg)">main.cf, mailq, reload</text>
  <text x="680" y="379.351851851852" font-family="Courier New, monospace" font-size="12.274635093015" fill="var(--bg)">/var/log/mail.log</text>

  <!-- Commands summary -->
  <rect x="40" y="415.925925925926" width="1200" height="204.074074074074" rx="8.291003602745" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="448.148148148149" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--text)">Service Cheat Sheet</text>

  <text x="160" y="483.981481481482" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.343293866268" font-weight="bold" fill="var(--ok-accent)">nginx</text>
  <text x="60" y="520.601851851852" font-family="Courier New, monospace" font-size="13.297521350766" fill="var(--text)">apt install nginx</text>
  <text x="60" y="551.990740740741" font-family="Courier New, monospace" font-size="13.297521350766" fill="var(--text)">nginx -t</text>
  <text x="60" y="583.37962962963" font-family="Courier New, monospace" font-size="13.297521350766" fill="var(--text)">nginx -s reload</text>

  <text x="560" y="483.981481481482" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.343293866268" font-weight="bold" fill="var(--info-accent)">HAProxy</text>
  <text x="460" y="520.601851851852" font-family="Courier New, monospace" font-size="13.297521350766" fill="var(--text)">apt install haproxy</text>
  <text x="460" y="551.990740740741" font-family="Courier New, monospace" font-size="13.297521350766" fill="var(--text)">/etc/haproxy/haproxy.cfg</text>
  <text x="460" y="583.37962962963" font-family="Courier New, monospace" font-size="13.297521350766" fill="var(--text)">balance roundrobin</text>

  <text x="960" y="483.981481481482" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.343293866268" font-weight="bold" fill="var(--warn-accent)">Postfix</text>
  <text x="860" y="520.601851851852" font-family="Courier New, monospace" font-size="13.297521350766" fill="var(--text)">apt install postfix</text>
  <text x="860" y="551.990740740741" font-family="Courier New, monospace" font-size="13.297521350766" fill="var(--text)">postfix reload</text>
  <text x="860" y="583.37962962963" font-family="Courier New, monospace" font-size="13.297521350766" fill="var(--text)">DKIM SPF DMARC</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.342871951533" font-weight="bold" fill="var(--primary-accent)">Web Server Architecture</text>

  <!-- Request flow row -->
  <rect x="40" y="75.929203539823" width="170" height="82.12389380531" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="111.858407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--bg)">Browser</text>
  <text x="125" y="137.522123893805" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">HTTPS :443</text>

  <line x1="215" y1="116.991150442478" x2="265" y2="116.991150442478" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="75.929203539823" width="260" height="82.12389380531" rx="8.10549906201" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="108.778761061947" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--bg)">Reverse Proxy</text>
  <text x="400" y="132.389380530973" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">nginx / HAProxy</text>
  <text x="400" y="149.840707964602" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">TLS + load balance</text>

  <line x1="535" y1="96.46017699115" x2="585" y2="81.061946902655" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="535" y1="116.991150442478" x2="585" y2="116.991150442478" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="535" y1="137.522123893805" x2="585" y2="152.920353982301" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="590" y="65.663716814159" width="180" height="34.902654867257" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="89.274336283186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">App Server 1</text>
  <rect x="590" y="101.592920353982" width="180" height="34.902654867257" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="125.203539823009" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">App Server 2</text>
  <rect x="590" y="137.522123893805" width="180" height="34.902654867257" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="161.132743362832" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">App Server 3</text>

  <!-- nginx box -->
  <rect x="800" y="75.929203539823" width="210" height="82.12389380531" rx="8.10549906201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="905" y="106.725663716814" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--bg)">nginx</text>
  <text x="905" y="129.309734513274" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">event-driven</text>
  <text x="905" y="147.787610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">low memory</text>

  <rect x="1030" y="75.929203539823" width="210" height="82.12389380531" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="106.725663716814" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--bg)">Apache</text>
  <text x="1135" y="129.309734513274" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">thread-per-request</text>
  <text x="1135" y="147.787610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">.htaccess, modules</text>

  <!-- Proxy benefits -->
  <rect x="40" y="188.849557522124" width="600" height="215.575221238938" rx="8.10549906201" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="217.592920353982" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--bg)">Reverse Proxy Benefits</text>
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)">TLS termination</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)">Load balancing</text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)">Health checks</text>
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)">Caching, rate limits</text>
  <text x="60" y="390" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">roundrobin | leastconn | ip_hash</text>

  <!-- Postfix flow -->
  <rect x="660" y="188.849557522124" width="580" height="215.575221238938" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="217.592920353982" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--bg)">Postfix Mail Flow</text>
  <text x="950" y="260" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">MUA -> smtpd:587 -> queue</text>
  <text x="950" y="290" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">queue -> smtp -> remote MTA</text>
  <text x="950" y="320" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">local -> /var/mail</text>
  <text x="680" y="360" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">main.cf, mailq, postfix reload</text>
  <text x="680" y="390" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">/var/log/mail.log</text>

  <!-- Commands summary -->
  <rect x="40" y="424.955752212389" width="1200" height="195.044247787611" rx="8.10549906201" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="455.752212389381" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--text)">Service Cheat Sheet</text>

  <text x="160" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">nginx</text>
  <text x="60" y="525" font-family="Courier New, monospace" font-size="13" fill="var(--text)">apt install nginx</text>
  <text x="60" y="555" font-family="Courier New, monospace" font-size="13" fill="var(--text)">nginx -t</text>
  <text x="60" y="585" font-family="Courier New, monospace" font-size="13" fill="var(--text)">nginx -s reload</text>

  <text x="560" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-accent)">HAProxy</text>
  <text x="460" y="525" font-family="Courier New, monospace" font-size="13" fill="var(--text)">apt install haproxy</text>
  <text x="460" y="555" font-family="Courier New, monospace" font-size="13" fill="var(--text)">/etc/haproxy/haproxy.cfg</text>
  <text x="460" y="585" font-family="Courier New, monospace" font-size="13" fill="var(--text)">balance roundrobin</text>

  <text x="960" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-accent)">Postfix</text>
  <text x="860" y="525" font-family="Courier New, monospace" font-size="13" fill="var(--text)">apt install postfix</text>
  <text x="860" y="555" font-family="Courier New, monospace" font-size="13" fill="var(--text)">postfix reload</text>
  <text x="860" y="585" font-family="Courier New, monospace" font-size="13" fill="var(--text)">DKIM SPF DMARC</text>
</svg>

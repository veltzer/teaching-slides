<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="225.2777" width="206.25" height="177.2223" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="171.25" y="321.9444" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Server</text>
  <text x="171.25" y="346.1111" text-anchor="middle" font-size="13.0354" fill="var(--primary-accent)" font-family="sans-serif">multipath daemon</text>
  <rect x="415" y="120.5556" width="187.5" height="112.7777" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="508.7499" y="183.3889" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">HBA 1</text>
  <text x="508.7499" y="209.1667" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Path A</text>
  <rect x="415" y="289.7223" width="187.5" height="112.7777" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="508.7499" y="352.5556" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">HBA 2</text>
  <text x="508.7499" y="378.3333" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Path B</text>
  <rect x="715" y="120.5556" width="187.5" height="112.7777" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="808.75" y="183.3889" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)" font-family="sans-serif">Switch A</text>
  <text x="808.75" y="209.1667" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">SAN Fabric</text>
  <rect x="715" y="289.7223" width="187.5" height="112.7777" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="808.75" y="352.5556" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)" font-family="sans-serif">Switch B</text>
  <text x="808.75" y="378.3333" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">SAN Fabric</text>
  <rect x="1005.625" y="193.0556" width="215.6249" height="177.2223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="1005.625" y="193.0556" width="215.6249" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1005.625" y="225.2777" width="215.6249" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1113.4375" y="218.8333" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">SAN LUN</text>
  <text x="1113.4375" y="273.6111" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Storage Array</text>
  <text x="1113.4375" y="296.1667" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Active/Passive</text>
  <text x="1113.4375" y="315.5" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">or Active/Active</text>
  <line x1="274.375" y1="281.6667" x2="415" y2="180.9723" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="274.375" y1="354.1667" x2="415" y2="350.1389" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="602.5" y1="180.9723" x2="715" y2="180.9723" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="602.5" y1="350.1389" x2="715" y2="350.1389" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="902.5" y1="180.9723" x2="1005.625" y2="245.4167" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="902.5" y1="350.1389" x2="1005.625" y2="309.8611" stroke="var(--text-muted)" stroke-width="1.7778" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="255.428353" width="214.634165" height="364.571647" fill="var(--primary-fill)" rx="8.778816" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="147.317082" y="454.285597" text-anchor="middle" font-size="27.973113" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Server</text>
  <text x="147.317082" y="503.999958" text-anchor="middle" font-size="19.072563" fill="var(--primary-accent)" font-family="sans-serif">multipath daemon</text>
  <rect x="400.975641" y="40" width="195.121968" height="231.999877" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.778816" filter="url(#shadow)" />
  <text x="498.536521" y="169.257095" text-anchor="middle" font-size="25.430182" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">HBA 1</text>
  <text x="498.536521" y="222.28572" text-anchor="middle" font-size="17.800952" fill="var(--text-muted)" font-family="sans-serif">Path A</text>
  <rect x="400.975641" y="388.000123" width="195.121968" height="231.999877" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.778816" filter="url(#shadow)" />
  <text x="498.536521" y="517.257217" text-anchor="middle" font-size="25.430182" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">HBA 2</text>
  <text x="498.536521" y="570.285639" text-anchor="middle" font-size="17.800952" fill="var(--text-muted)" font-family="sans-serif">Path B</text>
  <rect x="713.17079" y="40" width="195.121968" height="231.999877" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.778816" filter="url(#shadow)" />
  <text x="810.731774" y="169.257095" text-anchor="middle" font-size="25.430182" font-weight="bold" fill="var(--text)" font-family="sans-serif">Switch A</text>
  <text x="810.731774" y="222.28572" text-anchor="middle" font-size="17.800952" fill="var(--text-muted)" font-family="sans-serif">SAN Fabric</text>
  <rect x="713.17079" y="388.000123" width="195.121968" height="231.999877" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.778816" filter="url(#shadow)" />
  <text x="810.731774" y="517.257217" text-anchor="middle" font-size="25.430182" font-weight="bold" fill="var(--text)" font-family="sans-serif">Switch B</text>
  <text x="810.731774" y="570.285639" text-anchor="middle" font-size="17.800952" fill="var(--text-muted)" font-family="sans-serif">SAN Fabric</text>
  <rect x="1015.609841" y="189.142881" width="224.390159" height="364.571647" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.778816" filter="url(#shadow)" />
  <rect x="1015.609841" y="189.142881" width="224.390159" height="82.856997" fill="var(--primary-fill)" rx="8.778816" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1015.609841" y="255.428353" width="224.390159" height="16.571522" fill="var(--primary-fill)" rx="8.778816" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1127.804972" y="242.1713" text-anchor="middle" font-size="22.887105" font-weight="bold" fill="var(--bg)" font-family="sans-serif">SAN LUN</text>
  <text x="1127.804972" y="354.857078" text-anchor="middle" font-size="19.072563" fill="var(--text)" font-family="sans-serif">Storage Array</text>
  <text x="1127.804972" y="401.257176" text-anchor="middle" font-size="17.800952" fill="var(--text-muted)" font-family="sans-serif">Active/Passive</text>
  <text x="1127.804972" y="441.028544" text-anchor="middle" font-size="17.800952" fill="var(--text-muted)" font-family="sans-serif">or Active/Active</text>
  <line x1="254.634165" y1="371.4286" x2="400.975641" y2="164.285803" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="254.634165" y1="520.571481" x2="400.975641" y2="512.28572" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="596.097609" y1="164.285803" x2="713.17079" y2="164.285803" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="596.097609" y1="512.28572" x2="713.17079" y2="512.28572" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="908.292758" y1="164.285803" x2="1015.609841" y2="296.857161" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="908.292758" y1="512.28572" x2="1015.609841" y2="429.428519" stroke="var(--text-muted)" stroke-width="1.7778" />
</svg>
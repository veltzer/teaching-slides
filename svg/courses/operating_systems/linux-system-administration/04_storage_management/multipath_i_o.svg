<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Server -->
  <rect x="30" y="230" width="220" height="220" fill="url(#grad-accent)" rx="12" filter="url(#shadow)"/>
  <text x="140" y="350" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff" font-family="sans-serif">Server</text>
  <text x="140" y="380" text-anchor="middle" font-size="15" fill="#bbdefb" font-family="sans-serif">multipath daemon</text>

  <!-- HBA boxes -->
  <rect x="400" y="100" width="200" height="140" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="500" y="178" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0" font-family="sans-serif">HBA 1</text>
  <text x="500" y="210" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Path A</text>

  <rect x="400" y="310" width="200" height="140" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="500" y="388" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0" font-family="sans-serif">HBA 2</text>
  <text x="500" y="420" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Path B</text>

  <!-- Switch boxes -->
  <rect x="720" y="100" width="200" height="140" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="820" y="178" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333" font-family="sans-serif">Switch A</text>
  <text x="820" y="210" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">SAN Fabric</text>

  <rect x="720" y="310" width="200" height="140" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="820" y="388" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333" font-family="sans-serif">Switch B</text>
  <text x="820" y="420" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">SAN Fabric</text>

  <!-- SAN LUN -->
  <rect x="1030" y="190" width="230" height="220" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="1030" y="190" width="230" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="1030" y="230" width="230" height="10" fill="url(#grad-accent)"/>
  <text x="1145" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">SAN LUN</text>
  <text x="1145" y="290" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Storage Array</text>
  <text x="1145" y="318" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Active/Passive</text>
  <text x="1145" y="342" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">or Active/Active</text>

  <!-- Connections server to HBAs -->
  <line x1="250" y1="300" x2="400" y2="175" stroke="#555555" stroke-width="2"/>
  <line x1="250" y1="390" x2="400" y2="385" stroke="#555555" stroke-width="2"/>

  <!-- HBAs to switches -->
  <line x1="600" y1="175" x2="720" y2="175" stroke="#555555" stroke-width="2"/>
  <line x1="600" y1="385" x2="720" y2="385" stroke="#555555" stroke-width="2"/>

  <!-- Switches to SAN -->
  <line x1="920" y1="175" x2="1030" y2="255" stroke="#555555" stroke-width="2"/>
  <line x1="920" y1="385" x2="1030" y2="335" stroke="#555555" stroke-width="2"/>
</svg>

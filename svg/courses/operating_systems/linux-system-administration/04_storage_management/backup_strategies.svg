<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Four strategy boxes -->
  <rect x="20" y="160" width="280" height="300" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="20" y="160" width="280" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="20" y="205" width="280" height="10" fill="url(#grad-accent)"/>
  <text x="160" y="197" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Full Backup</text>
  <text x="160" y="265" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Everything every time</text>
  <text x="160" y="295" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Weekly</text>
  <text x="160" y="345" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Slowest, largest</text>
  <text x="160" y="370" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Simplest restore</text>

  <line x1="300" y1="310" x2="330" y2="310" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="332" y="160" width="280" height="300" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="332" y="160" width="280" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="332" y="205" width="280" height="10" fill="url(#grad-accent)"/>
  <text x="472" y="197" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Differential</text>
  <text x="472" y="265" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Changes since last full</text>
  <text x="472" y="295" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Grows each day</text>
  <text x="472" y="345" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">2 sets to restore</text>
  <text x="472" y="370" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Medium size</text>

  <line x1="612" y1="310" x2="642" y2="310" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="644" y="160" width="280" height="300" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="644" y="160" width="280" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="644" y="205" width="280" height="10" fill="url(#grad-accent)"/>
  <text x="784" y="197" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Incremental</text>
  <text x="784" y="265" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Changes since last backup</text>
  <text x="784" y="295" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Smallest, fastest</text>
  <text x="784" y="345" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Multiple sets needed</text>
  <text x="784" y="370" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Complex restore</text>

  <line x1="924" y1="310" x2="954" y2="310" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="956" y="160" width="295" height="300" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="956" y="160" width="295" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="956" y="205" width="295" height="10" fill="url(#grad-accent)"/>
  <text x="1103" y="197" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Snapshot</text>
  <text x="1103" y="265" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Point-in-time copy</text>
  <text x="1103" y="295" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Near-instant</text>
  <text x="1103" y="345" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">LVM / ZFS / Btrfs</text>
  <text x="1103" y="370" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Space-efficient</text>
</svg>

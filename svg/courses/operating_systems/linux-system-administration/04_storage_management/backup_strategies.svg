<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="168.8889" width="262.5" height="241.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="168.8889" width="262.5" height="44.3056" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="205.1389" width="262.5" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="190" y="198.6944" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Full Backup</text>
  <text x="190" y="253.4723" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Everything every time</text>
  <text x="190" y="277.6389" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Weekly</text>
  <text x="190" y="317.9167" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Slowest, largest</text>
  <text x="190" y="338.0556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Simplest restore</text>
  <line x1="321.25" y1="289.7223" x2="349.375" y2="289.7223" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="351.25" y="168.8889" width="262.5" height="241.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="351.25" y="168.8889" width="262.5" height="44.3056" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="351.25" y="205.1389" width="262.5" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="482.5" y="198.6944" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Differential</text>
  <text x="482.5" y="253.4723" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Changes since last full</text>
  <text x="482.5" y="277.6389" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Grows each day</text>
  <text x="482.5" y="317.9167" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">2 sets to restore</text>
  <text x="482.5" y="338.0556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Medium size</text>
  <line x1="613.75" y1="289.7223" x2="641.875" y2="289.7223" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="643.7499" y="168.8889" width="262.5" height="241.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="643.7499" y="168.8889" width="262.5" height="44.3056" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="643.7499" y="205.1389" width="262.5" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="775" y="198.6944" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Incremental</text>
  <text x="775" y="253.4723" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Changes since last backup</text>
  <text x="775" y="277.6389" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Smallest, fastest</text>
  <text x="775" y="317.9167" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Multiple sets needed</text>
  <text x="775" y="338.0556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Complex restore</text>
  <line x1="906.2499" y1="289.7223" x2="934.375" y2="289.7223" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="936.25" y="168.8889" width="276.5625" height="241.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="936.25" y="168.8889" width="276.5625" height="44.3056" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="936.25" y="205.1389" width="276.5625" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1074.0624" y="198.6944" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Snapshot</text>
  <text x="1074.0624" y="253.4723" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Point-in-time copy</text>
  <text x="1074.0624" y="277.6389" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Near-instant</text>
  <text x="1074.0624" y="317.9167" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">LVM / ZFS / Btrfs</text>
  <text x="1074.0624" y="338.0556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Space-efficient</text>
</svg>
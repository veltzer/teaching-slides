<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="272.948822" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.478351"/>
  <rect x="40" y="40" width="272.948822" height="106.333425" fill="url(#grad-primary)" rx="9.478351" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="126.999989" width="272.948822" height="19.333436" fill="url(#grad-primary)" rx="9.478351" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.474411" y="111.53319" text-anchor="middle" font-size="24.710851" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Full Backup</text>
  <text x="176.474411" y="243.000131" text-anchor="middle" font-size="20.592351" fill="var(--text)" font-family="Arial, sans-serif">Everything every time</text>
  <text x="176.474411" y="300.999964" text-anchor="middle" font-size="20.592351" fill="var(--text-muted)" font-family="Arial, sans-serif">Weekly</text>
  <text x="176.474411" y="397.66667" text-anchor="middle" font-size="19.219411" fill="var(--text-muted)" font-family="Arial, sans-serif">Slowest, largest</text>
  <text x="176.474411" y="446.000024" text-anchor="middle" font-size="19.219411" fill="var(--text-muted)" font-family="Arial, sans-serif">Simplest restore</text>
  <line x1="312.948822" y1="330.00012" x2="342.193339" y2="330.00012" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="344.142973" y="40" width="272.948822" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.478351"/>
  <rect x="344.142973" y="40" width="272.948822" height="106.333425" fill="url(#grad-primary)" rx="9.478351" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="344.142973" y="126.999989" width="272.948822" height="19.333436" fill="url(#grad-primary)" rx="9.478351" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480.617384" y="111.53319" text-anchor="middle" font-size="24.710851" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Differential</text>
  <text x="480.617384" y="243.000131" text-anchor="middle" font-size="20.592351" fill="var(--text)" font-family="Arial, sans-serif">Changes since last full</text>
  <text x="480.617384" y="300.999964" text-anchor="middle" font-size="20.592351" fill="var(--text-muted)" font-family="Arial, sans-serif">Grows each day</text>
  <text x="480.617384" y="397.66667" text-anchor="middle" font-size="19.219411" fill="var(--text-muted)" font-family="Arial, sans-serif">2 sets to restore</text>
  <text x="480.617384" y="446.000024" text-anchor="middle" font-size="19.219411" fill="var(--text-muted)" font-family="Arial, sans-serif">Medium size</text>
  <line x1="617.091795" y1="330.00012" x2="646.336312" y2="330.00012" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="648.285842" y="40" width="272.948822" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.478351"/>
  <rect x="648.285842" y="40" width="272.948822" height="106.333425" fill="url(#grad-primary)" rx="9.478351" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="648.285842" y="126.999989" width="272.948822" height="19.333436" fill="url(#grad-primary)" rx="9.478351" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.760357" y="111.53319" text-anchor="middle" font-size="24.710851" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Incremental</text>
  <text x="784.760357" y="243.000131" text-anchor="middle" font-size="20.592351" fill="var(--text)" font-family="Arial, sans-serif">Changes since last backup</text>
  <text x="784.760357" y="300.999964" text-anchor="middle" font-size="20.592351" fill="var(--text-muted)" font-family="Arial, sans-serif">Smallest, fastest</text>
  <text x="784.760357" y="397.66667" text-anchor="middle" font-size="19.219411" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple sets needed</text>
  <text x="784.760357" y="446.000024" text-anchor="middle" font-size="19.219411" fill="var(--text-muted)" font-family="Arial, sans-serif">Complex restore</text>
  <line x1="921.234665" y1="330.00012" x2="950.479285" y2="330.00012" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="952.42892" y="40" width="287.57108" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.478351"/>
  <rect x="952.42892" y="40" width="287.57108" height="106.333425" fill="url(#grad-primary)" rx="9.478351" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="952.42892" y="126.999989" width="287.57108" height="19.333436" fill="url(#grad-primary)" rx="9.478351" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.726947" y="111.53319" text-anchor="middle" font-size="24.710851" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Snapshot</text>
  <text x="1095.726947" y="243.000131" text-anchor="middle" font-size="20.592351" fill="var(--text)" font-family="Arial, sans-serif">Point-in-time copy</text>
  <text x="1095.726947" y="300.999964" text-anchor="middle" font-size="20.592351" fill="var(--text-muted)" font-family="Arial, sans-serif">Near-instant</text>
  <text x="1095.726947" y="397.66667" text-anchor="middle" font-size="19.219411" fill="var(--text-muted)" font-family="Arial, sans-serif">LVM / ZFS / Btrfs</text>
  <text x="1095.726947" y="446.000024" text-anchor="middle" font-size="19.219411" fill="var(--text-muted)" font-family="Arial, sans-serif">Space-efficient</text>
</svg>

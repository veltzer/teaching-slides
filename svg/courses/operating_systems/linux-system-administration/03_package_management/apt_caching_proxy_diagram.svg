<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="120.5556" width="206.25" height="128.8889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="120.5556" width="206.25" height="36.25" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="148.75" width="206.25" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="161.875" y="144.7223" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Client A</text>
  <text x="161.875" y="189.0277" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">apt install ...</text>
  <rect x="58.75" y="346.1111" width="206.25" height="128.8889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="346.1111" width="206.25" height="36.25" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="374.3056" width="206.25" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="161.875" y="370.2777" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Client B</text>
  <text x="161.875" y="414.5833" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">apt install ...</text>
  <rect x="433.75" y="217.2223" width="318.75" height="161.1111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="433.75" y="217.2223" width="318.75" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="433.75" y="249.4444" width="318.75" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="593.1249" y="243" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">apt-cacher-ng</text>
  <text x="593.1249" y="285.6944" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">Port 3142</text>
  <text x="593.1249" y="305.8333" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Caches downloaded packages</text>
  <text x="593.1249" y="325.9723" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Serves from cache on hit</text>
  <text x="593.1249" y="360.6111" text-anchor="middle" font-size="11.2974" fill="var(--primary-accent)" font-family="sans-serif">Saves bandwidth</text>
  <rect x="921.25" y="217.2223" width="290.625" height="161.1111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="921.25" y="217.2223" width="290.625" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="921.25" y="249.4444" width="290.625" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1066.5624" y="243" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Ubuntu Archive</text>
  <text x="1066.5624" y="285.6944" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">archive.ubuntu.com</text>
  <text x="1066.5624" y="305.8333" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Fetched only on</text>
  <text x="1066.5624" y="321.9444" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">cache miss</text>
  <line x1="265" y1="185" x2="433.75" y2="277.6389" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="265" y1="410.5556" x2="433.75" y2="309.8611" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="752.5" y1="297.7777" x2="921.25" y2="297.7777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="836.875" y="285.6944" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">cache miss</text>
</svg>
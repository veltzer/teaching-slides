<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Client A -->
  <rect x="20" y="100" width="220" height="160" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="20" y="100" width="220" height="45" fill="url(#grad-accent)" rx="10"/>
  <rect x="20" y="135" width="220" height="10" fill="url(#grad-accent)"/>
  <text x="130" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="sans-serif">Client A</text>
  <text x="130" y="185" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">apt install ...</text>

  <!-- Client B -->
  <rect x="20" y="380" width="220" height="160" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="20" y="380" width="220" height="45" fill="url(#grad-accent)" rx="10"/>
  <rect x="20" y="415" width="220" height="10" fill="url(#grad-accent)"/>
  <text x="130" y="410" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="sans-serif">Client B</text>
  <text x="130" y="465" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">apt install ...</text>

  <!-- Cache proxy -->
  <rect x="420" y="220" width="340" height="200" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="3" rx="12" filter="url(#shadow)"/>
  <rect x="420" y="220" width="340" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="420" y="260" width="340" height="10" fill="url(#grad-accent)"/>
  <text x="590" y="252" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">apt-cacher-ng</text>
  <text x="590" y="305" text-anchor="middle" font-size="16" fill="#333333" font-family="sans-serif">Port 3142</text>
  <text x="590" y="330" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Caches downloaded packages</text>
  <text x="590" y="355" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Serves from cache on hit</text>
  <text x="590" y="398" text-anchor="middle" font-size="13" fill="#1565c0" font-family="sans-serif">Saves bandwidth</text>

  <!-- Ubuntu archive -->
  <rect x="940" y="220" width="310" height="200" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="940" y="220" width="310" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="940" y="260" width="310" height="10" fill="url(#grad-accent)"/>
  <text x="1095" y="252" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Ubuntu Archive</text>
  <text x="1095" y="305" text-anchor="middle" font-size="14" fill="#333333" font-family="sans-serif">archive.ubuntu.com</text>
  <text x="1095" y="330" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Fetched only on</text>
  <text x="1095" y="350" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">cache miss</text>

  <!-- Arrows clients to proxy -->
  <line x1="240" y1="180" x2="420" y2="295" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="460" x2="420" y2="335" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow proxy to archive with label -->
  <line x1="760" y1="320" x2="940" y2="320" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="850" y="305" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">cache miss</text>
</svg>

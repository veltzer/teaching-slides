<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="546.428571" height="144.999904" fill="var(--primary-fill)" rx="7.273098" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="313.214286" y="124.928374" text-anchor="middle" font-size="25.282017" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Debian / Ubuntu</text>
  <rect x="693.571429" y="40" width="546.428571" height="144.999904" fill="var(--primary-fill)" rx="7.273098" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="966.785714" y="124.928374" text-anchor="middle" font-size="25.282017" font-weight="bold" fill="var(--bg)" font-family="sans-serif">RHEL / Fedora</text>
  <text x="313.214286" y="236.785519" text-anchor="middle" font-size="16.854678" fill="var(--text-muted)" font-family="sans-serif">High-level tool</text>
  <text x="966.785714" y="236.785519" text-anchor="middle" font-size="16.854678" fill="var(--text-muted)" font-family="sans-serif">High-level tool</text>
  <rect x="72.142857" y="257.49992" width="214.285714" height="134.64296" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.273098" />
  <text x="179.285714" y="335.178536" text-anchor="middle" font-size="23.175243" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">apt</text>
  <text x="179.285714" y="366.250008" text-anchor="middle" font-size="14.747783" fill="var(--text-muted)" font-family="sans-serif">Dependency solver</text>
  <rect x="340" y="257.49992" width="214.285714" height="134.64296" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.273098" />
  <text x="447.142857" y="335.178536" text-anchor="middle" font-size="23.175243" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">dpkg</text>
  <text x="447.142857" y="366.250008" text-anchor="middle" font-size="14.747783" fill="var(--text-muted)" font-family="sans-serif">Low-level installer</text>
  <rect x="725.714286" y="257.49992" width="214.285714" height="134.64296" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.273098" />
  <text x="832.857143" y="335.178536" text-anchor="middle" font-size="23.175243" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">dnf/yum</text>
  <text x="832.857143" y="366.250008" text-anchor="middle" font-size="14.747783" fill="var(--text-muted)" font-family="sans-serif">Dependency solver</text>
  <rect x="993.571429" y="257.49992" width="214.285714" height="134.64296" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.273098" />
  <text x="1100.714286" y="335.178536" text-anchor="middle" font-size="23.175243" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">rpm</text>
  <text x="1100.714286" y="366.250008" text-anchor="middle" font-size="14.747783" fill="var(--text-muted)" font-family="sans-serif">Low-level installer</text>
  <rect x="72.142857" y="506.07144" width="214.285714" height="113.92856" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.273098" />
  <text x="179.285714" y="571.321442" text-anchor="middle" font-size="21.068469" fill="var(--text)" font-family="monospace">.deb</text>
  <text x="179.285714" y="597.214185" text-anchor="middle" font-size="13.694517" fill="var(--text-muted)" font-family="sans-serif">Package format</text>
  <rect x="725.714286" y="506.07144" width="214.285714" height="113.92856" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.273098" />
  <text x="832.857143" y="571.321442" text-anchor="middle" font-size="21.068469" fill="var(--text)" font-family="monospace">.rpm</text>
  <text x="832.857143" y="597.214185" text-anchor="middle" font-size="13.694517" fill="var(--text-muted)" font-family="sans-serif">Package format</text>
  <line x1="179.285714" y1="392.142752" x2="179.285714" y2="506.07144" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="447.142857" y1="392.142752" x2="318.571429" y2="506.07144" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="832.857143" y1="392.142752" x2="832.857143" y2="506.07144" stroke="var(--text-muted)" stroke-width="1.3333" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="72.2223" width="478.125" height="112.7777" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="354.0625" y="138.2777" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Debian / Ubuntu</text>
  <rect x="686.875" y="72.2223" width="478.125" height="112.7777" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="925.9375" y="138.2777" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--bg)" font-family="sans-serif">RHEL / Fedora</text>
  <text x="354.0625" y="225.2777" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)" font-family="sans-serif">High-level tool</text>
  <text x="925.9375" y="225.2777" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)" font-family="sans-serif">High-level tool</text>
  <rect x="143.125" y="241.3889" width="187.5" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="236.875" y="301.8056" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">apt</text>
  <text x="236.875" y="325.9723" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Dependency solver</text>
  <rect x="377.5" y="241.3889" width="187.5" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="471.25" y="301.8056" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">dpkg</text>
  <text x="471.25" y="325.9723" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Low-level installer</text>
  <rect x="715" y="241.3889" width="187.5" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="808.75" y="301.8056" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">dnf/yum</text>
  <text x="808.75" y="325.9723" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Dependency solver</text>
  <rect x="949.375" y="241.3889" width="187.5" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="1043.125" y="301.8056" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">rpm</text>
  <text x="1043.125" y="325.9723" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Low-level installer</text>
  <rect x="143.125" y="434.7223" width="187.5" height="88.6111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="236.875" y="485.4723" text-anchor="middle" font-size="17.3806" fill="var(--text)" font-family="monospace">.deb</text>
  <text x="236.875" y="505.6111" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Package format</text>
  <rect x="715" y="434.7223" width="187.5" height="88.6111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="808.75" y="485.4723" text-anchor="middle" font-size="17.3806" fill="var(--text)" font-family="monospace">.rpm</text>
  <text x="808.75" y="505.6111" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Package format</text>
  <line x1="236.875" y1="346.1111" x2="236.875" y2="434.7223" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="471.25" y1="346.1111" x2="358.75" y2="434.7223" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="808.75" y1="346.1111" x2="808.75" y2="434.7223" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="1043.125" y1="346.1111" x2="930.6249" y2="434.7223" stroke="var(--text-muted)" stroke-width="1.3333" />
</svg>
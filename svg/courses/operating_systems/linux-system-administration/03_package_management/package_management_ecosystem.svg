<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="546.428571" height="144.999904" fill="url(#grad-primary)" rx="7.273098" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="313.214286" y="124.928374" text-anchor="middle" font-size="25.282017" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Debian / Ubuntu</text>
  <rect x="693.571429" y="40" width="546.428571" height="144.999904" fill="url(#grad-primary)" rx="7.273098" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="966.785714" y="124.928374" text-anchor="middle" font-size="25.282017" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">RHEL / Fedora</text>
  <text x="313.214286" y="236.785519" text-anchor="middle" font-size="16.854678" fill="var(--text-muted)" font-family="Arial, sans-serif">High-level tool</text>
  <text x="966.785714" y="236.785519" text-anchor="middle" font-size="16.854678" fill="var(--text-muted)" font-family="Arial, sans-serif">High-level tool</text>
  <rect x="72.142857" y="257.49992" width="214.285714" height="134.64296" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.273098"/>
  <text x="179.285714" y="335.178536" text-anchor="middle" font-size="23.175243" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">apt</text>
  <text x="179.285714" y="366.250008" text-anchor="middle" font-size="14.747783" fill="var(--text-muted)" font-family="Arial, sans-serif">Dependency solver</text>
  <rect x="340" y="257.49992" width="214.285714" height="134.64296" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.273098"/>
  <text x="447.142857" y="335.178536" text-anchor="middle" font-size="23.175243" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">dpkg</text>
  <text x="447.142857" y="366.250008" text-anchor="middle" font-size="14.747783" fill="var(--text-muted)" font-family="Arial, sans-serif">Low-level installer</text>
  <rect x="725.714286" y="257.49992" width="214.285714" height="134.64296" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.273098"/>
  <text x="832.857143" y="335.178536" text-anchor="middle" font-size="23.175243" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">dnf/yum</text>
  <text x="832.857143" y="366.250008" text-anchor="middle" font-size="14.747783" fill="var(--text-muted)" font-family="Arial, sans-serif">Dependency solver</text>
  <rect x="993.571429" y="257.49992" width="214.285714" height="134.64296" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.273098"/>
  <text x="1100.714286" y="335.178536" text-anchor="middle" font-size="23.175243" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">rpm</text>
  <text x="1100.714286" y="366.250008" text-anchor="middle" font-size="14.747783" fill="var(--text-muted)" font-family="Arial, sans-serif">Low-level installer</text>
  <rect x="72.142857" y="506.07144" width="214.285714" height="113.92856" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.273098"/>
  <text x="179.285714" y="571.321442" text-anchor="middle" font-size="21.068469" fill="var(--text)" font-family="Courier New, monospace">.deb</text>
  <text x="179.285714" y="597.214185" text-anchor="middle" font-size="13.694517" fill="var(--text-muted)" font-family="Arial, sans-serif">Package format</text>
  <rect x="725.714286" y="506.07144" width="214.285714" height="113.92856" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.273098"/>
  <text x="832.857143" y="571.321442" text-anchor="middle" font-size="21.068469" fill="var(--text)" font-family="Courier New, monospace">.rpm</text>
  <text x="832.857143" y="597.214185" text-anchor="middle" font-size="13.694517" fill="var(--text-muted)" font-family="Arial, sans-serif">Package format</text>
  <line x1="179.285714" y1="392.142752" x2="179.285714" y2="506.07144" stroke="var(--text-muted)" stroke-width="1.3333"/>
  <line x1="447.142857" y1="392.142752" x2="318.571429" y2="506.07144" stroke="var(--text-muted)" stroke-width="1.3333"/>
  <line x1="832.857143" y1="392.142752" x2="832.857143" y2="506.07144" stroke="var(--text-muted)" stroke-width="1.3333"/>
  <line x1="1100.714286" y1="392.142752" x2="972.142743" y2="506.07144" stroke="var(--text-muted)" stroke-width="1.3333"/>
</svg>

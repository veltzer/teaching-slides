<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Debian / Ubuntu column -->
  <rect x="80" y="40" width="510" height="140" fill="url(#grad-accent)" rx="12" filter="url(#shadow)"/>
  <text x="335" y="122" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">Debian / Ubuntu</text>

  <!-- RHEL / Fedora column -->
  <rect x="690" y="40" width="510" height="140" fill="url(#grad-accent)" rx="12" filter="url(#shadow)"/>
  <text x="945" y="122" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">RHEL / Fedora</text>

  <!-- High-level labels -->
  <text x="335" y="230" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">High-level tool</text>
  <text x="945" y="230" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">High-level tool</text>

  <!-- apt box -->
  <rect x="110" y="250" width="200" height="130" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="210" y="325" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0" font-family="sans-serif">apt</text>
  <text x="210" y="355" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Dependency solver</text>

  <!-- dpkg box -->
  <rect x="360" y="250" width="200" height="130" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="460" y="325" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0" font-family="sans-serif">dpkg</text>
  <text x="460" y="355" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Low-level installer</text>

  <!-- dnf/yum box -->
  <rect x="720" y="250" width="200" height="130" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="820" y="325" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0" font-family="sans-serif">dnf/yum</text>
  <text x="820" y="355" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Dependency solver</text>

  <!-- rpm box -->
  <rect x="970" y="250" width="200" height="130" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="1070" y="325" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0" font-family="sans-serif">rpm</text>
  <text x="1070" y="355" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Low-level installer</text>

  <!-- Package format boxes -->
  <rect x="110" y="490" width="200" height="110" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="210" y="553" text-anchor="middle" font-size="20" fill="#333333" font-family="monospace">.deb</text>
  <text x="210" y="578" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Package format</text>

  <rect x="720" y="490" width="200" height="110" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="820" y="553" text-anchor="middle" font-size="20" fill="#333333" font-family="monospace">.rpm</text>
  <text x="820" y="578" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Package format</text>

  <!-- Connecting lines -->
  <line x1="210" y1="380" x2="210" y2="490" stroke="#555555" stroke-width="1.5"/>
  <line x1="460" y1="380" x2="340" y2="490" stroke="#555555" stroke-width="1.5"/>
  <line x1="820" y1="380" x2="820" y2="490" stroke="#555555" stroke-width="1.5"/>
  <line x1="1070" y1="380" x2="950" y2="490" stroke="#555555" stroke-width="1.5"/>
</svg>

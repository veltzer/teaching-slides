  <text x="403.75" y="159.2223" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Downloaded</text>
  <text x="403.75" y="205.1389" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Local .deb/.rpm</text>
  <text x="514.375" y="172.9167" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">unpack</text>
  <line x1="497.5" y1="189.0277" x2="549.0625" y2="189.0277" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="551.875" y="136.6667" width="187.5" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="551.875" y="136.6667" width="187.5" height="36.25" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="551.875" y="164.8611" width="187.5" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>

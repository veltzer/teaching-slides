  <text x="645.625" y="205.1389" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Files extracted</text>
  <text x="756.25" y="172.9167" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">configure</text>

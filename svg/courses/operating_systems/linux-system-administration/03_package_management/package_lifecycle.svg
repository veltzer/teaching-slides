  <text x="161.875" y="205.1389" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">In repository</text>
  <text x="272.4999" y="172.9167" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">fetch</text>
  <line x1="255.6249" y1="189.0277" x2="307.1875" y2="189.0277" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="310" y="136.6667" width="187.5" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Installation flow: top row -->
  <rect x="30" y="120" width="200" height="130" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="30" y="120" width="200" height="45" fill="url(#grad-accent)" rx="10"/>
  <rect x="30" y="155" width="200" height="10" fill="url(#grad-accent)"/>
  <text x="130" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="sans-serif">Available</text>
  <text x="130" y="205" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">In repository</text>

  <text x="248" y="165" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">fetch</text>
  <line x1="230" y1="185" x2="285" y2="185" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="288" y="120" width="200" height="130" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="288" y="120" width="200" height="45" fill="url(#grad-accent)" rx="10"/>
  <rect x="288" y="155" width="200" height="10" fill="url(#grad-accent)"/>
  <text x="388" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="sans-serif">Downloaded</text>
  <text x="388" y="205" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Local .deb/.rpm</text>

  <text x="506" y="165" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">unpack</text>
  <line x1="488" y1="185" x2="543" y2="185" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="546" y="120" width="200" height="130" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="546" y="120" width="200" height="45" fill="url(#grad-accent)" rx="10"/>
  <rect x="546" y="155" width="200" height="10" fill="url(#grad-accent)"/>
  <text x="646" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="sans-serif">Unpacked</text>
  <text x="646" y="205" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Files extracted</text>

  <text x="764" y="165" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">configure</text>
  <line x1="746" y1="185" x2="801" y2="185" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="804" y="120" width="200" height="130" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="804" y="120" width="200" height="45" fill="url(#grad-accent)" rx="10"/>
  <rect x="804" y="155" width="200" height="10" fill="url(#grad-accent)"/>
  <text x="904" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="sans-serif">Configured</text>
  <text x="904" y="205" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Post-install done</text>

  <!-- Remove flow: downward from Configured -->
  <text x="940" y="300" font-size="13" fill="#555555" font-family="sans-serif">remove</text>
  <line x1="904" y1="250" x2="904" y2="420" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Removed box -->
  <rect x="546" y="424" width="200" height="130" fill="url(#grad-surface)" stroke="#c62828" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="546" y="424" width="200" height="45" fill="#c62828" rx="10"/>
  <rect x="546" y="459" width="200" height="10" fill="#c62828"/>
  <text x="646" y="452" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="sans-serif">Removed</text>
  <text x="646" y="507" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Files deleted</text>
  <text x="646" y="527" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Config kept</text>

  <text x="802" y="467" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">purge</text>
  <line x1="746" y1="489" x2="801" y2="489" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Purged box -->
  <rect x="804" y="424" width="200" height="130" fill="url(#grad-surface)" stroke="#c62828" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="804" y="424" width="200" height="45" fill="#c62828" rx="10"/>
  <rect x="804" y="459" width="200" height="10" fill="#c62828"/>
  <text x="904" y="452" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="sans-serif">Purged</text>
  <text x="904" y="507" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">Config also gone</text>
</svg>

  <text x="887.5" y="404.1111" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Purged</text>
  <text x="887.5" y="448.4167" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Config also gone</text>
</svg>
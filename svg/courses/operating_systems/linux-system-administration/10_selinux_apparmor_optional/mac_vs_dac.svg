<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- == TOP: DAC vs MAC COMPARISON == -->
  <!-- DAC Column Header -->
  <rect x="96.25" y="67.1875" width="328.125" height="39.875" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="260.3125" y="92.5625" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">DAC - Discretionary Access Control</text>

  <!-- MAC Column Header -->
  <rect x="471.25" y="67.1875" width="328.125" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="635.3125" y="92.5625" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">MAC - Mandatory Access Control</text>

  <!-- DAC content -->
  <rect x="96.25" y="116.125" width="328.125" height="181.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="115" y="137.875" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Access decisions by file owner</text>
  <text x="115" y="156" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; chmod/chown/chgrp set permissions</text>
  <text x="115" y="172.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; Owner can grant any permission</text>
  <text x="115" y="188.625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; root can override everything</text>
  <text x="115" y="204.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; Simple rwxrwxrwx + ACLs</text>
  <text x="115" y="221.25" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; Compromised process = full owner rights</text>
  <text x="115" y="243" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">Risk: compromised nginx can read /etc/shadow</text>
  <text x="115" y="261.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">if running as root or with broad permissions</text>
  <text x="115" y="282.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Used by: all standard Linux systems</text>

  <!-- MAC content -->
  <rect x="471.25" y="116.125" width="328.125" height="181.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="490" y="137.875" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Access decisions by system policy</text>
  <text x="490" y="156" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; Kernel enforces policy regardless of owner</text>
  <text x="490" y="172.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; Policy set by security admin</text>
  <text x="490" y="188.625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; root is restricted by policy</text>
  <text x="490" y="204.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; Each process has a security label/context</text>
  <text x="490" y="221.25" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; Principle of least privilege enforced</text>
  <text x="490" y="243" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Protection: compromised nginx confined to</text>
  <text x="490" y="261.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">its SELinux/AppArmor policy domain only</text>
  <text x="490" y="282.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Used by: RHEL/Ubuntu in production environments</text>

  <!-- == SELINUX SECTION == -->
  <rect x="96.25" y="311.875" width="468.75" height="280.9375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96.25" y="311.875" width="468.75" height="32.625" rx="6" fill="var(--danger-accent)"/>
  <rect x="96.25" y="328.1875" width="468.75" height="16.3125" fill="var(--danger-accent)" rx="6"/>
  <text x="330.625" y="333.625" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">SELinux (RHEL / Fedora / CentOS)</text>

  <text x="115" y="360.8125" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--danger-accent)">Security Context Format:</text>
  <rect x="115" y="368.0625" width="431.25" height="29" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="321.25" y="387.0938" font-family="monospace" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">user:role:type:level</text>

  <text x="115" y="413.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Example: system_u:system_r:httpd_t:s0</text>
  <text x="115" y="429.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; user: SELinux user identity (system_u, unconfined_u)</text>
  <text x="115" y="446" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; role: what roles that user can assume (system_r)</text>
  <text x="115" y="462.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; type: domain of process or label of file (httpd_t)</text>
  <text x="115" y="478.625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">&#x2022; level: MLS sensitivity (s0 = unclassified)</text>

  <text x="115" y="498.5625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--danger-accent)">Enforcement Modes:</text>
  <text x="115" y="514.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Enforcing - denies and logs; Permissive - logs only; Disabled - off</text>

  <text x="115" y="533" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--danger-accent)">Key Tools:</text>
  <text x="115" y="549.3125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">getenforce / setenforce 1</text>
  <text x="302.5" y="549.3125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">ls -Z  # show context</text>
  <text x="115" y="563.8125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">chcon -t httpd_t /var/www/html/file</text>
  <text x="115" y="578.3125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">ausearch -m avc  # audit denials</text>
  <text x="115" y="592.8125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">audit2allow -a  # generate policy</text>

  <!-- == APPARMOR SECTION == -->
  <rect x="593.125" y="311.875" width="468.75" height="280.9375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="593.125" y="311.875" width="468.75" height="32.625" rx="6" fill="var(--ok-accent)"/>
  <rect x="593.125" y="328.1875" width="468.75" height="16.3125" fill="var(--ok-accent)" rx="6"/>
  <text x="827.5" y="333.625" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">AppArmor (Ubuntu / SUSE)</text>

  <text x="611.875" y="360.8125" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Profile-Based (path-based):</text>
  <rect x="611.875" y="368.0625" width="431.25" height="29" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="827.5" y="387.0938" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">/etc/apparmor.d/usr.sbin.nginx</text>

  <text x="611.875" y="413.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Profiles define allowed paths, capabilities, network:</text>
  <text x="611.875" y="429.6875" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">/usr/sbin/nginx {</text>
  <text x="611.875" y="446" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  /var/www/html/** r,</text>
  <text x="611.875" y="462.3125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  /var/log/nginx/*.log w,</text>
  <text x="611.875" y="478.625" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  network tcp,</text>
  <text x="611.875" y="494.9375" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">}</text>

  <text x="611.875" y="514.875" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Enforcement Modes:</text>
  <text x="611.875" y="531.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">enforce - deny violations; complain - log only; disabled - off</text>

  <text x="611.875" y="549.3125" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Key Tools:</text>
  <text x="611.875" y="565.625" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">aa-status  # show profiles</text>
  <text x="808.75" y="565.625" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">aa-enforce /path/to/profile</text>
  <text x="611.875" y="580.125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">aa-complain nginx  # switch to log</text>
  <text x="611.875" y="594.625" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">aa-genprof /usr/sbin/nginx</text>

  <!-- Right column: summary -->
  <rect x="1080.625" y="67.1875" width="129.375" height="525.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1145.3125" y="89.8438" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Quick Ref</text>
  <text x="1090" y="110.6875" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--danger-accent)">SELinux</text>
  <text x="1090" y="127" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">RHEL/Fedora</text>
  <text x="1090" y="141.5" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Label-based</text>
  <text x="1090" y="156" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">user:role:type</text>
  <text x="1090" y="170.5" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Powerful</text>
  <text x="1090" y="185" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Complex</text>
  <text x="1090" y="199.5" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">NSA origin</text>

  <line x1="1090" y1="208.5625" x2="1200.625" y2="208.5625" stroke="var(--border)" stroke-width="1"/>

  <text x="1090" y="224.875" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">AppArmor</text>
  <text x="1090" y="241.1875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Ubuntu/SUSE</text>
  <text x="1090" y="255.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Path-based</text>
  <text x="1090" y="270.1875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Profiles</text>
  <text x="1090" y="284.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Simpler</text>
  <text x="1090" y="299.1875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Easier audit</text>
  <text x="1090" y="313.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Novell origin</text>

  <line x1="1090" y1="322.75" x2="1200.625" y2="322.75" stroke="var(--border)" stroke-width="1"/>

  <text x="1090" y="340.875" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Shared</text>
  <text x="1090" y="357.1875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Kernel LSM</text>
  <text x="1090" y="371.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">enforce mode</text>
  <text x="1090" y="386.1875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">audit logs</text>
  <text x="1090" y="400.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">complain/log</text>
  <text x="1090" y="415.1875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">defense-in-</text>
  <text x="1090" y="429.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">depth layer</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- == TOP: DAC vs MAC COMPARISON == -->
  <!-- DAC Column Header -->
  <rect x="60" y="30" width="350" height="44" rx="8" fill="var(--warn)" filter="url(#shadow)"/>
  <text x="235" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">DAC - Discretionary Access Control</text>

  <!-- MAC Column Header -->
  <rect x="460" y="30" width="350" height="44" rx="8" fill="var(--primary)" filter="url(#shadow)"/>
  <text x="635" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">MAC - Mandatory Access Control</text>

  <!-- DAC content -->
  <rect x="60" y="84" width="350" height="200" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="80" y="108" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-mid)">Access decisions by file owner</text>
  <text x="80" y="128" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; chmod/chown/chgrp set permissions</text>
  <text x="80" y="146" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Owner can grant any permission</text>
  <text x="80" y="164" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; root can override everything</text>
  <text x="80" y="182" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Simple rwxrwxrwx + ACLs</text>
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Compromised process = full owner rights</text>
  <text x="80" y="224" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)">Risk: compromised nginx can read /etc/shadow</text>
  <text x="80" y="244" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)">if running as root or with broad permissions</text>
  <text x="80" y="268" font-family="Arial, sans-serif" font-size="11" fill="var(--text-lighter)">Used by: all standard Linux systems</text>

  <!-- MAC content -->
  <rect x="460" y="84" width="350" height="200" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="480" y="108" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Access decisions by system policy</text>
  <text x="480" y="128" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Kernel enforces policy regardless of owner</text>
  <text x="480" y="146" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Policy set by security admin</text>
  <text x="480" y="164" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; root is restricted by policy</text>
  <text x="480" y="182" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Each process has a security label/context</text>
  <text x="480" y="200" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Principle of least privilege enforced</text>
  <text x="480" y="224" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">Protection: compromised nginx confined to</text>
  <text x="480" y="244" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">its SELinux/AppArmor policy domain only</text>
  <text x="480" y="268" font-family="Arial, sans-serif" font-size="11" fill="var(--text-lighter)">Used by: RHEL/Ubuntu in production environments</text>

  <!-- == SELINUX SECTION == -->
  <rect x="60" y="300" width="500" height="310" rx="8" fill="var(--danger-pale3)" stroke="var(--danger)" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="300" width="500" height="36" rx="8" fill="var(--danger-dk)"/>
  <rect x="60" y="318" width="500" height="18" fill="var(--danger-dk)"/>
  <text x="310" y="324" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">SELinux (RHEL / Fedora / CentOS)</text>

  <text x="80" y="354" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-dk)">Security Context Format:</text>
  <rect x="80" y="362" width="460" height="32" rx="4" fill="var(--bg)" stroke="var(--danger-light)" stroke-width="1"/>
  <text x="300" y="383" font-family="monospace" font-size="14" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">user:role:type:level</text>

  <text x="80" y="412" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Example: system_u:system_r:httpd_t:s0</text>
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; user: SELinux user identity (system_u, unconfined_u)</text>
  <text x="80" y="448" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; role: what roles that user can assume (system_r)</text>
  <text x="80" y="466" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; type: domain of process or label of file (httpd_t)</text>
  <text x="80" y="484" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; level: MLS sensitivity (s0 = unclassified)</text>

  <text x="80" y="506" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-dk)">Enforcement Modes:</text>
  <text x="80" y="524" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Enforcing - denies and logs; Permissive - logs only; Disabled - off</text>

  <text x="80" y="544" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-dk)">Key Tools:</text>
  <text x="80" y="562" font-family="monospace" font-size="11" fill="var(--text-muted)">getenforce / setenforce 1</text>
  <text x="280" y="562" font-family="monospace" font-size="11" fill="var(--text-muted)">ls -Z  # show context</text>
  <text x="80" y="578" font-family="monospace" font-size="11" fill="var(--text-muted)">chcon -t httpd_t /var/www/html/file</text>
  <text x="80" y="594" font-family="monospace" font-size="11" fill="var(--text-muted)">ausearch -m avc  # audit denials</text>
  <text x="80" y="610" font-family="monospace" font-size="11" fill="var(--text-muted)">audit2allow -a  # generate policy</text>

  <!-- == APPARMOR SECTION == -->
  <rect x="590" y="300" width="500" height="310" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="590" y="300" width="500" height="36" rx="8" fill="var(--ok-dk)"/>
  <rect x="590" y="318" width="500" height="18" fill="var(--ok-dk)"/>
  <text x="840" y="324" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">AppArmor (Ubuntu / SUSE)</text>

  <text x="610" y="354" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Profile-Based (path-based):</text>
  <rect x="610" y="362" width="460" height="32" rx="4" fill="var(--bg)" stroke="var(--ok-light)" stroke-width="1"/>
  <text x="840" y="383" font-family="monospace" font-size="13" fill="var(--ok-dk)" text-anchor="middle">/etc/apparmor.d/usr.sbin.nginx</text>

  <text x="610" y="412" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Profiles define allowed paths, capabilities, network:</text>
  <text x="610" y="430" font-family="monospace" font-size="11" fill="var(--text-muted)">/usr/sbin/nginx {</text>
  <text x="610" y="448" font-family="monospace" font-size="11" fill="var(--text-muted)">  /var/www/html/** r,</text>
  <text x="610" y="466" font-family="monospace" font-size="11" fill="var(--text-muted)">  /var/log/nginx/*.log w,</text>
  <text x="610" y="484" font-family="monospace" font-size="11" fill="var(--text-muted)">  network tcp,</text>
  <text x="610" y="502" font-family="monospace" font-size="11" fill="var(--text-muted)">}</text>

  <text x="610" y="524" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Enforcement Modes:</text>
  <text x="610" y="542" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">enforce - deny violations; complain - log only; disabled - off</text>

  <text x="610" y="562" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Key Tools:</text>
  <text x="610" y="580" font-family="monospace" font-size="11" fill="var(--text-muted)">aa-status  # show profiles</text>
  <text x="820" y="580" font-family="monospace" font-size="11" fill="var(--text-muted)">aa-enforce /path/to/profile</text>
  <text x="610" y="596" font-family="monospace" font-size="11" fill="var(--text-muted)">aa-complain nginx  # switch to log</text>
  <text x="610" y="612" font-family="monospace" font-size="11" fill="var(--text-muted)">aa-genprof /usr/sbin/nginx</text>

  <!-- Right column: summary -->
  <rect x="1110" y="30" width="138" height="580" rx="8" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="1"/>
  <text x="1179" y="55" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Quick Ref</text>
  <text x="1120" y="78" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--danger-dk)">SELinux</text>
  <text x="1120" y="96" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">RHEL/Fedora</text>
  <text x="1120" y="112" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Label-based</text>
  <text x="1120" y="128" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">user:role:type</text>
  <text x="1120" y="144" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Powerful</text>
  <text x="1120" y="160" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Complex</text>
  <text x="1120" y="176" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">NSA origin</text>

  <line x1="1120" y1="186" x2="1238" y2="186" stroke="var(--border-faint)" stroke-width="1"/>

  <text x="1120" y="204" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">AppArmor</text>
  <text x="1120" y="222" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Ubuntu/SUSE</text>
  <text x="1120" y="238" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Path-based</text>
  <text x="1120" y="254" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Profiles</text>
  <text x="1120" y="270" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Simpler</text>
  <text x="1120" y="286" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Easier audit</text>
  <text x="1120" y="302" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Novell origin</text>

  <line x1="1120" y1="312" x2="1238" y2="312" stroke="var(--border-faint)" stroke-width="1"/>

  <text x="1120" y="332" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">Shared</text>
  <text x="1120" y="350" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Kernel LSM</text>
  <text x="1120" y="366" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">enforce mode</text>
  <text x="1120" y="382" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">audit logs</text>
  <text x="1120" y="398" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">complain/log</text>
  <text x="1120" y="414" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">defense-in-</text>
  <text x="1120" y="430" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">depth layer</text>
</svg>

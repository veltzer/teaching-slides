<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- == TOP: DAC vs MAC COMPARISON == -->
  <!-- DAC Column Header -->
  <rect x="60" y="30" width="350" height="44" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="235" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">DAC - Discretionary Access Control</text>

  <!-- MAC Column Header -->
  <rect x="460" y="30" width="350" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="635" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">MAC - Mandatory Access Control</text>

  <!-- DAC content -->
  <rect x="60" y="84" width="350" height="200" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="80" y="108" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">Access decisions by file owner</text>
  <text x="80" y="128" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; chmod/chown/chgrp set permissions</text>
  <text x="80" y="146" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Owner can grant any permission</text>
  <text x="80" y="164" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; root can override everything</text>
  <text x="80" y="182" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Simple rwxrwxrwx + ACLs</text>
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Compromised process = full owner rights</text>
  <text x="80" y="224" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">Risk: compromised nginx can read /etc/shadow</text>
  <text x="80" y="244" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">if running as root or with broad permissions</text>
  <text x="80" y="268" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Used by: all standard Linux systems</text>

  <!-- MAC content -->
  <rect x="460" y="84" width="350" height="200" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="480" y="108" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Access decisions by system policy</text>
  <text x="480" y="128" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Kernel enforces policy regardless of owner</text>
  <text x="480" y="146" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Policy set by security admin</text>
  <text x="480" y="164" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; root is restricted by policy</text>
  <text x="480" y="182" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Each process has a security label/context</text>
  <text x="480" y="200" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Principle of least privilege enforced</text>
  <text x="480" y="224" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Protection: compromised nginx confined to</text>
  <text x="480" y="244" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">its SELinux/AppArmor policy domain only</text>
  <text x="480" y="268" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Used by: RHEL/Ubuntu in production environments</text>

  <!-- == SELINUX SECTION == -->
  <rect x="60" y="300" width="500" height="310" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="300" width="500" height="36" rx="6" fill="var(--danger-accent)"/>
  <rect x="60" y="318" width="500" height="18" fill="var(--danger-accent)" rx="6"/>
  <text x="310" y="324" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">SELinux (RHEL / Fedora / CentOS)</text>

  <text x="80" y="354" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)">Security Context Format:</text>
  <rect x="80" y="362" width="460" height="32" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="300" y="383" font-family="monospace" font-size="14" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">user:role:type:level</text>

  <text x="80" y="412" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Example: system_u:system_r:httpd_t:s0</text>
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; user: SELinux user identity (system_u, unconfined_u)</text>
  <text x="80" y="448" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; role: what roles that user can assume (system_r)</text>
  <text x="80" y="466" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; type: domain of process or label of file (httpd_t)</text>
  <text x="80" y="484" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; level: MLS sensitivity (s0 = unclassified)</text>

  <text x="80" y="506" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)">Enforcement Modes:</text>
  <text x="80" y="524" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Enforcing - denies and logs; Permissive - logs only; Disabled - off</text>

  <text x="80" y="544" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)">Key Tools:</text>
  <text x="80" y="562" font-family="monospace" font-size="11" fill="var(--text-muted)">getenforce / setenforce 1</text>
  <text x="280" y="562" font-family="monospace" font-size="11" fill="var(--text-muted)">ls -Z  # show context</text>
  <text x="80" y="578" font-family="monospace" font-size="11" fill="var(--text-muted)">chcon -t httpd_t /var/www/html/file</text>
  <text x="80" y="594" font-family="monospace" font-size="11" fill="var(--text-muted)">ausearch -m avc  # audit denials</text>
  <text x="80" y="610" font-family="monospace" font-size="11" fill="var(--text-muted)">audit2allow -a  # generate policy</text>

  <!-- == APPARMOR SECTION == -->
  <rect x="590" y="300" width="500" height="310" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="590" y="300" width="500" height="36" rx="6" fill="var(--ok-accent)"/>
  <rect x="590" y="318" width="500" height="18" fill="var(--ok-accent)" rx="6"/>
  <text x="840" y="324" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">AppArmor (Ubuntu / SUSE)</text>

  <text x="610" y="354" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Profile-Based (path-based):</text>
  <rect x="610" y="362" width="460" height="32" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="840" y="383" font-family="monospace" font-size="13" fill="var(--ok-accent)" text-anchor="middle">/etc/apparmor.d/usr.sbin.nginx</text>

  <text x="610" y="412" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Profiles define allowed paths, capabilities, network:</text>
  <text x="610" y="430" font-family="monospace" font-size="11" fill="var(--text-muted)">/usr/sbin/nginx {</text>
  <text x="610" y="448" font-family="monospace" font-size="11" fill="var(--text-muted)">  /var/www/html/** r,</text>
  <text x="610" y="466" font-family="monospace" font-size="11" fill="var(--text-muted)">  /var/log/nginx/*.log w,</text>
  <text x="610" y="484" font-family="monospace" font-size="11" fill="var(--text-muted)">  network tcp,</text>
  <text x="610" y="502" font-family="monospace" font-size="11" fill="var(--text-muted)">}</text>

  <text x="610" y="524" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Enforcement Modes:</text>
  <text x="610" y="542" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">enforce - deny violations; complain - log only; disabled - off</text>

  <text x="610" y="562" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Key Tools:</text>
  <text x="610" y="580" font-family="monospace" font-size="11" fill="var(--text-muted)">aa-status  # show profiles</text>
  <text x="820" y="580" font-family="monospace" font-size="11" fill="var(--text-muted)">aa-enforce /path/to/profile</text>
  <text x="610" y="596" font-family="monospace" font-size="11" fill="var(--text-muted)">aa-complain nginx  # switch to log</text>
  <text x="610" y="612" font-family="monospace" font-size="11" fill="var(--text-muted)">aa-genprof /usr/sbin/nginx</text>

  <!-- Right column: summary -->
  <rect x="1110" y="30" width="138" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1179" y="55" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Quick Ref</text>
  <text x="1120" y="78" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--danger-accent)">SELinux</text>
  <text x="1120" y="96" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">RHEL/Fedora</text>
  <text x="1120" y="112" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Label-based</text>
  <text x="1120" y="128" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">user:role:type</text>
  <text x="1120" y="144" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Powerful</text>
  <text x="1120" y="160" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Complex</text>
  <text x="1120" y="176" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">NSA origin</text>

  <line x1="1120" y1="186" x2="1238" y2="186" stroke="var(--border)" stroke-width="1"/>

  <text x="1120" y="204" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)">AppArmor</text>
  <text x="1120" y="222" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Ubuntu/SUSE</text>
  <text x="1120" y="238" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Path-based</text>
  <text x="1120" y="254" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Profiles</text>
  <text x="1120" y="270" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Simpler</text>
  <text x="1120" y="286" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Easier audit</text>
  <text x="1120" y="302" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Novell origin</text>

  <line x1="1120" y1="312" x2="1238" y2="312" stroke="var(--border)" stroke-width="1"/>

  <text x="1120" y="332" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-accent)">Shared</text>
  <text x="1120" y="350" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Kernel LSM</text>
  <text x="1120" y="366" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">enforce mode</text>
  <text x="1120" y="382" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">audit logs</text>
  <text x="1120" y="398" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">complain/log</text>
  <text x="1120" y="414" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">defense-in-</text>
  <text x="1120" y="430" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">depth layer</text>
</svg>

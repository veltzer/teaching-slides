<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="650.526315789474" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.235882783068" font-weight="bold" fill="var(--text)">Helm Release Lifecycle</text>
  <rect x="40" y="102.142857142857" width="252.631578947368" height="517.857142857143" rx="10.441386708238" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.315789473684" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.794496074829" font-weight="bold" fill="var(--info-text)">Install</text>
  <text x="61.052631578947" y="185" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">helm install</text>
  <text x="61.052631578947" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">Render templates</text>
  <text x="61.052631578947" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">Apply manifests</text>
  <path d="M 297.894736842105 361.071428571429 L 350.526315789474 361.071428571429" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="355.789473684211" y="102.142857142857" width="252.631578947368" height="517.857142857143" rx="10.441386708238" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482.105263157895" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.794496074829" font-weight="bold" fill="var(--primary-text)">Upgrade</text>
  <text x="376.842105263158" y="185" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">helm upgrade</text>
  <text x="376.842105263158" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">New revision number</text>
  <text x="376.842105263158" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">Rolling update of pods</text>
  <path d="M 613.684210526316 361.071428571429 L 666.315789473684 361.071428571429" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="671.578947368421" y="102.142857142857" width="252.631578947368" height="517.857142857143" rx="10.441386708238" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="797.894736842105" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.794496074829" font-weight="bold" fill="var(--warn-text)">Rollback</text>
  <text x="692.631578947368" y="185" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">helm rollback</text>
  <text x="692.631578947368" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">To prior revision</text>
  <text x="692.631578947368" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">Saved as Secret</text>
  <path d="M 929.473684210526 361.071428571429 L 982.105263157895 361.071428571429" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="987.368421052632" y="102.142857142857" width="252.631578947368" height="517.857142857143" rx="10.441386708238" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1113.684210526316" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.794496074829" font-weight="bold" fill="var(--ok-text)">Uninstall</text>
  <text x="1008.421052631579" y="185" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">helm uninstall</text>
  <text x="1008.421052631579" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">Removes resources</text>
  <text x="1008.421052631579" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">Keeps PVCs by default</text>
</svg>

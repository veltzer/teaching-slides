<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Kubernetes Control Plane</text>
  <rect x="40" y="80" width="1200" height="280" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Control plane (the brain)</text>
  <rect x="80" y="140" width="270" height="200" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="215" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">API Server</text>
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Front door</text>
  <text x="100" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Auth + admission</text>
  <text x="100" y="250" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Reads / writes etcd</text>

  <rect x="370" y="140" width="270" height="200" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="505" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Scheduler</text>
  <text x="390" y="200" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Picks a node for each pod</text>
  <text x="390" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Considers constraints</text>
  <text x="390" y="250" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Affinity, taints, resources</text>

  <rect x="660" y="140" width="270" height="200" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="795" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Controller Manager</text>
  <text x="680" y="200" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Reconciliation loops</text>
  <text x="680" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Desired vs observed state</text>
  <text x="680" y="250" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Self-heals on failure</text>

  <rect x="950" y="140" width="270" height="200" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1085" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">etcd</text>
  <text x="970" y="200" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Cluster state KV store</text>
  <text x="970" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Source of truth</text>
  <text x="970" y="250" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Back this up</text>

  <rect x="40" y="380" width="1200" height="240" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Worker nodes</text>
  <text x="60" y="455" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">kubelet — agent that runs pods on the node</text>
  <text x="60" y="490" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">kube-proxy — wires service IPs to pod IPs</text>
  <text x="60" y="525" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Container runtime — containerd, CRI-O</text>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">Workloads run here, not on the control plane</text>
</svg>

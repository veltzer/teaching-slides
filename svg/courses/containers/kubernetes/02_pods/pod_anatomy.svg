<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.235882783068" font-weight="bold" fill="var(--text)">Anatomy of a Pod</text>

  <rect x="40" y="80.701754385965" width="1200" height="457.894736842105" rx="14.617941391534" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="82.857142857143" y="121.40350877193" font-family="Arial, sans-serif" font-size="22.971050758124" font-weight="bold" fill="var(--primary-text)">Pod (smallest deployable unit)</text>
  <text x="82.857142857143" y="146.842105263158" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">scheduled together; share network and storage</text>

  <rect x="82.857142857143" y="172.280701754386" width="535.714285714286" height="203.508771929825" rx="10.441386708238" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.714285714286" y="207.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.794496074829" font-weight="bold" fill="var(--ok-text)">Container: app</text>
  <text x="104.285714285714" y="243.508771929825" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">image: myapp:1.4</text>
  <text x="104.285714285714" y="268.947368421053" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">port: 8080</text>
  <text x="104.285714285714" y="294.385964912281" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">resources: cpu/memory limits</text>
  <text x="104.285714285714" y="319.824561403509" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">probes: liveness, readiness</text>
  <text x="104.285714285714" y="350.350877192982" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">env from configmap / secret</text>

  <rect x="661.428571428571" y="172.280701754386" width="535.714285714286" height="203.508771929825" rx="10.441386708238" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="929.285714285714" y="207.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.794496074829" font-weight="bold" fill="var(--warn-text)">Container: sidecar (optional)</text>
  <text x="682.857142857143" y="243.508771929825" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">e.g. log shipper, proxy</text>
  <text x="682.857142857143" y="268.947368421053" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">shares network namespace</text>
  <text x="682.857142857143" y="294.385964912281" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">localhost reaches main</text>
  <text x="682.857142857143" y="319.824561403509" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">shared volumes</text>
  <text x="682.857142857143" y="350.350877192982" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">scaled / killed together</text>

  <rect x="82.857142857143" y="391.052631578947" width="535.714285714286" height="61.052631578947" rx="6.264832024943" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="350.714285714286" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--info-text)">Shared volume(s)</text>

  <rect x="661.428571428571" y="391.052631578947" width="535.714285714286" height="61.052631578947" rx="6.264832024943" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="929.285714285714" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--info-text)">Pod IP (one per pod)</text>

  <rect x="82.857142857143" y="472.456140350877" width="1114.285714285714" height="50.877192982456" rx="6.264832024943" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="502.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text)">labels: app=myapp tier=web env=prod -- match selectors elsewhere</text>

  <rect x="40" y="553.859649122807" width="1200" height="66.140350877193" rx="8.353109366591" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="584.385964912281" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--danger-text)">Pods are ephemeral</text>
  <text x="640" y="609.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--danger-text)">Never apply directly. Use a Deployment so they restart with their identity.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Three storage options for containers</text>

  <rect x="40" y="100" width="380" height="500" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="230" y="155" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Named Volume</text>
  <text x="230" y="195" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Courier New, monospace">-v pg-data:/var/lib/...</text>
  <text x="60" y="245" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• Docker-managed</text>
  <text x="60" y="275" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• Survives removal</text>
  <text x="60" y="305" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• Re-mountable</text>
  <text x="60" y="365" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• Best for prod data</text>
  <text x="60" y="395" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• Faster on Mac / Windows</text>
  <text x="230" y="535" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Courier New, monospace">/var/lib/docker/volumes</text>
  <text x="230" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">use: databases</text>

  <rect x="450" y="100" width="380" height="500" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="640" y="155" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bind Mount</text>
  <text x="640" y="195" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Courier New, monospace">-v "$(pwd)":/app</text>
  <text x="470" y="245" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• Any host path</text>
  <text x="470" y="275" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• You manage everything</text>
  <text x="470" y="335" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• Container writes to host</text>
  <text x="470" y="395" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• Best for dev workflows</text>
  <text x="640" y="535" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Courier New, monospace">any host path</text>
  <text x="640" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">use: dev source mounts</text>

  <rect x="860" y="100" width="380" height="500" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="1050" y="155" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">tmpfs Mount</text>
  <text x="1050" y="195" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Courier New, monospace">--tmpfs /run/secrets</text>
  <text x="880" y="245" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• In-RAM filesystem</text>
  <text x="880" y="275" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• Never touches disk</text>
  <text x="880" y="315" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• Lost when container stops</text>
  <text x="880" y="355" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• Limited by host RAM</text>
  <text x="880" y="395" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">• Linux only</text>
  <text x="1050" y="535" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">RAM (tmpfs)</text>
  <text x="1050" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">use: secrets</text>
  <text x="640" y="620" text-anchor="middle" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">pick by lifecycle, sharing, and durability needs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Containers vs Virtual Machines</text>

  <rect x="40" y="80" width="585" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Virtual Machine</text>
  <rect x="80" y="140" width="505" height="50" rx="5" fill="var(--surface)" stroke="var(--border)"/>
  <text x="332" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">App + libs</text>
  <rect x="80" y="200" width="505" height="50" rx="5" fill="var(--surface)" stroke="var(--border)"/>
  <text x="332" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Guest OS kernel</text>
  <rect x="80" y="260" width="505" height="50" rx="5" fill="var(--surface)" stroke="var(--border)"/>
  <text x="332" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Hypervisor</text>
  <rect x="80" y="320" width="505" height="50" rx="5" fill="var(--surface)" stroke="var(--border)"/>
  <text x="332" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Host OS / hardware</text>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Each VM ships its own OS</text>
  <text x="60" y="440" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">GBs in size, minutes to boot</text>
  <text x="60" y="470" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Strong isolation</text>
  <text x="60" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Run different OSes</text>
  <text x="60" y="565" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Use when isolation is the goal</text>

  <rect x="640" y="80" width="600" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Container</text>
  <rect x="680" y="140" width="520" height="50" rx="5" fill="var(--surface)" stroke="var(--border)"/>
  <text x="940" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">App + libs</text>
  <rect x="680" y="200" width="520" height="50" rx="5" fill="var(--surface)" stroke="var(--border)"/>
  <text x="940" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Container runtime</text>
  <rect x="680" y="260" width="520" height="50" rx="5" fill="var(--surface)" stroke="var(--border)"/>
  <text x="940" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Shared host kernel</text>
  <rect x="680" y="320" width="520" height="50" rx="5" fill="var(--surface)" stroke="var(--border)"/>
  <text x="940" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Host OS / hardware</text>
  <text x="660" y="410" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Containers share the kernel</text>
  <text x="660" y="440" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">MBs in size, milliseconds to start</text>
  <text x="660" y="470" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Process-level isolation</text>
  <text x="660" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Same OS family only</text>
  <text x="660" y="565" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">Use when packaging is the goal</text>
</svg>

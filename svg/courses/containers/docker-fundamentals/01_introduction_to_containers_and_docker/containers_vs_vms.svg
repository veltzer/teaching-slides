<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Virtual machines vs containers</text>

  <!-- VM stack -->
  <text x="280" y="100" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Virtual Machines</text>
  <rect x="40" y="540" width="500" height="80" fill="var(--surface)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="290" y="585" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">Host Hardware</text>
  <rect x="40" y="460" width="500" height="80" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="290" y="505" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Hypervisor</text>
  <rect x="60" y="280" width="140" height="180" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="130" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Guest OS</text>
  <text x="130" y="380" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">Libs</text>
  <text x="130" y="430" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">App</text>
  <rect x="220" y="280" width="140" height="180" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="290" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Guest OS</text>
  <text x="290" y="380" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">Libs</text>
  <text x="290" y="430" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">App</text>
  <rect x="380" y="280" width="140" height="180" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="450" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Guest OS</text>
  <text x="450" y="380" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">Libs</text>
  <text x="450" y="430" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">App</text>

  <text x="290" y="250" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">each app brings its whole OS</text>

  <!-- Container stack -->
  <text x="990" y="100" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Containers</text>
  <rect x="740" y="540" width="500" height="80" fill="var(--surface)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="990" y="585" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">Host Hardware</text>
  <rect x="740" y="460" width="500" height="80" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="990" y="505" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Host Kernel + Container Runtime</text>
  <rect x="760" y="320" width="100" height="140" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="810" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Libs</text>
  <text x="810" y="420" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">App</text>
  <rect x="880" y="320" width="100" height="140" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="930" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Libs</text>
  <text x="930" y="420" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">App</text>
  <rect x="1000" y="320" width="100" height="140" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1050" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Libs</text>
  <text x="1050" y="420" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">App</text>
  <rect x="1120" y="320" width="100" height="140" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1170" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Libs</text>
  <text x="1170" y="420" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">App</text>

  <text x="990" y="290" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">apps share one kernel; more density</text>
</svg>

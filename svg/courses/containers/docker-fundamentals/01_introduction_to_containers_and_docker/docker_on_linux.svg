<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="20.263747655025" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Docker on Linux: a Skin Over Kernel Features</text>

  <rect x="40" y="65.663716814159" width="370" height="118.053097345133" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="225" y="106.725663716814" text-anchor="middle" font-size="16.21099812402" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Container A</text>
  <text x="225" y="142.654867256637" text-anchor="middle" font-size="13.171435975767" fill="var(--info-text)" font-family="Courier New, monospace">PID 1: nginx</text>
  <text x="225" y="168.318584070796" text-anchor="middle" font-size="11.145061210264" fill="var(--info-text)" font-family="Arial, sans-serif">own root, net, pids</text>

  <rect x="455" y="65.663716814159" width="370" height="118.053097345133" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="640" y="106.725663716814" text-anchor="middle" font-size="16.21099812402" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Container B</text>
  <text x="640" y="142.654867256637" text-anchor="middle" font-size="13.171435975767" fill="var(--info-text)" font-family="Courier New, monospace">PID 1: postgres</text>
  <text x="640" y="168.318584070796" text-anchor="middle" font-size="11.145061210264" fill="var(--info-text)" font-family="Arial, sans-serif">own root, net, pids</text>

  <rect x="870" y="65.663716814159" width="370" height="118.053097345133" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="1055" y="106.725663716814" text-anchor="middle" font-size="16.21099812402" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Container C</text>
  <text x="1055" y="142.654867256637" text-anchor="middle" font-size="13.171435975767" fill="var(--info-text)" font-family="Courier New, monospace">PID 1: redis</text>
  <text x="1055" y="168.318584070796" text-anchor="middle" font-size="11.145061210264" fill="var(--info-text)" font-family="Arial, sans-serif">own root, net, pids</text>

  <rect x="40" y="204.247787610619" width="1200" height="82.12389380531" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="640" y="238.12389380531" text-anchor="middle" font-size="17.224185506772" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Docker Engine</text>
  <text x="640" y="265.840707964602" text-anchor="middle" font-size="13.171435975767" fill="var(--warn-text)" font-family="Courier New, monospace">dockerd  -&gt;  containerd  -&gt;  runc</text>

  <rect x="40" y="306.902654867257" width="1200" height="313.097345132743" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="640" y="342.83185840708" text-anchor="middle" font-size="20.263747655025" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Linux Kernel (shared)</text>

  <rect x="65" y="373.628318584071" width="280" height="138.58407079646" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="205" y="404.424778761062" text-anchor="middle" font-size="16.21099812402" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Namespaces</text>
  <text x="205" y="437.274336283186" text-anchor="middle" font-size="12.158248593015" fill="var(--ok-text)" font-family="Courier New, monospace">pid net mnt</text>
  <text x="205" y="459.858407079646" text-anchor="middle" font-size="12.158248593015" fill="var(--ok-text)" font-family="Courier New, monospace">uts ipc user</text>
  <text x="205" y="493.734513274336" text-anchor="middle" font-size="11.145061210264" fill="var(--ok-text)" font-family="Arial, sans-serif" font-style="italic">what you see</text>

  <rect x="370" y="373.628318584071" width="280" height="138.58407079646" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="510" y="404.424778761062" text-anchor="middle" font-size="16.21099812402" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Cgroups</text>
  <text x="510" y="437.274336283186" text-anchor="middle" font-size="12.158248593015" fill="var(--ok-text)" font-family="Courier New, monospace">cpu memory</text>
  <text x="510" y="459.858407079646" text-anchor="middle" font-size="12.158248593015" fill="var(--ok-text)" font-family="Courier New, monospace">io pids</text>
  <text x="510" y="493.734513274336" text-anchor="middle" font-size="11.145061210264" fill="var(--ok-text)" font-family="Arial, sans-serif" font-style="italic">how much</text>

  <rect x="675" y="373.628318584071" width="280" height="138.58407079646" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="815" y="404.424778761062" text-anchor="middle" font-size="16.21099812402" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Capabilities</text>
  <text x="815" y="437.274336283186" text-anchor="middle" font-size="12.158248593015" fill="var(--ok-text)" font-family="Courier New, monospace">CAP_NET_BIND</text>
  <text x="815" y="459.858407079646" text-anchor="middle" font-size="12.158248593015" fill="var(--ok-text)" font-family="Courier New, monospace">drop CAP_SYS_ADMIN</text>
  <text x="815" y="493.734513274336" text-anchor="middle" font-size="11.145061210264" fill="var(--ok-text)" font-family="Arial, sans-serif" font-style="italic">privilege</text>

  <rect x="980" y="373.628318584071" width="240" height="138.58407079646" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="1100" y="404.424778761062" text-anchor="middle" font-size="16.21099812402" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Filters</text>
  <text x="1100" y="437.274336283186" text-anchor="middle" font-size="12.158248593015" fill="var(--danger-text)" font-family="Courier New, monospace">seccomp</text>
  <text x="1100" y="459.858407079646" text-anchor="middle" font-size="12.158248593015" fill="var(--danger-text)" font-family="Courier New, monospace">AppArmor SELinux</text>
  <text x="1100" y="493.734513274336" text-anchor="middle" font-size="11.145061210264" fill="var(--danger-text)" font-family="Arial, sans-serif" font-style="italic">syscall surface</text>

  <rect x="65" y="532.743362831858" width="1155" height="76.991150442478" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="640" y="561.486725663717" text-anchor="middle" font-size="13.171435975767" fill="var(--primary-text)" font-family="Courier New, monospace">scheduler   overlayfs   bridge   iptables   syscall ABI</text>
  <text x="640" y="589.203539823009" text-anchor="middle" font-size="12.158248593015" fill="var(--primary-text)" font-family="Arial, sans-serif" font-style="italic">all containers run on the same kernel</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Docker architecture: client, daemon, registry</text>

  <rect x="40" y="120" width="280" height="200" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="180" y="170" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Docker Client</text>
  <text x="180" y="210" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Courier New, monospace">docker run ...</text>
  <text x="180" y="235" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Courier New, monospace">docker build ...</text>
  <text x="180" y="260" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Courier New, monospace">docker pull ...</text>
  <text x="180" y="295" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">on your laptop</text>

  <rect x="500" y="120" width="280" height="380" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="640" y="165" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Docker Host</text>
  <rect x="520" y="200" width="240" height="80" fill="var(--surface)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="640" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">dockerd (daemon)</text>
  <text x="640" y="258" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">REST API + state</text>
  <rect x="520" y="300" width="240" height="80" fill="var(--surface)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="640" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">containerd / runc</text>
  <text x="640" y="358" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">runs containers</text>
  <rect x="520" y="400" width="240" height="80" fill="var(--surface)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="640" y="430" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">images + layers</text>
  <text x="640" y="458" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">/var/lib/docker</text>

  <rect x="960" y="120" width="280" height="200" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="1100" y="170" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Registry</text>
  <text x="1100" y="220" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">Docker Hub</text>
  <text x="1100" y="245" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">ECR / GHCR / GCR</text>
  <text x="1100" y="295" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">remote image store</text>

  <line x1="320" y1="220" x2="500" y2="240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="200" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">REST</text>
  <line x1="780" y1="220" x2="960" y2="220" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="200" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">pull / push</text>

  <text x="640" y="620" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">CLI sends commands → daemon manages images and containers → registry stores images</text>
</svg>

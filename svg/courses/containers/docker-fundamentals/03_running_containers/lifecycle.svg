<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/></marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Container lifecycle states and transitions</text>

  <ellipse cx="200" cy="200" rx="120" ry="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="208" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Created</text>

  <ellipse cx="640" cy="200" rx="120" ry="60" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="208" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Running</text>

  <ellipse cx="1080" cy="200" rx="120" ry="60" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="208" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Paused</text>

  <ellipse cx="640" cy="440" rx="120" ry="60" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="448" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Stopped</text>

  <ellipse cx="200" cy="440" rx="120" ry="60" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="448" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Removed</text>

  <line x1="320" y1="200" x2="520" y2="200" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="190" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Courier New, monospace">start</text>

  <line x1="760" y1="200" x2="960" y2="200" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="190" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Courier New, monospace">pause</text>
  <line x1="960" y1="220" x2="760" y2="220" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="240" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Courier New, monospace">unpause</text>

  <line x1="640" y1="260" x2="640" y2="380" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="320" font-size="14" fill="var(--text-muted)" font-family="Courier New, monospace">stop / kill</text>
  <line x1="600" y1="380" x2="600" y2="260" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="320" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Courier New, monospace">start</text>

  <line x1="520" y1="440" x2="320" y2="440" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="430" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Courier New, monospace">rm</text>

  <line x1="200" y1="260" x2="200" y2="380" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="320" font-size="14" fill="var(--text-muted)" font-family="Courier New, monospace">rm (force)</text>

  <text x="40" y="600" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">docker run = create + start</text>
  <text x="1240" y="600" text-anchor="end" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">--rm = auto-remove on stop</text>
  <text x="640" y="620" text-anchor="middle" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">writable layer is gone when a container is removed</text>
</svg>

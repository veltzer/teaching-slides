<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Docker Fundamentals</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Build, ship, and run containers</text>

  <!-- Stylised whale-on-containers -->
  <rect x="380" y="380" width="100" height="80" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <rect x="490" y="380" width="100" height="80" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <rect x="600" y="380" width="100" height="80" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <rect x="710" y="380" width="100" height="80" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <rect x="820" y="380" width="100" height="80" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <rect x="435" y="320" width="100" height="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <rect x="545" y="320" width="100" height="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <rect x="655" y="320" width="100" height="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <rect x="765" y="320" width="100" height="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>

  <!-- Whale body -->
  <ellipse cx="640" cy="500" rx="320" ry="40" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>

  <text x="240" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Images</text>
  <text x="450" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Containers</text>
  <text x="660" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Networking</text>
  <text x="850" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Volumes</text>
  <text x="1040" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Compose</text>
</svg>

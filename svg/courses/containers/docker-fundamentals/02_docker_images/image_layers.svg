<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Image layers stack into one filesystem; container adds a writable top</text>

  <rect x="240" y="120" width="500" height="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="490" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">FROM ubuntu:22.04 (base layer, ~80 MB)</text>

  <rect x="240" y="200" width="500" height="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="490" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RUN apt-get install python3 (~50 MB)</text>

  <rect x="240" y="280" width="500" height="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="490" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">COPY requirements.txt . (~1 KB)</text>

  <rect x="240" y="360" width="500" height="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="490" y="398" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RUN pip install -r requirements.txt (~25 MB)</text>

  <rect x="240" y="440" width="500" height="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="490" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">COPY app.py . (~2 KB)</text>

  <rect x="240" y="520" width="500" height="60" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="490" y="558" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">writable container layer (per-container)</text>

  <text x="800" y="160" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">read-only</text>
  <text x="800" y="240" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">read-only</text>
  <text x="800" y="320" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">read-only</text>
  <text x="800" y="400" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">read-only</text>
  <text x="800" y="480" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">read-only</text>
  <text x="800" y="560" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">read-write</text>

  <text x="40" y="160" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">base</text>
  <text x="40" y="560" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">top</text>

  <text x="900" y="160" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">layers are content-addressable</text>
  <text x="900" y="240" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">cached across images</text>
  <text x="900" y="320" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">only changed layers re-pull</text>
  <text x="900" y="400" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">order matters for cache hits</text>
  <text x="1240" y="40" text-anchor="end" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">union filesystem</text>
  <text x="640" y="620" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">layers shared across images &#8226; cached by Docker</text>
</svg>

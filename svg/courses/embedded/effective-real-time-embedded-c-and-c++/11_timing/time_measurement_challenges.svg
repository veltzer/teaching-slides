<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="535.586" y="210.323" width="208.828" height="208.828" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="306.596586" text-anchor="middle" font-size="22.971053" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Timing</text>
  <text x="640" y="333.052674" text-anchor="middle" font-size="22.971053" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Sources</text>
  <rect x="447.142857" y="40" width="385.714286" height="101.754457" rx="7.209017" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="88.842028" text-anchor="middle" font-size="25.059266" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CPU Cycles</text>
  <text x="640" y="115.298116" text-anchor="middle" font-size="16.706177" fill="var(--text-muted)" font-family="Arial, sans-serif">DWT_CYCCNT · highest resolution</text>
  <line x1="640" y1="212.982425" x2="640" y2="143.789405" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow-primary)"/>
  <rect x="40" y="263.859654" width="385.714286" height="101.754457" rx="7.209017" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="232.857143" y="312.701808" text-anchor="middle" font-size="25.059266" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">System Timer</text>
  <text x="232.857143" y="339.157896" text-anchor="middle" font-size="16.706177" fill="var(--text-muted)" font-family="Arial, sans-serif">SysTick · ms resolution</text>
  <line x1="532.857143" y1="314.736882" x2="427.857143" y2="314.736882" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)"/>
  <rect x="854.285714" y="263.859654" width="385.714286" height="101.754457" rx="7.209017" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1047.142857" y="312.701808" text-anchor="middle" font-size="25.059266" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RTC</text>
  <text x="1047.142857" y="339.157896" text-anchor="middle" font-size="16.706177" fill="var(--text-muted)" font-family="Arial, sans-serif">Real-Time Clock · seconds</text>
  <line x1="747.142857" y1="314.736882" x2="852.142857" y2="314.736882" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)"/>
  <rect x="147.142857" y="457.192945" width="985.714286" height="162.807055" rx="7.209017" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="485.684233" text-anchor="middle" font-size="18.794509" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Resolution vs. Range Trade-off</text>
  <line x1="168.571429" y1="497.894803" x2="1111.428571" y2="497.894803" stroke="var(--border)" stroke-width="0.8889"/>
  <text x="254.285714" y="520.280743" text-anchor="middle" font-size="16.706177" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Source</text>
  <text x="575.714286" y="520.280743" text-anchor="middle" font-size="16.706177" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Resolution</text>
  <text x="811.428571" y="520.280743" text-anchor="middle" font-size="16.706177" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Range</text>
  <text x="1036.428571" y="520.280743" text-anchor="middle" font-size="16.706177" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Use case</text>
  <line x1="168.571429" y1="528.421039" x2="1111.428571" y2="528.421039" stroke="var(--border)" stroke-width="0.8889"/>
  <text x="254.285714" y="550.807106" text-anchor="middle" font-size="15.662071" fill="var(--primary-accent)" font-family="Courier New, monospace">CPU Cycles</text>
  <text x="575.714286" y="550.807106" text-anchor="middle" font-size="15.662071" fill="var(--text-muted)" font-family="Arial, sans-serif">~ns</text>
  <text x="811.428571" y="550.807106" text-anchor="middle" font-size="15.662071" fill="var(--text-muted)" font-family="Arial, sans-serif">seconds</text>
  <text x="1036.428571" y="550.807106" text-anchor="middle" font-size="15.662071" fill="var(--text-muted)" font-family="Arial, sans-serif">profiling</text>
  <text x="254.285714" y="577.263194" text-anchor="middle" font-size="15.662071" fill="var(--text)" font-family="Courier New, monospace">SysTick</text>
  <text x="575.714286" y="577.263194" text-anchor="middle" font-size="15.662071" fill="var(--text-muted)" font-family="Arial, sans-serif">~ms</text>
  <text x="811.428571" y="577.263194" text-anchor="middle" font-size="15.662071" fill="var(--text-muted)" font-family="Arial, sans-serif">hours</text>
  <text x="1036.428571" y="577.263194" text-anchor="middle" font-size="15.662071" fill="var(--text-muted)" font-family="Arial, sans-serif">RTOS tick</text>
  <text x="254.285714" y="603.719282" text-anchor="middle" font-size="15.662071" fill="var(--text-muted)" font-family="Courier New, monospace">RTC</text>
  <text x="575.714286" y="603.719282" text-anchor="middle" font-size="15.662071" fill="var(--text-muted)" font-family="Arial, sans-serif">~s</text>
  <text x="811.428571" y="603.719282" text-anchor="middle" font-size="15.662071" fill="var(--text-muted)" font-family="Arial, sans-serif">years</text>
  <text x="1036.428571" y="603.719282" text-anchor="middle" font-size="15.662071" fill="var(--text-muted)" font-family="Arial, sans-serif">wall clock</text>
</svg>

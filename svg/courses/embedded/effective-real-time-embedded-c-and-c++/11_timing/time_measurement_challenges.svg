<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Center hub -->
  <circle cx="640" cy="300" r="100" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="292" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Timing</text>
  <text x="640" y="318" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Sources</text>

  <!-- CPU Cycles (top) -->
  <rect x="460" y="30" width="360" height="100" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="78" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#212121">CPU Cycles</text>
  <text x="640" y="104" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">DWT_CYCCNT · highest resolution</text>
  <line x1="640" y1="200" x2="640" y2="132" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-accent)"/>

  <!-- System Timer (left) -->
  <rect x="80" y="250" width="360" height="100" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="260" y="298" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#212121">System Timer</text>
  <text x="260" y="324" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">SysTick · ms resolution</text>
  <line x1="540" y1="300" x2="442" y2="300" stroke="#555555" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- RTC (right) -->
  <rect x="840" y="250" width="360" height="100" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1020" y="298" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#212121">RTC</text>
  <text x="1020" y="324" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Real-Time Clock · seconds</text>
  <line x1="740" y1="300" x2="838" y2="300" stroke="#555555" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- Comparison table -->
  <rect x="180" y="440" width="920" height="160" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="640" y="468" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">Resolution vs. Range Trade-off</text>
  <!-- Table -->
  <line x1="200" y1="480" x2="1080" y2="480" stroke="#e0e0e0" stroke-width="1"/>
  <text x="280"  y="502" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555" font-weight="bold">Source</text>
  <text x="580"  y="502" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555" font-weight="bold">Resolution</text>
  <text x="800"  y="502" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555" font-weight="bold">Range</text>
  <text x="1010" y="502" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555" font-weight="bold">Use case</text>
  <line x1="200" y1="510" x2="1080" y2="510" stroke="#e0e0e0" stroke-width="1"/>
  <text x="280"  y="532" text-anchor="middle" font-family="monospace" font-size="15" fill="#1565c0">CPU Cycles</text>
  <text x="580"  y="532" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">~ns</text>
  <text x="800"  y="532" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">seconds</text>
  <text x="1010" y="532" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">profiling</text>
  <text x="280"  y="558" text-anchor="middle" font-family="monospace" font-size="15" fill="#212121">SysTick</text>
  <text x="580"  y="558" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">~ms</text>
  <text x="800"  y="558" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">hours</text>
  <text x="1010" y="558" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">RTOS tick</text>
  <text x="280"  y="584" text-anchor="middle" font-family="monospace" font-size="15" fill="#555555">RTC</text>
  <text x="580"  y="584" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">~s</text>
  <text x="800"  y="584" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">years</text>
  <text x="1010" y="584" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">wall clock</text>
</svg>

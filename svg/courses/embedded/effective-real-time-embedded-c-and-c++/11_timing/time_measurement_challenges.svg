<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <circle cx="640" cy="281.6667" r="86.9027" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="640" y="275.2223" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)">Timing</text>
  <text x="640" y="296.1667" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)">Sources</text>
  <rect x="471.25" y="64.1667" width="337.5" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="102.8333" text-anchor="middle" font-family="sans-serif" font-size="20.8566" font-weight="bold" fill="var(--text)">CPU Cycles</text>
  <text x="640" y="123.7777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">DWT_CYCCNT · highest resolution</text>
  <line x1="640" y1="201.1111" x2="640" y2="146.3333" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow-primary)" />
  <rect x="115" y="241.3889" width="337.5" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="283.75" y="280.0556" text-anchor="middle" font-family="sans-serif" font-size="20.8566" font-weight="bold" fill="var(--text)">System Timer</text>
  <text x="283.75" y="301" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">SysTick · ms resolution</text>
  <line x1="546.25" y1="281.6667" x2="454.375" y2="281.6667" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <rect x="827.5" y="241.3889" width="337.5" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="996.25" y="280.0556" text-anchor="middle" font-family="sans-serif" font-size="20.8566" font-weight="bold" fill="var(--text)">RTC</text>
  <text x="996.25" y="301" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Real-Time Clock · seconds</text>
  <line x1="733.75" y1="281.6667" x2="825.625" y2="281.6667" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <rect x="208.75" y="394.4444" width="862.5" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="417" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Resolution vs. Range Trade-off</text>
  <line x1="227.5" y1="426.6667" x2="1052.5" y2="426.6667" stroke="var(--border)" stroke-width="0.8889" />
  <text x="302.5" y="444.3889" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)" font-weight="bold">Source</text>
  <text x="583.75" y="444.3889" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)" font-weight="bold">Resolution</text>
  <text x="790" y="444.3889" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)" font-weight="bold">Range</text>
  <text x="986.875" y="444.3889" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)" font-weight="bold">Use case</text>
  <line x1="227.5" y1="450.8333" x2="1052.5" y2="450.8333" stroke="var(--border)" stroke-width="0.8889" />
  <text x="302.5" y="468.5556" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">CPU Cycles</text>
  <text x="583.75" y="468.5556" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">~ns</text>
  <text x="790" y="468.5556" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">seconds</text>
  <text x="986.875" y="468.5556" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">profiling</text>
  <text x="302.5" y="489.5" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text)">SysTick</text>
  <text x="583.75" y="489.5" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">~ms</text>
  <text x="790" y="489.5" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">hours</text>
  <text x="986.875" y="489.5" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">RTOS tick</text>
  <text x="302.5" y="510.4444" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">RTC</text>
  <text x="583.75" y="510.4444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">~s</text>
  <text x="790" y="510.4444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">years</text>
  <text x="986.875" y="510.4444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">wall clock</text>
</svg>
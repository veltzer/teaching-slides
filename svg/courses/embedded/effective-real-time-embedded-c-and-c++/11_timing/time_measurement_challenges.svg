<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <circle cx="640" cy="314.736882" r="104.413847" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="640" y="306.596586" text-anchor="middle" font-family="sans-serif" font-size="22.971053" font-weight="bold" fill="var(--bg)">Timing</text>
  <text x="640" y="333.052674" text-anchor="middle" font-family="sans-serif" font-size="22.971053" font-weight="bold" fill="var(--bg)">Sources</text>
  <rect x="447.142857" y="40" width="385.714286" height="101.754457" rx="7.209017" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="88.842028" text-anchor="middle" font-family="sans-serif" font-size="25.059266" font-weight="bold" fill="var(--text)">CPU Cycles</text>
  <text x="640" y="115.298116" text-anchor="middle" font-family="sans-serif" font-size="16.706177" fill="var(--text-muted)">DWT_CYCCNT · highest resolution</text>
  <line x1="640" y1="212.982425" x2="640" y2="143.789405" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow-primary)" />
  <rect x="40" y="263.859654" width="385.714286" height="101.754457" rx="7.209017" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="232.857143" y="312.701808" text-anchor="middle" font-family="sans-serif" font-size="25.059266" font-weight="bold" fill="var(--text)">System Timer</text>
  <text x="232.857143" y="339.157896" text-anchor="middle" font-family="sans-serif" font-size="16.706177" fill="var(--text-muted)">SysTick · ms resolution</text>
  <line x1="532.857143" y1="314.736882" x2="427.857143" y2="314.736882" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <rect x="854.285714" y="263.859654" width="385.714286" height="101.754457" rx="7.209017" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1047.142857" y="312.701808" text-anchor="middle" font-family="sans-serif" font-size="25.059266" font-weight="bold" fill="var(--text)">RTC</text>
  <text x="1047.142857" y="339.157896" text-anchor="middle" font-family="sans-serif" font-size="16.706177" fill="var(--text-muted)">Real-Time Clock · seconds</text>
  <line x1="747.142857" y1="314.736882" x2="852.142857" y2="314.736882" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <rect x="147.142857" y="457.192945" width="985.714286" height="162.807055" rx="7.209017" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="485.684233" text-anchor="middle" font-family="sans-serif" font-size="18.794509" font-weight="bold" fill="var(--text)">Resolution vs. Range Trade-off</text>
  <line x1="168.571429" y1="497.894803" x2="1111.428571" y2="497.894803" stroke="var(--border)" stroke-width="0.8889" />
  <text x="254.285714" y="520.280743" text-anchor="middle" font-family="sans-serif" font-size="16.706177" fill="var(--text-muted)" font-weight="bold">Source</text>
  <text x="575.714286" y="520.280743" text-anchor="middle" font-family="sans-serif" font-size="16.706177" fill="var(--text-muted)" font-weight="bold">Resolution</text>
  <text x="811.428571" y="520.280743" text-anchor="middle" font-family="sans-serif" font-size="16.706177" fill="var(--text-muted)" font-weight="bold">Range</text>
  <text x="1036.428571" y="520.280743" text-anchor="middle" font-family="sans-serif" font-size="16.706177" fill="var(--text-muted)" font-weight="bold">Use case</text>
  <line x1="168.571429" y1="528.421039" x2="1111.428571" y2="528.421039" stroke="var(--border)" stroke-width="0.8889" />
  <text x="254.285714" y="550.807106" text-anchor="middle" font-family="monospace" font-size="15.662071" fill="var(--primary-accent)">CPU Cycles</text>
  <text x="575.714286" y="550.807106" text-anchor="middle" font-family="sans-serif" font-size="15.662071" fill="var(--text-muted)">~ns</text>
  <text x="811.428571" y="550.807106" text-anchor="middle" font-family="sans-serif" font-size="15.662071" fill="var(--text-muted)">seconds</text>
  <text x="1036.428571" y="550.807106" text-anchor="middle" font-family="sans-serif" font-size="15.662071" fill="var(--text-muted)">profiling</text>
  <text x="254.285714" y="577.263194" text-anchor="middle" font-family="monospace" font-size="15.662071" fill="var(--text)">SysTick</text>
  <text x="575.714286" y="577.263194" text-anchor="middle" font-family="sans-serif" font-size="15.662071" fill="var(--text-muted)">~ms</text>
  <text x="811.428571" y="577.263194" text-anchor="middle" font-family="sans-serif" font-size="15.662071" fill="var(--text-muted)">hours</text>
  <text x="1036.428571" y="577.263194" text-anchor="middle" font-family="sans-serif" font-size="15.662071" fill="var(--text-muted)">RTOS tick</text>
  <text x="254.285714" y="603.719282" text-anchor="middle" font-family="monospace" font-size="15.662071" fill="var(--text-muted)">RTC</text>
  <text x="575.714286" y="603.719282" text-anchor="middle" font-family="sans-serif" font-size="15.662071" fill="var(--text-muted)">~s</text>
  <text x="811.428571" y="603.719282" text-anchor="middle" font-family="sans-serif" font-size="15.662071" fill="var(--text-muted)">years</text>
  <text x="1036.428571" y="603.719282" text-anchor="middle" font-family="sans-serif" font-size="15.662071" fill="var(--text-muted)">wall clock</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="53.3333" y="35.5556" width="320" height="177.7778" rx="7.1111" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="213.3333" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#ffffff">Independent WDT</ns0:text>
  <ns0:text x="213.3333" y="104.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">Separate RC clock</ns0:text>
  <ns0:text x="213.3333" y="128" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">Runs even if main clock fails</ns0:text>
  <ns0:text x="213.3333" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">Must be kicked before timeout</ns0:text>
  <ns0:text x="213.3333" y="174.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#90caf9">→ catch complete hangs</ns0:text>
  <ns0:text x="213.3333" y="195.5556" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#90caf9">IWDG_KR = 0xAAAA (kick)</ns0:text>
  <ns0:rect x="408.8889" y="35.5556" width="320" height="177.7778" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">Window WDT</ns0:text>
  <ns0:text x="568.8889" y="104.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Must kick within a time window</ns0:text>
  <ns0:text x="568.8889" y="128" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Too early = reset. Too late = reset</ns0:text>
  <ns0:text x="568.8889" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Enforces correct timing</ns0:text>
  <ns0:text x="568.8889" y="174.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">→ catch runaway/too-fast loops</ns0:text>
  <ns0:text x="568.8889" y="195.5556" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#9e9e9e">min_time &lt; kick &lt; max_time</ns0:text>
  <ns0:rect x="764.4444" y="35.5556" width="320" height="177.7778" rx="7.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="924.4444" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">System WDT</ns0:text>
  <ns0:text x="924.4444" y="104.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Uses CPU/APB clock</ns0:text>
  <ns0:text x="924.4444" y="128" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Software-configurable</ns0:text>
  <ns0:text x="924.4444" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">May stop in low-power modes</ns0:text>
  <ns0:text x="924.4444" y="174.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">→ general-purpose watchdog</ns0:text>
  <ns0:rect x="160" y="257.7778" width="817.7778" height="177.7778" rx="5.3333" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="284.4444" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Window WDT kick timing</ns0:text>
  <ns0:line x1="195.5556" y1="337.7778" x2="942.2222" y2="337.7778" stroke="#e0e0e0" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="195.5556" y="311.1111" width="248.8889" height="53.3333" rx="1.7778" fill="#ffcdd2" opacity="0.6" />
  <ns0:text x="320" y="341.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#c62828">Too early → reset</ns0:text>
  <ns0:rect x="444.4444" y="311.1111" width="248.8889" height="53.3333" rx="1.7778" fill="#c8e6c9" opacity="0.8" />
  <ns0:text x="568.8889" y="341.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#2e7d32" font-weight="bold">✓ Valid window</ns0:text>
  <ns0:rect x="693.3333" y="311.1111" width="222.2222" height="53.3333" rx="1.7778" fill="#ffcdd2" opacity="0.6" />
  <ns0:text x="804.4444" y="341.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#c62828">Too late → reset</ns0:text>
  <ns0:line x1="444.4444" y1="302.2222" x2="444.4444" y2="373.3333" stroke="#555" stroke-width="1.7778" />
  <ns0:line x1="693.3333" y1="302.2222" x2="693.3333" y2="373.3333" stroke="#555" stroke-width="1.7778" />
  <ns0:text x="444.4444" y="298.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555">t_min</ns0:text>
  <ns0:text x="693.3333" y="298.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555">t_max</ns0:text>
  <ns0:text x="568.8889" y="547.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">Always kick watchdog from the main application loop — not from an ISR alone</ns0:text>
</ns0:svg>
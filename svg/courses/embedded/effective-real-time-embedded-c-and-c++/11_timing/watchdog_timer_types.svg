<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" />
  <rect x="53.3333" y="35.5556" width="320" height="177.7778" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="213.3333" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--bg)">Independent WDT</text>
  <text x="213.3333" y="104.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-lt)">Separate RC clock</text>
  <text x="213.3333" y="128" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-lt)">Runs even if main clock fails</text>
  <text x="213.3333" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-lt)">Must be kicked before timeout</text>
  <text x="213.3333" y="174.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-tint)">→ catch complete hangs</text>
  <text x="213.3333" y="195.5556" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-tint)">IWDG_KR = 0xAAAA (kick)</text>
  <rect x="408.8889" y="35.5556" width="320" height="177.7778" rx="7.1111" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="568.8889" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">Window WDT</text>
  <text x="568.8889" y="104.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Must kick within a time window</text>
  <text x="568.8889" y="128" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Too early = reset. Too late = reset</text>
  <text x="568.8889" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Enforces correct timing</text>
  <text x="568.8889" y="174.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-disabled)">→ catch runaway/too-fast loops</text>
  <text x="568.8889" y="195.5556" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text-disabled)">min_time &lt; kick &lt; max_time</text>
  <rect x="764.4444" y="35.5556" width="320" height="177.7778" rx="7.1111" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="924.4444" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">System WDT</text>
  <text x="924.4444" y="104.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Uses CPU/APB clock</text>
  <text x="924.4444" y="128" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Software-configurable</text>
  <text x="924.4444" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">May stop in low-power modes</text>
  <text x="924.4444" y="174.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-disabled)">→ general-purpose watchdog</text>
  <rect x="160" y="257.7778" width="817.7778" height="177.7778" rx="5.3333" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="568.8889" y="284.4444" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Window WDT kick timing</text>
  <line x1="195.5556" y1="337.7778" x2="942.2222" y2="337.7778" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="195.5556" y="311.1111" width="248.8889" height="53.3333" rx="1.7778" fill="var(--danger-lt)" opacity="0.6" />
  <text x="320" y="341.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-dk)">Too early → reset</text>
  <rect x="444.4444" y="311.1111" width="248.8889" height="53.3333" rx="1.7778" fill="var(--ok-lt)" opacity="0.8" />
  <text x="568.8889" y="341.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--ok-dk)" font-weight="bold">✓ Valid window</text>
  <rect x="693.3333" y="311.1111" width="222.2222" height="53.3333" rx="1.7778" fill="var(--danger-lt)" opacity="0.6" />
  <text x="804.4444" y="341.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-dk)">Too late → reset</text>
  <line x1="444.4444" y1="302.2222" x2="444.4444" y2="373.3333" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="693.3333" y1="302.2222" x2="693.3333" y2="373.3333" stroke="var(--text-muted)" stroke-width="1.7778" />
  <text x="444.4444" y="298.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">t_min</text>
  <text x="693.3333" y="298.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">t_max</text>
  <text x="568.8889" y="547.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Always kick watchdog from the main application loop — not from an ISR alone</text>
</svg>
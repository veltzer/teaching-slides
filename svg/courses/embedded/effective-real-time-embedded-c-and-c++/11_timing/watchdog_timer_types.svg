<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="53.3333" y="35.5556" width="320" height="177.7778" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="213.3333" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--bg)">Independent WDT</text>
  <text x="213.3333" y="104.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">Separate RC clock</text>
  <text x="213.3333" y="128" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">Runs even if main clock fails</text>
  <text x="213.3333" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">Must be kicked before timeout</text>
  <text x="213.3333" y="174.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">→ catch complete hangs</text>
  <text x="213.3333" y="195.5556" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">IWDG_KR = 0xAAAA (kick)</text>
  <rect x="408.8889" y="35.5556" width="320" height="177.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">Window WDT</text>
  <text x="568.8889" y="104.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Must kick within a time window</text>
  <text x="568.8889" y="128" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Too early = reset. Too late = reset</text>
  <text x="568.8889" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Enforces correct timing</text>
  <text x="568.8889" y="174.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-faint)">→ catch runaway/too-fast loops</text>
  <text x="568.8889" y="195.5556" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text-faint)">min_time &lt; kick &lt; max_time</text>
  <rect x="764.4444" y="35.5556" width="320" height="177.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="924.4444" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">System WDT</text>
  <text x="924.4444" y="104.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Uses CPU/APB clock</text>
  <text x="924.4444" y="128" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Software-configurable</text>
  <text x="924.4444" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">May stop in low-power modes</text>
  <text x="924.4444" y="174.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-faint)">→ general-purpose watchdog</text>
  <rect x="160" y="257.7778" width="817.7778" height="177.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="284.4444" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Window WDT kick timing</text>
  <line x1="195.5556" y1="337.7778" x2="942.2222" y2="337.7778" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="195.5556" y="311.1111" width="248.8889" height="53.3333" rx="6" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="320" y="341.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-accent)">Too early → reset</text>
  <rect x="444.4444" y="311.1111" width="248.8889" height="53.3333" rx="6" fill="var(--ok-fill)" opacity="0.8" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="568.8889" y="341.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--ok-accent)" font-weight="bold">✓ Valid window</text>
  <rect x="693.3333" y="311.1111" width="222.2222" height="53.3333" rx="6" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="804.4444" y="341.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-accent)">Too late → reset</text>
  <line x1="444.4444" y1="302.2222" x2="444.4444" y2="373.3333" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="693.3333" y1="302.2222" x2="693.3333" y2="373.3333" stroke="var(--text-muted)" stroke-width="1.7778" />
  <text x="444.4444" y="298.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">t_min</text>
  <text x="693.3333" y="298.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">t_max</text>
  <text x="568.8889" y="547.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Always kick watchdog from the main application loop — not from an ISR alone</text>
</svg>
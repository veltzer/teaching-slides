<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="372.413827" height="201.388875" rx="7.046643" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="226.206914" y="88.33325" text-anchor="middle" font-family="sans-serif" font-size="26.536131" font-weight="bold" fill="var(--bg)">Independent WDT</text>
  <text x="226.206914" y="118.541625" text-anchor="middle" font-family="sans-serif" font-size="17.350597" fill="var(--primary-accent)">Separate RC clock</text>
  <text x="226.206914" y="144.722125" text-anchor="middle" font-family="sans-serif" font-size="17.350597" fill="var(--primary-accent)">Runs even if main clock fails</text>
  <text x="226.206914" y="170.902625" text-anchor="middle" font-family="sans-serif" font-size="17.350597" fill="var(--primary-accent)">Must be kicked before timeout</text>
  <text x="226.206914" y="197.08325" text-anchor="middle" font-family="sans-serif" font-size="15.309302" fill="var(--primary-accent)">→ catch complete hangs</text>
  <text x="226.206914" y="221.25" text-anchor="middle" font-family="monospace" font-size="14.288595" fill="var(--primary-accent)">IWDG_KR = 0xAAAA (kick)</text>
  <rect x="453.793141" y="40" width="372.413827" height="201.388875" rx="7.046643" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000055" y="88.33325" text-anchor="middle" font-family="sans-serif" font-size="26.536131" font-weight="bold" fill="var(--text)">Window WDT</text>
  <text x="640.000055" y="118.541625" text-anchor="middle" font-family="sans-serif" font-size="17.350597" fill="var(--text-muted)">Must kick within a time window</text>
  <text x="640.000055" y="144.722125" text-anchor="middle" font-family="sans-serif" font-size="17.350597" fill="var(--text-muted)">Too early = reset. Too late = reset</text>
  <text x="640.000055" y="170.902625" text-anchor="middle" font-family="sans-serif" font-size="17.350597" fill="var(--text-muted)">Enforces correct timing</text>
  <text x="640.000055" y="197.08325" text-anchor="middle" font-family="sans-serif" font-size="15.309302" fill="var(--text-faint)">→ catch runaway/too-fast loops</text>
  <text x="640.000055" y="221.25" text-anchor="middle" font-family="monospace" font-size="14.288595" fill="var(--text-faint)">min_time &lt; kick &lt; max_time</text>
  <rect x="867.586173" y="40" width="372.413827" height="201.388875" rx="7.046643" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1053.793086" y="88.33325" text-anchor="middle" font-family="sans-serif" font-size="26.536131" font-weight="bold" fill="var(--text)">System WDT</text>
  <text x="1053.793086" y="118.541625" text-anchor="middle" font-family="sans-serif" font-size="17.350597" fill="var(--text-muted)">Uses CPU/APB clock</text>
  <text x="1053.793086" y="144.722125" text-anchor="middle" font-family="sans-serif" font-size="17.350597" fill="var(--text-muted)">Software-configurable</text>
  <text x="1053.793086" y="170.902625" text-anchor="middle" font-family="sans-serif" font-size="17.350597" fill="var(--text-muted)">May stop in low-power modes</text>
  <text x="1053.793086" y="197.08325" text-anchor="middle" font-family="sans-serif" font-size="15.309302" fill="var(--text-faint)">→ general-purpose watchdog</text>
  <rect x="164.137942" y="291.736" width="951.724225" height="201.388875" rx="7.046643" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000055" y="321.94425" text-anchor="middle" font-family="sans-serif" font-size="18.371185" font-weight="bold" fill="var(--text)">Window WDT kick timing</text>
  <line x1="205.517257" y1="382.361" x2="1074.482854" y2="382.361" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="205.517257" y="352.152625" width="289.655199" height="60.416625" rx="7.046643" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.344856" y="386.38875" text-anchor="middle" font-family="sans-serif" font-size="14.288595" fill="var(--danger-accent)">Too early → reset</text>
  <rect x="495.172345" y="352.152625" width="289.655199" height="60.416625" rx="7.046643" fill="var(--ok-fill)" opacity="0.8" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000055" y="386.38875" text-anchor="middle" font-family="sans-serif" font-size="16.32989" fill="var(--ok-accent)" font-weight="bold">✓ Valid window</text>
  <rect x="784.827655" y="352.152625" width="258.620713" height="60.416625" rx="7.046643" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="914.137901" y="386.38875" text-anchor="middle" font-family="sans-serif" font-size="14.288595" fill="var(--danger-accent)">Too late → reset</text>
  <line x1="495.172345" y1="342.08325" x2="495.172345" y2="422.63875" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="784.827655" y1="342.08325" x2="784.827655" y2="422.63875" stroke="var(--text-muted)" stroke-width="1.7778" />
  <text x="495.172345" y="338.0555" text-anchor="middle" font-family="sans-serif" font-size="13.268124" fill="var(--text-muted)">t_min</text>
  <text x="784.827655" y="338.0555" text-anchor="middle" font-family="sans-serif" font-size="13.268124" fill="var(--text-muted)">t_max</text>
  <text x="640.000055" y="620" text-anchor="middle" font-family="sans-serif" font-size="16.32989" fill="var(--text-muted)">Always kick watchdog from the main application loop — not from an ISR alone</text>
</svg>
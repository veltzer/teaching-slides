<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="96.25" y="72.2223" width="337.5" height="161.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="265" y="110.8889" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--bg)">Independent WDT</text>
  <text x="265" y="135.0556" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">Separate RC clock</text>
  <text x="265" y="156" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">Runs even if main clock fails</text>
  <text x="265" y="176.9444" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">Must be kicked before timeout</text>
  <text x="265" y="197.8889" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">→ catch complete hangs</text>
  <text x="265" y="217.2223" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">IWDG_KR = 0xAAAA (kick)</text>
  <rect x="471.25" y="72.2223" width="337.5" height="161.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="110.8889" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Window WDT</text>
  <text x="640" y="135.0556" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Must kick within a time window</text>
  <text x="640" y="156" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Too early = reset. Too late = reset</text>
  <text x="640" y="176.9444" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Enforces correct timing</text>
  <text x="640" y="197.8889" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-faint)">→ catch runaway/too-fast loops</text>
  <text x="640" y="217.2223" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-faint)">min_time &lt; kick &lt; max_time</text>
  <rect x="846.2499" y="72.2223" width="337.5" height="161.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1014.9999" y="110.8889" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">System WDT</text>
  <text x="1014.9999" y="135.0556" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Uses CPU/APB clock</text>
  <text x="1014.9999" y="156" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Software-configurable</text>
  <text x="1014.9999" y="176.9444" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">May stop in low-power modes</text>
  <text x="1014.9999" y="197.8889" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-faint)">→ general-purpose watchdog</text>
  <rect x="208.75" y="273.6111" width="862.5" height="161.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="297.7777" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Window WDT kick timing</text>
  <line x1="246.25" y1="346.1111" x2="1033.75" y2="346.1111" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="246.25" y="321.9444" width="262.5" height="48.3333" rx="6" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="377.5" y="349.3333" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--danger-accent)">Too early → reset</text>
  <rect x="508.7499" y="321.9444" width="262.5" height="48.3333" rx="6" fill="var(--ok-fill)" opacity="0.8" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="349.3333" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--ok-accent)" font-weight="bold">✓ Valid window</text>
  <rect x="771.25" y="321.9444" width="234.375" height="48.3333" rx="6" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="888.4374" y="349.3333" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--danger-accent)">Too late → reset</text>
  <line x1="508.7499" y1="313.8889" x2="508.7499" y2="378.3333" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="771.25" y1="313.8889" x2="771.25" y2="378.3333" stroke="var(--text-muted)" stroke-width="1.7778" />
  <text x="508.7499" y="310.6667" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">t_min</text>
  <text x="771.25" y="310.6667" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">t_max</text>
  <text x="640" y="536.2223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Always kick watchdog from the main application loop — not from an ISR alone</text>
</svg>
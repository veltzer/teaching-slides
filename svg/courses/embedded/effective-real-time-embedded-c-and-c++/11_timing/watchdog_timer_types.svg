<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- IWDG -->
  <rect x="60" y="40" width="360" height="200" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="240" y="88" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Independent WDT</text>
  <text x="240" y="118" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">Separate RC clock</text>
  <text x="240" y="144" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">Runs even if main clock fails</text>
  <text x="240" y="170" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">Must be kicked before timeout</text>
  <text x="240" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#90caf9">→ catch complete hangs</text>
  <text x="240" y="220" text-anchor="middle" font-family="monospace" font-size="14" fill="#90caf9">IWDG_KR = 0xAAAA (kick)</text>

  <!-- WWDG -->
  <rect x="460" y="40" width="360" height="200" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="88" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Window WDT</text>
  <text x="640" y="118" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Must kick within a time window</text>
  <text x="640" y="144" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Too early = reset. Too late = reset</text>
  <text x="640" y="170" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Enforces correct timing</text>
  <text x="640" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">→ catch runaway/too-fast loops</text>
  <text x="640" y="220" text-anchor="middle" font-family="monospace" font-size="14" fill="#9e9e9e">min_time &lt; kick &lt; max_time</text>

  <!-- System WDT -->
  <rect x="860" y="40" width="360" height="200" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1040" y="88" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">System WDT</text>
  <text x="1040" y="118" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Uses CPU/APB clock</text>
  <text x="1040" y="144" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Software-configurable</text>
  <text x="1040" y="170" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">May stop in low-power modes</text>
  <text x="1040" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">→ general-purpose watchdog</text>

  <!-- Window diagram -->
  <rect x="180" y="290" width="920" height="200" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="640" y="320" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">Window WDT kick timing</text>
  <!-- timeline -->
  <line x1="220" y1="380" x2="1060" y2="380" stroke="#e0e0e0" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Forbidden zone (too early) -->
  <rect x="220" y="350" width="280" height="60" rx="2" fill="#ffcdd2" opacity="0.6"/>
  <text x="360" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c62828">Too early → reset</text>
  <!-- Valid window -->
  <rect x="500" y="350" width="280" height="60" rx="2" fill="#c8e6c9" opacity="0.8"/>
  <text x="640" y="384" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2e7d32" font-weight="bold">✓ Valid window</text>
  <!-- Too late -->
  <rect x="780" y="350" width="250" height="60" rx="2" fill="#ffcdd2" opacity="0.6"/>
  <text x="905" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c62828">Too late → reset</text>
  <!-- markers -->
  <line x1="500" y1="340" x2="500" y2="420" stroke="#555" stroke-width="2"/>
  <line x1="780" y1="340" x2="780" y2="420" stroke="#555" stroke-width="2"/>
  <text x="500" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">t_min</text>
  <text x="780" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">t_max</text>

  <!-- Note -->
  <text x="640" y="616" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Always kick watchdog from the main application loop — not from an ISR alone</text>
</svg>

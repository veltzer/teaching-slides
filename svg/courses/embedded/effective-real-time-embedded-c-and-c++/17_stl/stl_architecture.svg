<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="391.1111" y="195.5556" width="355.5556" height="97.7778" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="247.1111" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--bg)">Iterators</text>
  <text x="568.8889" y="273.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">bridge: containers ↔ algorithms</text>
  <rect x="53.3333" y="26.6667" width="337.7778" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="222.2222" y="71.1111" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">Containers</text>
  <text x="222.2222" y="97.7778" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">array · vector · deque</text>
  <text x="222.2222" y="119.1111" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">map · set · list</text>
  <text x="222.2222" y="140.4444" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">store elements</text>
  <line x1="344.8889" y1="115.5556" x2="444.4444" y2="213.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="746.6667" y="26.6667" width="337.7778" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="915.5556" y="71.1111" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">Algorithms</text>
  <text x="915.5556" y="97.7778" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">sort · find · transform</text>
  <text x="915.5556" y="119.1111" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">count · fill · copy</text>
  <text x="915.5556" y="140.4444" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">operate on ranges</text>
  <line x1="792.8889" y1="115.5556" x2="693.3333" y2="213.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="53.3333" y="364.4444" width="337.7778" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="222.2222" y="408.8889" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">Allocators</text>
  <text x="222.2222" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Control memory allocation</text>
  <text x="222.2222" y="458.6667" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">custom pool allocators</text>
  <text x="222.2222" y="474.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">critical for embedded (no heap)</text>
  <line x1="344.8889" y1="364.4444" x2="444.4444" y2="293.3333" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="746.6667" y="364.4444" width="337.7778" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="915.5556" y="408.8889" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">Functors</text>
  <text x="915.5556" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Callable objects / lambdas</text>
  <text x="915.5556" y="458.6667" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">std::function, lambdas</text>
  <text x="915.5556" y="474.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">customize algorithm behavior</text>
  <line x1="792.8889" y1="364.4444" x2="693.3333" y2="293.3333" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="177.7778" y="513.7778" width="782.2222" height="42.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="568.8889" y="540.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--warn-accent)">Embedded caution: avoid containers that use dynamic memory (vector, map) in production code</text>
</svg>
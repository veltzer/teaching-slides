<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="452.5" y="217.2223" width="375" height="88.6111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="263.9444" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--bg)">Iterators</text>
  <text x="640" y="288.1111" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">bridge: containers ↔ algorithms</text>
  <rect x="96.25" y="64.1667" width="356.25" height="112.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="274.375" y="104.4444" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Containers</text>
  <text x="274.375" y="128.6111" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">array · vector · deque</text>
  <text x="274.375" y="147.9444" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">map · set · list</text>
  <text x="274.375" y="167.2777" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">store elements</text>
  <line x1="403.75" y1="144.7223" x2="508.7499" y2="233.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="827.5" y="64.1667" width="356.25" height="112.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1005.625" y="104.4444" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Algorithms</text>
  <text x="1005.625" y="128.6111" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">sort · find · transform</text>
  <text x="1005.625" y="147.9444" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">count · fill · copy</text>
  <text x="1005.625" y="167.2777" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">operate on ranges</text>
  <line x1="876.25" y1="144.7223" x2="771.25" y2="233.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="96.25" y="370.2777" width="356.25" height="104.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="274.375" y="410.5556" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Allocators</text>
  <text x="274.375" y="434.7223" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Control memory allocation</text>
  <text x="274.375" y="455.6667" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-faint)">custom pool allocators</text>
  <text x="274.375" y="470.1667" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">critical for embedded (no heap)</text>
  <line x1="403.75" y1="370.2777" x2="508.7499" y2="305.8333" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="827.5" y="370.2777" width="356.25" height="104.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1005.625" y="410.5556" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Functors</text>
  <text x="1005.625" y="434.7223" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Callable objects / lambdas</text>
  <text x="1005.625" y="455.6667" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-faint)">std::function, lambdas</text>
  <text x="1005.625" y="470.1667" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">customize algorithm behavior</text>
  <line x1="876.25" y1="370.2777" x2="771.25" y2="305.8333" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="227.5" y="505.6111" width="825" height="38.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="529.7777" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--warn-accent)">Embedded caution: avoid containers that use dynamic memory (vector, map) in production code</text>
</svg>
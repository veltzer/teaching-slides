<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Iterators (center, connecting element) -->
  <rect x="440" y="220" width="400" height="110" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="278" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Iterators</text>
  <text x="640" y="308" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">bridge: containers ↔ algorithms</text>

  <!-- Containers (top-left) -->
  <rect x="60" y="30" width="380" height="140" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="80" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Containers</text>
  <text x="250" y="110" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">array · vector · deque</text>
  <text x="250" y="134" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">map · set · list</text>
  <text x="250" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">store elements</text>
  <line x1="388" y1="130" x2="500" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Algorithms (top-right) -->
  <rect x="840" y="30" width="380" height="140" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1030" y="80" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Algorithms</text>
  <text x="1030" y="110" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">sort · find · transform</text>
  <text x="1030" y="134" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">count · fill · copy</text>
  <text x="1030" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">operate on ranges</text>
  <line x1="892" y1="130" x2="780" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Allocators (bottom-left) -->
  <rect x="60" y="410" width="380" height="130" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="460" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Allocators</text>
  <text x="250" y="490" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Control memory allocation</text>
  <text x="250" y="516" text-anchor="middle" font-family="monospace" font-size="15" fill="#9e9e9e">custom pool allocators</text>
  <text x="250" y="534" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">critical for embedded (no heap)</text>
  <line x1="388" y1="410" x2="500" y2="330" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Functors (bottom-right) -->
  <rect x="840" y="410" width="380" height="130" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1030" y="460" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Functors</text>
  <text x="1030" y="490" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Callable objects / lambdas</text>
  <text x="1030" y="516" text-anchor="middle" font-family="monospace" font-size="15" fill="#9e9e9e">std::function, lambdas</text>
  <text x="1030" y="534" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">customize algorithm behavior</text>
  <line x1="892" y1="410" x2="780" y2="330" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Embedded note -->
  <rect x="200" y="578" width="880" height="48" rx="6" fill="#fff3e0" stroke="#f57f17" stroke-width="1.5"/>
  <text x="640" y="608" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#e65100">Embedded caution: avoid containers that use dynamic memory (vector, map) in production code</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="128.6111" width="126.5625" height="128.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="178.75" y="185" text-anchor="middle" font-family="monospace" font-size="45.1894" font-weight="bold" fill="var(--bg)">7</text>
  <text x="178.75" y="241.3889" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--primary-accent)">MSB</text>
  <rect x="250.9375" y="128.6111" width="126.5625" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="314.6874" y="202.7223" text-anchor="middle" font-family="monospace" font-size="45.1894" font-weight="bold" fill="var(--text)">6</text>
  <rect x="386.875" y="128.6111" width="126.5625" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="450.625" y="202.7223" text-anchor="middle" font-family="monospace" font-size="45.1894" font-weight="bold" fill="var(--text)">5</text>
  <rect x="522.8125" y="128.6111" width="126.5625" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="586.5625" y="202.7223" text-anchor="middle" font-family="monospace" font-size="45.1894" font-weight="bold" fill="var(--text)">4</text>
  <rect x="658.75" y="128.6111" width="126.5625" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="722.5" y="202.7223" text-anchor="middle" font-family="monospace" font-size="45.1894" font-weight="bold" fill="var(--text)">3</text>
  <rect x="794.6875" y="128.6111" width="126.5625" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="858.4375" y="202.7223" text-anchor="middle" font-family="monospace" font-size="45.1894" font-weight="bold" fill="var(--text)">2</text>
  <rect x="930.6249" y="128.6111" width="126.5625" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="994.375" y="202.7223" text-anchor="middle" font-family="monospace" font-size="45.1894" font-weight="bold" fill="var(--text)">1</text>
  <rect x="1066.5624" y="128.6111" width="126.5625" height="128.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1130.3125" y="185" text-anchor="middle" font-family="monospace" font-size="45.1894" font-weight="bold" fill="var(--bg)">0</text>
  <text x="1130.3125" y="241.3889" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--primary-accent)">LSB</text>
  <line x1="178.75" y1="297.7777" x2="1130.3125" y2="297.7777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="330" text-anchor="middle" font-family="sans-serif" font-size="19.1186" fill="var(--text-muted)">MSB → LSB (bit 7 is most significant)</text>
  <text x="178.75" y="410.5556" text-anchor="middle" font-family="monospace" font-size="19.1186" fill="var(--text-muted)">128</text>
  <text x="314.6874" y="410.5556" text-anchor="middle" font-family="monospace" font-size="19.1186" fill="var(--text-muted)">64</text>
  <text x="450.625" y="410.5556" text-anchor="middle" font-family="monospace" font-size="19.1186" fill="var(--text-muted)">32</text>
  <text x="586.5625" y="410.5556" text-anchor="middle" font-family="monospace" font-size="19.1186" fill="var(--text-muted)">16</text>
  <text x="722.5" y="410.5556" text-anchor="middle" font-family="monospace" font-size="19.1186" fill="var(--text-muted)">8</text>
  <text x="858.4375" y="410.5556" text-anchor="middle" font-family="monospace" font-size="19.1186" fill="var(--text-muted)">4</text>
  <text x="994.375" y="410.5556" text-anchor="middle" font-family="monospace" font-size="19.1186" fill="var(--text-muted)">2</text>
  <text x="1130.3125" y="410.5556" text-anchor="middle" font-family="monospace" font-size="19.1186" fill="var(--text-muted)">1</text>
  <text x="640" y="450.8333" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text-faint)">Bit weight (2ⁿ)</text>
  <rect x="227.5" y="475" width="825" height="54.7777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="498.3611" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--primary-accent)">SET: reg |= (1&lt;&lt;n)   CLEAR: reg &amp;= ~(1&lt;&lt;n)   TEST: reg &amp; (1&lt;&lt;n)   TOGGLE: reg ^= (1&lt;&lt;n)</text>
  <text x="640" y="519.3056" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Bit manipulation — the core skill of embedded C</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="110.956528" y="121.526134" text-anchor="middle" font-family="monospace" font-size="57.325028" font-weight="bold" fill="var(--bg)">7</text>
  <text x="110.956528" y="203.052268" text-anchor="middle" font-family="sans-serif" font-size="19.843298" fill="var(--primary-accent)">MSB</text>
  <rect x="191.304362" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="262.260779" y="147.148741" text-anchor="middle" font-family="monospace" font-size="57.325028" font-weight="bold" fill="var(--text)">6</text>
  <rect x="342.608724" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="413.565252" y="147.148741" text-anchor="middle" font-family="monospace" font-size="57.325028" font-weight="bold" fill="var(--text)">5</text>
  <rect x="493.913086" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="564.869614" y="147.148741" text-anchor="middle" font-family="monospace" font-size="57.325028" font-weight="bold" fill="var(--text)">4</text>
  <rect x="645.217447" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="716.173976" y="147.148741" text-anchor="middle" font-family="monospace" font-size="57.325028" font-weight="bold" fill="var(--text)">3</text>
  <rect x="796.521809" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="867.478338" y="147.148741" text-anchor="middle" font-family="monospace" font-size="57.325028" font-weight="bold" fill="var(--text)">2</text>
  <rect x="947.82606" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1018.782699" y="147.148741" text-anchor="middle" font-family="monospace" font-size="57.325028" font-weight="bold" fill="var(--text)">1</text>
  <rect x="1099.130422" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1170.087061" y="121.526134" text-anchor="middle" font-family="monospace" font-size="57.325028" font-weight="bold" fill="var(--bg)">0</text>
  <text x="1170.087061" y="203.052268" text-anchor="middle" font-family="sans-serif" font-size="19.843298" fill="var(--primary-accent)">LSB</text>
  <line x1="110.956528" y1="284.578258" x2="1170.087061" y2="284.578258" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="624.34788" y="331.164723" text-anchor="middle" font-family="sans-serif" font-size="24.252906" fill="var(--text-muted)">MSB → LSB (bit 7 is most significant)</text>
  <text x="110.956528" y="447.63067" text-anchor="middle" font-family="monospace" font-size="24.252906" fill="var(--text-muted)">128</text>
  <text x="262.260779" y="447.63067" text-anchor="middle" font-family="monospace" font-size="24.252906" fill="var(--text-muted)">64</text>
  <text x="413.565252" y="447.63067" text-anchor="middle" font-family="monospace" font-size="24.252906" fill="var(--text-muted)">32</text>
  <text x="564.869614" y="447.63067" text-anchor="middle" font-family="monospace" font-size="24.252906" fill="var(--text-muted)">16</text>
  <text x="716.173976" y="447.63067" text-anchor="middle" font-family="monospace" font-size="24.252906" fill="var(--text-muted)">8</text>
  <text x="867.478338" y="447.63067" text-anchor="middle" font-family="monospace" font-size="24.252906" fill="var(--text-muted)">4</text>
  <text x="1018.782699" y="447.63067" text-anchor="middle" font-family="monospace" font-size="24.252906" fill="var(--text-muted)">2</text>
  <text x="1170.087061" y="447.63067" text-anchor="middle" font-family="monospace" font-size="24.252906" fill="var(--text-muted)">1</text>
  <text x="624.34788" y="505.863499" text-anchor="middle" font-family="sans-serif" font-size="19.843298" fill="var(--text-faint)">Bit weight (2ⁿ)</text>
  <rect x="165.217403" y="540.803312" width="918.260955" height="79.196688" rx="7.611302" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="624.34788" y="574.578402" text-anchor="middle" font-family="monospace" font-size="19.843298" fill="var(--primary-accent)">SET: reg |= (1&lt;&lt;n)   CLEAR: reg &amp;= ~(1&lt;&lt;n)   TEST: reg &amp; (1&lt;&lt;n)   TOGGLE: reg ^= (1&lt;&lt;n)</text>
  <text x="624.34788" y="604.859612" text-anchor="middle" font-family="sans-serif" font-size="17.638431" fill="var(--text-muted)">Bit manipulation — the core skill of embedded C</text>
</svg>
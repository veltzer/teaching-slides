<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#212121">8-bit Register</text>
  <line x1="200" y1="66" x2="1080" y2="66" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Bit cells -->
  <!-- Bit 7 (MSB) - accent -->
  <rect x="80"  y="180" width="135" height="160" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="148" y="250" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold" fill="#ffffff">7</text>
  <text x="148" y="320" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#bbdefb">MSB</text>

  <!-- Bits 6-1 - surface -->
  <rect x="225" y="180" width="135" height="160" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="293" y="272" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold" fill="#212121">6</text>

  <rect x="370" y="180" width="135" height="160" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="438" y="272" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold" fill="#212121">5</text>

  <rect x="515" y="180" width="135" height="160" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="583" y="272" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold" fill="#212121">4</text>

  <rect x="660" y="180" width="135" height="160" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="728" y="272" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold" fill="#212121">3</text>

  <rect x="805" y="180" width="135" height="160" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="873" y="272" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold" fill="#212121">2</text>

  <rect x="950" y="180" width="135" height="160" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1018" y="272" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold" fill="#212121">1</text>

  <!-- Bit 0 (LSB) - accent -->
  <rect x="1095" y="180" width="135" height="160" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1163" y="250" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold" fill="#ffffff">0</text>
  <text x="1163" y="320" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#bbdefb">LSB</text>

  <!-- Direction arrow -->
  <line x1="148" y1="390" x2="1163" y2="390" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="640" y="430" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#555555">MSB → LSB (bit 7 is most significant)</text>

  <!-- Value row labels -->
  <text x="148"  y="530" text-anchor="middle" font-family="monospace" font-size="22" fill="#555555">128</text>
  <text x="293"  y="530" text-anchor="middle" font-family="monospace" font-size="22" fill="#555555">64</text>
  <text x="438"  y="530" text-anchor="middle" font-family="monospace" font-size="22" fill="#555555">32</text>
  <text x="583"  y="530" text-anchor="middle" font-family="monospace" font-size="22" fill="#555555">16</text>
  <text x="728"  y="530" text-anchor="middle" font-family="monospace" font-size="22" fill="#555555">8</text>
  <text x="873"  y="530" text-anchor="middle" font-family="monospace" font-size="22" fill="#555555">4</text>
  <text x="1018" y="530" text-anchor="middle" font-family="monospace" font-size="22" fill="#555555">2</text>
  <text x="1163" y="530" text-anchor="middle" font-family="monospace" font-size="22" fill="#555555">1</text>
  <text x="640"  y="580" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9e9e9e">Bit weight (2ⁿ)</text>

  <!-- Common ops note -->
  <rect x="200" y="610" width="880" height="68" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="639" text-anchor="middle" font-family="monospace" font-size="18" fill="#1565c0">SET: reg |= (1&lt;&lt;n)   CLEAR: reg &amp;= ~(1&lt;&lt;n)   TEST: reg &amp; (1&lt;&lt;n)   TOGGLE: reg ^= (1&lt;&lt;n)</text>
  <text x="640" y="665" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Bit manipulation — the core skill of embedded C</text>
</svg>

  <ns0:rect x="177.7778" y="480" width="782.2222" height="60.4444" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="505.7778" text-anchor="middle" font-family="monospace" font-size="16" fill="#1565c0">SET: reg |= (1&lt;&lt;n)   CLEAR: reg &amp;= ~(1&lt;&lt;n)   TEST: reg &amp; (1&lt;&lt;n)   TOGGLE: reg ^= (1&lt;&lt;n)</ns0:text>
  <ns0:text x="568.8889" y="528.8889" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">Bit manipulation — the core skill of embedded C</ns0:text>

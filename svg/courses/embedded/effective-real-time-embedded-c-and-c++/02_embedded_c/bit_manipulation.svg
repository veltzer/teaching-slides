<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110.956528" y="121.526134" text-anchor="middle" font-size="57.325028" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">7</text>
  <text x="110.956528" y="203.052268" text-anchor="middle" font-size="19.843298" fill="var(--primary-accent)" font-family="Arial, sans-serif">MSB</text>
  <rect x="191.304362" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="262.260779" y="147.148741" text-anchor="middle" font-size="57.325028" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">6</text>
  <rect x="342.608724" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="413.565252" y="147.148741" text-anchor="middle" font-size="57.325028" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">5</text>
  <rect x="493.913086" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="564.869614" y="147.148741" text-anchor="middle" font-size="57.325028" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">4</text>
  <rect x="645.217447" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="716.173976" y="147.148741" text-anchor="middle" font-size="57.325028" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">3</text>
  <rect x="796.521809" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="867.478338" y="147.148741" text-anchor="middle" font-size="57.325028" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">2</text>
  <rect x="947.82606" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1018.782699" y="147.148741" text-anchor="middle" font-size="57.325028" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">1</text>
  <rect x="1099.130422" y="40" width="140.869578" height="186.345429" rx="7.611302" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1170.087061" y="121.526134" text-anchor="middle" font-size="57.325028" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">0</text>
  <text x="1170.087061" y="203.052268" text-anchor="middle" font-size="19.843298" fill="var(--primary-accent)" font-family="Arial, sans-serif">LSB</text>
  <line x1="110.956528" y1="284.578258" x2="1170.087061" y2="284.578258" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="624.34788" y="331.164723" text-anchor="middle" font-size="24.252906" fill="var(--text-muted)" font-family="Arial, sans-serif">MSB → LSB (bit 7 is most significant)</text>
  <text x="110.956528" y="447.63067" text-anchor="middle" font-size="24.252906" fill="var(--text-muted)" font-family="Courier New, monospace">128</text>
  <text x="262.260779" y="447.63067" text-anchor="middle" font-size="24.252906" fill="var(--text-muted)" font-family="Courier New, monospace">64</text>
  <text x="413.565252" y="447.63067" text-anchor="middle" font-size="24.252906" fill="var(--text-muted)" font-family="Courier New, monospace">32</text>
  <text x="564.869614" y="447.63067" text-anchor="middle" font-size="24.252906" fill="var(--text-muted)" font-family="Courier New, monospace">16</text>
  <text x="716.173976" y="447.63067" text-anchor="middle" font-size="24.252906" fill="var(--text-muted)" font-family="Courier New, monospace">8</text>
  <text x="867.478338" y="447.63067" text-anchor="middle" font-size="24.252906" fill="var(--text-muted)" font-family="Courier New, monospace">4</text>
  <text x="1018.782699" y="447.63067" text-anchor="middle" font-size="24.252906" fill="var(--text-muted)" font-family="Courier New, monospace">2</text>
  <text x="1170.087061" y="447.63067" text-anchor="middle" font-size="24.252906" fill="var(--text-muted)" font-family="Courier New, monospace">1</text>
  <text x="624.34788" y="505.863499" text-anchor="middle" font-size="19.843298" fill="var(--text-faint)" font-family="Arial, sans-serif">Bit weight (2ⁿ)</text>
  <rect x="165.217403" y="540.803312" width="918.260955" height="79.196688" rx="7.611302" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="624.34788" y="574.578402" text-anchor="middle" font-size="19.843298" fill="var(--primary-accent)" font-family="Courier New, monospace">SET: reg |= (1&lt;&lt;n)   CLEAR: reg &amp;= ~(1&lt;&lt;n)   TEST: reg &amp; (1&lt;&lt;n)   TOGGLE: reg ^= (1&lt;&lt;n)</text>
  <text x="624.34788" y="604.859612" text-anchor="middle" font-size="17.638431" fill="var(--text-muted)" font-family="Arial, sans-serif">Bit manipulation — the core skill of embedded C</text>
</svg>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Circuit board traces -->
  <line x1="50" y1="200" x2="200" y2="200" stroke="#0f3460" stroke-width="2"/>
  <line x1="200" y1="200" x2="200" y2="100" stroke="#0f3460" stroke-width="2"/>
  <line x1="200" y1="100" x2="350" y2="100" stroke="#0f3460" stroke-width="2"/>
  <line x1="350" y1="100" x2="350" y2="300" stroke="#0f3460" stroke-width="2"/>
  <line x1="350" y1="300" x2="500" y2="300" stroke="#0f3460" stroke-width="2"/>
  <line x1="500" y1="300" x2="500" y2="150" stroke="#0f3460" stroke-width="2"/>
  <line x1="500" y1="150" x2="650" y2="150" stroke="#0f3460" stroke-width="2"/>
  <line x1="650" y1="150" x2="750" y2="250" stroke="#0f3460" stroke-width="2"/>
  <!-- Microchip -->
  <rect x="300" y="140" width="120" height="100" rx="5" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <rect x="320" y="160" width="80" height="60" fill="#0f3460"/>
  <!-- Chip pins -->
  <line x1="310" y1="140" x2="310" y2="120" stroke="#e94560" stroke-width="2"/>
  <line x1="340" y1="140" x2="340" y2="120" stroke="#e94560" stroke-width="2"/>
  <line x1="370" y1="140" x2="370" y2="120" stroke="#e94560" stroke-width="2"/>
  <line x1="400" y1="140" x2="400" y2="120" stroke="#e94560" stroke-width="2"/>
  <line x1="310" y1="240" x2="310" y2="260" stroke="#e94560" stroke-width="2"/>
  <line x1="340" y1="240" x2="340" y2="260" stroke="#e94560" stroke-width="2"/>
  <line x1="370" y1="240" x2="370" y2="260" stroke="#e94560" stroke-width="2"/>
  <line x1="400" y1="240" x2="400" y2="260" stroke="#e94560" stroke-width="2"/>
  <!-- Clock/timing symbol -->
  <polyline points="520,180 540,180 540,210 560,210 560,180 580,180 580,210 600,210 600,180 620,180" fill="none" stroke="#53d8fb" stroke-width="2"/>
  <!-- LED indicators -->
  <circle cx="150" cy="120" r="8" fill="#e94560" opacity="0.8"/>
  <circle cx="150" cy="150" r="8" fill="#53d8fb" opacity="0.8"/>
  <circle cx="150" cy="180" r="8" fill="#00b894" opacity="0.8"/>
  <!-- C/C++ text -->
  <text x="540" y="320" font-family="monospace" font-size="28" fill="#e94560" font-weight="bold">C / C++</text>
  <!-- RT label -->
  <rect x="100" y="290" width="80" height="35" rx="4" fill="#e94560" opacity="0.9"/>
  <text x="115" y="314" font-family="monospace" font-size="18" fill="white" font-weight="bold">RT</text>
  <!-- Decorative dots at trace junctions -->
  <circle cx="200" cy="200" r="4" fill="#53d8fb"/>
  <circle cx="200" cy="100" r="4" fill="#53d8fb"/>
  <circle cx="350" cy="100" r="4" fill="#53d8fb"/>
  <circle cx="350" cy="300" r="4" fill="#53d8fb"/>
  <circle cx="500" cy="300" r="4" fill="#53d8fb"/>
  <circle cx="500" cy="150" r="4" fill="#53d8fb"/>
</svg>

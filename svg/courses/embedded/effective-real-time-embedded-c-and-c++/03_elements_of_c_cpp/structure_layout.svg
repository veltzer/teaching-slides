<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- struct definition -->
  <rect x="80" y="20" width="400" height="160" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="100" y="50" font-family="monospace" font-size="20" fill="#212121">struct S {</text>
  <text x="120" y="78" font-family="monospace" font-size="20" fill="#1565c0">  char  c;   // 1 byte</text>
  <text x="120" y="106" font-family="monospace" font-size="20" fill="#1565c0">  int   i;   // 4 bytes</text>
  <text x="120" y="134" font-family="monospace" font-size="20" fill="#1565c0">  double d;  // 8 bytes</text>
  <text x="100" y="162" font-family="monospace" font-size="20" fill="#212121">};</text>

  <!-- Memory layout bar -->
  <text x="640" y="240" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#555555">Memory layout (16 bytes total due to alignment)</text>

  <!-- c: 1 byte -->
  <rect x="80" y="260" width="80" height="120" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="120" y="325" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff">c</text>
  <text x="120" y="355" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#bbdefb">1B</text>

  <!-- padding: 3 bytes -->
  <rect x="160" y="260" width="240" height="120" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="6 3" filter="url(#shadow)"/>
  <text x="280" y="325" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#9e9e9e">padding</text>
  <text x="280" y="355" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">3B</text>

  <!-- i: 4 bytes -->
  <rect x="400" y="260" width="320" height="120" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="325" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#212121">i</text>
  <text x="560" y="355" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">4B</text>

  <!-- d: 8 bytes -->
  <rect x="720" y="260" width="480" height="120" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="960" y="325" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#212121">d</text>
  <text x="960" y="355" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">8B</text>

  <!-- Byte offsets -->
  <text x="120"  y="410" text-anchor="middle" font-family="monospace" font-size="16" fill="#9e9e9e">+0</text>
  <text x="400"  y="410" text-anchor="middle" font-family="monospace" font-size="16" fill="#9e9e9e">+4</text>
  <text x="720"  y="410" text-anchor="middle" font-family="monospace" font-size="16" fill="#9e9e9e">+8</text>
  <text x="1200" y="410" text-anchor="middle" font-family="monospace" font-size="16" fill="#9e9e9e">+16</text>

  <!-- Note -->
  <rect x="200" y="450" width="880" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="482" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1565c0">Alignment rule: each field starts at a multiple of its size</text>
  <text x="640" y="512" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Use __attribute__((packed)) to remove padding — at a performance cost</text>

  <!-- sizeof note -->
  <text x="640" y="590" text-anchor="middle" font-family="monospace" font-size="22" fill="#212121">sizeof(S) = 16  (not 1+4+8=13)</text>
</svg>

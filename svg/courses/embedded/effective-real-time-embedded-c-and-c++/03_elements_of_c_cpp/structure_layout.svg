  <ns0:text x="568.8889" y="428.4444" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#1565c0">Alignment rule: each field starts at a multiple of its size</ns0:text>
  <ns0:text x="568.8889" y="455.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Use __attribute__((packed)) to remove padding — at a performance cost</ns0:text>
  <ns0:text x="568.8889" y="524.4444" text-anchor="middle" font-family="monospace" font-size="19.5556" fill="#212121">sizeof(S) = 16  (not 1+4+8=13)</ns0:text>

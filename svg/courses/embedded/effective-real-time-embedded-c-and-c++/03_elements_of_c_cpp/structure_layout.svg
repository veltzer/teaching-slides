<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="56.1111" width="375" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="133.75" y="80.2777" font-family="monospace" font-size="17.3806" fill="var(--text)">struct S {</text>
  <text x="152.5" y="102.8333" font-family="monospace" font-size="17.3806" fill="var(--primary-accent)">  char  c;   // 1 byte</text>
  <text x="152.5" y="125.3889" font-family="monospace" font-size="17.3806" fill="var(--primary-accent)">  int   i;   // 4 bytes</text>
  <text x="152.5" y="147.9444" font-family="monospace" font-size="17.3806" fill="var(--primary-accent)">  double d;  // 8 bytes</text>
  <text x="133.75" y="170.5" font-family="monospace" font-size="17.3806" fill="var(--text)">};</text>
  <text x="640" y="233.3333" text-anchor="middle" font-family="sans-serif" font-size="19.1186" fill="var(--text-muted)">Memory layout (16 bytes total due to alignment)</text>
  <rect x="115" y="249.4444" width="75" height="96.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="152.5" y="301.8056" text-anchor="middle" font-family="monospace" font-size="22.5947" font-weight="bold" fill="var(--bg)">c</text>
  <text x="152.5" y="325.9723" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">1B</text>
  <rect x="190" y="249.4444" width="225" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="5.3333 2.6667" filter="url(#shadow)" />
  <text x="302.5" y="301.8056" text-anchor="middle" font-family="sans-serif" font-size="19.1186" fill="var(--text-faint)">padding</text>
  <text x="302.5" y="325.9723" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-faint)">3B</text>
  <rect x="415" y="249.4444" width="299.9999" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="565" y="301.8056" text-anchor="middle" font-family="monospace" font-size="22.5947" font-weight="bold" fill="var(--text)">i</text>
  <text x="565" y="325.9723" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">4B</text>
  <rect x="715" y="249.4444" width="450" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="939.9999" y="301.8056" text-anchor="middle" font-family="monospace" font-size="22.5947" font-weight="bold" fill="var(--text)">d</text>
  <text x="939.9999" y="325.9723" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">8B</text>
  <text x="152.5" y="370.2777" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-faint)">+0</text>
  <text x="415" y="370.2777" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-faint)">+4</text>
  <text x="715" y="370.2777" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-faint)">+8</text>
  <text x="1165" y="370.2777" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-faint)">+16</text>
  <rect x="227.5" y="402.5" width="825" height="64.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="428.2777" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">Alignment rule: each field starts at a multiple of its size</text>
  <text x="640" y="452.4444" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Use __attribute__((packed)) to remove padding — at a performance cost</text>
  <text x="640" y="515.2777" text-anchor="middle" font-family="monospace" font-size="19.1186" fill="var(--text)">sizeof(S) = 16  (not 1+4+8=13)</text>
</svg>
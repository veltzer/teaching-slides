<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Subtitle -->
  <text x="640" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">In a mixed expression, the narrower type is promoted to the wider type</text>

  <!-- long double (top) -->
  <rect x="440" y="54" width="400" height="76" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="96" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#ffffff">long double</text>
  <text x="640" y="120" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">widest · highest precision</text>

  <line x1="640" y1="132" x2="640" y2="154" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <rect x="440" y="156" width="400" height="76" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="200" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#212121">double</text>
  <text x="640" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">64-bit float</text>

  <line x1="640" y1="234" x2="640" y2="256" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <rect x="440" y="258" width="400" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="302" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#212121">float</text>
  <text x="640" y="324" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">32-bit float</text>

  <line x1="640" y1="336" x2="640" y2="358" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <rect x="440" y="360" width="400" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="404" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#212121">long long</text>
  <text x="640" y="426" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">64-bit integer</text>

  <line x1="640" y1="438" x2="640" y2="460" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <rect x="440" y="462" width="400" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="506" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#212121">long / int</text>
  <text x="640" y="528" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">32-bit integer · narrowest here</text>

  <!-- Annotation -->
  <text x="900" y="294" font-family="sans-serif" font-size="16" fill="#9e9e9e">Conversions go</text>
  <text x="900" y="316" font-family="sans-serif" font-size="16" fill="#9e9e9e">upward implicitly.</text>
  <text x="900" y="338" font-family="sans-serif" font-size="16" fill="#9e9e9e">Downward requires</text>
  <text x="900" y="360" font-family="sans-serif" font-size="16" fill="#1565c0" font-weight="bold">explicit cast</text>
  <text x="900" y="382" font-family="sans-serif" font-size="16" fill="#9e9e9e">— may lose data.</text>

  <!-- Warning note -->
  <rect x="200" y="572" width="880" height="56" rx="6" fill="#fff3e0" stroke="#f57f17" stroke-width="1.5"/>
  <text x="640" y="602" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#e65100" font-weight="bold">Embedded caution: float↔int conversions on MCUs without FPU are expensive</text>
  <text x="640" y="622" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Use integer math where possible; avoid implicit float promotion in hot paths</text>
</svg>

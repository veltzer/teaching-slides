  <ns0:text x="568.8889" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">In a mixed expression, the narrower type is promoted to the wider type</ns0:text>
  <ns0:rect x="391.1111" y="48" width="355.5556" height="67.5556" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="85.3333" text-anchor="middle" font-family="monospace" font-size="24.8889" font-weight="bold" fill="#ffffff">long double</ns0:text>
  <ns0:text x="568.8889" y="106.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#bbdefb">widest · highest precision</ns0:text>
  <ns0:line x1="568.8889" y1="117.3333" x2="568.8889" y2="136.8889" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />

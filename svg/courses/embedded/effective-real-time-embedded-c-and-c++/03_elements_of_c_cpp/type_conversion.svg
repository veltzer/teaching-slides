<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="sans-serif" font-size="20.805361" fill="var(--text-muted)">In a mixed expression, the narrower type is promoted to the wider type</text>
  <rect x="367.272727" y="57.635138" width="545.454545" height="74.459568" rx="7.980321" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="98.783754" text-anchor="middle" font-family="monospace" font-size="32.363924" font-weight="bold" fill="var(--bg)">long double</text>
  <text x="640" y="122.297353" text-anchor="middle" font-family="sans-serif" font-size="18.493595" fill="var(--primary-accent)">widest · highest precision</text>
  <line x1="640" y1="134.054031" x2="640" y2="155.608184" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="367.272727" y="157.56763" width="545.454545" height="74.459568" rx="7.980321" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="200.675692" text-anchor="middle" font-family="monospace" font-size="32.363924" font-weight="bold" fill="var(--text)">double</text>
  <text x="640" y="222.229723" text-anchor="middle" font-family="sans-serif" font-size="18.493595" fill="var(--text-muted)">64-bit float</text>
  <line x1="640" y1="233.986523" x2="640" y2="255.540675" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="367.272727" y="257.5" width="545.454545" height="74.459568" rx="7.980321" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="300.608062" text-anchor="middle" font-family="monospace" font-size="32.363924" font-weight="bold" fill="var(--text)">float</text>
  <text x="640" y="322.162215" text-anchor="middle" font-family="sans-serif" font-size="18.493595" fill="var(--text-muted)">32-bit float</text>
  <line x1="640" y1="333.919014" x2="640" y2="355.473045" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="367.272727" y="357.432492" width="545.454545" height="74.459568" rx="7.980321" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="400.540554" text-anchor="middle" font-family="monospace" font-size="32.363924" font-weight="bold" fill="var(--text)">long long</text>
  <text x="640" y="422.094706" text-anchor="middle" font-family="sans-serif" font-size="18.493595" fill="var(--text-muted)">64-bit integer</text>
  <line x1="640" y1="433.851384" x2="640" y2="455.405537" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="367.272727" y="457.364983" width="545.454545" height="74.459568" rx="7.980321" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="500.473045" text-anchor="middle" font-family="monospace" font-size="32.363924" font-weight="bold" fill="var(--text)">long / int</text>
  <text x="640" y="522.027076" text-anchor="middle" font-family="sans-serif" font-size="18.493595" fill="var(--text-muted)">32-bit integer · narrowest here</text>
  <text x="994.545455" y="292.770277" font-family="sans-serif" font-size="18.493595" fill="var(--text-faint)">Conversions go</text>
  <text x="994.545455" y="314.32443" font-family="sans-serif" font-size="18.493595" fill="var(--text-faint)">upward implicitly.</text>
  <text x="994.545455" y="335.878339" font-family="sans-serif" font-size="18.493595" fill="var(--text-faint)">Downward requires</text>
  <text x="994.545455" y="357.432492" font-family="sans-serif" font-size="18.493595" fill="var(--primary-accent)" font-weight="bold">explicit cast</text>
  <text x="994.545455" y="378.986644" font-family="sans-serif" font-size="18.493595" fill="var(--text-faint)">— may lose data.</text>
  <rect x="40" y="565.135138" width="1200" height="54.864862" rx="7.980321" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="594.527076" text-anchor="middle" font-family="sans-serif" font-size="20.805361" fill="var(--warn-accent)" font-weight="bold">Embedded caution: float↔int conversions on MCUs without FPU are expensive</text>
  <text x="640" y="614.121783" text-anchor="middle" font-family="sans-serif" font-size="17.337778" fill="var(--text-muted)">Use integer math where possible; avoid implicit float promotion in hot paths</text>
</svg>
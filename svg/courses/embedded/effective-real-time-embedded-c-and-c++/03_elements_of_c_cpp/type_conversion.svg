<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="69" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text-muted)">In a mixed expression, the narrower type is promoted to the wider type</text>
  <rect x="452.5" y="83.5" width="375" height="61.2223" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="117.3333" text-anchor="middle" font-family="monospace" font-size="24.3328" font-weight="bold" fill="var(--bg)">long double</text>
  <text x="640" y="136.6667" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">widest · highest precision</text>
  <line x1="640" y1="146.3333" x2="640" y2="164.0556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="452.5" y="165.6667" width="375" height="61.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="201.1111" text-anchor="middle" font-family="monospace" font-size="24.3328" font-weight="bold" fill="var(--text)">double</text>
  <text x="640" y="218.8333" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">64-bit float</text>
  <line x1="640" y1="228.5" x2="640" y2="246.2223" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="452.5" y="247.8333" width="375" height="61.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="283.2777" text-anchor="middle" font-family="monospace" font-size="24.3328" font-weight="bold" fill="var(--text)">float</text>
  <text x="640" y="301" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">32-bit float</text>
  <line x1="640" y1="310.6667" x2="640" y2="328.3889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="452.5" y="330" width="375" height="61.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="365.4444" text-anchor="middle" font-family="monospace" font-size="24.3328" font-weight="bold" fill="var(--text)">long long</text>
  <text x="640" y="383.1667" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">64-bit integer</text>
  <line x1="640" y1="392.8333" x2="640" y2="410.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="452.5" y="412.1667" width="375" height="61.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="447.6111" text-anchor="middle" font-family="monospace" font-size="24.3328" font-weight="bold" fill="var(--text)">long / int</text>
  <text x="640" y="465.3333" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">32-bit integer · narrowest here</text>
  <text x="883.75" y="276.8333" font-family="sans-serif" font-size="13.9044" fill="var(--text-faint)">Conversions go</text>
  <text x="883.75" y="294.5556" font-family="sans-serif" font-size="13.9044" fill="var(--text-faint)">upward implicitly.</text>
  <text x="883.75" y="312.2777" font-family="sans-serif" font-size="13.9044" fill="var(--text-faint)">Downward requires</text>
  <text x="883.75" y="330" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)" font-weight="bold">explicit cast</text>
  <text x="883.75" y="347.7223" font-family="sans-serif" font-size="13.9044" fill="var(--text-faint)">— may lose data.</text>
  <rect x="227.5" y="500.7777" width="825" height="45.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="524.9444" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--warn-accent)" font-weight="bold">Embedded caution: float↔int conversions on MCUs without FPU are expensive</text>
  <text x="640" y="541.0556" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">Use integer math where possible; avoid implicit float promotion in hot paths</text>
</svg>
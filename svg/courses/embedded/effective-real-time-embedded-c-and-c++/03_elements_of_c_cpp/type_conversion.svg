  <ns0:text x="568.8889" y="268.4444" text-anchor="middle" font-family="monospace" font-size="24.8889" font-weight="bold" fill="#212121">float</ns0:text>
  <ns0:text x="568.8889" y="288" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">32-bit float</ns0:text>
  <ns0:line x1="568.8889" y1="298.6667" x2="568.8889" y2="318.2222" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />

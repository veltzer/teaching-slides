<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="20.805361" fill="var(--text-muted)" font-family="Arial, sans-serif">In a mixed expression, the narrower type is promoted to the wider type</text>
  <rect x="367.272727" y="57.635138" width="545.454545" height="74.459568" rx="7.980321" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="98.783754" text-anchor="middle" font-size="32.363924" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">long double</text>
  <text x="640" y="122.297353" text-anchor="middle" font-size="18.493595" fill="var(--primary-accent)" font-family="Arial, sans-serif">widest · highest precision</text>
  <line x1="640" y1="134.054031" x2="640" y2="155.608184" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="367.272727" y="157.56763" width="545.454545" height="74.459568" rx="7.980321" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="200.675692" text-anchor="middle" font-size="32.363924" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">double</text>
  <text x="640" y="222.229723" text-anchor="middle" font-size="18.493595" fill="var(--text-muted)" font-family="Arial, sans-serif">64-bit float</text>
  <line x1="640" y1="233.986523" x2="640" y2="255.540675" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="367.272727" y="257.5" width="545.454545" height="74.459568" rx="7.980321" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="300.608062" text-anchor="middle" font-size="32.363924" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">float</text>
  <text x="640" y="322.162215" text-anchor="middle" font-size="18.493595" fill="var(--text-muted)" font-family="Arial, sans-serif">32-bit float</text>
  <line x1="640" y1="333.919014" x2="640" y2="355.473045" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="367.272727" y="357.432492" width="545.454545" height="74.459568" rx="7.980321" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="400.540554" text-anchor="middle" font-size="32.363924" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">long long</text>
  <text x="640" y="422.094706" text-anchor="middle" font-size="18.493595" fill="var(--text-muted)" font-family="Arial, sans-serif">64-bit integer</text>
  <line x1="640" y1="433.851384" x2="640" y2="455.405537" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="367.272727" y="457.364983" width="545.454545" height="74.459568" rx="7.980321" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="500.473045" text-anchor="middle" font-size="32.363924" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">long / int</text>
  <text x="640" y="522.027076" text-anchor="middle" font-size="18.493595" fill="var(--text-muted)" font-family="Arial, sans-serif">32-bit integer · narrowest here</text>
  <text x="994.545455" y="292.770277" font-size="18.493595" fill="var(--text-faint)" font-family="Arial, sans-serif">Conversions go</text>
  <text x="994.545455" y="314.32443" font-size="18.493595" fill="var(--text-faint)" font-family="Arial, sans-serif">upward implicitly.</text>
  <text x="994.545455" y="335.878339" font-size="18.493595" fill="var(--text-faint)" font-family="Arial, sans-serif">Downward requires</text>
  <text x="994.545455" y="357.432492" font-size="18.493595" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">explicit cast</text>
  <text x="994.545455" y="378.986644" font-size="18.493595" fill="var(--text-faint)" font-family="Arial, sans-serif">— may lose data.</text>
  <rect x="40" y="565.135138" width="1200" height="54.864862" rx="7.980321" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="594.527076" text-anchor="middle" font-size="20.805361" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Embedded caution: float↔int conversions on MCUs without FPU are expensive</text>
  <text x="640" y="614.121783" text-anchor="middle" font-size="17.337778" fill="var(--text-muted)" font-family="Arial, sans-serif">Use integer math where possible; avoid implicit float promotion in hot paths</text>
</svg>

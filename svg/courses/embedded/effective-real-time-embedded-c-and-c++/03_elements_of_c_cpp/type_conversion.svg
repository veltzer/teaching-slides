  <ns0:rect x="391.1111" y="410.6667" width="355.5556" height="67.5556" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="449.7778" text-anchor="middle" font-family="monospace" font-size="24.8889" font-weight="bold" fill="#212121">long / int</ns0:text>
  <ns0:text x="568.8889" y="469.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">32-bit integer · narrowest here</ns0:text>
  <ns0:text x="800" y="261.3333" font-family="sans-serif" font-size="14.2222" fill="#9e9e9e">Conversions go</ns0:text>
  <ns0:text x="800" y="280.8889" font-family="sans-serif" font-size="14.2222" fill="#9e9e9e">upward implicitly.</ns0:text>
  <ns0:text x="800" y="300.4444" font-family="sans-serif" font-size="14.2222" fill="#9e9e9e">Downward requires</ns0:text>
  <ns0:text x="800" y="320" font-family="sans-serif" font-size="14.2222" fill="#1565c0" font-weight="bold">explicit cast</ns0:text>
  <ns0:text x="800" y="339.5556" font-family="sans-serif" font-size="14.2222" fill="#9e9e9e">— may lose data.</ns0:text>
  <ns0:rect x="177.7778" y="508.4444" width="782.2222" height="49.7778" rx="5.3333" fill="#fff3e0" stroke="#f57f17" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="535.1111" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e65100" font-weight="bold">Embedded caution: float↔int conversions on MCUs without FPU are expensive</ns0:text>
  <ns0:text x="568.8889" y="552.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Use integer math where possible; avoid implicit float promotion in hot paths</ns0:text>
</ns0:svg>
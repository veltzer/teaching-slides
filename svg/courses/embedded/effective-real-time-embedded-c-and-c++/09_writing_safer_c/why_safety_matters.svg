<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="744.7273" height="418.9091" fill="var(--bg)" rx="6"/>
  <line x1="93.0909" y1="296.7273" x2="663.2727" y2="296.7273" stroke="var(--text)" stroke-width="1.4545" marker-end="url(#arrow)" />
  <line x1="93.0909" y1="296.7273" x2="93.0909" y2="29.0909" stroke="var(--text)" stroke-width="1.4545" marker-end="url(#arrow)" />
  <text x="378.1818" y="322.9091" text-anchor="middle" font-family="sans-serif" font-size="12.8" fill="var(--text-muted)">Development Phase</text>
  <text x="41.8909" y="168.7273" text-anchor="middle" font-family="sans-serif" font-size="12.8" fill="var(--text-muted)" transform="rotate(-90 72 360)">Cost to Fix</text>
  <path d="M 128 308.3636 Q 256 279.2727 372.3636 221.0909 T 558.5455 104.7273 L 640 81.4545" stroke="var(--primary-border)" stroke-width="2.3273" fill="none" />
  <path d="M 128 308.3636 Q 256 279.2727 372.3636 221.0909 T 558.5455 104.7273 L 640 81.4545 L 640 337.4545 L 128 337.4545 Z" fill="var(--primary-fill)" opacity="0.4" />
  <line x1="151.2727" y1="293.2364" x2="151.2727" y2="300.2182" stroke="var(--text-muted)" stroke-width="1.1636" />
  <text x="151.2727" y="313.0182" text-anchor="middle" font-family="sans-serif" font-size="10.4727" fill="var(--text-muted)">Design</text>
  <line x1="302.5455" y1="293.2364" x2="302.5455" y2="300.2182" stroke="var(--text-muted)" stroke-width="1.1636" />
  <text x="302.5455" y="313.0182" text-anchor="middle" font-family="sans-serif" font-size="10.4727" fill="var(--text-muted)">Code</text>
  <line x1="430.5455" y1="293.2364" x2="430.5455" y2="300.2182" stroke="var(--text-muted)" stroke-width="1.1636" />
  <text x="430.5455" y="313.0182" text-anchor="middle" font-family="sans-serif" font-size="10.4727" fill="var(--text-muted)">Test</text>
  <line x1="558.5455" y1="293.2364" x2="558.5455" y2="300.2182" stroke="var(--text-muted)" stroke-width="1.1636" />
  <text x="558.5455" y="313.0182" text-anchor="middle" font-family="sans-serif" font-size="10.4727" fill="var(--text-muted)">Deploy</text>
  <circle cx="151.2727" cy="266.4727" r="4.6545" fill="var(--primary-accent)" />
  <text x="180.3636" y="260.6545" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">1×</text>
  <circle cx="302.5455" cy="222.2545" r="4.6545" fill="var(--primary-accent)" />
  <text x="331.6364" y="216.4364" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">6×</text>
  <circle cx="430.5455" cy="168.7273" r="4.6545" fill="var(--primary-accent)" />
  <text x="459.6364" y="162.9091" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">15×</text>
  <circle cx="558.5455" cy="75.6364" r="4.6545" fill="var(--primary-accent)" />
  <text x="587.6364" y="69.8182" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">100×+</text>
  <rect x="116.3636" y="337.4545" width="512" height="27.9273" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="372.3636" y="354.9091" text-anchor="middle" font-family="sans-serif" font-size="10.4727" fill="var(--primary-accent)">Find bugs at design time — not in the field where devices may be unreachable</text>
</svg>
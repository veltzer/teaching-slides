  <text x="462.4519" y="311.3452" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Development Phase</text>
  <text x="234.4013" y="206.789" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)" transform="rotate(-90 72 360)">Cost to Fix</text>
  <path d="M 292.7949 301.4813 Q 379.5961 281.7538 458.5064 242.2986 T 584.7628 163.3884 L 640 147.6064" stroke="var(--primary-border)" stroke-width="0.9104" fill="none" />
  <path d="M 292.7949 301.4813 Q 379.5961 281.7538 458.5064 242.2986 T 584.7628 163.3884 L 640 147.6064 L 640 321.2089 L 292.7949 321.2089 Z" fill="var(--primary-fill)" opacity="0.4" />

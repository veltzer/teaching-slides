  <rect width="592.9358" height="333.5264" fill="var(--bg)" rx="4.7771" />
  <line x1="204.5628" y1="289.6121" x2="658.5293" y2="289.6121" stroke="var(--text)" stroke-width="0.9702" marker-end="url(#arrow)" />
  <line x1="204.5628" y1="289.6121" x2="204.5628" y2="76.5258" stroke="var(--text)" stroke-width="0.9702" marker-end="url(#arrow)" />
  <text x="431.546" y="310.4575" text-anchor="middle" font-family="sans-serif" font-size="10.1911" fill="var(--text-muted)">Development Phase</text>
  <text x="163.7985" y="187.7012" text-anchor="middle" font-family="sans-serif" font-size="10.1911" fill="var(--text-muted)" transform="rotate(-90 72 360)">Cost to Fix</text>
  <path d="M 232.3567 298.8766 Q 334.2675 275.7151 426.9137 229.392 T 575.1477 136.7458 L 640 118.2166" stroke="var(--primary-border)" stroke-width="1.5524" fill="none" />
  <path d="M 232.3567 298.8766 Q 334.2675 275.7151 426.9137 229.392 T 575.1477 136.7458 L 640 118.2166 L 640 322.0382 L 232.3567 322.0382 Z" fill="var(--primary-fill)" opacity="0.4" />

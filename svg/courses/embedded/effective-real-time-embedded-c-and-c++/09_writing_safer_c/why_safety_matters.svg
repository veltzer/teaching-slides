  <text x="328.3045" y="269.1281" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">1×</text>
  <circle cx="411.1603" cy="243.0877" r="3.1564" fill="var(--primary-accent)" />
  <text x="430.8878" y="239.1423" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">6×</text>

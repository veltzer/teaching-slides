  <rect x="284.9038" y="321.2089" width="347.2051" height="18.9385" rx="5.1104" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.1729" />
  <text x="458.5064" y="333.0455" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">Find bugs at design time — not in the field where devices may be unreachable</text>
</svg>
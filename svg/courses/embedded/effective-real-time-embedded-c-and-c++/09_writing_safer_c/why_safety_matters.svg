  <rect width="505.0257" height="284.0769" fill="var(--bg)" rx="5.1104" />
  <line x1="269.1218" y1="293.5904" x2="655.7821" y2="293.5904" stroke="var(--text)" stroke-width="0.569" marker-end="url(#arrow)" />

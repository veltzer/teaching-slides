<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="888.8889" height="500" fill="var(--bg)" rx="7.1615"/>
  <line x1="306.6666" y1="434.1667" x2="987.2222" y2="434.1667" stroke="var(--text)" stroke-width="1.4545" marker-end="url(#arrow)" />
  <line x1="306.6666" y1="434.1667" x2="306.6666" y2="114.7222" stroke="var(--text)" stroke-width="1.4545" marker-end="url(#arrow)" />
  <text x="646.9444" y="465.4167" text-anchor="middle" font-family="sans-serif" font-size="15.2778" fill="var(--text-muted)">Development Phase</text>
  <text x="245.5555" y="281.3889" text-anchor="middle" font-family="sans-serif" font-size="15.2778" fill="var(--text-muted)" transform="rotate(-90 72 360)">Cost to Fix</text>
  <path d="M 348.3333 448.0555 Q 501.1111 413.3333 639.9999 343.8889 T 862.2223 205 L 959.4444 177.2222" stroke="var(--primary-border)" stroke-width="2.3273" fill="none" />
  <path d="M 348.3333 448.0555 Q 501.1111 413.3333 639.9999 343.8889 T 862.2223 205 L 959.4444 177.2222 L 959.4444 482.7777 L 348.3333 482.7777 Z" fill="var(--primary-fill)" opacity="0.4" />
  <line x1="376.1111" y1="430" x2="376.1111" y2="438.3333" stroke="var(--text-muted)" stroke-width="1.1636" />
  <text x="376.1111" y="453.6111" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="var(--text-muted)">Design</text>
  <line x1="556.6667" y1="430" x2="556.6667" y2="438.3333" stroke="var(--text-muted)" stroke-width="1.1636" />
  <text x="556.6667" y="453.6111" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="var(--text-muted)">Code</text>
  <line x1="709.4445" y1="430" x2="709.4445" y2="438.3333" stroke="var(--text-muted)" stroke-width="1.1636" />
  <text x="709.4445" y="453.6111" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="var(--text-muted)">Test</text>
  <line x1="862.2223" y1="430" x2="862.2223" y2="438.3333" stroke="var(--text-muted)" stroke-width="1.1636" />
  <text x="862.2223" y="453.6111" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="var(--text-muted)">Deploy</text>
  <circle cx="376.1111" cy="398.0555" r="5.5555" fill="var(--primary-accent)" />
  <text x="410.8333" y="391.1111" font-family="sans-serif" font-size="11.9358" fill="var(--primary-accent)">1×</text>
  <circle cx="556.6667" cy="345.2777" r="5.5555" fill="var(--primary-accent)" />
  <text x="591.3889" y="338.3334" font-family="sans-serif" font-size="11.9358" fill="var(--primary-accent)">6×</text>
  <circle cx="709.4445" cy="281.3889" r="5.5555" fill="var(--primary-accent)" />
  <text x="744.1667" y="274.4445" font-family="sans-serif" font-size="11.9358" fill="var(--primary-accent)">15×</text>
  <circle cx="862.2223" cy="170.2778" r="5.5555" fill="var(--primary-accent)" />
  <text x="896.9445" y="163.3334" font-family="sans-serif" font-size="11.9358" fill="var(--primary-accent)">100×+</text>
  <rect x="334.4444" y="482.7777" width="611.1111" height="33.3334" rx="7.1615" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="503.6111" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="var(--primary-accent)">Find bugs at design time — not in the field where devices may be unreachable</text>
</svg>
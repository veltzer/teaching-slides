<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="924.1345" height="484.3918" fill="var(--bg)" rx="6" x="40" y="40"/>
  <line x1="532.4596" y1="540.6137" x2="1240" y2="540.6137" stroke="var(--text)" stroke-width="0.569" marker-end="url(#arrow)" />
  <line x1="532.4596" y1="540.6137" x2="532.4596" y2="231.1411" stroke="var(--text)" stroke-width="0.569" marker-end="url(#arrow)" />
  <text x="886.2297" y="570.8881" text-anchor="middle" font-family="sans-serif" font-size="17.6641" fill="var(--text-muted)">Development Phase</text>
  <text x="468.9253" y="392.6048" text-anchor="middle" font-family="sans-serif" font-size="17.6641" fill="var(--text-muted)" transform="rotate(-90 72 360)">Cost to Fix</text>
  <path d="M 575.7784 554.0688 Q 734.6138 520.4306 879.0099 453.1538 T 1110.0435 318.6006 L 1211.1207 291.69" stroke="var(--primary-border)" stroke-width="0.9104" fill="none" />
  <path d="M 575.7784 554.0688 Q 734.6138 520.4306 879.0099 453.1538 T 1110.0435 318.6006 L 1211.1207 291.69 L 1211.1207 587.7071 L 575.7784 587.7071 Z" fill="var(--primary-fill)" opacity="0.4" />
  <line x1="604.6575" y1="536.5769" x2="604.6575" y2="544.6501" stroke="var(--text-muted)" stroke-width="0.4552" />
  <text x="604.6575" y="559.4509" text-anchor="middle" font-family="sans-serif" font-size="17.6641" fill="var(--text-muted)">Design</text>
  <line x1="792.3724" y1="536.5769" x2="792.3724" y2="544.6501" stroke="var(--text-muted)" stroke-width="0.4552" />
  <text x="792.3724" y="559.4509" text-anchor="middle" font-family="sans-serif" font-size="17.6641" fill="var(--text-muted)">Code</text>
  <line x1="951.208" y1="536.5769" x2="951.208" y2="544.6501" stroke="var(--text-muted)" stroke-width="0.4552" />
  <text x="951.208" y="559.4509" text-anchor="middle" font-family="sans-serif" font-size="17.6641" fill="var(--text-muted)">Test</text>
  <line x1="1110.0435" y1="536.5769" x2="1110.0435" y2="544.6501" stroke="var(--text-muted)" stroke-width="0.4552" />
  <text x="1110.0435" y="559.4509" text-anchor="middle" font-family="sans-serif" font-size="17.6641" fill="var(--text-muted)">Deploy</text>
  <rect x="599.082" y="500.054" width="11.151" height="11.151" rx="5.5755" fill="var(--primary-accent)"/>
  <text x="640.7566" y="498.9019" font-family="sans-serif" font-size="17.6641" fill="var(--primary-accent)">1×</text>
  <rect x="786.797" y="448.924" width="11.151" height="11.151" rx="5.5755" fill="var(--primary-accent)"/>
  <text x="828.4713" y="447.7718" font-family="sans-serif" font-size="17.6641" fill="var(--primary-accent)">6×</text>
  <rect x="945.632" y="387.029" width="11.151" height="11.151" rx="5.5755" fill="var(--primary-accent)"/>
  <text x="987.3069" y="385.8774" font-family="sans-serif" font-size="17.6641" fill="var(--primary-accent)">15×</text>
  <rect x="1104.47" y="279.387" width="11.151" height="11.151" rx="5.5755" fill="var(--primary-accent)"/>
  <text x="1146.1425" y="278.2348" font-family="sans-serif" font-size="17.6641" fill="var(--primary-accent)">100×+</text>
  <rect x="561.3387" y="587.7071" width="635.3423" height="32.2929" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="879.0099" y="607.8902" text-anchor="middle" font-family="sans-serif" font-size="17.6641" fill="var(--primary-accent)">Find bugs at design time — not in the field where devices may be unreachable</text>
</svg>
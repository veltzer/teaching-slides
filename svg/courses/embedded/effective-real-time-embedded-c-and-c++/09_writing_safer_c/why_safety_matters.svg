<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Axes -->
  <line x1="160" y1="510" x2="1140" y2="510" stroke="#212121" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="510" x2="160" y2="50" stroke="#212121" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Axis labels -->
  <text x="650" y="555" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#555555">Development Phase</text>
  <text x="72" y="290" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#555555" transform="rotate(-90 72 360)">Cost to Fix</text>

  <!-- Exponential curve -->
  <path d="M 220 530 Q 440 480 640 380 T 960 180 L 1100 140" stroke="#1565c0" stroke-width="4" fill="none"/>
  <!-- Shaded area under curve -->
  <path d="M 220 530 Q 440 480 640 380 T 960 180 L 1100 140 L 1100 580 L 220 580 Z" fill="#e3f2fd" opacity="0.4"/>

  <!-- Phase markers on x-axis -->
  <line x1="260" y1="504" x2="260" y2="516" stroke="#555555" stroke-width="2"/>
  <text x="260" y="538" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">Design</text>

  <line x1="520" y1="504" x2="520" y2="516" stroke="#555555" stroke-width="2"/>
  <text x="520" y="538" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">Code</text>

  <line x1="740" y1="504" x2="740" y2="516" stroke="#555555" stroke-width="2"/>
  <text x="740" y="538" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">Test</text>

  <line x1="960" y1="504" x2="960" y2="516" stroke="#555555" stroke-width="2"/>
  <text x="960" y="538" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">Deploy</text>

  <!-- Cost callout dots -->
  <circle cx="260" cy="458" r="8" fill="#1565c0"/>
  <text x="310" y="448" font-family="sans-serif" font-size="16" fill="#1565c0">1×</text>

  <circle cx="520" cy="382" r="8" fill="#1565c0"/>
  <text x="570" y="372" font-family="sans-serif" font-size="16" fill="#1565c0">6×</text>

  <circle cx="740" cy="290" r="8" fill="#1565c0"/>
  <text x="790" y="280" font-family="sans-serif" font-size="16" fill="#1565c0">15×</text>

  <circle cx="960" cy="130" r="8" fill="#1565c0"/>
  <text x="1010" y="120" font-family="sans-serif" font-size="16" fill="#1565c0">100×+</text>

  <!-- Key message -->
  <rect x="200" y="580" width="880" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="610" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1565c0">Find bugs at design time — not in the field where devices may be unreachable</text>
</svg>

  <text x="250.8859" y="302.5825" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Design</text>
  <line x1="371.326" y1="286.8327" x2="371.326" y2="292.3914" stroke="var(--text-muted)" stroke-width="0.7762" />
  <text x="371.326" y="302.5825" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Code</text>
  <line x1="473.2369" y1="286.8327" x2="473.2369" y2="292.3914" stroke="var(--text-muted)" stroke-width="0.7762" />
  <text x="473.2369" y="302.5825" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Test</text>
  <line x1="575.1477" y1="286.8327" x2="575.1477" y2="292.3914" stroke="var(--text-muted)" stroke-width="0.7762" />
  <text x="575.1477" y="302.5825" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Deploy</text>
  <circle cx="250.8859" cy="265.524" r="3.7058" fill="var(--primary-accent)" />
  <text x="274.0475" y="260.8917" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">1×</text>
  <circle cx="371.326" cy="230.3184" r="3.7058" fill="var(--primary-accent)" />
  <text x="394.4876" y="225.6862" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">6×</text>
  <circle cx="473.2369" cy="187.7012" r="3.7058" fill="var(--primary-accent)" />
  <text x="496.3984" y="183.069" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">15×</text>
  <circle cx="575.1477" cy="113.5843" r="3.7058" fill="var(--primary-accent)" />
  <text x="598.3093" y="108.952" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">100×+</text>
  <rect x="223.092" y="322.0382" width="407.6433" height="22.2351" rx="4.7771" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.3341" />
  <text x="426.9137" y="335.9352" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">Find bugs at design time — not in the field where devices may be unreachable</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Center label -->
  <circle cx="640" cy="300" r="110" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="292" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Embedded</text>
  <text x="640" y="322" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">System</text>

  <!-- Memory -->
  <rect x="160" y="70" width="260" height="110" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="118" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#212121">Memory</text>
  <text x="290" y="150" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">KB–MB, not GB</text>
  <line x1="420" y1="125" x2="536" y2="220" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-accent)"/>

  <!-- Power -->
  <rect x="860" y="70" width="260" height="110" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="990" y="118" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#212121">Power</text>
  <text x="990" y="150" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">mW budget</text>
  <line x1="860" y1="125" x2="744" y2="220" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-accent)"/>

  <!-- Speed -->
  <rect x="160" y="420" width="260" height="110" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="468" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#212121">Speed</text>
  <text x="290" y="500" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">MHz, hard deadlines</text>
  <line x1="420" y1="475" x2="536" y2="380" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-accent)"/>

  <!-- Cost -->
  <rect x="860" y="420" width="260" height="110" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="990" y="468" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#212121">Cost</text>
  <text x="990" y="500" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">cents per unit</text>
  <line x1="860" y1="475" x2="744" y2="380" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-accent)"/>
</svg>

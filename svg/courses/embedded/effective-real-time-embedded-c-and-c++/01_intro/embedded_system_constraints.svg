<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <circle cx="640.000067" cy="330.000078" r="138.096556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="640.000067" y="319.91319" text-anchor="middle" font-family="sans-serif" font-size="32.640991" font-weight="bold" fill="var(--bg)">Embedded</text>
  <text x="640.000067" y="357.739178" text-anchor="middle" font-family="sans-serif" font-size="32.640991" font-weight="bold" fill="var(--bg)">System</text>
  <rect x="40" y="40" width="325.000036" height="138.695656" rx="8.667783" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="202.500018" y="100.5218" text-anchor="middle" font-family="sans-serif" font-size="35.151903" font-weight="bold" fill="var(--text)">Memory</text>
  <text x="202.500018" y="140.869511" text-anchor="middle" font-family="sans-serif" font-size="22.597631" fill="var(--text-muted)">KB–MB, not GB</text>
  <line x1="365.000036" y1="109.34775" x2="509.999919" y2="229.130567" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)" />
  <rect x="914.999964" y="40" width="325.000036" height="138.695656" rx="8.667783" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1077.500115" y="100.5218" text-anchor="middle" font-family="sans-serif" font-size="35.151903" font-weight="bold" fill="var(--text)">Power</text>
  <text x="1077.500115" y="140.869511" text-anchor="middle" font-family="sans-serif" font-size="22.597631" fill="var(--text-muted)">mW budget</text>
  <line x1="914.999964" y1="109.34775" x2="770.000081" y2="229.130567" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)" />
  <rect x="40" y="481.304344" width="325.000036" height="138.695656" rx="8.667783" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="202.500018" y="541.826145" text-anchor="middle" font-family="sans-serif" font-size="35.151903" font-weight="bold" fill="var(--text)">Speed</text>
  <text x="202.500018" y="582.173855" text-anchor="middle" font-family="sans-serif" font-size="22.597631" fill="var(--text-muted)">MHz, hard deadlines</text>
  <line x1="365.000036" y1="550.65225" x2="509.999919" y2="430.869589" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)" />
  <rect x="914.999964" y="481.304344" width="325.000036" height="138.695656" rx="8.667783" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1077.500115" y="541.826145" text-anchor="middle" font-family="sans-serif" font-size="35.151903" font-weight="bold" fill="var(--text)">Cost</text>
  <text x="1077.500115" y="582.173855" text-anchor="middle" font-family="sans-serif" font-size="22.597631" fill="var(--text-muted)">cents per unit</text>
  <line x1="914.999964" y1="550.65225" x2="770.000081" y2="430.869589" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="501.904" y="191.904" width="276.193" height="276.193" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640.000067" y="319.91319" text-anchor="middle" font-size="32.640991" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Embedded</text>
  <text x="640.000067" y="357.739178" text-anchor="middle" font-size="32.640991" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">System</text>
  <rect x="40" y="40" width="325.000036" height="138.695656" rx="8.667783" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="202.500018" y="100.5218" text-anchor="middle" font-size="35.151903" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory</text>
  <text x="202.500018" y="140.869511" text-anchor="middle" font-size="22.597631" fill="var(--text-muted)" font-family="Arial, sans-serif">KB–MB, not GB</text>
  <line x1="365.000036" y1="109.34775" x2="509.999919" y2="229.130567" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)"/>
  <rect x="914.999964" y="40" width="325.000036" height="138.695656" rx="8.667783" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1077.500115" y="100.5218" text-anchor="middle" font-size="35.151903" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Power</text>
  <text x="1077.500115" y="140.869511" text-anchor="middle" font-size="22.597631" fill="var(--text-muted)" font-family="Arial, sans-serif">mW budget</text>
  <line x1="914.999964" y1="109.34775" x2="770.000081" y2="229.130567" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)"/>
  <rect x="40" y="481.304344" width="325.000036" height="138.695656" rx="8.667783" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="202.500018" y="541.826145" text-anchor="middle" font-size="35.151903" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Speed</text>
  <text x="202.500018" y="582.173855" text-anchor="middle" font-size="22.597631" fill="var(--text-muted)" font-family="Arial, sans-serif">MHz, hard deadlines</text>
  <line x1="365.000036" y1="550.65225" x2="509.999919" y2="430.869589" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)"/>
  <rect x="914.999964" y="481.304344" width="325.000036" height="138.695656" rx="8.667783" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1077.500115" y="541.826145" text-anchor="middle" font-size="35.151903" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cost</text>
  <text x="1077.500115" y="582.173855" text-anchor="middle" font-size="22.597631" fill="var(--text-muted)" font-family="Arial, sans-serif">cents per unit</text>
  <line x1="914.999964" y1="550.65225" x2="770.000081" y2="430.869589" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)"/>
</svg>

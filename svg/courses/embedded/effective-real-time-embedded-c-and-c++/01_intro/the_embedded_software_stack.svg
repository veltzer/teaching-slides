<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#212121">The Embedded Software Stack</text>
  <line x1="200" y1="66" x2="1080" y2="66" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Layer 1: Application (top, accent) -->
  <rect x="200" y="90" width="880" height="96" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Application Layer</text>
  <text x="640" y="173" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">Business logic · user features</text>

  <!-- Layer 2: Middleware/RTOS -->
  <rect x="200" y="200" width="880" height="96" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="255" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#212121">Middleware / RTOS</text>
  <text x="640" y="283" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Scheduling · IPC · file systems</text>

  <!-- Layer 3: Device Drivers -->
  <rect x="200" y="310" width="880" height="96" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="365" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#212121">Device Drivers</text>
  <text x="640" y="393" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">UART · SPI · I2C · GPIO</text>

  <!-- Layer 4: HAL -->
  <rect x="200" y="420" width="880" height="96" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="475" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#212121">Hardware Abstraction Layer</text>
  <text x="640" y="503" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Portable register access · MCU abstraction</text>

  <!-- Layer 5: Hardware (bottom, dark) -->
  <rect x="200" y="530" width="880" height="96" rx="6" fill="#212121" filter="url(#shadow)"/>
  <text x="640" y="585" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Hardware</text>
  <text x="640" y="613" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#9e9e9e">CPU · memory · peripherals</text>

  <!-- Arrow annotations on side -->
  <text x="115" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555" transform="rotate(-90 115 360)">High abstraction</text>
  <line x1="140" y1="90" x2="140" y2="626" stroke="#e0e0e0" stroke-width="1.5"/>
  <polygon points="140,85 136,98 144,98" fill="#aaaaaa"/>
  <polygon points="140,631 136,618 144,618" fill="#aaaaaa"/>
  <text x="1165" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555" transform="rotate(90 1165 360)">Close to hardware</text>
  <line x1="1140" y1="90" x2="1140" y2="626" stroke="#e0e0e0" stroke-width="1.5"/>
  <polygon points="1140,631 1136,618 1144,618" fill="#aaaaaa"/>
  <polygon points="1140,85 1136,98 1144,98" fill="#aaaaaa"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="227.5" y="56.1111" width="825" height="77.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="100.4167" text-anchor="middle" font-family="sans-serif" font-size="26.0708" font-weight="bold" fill="var(--bg)">Application Layer</text>
  <text x="640" y="122.9723" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">Business logic · user features</text>
  <rect x="227.5" y="144.7223" width="825" height="77.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="189.0277" text-anchor="middle" font-family="sans-serif" font-size="26.0708" font-weight="bold" fill="var(--text)">Middleware / RTOS</text>
  <text x="640" y="211.5833" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Scheduling · IPC · file systems</text>
  <rect x="227.5" y="233.3333" width="825" height="77.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="277.6389" text-anchor="middle" font-family="sans-serif" font-size="26.0708" font-weight="bold" fill="var(--text)">Device Drivers</text>
  <text x="640" y="300.1944" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">UART · SPI · I2C · GPIO</text>
  <rect x="227.5" y="321.9444" width="825" height="77.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="366.25" text-anchor="middle" font-family="sans-serif" font-size="26.0708" font-weight="bold" fill="var(--text)">Hardware Abstraction Layer</text>
  <text x="640" y="388.8056" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Portable register access · MCU abstraction</text>
  <rect x="227.5" y="410.5556" width="825" height="77.3333" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="640" y="454.8611" text-anchor="middle" font-family="sans-serif" font-size="26.0708" font-weight="bold" fill="var(--bg)">Hardware</text>
  <text x="640" y="477.4167" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-faint)">CPU · memory · peripherals</text>
  <text x="147.8125" y="273.6111" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)" transform="rotate(-90 115 360)">High abstraction</text>
  <line x1="171.25" y1="56.1111" x2="171.25" y2="487.8889" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="171.25,108.4723 167.5,118.9444 175,118.9444" fill="var(--text-faint)" />
  <polygon points="171.25,548.3056 167.5,537.8333 175,537.8333" fill="var(--text-faint)" />
  <text x="1132.1875" y="273.6111" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)" transform="rotate(90 1165 360)">Close to hardware</text>
  <line x1="1108.7499" y1="56.1111" x2="1108.7499" y2="487.8889" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="1108.7499,548.3056 1105,537.8333 1112.5,537.8333" fill="var(--text-faint)" />
  <polygon points="1108.7499,108.4723 1105,118.9444 1112.5,118.9444" fill="var(--text-faint)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="116.190476" y="40" width="1047.619048" height="91.129247" rx="7.339586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="92.209539" text-anchor="middle" font-size="31.891482" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Application Layer</text>
  <text x="640" y="118.788967" text-anchor="middle" font-size="18.071897" fill="var(--primary-accent)" font-family="Arial, sans-serif">Business logic · user features</text>
  <rect x="116.190476" y="144.419078" width="1047.619048" height="91.129247" rx="7.339586" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="196.628382" text-anchor="middle" font-size="31.891482" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Middleware / RTOS</text>
  <text x="640" y="223.207809" text-anchor="middle" font-size="18.071897" fill="var(--text-muted)" font-family="Arial, sans-serif">Scheduling · IPC · file systems</text>
  <rect x="116.190476" y="248.837921" width="1047.619048" height="91.129247" rx="7.339586" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="301.04746" text-anchor="middle" font-size="31.891482" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Device Drivers</text>
  <text x="640" y="327.626769" text-anchor="middle" font-size="18.071897" fill="var(--text-muted)" font-family="Arial, sans-serif">UART · SPI · I2C · GPIO</text>
  <rect x="116.190476" y="353.256881" width="1047.619048" height="91.129247" rx="7.339586" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="405.46642" text-anchor="middle" font-size="31.891482" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Hardware Abstraction Layer</text>
  <text x="640" y="432.045848" text-anchor="middle" font-size="18.071897" fill="var(--text-muted)" font-family="Arial, sans-serif">Portable register access · MCU abstraction</text>
  <rect x="116.190476" y="457.675959" width="1047.619048" height="91.129247" rx="7.339586" fill="var(--text)"/>
  <text x="640" y="509.885381" text-anchor="middle" font-size="31.891482" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Hardware</text>
  <text x="640" y="536.464808" text-anchor="middle" font-size="18.071897" fill="var(--text-faint)" font-family="Arial, sans-serif">CPU · memory · peripherals</text>
  <text x="147.8125" y="273.6111" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)" transform="rotate(-90 115 360)" font-family="Arial, sans-serif">High abstraction</text>
  <line x1="44.761905" y1="40" x2="44.761905" y2="548.805206" stroke="var(--border)" stroke-width="1.3333"/>
  <polygon points="44.761905,101.702225 40,114.042506 49.52381,114.042506" fill="var(--text-faint)"/>
  <polygon points="44.761905,620 40,607.659484 49.52381,607.659484" fill="var(--text-faint)"/>
  <text x="1132.1875" y="273.6111" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)" transform="rotate(90 1165 360)" font-family="Arial, sans-serif">Close to hardware</text>
  <line x1="1235.237968" y1="40" x2="1235.237968" y2="548.805206" stroke="var(--border)" stroke-width="1.3333"/>
  <polygon points="1235.237968,620 1230.47619,607.659484 1240,607.659484" fill="var(--text-faint)"/>
  <polygon points="1235.237968,101.702225 1230.47619,114.042506 1240,114.042506" fill="var(--text-faint)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="116.190476" y="40" width="1047.619048" height="91.129247" rx="7.339586" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="92.209539" text-anchor="middle" font-family="sans-serif" font-size="31.891482" font-weight="bold" fill="var(--bg)">Application Layer</text>
  <text x="640" y="118.788967" text-anchor="middle" font-family="sans-serif" font-size="18.071897" fill="var(--primary-accent)">Business logic · user features</text>
  <rect x="116.190476" y="144.419078" width="1047.619048" height="91.129247" rx="7.339586" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="196.628382" text-anchor="middle" font-family="sans-serif" font-size="31.891482" font-weight="bold" fill="var(--text)">Middleware / RTOS</text>
  <text x="640" y="223.207809" text-anchor="middle" font-family="sans-serif" font-size="18.071897" fill="var(--text-muted)">Scheduling · IPC · file systems</text>
  <rect x="116.190476" y="248.837921" width="1047.619048" height="91.129247" rx="7.339586" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="301.04746" text-anchor="middle" font-family="sans-serif" font-size="31.891482" font-weight="bold" fill="var(--text)">Device Drivers</text>
  <text x="640" y="327.626769" text-anchor="middle" font-family="sans-serif" font-size="18.071897" fill="var(--text-muted)">UART · SPI · I2C · GPIO</text>
  <rect x="116.190476" y="353.256881" width="1047.619048" height="91.129247" rx="7.339586" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="405.46642" text-anchor="middle" font-family="sans-serif" font-size="31.891482" font-weight="bold" fill="var(--text)">Hardware Abstraction Layer</text>
  <text x="640" y="432.045848" text-anchor="middle" font-family="sans-serif" font-size="18.071897" fill="var(--text-muted)">Portable register access · MCU abstraction</text>
  <rect x="116.190476" y="457.675959" width="1047.619048" height="91.129247" rx="7.339586" fill="var(--text)" />
  <text x="640" y="509.885381" text-anchor="middle" font-family="sans-serif" font-size="31.891482" font-weight="bold" fill="var(--bg)">Hardware</text>
  <text x="640" y="536.464808" text-anchor="middle" font-family="sans-serif" font-size="18.071897" fill="var(--text-faint)">CPU · memory · peripherals</text>
  <text x="147.8125" y="273.6111" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)" transform="rotate(-90 115 360)">High abstraction</text>
  <line x1="44.761905" y1="40" x2="44.761905" y2="548.805206" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="44.761905,101.702225 40,114.042506 49.52381,114.042506" fill="var(--text-faint)" />
  <polygon points="44.761905,620 40,607.659484 49.52381,607.659484" fill="var(--text-faint)" />
  <text x="1132.1875" y="273.6111" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)" transform="rotate(90 1165 360)">Close to hardware</text>
  <line x1="1235.237968" y1="40" x2="1235.237968" y2="548.805206" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="1235.237968,620 1230.47619,607.659484 1240,607.659484" fill="var(--text-faint)" />
  <polygon points="1235.237968,101.702225 1230.47619,114.042506 1240,114.042506" fill="var(--text-faint)" />
</svg>
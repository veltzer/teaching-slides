<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="177.7778" y="17.7778" width="782.2222" height="85.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="66.6667" text-anchor="middle" font-family="sans-serif" font-size="26.6667" font-weight="bold" fill="var(--bg)">Application Layer</text>
  <text x="568.8889" y="91.5556" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">Business logic · user features</text>
  <rect x="177.7778" y="115.5556" width="782.2222" height="85.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="164.4444" text-anchor="middle" font-family="sans-serif" font-size="26.6667" font-weight="bold" fill="var(--text)">Middleware / RTOS</text>
  <text x="568.8889" y="189.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Scheduling · IPC · file systems</text>
  <rect x="177.7778" y="213.3333" width="782.2222" height="85.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="262.2222" text-anchor="middle" font-family="sans-serif" font-size="26.6667" font-weight="bold" fill="var(--text)">Device Drivers</text>
  <text x="568.8889" y="287.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">UART · SPI · I2C · GPIO</text>
  <rect x="177.7778" y="311.1111" width="782.2222" height="85.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="360" text-anchor="middle" font-family="sans-serif" font-size="26.6667" font-weight="bold" fill="var(--text)">Hardware Abstraction Layer</text>
  <text x="568.8889" y="384.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Portable register access · MCU abstraction</text>
  <rect x="177.7778" y="408.8889" width="782.2222" height="85.3333" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="568.8889" y="457.7778" text-anchor="middle" font-family="sans-serif" font-size="26.6667" font-weight="bold" fill="var(--bg)">Hardware</text>
  <text x="568.8889" y="482.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-faint)">CPU · memory · peripherals</text>
  <text x="102.2222" y="257.7778" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)" transform="rotate(-90 115 360)">High abstraction</text>
  <line x1="124.4444" y1="17.7778" x2="124.4444" y2="494.2222" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="124.4444,75.5556 120.8889,87.1111 128,87.1111" fill="var(--text-faint)" />
  <polygon points="124.4444,560.8889 120.8889,549.3333 128,549.3333" fill="var(--text-faint)" />
  <text x="1035.5556" y="257.7778" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)" transform="rotate(90 1165 360)">Close to hardware</text>
  <line x1="1013.3333" y1="17.7778" x2="1013.3333" y2="494.2222" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="1013.3333,560.8889 1009.7778,549.3333 1016.8889,549.3333" fill="var(--text-faint)" />
  <polygon points="1013.3333,75.5556 1009.7778,87.1111 1016.8889,87.1111" fill="var(--text-faint)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Priority Groups (3 bits preempt, 1 bit sub)</text>
  <rect x="160" y="144" width="960" height="96" fill="#ffcccc" stroke="#333" />
  <text x="640" y="204" text-anchor="middle" font-size="33.6">Priority 0x00-0x0F (Highest)</text>
  <rect x="160" y="264" width="960" height="96" fill="#ffddcc" stroke="#333" />
  <text x="640" y="324" text-anchor="middle" font-size="33.6">Priority 0x10-0x1F</text>
  <rect x="160" y="384" width="960" height="96" fill="#ffffcc" stroke="#333" />
  <text x="640" y="444" text-anchor="middle" font-size="33.6">Priority 0x20-0x3F</text>
  <rect x="160" y="504" width="960" height="96" fill="#ccffcc" stroke="#333" />
  <text x="640" y="564" text-anchor="middle" font-size="33.6">Priority 0x40-0xFF (Lowest)</text>
  <text x="640" y="672" text-anchor="middle" font-size="28.8">Preemption only between groups</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="99.405947" y="40" width="1140.594053" height="100.000081" rx="7.525717" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.604007" y="91.999903" text-anchor="middle" font-size="26.160145" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">0x00 – 0x0F  (Highest)</text>
  <text x="1049.90097" y="85.999943" text-anchor="middle" font-size="18.530197" fill="var(--primary-accent)" font-family="Arial, sans-serif">Preempts everything</text>
  <text x="1049.90097" y="107.999921" text-anchor="middle" font-size="16.350122" fill="var(--primary-accent)" font-family="Arial, sans-serif">Safety-critical ISRs</text>
  <rect x="99.405947" y="150.000015" width="1140.594053" height="100.000081" rx="7.525717" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="479.604007" y="202.000042" text-anchor="middle" font-size="26.160145" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">0x10 – 0x1F</text>
  <text x="1049.90097" y="196.000082" text-anchor="middle" font-size="18.530197" fill="var(--text-muted)" font-family="Arial, sans-serif">High-priority comms</text>
  <text x="1049.90097" y="217.999936" text-anchor="middle" font-size="16.350122" fill="var(--text-faint)" font-family="Arial, sans-serif">e.g. DMA complete</text>
  <rect x="99.405947" y="259.999906" width="1140.594053" height="100.000081" rx="7.525717" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="479.604007" y="312.000057" text-anchor="middle" font-size="26.160145" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">0x20 – 0x3F</text>
  <text x="1049.90097" y="305.999973" text-anchor="middle" font-size="18.530197" fill="var(--text-muted)" font-family="Arial, sans-serif">Normal peripherals</text>
  <text x="1049.90097" y="328.000075" text-anchor="middle" font-size="16.350122" fill="var(--text-faint)" font-family="Arial, sans-serif">e.g. UART, SPI</text>
  <rect x="99.405947" y="370.000045" width="1140.594053" height="100.000081" rx="7.525717" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="479.604007" y="421.999948" text-anchor="middle" font-size="26.160145" font-weight="bold" fill="var(--text-faint)" font-family="Courier New, monospace">0x40 – 0xFF  (Lowest)</text>
  <text x="1049.90097" y="415.999988" text-anchor="middle" font-size="18.530197" fill="var(--text-faint)" font-family="Arial, sans-serif">Background tasks</text>
  <text x="1049.90097" y="438.00009" text-anchor="middle" font-size="16.350122" fill="var(--text-faint)" font-family="Arial, sans-serif">e.g. logging, telemetry</text>
  <line x1="40" y1="480.00006" x2="40" y2="40" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="96.25" y="233.3333" text-anchor="middle" font-size="14.7735" fill="var(--primary-accent)" transform="rotate(-90 60 340)" font-family="Arial, sans-serif">Priority</text>
  <rect x="146.930704" y="508.000122" width="1045.544665" height="56.000001" rx="7.525717" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="669.703037" y="536.000061" text-anchor="middle" font-size="19.620171" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Preemption only occurs between groups, not between sub-priorities</text>
  <text x="669.703037" y="556.000176" text-anchor="middle" font-size="16.350122" fill="var(--text-muted)" font-family="Arial, sans-serif">Sub-priority determines order when two same-group IRQs fire simultaneously</text>
  <text x="669.703037" y="620" text-anchor="middle" font-size="16.350122" fill="var(--text-faint)" font-family="Arial, sans-serif">Configure via NVIC_SetPriority() — higher number = lower priority on ARM</text>
</svg>

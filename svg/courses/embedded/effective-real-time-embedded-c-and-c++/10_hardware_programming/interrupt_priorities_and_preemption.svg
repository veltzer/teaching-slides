<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-3.5556%" y="-7.1111%" width="96%" height="110.2222%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-white" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#ffffff" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="142.2222" y="8.8889" width="853.3333" height="88.8889" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="426.6667" y="55.1111" text-anchor="middle" font-family="monospace" font-size="21.3333" font-weight="bold" fill="#ffffff">0x00 – 0x0F  (Highest)</ns0:text>
  <ns0:text x="853.3333" y="49.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">Preempts everything</ns0:text>
  <ns0:text x="853.3333" y="69.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#bbdefb">Safety-critical ISRs</ns0:text>
  <ns0:rect x="142.2222" y="106.6667" width="853.3333" height="88.8889" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="426.6667" y="152.8889" text-anchor="middle" font-family="monospace" font-size="21.3333" font-weight="bold" fill="#212121">0x10 – 0x1F</ns0:text>
  <ns0:text x="853.3333" y="147.5556" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">High-priority comms</ns0:text>
  <ns0:text x="853.3333" y="167.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">e.g. DMA complete</ns0:text>
  <ns0:rect x="142.2222" y="204.4444" width="853.3333" height="88.8889" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="426.6667" y="250.6667" text-anchor="middle" font-family="monospace" font-size="21.3333" font-weight="bold" fill="#212121">0x20 – 0x3F</ns0:text>
  <ns0:text x="853.3333" y="245.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Normal peripherals</ns0:text>
  <ns0:text x="853.3333" y="264.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">e.g. UART, SPI</ns0:text>
  <ns0:rect x="142.2222" y="302.2222" width="853.3333" height="88.8889" rx="5.3333" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="426.6667" y="348.4444" text-anchor="middle" font-family="monospace" font-size="21.3333" font-weight="bold" fill="#9e9e9e">0x40 – 0xFF  (Lowest)</ns0:text>
  <ns0:text x="853.3333" y="343.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#9e9e9e">Background tasks</ns0:text>
  <ns0:text x="853.3333" y="362.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">e.g. logging, telemetry</ns0:text>
  <ns0:line x1="97.7778" y1="400" x2="97.7778" y2="8.8889" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:text x="53.3333" y="213.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#1565c0" transform="rotate(-90 60 340)">Priority</ns0:text>
  <ns0:rect x="177.7778" y="424.8889" width="782.2222" height="49.7778" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="449.7778" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">Preemption only occurs between groups, not between sub-priorities</ns0:text>
  <ns0:text x="568.8889" y="467.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Sub-priority determines order when two same-group IRQs fire simultaneously</ns0:text>
  <ns0:text x="568.8889" y="524.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">Configure via NVIC_SetPriority() — higher number = lower priority on ARM</ns0:text>
</ns0:svg>
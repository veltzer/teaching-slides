<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="50" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#212121">Interrupt Priority Groups</text>
  <text x="640" y="78" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">ARM Cortex-M: 8-bit priority field — lower value = higher priority</text>
  <line x1="200" y1="90" x2="1080" y2="90" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Priority rows -->
  <!-- Highest -->
  <rect x="160" y="110" width="960" height="100" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="480" y="162" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">0x00 – 0x0F  (Highest)</text>
  <text x="960" y="156" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">Preempts everything</text>
  <text x="960" y="178" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#bbdefb">Safety-critical ISRs</text>

  <rect x="160" y="220" width="960" height="100" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="272" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#212121">0x10 – 0x1F</text>
  <text x="960" y="266" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">High-priority comms</text>
  <text x="960" y="288" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">e.g. DMA complete</text>

  <rect x="160" y="330" width="960" height="100" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="382" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#212121">0x20 – 0x3F</text>
  <text x="960" y="376" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Normal peripherals</text>
  <text x="960" y="398" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">e.g. UART, SPI</text>

  <!-- Lowest -->
  <rect x="160" y="440" width="960" height="100" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="492" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#9e9e9e">0x40 – 0xFF  (Lowest)</text>
  <text x="960" y="486" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#9e9e9e">Background tasks</text>
  <text x="960" y="508" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">e.g. logging, telemetry</text>

  <!-- Priority arrow on left -->
  <line x1="110" y1="550" x2="110" y2="110" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="60" y="340" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1565c0" transform="rotate(-90 60 340)">Priority</text>

  <!-- Key rule -->
  <rect x="200" y="578" width="880" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="606" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Preemption only occurs between groups, not between sub-priorities</text>
  <text x="640" y="626" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Sub-priority determines order when two same-group IRQs fire simultaneously</text>

  <!-- Footnote -->
  <text x="640" y="690" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">Configure via NVIC_SetPriority() — higher number = lower priority on ARM</text>
</svg>

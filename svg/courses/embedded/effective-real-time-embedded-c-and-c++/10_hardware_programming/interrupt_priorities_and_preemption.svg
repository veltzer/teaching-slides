<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="99.405947" y="40" width="1140.594053" height="100.000081" rx="7.525717" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="479.604007" y="91.999903" text-anchor="middle" font-family="monospace" font-size="26.160145" font-weight="bold" fill="var(--bg)">0x00 – 0x0F  (Highest)</text>
  <text x="1049.90097" y="85.999943" text-anchor="middle" font-family="sans-serif" font-size="18.530197" fill="var(--primary-accent)">Preempts everything</text>
  <text x="1049.90097" y="107.999921" text-anchor="middle" font-family="sans-serif" font-size="16.350122" fill="var(--primary-accent)">Safety-critical ISRs</text>
  <rect x="99.405947" y="150.000015" width="1140.594053" height="100.000081" rx="7.525717" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="479.604007" y="202.000042" text-anchor="middle" font-family="monospace" font-size="26.160145" font-weight="bold" fill="var(--text)">0x10 – 0x1F</text>
  <text x="1049.90097" y="196.000082" text-anchor="middle" font-family="sans-serif" font-size="18.530197" fill="var(--text-muted)">High-priority comms</text>
  <text x="1049.90097" y="217.999936" text-anchor="middle" font-family="sans-serif" font-size="16.350122" fill="var(--text-faint)">e.g. DMA complete</text>
  <rect x="99.405947" y="259.999906" width="1140.594053" height="100.000081" rx="7.525717" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="479.604007" y="312.000057" text-anchor="middle" font-family="monospace" font-size="26.160145" font-weight="bold" fill="var(--text)">0x20 – 0x3F</text>
  <text x="1049.90097" y="305.999973" text-anchor="middle" font-family="sans-serif" font-size="18.530197" fill="var(--text-muted)">Normal peripherals</text>
  <text x="1049.90097" y="328.000075" text-anchor="middle" font-family="sans-serif" font-size="16.350122" fill="var(--text-faint)">e.g. UART, SPI</text>
  <rect x="99.405947" y="370.000045" width="1140.594053" height="100.000081" rx="7.525717" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="479.604007" y="421.999948" text-anchor="middle" font-family="monospace" font-size="26.160145" font-weight="bold" fill="var(--text-faint)">0x40 – 0xFF  (Lowest)</text>
  <text x="1049.90097" y="415.999988" text-anchor="middle" font-family="sans-serif" font-size="18.530197" fill="var(--text-faint)">Background tasks</text>
  <text x="1049.90097" y="438.00009" text-anchor="middle" font-family="sans-serif" font-size="16.350122" fill="var(--text-faint)">e.g. logging, telemetry</text>
  <line x1="40" y1="480.00006" x2="40" y2="40" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="96.25" y="233.3333" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)" transform="rotate(-90 60 340)">Priority</text>
  <rect x="146.930704" y="508.000122" width="1045.544665" height="56.000001" rx="7.525717" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="669.703037" y="536.000061" text-anchor="middle" font-family="sans-serif" font-size="19.620171" font-weight="bold" fill="var(--primary-accent)">Preemption only occurs between groups, not between sub-priorities</text>
  <text x="669.703037" y="556.000176" text-anchor="middle" font-family="sans-serif" font-size="16.350122" fill="var(--text-muted)">Sub-priority determines order when two same-group IRQs fire simultaneously</text>
  <text x="669.703037" y="620" text-anchor="middle" font-family="sans-serif" font-size="16.350122" fill="var(--text-faint)">Configure via NVIC_SetPriority() — higher number = lower priority on ARM</text>
</svg>
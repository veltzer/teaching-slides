<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <line x1="133.75" y1="499.1667" x2="1165" y2="499.1667" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="1174.375" y="504" font-family="sans-serif" font-size="13.9044" fill="var(--text-faint)">time</text>
  <text x="122.5" y="122.1667" text-anchor="end" font-family="sans-serif" font-size="14.7735" fill="var(--text-faint)">Main</text>
  <text x="122.5" y="226.8889" text-anchor="end" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Low ISR</text>
  <text x="122.5" y="331.6111" text-anchor="end" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">High ISR</text>
  <rect x="133.75" y="104.4444" width="225" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="246.25" y="130.2223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-faint)">Main</text>
  <line x1="360.625" y1="99.6111" x2="360.625" y2="147.9444" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow)" />
  <text x="360.625" y="93.1667" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Low IRQ</text>
  <rect x="360.625" y="209.1667" width="187.5" height="43.5" rx="6" fill="var(--border)" stroke="var(--text-muted)" stroke-width="1.3333" />
  <text x="454.375" y="234.9444" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Low ISR running</text>
  <line x1="548.125" y1="204.3333" x2="548.125" y2="252.6667" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-primary)" />
  <text x="548.125" y="197.8889" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">High IRQ</text>
  <rect x="548.125" y="209.1667" width="168.75" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="4.4444 2.6667" />
  <text x="632.5" y="234.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">Low suspended</text>
  <rect x="548.125" y="313.8889" width="168.75" height="43.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="632.5" y="339.6667" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--bg)">High ISR</text>
  <line x1="718.75" y1="313.8889" x2="718.75" y2="252.6667" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-primary)" />
  <text x="752.5" y="291.3333" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">returns</text>
  <rect x="718.75" y="209.1667" width="187.5" height="43.5" rx="6" fill="var(--border)" stroke="var(--text-muted)" stroke-width="1.3333" />
  <text x="812.4999" y="234.9444" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Low ISR resumes</text>
  <line x1="906.2499" y1="209.1667" x2="906.2499" y2="147.9444" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow)" />
  <text x="939.9999" y="183.3889" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">returns</text>
  <rect x="906.2499" y="104.4444" width="262.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1037.5" y="130.2223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-faint)">Main resumes</text>
  <rect x="208.75" y="410.5556" width="862.5" height="64.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="436.3333" text-anchor="middle" font-family="sans-serif" font-size="16.5115" font-weight="bold" fill="var(--primary-accent)">Higher-priority IRQ preempts a running ISR — full nesting</text>
  <text x="640" y="457.2777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">CPU saves/restores registers automatically (Cortex-M hardware stacking)</text>
  <text x="640" y="475" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-faint)">Each nesting level uses ~32–64 bytes of stack — beware deep nesting on small MCUs</text>
</svg>
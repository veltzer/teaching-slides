<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:line x1="88.8889" y1="506.6667" x2="1066.6667" y2="506.6667" stroke="#e0e0e0" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="1075.5556" y="512" font-family="sans-serif" font-size="14.2222" fill="#9e9e9e">time</ns0:text>
  <ns0:text x="78.2222" y="90.6667" text-anchor="end" font-family="sans-serif" font-size="15.1111" fill="#9e9e9e">Main</ns0:text>
  <ns0:text x="78.2222" y="206.2222" text-anchor="end" font-family="sans-serif" font-size="15.1111" fill="#555555">Low ISR</ns0:text>
  <ns0:text x="78.2222" y="321.7778" text-anchor="end" font-family="sans-serif" font-size="15.1111" fill="#1565c0">High ISR</ns0:text>
  <ns0:rect x="88.8889" y="71.1111" width="213.3333" height="48" rx="3.5556" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="195.5556" y="99.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#9e9e9e">Main</ns0:text>
  <ns0:line x1="304" y1="65.7778" x2="304" y2="119.1111" stroke="#555555" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow)" />
  <ns0:text x="304" y="58.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555">Low IRQ</ns0:text>
  <ns0:rect x="304" y="186.6667" width="177.7778" height="48" rx="3.5556" fill="#e0e0e0" stroke="#555555" stroke-width="1.3333" />
  <ns0:text x="392.8889" y="215.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">Low ISR running</ns0:text>
  <ns0:line x1="481.7778" y1="181.3333" x2="481.7778" y2="234.6667" stroke="#1565c0" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-primary)" />
  <ns0:text x="481.7778" y="174.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#1565c0">High IRQ</ns0:text>
  <ns0:rect x="481.7778" y="186.6667" width="160" height="48" rx="3.5556" fill="none" stroke="#555555" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" />
  <ns0:text x="561.7778" y="215.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">Low suspended</ns0:text>
  <ns0:rect x="481.7778" y="302.2222" width="160" height="48" rx="3.5556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="561.7778" y="330.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#ffffff">High ISR</ns0:text>
  <ns0:line x1="643.5556" y1="302.2222" x2="643.5556" y2="234.6667" stroke="#1565c0" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-primary)" />
  <ns0:text x="675.5556" y="277.3333" font-family="sans-serif" font-size="12.4444" fill="#1565c0">returns</ns0:text>
  <ns0:rect x="643.5556" y="186.6667" width="177.7778" height="48" rx="3.5556" fill="#e0e0e0" stroke="#555555" stroke-width="1.3333" />
  <ns0:text x="732.4444" y="215.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">Low ISR resumes</ns0:text>
  <ns0:line x1="821.3333" y1="186.6667" x2="821.3333" y2="119.1111" stroke="#555555" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow)" />
  <ns0:text x="853.3333" y="158.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">returns</ns0:text>
  <ns0:rect x="821.3333" y="71.1111" width="248.8889" height="48" rx="3.5556" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="945.7778" y="99.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#9e9e9e">Main resumes</ns0:text>
  <ns0:rect x="160" y="408.8889" width="817.7778" height="71.1111" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="437.3333" text-anchor="middle" font-family="sans-serif" font-size="16.8889" font-weight="bold" fill="#1565c0">Higher-priority IRQ preempts a running ISR — full nesting</ns0:text>
  <ns0:text x="568.8889" y="460.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">CPU saves/restores registers automatically (Cortex-M hardware stacking)</ns0:text>
  <ns0:text x="568.8889" y="480" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">Each nesting level uses ~32–64 bytes of stack — beware deep nesting on small MCUs</ns0:text>
</ns0:svg>
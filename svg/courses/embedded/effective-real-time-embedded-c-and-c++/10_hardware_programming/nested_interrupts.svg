<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="52.834225" y1="613.176517" x2="1229.304813" y2="613.176517" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="1240" y="620" font-size="17.645826" fill="var(--text-faint)" font-family="Arial, sans-serif">time</text>
  <text x="40" y="80.94118" text-anchor="end" font-size="18.748785" fill="var(--text-faint)" font-family="Arial, sans-serif">Main</text>
  <text x="40" y="228.784298" text-anchor="end" font-size="18.748785" fill="var(--text-muted)" font-family="Arial, sans-serif">Low ISR</text>
  <text x="40" y="376.627416" text-anchor="end" font-size="18.748785" fill="var(--primary-accent)" font-family="Arial, sans-serif">High ISR</text>
  <rect x="52.834225" y="55.92146" width="256.684492" height="61.41177" rx="7.614493" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="181.176471" y="92.313792" text-anchor="middle" font-size="17.645826" fill="var(--text-faint)" font-family="Arial, sans-serif">Main</text>
  <line x1="311.657754" y1="49.097977" x2="311.657754" y2="117.33323" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow)"/>
  <text x="311.657754" y="40" text-anchor="middle" font-size="15.440034" fill="var(--text-muted)" font-family="Arial, sans-serif">Low IRQ</text>
  <rect x="311.657754" y="203.764719" width="213.903743" height="61.41177" rx="7.614493" fill="var(--border)" stroke="var(--text-muted)" stroke-width="1.3333"/>
  <text x="418.609626" y="240.156769" text-anchor="middle" font-size="17.645826" fill="var(--text-muted)" font-family="Arial, sans-serif">Low ISR running</text>
  <line x1="525.561497" y1="196.941095" x2="525.561497" y2="265.176489" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-primary)"/>
  <text x="525.561497" y="187.843118" text-anchor="middle" font-size="15.440034" fill="var(--primary-accent)" font-family="Arial, sans-serif">High IRQ</text>
  <rect x="525.561497" y="203.764719" width="192.513369" height="61.41177" rx="7.614493" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="4.4444 2.6667"/>
  <text x="621.818182" y="240.156769" text-anchor="middle" font-size="15.440034" fill="var(--text-faint)" font-family="Arial, sans-serif">Low suspended</text>
  <rect x="525.561497" y="351.607837" width="192.513369" height="61.41177" rx="7.614493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="621.818182" y="388.000028" text-anchor="middle" font-size="17.645826" fill="var(--bg)" font-family="Arial, sans-serif">High ISR</text>
  <line x1="720.213904" y1="351.607837" x2="720.213904" y2="265.176489" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-primary)"/>
  <text x="758.716578" y="319.764634" font-size="15.440034" fill="var(--primary-accent)" font-family="Arial, sans-serif">returns</text>
  <rect x="720.213904" y="203.764719" width="213.903743" height="61.41177" rx="7.614493" fill="var(--border)" stroke="var(--text-muted)" stroke-width="1.3333"/>
  <text x="827.165661" y="240.156769" text-anchor="middle" font-size="17.645826" fill="var(--text-muted)" font-family="Arial, sans-serif">Low ISR resumes</text>
  <line x1="934.117533" y1="203.764719" x2="934.117533" y2="117.33323" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow)"/>
  <text x="972.620207" y="167.372528" font-size="15.440034" fill="var(--text-muted)" font-family="Arial, sans-serif">returns</text>
  <rect x="934.117533" y="55.92146" width="299.465241" height="61.41177" rx="7.614493" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1083.850267" y="92.313792" text-anchor="middle" font-size="17.645826" fill="var(--text-faint)" font-family="Arial, sans-serif">Main resumes</text>
  <rect x="138.395722" y="488.078483" width="983.957219" height="90.980337" rx="7.614493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.374332" y="524.470533" text-anchor="middle" font-size="20.95445" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Higher-priority IRQ preempts a running ISR — full nesting</text>
  <text x="630.374332" y="554.039101" text-anchor="middle" font-size="17.645826" fill="var(--text-muted)" font-family="Arial, sans-serif">CPU saves/restores registers automatically (Cortex-M hardware stacking)</text>
  <text x="630.374332" y="579.05882" text-anchor="middle" font-size="16.542993" fill="var(--text-faint)" font-family="Arial, sans-serif">Each nesting level uses ~32–64 bytes of stack — beware deep nesting on small MCUs</text>
</svg>

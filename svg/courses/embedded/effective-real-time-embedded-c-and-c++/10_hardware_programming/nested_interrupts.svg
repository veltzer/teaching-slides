<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <line x1="88.8889" y1="506.6667" x2="1066.6667" y2="506.6667" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="1075.5556" y="512" font-family="sans-serif" font-size="14.2222" fill="var(--text-faint)">time</text>
  <text x="78.2222" y="90.6667" text-anchor="end" font-family="sans-serif" font-size="15.1111" fill="var(--text-faint)">Main</text>
  <text x="78.2222" y="206.2222" text-anchor="end" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Low ISR</text>
  <text x="78.2222" y="321.7778" text-anchor="end" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">High ISR</text>
  <rect x="88.8889" y="71.1111" width="213.3333" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="195.5556" y="99.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-faint)">Main</text>
  <line x1="304" y1="65.7778" x2="304" y2="119.1111" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow)" />
  <text x="304" y="58.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Low IRQ</text>
  <rect x="304" y="186.6667" width="177.7778" height="48" rx="6" fill="var(--border)" stroke="var(--text-muted)" stroke-width="1.3333" />
  <text x="392.8889" y="215.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Low ISR running</text>
  <line x1="481.7778" y1="181.3333" x2="481.7778" y2="234.6667" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-primary)" />
  <text x="481.7778" y="174.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">High IRQ</text>
  <rect x="481.7778" y="186.6667" width="160" height="48" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="4.4444 2.6667" />
  <text x="561.7778" y="215.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">Low suspended</text>
  <rect x="481.7778" y="302.2222" width="160" height="48" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="561.7778" y="330.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--bg)">High ISR</text>
  <line x1="643.5556" y1="302.2222" x2="643.5556" y2="234.6667" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-primary)" />
  <text x="675.5556" y="277.3333" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">returns</text>
  <rect x="643.5556" y="186.6667" width="177.7778" height="48" rx="6" fill="var(--border)" stroke="var(--text-muted)" stroke-width="1.3333" />
  <text x="732.4444" y="215.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Low ISR resumes</text>
  <line x1="821.3333" y1="186.6667" x2="821.3333" y2="119.1111" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow)" />
  <text x="853.3333" y="158.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">returns</text>
  <rect x="821.3333" y="71.1111" width="248.8889" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="945.7778" y="99.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-faint)">Main resumes</text>
  <rect x="160" y="408.8889" width="817.7778" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="437.3333" text-anchor="middle" font-family="sans-serif" font-size="16.8889" font-weight="bold" fill="var(--primary-accent)">Higher-priority IRQ preempts a running ISR — full nesting</text>
  <text x="568.8889" y="460.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">CPU saves/restores registers automatically (Cortex-M hardware stacking)</text>
  <text x="568.8889" y="480" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-faint)">Each nesting level uses ~32–64 bytes of stack — beware deep nesting on small MCUs</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="53.3333" width="248.8889" height="78.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="195.5556" y="96" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--text)">Hardware Event</text>
  <text x="195.5556" y="117.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">GPIO, timer, UART…</text>
  <line x1="321.7778" y1="92.4444" x2="371.5556" y2="92.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="373.3333" y="53.3333" width="248.8889" height="78.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="497.7778" y="96" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--text)">IRQ Signal</text>
  <text x="497.7778" y="117.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">raised to NVIC</text>
  <line x1="624" y1="92.4444" x2="673.7778" y2="92.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="675.5556" y="53.3333" width="248.8889" height="78.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="800" y="96" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--bg)">CPU</text>
  <text x="800" y="117.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">NVIC arbitrates</text>
  <line x1="800" y1="133.3333" x2="800" y2="184.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="821.3333" y="165.3333" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">saves context</text>
  <rect x="675.5556" y="186.6667" width="248.8889" height="78.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="800" y="229.3333" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--text)">Vector Table</text>
  <text x="800" y="250.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">IRQ → handler address</text>
  <line x1="800" y1="266.6667" x2="800" y2="318.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="821.3333" y="298.6667" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">branch to ISR</text>
  <rect x="675.5556" y="320" width="248.8889" height="78.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="800" y="362.6667" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--bg)">ISR Handler</text>
  <text x="800" y="384" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">user code executes</text>
  <line x1="800" y1="400" x2="800" y2="451.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="821.3333" y="432" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">RETI / BX LR</text>
  <rect x="675.5556" y="453.3333" width="248.8889" height="62.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="800" y="490.6667" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--text)">Restore Context</text>
  <text x="800" y="508.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">resume preempted code</text>
  <rect x="71.1111" y="257.7778" width="515.5556" height="97.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="328.8889" y="284.4444" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Key ISR rules:</text>
  <text x="88.8889" y="307.5556" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">• Keep ISRs short — defer work to tasks</text>
  <text x="88.8889" y="328.8889" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">• No blocking calls (no mutex wait, no delay)</text>
  <text x="88.8889" y="350.2222" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">• Use volatile for shared variables with ISRs</text>
</svg>
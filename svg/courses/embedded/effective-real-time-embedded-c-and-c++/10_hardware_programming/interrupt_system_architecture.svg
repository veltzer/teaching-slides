<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="350" height="98.153859" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="215" y="93.538506" text-anchor="middle" font-size="25.977062" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Hardware Event</text>
  <text x="215" y="120.30769" text-anchor="middle" font-size="18.892359" fill="var(--text-muted)" font-family="Arial, sans-serif">GPIO, timer, UART…</text>
  <line x1="392.5" y1="89.07686" x2="462.5" y2="89.07686" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="465" y="40" width="350" height="98.153859" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="93.538506" text-anchor="middle" font-size="25.977062" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">IRQ Signal</text>
  <text x="640" y="120.30769" text-anchor="middle" font-size="18.892359" fill="var(--text-muted)" font-family="Arial, sans-serif">raised to NVIC</text>
  <line x1="817.5" y1="89.07686" x2="887.5" y2="89.07686" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="890" y="40" width="350" height="98.153859" rx="8.152395" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065" y="93.538506" text-anchor="middle" font-size="25.977062" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">CPU</text>
  <text x="1065" y="120.30769" text-anchor="middle" font-size="18.892359" fill="var(--primary-accent)" font-family="Arial, sans-serif">NVIC arbitrates</text>
  <line x1="1065" y1="140.384613" x2="1065" y2="205.077026" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="1094.999867" y="180.538458" font-size="17.711621" fill="var(--primary-accent)" font-family="Arial, sans-serif">saves context</text>
  <rect x="890" y="207.30778" width="350" height="98.153859" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1065" y="260.846148" text-anchor="middle" font-size="25.977062" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Vector Table</text>
  <text x="1065" y="287.61547" text-anchor="middle" font-size="18.892359" fill="var(--text-muted)" font-family="Arial, sans-serif">IRQ → handler address</text>
  <line x1="1065" y1="307.692393" x2="1065" y2="372.384668" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="1094.999867" y="347.846238" font-size="17.711621" fill="var(--primary-accent)" font-family="Arial, sans-serif">branch to ISR</text>
  <rect x="890" y="374.615422" width="350" height="98.153859" rx="8.152395" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065" y="428.153928" text-anchor="middle" font-size="25.977062" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">ISR Handler</text>
  <text x="1065" y="454.923112" text-anchor="middle" font-size="18.892359" fill="var(--primary-accent)" font-family="Arial, sans-serif">user code executes</text>
  <line x1="1065" y1="475.000035" x2="1065" y2="539.692448" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1094.999867" y="515.15388" font-size="17.711621" fill="var(--text-muted)" font-family="Arial, sans-serif">RETI / BX LR</text>
  <rect x="890" y="541.923064" width="350" height="78.076936" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1065" y="588.769309" text-anchor="middle" font-size="23.615585" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Restore Context</text>
  <text x="1065" y="611.076846" text-anchor="middle" font-size="17.711621" fill="var(--text-muted)" font-family="Arial, sans-serif">resume preempted code</text>
  <rect x="40" y="296.538486" width="725" height="122.692289" rx="8.152395" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="402.5" y="329.999931" text-anchor="middle" font-size="21.253972" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Key ISR rules:</text>
  <text x="65" y="359.000145" font-size="18.892359" fill="var(--text-muted)" font-family="Arial, sans-serif">• Keep ISRs short — defer work to tasks</text>
  <text x="65" y="385.769329" font-size="18.892359" fill="var(--text-muted)" font-family="Arial, sans-serif">• No blocking calls (no mutex wait, no delay)</text>
  <text x="65" y="412.538513" font-size="18.892359" fill="var(--text-muted)" font-family="Arial, sans-serif">• Use volatile for shared variables with ISRs</text>
</svg>

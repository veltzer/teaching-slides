<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="350" height="98.153859" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="215" y="93.538506" text-anchor="middle" font-family="sans-serif" font-size="25.977062" font-weight="bold" fill="var(--text)">Hardware Event</text>
  <text x="215" y="120.30769" text-anchor="middle" font-family="sans-serif" font-size="18.892359" fill="var(--text-muted)">GPIO, timer, UART…</text>
  <line x1="392.5" y1="89.07686" x2="462.5" y2="89.07686" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="465" y="40" width="350" height="98.153859" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="93.538506" text-anchor="middle" font-family="sans-serif" font-size="25.977062" font-weight="bold" fill="var(--text)">IRQ Signal</text>
  <text x="640" y="120.30769" text-anchor="middle" font-family="sans-serif" font-size="18.892359" fill="var(--text-muted)">raised to NVIC</text>
  <line x1="817.5" y1="89.07686" x2="887.5" y2="89.07686" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="890" y="40" width="350" height="98.153859" rx="8.152395" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1065" y="93.538506" text-anchor="middle" font-family="sans-serif" font-size="25.977062" font-weight="bold" fill="var(--bg)">CPU</text>
  <text x="1065" y="120.30769" text-anchor="middle" font-family="sans-serif" font-size="18.892359" fill="var(--primary-accent)">NVIC arbitrates</text>
  <line x1="1065" y1="140.384613" x2="1065" y2="205.077026" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="1094.999867" y="180.538458" font-family="sans-serif" font-size="17.711621" fill="var(--primary-accent)">saves context</text>
  <rect x="890" y="207.30778" width="350" height="98.153859" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1065" y="260.846148" text-anchor="middle" font-family="sans-serif" font-size="25.977062" font-weight="bold" fill="var(--text)">Vector Table</text>
  <text x="1065" y="287.61547" text-anchor="middle" font-family="sans-serif" font-size="18.892359" fill="var(--text-muted)">IRQ → handler address</text>
  <line x1="1065" y1="307.692393" x2="1065" y2="372.384668" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="1094.999867" y="347.846238" font-family="sans-serif" font-size="17.711621" fill="var(--primary-accent)">branch to ISR</text>
  <rect x="890" y="374.615422" width="350" height="98.153859" rx="8.152395" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1065" y="428.153928" text-anchor="middle" font-family="sans-serif" font-size="25.977062" font-weight="bold" fill="var(--bg)">ISR Handler</text>
  <text x="1065" y="454.923112" text-anchor="middle" font-family="sans-serif" font-size="18.892359" fill="var(--primary-accent)">user code executes</text>
  <line x1="1065" y1="475.000035" x2="1065" y2="539.692448" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1094.999867" y="515.15388" font-family="sans-serif" font-size="17.711621" fill="var(--text-muted)">RETI / BX LR</text>
  <rect x="890" y="541.923064" width="350" height="78.076936" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1065" y="588.769309" text-anchor="middle" font-family="sans-serif" font-size="23.615585" font-weight="bold" fill="var(--text)">Restore Context</text>
  <text x="1065" y="611.076846" text-anchor="middle" font-family="sans-serif" font-size="17.711621" fill="var(--text-muted)">resume preempted code</text>
  <rect x="40" y="296.538486" width="725" height="122.692289" rx="8.152395" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="402.5" y="329.999931" text-anchor="middle" font-family="sans-serif" font-size="21.253972" font-weight="bold" fill="var(--primary-accent)">Key ISR rules:</text>
  <text x="65" y="359.000145" font-family="sans-serif" font-size="18.892359" fill="var(--text-muted)">• Keep ISRs short — defer work to tasks</text>
  <text x="65" y="385.769329" font-family="sans-serif" font-size="18.892359" fill="var(--text-muted)">• No blocking calls (no mutex wait, no delay)</text>
  <text x="65" y="412.538513" font-family="sans-serif" font-size="18.892359" fill="var(--text-muted)">• Use volatile for shared variables with ISRs</text>
</svg>
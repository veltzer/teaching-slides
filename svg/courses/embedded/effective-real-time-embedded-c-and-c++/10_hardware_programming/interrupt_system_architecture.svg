<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="71.1111" y="53.3333" width="248.8889" height="78.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="195.5556" y="96" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#212121">Hardware Event</ns0:text>
  <ns0:text x="195.5556" y="117.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">GPIO, timer, UART…</ns0:text>
  <ns0:line x1="321.7778" y1="92.4444" x2="371.5556" y2="92.4444" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="373.3333" y="53.3333" width="248.8889" height="78.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="96" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#212121">IRQ Signal</ns0:text>
  <ns0:text x="497.7778" y="117.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">raised to NVIC</ns0:text>
  <ns0:line x1="624" y1="92.4444" x2="673.7778" y2="92.4444" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="675.5556" y="53.3333" width="248.8889" height="78.2222" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="800" y="96" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#ffffff">CPU</ns0:text>
  <ns0:text x="800" y="117.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#bbdefb">NVIC arbitrates</ns0:text>
  <ns0:line x1="800" y1="133.3333" x2="800" y2="184.8889" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:text x="821.3333" y="165.3333" font-family="sans-serif" font-size="13.3333" fill="#1565c0">saves context</ns0:text>
  <ns0:rect x="675.5556" y="186.6667" width="248.8889" height="78.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="800" y="229.3333" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#212121">Vector Table</ns0:text>
  <ns0:text x="800" y="250.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">IRQ → handler address</ns0:text>
  <ns0:line x1="800" y1="266.6667" x2="800" y2="318.2222" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:text x="821.3333" y="298.6667" font-family="sans-serif" font-size="13.3333" fill="#1565c0">branch to ISR</ns0:text>
  <ns0:rect x="675.5556" y="320" width="248.8889" height="78.2222" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="800" y="362.6667" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#ffffff">ISR Handler</ns0:text>
  <ns0:text x="800" y="384" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#bbdefb">user code executes</ns0:text>
  <ns0:line x1="800" y1="400" x2="800" y2="451.5556" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:text x="821.3333" y="432" font-family="sans-serif" font-size="13.3333" fill="#555555">RETI / BX LR</ns0:text>
  <ns0:rect x="675.5556" y="453.3333" width="248.8889" height="62.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="800" y="490.6667" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#212121">Restore Context</ns0:text>
  <ns0:text x="800" y="508.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">resume preempted code</ns0:text>
  <ns0:rect x="71.1111" y="257.7778" width="515.5556" height="97.7778" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="328.8889" y="284.4444" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">Key ISR rules:</ns0:text>
  <ns0:text x="88.8889" y="307.5556" font-family="sans-serif" font-size="14.2222" fill="#555555">• Keep ISRs short — defer work to tasks</ns0:text>
  <ns0:text x="88.8889" y="328.8889" font-family="sans-serif" font-size="14.2222" fill="#555555">• No blocking calls (no mutex wait, no delay)</ns0:text>
  <ns0:text x="88.8889" y="350.2222" font-family="sans-serif" font-size="14.2222" fill="#555555">• Use volatile for shared variables with ISRs</ns0:text>
</ns0:svg>
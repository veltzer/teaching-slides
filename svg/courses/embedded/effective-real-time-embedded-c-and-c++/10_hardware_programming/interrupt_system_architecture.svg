<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Row 1: Hardware Event → IRQ → CPU -->
  <rect x="80"  y="60" width="280" height="88" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">Hardware Event</text>
  <text x="220" y="132" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">GPIO, timer, UART…</text>

  <line x1="362" y1="104" x2="418" y2="104" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="420" y="60" width="280" height="88" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">IRQ Signal</text>
  <text x="560" y="132" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">raised to NVIC</text>

  <line x1="702" y1="104" x2="758" y2="104" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="760" y="60" width="280" height="88" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="900" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">CPU</text>
  <text x="900" y="132" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">NVIC arbitrates</text>

  <!-- CPU → Vector Table -->
  <line x1="900" y1="150" x2="900" y2="208" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="924" y="186" font-family="sans-serif" font-size="15" fill="#1565c0">saves context</text>

  <rect x="760" y="210" width="280" height="88" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="900" y="258" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">Vector Table</text>
  <text x="900" y="282" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">IRQ → handler address</text>

  <!-- Vector Table → ISR Handler -->
  <line x1="900" y1="300" x2="900" y2="358" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="924" y="336" font-family="sans-serif" font-size="15" fill="#1565c0">branch to ISR</text>

  <rect x="760" y="360" width="280" height="88" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="900" y="408" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">ISR Handler</text>
  <text x="900" y="432" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">user code executes</text>

  <!-- ISR return -->
  <line x1="900" y1="450" x2="900" y2="508" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="924" y="486" font-family="sans-serif" font-size="15" fill="#555555">RETI / BX LR</text>

  <rect x="760" y="510" width="280" height="70" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="900" y="552" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#212121">Restore Context</text>
  <text x="900" y="572" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">resume preempted code</text>

  <!-- Note -->
  <rect x="80" y="290" width="580" height="110" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="370" y="320" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Key ISR rules:</text>
  <text x="100" y="346" font-family="sans-serif" font-size="16" fill="#555555">• Keep ISRs short — defer work to tasks</text>
  <text x="100" y="370" font-family="sans-serif" font-size="16" fill="#555555">• No blocking calls (no mutex wait, no delay)</text>
  <text x="100" y="394" font-family="sans-serif" font-size="16" fill="#555555">• Use volatile for shared variables with ISRs</text>
</svg>

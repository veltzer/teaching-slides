<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="88.3333" width="262.5" height="70.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="246.25" y="127" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text)">Hardware Event</text>
  <text x="246.25" y="146.3333" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">GPIO, timer, UART…</text>
  <line x1="379.375" y1="123.7777" x2="431.875" y2="123.7777" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="433.75" y="88.3333" width="262.5" height="70.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="565" y="127" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text)">IRQ Signal</text>
  <text x="565" y="146.3333" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">raised to NVIC</text>
  <line x1="698.125" y1="123.7777" x2="750.625" y2="123.7777" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="752.5" y="88.3333" width="262.5" height="70.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="883.75" y="127" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)">CPU</text>
  <text x="883.75" y="146.3333" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">NVIC arbitrates</text>
  <line x1="883.75" y1="160.8333" x2="883.75" y2="207.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="906.2499" y="189.8333" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">saves context</text>
  <rect x="752.5" y="209.1667" width="262.5" height="70.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="883.75" y="247.8333" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text)">Vector Table</text>
  <text x="883.75" y="267.1667" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">IRQ → handler address</text>
  <line x1="883.75" y1="281.6667" x2="883.75" y2="328.3889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="906.2499" y="310.6667" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">branch to ISR</text>
  <rect x="752.5" y="330" width="262.5" height="70.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="883.75" y="368.6667" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)">ISR Handler</text>
  <text x="883.75" y="388" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">user code executes</text>
  <line x1="883.75" y1="402.5" x2="883.75" y2="449.2223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="906.2499" y="431.5" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">RETI / BX LR</text>
  <rect x="752.5" y="450.8333" width="262.5" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="883.75" y="484.6667" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--text)">Restore Context</text>
  <text x="883.75" y="500.7777" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">resume preempted code</text>
  <rect x="115" y="273.6111" width="543.75" height="88.6111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="386.875" y="297.7777" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">Key ISR rules:</text>
  <text x="133.75" y="318.7223" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">• Keep ISRs short — defer work to tasks</text>
  <text x="133.75" y="338.0556" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">• No blocking calls (no mutex wait, no delay)</text>
  <text x="133.75" y="357.3889" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">• Use volatile for shared variables with ISRs</text>
</svg>
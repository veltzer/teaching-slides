<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="337.7778" y="8.8889" width="462.2222" height="88.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--bg)">Constructor</text>
  <text x="568.8889" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--primary-accent)">Acquires the resource</text>
  <line x1="568.8889" y1="99.5556" x2="568.8889" y2="140.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="337.7778" y="142.2222" width="462.2222" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="184.8889" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">Object Lifetime</text>
  <text x="568.8889" y="211.5556" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--text-muted)">Resource is valid and usable</text>
  <line x1="568.8889" y1="232.8889" x2="568.8889" y2="273.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="337.7778" y="275.5556" width="462.2222" height="88.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="318.2222" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--bg)">Destructor</text>
  <text x="568.8889" y="344.8889" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--primary-accent)">Releases the resource — always, even on exception</text>
  <rect x="71.1111" y="391.1111" width="462.2222" height="155.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="88.8889" y="417.7778" font-family="monospace" font-size="15.1111" fill="var(--text)">class MutexGuard {</text>
  <text x="106.6667" y="440.8889" font-family="monospace" font-size="15.1111" fill="var(--primary-accent)">  MutexGuard(Mutex&amp; m) {</text>
  <text x="124.4444" y="462.2222" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">    m.lock();   // acquire</text>
  <text x="106.6667" y="483.5556" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">  }</text>
  <text x="106.6667" y="504.8889" font-family="monospace" font-size="15.1111" fill="var(--primary-accent)">  ~MutexGuard() {</text>
  <text x="124.4444" y="526.2222" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">    m.unlock(); // release</text>
  <text x="88.8889" y="540.4444" font-family="monospace" font-size="15.1111" fill="var(--text)">};</text>
  <rect x="604.4444" y="391.1111" width="462.2222" height="155.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="835.5556" y="424.8889" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">Why it matters in embedded:</text>
  <text x="622.2222" y="453.3333" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">• Mutex always unlocked on scope exit</text>
  <text x="622.2222" y="476.4444" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">• DMA buffer always returned to pool</text>
  <text x="622.2222" y="499.5556" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">• GPIO always restored to safe state</text>
  <text x="622.2222" y="522.6667" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">• No resource leak on error paths</text>
  <text x="622.2222" y="540.4444" font-family="sans-serif" font-size="13.3333" fill="var(--text-faint)">  even without exceptions</text>
</svg>
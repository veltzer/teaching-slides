<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="396.25" y="48.0556" width="487.5" height="80.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="86.7223" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--bg)">Constructor</text>
  <text x="640" y="110.8889" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--primary-accent)">Acquires the resource</text>
  <line x1="640" y1="130.2223" x2="640" y2="167.2777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="396.25" y="168.8889" width="487.5" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="207.5556" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Object Lifetime</text>
  <text x="640" y="231.7223" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text-muted)">Resource is valid and usable</text>
  <line x1="640" y1="251.0556" x2="640" y2="288.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="396.25" y="289.7223" width="487.5" height="80.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="328.3889" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--bg)">Destructor</text>
  <text x="640" y="352.5556" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--primary-accent)">Releases the resource — always, even on exception</text>
  <rect x="115" y="394.4444" width="487.5" height="140.9723" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="133.75" y="418.6111" font-family="monospace" font-size="14.7735" fill="var(--text)">class MutexGuard {</text>
  <text x="152.5" y="439.5556" font-family="monospace" font-size="14.7735" fill="var(--primary-accent)">  MutexGuard(Mutex&amp; m) {</text>
  <text x="171.25" y="458.8889" font-family="monospace" font-size="14.7735" fill="var(--text-muted)">    m.lock();   // acquire</text>
  <text x="152.5" y="478.2223" font-family="monospace" font-size="14.7735" fill="var(--text-muted)">  }</text>
  <text x="152.5" y="497.5556" font-family="monospace" font-size="14.7735" fill="var(--primary-accent)">  ~MutexGuard() {</text>
  <text x="171.25" y="516.8889" font-family="monospace" font-size="14.7735" fill="var(--text-muted)">    m.unlock(); // release</text>
  <text x="133.75" y="529.7777" font-family="monospace" font-size="14.7735" fill="var(--text)">};</text>
  <rect x="677.4999" y="394.4444" width="487.5" height="140.9723" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="921.25" y="425.0556" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">Why it matters in embedded:</text>
  <text x="696.25" y="450.8333" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">• Mutex always unlocked on scope exit</text>
  <text x="696.25" y="471.7777" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">• DMA buffer always returned to pool</text>
  <text x="696.25" y="492.7223" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">• GPIO always restored to safe state</text>
  <text x="696.25" y="513.6667" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">• No resource leak on error paths</text>
  <text x="696.25" y="529.7777" font-family="sans-serif" font-size="13.0354" fill="var(--text-faint)">  even without exceptions</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="48" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#212121">Resource Acquisition Is Initialization</text>
  <line x1="200" y1="60" x2="1080" y2="60" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- RAII flow -->
  <!-- Step 1: Constructor -->
  <rect x="380" y="80" width="520" height="100" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="128" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Constructor</text>
  <text x="640" y="158" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#bbdefb">Acquires the resource</text>

  <line x1="640" y1="182" x2="640" y2="228" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Step 2: Object Lifetime -->
  <rect x="380" y="230" width="520" height="100" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="278" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Object Lifetime</text>
  <text x="640" y="308" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">Resource is valid and usable</text>

  <line x1="640" y1="332" x2="640" y2="378" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Step 3: Destructor -->
  <rect x="380" y="380" width="520" height="100" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="428" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Destructor</text>
  <text x="640" y="458" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#bbdefb">Releases the resource — always, even on exception</text>

  <!-- Code example -->
  <rect x="80" y="510" width="520" height="175" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="100" y="540" font-family="monospace" font-size="17" fill="#212121">class MutexGuard {</text>
  <text x="120" y="566" font-family="monospace" font-size="17" fill="#1565c0">  MutexGuard(Mutex&amp; m) {</text>
  <text x="140" y="590" font-family="monospace" font-size="17" fill="#555555">    m.lock();   // acquire</text>
  <text x="120" y="614" font-family="monospace" font-size="17" fill="#555555">  }</text>
  <text x="120" y="638" font-family="monospace" font-size="17" fill="#1565c0">  ~MutexGuard() {</text>
  <text x="140" y="662" font-family="monospace" font-size="17" fill="#555555">    m.unlock(); // release</text>
  <text x="100" y="678" font-family="monospace" font-size="17" fill="#212121">};</text>

  <!-- Benefit callout -->
  <rect x="680" y="510" width="520" height="175" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="940" y="548" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1565c0">Why it matters in embedded:</text>
  <text x="700" y="580" font-family="sans-serif" font-size="17" fill="#555555">• Mutex always unlocked on scope exit</text>
  <text x="700" y="606" font-family="sans-serif" font-size="17" fill="#555555">• DMA buffer always returned to pool</text>
  <text x="700" y="632" font-family="sans-serif" font-size="17" fill="#555555">• GPIO always restored to safe state</text>
  <text x="700" y="658" font-family="sans-serif" font-size="17" fill="#555555">• No resource leak on error paths</text>
  <text x="700" y="678" font-family="sans-serif" font-size="15" fill="#9e9e9e">  even without exceptions</text>
</svg>

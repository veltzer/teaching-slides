<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="535.714222" height="162.807091" rx="7.209019" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.857168" y="92.912188" text-anchor="middle" font-size="27.147602" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Code Reuse</text>
  <text x="307.857168" y="127.508705" text-anchor="middle" font-size="17.750406" fill="var(--primary-accent)" font-family="Arial, sans-serif">Write once, use for any type</text>
  <text x="307.857168" y="153.964799" text-anchor="middle" font-size="15.662073" fill="var(--primary-accent)" font-family="Courier New, monospace">RingBuffer&lt;uint8_t, 64&gt;</text>
  <text x="307.857168" y="178.385819" text-anchor="middle" font-size="15.662073" fill="var(--primary-accent)" font-family="Courier New, monospace">RingBuffer&lt;SensorReading, 8&gt;</text>
  <rect x="704.285778" y="40" width="535.714222" height="162.807091" rx="7.209019" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="972.142832" y="92.912188" text-anchor="middle" font-size="27.147602" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Type Safety</text>
  <text x="972.142832" y="127.508705" text-anchor="middle" font-size="17.750406" fill="var(--text-muted)" font-family="Arial, sans-serif">Compiler checks types — no void* casts</text>
  <text x="972.142832" y="153.964799" text-anchor="middle" font-size="15.662073" fill="var(--text-faint)" font-family="Courier New, monospace">buf.push(42);     // OK: uint8_t</text>
  <text x="972.142832" y="178.385819" text-anchor="middle" font-size="15.662073" fill="var(--text-faint)" font-family="Courier New, monospace">buf.push(3.14f);  // error</text>
  <rect x="40" y="233.333207" width="535.714222" height="162.807091" rx="7.209019" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="307.857168" y="286.245647" text-anchor="middle" font-size="27.147602" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Performance</text>
  <text x="307.857168" y="320.842165" text-anchor="middle" font-size="17.750406" fill="var(--text-muted)" font-family="Arial, sans-serif">Fully inlined and optimized</text>
  <text x="307.857168" y="347.298259" text-anchor="middle" font-size="17.750406" fill="var(--text-muted)" font-family="Arial, sans-serif">per instantiation</text>
  <text x="307.857168" y="373.754353" text-anchor="middle" font-size="15.662073" fill="var(--text-faint)" font-family="Arial, sans-serif">as fast as hand-written code</text>
  <rect x="704.285778" y="233.333207" width="535.714222" height="162.807091" rx="7.209019" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="972.142832" y="286.245647" text-anchor="middle" font-size="27.147602" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Compile-Time</text>
  <text x="972.142832" y="320.842165" text-anchor="middle" font-size="17.750406" fill="var(--text-muted)" font-family="Arial, sans-serif">Size as template parameter</text>
  <text x="972.142832" y="347.298259" text-anchor="middle" font-size="15.662073" fill="var(--text-faint)" font-family="Courier New, monospace">template&lt;size_t N&gt;</text>
  <text x="972.142832" y="371.719278" text-anchor="middle" font-size="15.662073" fill="var(--text-faint)" font-family="Arial, sans-serif">known at compile time → no malloc</text>
  <rect x="168.571441" y="440.912314" width="942.857233" height="71.22811" rx="7.209019" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000057" y="473.473757" text-anchor="middle" font-size="22.971057" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Zero runtime overhead!</text>
  <text x="640.000057" y="499.929851" text-anchor="middle" font-size="17.750406" fill="var(--text-muted)" font-family="Arial, sans-serif">Templates are resolved entirely at compile time — no indirect calls, no type erasure</text>
  <rect x="168.571441" y="544.701741" width="942.857233" height="75.298259" rx="7.209019" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.000057" y="571.158088" text-anchor="middle" font-size="18.794512" fill="var(--text)" font-family="Courier New, monospace">template&lt;typename T, size_t N&gt;</text>
  <text x="640.000057" y="595.579107" text-anchor="middle" font-size="18.794512" fill="var(--text)" font-family="Courier New, monospace">class RingBuffer { T buf[N]; ... };</text>
  <text x="640.000057" y="613.894903" text-anchor="middle" font-size="14.617847" fill="var(--text-faint)" font-family="Arial, sans-serif">statically allocated — perfect for embedded (no heap needed)</text>
</svg>

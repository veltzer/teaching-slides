<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="71.1111" y="35.5556" width="444.4444" height="142.2222" rx="7.1111" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="293.3333" y="81.7778" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#ffffff">Code Reuse</ns0:text>
  <ns0:text x="293.3333" y="112" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">Write once, use for any type</ns0:text>
  <ns0:text x="293.3333" y="135.1111" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#90caf9">RingBuffer&lt;uint8_t, 64&gt;</ns0:text>
  <ns0:text x="293.3333" y="156.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#90caf9">RingBuffer&lt;SensorReading, 8&gt;</ns0:text>
  <ns0:rect x="622.2222" y="35.5556" width="444.4444" height="142.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="844.4444" y="81.7778" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">Type Safety</ns0:text>
  <ns0:text x="844.4444" y="112" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Compiler checks types — no void* casts</ns0:text>
  <ns0:text x="844.4444" y="135.1111" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">buf.push(42);     // OK: uint8_t</ns0:text>
  <ns0:text x="844.4444" y="156.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">buf.push(3.14f);  // error</ns0:text>
  <ns0:rect x="71.1111" y="204.4444" width="444.4444" height="142.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="293.3333" y="250.6667" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">Performance</ns0:text>
  <ns0:text x="293.3333" y="280.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Fully inlined and optimized</ns0:text>
  <ns0:text x="293.3333" y="304" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">per instantiation</ns0:text>
  <ns0:text x="293.3333" y="327.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">as fast as hand-written code</ns0:text>
  <ns0:rect x="622.2222" y="204.4444" width="444.4444" height="142.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="844.4444" y="250.6667" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">Compile-Time</ns0:text>
  <ns0:text x="844.4444" y="280.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Size as template parameter</ns0:text>
  <ns0:text x="844.4444" y="304" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">template&lt;size_t N&gt;</ns0:text>
  <ns0:text x="844.4444" y="325.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">known at compile time → no malloc</ns0:text>
  <ns0:rect x="177.7778" y="385.7778" width="782.2222" height="62.2222" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="414.2222" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#1565c0">Zero runtime overhead!</ns0:text>
  <ns0:text x="568.8889" y="437.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Templates are resolved entirely at compile time — no indirect calls, no type erasure</ns0:text>
  <ns0:rect x="177.7778" y="476.4444" width="782.2222" height="65.7778" rx="5.3333" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="499.5556" text-anchor="middle" font-family="monospace" font-size="16" fill="#212121">template&lt;typename T, size_t N&gt;</ns0:text>
  <ns0:text x="568.8889" y="520.8889" text-anchor="middle" font-family="monospace" font-size="16" fill="#212121">class RingBuffer { T buf[N]; ... };</ns0:text>
  <ns0:text x="568.8889" y="536.8889" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">statically allocated — perfect for embedded (no heap needed)</ns0:text>
</ns0:svg>
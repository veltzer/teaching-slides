<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="72.2223" width="468.7499" height="128.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="349.375" y="114.1111" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--bg)">Code Reuse</text>
  <text x="349.375" y="141.5" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">Write once, use for any type</text>
  <text x="349.375" y="162.4444" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">RingBuffer&lt;uint8_t, 64&gt;</text>
  <text x="349.375" y="181.7777" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">RingBuffer&lt;SensorReading, 8&gt;</text>
  <rect x="696.25" y="72.2223" width="468.7499" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="930.6249" y="114.1111" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Type Safety</text>
  <text x="930.6249" y="141.5" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Compiler checks types — no void* casts</text>
  <text x="930.6249" y="162.4444" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-faint)">buf.push(42);     // OK: uint8_t</text>
  <text x="930.6249" y="181.7777" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-faint)">buf.push(3.14f);  // error</text>
  <rect x="115" y="225.2777" width="468.7499" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="349.375" y="267.1667" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Performance</text>
  <text x="349.375" y="294.5556" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Fully inlined and optimized</text>
  <text x="349.375" y="315.5" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">per instantiation</text>
  <text x="349.375" y="336.4444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-faint)">as fast as hand-written code</text>
  <rect x="696.25" y="225.2777" width="468.7499" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="930.6249" y="267.1667" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Compile-Time</text>
  <text x="930.6249" y="294.5556" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Size as template parameter</text>
  <text x="930.6249" y="315.5" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-faint)">template&lt;size_t N&gt;</text>
  <text x="930.6249" y="334.8333" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-faint)">known at compile time → no malloc</text>
  <rect x="227.5" y="389.6111" width="825" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="415.3889" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">Zero runtime overhead!</text>
  <text x="640" y="436.3333" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Templates are resolved entirely at compile time — no indirect calls, no type erasure</text>
  <rect x="227.5" y="471.7777" width="825" height="59.6111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="492.7223" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--text)">template&lt;typename T, size_t N&gt;</text>
  <text x="640" y="512.0556" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--text)">class RingBuffer { T buf[N]; ... };</text>
  <text x="640" y="526.5556" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">statically allocated — perfect for embedded (no heap needed)</text>
</svg>
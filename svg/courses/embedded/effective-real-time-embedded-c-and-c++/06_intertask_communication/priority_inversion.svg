<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <line x1="52.777285" y1="579.633589" x2="1224.028394" y2="579.633589" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="1240" y="584.944972" font-family="sans-serif" font-size="17.016302" fill="var(--text-faint)">time</text>
  <text x="40" y="86.739861" text-anchor="end" font-family="sans-serif" font-size="19.1434" font-weight="bold" fill="var(--primary-accent)">High</text>
  <text x="40" y="224.835181" text-anchor="end" font-family="sans-serif" font-size="19.1434" font-weight="bold" fill="var(--text-muted)">Med</text>
  <text x="40" y="362.930237" text-anchor="end" font-family="sans-serif" font-size="19.1434" font-weight="bold" fill="var(--text-faint)">Low</text>
  <rect x="52.777285" y="52.747295" width="1160.603372" height="61.611815" rx="7.342842" fill="var(--primary-fill)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="52.777285" y="190.842351" width="1160.603372" height="61.611815" rx="7.342842" fill="var(--surface)" opacity="0.4" />
  <rect x="52.777285" y="328.93767" width="1160.603372" height="61.611815" rx="7.342842" fill="var(--surface)" opacity="0.4" />
  <rect x="52.777285" y="331.062198" width="191.659272" height="57.362629" rx="7.342842" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="148.606921" y="365.054896" text-anchor="middle" font-family="sans-serif" font-size="15.952813" fill="var(--text-muted)">L runs</text>
  <rect x="244.436557" y="324.688484" width="6.388642" height="67.985396" fill="var(--text-faint)" rx="7.342842" />
  <text x="247.630878" y="318.314903" font-family="sans-serif" font-size="13.825837" fill="var(--text-muted)">🔒</text>
  <rect x="250.8252" y="331.062198" width="206.565991" height="57.362629" rx="7.342842" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="354.108138" y="365.054896" text-anchor="middle" font-family="sans-serif" font-size="15.952813" fill="var(--text-muted)">L holds lock</text>
  <rect x="318.970719" y="46.373713" width="6.388642" height="67.985396" rx="7.342842" fill="var(--primary-accent)" />
  <text x="322.16504" y="40" font-family="sans-serif" font-size="13.825837" fill="var(--primary-accent)">H arrives</text>
  <rect x="325.359248" y="54.871822" width="340.727482" height="57.362629" rx="7.342842" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" />
  <text x="495.723159" y="88.864388" text-anchor="middle" font-family="sans-serif" font-size="17.016302" fill="var(--primary-accent)" font-weight="bold">⛔ Blocked — waiting for lock</text>
  <rect x="457.391304" y="324.688484" width="6.388642" height="67.985396" rx="7.342842" fill="var(--text-muted)" />
  <rect x="463.779947" y="192.96701" width="212.954747" height="57.362629" rx="7.342842" fill="var(--text-muted)" />
  <text x="570.25732" y="226.959708" text-anchor="middle" font-family="sans-serif" font-size="15.952813" fill="var(--bg)" font-weight="bold">M preempts L !</text>
  <rect x="463.779947" y="331.062198" width="212.954747" height="57.362629" rx="7.342842" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="4.4444 2.6667" />
  <text x="570.25732" y="365.054896" text-anchor="middle" font-family="sans-serif" font-size="14.889203" fill="var(--text-faint)">L suspended</text>
  <rect x="676.734694" y="190.842351" width="6.388642" height="61.611815" rx="7.342842" fill="var(--text-muted)" />
  <rect x="683.123336" y="331.062198" width="159.71606" height="57.362629" rx="7.342842" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="762.981366" y="365.054896" text-anchor="middle" font-family="sans-serif" font-size="15.952813" fill="var(--text-muted)">L finishes</text>
  <rect x="842.839283" y="324.688484" width="6.388642" height="67.985396" rx="7.342842" fill="var(--text-faint)" />
  <text x="846.033718" y="318.314903" font-family="sans-serif" font-size="13.825837" fill="var(--text-faint)">🔓</text>
  <rect x="849.228039" y="54.871822" width="212.954747" height="57.362629" rx="7.342842" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="955.705413" y="88.864388" text-anchor="middle" font-family="sans-serif" font-size="17.016302" fill="var(--bg)" font-weight="bold">H finally runs</text>
  <rect x="137.959184" y="452.161036" width="979.591837" height="74.358978" rx="7.342842" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="627.755102" y="487.215932" text-anchor="middle" font-family="sans-serif" font-size="20.206889" font-weight="bold" fill="var(--warn-accent)">Problem: Medium task delays High — H starves while M runs</text>
  <text x="627.755102" y="513.772851" text-anchor="middle" font-family="sans-serif" font-size="15.952813" fill="var(--text-muted)">H is blocked not by L, but indirectly by M — breaks real-time guarantees</text>
  <text x="627.755102" y="620" text-anchor="middle" font-family="sans-serif" font-size="17.016302" fill="var(--primary-accent)">Solution: Priority Inheritance — L temporarily runs at H's priority while holding the lock</text>
</svg>
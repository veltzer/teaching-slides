<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="86.4" text-anchor="middle" font-size="46.08" font-weight="bold">Priority Inversion Problem</text>
  <rect x="160" y="172.8" width="320" height="86.4" fill="#ffcccc" stroke="#333" />
  <text x="320" y="230.4" text-anchor="middle" font-size="34.56">High Priority</text>
  <rect x="160" y="288" width="320" height="86.4" fill="#ffffcc" stroke="#333" />
  <text x="320" y="345.6" text-anchor="middle" font-size="34.56">Medium Priority</text>
  <rect x="160" y="403.2" width="320" height="86.4" fill="#ccffcc" stroke="#333" />
  <text x="320" y="460.8" text-anchor="middle" font-size="34.56">Low Priority</text>
  <path d="M 480 460.8 L 800 460.8" stroke="#333" stroke-width="5.76" />
  <text x="640" y="446.4" text-anchor="middle" font-size="34.56">Holds Lock</text>
  <path d="M 800 460.8 L 800 230.4 L 1120 230.4" stroke="#333" stroke-width="5.76" stroke-dasharray="14.4 14.4" />
  <text x="960" y="216" text-anchor="middle" font-size="34.56">Blocked!</text>
  <text x="640" y="604.8" text-anchor="middle" font-size="34.56">Medium task runs instead of High!</text>
</svg>
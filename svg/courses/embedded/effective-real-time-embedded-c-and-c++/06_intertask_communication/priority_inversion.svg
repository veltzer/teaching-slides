<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:line x1="88.8889" y1="497.7778" x2="1066.6667" y2="497.7778" stroke="#e0e0e0" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="1080" y="502.2222" font-family="sans-serif" font-size="14.2222" fill="#9e9e9e">time</ns0:text>
  <ns0:text x="78.2222" y="85.3333" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">High</ns0:text>
  <ns0:text x="78.2222" y="200.8889" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="bold" fill="#555555">Med</ns0:text>
  <ns0:text x="78.2222" y="316.4444" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="bold" fill="#9e9e9e">Low</ns0:text>
  <ns0:rect x="88.8889" y="56.8889" width="968.8889" height="51.5556" rx="1.7778" fill="#e3f2fd" opacity="0.4" />
  <ns0:rect x="88.8889" y="172.4444" width="968.8889" height="51.5556" rx="1.7778" fill="#f0f0f0" opacity="0.4" />
  <ns0:rect x="88.8889" y="288" width="968.8889" height="51.5556" rx="1.7778" fill="#f0f0f0" opacity="0.4" />
  <ns0:rect x="88.8889" y="289.7778" width="160" height="48" rx="3.5556" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.3333" />
  <ns0:text x="168.8889" y="318.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">L runs</ns0:text>
  <ns0:rect x="248.8889" y="284.4444" width="5.3333" height="56.8889" fill="#9e9e9e" rx="1.7778" />
  <ns0:text x="251.5556" y="279.1111" font-family="sans-serif" font-size="11.5556" fill="#555555">🔒</ns0:text>
  <ns0:rect x="254.2222" y="289.7778" width="172.4444" height="48" rx="3.5556" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.3333" />
  <ns0:text x="340.4444" y="318.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">L holds lock</ns0:text>
  <ns0:rect x="311.1111" y="51.5556" width="5.3333" height="56.8889" rx="1.7778" fill="#1565c0" />
  <ns0:text x="313.7778" y="46.2222" font-family="sans-serif" font-size="11.5556" fill="#1565c0">H arrives</ns0:text>
  <ns0:rect x="316.4444" y="58.6667" width="284.4444" height="48" rx="3.5556" fill="#ffffff" stroke="#1565c0" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" />
  <ns0:text x="458.6667" y="87.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0" font-weight="bold">⛔ Blocked — waiting for lock</ns0:text>
  <ns0:rect x="426.6667" y="284.4444" width="5.3333" height="56.8889" rx="1.7778" fill="#555555" />
  <ns0:rect x="432" y="174.2222" width="177.7778" height="48" rx="3.5556" fill="#555555" />
  <ns0:text x="520.8889" y="202.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#ffffff" font-weight="bold">M preempts L !</ns0:text>
  <ns0:rect x="432" y="289.7778" width="177.7778" height="48" rx="3.5556" fill="none" stroke="#9e9e9e" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" />
  <ns0:text x="520.8889" y="318.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">L suspended</ns0:text>
  <ns0:rect x="609.7778" y="172.4444" width="5.3333" height="51.5556" rx="1.7778" fill="#555555" />
  <ns0:rect x="615.1111" y="289.7778" width="133.3333" height="48" rx="3.5556" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.3333" />
  <ns0:text x="681.7778" y="318.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">L finishes</ns0:text>
  <ns0:rect x="748.4444" y="284.4444" width="5.3333" height="56.8889" rx="1.7778" fill="#9e9e9e" />
  <ns0:text x="751.1111" y="279.1111" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">🔓</ns0:text>
  <ns0:rect x="753.7778" y="58.6667" width="177.7778" height="48" rx="3.5556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="842.6667" y="87.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#ffffff" font-weight="bold">H finally runs</ns0:text>
  <ns0:rect x="160" y="391.1111" width="817.7778" height="62.2222" rx="5.3333" fill="#fff3e0" stroke="#f57c00" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="420.4444" text-anchor="middle" font-family="sans-serif" font-size="16.8889" font-weight="bold" fill="#e65100">Problem: Medium task delays High — H starves while M runs</ns0:text>
  <ns0:text x="568.8889" y="442.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">H is blocked not by L, but indirectly by M — breaks real-time guarantees</ns0:text>
  <ns0:text x="568.8889" y="531.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">Solution: Priority Inheritance — L temporarily runs at H's priority while holding the lock</ns0:text>
</ns0:svg>
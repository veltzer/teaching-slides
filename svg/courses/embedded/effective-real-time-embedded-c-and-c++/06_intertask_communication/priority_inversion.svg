<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <line x1="133.75" y1="491.1111" x2="1165" y2="491.1111" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="1179.0625" y="495.1389" font-family="sans-serif" font-size="13.9044" fill="var(--text-faint)">time</text>
  <text x="122.5" y="117.3333" text-anchor="end" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">High</text>
  <text x="122.5" y="222.0556" text-anchor="end" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text-muted)">Med</text>
  <text x="122.5" y="326.7777" text-anchor="end" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text-faint)">Low</text>
  <rect x="133.75" y="91.5556" width="1021.875" height="46.7223" rx="6" fill="var(--primary-fill)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="133.75" y="196.2777" width="1021.875" height="46.7223" rx="6" fill="var(--surface)" opacity="0.4" />
  <rect x="133.75" y="301" width="1021.875" height="46.7223" rx="6" fill="var(--surface)" opacity="0.4" />
  <rect x="133.75" y="302.6111" width="168.75" height="43.5" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="218.125" y="328.3889" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">L runs</text>
  <rect x="302.5" y="297.7777" width="5.625" height="51.5556" fill="var(--text-faint)" rx="6" />
  <text x="305.3125" y="292.9444" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">🔒</text>
  <rect x="308.125" y="302.6111" width="181.8749" height="43.5" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="399.0624" y="328.3889" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">L holds lock</text>
  <rect x="368.125" y="86.7223" width="5.625" height="51.5556" rx="6" fill="var(--primary-accent)" />
  <text x="370.9375" y="81.8889" font-family="sans-serif" font-size="11.2974" fill="var(--primary-accent)">H arrives</text>
  <rect x="373.7499" y="93.1667" width="299.9999" height="43.5" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" />
  <text x="523.75" y="118.9444" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)" font-weight="bold">⛔ Blocked — waiting for lock</text>
  <rect x="490" y="297.7777" width="5.625" height="51.5556" rx="6" fill="var(--text-muted)" />
  <rect x="495.625" y="197.8889" width="187.5" height="43.5" rx="6" fill="var(--text-muted)" />
  <text x="589.375" y="223.6667" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--bg)" font-weight="bold">M preempts L !</text>
  <rect x="495.625" y="302.6111" width="187.5" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="4.4444 2.6667" />
  <text x="589.375" y="328.3889" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">L suspended</text>
  <rect x="683.125" y="196.2777" width="5.625" height="46.7223" rx="6" fill="var(--text-muted)" />
  <rect x="688.75" y="302.6111" width="140.625" height="43.5" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="759.0625" y="328.3889" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">L finishes</text>
  <rect x="829.3749" y="297.7777" width="5.625" height="51.5556" rx="6" fill="var(--text-faint)" />
  <text x="832.1875" y="292.9444" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">🔓</text>
  <rect x="835" y="93.1667" width="187.5" height="43.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="928.75" y="118.9444" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--bg)" font-weight="bold">H finally runs</text>
  <rect x="208.75" y="394.4444" width="862.5" height="56.3889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="421.0277" text-anchor="middle" font-family="sans-serif" font-size="16.5115" font-weight="bold" fill="var(--warn-accent)">Problem: Medium task delays High — H starves while M runs</text>
  <text x="640" y="441.1667" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">H is blocked not by L, but indirectly by M — breaks real-time guarantees</text>
  <text x="640" y="521.7223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">Solution: Priority Inheritance — L temporarily runs at H's priority while holding the lock</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="407.142857" height="57.8008" rx="7.134311" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.571429" y="76.872794" text-anchor="middle" font-size="26.86627" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Task A  (+5)</text>
  <rect x="832.857143" y="40" width="407.142857" height="57.8008" rx="7.134311" fill="var(--text)"/>
  <text x="1036.428571" y="76.872794" text-anchor="middle" font-size="26.86627" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Task B  (+3)</text>
  <rect x="489.999886" y="40" width="300" height="57.8008" rx="7.134311" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="72.886566" text-anchor="middle" font-size="22.733007" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">X = 10  (shared)</text>
  <rect x="40" y="149.622011" width="407.142857" height="55.807562" rx="7.134311" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.571429" y="183.505195" text-anchor="middle" font-size="20.666434" fill="var(--primary-accent)" font-family="Courier New, monospace">1.  read X → 10</text>
  <line x1="489.999886" y1="177.525854" x2="449.285714" y2="177.525854" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="832.857143" y="219.381494" width="407.142857" height="55.807562" rx="7.134311" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1036.428571" y="253.264555" text-anchor="middle" font-size="20.666434" fill="var(--text-muted)" font-family="Courier New, monospace">2.  read X → 10</text>
  <line x1="770.714286" y1="247.285214" x2="830.714286" y2="247.285214" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="40" y="299.106548" width="407.142857" height="55.807562" rx="7.134311" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.571429" y="332.989733" text-anchor="middle" font-size="20.666434" fill="var(--primary-accent)" font-family="Courier New, monospace">3.  10 + 5 = 15</text>
  <rect x="832.857143" y="299.106548" width="407.142857" height="55.807562" rx="7.134311" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1036.428571" y="332.989733" text-anchor="middle" font-size="20.666434" fill="var(--text-muted)" font-family="Courier New, monospace">4.  10 + 3 = 13</text>
  <rect x="40" y="378.831602" width="407.142857" height="55.807562" rx="7.134311" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.571429" y="412.714786" text-anchor="middle" font-size="20.666434" fill="var(--primary-accent)" font-family="Courier New, monospace">5.  write X ← 15</text>
  <line x1="449.285714" y1="406.735445" x2="489.999886" y2="406.735445" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="489.999886" y="380.824839" width="300" height="53.814448" rx="7.134311" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="412.714786" text-anchor="middle" font-size="20.666434" fill="var(--primary-accent)" font-family="Courier New, monospace">X = 15</text>
  <rect x="832.857143" y="458.556779" width="407.142857" height="55.807562" rx="7.134311" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036.428571" y="492.43984" text-anchor="middle" font-size="20.666434" fill="var(--danger-accent)" font-family="Courier New, monospace">6.  write X ← 13  ⚠</text>
  <line x1="830.714286" y1="486.460498" x2="792.142857" y2="486.460498" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="489.999886" y="460.549893" width="300" height="53.814448" rx="7.134311" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="492.43984" text-anchor="middle" font-size="20.666434" font-weight="bold" fill="var(--danger-accent)" font-family="Courier New, monospace">X = 13  ✗</text>
  <rect x="168.571429" y="552.233754" width="942.857143" height="67.766246" rx="7.134311" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="583.127206" text-anchor="middle" font-size="20.666434" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Result: X = 13 — Task B silently discarded Task A's update!</text>
  <text x="640" y="608.04144" text-anchor="middle" font-size="16.533052" fill="var(--text-muted)" font-family="Arial, sans-serif">Fix: protect read–modify–write with mutex, atomic operation, or interrupt disable</text>
</svg>

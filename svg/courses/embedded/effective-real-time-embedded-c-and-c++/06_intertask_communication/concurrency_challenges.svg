<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
  </defs>
  <rect x="40" y="40" width="407.142857" height="57.8008" rx="7.134311" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="243.571429" y="76.872794" text-anchor="middle" font-family="sans-serif" font-size="26.86627" font-weight="bold" fill="var(--bg)">Task A  (+5)</text>
  <rect x="832.857143" y="40" width="407.142857" height="57.8008" rx="7.134311" fill="var(--text)" />
  <text x="1036.428571" y="76.872794" text-anchor="middle" font-family="sans-serif" font-size="26.86627" font-weight="bold" fill="var(--bg)">Task B  (+3)</text>
  <rect x="489.999886" y="40" width="300" height="57.8008" rx="7.134311" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="72.886566" text-anchor="middle" font-family="monospace" font-size="22.733007" font-weight="bold" fill="var(--primary-accent)">X = 10  (shared)</text>
  <rect x="40" y="149.622011" width="407.142857" height="55.807562" rx="7.134311" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.571429" y="183.505195" text-anchor="middle" font-family="monospace" font-size="20.666434" fill="var(--primary-accent)">1.  read X → 10</text>
  <line x1="489.999886" y1="177.525854" x2="449.285714" y2="177.525854" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="832.857143" y="219.381494" width="407.142857" height="55.807562" rx="7.134311" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1036.428571" y="253.264555" text-anchor="middle" font-family="monospace" font-size="20.666434" fill="var(--text-muted)">2.  read X → 10</text>
  <line x1="770.714286" y1="247.285214" x2="830.714286" y2="247.285214" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="299.106548" width="407.142857" height="55.807562" rx="7.134311" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.571429" y="332.989733" text-anchor="middle" font-family="monospace" font-size="20.666434" fill="var(--primary-accent)">3.  10 + 5 = 15</text>
  <rect x="832.857143" y="299.106548" width="407.142857" height="55.807562" rx="7.134311" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1036.428571" y="332.989733" text-anchor="middle" font-family="monospace" font-size="20.666434" fill="var(--text-muted)">4.  10 + 3 = 13</text>
  <rect x="40" y="378.831602" width="407.142857" height="55.807562" rx="7.134311" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.571429" y="412.714786" text-anchor="middle" font-family="monospace" font-size="20.666434" fill="var(--primary-accent)">5.  write X ← 15</text>
  <line x1="449.285714" y1="406.735445" x2="489.999886" y2="406.735445" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="489.999886" y="380.824839" width="300" height="53.814448" rx="7.134311" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="412.714786" text-anchor="middle" font-family="monospace" font-size="20.666434" fill="var(--primary-accent)">X = 15</text>
  <rect x="832.857143" y="458.556779" width="407.142857" height="55.807562" rx="7.134311" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036.428571" y="492.43984" text-anchor="middle" font-family="monospace" font-size="20.666434" fill="var(--danger-accent)">6.  write X ← 13  ⚠</text>
  <line x1="830.714286" y1="486.460498" x2="792.142857" y2="486.460498" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow-bad)" />
  <rect x="489.999886" y="460.549893" width="300" height="53.814448" rx="7.134311" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="492.43984" text-anchor="middle" font-family="monospace" font-size="20.666434" font-weight="bold" fill="var(--danger-accent)">X = 13  ✗</text>
  <rect x="168.571429" y="552.233754" width="942.857143" height="67.766246" rx="7.134311" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="583.127206" text-anchor="middle" font-family="sans-serif" font-size="20.666434" font-weight="bold" fill="var(--danger-accent)">Result: X = 13 — Task B silently discarded Task A's update!</text>
  <text x="640" y="608.04144" text-anchor="middle" font-family="sans-serif" font-size="16.533052" fill="var(--text-muted)">Fix: protect read–modify–write with mutex, atomic operation, or interrupt disable</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9,2 L1,5 L9,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#212121">SPI Bus</text>
  <line x1="200" y1="66" x2="1080" y2="66" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Master -->
  <rect x="80" y="220" width="300" height="260" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="230" y="306" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">SPI Master</text>
  <text x="230" y="336" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">controls clock</text>
  <text x="230" y="362" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">drives CS low to select</text>
  <text x="230" y="390" text-anchor="middle" font-family="monospace" font-size="15" fill="#90caf9">MCU SPI peripheral</text>
  <text x="230" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#90caf9">full-duplex: send &amp; receive</text>
  <text x="230" y="472" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#90caf9">simultaneously</text>

  <!-- Slave -->
  <rect x="900" y="220" width="300" height="260" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1050" y="306" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">SPI Slave</text>
  <text x="1050" y="336" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">responds to clock</text>
  <text x="1050" y="362" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">enabled when CS low</text>
  <text x="1050" y="390" text-anchor="middle" font-family="monospace" font-size="15" fill="#9e9e9e">flash / ADC / display</text>

  <!-- Signal lines -->
  <!-- MOSI -->
  <line x1="382" y1="290" x2="898" y2="290" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="640" y="278" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#1565c0">MOSI</text>
  <text x="640" y="308" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">Master Out · Slave In</text>

  <!-- MISO -->
  <line x1="898" y1="360" x2="382" y2="360" stroke="#555555" stroke-width="3" marker-end="url(#arrow-back)"/>
  <text x="640" y="348" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#555555">MISO</text>
  <text x="640" y="378" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">Master In · Slave Out</text>

  <!-- SCK -->
  <line x1="382" y1="430" x2="898" y2="430" stroke="#212121" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="640" y="418" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">SCK</text>
  <text x="640" y="448" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">Clock — driven by master</text>

  <!-- CS/SS -->
  <line x1="382" y1="500" x2="898" y2="500" stroke="#9e9e9e" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#arrow-accent)"/>
  <text x="640" y="488" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#9e9e9e">CS / SS</text>
  <text x="640" y="518" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">Chip Select (active low) — one per slave</text>

  <!-- Key facts -->
  <rect x="200" y="566" width="880" height="112" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="598" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1565c0">SPI vs I²C</text>
  <text x="220" y="624" font-family="sans-serif" font-size="16" fill="#555555">• SPI: 4 wires, full-duplex, no address — faster (MHz), one CS per slave</text>
  <text x="220" y="648" font-family="sans-serif" font-size="16" fill="#555555">• I²C: 2 wires, half-duplex, 7-bit address — slower (kHz), many devices on 2 wires</text>
  <text x="220" y="670" font-family="sans-serif" font-size="16" fill="#555555">• SPI modes 0–3: configure CPOL/CPHA to match the slave device's datasheet</text>
</svg>

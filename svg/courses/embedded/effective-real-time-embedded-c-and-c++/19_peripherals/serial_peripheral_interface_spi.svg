<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9,2 L1,5 L9,8 Z" fill="#555555" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="133.3333" width="266.6667" height="231.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="204.4444" y="209.7778" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--bg)">SPI Master</text>
  <text x="204.4444" y="236.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">controls clock</text>
  <text x="204.4444" y="259.5556" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">drives CS low to select</text>
  <text x="204.4444" y="284.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">MCU SPI peripheral</text>
  <text x="204.4444" y="339.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">full-duplex: send &amp; receive</text>
  <text x="204.4444" y="357.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">simultaneously</text>
  <rect x="800" y="133.3333" width="266.6667" height="231.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="933.3333" y="209.7778" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">SPI Slave</text>
  <text x="933.3333" y="236.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">responds to clock</text>
  <text x="933.3333" y="259.5556" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">enabled when CS low</text>
  <text x="933.3333" y="284.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">flash / ADC / display</text>
  <line x1="339.5556" y1="195.5556" x2="798.2222" y2="195.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="568.8889" y="184.8889" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--primary-accent)">MOSI</text>
  <text x="568.8889" y="211.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">Master Out · Slave In</text>
  <line x1="798.2222" y1="257.7778" x2="339.5556" y2="257.7778" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow-back)" />
  <text x="568.8889" y="247.1111" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text-muted)">MISO</text>
  <text x="568.8889" y="273.7778" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">Master In · Slave Out</text>
  <line x1="339.5556" y1="320" x2="798.2222" y2="320" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="568.8889" y="309.3333" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">SCK</text>
  <text x="568.8889" y="336" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">Clock — driven by master</text>
  <line x1="339.5556" y1="382.2222" x2="798.2222" y2="382.2222" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow-primary)" />
  <text x="568.8889" y="371.5556" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text-faint)">CS / SS</text>
  <text x="568.8889" y="398.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">Chip Select (active low) — one per slave</text>
  <rect x="177.7778" y="440.8889" width="782.2222" height="99.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="469.3333" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">SPI vs I²C</text>
  <text x="195.5556" y="492.4444" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">• SPI: 4 wires, full-duplex, no address — faster (MHz), one CS per slave</text>
  <text x="195.5556" y="513.7778" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">• I²C: 2 wires, half-duplex, 7-bit address — slower (kHz), many devices on 2 wires</text>
  <text x="195.5556" y="533.3333" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">• SPI modes 0–3: configure CPOL/CPHA to match the slave device's datasheet</text>
</svg>
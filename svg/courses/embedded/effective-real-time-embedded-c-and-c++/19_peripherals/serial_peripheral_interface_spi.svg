<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9,2 L1,5 L9,8 Z" fill="#555555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="321.428571" height="329.257433" rx="8.042307" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200.714171" y="148.908286" text-anchor="middle" font-family="sans-serif" font-size="30.285585" font-weight="bold" fill="var(--bg)">SPI Master</text>
  <text x="200.714171" y="186.899432" text-anchor="middle" font-family="sans-serif" font-size="19.80217" fill="var(--primary-accent)">controls clock</text>
  <text x="200.714171" y="219.825426" text-anchor="middle" font-family="sans-serif" font-size="19.80217" fill="var(--primary-accent)">drives CS low to select</text>
  <text x="200.714171" y="255.283682" text-anchor="middle" font-family="monospace" font-size="17.472448" fill="var(--primary-accent)">MCU SPI peripheral</text>
  <text x="200.714171" y="333.799177" text-anchor="middle" font-family="sans-serif" font-size="16.30752" fill="var(--primary-accent)">full-duplex: send &amp; receive</text>
  <text x="200.714171" y="359.126503" text-anchor="middle" font-family="sans-serif" font-size="16.30752" fill="var(--primary-accent)">simultaneously</text>
  <rect x="918.571429" y="40" width="321.428571" height="329.257433" rx="8.042307" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1079.2856" y="148.908286" text-anchor="middle" font-family="sans-serif" font-size="30.285585" font-weight="bold" fill="var(--text)">SPI Slave</text>
  <text x="1079.2856" y="186.899432" text-anchor="middle" font-family="sans-serif" font-size="19.80217" fill="var(--text-muted)">responds to clock</text>
  <text x="1079.2856" y="219.825426" text-anchor="middle" font-family="sans-serif" font-size="19.80217" fill="var(--text-muted)">enabled when CS low</text>
  <text x="1079.2856" y="255.283682" text-anchor="middle" font-family="monospace" font-size="17.472448" fill="var(--text-faint)">flash / ADC / display</text>
  <line x1="363.571429" y1="128.646426" x2="916.428571" y2="128.646426" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="113.449873" text-anchor="middle" font-family="monospace" font-size="20.966964" font-weight="bold" fill="var(--primary-accent)">MOSI</text>
  <text x="640" y="151.441176" text-anchor="middle" font-family="sans-serif" font-size="16.30752" fill="var(--text-faint)">Master Out · Slave In</text>
  <line x1="916.428571" y1="217.292537" x2="363.571429" y2="217.292537" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow-back)" />
  <text x="640" y="202.095984" text-anchor="middle" font-family="monospace" font-size="20.966964" font-weight="bold" fill="var(--text-muted)">MISO</text>
  <text x="640" y="240.087287" text-anchor="middle" font-family="sans-serif" font-size="16.30752" fill="var(--text-faint)">Master In · Slave Out</text>
  <line x1="363.571429" y1="305.938805" x2="916.428571" y2="305.938805" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="290.742252" text-anchor="middle" font-family="monospace" font-size="20.966964" font-weight="bold" fill="var(--text)">SCK</text>
  <text x="640" y="328.733555" text-anchor="middle" font-family="sans-serif" font-size="16.30752" fill="var(--text-faint)">Clock — driven by master</text>
  <line x1="363.571429" y1="394.585073" x2="916.428571" y2="394.585073" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow-primary)" />
  <text x="640" y="379.388678" text-anchor="middle" font-family="monospace" font-size="20.966964" font-weight="bold" fill="var(--text-faint)">CS / SS</text>
  <text x="640" y="417.379823" text-anchor="middle" font-family="sans-serif" font-size="16.30752" fill="var(--text-faint)">Chip Select (active low) — one per slave</text>
  <rect x="168.571429" y="478.165876" width="942.857143" height="141.834124" rx="8.042307" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="518.689755" text-anchor="middle" font-family="sans-serif" font-size="20.966964" font-weight="bold" fill="var(--primary-accent)">SPI vs I²C</text>
  <text x="190" y="551.615435" font-family="sans-serif" font-size="18.637242" fill="var(--text-muted)">• SPI: 4 wires, full-duplex, no address — faster (MHz), one CS per slave</text>
  <text x="190" y="582.00854" font-family="sans-serif" font-size="18.637242" fill="var(--text-muted)">• I²C: 2 wires, half-duplex, 7-bit address — slower (kHz), many devices on 2 wires</text>
  <text x="190" y="609.868755" font-family="sans-serif" font-size="18.637242" fill="var(--text-muted)">• SPI modes 0–3: configure CPOL/CPHA to match the slave device's datasheet</text>
</svg>
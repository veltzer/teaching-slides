<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9,2 L1,5 L9,8 Z" fill="#555555" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="160.8333" width="281.25" height="209.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="255.6249" y="230.1111" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--bg)">SPI Master</text>
  <text x="255.6249" y="254.2777" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">controls clock</text>
  <text x="255.6249" y="275.2223" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">drives CS low to select</text>
  <text x="255.6249" y="297.7777" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">MCU SPI peripheral</text>
  <text x="255.6249" y="347.7223" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">full-duplex: send &amp; receive</text>
  <text x="255.6249" y="363.8333" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">simultaneously</text>
  <rect x="883.75" y="160.8333" width="281.25" height="209.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1024.3749" y="230.1111" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">SPI Slave</text>
  <text x="1024.3749" y="254.2777" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">responds to clock</text>
  <text x="1024.3749" y="275.2223" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">enabled when CS low</text>
  <text x="1024.3749" y="297.7777" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-faint)">flash / ADC / display</text>
  <line x1="398.125" y1="217.2223" x2="881.875" y2="217.2223" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="207.5556" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">MOSI</text>
  <text x="640" y="231.7223" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">Master Out · Slave In</text>
  <line x1="881.875" y1="273.6111" x2="398.125" y2="273.6111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow-back)" />
  <text x="640" y="263.9444" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text-muted)">MISO</text>
  <text x="640" y="288.1111" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">Master In · Slave Out</text>
  <line x1="398.125" y1="330" x2="881.875" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="320.3333" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">SCK</text>
  <text x="640" y="344.5" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">Clock — driven by master</text>
  <line x1="398.125" y1="386.3889" x2="881.875" y2="386.3889" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow-primary)" />
  <text x="640" y="376.7223" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text-faint)">CS / SS</text>
  <text x="640" y="400.8889" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">Chip Select (active low) — one per slave</text>
  <rect x="227.5" y="439.5556" width="825" height="90.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="465.3333" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">SPI vs I²C</text>
  <text x="246.25" y="486.2777" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">• SPI: 4 wires, full-duplex, no address — faster (MHz), one CS per slave</text>
  <text x="246.25" y="505.6111" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">• I²C: 2 wires, half-duplex, 7-bit address — slower (kHz), many devices on 2 wires</text>
  <text x="246.25" y="523.3333" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">• SPI modes 0–3: configure CPOL/CPHA to match the slave device's datasheet</text>
</svg>
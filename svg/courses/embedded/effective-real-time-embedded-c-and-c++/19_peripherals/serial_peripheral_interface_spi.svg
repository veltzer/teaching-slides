<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-3.5556%" y="-7.1111%" width="96%" height="110.2222%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-back" markerWidth="8.8889" markerHeight="8.8889" refX="0.8889" refY="4.4444" orient="auto">
      <ns0:path d="M 8 1.7778 L 0.8889 4.4444 L 8 7.1111 Z" fill="#555555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="71.1111" y="133.3333" width="266.6667" height="231.1111" rx="7.1111" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="204.4444" y="209.7778" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#ffffff">SPI Master</ns0:text>
  <ns0:text x="204.4444" y="236.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">controls clock</ns0:text>
  <ns0:text x="204.4444" y="259.5556" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">drives CS low to select</ns0:text>
  <ns0:text x="204.4444" y="284.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#90caf9">MCU SPI peripheral</ns0:text>
  <ns0:text x="204.4444" y="339.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#90caf9">full-duplex: send &amp; receive</ns0:text>
  <ns0:text x="204.4444" y="357.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#90caf9">simultaneously</ns0:text>
  <ns0:rect x="800" y="133.3333" width="266.6667" height="231.1111" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="933.3333" y="209.7778" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">SPI Slave</ns0:text>
  <ns0:text x="933.3333" y="236.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">responds to clock</ns0:text>
  <ns0:text x="933.3333" y="259.5556" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">enabled when CS low</ns0:text>
  <ns0:text x="933.3333" y="284.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">flash / ADC / display</ns0:text>
  <ns0:line x1="339.5556" y1="195.5556" x2="798.2222" y2="195.5556" stroke="#1565c0" stroke-width="2.6667" marker-end="url(#arrow-accent)" />
  <ns0:text x="568.8889" y="184.8889" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1565c0">MOSI</ns0:text>
  <ns0:text x="568.8889" y="211.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">Master Out · Slave In</ns0:text>
  <ns0:line x1="798.2222" y1="257.7778" x2="339.5556" y2="257.7778" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow-back)" />
  <ns0:text x="568.8889" y="247.1111" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#555555">MISO</ns0:text>
  <ns0:text x="568.8889" y="273.7778" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">Master In · Slave Out</ns0:text>
  <ns0:line x1="339.5556" y1="320" x2="798.2222" y2="320" stroke="#212121" stroke-width="2.6667" marker-end="url(#arrow-accent)" />
  <ns0:text x="568.8889" y="309.3333" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">SCK</ns0:text>
  <ns0:text x="568.8889" y="336" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">Clock — driven by master</ns0:text>
  <ns0:line x1="339.5556" y1="382.2222" x2="798.2222" y2="382.2222" stroke="#9e9e9e" stroke-width="2.2222" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow-accent)" />
  <ns0:text x="568.8889" y="371.5556" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#9e9e9e">CS / SS</ns0:text>
  <ns0:text x="568.8889" y="398.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">Chip Select (active low) — one per slave</ns0:text>
  <ns0:rect x="177.7778" y="440.8889" width="782.2222" height="99.5556" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="469.3333" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">SPI vs I²C</ns0:text>
  <ns0:text x="195.5556" y="492.4444" font-family="sans-serif" font-size="14.2222" fill="#555555">• SPI: 4 wires, full-duplex, no address — faster (MHz), one CS per slave</ns0:text>
  <ns0:text x="195.5556" y="513.7778" font-family="sans-serif" font-size="14.2222" fill="#555555">• I²C: 2 wires, half-duplex, 7-bit address — slower (kHz), many devices on 2 wires</ns0:text>
  <ns0:text x="195.5556" y="533.3333" font-family="sans-serif" font-size="14.2222" fill="#555555">• SPI modes 0–3: configure CPOL/CPHA to match the slave device's datasheet</ns0:text>
</ns0:svg>
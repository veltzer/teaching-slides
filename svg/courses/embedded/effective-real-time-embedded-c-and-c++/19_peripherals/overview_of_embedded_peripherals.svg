<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="478.461538" y="205.714176" width="369.230646" height="165.714304" rx="7.547651" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="663.076923" y="284.428563" text-anchor="middle" font-family="sans-serif" font-size="30.609247" font-weight="bold" fill="var(--bg)">MCU Core</text>
  <text x="663.076923" y="315.499907" text-anchor="middle" font-family="sans-serif" font-size="18.584203" fill="var(--primary-accent)">CPU · Flash · SRAM</text>
  <text x="663.076923" y="340.357136" text-anchor="middle" font-family="sans-serif" font-size="16.397775" fill="var(--primary-accent)">memory-mapped peripherals</text>
  <rect x="40" y="40" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="132.307692" y="89.71433" text-anchor="middle" font-family="sans-serif" font-size="21.863784" font-weight="bold" fill="var(--text)">GPIO</text>
  <text x="132.307692" y="112.499887" text-anchor="middle" font-family="sans-serif" font-size="14.211472" fill="var(--text-faint)">digital I/O</text>
  <rect x="293.846031" y="40" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="386.153846" y="89.71433" text-anchor="middle" font-family="sans-serif" font-size="21.863784" font-weight="bold" fill="var(--primary-accent)">UART</text>
  <text x="386.153846" y="112.499887" text-anchor="middle" font-family="sans-serif" font-size="14.211472" fill="var(--text-faint)">async serial</text>
  <rect x="547.692308" y="40" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="89.71433" text-anchor="middle" font-family="sans-serif" font-size="21.863784" font-weight="bold" fill="var(--text)">SPI</text>
  <text x="640" y="112.499887" text-anchor="middle" font-family="sans-serif" font-size="14.211472" fill="var(--text-faint)">sync 4-wire</text>
  <rect x="801.538462" y="40" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="893.846154" y="89.71433" text-anchor="middle" font-family="sans-serif" font-size="21.863784" font-weight="bold" fill="var(--text)">I²C</text>
  <text x="893.846154" y="112.499887" text-anchor="middle" font-family="sans-serif" font-size="14.211472" fill="var(--text-faint)">sync 2-wire</text>
  <rect x="1055.384615" y="40" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1147.692308" y="89.71433" text-anchor="middle" font-family="sans-serif" font-size="21.863784" font-weight="bold" fill="var(--text)">ADC</text>
  <text x="1147.692308" y="112.499887" text-anchor="middle" font-family="sans-serif" font-size="14.211472" fill="var(--text-faint)">analog input</text>
  <rect x="40" y="537.142912" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="132.307692" y="586.857113" text-anchor="middle" font-family="sans-serif" font-size="21.863784" font-weight="bold" fill="var(--text)">Timers</text>
  <text x="132.307692" y="609.6428" text-anchor="middle" font-family="sans-serif" font-size="14.211472" fill="var(--text-faint)">PWM / capture</text>
  <rect x="293.846031" y="537.142912" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="386.153846" y="586.857113" text-anchor="middle" font-family="sans-serif" font-size="21.863784" font-weight="bold" fill="var(--text)">DMA</text>
  <text x="386.153846" y="609.6428" text-anchor="middle" font-family="sans-serif" font-size="14.211472" fill="var(--text-faint)">mem transfer</text>
  <rect x="547.692308" y="537.142912" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="586.857113" text-anchor="middle" font-family="sans-serif" font-size="21.863784" font-weight="bold" fill="var(--text)">WDT</text>
  <text x="640" y="609.6428" text-anchor="middle" font-family="sans-serif" font-size="14.211472" fill="var(--text-faint)">watchdog</text>
  <rect x="801.538462" y="537.142912" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="893.846154" y="586.857113" text-anchor="middle" font-family="sans-serif" font-size="21.863784" font-weight="bold" fill="var(--primary-accent)">NVIC</text>
  <text x="893.846154" y="609.6428" text-anchor="middle" font-family="sans-serif" font-size="14.211472" fill="var(--text-faint)">interrupts</text>
  <rect x="1055.384615" y="537.142912" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1147.692308" y="586.857113" text-anchor="middle" font-family="sans-serif" font-size="21.863784" font-weight="bold" fill="var(--text)">RTC</text>
  <text x="1147.692308" y="609.6428" text-anchor="middle" font-family="sans-serif" font-size="14.211472" fill="var(--text-faint)">real-time clock</text>
  <line x1="132.307692" y1="124.928502" x2="513.076923" y2="205.714176" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="386.153846" y1="124.928502" x2="570.769231" y2="205.714176" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <line x1="640" y1="124.928502" x2="628.461538" y2="205.714176" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />

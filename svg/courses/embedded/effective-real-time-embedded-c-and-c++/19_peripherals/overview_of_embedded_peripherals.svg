<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#212121">Embedded Peripherals Overview</text>
  <line x1="200" y1="66" x2="1080" y2="66" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- MCU Core (center) -->
  <rect x="480" y="240" width="320" height="160" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="316" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">MCU Core</text>
  <text x="640" y="346" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">CPU · Flash · SRAM</text>
  <text x="640" y="370" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#90caf9">memory-mapped peripherals</text>

  <!-- Top row peripherals -->
  <rect x="100"  y="80" width="160" height="80" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="128" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#212121">GPIO</text>
  <text x="180" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">digital I/O</text>

  <rect x="320"  y="80" width="160" height="80" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="128" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1565c0">UART</text>
  <text x="400" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">async serial</text>

  <rect x="540"  y="80" width="160" height="80" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620" y="128" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#212121">SPI</text>
  <text x="620" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">sync 4-wire</text>

  <rect x="760"  y="80" width="160" height="80" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="128" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#212121">I²C</text>
  <text x="840" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">sync 2-wire</text>

  <rect x="980"  y="80" width="160" height="80" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1060" y="128" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#212121">ADC</text>
  <text x="1060" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">analog input</text>

  <!-- Bottom row peripherals -->
  <rect x="100"  y="560" width="160" height="80" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="608" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#212121">Timers</text>
  <text x="180" y="630" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">PWM / capture</text>

  <rect x="320"  y="560" width="160" height="80" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="608" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#212121">DMA</text>
  <text x="400" y="630" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">mem transfer</text>

  <rect x="540"  y="560" width="160" height="80" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620" y="608" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#212121">WDT</text>
  <text x="620" y="630" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">watchdog</text>

  <rect x="760"  y="560" width="160" height="80" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="608" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1565c0">NVIC</text>
  <text x="840" y="630" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">interrupts</text>

  <rect x="980"  y="560" width="160" height="80" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1060" y="608" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#212121">RTC</text>
  <text x="1060" y="630" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">real-time clock</text>

  <!-- Connecting lines to MCU core -->
  <line x1="180"  y1="162" x2="510"  y2="240" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400"  y1="162" x2="560"  y2="240" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="620"  y1="162" x2="610"  y2="240" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840"  y1="162" x2="700"  y2="240" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1060" y1="162" x2="770"  y2="240" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180"  y1="560" x2="510"  y2="400" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400"  y1="560" x2="560"  y2="400" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620"  y1="560" x2="610"  y2="400" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840"  y1="560" x2="700"  y2="400" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="1060" y1="560" x2="770"  y2="400" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="478.461538" y="205.714176" width="369.230646" height="165.714304" rx="7.547651" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="663.076923" y="284.428563" text-anchor="middle" font-size="30.609247" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">MCU Core</text>
  <text x="663.076923" y="315.499907" text-anchor="middle" font-size="18.584203" fill="var(--primary-accent)" font-family="Arial, sans-serif">CPU · Flash · SRAM</text>
  <text x="663.076923" y="340.357136" text-anchor="middle" font-size="16.397775" fill="var(--primary-accent)" font-family="Arial, sans-serif">memory-mapped peripherals</text>
  <rect x="40" y="40" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="132.307692" y="89.71433" text-anchor="middle" font-size="21.863784" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">GPIO</text>
  <text x="132.307692" y="112.499887" text-anchor="middle" font-size="14.211472" fill="var(--text-faint)" font-family="Arial, sans-serif">digital I/O</text>
  <rect x="293.846031" y="40" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="386.153846" y="89.71433" text-anchor="middle" font-size="21.863784" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">UART</text>
  <text x="386.153846" y="112.499887" text-anchor="middle" font-size="14.211472" fill="var(--text-faint)" font-family="Arial, sans-serif">async serial</text>
  <rect x="547.692308" y="40" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="89.71433" text-anchor="middle" font-size="21.863784" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SPI</text>
  <text x="640" y="112.499887" text-anchor="middle" font-size="14.211472" fill="var(--text-faint)" font-family="Arial, sans-serif">sync 4-wire</text>
  <rect x="801.538462" y="40" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="893.846154" y="89.71433" text-anchor="middle" font-size="21.863784" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">I²C</text>
  <text x="893.846154" y="112.499887" text-anchor="middle" font-size="14.211472" fill="var(--text-faint)" font-family="Arial, sans-serif">sync 2-wire</text>
  <rect x="1055.384615" y="40" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1147.692308" y="89.71433" text-anchor="middle" font-size="21.863784" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ADC</text>
  <text x="1147.692308" y="112.499887" text-anchor="middle" font-size="14.211472" fill="var(--text-faint)" font-family="Arial, sans-serif">analog input</text>
  <rect x="40" y="537.142912" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="132.307692" y="586.857113" text-anchor="middle" font-size="21.863784" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Timers</text>
  <text x="132.307692" y="609.6428" text-anchor="middle" font-size="14.211472" fill="var(--text-faint)" font-family="Arial, sans-serif">PWM / capture</text>
  <rect x="293.846031" y="537.142912" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="386.153846" y="586.857113" text-anchor="middle" font-size="21.863784" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DMA</text>
  <text x="386.153846" y="609.6428" text-anchor="middle" font-size="14.211472" fill="var(--text-faint)" font-family="Arial, sans-serif">mem transfer</text>
  <rect x="547.692308" y="537.142912" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="586.857113" text-anchor="middle" font-size="21.863784" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WDT</text>
  <text x="640" y="609.6428" text-anchor="middle" font-size="14.211472" fill="var(--text-faint)" font-family="Arial, sans-serif">watchdog</text>
  <rect x="801.538462" y="537.142912" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="893.846154" y="586.857113" text-anchor="middle" font-size="21.863784" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">NVIC</text>
  <text x="893.846154" y="609.6428" text-anchor="middle" font-size="14.211472" fill="var(--text-faint)" font-family="Arial, sans-serif">interrupts</text>
  <rect x="1055.384615" y="537.142912" width="184.615385" height="82.857088" rx="7.547651" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1147.692308" y="586.857113" text-anchor="middle" font-size="21.863784" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RTC</text>
  <text x="1147.692308" y="609.6428" text-anchor="middle" font-size="14.211472" fill="var(--text-faint)" font-family="Arial, sans-serif">real-time clock</text>
  <line x1="132.307692" y1="124.928502" x2="513.076923" y2="205.714176" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="386.153846" y1="124.928502" x2="570.769231" y2="205.714176" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <line x1="640" y1="124.928502" x2="628.461538" y2="205.714176" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="893.846154" y1="124.928502" x2="732.307692" y2="205.714176" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="1147.692308" y1="124.928502" x2="813.0768" y2="205.714176" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="132.307692" y1="537.142912" x2="513.076923" y2="371.42848" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="386.153846" y1="537.142912" x2="570.769231" y2="371.42848" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="640" y1="537.142912" x2="628.461538" y2="371.42848" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="893.846154" y1="537.142912" x2="732.307692" y2="371.42848" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <line x1="1147.692308" y1="537.142912" x2="813.0768" y2="371.42848" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
</svg>
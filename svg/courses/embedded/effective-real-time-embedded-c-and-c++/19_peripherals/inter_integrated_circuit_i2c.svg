<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="228.571429" height="179.926926" rx="7.240044" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="154.285714" y="120.437917" text-anchor="middle" font-size="25.167116" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Master</text>
  <text x="154.285714" y="152.18965" text-anchor="middle" font-size="16.778077" fill="var(--primary-accent)" font-family="Arial, sans-serif">controls clock</text>
  <text x="154.285714" y="177.591194" text-anchor="middle" font-size="16.778077" fill="var(--primary-accent)" font-family="Arial, sans-serif">initiates transfer</text>
  <text x="154.285714" y="202.992607" text-anchor="middle" font-size="14.680757" fill="var(--primary-accent)" font-family="Courier New, monospace">MCU / SoC</text>
  <rect x="351.688312" y="40" width="207.792208" height="179.926926" rx="7.240044" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="455.584416" y="120.437917" text-anchor="middle" font-size="23.069916" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Slave 1</text>
  <text x="455.584416" y="152.18965" text-anchor="middle" font-size="15.729478" fill="var(--text-muted)" font-family="Courier New, monospace">addr: 0x48</text>
  <text x="455.584416" y="177.591194" text-anchor="middle" font-size="14.680757" fill="var(--text-faint)" font-family="Arial, sans-serif">temp sensor</text>
  <rect x="601.038961" y="40" width="207.792208" height="179.926926" rx="7.240044" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="704.935065" y="120.437917" text-anchor="middle" font-size="23.069916" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Slave 2</text>
  <text x="704.935065" y="152.18965" text-anchor="middle" font-size="15.729478" fill="var(--text-muted)" font-family="Courier New, monospace">addr: 0x3C</text>
  <text x="704.935065" y="177.591194" text-anchor="middle" font-size="14.680757" fill="var(--text-faint)" font-family="Arial, sans-serif">OLED display</text>
  <rect x="850.38961" y="40" width="207.792208" height="179.926926" rx="7.240044" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="954.285714" y="120.437917" text-anchor="middle" font-size="23.069916" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Slave 3</text>
  <text x="954.285714" y="152.18965" text-anchor="middle" font-size="15.729478" fill="var(--text-muted)" font-family="Courier New, monospace">addr: 0x68</text>
  <text x="954.285714" y="177.591194" text-anchor="middle" font-size="14.680757" fill="var(--text-faint)" font-family="Arial, sans-serif">RTC / IMU</text>
  <line x1="40" y1="315.182389" x2="1224.415584" y2="315.182389" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1240" y="321.53284" font-size="16.778077" fill="var(--primary-accent)" font-family="Courier New, monospace">SDA</text>
  <line x1="154.285714" y1="222.0437" x2="154.285714" y2="313.065747" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="455.584416" y1="222.0437" x2="455.584416" y2="313.065747" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="704.935065" y1="222.0437" x2="704.935065" y2="313.065747" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="954.285714" y1="222.0437" x2="954.285714" y2="313.065747" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="40" y1="378.686118" x2="1224.415584" y2="378.686118" stroke="var(--text)" stroke-width="2" />
  <text x="1240" y="385.036438" font-size="16.778077" fill="var(--text)" font-family="Courier New, monospace">SCL</text>
  <line x1="154.285714" y1="315.182389" x2="154.285714" y2="376.569345" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="455.584416" y1="315.182389" x2="455.584416" y2="376.569345" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="704.935065" y1="315.182389" x2="704.935065" y2="376.569345" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="954.285714" y1="315.182389" x2="954.285714" y2="376.569345" stroke="var(--text-muted)" stroke-width="1.7778" />
  <rect x="580.25974" y="397.73721" width="166.233766" height="46.569279" rx="7.240044" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="663.376623" y="426.313849" text-anchor="middle" font-size="16.778077" fill="var(--text-muted)" font-family="Arial, sans-serif">Pull-up resistors</text>
  <text x="663.376623" y="463.357582" text-anchor="middle" font-size="14.680757" fill="var(--text-faint)" font-family="Courier New, monospace">4.7kΩ to VCC (open-drain bus)</text>
  <rect x="60.779221" y="503.576672" width="540.25974" height="116.423328" rx="7.240044" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.909091" y="537.445178" text-anchor="middle" font-size="18.875397" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">I²C Properties</text>
  <text x="81.558442" y="564.963365" font-size="16.778077" fill="var(--text-muted)" font-family="Arial, sans-serif">• 2 wires: SDA (data) + SCL (clock)</text>
  <text x="81.558442" y="590.364777" font-size="16.778077" fill="var(--text-muted)" font-family="Arial, sans-serif">• 7-bit or 10-bit device addresses</text>
  <text x="81.558442" y="613.649548" font-size="16.778077" fill="var(--text-muted)" font-family="Arial, sans-serif">• Speed: 100 kHz / 400 kHz / 1 MHz</text>
  <rect x="684.155733" y="503.576672" width="540.25974" height="116.423328" rx="7.240044" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="954.285714" y="537.445178" text-anchor="middle" font-size="18.875397" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Transfer: START · ADDR · DATA · STOP</text>
  <text x="704.935065" y="564.963365" font-size="15.729478" fill="var(--text-muted)" font-family="Courier New, monospace">S [0x48|W] [reg] S [0x48|R] [data] P</text>
  <text x="704.935065" y="590.364777" font-size="14.680757" fill="var(--text-faint)" font-family="Arial, sans-serif">Master sends address, slaves check and ACK</text>
  <text x="704.935065" y="613.649548" font-size="14.680757" fill="var(--text-faint)" font-family="Arial, sans-serif">Only addressed slave responds</text>
</svg>
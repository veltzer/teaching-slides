  <ns0:text x="586.6667" y="386.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">Pull-up resistors</ns0:text>
  <ns0:text x="586.6667" y="417.7778" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#9e9e9e">4.7kΩ to VCC (open-drain bus)</ns0:text>
  <ns0:rect x="71.1111" y="451.5556" width="462.2222" height="97.7778" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="302.2222" y="480" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">I²C Properties</ns0:text>
  <ns0:text x="88.8889" y="503.1111" font-family="sans-serif" font-size="14.2222" fill="#555555">• 2 wires: SDA (data) + SCL (clock)</ns0:text>
  <ns0:text x="88.8889" y="524.4444" font-family="sans-serif" font-size="14.2222" fill="#555555">• 7-bit or 10-bit device addresses</ns0:text>
  <ns0:text x="88.8889" y="544" font-family="sans-serif" font-size="14.2222" fill="#555555">• Speed: 100 kHz / 400 kHz / 1 MHz</ns0:text>
  <ns0:rect x="604.4444" y="451.5556" width="462.2222" height="97.7778" rx="5.3333" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="835.5556" y="480" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Transfer: START · ADDR · DATA · STOP</ns0:text>
  <ns0:text x="622.2222" y="503.1111" font-family="monospace" font-size="13.3333" fill="#555555">S [0x48|W] [reg] S [0x48|R] [data] P</ns0:text>
  <ns0:text x="622.2222" y="524.4444" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">Master sends address, slaves check and ACK</ns0:text>
  <ns0:text x="622.2222" y="544" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">Only addressed slave responds</ns0:text>
</ns0:svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="53.3333" y="62.2222" width="195.5556" height="151.1111" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="151.1111" y="129.7778" text-anchor="middle" font-family="sans-serif" font-size="21.3333" font-weight="bold" fill="#ffffff">Master</ns0:text>
  <ns0:text x="151.1111" y="156.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#bbdefb">controls clock</ns0:text>
  <ns0:text x="151.1111" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#bbdefb">initiates transfer</ns0:text>
  <ns0:text x="151.1111" y="199.1111" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#90caf9">MCU / SoC</ns0:text>
  <ns0:rect x="320" y="62.2222" width="177.7778" height="151.1111" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="408.8889" y="129.7778" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#212121">Slave 1</ns0:text>
  <ns0:text x="408.8889" y="156.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#555555">addr: 0x48</ns0:text>
  <ns0:text x="408.8889" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">temp sensor</ns0:text>
  <ns0:rect x="533.3333" y="62.2222" width="177.7778" height="151.1111" rx="7.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="622.2222" y="129.7778" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#212121">Slave 2</ns0:text>
  <ns0:text x="622.2222" y="156.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#555555">addr: 0x3C</ns0:text>
  <ns0:text x="622.2222" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">OLED display</ns0:text>
  <ns0:rect x="746.6667" y="62.2222" width="177.7778" height="151.1111" rx="7.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="835.5556" y="129.7778" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#212121">Slave 3</ns0:text>
  <ns0:text x="835.5556" y="156.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#555555">addr: 0x68</ns0:text>
  <ns0:text x="835.5556" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">RTC / IMU</ns0:text>
  <ns0:line x1="53.3333" y1="293.3333" x2="1066.6667" y2="293.3333" stroke="#1565c0" stroke-width="2.6667" />
  <ns0:text x="1080" y="298.6667" font-family="monospace" font-size="14.2222" fill="#1565c0">SDA</ns0:text>
  <ns0:line x1="151.1111" y1="215.1111" x2="151.1111" y2="291.5556" stroke="#555555" stroke-width="1.7778" />
  <ns0:line x1="408.8889" y1="215.1111" x2="408.8889" y2="291.5556" stroke="#555555" stroke-width="1.7778" />
  <ns0:line x1="622.2222" y1="215.1111" x2="622.2222" y2="291.5556" stroke="#555555" stroke-width="1.7778" />
  <ns0:line x1="835.5556" y1="215.1111" x2="835.5556" y2="291.5556" stroke="#555555" stroke-width="1.7778" />
  <ns0:line x1="53.3333" y1="346.6667" x2="1066.6667" y2="346.6667" stroke="#212121" stroke-width="2.6667" />
  <ns0:text x="1080" y="352" font-family="monospace" font-size="14.2222" fill="#212121">SCL</ns0:text>
  <ns0:line x1="151.1111" y1="293.3333" x2="151.1111" y2="344.8889" stroke="#555555" stroke-width="1.7778" />
  <ns0:line x1="408.8889" y1="293.3333" x2="408.8889" y2="344.8889" stroke="#555555" stroke-width="1.7778" />
  <ns0:line x1="622.2222" y1="293.3333" x2="622.2222" y2="344.8889" stroke="#555555" stroke-width="1.7778" />
  <ns0:line x1="835.5556" y1="293.3333" x2="835.5556" y2="344.8889" stroke="#555555" stroke-width="1.7778" />
  <ns0:rect x="515.5556" y="362.6667" width="142.2222" height="39.1111" rx="5.3333" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="586.6667" y="386.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">Pull-up resistors</ns0:text>
  <ns0:text x="586.6667" y="417.7778" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#9e9e9e">4.7kΩ to VCC (open-drain bus)</ns0:text>
  <ns0:rect x="71.1111" y="451.5556" width="462.2222" height="97.7778" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="302.2222" y="480" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">I²C Properties</ns0:text>
  <ns0:text x="88.8889" y="503.1111" font-family="sans-serif" font-size="14.2222" fill="#555555">• 2 wires: SDA (data) + SCL (clock)</ns0:text>
  <ns0:text x="88.8889" y="524.4444" font-family="sans-serif" font-size="14.2222" fill="#555555">• 7-bit or 10-bit device addresses</ns0:text>
  <ns0:text x="88.8889" y="544" font-family="sans-serif" font-size="14.2222" fill="#555555">• Speed: 100 kHz / 400 kHz / 1 MHz</ns0:text>
  <ns0:rect x="604.4444" y="451.5556" width="462.2222" height="97.7778" rx="5.3333" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="835.5556" y="480" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Transfer: START · ADDR · DATA · STOP</ns0:text>
  <ns0:text x="622.2222" y="503.1111" font-family="monospace" font-size="13.3333" fill="#555555">S [0x48|W] [reg] S [0x48|R] [data] P</ns0:text>
  <ns0:text x="622.2222" y="524.4444" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">Master sends address, slaves check and ACK</ns0:text>
  <ns0:text x="622.2222" y="544" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">Only addressed slave responds</ns0:text>
</ns0:svg>
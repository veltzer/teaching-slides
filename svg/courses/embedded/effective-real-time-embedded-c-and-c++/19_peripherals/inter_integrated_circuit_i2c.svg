  <ns0:rect x="746.6667" y="62.2222" width="177.7778" height="151.1111" rx="7.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="835.5556" y="129.7778" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#212121">Slave 3</ns0:text>

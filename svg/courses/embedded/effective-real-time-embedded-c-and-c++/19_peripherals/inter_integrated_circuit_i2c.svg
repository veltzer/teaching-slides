<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="53.3333" y="62.2222" width="195.5556" height="151.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="151.1111" y="129.7778" text-anchor="middle" font-family="sans-serif" font-size="21.3333" font-weight="bold" fill="var(--bg)">Master</text>
  <text x="151.1111" y="156.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">controls clock</text>
  <text x="151.1111" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">initiates transfer</text>
  <text x="151.1111" y="199.1111" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">MCU / SoC</text>
  <rect x="320" y="62.2222" width="177.7778" height="151.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="408.8889" y="129.7778" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--text)">Slave 1</text>
  <text x="408.8889" y="156.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">addr: 0x48</text>
  <text x="408.8889" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">temp sensor</text>
  <rect x="533.3333" y="62.2222" width="177.7778" height="151.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="622.2222" y="129.7778" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--text)">Slave 2</text>
  <text x="622.2222" y="156.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">addr: 0x3C</text>
  <text x="622.2222" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">OLED display</text>
  <rect x="746.6667" y="62.2222" width="177.7778" height="151.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="835.5556" y="129.7778" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--text)">Slave 3</text>
  <text x="835.5556" y="156.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">addr: 0x68</text>
  <text x="835.5556" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">RTC / IMU</text>
  <line x1="53.3333" y1="293.3333" x2="1066.6667" y2="293.3333" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1080" y="298.6667" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">SDA</text>
  <line x1="151.1111" y1="215.1111" x2="151.1111" y2="291.5556" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="408.8889" y1="215.1111" x2="408.8889" y2="291.5556" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="622.2222" y1="215.1111" x2="622.2222" y2="291.5556" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="835.5556" y1="215.1111" x2="835.5556" y2="291.5556" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="53.3333" y1="346.6667" x2="1066.6667" y2="346.6667" stroke="var(--text)" stroke-width="2" />
  <text x="1080" y="352" font-family="monospace" font-size="14.2222" fill="var(--text)">SCL</text>
  <line x1="151.1111" y1="293.3333" x2="151.1111" y2="344.8889" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="408.8889" y1="293.3333" x2="408.8889" y2="344.8889" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="622.2222" y1="293.3333" x2="622.2222" y2="344.8889" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="835.5556" y1="293.3333" x2="835.5556" y2="344.8889" stroke="var(--text-muted)" stroke-width="1.7778" />
  <rect x="515.5556" y="362.6667" width="142.2222" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="586.6667" y="386.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Pull-up resistors</text>
  <text x="586.6667" y="417.7778" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text-faint)">4.7kΩ to VCC (open-drain bus)</text>
  <rect x="71.1111" y="451.5556" width="462.2222" height="97.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="302.2222" y="480" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">I²C Properties</text>
  <text x="88.8889" y="503.1111" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">• 2 wires: SDA (data) + SCL (clock)</text>
  <text x="88.8889" y="524.4444" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">• 7-bit or 10-bit device addresses</text>
  <text x="88.8889" y="544" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">• Speed: 100 kHz / 400 kHz / 1 MHz</text>
  <rect x="604.4444" y="451.5556" width="462.2222" height="97.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="835.5556" y="480" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Transfer: START · ADDR · DATA · STOP</text>
  <text x="622.2222" y="503.1111" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">S [0x48|W] [reg] S [0x48|R] [data] P</text>
  <text x="622.2222" y="524.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">Master sends address, slaves check and ACK</text>
  <text x="622.2222" y="544" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">Only addressed slave responds</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#212121">I²C Bus</text>
  <line x1="200" y1="66" x2="1080" y2="66" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Master -->
  <rect x="60" y="140" width="220" height="170" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="170" y="216" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Master</text>
  <text x="170" y="246" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">controls clock</text>
  <text x="170" y="270" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">initiates transfer</text>
  <text x="170" y="294" text-anchor="middle" font-family="monospace" font-size="14" fill="#90caf9">MCU / SoC</text>

  <!-- Slaves -->
  <rect x="360" y="140" width="200" height="170" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="460" y="216" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">Slave 1</text>
  <text x="460" y="246" text-anchor="middle" font-family="monospace" font-size="15" fill="#555555">addr: 0x48</text>
  <text x="460" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">temp sensor</text>

  <rect x="600" y="140" width="200" height="170" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="216" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">Slave 2</text>
  <text x="700" y="246" text-anchor="middle" font-family="monospace" font-size="15" fill="#555555">addr: 0x3C</text>
  <text x="700" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">OLED display</text>

  <rect x="840" y="140" width="200" height="170" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="940" y="216" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">Slave 3</text>
  <text x="940" y="246" text-anchor="middle" font-family="monospace" font-size="15" fill="#555555">addr: 0x68</text>
  <text x="940" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">RTC / IMU</text>

  <!-- SDA line -->
  <line x1="60" y1="400" x2="1200" y2="400" stroke="#1565c0" stroke-width="3"/>
  <text x="1215" y="406" font-family="monospace" font-size="16" fill="#1565c0">SDA</text>
  <!-- Connect devices to SDA -->
  <line x1="170"  y1="312" x2="170"  y2="398" stroke="#555555" stroke-width="2"/>
  <line x1="460"  y1="312" x2="460"  y2="398" stroke="#555555" stroke-width="2"/>
  <line x1="700"  y1="312" x2="700"  y2="398" stroke="#555555" stroke-width="2"/>
  <line x1="940"  y1="312" x2="940"  y2="398" stroke="#555555" stroke-width="2"/>

  <!-- SCL line -->
  <line x1="60" y1="460" x2="1200" y2="460" stroke="#212121" stroke-width="3"/>
  <text x="1215" y="466" font-family="monospace" font-size="16" fill="#212121">SCL</text>
  <!-- Connect devices to SCL -->
  <line x1="170"  y1="400" x2="170"  y2="458" stroke="#555555" stroke-width="2"/>
  <line x1="460"  y1="400" x2="460"  y2="458" stroke="#555555" stroke-width="2"/>
  <line x1="700"  y1="400" x2="700"  y2="458" stroke="#555555" stroke-width="2"/>
  <line x1="940"  y1="400" x2="940"  y2="458" stroke="#555555" stroke-width="2"/>

  <!-- Pull-up resistors -->
  <rect x="580" y="478" width="160" height="44" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="660" y="505" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Pull-up resistors</text>
  <text x="660" y="540" text-anchor="middle" font-family="monospace" font-size="14" fill="#9e9e9e">4.7kΩ to VCC (open-drain bus)</text>

  <!-- Key facts -->
  <rect x="80" y="578" width="520" height="110" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="340" y="610" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1565c0">I²C Properties</text>
  <text x="100" y="636" font-family="sans-serif" font-size="16" fill="#555555">• 2 wires: SDA (data) + SCL (clock)</text>
  <text x="100" y="660" font-family="sans-serif" font-size="16" fill="#555555">• 7-bit or 10-bit device addresses</text>
  <text x="100" y="682" font-family="sans-serif" font-size="16" fill="#555555">• Speed: 100 kHz / 400 kHz / 1 MHz</text>

  <rect x="680" y="578" width="520" height="110" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="940" y="610" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">Transfer: START · ADDR · DATA · STOP</text>
  <text x="700" y="636" font-family="monospace" font-size="15" fill="#555555">S [0x48|W] [reg] S [0x48|R] [data] P</text>
  <text x="700" y="660" font-family="sans-serif" font-size="14" fill="#9e9e9e">Master sends address, slaves check and ACK</text>
  <text x="700" y="682" font-family="sans-serif" font-size="14" fill="#9e9e9e">Only addressed slave responds</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="96.25" y="96.3889" width="206.25" height="136.9444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="199.375" y="157.6111" text-anchor="middle" font-family="sans-serif" font-size="20.8566" font-weight="bold" fill="var(--bg)">Master</text>
  <text x="199.375" y="181.7777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">controls clock</text>
  <text x="199.375" y="201.1111" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">initiates transfer</text>
  <text x="199.375" y="220.4444" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">MCU / SoC</text>
  <rect x="377.5" y="96.3889" width="187.5" height="136.9444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="471.25" y="157.6111" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text)">Slave 1</text>
  <text x="471.25" y="181.7777" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">addr: 0x48</text>
  <text x="471.25" y="201.1111" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">temp sensor</text>
  <rect x="602.5" y="96.3889" width="187.5" height="136.9444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="696.25" y="157.6111" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text)">Slave 2</text>
  <text x="696.25" y="181.7777" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">addr: 0x3C</text>
  <text x="696.25" y="201.1111" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">OLED display</text>
  <rect x="827.5" y="96.3889" width="187.5" height="136.9444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="921.25" y="157.6111" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text)">Slave 3</text>
  <text x="921.25" y="181.7777" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">addr: 0x68</text>
  <text x="921.25" y="201.1111" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">RTC / IMU</text>
  <line x1="96.25" y1="305.8333" x2="1165" y2="305.8333" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1179.0625" y="310.6667" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">SDA</text>
  <line x1="199.375" y1="234.9444" x2="199.375" y2="304.2223" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="471.25" y1="234.9444" x2="471.25" y2="304.2223" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="696.25" y1="234.9444" x2="696.25" y2="304.2223" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="921.25" y1="234.9444" x2="921.25" y2="304.2223" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="96.25" y1="354.1667" x2="1165" y2="354.1667" stroke="var(--text)" stroke-width="2" />
  <text x="1179.0625" y="359" font-family="monospace" font-size="13.9044" fill="var(--text)">SCL</text>
  <line x1="199.375" y1="305.8333" x2="199.375" y2="352.5556" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="471.25" y1="305.8333" x2="471.25" y2="352.5556" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="696.25" y1="305.8333" x2="696.25" y2="352.5556" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="921.25" y1="305.8333" x2="921.25" y2="352.5556" stroke="var(--text-muted)" stroke-width="1.7778" />
  <rect x="583.75" y="368.6667" width="150" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="658.75" y="390.4167" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Pull-up resistors</text>
  <text x="658.75" y="418.6111" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-faint)">4.7kΩ to VCC (open-drain bus)</text>
  <rect x="115" y="449.2223" width="487.5" height="88.6111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="358.75" y="475" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">I²C Properties</text>
  <text x="133.75" y="495.9444" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">• 2 wires: SDA (data) + SCL (clock)</text>
  <text x="133.75" y="515.2777" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">• 7-bit or 10-bit device addresses</text>
  <text x="133.75" y="533" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">• Speed: 100 kHz / 400 kHz / 1 MHz</text>
  <rect x="677.4999" y="449.2223" width="487.5" height="88.6111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="921.25" y="475" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Transfer: START · ADDR · DATA · STOP</text>
  <text x="696.25" y="495.9444" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">S [0x48|W] [reg] S [0x48|R] [data] P</text>
  <text x="696.25" y="515.2777" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">Master sends address, slaves check and ACK</text>
  <text x="696.25" y="533" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">Only addressed slave responds</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="228.571429" height="179.926926" rx="7.240044" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="154.285714" y="120.437917" text-anchor="middle" font-family="sans-serif" font-size="25.167116" font-weight="bold" fill="var(--bg)">Master</text>
  <text x="154.285714" y="152.18965" text-anchor="middle" font-family="sans-serif" font-size="16.778077" fill="var(--primary-accent)">controls clock</text>
  <text x="154.285714" y="177.591194" text-anchor="middle" font-family="sans-serif" font-size="16.778077" fill="var(--primary-accent)">initiates transfer</text>
  <text x="154.285714" y="202.992607" text-anchor="middle" font-family="monospace" font-size="14.680757" fill="var(--primary-accent)">MCU / SoC</text>
  <rect x="351.688312" y="40" width="207.792208" height="179.926926" rx="7.240044" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="455.584416" y="120.437917" text-anchor="middle" font-family="sans-serif" font-size="23.069916" font-weight="bold" fill="var(--text)">Slave 1</text>
  <text x="455.584416" y="152.18965" text-anchor="middle" font-family="monospace" font-size="15.729478" fill="var(--text-muted)">addr: 0x48</text>
  <text x="455.584416" y="177.591194" text-anchor="middle" font-family="sans-serif" font-size="14.680757" fill="var(--text-faint)">temp sensor</text>
  <rect x="601.038961" y="40" width="207.792208" height="179.926926" rx="7.240044" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="704.935065" y="120.437917" text-anchor="middle" font-family="sans-serif" font-size="23.069916" font-weight="bold" fill="var(--text)">Slave 2</text>
  <text x="704.935065" y="152.18965" text-anchor="middle" font-family="monospace" font-size="15.729478" fill="var(--text-muted)">addr: 0x3C</text>
  <text x="704.935065" y="177.591194" text-anchor="middle" font-family="sans-serif" font-size="14.680757" fill="var(--text-faint)">OLED display</text>
  <rect x="850.38961" y="40" width="207.792208" height="179.926926" rx="7.240044" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="954.285714" y="120.437917" text-anchor="middle" font-family="sans-serif" font-size="23.069916" font-weight="bold" fill="var(--text)">Slave 3</text>
  <text x="954.285714" y="152.18965" text-anchor="middle" font-family="monospace" font-size="15.729478" fill="var(--text-muted)">addr: 0x68</text>
  <text x="954.285714" y="177.591194" text-anchor="middle" font-family="sans-serif" font-size="14.680757" fill="var(--text-faint)">RTC / IMU</text>
  <line x1="40" y1="315.182389" x2="1224.415584" y2="315.182389" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1240" y="321.53284" font-family="monospace" font-size="16.778077" fill="var(--primary-accent)">SDA</text>
  <line x1="154.285714" y1="222.0437" x2="154.285714" y2="313.065747" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="455.584416" y1="222.0437" x2="455.584416" y2="313.065747" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="704.935065" y1="222.0437" x2="704.935065" y2="313.065747" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="954.285714" y1="222.0437" x2="954.285714" y2="313.065747" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="40" y1="378.686118" x2="1224.415584" y2="378.686118" stroke="var(--text)" stroke-width="2" />
  <text x="1240" y="385.036438" font-family="monospace" font-size="16.778077" fill="var(--text)">SCL</text>
  <line x1="154.285714" y1="315.182389" x2="154.285714" y2="376.569345" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="455.584416" y1="315.182389" x2="455.584416" y2="376.569345" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="704.935065" y1="315.182389" x2="704.935065" y2="376.569345" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="954.285714" y1="315.182389" x2="954.285714" y2="376.569345" stroke="var(--text-muted)" stroke-width="1.7778" />
  <rect x="580.25974" y="397.73721" width="166.233766" height="46.569279" rx="7.240044" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="663.376623" y="426.313849" text-anchor="middle" font-family="sans-serif" font-size="16.778077" fill="var(--text-muted)">Pull-up resistors</text>
  <text x="663.376623" y="463.357582" text-anchor="middle" font-family="monospace" font-size="14.680757" fill="var(--text-faint)">4.7kΩ to VCC (open-drain bus)</text>
  <rect x="60.779221" y="503.576672" width="540.25974" height="116.423328" rx="7.240044" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.909091" y="537.445178" text-anchor="middle" font-family="sans-serif" font-size="18.875397" font-weight="bold" fill="var(--primary-accent)">I²C Properties</text>
  <text x="81.558442" y="564.963365" font-family="sans-serif" font-size="16.778077" fill="var(--text-muted)">• 2 wires: SDA (data) + SCL (clock)</text>
  <text x="81.558442" y="590.364777" font-family="sans-serif" font-size="16.778077" fill="var(--text-muted)">• 7-bit or 10-bit device addresses</text>
  <text x="81.558442" y="613.649548" font-family="sans-serif" font-size="16.778077" fill="var(--text-muted)">• Speed: 100 kHz / 400 kHz / 1 MHz</text>
  <rect x="684.155733" y="503.576672" width="540.25974" height="116.423328" rx="7.240044" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="954.285714" y="537.445178" text-anchor="middle" font-family="sans-serif" font-size="18.875397" font-weight="bold" fill="var(--text)">Transfer: START · ADDR · DATA · STOP</text>
  <text x="704.935065" y="564.963365" font-family="monospace" font-size="15.729478" fill="var(--text-muted)">S [0x48|W] [reg] S [0x48|R] [data] P</text>
  <text x="704.935065" y="590.364777" font-family="sans-serif" font-size="14.680757" fill="var(--text-faint)">Master sends address, slaves check and ACK</text>
  <text x="704.935065" y="613.649548" font-family="sans-serif" font-size="14.680757" fill="var(--text-faint)">Only addressed slave responds</text>
</svg>
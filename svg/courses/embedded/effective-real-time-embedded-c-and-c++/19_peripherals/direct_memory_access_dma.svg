<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="42.188664" width="278.571429" height="153.207457" rx="7.476108" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="179.285714" y="116.603661" text-anchor="middle" font-size="28.153402" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory</text>
  <text x="179.285714" y="149.433898" text-anchor="middle" font-size="18.408047" fill="var(--text-muted)" font-family="Courier New, monospace">SRAM buffer</text>
  <text x="179.285714" y="175.698007" text-anchor="middle" font-size="18.408047" fill="var(--text-muted)" font-family="Courier New, monospace">src / dst</text>
  <rect x="961.428571" y="42.188664" width="278.571429" height="153.207457" rx="7.476108" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1100.714286" y="116.603661" text-anchor="middle" font-size="28.153402" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Peripheral</text>
  <text x="1100.714286" y="149.433898" text-anchor="middle" font-size="18.408047" fill="var(--text-muted)" font-family="Courier New, monospace">UART / SPI</text>
  <text x="1100.714286" y="175.698007" text-anchor="middle" font-size="18.408047" fill="var(--text-muted)" font-family="Courier New, monospace">data register</text>
  <rect x="500.714286" y="85.96236" width="278.571429" height="175.094373" rx="7.476108" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="162.56602" text-anchor="middle" font-size="30.319106" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">DMA</text>
  <text x="640" y="195.396122" text-anchor="middle" font-size="18.408047" fill="var(--primary-accent)" font-family="Arial, sans-serif">controller</text>
  <text x="640" y="223.849166" text-anchor="middle" font-size="16.242343" fill="var(--primary-accent)" font-family="Arial, sans-serif">src · dst · count</text>
  <text x="640" y="247.924474" text-anchor="middle" font-size="16.242343" fill="var(--primary-accent)" font-family="Arial, sans-serif">burst / circular</text>
  <line x1="320.714286" y1="118.792461" x2="498.571429" y2="173.509478" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="781.428571" y1="173.509478" x2="959.285714" y2="118.792461" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="404.285714" y="138.490576" text-anchor="middle" font-size="16.242343" fill="var(--primary-accent)" font-family="Arial, sans-serif">read</text>
  <text x="875.714171" y="138.490576" text-anchor="middle" font-size="16.242343" fill="var(--primary-accent)" font-family="Arial, sans-serif">write</text>
  <rect x="500.714286" y="370.490631" width="278.571429" height="131.320814" rx="7.476108" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="438.339634" text-anchor="middle" font-size="28.153402" font-weight="bold" fill="var(--text-faint)" font-family="Arial, sans-serif">CPU</text>
  <text x="640" y="471.169735" text-anchor="middle" font-size="17.325132" fill="var(--text-faint)" font-family="Arial, sans-serif">free to do other work</text>
  <line x1="640" y1="370.490631" x2="640" y2="263.245397" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)"/>
  <text x="704.285714" y="324.528271" font-size="15.159429" fill="var(--text-faint)" font-family="Arial, sans-serif">1. configure</text>
  <path d="M 500.714286 315.773614 Q 275.714286 381.434088 500.714286 468.981207" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" fill="none" marker-end="url(#arrow)"/>
  <text x="211.428571" y="348.603851" text-anchor="middle" font-size="15.159429" fill="var(--text-faint)" font-family="Arial, sans-serif">3. IRQ on complete</text>
  <text x="640" y="40" text-anchor="middle" font-size="19.490836" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">2. DMA transfers data without CPU involvement</text>
  <rect x="168.571429" y="545.585004" width="942.857143" height="74.414996" rx="7.476108" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="578.415241" text-anchor="middle" font-size="19.490836" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">CPU is freed for computation while DMA handles bulk data movement</text>
  <text x="640" y="606.868014" text-anchor="middle" font-size="16.242343" fill="var(--text-muted)" font-family="Arial, sans-serif">Typical use: UART RX/TX, ADC continuous scan, SPI flash read — all without polling</text>
</svg>

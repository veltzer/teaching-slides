  <ns0:text x="213.3333" y="328.8889" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">3. IRQ on complete</ns0:text>
  <ns0:text x="568.8889" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0" font-weight="bold">2. DMA transfers data without CPU involvement</ns0:text>
  <ns0:rect x="177.7778" y="488.8889" width="782.2222" height="60.4444" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="515.5556" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">CPU is freed for computation while DMA handles bulk data movement</ns0:text>
  <ns0:text x="568.8889" y="538.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Typical use: UART RX/TX, ADC continuous scan, SPI flash read — all without polling</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="80" width="231.1111" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="186.6667" y="140.4444" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">Memory</text>
  <text x="186.6667" y="167.1111" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">SRAM buffer</text>
  <text x="186.6667" y="188.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">src / dst</text>
  <rect x="835.5556" y="80" width="231.1111" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="951.1111" y="140.4444" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">Peripheral</text>
  <text x="951.1111" y="167.1111" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">UART / SPI</text>
  <text x="951.1111" y="188.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">data register</text>
  <rect x="453.3333" y="115.5556" width="231.1111" height="142.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="24.8889" font-weight="bold" fill="var(--bg)">DMA</text>
  <text x="568.8889" y="204.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">controller</text>
  <text x="568.8889" y="227.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">src · dst · count</text>
  <text x="568.8889" y="247.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">burst / circular</text>
  <line x1="304" y1="142.2222" x2="451.5556" y2="186.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="686.2222" y1="186.6667" x2="833.7778" y2="142.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="373.3333" y="158.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">read</text>
  <text x="764.4444" y="158.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">write</text>
  <rect x="453.3333" y="346.6667" width="231.1111" height="106.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="401.7778" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text-faint)">CPU</text>
  <text x="568.8889" y="428.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-faint)">free to do other work</text>
  <line x1="568.8889" y1="346.6667" x2="568.8889" y2="259.5556" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <text x="622.2222" y="309.3333" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">1. configure</text>
  <path d="M 453.3333 302.2222 Q 266.6667 355.5556 453.3333 426.6667" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" fill="none" marker-end="url(#arrow)" />
  <text x="213.3333" y="328.8889" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">3. IRQ on complete</text>
  <text x="568.8889" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--primary-accent)" font-weight="bold">2. DMA transfers data without CPU involvement</text>
  <rect x="177.7778" y="488.8889" width="782.2222" height="60.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="515.5556" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">CPU is freed for computation while DMA handles bulk data movement</text>
  <text x="568.8889" y="538.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Typical use: UART RX/TX, ADC continuous scan, SPI flash read — all without polling</text>
</svg>
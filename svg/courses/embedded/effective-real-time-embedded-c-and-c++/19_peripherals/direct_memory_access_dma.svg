<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="112.5" width="243.75" height="112.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="236.875" y="167.2777" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Memory</text>
  <text x="236.875" y="191.4444" text-anchor="middle" font-family="monospace" font-size="14.7735" fill="var(--text-muted)">SRAM buffer</text>
  <text x="236.875" y="210.7777" text-anchor="middle" font-family="monospace" font-size="14.7735" fill="var(--text-muted)">src / dst</text>
  <rect x="921.25" y="112.5" width="243.75" height="112.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1043.125" y="167.2777" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Peripheral</text>
  <text x="1043.125" y="191.4444" text-anchor="middle" font-family="monospace" font-size="14.7735" fill="var(--text-muted)">UART / SPI</text>
  <text x="1043.125" y="210.7777" text-anchor="middle" font-family="monospace" font-size="14.7735" fill="var(--text-muted)">data register</text>
  <rect x="518.125" y="144.7223" width="243.75" height="128.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="201.1111" text-anchor="middle" font-family="sans-serif" font-size="24.3328" font-weight="bold" fill="var(--bg)">DMA</text>
  <text x="640" y="225.2777" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">controller</text>
  <text x="640" y="246.2223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">src · dst · count</text>
  <text x="640" y="263.9444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">burst / circular</text>
  <line x1="360.625" y1="168.8889" x2="516.25" y2="209.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="763.75" y1="209.1667" x2="919.375" y2="168.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="433.75" y="183.3889" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">read</text>
  <text x="846.2499" y="183.3889" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">write</text>
  <rect x="518.125" y="354.1667" width="243.75" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="404.1111" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text-faint)">CPU</text>
  <text x="640" y="428.2777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-faint)">free to do other work</text>
  <line x1="640" y1="354.1667" x2="640" y2="275.2223" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <text x="696.25" y="320.3333" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">1. configure</text>
  <path d="M 518.125 313.8889 Q 321.25 362.2223 518.125 426.6667" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" fill="none" marker-end="url(#arrow)" />
  <text x="265" y="338.0556" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">3. IRQ on complete</text>
  <text x="640" y="110.8889" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--primary-accent)" font-weight="bold">2. DMA transfers data without CPU involvement</text>
  <rect x="227.5" y="483.0556" width="825" height="54.7777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="507.2223" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">CPU is freed for computation while DMA handles bulk data movement</text>
  <text x="640" y="528.1667" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">Typical use: UART RX/TX, ADC continuous scan, SPI flash read — all without polling</text>
</svg>
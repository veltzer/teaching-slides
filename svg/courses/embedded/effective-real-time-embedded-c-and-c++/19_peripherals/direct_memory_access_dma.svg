<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Memory -->
  <rect x="80" y="90" width="260" height="140" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="158" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Memory</text>
  <text x="210" y="188" text-anchor="middle" font-family="monospace" font-size="17" fill="#555555">SRAM buffer</text>
  <text x="210" y="212" text-anchor="middle" font-family="monospace" font-size="17" fill="#555555">src / dst</text>

  <!-- Peripheral -->
  <rect x="940" y="90" width="260" height="140" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1070" y="158" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Peripheral</text>
  <text x="1070" y="188" text-anchor="middle" font-family="monospace" font-size="17" fill="#555555">UART / SPI</text>
  <text x="1070" y="212" text-anchor="middle" font-family="monospace" font-size="17" fill="#555555">data register</text>

  <!-- DMA controller (center) -->
  <rect x="510" y="130" width="260" height="160" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="200" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">DMA</text>
  <text x="640" y="230" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">controller</text>
  <text x="640" y="256" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#90caf9">src · dst · count</text>
  <text x="640" y="278" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#90caf9">burst / circular</text>

  <!-- DMA transfer arrows (direct, bypassing CPU) -->
  <line x1="342" y1="160" x2="508" y2="210" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="772" y1="210" x2="938" y2="160" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="420" y="178" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1565c0">read</text>
  <text x="860" y="178" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1565c0">write</text>

  <!-- CPU (bottom) -->
  <rect x="510" y="390" width="260" height="120" rx="8" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="452" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#9e9e9e">CPU</text>
  <text x="640" y="482" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9e9e9e">free to do other work</text>

  <!-- CPU configure DMA -->
  <line x1="640" y1="390" x2="640" y2="292" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="700" y="348" font-family="sans-serif" font-size="14" fill="#9e9e9e">1. configure</text>

  <!-- DMA interrupt CPU on complete -->
  <path d="M 510 340 Q 300 400 510 480" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow)"/>
  <text x="240" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">3. IRQ on complete</text>

  <!-- Transfer label -->
  <text x="640" y="88" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1565c0" font-weight="bold">2. DMA transfers data without CPU involvement</text>

  <!-- Benefits -->
  <rect x="200" y="550" width="880" height="68" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="580" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1565c0">CPU is freed for computation while DMA handles bulk data movement</text>
  <text x="640" y="606" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Typical use: UART RX/TX, ADC continuous scan, SPI flash read — all without polling</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="42.188664" width="278.571429" height="153.207457" rx="7.476108" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="179.285714" y="116.603661" text-anchor="middle" font-family="sans-serif" font-size="28.153402" font-weight="bold" fill="var(--text)">Memory</text>
  <text x="179.285714" y="149.433898" text-anchor="middle" font-family="monospace" font-size="18.408047" fill="var(--text-muted)">SRAM buffer</text>
  <text x="179.285714" y="175.698007" text-anchor="middle" font-family="monospace" font-size="18.408047" fill="var(--text-muted)">src / dst</text>
  <rect x="961.428571" y="42.188664" width="278.571429" height="153.207457" rx="7.476108" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1100.714286" y="116.603661" text-anchor="middle" font-family="sans-serif" font-size="28.153402" font-weight="bold" fill="var(--text)">Peripheral</text>
  <text x="1100.714286" y="149.433898" text-anchor="middle" font-family="monospace" font-size="18.408047" fill="var(--text-muted)">UART / SPI</text>
  <text x="1100.714286" y="175.698007" text-anchor="middle" font-family="monospace" font-size="18.408047" fill="var(--text-muted)">data register</text>
  <rect x="500.714286" y="85.96236" width="278.571429" height="175.094373" rx="7.476108" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="162.56602" text-anchor="middle" font-family="sans-serif" font-size="30.319106" font-weight="bold" fill="var(--bg)">DMA</text>
  <text x="640" y="195.396122" text-anchor="middle" font-family="sans-serif" font-size="18.408047" fill="var(--primary-accent)">controller</text>
  <text x="640" y="223.849166" text-anchor="middle" font-family="sans-serif" font-size="16.242343" fill="var(--primary-accent)">src · dst · count</text>
  <text x="640" y="247.924474" text-anchor="middle" font-family="sans-serif" font-size="16.242343" fill="var(--primary-accent)">burst / circular</text>
  <line x1="320.714286" y1="118.792461" x2="498.571429" y2="173.509478" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="781.428571" y1="173.509478" x2="959.285714" y2="118.792461" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="404.285714" y="138.490576" text-anchor="middle" font-family="sans-serif" font-size="16.242343" fill="var(--primary-accent)">read</text>
  <text x="875.714171" y="138.490576" text-anchor="middle" font-family="sans-serif" font-size="16.242343" fill="var(--primary-accent)">write</text>
  <rect x="500.714286" y="370.490631" width="278.571429" height="131.320814" rx="7.476108" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="438.339634" text-anchor="middle" font-family="sans-serif" font-size="28.153402" font-weight="bold" fill="var(--text-faint)">CPU</text>
  <text x="640" y="471.169735" text-anchor="middle" font-family="sans-serif" font-size="17.325132" fill="var(--text-faint)">free to do other work</text>
  <line x1="640" y1="370.490631" x2="640" y2="263.245397" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <text x="704.285714" y="324.528271" font-family="sans-serif" font-size="15.159429" fill="var(--text-faint)">1. configure</text>
  <path d="M 500.714286 315.773614 Q 275.714286 381.434088 500.714286 468.981207" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" fill="none" marker-end="url(#arrow)" />
  <text x="211.428571" y="348.603851" text-anchor="middle" font-family="sans-serif" font-size="15.159429" fill="var(--text-faint)">3. IRQ on complete</text>
  <text x="640" y="40" text-anchor="middle" font-family="sans-serif" font-size="19.490836" fill="var(--primary-accent)" font-weight="bold">2. DMA transfers data without CPU involvement</text>
  <rect x="168.571429" y="545.585004" width="942.857143" height="74.414996" rx="7.476108" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="578.415241" text-anchor="middle" font-family="sans-serif" font-size="19.490836" font-weight="bold" fill="var(--primary-accent)">CPU is freed for computation while DMA handles bulk data movement</text>
  <text x="640" y="606.868014" text-anchor="middle" font-family="sans-serif" font-size="16.242343" fill="var(--text-muted)">Typical use: UART RX/TX, ADC continuous scan, SPI flash read — all without polling</text>
</svg>
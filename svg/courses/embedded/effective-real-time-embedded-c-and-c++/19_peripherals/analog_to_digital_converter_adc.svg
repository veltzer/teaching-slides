<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="321.25" y="69" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text-muted)">Analog Signal (continuous)</text>
  <path d="M 96.25 346.1111 Q 171.25 185 246.25 297.7777 T 396.25 201.1111 T 546.25 313.8889" stroke="var(--primary-border)" stroke-width="2.6667" fill="none" />
  <line x1="96.25" y1="346.1111" x2="565" y2="346.1111" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="96.25" y1="354.1667" x2="96.25" y2="104.4444" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="574.375" y="350.1389" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">t</text>
  <text x="100" y="100.4167" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">V</text>
  <rect x="583.75" y="168.8889" width="187.5" height="145" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="677.4999" y="239.7777" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--bg)">ADC</text>
  <text x="677.4999" y="263.9444" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">sample &amp; hold</text>
  <text x="677.4999" y="283.2777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">quantize</text>
  <line x1="546.25" y1="241.3889" x2="581.875" y2="241.3889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="773.125" y1="241.3889" x2="808.75" y2="241.3889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="958.75" y="69" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text-muted)">Digital Values (discrete)</text>
  <rect x="813.4374" y="281.6667" width="26.25" height="64.4444" rx="6" fill="var(--primary-accent)" />
  <rect x="855.6249" y="249.4444" width="26.25" height="96.6667" rx="6" fill="var(--primary-accent)" />
  <rect x="897.8124" y="273.6111" width="26.25" height="72.5" rx="6" fill="var(--primary-accent)" />
  <rect x="939.9999" y="225.2777" width="26.25" height="120.8333" rx="6" fill="var(--primary-accent)" />
  <rect x="982.1874" y="257.5" width="26.25" height="88.6111" rx="6" fill="var(--primary-accent)" />
  <rect x="1024.3749" y="289.7223" width="26.25" height="56.3889" rx="6" fill="var(--primary-accent)" />
  <rect x="1066.5624" y="241.3889" width="26.25" height="104.7223" rx="6" fill="var(--primary-accent)" />
  <rect x="1108.7499" y="265.5556" width="26.25" height="80.5556" rx="6" fill="var(--primary-accent)" />
  <line x1="808.75" y1="354.1667" x2="1165" y2="354.1667" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="808.75" y1="354.1667" x2="808.75" y2="104.4444" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="1172.5" y="358.1944" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">n</text>
  <text x="812.4999" y="100.4167" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">bits</text>
  <rect x="227.5" y="410.5556" width="825" height="112.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="434.7223" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Key ADC Parameters</text>
  <line x1="246.25" y1="442.7777" x2="1033.75" y2="442.7777" stroke="var(--border)" stroke-width="0.8889" />
  <text x="358.75" y="463.7223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)" font-weight="bold">Resolution</text>
  <text x="658.75" y="463.7223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)" font-weight="bold">Sample Rate</text>
  <text x="939.9999" y="463.7223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)" font-weight="bold">Reference</text>
  <text x="358.75" y="484.6667" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">8 / 10 / 12 / 16 bit</text>
  <text x="658.75" y="484.6667" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">kSPS – MSPS</text>
  <text x="939.9999" y="484.6667" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">VREF+ / VREF-</text>
  <text x="358.75" y="504" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">2ⁿ distinct levels</text>
  <text x="658.75" y="504" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">Nyquist: fs &gt; 2 × fsignal</text>
  <text x="939.9999" y="504" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">sets full-scale voltage</text>
</svg>
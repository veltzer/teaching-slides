<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="290.87108" y="40" text-anchor="middle" font-family="sans-serif" font-size="18.662375" fill="var(--text-muted)">Analog Signal (continuous)</text>
  <path d="M 40 393.758877 Q 123.623693 188.085117 207.247387 332.05666 T 374.494774 208.65248 T 541.74216 352.624151" stroke="var(--primary-border)" stroke-width="2.6667" fill="none" />
  <line x1="40" y1="393.758877" x2="562.648084" y2="393.758877" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="40" y1="404.042622" x2="40" y2="85.248174" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="573.101045" y="398.90075" font-family="sans-serif" font-size="14.515075" fill="var(--text-faint)">t</text>
  <text x="44.181185" y="80.106428" font-family="sans-serif" font-size="14.515075" fill="var(--text-faint)">V</text>
  <rect x="583.554007" y="167.517754" width="209.059233" height="185.106397" rx="7.158335" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="688.083512" y="258.014101" text-anchor="middle" font-family="sans-serif" font-size="26.956738" font-weight="bold" fill="var(--bg)">ADC</text>
  <text x="688.083512" y="288.86521" text-anchor="middle" font-family="sans-serif" font-size="16.588725" fill="var(--primary-accent)">sample &amp; hold</text>
  <text x="688.083512" y="313.54602" text-anchor="middle" font-family="sans-serif" font-size="16.588725" fill="var(--primary-accent)">quantize</text>
  <line x1="541.74216" y1="260.070952" x2="581.463415" y2="260.070952" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="794.703833" y1="260.070952" x2="834.425087" y2="260.070952" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="1001.672474" y="40" text-anchor="middle" font-family="sans-serif" font-size="18.662375" fill="var(--text-muted)">Digital Values (discrete)</text>
  <rect x="839.651456" y="311.489424" width="29.268293" height="82.269453" rx="7.158335" fill="var(--primary-accent)" />
  <rect x="886.689784" y="270.35457" width="29.268293" height="123.404307" rx="7.158335" fill="var(--primary-accent)" />
  <rect x="933.728111" y="301.205679" width="29.268293" height="92.553198" rx="7.158335" fill="var(--primary-accent)" />
  <rect x="980.766439" y="239.503461" width="29.268293" height="154.255288" rx="7.158335" fill="var(--primary-accent)" />
  <rect x="1027.804767" y="280.638316" width="29.268293" height="113.120561" rx="7.158335" fill="var(--primary-accent)" />
  <rect x="1074.843094" y="321.77317" width="29.268293" height="71.985835" rx="7.158335" fill="var(--primary-accent)" />
  <rect x="1121.881422" y="260.070952" width="29.268293" height="133.688052" rx="7.158335" fill="var(--primary-accent)" />
  <rect x="1168.919749" y="290.922061" width="29.268293" height="102.836944" rx="7.158335" fill="var(--primary-accent)" />
  <line x1="834.425087" y1="404.042622" x2="1231.637631" y2="404.042622" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="834.425087" y1="404.042622" x2="834.425087" y2="85.248174" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="1240" y="409.184368" font-family="sans-serif" font-size="14.515075" fill="var(--text-faint)">n</text>
  <text x="838.60616" y="80.106428" font-family="sans-serif" font-size="14.515075" fill="var(--text-faint)">bits</text>
  <rect x="186.341463" y="476.028458" width="919.860627" height="143.971542" rx="7.158335" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="646.271777" y="506.879566" text-anchor="middle" font-family="sans-serif" font-size="18.662375" font-weight="bold" fill="var(--text)">Key ADC Parameters</text>
  <line x1="207.247387" y1="517.163056" x2="1085.296167" y2="517.163056" stroke="var(--border)" stroke-width="0.8889" />
  <text x="332.682927" y="543.900845" text-anchor="middle" font-family="sans-serif" font-size="16.588725" fill="var(--text-muted)" font-weight="bold">Resolution</text>
  <text x="667.1777" y="543.900845" text-anchor="middle" font-family="sans-serif" font-size="16.588725" fill="var(--text-muted)" font-weight="bold">Sample Rate</text>
  <text x="980.766439" y="543.900845" text-anchor="middle" font-family="sans-serif" font-size="16.588725" fill="var(--text-muted)" font-weight="bold">Reference</text>
  <text x="332.682927" y="570.638379" text-anchor="middle" font-family="monospace" font-size="16.588725" fill="var(--primary-accent)">8 / 10 / 12 / 16 bit</text>
  <text x="667.1777" y="570.638379" text-anchor="middle" font-family="monospace" font-size="16.588725" fill="var(--text-muted)">kSPS – MSPS</text>
  <text x="980.766439" y="570.638379" text-anchor="middle" font-family="monospace" font-size="16.588725" fill="var(--text-muted)">VREF+ / VREF-</text>
  <text x="332.682927" y="595.31919" text-anchor="middle" font-family="sans-serif" font-size="14.515075" fill="var(--text-faint)">2ⁿ distinct levels</text>
  <text x="667.1777" y="595.31919" text-anchor="middle" font-family="sans-serif" font-size="14.515075" fill="var(--text-faint)">Nyquist: fs &gt; 2 × fsignal</text>
  <text x="980.766439" y="595.31919" text-anchor="middle" font-family="sans-serif" font-size="14.515075" fill="var(--text-faint)">sets full-scale voltage</text>
</svg>
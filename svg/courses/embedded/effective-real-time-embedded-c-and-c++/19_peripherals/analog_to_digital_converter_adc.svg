<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="bold" fill="#212121">Analog-to-Digital Converter (ADC)</text>
  <line x1="200" y1="66" x2="1080" y2="66" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Analog signal curve (left side) -->
  <text x="300" y="106" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">Analog Signal (continuous)</text>
  <path d="M 60 380 Q 140 180 220 320 T 380 200 T 540 340" stroke="#1565c0" stroke-width="3" fill="none"/>
  <!-- Axis -->
  <line x1="60" y1="450" x2="560" y2="450" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="460" x2="60" y2="150" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="570" y="455" font-family="sans-serif" font-size="14" fill="#9e9e9e">t</text>
  <text x="64" y="145" font-family="sans-serif" font-size="14" fill="#9e9e9e">V</text>

  <!-- ADC box -->
  <rect x="580" y="230" width="200" height="180" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="680" y="318" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">ADC</text>
  <text x="680" y="348" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">sample &amp; hold</text>
  <text x="680" y="372" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">quantize</text>
  <line x1="540" y1="320" x2="578" y2="320" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="782" y1="320" x2="820" y2="320" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Digital samples (right side) -->
  <text x="980" y="106" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">Digital Values (discrete)</text>
  <!-- Sample bars -->
  <rect x="825"  y="370" width="28" height="80"  rx="2" fill="#1565c0"/>
  <rect x="870"  y="330" width="28" height="120" rx="2" fill="#1565c0"/>
  <rect x="915"  y="360" width="28" height="90"  rx="2" fill="#1565c0"/>
  <rect x="960"  y="300" width="28" height="150" rx="2" fill="#1565c0"/>
  <rect x="1005" y="340" width="28" height="110" rx="2" fill="#1565c0"/>
  <rect x="1050" y="380" width="28" height="70"  rx="2" fill="#1565c0"/>
  <rect x="1095" y="320" width="28" height="130" rx="2" fill="#1565c0"/>
  <rect x="1140" y="350" width="28" height="100" rx="2" fill="#1565c0"/>
  <!-- Axis -->
  <line x1="820" y1="460" x2="1200" y2="460" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="460" x2="820" y2="150" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1208" y="465" font-family="sans-serif" font-size="14" fill="#9e9e9e">n</text>
  <text x="824"  y="145" font-family="sans-serif" font-size="14" fill="#9e9e9e">bits</text>

  <!-- Key specs table -->
  <rect x="200" y="530" width="880" height="140" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="640" y="560" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">Key ADC Parameters</text>
  <line x1="220" y1="570" x2="1060" y2="570" stroke="#e0e0e0" stroke-width="1"/>
  <text x="340" y="596" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555" font-weight="bold">Resolution</text>
  <text x="660" y="596" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555" font-weight="bold">Sample Rate</text>
  <text x="960" y="596" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555" font-weight="bold">Reference</text>
  <text x="340" y="622" text-anchor="middle" font-family="monospace" font-size="16" fill="#1565c0">8 / 10 / 12 / 16 bit</text>
  <text x="660" y="622" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">kSPS – MSPS</text>
  <text x="960" y="622" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">VREF+ / VREF-</text>
  <text x="340" y="646" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">2ⁿ distinct levels</text>
  <text x="660" y="646" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">Nyquist: fs &gt; 2 × fsignal</text>
  <text x="960" y="646" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">sets full-scale voltage</text>
</svg>

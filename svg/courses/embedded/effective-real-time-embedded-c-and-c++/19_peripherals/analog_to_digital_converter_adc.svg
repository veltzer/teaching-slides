<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="266.6667" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--text-muted)">Analog Signal (continuous)</text>
  <path d="M 53.3333 337.7778 Q 124.4444 160 195.5556 284.4444 T 337.7778 177.7778 T 480 302.2222" stroke="var(--primary-border)" stroke-width="2.6667" fill="none" />
  <line x1="53.3333" y1="337.7778" x2="497.7778" y2="337.7778" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="53.3333" y1="346.6667" x2="53.3333" y2="71.1111" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="506.6667" y="342.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">t</text>
  <text x="56.8889" y="66.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">V</text>
  <rect x="515.5556" y="142.2222" width="177.7778" height="160" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="604.4444" y="220.4444" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--bg)">ADC</text>
  <text x="604.4444" y="247.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">sample &amp; hold</text>
  <text x="604.4444" y="268.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">quantize</text>
  <line x1="480" y1="222.2222" x2="513.7778" y2="222.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="695.1111" y1="222.2222" x2="728.8889" y2="222.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="871.1111" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--text-muted)">Digital Values (discrete)</text>
  <rect x="733.3333" y="266.6667" width="24.8889" height="71.1111" rx="6" fill="var(--primary-accent)" />
  <rect x="773.3333" y="231.1111" width="24.8889" height="106.6667" rx="6" fill="var(--primary-accent)" />
  <rect x="813.3333" y="257.7778" width="24.8889" height="80" rx="6" fill="var(--primary-accent)" />
  <rect x="853.3333" y="204.4444" width="24.8889" height="133.3333" rx="6" fill="var(--primary-accent)" />
  <rect x="893.3333" y="240" width="24.8889" height="97.7778" rx="6" fill="var(--primary-accent)" />
  <rect x="933.3333" y="275.5556" width="24.8889" height="62.2222" rx="6" fill="var(--primary-accent)" />
  <rect x="973.3333" y="222.2222" width="24.8889" height="115.5556" rx="6" fill="var(--primary-accent)" />
  <rect x="1013.3333" y="248.8889" width="24.8889" height="88.8889" rx="6" fill="var(--primary-accent)" />
  <line x1="728.8889" y1="346.6667" x2="1066.6667" y2="346.6667" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="728.8889" y1="346.6667" x2="728.8889" y2="71.1111" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="1073.7778" y="351.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">n</text>
  <text x="732.4444" y="66.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">bits</text>
  <rect x="177.7778" y="408.8889" width="782.2222" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Key ADC Parameters</text>
  <line x1="195.5556" y1="444.4444" x2="942.2222" y2="444.4444" stroke="var(--border)" stroke-width="0.8889" />
  <text x="302.2222" y="467.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)" font-weight="bold">Resolution</text>
  <text x="586.6667" y="467.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)" font-weight="bold">Sample Rate</text>
  <text x="853.3333" y="467.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)" font-weight="bold">Reference</text>
  <text x="302.2222" y="490.6667" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">8 / 10 / 12 / 16 bit</text>
  <text x="586.6667" y="490.6667" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">kSPS – MSPS</text>
  <text x="853.3333" y="490.6667" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">VREF+ / VREF-</text>
  <text x="302.2222" y="512" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">2ⁿ distinct levels</text>
  <text x="586.6667" y="512" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">Nyquist: fs &gt; 2 × fsignal</text>
  <text x="853.3333" y="512" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">sets full-scale voltage</text>
</svg>
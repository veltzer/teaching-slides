<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9,2 L1,5 L9,8 Z" fill="#555555" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="160.8333" width="262.5" height="193.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="246.25" y="233.3333" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--bg)">Device A</text>
  <text x="246.25" y="259.1111" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">TX pin</text>
  <text x="246.25" y="278.4444" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">RX pin</text>
  <text x="246.25" y="304.2223" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">MCU / microcontroller</text>
  <text x="246.25" y="333.2223" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">baud: 115200</text>
  <text x="246.25" y="347.7223" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">8N1 (8 bits, no parity, 1 stop)</text>
  <rect x="902.5" y="160.8333" width="262.5" height="193.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1033.75" y="233.3333" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Device B</text>
  <text x="1033.75" y="259.1111" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">RX pin</text>
  <text x="1033.75" y="278.4444" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">TX pin</text>
  <text x="1033.75" y="304.2223" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-faint)">GPS / BT module</text>
  <text x="1033.75" y="333.2223" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">same baud rate required!</text>
  <line x1="379.375" y1="225.2777" x2="900.625" y2="225.2777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="214" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">TX → RX</text>
  <line x1="900.625" y1="289.7223" x2="379.375" y2="289.7223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow-back)" />
  <text x="640" y="310.6667" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text-muted)">RX ← TX</text>
  <line x1="640" y1="354.1667" x2="640" y2="402.5" stroke="var(--text)" stroke-width="2" />
  <text x="640" y="425.0556" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text)">GND (common ground)</text>
  <text x="640" y="466.9444" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">UART frame format:</text>
  <rect x="227.5" y="478.2223" width="75" height="40.2777" rx="6" fill="var(--text)" />
  <text x="265" y="502.3889" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--bg)">START</text>
  <rect x="304.375" y="478.2223" width="51.5625" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="329.6875" y="502.3889" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">D0</text>
  <rect x="357.8125" y="478.2223" width="51.5625" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="383.125" y="502.3889" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">D1</text>
  <rect x="411.25" y="478.2223" width="51.5625" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="436.5625" y="502.3889" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">D2</text>
  <rect x="464.6875" y="478.2223" width="51.5625" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="490" y="502.3889" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">D3</text>
  <rect x="518.125" y="478.2223" width="51.5625" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="543.4375" y="502.3889" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">D4</text>
  <rect x="571.5625" y="478.2223" width="51.5625" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="596.875" y="502.3889" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">D5</text>
  <rect x="625" y="478.2223" width="51.5625" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="650.3125" y="502.3889" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">D6</text>
  <rect x="678.4375" y="478.2223" width="51.5625" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="703.75" y="502.3889" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">D7</text>
  <rect x="731.875" y="478.2223" width="75" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="769.375" y="502.3889" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-faint)">PARITY</text>
  <rect x="808.75" y="478.2223" width="75" height="40.2777" rx="6" fill="var(--text)" />
  <text x="846.2499" y="502.3889" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--bg)">STOP</text>
  <text x="640" y="541.0556" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">No shared clock — both sides must agree on baud rate in advance</text>
</svg>
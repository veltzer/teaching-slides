<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9,2 L1,5 L9,8 Z" fill="#555555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="300" height="294.915143" rx="7.922138" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="190" y="150.593198" text-anchor="middle" font-family="sans-serif" font-size="29.833057" font-weight="bold" fill="var(--bg)">Device A</text>
  <text x="190" y="189.915257" text-anchor="middle" font-family="sans-serif" font-size="19.506285" fill="var(--primary-accent)">TX pin</text>
  <text x="190" y="219.406726" text-anchor="middle" font-family="sans-serif" font-size="19.506285" fill="var(--primary-accent)">RX pin</text>
  <text x="190" y="258.728938" text-anchor="middle" font-family="monospace" font-size="17.211374" fill="var(--primary-accent)">MCU / microcontroller</text>
  <text x="190" y="302.966217" text-anchor="middle" font-family="sans-serif" font-size="16.063852" fill="var(--primary-accent)">baud: 115200</text>
  <text x="190" y="325.084857" text-anchor="middle" font-family="sans-serif" font-size="16.063852" fill="var(--primary-accent)">8N1 (8 bits, no parity, 1 stop)</text>
  <rect x="940" y="40" width="300" height="294.915143" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1090" y="150.593198" text-anchor="middle" font-family="sans-serif" font-size="29.833057" font-weight="bold" fill="var(--text)">Device B</text>
  <text x="1090" y="189.915257" text-anchor="middle" font-family="sans-serif" font-size="19.506285" fill="var(--text-muted)">RX pin</text>
  <text x="1090" y="219.406726" text-anchor="middle" font-family="sans-serif" font-size="19.506285" fill="var(--text-muted)">TX pin</text>
  <text x="1090" y="258.728938" text-anchor="middle" font-family="monospace" font-size="17.211374" fill="var(--text-faint)">GPS / BT module</text>
  <text x="1090" y="302.966217" text-anchor="middle" font-family="sans-serif" font-size="16.063852" fill="var(--text-faint)">same baud rate required!</text>
  <line x1="342.142857" y1="138.304997" x2="937.857143" y2="138.304997" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="121.101729" text-anchor="middle" font-family="monospace" font-size="20.653675" font-weight="bold" fill="var(--primary-accent)">TX → RX</text>
  <line x1="937.857143" y1="236.610299" x2="342.142857" y2="236.610299" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow-back)" />
  <text x="640" y="268.559377" text-anchor="middle" font-family="monospace" font-size="20.653675" font-weight="bold" fill="var(--text-muted)">RX ← TX</text>
  <line x1="640" y1="334.915296" x2="640" y2="408.644043" stroke="var(--text)" stroke-width="2" />
  <text x="640" y="443.050884" text-anchor="middle" font-family="sans-serif" font-size="20.653675" fill="var(--text)">GND (common ground)</text>
  <text x="640" y="506.94904" text-anchor="middle" font-family="sans-serif" font-size="18.358764" fill="var(--text-muted)">UART frame format:</text>
  <rect x="168.571429" y="524.152613" width="85.714286" height="61.440547" rx="7.922138" fill="var(--text)" />
  <text x="211.428571" y="561.01691" text-anchor="middle" font-family="monospace" font-size="16.063852" fill="var(--bg)">START</text>
  <rect x="256.428571" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="285.357143" y="561.01691" text-anchor="middle" font-family="monospace" font-size="16.063852" fill="var(--primary-accent)">D0</text>
  <rect x="317.5" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="346.428571" y="561.01691" text-anchor="middle" font-family="monospace" font-size="16.063852" fill="var(--primary-accent)">D1</text>
  <rect x="378.571429" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="407.5" y="561.01691" text-anchor="middle" font-family="monospace" font-size="16.063852" fill="var(--text-muted)">D2</text>
  <rect x="439.642857" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="468.571429" y="561.01691" text-anchor="middle" font-family="monospace" font-size="16.063852" fill="var(--text-muted)">D3</text>
  <rect x="500.714286" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="529.642857" y="561.01691" text-anchor="middle" font-family="monospace" font-size="16.063852" fill="var(--text-muted)">D4</text>
  <rect x="561.785714" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="590.714286" y="561.01691" text-anchor="middle" font-family="monospace" font-size="16.063852" fill="var(--text-muted)">D5</text>
  <rect x="622.857143" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="651.785714" y="561.01691" text-anchor="middle" font-family="monospace" font-size="16.063852" fill="var(--text-muted)">D6</text>
  <rect x="683.928571" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="712.857143" y="561.01691" text-anchor="middle" font-family="monospace" font-size="16.063852" fill="var(--text-muted)">D7</text>
  <rect x="745" y="524.152613" width="85.714286" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="787.857143" y="561.01691" text-anchor="middle" font-family="monospace" font-size="16.063852" fill="var(--text-faint)">PARITY</text>
  <rect x="832.857143" y="524.152613" width="85.714286" height="61.440547" rx="7.922138" fill="var(--text)" />
  <text x="875.714171" y="561.01691" text-anchor="middle" font-family="monospace" font-size="16.063852" fill="var(--bg)">STOP</text>
  <text x="640" y="620" text-anchor="middle" font-family="sans-serif" font-size="16.063852" fill="var(--text-faint)">No shared clock — both sides must agree on baud rate in advance</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <ns0:path d="M9,2 L1,5 L9,8 Z" fill="#555555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="71.1111" y="133.3333" width="248.8889" height="213.3333" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="195.5556" y="213.3333" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#ffffff">Device A</ns0:text>
  <ns0:text x="195.5556" y="241.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">TX pin</ns0:text>
  <ns0:text x="195.5556" y="263.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">RX pin</ns0:text>
  <ns0:text x="195.5556" y="291.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#90caf9">MCU / microcontroller</ns0:text>
  <ns0:text x="195.5556" y="323.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#90caf9">baud: 115200</ns0:text>
  <ns0:text x="195.5556" y="339.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#90caf9">8N1 (8 bits, no parity, 1 stop)</ns0:text>
  <ns0:rect x="817.7778" y="133.3333" width="248.8889" height="213.3333" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="942.2222" y="213.3333" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">Device B</ns0:text>
  <ns0:text x="942.2222" y="241.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">RX pin</ns0:text>
  <ns0:text x="942.2222" y="263.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">TX pin</ns0:text>
  <ns0:text x="942.2222" y="291.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">GPS / BT module</ns0:text>
  <ns0:text x="942.2222" y="323.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">same baud rate required!</ns0:text>
  <ns0:line x1="321.7778" y1="204.4444" x2="816" y2="204.4444" stroke="#1565c0" stroke-width="2.6667" marker-end="url(#arrow-primary)" />
  <ns0:text x="568.8889" y="192" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1565c0">TX → RX</ns0:text>
  <ns0:line x1="816" y1="275.5556" x2="321.7778" y2="275.5556" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow-back)" />
  <ns0:text x="568.8889" y="298.6667" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#555555">RX ← TX</ns0:text>
  <ns0:line x1="568.8889" y1="346.6667" x2="568.8889" y2="400" stroke="#212121" stroke-width="2.2222" />
  <ns0:text x="568.8889" y="424.8889" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#212121">GND (common ground)</ns0:text>
  <ns0:text x="568.8889" y="471.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#555555">UART frame format:</ns0:text>
  <ns0:rect x="177.7778" y="483.5556" width="71.1111" height="44.4444" rx="1.7778" fill="#212121" />
  <ns0:text x="213.3333" y="510.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#ffffff">START</ns0:text>
  <ns0:rect x="250.6667" y="483.5556" width="48.8889" height="44.4444" rx="1.7778" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="274.6667" y="510.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#1565c0">D0</ns0:text>
  <ns0:rect x="301.3333" y="483.5556" width="48.8889" height="44.4444" rx="1.7778" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="325.3333" y="510.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#1565c0">D1</ns0:text>
  <ns0:rect x="352" y="483.5556" width="48.8889" height="44.4444" rx="1.7778" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="376" y="510.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#555555">D2</ns0:text>
  <ns0:rect x="402.6667" y="483.5556" width="48.8889" height="44.4444" rx="1.7778" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="426.6667" y="510.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#555555">D3</ns0:text>
  <ns0:rect x="453.3333" y="483.5556" width="48.8889" height="44.4444" rx="1.7778" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="477.3333" y="510.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#555555">D4</ns0:text>
  <ns0:rect x="504" y="483.5556" width="48.8889" height="44.4444" rx="1.7778" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="528" y="510.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#555555">D5</ns0:text>
  <ns0:rect x="554.6667" y="483.5556" width="48.8889" height="44.4444" rx="1.7778" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="578.6667" y="510.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#555555">D6</ns0:text>
  <ns0:rect x="605.3333" y="483.5556" width="48.8889" height="44.4444" rx="1.7778" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="629.3333" y="510.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#555555">D7</ns0:text>
  <ns0:rect x="656" y="483.5556" width="71.1111" height="44.4444" rx="1.7778" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="691.5556" y="510.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#9e9e9e">PARITY</ns0:text>
  <ns0:rect x="728.8889" y="483.5556" width="71.1111" height="44.4444" rx="1.7778" fill="#212121" />
  <ns0:text x="764.4444" y="510.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#ffffff">STOP</ns0:text>
  <ns0:text x="568.8889" y="552.8889" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">No shared clock — both sides must agree on baud rate in advance</ns0:text>
</ns0:svg>
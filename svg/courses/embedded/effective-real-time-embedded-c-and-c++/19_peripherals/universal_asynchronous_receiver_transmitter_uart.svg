<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9,2 L1,5 L9,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="bold" fill="#212121">UART</text>
  <line x1="200" y1="66" x2="1080" y2="66" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Device A (left) -->
  <rect x="80" y="220" width="280" height="240" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="220" y="310" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Device A</text>
  <text x="220" y="342" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">TX pin</text>
  <text x="220" y="366" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">RX pin</text>
  <text x="220" y="398" text-anchor="middle" font-family="monospace" font-size="15" fill="#90caf9">MCU / microcontroller</text>
  <text x="220" y="434" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#90caf9">baud: 115200</text>
  <text x="220" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#90caf9">8N1 (8 bits, no parity, 1 stop)</text>

  <!-- Device B (right) -->
  <rect x="920" y="220" width="280" height="240" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1060" y="310" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Device B</text>
  <text x="1060" y="342" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">RX pin</text>
  <text x="1060" y="366" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">TX pin</text>
  <text x="1060" y="398" text-anchor="middle" font-family="monospace" font-size="15" fill="#9e9e9e">GPS / BT module</text>
  <text x="1060" y="434" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">same baud rate required!</text>

  <!-- TX → RX line -->
  <line x1="362" y1="300" x2="918" y2="300" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="640" y="286" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#1565c0">TX → RX</text>

  <!-- RX ← TX line -->
  <line x1="918" y1="380" x2="362" y2="380" stroke="#555555" stroke-width="3" marker-end="url(#arrow-back)"/>
  <text x="640" y="406" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#555555">RX ← TX</text>

  <!-- GND -->
  <line x1="640" y1="460" x2="640" y2="520" stroke="#212121" stroke-width="2.5"/>
  <text x="640" y="548" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#212121">GND (common ground)</text>

  <!-- UART frame diagram -->
  <text x="640" y="600" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">UART frame format:</text>
  <rect x="200"  y="614" width="80"  height="50" rx="2" fill="#212121"/>
  <text x="240"  y="644" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff">START</text>
  <rect x="282"  y="614" width="55"  height="50" rx="2" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5"/>
  <text x="309"  y="644" text-anchor="middle" font-family="monospace" font-size="14" fill="#1565c0">D0</text>
  <rect x="339"  y="614" width="55"  height="50" rx="2" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5"/>
  <text x="366"  y="644" text-anchor="middle" font-family="monospace" font-size="14" fill="#1565c0">D1</text>
  <rect x="396"  y="614" width="55"  height="50" rx="2" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="423"  y="644" text-anchor="middle" font-family="monospace" font-size="14" fill="#555555">D2</text>
  <rect x="453"  y="614" width="55"  height="50" rx="2" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="480"  y="644" text-anchor="middle" font-family="monospace" font-size="14" fill="#555555">D3</text>
  <rect x="510"  y="614" width="55"  height="50" rx="2" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="537"  y="644" text-anchor="middle" font-family="monospace" font-size="14" fill="#555555">D4</text>
  <rect x="567"  y="614" width="55"  height="50" rx="2" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="594"  y="644" text-anchor="middle" font-family="monospace" font-size="14" fill="#555555">D5</text>
  <rect x="624"  y="614" width="55"  height="50" rx="2" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="651"  y="644" text-anchor="middle" font-family="monospace" font-size="14" fill="#555555">D6</text>
  <rect x="681"  y="614" width="55"  height="50" rx="2" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="708"  y="644" text-anchor="middle" font-family="monospace" font-size="14" fill="#555555">D7</text>
  <rect x="738"  y="614" width="80"  height="50" rx="2" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="778"  y="644" text-anchor="middle" font-family="monospace" font-size="14" fill="#9e9e9e">PARITY</text>
  <rect x="820"  y="614" width="80"  height="50" rx="2" fill="#212121"/>
  <text x="860"  y="644" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff">STOP</text>
  <text x="640"  y="692" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">No shared clock — both sides must agree on baud rate in advance</text>
</svg>

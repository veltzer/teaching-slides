<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="300" height="294.915143" rx="7.922138" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="150.593198" text-anchor="middle" font-size="29.833057" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Device A</text>
  <text x="190" y="189.915257" text-anchor="middle" font-size="19.506285" fill="var(--primary-accent)" font-family="Arial, sans-serif">TX pin</text>
  <text x="190" y="219.406726" text-anchor="middle" font-size="19.506285" fill="var(--primary-accent)" font-family="Arial, sans-serif">RX pin</text>
  <text x="190" y="258.728938" text-anchor="middle" font-size="17.211374" fill="var(--primary-accent)" font-family="Courier New, monospace">MCU / microcontroller</text>
  <text x="190" y="302.966217" text-anchor="middle" font-size="16.063852" fill="var(--primary-accent)" font-family="Arial, sans-serif">baud: 115200</text>
  <text x="190" y="325.084857" text-anchor="middle" font-size="16.063852" fill="var(--primary-accent)" font-family="Arial, sans-serif">8N1 (8 bits, no parity, 1 stop)</text>
  <rect x="940" y="40" width="300" height="294.915143" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1090" y="150.593198" text-anchor="middle" font-size="29.833057" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Device B</text>
  <text x="1090" y="189.915257" text-anchor="middle" font-size="19.506285" fill="var(--text-muted)" font-family="Arial, sans-serif">RX pin</text>
  <text x="1090" y="219.406726" text-anchor="middle" font-size="19.506285" fill="var(--text-muted)" font-family="Arial, sans-serif">TX pin</text>
  <text x="1090" y="258.728938" text-anchor="middle" font-size="17.211374" fill="var(--text-faint)" font-family="Courier New, monospace">GPS / BT module</text>
  <text x="1090" y="302.966217" text-anchor="middle" font-size="16.063852" fill="var(--text-faint)" font-family="Arial, sans-serif">same baud rate required!</text>
  <line x1="342.142857" y1="138.304997" x2="937.857143" y2="138.304997" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="640" y="121.101729" text-anchor="middle" font-size="20.653675" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">TX → RX</text>
  <line x1="937.857143" y1="236.610299" x2="342.142857" y2="236.610299" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="268.559377" text-anchor="middle" font-size="20.653675" font-weight="bold" fill="var(--text-muted)" font-family="Courier New, monospace">RX ← TX</text>
  <line x1="640" y1="334.915296" x2="640" y2="408.644043" stroke="var(--text)" stroke-width="2"/>
  <text x="640" y="443.050884" text-anchor="middle" font-size="20.653675" fill="var(--text)" font-family="Arial, sans-serif">GND (common ground)</text>
  <text x="640" y="506.94904" text-anchor="middle" font-size="18.358764" fill="var(--text-muted)" font-family="Arial, sans-serif">UART frame format:</text>
  <rect x="168.571429" y="524.152613" width="85.714286" height="61.440547" rx="7.922138" fill="var(--text)"/>
  <text x="211.428571" y="561.01691" text-anchor="middle" font-size="16.063852" fill="var(--bg)" font-family="Courier New, monospace">START</text>
  <rect x="256.428571" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="285.357143" y="561.01691" text-anchor="middle" font-size="16.063852" fill="var(--primary-accent)" font-family="Courier New, monospace">D0</text>
  <rect x="317.5" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="346.428571" y="561.01691" text-anchor="middle" font-size="16.063852" fill="var(--primary-accent)" font-family="Courier New, monospace">D1</text>
  <rect x="378.571429" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="407.5" y="561.01691" text-anchor="middle" font-size="16.063852" fill="var(--text-muted)" font-family="Courier New, monospace">D2</text>
  <rect x="439.642857" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="468.571429" y="561.01691" text-anchor="middle" font-size="16.063852" fill="var(--text-muted)" font-family="Courier New, monospace">D3</text>
  <rect x="500.714286" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="529.642857" y="561.01691" text-anchor="middle" font-size="16.063852" fill="var(--text-muted)" font-family="Courier New, monospace">D4</text>
  <rect x="561.785714" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="590.714286" y="561.01691" text-anchor="middle" font-size="16.063852" fill="var(--text-muted)" font-family="Courier New, monospace">D5</text>
  <rect x="622.857143" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="651.785714" y="561.01691" text-anchor="middle" font-size="16.063852" fill="var(--text-muted)" font-family="Courier New, monospace">D6</text>
  <rect x="683.928571" y="524.152613" width="58.928571" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="712.857143" y="561.01691" text-anchor="middle" font-size="16.063852" fill="var(--text-muted)" font-family="Courier New, monospace">D7</text>
  <rect x="745" y="524.152613" width="85.714286" height="61.440547" rx="7.922138" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="787.857143" y="561.01691" text-anchor="middle" font-size="16.063852" fill="var(--text-faint)" font-family="Courier New, monospace">PARITY</text>
  <rect x="832.857143" y="524.152613" width="85.714286" height="61.440547" rx="7.922138" fill="var(--text)"/>
  <text x="875.714171" y="561.01691" text-anchor="middle" font-size="16.063852" fill="var(--bg)" font-family="Courier New, monospace">STOP</text>
  <text x="640" y="620" text-anchor="middle" font-size="16.063852" fill="var(--text-faint)" font-family="Arial, sans-serif">No shared clock — both sides must agree on baud rate in advance</text>
</svg>

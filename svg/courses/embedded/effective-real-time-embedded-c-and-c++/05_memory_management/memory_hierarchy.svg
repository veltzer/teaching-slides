<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <polygon points="68,91 64,104 72,104" fill="#aaaaaa"/>

  <!-- Right: size -->
  <text x="1186" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1565c0" font-weight="bold">bytes</text>
  <text x="1186" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1565c0">KB</text>
  <text x="1186" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">MB</text>
  <text x="1186" y="334" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">MB–GB</text>
  <text x="1186" y="442" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">MB–GB</text>
  <text x="1234" y="270" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555" transform="rotate(90 1234 340)">Size</text>
  <line x1="1212" y1="26" x2="1212" y2="500" stroke="#e0e0e0" stroke-width="1.5"/>
  <polygon points="1212,575 1208,562 1216,562" fill="#aaaaaa"/>

  <!-- Embedded note -->
  <rect x="240" y="526" width="800" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="556" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1565c0">Embedded: often no L2/L3 cache · Flash is the primary non-volatile storage</text>

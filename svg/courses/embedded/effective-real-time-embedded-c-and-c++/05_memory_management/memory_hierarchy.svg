<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="26" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">Faster &amp; smaller at top · Slower &amp; larger at bottom</text>

  <!-- Pyramid tiers — trapezoids -->
  <!-- Tier 1: Registers -->
  <polygon points="540,46 740,46 800,116 480,116" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="90" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">CPU Registers</text>

  <!-- Tier 2: L1 Cache -->
  <polygon points="480,122 800,122 870,202 410,202" fill="#1976d2" filter="url(#shadow)"/>
  <text x="640" y="170" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">L1 Cache</text>

  <!-- Tier 3: L2/L3 Cache -->
  <polygon points="410,208 870,208 950,298 330,298" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="261" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">L2 / L3 Cache</text>

  <!-- Tier 4: SRAM -->
  <polygon points="330,304 950,304 1040,404 240,404" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="358" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">SRAM / DRAM</text>

  <!-- Tier 5: Flash -->
  <polygon points="240,410 1040,410 1140,520 140,520" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="470" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#555555">Flash / ROM</text>

  <!-- Left: speed labels -->
  <text x="94" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1565c0" font-weight="bold">1 cycle</text>
  <text x="94" y="168" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1565c0">~4 cycles</text>
  <text x="94" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">~10 cycles</text>
  <text x="94" y="354" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">~100 cycles</text>
  <text x="94" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">~100+ cycles</text>
  <line x1="68" y1="46" x2="68" y2="520" stroke="#e0e0e0" stroke-width="1.5"/>
  <polygon points="68,41 64,54 72,54" fill="#aaaaaa"/>
  <text x="38" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555" transform="rotate(-90 38 290)">Speed</text>

  <!-- Right: size labels -->
  <text x="1186" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1565c0" font-weight="bold">bytes</text>
  <text x="1186" y="168" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1565c0">KB</text>
  <text x="1186" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">MB</text>
  <text x="1186" y="354" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">MB–GB</text>
  <text x="1186" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">MB–GB</text>
  <line x1="1212" y1="46" x2="1212" y2="520" stroke="#e0e0e0" stroke-width="1.5"/>
  <polygon points="1212,525 1208,512 1216,512" fill="#aaaaaa"/>
  <text x="1242" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555" transform="rotate(90 1242 290)">Size</text>

  <!-- Embedded note -->
  <rect x="240" y="548" width="800" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="578" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1565c0">Embedded: often no L2/L3 cache · Flash is the primary non-volatile storage</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="60.9444" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text-muted)">Faster &amp; smaller at top · Slower &amp; larger at bottom</text>
  <polygon points="546.25,77.0556 733.75,77.0556 790,133.4444 490,133.4444" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="640" y="112.5" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)">CPU Registers</text>
  <polygon points="490,138.2777 790,138.2777 855.6249,202.7223 424.3749,202.7223" fill="var(--primary-fill)" filter="url(#shadow)" />
  <text x="640" y="176.9444" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)">L1 Cache</text>
  <polygon points="424.3749,207.5556 855.6249,207.5556 930.6249,280.0556 349.375,280.0556" fill="url(#grad-surface)" stroke="var(--primary-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="640" y="250.25" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text)">L2 / L3 Cache</text>
  <polygon points="349.375,284.8889 930.6249,284.8889 1014.9999,365.4444 265,365.4444" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="640" y="328.3889" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text)">SRAM / DRAM</text>
  <polygon points="265,370.2777 1014.9999,370.2777 1108.7499,458.8889 171.25,458.8889" fill="var(--surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="640" y="418.6111" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text-muted)">Flash / ROM</text>
  <text x="128.125" y="106.0556" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--primary-accent)" font-weight="bold">1 cycle</text>
  <text x="128.125" y="175.3333" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--primary-accent)">~4 cycles</text>
  <text x="128.125" y="247.8333" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">~10 cycles</text>
  <text x="128.125" y="325.1667" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">~100 cycles</text>
  <text x="128.125" y="412.1667" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">~100+ cycles</text>
  <line x1="103.75" y1="77.0556" x2="103.75" y2="458.8889" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="103.75,73.0277 100,83.5 107.5,83.5" fill="var(--text-faint)" />
  <text x="75.625" y="273.6111" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)" transform="rotate(-90 38 290)">Speed</text>
  <text x="1151.875" y="106.0556" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--primary-accent)" font-weight="bold">bytes</text>
  <text x="1151.875" y="175.3333" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--primary-accent)">KB</text>
  <text x="1151.875" y="247.8333" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">MB</text>
  <text x="1151.875" y="325.1667" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">MB–GB</text>
  <text x="1151.875" y="412.1667" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">MB–GB</text>
  <line x1="1176.2499" y1="77.0556" x2="1176.2499" y2="458.8889" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="1176.2499,462.9167 1172.5,452.4444 1180,452.4444" fill="var(--text-faint)" />
  <text x="1204.375" y="273.6111" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)" transform="rotate(90 1242 290)">Size</text>
  <rect x="265" y="481.4444" width="750" height="38.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="505.6111" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">Embedded: often no L2/L3 cache · Flash is the primary non-volatile storage</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="23.1111" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Faster &amp; smaller at top · Slower &amp; larger at bottom</ns0:text>
  <ns0:polygon points="480,40.8889 657.7778,40.8889 711.1111,103.1111 426.6667,103.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="80" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#ffffff">CPU Registers</ns0:text>
  <ns0:polygon points="426.6667,108.4444 711.1111,108.4444 773.3333,179.5556 364.4444,179.5556" fill="#1976d2" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#ffffff">L1 Cache</ns0:text>
  <ns0:polygon points="364.4444,184.8889 773.3333,184.8889 844.4444,264.8889 293.3333,264.8889" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="232" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#212121">L2 / L3 Cache</ns0:text>
  <ns0:polygon points="293.3333,270.2222 844.4444,270.2222 924.4444,359.1111 213.3333,359.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="318.2222" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#212121">SRAM / DRAM</ns0:text>
  <ns0:polygon points="213.3333,364.4444 924.4444,364.4444 1013.3333,462.2222 124.4444,462.2222" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="417.7778" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#555555">Flash / ROM</ns0:text>
  <ns0:text x="83.5556" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#1565c0" font-weight="bold">1 cycle</ns0:text>
  <ns0:text x="83.5556" y="149.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#1565c0">~4 cycles</ns0:text>
  <ns0:text x="83.5556" y="229.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555555">~10 cycles</ns0:text>
  <ns0:text x="83.5556" y="314.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555555">~100 cycles</ns0:text>
  <ns0:text x="83.5556" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">~100+ cycles</ns0:text>
  <ns0:line x1="60.4444" y1="40.8889" x2="60.4444" y2="462.2222" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:polygon points="60.4444,36.4444 56.8889,48 64,48" fill="#aaaaaa" />
  <ns0:text x="33.7778" y="257.7778" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555" transform="rotate(-90 38 290)">Speed</ns0:text>
  <ns0:text x="1054.2222" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#1565c0" font-weight="bold">bytes</ns0:text>
  <ns0:text x="1054.2222" y="149.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#1565c0">KB</ns0:text>
  <ns0:text x="1054.2222" y="229.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555555">MB</ns0:text>
  <ns0:text x="1054.2222" y="314.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555555">MB–GB</ns0:text>
  <ns0:text x="1054.2222" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">MB–GB</ns0:text>
  <ns0:line x1="1077.3333" y1="40.8889" x2="1077.3333" y2="462.2222" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:polygon points="1077.3333,466.6667 1073.7778,455.1111 1080.8889,455.1111" fill="#aaaaaa" />
  <ns0:text x="1104" y="257.7778" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555" transform="rotate(90 1242 290)">Size</ns0:text>
  <ns0:rect x="213.3333" y="487.1111" width="711.1111" height="42.6667" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="513.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#1565c0">Embedded: often no L2/L3 cache · Flash is the primary non-volatile storage</ns0:text>
</ns0:svg>
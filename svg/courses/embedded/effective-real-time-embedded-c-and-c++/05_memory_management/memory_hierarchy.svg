<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="43.2" font-weight="bold">Memory Hierarchy</text>
  <polygon points="640,120 320,240 960,240" fill="#ffcccc" stroke="#333" stroke-width="4.8" />
  <text x="640" y="192" text-anchor="middle" font-size="33.6">CPU Registers</text>
  <polygon points="640,240 256,360 1024,360" fill="#ffddcc" stroke="#333" stroke-width="4.8" />
  <text x="640" y="312" text-anchor="middle" font-size="33.6">L1 Cache</text>
  <polygon points="640,360 192,480 1088,480" fill="#ffeedd" stroke="#333" stroke-width="4.8" />
  <text x="640" y="432" text-anchor="middle" font-size="33.6">L2/L3 Cache</text>
  <polygon points="640,480 128,600 1152,600" fill="#ffffcc" stroke="#333" stroke-width="4.8" />
  <text x="640" y="552" text-anchor="middle" font-size="33.6">RAM</text>
  <polygon points="640,600 64,720 1216,720" fill="#eeffcc" stroke="#333" stroke-width="4.8" />
  <text x="640" y="672" text-anchor="middle" font-size="33.6">Storage</text>
</svg>
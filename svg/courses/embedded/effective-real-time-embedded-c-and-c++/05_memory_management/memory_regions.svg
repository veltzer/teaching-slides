<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="203.636218" y="40" width="872.727273" height="89.078509" rx="8.021071" fill="var(--text)"/>
  <text x="449.090764" y="89.488088" text-anchor="middle" font-size="25.558608" fill="var(--text-faint)" font-family="Courier New, monospace">0xFFFFFFFF</text>
  <text x="885.454545" y="89.488088" text-anchor="middle" font-size="23.235171" fill="var(--text-faint)" font-family="Arial, sans-serif">System (exceptions)</text>
  <rect x="203.636218" y="136.996667" width="872.727273" height="89.078509" rx="8.021071" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="449.090764" y="186.484632" text-anchor="middle" font-size="25.558608" fill="var(--text-muted)" font-family="Courier New, monospace">0xE0000000</text>
  <text x="885.454545" y="186.484632" text-anchor="middle" font-size="23.235171" fill="var(--text-muted)" font-family="Arial, sans-serif">Peripherals</text>
  <rect x="203.636218" y="233.993211" width="872.727273" height="89.078509" rx="8.021071" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="449.090764" y="283.481175" text-anchor="middle" font-size="25.558608" fill="var(--primary-accent)" font-family="Courier New, monospace">0x20000000</text>
  <text x="885.454545" y="283.481175" text-anchor="middle" font-size="23.235171" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">SRAM</text>
  <rect x="203.636218" y="330.989754" width="872.727273" height="89.078509" rx="8.021071" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="449.090764" y="380.477965" text-anchor="middle" font-size="25.558608" fill="var(--primary-accent)" font-family="Courier New, monospace">0x08000000</text>
  <text x="885.454545" y="380.477965" text-anchor="middle" font-size="23.235171" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Flash</text>
  <rect x="203.636218" y="427.986421" width="872.727273" height="89.078509" rx="8.021071" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="449.090764" y="477.474509" text-anchor="middle" font-size="25.558608" fill="var(--text-muted)" font-family="Courier New, monospace">0x00000000</text>
  <text x="885.454545" y="477.474509" text-anchor="middle" font-size="23.235171" fill="var(--text-muted)" font-family="Arial, sans-serif">Aliased (boot config)</text>
  <rect x="40" y="552.696333" width="1200" height="67.303667" rx="8.021071" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="582.389211" text-anchor="middle" font-size="20.911601" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">STM32 Cortex-M memory map (ARM architecture)</text>
  <text x="640" y="608.122947" text-anchor="middle" font-size="18.58803" fill="var(--text-muted)" font-family="Arial, sans-serif">Peripherals are memory-mapped — accessed via pointer dereference, not I/O instructions</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="203.636218" y="40" width="872.727273" height="89.078509" rx="8.021071" fill="var(--text)" filter="url(#shadow)" />
  <text x="449.090764" y="89.488088" text-anchor="middle" font-family="monospace" font-size="25.558608" fill="var(--text-faint)">0xFFFFFFFF</text>
  <text x="885.454545" y="89.488088" text-anchor="middle" font-family="sans-serif" font-size="23.235171" fill="var(--text-faint)">System (exceptions)</text>
  <rect x="203.636218" y="136.996667" width="872.727273" height="89.078509" rx="8.021071" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="449.090764" y="186.484632" text-anchor="middle" font-family="monospace" font-size="25.558608" fill="var(--text-muted)">0xE0000000</text>
  <text x="885.454545" y="186.484632" text-anchor="middle" font-family="sans-serif" font-size="23.235171" fill="var(--text-muted)">Peripherals</text>
  <rect x="203.636218" y="233.993211" width="872.727273" height="89.078509" rx="8.021071" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="449.090764" y="283.481175" text-anchor="middle" font-family="monospace" font-size="25.558608" fill="var(--primary-accent)">0x20000000</text>
  <text x="885.454545" y="283.481175" text-anchor="middle" font-family="sans-serif" font-size="23.235171" fill="var(--bg)" font-weight="bold">SRAM</text>
  <rect x="203.636218" y="330.989754" width="872.727273" height="89.078509" rx="8.021071" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="449.090764" y="380.477965" text-anchor="middle" font-family="monospace" font-size="25.558608" fill="var(--primary-accent)">0x08000000</text>
  <text x="885.454545" y="380.477965" text-anchor="middle" font-family="sans-serif" font-size="23.235171" fill="var(--text)" font-weight="bold">Flash</text>
  <rect x="203.636218" y="427.986421" width="872.727273" height="89.078509" rx="8.021071" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="449.090764" y="477.474509" text-anchor="middle" font-family="monospace" font-size="25.558608" fill="var(--text-muted)">0x00000000</text>
  <text x="885.454545" y="477.474509" text-anchor="middle" font-family="sans-serif" font-size="23.235171" fill="var(--text-muted)">Aliased (boot config)</text>
  <rect x="40" y="552.696333" width="1200" height="67.303667" rx="8.021071" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="582.389211" text-anchor="middle" font-family="sans-serif" font-size="20.911601" font-weight="bold" fill="var(--primary-accent)">STM32 Cortex-M memory map (ARM architecture)</text>
  <text x="640" y="608.122947" text-anchor="middle" font-family="sans-serif" font-size="18.58803" fill="var(--text-muted)">Peripherals are memory-mapped — accessed via pointer dereference, not I/O instructions</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Address bar -->
  <rect x="320" y="20" width="640" height="90" rx="4" fill="#212121" filter="url(#shadow)"/>
  <text x="500" y="70" text-anchor="middle" font-family="monospace" font-size="22" fill="#9e9e9e">0xFFFFFFFF</text>
  <text x="820" y="70" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#9e9e9e">System (exceptions)</text>

  <rect x="320" y="118" width="640" height="90" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="168" text-anchor="middle" font-family="monospace" font-size="22" fill="#555555">0xE0000000</text>
  <text x="820" y="168" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#555555">Peripherals</text>

  <rect x="320" y="216" width="640" height="90" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="500" y="266" text-anchor="middle" font-family="monospace" font-size="22" fill="#bbdefb">0x20000000</text>
  <text x="820" y="266" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#ffffff" font-weight="bold">SRAM</text>

  <rect x="320" y="314" width="640" height="90" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="364" text-anchor="middle" font-family="monospace" font-size="22" fill="#1565c0">0x08000000</text>
  <text x="820" y="364" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#212121" font-weight="bold">Flash</text>

  <rect x="320" y="412" width="640" height="90" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="462" text-anchor="middle" font-family="monospace" font-size="22" fill="#555555">0x00000000</text>
  <text x="820" y="462" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#555555">Aliased (boot config)</text>

  <!-- Note -->
  <rect x="200" y="538" width="880" height="68" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="568" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1565c0">STM32 Cortex-M memory map (ARM architecture)</text>
  <text x="640" y="594" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Peripherals are memory-mapped — accessed via pointer dereference, not I/O instructions</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Typical Memory Map</text>
  <rect x="320" y="120" width="640" height="96" fill="#ffcccc" stroke="#333" />
  <text x="640" y="180" text-anchor="middle" font-size="33.6">0xFFFFFFFF - System</text>
  <rect x="320" y="216" width="640" height="96" fill="#ccffcc" stroke="#333" />
  <text x="640" y="276" text-anchor="middle" font-size="33.6">0xE0000000 - Peripherals</text>
  <rect x="320" y="312" width="640" height="96" fill="#ccccff" stroke="#333" />
  <text x="640" y="372" text-anchor="middle" font-size="33.6">0x20000000 - SRAM</text>
  <rect x="320" y="408" width="640" height="96" fill="#ffffcc" stroke="#333" />
  <text x="640" y="468" text-anchor="middle" font-size="33.6">0x08000000 - Flash</text>
  <rect x="320" y="504" width="640" height="96" fill="#ffccff" stroke="#333" />
  <text x="640" y="564" text-anchor="middle" font-size="33.6">0x00000000 - Aliased</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="292.17394" height="179.645899" rx="7.98922" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="186.08697" y="123.407224" text-anchor="middle" font-family="monospace" font-size="27.771327" font-weight="bold" fill="var(--bg)">bytes 0–15</text>
  <text x="186.08697" y="161.902694" text-anchor="middle" font-family="sans-serif" font-size="20.828562" fill="var(--primary-accent)">16 bytes</text>
  <text x="186.08697" y="193.982199" text-anchor="middle" font-family="sans-serif" font-size="17.357113" fill="var(--primary-accent)">← CPU reads here</text>
  <rect x="342.608724" y="40" width="292.17394" height="179.645899" rx="7.98922" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="488.695694" y="123.407224" text-anchor="middle" font-family="monospace" font-size="27.771327" font-weight="bold" fill="var(--text)">bytes 16–31</text>
  <text x="488.695694" y="161.902694" text-anchor="middle" font-family="sans-serif" font-size="20.828562" fill="var(--text-muted)">16 bytes</text>
  <rect x="645.217447" y="40" width="292.17394" height="179.645899" rx="7.98922" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="791.304418" y="123.407224" text-anchor="middle" font-family="monospace" font-size="27.771327" font-weight="bold" fill="var(--text)">bytes 32–47</text>
  <text x="791.304418" y="161.902694" text-anchor="middle" font-family="sans-serif" font-size="20.828562" fill="var(--text-muted)">16 bytes</text>
  <rect x="947.82606" y="40" width="292.17394" height="179.645899" rx="7.98922" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1093.913141" y="123.407224" text-anchor="middle" font-family="monospace" font-size="27.771327" font-weight="bold" fill="var(--text)">bytes 48–63</text>
  <text x="1093.913141" y="161.902694" text-anchor="middle" font-family="sans-serif" font-size="20.828562" fill="var(--text-muted)">16 bytes</text>
  <line x1="40" y1="245.309758" x2="1240" y2="245.309758" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="40" y1="237.610696" x2="40" y2="253.008821" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="1240" y1="237.610696" x2="1240" y2="253.008821" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="640.000056" y="290.221193" text-anchor="middle" font-family="sans-serif" font-size="25.457116" font-weight="bold" fill="var(--primary-accent)">One cache line fetch = 64 bytes from memory</text>
  <rect x="40" y="347.964558" width="542.608746" height="153.982359" rx="7.98922" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="311.304373" y="391.592896" text-anchor="middle" font-family="sans-serif" font-size="23.142906" font-weight="bold" fill="var(--primary-accent)">Spatial Locality (good)</text>
  <text x="311.304373" y="430.088525" text-anchor="middle" font-family="sans-serif" font-size="19.671457" fill="var(--text-muted)">Access arr[0], arr[1] … in order</text>
  <text x="311.304373" y="463.451287" text-anchor="middle" font-family="sans-serif" font-size="19.671457" fill="var(--text-muted)">Whole line stays hot in cache</text>
  <text x="311.304373" y="489.115146" text-anchor="middle" font-family="sans-serif" font-size="17.357113" fill="var(--text-faint)">One miss amortized over 64B</text>
  <rect x="666.086903" y="347.964558" width="542.608746" height="153.982359" rx="7.98922" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="937.391388" y="391.592896" text-anchor="middle" font-family="sans-serif" font-size="23.142906" font-weight="bold" fill="var(--warn-accent)">False Sharing (bad)</text>
  <text x="937.391388" y="430.088525" text-anchor="middle" font-family="sans-serif" font-size="19.671457" fill="var(--text-muted)">Two cores write different fields</text>
  <text x="937.391388" y="463.451287" text-anchor="middle" font-family="sans-serif" font-size="19.671457" fill="var(--text-muted)">in the same cache line</text>
  <text x="937.391388" y="489.115146" text-anchor="middle" font-family="sans-serif" font-size="17.357113" fill="var(--text-faint)">Line bounces between cores → slow</text>
  <rect x="165.217403" y="553.274317" width="918.260955" height="66.725683" rx="7.98922" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="624.34788" y="591.769946" text-anchor="middle" font-family="monospace" font-size="20.828562" fill="var(--text)">Align hot data to 64-byte boundaries: __attribute__((aligned(64)))</text>
  <text x="624.34788" y="614.867292" text-anchor="middle" font-family="sans-serif" font-size="17.357113" fill="var(--text-faint)">Typical cache line size on ARM Cortex-M: 32 bytes; on Cortex-A: 64 bytes</text>
</svg>
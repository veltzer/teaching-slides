<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Cache line bar — 4 × 16-byte chunks -->
  <!-- Chunk 1 (accent — the "hit" chunk) -->
  <rect x="80"  y="110" width="280" height="140" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="220" y="175" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">bytes 0–15</text>
  <text x="220" y="205" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#bbdefb">16 bytes</text>
  <text x="220" y="230" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#bbdefb">← CPU reads here</text>

  <rect x="370" y="110" width="280" height="140" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="175" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#212121">bytes 16–31</text>
  <text x="510" y="205" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">16 bytes</text>

  <rect x="660" y="110" width="280" height="140" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="175" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#212121">bytes 32–47</text>
  <text x="800" y="205" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">16 bytes</text>

  <rect x="950" y="110" width="280" height="140" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1090" y="175" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#212121">bytes 48–63</text>
  <text x="1090" y="205" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555555">16 bytes</text>

  <!-- Brace / label for whole line -->
  <line x1="80"  y1="270" x2="1230" y2="270" stroke="#1565c0" stroke-width="2"/>
  <line x1="80"  y1="264" x2="80"  y2="276" stroke="#1565c0" stroke-width="2"/>
  <line x1="1230" y1="264" x2="1230" y2="276" stroke="#1565c0" stroke-width="2"/>
  <text x="655" y="305" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1565c0">One cache line fetch = 64 bytes from memory</text>

  <!-- Key insight boxes -->
  <rect x="80"  y="350" width="520" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="340" y="384" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1565c0">Spatial Locality (good)</text>
  <text x="340" y="414" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Access arr[0], arr[1] … in order</text>
  <text x="340" y="440" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Whole line stays hot in cache</text>
  <text x="340" y="460" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">One miss amortized over 64B</text>

  <rect x="680" y="350" width="520" height="120" rx="6" fill="#fff3e0" stroke="#f57f17" stroke-width="1.5"/>
  <text x="940" y="384" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e65100">False Sharing (bad)</text>
  <text x="940" y="414" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Two cores write different fields</text>
  <text x="940" y="440" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">in the same cache line</text>
  <text x="940" y="460" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">Line bounces between cores → slow</text>

  <!-- Footer note -->
  <rect x="200" y="510" width="880" height="52" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="640" y="540" text-anchor="middle" font-family="monospace" font-size="18" fill="#212121">Align hot data to 64-byte boundaries: __attribute__((aligned(64)))</text>
  <text x="640" y="558" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">Typical cache line size on ARM Cortex-M: 32 bytes; on Cortex-A: 64 bytes</text>
</svg>

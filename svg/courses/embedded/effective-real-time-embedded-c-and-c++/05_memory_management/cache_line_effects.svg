      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-3.5556%" y="-7.1111%" width="96%" height="110.2222%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-white" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#ffffff" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="71.1111" y="97.7778" width="248.8889" height="124.4444" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="195.5556" y="155.5556" text-anchor="middle" font-family="monospace" font-size="21.3333" font-weight="bold" fill="#ffffff">bytes 0–15</ns0:text>
  <ns0:text x="195.5556" y="182.2222" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">16 bytes</ns0:text>
  <ns0:text x="195.5556" y="204.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#bbdefb">← CPU reads here</ns0:text>
  <ns0:rect x="328.8889" y="97.7778" width="248.8889" height="124.4444" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="453.3333" y="155.5556" text-anchor="middle" font-family="monospace" font-size="21.3333" font-weight="bold" fill="#212121">bytes 16–31</ns0:text>
  <ns0:text x="453.3333" y="182.2222" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">16 bytes</ns0:text>
  <ns0:rect x="586.6667" y="97.7778" width="248.8889" height="124.4444" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="711.1111" y="155.5556" text-anchor="middle" font-family="monospace" font-size="21.3333" font-weight="bold" fill="#212121">bytes 32–47</ns0:text>
  <ns0:text x="711.1111" y="182.2222" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">16 bytes</ns0:text>
  <ns0:rect x="844.4444" y="97.7778" width="248.8889" height="124.4444" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="968.8889" y="155.5556" text-anchor="middle" font-family="monospace" font-size="21.3333" font-weight="bold" fill="#212121">bytes 48–63</ns0:text>
  <ns0:text x="968.8889" y="182.2222" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">16 bytes</ns0:text>
  <ns0:line x1="71.1111" y1="240" x2="1093.3333" y2="240" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:line x1="71.1111" y1="234.6667" x2="71.1111" y2="245.3333" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:line x1="1093.3333" y1="234.6667" x2="1093.3333" y2="245.3333" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:text x="582.2222" y="271.1111" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#1565c0">One cache line fetch = 64 bytes from memory</ns0:text>
  <ns0:rect x="71.1111" y="311.1111" width="462.2222" height="106.6667" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="302.2222" y="341.3333" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#1565c0">Spatial Locality (good)</ns0:text>
  <ns0:text x="302.2222" y="368" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Access arr[0], arr[1] … in order</ns0:text>
  <ns0:text x="302.2222" y="391.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Whole line stays hot in cache</ns0:text>
  <ns0:text x="302.2222" y="408.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">One miss amortized over 64B</ns0:text>
  <ns0:rect x="604.4444" y="311.1111" width="462.2222" height="106.6667" rx="5.3333" fill="#fff3e0" stroke="#f57f17" stroke-width="1.3333" />
  <ns0:text x="835.5556" y="341.3333" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#e65100">False Sharing (bad)</ns0:text>
  <ns0:text x="835.5556" y="368" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Two cores write different fields</ns0:text>
  <ns0:text x="835.5556" y="391.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">in the same cache line</ns0:text>
  <ns0:text x="835.5556" y="408.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">Line bounces between cores → slow</ns0:text>
  <ns0:rect x="177.7778" y="453.3333" width="782.2222" height="46.2222" rx="5.3333" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="480" text-anchor="middle" font-family="monospace" font-size="16" fill="#212121">Align hot data to 64-byte boundaries: __attribute__((aligned(64)))</ns0:text>
  <ns0:text x="568.8889" y="496" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">Typical cache line size on ARM Cortex-M: 32 bytes; on Cortex-A: 64 bytes</ns0:text>
</ns0:svg>
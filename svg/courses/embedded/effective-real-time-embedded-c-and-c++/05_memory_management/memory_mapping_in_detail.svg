<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#212121">Program Memory Layout</text>
  <line x1="200" y1="66" x2="1080" y2="66" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- High address label -->
  <text x="200" y="100" font-family="monospace" font-size="16" fill="#9e9e9e">High address</text>

  <!-- Stack (top) -->
  <rect x="320" y="104" width="640" height="90" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="560" y="152" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Stack  ↓</text>
  <text x="920" y="152" text-anchor="middle" font-family="monospace" font-size="16" fill="#bbdefb">grows downward</text>

  <!-- Free space -->
  <rect x="320" y="200" width="640" height="110" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="640" y="263" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#9e9e9e">Free Space</text>

  <!-- Heap -->
  <rect x="320" y="316" width="640" height="90" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="364" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Heap  ↑</text>
  <text x="920" y="364" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">grows upward</text>

  <!-- BSS -->
  <rect x="320" y="412" width="640" height="90" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="460" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">.bss</text>
  <text x="920" y="460" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">zeroed globals</text>

  <!-- Data -->
  <rect x="320" y="508" width="640" height="90" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="556" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">.data</text>
  <text x="920" y="556" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">initialized globals</text>

  <!-- Text (bottom) -->
  <rect x="320" y="604" width="640" height="90" rx="4" fill="#212121" filter="url(#shadow)"/>
  <text x="560" y="652" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">.text</text>
  <text x="920" y="652" text-anchor="middle" font-family="monospace" font-size="16" fill="#9e9e9e">code (Flash / ROM)</text>

  <!-- Low address label -->
  <text x="200" y="706" font-family="monospace" font-size="16" fill="#9e9e9e">Low address (0x0)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="40" y="40" font-family="monospace" font-size="19.668917" fill="var(--text-faint)">High address</text>
  <rect x="229.473542" y="43.828357" width="1010.526458" height="86.138626" rx="8.487493" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="608.421132" y="89.768997" text-anchor="middle" font-family="sans-serif" font-size="31.96206" font-weight="bold" fill="var(--bg)">Stack  ↓</text>
  <text x="1176.842265" y="89.768997" text-anchor="middle" font-family="monospace" font-size="19.668917" fill="var(--primary-accent)">grows downward</text>
  <rect x="229.473542" y="135.709637" width="1010.526458" height="105.280529" rx="8.487493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="5.3333 2.6667" />
  <text x="734.73694" y="196.006675" text-anchor="middle" font-family="sans-serif" font-size="27.044831" fill="var(--text-faint)">Free Space</text>
  <rect x="229.473542" y="246.732701" width="1010.526458" height="86.138626" rx="8.487493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="608.421132" y="292.673223" text-anchor="middle" font-family="sans-serif" font-size="31.96206" font-weight="bold" fill="var(--text)">Heap  ↑</text>
  <text x="1176.842265" y="292.673223" text-anchor="middle" font-family="monospace" font-size="19.668917" fill="var(--text-muted)">grows upward</text>
  <rect x="229.473542" y="338.613863" width="1010.526458" height="86.138626" rx="8.487493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="608.421132" y="384.554502" text-anchor="middle" font-family="sans-serif" font-size="31.96206" font-weight="bold" fill="var(--text)">.bss</text>
  <text x="1176.842265" y="384.554502" text-anchor="middle" font-family="monospace" font-size="19.668917" fill="var(--text-muted)">zeroed globals</text>
  <rect x="229.473542" y="430.495024" width="1010.526458" height="86.138626" rx="8.487493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="608.421132" y="476.435664" text-anchor="middle" font-family="sans-serif" font-size="31.96206" font-weight="bold" fill="var(--text)">.data</text>
  <text x="1176.842265" y="476.435664" text-anchor="middle" font-family="monospace" font-size="19.668917" fill="var(--text-muted)">initialized globals</text>
  <rect x="229.473542" y="522.376303" width="1010.526458" height="86.138626" rx="8.487493" fill="var(--text)" />
  <text x="608.421132" y="568.316825" text-anchor="middle" font-family="sans-serif" font-size="31.96206" font-weight="bold" fill="var(--bg)">.text</text>
  <text x="1176.842265" y="568.316825" text-anchor="middle" font-family="monospace" font-size="19.668917" fill="var(--text-faint)">code (Flash / ROM)</text>
  <text x="40" y="620" font-family="monospace" font-size="19.668917" fill="var(--text-faint)">Low address (0x0)</text>
</svg>
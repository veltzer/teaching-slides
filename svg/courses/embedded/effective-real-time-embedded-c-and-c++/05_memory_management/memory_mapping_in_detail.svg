<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="19.668917" fill="var(--text-faint)" font-family="Courier New, monospace">High address</text>
  <rect x="229.473542" y="43.828357" width="1010.526458" height="86.138626" rx="8.487493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="608.421132" y="89.768997" text-anchor="middle" font-size="31.96206" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Stack  ↓</text>
  <text x="1176.842265" y="89.768997" text-anchor="middle" font-size="19.668917" fill="var(--primary-accent)" font-family="Courier New, monospace">grows downward</text>
  <rect x="229.473542" y="135.709637" width="1010.526458" height="105.280529" rx="8.487493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="5.3333 2.6667"/>
  <text x="734.73694" y="196.006675" text-anchor="middle" font-size="27.044831" fill="var(--text-faint)" font-family="Arial, sans-serif">Free Space</text>
  <rect x="229.473542" y="246.732701" width="1010.526458" height="86.138626" rx="8.487493" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="608.421132" y="292.673223" text-anchor="middle" font-size="31.96206" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Heap  ↑</text>
  <text x="1176.842265" y="292.673223" text-anchor="middle" font-size="19.668917" fill="var(--text-muted)" font-family="Courier New, monospace">grows upward</text>
  <rect x="229.473542" y="338.613863" width="1010.526458" height="86.138626" rx="8.487493" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="608.421132" y="384.554502" text-anchor="middle" font-size="31.96206" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">.bss</text>
  <text x="1176.842265" y="384.554502" text-anchor="middle" font-size="19.668917" fill="var(--text-muted)" font-family="Courier New, monospace">zeroed globals</text>
  <rect x="229.473542" y="430.495024" width="1010.526458" height="86.138626" rx="8.487493" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="608.421132" y="476.435664" text-anchor="middle" font-size="31.96206" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">.data</text>
  <text x="1176.842265" y="476.435664" text-anchor="middle" font-size="19.668917" fill="var(--text-muted)" font-family="Courier New, monospace">initialized globals</text>
  <rect x="229.473542" y="522.376303" width="1010.526458" height="86.138626" rx="8.487493" fill="var(--text)"/>
  <text x="608.421132" y="568.316825" text-anchor="middle" font-size="31.96206" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">.text</text>
  <text x="1176.842265" y="568.316825" text-anchor="middle" font-size="19.668917" fill="var(--text-faint)" font-family="Courier New, monospace">code (Flash / ROM)</text>
  <text x="40" y="620" font-size="19.668917" fill="var(--text-faint)" font-family="Courier New, monospace">Low address (0x0)</text>
</svg>

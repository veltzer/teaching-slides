<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="71.1111" y="35.5556" width="444.4444" height="124.4444" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="293.3333" y="81.7778" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#ffffff">Type Safety</ns0:text>
  <ns0:text x="293.3333" y="108.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">Strong typing catches errors at compile time</ns0:text>
  <ns0:text x="293.3333" y="129.7778" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#90caf9">no implicit void* casts</ns0:text>
  <ns0:text x="293.3333" y="149.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#90caf9">enum class, constexpr</ns0:text>
  <ns0:rect x="622.2222" y="35.5556" width="444.4444" height="124.4444" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="844.4444" y="81.7778" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">Abstraction</ns0:text>
  <ns0:text x="844.4444" y="108.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Classes, namespaces, operator overload</ns0:text>
  <ns0:text x="844.4444" y="129.7778" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">GPIO::Pin led(GPIOC, 13);</ns0:text>
  <ns0:text x="844.4444" y="149.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">led.toggle();</ns0:text>
  <ns0:rect x="71.1111" y="182.2222" width="444.4444" height="124.4444" rx="7.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="293.3333" y="228.4444" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">RAII</ns0:text>
  <ns0:text x="293.3333" y="255.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Resources released automatically</ns0:text>
  <ns0:text x="293.3333" y="276.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">MutexGuard lock(m); // auto-releases</ns0:text>
  <ns0:text x="293.3333" y="296" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">no manual unlock needed</ns0:text>
  <ns0:rect x="622.2222" y="182.2222" width="444.4444" height="124.4444" rx="7.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="844.4444" y="228.4444" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">Templates</ns0:text>
  <ns0:text x="844.4444" y="255.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Generic code, resolved at compile time</ns0:text>
  <ns0:text x="844.4444" y="276.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">RingBuffer&lt;uint8_t, 64&gt; buf;</ns0:text>
  <ns0:text x="844.4444" y="296" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">zero runtime overhead</ns0:text>
  <ns0:rect x="346.6667" y="328.8889" width="444.4444" height="124.4444" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#ffffff">Const Correctness</ns0:text>
  <ns0:text x="568.8889" y="401.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">const and constexpr prevent unintended writes</ns0:text>
  <ns0:text x="568.8889" y="423.1111" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#90caf9">constexpr uint32_t CLK = 168'000'000;</ns0:text>
  <ns0:text x="568.8889" y="442.6667" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#90caf9">evaluated at compile time, zero RAM</ns0:text>
  <ns0:rect x="177.7778" y="487.1111" width="782.2222" height="42.6667" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="513.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#1565c0">Use C++ features that have zero or near-zero overhead: constexpr, templates, RAII, inline</ns0:text>
  <ns0:text x="568.8889" y="531.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Avoid: exceptions, RTTI, dynamic_cast, virtual in hot paths — these add size/overhead</ns0:text>
</ns0:svg>
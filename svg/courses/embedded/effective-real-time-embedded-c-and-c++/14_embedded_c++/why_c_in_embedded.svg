<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="535.714222" height="145.519613" rx="7.286121" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="307.857168" y="94.050065" text-anchor="middle" font-family="sans-serif" font-size="27.437954" font-weight="bold" fill="var(--bg)">Type Safety</text>
  <text x="307.857168" y="125.232774" text-anchor="middle" font-family="sans-serif" font-size="17.940252" fill="var(--primary-accent)">Strong typing catches errors at compile time</text>
  <text x="307.857168" y="150.179097" text-anchor="middle" font-family="monospace" font-size="15.829584" fill="var(--primary-accent)">no implicit void* casts</text>
  <text x="307.857168" y="173.046452" text-anchor="middle" font-family="monospace" font-size="15.829584" fill="var(--primary-accent)">enum class, constexpr</text>
  <rect x="704.285778" y="40" width="535.714222" height="145.519613" rx="7.286121" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="972.142832" y="94.050065" text-anchor="middle" font-family="sans-serif" font-size="27.437954" font-weight="bold" fill="var(--text)">Abstraction</text>
  <text x="972.142832" y="125.232774" text-anchor="middle" font-family="sans-serif" font-size="17.940252" fill="var(--text-muted)">Classes, namespaces, operator overload</text>
  <text x="972.142832" y="150.179097" text-anchor="middle" font-family="monospace" font-size="15.829584" fill="var(--text-faint)">GPIO::Pin led(GPIOC, 13);</text>
  <text x="972.142832" y="173.046452" text-anchor="middle" font-family="monospace" font-size="15.829584" fill="var(--text-faint)">led.toggle();</text>
  <rect x="40" y="211.50529" width="535.714222" height="145.519613" rx="7.286121" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="307.857168" y="265.555355" text-anchor="middle" font-family="sans-serif" font-size="27.437954" font-weight="bold" fill="var(--text)">RAII</text>
  <text x="307.857168" y="296.738194" text-anchor="middle" font-family="sans-serif" font-size="17.940252" fill="var(--text-muted)">Resources released automatically</text>
  <text x="307.857168" y="321.684387" text-anchor="middle" font-family="monospace" font-size="15.829584" fill="var(--text-faint)">MutexGuard lock(m); // auto-releases</text>
  <text x="307.857168" y="344.551871" text-anchor="middle" font-family="monospace" font-size="15.829584" fill="var(--text-faint)">no manual unlock needed</text>
  <rect x="704.285778" y="211.50529" width="535.714222" height="145.519613" rx="7.286121" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="972.142832" y="265.555355" text-anchor="middle" font-family="sans-serif" font-size="27.437954" font-weight="bold" fill="var(--text)">Templates</text>
  <text x="972.142832" y="296.738194" text-anchor="middle" font-family="sans-serif" font-size="17.940252" fill="var(--text-muted)">Generic code, resolved at compile time</text>
  <text x="972.142832" y="321.684387" text-anchor="middle" font-family="monospace" font-size="15.829584" fill="var(--text-faint)">RingBuffer&lt;uint8_t, 64&gt; buf;</text>
  <text x="972.142832" y="344.551871" text-anchor="middle" font-family="monospace" font-size="15.829584" fill="var(--text-faint)">zero runtime overhead</text>
  <rect x="372.142889" y="383.01071" width="535.714222" height="145.519613" rx="7.286121" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640.000057" y="437.060774" text-anchor="middle" font-family="sans-serif" font-size="27.437954" font-weight="bold" fill="var(--bg)">Const Correctness</text>
  <text x="640.000057" y="468.243613" text-anchor="middle" font-family="sans-serif" font-size="17.940252" fill="var(--primary-accent)">const and constexpr prevent unintended writes</text>
  <text x="640.000057" y="493.189806" text-anchor="middle" font-family="monospace" font-size="15.829584" fill="var(--primary-accent)">constexpr uint32_t CLK = 168'000'000;</text>
  <text x="640.000057" y="516.05729" text-anchor="middle" font-family="monospace" font-size="15.829584" fill="var(--primary-accent)">evaluated at compile time, zero RAM</text>
  <rect x="168.571441" y="568.028516" width="942.857233" height="49.892516" rx="7.286121" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000057" y="599.211355" text-anchor="middle" font-family="sans-serif" font-size="17.940252" fill="var(--primary-accent)">Use C++ features that have zero or near-zero overhead: constexpr, templates, RAII, inline</text>
  <text x="640.000057" y="620" text-anchor="middle" font-family="sans-serif" font-size="15.829584" fill="var(--text-muted)">Avoid: exceptions, RTTI, dynamic_cast, virtual in hot paths — these add size/overhead</text>
</svg>
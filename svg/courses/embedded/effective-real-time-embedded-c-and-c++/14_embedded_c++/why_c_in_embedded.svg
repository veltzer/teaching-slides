<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- 5 benefit boxes -->
  <rect x="80"  y="40" width="500" height="140" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="330" y="92" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Type Safety</text>
  <text x="330" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">Strong typing catches errors at compile time</text>
  <text x="330" y="146" text-anchor="middle" font-family="monospace" font-size="15" fill="#90caf9">no implicit void* casts</text>
  <text x="330" y="168" text-anchor="middle" font-family="monospace" font-size="15" fill="#90caf9">enum class, constexpr</text>

  <rect x="700" y="40" width="500" height="140" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="950" y="92" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Abstraction</text>
  <text x="950" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Classes, namespaces, operator overload</text>
  <text x="950" y="146" text-anchor="middle" font-family="monospace" font-size="15" fill="#9e9e9e">GPIO::Pin led(GPIOC, 13);</text>
  <text x="950" y="168" text-anchor="middle" font-family="monospace" font-size="15" fill="#9e9e9e">led.toggle();</text>

  <rect x="80"  y="205" width="500" height="140" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="257" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">RAII</text>
  <text x="330" y="287" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Resources released automatically</text>
  <text x="330" y="311" text-anchor="middle" font-family="monospace" font-size="15" fill="#9e9e9e">MutexGuard lock(m); // auto-releases</text>
  <text x="330" y="333" text-anchor="middle" font-family="monospace" font-size="15" fill="#9e9e9e">no manual unlock needed</text>

  <rect x="700" y="205" width="500" height="140" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="950" y="257" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Templates</text>
  <text x="950" y="287" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Generic code, resolved at compile time</text>
  <text x="950" y="311" text-anchor="middle" font-family="monospace" font-size="15" fill="#9e9e9e">RingBuffer&lt;uint8_t, 64&gt; buf;</text>
  <text x="950" y="333" text-anchor="middle" font-family="monospace" font-size="15" fill="#9e9e9e">zero runtime overhead</text>

  <rect x="390" y="370" width="500" height="140" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="422" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Const Correctness</text>
  <text x="640" y="452" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">const and constexpr prevent unintended writes</text>
  <text x="640" y="476" text-anchor="middle" font-family="monospace" font-size="15" fill="#90caf9">constexpr uint32_t CLK = 168'000'000;</text>
  <text x="640" y="498" text-anchor="middle" font-family="monospace" font-size="15" fill="#90caf9">evaluated at compile time, zero RAM</text>

  <!-- Footer -->
  <rect x="200" y="548" width="880" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="578" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1565c0">Use C++ features that have zero or near-zero overhead: constexpr, templates, RAII, inline</text>
  <text x="640" y="598" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Avoid: exceptions, RTTI, dynamic_cast, virtual in hot paths — these add size/overhead</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="535.714222" height="145.519613" rx="7.286121" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.857168" y="94.050065" text-anchor="middle" font-size="27.437954" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Type Safety</text>
  <text x="307.857168" y="125.232774" text-anchor="middle" font-size="17.940252" fill="var(--primary-accent)" font-family="Arial, sans-serif">Strong typing catches errors at compile time</text>
  <text x="307.857168" y="150.179097" text-anchor="middle" font-size="15.829584" fill="var(--primary-accent)" font-family="Courier New, monospace">no implicit void* casts</text>
  <text x="307.857168" y="173.046452" text-anchor="middle" font-size="15.829584" fill="var(--primary-accent)" font-family="Courier New, monospace">enum class, constexpr</text>
  <rect x="704.285778" y="40" width="535.714222" height="145.519613" rx="7.286121" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="972.142832" y="94.050065" text-anchor="middle" font-size="27.437954" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Abstraction</text>
  <text x="972.142832" y="125.232774" text-anchor="middle" font-size="17.940252" fill="var(--text-muted)" font-family="Arial, sans-serif">Classes, namespaces, operator overload</text>
  <text x="972.142832" y="150.179097" text-anchor="middle" font-size="15.829584" fill="var(--text-faint)" font-family="Courier New, monospace">GPIO::Pin led(GPIOC, 13);</text>
  <text x="972.142832" y="173.046452" text-anchor="middle" font-size="15.829584" fill="var(--text-faint)" font-family="Courier New, monospace">led.toggle();</text>
  <rect x="40" y="211.50529" width="535.714222" height="145.519613" rx="7.286121" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="307.857168" y="265.555355" text-anchor="middle" font-size="27.437954" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RAII</text>
  <text x="307.857168" y="296.738194" text-anchor="middle" font-size="17.940252" fill="var(--text-muted)" font-family="Arial, sans-serif">Resources released automatically</text>
  <text x="307.857168" y="321.684387" text-anchor="middle" font-size="15.829584" fill="var(--text-faint)" font-family="Courier New, monospace">MutexGuard lock(m); // auto-releases</text>
  <text x="307.857168" y="344.551871" text-anchor="middle" font-size="15.829584" fill="var(--text-faint)" font-family="Courier New, monospace">no manual unlock needed</text>
  <rect x="704.285778" y="211.50529" width="535.714222" height="145.519613" rx="7.286121" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="972.142832" y="265.555355" text-anchor="middle" font-size="27.437954" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Templates</text>
  <text x="972.142832" y="296.738194" text-anchor="middle" font-size="17.940252" fill="var(--text-muted)" font-family="Arial, sans-serif">Generic code, resolved at compile time</text>
  <text x="972.142832" y="321.684387" text-anchor="middle" font-size="15.829584" fill="var(--text-faint)" font-family="Courier New, monospace">RingBuffer&lt;uint8_t, 64&gt; buf;</text>
  <text x="972.142832" y="344.551871" text-anchor="middle" font-size="15.829584" fill="var(--text-faint)" font-family="Courier New, monospace">zero runtime overhead</text>
  <rect x="372.142889" y="383.01071" width="535.714222" height="145.519613" rx="7.286121" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000057" y="437.060774" text-anchor="middle" font-size="27.437954" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Const Correctness</text>
  <text x="640.000057" y="468.243613" text-anchor="middle" font-size="17.940252" fill="var(--primary-accent)" font-family="Arial, sans-serif">const and constexpr prevent unintended writes</text>
  <text x="640.000057" y="493.189806" text-anchor="middle" font-size="15.829584" fill="var(--primary-accent)" font-family="Courier New, monospace">constexpr uint32_t CLK = 168'000'000;</text>
  <text x="640.000057" y="516.05729" text-anchor="middle" font-size="15.829584" fill="var(--primary-accent)" font-family="Courier New, monospace">evaluated at compile time, zero RAM</text>
  <rect x="168.571441" y="568.028516" width="942.857233" height="49.892516" rx="7.286121" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000057" y="599.211355" text-anchor="middle" font-size="17.940252" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use C++ features that have zero or near-zero overhead: constexpr, templates, RAII, inline</text>
  <text x="640.000057" y="620" text-anchor="middle" font-size="15.829584" fill="var(--text-muted)" font-family="Arial, sans-serif">Avoid: exceptions, RTTI, dynamic_cast, virtual in hot paths — these add size/overhead</text>
</svg>

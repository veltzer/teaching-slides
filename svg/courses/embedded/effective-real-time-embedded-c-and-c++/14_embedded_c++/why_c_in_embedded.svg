<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="35.5556" width="444.4444" height="124.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="293.3333" y="81.7778" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--bg)">Type Safety</text>
  <text x="293.3333" y="108.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">Strong typing catches errors at compile time</text>
  <text x="293.3333" y="129.7778" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">no implicit void* casts</text>
  <text x="293.3333" y="149.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">enum class, constexpr</text>
  <rect x="622.2222" y="35.5556" width="444.4444" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="844.4444" y="81.7778" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">Abstraction</text>
  <text x="844.4444" y="108.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Classes, namespaces, operator overload</text>
  <text x="844.4444" y="129.7778" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">GPIO::Pin led(GPIOC, 13);</text>
  <text x="844.4444" y="149.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">led.toggle();</text>
  <rect x="71.1111" y="182.2222" width="444.4444" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="293.3333" y="228.4444" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">RAII</text>
  <text x="293.3333" y="255.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Resources released automatically</text>
  <text x="293.3333" y="276.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">MutexGuard lock(m); // auto-releases</text>
  <text x="293.3333" y="296" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">no manual unlock needed</text>
  <rect x="622.2222" y="182.2222" width="444.4444" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="844.4444" y="228.4444" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--text)">Templates</text>
  <text x="844.4444" y="255.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">Generic code, resolved at compile time</text>
  <text x="844.4444" y="276.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">RingBuffer&lt;uint8_t, 64&gt; buf;</text>
  <text x="844.4444" y="296" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">zero runtime overhead</text>
  <rect x="346.6667" y="328.8889" width="444.4444" height="124.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="var(--bg)">Const Correctness</text>
  <text x="568.8889" y="401.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">const and constexpr prevent unintended writes</text>
  <text x="568.8889" y="423.1111" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">constexpr uint32_t CLK = 168'000'000;</text>
  <text x="568.8889" y="442.6667" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">evaluated at compile time, zero RAM</text>
  <rect x="177.7778" y="487.1111" width="782.2222" height="42.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="513.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">Use C++ features that have zero or near-zero overhead: constexpr, templates, RAII, inline</text>
  <text x="568.8889" y="531.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Avoid: exceptions, RTTI, dynamic_cast, virtual in hot paths — these add size/overhead</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="501.538462" y="40" width="307.692308" height="64.868339" rx="6.829325" fill="var(--text)" />
  <text x="655.384615" y="80.065756" text-anchor="middle" font-size="21.76119" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">ios_base</text>
  <line x1="655.384615" y1="106.776221" x2="655.384615" y2="141.118332" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="501.538462" y="143.026332" width="307.692308" height="64.868339" rx="6.829325" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655.384615" y="183.092089" text-anchor="middle" font-size="21.76119" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">ios&lt;char&gt;</text>
  <line x1="593.846154" y1="209.802553" x2="347.692308" y2="267.039365" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="163.076923" y="268.947365" width="266.666667" height="64.868339" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="296.410256" y="309.01324" text-anchor="middle" font-size="21.76119" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">istream</text>
  <line x1="716.923077" y1="209.802553" x2="963.076923" y2="267.039365" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="881.025532" y="268.947365" width="266.666667" height="64.868339" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1014.358974" y="309.01324" text-anchor="middle" font-size="21.76119" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">ostream</text>
  <line x1="234.871685" y1="335.723586" x2="132.307692" y2="392.960517" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="40" y="394.868517" width="174.358974" height="57.236812" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="127.179487" y="428.256627" text-anchor="middle" font-size="15.826278" fill="var(--text-muted)" font-family="Courier New, monospace">ifstream</text>
  <line x1="296.410256" y1="335.723586" x2="296.410256" y2="392.960517" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="204.102564" y="394.868517" width="184.615385" height="57.236812" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="296.410256" y="428.256627" text-anchor="middle" font-size="15.826278" fill="var(--text-muted)" font-family="Courier New, monospace">istringstream</text>
  <line x1="357.948718" y1="335.723586" x2="440" y2="392.960517" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="388.717949" y="394.868517" width="102.564103" height="57.236812" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="440" y="428.256627" text-anchor="middle" font-size="15.826278" fill="var(--primary-accent)" font-family="Courier New, monospace">cin</text>
  <line x1="952.820513" y1="335.723586" x2="829.74359" y2="392.960517" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="737.435897" y="394.868517" width="174.358974" height="57.236812" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="824.615385" y="428.256627" text-anchor="middle" font-size="15.826278" fill="var(--text-muted)" font-family="Courier New, monospace">ofstream</text>
  <line x1="1014.358974" y1="335.723586" x2="1014.358974" y2="392.960517" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="922.051282" y="394.868517" width="184.615385" height="57.236812" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1014.358974" y="428.256627" text-anchor="middle" font-size="15.826278" fill="var(--text-muted)" font-family="Courier New, monospace">ostringstream</text>
  <line x1="1075.897326" y1="335.723586" x2="1157.948609" y2="392.960517" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="1106.666667" y="394.868517" width="133.333333" height="57.236812" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1173.333333" y="428.256627" text-anchor="middle" font-size="15.826278" fill="var(--primary-accent)" font-family="Courier New, monospace">cout</text>
  <line x1="593.846154" y1="209.802553" x2="655.384615" y2="494.078967" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <line x1="716.923077" y1="209.802553" x2="655.384615" y2="494.078967" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <rect x="501.538462" y="495.986849" width="307.692308" height="64.868339" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="655.384615" y="533.190723" text-anchor="middle" font-size="21.76119" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">iostream</text>
  <text x="655.384615" y="553.22366" text-anchor="middle" font-size="13.847937" fill="var(--text-muted)" font-family="Arial, sans-serif">both input and output</text>
  <text x="655.384615" y="620" text-anchor="middle" font-size="15.826278" fill="var(--text-faint)" font-family="Arial, sans-serif">All classes templated on char type — wchar_t variants exist (wistream, wostream, …)</text>
</svg>
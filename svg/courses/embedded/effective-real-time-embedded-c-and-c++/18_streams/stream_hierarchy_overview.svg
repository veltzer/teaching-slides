<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="435.5556" y="8.8889" width="266.6667" height="60.4444" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="568.8889" y="46.2222" text-anchor="middle" font-family="monospace" font-size="19.5556" font-weight="bold" fill="var(--bg)">ios_base</text>
  <line x1="568.8889" y1="71.1111" x2="568.8889" y2="103.1111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="435.5556" y="104.8889" width="266.6667" height="60.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="142.2222" text-anchor="middle" font-family="monospace" font-size="19.5556" font-weight="bold" fill="var(--bg)">ios&lt;char&gt;</text>
  <line x1="515.5556" y1="167.1111" x2="302.2222" y2="220.4444" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="142.2222" y="222.2222" width="231.1111" height="60.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="257.7778" y="259.5556" text-anchor="middle" font-family="monospace" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">istream</text>
  <line x1="622.2222" y1="167.1111" x2="835.5556" y2="220.4444" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="764.4444" y="222.2222" width="231.1111" height="60.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="880" y="259.5556" text-anchor="middle" font-family="monospace" font-size="19.5556" font-weight="bold" fill="var(--text)">ostream</text>
  <line x1="204.4444" y1="284.4444" x2="115.5556" y2="337.7778" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="35.5556" y="339.5556" width="151.1111" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="111.1111" y="370.6667" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">ifstream</text>
  <line x1="257.7778" y1="284.4444" x2="257.7778" y2="337.7778" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="177.7778" y="339.5556" width="160" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="257.7778" y="370.6667" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">istringstream</text>
  <line x1="311.1111" y1="284.4444" x2="382.2222" y2="337.7778" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="337.7778" y="339.5556" width="88.8889" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="382.2222" y="370.6667" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">cin</text>
  <line x1="826.6667" y1="284.4444" x2="720" y2="337.7778" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="640" y="339.5556" width="151.1111" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="715.5556" y="370.6667" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">ofstream</text>
  <line x1="880" y1="284.4444" x2="880" y2="337.7778" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="800" y="339.5556" width="160" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="880" y="370.6667" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">ostringstream</text>
  <line x1="933.3333" y1="284.4444" x2="1004.4444" y2="337.7778" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="960" y="339.5556" width="115.5556" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1017.7778" y="370.6667" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">cout</text>
  <line x1="515.5556" y1="167.1111" x2="568.8889" y2="432" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <line x1="622.2222" y1="167.1111" x2="568.8889" y2="432" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <rect x="435.5556" y="433.7778" width="266.6667" height="60.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="468.4444" text-anchor="middle" font-family="monospace" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">iostream</text>
  <text x="568.8889" y="487.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">both input and output</text>
  <text x="568.8889" y="549.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-faint)">All classes templated on char type — wchar_t variants exist (wistream, wostream, …)</text>
</svg>
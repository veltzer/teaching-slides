<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </marker>
  </defs>
  <rect x="501.538462" y="40" width="307.692308" height="64.868339" rx="6.829325" fill="var(--text)" filter="url(#shadow)" />
  <text x="655.384615" y="80.065756" text-anchor="middle" font-family="monospace" font-size="21.76119" font-weight="bold" fill="var(--bg)">ios_base</text>
  <line x1="655.384615" y1="106.776221" x2="655.384615" y2="141.118332" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="501.538462" y="143.026332" width="307.692308" height="64.868339" rx="6.829325" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="655.384615" y="183.092089" text-anchor="middle" font-family="monospace" font-size="21.76119" font-weight="bold" fill="var(--bg)">ios&lt;char&gt;</text>
  <line x1="593.846154" y1="209.802553" x2="347.692308" y2="267.039365" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="163.076923" y="268.947365" width="266.666667" height="64.868339" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="296.410256" y="309.01324" text-anchor="middle" font-family="monospace" font-size="21.76119" font-weight="bold" fill="var(--primary-accent)">istream</text>
  <line x1="716.923077" y1="209.802553" x2="963.076923" y2="267.039365" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="881.025532" y="268.947365" width="266.666667" height="64.868339" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1014.358974" y="309.01324" text-anchor="middle" font-family="monospace" font-size="21.76119" font-weight="bold" fill="var(--text)">ostream</text>
  <line x1="234.871685" y1="335.723586" x2="132.307692" y2="392.960517" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="40" y="394.868517" width="174.358974" height="57.236812" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="127.179487" y="428.256627" text-anchor="middle" font-family="monospace" font-size="15.826278" fill="var(--text-muted)">ifstream</text>
  <line x1="296.410256" y1="335.723586" x2="296.410256" y2="392.960517" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="204.102564" y="394.868517" width="184.615385" height="57.236812" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="296.410256" y="428.256627" text-anchor="middle" font-family="monospace" font-size="15.826278" fill="var(--text-muted)">istringstream</text>
  <line x1="357.948718" y1="335.723586" x2="440" y2="392.960517" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="388.717949" y="394.868517" width="102.564103" height="57.236812" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="440" y="428.256627" text-anchor="middle" font-family="monospace" font-size="15.826278" fill="var(--primary-accent)">cin</text>
  <line x1="952.820513" y1="335.723586" x2="829.74359" y2="392.960517" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="737.435897" y="394.868517" width="174.358974" height="57.236812" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="824.615385" y="428.256627" text-anchor="middle" font-family="monospace" font-size="15.826278" fill="var(--text-muted)">ofstream</text>
  <line x1="1014.358974" y1="335.723586" x2="1014.358974" y2="392.960517" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="922.051282" y="394.868517" width="184.615385" height="57.236812" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1014.358974" y="428.256627" text-anchor="middle" font-family="monospace" font-size="15.826278" fill="var(--text-muted)">ostringstream</text>
  <line x1="1075.897326" y1="335.723586" x2="1157.948609" y2="392.960517" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="1106.666667" y="394.868517" width="133.333333" height="57.236812" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1173.333333" y="428.256627" text-anchor="middle" font-family="monospace" font-size="15.826278" fill="var(--primary-accent)">cout</text>
  <line x1="593.846154" y1="209.802553" x2="655.384615" y2="494.078967" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <line x1="716.923077" y1="209.802553" x2="655.384615" y2="494.078967" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <rect x="501.538462" y="495.986849" width="307.692308" height="64.868339" rx="6.829325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="655.384615" y="533.190723" text-anchor="middle" font-family="monospace" font-size="21.76119" font-weight="bold" fill="var(--primary-accent)">iostream</text>
  <text x="655.384615" y="553.22366" text-anchor="middle" font-family="sans-serif" font-size="13.847937" fill="var(--text-muted)">both input and output</text>
  <text x="655.384615" y="620" text-anchor="middle" font-family="sans-serif" font-size="15.826278" fill="var(--text-faint)">All classes templated on char type — wchar_t variants exist (wistream, wostream, …)</text>
</svg>
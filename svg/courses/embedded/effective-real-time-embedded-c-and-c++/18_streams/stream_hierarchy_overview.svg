<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="inherit" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto">
      <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#212121">Stream Class Hierarchy</text>
  <line x1="200" y1="66" x2="1080" y2="66" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ios_base -->
  <rect x="490" y="80" width="300" height="68" rx="6" fill="#212121" filter="url(#shadow)"/>
  <text x="640" y="122" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">ios_base</text>

  <line x1="640" y1="150" x2="640" y2="186" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>

  <!-- ios -->
  <rect x="490" y="188" width="300" height="68" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="230" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">ios&lt;char&gt;</text>

  <!-- istream branch -->
  <line x1="580" y1="258" x2="340" y2="318" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>
  <rect x="160" y="320" width="260" height="68" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="362" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#1565c0">istream</text>

  <!-- ostream branch -->
  <line x1="700" y1="258" x2="940" y2="318" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>
  <rect x="860" y="320" width="260" height="68" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="990" y="362" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#212121">ostream</text>

  <!-- istream children -->
  <line x1="230" y1="390" x2="130" y2="450" stroke="#555555" stroke-width="1.5" marker-end="url(#inherit)"/>
  <rect x="40"  y="452" width="170" height="60" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="487" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">ifstream</text>

  <line x1="290" y1="390" x2="290" y2="450" stroke="#555555" stroke-width="1.5" marker-end="url(#inherit)"/>
  <rect x="200" y="452" width="180" height="60" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="487" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">istringstream</text>

  <line x1="350" y1="390" x2="430" y2="450" stroke="#555555" stroke-width="1.5" marker-end="url(#inherit)"/>
  <rect x="380" y="452" width="100" height="60" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="487" text-anchor="middle" font-family="monospace" font-size="16" fill="#1565c0">cin</text>

  <!-- ostream children -->
  <line x1="930" y1="390" x2="810" y2="450" stroke="#555555" stroke-width="1.5" marker-end="url(#inherit)"/>
  <rect x="720" y="452" width="170" height="60" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="805" y="487" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">ofstream</text>

  <line x1="990" y1="390" x2="990" y2="450" stroke="#555555" stroke-width="1.5" marker-end="url(#inherit)"/>
  <rect x="900" y="452" width="180" height="60" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="990" y="487" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">ostringstream</text>

  <line x1="1050" y1="390" x2="1130" y2="450" stroke="#555555" stroke-width="1.5" marker-end="url(#inherit)"/>
  <rect x="1080" y="452" width="130" height="60" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1145" y="487" text-anchor="middle" font-family="monospace" font-size="16" fill="#1565c0">cout</text>

  <!-- iostream (both) -->
  <line x1="580" y1="258" x2="640" y2="556" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="700" y1="258" x2="640" y2="556" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="490" y="558" width="300" height="68" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="597" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#1565c0">iostream</text>
  <text x="640" y="618" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">both input and output</text>

  <!-- Note -->
  <text x="640" y="688" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9e9e9e">All classes templated on char type — wchar_t variants exist (wistream, wostream, …)</text>
</svg>

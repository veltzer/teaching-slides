<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="499.375" y="48.0556" width="281.25" height="54.7777" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="640" y="81.8889" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--bg)">ios_base</text>
  <line x1="640" y1="104.4444" x2="640" y2="133.4444" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="499.375" y="135.0556" width="281.25" height="54.7777" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="168.8889" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--bg)">ios&lt;char&gt;</text>
  <line x1="583.75" y1="191.4444" x2="358.75" y2="239.7777" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="190" y="241.3889" width="243.75" height="54.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="311.875" y="275.2223" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">istream</text>
  <line x1="696.25" y1="191.4444" x2="921.25" y2="239.7777" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="846.2499" y="241.3889" width="243.75" height="54.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="968.125" y="275.2223" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--text)">ostream</text>
  <line x1="255.6249" y1="297.7777" x2="161.875" y2="346.1111" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="77.5" y="347.7223" width="159.375" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="157.1875" y="375.9167" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">ifstream</text>
  <line x1="311.875" y1="297.7777" x2="311.875" y2="346.1111" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="227.5" y="347.7223" width="168.75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="311.875" y="375.9167" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">istringstream</text>
  <line x1="368.125" y1="297.7777" x2="443.125" y2="346.1111" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="396.25" y="347.7223" width="93.75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="443.125" y="375.9167" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">cin</text>
  <line x1="911.875" y1="297.7777" x2="799.375" y2="346.1111" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="715" y="347.7223" width="159.375" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="794.6875" y="375.9167" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">ofstream</text>
  <line x1="968.125" y1="297.7777" x2="968.125" y2="346.1111" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="883.75" y="347.7223" width="168.75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="968.125" y="375.9167" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">ostringstream</text>
  <line x1="1024.3749" y1="297.7777" x2="1099.3749" y2="346.1111" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="1052.5" y="347.7223" width="121.875" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1113.4375" y="375.9167" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">cout</text>
  <line x1="583.75" y1="191.4444" x2="640" y2="431.5" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <line x1="696.25" y1="191.4444" x2="640" y2="431.5" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <rect x="499.375" y="433.1111" width="281.25" height="54.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="464.5277" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">iostream</text>
  <text x="640" y="481.4444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">both input and output</text>
  <text x="640" y="537.8333" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-faint)">All classes templated on char type — wchar_t variants exist (wistream, wostream, …)</text>
</svg>
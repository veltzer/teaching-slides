<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="193.0556" width="262.5" height="161.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="246.25" y="249.4444" text-anchor="middle" font-family="sans-serif" font-size="20.8566" font-weight="bold" fill="var(--text)">Source</text>
  <text x="246.25" y="275.2223" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">file</text>
  <text x="246.25" y="296.1667" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">string</text>
  <text x="246.25" y="317.1111" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">network socket</text>
  <text x="246.25" y="338.0556" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">serial port</text>
  <rect x="490" y="160.8333" width="299.9999" height="225.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="225.2777" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--bg)">Stream</text>
  <text x="640" y="252.6667" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--primary-accent)">uniform interface</text>
  <text x="640" y="276.8333" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">&lt;&lt;  /  &gt;&gt;</text>
  <text x="640" y="304.2223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">formatting</text>
  <text x="640" y="325.1667" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">buffering</text>
  <text x="640" y="346.1111" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">error state</text>
  <text x="640" y="370.2777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">locale / encoding</text>
  <rect x="902.5" y="193.0556" width="262.5" height="161.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1033.75" y="249.4444" text-anchor="middle" font-family="sans-serif" font-size="20.8566" font-weight="bold" fill="var(--text)">Destination</text>
  <text x="1033.75" y="275.2223" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">file</text>
  <text x="1033.75" y="296.1667" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">string</text>
  <text x="1033.75" y="317.1111" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">console</text>
  <text x="1033.75" y="338.0556" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">serial port</text>
  <line x1="379.375" y1="273.6111" x2="488.125" y2="273.6111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="791.875" y1="273.6111" x2="900.625" y2="273.6111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="227.5" y="433.1111" width="825" height="64.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="458.8889" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">Uniform interface regardless of source/destination</text>
  <text x="640" y="479.8333" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-muted)">Same code writes to file, string, or serial — just swap the stream object</text>
  <text x="640" y="495.9444" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-faint)">void print(std::ostream&amp; os) { os &lt;&lt; "value=" &lt;&lt; x; }</text>
</svg>
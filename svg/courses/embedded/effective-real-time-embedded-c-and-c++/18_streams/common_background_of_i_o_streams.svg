<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="95.50253" width="300" height="277.51196" rx="8.418319" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="190" y="192.63157" text-anchor="middle" font-size="29.262916" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Source</text>
  <text x="190" y="237.033697" text-anchor="middle" font-size="19.508611" fill="var(--text-muted)" font-family="Courier New, monospace">file</text>
  <text x="190" y="273.110178" text-anchor="middle" font-size="19.508611" fill="var(--text-muted)" font-family="Courier New, monospace">string</text>
  <text x="190" y="309.186659" text-anchor="middle" font-size="19.508611" fill="var(--text-muted)" font-family="Courier New, monospace">network socket</text>
  <text x="190" y="345.263312" text-anchor="middle" font-size="19.508611" fill="var(--text-muted)" font-family="Courier New, monospace">serial port</text>
  <rect x="468.571429" y="40" width="342.857029" height="388.516849" rx="8.418319" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="151.004716" text-anchor="middle" font-size="31.701563" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Stream</text>
  <text x="640" y="198.181943" text-anchor="middle" font-size="20.728004" fill="var(--primary-accent)" font-family="Arial, sans-serif">uniform interface</text>
  <text x="640" y="239.808626" text-anchor="middle" font-size="19.508611" fill="var(--primary-accent)" font-family="Courier New, monospace">&lt;&lt;  /  &gt;&gt;</text>
  <text x="640" y="286.985853" text-anchor="middle" font-size="19.508611" fill="var(--primary-accent)" font-family="Arial, sans-serif">formatting</text>
  <text x="640" y="323.062334" text-anchor="middle" font-size="19.508611" fill="var(--primary-accent)" font-family="Arial, sans-serif">buffering</text>
  <text x="640" y="359.138815" text-anchor="middle" font-size="19.508611" fill="var(--primary-accent)" font-family="Arial, sans-serif">error state</text>
  <text x="640" y="400.765498" text-anchor="middle" font-size="19.508611" fill="var(--primary-accent)" font-family="Arial, sans-serif">locale / encoding</text>
  <rect x="940" y="95.50253" width="300" height="277.51196" rx="8.418319" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1090" y="192.63157" text-anchor="middle" font-size="29.262916" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Destination</text>
  <text x="1090" y="237.033697" text-anchor="middle" font-size="19.508611" fill="var(--text-muted)" font-family="Courier New, monospace">file</text>
  <text x="1090" y="273.110178" text-anchor="middle" font-size="19.508611" fill="var(--text-muted)" font-family="Courier New, monospace">string</text>
  <text x="1090" y="309.186659" text-anchor="middle" font-size="19.508611" fill="var(--text-muted)" font-family="Courier New, monospace">console</text>
  <text x="1090" y="345.263312" text-anchor="middle" font-size="19.508611" fill="var(--text-muted)" font-family="Courier New, monospace">serial port</text>
  <line x1="342.142857" y1="234.258425" x2="466.428571" y2="234.258425" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="813.571429" y1="234.258425" x2="937.857143" y2="234.258425" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="168.571429" y="508.995284" width="942.857143" height="111.004716" rx="8.418319" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="553.39724" text-anchor="middle" font-size="24.385904" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Uniform interface regardless of source/destination</text>
  <text x="640" y="589.47372" text-anchor="middle" font-size="20.728004" fill="var(--text-muted)" font-family="Arial, sans-serif">Same code writes to file, string, or serial — just swap the stream object</text>
  <text x="640" y="617.2249" text-anchor="middle" font-size="18.289358" fill="var(--text-faint)" font-family="Courier New, monospace">void print(std::ostream&amp; os) { os &lt;&lt; "value=" &lt;&lt; x; }</text>
</svg>

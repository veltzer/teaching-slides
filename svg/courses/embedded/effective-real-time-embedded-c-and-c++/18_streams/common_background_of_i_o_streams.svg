<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#212121">I/O Streams Concept</text>
  <line x1="200" y1="66" x2="1080" y2="66" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Source -->
  <rect x="80" y="260" width="280" height="200" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#212121">Source</text>
  <text x="220" y="362" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">file</text>
  <text x="220" y="388" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">string</text>
  <text x="220" y="414" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">network socket</text>
  <text x="220" y="440" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">serial port</text>

  <!-- Stream (center, accent) -->
  <rect x="480" y="220" width="320" height="280" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="300" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Stream</text>
  <text x="640" y="334" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">uniform interface</text>
  <text x="640" y="364" text-anchor="middle" font-family="monospace" font-size="16" fill="#90caf9">&lt;&lt;  /  &gt;&gt;</text>
  <text x="640" y="398" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">formatting</text>
  <text x="640" y="424" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">buffering</text>
  <text x="640" y="450" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">error state</text>
  <text x="640" y="480" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">locale / encoding</text>

  <!-- Destination -->
  <rect x="920" y="260" width="280" height="200" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1060" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#212121">Destination</text>
  <text x="1060" y="362" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">file</text>
  <text x="1060" y="388" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">string</text>
  <text x="1060" y="414" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">console</text>
  <text x="1060" y="440" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">serial port</text>

  <!-- Arrows -->
  <line x1="362" y1="360" x2="478" y2="360" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="802" y1="360" x2="918" y2="360" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Key insight -->
  <rect x="200" y="558" width="880" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="590" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1565c0">Uniform interface regardless of source/destination</text>
  <text x="640" y="616" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">Same code writes to file, string, or serial — just swap the stream object</text>
  <text x="640" y="636" text-anchor="middle" font-family="monospace" font-size="15" fill="#9e9e9e">void print(std::ostream&amp; os) { os &lt;&lt; "value=" &lt;&lt; x; }</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="95.50253" width="300" height="277.51196" rx="8.418319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="190" y="192.63157" text-anchor="middle" font-family="sans-serif" font-size="29.262916" font-weight="bold" fill="var(--text)">Source</text>
  <text x="190" y="237.033697" text-anchor="middle" font-family="monospace" font-size="19.508611" fill="var(--text-muted)">file</text>
  <text x="190" y="273.110178" text-anchor="middle" font-family="monospace" font-size="19.508611" fill="var(--text-muted)">string</text>
  <text x="190" y="309.186659" text-anchor="middle" font-family="monospace" font-size="19.508611" fill="var(--text-muted)">network socket</text>
  <text x="190" y="345.263312" text-anchor="middle" font-family="monospace" font-size="19.508611" fill="var(--text-muted)">serial port</text>
  <rect x="468.571429" y="40" width="342.857029" height="388.516849" rx="8.418319" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="151.004716" text-anchor="middle" font-family="sans-serif" font-size="31.701563" font-weight="bold" fill="var(--bg)">Stream</text>
  <text x="640" y="198.181943" text-anchor="middle" font-family="sans-serif" font-size="20.728004" fill="var(--primary-accent)">uniform interface</text>
  <text x="640" y="239.808626" text-anchor="middle" font-family="monospace" font-size="19.508611" fill="var(--primary-accent)">&lt;&lt;  /  &gt;&gt;</text>
  <text x="640" y="286.985853" text-anchor="middle" font-family="sans-serif" font-size="19.508611" fill="var(--primary-accent)">formatting</text>
  <text x="640" y="323.062334" text-anchor="middle" font-family="sans-serif" font-size="19.508611" fill="var(--primary-accent)">buffering</text>
  <text x="640" y="359.138815" text-anchor="middle" font-family="sans-serif" font-size="19.508611" fill="var(--primary-accent)">error state</text>
  <text x="640" y="400.765498" text-anchor="middle" font-family="sans-serif" font-size="19.508611" fill="var(--primary-accent)">locale / encoding</text>
  <rect x="940" y="95.50253" width="300" height="277.51196" rx="8.418319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1090" y="192.63157" text-anchor="middle" font-family="sans-serif" font-size="29.262916" font-weight="bold" fill="var(--text)">Destination</text>
  <text x="1090" y="237.033697" text-anchor="middle" font-family="monospace" font-size="19.508611" fill="var(--text-muted)">file</text>
  <text x="1090" y="273.110178" text-anchor="middle" font-family="monospace" font-size="19.508611" fill="var(--text-muted)">string</text>
  <text x="1090" y="309.186659" text-anchor="middle" font-family="monospace" font-size="19.508611" fill="var(--text-muted)">console</text>
  <text x="1090" y="345.263312" text-anchor="middle" font-family="monospace" font-size="19.508611" fill="var(--text-muted)">serial port</text>
  <line x1="342.142857" y1="234.258425" x2="466.428571" y2="234.258425" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="813.571429" y1="234.258425" x2="937.857143" y2="234.258425" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="168.571429" y="508.995284" width="942.857143" height="111.004716" rx="8.418319" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="553.39724" text-anchor="middle" font-family="sans-serif" font-size="24.385904" font-weight="bold" fill="var(--primary-accent)">Uniform interface regardless of source/destination</text>
  <text x="640" y="589.47372" text-anchor="middle" font-family="sans-serif" font-size="20.728004" fill="var(--text-muted)">Same code writes to file, string, or serial — just swap the stream object</text>
  <text x="640" y="617.2249" text-anchor="middle" font-family="monospace" font-size="18.289358" fill="var(--text-faint)">void print(std::ostream&amp; os) { os &lt;&lt; "value=" &lt;&lt; x; }</text>
</svg>
  <ns0:text x="568.8889" y="485.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Same code writes to file, string, or serial — just swap the stream object</ns0:text>
  <ns0:text x="568.8889" y="503.1111" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">void print(std::ostream&amp; os) { os &lt;&lt; "value=" &lt;&lt; x; }</ns0:text>

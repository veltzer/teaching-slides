<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="452.5" y="56.1111" width="375" height="72.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="98" text-anchor="middle" font-family="monospace" font-size="22.5947" font-weight="bold" fill="var(--bg)">std::streambuf</text>
  <text x="640" y="118.9444" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">abstract buffer base</text>
  <line x1="536.875" y1="130.2223" x2="283.75" y2="210.7777" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="96.25" y="212.3889" width="337.5" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="265" y="252.6667" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--text)">filebuf</text>
  <text x="265" y="272" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">backed by a file on disk</text>
  <line x1="640" y1="130.2223" x2="640" y2="210.7777" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="471.25" y="212.3889" width="337.5" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="252.6667" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--text)">stringbuf</text>
  <text x="640" y="272" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">backed by std::string</text>
  <line x1="743.125" y1="130.2223" x2="996.25" y2="210.7777" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="846.2499" y="212.3889" width="337.5" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1014.9999" y="252.6667" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--text)">custom buffer</text>
  <text x="1014.9999" y="272" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">backed by serial / DMA</text>
  <text x="640" y="330" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Buffer Areas (inside streambuf)</text>
  <rect x="115" y="349.3333" width="243.75" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="236.875" y="381.5556" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">get area</text>
  <text x="236.875" y="404.1111" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">eback · gptr · egptr</text>
  <rect x="396.25" y="349.3333" width="243.75" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="518.125" y="381.5556" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">put area</text>
  <text x="518.125" y="404.1111" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">pbase · pptr · epptr</text>
  <rect x="677.4999" y="349.3333" width="243.75" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="799.375" y="381.5556" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">overflow()</text>
  <text x="799.375" y="404.1111" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">called when put area full</text>
  <rect x="958.75" y="349.3333" width="243.75" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1080.625" y="381.5556" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">underflow()</text>
  <text x="1080.625" y="404.1111" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">called when get area empty</text>
  <rect x="227.5" y="458.8889" width="825" height="64.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="484.6667" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">Embedded use: override overflow() and underflow() to connect to UART / SPI</text>
  <text x="640" y="505.6111" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">int overflow(int c) { UART_send(c); return c; }</text>
  <text x="640" y="521.7223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-faint)">then wrap in ostream for full operator&lt;&lt; support</text>
</svg>
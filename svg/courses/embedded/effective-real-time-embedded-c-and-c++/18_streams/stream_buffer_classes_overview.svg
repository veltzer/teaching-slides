<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </marker>
  </defs>
  <rect x="426.440678" y="40" width="406.779661" height="90.000004" rx="6.962537" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="629.830508" y="92.000016" text-anchor="middle" font-family="monospace" font-size="26.219404" font-weight="bold" fill="var(--bg)">std::streambuf</text>
  <text x="629.830508" y="117.999962" text-anchor="middle" font-family="sans-serif" font-size="16.134982" fill="var(--primary-accent)">abstract buffer base</text>
  <line x1="517.966102" y1="132.000115" x2="243.389831" y2="231.999926" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="40" y="234.000037" width="366.101695" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="223.050847" y="284.000067" text-anchor="middle" font-family="monospace" font-size="22.185659" font-weight="bold" fill="var(--text)">filebuf</text>
  <text x="223.050847" y="308.000027" text-anchor="middle" font-family="sans-serif" font-size="15.126575" fill="var(--text-muted)">backed by a file on disk</text>
  <line x1="629.830508" y1="132.000115" x2="629.830508" y2="231.999926" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="446.779661" y="234.000037" width="366.101695" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="629.830508" y="284.000067" text-anchor="middle" font-family="monospace" font-size="22.185659" font-weight="bold" fill="var(--text)">stringbuf</text>
  <text x="629.830508" y="308.000027" text-anchor="middle" font-family="sans-serif" font-size="15.126575" fill="var(--text-muted)">backed by std::string</text>
  <line x1="741.694915" y1="132.000115" x2="1016.271186" y2="231.999926" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="853.559214" y="234.000037" width="366.101695" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1036.610061" y="284.000067" text-anchor="middle" font-family="monospace" font-size="22.185659" font-weight="bold" fill="var(--text)">custom buffer</text>
  <text x="1036.610061" y="308.000027" text-anchor="middle" font-family="sans-serif" font-size="15.126575" fill="var(--text-muted)">backed by serial / DMA</text>
  <text x="629.830508" y="380.00003" text-anchor="middle" font-family="sans-serif" font-size="18.151913" font-weight="bold" fill="var(--text)">Buffer Areas (inside streambuf)</text>
  <rect x="60.338983" y="403.99999" width="264.40678" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="192.542373" y="444.000088" text-anchor="middle" font-family="monospace" font-size="18.151913" font-weight="bold" fill="var(--primary-accent)">get area</text>
  <text x="192.542373" y="472.000021" text-anchor="middle" font-family="sans-serif" font-size="14.118052" fill="var(--text-muted)">eback · gptr · egptr</text>
  <rect x="365.423729" y="403.99999" width="264.40678" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="497.627119" y="444.000088" text-anchor="middle" font-family="monospace" font-size="18.151913" font-weight="bold" fill="var(--primary-accent)">put area</text>
  <text x="497.627119" y="472.000021" text-anchor="middle" font-family="sans-serif" font-size="14.118052" fill="var(--text-muted)">pbase · pptr · epptr</text>
  <rect x="670.508366" y="403.99999" width="264.40678" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="802.711864" y="444.000088" text-anchor="middle" font-family="monospace" font-size="18.151913" font-weight="bold" fill="var(--text)">overflow()</text>
  <text x="802.711864" y="472.000021" text-anchor="middle" font-family="sans-serif" font-size="14.118052" fill="var(--text-muted)">called when put area full</text>
  <rect x="975.59322" y="403.99999" width="264.40678" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1107.79661" y="444.000088" text-anchor="middle" font-family="monospace" font-size="18.151913" font-weight="bold" fill="var(--text)">underflow()</text>
  <text x="1107.79661" y="472.000021" text-anchor="middle" font-family="sans-serif" font-size="14.118052" fill="var(--text-muted)">called when get area empty</text>
  <rect x="182.372881" y="540.000051" width="894.915254" height="79.999949" rx="6.962537" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="629.830508" y="572.00008" text-anchor="middle" font-family="sans-serif" font-size="18.151913" font-weight="bold" fill="var(--primary-accent)">Embedded use: override overflow() and underflow() to connect to UART / SPI</text>
  <text x="629.830508" y="598.000027" text-anchor="middle" font-family="monospace" font-size="15.126575" fill="var(--text-muted)">int overflow(int c) { UART_send(c); return c; }</text>
  <text x="629.830508" y="618.000138" text-anchor="middle" font-family="sans-serif" font-size="15.126575" fill="var(--text-faint)">then wrap in ostream for full operator&lt;&lt; support</text>
</svg>
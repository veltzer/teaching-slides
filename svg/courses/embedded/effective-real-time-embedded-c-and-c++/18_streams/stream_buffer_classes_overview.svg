<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="inherit" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto">
      <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- streambuf root -->
  <rect x="440" y="20" width="400" height="90" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="72" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff">std::streambuf</text>
  <text x="640" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">abstract buffer base</text>

  <!-- filebuf -->
  <line x1="530" y1="112" x2="260" y2="212" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>
  <rect x="60" y="214" width="360" height="90" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="264" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#212121">filebuf</text>
  <text x="240" y="288" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">backed by a file on disk</text>

  <!-- stringbuf -->
  <line x1="640" y1="112" x2="640" y2="212" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>
  <rect x="460" y="214" width="360" height="90" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="264" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#212121">stringbuf</text>
  <text x="640" y="288" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">backed by std::string</text>

  <!-- custom -->
  <line x1="750" y1="112" x2="1020" y2="212" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>
  <rect x="860" y="214" width="360" height="90" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1040" y="264" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#212121">custom buffer</text>
  <text x="1040" y="288" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">backed by serial / DMA</text>

  <!-- Buffer internals -->
  <text x="640" y="360" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">Buffer Areas (inside streambuf)</text>

  <rect x="80"  y="384" width="260" height="90" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="424" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#1565c0">get area</text>
  <text x="210" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">eback · gptr · egptr</text>

  <rect x="380" y="384" width="260" height="90" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="424" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#1565c0">put area</text>
  <text x="510" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">pbase · pptr · epptr</text>

  <rect x="680" y="384" width="260" height="90" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="424" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">overflow()</text>
  <text x="810" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">called when put area full</text>

  <rect x="980" y="384" width="260" height="90" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1110" y="424" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">underflow()</text>
  <text x="1110" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">called when get area empty</text>

  <!-- Serial port note -->
  <rect x="200" y="520" width="880" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="552" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Embedded use: override overflow() and underflow() to connect to UART / SPI</text>
  <text x="640" y="578" text-anchor="middle" font-family="monospace" font-size="15" fill="#555555">int overflow(int c) { UART_send(c); return c; }</text>
  <text x="640" y="598" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">then wrap in ostream for full operator&lt;&lt; support</text>
</svg>

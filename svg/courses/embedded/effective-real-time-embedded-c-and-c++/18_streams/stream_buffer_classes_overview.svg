<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="426.440678" y="40" width="406.779661" height="90.000004" rx="6.962537" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.830508" y="92.000016" text-anchor="middle" font-size="26.219404" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">std::streambuf</text>
  <text x="629.830508" y="117.999962" text-anchor="middle" font-size="16.134982" fill="var(--primary-accent)" font-family="Arial, sans-serif">abstract buffer base</text>
  <line x1="517.966102" y1="132.000115" x2="243.389831" y2="231.999926" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="40" y="234.000037" width="366.101695" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="223.050847" y="284.000067" text-anchor="middle" font-size="22.185659" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">filebuf</text>
  <text x="223.050847" y="308.000027" text-anchor="middle" font-size="15.126575" fill="var(--text-muted)" font-family="Arial, sans-serif">backed by a file on disk</text>
  <line x1="629.830508" y1="132.000115" x2="629.830508" y2="231.999926" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="446.779661" y="234.000037" width="366.101695" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="629.830508" y="284.000067" text-anchor="middle" font-size="22.185659" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">stringbuf</text>
  <text x="629.830508" y="308.000027" text-anchor="middle" font-size="15.126575" fill="var(--text-muted)" font-family="Arial, sans-serif">backed by std::string</text>
  <line x1="741.694915" y1="132.000115" x2="1016.271186" y2="231.999926" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="853.559214" y="234.000037" width="366.101695" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1036.610061" y="284.000067" text-anchor="middle" font-size="22.185659" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">custom buffer</text>
  <text x="1036.610061" y="308.000027" text-anchor="middle" font-size="15.126575" fill="var(--text-muted)" font-family="Arial, sans-serif">backed by serial / DMA</text>
  <text x="629.830508" y="380.00003" text-anchor="middle" font-size="18.151913" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Buffer Areas (inside streambuf)</text>
  <rect x="60.338983" y="403.99999" width="264.40678" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="192.542373" y="444.000088" text-anchor="middle" font-size="18.151913" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">get area</text>
  <text x="192.542373" y="472.000021" text-anchor="middle" font-size="14.118052" fill="var(--text-muted)" font-family="Arial, sans-serif">eback · gptr · egptr</text>
  <rect x="365.423729" y="403.99999" width="264.40678" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="497.627119" y="444.000088" text-anchor="middle" font-size="18.151913" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">put area</text>
  <text x="497.627119" y="472.000021" text-anchor="middle" font-size="14.118052" fill="var(--text-muted)" font-family="Arial, sans-serif">pbase · pptr · epptr</text>
  <rect x="670.508366" y="403.99999" width="264.40678" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="802.711864" y="444.000088" text-anchor="middle" font-size="18.151913" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">overflow()</text>
  <text x="802.711864" y="472.000021" text-anchor="middle" font-size="14.118052" fill="var(--text-muted)" font-family="Arial, sans-serif">called when put area full</text>
  <rect x="975.59322" y="403.99999" width="264.40678" height="90.000004" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1107.79661" y="444.000088" text-anchor="middle" font-size="18.151913" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">underflow()</text>
  <text x="1107.79661" y="472.000021" text-anchor="middle" font-size="14.118052" fill="var(--text-muted)" font-family="Arial, sans-serif">called when get area empty</text>
  <rect x="182.372881" y="540.000051" width="894.915254" height="79.999949" rx="6.962537" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.830508" y="572.00008" text-anchor="middle" font-size="18.151913" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Embedded use: override overflow() and underflow() to connect to UART / SPI</text>
  <text x="629.830508" y="598.000027" text-anchor="middle" font-size="15.126575" fill="var(--text-muted)" font-family="Courier New, monospace">int overflow(int c) { UART_send(c); return c; }</text>
  <text x="629.830508" y="618.000138" text-anchor="middle" font-size="15.126575" fill="var(--text-faint)" font-family="Arial, sans-serif">then wrap in ostream for full operator&lt;&lt; support</text>
</svg>

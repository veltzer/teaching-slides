<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-3.5556%" y="-7.1111%" width="96%" height="110.2222%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-white" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#ffffff" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="71.1111" y="44.4444" width="444.4444" height="142.2222" rx="7.1111" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="293.3333" y="99.5556" text-anchor="middle" font-family="sans-serif" font-size="24.8889" font-weight="bold" fill="#ffffff">Code Reuse</ns0:text>
  <ns0:text x="293.3333" y="128" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">Driver works for UART1, UART2, UART3</ns0:text>
  <ns0:text x="293.3333" y="149.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#bbdefb">without copy-paste</ns0:text>
  <ns0:text x="293.3333" y="170.6667" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#90caf9">uart_init(&amp;uart1, ...);</ns0:text>
  <ns0:rect x="622.2222" y="44.4444" width="444.4444" height="142.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="844.4444" y="99.5556" text-anchor="middle" font-family="sans-serif" font-size="24.8889" font-weight="bold" fill="#212121">Modularity</ns0:text>
  <ns0:text x="844.4444" y="128" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Each peripheral is a self-contained</ns0:text>
  <ns0:text x="844.4444" y="149.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">struct with its own state</ns0:text>
  <ns0:text x="844.4444" y="170.6667" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">struct UART { reg, baud, ... };</ns0:text>
  <ns0:rect x="71.1111" y="222.2222" width="444.4444" height="142.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="293.3333" y="277.3333" text-anchor="middle" font-family="sans-serif" font-size="24.8889" font-weight="bold" fill="#212121">Abstraction</ns0:text>
  <ns0:text x="293.3333" y="305.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Caller doesn't know register details</ns0:text>
  <ns0:text x="293.3333" y="327.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">just calls the API</ns0:text>
  <ns0:text x="293.3333" y="348.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">uart_send(&amp;uart1, buf, len);</ns0:text>
  <ns0:rect x="622.2222" y="222.2222" width="444.4444" height="142.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="844.4444" y="277.3333" text-anchor="middle" font-family="sans-serif" font-size="24.8889" font-weight="bold" fill="#212121">Maintainability</ns0:text>
  <ns0:text x="844.4444" y="305.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">Change implementation without</ns0:text>
  <ns0:text x="844.4444" y="327.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">touching callers</ns0:text>
  <ns0:text x="844.4444" y="348.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#9e9e9e">stable API across hardware revisions</ns0:text>
  <ns0:rect x="177.7778" y="407.1111" width="782.2222" height="62.2222" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="433.7778" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="#1565c0">Without C++ overhead!</ns0:text>
  <ns0:text x="568.8889" y="458.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#555555">C structs + function pointers give you encapsulation and polymorphism at zero runtime cost</ns0:text>
  <ns0:text x="568.8889" y="524.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#9e9e9e">Technique: pass struct* as first argument (the "this" pointer) to all related functions</ns0:text>
</ns0:svg>
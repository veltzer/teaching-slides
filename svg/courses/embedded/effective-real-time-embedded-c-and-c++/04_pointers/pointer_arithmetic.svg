<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="230.769231" height="193.333383" rx="8.152395" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="155.384615" y="136.666617" text-anchor="middle" font-family="monospace" font-size="44.869561" font-weight="bold" fill="var(--bg)">[0]</text>
  <text x="155.384615" y="180.166624" text-anchor="middle" font-family="sans-serif" font-size="20.073235" fill="var(--primary-accent)">0x1000</text>
  <rect x="282.307692" y="40" width="230.769231" height="193.333383" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="397.692308" y="146.333218" text-anchor="middle" font-family="monospace" font-size="44.869561" font-weight="bold" fill="var(--text)">[1]</text>
  <text x="397.692308" y="180.166624" text-anchor="middle" font-family="sans-serif" font-size="20.073235" fill="var(--text-faint)">0x1004</text>
  <rect x="524.615262" y="40" width="230.769231" height="193.333383" rx="8.152395" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="136.666617" text-anchor="middle" font-family="monospace" font-size="44.869561" font-weight="bold" fill="var(--bg)">[2]</text>
  <text x="640" y="180.166624" text-anchor="middle" font-family="sans-serif" font-size="20.073235" fill="var(--primary-accent)">0x1008</text>
  <rect x="766.923077" y="40" width="230.769231" height="193.333383" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="882.307692" y="146.333218" text-anchor="middle" font-family="monospace" font-size="44.869561" font-weight="bold" fill="var(--text)">[3]</text>
  <text x="882.307692" y="180.166624" text-anchor="middle" font-family="sans-serif" font-size="20.073235" fill="var(--text-faint)">0x100C</text>
  <rect x="1009.230769" y="40" width="230.769231" height="193.333383" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1124.615385" y="146.333218" text-anchor="middle" font-family="monospace" font-size="44.869561" font-weight="bold" fill="var(--text)">[4]</text>
  <text x="1124.615385" y="180.166624" text-anchor="middle" font-family="sans-serif" font-size="20.073235" fill="var(--text-faint)">0x1010</text>
  <line x1="155.384615" y1="317.916598" x2="155.384615" y2="242.999985" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="155.384615" y="366.250056" text-anchor="middle" font-family="monospace" font-size="28.338541" font-weight="bold" fill="var(--primary-accent)">ptr</text>
  <text x="155.384615" y="397.666662" text-anchor="middle" font-family="sans-serif" font-size="18.892361" fill="var(--text-muted)">= &amp;arr[0]</text>
  <line x1="640" y1="317.916598" x2="640" y2="242.999985" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="366.250056" text-anchor="middle" font-family="monospace" font-size="28.338541" font-weight="bold" fill="var(--primary-accent)">ptr+2</text>
  <text x="640" y="397.666662" text-anchor="middle" font-family="sans-serif" font-size="18.892361" fill="var(--text-muted)">= &amp;arr[2]</text>
  <line x1="40" y1="475.000075" x2="513.076923" y2="475.000075" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="276.538462" y="511.249981" text-anchor="middle" font-family="sans-serif" font-size="21.253974" fill="var(--text-muted)">+2 × sizeof(int) = +8 bytes</text>
  <rect x="178.461538" y="547.500038" width="1015.384615" height="72.499962" rx="8.152395" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="686.153846" y="581.333293" text-anchor="middle" font-family="sans-serif" font-size="21.253974" font-weight="bold" fill="var(--primary-accent)">ptr + n  advances by  n × sizeof(*ptr)  bytes</text>
  <text x="686.153846" y="607.916598" text-anchor="middle" font-family="sans-serif" font-size="18.892361" fill="var(--text-muted)">Pointer arithmetic is type-aware — the compiler scales by element size automatically</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="230.769231" height="193.333383" rx="8.152395" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.384615" y="136.666617" text-anchor="middle" font-size="44.869561" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">[0]</text>
  <text x="155.384615" y="180.166624" text-anchor="middle" font-size="20.073235" fill="var(--primary-accent)" font-family="Arial, sans-serif">0x1000</text>
  <rect x="282.307692" y="40" width="230.769231" height="193.333383" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="397.692308" y="146.333218" text-anchor="middle" font-size="44.869561" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">[1]</text>
  <text x="397.692308" y="180.166624" text-anchor="middle" font-size="20.073235" fill="var(--text-faint)" font-family="Arial, sans-serif">0x1004</text>
  <rect x="524.615262" y="40" width="230.769231" height="193.333383" rx="8.152395" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="136.666617" text-anchor="middle" font-size="44.869561" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">[2]</text>
  <text x="640" y="180.166624" text-anchor="middle" font-size="20.073235" fill="var(--primary-accent)" font-family="Arial, sans-serif">0x1008</text>
  <rect x="766.923077" y="40" width="230.769231" height="193.333383" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="882.307692" y="146.333218" text-anchor="middle" font-size="44.869561" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">[3]</text>
  <text x="882.307692" y="180.166624" text-anchor="middle" font-size="20.073235" fill="var(--text-faint)" font-family="Arial, sans-serif">0x100C</text>
  <rect x="1009.230769" y="40" width="230.769231" height="193.333383" rx="8.152395" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1124.615385" y="146.333218" text-anchor="middle" font-size="44.869561" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">[4]</text>
  <text x="1124.615385" y="180.166624" text-anchor="middle" font-size="20.073235" fill="var(--text-faint)" font-family="Arial, sans-serif">0x1010</text>
  <line x1="155.384615" y1="317.916598" x2="155.384615" y2="242.999985" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="155.384615" y="366.250056" text-anchor="middle" font-size="28.338541" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">ptr</text>
  <text x="155.384615" y="397.666662" text-anchor="middle" font-size="18.892361" fill="var(--text-muted)" font-family="Arial, sans-serif">= &amp;arr[0]</text>
  <line x1="640" y1="317.916598" x2="640" y2="242.999985" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="366.250056" text-anchor="middle" font-size="28.338541" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">ptr+2</text>
  <text x="640" y="397.666662" text-anchor="middle" font-size="18.892361" fill="var(--text-muted)" font-family="Arial, sans-serif">= &amp;arr[2]</text>
  <line x1="40" y1="475.000075" x2="513.076923" y2="475.000075" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="276.538462" y="511.249981" text-anchor="middle" font-size="21.253974" fill="var(--text-muted)" font-family="Arial, sans-serif">+2 × sizeof(int) = +8 bytes</text>
  <rect x="178.461538" y="547.500038" width="1015.384615" height="72.499962" rx="8.152395" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="686.153846" y="581.333293" text-anchor="middle" font-size="21.253974" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ptr + n  advances by  n × sizeof(*ptr)  bytes</text>
  <text x="686.153846" y="607.916598" text-anchor="middle" font-size="18.892361" fill="var(--text-muted)" font-family="Arial, sans-serif">Pointer arithmetic is type-aware — the compiler scales by element size automatically</text>
</svg>
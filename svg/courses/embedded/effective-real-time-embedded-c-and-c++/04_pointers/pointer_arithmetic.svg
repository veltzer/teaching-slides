<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="108" text-anchor="middle" font-size="51.2" font-weight="bold">Pointer Arithmetic</text>
  <rect x="160" y="216" width="192" height="144" fill="#ffcccc" stroke="#333" />
  <text x="256" y="306" text-anchor="middle" font-size="44.8">[0]</text>
  <rect x="352" y="216" width="192" height="144" fill="#ccffcc" stroke="#333" />
  <text x="448" y="306" text-anchor="middle" font-size="44.8">[1]</text>
  <rect x="544" y="216" width="192" height="144" fill="#ccccff" stroke="#333" />
  <text x="640" y="306" text-anchor="middle" font-size="44.8">[2]</text>
  <rect x="736" y="216" width="192" height="144" fill="#ffffcc" stroke="#333" />
  <text x="832" y="306" text-anchor="middle" font-size="44.8">[3]</text>
  <rect x="928" y="216" width="192" height="144" fill="#ffccff" stroke="#333" />
  <text x="1024" y="306" text-anchor="middle" font-size="44.8">[4]</text>
  <path d="M 256 396 L 256 360" stroke="#333" stroke-width="6.4" marker-end="url(#arrowhead)" />
  <text x="256" y="468" text-anchor="middle" font-size="38.4">ptr</text>
  <path d="M 640 396 L 640 360" stroke="#333" stroke-width="6.4" marker-end="url(#arrowhead)" />
  <text x="640" y="468" text-anchor="middle" font-size="38.4">ptr+2</text>
  <defs>
    <marker id="arrowhead" markerWidth="32" markerHeight="25.2" refX="0" refY="12.6" orient="auto">
      <polygon points="0,36 11.2,0" fill="#333" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="115.5556" width="177.7778" height="142.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="160" y="186.6667" text-anchor="middle" font-family="monospace" font-size="33.7778" font-weight="bold" fill="var(--bg)">[0]</text>
  <text x="160" y="218.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">0x1000</text>
  <rect x="257.7778" y="115.5556" width="177.7778" height="142.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="346.6667" y="193.7778" text-anchor="middle" font-family="monospace" font-size="33.7778" font-weight="bold" fill="var(--text)">[1]</text>
  <text x="346.6667" y="218.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-faint)">0x1004</text>
  <rect x="444.4444" y="115.5556" width="177.7778" height="142.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="533.3333" y="186.6667" text-anchor="middle" font-family="monospace" font-size="33.7778" font-weight="bold" fill="var(--bg)">[2]</text>
  <text x="533.3333" y="218.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">0x1008</text>
  <rect x="631.1111" y="115.5556" width="177.7778" height="142.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="720" y="193.7778" text-anchor="middle" font-family="monospace" font-size="33.7778" font-weight="bold" fill="var(--text)">[3]</text>
  <text x="720" y="218.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-faint)">0x100C</text>
  <rect x="817.7778" y="115.5556" width="177.7778" height="142.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="906.6667" y="193.7778" text-anchor="middle" font-family="monospace" font-size="33.7778" font-weight="bold" fill="var(--text)">[4]</text>
  <text x="906.6667" y="218.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-faint)">0x1010</text>
  <line x1="160" y1="320" x2="160" y2="264.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="160" y="355.5556" text-anchor="middle" font-family="monospace" font-size="21.3333" font-weight="bold" fill="var(--primary-accent)">ptr</text>
  <text x="160" y="378.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">= &amp;arr[0]</text>
  <line x1="533.3333" y1="320" x2="533.3333" y2="264.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="533.3333" y="355.5556" text-anchor="middle" font-family="monospace" font-size="21.3333" font-weight="bold" fill="var(--primary-accent)">ptr+2</text>
  <text x="533.3333" y="378.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">= &amp;arr[2]</text>
  <line x1="71.1111" y1="435.5556" x2="435.5556" y2="435.5556" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="253.3333" y="462.2222" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--text-muted)">+2 × sizeof(int) = +8 bytes</text>
  <rect x="177.7778" y="488.8889" width="782.2222" height="53.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="513.7778" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">ptr + n  advances by  n × sizeof(*ptr)  bytes</text>
  <text x="568.8889" y="533.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Pointer arithmetic is type-aware — the compiler scales by element size automatically</text>
</svg>
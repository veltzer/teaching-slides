<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="425.714286" y="40" width="428.571429" height="176.949181" rx="7.085777" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="425.714286" y="40" width="428.571429" height="43.25419" rx="7.085777" fill="var(--primary-accent)" />
  <rect x="425.714286" y="77.355803" width="428.571429" height="5.898265" fill="var(--primary-accent)" rx="7.085777"/>
  <text x="640" y="69.491449" text-anchor="middle" font-size="22.578357" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">Sensor</text>
  <text x="640" y="104.881285" text-anchor="middle" font-size="16.42058" fill="var(--primary-accent)" font-family="Courier New, monospace">+ id : uint8_t</text>
  <text x="640" y="128.474591" text-anchor="middle" font-size="16.42058" fill="var(--primary-accent)" font-family="Courier New, monospace">+ read() : float  «virtual»</text>
  <text x="640" y="152.067774" text-anchor="middle" font-size="16.42058" fill="var(--primary-accent)" font-family="Courier New, monospace">+ calibrate() : void</text>
  <text x="640" y="177.627046" text-anchor="middle" font-size="14.367949" fill="var(--primary-accent)" font-style="italic" font-family="Arial, sans-serif">«abstract base»</text>
  <text x="640" y="199.254263" text-anchor="middle" font-size="14.367949" fill="var(--primary-accent)" font-family="Arial, sans-serif">interface: read(), calibrate()</text>
  <line x1="489.999886" y1="218.915148" x2="275.714286" y2="305.423772" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="307.389739" width="471.428571" height="176.949181" rx="7.085777" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="307.389739" width="471.428571" height="43.25419" rx="7.085777" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="344.745785" width="471.428571" height="5.898265" fill="url(#grad-primary)" rx="7.085777" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="275.714286" y="336.88131" text-anchor="middle" font-size="22.578357" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">TempSensor</text>
  <text x="275.714286" y="370.305057" text-anchor="middle" font-size="16.42058" fill="var(--text-muted)" font-family="Courier New, monospace">- raw_adc : uint16_t</text>
  <text x="275.714286" y="393.898363" text-anchor="middle" font-size="16.42058" fill="var(--text-muted)" font-family="Courier New, monospace">- offset : float</text>
  <text x="275.714286" y="417.491547" text-anchor="middle" font-size="16.42058" fill="var(--primary-accent)" font-family="Courier New, monospace">+ read() : float  «override»</text>
  <text x="275.714286" y="441.08473" text-anchor="middle" font-size="16.42058" fill="var(--text-muted)" font-family="Courier New, monospace">+ set_offset(f) : void</text>
  <text x="275.714286" y="466.644002" text-anchor="middle" font-size="14.367949" fill="var(--text-faint)" font-family="Arial, sans-serif">returns °C from ADC reading</text>
  <line x1="790" y1="218.915148" x2="1004.285714" y2="305.423772" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="768.571429" y="307.389739" width="471.428571" height="176.949181" rx="7.085777" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="768.571429" y="307.389739" width="471.428571" height="43.25419" rx="7.085777" fill="var(--surface)" />
  <rect x="768.571429" y="344.745785" width="471.428571" height="5.898265" fill="var(--surface)" rx="7.085777"/>
  <text x="1004.285714" y="336.88131" text-anchor="middle" font-size="22.578357" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">PressureSensor</text>
  <text x="1004.285714" y="370.305057" text-anchor="middle" font-size="16.42058" fill="var(--text-muted)" font-family="Courier New, monospace">- spi_port : SPI_t*</text>
  <text x="1004.285714" y="393.898363" text-anchor="middle" font-size="16.42058" fill="var(--text-muted)" font-family="Courier New, monospace">- range : float</text>
  <text x="1004.285714" y="417.491547" text-anchor="middle" font-size="16.42058" fill="var(--text-muted)" font-family="Courier New, monospace">+ read() : float  «override»</text>
  <text x="1004.285714" y="441.08473" text-anchor="middle" font-size="16.42058" fill="var(--text-muted)" font-family="Courier New, monospace">+ set_range(f) : void</text>
  <text x="1004.285714" y="466.644002" text-anchor="middle" font-size="14.367949" fill="var(--text-faint)" font-family="Arial, sans-serif">returns hPa via SPI read</text>
  <line x1="82.857143" y1="551.186538" x2="168.571429" y2="551.186538" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="190" y="557.084803" font-size="16.42058" fill="var(--text-muted)" font-family="Arial, sans-serif">Inheritance (IS-A)</text>
  <text x="640" y="620" text-anchor="middle" font-size="16.42058" fill="var(--text-faint)" font-family="Arial, sans-serif">In embedded C: simulate with function pointer tables (vtables) inside structs</text>
</svg>
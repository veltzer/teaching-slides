<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </marker>
  </defs>
  <rect x="425.714286" y="40" width="428.571429" height="176.949181" rx="7.085777" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="425.714286" y="40" width="428.571429" height="43.25419" rx="7.085777" fill="var(--primary-accent)" />
  <rect x="425.714286" y="77.355803" width="428.571429" height="5.898265" fill="var(--primary-accent)" rx="7.085777"/>
  <text x="640" y="69.491449" text-anchor="middle" font-family="monospace" font-size="22.578357" font-weight="bold" fill="var(--bg)">Sensor</text>
  <text x="640" y="104.881285" text-anchor="middle" font-family="monospace" font-size="16.42058" fill="var(--primary-accent)">+ id : uint8_t</text>
  <text x="640" y="128.474591" text-anchor="middle" font-family="monospace" font-size="16.42058" fill="var(--primary-accent)">+ read() : float  «virtual»</text>
  <text x="640" y="152.067774" text-anchor="middle" font-family="monospace" font-size="16.42058" fill="var(--primary-accent)">+ calibrate() : void</text>
  <text x="640" y="177.627046" text-anchor="middle" font-family="sans-serif" font-size="14.367949" fill="var(--primary-accent)" font-style="italic">«abstract base»</text>
  <text x="640" y="199.254263" text-anchor="middle" font-family="sans-serif" font-size="14.367949" fill="var(--primary-accent)">interface: read(), calibrate()</text>
  <line x1="489.999886" y1="218.915148" x2="275.714286" y2="305.423772" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="40" y="307.389739" width="471.428571" height="176.949181" rx="7.085777" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="307.389739" width="471.428571" height="43.25419" rx="7.085777" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="344.745785" width="471.428571" height="5.898265" fill="var(--primary-fill)" rx="7.085777" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="275.714286" y="336.88131" text-anchor="middle" font-family="monospace" font-size="22.578357" font-weight="bold" fill="var(--primary-accent)">TempSensor</text>
  <text x="275.714286" y="370.305057" text-anchor="middle" font-family="monospace" font-size="16.42058" fill="var(--text-muted)">- raw_adc : uint16_t</text>
  <text x="275.714286" y="393.898363" text-anchor="middle" font-family="monospace" font-size="16.42058" fill="var(--text-muted)">- offset : float</text>
  <text x="275.714286" y="417.491547" text-anchor="middle" font-family="monospace" font-size="16.42058" fill="var(--primary-accent)">+ read() : float  «override»</text>
  <text x="275.714286" y="441.08473" text-anchor="middle" font-family="monospace" font-size="16.42058" fill="var(--text-muted)">+ set_offset(f) : void</text>
  <text x="275.714286" y="466.644002" text-anchor="middle" font-family="sans-serif" font-size="14.367949" fill="var(--text-faint)">returns °C from ADC reading</text>
  <line x1="790" y1="218.915148" x2="1004.285714" y2="305.423772" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="768.571429" y="307.389739" width="471.428571" height="176.949181" rx="7.085777" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="768.571429" y="307.389739" width="471.428571" height="43.25419" rx="7.085777" fill="var(--surface)" />
  <rect x="768.571429" y="344.745785" width="471.428571" height="5.898265" fill="var(--surface)" rx="7.085777"/>
  <text x="1004.285714" y="336.88131" text-anchor="middle" font-family="monospace" font-size="22.578357" font-weight="bold" fill="var(--text)">PressureSensor</text>
  <text x="1004.285714" y="370.305057" text-anchor="middle" font-family="monospace" font-size="16.42058" fill="var(--text-muted)">- spi_port : SPI_t*</text>
  <text x="1004.285714" y="393.898363" text-anchor="middle" font-family="monospace" font-size="16.42058" fill="var(--text-muted)">- range : float</text>
  <text x="1004.285714" y="417.491547" text-anchor="middle" font-family="monospace" font-size="16.42058" fill="var(--text-muted)">+ read() : float  «override»</text>
  <text x="1004.285714" y="441.08473" text-anchor="middle" font-family="monospace" font-size="16.42058" fill="var(--text-muted)">+ set_range(f) : void</text>
  <text x="1004.285714" y="466.644002" text-anchor="middle" font-family="sans-serif" font-size="14.367949" fill="var(--text-faint)">returns hPa via SPI read</text>
  <line x1="82.857143" y1="551.186538" x2="168.571429" y2="551.186538" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <text x="190" y="557.084803" font-family="sans-serif" font-size="16.42058" fill="var(--text-muted)">Inheritance (IS-A)</text>
  <text x="640" y="620" text-anchor="middle" font-family="sans-serif" font-size="16.42058" fill="var(--text-faint)">In embedded C: simulate with function pointer tables (vtables) inside structs</text>
</svg>
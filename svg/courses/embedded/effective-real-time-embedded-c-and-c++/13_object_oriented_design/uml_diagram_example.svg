<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="inherit" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto">
      <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Base class -->
  <rect x="440" y="30" width="400" height="180" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <!-- header stripe -->
  <rect x="440" y="30" width="400" height="44" rx="6" fill="#0d47a1"/>
  <rect x="440" y="68" width="400" height="6" fill="#0d47a1"/>
  <text x="640" y="60" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">Sensor</text>
  <text x="640" y="96" text-anchor="middle" font-family="monospace" font-size="16" fill="#bbdefb">+ id : uint8_t</text>
  <text x="640" y="120" text-anchor="middle" font-family="monospace" font-size="16" fill="#bbdefb">+ read() : float  «virtual»</text>
  <text x="640" y="144" text-anchor="middle" font-family="monospace" font-size="16" fill="#bbdefb">+ calibrate() : void</text>
  <text x="640" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#90caf9" font-style="italic">«abstract base»</text>
  <text x="640" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#90caf9">interface: read(), calibrate()</text>

  <!-- Derived class 1: TempSensor -->
  <line x1="500" y1="212" x2="300" y2="300" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>
  <rect x="80" y="302" width="440" height="180" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="302" width="440" height="44" rx="6" fill="#e3f2fd"/>
  <rect x="80" y="340" width="440" height="6" fill="#e3f2fd"/>
  <text x="300" y="332" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#1565c0">TempSensor</text>
  <text x="300" y="366" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">- raw_adc : uint16_t</text>
  <text x="300" y="390" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">- offset : float</text>
  <text x="300" y="414" text-anchor="middle" font-family="monospace" font-size="16" fill="#1565c0">+ read() : float  «override»</text>
  <text x="300" y="438" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">+ set_offset(f) : void</text>
  <text x="300" y="464" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">returns °C from ADC reading</text>

  <!-- Derived class 2: PressureSensor -->
  <line x1="780" y1="212" x2="980" y2="300" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>
  <rect x="760" y="302" width="440" height="180" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="760" y="302" width="440" height="44" rx="6" fill="#f2f2f2"/>
  <rect x="760" y="340" width="440" height="6" fill="#f2f2f2"/>
  <text x="980" y="332" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#212121">PressureSensor</text>
  <text x="980" y="366" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">- spi_port : SPI_t*</text>
  <text x="980" y="390" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">- range : float</text>
  <text x="980" y="414" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">+ read() : float  «override»</text>
  <text x="980" y="438" text-anchor="middle" font-family="monospace" font-size="16" fill="#555555">+ set_range(f) : void</text>
  <text x="980" y="464" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">returns hPa via SPI read</text>

  <!-- Legend for inheritance arrow -->
  <line x1="120" y1="550" x2="200" y2="550" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>
  <text x="220" y="556" font-family="sans-serif" font-size="16" fill="#555555">Inheritance (IS-A)</text>

  <text x="640" y="620" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9e9e9e">In embedded C: simulate with function pointer tables (vtables) inside structs</text>
</svg>

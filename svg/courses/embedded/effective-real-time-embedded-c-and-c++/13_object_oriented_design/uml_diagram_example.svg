<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="452.5" y="64.1667" width="375" height="145" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="452.5" y="64.1667" width="375" height="35.4444" rx="6" fill="var(--primary-accent)" />
  <rect x="452.5" y="94.7777" width="375" height="4.8333" fill="var(--primary-accent)" rx="6"/>
  <text x="640" y="88.3333" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--bg)">Sensor</text>
  <text x="640" y="117.3333" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">+ id : uint8_t</text>
  <text x="640" y="136.6667" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">+ read() : float  «virtual»</text>
  <text x="640" y="156" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">+ calibrate() : void</text>
  <text x="640" y="176.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)" font-style="italic">«abstract base»</text>
  <text x="640" y="194.6667" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">interface: read(), calibrate()</text>
  <line x1="508.7499" y1="210.7777" x2="321.25" y2="281.6667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="115" y="283.2777" width="412.5" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="115" y="283.2777" width="412.5" height="35.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="115" y="313.8889" width="412.5" height="4.8333" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="321.25" y="307.4444" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">TempSensor</text>
  <text x="321.25" y="334.8333" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">- raw_adc : uint16_t</text>
  <text x="321.25" y="354.1667" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">- offset : float</text>
  <text x="321.25" y="373.5" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">+ read() : float  «override»</text>
  <text x="321.25" y="392.8333" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">+ set_offset(f) : void</text>
  <text x="321.25" y="413.7777" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">returns °C from ADC reading</text>
  <line x1="771.25" y1="210.7777" x2="958.75" y2="281.6667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="752.5" y="283.2777" width="412.5" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="752.5" y="283.2777" width="412.5" height="35.4444" rx="6" fill="var(--surface)" />
  <rect x="752.5" y="313.8889" width="412.5" height="4.8333" fill="var(--surface)" rx="6"/>
  <text x="958.75" y="307.4444" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--text)">PressureSensor</text>
  <text x="958.75" y="334.8333" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">- spi_port : SPI_t*</text>
  <text x="958.75" y="354.1667" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">- range : float</text>
  <text x="958.75" y="373.5" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">+ read() : float  «override»</text>
  <text x="958.75" y="392.8333" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--text-muted)">+ set_range(f) : void</text>
  <text x="958.75" y="413.7777" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">returns hPa via SPI read</text>
  <line x1="152.5" y1="483.0556" x2="227.5" y2="483.0556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <text x="246.25" y="487.8889" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Inheritance (IS-A)</text>
  <text x="640" y="539.4444" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-faint)">In embedded C: simulate with function pointer tables (vtables) inside structs</text>
</svg>
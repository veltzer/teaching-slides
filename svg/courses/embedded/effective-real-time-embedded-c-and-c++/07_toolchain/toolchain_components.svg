<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Left: file artifacts -->
  <text x="240" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9e9e9e">File</text>

  <!-- .c/.h -->
  <rect x="80" y="40" width="320" height="76" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="240" y="82" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff">.c / .h</text>
  <text x="240" y="106" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">Source Files</text>

  <line x1="240" y1="118" x2="240" y2="164" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="148" font-family="sans-serif" font-size="14" fill="#9e9e9e">cpp</text>

  <!-- .i -->
  <rect x="80" y="166" width="320" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="208" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#212121">.i</text>
  <text x="240" y="230" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Preprocessed</text>

  <line x1="240" y1="244" x2="240" y2="290" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="274" font-family="sans-serif" font-size="14" fill="#9e9e9e">cc1</text>

  <!-- .s -->
  <rect x="80" y="292" width="320" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="334" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#212121">.s</text>
  <text x="240" y="356" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Assembly</text>

  <line x1="240" y1="370" x2="240" y2="416" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="400" font-family="sans-serif" font-size="14" fill="#9e9e9e">as</text>

  <!-- .o -->
  <rect x="80" y="418" width="320" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="460" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#212121">.o</text>
  <text x="240" y="482" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Object File</text>

  <!-- Right: stages -->
  <text x="800" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9e9e9e">Stage</text>

  <rect x="560" y="40" width="360" height="76" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="82" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1565c0">Preprocessor</text>
  <text x="740" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Macros · #include · conditionals</text>

  <line x1="740" y1="118" x2="740" y2="164" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="166" width="360" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">Compiler</text>
  <text x="740" y="231" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Parse · optimize · code-gen</text>

  <line x1="740" y1="244" x2="740" y2="290" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="292" width="360" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="334" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">Assembler</text>
  <text x="740" y="357" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Mnemonics → machine code</text>

  <line x1="740" y1="370" x2="740" y2="416" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="418" width="360" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="460" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">Linker</text>
  <text x="740" y="483" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Resolve symbols · assign sections</text>

  <!-- ELF output -->
  <line x1="922" y1="456" x2="968" y2="456" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <rect x="970" y="418" width="240" height="76" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1090" y="458" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#ffffff">.elf</text>
  <text x="1090" y="482" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">Executable</text>

  <!-- Connector dashes -->
  <line x1="402" y1="78" x2="558" y2="78" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="402" y1="204" x2="558" y2="204" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="402" y1="330" x2="558" y2="330" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="402" y1="456" x2="558" y2="456" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- Footer -->
  <text x="640" y="590" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#9e9e9e">Multiple .o files + libraries are combined by the linker into a single binary</text>
</svg>

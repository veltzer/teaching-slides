<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="209.911504" y="40" text-anchor="middle" font-size="18.877489" fill="var(--text-faint)" font-family="Arial, sans-serif">File</text>
  <rect x="40" y="50.357203" width="339.822896" height="78.714405" rx="7.240846" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.911504" y="93.85717" text-anchor="middle" font-size="27.267457" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">.c / .h</text>
  <text x="209.911504" y="118.714277" text-anchor="middle" font-size="16.779936" fill="var(--primary-accent)" font-family="Arial, sans-serif">Source Files</text>
  <line x1="209.911504" y1="131.142894" x2="209.911504" y2="178.785691" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="231.150442" y="162.214373" font-size="14.682384" fill="var(--text-faint)" font-family="Arial, sans-serif">cpp</text>
  <rect x="40" y="180.857235" width="339.822896" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="209.911504" y="224.357203" text-anchor="middle" font-size="27.267457" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">.i</text>
  <text x="209.911504" y="247.142765" text-anchor="middle" font-size="16.779936" fill="var(--text-muted)" font-family="Arial, sans-serif">Preprocessed</text>
  <line x1="209.911504" y1="261.642926" x2="209.911504" y2="309.285723" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="231.150442" y="292.714405" font-size="14.682384" fill="var(--text-faint)" font-family="Arial, sans-serif">cc1</text>
  <rect x="40" y="311.357267" width="339.822896" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="209.911504" y="354.857235" text-anchor="middle" font-size="27.267457" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">.s</text>
  <text x="209.911504" y="377.642797" text-anchor="middle" font-size="16.779936" fill="var(--text-muted)" font-family="Arial, sans-serif">Assembly</text>
  <line x1="209.911504" y1="392.142958" x2="209.911504" y2="439.785756" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="231.150442" y="423.214437" font-size="14.682384" fill="var(--text-faint)" font-family="Arial, sans-serif">as</text>
  <rect x="40" y="441.857299" width="339.822896" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="209.911504" y="485.357267" text-anchor="middle" font-size="27.267457" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">.o</text>
  <text x="209.911504" y="508.14283" text-anchor="middle" font-size="16.779936" fill="var(--text-muted)" font-family="Arial, sans-serif">Object File</text>
  <text x="804.60177" y="40" text-anchor="middle" font-size="18.877489" fill="var(--text-faint)" font-family="Arial, sans-serif">Stage</text>
  <rect x="549.734513" y="50.357203" width="382.300885" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="740.884956" y="93.85717" text-anchor="middle" font-size="23.072473" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Preprocessor</text>
  <text x="740.884956" y="117.678505" text-anchor="middle" font-size="15.73122" fill="var(--text-muted)" font-family="Arial, sans-serif">Macros · #include · conditionals</text>
  <line x1="740.884956" y1="131.142894" x2="740.884956" y2="178.785691" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="549.734513" y="180.857235" width="382.300885" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="740.884956" y="224.357203" text-anchor="middle" font-size="23.072473" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Compiler</text>
  <text x="740.884956" y="248.178537" text-anchor="middle" font-size="15.73122" fill="var(--text-muted)" font-family="Arial, sans-serif">Parse · optimize · code-gen</text>
  <line x1="740.884956" y1="261.642926" x2="740.884956" y2="309.285723" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="549.734513" y="311.357267" width="382.300885" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="740.884956" y="354.857235" text-anchor="middle" font-size="23.072473" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Assembler</text>
  <text x="740.884956" y="378.678569" text-anchor="middle" font-size="15.73122" fill="var(--text-muted)" font-family="Arial, sans-serif">Mnemonics → machine code</text>
  <line x1="740.884956" y1="392.142958" x2="740.884956" y2="439.785756" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="549.734513" y="441.857299" width="382.300885" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="740.884956" y="485.357267" text-anchor="middle" font-size="23.072473" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Linker</text>
  <text x="740.884956" y="509.178601" text-anchor="middle" font-size="15.73122" fill="var(--text-muted)" font-family="Arial, sans-serif">Resolve symbols · assign sections</text>
  <line x1="934.159292" y1="481.214309" x2="983.008736" y2="481.214309" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="985.132743" y="441.857299" width="254.867257" height="78.714405" rx="7.240846" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112.566372" y="483.285723" text-anchor="middle" font-size="29.365009" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">.elf</text>
  <text x="1112.566372" y="508.14283" text-anchor="middle" font-size="16.779936" fill="var(--primary-accent)" font-family="Arial, sans-serif">Executable</text>
  <line x1="381.946903" y1="89.714212" x2="547.610619" y2="89.714212" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556"/>
  <line x1="381.946903" y1="220.214244" x2="547.610619" y2="220.214244" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556"/>
  <line x1="381.946903" y1="350.714277" x2="547.610619" y2="350.714277" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556"/>
  <line x1="381.946903" y1="481.214309" x2="547.610619" y2="481.214309" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556"/>
  <text x="634.690265" y="620" text-anchor="middle" font-size="17.828773" fill="var(--text-faint)" font-family="Arial, sans-serif">Multiple .o files + libraries are combined by the linker into a single binary</text>
</svg>

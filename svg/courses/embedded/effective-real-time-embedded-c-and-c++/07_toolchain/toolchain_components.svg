<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="43.2" font-weight="bold">Build Process</text>
  <rect x="320" y="120" width="640" height="96" fill="#ffcccc" stroke="#333" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="213.3333" y="26.6667" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--text-faint)">File</text>
  <rect x="71.1111" y="35.5556" width="284.4444" height="67.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="213.3333" y="72.8889" text-anchor="middle" font-family="monospace" font-size="23.1111" font-weight="bold" fill="var(--bg)">.c / .h</text>
  <text x="213.3333" y="94.2222" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">Source Files</text>
  <line x1="213.3333" y1="104.8889" x2="213.3333" y2="145.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="231.1111" y="131.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">cpp</text>
  <rect x="71.1111" y="147.5556" width="284.4444" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="213.3333" y="184.8889" text-anchor="middle" font-family="monospace" font-size="23.1111" font-weight="bold" fill="var(--text)">.i</text>
  <text x="213.3333" y="204.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Preprocessed</text>
  <line x1="213.3333" y1="216.8889" x2="213.3333" y2="257.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="231.1111" y="243.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">cc1</text>
  <rect x="71.1111" y="259.5556" width="284.4444" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="213.3333" y="296.8889" text-anchor="middle" font-family="monospace" font-size="23.1111" font-weight="bold" fill="var(--text)">.s</text>
  <text x="213.3333" y="316.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Assembly</text>
  <line x1="213.3333" y1="328.8889" x2="213.3333" y2="369.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="231.1111" y="355.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">as</text>
  <rect x="71.1111" y="371.5556" width="284.4444" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="213.3333" y="408.8889" text-anchor="middle" font-family="monospace" font-size="23.1111" font-weight="bold" fill="var(--text)">.o</text>
  <text x="213.3333" y="428.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Object File</text>
  <text x="711.1111" y="26.6667" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--text-faint)">Stage</text>
  <rect x="497.7778" y="35.5556" width="320" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="657.7778" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">Preprocessor</text>
  <text x="657.7778" y="93.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Macros · #include · conditionals</text>
  <line x1="657.7778" y1="104.8889" x2="657.7778" y2="145.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="497.7778" y="147.5556" width="320" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="657.7778" y="184.8889" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--text)">Compiler</text>
  <text x="657.7778" y="205.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Parse · optimize · code-gen</text>
  <line x1="657.7778" y1="216.8889" x2="657.7778" y2="257.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="497.7778" y="259.5556" width="320" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="657.7778" y="296.8889" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--text)">Assembler</text>
  <text x="657.7778" y="317.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Mnemonics → machine code</text>
  <line x1="657.7778" y1="328.8889" x2="657.7778" y2="369.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="497.7778" y="371.5556" width="320" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="657.7778" y="408.8889" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--text)">Linker</text>
  <text x="657.7778" y="429.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Resolve symbols · assign sections</text>
  <line x1="819.5556" y1="405.3333" x2="860.4444" y2="405.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="862.2222" y="371.5556" width="213.3333" height="67.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="968.8889" y="407.1111" text-anchor="middle" font-family="monospace" font-size="24.8889" font-weight="bold" fill="var(--bg)">.elf</text>
  <text x="968.8889" y="428.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">Executable</text>
  <line x1="357.3333" y1="69.3333" x2="496" y2="69.3333" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556" />
  <line x1="357.3333" y1="181.3333" x2="496" y2="181.3333" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556" />
  <line x1="357.3333" y1="293.3333" x2="496" y2="293.3333" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556" />
  <line x1="357.3333" y1="405.3333" x2="496" y2="405.3333" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556" />
  <text x="568.8889" y="524.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-faint)">Multiple .o files + libraries are combined by the linker into a single binary</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="265" y="64.1667" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text-faint)">File</text>
  <rect x="115" y="72.2223" width="299.9999" height="61.2223" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="265" y="106.0556" text-anchor="middle" font-family="monospace" font-size="22.5947" font-weight="bold" fill="var(--bg)">.c / .h</text>
  <text x="265" y="125.3889" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">Source Files</text>
  <line x1="265" y1="135.0556" x2="265" y2="172.1111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="283.75" y="159.2223" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">cpp</text>
  <rect x="115" y="173.7223" width="299.9999" height="61.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="265" y="207.5556" text-anchor="middle" font-family="monospace" font-size="22.5947" font-weight="bold" fill="var(--text)">.i</text>
  <text x="265" y="225.2777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Preprocessed</text>
  <line x1="265" y1="236.5556" x2="265" y2="273.6111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="283.75" y="260.7223" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">cc1</text>
  <rect x="115" y="275.2223" width="299.9999" height="61.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="265" y="309.0556" text-anchor="middle" font-family="monospace" font-size="22.5947" font-weight="bold" fill="var(--text)">.s</text>
  <text x="265" y="326.7777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Assembly</text>
  <line x1="265" y1="338.0556" x2="265" y2="375.1111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="283.75" y="362.2223" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">as</text>
  <rect x="115" y="376.7223" width="299.9999" height="61.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="265" y="410.5556" text-anchor="middle" font-family="monospace" font-size="22.5947" font-weight="bold" fill="var(--text)">.o</text>
  <text x="265" y="428.2777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Object File</text>
  <text x="790" y="64.1667" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text-faint)">Stage</text>
  <rect x="565" y="72.2223" width="337.5" height="61.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="733.75" y="106.0556" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">Preprocessor</text>
  <text x="733.75" y="124.5833" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">Macros · #include · conditionals</text>
  <line x1="733.75" y1="135.0556" x2="733.75" y2="172.1111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="565" y="173.7223" width="337.5" height="61.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="733.75" y="207.5556" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text)">Compiler</text>
  <text x="733.75" y="226.0833" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">Parse · optimize · code-gen</text>
  <line x1="733.75" y1="236.5556" x2="733.75" y2="273.6111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="565" y="275.2223" width="337.5" height="61.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="733.75" y="309.0556" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text)">Assembler</text>
  <text x="733.75" y="327.5833" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">Mnemonics → machine code</text>
  <line x1="733.75" y1="338.0556" x2="733.75" y2="375.1111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="565" y="376.7223" width="337.5" height="61.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="733.75" y="410.5556" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text)">Linker</text>
  <text x="733.75" y="429.0833" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">Resolve symbols · assign sections</text>
  <line x1="904.375" y1="407.3333" x2="947.4999" y2="407.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="949.375" y="376.7223" width="225" height="61.2223" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1061.875" y="408.9444" text-anchor="middle" font-family="monospace" font-size="24.3328" font-weight="bold" fill="var(--bg)">.elf</text>
  <text x="1061.875" y="428.2777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">Executable</text>
  <line x1="416.875" y1="102.8333" x2="563.125" y2="102.8333" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556" />
  <line x1="416.875" y1="204.3333" x2="563.125" y2="204.3333" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556" />
  <line x1="416.875" y1="305.8333" x2="563.125" y2="305.8333" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556" />
  <line x1="416.875" y1="407.3333" x2="563.125" y2="407.3333" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556" />
  <text x="640" y="515.2777" text-anchor="middle" font-family="sans-serif" font-size="14.7735" fill="var(--text-faint)">Multiple .o files + libraries are combined by the linker into a single binary</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="209.911504" y="40" text-anchor="middle" font-family="sans-serif" font-size="18.877489" fill="var(--text-faint)">File</text>
  <rect x="40" y="50.357203" width="339.822896" height="78.714405" rx="7.240846" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="209.911504" y="93.85717" text-anchor="middle" font-family="monospace" font-size="27.267457" font-weight="bold" fill="var(--bg)">.c / .h</text>
  <text x="209.911504" y="118.714277" text-anchor="middle" font-family="sans-serif" font-size="16.779936" fill="var(--primary-accent)">Source Files</text>
  <line x1="209.911504" y1="131.142894" x2="209.911504" y2="178.785691" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="231.150442" y="162.214373" font-family="sans-serif" font-size="14.682384" fill="var(--text-faint)">cpp</text>
  <rect x="40" y="180.857235" width="339.822896" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="209.911504" y="224.357203" text-anchor="middle" font-family="monospace" font-size="27.267457" font-weight="bold" fill="var(--text)">.i</text>
  <text x="209.911504" y="247.142765" text-anchor="middle" font-family="sans-serif" font-size="16.779936" fill="var(--text-muted)">Preprocessed</text>
  <line x1="209.911504" y1="261.642926" x2="209.911504" y2="309.285723" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="231.150442" y="292.714405" font-family="sans-serif" font-size="14.682384" fill="var(--text-faint)">cc1</text>
  <rect x="40" y="311.357267" width="339.822896" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="209.911504" y="354.857235" text-anchor="middle" font-family="monospace" font-size="27.267457" font-weight="bold" fill="var(--text)">.s</text>
  <text x="209.911504" y="377.642797" text-anchor="middle" font-family="sans-serif" font-size="16.779936" fill="var(--text-muted)">Assembly</text>
  <line x1="209.911504" y1="392.142958" x2="209.911504" y2="439.785756" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="231.150442" y="423.214437" font-family="sans-serif" font-size="14.682384" fill="var(--text-faint)">as</text>
  <rect x="40" y="441.857299" width="339.822896" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="209.911504" y="485.357267" text-anchor="middle" font-family="monospace" font-size="27.267457" font-weight="bold" fill="var(--text)">.o</text>
  <text x="209.911504" y="508.14283" text-anchor="middle" font-family="sans-serif" font-size="16.779936" fill="var(--text-muted)">Object File</text>
  <text x="804.60177" y="40" text-anchor="middle" font-family="sans-serif" font-size="18.877489" fill="var(--text-faint)">Stage</text>
  <rect x="549.734513" y="50.357203" width="382.300885" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="740.884956" y="93.85717" text-anchor="middle" font-family="sans-serif" font-size="23.072473" font-weight="bold" fill="var(--primary-accent)">Preprocessor</text>
  <text x="740.884956" y="117.678505" text-anchor="middle" font-family="sans-serif" font-size="15.73122" fill="var(--text-muted)">Macros · #include · conditionals</text>
  <line x1="740.884956" y1="131.142894" x2="740.884956" y2="178.785691" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="549.734513" y="180.857235" width="382.300885" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="740.884956" y="224.357203" text-anchor="middle" font-family="sans-serif" font-size="23.072473" font-weight="bold" fill="var(--text)">Compiler</text>
  <text x="740.884956" y="248.178537" text-anchor="middle" font-family="sans-serif" font-size="15.73122" fill="var(--text-muted)">Parse · optimize · code-gen</text>
  <line x1="740.884956" y1="261.642926" x2="740.884956" y2="309.285723" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="549.734513" y="311.357267" width="382.300885" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="740.884956" y="354.857235" text-anchor="middle" font-family="sans-serif" font-size="23.072473" font-weight="bold" fill="var(--text)">Assembler</text>
  <text x="740.884956" y="378.678569" text-anchor="middle" font-family="sans-serif" font-size="15.73122" fill="var(--text-muted)">Mnemonics → machine code</text>
  <line x1="740.884956" y1="392.142958" x2="740.884956" y2="439.785756" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="549.734513" y="441.857299" width="382.300885" height="78.714405" rx="7.240846" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="740.884956" y="485.357267" text-anchor="middle" font-family="sans-serif" font-size="23.072473" font-weight="bold" fill="var(--text)">Linker</text>
  <text x="740.884956" y="509.178601" text-anchor="middle" font-family="sans-serif" font-size="15.73122" fill="var(--text-muted)">Resolve symbols · assign sections</text>
  <line x1="934.159292" y1="481.214309" x2="983.008736" y2="481.214309" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="985.132743" y="441.857299" width="254.867257" height="78.714405" rx="7.240846" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1112.566372" y="483.285723" text-anchor="middle" font-family="monospace" font-size="29.365009" font-weight="bold" fill="var(--bg)">.elf</text>
  <text x="1112.566372" y="508.14283" text-anchor="middle" font-family="sans-serif" font-size="16.779936" fill="var(--primary-accent)">Executable</text>
  <line x1="381.946903" y1="89.714212" x2="547.610619" y2="89.714212" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556" />
  <line x1="381.946903" y1="220.214244" x2="547.610619" y2="220.214244" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556" />
  <line x1="381.946903" y1="350.714277" x2="547.610619" y2="350.714277" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556" />
  <line x1="381.946903" y1="481.214309" x2="547.610619" y2="481.214309" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="4.4444 3.5556" />
  <text x="634.690265" y="620" text-anchor="middle" font-family="sans-serif" font-size="17.828773" fill="var(--text-faint)">Multiple .o files + libraries are combined by the linker into a single binary</text>
</svg>
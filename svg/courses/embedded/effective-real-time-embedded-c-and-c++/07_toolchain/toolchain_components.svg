<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#212121">Build Process</text>
  <line x1="200" y1="66" x2="1080" y2="66" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Left: file artifacts -->
  <text x="240" y="100" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9e9e9e">File</text>

  <!-- .c/.h -->
  <rect x="80" y="110" width="320" height="76" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="240" y="152" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff">.c / .h</text>
  <text x="240" y="176" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">Source Files</text>

  <line x1="240" y1="188" x2="240" y2="234" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="218" font-family="sans-serif" font-size="14" fill="#9e9e9e">cpp</text>

  <!-- .i -->
  <rect x="80" y="236" width="320" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="278" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#212121">.i</text>
  <text x="240" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Preprocessed</text>

  <line x1="240" y1="314" x2="240" y2="360" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="344" font-family="sans-serif" font-size="14" fill="#9e9e9e">cc1</text>

  <!-- .s -->
  <rect x="80" y="362" width="320" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="404" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#212121">.s</text>
  <text x="240" y="426" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Assembly</text>

  <line x1="240" y1="440" x2="240" y2="486" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="470" font-family="sans-serif" font-size="14" fill="#9e9e9e">as</text>

  <!-- .o -->
  <rect x="80" y="488" width="320" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="530" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#212121">.o</text>
  <text x="240" y="552" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Object File</text>

  <!-- Right: stages -->
  <text x="800" y="100" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9e9e9e">Stage</text>

  <rect x="560" y="110" width="360" height="76" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="152" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1565c0">Preprocessor</text>
  <text x="740" y="175" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Macros · #include · conditionals</text>

  <line x1="740" y1="188" x2="740" y2="234" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="236" width="360" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="278" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">Compiler</text>
  <text x="740" y="301" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Parse · optimize · code-gen</text>

  <line x1="740" y1="314" x2="740" y2="360" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="362" width="360" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="404" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">Assembler</text>
  <text x="740" y="427" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Mnemonics → machine code</text>

  <line x1="740" y1="440" x2="740" y2="486" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="488" width="360" height="76" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="530" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212121">Linker</text>
  <text x="740" y="553" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Resolve symbols · assign sections</text>

  <!-- ELF output -->
  <line x1="922" y1="526" x2="968" y2="526" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <rect x="970" y="488" width="240" height="76" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1090" y="528" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#ffffff">.elf</text>
  <text x="1090" y="552" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#bbdefb">Executable</text>

  <!-- Connector dashes -->
  <line x1="402" y1="148" x2="558" y2="148" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="402" y1="274" x2="558" y2="274" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="402" y1="400" x2="558" y2="400" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="402" y1="526" x2="558" y2="526" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- Footer -->
  <text x="640" y="660" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#9e9e9e">Multiple .o files + libraries are combined by the linker into a single binary</text>
</svg>

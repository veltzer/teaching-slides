<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="40" y="40" font-family="monospace" font-size="18.58803" fill="var(--text-faint)">High address (RAM)</text>
  <rect x="203.636218" y="49.897667" width="872.727273" height="87.099" rx="8.021071" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="530.909091" y="99.385632" text-anchor="middle" font-family="sans-serif" font-size="30.205616" font-weight="bold" fill="var(--bg)">Stack  ↓  (grows down)</text>
  <text x="1021.818182" y="94.436921" text-anchor="middle" font-family="monospace" font-size="17.426312" fill="var(--primary-accent)">local vars, return addr</text>
  <rect x="203.636218" y="142.93507" width="872.727273" height="104.914702" rx="8.021071" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="5.3333 2.6667" />
  <text x="640" y="198.361807" text-anchor="middle" font-family="sans-serif" font-size="25.558608" fill="var(--text-faint)">Free Space</text>
  <line x1="640" y1="153.822553" x2="640" y2="178.566474" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="640" y1="236.962535" x2="640" y2="212.218368" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="203.636218" y="253.788421" width="872.727273" height="87.099" rx="8.021071" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="530.909091" y="303.276386" text-anchor="middle" font-family="sans-serif" font-size="30.205616" font-weight="bold" fill="var(--text)">Heap  ↑  (grows up)</text>
  <text x="1021.818182" y="298.327675" text-anchor="middle" font-family="monospace" font-size="17.426312" fill="var(--text-muted)">malloc / new</text>
  <rect x="203.636218" y="346.825947" width="872.727273" height="87.099" rx="8.021071" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="530.909091" y="396.314035" text-anchor="middle" font-family="sans-serif" font-size="30.205616" font-weight="bold" fill="var(--text)">.bss</text>
  <text x="1021.818182" y="391.365202" text-anchor="middle" font-family="monospace" font-size="17.426312" fill="var(--text-muted)">uninitialized globals (zeroed)</text>
  <rect x="203.636218" y="439.863474" width="872.727273" height="87.099" rx="8.021071" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="530.909091" y="489.351561" text-anchor="middle" font-family="sans-serif" font-size="30.205616" font-weight="bold" fill="var(--text)">.data</text>
  <text x="1021.818182" y="484.402728" text-anchor="middle" font-family="monospace" font-size="17.426312" fill="var(--text-muted)">initialized globals</text>
  <text x="40" y="542.798667" font-family="monospace" font-size="18.58803" fill="var(--text-faint)">Low address (RAM)</text>
  <rect x="40" y="564.573386" width="1200" height="55.426614" rx="8.021071" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="592.286754" text-anchor="middle" font-family="sans-serif" font-size="20.911601" font-weight="bold" fill="var(--primary-accent)">Stack overflow: stack grows into heap — silent data corruption in embedded systems</text>
  <text x="640" y="612.081842" text-anchor="middle" font-family="sans-serif" font-size="17.426312" fill="var(--text-muted)">Use MPU stack guard regions or canary values to detect overflow early</text>
</svg>
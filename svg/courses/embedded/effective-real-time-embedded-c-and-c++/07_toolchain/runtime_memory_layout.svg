<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="177.7778" y="26.6667" font-family="monospace" font-size="14.2222" fill="#9e9e9e">High address (RAM)</ns0:text>
  <ns0:rect x="284.4444" y="35.5556" width="568.8889" height="78.2222" rx="3.5556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="80" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#ffffff">Stack  ↓  (grows down)</ns0:text>
  <ns0:text x="817.7778" y="75.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#bbdefb">local vars, return addr</ns0:text>
  <ns0:rect x="284.4444" y="119.1111" width="568.8889" height="94.2222" rx="3.5556" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" stroke-dasharray="5.3333 2.6667" />
  <ns0:text x="568.8889" y="168.8889" text-anchor="middle" font-family="sans-serif" font-size="19.5556" fill="#9e9e9e">Free Space</ns0:text>
  <ns0:line x1="568.8889" y1="128.8889" x2="568.8889" y2="151.1111" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:line x1="568.8889" y1="203.5556" x2="568.8889" y2="181.3333" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="284.4444" y="218.6667" width="568.8889" height="78.2222" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="263.1111" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">Heap  ↑  (grows up)</ns0:text>
  <ns0:text x="817.7778" y="258.6667" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#555555">malloc / new</ns0:text>
  <ns0:rect x="284.4444" y="302.2222" width="568.8889" height="78.2222" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="346.6667" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">.bss</ns0:text>
  <ns0:text x="817.7778" y="342.2222" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#555555">uninitialized globals (zeroed)</ns0:text>
  <ns0:rect x="284.4444" y="385.7778" width="568.8889" height="78.2222" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="430.2222" text-anchor="middle" font-family="sans-serif" font-size="23.1111" font-weight="bold" fill="#212121">.data</ns0:text>
  <ns0:text x="817.7778" y="425.7778" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#555555">initialized globals</ns0:text>
  <ns0:text x="177.7778" y="478.2222" font-family="monospace" font-size="14.2222" fill="#9e9e9e">Low address (RAM)</ns0:text>
  <ns0:rect x="177.7778" y="497.7778" width="782.2222" height="49.7778" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="522.6667" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">Stack overflow: stack grows into heap — silent data corruption in embedded systems</ns0:text>
  <ns0:text x="568.8889" y="540.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Use MPU stack guard regions or canary values to detect overflow early</ns0:text>
</ns0:svg>
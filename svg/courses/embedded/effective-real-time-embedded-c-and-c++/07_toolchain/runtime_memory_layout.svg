<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="227.5" y="64.1667" font-family="monospace" font-size="13.9044" fill="var(--text-faint)">High address (RAM)</text>
  <rect x="339.9999" y="72.2223" width="600" height="70.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="565" y="112.5" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--bg)">Stack  ↓  (grows down)</text>
  <text x="902.5" y="108.4723" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">local vars, return addr</text>
  <rect x="339.9999" y="147.9444" width="600" height="85.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="5.3333 2.6667" />
  <text x="640" y="193.0556" text-anchor="middle" font-family="sans-serif" font-size="19.1186" fill="var(--text-faint)">Free Space</text>
  <line x1="640" y1="156.8056" x2="640" y2="176.9444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="640" y1="224.4723" x2="640" y2="204.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="339.9999" y="238.1667" width="600" height="70.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="565" y="278.4444" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">Heap  ↑  (grows up)</text>
  <text x="902.5" y="274.4167" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">malloc / new</text>
  <rect x="339.9999" y="313.8889" width="600" height="70.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="565" y="354.1667" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">.bss</text>
  <text x="902.5" y="350.1389" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">uninitialized globals (zeroed)</text>
  <rect x="339.9999" y="389.6111" width="600" height="70.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="565" y="429.8889" text-anchor="middle" font-family="sans-serif" font-size="22.5947" font-weight="bold" fill="var(--text)">.data</text>
  <text x="902.5" y="425.8611" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">initialized globals</text>
  <text x="227.5" y="473.3889" font-family="monospace" font-size="13.9044" fill="var(--text-faint)">Low address (RAM)</text>
  <rect x="227.5" y="491.1111" width="825" height="45.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="513.6667" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">Stack overflow: stack grows into heap — silent data corruption in embedded systems</text>
  <text x="640" y="529.7777" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">Use MPU stack guard regions or canary values to detect overflow early</text>
</svg>
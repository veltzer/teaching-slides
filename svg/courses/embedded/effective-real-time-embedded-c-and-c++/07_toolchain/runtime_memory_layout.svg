<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="200" y="30" font-family="monospace" font-size="16" fill="#9e9e9e">High address (RAM)</text>

  <!-- Stack -->
  <rect x="320" y="40" width="640" height="88" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="560" y="90" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Stack  ↓  (grows down)</text>
  <text x="920" y="85" text-anchor="middle" font-family="monospace" font-size="15" fill="#bbdefb">local vars, return addr</text>

  <!-- Free space -->
  <rect x="320" y="134" width="640" height="106" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="640" y="190" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#9e9e9e">Free Space</text>
  <!-- growth arrows -->
  <line x1="640" y1="145" x2="640" y2="170" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="640" y1="229" x2="640" y2="204" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Heap -->
  <rect x="320" y="246" width="640" height="88" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="296" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">Heap  ↑  (grows up)</text>
  <text x="920" y="291" text-anchor="middle" font-family="monospace" font-size="15" fill="#555555">malloc / new</text>

  <!-- BSS -->
  <rect x="320" y="340" width="640" height="88" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="390" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">.bss</text>
  <text x="920" y="385" text-anchor="middle" font-family="monospace" font-size="15" fill="#555555">uninitialized globals (zeroed)</text>

  <!-- Data -->
  <rect x="320" y="434" width="640" height="88" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="484" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#212121">.data</text>
  <text x="920" y="479" text-anchor="middle" font-family="monospace" font-size="15" fill="#555555">initialized globals</text>

  <text x="200" y="538" font-family="monospace" font-size="16" fill="#9e9e9e">Low address (RAM)</text>

  <!-- Note -->
  <rect x="200" y="560" width="880" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="588" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Stack overflow: stack grows into heap — silent data corruption in embedded systems</text>
  <text x="640" y="608" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Use MPU stack guard regions or canary values to detect overflow early</text>
</svg>

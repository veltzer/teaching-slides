<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Runtime Memory</text>
  <rect x="320" y="120" width="640" height="96" fill="#ffcccc" stroke="#333" />
  <text x="640" y="180" text-anchor="middle" font-size="33.6">Stack (grows down ↓)</text>
  <rect x="320" y="216" width="640" height="144" fill="#f0f0f0" stroke="#333" />
  <text x="640" y="300" text-anchor="middle" font-size="33.6">Free Space</text>
  <rect x="320" y="360" width="640" height="96" fill="#ccffcc" stroke="#333" />
  <text x="640" y="420" text-anchor="middle" font-size="33.6">Heap (grows up ↑)</text>
  <rect x="320" y="456" width="640" height="96" fill="#ccccff" stroke="#333" />
  <text x="640" y="516" text-anchor="middle" font-size="33.6">BSS (zeroed)</text>
  <rect x="320" y="552" width="640" height="96" fill="#ffffcc" stroke="#333" />
  <text x="640" y="612" text-anchor="middle" font-size="33.6">Data (initialized)</text>
</svg>
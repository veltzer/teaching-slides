<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <text x="200" y="30" text-anchor="middle" font-size="18" font-weight="bold">Optimization Trade-offs</text>
  <polygon points="200,80 100,220 300,220" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="200" cy="80" r="40" fill="#ffcccc" stroke="#333"/>
  <text x="200" y="85" text-anchor="middle" font-size="14">Speed</text>
  <circle cx="100" cy="220" r="40" fill="#ccffcc" stroke="#333"/>
  <text x="100" y="225" text-anchor="middle" font-size="14">Size</text>
  <circle cx="300" cy="220" r="40" fill="#ccccff" stroke="#333"/>
  <text x="300" y="225" text-anchor="middle" font-size="14">Power</text>
  <text x="200" y="150" text-anchor="middle" font-size="12">Choose Two!</text>
</svg>

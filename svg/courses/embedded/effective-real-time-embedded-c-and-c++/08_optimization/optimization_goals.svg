<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="22" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#555555">In embedded systems you rarely get all three at once — pick your priority</text>

  <!-- Triangle outline -->
  <polygon points="640,140 240,580 1040,580" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Speed (top) -->
  <circle cx="640" cy="90" r="110" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="82" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Speed</text>
  <text x="640" y="112" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">execution time</text>
  <text x="640" y="133" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbdefb">throughput</text>

  <!-- Size (bottom-left) -->
  <circle cx="272" cy="500" r="110" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="272" y="492" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#212121">Size</text>
  <text x="272" y="520" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">code &amp; RAM</text>
  <text x="272" y="541" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">footprint</text>

  <!-- Power (bottom-right) -->
  <circle cx="1008" cy="500" r="110" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1008" y="492" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#212121">Power</text>
  <text x="1008" y="520" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">mW / mAh</text>
  <text x="1008" y="541" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555555">battery life</text>

  <!-- Center label -->
  <text x="640" y="318" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#9e9e9e">Choose</text>
  <text x="640" y="344" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#9e9e9e">Two!</text>

  <!-- Trade-off note -->
  <rect x="200" y="582" width="880" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="612" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1565c0">Faster code often needs more Flash (loop unrolling) or more power (higher clock speed)</text>
</svg>

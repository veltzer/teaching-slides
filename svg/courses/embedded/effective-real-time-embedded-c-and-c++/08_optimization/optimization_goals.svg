<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="568.8889" y="19.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" fill="var(--text-muted)">In embedded systems you rarely get all three at once — pick your priority</text>
  <polygon points="568.8889,124.4444 213.3333,515.5556 924.4444,515.5556" fill="none" stroke="var(--border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" />
  <circle cx="568.8889" cy="80" r="97.7778" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="568.8889" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="26.6667" font-weight="bold" fill="var(--bg)">Speed</text>
  <text x="568.8889" y="99.5556" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">execution time</text>
  <text x="568.8889" y="118.2222" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">throughput</text>
  <circle cx="241.7778" cy="444.4444" r="97.7778" fill="url(#grad-surface)" stroke="var(--primary-border)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="241.7778" y="437.3333" text-anchor="middle" font-family="sans-serif" font-size="26.6667" font-weight="bold" fill="var(--text)">Size</text>
  <text x="241.7778" y="462.2222" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">code &amp; RAM</text>
  <text x="241.7778" y="480.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">footprint</text>
  <circle cx="896" cy="444.4444" r="97.7778" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="896" y="437.3333" text-anchor="middle" font-family="sans-serif" font-size="26.6667" font-weight="bold" fill="var(--text)">Power</text>
  <text x="896" y="462.2222" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">mW / mAh</text>
  <text x="896" y="480.8889" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text-muted)">battery life</text>
  <text x="568.8889" y="282.6667" text-anchor="middle" font-family="sans-serif" font-size="19.5556" fill="var(--text-faint)">Choose</text>
  <text x="568.8889" y="305.7778" text-anchor="middle" font-family="sans-serif" font-size="19.5556" fill="var(--text-faint)">Two!</text>
  <rect x="177.7778" y="517.3333" width="782.2222" height="42.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="544" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">Faster code often needs more Flash (loop unrolling) or more power (higher clock speed)</text>
</svg>
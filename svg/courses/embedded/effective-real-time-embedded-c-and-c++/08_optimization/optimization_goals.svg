<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="555.9014" fill="var(--bg)" rx="5.9964" x="40" y="64.0986"/>
  <text x="640" y="81.0846" text-anchor="middle" font-size="17.0156" fill="var(--text-muted)" font-family="Arial, sans-serif">In embedded systems you rarely get all three at once — pick your priority</text>
  <polygon points="640,172.1905 265,511.9081 1014.9999,511.9081" fill="none" stroke="var(--border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556"/>
  <rect x="546.414" y="40" width="187.172" height="187.172" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="127.4096" text-anchor="middle" font-size="25.5235" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Speed</text>
  <text x="640" y="150.5722" text-anchor="middle" font-size="14.4633" fill="var(--primary-accent)" font-family="Arial, sans-serif">execution time</text>
  <text x="640" y="166.7859" text-anchor="middle" font-size="14.4633" fill="var(--primary-accent)" font-family="Arial, sans-serif">throughput</text>
  <rect x="201.414" y="356.555" width="187.172" height="187.172" rx="14" fill="url(#grad-surface)" stroke="var(--primary-border)" stroke-width="1.7778"/>
  <text x="295" y="443.9645" text-anchor="middle" font-size="25.5235" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Size</text>
  <text x="295" y="465.5829" text-anchor="middle" font-size="14.4633" fill="var(--text-muted)" font-family="Arial, sans-serif">code &amp; RAM</text>
  <text x="295" y="481.7967" text-anchor="middle" font-size="14.4633" fill="var(--text-muted)" font-family="Arial, sans-serif">footprint</text>
  <rect x="891.414" y="356.555" width="187.172" height="187.172" rx="14" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.7778"/>
  <text x="985" y="443.9645" text-anchor="middle" font-size="25.5235" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Power</text>
  <text x="985" y="465.5829" text-anchor="middle" font-size="14.4633" fill="var(--text-muted)" font-family="Arial, sans-serif">mW / mAh</text>
  <text x="985" y="481.7967" text-anchor="middle" font-size="14.4633" fill="var(--text-muted)" font-family="Arial, sans-serif">battery life</text>
  <text x="640" y="309.6218" text-anchor="middle" font-size="18.7173" fill="var(--text-faint)" font-family="Arial, sans-serif">Choose</text>
  <text x="640" y="329.696" text-anchor="middle" font-size="18.7173" fill="var(--text-faint)" font-family="Arial, sans-serif">Two!</text>
  <rect x="227.5" y="513.4522" width="825" height="37.0601" rx="5.9964" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="536.6149" text-anchor="middle" font-size="14.4633" fill="var(--primary-accent)" font-family="Arial, sans-serif">Faster code often needs more Flash (loop unrolling) or more power (higher clock speed)</text>
</svg>

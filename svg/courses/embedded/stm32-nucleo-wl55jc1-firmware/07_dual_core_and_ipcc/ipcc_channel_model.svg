<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.943346075365" font-weight="bold" fill="var(--text)">IPCC: Doorbell, Shared RAM: Parcel</text>
  <rect x="40" y="206.666666666667" width="362.264150943396" height="173.333333333333" rx="7.371541402007" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.132075471698" y="284.933333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.028985140694" font-weight="bold" fill="var(--primary-text)">CPU1 (M4)</text>
  <text x="221.132075471698" y="322.266666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.028985140694" fill="var(--primary-text)">application</text>
  <rect x="877.735849056604" y="206.666666666667" width="362.264150943396" height="173.333333333333" rx="7.371541402007" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.867924528302" y="284.933333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.028985140694" font-weight="bold" fill="var(--warn-text)">CPU2 (M0+)</text>
  <text x="1058.867924528302" y="322.266666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.028985140694" fill="var(--warn-text)">radio stack</text>
  <rect x="470.188679245283" y="113.333333333333" width="339.622641509434" height="120" rx="7.371541402007" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="164.933333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.028985140694" font-weight="bold" fill="var(--info-text)">IPCC channels</text>
  <text x="640" y="202.266666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.028985140694" fill="var(--info-text)">(the doorbell)</text>
  <rect x="470.188679245283" y="420" width="339.622641509434" height="120" rx="7.371541402007" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="471.6" text-anchor="middle" font-family="Courier New, monospace" font-size="27.028985140694" font-weight="bold" fill="var(--text)">Shared SRAM</text>
  <text x="640" y="508.933333333333" text-anchor="middle" font-family="Courier New, monospace" font-size="27.028985140694" fill="var(--text)">(the parcel)</text>
  <line x1="402.264150943396" y1="260" x2="470.188679245283" y2="193.333333333333" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="809.811320754717" y1="193.333333333333" x2="877.735849056604" y2="260" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="402.264150943396" y1="340" x2="470.188679245283" y2="460" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="877.735849056604" y1="340" x2="809.811320754717" y2="460" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.028985140694" font-style="italic" fill="var(--text-muted)">IPCC carries signals, not data</text>
</svg>

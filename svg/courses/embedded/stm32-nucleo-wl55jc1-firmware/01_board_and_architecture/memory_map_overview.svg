<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="651.764705882353" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.327731859797" font-weight="bold" fill="var(--text)">STM32WL55 Address Space (shared by both cores)</text>
  <rect x="40" y="89.36170212766" width="541.176470588235" height="111.063829787234" rx="7.22947658303" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310.588235294118" y="137.11914893617" text-anchor="middle" font-family="Courier New, monospace" font-size="26.508080804444" font-weight="bold" fill="var(--primary-text)">Flash  256 KB</text>
  <text x="310.588235294118" y="171.672340425532" text-anchor="middle" font-family="Courier New, monospace" font-size="26.508080804444" fill="var(--primary-text)">0x08000000</text>
  <rect x="40" y="225.106382978723" width="541.176470588235" height="111.063829787234" rx="7.22947658303" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310.588235294118" y="272.863829787234" text-anchor="middle" font-family="Courier New, monospace" font-size="26.508080804444" font-weight="bold" fill="var(--ok-text)">SRAM1  32 KB</text>
  <text x="310.588235294118" y="307.417021276596" text-anchor="middle" font-family="Courier New, monospace" font-size="26.508080804444" fill="var(--ok-text)">0x20000000</text>
  <rect x="40" y="360.851063829787" width="541.176470588235" height="111.063829787234" rx="7.22947658303" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310.588235294118" y="408.608510638298" text-anchor="middle" font-family="Courier New, monospace" font-size="26.508080804444" font-weight="bold" fill="var(--ok-text)">SRAM2  32 KB</text>
  <text x="310.588235294118" y="443.16170212766" text-anchor="middle" font-family="Courier New, monospace" font-size="26.508080804444" fill="var(--ok-text)">0x20008000</text>
  <rect x="40" y="496.595744680851" width="541.176470588235" height="111.063829787234" rx="7.22947658303" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310.588235294118" y="544.353191489362" text-anchor="middle" font-family="Courier New, monospace" font-size="26.508080804444" font-weight="bold" fill="var(--info-text)">Peripherals</text>
  <text x="310.588235294118" y="578.906382978723" text-anchor="middle" font-family="Courier New, monospace" font-size="26.508080804444" fill="var(--info-text)">0x40000000  (APB/AHB)</text>
  <rect x="745.882352941177" y="138.723404255319" width="494.117647058824" height="135.744680851064" rx="7.22947658303" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="992.941176470588" y="198.821276595745" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.508080804444" font-weight="bold" fill="var(--primary-text)">Cortex-M4 (CPU1)</text>
  <text x="992.941176470588" y="233.374468085106" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.508080804444" fill="var(--primary-text)">application core</text>
  <rect x="745.882352941177" y="323.829787234043" width="494.117647058824" height="135.744680851064" rx="7.22947658303" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="992.941176470588" y="383.927659574468" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.508080804444" font-weight="bold" fill="var(--warn-text)">Cortex-M0+ (CPU2)</text>
  <text x="992.941176470588" y="418.48085106383" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.508080804444" fill="var(--warn-text)">network / radio core</text>
  <rect x="745.882352941177" y="508.936170212766" width="494.117647058824" height="111.063829787234" rx="7.22947658303" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="992.941176470588" y="556.693617021277" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.508080804444" font-weight="bold" fill="var(--text)">Both cores see</text>
  <text x="992.941176470588" y="591.246808510638" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.508080804444" fill="var(--text)">the same memory</text>
  <line x1="581.176470588235" y1="144.893617021277" x2="745.882352941177" y2="200.425531914894" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="581.176470588235" y1="416.382978723404" x2="745.882352941177" y2="385.531914893617" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

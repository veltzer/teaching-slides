<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="725.714285714286" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.784815835098" font-weight="bold" fill="var(--text)">Dual-Core Boot Sequence</text>
  <rect x="40" y="144.102564102564" width="367.34693877551" height="163.589743589744" rx="8.096746250378" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.673469387755" y="216.528205128205" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.68806958472" font-weight="bold" fill="var(--info-text)">Reset</text>
  <text x="223.673469387755" y="258.169230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.68806958472" fill="var(--info-text)">releases CPU1</text>
  <rect x="456.326530612245" y="144.102564102564" width="367.34693877551" height="163.589743589744" rx="8.096746250378" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="216.528205128205" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.68806958472" font-weight="bold" fill="var(--primary-text)">CPU1 (M4)</text>
  <text x="640" y="258.169230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.68806958472" fill="var(--primary-text)">boots, runs main()</text>
  <rect x="872.65306122449" y="144.102564102564" width="367.34693877551" height="163.589743589744" rx="8.096746250378" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.326530612245" y="216.528205128205" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.68806958472" font-weight="bold" fill="var(--primary-text)">CPU1 sets</text>
  <text x="1056.326530612245" y="258.169230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.68806958472" fill="var(--primary-text)">C2BOOT bit</text>
  <rect x="456.326530612245" y="456.410256410256" width="367.34693877551" height="163.589743589744" rx="8.096746250378" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="528.835897435897" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.68806958472" font-weight="bold" fill="var(--warn-text)">CPU2 (M0+)</text>
  <text x="640" y="570.476923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.68806958472" fill="var(--warn-text)">starts main()</text>
  <rect x="872.65306122449" y="456.410256410256" width="367.34693877551" height="163.589743589744" rx="8.096746250378" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.326530612245" y="528.835897435897" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.68806958472" font-weight="bold" fill="var(--ok-text)">Both cores</text>
  <text x="1056.326530612245" y="570.476923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.68806958472" fill="var(--ok-text)">run in parallel</text>
  <line x1="407.34693877551" y1="225.897435897436" x2="456.326530612245" y2="225.897435897436" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="823.673469387755" y1="225.897435897436" x2="872.65306122449" y2="225.897435897436" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1056.326530612245" y1="307.692307692308" x2="799.183673469388" y2="456.410256410256" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="823.673469387755" y1="538.205128205128" x2="872.65306122449" y2="538.205128205128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="456.410256410256" width="367.34693877551" height="163.589743589744" rx="8.096746250378" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.673469387755" y="528.835897435897" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.68806958472" font-weight="bold" fill="var(--danger-text)">If C2BOOT unset:</text>
  <text x="223.673469387755" y="570.476923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.68806958472" fill="var(--danger-text)">CPU2 stays asleep</text>
  <line x1="640" y1="307.692307692308" x2="640" y2="456.410256410256" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

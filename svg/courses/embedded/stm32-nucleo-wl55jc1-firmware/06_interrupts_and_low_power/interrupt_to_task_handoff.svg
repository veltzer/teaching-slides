<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="35.433804945332" font-weight="bold" fill="var(--text)">Keep ISRs Short: Defer Work</text>
  <rect x="40" y="209.756097560976" width="339.622641509434" height="155.609756097561" rx="7.592958202571" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.811320754717" y="278.648780487805" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.840846742761" font-weight="bold" fill="var(--warn-text)">Hardware event</text>
  <text x="209.811320754717" y="318.258536585366" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.840846742761" fill="var(--warn-text)">(pin / timer)</text>
  <rect x="470.188679245283" y="209.756097560976" width="339.622641509434" height="155.609756097561" rx="7.592958202571" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="278.648780487805" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.840846742761" font-weight="bold" fill="var(--danger-text)">ISR</text>
  <text x="640" y="318.258536585366" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.840846742761" fill="var(--danger-text)">set flag, return</text>
  <rect x="900.377358490566" y="209.756097560976" width="339.622641509434" height="155.609756097561" rx="7.592958202571" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.188679245283" y="278.648780487805" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.840846742761" font-weight="bold" fill="var(--ok-text)">Main loop</text>
  <text x="1070.188679245283" y="318.258536585366" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.840846742761" fill="var(--ok-text)">does the work</text>
  <line x1="379.622641509434" y1="287.560975609756" x2="470.188679245283" y2="287.560975609756" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="809.811320754717" y1="287.560975609756" x2="900.377358490566" y2="287.560975609756" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="174.390243902439" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.309860675237" fill="var(--danger-border)">short &amp; fast</text>
  <rect x="470.188679245283" y="492.682926829268" width="339.622641509434" height="127.317073170732" rx="7.592958202571" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="547.429268292683" text-anchor="middle" font-family="Courier New, monospace" font-size="27.840846742761" font-weight="bold" fill="var(--text)">volatile flag</text>
  <text x="640" y="587.039024390244" text-anchor="middle" font-family="Courier New, monospace" font-size="27.840846742761" fill="var(--text)">in shared state</text>
  <line x1="640" y1="365.365853658537" x2="640" y2="492.682926829268" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900.377358490566" y1="520.975609756098" x2="809.811320754717" y2="421.951219512195" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.367038618225" font-weight="bold" fill="var(--text)">Both Linker Scripts Reserve The Same Region</text>
  <rect x="40" y="138.723404255319" width="407.547169811321" height="135.744680851064" rx="7.091759654556" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.77358490566" y="199.191489361702" text-anchor="middle" font-family="Courier New, monospace" font-size="23.639198848521" font-weight="bold" fill="var(--primary-text)">CPU1 linker</text>
  <text x="243.77358490566" y="231.276595744681" text-anchor="middle" font-family="Courier New, monospace" font-size="23.639198848521" fill="var(--primary-text)">RAM_SHARED @ 0x2000F800</text>
  <rect x="832.452830188679" y="138.723404255319" width="407.547169811321" height="135.744680851064" rx="7.091759654556" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036.22641509434" y="199.191489361702" text-anchor="middle" font-family="Courier New, monospace" font-size="23.639198848521" font-weight="bold" fill="var(--warn-text)">CPU2 linker</text>
  <text x="1036.22641509434" y="231.276595744681" text-anchor="middle" font-family="Courier New, monospace" font-size="23.639198848521" fill="var(--warn-text)">RAM_SHARED @ 0x2000F800</text>
  <rect x="413.584905660377" y="360.851063829787" width="452.830188679245" height="185.106382978723" rx="7.091759654556" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="428.353191489362" text-anchor="middle" font-family="Courier New, monospace" font-size="26.003118733373" font-weight="bold" fill="var(--text)">RAM_SHARED</text>
  <text x="640" y="462.906382978723" text-anchor="middle" font-family="Courier New, monospace" font-size="26.003118733373" fill="var(--text)">shared_block_t</text>
  <text x="640" y="497.459574468085" text-anchor="middle" font-family="Courier New, monospace" font-size="26.003118733373" fill="var(--text)">cmd / len / payload</text>
  <line x1="243.77358490566" y1="274.468085106383" x2="526.792452830189" y2="360.851063829787" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="1036.22641509434" y1="274.468085106383" x2="753.207547169811" y2="360.851063829787" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.003118733373" font-style="italic" fill="var(--text-muted)">identical struct layout on both sides</text>
</svg>

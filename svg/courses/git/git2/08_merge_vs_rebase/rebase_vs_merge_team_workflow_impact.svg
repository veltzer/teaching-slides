<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="317.001831" y="40" text-anchor="middle" font-size="28.906743" font-weight="bold">Merge Workflow</text>
  <text x="1046.356419" y="40" text-anchor="middle" font-size="28.906743" font-weight="bold">Rebase Workflow</text>
  <rect x="40" y="152.371" width="33.036499" height="33.0364" rx="14.000021" fill="var(--primary-fill)"/>
  <rect x="185.870438" y="152.371" width="33.036499" height="33.0364" rx="14.000021" fill="var(--danger-fill)"/>
  <rect x="331.741875" y="152.371" width="33.036499" height="33.0364" rx="14.000021" fill="var(--ok-fill)"/>
  <rect x="477.612313" y="152.371" width="33.036499" height="33.0364" rx="14.000021" fill="var(--warn-fill)"/>
  <rect x="185.870438" y="345.704" width="33.036499" height="33.0364" rx="14.000021" fill="var(--info-fill)"/>
  <rect x="331.741875" y="345.704" width="33.036499" height="33.0364" rx="14.000021" fill="var(--text-muted)"/>
  <rect x="477.612313" y="345.704" width="33.036499" height="33.0364" rx="14.000021" fill="var(--warn-fill)"/>
  <rect x="560.967563" y="249.037" width="33.036499" height="33.0364" rx="14.000021" fill="var(--text-faint)"/>
  <rect x="769.354188" y="152.371" width="33.036499" height="33.0364" rx="14.000021" fill="var(--primary-fill)"/>
  <rect x="915.225626" y="152.371" width="33.036499" height="33.0364" rx="14.000021" fill="var(--danger-fill)"/>
  <rect x="1061.093063" y="152.371" width="33.036499" height="33.0364" rx="14.000021" fill="var(--ok-fill)"/>
  <rect x="1206.963501" y="152.371" width="33.036499" height="33.0364" rx="14.000021" fill="var(--warn-fill)"/>
  <rect x="1206.963501" y="345.704" width="33.036499" height="33.0364" rx="14.000021" fill="var(--info-fill)"/>
  <rect x="1206.963501" y="539.037" width="33.036499" height="33.0364" rx="14.000021" fill="var(--text-muted)"/>
  <text x="317.001831" y="620" text-anchor="middle" font-size="24.777337">Complex, branched</text>
  <text x="1046.356419" y="620" text-anchor="middle" font-size="24.777337">Simple, linear</text>
</svg>
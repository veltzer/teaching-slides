<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="289.0641" y="151.5" text-anchor="middle" font-size="31.7155" font-weight="bold">Before Rebase</text>
  <text x="968.2948" y="151.5" text-anchor="middle" font-size="31.7155" font-weight="bold">After Rebase</text>
  <circle cx="62.6539" cy="279" r="22.6539" fill="var(--primary-fill)" />
  <text x="62.6539" y="291.7501" text-anchor="middle" fill="var(--bg)" font-size="22.6539">A</text>
  <circle cx="221.141" cy="279" r="22.6539" fill="var(--danger-fill)" />
  <text x="221.141" y="291.7501" text-anchor="middle" fill="var(--bg)" font-size="22.6539">B</text>
  <circle cx="379.6282" cy="279" r="22.6539" fill="var(--ok-fill)" />
  <text x="379.6282" y="291.7501" text-anchor="middle" fill="var(--bg)" font-size="22.6539">C</text>
  <circle cx="221.141" cy="432" r="22.6539" fill="var(--warn-fill)" />
  <text x="221.141" y="444.7499" text-anchor="middle" fill="var(--bg)" font-size="22.6539">X</text>
  <circle cx="379.6282" cy="432" r="22.6539" fill="var(--info-fill)" />
  <text x="379.6282" y="444.7499" text-anchor="middle" fill="var(--bg)" font-size="22.6539">Y</text>
  <circle cx="741.8846" cy="279" r="22.6539" fill="var(--primary-fill)" />
  <text x="741.8846" y="291.7501" text-anchor="middle" fill="var(--bg)" font-size="22.6539">A</text>
  <circle cx="900.3717" cy="279" r="22.6539" fill="var(--danger-fill)" />
  <text x="900.3717" y="291.7501" text-anchor="middle" fill="var(--bg)" font-size="22.6539">B</text>
  <circle cx="1058.8589" cy="279" r="22.6539" fill="var(--ok-fill)" />
  <text x="1058.8589" y="291.7501" text-anchor="middle" fill="var(--bg)" font-size="22.6539">C</text>
  <circle cx="1217.3461" cy="279" r="22.6539" fill="var(--warn-fill)" />
  <text x="1217.3461" y="291.7501" text-anchor="middle" fill="var(--bg)" font-size="22.6539">X'</text>
  <circle cx="1217.3461" cy="432" r="22.6539" fill="var(--info-fill)" />
  <text x="1217.3461" y="444.7499" text-anchor="middle" fill="var(--bg)" font-size="22.6539">Y'</text>
  <line x1="85.2949" y1="279" x2="198.5" y2="279" stroke="var(--text)" />
  <line x1="243.782" y1="279" x2="356.9871" y2="279" stroke="var(--text)" />
  <line x1="221.141" y1="304.5" x2="221.141" y2="406.5" stroke="var(--text)" />
  <line x1="243.782" y1="432" x2="356.9871" y2="432" stroke="var(--text)" />
  <line x1="764.5256" y1="279" x2="877.7308" y2="279" stroke="var(--text)" />
  <line x1="923.0128" y1="279" x2="1036.2179" y2="279" stroke="var(--text)" />
  <line x1="1081.5" y1="279" x2="1194.705" y2="279" stroke="var(--text)" />
  <line x1="1217.3461" y1="304.5" x2="1217.3461" y2="406.5" stroke="var(--text)" />
  <text x="221.141" y="355.5" text-anchor="middle" font-size="22.6539">main</text>
  <text x="379.6282" y="508.5" text-anchor="middle" font-size="22.6539">feature</text>
  <text x="900.3717" y="355.5" text-anchor="middle" font-size="22.6539">main</text>
  <text x="1217.3461" y="508.5" text-anchor="middle" font-size="22.6539">feature</text>
</svg>
  <text x="221.132" y="444.6226" text-anchor="middle" fill="var(--bg)" font-size="22.6415">X</text>
  <circle cx="379.6226" cy="431.8868" r="22.6415" fill="var(--info-fill)" />
  <text x="379.6226" y="444.6226" text-anchor="middle" fill="var(--bg)" font-size="22.6415">Y</text>
  <circle cx="741.8868" cy="279.0566" r="22.6415" fill="var(--primary-fill)" />
  <text x="741.8868" y="291.7925" text-anchor="middle" fill="var(--bg)" font-size="22.6415">A</text>
  <circle cx="900.3773" cy="279.0566" r="22.6415" fill="var(--danger-fill)" />
  <text x="900.3773" y="291.7925" text-anchor="middle" fill="var(--bg)" font-size="22.6415">B</text>
  <circle cx="1058.8679" cy="279.0566" r="22.6415" fill="var(--ok-fill)" />
  <text x="1058.8679" y="291.7925" text-anchor="middle" fill="var(--bg)" font-size="22.6415">C</text>
  <circle cx="1217.3585" cy="279.0566" r="22.6415" fill="var(--warn-fill)" />
  <text x="1217.3585" y="291.7925" text-anchor="middle" fill="var(--bg)" font-size="22.6415">X'</text>
  <circle cx="1217.3585" cy="431.8868" r="22.6415" fill="var(--info-fill)" />
  <text x="1217.3585" y="444.6226" text-anchor="middle" fill="var(--bg)" font-size="22.6415">Y'</text>
  <line x1="85.283" y1="279.0566" x2="198.4905" y2="279.0566" stroke="var(--text)" />
  <line x1="243.7735" y1="279.0566" x2="356.9811" y2="279.0566" stroke="var(--text)" />
  <line x1="221.132" y1="304.5283" x2="221.132" y2="406.4151" stroke="var(--text)" />
  <line x1="243.7735" y1="431.8868" x2="356.9811" y2="431.8868" stroke="var(--text)" />
  <line x1="764.5283" y1="279.0566" x2="877.7359" y2="279.0566" stroke="var(--text)" />
  <line x1="923.0188" y1="279.0566" x2="1036.2264" y2="279.0566" stroke="var(--text)" />
  <line x1="1081.5095" y1="279.0566" x2="1194.7169" y2="279.0566" stroke="var(--text)" />
  <line x1="1217.3585" y1="304.5283" x2="1217.3585" y2="406.4151" stroke="var(--text)" />
  <text x="221.132" y="355.4717" text-anchor="middle" font-size="22.6415">main</text>
  <text x="379.6226" y="508.3019" text-anchor="middle" font-size="22.6415">feature</text>
  <text x="900.3773" y="355.4717" text-anchor="middle" font-size="22.6415">main</text>
  <text x="1217.3585" y="508.3019" text-anchor="middle" font-size="22.6415">feature</text>
</svg>
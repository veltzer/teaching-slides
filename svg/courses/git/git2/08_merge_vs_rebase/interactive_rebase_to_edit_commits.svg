<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="320" y="72" text-anchor="middle" font-size="29.8667" font-weight="bold">Before Rebase</text>
  <text x="960" y="72" text-anchor="middle" font-size="29.8667" font-weight="bold">After Rebase</text>
  <circle cx="106.6667" cy="192" r="21.3333" fill="var(--primary-fill)" />
  <text x="106.6667" y="204" text-anchor="middle" fill="var(--bg)" font-size="21.3333">A</text>
  <circle cx="256" cy="192" r="21.3333" fill="var(--danger-fill)" />
  <text x="256" y="204" text-anchor="middle" fill="var(--bg)" font-size="21.3333">B</text>
  <circle cx="405.3333" cy="192" r="21.3333" fill="var(--ok-fill)" />
  <text x="405.3333" y="204" text-anchor="middle" fill="var(--bg)" font-size="21.3333">C</text>
  <circle cx="256" cy="336" r="21.3333" fill="var(--warn-fill)" />
  <text x="256" y="348" text-anchor="middle" fill="var(--bg)" font-size="21.3333">X</text>
  <circle cx="405.3333" cy="336" r="21.3333" fill="var(--info-fill)" />
  <text x="405.3333" y="348" text-anchor="middle" fill="var(--bg)" font-size="21.3333">Y</text>
  <circle cx="746.6667" cy="192" r="21.3333" fill="var(--primary-fill)" />
  <text x="746.6667" y="204" text-anchor="middle" fill="var(--bg)" font-size="21.3333">A</text>
  <circle cx="896" cy="192" r="21.3333" fill="var(--danger-fill)" />
  <text x="896" y="204" text-anchor="middle" fill="var(--bg)" font-size="21.3333">B</text>
  <circle cx="1045.3333" cy="192" r="21.3333" fill="var(--ok-fill)" />
  <text x="1045.3333" y="204" text-anchor="middle" fill="var(--bg)" font-size="21.3333">C</text>
  <circle cx="1194.6667" cy="192" r="21.3333" fill="var(--warn-fill)" />
  <text x="1194.6667" y="204" text-anchor="middle" fill="var(--bg)" font-size="21.3333">X'</text>
  <circle cx="1194.6667" cy="336" r="21.3333" fill="var(--info-fill)" />
  <text x="1194.6667" y="348" text-anchor="middle" fill="var(--bg)" font-size="21.3333">Y'</text>
  <line x1="128" y1="192" x2="234.6667" y2="192" stroke="var(--text)" />
  <line x1="277.3333" y1="192" x2="384" y2="192" stroke="var(--text)" />
  <line x1="256" y1="216" x2="256" y2="312" stroke="var(--text)" />
  <line x1="277.3333" y1="336" x2="384" y2="336" stroke="var(--text)" />
  <line x1="768" y1="192" x2="874.6667" y2="192" stroke="var(--text)" />
  <line x1="917.3333" y1="192" x2="1024" y2="192" stroke="var(--text)" />
  <line x1="1066.6667" y1="192" x2="1173.3333" y2="192" stroke="var(--text)" />
  <line x1="1194.6667" y1="216" x2="1194.6667" y2="312" stroke="var(--text)" />
  <text x="256" y="264" text-anchor="middle" font-size="21.3333">main</text>
  <text x="405.3333" y="408" text-anchor="middle" font-size="21.3333">feature</text>
  <text x="896" y="264" text-anchor="middle" font-size="21.3333">main</text>
  <text x="1194.6667" y="408" text-anchor="middle" font-size="21.3333">feature</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="590" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)">Before Rebase</text>

  <line x1="110" y1="220" x2="530" y2="220" stroke="var(--text)" stroke-width="2"/>
  <rect x="82" y="192" width="56" height="56" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)" font-weight="bold">A</text>
  <rect x="292" y="192" width="56" height="56" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)" font-weight="bold">B</text>
  <rect x="502" y="192" width="56" height="56" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)" font-weight="bold">C</text>
  <text x="320" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">main</text>

  <line x1="320" y1="248" x2="320" y2="380" stroke="var(--text)" stroke-width="2"/>
  <line x1="320" y1="410" x2="530" y2="410" stroke="var(--text)" stroke-width="2"/>
  <rect x="292" y="382" width="56" height="56" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)" font-weight="bold">X</text>
  <rect x="502" y="382" width="56" height="56" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)" font-weight="bold">Y</text>
  <text x="530" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">feature</text>

  <text x="335" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">feature branched from B with commits X and Y</text>
  <text x="335" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Run: git rebase -i main</text>

  <rect x="660" y="40" width="580" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)">After Rebase</text>

  <line x1="720" y1="220" x2="1200" y2="220" stroke="var(--text)" stroke-width="2"/>
  <rect x="692" y="192" width="56" height="56" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)" font-weight="bold">A</text>
  <rect x="852" y="192" width="56" height="56" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)" font-weight="bold">B</text>
  <rect x="1012" y="192" width="56" height="56" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)" font-weight="bold">C</text>
  <text x="880" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">main</text>

  <line x1="1040" y1="248" x2="1040" y2="380" stroke="var(--text)" stroke-width="2"/>
  <line x1="1040" y1="410" x2="1200" y2="410" stroke="var(--text)" stroke-width="2"/>
  <rect x="1012" y="382" width="56" height="56" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)" font-weight="bold">X'</text>
  <rect x="1172" y="382" width="56" height="56" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1200" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)" font-weight="bold">Y'</text>
  <text x="1200" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">feature</text>

  <text x="950" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">pick/reword/edit/squash/fixup/drop each commit</text>
  <text x="950" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">X' and Y' are new commits with new SHAs</text>
  <text x="950" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Never rebase shared history; force-push destroys others' work</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="573.3333" y="40" width="266.6666" height="66.9231" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6666" y="84.6153" text-anchor="middle" fill="var(--bg)" font-size="26.8843">Need to integrate?</text>
  <rect x="173.3332" y="218.4616" width="320" height="89.2308" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="333.3333" y="251.9231" text-anchor="middle" fill="var(--bg)" font-size="22.4037">Private branch?</text>
  <text x="333.3333" y="285.3847" text-anchor="middle" fill="var(--bg)" font-size="22.4037">Clean history needed?</text>
  <rect x="920" y="218.4616" width="320" height="89.2308" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="251.9231" text-anchor="middle" fill="var(--bg)" font-size="22.4037">Shared branch?</text>
  <text x="1080" y="285.3847" text-anchor="middle" fill="var(--bg)" font-size="22.4037">Preserve context?</text>
  <rect x="40" y="441.5384" width="160" height="55.7692" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="479.4616" text-anchor="middle" fill="var(--bg)" font-size="22.4037">REBASE</text>
  <rect x="360" y="441.5384" width="160" height="55.7692" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="479.4616" text-anchor="middle" fill="var(--bg)" font-size="22.4037">MERGE</text>
  <rect x="1000" y="441.5384" width="160" height="55.7692" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="479.4616" text-anchor="middle" fill="var(--bg)" font-size="22.4037">MERGE</text>
  <line x1="626.6667" y1="106.9231" x2="386.6666" y2="218.4616" stroke="var(--text)" stroke-width="2" />
  <line x1="786.6666" y1="106.9231" x2="1026.6666" y2="218.4616" stroke="var(--text)" stroke-width="2" />
  <line x1="280" y1="307.6923" x2="146.6666" y2="441.5384" stroke="var(--text)" stroke-width="2" />
  <line x1="386.6666" y1="307.6923" x2="466.6666" y2="441.5384" stroke="var(--text)" stroke-width="2" />
  <line x1="1080" y1="307.6923" x2="1080" y2="441.5384" stroke="var(--text)" stroke-width="2" />
  <text x="493.3332" y="173.8461" font-size="22.4037">Yes</text>
  <text x="920" y="173.8461" font-size="22.4037">No</text>
  <text x="173.3332" y="385.7692" font-size="22.4037">Yes</text>
  <text x="413.3332" y="385.7692" font-size="22.4037">No</text>
  <text x="120" y="553.0769" font-size="22.4037">• Clean up commits</text>
  <text x="120" y="586.5384" font-size="22.4037">• Linear history</text>
  <text x="120" y="620" font-size="22.4037">• Easy to follow</text>
  <text x="440" y="553.0769" font-size="22.4037">• Preserve context</text>
  <text x="440" y="586.5384" font-size="22.4037">• Safe collaboration</text>
  <text x="440" y="620" font-size="22.4037">• No history rewriting</text>
  <text x="1080" y="553.0769" font-size="22.4037">• Multiple contributors</text>
  <text x="1080" y="586.5384" font-size="22.4037">• Complex features</text>
  <text x="1080" y="620" font-size="22.4037">• Audit requirements</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="573.3333" y="40" width="266.6666" height="66.9231" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6666" y="84.6153" text-anchor="middle" fill="var(--bg)" font-size="26.8843" font-family="Arial, sans-serif">Need to integrate?</text>
  <rect x="173.3332" y="218.4616" width="320" height="89.2308" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="333.3333" y="251.9231" text-anchor="middle" fill="var(--bg)" font-size="22.4037" font-family="Arial, sans-serif">Private branch?</text>
  <text x="333.3333" y="285.3847" text-anchor="middle" fill="var(--bg)" font-size="22.4037" font-family="Arial, sans-serif">Clean history needed?</text>
  <rect x="920" y="218.4616" width="320" height="89.2308" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="251.9231" text-anchor="middle" fill="var(--bg)" font-size="22.4037" font-family="Arial, sans-serif">Shared branch?</text>
  <text x="1080" y="285.3847" text-anchor="middle" fill="var(--bg)" font-size="22.4037" font-family="Arial, sans-serif">Preserve context?</text>
  <rect x="40" y="441.5384" width="160" height="55.7692" fill="url(#grad-info)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="479.4616" text-anchor="middle" fill="var(--bg)" font-size="22.4037" font-family="Arial, sans-serif">REBASE</text>
  <rect x="360" y="441.5384" width="160" height="55.7692" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="479.4616" text-anchor="middle" fill="var(--bg)" font-size="22.4037" font-family="Arial, sans-serif">MERGE</text>
  <rect x="1000" y="441.5384" width="160" height="55.7692" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="479.4616" text-anchor="middle" fill="var(--bg)" font-size="22.4037" font-family="Arial, sans-serif">MERGE</text>
  <line x1="626.6667" y1="106.9231" x2="386.6666" y2="218.4616" stroke="var(--text)" stroke-width="2"/>
  <line x1="786.6666" y1="106.9231" x2="1026.6666" y2="218.4616" stroke="var(--text)" stroke-width="2"/>
  <line x1="280" y1="307.6923" x2="146.6666" y2="441.5384" stroke="var(--text)" stroke-width="2"/>
  <line x1="386.6666" y1="307.6923" x2="466.6666" y2="441.5384" stroke="var(--text)" stroke-width="2"/>
  <line x1="1080" y1="307.6923" x2="1080" y2="441.5384" stroke="var(--text)" stroke-width="2"/>
  <text x="493.3332" y="173.8461" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">Yes</text>
  <text x="920" y="173.8461" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">No</text>
  <text x="173.3332" y="385.7692" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">Yes</text>
  <text x="413.3332" y="385.7692" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">No</text>
  <text x="120" y="553.0769" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">• Clean up commits</text>
  <text x="120" y="586.5384" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">• Linear history</text>
  <text x="120" y="620" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">• Easy to follow</text>
  <text x="440" y="553.0769" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">• Preserve context</text>
  <text x="440" y="586.5384" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">• Safe collaboration</text>
  <text x="440" y="620" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">• No history rewriting</text>
  <text x="1080" y="553.0769" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">• Multiple contributors</text>
  <text x="1080" y="586.5384" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">• Complex features</text>
  <text x="1080" y="620" font-size="22.4037" font-family="Arial, sans-serif" fill="var(--text)">• Audit requirements</text>
</svg>

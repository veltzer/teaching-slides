<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="583.0199" y="80" width="227.9202" height="57.6923" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="696.98" y="118.4615" text-anchor="middle" fill="var(--bg)" font-size="23.0769">Need to integrate?</text>
  <rect x="241.1395" y="233.8462" width="273.5043" height="76.9231" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="377.8917" y="262.6923" text-anchor="middle" fill="var(--bg)" font-size="19.2308">Private branch?</text>
  <text x="377.8917" y="291.5385" text-anchor="middle" fill="var(--bg)" font-size="19.2308">Clean history needed?</text>
  <rect x="879.3162" y="233.8462" width="273.5043" height="76.9231" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1016.0684" y="262.6923" text-anchor="middle" fill="var(--bg)" font-size="19.2308">Shared branch?</text>
  <text x="1016.0684" y="291.5385" text-anchor="middle" fill="var(--bg)" font-size="19.2308">Preserve context?</text>
  <rect x="127.1795" y="426.1538" width="136.7521" height="48.0769" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="195.5556" y="458.8462" text-anchor="middle" fill="var(--bg)" font-size="19.2308">REBASE</text>
  <rect x="400.6838" y="426.1538" width="136.7521" height="48.0769" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="469.0598" y="458.8462" text-anchor="middle" fill="var(--bg)" font-size="19.2308">MERGE</text>
  <rect x="947.6923" y="426.1538" width="136.7521" height="48.0769" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1016.0684" y="458.8462" text-anchor="middle" fill="var(--bg)" font-size="19.2308">MERGE</text>
  <line x1="628.604" y1="137.6923" x2="423.4757" y2="233.8462" stroke="var(--text)" stroke-width="2" />
  <line x1="765.3561" y1="137.6923" x2="970.4843" y2="233.8462" stroke="var(--text)" stroke-width="2" />
  <line x1="332.3077" y1="310.7692" x2="218.3475" y2="426.1538" stroke="var(--text)" stroke-width="2" />
  <line x1="423.4757" y1="310.7692" x2="491.8518" y2="426.1538" stroke="var(--text)" stroke-width="2" />
  <line x1="1016.0684" y1="310.7692" x2="1016.0684" y2="426.1538" stroke="var(--text)" stroke-width="2" />
  <text x="514.6438" y="195.3846" font-size="19.2308">Yes</text>
  <text x="879.3162" y="195.3846" font-size="19.2308">No</text>
  <text x="241.1395" y="378.0769" font-size="19.2308">Yes</text>
  <text x="446.2677" y="378.0769" font-size="19.2308">No</text>
  <text x="195.5556" y="522.3077" font-size="19.2308">• Clean up commits</text>
  <text x="195.5556" y="551.1538" font-size="19.2308">• Linear history</text>
  <text x="195.5556" y="580" font-size="19.2308">• Easy to follow</text>
  <text x="469.0598" y="522.3077" font-size="19.2308">• Preserve context</text>
  <text x="469.0598" y="551.1538" font-size="19.2308">• Safe collaboration</text>
  <text x="469.0598" y="580" font-size="19.2308">• No history rewriting</text>
  <text x="1016.0684" y="522.3077" font-size="19.2308">• Multiple contributors</text>
  <text x="1016.0684" y="551.1538" font-size="19.2308">• Complex features</text>
  <text x="1016.0684" y="580" font-size="19.2308">• Audit requirements</text>
</svg>
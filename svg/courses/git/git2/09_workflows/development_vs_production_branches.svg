<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="673.9623" y="40" text-anchor="middle" font-size="35.7357" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Development vs Production Flow</text>
  <line x1="107.9245" y1="218.4615" x2="1240" y2="218.4615" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="62.6415" y="233.3333" font-size="26.8018" fill="var(--ok-accent)" font-family="Arial, sans-serif">main</text>
  <line x1="107.9245" y1="367.1795" x2="1240" y2="367.1795" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="40" y="382.0513" font-size="26.8018" fill="var(--primary-accent)" font-family="Arial, sans-serif">develop</text>
  <line x1="334.3396" y1="367.1795" x2="334.3396" y2="515.8974" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="334.3396" y1="515.8974" x2="560.7547" y2="515.8974" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="560.7547" y1="515.8974" x2="560.7547" y2="367.1795" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="673.9623" y1="367.1795" x2="673.9623" y2="575.3846" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="673.9623" y1="575.3846" x2="900.3773" y2="575.3846" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="900.3773" y1="575.3846" x2="900.3773" y2="367.1795" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="436.38" y="207.294" width="22.3348" height="22.3348" rx="11.1674" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="776.002" y="207.294" width="22.3348" height="22.3348" rx="11.1674" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="1115.63" y="207.294" width="22.3348" height="22.3348" rx="11.1674" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="447.5472" y="277.9487" text-anchor="middle" font-size="22.3348" font-family="Arial, sans-serif" fill="var(--text)">v1.0</text>
  <text x="787.1699" y="277.9487" text-anchor="middle" font-size="22.3348" font-family="Arial, sans-serif" fill="var(--text)">v1.1</text>
  <text x="1126.7925" y="277.9487" text-anchor="middle" font-size="22.3348" font-family="Arial, sans-serif" fill="var(--text)">v1.2</text>
  <text x="447.5472" y="560.5128" font-size="22.3348" fill="var(--danger-accent)" font-family="Arial, sans-serif">feature-A</text>
  <text x="787.1699" y="620" font-size="22.3348" fill="var(--warn-accent)" font-family="Arial, sans-serif">feature-B</text>
</svg>

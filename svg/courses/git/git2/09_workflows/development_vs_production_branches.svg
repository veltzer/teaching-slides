<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="673.9623" y="40" text-anchor="middle" font-size="35.7357" font-weight="bold">Development vs Production Flow</text>
  <line x1="107.9245" y1="218.4615" x2="1240" y2="218.4615" stroke="var(--ok-border)" stroke-width="2" />
  <text x="62.6415" y="233.3333" font-size="26.8018" fill="var(--ok-accent)">main</text>
  <line x1="107.9245" y1="367.1795" x2="1240" y2="367.1795" stroke="var(--primary-border)" stroke-width="2" />
  <text x="40" y="382.0513" font-size="26.8018" fill="var(--primary-accent)">develop</text>
  <line x1="334.3396" y1="367.1795" x2="334.3396" y2="515.8974" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="334.3396" y1="515.8974" x2="560.7547" y2="515.8974" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="560.7547" y1="515.8974" x2="560.7547" y2="367.1795" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="673.9623" y1="367.1795" x2="673.9623" y2="575.3846" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="673.9623" y1="575.3846" x2="900.3773" y2="575.3846" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="900.3773" y1="575.3846" x2="900.3773" y2="367.1795" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="436.38" y="207.294" width="22.3348" height="22.3348" rx="11.1674" fill="var(--info-fill)"/>
  <rect x="776.002" y="207.294" width="22.3348" height="22.3348" rx="11.1674" fill="var(--info-fill)"/>
  <rect x="1115.63" y="207.294" width="22.3348" height="22.3348" rx="11.1674" fill="var(--info-fill)"/>
  <text x="447.5472" y="277.9487" text-anchor="middle" font-size="22.3348">v1.0</text>
  <text x="787.1699" y="277.9487" text-anchor="middle" font-size="22.3348">v1.1</text>
  <text x="1126.7925" y="277.9487" text-anchor="middle" font-size="22.3348">v1.2</text>
  <text x="447.5472" y="560.5128" font-size="22.3348" fill="var(--danger-accent)">feature-A</text>
  <text x="787.1699" y="620" font-size="22.3348" fill="var(--warn-accent)">feature-B</text>
</svg>
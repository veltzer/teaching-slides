<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Merge Conflict Resolution</text>
  <rect x="158.0247" y="142.2222" width="948.1481" height="142.2222" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="186.6667" text-anchor="middle" font-size="22.1235" font-weight="bold">Conflict Markers</text>
  <text x="189.6296" y="222.2222" font-family="monospace" font-size="17.3827">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
  <text x="189.6296" y="248.8889" font-family="monospace" font-size="17.3827">Your changes</text>
  <text x="189.6296" y="275.5556" font-family="monospace" font-size="17.3827">=======</text>
  <text x="474.0741" y="222.2222" font-family="monospace" font-size="17.3827">Their changes</text>
  <text x="474.0741" y="248.8889" font-family="monospace" font-size="17.3827">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature-branch</text>
  <text x="790.1235" y="248.8889" font-size="18.963">← Choose one or combine</text>
  <rect x="79.0123" y="320" width="505.679" height="320" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="331.8519" y="373.3333" text-anchor="middle" font-size="22.1235" font-weight="bold">Resolution Steps</text>
  <text x="110.6173" y="417.7778" font-size="18.963">1. Open conflicted file</text>
  <text x="110.6173" y="453.3333" font-size="18.963">2. Find conflict markers</text>
  <text x="110.6173" y="488.8889" font-size="18.963">3. Decide what to keep</text>
  <text x="110.6173" y="524.4444" font-size="18.963">4. Remove markers</text>
  <text x="110.6173" y="560" font-size="18.963">5. Stage resolved file</text>
  <text x="110.6173" y="595.5556" font-size="18.963">6. Continue merge/rebase</text>
  <rect x="679.5062" y="320" width="505.679" height="320" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="932.3457" y="373.3333" text-anchor="middle" font-size="22.1235" font-weight="bold">Conflict Commands</text>
  <text x="711.1111" y="417.7778" font-family="monospace" font-size="17.3827">git status  # See conflicts</text>
  <text x="711.1111" y="453.3333" font-family="monospace" font-size="17.3827">git diff    # View conflicts</text>
  <text x="711.1111" y="488.8889" font-family="monospace" font-size="17.3827">git add file.txt  # Mark resolved</text>
  <text x="711.1111" y="524.4444" font-family="monospace" font-size="17.3827">git merge --continue</text>
  <text x="711.1111" y="560" font-family="monospace" font-size="17.3827"># Or abort:</text>
  <text x="711.1111" y="595.5556" font-family="monospace" font-size="17.3827">git merge --abort</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="39.8855" font-weight="bold">Merge Conflict Resolution</text>
  <rect x="125.7143" y="112.5" width="1028.5713" height="145" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="640.0001" y="157.8125" text-anchor="middle" font-size="23.2666" font-weight="bold">Conflict Markers</text>
  <text x="160" y="194.0625" font-family="monospace" font-size="18.2809">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
  <text x="160" y="221.25" font-family="monospace" font-size="18.2809">Your changes</text>
  <text x="160" y="248.4376" font-family="monospace" font-size="18.2809">=======</text>
  <text x="468.5715" y="194.0625" font-family="monospace" font-size="18.2809">Their changes</text>
  <text x="468.5715" y="221.25" font-family="monospace" font-size="18.2809">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature-branch</text>
  <text x="811.4286" y="221.25" font-size="19.9428">← Choose one or combine</text>
  <rect x="40" y="293.75" width="548.5714" height="326.25" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="314.2858" y="348.125" text-anchor="middle" font-size="23.2666" font-weight="bold">Resolution Steps</text>
  <text x="74.2858" y="393.4375" font-size="19.9428">1. Open conflicted file</text>
  <text x="74.2858" y="429.6875" font-size="19.9428">2. Find conflict markers</text>
  <text x="74.2858" y="465.9375" font-size="19.9428">3. Decide what to keep</text>
  <text x="74.2858" y="502.1875" font-size="19.9428">4. Remove markers</text>
  <text x="74.2858" y="538.4375" font-size="19.9428">5. Stage resolved file</text>
  <text x="74.2858" y="574.6875" font-size="19.9428">6. Continue merge/rebase</text>
  <rect x="691.4286" y="293.75" width="548.5714" height="326.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="965.7143" y="348.125" text-anchor="middle" font-size="23.2666" font-weight="bold">Conflict Commands</text>
  <text x="725.7143" y="393.4375" font-family="monospace" font-size="18.2809">git status  # See conflicts</text>
  <text x="725.7143" y="429.6875" font-family="monospace" font-size="18.2809">git diff    # View conflicts</text>
  <text x="725.7143" y="465.9375" font-family="monospace" font-size="18.2809">git add file.txt  # Mark resolved</text>
  <text x="725.7143" y="502.1875" font-family="monospace" font-size="18.2809">git merge --continue</text>
  <text x="725.7143" y="538.4375" font-family="monospace" font-size="18.2809"># Or abort:</text>
  <text x="725.7143" y="574.6875" font-family="monospace" font-size="18.2809">git merge --abort</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Merge Conflict Resolution</text>
  <rect x="160" y="144" width="960" height="144" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="640" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">Conflict Markers</text>
  <text x="192" y="225" font-family="monospace" font-size="17.6">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
  <text x="192" y="252" font-family="monospace" font-size="17.6">Your changes</text>
  <text x="192" y="279" font-family="monospace" font-size="17.6">=======</text>
  <text x="480" y="225" font-family="monospace" font-size="17.6">Their changes</text>
  <text x="480" y="252" font-family="monospace" font-size="17.6">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature-branch</text>
  <text x="800" y="252" font-size="19.2">← Choose one or combine</text>
  <rect x="80" y="324" width="512" height="324" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="336" y="378" text-anchor="middle" font-size="22.4" font-weight="bold">Resolution Steps</text>
  <text x="112" y="423" font-size="19.2">1. Open conflicted file</text>
  <text x="112" y="459" font-size="19.2">2. Find conflict markers</text>
  <text x="112" y="495" font-size="19.2">3. Decide what to keep</text>
  <text x="112" y="531" font-size="19.2">4. Remove markers</text>
  <text x="112" y="567" font-size="19.2">5. Stage resolved file</text>
  <text x="112" y="603" font-size="19.2">6. Continue merge/rebase</text>
  <rect x="688" y="324" width="512" height="324" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="944" y="378" text-anchor="middle" font-size="22.4" font-weight="bold">Conflict Commands</text>
  <text x="720" y="423" font-family="monospace" font-size="17.6">git status  # See conflicts</text>
  <text x="720" y="459" font-family="monospace" font-size="17.6">git diff    # View conflicts</text>
  <text x="720" y="495" font-family="monospace" font-size="17.6">git add file.txt  # Mark resolved</text>
  <text x="720" y="531" font-family="monospace" font-size="17.6">git merge --continue</text>
  <text x="720" y="567" font-family="monospace" font-size="17.6"># Or abort:</text>
  <text x="720" y="603" font-family="monospace" font-size="17.6">git merge --abort</text>
</svg>
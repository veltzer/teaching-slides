<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Merge Conflict Resolution</ns0:text>
  <ns0:rect x="158.0247" y="142.2222" width="948.1481" height="142.2222" fill="#FFEBEE" stroke="#C62828" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="632.0988" y="186.6667" text-anchor="middle" font-size="22.1235" font-weight="bold">Conflict Markers</ns0:text>
  <ns0:text x="189.6296" y="222.2222" font-family="monospace" font-size="17.3827">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</ns0:text>
  <ns0:text x="189.6296" y="248.8889" font-family="monospace" font-size="17.3827">Your changes</ns0:text>
  <ns0:text x="189.6296" y="275.5556" font-family="monospace" font-size="17.3827">=======</ns0:text>
  <ns0:text x="474.0741" y="222.2222" font-family="monospace" font-size="17.3827">Their changes</ns0:text>
  <ns0:text x="474.0741" y="248.8889" font-family="monospace" font-size="17.3827">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature-branch</ns0:text>
  <ns0:text x="790.1235" y="248.8889" font-size="18.963">← Choose one or combine</ns0:text>
  <ns0:rect x="79.0123" y="320" width="505.679" height="320" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="331.8519" y="373.3333" text-anchor="middle" font-size="22.1235" font-weight="bold">Resolution Steps</ns0:text>
  <ns0:text x="110.6173" y="417.7778" font-size="18.963">1. Open conflicted file</ns0:text>
  <ns0:text x="110.6173" y="453.3333" font-size="18.963">2. Find conflict markers</ns0:text>
  <ns0:text x="110.6173" y="488.8889" font-size="18.963">3. Decide what to keep</ns0:text>
  <ns0:text x="110.6173" y="524.4444" font-size="18.963">4. Remove markers</ns0:text>
  <ns0:text x="110.6173" y="560" font-size="18.963">5. Stage resolved file</ns0:text>
  <ns0:text x="110.6173" y="595.5556" font-size="18.963">6. Continue merge/rebase</ns0:text>
  <ns0:rect x="679.5062" y="320" width="505.679" height="320" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="932.3457" y="373.3333" text-anchor="middle" font-size="22.1235" font-weight="bold">Conflict Commands</ns0:text>
  <ns0:text x="711.1111" y="417.7778" font-family="monospace" font-size="17.3827">git status  # See conflicts</ns0:text>
  <ns0:text x="711.1111" y="453.3333" font-family="monospace" font-size="17.3827">git diff    # View conflicts</ns0:text>
  <ns0:text x="711.1111" y="488.8889" font-family="monospace" font-size="17.3827">git add file.txt  # Mark resolved</ns0:text>
  <ns0:text x="711.1111" y="524.4444" font-family="monospace" font-size="17.3827">git merge --continue</ns0:text>
  <ns0:text x="711.1111" y="560" font-family="monospace" font-size="17.3827"># Or abort:</ns0:text>
  <ns0:text x="711.1111" y="595.5556" font-family="monospace" font-size="17.3827">git merge --abort</ns0:text>
</ns0:svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Managing Dependencies</ns0:text>
  <ns0:rect x="79.0123" y="142.2222" width="553.0864" height="497.7778" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="355.5556" y="195.5556" text-anchor="middle" font-size="28.4444" font-weight="bold">Git Submodules</ns0:text>
  <ns0:text x="110.6173" y="248.8889" font-size="18.963">✓ Reference to external repo</ns0:text>
  <ns0:text x="110.6173" y="284.4444" font-size="18.963">✓ Specific commit tracked</ns0:text>
  <ns0:text x="110.6173" y="320" font-size="18.963">✓ Independent repository</ns0:text>
  <ns0:text x="110.6173" y="355.5556" font-size="18.963">✗ Complex workflow</ns0:text>
  <ns0:text x="110.6173" y="391.1111" font-size="18.963">✗ Extra steps to update</ns0:text>
  <ns0:rect x="110.6173" y="426.6667" width="489.8765" height="71.1111" fill="#81C784" rx="4.7407" />
  <ns0:text x="355.5556" y="471.1111" text-anchor="middle" font-size="17.3827" fill="white" font-family="monospace">git submodule add URL path</ns0:text>
  <ns0:text x="355.5556" y="542.2222" text-anchor="middle" font-size="20.5432" font-weight="bold">Use for:</ns0:text>
  <ns0:text x="110.6173" y="577.7778" font-size="17.3827">• Vendor libraries</ns0:text>
  <ns0:text x="110.6173" y="613.3333" font-size="17.3827">• Shared components</ns0:text>
  <ns0:rect x="663.7037" y="142.2222" width="521.4815" height="497.7778" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="924.4444" y="195.5556" text-anchor="middle" font-size="28.4444" font-weight="bold">Git Subtrees</ns0:text>
  <ns0:text x="695.3086" y="248.8889" font-size="18.963">✓ Code merged into project</ns0:text>
  <ns0:text x="695.3086" y="284.4444" font-size="18.963">✓ No special commands</ns0:text>
  <ns0:text x="695.3086" y="320" font-size="18.963">✓ Simple for users</ns0:text>
  <ns0:text x="695.3086" y="355.5556" font-size="18.963">✗ History mixed</ns0:text>
  <ns0:text x="695.3086" y="391.1111" font-size="18.963">✗ Larger repository</ns0:text>
  <ns0:rect x="695.3086" y="426.6667" width="458.2716" height="71.1111" fill="#64B5F6" rx="4.7407" />
  <ns0:text x="924.4444" y="471.1111" text-anchor="middle" font-size="17.3827" fill="white" font-family="monospace">git subtree add --prefix=path URL</ns0:text>
  <ns0:text x="924.4444" y="542.2222" text-anchor="middle" font-size="20.5432" font-weight="bold">Use for:</ns0:text>
  <ns0:text x="695.3086" y="577.7778" font-size="17.3827">• Merged dependencies</ns0:text>
  <ns0:text x="695.3086" y="613.3333" font-size="17.3827">• One-time imports</ns0:text>
</ns0:svg>
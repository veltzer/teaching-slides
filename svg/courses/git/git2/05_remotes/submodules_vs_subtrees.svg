<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Managing Dependencies</text>
  <rect x="80" y="144" width="560" height="504" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="360" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">Git Submodules</text>
  <text x="112" y="252" font-size="19.2">✓ Reference to external repo</text>
  <text x="112" y="288" font-size="19.2">✓ Specific commit tracked</text>
  <text x="112" y="324" font-size="19.2">✓ Independent repository</text>
  <text x="112" y="360" font-size="19.2">✗ Complex workflow</text>
  <text x="112" y="396" font-size="19.2">✗ Extra steps to update</text>
  <rect x="112" y="432" width="496" height="72" fill="#81C784" rx="4.8" />
  <text x="360" y="477" text-anchor="middle" font-size="17.6" fill="white" font-family="monospace">git submodule add URL path</text>
  <text x="360" y="549" text-anchor="middle" font-size="20.8" font-weight="bold">Use for:</text>
  <text x="112" y="585" font-size="17.6">• Vendor libraries</text>
  <text x="112" y="621" font-size="17.6">• Shared components</text>
  <rect x="672" y="144" width="528" height="504" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="936" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">Git Subtrees</text>
  <text x="704" y="252" font-size="19.2">✓ Code merged into project</text>
  <text x="704" y="288" font-size="19.2">✓ No special commands</text>
  <text x="704" y="324" font-size="19.2">✓ Simple for users</text>
  <text x="704" y="360" font-size="19.2">✗ History mixed</text>
  <text x="704" y="396" font-size="19.2">✗ Larger repository</text>
  <rect x="704" y="432" width="464" height="72" fill="#64B5F6" rx="4.8" />
  <text x="936" y="477" text-anchor="middle" font-size="17.6" fill="white" font-family="monospace">git subtree add --prefix=path URL</text>
  <text x="936" y="549" text-anchor="middle" font-size="20.8" font-weight="bold">Use for:</text>
  <text x="704" y="585" font-size="17.6">• Merged dependencies</text>
  <text x="704" y="621" font-size="17.6">• One-time imports</text>
</svg>
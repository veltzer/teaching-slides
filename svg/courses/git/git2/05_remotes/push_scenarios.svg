<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Common Push Scenarios</text>
  <rect x="79.0123" y="142.2222" width="553.0864" height="142.2222" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="355.5556" y="186.6667" text-anchor="middle" font-size="22.1235" font-weight="bold">Fast-Forward Push</text>
  <circle cx="189.6296" cy="231.1111" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="268.642" cy="231.1111" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="347.6543" cy="231.1111" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="426.6667" cy="231.1111" r="23.7037" fill="var(--ok-fill)" />
  <line x1="213.3333" y1="231.1111" x2="244.9383" y2="231.1111" stroke="var(--text)" stroke-width="2" />
  <line x1="292.3457" y1="231.1111" x2="323.9506" y2="231.1111" stroke="var(--text)" stroke-width="2" />
  <line x1="371.358" y1="231.1111" x2="402.963" y2="231.1111" stroke="var(--text)" stroke-width="2" />
  <text x="505.679" y="240" font-size="17.3827">✓ Success</text>
  <rect x="663.7037" y="142.2222" width="521.4815" height="142.2222" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="924.4444" y="186.6667" text-anchor="middle" font-size="22.1235" font-weight="bold">Non-Fast-Forward Push</text>
  <circle cx="758.5185" cy="231.1111" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="837.5309" cy="195.5556" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="837.5309" cy="266.6667" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="916.5432" cy="266.6667" r="23.7037" fill="var(--ok-fill)" />
  <line x1="782.2222" y1="231.1111" x2="813.8272" y2="204.4444" stroke="var(--text)" stroke-width="2" />
  <line x1="782.2222" y1="231.1111" x2="813.8272" y2="257.7778" stroke="var(--text)" stroke-width="2" />
  <line x1="861.2346" y1="266.6667" x2="892.8395" y2="266.6667" stroke="var(--text)" stroke-width="2" />
  <text x="1058.7654" y="240" font-size="17.3827">✗ Rejected</text>
  <rect x="79.0123" y="320" width="1106.1728" height="142.2222" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="364.4444" text-anchor="middle" font-size="22.1235" font-weight="bold">Force Push (Rewrites History)</text>
  <circle cx="395.0617" cy="408.8889" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="474.0741" cy="408.8889" r="23.7037" fill="var(--warn-fill)" stroke-dasharray="4.7407 4.7407" />
  <circle cx="553.0864" cy="408.8889" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="632.0988" cy="408.8889" r="23.7037" fill="var(--ok-fill)" />
  <line x1="418.7654" y1="408.8889" x2="450.3704" y2="408.8889" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4.7407 4.7407" />
  <line x1="497.7778" y1="408.8889" x2="529.3827" y2="408.8889" stroke="var(--text)" stroke-width="2" />
  <line x1="576.7901" y1="408.8889" x2="608.3951" y2="408.8889" stroke="var(--text)" stroke-width="2" />
  <text x="790.1235" y="417.7778" font-size="17.3827">⚠️ Dangerous!</text>
  <rect x="316.0494" y="497.7778" width="632.0988" height="142.2222" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="632.0988" y="551.1111" text-anchor="middle" font-size="20.5432">Non-fast-forward? Pull first, then push</text>
  <text x="632.0988" y="595.5556" text-anchor="middle" font-size="18.963" font-family="monospace">git pull --rebase &amp;&amp; git push</text>
</svg>
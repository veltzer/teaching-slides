<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="39.8855" font-weight="bold">Common Push Scenarios</text>
  <rect x="40" y="112.5" width="599.9999" height="145" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="340.0001" y="157.8125" text-anchor="middle" font-size="23.2666" font-weight="bold">Fast-Forward Push</text>
  <rect x="135.072" y="178.197" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="220.786" y="178.197" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="306.5" y="178.197" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="392.214" y="178.197" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <line x1="185.7143" y1="203.125" x2="220.0001" y2="203.125" stroke="var(--text)" stroke-width="2" />
  <line x1="271.4286" y1="203.125" x2="305.7143" y2="203.125" stroke="var(--text)" stroke-width="2" />
  <line x1="357.1429" y1="203.125" x2="391.4286" y2="203.125" stroke="var(--text)" stroke-width="2" />
  <text x="502.8572" y="212.1875" font-size="18.2809">✓ Success</text>
  <rect x="674.2857" y="112.5" width="565.7143" height="145" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1428" y="157.8125" text-anchor="middle" font-size="23.2666" font-weight="bold">Non-Fast-Forward Push</text>
  <rect x="752.214" y="178.197" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="837.929" y="141.947" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="837.929" y="214.447" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="923.643" y="214.447" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <line x1="802.8571" y1="203.125" x2="837.1429" y2="175.9375" stroke="var(--text)" stroke-width="2" />
  <line x1="802.8571" y1="203.125" x2="837.1429" y2="230.3125" stroke="var(--text)" stroke-width="2" />
  <line x1="888.5715" y1="239.375" x2="922.8571" y2="239.375" stroke="var(--text)" stroke-width="2" />
  <text x="1102.8571" y="212.1875" font-size="18.2809">✗ Rejected</text>
  <rect x="40" y="293.75" width="1199.9999" height="145" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="339.0625" text-anchor="middle" font-size="23.2666" font-weight="bold">Force Push (Rewrites History)</text>
  <rect x="357.929" y="359.447" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="443.643" y="359.447" width="49.857" height="49.857" rx="14" fill="var(--warn-fill)" stroke-dasharray="4.7407 4.7407" filter="url(#shadow)"/>
  <rect x="529.357" y="359.447" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="615.072" y="359.447" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <line x1="408.5714" y1="384.375" x2="442.8572" y2="384.375" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4.7407 4.7407" />
  <line x1="494.2858" y1="384.375" x2="528.5714" y2="384.375" stroke="var(--text)" stroke-width="2" />
  <line x1="580" y1="384.375" x2="614.2858" y2="384.375" stroke="var(--text)" stroke-width="2" />
  <text x="811.4286" y="393.4375" font-size="18.2809">⚠️ Dangerous!</text>
  <rect x="297.1429" y="475" width="685.7143" height="145" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="640.0001" y="529.375" text-anchor="middle" font-size="21.6047">Non-fast-forward? Pull first, then push</text>
  <text x="640.0001" y="574.6875" text-anchor="middle" font-size="19.9428" font-family="monospace">git pull --rebase &amp;&amp; git push</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Common Push Scenarios</text>
  <rect x="80" y="144" width="560" height="144" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="360" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">Fast-Forward Push</text>
  <circle cx="192" cy="234" r="24" fill="#4CAF50" />
  <circle cx="272" cy="234" r="24" fill="#4CAF50" />
  <circle cx="352" cy="234" r="24" fill="#81C784" />
  <circle cx="432" cy="234" r="24" fill="#81C784" />
  <line x1="216" y1="234" x2="248" y2="234" stroke="#333" stroke-width="3.2" />
  <line x1="296" y1="234" x2="328" y2="234" stroke="#333" stroke-width="3.2" />
  <line x1="376" y1="234" x2="408" y2="234" stroke="#333" stroke-width="3.2" />
  <text x="512" y="243" font-size="17.6">✓ Success</text>
  <rect x="672" y="144" width="528" height="144" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="936" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">Non-Fast-Forward Push</text>
  <circle cx="768" cy="234" r="24" fill="#4CAF50" />
  <circle cx="848" cy="198" r="24" fill="#4CAF50" />
  <circle cx="848" cy="270" r="24" fill="#81C784" />
  <circle cx="928" cy="270" r="24" fill="#81C784" />
  <line x1="792" y1="234" x2="824" y2="207" stroke="#333" stroke-width="3.2" />
  <line x1="792" y1="234" x2="824" y2="261" stroke="#333" stroke-width="3.2" />
  <line x1="872" y1="270" x2="904" y2="270" stroke="#333" stroke-width="3.2" />
  <text x="1072" y="243" font-size="17.6">✗ Rejected</text>
  <rect x="80" y="324" width="1120" height="144" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="369" text-anchor="middle" font-size="22.4" font-weight="bold">Force Push (Rewrites History)</text>
  <circle cx="400" cy="414" r="24" fill="#4CAF50" />
  <circle cx="480" cy="414" r="24" fill="#FF9800" stroke-dasharray="4.8 4.8" />
  <circle cx="560" cy="414" r="24" fill="#81C784" />
  <circle cx="640" cy="414" r="24" fill="#81C784" />
  <line x1="424" y1="414" x2="456" y2="414" stroke="#999" stroke-width="3.2" stroke-dasharray="4.8 4.8" />
  <line x1="504" y1="414" x2="536" y2="414" stroke="#333" stroke-width="3.2" />
  <line x1="584" y1="414" x2="616" y2="414" stroke="#333" stroke-width="3.2" />
  <text x="800" y="423" font-size="17.6">⚠️ Dangerous!</text>
  <rect x="320" y="504" width="640" height="144" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="558" text-anchor="middle" font-size="20.8">Non-fast-forward? Pull first, then push</text>
  <text x="640" y="603" text-anchor="middle" font-size="19.2" font-family="monospace">git pull --rebase &amp;&amp; git push</text>
</svg>
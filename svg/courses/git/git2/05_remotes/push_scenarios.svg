<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="39.8855" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Common Push Scenarios</text>
  <rect x="40" y="112.5" width="599.9999" height="145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="340.0001" y="157.8125" text-anchor="middle" font-size="23.2666" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Fast-Forward Push</text>
  <rect x="135.072" y="178.197" width="49.857" height="49.857" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="220.786" y="178.197" width="49.857" height="49.857" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="306.5" y="178.197" width="49.857" height="49.857" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="392.214" y="178.197" width="49.857" height="49.857" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <line x1="185.7143" y1="203.125" x2="220.0001" y2="203.125" stroke="var(--text)" stroke-width="2"/>
  <line x1="271.4286" y1="203.125" x2="305.7143" y2="203.125" stroke="var(--text)" stroke-width="2"/>
  <line x1="357.1429" y1="203.125" x2="391.4286" y2="203.125" stroke="var(--text)" stroke-width="2"/>
  <text x="502.8572" y="212.1875" font-size="18.2809" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Success</text>
  <rect x="674.2857" y="112.5" width="565.7143" height="145" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1428" y="157.8125" text-anchor="middle" font-size="23.2666" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Non-Fast-Forward Push</text>
  <rect x="752.214" y="178.197" width="49.857" height="49.857" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="837.929" y="141.947" width="49.857" height="49.857" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="837.929" y="214.447" width="49.857" height="49.857" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="923.643" y="214.447" width="49.857" height="49.857" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <line x1="802.8571" y1="203.125" x2="837.1429" y2="175.9375" stroke="var(--text)" stroke-width="2"/>
  <line x1="802.8571" y1="203.125" x2="837.1429" y2="230.3125" stroke="var(--text)" stroke-width="2"/>
  <line x1="888.5715" y1="239.375" x2="922.8571" y2="239.375" stroke="var(--text)" stroke-width="2"/>
  <text x="1102.8571" y="212.1875" font-size="18.2809" font-family="Arial, sans-serif" fill="var(--danger-text)">✗ Rejected</text>
  <rect x="40" y="293.75" width="1199.9999" height="145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="339.0625" text-anchor="middle" font-size="23.2666" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Force Push (Rewrites History)</text>
  <rect x="357.929" y="359.447" width="49.857" height="49.857" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="443.643" y="359.447" width="49.857" height="49.857" rx="14" fill="url(#grad-warn)" stroke-dasharray="4.7407 4.7407" filter="url(#shadow)"/>
  <rect x="529.357" y="359.447" width="49.857" height="49.857" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="615.072" y="359.447" width="49.857" height="49.857" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <line x1="408.5714" y1="384.375" x2="442.8572" y2="384.375" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4.7407 4.7407"/>
  <line x1="494.2858" y1="384.375" x2="528.5714" y2="384.375" stroke="var(--text)" stroke-width="2"/>
  <line x1="580" y1="384.375" x2="614.2858" y2="384.375" stroke="var(--text)" stroke-width="2"/>
  <text x="811.4286" y="393.4375" font-size="18.2809" font-family="Arial, sans-serif" fill="var(--warn-text)">⚠️ Dangerous!</text>
  <rect x="297.1429" y="475" width="685.7143" height="145" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640.0001" y="529.375" text-anchor="middle" font-size="21.6047" font-family="Arial, sans-serif" fill="var(--text)">Non-fast-forward? Pull first, then push</text>
  <text x="640.0001" y="574.6875" text-anchor="middle" font-size="19.9428" font-family="Courier New, monospace" fill="var(--text)">git pull --rebase &amp;&amp; git push</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Security Best Practices</text>
  <rect x="80" y="144" width="560" height="216" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="360" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Access Control</text>
  <text x="112" y="243" font-size="19.2">• Use SSH keys or tokens</text>
  <text x="112" y="279" font-size="19.2">• Enable 2FA</text>
  <text x="112" y="315" font-size="19.2">• Limit repository access</text>
  <rect x="672" y="144" width="528" height="216" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="936" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Sensitive Data</text>
  <text x="704" y="243" font-size="19.2">• Never commit secrets</text>
  <text x="704" y="279" font-size="19.2">• Use environment variables</text>
  <text x="704" y="315" font-size="19.2">• Scan for exposed keys</text>
  <rect x="80" y="396" width="560" height="216" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="360" y="450" text-anchor="middle" font-size="25.6" font-weight="bold">Code Integrity</text>
  <text x="112" y="495" font-size="19.2">• Sign commits with GPG</text>
  <text x="112" y="531" font-size="19.2">• Verify signatures</text>
  <text x="112" y="567" font-size="19.2">• Protected branches</text>
  <rect x="672" y="396" width="528" height="216" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="936" y="450" text-anchor="middle" font-size="25.6" font-weight="bold">Monitoring</text>
  <text x="704" y="495" font-size="19.2">• Audit logs</text>
  <text x="704" y="531" font-size="19.2">• Security alerts</text>
  <text x="704" y="567" font-size="19.2">• Dependency scanning</text>
</svg>
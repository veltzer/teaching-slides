<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Remote Triggers CI/CD</text>
  <circle cx="160" cy="360" r="48" fill="#4CAF50" />
  <text x="160" y="369" text-anchor="middle" font-size="19.2" fill="white">Push</text>
  <path d="M 208 360 L 272 360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow5)" />
  <rect x="272" y="315" width="160" height="90" fill="#2196F3" rx="8" />
  <text x="352" y="369" text-anchor="middle" font-size="19.2" fill="white">Webhook</text>
  <path d="M 432 360 L 496 360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow5)" />
  <rect x="496" y="315" width="160" height="90" fill="#FF9800" rx="8" />
  <text x="576" y="369" text-anchor="middle" font-size="19.2" fill="white">CI Build</text>
  <path d="M 656 360 L 720 360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow5)" />
  <rect x="720" y="315" width="160" height="90" fill="#9C27B0" rx="8" />
  <text x="800" y="369" text-anchor="middle" font-size="19.2" fill="white">Tests</text>
  <path d="M 880 360 L 944 360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow5)" />
  <rect x="944" y="315" width="160" height="90" fill="#F44336" rx="8" />
  <text x="1024" y="369" text-anchor="middle" font-size="19.2" fill="white">Deploy</text>
  <rect x="320" y="468" width="640" height="180" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="522" text-anchor="middle" font-size="22.4" font-weight="bold">Triggers:</text>
  <text x="352" y="567" font-size="19.2">• Push to branch</text>
  <text x="352" y="603" font-size="19.2">• Pull request</text>
  <text x="608" y="567" font-size="19.2">• Tag creation</text>
  <text x="608" y="603" font-size="19.2">• Schedule</text>
  <defs>
    <marker id="arrow5" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
  <rect x="229.2625" y="284.6875" width="194.3726" height="90.6251" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="326.4489" y="339.0625" text-anchor="middle" font-size="21.2355" fill="var(--bg)">Webhook</text>
  <path d="M 423.6351 330 L 501.3843 330" stroke="var(--text)" stroke-width="1.0237" marker-end="url(#arrow)" />
  <rect x="501.3843" y="284.6875" width="194.3726" height="90.6251" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="598.5703" y="339.0625" text-anchor="middle" font-size="21.2355" fill="var(--bg)">CI Build</text>
  <path d="M 695.7569 330 L 773.5058 330" stroke="var(--text)" stroke-width="1.0237" marker-end="url(#arrow)" />
  <rect x="773.5058" y="284.6875" width="194.3726" height="90.6251" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2" />
  <text x="870.6922" y="339.0625" text-anchor="middle" font-size="21.2355" fill="var(--bg)">Tests</text>
  <path d="M 967.8786 330 L 1045.6274 330" stroke="var(--text)" stroke-width="1.0237" marker-end="url(#arrow)" />
  <rect x="1045.6274" y="284.6875" width="194.3726" height="90.6251" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1142.8138" y="339.0625" text-anchor="middle" font-size="21.2355" fill="var(--bg)">Deploy</text>
  <rect x="287.5743" y="438.75" width="777.4907" height="181.25" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="676.3196" y="493.1251" text-anchor="middle" font-size="24.7747" font-weight="bold">Triggers:</text>
  <text x="326.4489" y="538.4377" font-size="21.2355">• Push to branch</text>
  <text x="326.4489" y="574.6877" font-size="21.2355">• Pull request</text>
  <text x="637.445" y="538.4377" font-size="21.2355">• Tag creation</text>
  <text x="637.445" y="574.6877" font-size="21.2355">• Schedule</text>
  <defs>
    <style id="palette-vars">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="667.7778" y="80" text-anchor="middle" font-size="33.3333" font-weight="bold">Remote Triggers CI/CD</text>
  <circle cx="251.1111" cy="330" r="41.6667" fill="var(--ok-fill)" />
  <text x="251.1111" y="337.8125" text-anchor="middle" font-size="16.6666" fill="var(--bg)">Push</text>
  <path d="M 292.7776 330 L 348.3333 330" stroke="var(--text)" stroke-width="2.1695" marker-end="url(#arrow)" />
  <rect x="348.3333" y="290.9375" width="138.8889" height="78.125" fill="var(--primary-fill)" rx="7.6823" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="417.7778" y="337.8125" text-anchor="middle" font-size="16.6666" fill="var(--bg)">Webhook</text>
  <path d="M 487.2222 330 L 542.7778 330" stroke="var(--text)" stroke-width="2.1695" marker-end="url(#arrow)" />
  <rect x="542.7778" y="290.9375" width="138.8889" height="78.125" fill="var(--warn-fill)" rx="7.6823" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="612.2222" y="337.8125" text-anchor="middle" font-size="16.6666" fill="var(--bg)">CI Build</text>
  <path d="M 681.6667 330 L 737.2222 330" stroke="var(--text)" stroke-width="2.1695" marker-end="url(#arrow)" />
  <rect x="737.2222" y="290.9375" width="138.8889" height="78.125" fill="var(--info-fill)" rx="7.6823" stroke="var(--info-border)" stroke-width="2"/>
  <text x="806.6667" y="337.8125" text-anchor="middle" font-size="16.6666" fill="var(--bg)">Tests</text>
  <path d="M 876.1112 330 L 931.6667 330" stroke="var(--text)" stroke-width="2.1695" marker-end="url(#arrow)" />
  <rect x="931.6667" y="290.9375" width="138.8889" height="78.125" fill="var(--danger-fill)" rx="7.6823" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1001.1112" y="337.8125" text-anchor="middle" font-size="16.6666" fill="var(--bg)">Deploy</text>
  <rect x="390" y="423.75" width="555.5557" height="156.25" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.6823" />
  <text x="667.7778" y="470.625" text-anchor="middle" font-size="19.4444" font-weight="bold">Triggers:</text>
  <text x="417.7778" y="509.6876" font-size="16.6666">• Push to branch</text>
  <text x="417.7778" y="540.9376" font-size="16.6666">• Pull request</text>
  <text x="640" y="509.6876" font-size="16.6666">• Tag creation</text>
  <text x="640" y="540.9376" font-size="16.6666">• Schedule</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
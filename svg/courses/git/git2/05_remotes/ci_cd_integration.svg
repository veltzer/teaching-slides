<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="433.8983" y="48.8136" text-anchor="middle" font-size="26.0339" font-weight="bold">Remote Triggers CI/CD</text>
  <circle cx="108.4746" cy="244.0678" r="32.5424" fill="var(--ok-fill)" />
  <text x="108.4746" y="250.1695" text-anchor="middle" font-size="13.0169" fill="var(--bg)">Push</text>
  <path d="M 141.0169 244.0678 L 184.4068 244.0678" stroke="var(--text)" stroke-width="2.1695" marker-end="url(#arrow)" />
  <rect x="184.4068" y="213.5593" width="108.4746" height="61.0169" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="238.6441" y="250.1695" text-anchor="middle" font-size="13.0169" fill="var(--bg)">Webhook</text>
  <path d="M 292.8814 244.0678 L 336.2712 244.0678" stroke="var(--text)" stroke-width="2.1695" marker-end="url(#arrow)" />
  <rect x="336.2712" y="213.5593" width="108.4746" height="61.0169" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="390.5085" y="250.1695" text-anchor="middle" font-size="13.0169" fill="var(--bg)">CI Build</text>
  <path d="M 444.7458 244.0678 L 488.1356 244.0678" stroke="var(--text)" stroke-width="2.1695" marker-end="url(#arrow)" />
  <rect x="488.1356" y="213.5593" width="108.4746" height="61.0169" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="542.3729" y="250.1695" text-anchor="middle" font-size="13.0169" fill="var(--bg)">Tests</text>
  <path d="M 596.6102 244.0678 L 640 244.0678" stroke="var(--text)" stroke-width="2.1695" marker-end="url(#arrow)" />
  <rect x="640" y="213.5593" width="108.4746" height="61.0169" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="694.2373" y="250.1695" text-anchor="middle" font-size="13.0169" fill="var(--bg)">Deploy</text>
  <rect x="216.9492" y="317.2881" width="433.8983" height="122.0339" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="433.8983" y="353.8983" text-anchor="middle" font-size="15.1864" font-weight="bold">Triggers:</text>
  <text x="238.6441" y="384.4068" font-size="13.0169">• Push to branch</text>
  <text x="238.6441" y="408.8136" font-size="13.0169">• Pull request</text>
  <text x="412.2034" y="384.4068" font-size="13.0169">• Tag creation</text>
  <text x="412.2034" y="408.8136" font-size="13.0169">• Schedule</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
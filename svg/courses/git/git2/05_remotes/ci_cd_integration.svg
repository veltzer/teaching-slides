<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="676.2654" y="40" text-anchor="middle" font-size="42.4728" font-weight="bold">Remote Triggers CI/CD</text>
  <rect x="40" y="276.909" width="106.183" height="106.183" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="93.0914" y="339.0625" text-anchor="middle" font-size="21.2365" fill="var(--bg)">Push</text>
  <path d="M 151.4085 330 L 229.1653 330" stroke="var(--text)" stroke-width="1.0237" marker-end="url(#arrow)" />
  <rect x="229.1653" y="284.6875" width="194.3913" height="90.6251" fill="var(--primary-fill)" rx="6.0003" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.361" y="339.0625" text-anchor="middle" font-size="21.2365" fill="var(--bg)">Webhook</text>
  <path d="M 423.5566 330 L 501.3133 330" stroke="var(--text)" stroke-width="1.0237" marker-end="url(#arrow)" />
  <rect x="501.3133" y="284.6875" width="194.3913" height="90.6251" fill="var(--warn-fill)" rx="6.0003" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.5086" y="339.0625" text-anchor="middle" font-size="21.2365" fill="var(--bg)">CI Build</text>
  <path d="M 695.7046 330 L 773.4609 330" stroke="var(--text)" stroke-width="1.0237" marker-end="url(#arrow)" />
  <rect x="773.4609" y="284.6875" width="194.3913" height="90.6251" fill="var(--info-fill)" rx="6.0003" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870.6567" y="339.0625" text-anchor="middle" font-size="21.2365" fill="var(--bg)">Tests</text>
  <path d="M 967.8524 330 L 1045.6087 330" stroke="var(--text)" stroke-width="1.0237" marker-end="url(#arrow)" />
  <rect x="1045.6087" y="284.6875" width="194.3913" height="90.6251" fill="var(--danger-fill)" rx="6.0003" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1142.8045" y="339.0625" text-anchor="middle" font-size="21.2365" fill="var(--bg)">Deploy</text>
  <rect x="287.4827" y="438.75" width="777.5655" height="181.25" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.0003" />
  <text x="676.2654" y="493.1251" text-anchor="middle" font-size="24.7759" font-weight="bold">Triggers:</text>
  <text x="326.361" y="538.4377" font-size="21.2365">• Push to branch</text>
  <text x="326.361" y="574.6877" font-size="21.2365">• Pull request</text>
  <text x="637.387" y="538.4377" font-size="21.2365">• Tag creation</text>
  <text x="637.387" y="574.6877" font-size="21.2365">• Schedule</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Branch Protection Rules</text>
  <rect x="160" y="144" width="960" height="108" fill="#4CAF50" rx="8" />
  <text x="640" y="189" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Protected: main branch</text>
  <text x="640" y="225" text-anchor="middle" font-size="19.2" fill="white">No direct pushes allowed</text>
  <rect x="80" y="288" width="352" height="324" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="256" y="342" text-anchor="middle" font-size="22.4" font-weight="bold">Requirements</text>
  <text x="112" y="387" font-size="17.6">✓ Pull request required</text>
  <text x="112" y="423" font-size="17.6">✓ Code review approval</text>
  <text x="112" y="459" font-size="17.6">✓ Status checks pass</text>
  <text x="112" y="495" font-size="17.6">✓ Up-to-date with base</text>
  <text x="112" y="531" font-size="17.6">✓ Signed commits</text>
  <text x="112" y="567" font-size="17.6">✓ No admin override</text>
  <rect x="464" y="288" width="352" height="324" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="342" text-anchor="middle" font-size="22.4" font-weight="bold">Benefits</text>
  <text x="496" y="387" font-size="17.6">• Prevents accidents</text>
  <text x="496" y="423" font-size="17.6">• Enforces review</text>
  <text x="496" y="459" font-size="17.6">• Ensures CI passes</text>
  <text x="496" y="495" font-size="17.6">• Maintains quality</text>
  <text x="496" y="531" font-size="17.6">• Audit trail</text>
  <text x="496" y="567" font-size="17.6">• Team collaboration</text>
  <rect x="848" y="288" width="352" height="324" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="1024" y="342" text-anchor="middle" font-size="22.4" font-weight="bold">Restrictions</text>
  <text x="880" y="387" font-size="17.6">✗ No force push</text>
  <text x="880" y="423" font-size="17.6">✗ No deletion</text>
  <text x="880" y="459" font-size="17.6">✗ No direct commits</text>
  <text x="880" y="495" font-size="17.6">✗ No bypass reviews</text>
  <text x="880" y="531" font-size="17.6">✗ No unsigned commits</text>
  <text x="880" y="567" font-size="17.6">✗ No failed checks</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="41.1936" font-weight="bold">Branch Protection Rules</text>
  <rect x="125.7143" y="117.3333" width="1028.5714" height="116" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="165.6667" text-anchor="middle" font-size="27.4624" fill="var(--bg)" font-weight="bold">Protected: main branch</text>
  <text x="640" y="204.3333" text-anchor="middle" font-size="20.5968" fill="var(--bg)">No direct pushes allowed</text>
  <rect x="40" y="272" width="377.1429" height="348" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="228.5714" y="330" text-anchor="middle" font-size="24.0296" font-weight="bold">Requirements</text>
  <text x="74.2857" y="378.3333" font-size="18.8804">✓ Pull request required</text>
  <text x="74.2857" y="417" font-size="18.8804">✓ Code review approval</text>
  <text x="74.2857" y="455.6667" font-size="18.8804">✓ Status checks pass</text>
  <text x="74.2857" y="494.3333" font-size="18.8804">✓ Up-to-date with base</text>
  <text x="74.2857" y="533" font-size="18.8804">✓ Signed commits</text>
  <text x="74.2857" y="571.6667" font-size="18.8804">✓ No admin override</text>
  <rect x="451.4286" y="272" width="377.1429" height="348" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="330" text-anchor="middle" font-size="24.0296" font-weight="bold">Benefits</text>
  <text x="485.7143" y="378.3333" font-size="18.8804">• Prevents accidents</text>
  <text x="485.7143" y="417" font-size="18.8804">• Enforces review</text>
  <text x="485.7143" y="455.6667" font-size="18.8804">• Ensures CI passes</text>
  <text x="485.7143" y="494.3333" font-size="18.8804">• Maintains quality</text>
  <text x="485.7143" y="533" font-size="18.8804">• Audit trail</text>
  <text x="485.7143" y="571.6667" font-size="18.8804">• Team collaboration</text>
  <rect x="862.8571" y="272" width="377.1429" height="348" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1051.4286" y="330" text-anchor="middle" font-size="24.0296" font-weight="bold">Restrictions</text>
  <text x="897.1429" y="378.3333" font-size="18.8804">✗ No force push</text>
  <text x="897.1429" y="417" font-size="18.8804">✗ No deletion</text>
  <text x="897.1429" y="455.6667" font-size="18.8804">✗ No direct commits</text>
  <text x="897.1429" y="494.3333" font-size="18.8804">✗ No bypass reviews</text>
  <text x="897.1429" y="533" font-size="18.8804">✗ No unsigned commits</text>
  <text x="897.1429" y="571.6667" font-size="18.8804">✗ No failed checks</text>
</svg>
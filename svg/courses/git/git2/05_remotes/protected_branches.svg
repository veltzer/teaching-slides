<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="41.1936" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Branch Protection Rules</text>
  <rect x="125.7143" y="117.3333" width="1028.5714" height="116" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="165.6667" text-anchor="middle" font-size="27.4624" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Protected: main branch</text>
  <text x="640" y="204.3333" text-anchor="middle" font-size="20.5968" fill="var(--bg)" font-family="Arial, sans-serif">No direct pushes allowed</text>
  <rect x="40" y="272" width="377.1429" height="348" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="228.5714" y="330" text-anchor="middle" font-size="24.0296" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Requirements</text>
  <text x="74.2857" y="378.3333" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Pull request required</text>
  <text x="74.2857" y="417" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Code review approval</text>
  <text x="74.2857" y="455.6667" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Status checks pass</text>
  <text x="74.2857" y="494.3333" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Up-to-date with base</text>
  <text x="74.2857" y="533" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Signed commits</text>
  <text x="74.2857" y="571.6667" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ No admin override</text>
  <rect x="451.4286" y="272" width="377.1429" height="348" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="330" text-anchor="middle" font-size="24.0296" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Benefits</text>
  <text x="485.7143" y="378.3333" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--warn-text)">• Prevents accidents</text>
  <text x="485.7143" y="417" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--warn-text)">• Enforces review</text>
  <text x="485.7143" y="455.6667" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--warn-text)">• Ensures CI passes</text>
  <text x="485.7143" y="494.3333" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--warn-text)">• Maintains quality</text>
  <text x="485.7143" y="533" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--warn-text)">• Audit trail</text>
  <text x="485.7143" y="571.6667" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--warn-text)">• Team collaboration</text>
  <rect x="862.8571" y="272" width="377.1429" height="348" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1051.4286" y="330" text-anchor="middle" font-size="24.0296" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Restrictions</text>
  <text x="897.1429" y="378.3333" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--danger-text)">✗ No force push</text>
  <text x="897.1429" y="417" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--danger-text)">✗ No deletion</text>
  <text x="897.1429" y="455.6667" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--danger-text)">✗ No direct commits</text>
  <text x="897.1429" y="494.3333" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--danger-text)">✗ No bypass reviews</text>
  <text x="897.1429" y="533" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--danger-text)">✗ No unsigned commits</text>
  <text x="897.1429" y="571.6667" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--danger-text)">✗ No failed checks</text>
</svg>

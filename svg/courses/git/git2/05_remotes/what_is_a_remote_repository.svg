<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="571.5655" y="71.4457" text-anchor="middle" font-size="32.8486" font-weight="bold">Local vs Remote</text>
  <rect x="92.5235" y="133.0368" width="410.6075" height="384.9444" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.7861" rx="5.7742" />
  <text x="297.8271" y="179.2302" text-anchor="middle" font-size="24.6364" font-weight="bold">Local Repository</text>
  <circle cx="229.3926" cy="256.2191" r="41.0607" fill="var(--ok-fill)" />
  <text x="229.3926" y="263.9179" text-anchor="middle" font-size="16.4243" fill="var(--bg)">.git</text>
  <text x="297.8271" y="333.2079" text-anchor="middle" font-size="19.1616">Your Machine</text>
  <text x="119.8974" y="379.4012" font-size="16.4243">• Full history</text>
  <text x="119.8974" y="410.1967" font-size="16.4243">• All branches</text>
  <text x="119.8974" y="440.9923" font-size="16.4243">• Working directory</text>
  <text x="119.8974" y="471.7879" font-size="16.4243">• Can work offline</text>
  <rect x="640" y="133.0368" width="410.6075" height="384.9444" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.7861" rx="5.7742" />
  <text x="845.3037" y="179.2302" text-anchor="middle" font-size="24.6364" font-weight="bold">Remote Repository</text>
  <circle cx="776.8691" cy="256.2191" r="41.0607" fill="var(--primary-fill)" />
  <text x="776.8691" y="263.9179" text-anchor="middle" font-size="16.4243" fill="var(--bg)">origin</text>
  <text x="845.3037" y="333.2079" text-anchor="middle" font-size="19.1616">Server/Cloud</text>
  <text x="667.3738" y="379.4012" font-size="16.4243">• Central location</text>
  <text x="667.3738" y="410.1967" font-size="16.4243">• Team collaboration</text>
  <text x="667.3738" y="440.9923" font-size="16.4243">• Backup</text>
  <text x="667.3738" y="471.7879" font-size="16.4243">• CI/CD integration</text>
  <path d="M 503.131 287.0146 L 640 287.0146" stroke="var(--text)" stroke-width="2.5403" marker-end="url(#arrow)" />
  <path d="M 640 317.8101 L 503.131 317.8101" stroke="var(--text)" stroke-width="2.5403" marker-end="url(#arrow)" />
  <text x="571.5655" y="279.3157" text-anchor="middle" font-size="15.0556">push</text>
  <text x="571.5655" y="348.6056" text-anchor="middle" font-size="15.0556">fetch/pull</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />

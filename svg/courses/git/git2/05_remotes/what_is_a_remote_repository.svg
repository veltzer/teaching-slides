<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Local vs Remote</text>
  <rect x="80" y="144" width="480" height="450" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="320" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">Local Repository</text>
  <circle cx="240" cy="288" r="48" fill="#4CAF50" />
  <text x="240" y="297" text-anchor="middle" font-size="19.2" fill="white">.git</text>
  <text x="320" y="378" text-anchor="middle" font-size="22.4">Your Machine</text>
  <text x="112" y="432" font-size="19.2">• Full history</text>
  <text x="112" y="468" font-size="19.2">• All branches</text>
  <text x="112" y="504" font-size="19.2">• Working directory</text>
  <text x="112" y="540" font-size="19.2">• Can work offline</text>
  <rect x="720" y="144" width="480" height="450" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="960" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">Remote Repository</text>
  <circle cx="880" cy="288" r="48" fill="#2196F3" />
  <text x="880" y="297" text-anchor="middle" font-size="19.2" fill="white">origin</text>
  <text x="960" y="378" text-anchor="middle" font-size="22.4">Server/Cloud</text>
  <text x="752" y="432" font-size="19.2">• Central location</text>
  <text x="752" y="468" font-size="19.2">• Team collaboration</text>
  <text x="752" y="504" font-size="19.2">• Backup</text>
  <text x="752" y="540" font-size="19.2">• CI/CD integration</text>
  <path d="M 560 324 L 720 324" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <path d="M 720 360 L 560 360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <text x="640" y="315" text-anchor="middle" font-size="17.6">push</text>
  <text x="640" y="396" text-anchor="middle" font-size="17.6">fetch/pull</text>
  <defs>
    <marker id="arrow1" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="40" text-anchor="middle" font-size="41.8978" font-weight="bold">Local vs Remote</text>
  <rect x="40" y="120" width="514.2858" height="500" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="297.1428" y="180.0001" text-anchor="middle" font-size="31.4233" font-weight="bold">Local Repository</text>
  <rect x="159.056" y="227.628" width="104.744" height="104.744" rx="14" fill="var(--ok-fill)"/>
  <text x="211.4285" y="290" text-anchor="middle" font-size="20.9489" fill="var(--bg)">.git</text>
  <text x="297.1428" y="380" text-anchor="middle" font-size="24.4403">Your Machine</text>
  <text x="74.2859" y="440" font-size="20.9489">• Full history</text>
  <text x="74.2859" y="479.9999" font-size="20.9489">• All branches</text>
  <text x="74.2859" y="520" font-size="20.9489">• Working directory</text>
  <text x="74.2859" y="560" font-size="20.9489">• Can work offline</text>
  <rect x="725.7142" y="120" width="514.2858" height="500" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="982.857" y="180.0001" text-anchor="middle" font-size="31.4233" font-weight="bold">Remote Repository</text>
  <rect x="844.77" y="227.628" width="104.744" height="104.744" rx="14" fill="var(--primary-fill)"/>
  <text x="897.1427" y="290" text-anchor="middle" font-size="20.9489" fill="var(--bg)">origin</text>
  <text x="982.857" y="380" text-anchor="middle" font-size="24.4403">Server/Cloud</text>
  <text x="759.9998" y="440" font-size="20.9489">• Central location</text>
  <text x="759.9998" y="479.9999" font-size="20.9489">• Team collaboration</text>
  <text x="759.9998" y="520" font-size="20.9489">• Backup</text>
  <text x="759.9998" y="560" font-size="20.9489">• CI/CD integration</text>
  <path d="M 554.2858 320 L 725.7142 320" stroke="var(--text)" stroke-width="2.2687" marker-end="url(#arrow)" />
  <path d="M 725.7142 360 L 554.2858 360" stroke="var(--text)" stroke-width="2.2687" marker-end="url(#arrow)" />
  <text x="640" y="310" text-anchor="middle" font-size="19.2032">push</text>
  <text x="640" y="399.9999" text-anchor="middle" font-size="19.2032">fetch/pull</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="568.8889" y="64" text-anchor="middle" font-size="34.1333" font-weight="bold">Local vs Remote</ns0:text>
  <ns0:rect x="71.1111" y="128" width="426.6667" height="400" fill="#E8F5E9" stroke="#388E3C" stroke-width="2.8444" rx="7.1111" />
  <ns0:text x="284.4444" y="176" text-anchor="middle" font-size="25.6" font-weight="bold">Local Repository</ns0:text>
  <ns0:circle cx="213.3333" cy="256" r="42.6667" fill="#4CAF50" />
  <ns0:text x="213.3333" y="264" text-anchor="middle" font-size="17.0667" fill="white">.git</ns0:text>
  <ns0:text x="284.4444" y="336" text-anchor="middle" font-size="19.9111">Your Machine</ns0:text>
  <ns0:text x="99.5556" y="384" font-size="17.0667">• Full history</ns0:text>
  <ns0:text x="99.5556" y="416" font-size="17.0667">• All branches</ns0:text>
  <ns0:text x="99.5556" y="448" font-size="17.0667">• Working directory</ns0:text>
  <ns0:text x="99.5556" y="480" font-size="17.0667">• Can work offline</ns0:text>
  <ns0:rect x="640" y="128" width="426.6667" height="400" fill="#E3F2FD" stroke="#1976D2" stroke-width="2.8444" rx="7.1111" />
  <ns0:text x="853.3333" y="176" text-anchor="middle" font-size="25.6" font-weight="bold">Remote Repository</ns0:text>
  <ns0:circle cx="782.2222" cy="256" r="42.6667" fill="#2196F3" />
  <ns0:text x="782.2222" y="264" text-anchor="middle" font-size="17.0667" fill="white">origin</ns0:text>
  <ns0:text x="853.3333" y="336" text-anchor="middle" font-size="19.9111">Server/Cloud</ns0:text>
  <ns0:text x="668.4444" y="384" font-size="17.0667">• Central location</ns0:text>
  <ns0:text x="668.4444" y="416" font-size="17.0667">• Team collaboration</ns0:text>
  <ns0:text x="668.4444" y="448" font-size="17.0667">• Backup</ns0:text>
  <ns0:text x="668.4444" y="480" font-size="17.0667">• CI/CD integration</ns0:text>
  <ns0:path d="M 497.7778 288 L 640 288" stroke="#333" stroke-width="2.8444" marker-end="url(#arrow)" />
  <ns0:path d="M 640 320 L 497.7778 320" stroke="#333" stroke-width="2.8444" marker-end="url(#arrow)" />
  <ns0:text x="568.8889" y="280" text-anchor="middle" font-size="15.6444">push</ns0:text>
  <ns0:text x="568.8889" y="352" text-anchor="middle" font-size="15.6444">fetch/pull</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrow1" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <ns0:polygon points="0,18 4.8,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="80" text-anchor="middle" font-size="36.7816" font-weight="bold">Local vs Remote</text>
  <rect x="103.6015" y="148.9655" width="459.7702" height="431.0345" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.4655" />
  <text x="333.4865" y="200.6897" text-anchor="middle" font-size="27.5862" font-weight="bold">Local Repository</text>
  <circle cx="256.8582" cy="286.8966" r="45.977" fill="var(--ok-fill)" />
  <text x="256.8582" y="295.5172" text-anchor="middle" font-size="18.3908" fill="var(--bg)">.git</text>
  <text x="333.4865" y="373.1034" text-anchor="middle" font-size="21.4559">Your Machine</text>
  <text x="134.2529" y="424.8276" font-size="18.3908">• Full history</text>
  <text x="134.2529" y="459.3103" font-size="18.3908">• All branches</text>
  <text x="134.2529" y="493.7931" font-size="18.3908">• Working directory</text>
  <text x="134.2529" y="528.2759" font-size="18.3908">• Can work offline</text>
  <rect x="716.6283" y="148.9655" width="459.7702" height="431.0345" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.4655" />
  <text x="946.5134" y="200.6897" text-anchor="middle" font-size="27.5862" font-weight="bold">Remote Repository</text>
  <circle cx="869.885" cy="286.8966" r="45.977" fill="var(--primary-fill)" />
  <text x="869.885" y="295.5172" text-anchor="middle" font-size="18.3908" fill="var(--bg)">origin</text>
  <text x="946.5134" y="373.1034" text-anchor="middle" font-size="21.4559">Server/Cloud</text>
  <text x="747.2796" y="424.8276" font-size="18.3908">• Central location</text>
  <text x="747.2796" y="459.3103" font-size="18.3908">• Team collaboration</text>
  <text x="747.2796" y="493.7931" font-size="18.3908">• Backup</text>
  <text x="747.2796" y="528.2759" font-size="18.3908">• CI/CD integration</text>
  <path d="M 563.3717 321.3793 L 716.6283 321.3793" stroke="var(--text)" stroke-width="2.8444" marker-end="url(#arrow)" />
  <path d="M 716.6283 355.8621 L 563.3717 355.8621" stroke="var(--text)" stroke-width="2.8444" marker-end="url(#arrow)" />
  <text x="640" y="312.7586" text-anchor="middle" font-size="16.8582">push</text>
  <text x="640" y="390.3448" text-anchor="middle" font-size="16.8582">fetch/pull</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
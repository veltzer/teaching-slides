<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">GitHub Features</text>
  <rect x="80" y="144" width="320" height="216" fill="#222222" rx="8" />
  <text x="240" y="198" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Core Git</text>
  <text x="240" y="243" text-anchor="middle" font-size="19.2" fill="white">• Repositories</text>
  <text x="240" y="279" text-anchor="middle" font-size="19.2" fill="white">• Branches</text>
  <text x="240" y="315" text-anchor="middle" font-size="19.2" fill="white">• Commits</text>
  <rect x="432" y="144" width="320" height="216" fill="#1976d2" rx="8" />
  <text x="592" y="198" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Collaboration</text>
  <text x="592" y="243" text-anchor="middle" font-size="19.2" fill="white">• Pull Requests</text>
  <text x="592" y="279" text-anchor="middle" font-size="19.2" fill="white">• Code Review</text>
  <text x="592" y="315" text-anchor="middle" font-size="19.2" fill="white">• Issues</text>
  <rect x="784" y="144" width="320" height="216" fill="#28A745" rx="8" />
  <text x="944" y="198" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">CI/CD</text>
  <text x="944" y="243" text-anchor="middle" font-size="19.2" fill="white">• GitHub Actions</text>
  <text x="944" y="279" text-anchor="middle" font-size="19.2" fill="white">• Packages</text>
  <text x="944" y="315" text-anchor="middle" font-size="19.2" fill="white">• Releases</text>
  <rect x="80" y="396" width="320" height="216" fill="#673ab7" rx="8" />
  <text x="240" y="450" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Project Mgmt</text>
  <text x="240" y="495" text-anchor="middle" font-size="19.2" fill="white">• Projects</text>
  <text x="240" y="531" text-anchor="middle" font-size="19.2" fill="white">• Milestones</text>
  <text x="240" y="567" text-anchor="middle" font-size="19.2" fill="white">• Wiki</text>
  <rect x="432" y="396" width="320" height="216" fill="#f57c00" rx="8" />
  <text x="592" y="450" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Security</text>
  <text x="592" y="495" text-anchor="middle" font-size="19.2" fill="white">• Dependabot</text>
  <text x="592" y="531" text-anchor="middle" font-size="19.2" fill="white">• Code scanning</text>
  <text x="592" y="567" text-anchor="middle" font-size="19.2" fill="white">• Secrets</text>
  <rect x="784" y="396" width="320" height="216" fill="#DC3545" rx="8" />
  <text x="944" y="450" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Social</text>
  <text x="944" y="495" text-anchor="middle" font-size="19.2" fill="white">• Stars</text>
  <text x="944" y="531" text-anchor="middle" font-size="19.2" fill="white">• Forks</text>
  <text x="944" y="567" text-anchor="middle" font-size="19.2" fill="white">• Discussions</text>
</svg>
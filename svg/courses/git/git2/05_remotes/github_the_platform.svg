<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">GitHub Features</text>
  <rect x="80" y="144" width="320" height="216" fill="#24292E" rx="8" />
  <text x="240" y="198" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Core Git</text>
  <text x="240" y="243" text-anchor="middle" font-size="19.2" fill="white">• Repositories</text>
  <text x="240" y="279" text-anchor="middle" font-size="19.2" fill="white">• Branches</text>
  <text x="240" y="315" text-anchor="middle" font-size="19.2" fill="white">• Commits</text>
  <rect x="432" y="144" width="320" height="216" fill="#0366D6" rx="8" />
  <text x="592" y="198" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Collaboration</text>
  <text x="592" y="243" text-anchor="middle" font-size="19.2" fill="white">• Pull Requests</text>
  <text x="592" y="279" text-anchor="middle" font-size="19.2" fill="white">• Code Review</text>
  <text x="592" y="315" text-anchor="middle" font-size="19.2" fill="white">• Issues</text>
  <rect x="784" y="144" width="320" height="216" fill="#28A745" rx="8" />
  <text x="944" y="198" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">CI/CD</text>
  <text x="944" y="243" text-anchor="middle" font-size="19.2" fill="white">• GitHub Actions</text>
  <text x="944" y="279" text-anchor="middle" font-size="19.2" fill="white">• Packages</text>
  <text x="944" y="315" text-anchor="middle" font-size="19.2" fill="white">• Releases</text>
  <rect x="80" y="396" width="320" height="216" fill="#6F42C1" rx="8" />
  <text x="240" y="450" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Project Mgmt</text>
  <text x="240" y="495" text-anchor="middle" font-size="19.2" fill="white">• Projects</text>
  <text x="240" y="531" text-anchor="middle" font-size="19.2" fill="white">• Milestones</text>
  <text x="240" y="567" text-anchor="middle" font-size="19.2" fill="white">• Wiki</text>
  <rect x="432" y="396" width="320" height="216" fill="#FD7E14" rx="8" />
  <text x="592" y="450" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Security</text>
  <text x="592" y="495" text-anchor="middle" font-size="19.2" fill="white">• Dependabot</text>
  <text x="592" y="531" text-anchor="middle" font-size="19.2" fill="white">• Code scanning</text>
  <text x="592" y="567" text-anchor="middle" font-size="19.2" fill="white">• Secrets</text>
  <rect x="784" y="396" width="320" height="216" fill="#DC3545" rx="8" />
  <text x="944" y="450" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Social</text>
  <text x="944" y="495" text-anchor="middle" font-size="19.2" fill="white">• Stars</text>

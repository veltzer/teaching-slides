<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Bare vs Non-Bare Repositories</text>
  <rect x="80" y="144" width="512" height="504" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="336" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">Non-Bare (Local)</text>
  <rect x="112" y="234" width="448" height="54" fill="#81C784" rx="4.8" />
  <text x="336" y="270" text-anchor="middle" font-size="19.2" fill="white">.git/</text>
  <rect x="112" y="306" width="448" height="54" fill="#A5D6A7" rx="4.8" />
  <text x="336" y="342" text-anchor="middle" font-size="19.2">Working Directory</text>
  <text x="112" y="405" font-size="19.2">✓ Can edit files</text>
  <text x="112" y="441" font-size="19.2">✓ Can make commits</text>
  <text x="112" y="477" font-size="19.2">✓ Has working tree</text>
  <text x="112" y="513" font-size="19.2">✗ Not ideal for sharing</text>
  <text x="336" y="567" text-anchor="middle" font-size="20.8" font-weight="bold">Your local repository</text>
  <rect x="688" y="144" width="512" height="504" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="944" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">Bare (Remote)</text>
  <rect x="720" y="234" width="448" height="54" fill="#FFB74D" rx="4.8" />
  <text x="944" y="270" text-anchor="middle" font-size="19.2" fill="white">repo.git/</text>
  <rect x="720" y="306" width="448" height="54" fill="#FFE0B2" rx="4.8" stroke-dasharray="8 8" stroke="#999" />
  <text x="944" y="342" text-anchor="middle" font-size="19.2" fill="#999">No Working Directory</text>
  <text x="720" y="405" font-size="19.2">✗ Cannot edit files directly</text>
  <text x="720" y="441" font-size="19.2">✗ Cannot make commits</text>
  <text x="720" y="477" font-size="19.2">✓ Optimized for sharing</text>
  <text x="720" y="513" font-size="19.2">✓ Accepts pushes safely</text>
  <text x="944" y="567" text-anchor="middle" font-size="20.8" font-weight="bold">GitHub/GitLab repositories</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Bare vs Non-Bare Repositories</text>
  <rect x="79.0123" y="142.2222" width="505.679" height="497.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="331.8519" y="195.5556" text-anchor="middle" font-size="28.4444" font-weight="bold">Non-Bare (Local)</text>
  <rect x="110.6173" y="231.1111" width="442.4691" height="53.3333" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="331.8519" y="266.6667" text-anchor="middle" font-size="18.963" fill="var(--bg)">.git/</text>
  <rect x="110.6173" y="302.2222" width="442.4691" height="53.3333" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="331.8519" y="337.7778" text-anchor="middle" font-size="18.963">Working Directory</text>
  <text x="110.6173" y="400" font-size="18.963">✓ Can edit files</text>
  <text x="110.6173" y="435.5556" font-size="18.963">✓ Can make commits</text>
  <text x="110.6173" y="471.1111" font-size="18.963">✓ Has working tree</text>
  <text x="110.6173" y="506.6667" font-size="18.963">✗ Not ideal for sharing</text>
  <text x="331.8519" y="560" text-anchor="middle" font-size="20.5432" font-weight="bold">Your local repository</text>
  <rect x="679.5062" y="142.2222" width="505.679" height="497.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="932.3457" y="195.5556" text-anchor="middle" font-size="28.4444" font-weight="bold">Bare (Remote)</text>
  <rect x="711.1111" y="231.1111" width="442.4691" height="53.3333" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="932.3457" y="266.6667" text-anchor="middle" font-size="18.963" fill="var(--bg)">repo.git/</text>
  <rect x="711.1111" y="302.2222" width="442.4691" height="53.3333" fill="var(--warn-fill)" rx="6" stroke-dasharray="7.9012 7.9012" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="932.3457" y="337.7778" text-anchor="middle" font-size="18.963" fill="var(--text-faint)">No Working Directory</text>
  <text x="711.1111" y="400" font-size="18.963">✗ Cannot edit files directly</text>
  <text x="711.1111" y="435.5556" font-size="18.963">✗ Cannot make commits</text>
  <text x="711.1111" y="471.1111" font-size="18.963">✓ Optimized for sharing</text>
  <text x="711.1111" y="506.6667" font-size="18.963">✓ Accepts pushes safely</text>
  <text x="932.3457" y="560" text-anchor="middle" font-size="20.5432" font-weight="bold">GitHub/GitLab repositories</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="39.8855" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Bare vs Non-Bare Repositories</text>
  <rect x="40" y="112.5" width="548.5714" height="507.5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="314.2858" y="166.8751" text-anchor="middle" font-size="29.9141" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Non-Bare (Local)</text>
  <rect x="74.2858" y="203.125" width="479.9999" height="54.375" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2858" y="239.375" text-anchor="middle" font-size="19.9428" fill="var(--bg)" font-family="Arial, sans-serif">.git/</text>
  <rect x="74.2858" y="275.625" width="479.9999" height="54.375" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2858" y="311.875" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--ok-text)">Working Directory</text>
  <text x="74.2858" y="375.3125" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Can edit files</text>
  <text x="74.2858" y="411.5625" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Can make commits</text>
  <text x="74.2858" y="447.8125" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Has working tree</text>
  <text x="74.2858" y="484.0625" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--ok-text)">✗ Not ideal for sharing</text>
  <text x="314.2858" y="538.4375" text-anchor="middle" font-size="21.6047" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Your local repository</text>
  <rect x="691.4286" y="112.5" width="548.5714" height="507.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="965.7143" y="166.8751" text-anchor="middle" font-size="29.9141" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Bare (Remote)</text>
  <rect x="725.7143" y="203.125" width="479.9999" height="54.375" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965.7143" y="239.375" text-anchor="middle" font-size="19.9428" fill="var(--bg)" font-family="Arial, sans-serif">repo.git/</text>
  <rect x="725.7143" y="275.625" width="479.9999" height="54.375" fill="url(#grad-warn)" rx="6" stroke-dasharray="7.9012 7.9012" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965.7143" y="311.875" text-anchor="middle" font-size="19.9428" fill="var(--text-faint)" font-family="Arial, sans-serif">No Working Directory</text>
  <text x="725.7143" y="375.3125" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--warn-text)">✗ Cannot edit files directly</text>
  <text x="725.7143" y="411.5625" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--warn-text)">✗ Cannot make commits</text>
  <text x="725.7143" y="447.8125" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--warn-text)">✓ Optimized for sharing</text>
  <text x="725.7143" y="484.0625" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--warn-text)">✓ Accepts pushes safely</text>
  <text x="965.7143" y="538.4375" text-anchor="middle" font-size="21.6047" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">GitHub/GitLab repositories</text>
</svg>
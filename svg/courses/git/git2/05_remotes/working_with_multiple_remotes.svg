<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="453.0973" y="50.9735" text-anchor="middle" font-size="27.1858" font-weight="bold">Multiple Remotes Workflow</text>
  <circle cx="453.0973" cy="254.8673" r="45.3097" fill="var(--ok-fill)" />
  <text x="453.0973" y="261.2389" text-anchor="middle" font-size="15.8584" fill="var(--bg)">Local</text>
  <circle cx="226.5487" cy="127.4336" r="39.646" fill="var(--primary-fill)" />
  <text x="226.5487" y="133.8053" text-anchor="middle" font-size="13.5929" fill="var(--bg)">origin</text>
  <text x="226.5487" y="159.292" text-anchor="middle" font-size="11.3274">Your fork</text>
  <circle cx="679.646" cy="127.4336" r="39.646" fill="var(--warn-fill)" />
  <text x="679.646" y="133.8053" text-anchor="middle" font-size="13.5929" fill="var(--bg)">upstream</text>
  <text x="679.646" y="159.292" text-anchor="middle" font-size="11.3274">Original</text>
  <circle cx="226.5487" cy="382.3009" r="39.646" fill="var(--info-fill)" />
  <text x="226.5487" y="388.6726" text-anchor="middle" font-size="13.5929" fill="var(--bg)">backup</text>
  <text x="226.5487" y="414.1593" text-anchor="middle" font-size="11.3274">GitLab</text>
  <circle cx="679.646" cy="382.3009" r="39.646" fill="var(--text-muted)" />
  <text x="679.646" y="388.6726" text-anchor="middle" font-size="13.5929" fill="var(--bg)">deploy</text>
  <text x="679.646" y="414.1593" text-anchor="middle" font-size="11.3274">Production</text>
  <path d="M 407.7876 229.3805 L 266.1947 159.292" stroke="var(--text)" stroke-width="2.2655" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <path d="M 498.4071 229.3805 L 640 159.292" stroke="var(--text)" stroke-width="2.2655" marker-end="url(#arrow)" />
  <path d="M 407.7876 280.354 L 266.1947 350.4425" stroke="var(--text)" stroke-width="2.2655" marker-end="url(#arrow)" />
  <path d="M 498.4071 280.354 L 640 350.4425" stroke="var(--text)" stroke-width="2.2655" marker-end="url(#arrow)" />
  <text x="317.1681" y="191.1504" font-size="11.3274">push/pull</text>
  <text x="589.0265" y="191.1504" font-size="11.3274">fetch</text>
  <text x="317.1681" y="318.5841" font-size="11.3274">push</text>
  <text x="589.0265" y="318.5841" font-size="11.3274">push</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
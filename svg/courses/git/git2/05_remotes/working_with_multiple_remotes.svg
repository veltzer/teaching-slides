<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.998" y="40" text-anchor="middle" font-size="51.135215" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Multiple Remotes Workflow</text>
  <rect x="554.773284" y="265.807" width="170.449432" height="170.45" rx="13.999977" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="639.998" y="360.7524" text-anchor="middle" font-size="29.82875" fill="var(--bg)" font-family="Arial, sans-serif">Local</text>
  <rect x="40" y="82.0652" width="149.143503" height="149.144" rx="13.999977" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="114.571751" y="166.3569" text-anchor="middle" font-size="25.567557" fill="var(--bg)" font-family="Arial, sans-serif">origin</text>
  <text x="114.571751" y="205.236" text-anchor="middle" font-size="21.306264" font-family="Arial, sans-serif" fill="var(--primary-text)">Your fork</text>
  <rect x="1090.856497" y="82.0652" width="149.143503" height="149.144" rx="13.999977" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="1165.424249" y="166.3569" text-anchor="middle" font-size="25.567557" fill="var(--bg)" font-family="Arial, sans-serif">upstream</text>
  <text x="1165.424249" y="205.236" text-anchor="middle" font-size="21.306264" font-family="Arial, sans-serif" fill="var(--warn-text)">Original</text>
  <rect x="40" y="470.856" width="149.143503" height="149.144" rx="13.999977" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="114.571751" y="555.1477" text-anchor="middle" font-size="25.567557" fill="var(--bg)" font-family="Arial, sans-serif">backup</text>
  <text x="114.571751" y="594.0267" text-anchor="middle" font-size="21.306264" font-family="Arial, sans-serif" fill="var(--info-text)">GitLab</text>
  <rect x="1090.856497" y="470.856" width="149.143503" height="149.144" rx="13.999977" fill="var(--text-muted)"/>
  <text x="1165.424249" y="555.1477" text-anchor="middle" font-size="25.567557" fill="var(--bg)" font-family="Arial, sans-serif">deploy</text>
  <text x="1165.424249" y="594.0267" text-anchor="middle" font-size="21.306264" font-family="Arial, sans-serif" fill="var(--text)">Production</text>
  <path d="M 534.91295 312.1535 L 206.521445 205.236" stroke="var(--text)" stroke-width="1.1665" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <path d="M 745.08355 312.1535 L 1073.474955 205.236" stroke="var(--text)" stroke-width="1.1665" marker-end="url(#arrow)" />
  <path d="M 534.91295 389.9115 L 206.521445 496.8292" stroke="var(--text)" stroke-width="1.1665" marker-end="url(#arrow)" />
  <path d="M 745.08355 389.9115 L 1073.474955 496.8292" stroke="var(--text)" stroke-width="1.1665" marker-end="url(#arrow)" />
  <text x="324.742251" y="253.8348" font-size="21.306264" font-family="Arial, sans-serif" fill="var(--text)">push/pull</text>
  <text x="955.253949" y="253.8348" font-size="21.306264" font-family="Arial, sans-serif" fill="var(--text)">fetch</text>
  <text x="324.742251" y="448.2301" font-size="21.306264" font-family="Arial, sans-serif" fill="var(--text)">push</text>
  <text x="955.253949" y="448.2301" font-size="21.306264" font-family="Arial, sans-serif" fill="var(--text)">push</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
  <text x="1163.6751" y="595.9013" text-anchor="middle" font-size="21.3066">Production</text>
  <path d="M 535.2652 313.0742 L 207.9681 205.7951" stroke="var(--text)" stroke-width="1.1665" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <path d="M 744.7353 313.0742 L 1072.0323 205.7951" stroke="var(--text)" stroke-width="1.1665" marker-end="url(#arrow)" />

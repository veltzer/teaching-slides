<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Common Collaboration Workflows</text>
  <rect x="79.0123" y="142.2222" width="268.642" height="497.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="213.3333" y="195.5556" text-anchor="middle" font-size="25.284" font-weight="bold">Centralized</text>
  <circle cx="213.3333" cy="266.6667" r="31.6049" fill="var(--ok-fill)" />
  <text x="213.3333" y="275.5556" text-anchor="middle" font-size="15.8025" fill="var(--bg)">main</text>
  <circle cx="142.2222" cy="391.1111" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="213.3333" cy="391.1111" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="284.4444" cy="391.1111" r="23.7037" fill="var(--ok-fill)" />
  <line x1="142.2222" y1="364.4444" x2="197.5309" y2="302.2222" stroke="var(--text)" stroke-width="2" />
  <line x1="213.3333" y1="364.4444" x2="213.3333" y2="302.2222" stroke="var(--text)" stroke-width="2" />
  <line x1="284.4444" y1="364.4444" x2="229.1358" y2="302.2222" stroke="var(--text)" stroke-width="2" />
  <text x="213.3333" y="462.2222" text-anchor="middle" font-size="17.3827">Everyone pushes</text>
  <text x="213.3333" y="488.8889" text-anchor="middle" font-size="17.3827">to main</text>
  <text x="213.3333" y="542.2222" text-anchor="middle" font-size="18.963" font-weight="bold">Simple</text>
  <text x="213.3333" y="577.7778" text-anchor="middle" font-size="17.3827">Small teams</text>
  <rect x="379.2593" y="142.2222" width="268.642" height="497.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="513.5802" y="195.5556" text-anchor="middle" font-size="25.284" font-weight="bold">Feature Branch</text>
  <circle cx="513.5802" cy="266.6667" r="31.6049" fill="var(--primary-fill)" />
  <text x="513.5802" y="275.5556" text-anchor="middle" font-size="15.8025" fill="var(--bg)">main</text>
  <circle cx="442.4691" cy="355.5556" r="23.7037" fill="var(--primary-fill)" />
  <circle cx="584.6914" cy="355.5556" r="23.7037" fill="var(--primary-fill)" />
  <line x1="497.7778" y1="302.2222" x2="458.2716" y2="328.8889" stroke="var(--text)" stroke-width="2" />
  <line x1="529.3827" y1="302.2222" x2="568.8889" y2="328.8889" stroke="var(--text)" stroke-width="2" />
  <text x="442.4691" y="400" text-anchor="middle" font-size="15.8025">feat-1</text>
  <text x="584.6914" y="400" text-anchor="middle" font-size="15.8025">feat-2</text>
  <text x="513.5802" y="462.2222" text-anchor="middle" font-size="17.3827">Branch per</text>
  <text x="513.5802" y="488.8889" text-anchor="middle" font-size="17.3827">feature</text>
  <text x="513.5802" y="542.2222" text-anchor="middle" font-size="18.963" font-weight="bold">Popular</text>
  <text x="513.5802" y="577.7778" text-anchor="middle" font-size="17.3827">Most teams</text>
  <rect x="679.5062" y="142.2222" width="268.642" height="497.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="813.8272" y="195.5556" text-anchor="middle" font-size="25.284" font-weight="bold">Gitflow</text>
  <circle cx="813.8272" cy="266.6667" r="23.7037" fill="var(--warn-fill)" />
  <text x="813.8272" y="275.5556" text-anchor="middle" font-size="15.8025" fill="var(--bg)">main</text>
  <circle cx="813.8272" cy="337.7778" r="23.7037" fill="var(--warn-fill)" />
  <text x="813.8272" y="346.6667" text-anchor="middle" font-size="15.8025">develop</text>
  <circle cx="742.716" cy="408.8889" r="18.963" fill="var(--warn-fill)" />
  <circle cx="884.9383" cy="408.8889" r="18.963" fill="var(--warn-fill)" />
  <text x="813.8272" y="471.1111" text-anchor="middle" font-size="17.3827">Multiple</text>
  <text x="813.8272" y="497.7778" text-anchor="middle" font-size="17.3827">branch types</text>
  <text x="813.8272" y="542.2222" text-anchor="middle" font-size="18.963" font-weight="bold">Complex</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="39.8855" font-weight="bold">Common Collaboration Workflows</text>
  <rect x="40" y="112.5" width="291.4286" height="507.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="185.7143" y="166.8751" text-anchor="middle" font-size="26.5904" font-weight="bold">Centralized</text>
  <circle cx="185.7143" cy="239.375" r="33.2379" fill="var(--ok-fill)" />
  <text x="185.7143" y="248.4376" text-anchor="middle" font-size="16.619" fill="var(--bg)">main</text>
  <circle cx="108.5715" cy="366.25" r="24.9285" fill="var(--ok-fill)" />
  <circle cx="185.7143" cy="366.25" r="24.9285" fill="var(--ok-fill)" />
  <circle cx="262.8571" cy="366.25" r="24.9285" fill="var(--ok-fill)" />
  <line x1="108.5715" y1="339.0625" x2="168.5715" y2="275.625" stroke="var(--text)" stroke-width="2" />
  <line x1="185.7143" y1="339.0625" x2="185.7143" y2="275.625" stroke="var(--text)" stroke-width="2" />
  <line x1="262.8571" y1="339.0625" x2="202.8572" y2="275.625" stroke="var(--text)" stroke-width="2" />
  <text x="185.7143" y="438.75" text-anchor="middle" font-size="18.2809">Everyone pushes</text>
  <text x="185.7143" y="465.9375" text-anchor="middle" font-size="18.2809">to main</text>
  <text x="185.7143" y="520.3125" text-anchor="middle" font-size="19.9428" font-weight="bold">Simple</text>
  <text x="185.7143" y="556.5625" text-anchor="middle" font-size="18.2809">Small teams</text>
  <rect x="365.7144" y="112.5" width="291.4286" height="507.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="511.4285" y="166.8751" text-anchor="middle" font-size="26.5904" font-weight="bold">Feature Branch</text>
  <circle cx="511.4285" cy="239.375" r="33.2379" fill="var(--primary-fill)" />
  <text x="511.4285" y="248.4376" text-anchor="middle" font-size="16.619" fill="var(--bg)">main</text>
  <circle cx="434.2857" cy="330.0001" r="24.9285" fill="var(--primary-fill)" />
  <circle cx="588.5715" cy="330.0001" r="24.9285" fill="var(--primary-fill)" />
  <line x1="494.2858" y1="275.625" x2="451.4286" y2="302.8125" stroke="var(--text)" stroke-width="2" />
  <line x1="528.5714" y1="275.625" x2="571.4286" y2="302.8125" stroke="var(--text)" stroke-width="2" />
  <text x="434.2857" y="375.3125" text-anchor="middle" font-size="16.619">feat-1</text>
  <text x="588.5715" y="375.3125" text-anchor="middle" font-size="16.619">feat-2</text>
  <text x="511.4285" y="438.75" text-anchor="middle" font-size="18.2809">Branch per</text>
  <text x="511.4285" y="465.9375" text-anchor="middle" font-size="18.2809">feature</text>
  <text x="511.4285" y="520.3125" text-anchor="middle" font-size="19.9428" font-weight="bold">Popular</text>
  <text x="511.4285" y="556.5625" text-anchor="middle" font-size="18.2809">Most teams</text>
  <rect x="691.4286" y="112.5" width="291.4286" height="507.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="837.1429" y="166.8751" text-anchor="middle" font-size="26.5904" font-weight="bold">Gitflow</text>
  <circle cx="837.1429" cy="239.375" r="24.9285" fill="var(--warn-fill)" />
  <text x="837.1429" y="248.4376" text-anchor="middle" font-size="16.619" fill="var(--bg)">main</text>
  <circle cx="837.1429" cy="311.875" r="24.9285" fill="var(--warn-fill)" />
  <text x="837.1429" y="320.9375" text-anchor="middle" font-size="16.619">develop</text>
  <circle cx="760" cy="384.375" r="19.9428" fill="var(--warn-fill)" />
  <circle cx="914.2857" cy="384.375" r="19.9428" fill="var(--warn-fill)" />
  <text x="837.1429" y="447.8125" text-anchor="middle" font-size="18.2809">Multiple</text>

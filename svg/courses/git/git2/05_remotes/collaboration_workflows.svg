  <rect x="894.343" y="364.432" width="39.8856" height="39.8856" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="837.1429" y="447.8125" text-anchor="middle" font-size="18.2809" font-family="Arial, sans-serif" fill="var(--warn-text)">Multiple</text>
  <text x="837.1429" y="475" text-anchor="middle" font-size="18.2809" font-family="Arial, sans-serif" fill="var(--warn-text)">branch types</text>
  <text x="837.1429" y="520.3125" text-anchor="middle" font-size="19.9428" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Complex</text>

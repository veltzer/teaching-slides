  <text x="1128.5714" y="520.3125" text-anchor="middle" font-size="19.9428" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">OSS</text>
  <text x="1128.5714" y="556.5625" text-anchor="middle" font-size="18.2809" font-family="Arial, sans-serif" fill="var(--danger-text)">Open source</text>

  <text x="185.7143" y="465.9375" text-anchor="middle" font-size="18.2809" font-family="Arial, sans-serif" fill="var(--ok-text)">to main</text>
  <text x="185.7143" y="520.3125" text-anchor="middle" font-size="19.9428" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Simple</text>
  <text x="185.7143" y="556.5625" text-anchor="middle" font-size="18.2809" font-family="Arial, sans-serif" fill="var(--ok-text)">Small teams</text>
  <rect x="365.7144" y="112.5" width="291.4286" height="507.5" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="511.4285" y="166.8751" text-anchor="middle" font-size="26.5904" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Feature Branch</text>

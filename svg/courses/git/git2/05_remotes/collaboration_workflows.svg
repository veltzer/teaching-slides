  <rect x="1017.1429" y="112.5" width="222.8571" height="507.5" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1128.5714" y="166.8751" text-anchor="middle" font-size="26.5904" font-weight="bold">Forking</text>

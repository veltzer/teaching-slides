  <rect x="979.7531" y="142.2222" width="205.4321" height="497.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1082.4691" y="195.5556" text-anchor="middle" font-size="25.284" font-weight="bold">Forking</text>
  <circle cx="1082.4691" cy="266.6667" r="23.7037" fill="var(--danger-fill)" />

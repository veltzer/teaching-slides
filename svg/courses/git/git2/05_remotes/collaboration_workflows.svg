  <rect x="409.357" y="305.072" width="49.857" height="49.857" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="563.643" y="305.072" width="49.857" height="49.857" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <line x1="494.2858" y1="275.625" x2="451.4286" y2="302.8125" stroke="var(--text)" stroke-width="2"/>
  <line x1="528.5714" y1="275.625" x2="571.4286" y2="302.8125" stroke="var(--text)" stroke-width="2"/>
  <text x="434.2857" y="375.3125" text-anchor="middle" font-size="16.619" font-family="Arial, sans-serif" fill="var(--primary-text)">feat-1</text>
  <text x="588.5715" y="375.3125" text-anchor="middle" font-size="16.619" font-family="Arial, sans-serif" fill="var(--primary-text)">feat-2</text>
  <text x="511.4285" y="438.75" text-anchor="middle" font-size="18.2809" font-family="Arial, sans-serif" fill="var(--primary-text)">Branch per</text>
  <text x="511.4285" y="465.9375" text-anchor="middle" font-size="18.2809" font-family="Arial, sans-serif" fill="var(--primary-text)">feature</text>
  <text x="511.4285" y="520.3125" text-anchor="middle" font-size="19.9428" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Popular</text>
  <text x="511.4285" y="556.5625" text-anchor="middle" font-size="18.2809" font-family="Arial, sans-serif" fill="var(--primary-text)">Most teams</text>

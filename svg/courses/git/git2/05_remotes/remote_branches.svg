<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Local vs Remote Branches</text>
  <rect x="80" y="144" width="480" height="270" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="320" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Local Branches</text>
  <rect x="112" y="234" width="160" height="54" fill="#4CAF50" rx="4.8" />
  <text x="192" y="270" text-anchor="middle" font-size="19.2" fill="white">main</text>
  <rect x="112" y="306" width="160" height="54" fill="#4CAF50" rx="4.8" />
  <text x="192" y="342" text-anchor="middle" font-size="19.2" fill="white">feature</text>
  <text x="320" y="387" text-anchor="middle" font-size="17.6">You can modify</text>
  <rect x="720" y="144" width="480" height="270" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="960" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Remote-Tracking Branches</text>
  <rect x="752" y="234" width="240" height="54" fill="#FF9800" rx="4.8" />
  <text x="872" y="270" text-anchor="middle" font-size="19.2" fill="white">origin/main</text>
  <rect x="752" y="306" width="240" height="54" fill="#FF9800" rx="4.8" />
  <text x="872" y="342" text-anchor="middle" font-size="19.2" fill="white">origin/feature</text>
  <text x="960" y="387" text-anchor="middle" font-size="17.6">Read-only references</text>
  <rect x="320" y="468" width="640" height="180" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="522" text-anchor="middle" font-size="22.4" font-weight="bold">Remote-tracking branches:</text>
  <text x="352" y="567" font-size="19.2">• Show state of remote branches</text>
  <text x="352" y="603" font-size="19.2">• Updated with fetch/pull</text>
  <text x="352" y="639" font-size="19.2">• Cannot be directly modified</text>
</svg>
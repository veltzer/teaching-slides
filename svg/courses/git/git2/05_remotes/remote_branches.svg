<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Local vs Remote Branches</ns0:text>
  <ns0:rect x="79.0123" y="142.2222" width="474.0741" height="266.6667" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="316.0494" y="195.5556" text-anchor="middle" font-size="25.284" font-weight="bold">Local Branches</ns0:text>
  <ns0:rect x="110.6173" y="231.1111" width="158.0247" height="53.3333" fill="#4CAF50" rx="4.7407" />
  <ns0:text x="189.6296" y="266.6667" text-anchor="middle" font-size="18.963" fill="white">main</ns0:text>
  <ns0:rect x="110.6173" y="302.2222" width="158.0247" height="53.3333" fill="#4CAF50" rx="4.7407" />
  <ns0:text x="189.6296" y="337.7778" text-anchor="middle" font-size="18.963" fill="white">feature</ns0:text>
  <ns0:text x="316.0494" y="382.2222" text-anchor="middle" font-size="17.3827">You can modify</ns0:text>
  <ns0:rect x="711.1111" y="142.2222" width="474.0741" height="266.6667" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="948.1481" y="195.5556" text-anchor="middle" font-size="25.284" font-weight="bold">Remote-Tracking Branches</ns0:text>
  <ns0:rect x="742.716" y="231.1111" width="237.037" height="53.3333" fill="#FF9800" rx="4.7407" />
  <ns0:text x="861.2346" y="266.6667" text-anchor="middle" font-size="18.963" fill="white">origin/main</ns0:text>
  <ns0:rect x="742.716" y="302.2222" width="237.037" height="53.3333" fill="#FF9800" rx="4.7407" />
  <ns0:text x="861.2346" y="337.7778" text-anchor="middle" font-size="18.963" fill="white">origin/feature</ns0:text>
  <ns0:text x="948.1481" y="382.2222" text-anchor="middle" font-size="17.3827">Read-only references</ns0:text>
  <ns0:rect x="316.0494" y="462.2222" width="632.0988" height="177.7778" fill="#F5F5F5" stroke="#333" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="632.0988" y="515.5556" text-anchor="middle" font-size="22.1235" font-weight="bold">Remote-tracking branches:</ns0:text>
  <ns0:text x="347.6543" y="560" font-size="18.963">• Show state of remote branches</ns0:text>
  <ns0:text x="347.6543" y="595.5556" font-size="18.963">• Updated with fetch/pull</ns0:text>
  <ns0:text x="347.6543" y="631.1111" font-size="18.963">• Cannot be directly modified</ns0:text>
</ns0:svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="416.2602" y="46.8293" text-anchor="middle" font-size="24.9756" font-weight="bold">Fetch vs Pull</ns0:text>
  <ns0:rect x="52.0325" y="93.6585" width="333.0081" height="327.8049" fill="#E8F5E9" stroke="#388E3C" stroke-width="2.0813" rx="5.2033" />
  <ns0:text x="218.5366" y="128.7805" text-anchor="middle" font-size="18.7317" font-weight="bold">git fetch</ns0:text>
  <ns0:circle cx="218.5366" cy="187.3171" r="26.0163" fill="#4CAF50" />
  <ns0:text x="218.5366" y="193.1707" text-anchor="middle" font-size="10.4065" fill="white">Remote</ns0:text>
  <ns0:path d="M 218.5366 216.5854 L 218.5366 251.7073" stroke="#333" stroke-width="2.0813" marker-end="url(#arrow2)" />
  <ns0:circle cx="218.5366" cy="280.9756" r="26.0163" fill="#FF9800" />
  <ns0:text x="218.5366" y="286.8293" text-anchor="middle" font-size="10.4065" fill="white">origin/main</ns0:text>
  <ns0:text x="218.5366" y="327.8049" text-anchor="middle" font-size="12.4878">Updates references only</ns0:text>
  <ns0:text x="218.5366" y="351.2195" text-anchor="middle" font-size="12.4878">Safe - no merge</ns0:text>
  <ns0:text x="218.5366" y="374.6341" text-anchor="middle" font-size="12.4878">Review before integrating</ns0:text>
  <ns0:rect x="447.4797" y="93.6585" width="333.0081" height="327.8049" fill="#E3F2FD" stroke="#1976D2" stroke-width="2.0813" rx="5.2033" />
  <ns0:text x="613.9837" y="128.7805" text-anchor="middle" font-size="18.7317" font-weight="bold">git pull</ns0:text>
  <ns0:circle cx="613.9837" cy="187.3171" r="26.0163" fill="#2196F3" />
  <ns0:text x="613.9837" y="193.1707" text-anchor="middle" font-size="10.4065" fill="white">Remote</ns0:text>
  <ns0:path d="M 613.9837 216.5854 L 613.9837 251.7073" stroke="#333" stroke-width="2.0813" marker-end="url(#arrow2)" />
  <ns0:circle cx="561.9512" cy="280.9756" r="26.0163" fill="#FF9800" />
  <ns0:text x="561.9512" y="286.8293" text-anchor="middle" font-size="10.4065" fill="white">origin/main</ns0:text>
  <ns0:circle cx="666.0163" cy="280.9756" r="26.0163" fill="#4CAF50" />
  <ns0:text x="666.0163" y="286.8293" text-anchor="middle" font-size="10.4065" fill="white">main</ns0:text>
  <ns0:path d="M 587.9675 280.9756 L 640 280.9756" stroke="#333" stroke-width="2.0813" marker-end="url(#arrow2)" />
  <ns0:text x="613.9837" y="327.8049" text-anchor="middle" font-size="12.4878">Fetch + Merge</ns0:text>
  <ns0:text x="613.9837" y="351.2195" text-anchor="middle" font-size="12.4878">Updates working branch</ns0:text>
  <ns0:text x="613.9837" y="374.6341" text-anchor="middle" font-size="12.4878">Can cause conflicts</ns0:text>
  <ns0:defs>
    <ns0:marker id="arrow2" markerWidth="10.4065" markerHeight="11.7073" refX="8.3252" refY="3.5122" orient="auto">
      <ns0:polygon points="0,11.7073 3.122,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
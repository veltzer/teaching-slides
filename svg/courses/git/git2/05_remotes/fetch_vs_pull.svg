<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="416.2602" y="46.8293" text-anchor="middle" font-size="24.9756" font-weight="bold">Fetch vs Pull</ns0:text>
  <ns0:rect x="52.0325" y="93.6585" width="333.0081" height="327.8049" fill="#E8F5E9" stroke="#388E3C" stroke-width="2.0813" rx="5.2033" />
  <ns0:text x="218.5366" y="128.7805" text-anchor="middle" font-size="18.7317" font-weight="bold">git fetch</ns0:text>
  <ns0:circle cx="218.5366" cy="187.3171" r="26.0163" fill="#4CAF50" />
  <ns0:text x="218.5366" y="193.1707" text-anchor="middle" font-size="10.4065" fill="white">Remote</ns0:text>
  <ns0:path d="M 218.5366 216.5854 L 218.5366 251.7073" stroke="#333" stroke-width="2.0813" marker-end="url(#arrow)" />
  <ns0:circle cx="218.5366" cy="280.9756" r="26.0163" fill="#FF9800" />
  <ns0:text x="218.5366" y="286.8293" text-anchor="middle" font-size="10.4065" fill="white">origin/main</ns0:text>
  <ns0:text x="218.5366" y="327.8049" text-anchor="middle" font-size="12.4878">Updates references only</ns0:text>
  <ns0:text x="218.5366" y="351.2195" text-anchor="middle" font-size="12.4878">Safe - no merge</ns0:text>
  <ns0:text x="218.5366" y="374.6341" text-anchor="middle" font-size="12.4878">Review before integrating</ns0:text>
  <ns0:rect x="447.4797" y="93.6585" width="333.0081" height="327.8049" fill="#E3F2FD" stroke="#1976D2" stroke-width="2.0813" rx="5.2033" />
  <ns0:text x="613.9837" y="128.7805" text-anchor="middle" font-size="18.7317" font-weight="bold">git pull</ns0:text>
  <ns0:circle cx="613.9837" cy="187.3171" r="26.0163" fill="#2196F3" />
  <ns0:text x="613.9837" y="193.1707" text-anchor="middle" font-size="10.4065" fill="white">Remote</ns0:text>
  <ns0:path d="M 613.9837 216.5854 L 613.9837 251.7073" stroke="#333" stroke-width="2.0813" marker-end="url(#arrow)" />
  <ns0:circle cx="561.9512" cy="280.9756" r="26.0163" fill="#FF9800" />
  <ns0:text x="561.9512" y="286.8293" text-anchor="middle" font-size="10.4065" fill="white">origin/main</ns0:text>
  <ns0:circle cx="666.0163" cy="280.9756" r="26.0163" fill="#4CAF50" />
  <ns0:text x="666.0163" y="286.8293" text-anchor="middle" font-size="10.4065" fill="white">main</ns0:text>
  <ns0:path d="M 587.9675 280.9756 L 640 280.9756" stroke="#333" stroke-width="2.0813" marker-end="url(#arrow)" />
  <ns0:text x="613.9837" y="327.8049" text-anchor="middle" font-size="12.4878">Fetch + Merge</ns0:text>
  <ns0:text x="613.9837" y="351.2195" text-anchor="middle" font-size="12.4878">Updates working branch</ns0:text>
  <ns0:text x="613.9837" y="374.6341" text-anchor="middle" font-size="12.4878">Can cause conflicts</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrow2" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <ns0:polygon points="0,18 4.8,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
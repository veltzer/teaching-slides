<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="416.2602" y="46.8293" text-anchor="middle" font-size="24.9756" font-weight="bold">Fetch vs Pull</text>
  <rect x="52.0325" y="93.6585" width="333.0081" height="327.8049" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="218.5366" y="128.7805" text-anchor="middle" font-size="18.7317" font-weight="bold">git fetch</text>
  <circle cx="218.5366" cy="187.3171" r="26.0163" fill="var(--ok-fill)" />
  <text x="218.5366" y="193.1707" text-anchor="middle" font-size="10.4065" fill="var(--bg)">Remote</text>
  <path d="M 218.5366 216.5854 L 218.5366 251.7073" stroke="var(--text)" stroke-width="2.0813" marker-end="url(#arrow)" />
  <circle cx="218.5366" cy="280.9756" r="26.0163" fill="var(--warn-fill)" />
  <text x="218.5366" y="286.8293" text-anchor="middle" font-size="10.4065" fill="var(--bg)">origin/main</text>
  <text x="218.5366" y="327.8049" text-anchor="middle" font-size="12.4878">Updates references only</text>
  <text x="218.5366" y="351.2195" text-anchor="middle" font-size="12.4878">Safe - no merge</text>
  <text x="218.5366" y="374.6341" text-anchor="middle" font-size="12.4878">Review before integrating</text>
  <rect x="447.4797" y="93.6585" width="333.0081" height="327.8049" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="613.9837" y="128.7805" text-anchor="middle" font-size="18.7317" font-weight="bold">git pull</text>
  <circle cx="613.9837" cy="187.3171" r="26.0163" fill="var(--primary-fill)" />
  <text x="613.9837" y="193.1707" text-anchor="middle" font-size="10.4065" fill="var(--bg)">Remote</text>
  <path d="M 613.9837 216.5854 L 613.9837 251.7073" stroke="var(--text)" stroke-width="2.0813" marker-end="url(#arrow)" />
  <circle cx="561.9512" cy="280.9756" r="26.0163" fill="var(--warn-fill)" />
  <text x="561.9512" y="286.8293" text-anchor="middle" font-size="10.4065" fill="var(--bg)">origin/main</text>
  <circle cx="666.0163" cy="280.9756" r="26.0163" fill="var(--ok-fill)" />
  <text x="666.0163" y="286.8293" text-anchor="middle" font-size="10.4065" fill="var(--bg)">main</text>
  <path d="M 587.9675 280.9756 L 640 280.9756" stroke="var(--text)" stroke-width="2.0813" marker-end="url(#arrow)" />
  <text x="613.9837" y="327.8049" text-anchor="middle" font-size="12.4878">Fetch + Merge</text>
  <text x="613.9837" y="351.2195" text-anchor="middle" font-size="12.4878">Updates working branch</text>
  <text x="613.9837" y="374.6341" text-anchor="middle" font-size="12.4878">Can cause conflicts</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
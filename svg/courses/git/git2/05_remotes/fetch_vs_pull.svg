<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640.0002" y="40" text-anchor="middle" font-size="39.8855" font-weight="bold">Fetch vs Pull</text>
  <rect x="40" y="112.4999" width="548.5714" height="507.5001" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="314.2856" y="166.8749" text-anchor="middle" font-size="29.9142" font-weight="bold">git fetch</text>
  <rect x="272.738" y="215.952" width="83.0952" height="83.0952" rx="14" fill="var(--ok-fill)"/>
  <text x="314.2856" y="266.5621" text-anchor="middle" font-size="17.5486" fill="var(--bg)">Remote</text>
  <path d="M 314.2856 302.8123 L 314.2856 357.1875" stroke="var(--text)" stroke-width="0.9677" marker-end="url(#arrow)" />
  <rect x="272.738" y="360.952" width="83.0952" height="83.0952" rx="14" fill="var(--warn-fill)"/>
  <text x="314.2856" y="411.5624" text-anchor="middle" font-size="17.5486" fill="var(--bg)">origin/main</text>
  <text x="314.2856" y="474.9997" text-anchor="middle" font-size="19.9428">Updates references only</text>
  <text x="314.2856" y="511.2497" text-anchor="middle" font-size="19.9428">Safe - no merge</text>
  <text x="314.2856" y="547.4996" text-anchor="middle" font-size="19.9428">Review before integrating</text>
  <rect x="691.4286" y="112.4999" width="548.5714" height="507.5001" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="965.7144" y="166.8749" text-anchor="middle" font-size="29.9142" font-weight="bold">git pull</text>
  <rect x="924.167" y="215.952" width="83.0952" height="83.0952" rx="14" fill="var(--primary-fill)"/>
  <text x="965.7144" y="266.5621" text-anchor="middle" font-size="17.5486" fill="var(--bg)">Remote</text>
  <path d="M 965.7144 302.8123 L 965.7144 357.1875" stroke="var(--text)" stroke-width="0.9677" marker-end="url(#arrow)" />
  <rect x="838.453" y="360.952" width="83.0952" height="83.0952" rx="14" fill="var(--warn-fill)"/>
  <text x="880.0003" y="411.5624" text-anchor="middle" font-size="17.5486" fill="var(--bg)">origin/main</text>
  <rect x="1009.88" y="360.952" width="83.0952" height="83.0952" rx="14" fill="var(--ok-fill)"/>
  <text x="1051.4287" y="411.5624" text-anchor="middle" font-size="17.5486" fill="var(--bg)">main</text>
  <path d="M 922.8573 402.5 L 1008.5717 402.5" stroke="var(--text)" stroke-width="0.9677" marker-end="url(#arrow)" />
  <text x="965.7144" y="474.9997" text-anchor="middle" font-size="19.9428">Fetch + Merge</text>
  <text x="965.7144" y="511.2497" text-anchor="middle" font-size="19.9428">Updates working branch</text>
  <text x="965.7144" y="547.4996" text-anchor="middle" font-size="19.9428">Can cause conflicts</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
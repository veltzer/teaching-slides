<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Fetch vs Pull</text>
  <rect x="80" y="144" width="512" height="504" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="336" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">git fetch</text>
  <circle cx="336" cy="288" r="40" fill="#4CAF50" />
  <text x="336" y="297" text-anchor="middle" font-size="16" fill="white">Remote</text>
  <path d="M 336 333 L 336 387" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <circle cx="336" cy="432" r="40" fill="#FF9800" />
  <text x="336" y="441" text-anchor="middle" font-size="16" fill="white">origin/main</text>
  <text x="336" y="504" text-anchor="middle" font-size="19.2">Updates references only</text>
  <text x="336" y="540" text-anchor="middle" font-size="19.2">Safe - no merge</text>
  <text x="336" y="576" text-anchor="middle" font-size="19.2">Review before integrating</text>
  <rect x="688" y="144" width="512" height="504" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="944" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">git pull</text>
  <circle cx="944" cy="288" r="40" fill="#2196F3" />
  <text x="944" y="297" text-anchor="middle" font-size="16" fill="white">Remote</text>
  <path d="M 944 333 L 944 387" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <circle cx="864" cy="432" r="40" fill="#FF9800" />
  <text x="864" y="441" text-anchor="middle" font-size="16" fill="white">origin/main</text>
  <circle cx="1024" cy="432" r="40" fill="#4CAF50" />
  <text x="1024" y="441" text-anchor="middle" font-size="16" fill="white">main</text>
  <path d="M 904 432 L 984 432" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <text x="944" y="504" text-anchor="middle" font-size="19.2">Fetch + Merge</text>
  <text x="944" y="540" text-anchor="middle" font-size="19.2">Updates working branch</text>
  <text x="944" y="576" text-anchor="middle" font-size="19.2">Can cause conflicts</text>
  <defs>
    <marker id="arrow2" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
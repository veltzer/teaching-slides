<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0002" y="40" text-anchor="middle" font-size="39.8855" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Fetch vs Pull</text>
  <rect x="40" y="112.4999" width="548.5714" height="507.5001" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="314.2856" y="166.8749" text-anchor="middle" font-size="29.9142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">git fetch</text>
  <rect x="272.738" y="215.952" width="83.0952" height="83.0952" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="314.2856" y="266.5621" text-anchor="middle" font-size="17.5486" fill="var(--bg)" font-family="Arial, sans-serif">Remote</text>
  <path d="M 314.2856 302.8123 L 314.2856 357.1875" stroke="var(--text)" stroke-width="0.9677" marker-end="url(#arrow)" />
  <rect x="272.738" y="360.952" width="83.0952" height="83.0952" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="314.2856" y="411.5624" text-anchor="middle" font-size="17.5486" fill="var(--bg)" font-family="Arial, sans-serif">origin/main</text>
  <text x="314.2856" y="474.9997" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--ok-text)">Updates references only</text>
  <text x="314.2856" y="511.2497" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--ok-text)">Safe - no merge</text>
  <text x="314.2856" y="547.4996" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--ok-text)">Review before integrating</text>
  <rect x="691.4286" y="112.4999" width="548.5714" height="507.5001" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="965.7144" y="166.8749" text-anchor="middle" font-size="29.9142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">git pull</text>
  <rect x="924.167" y="215.952" width="83.0952" height="83.0952" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="965.7144" y="266.5621" text-anchor="middle" font-size="17.5486" fill="var(--bg)" font-family="Arial, sans-serif">Remote</text>
  <path d="M 965.7144 302.8123 L 965.7144 357.1875" stroke="var(--text)" stroke-width="0.9677" marker-end="url(#arrow)" />
  <rect x="838.453" y="360.952" width="83.0952" height="83.0952" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="880.0003" y="411.5624" text-anchor="middle" font-size="17.5486" fill="var(--bg)" font-family="Arial, sans-serif">origin/main</text>
  <rect x="1009.88" y="360.952" width="83.0952" height="83.0952" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="1051.4287" y="411.5624" text-anchor="middle" font-size="17.5486" fill="var(--bg)" font-family="Arial, sans-serif">main</text>
  <path d="M 922.8573 402.5 L 1008.5717 402.5" stroke="var(--text)" stroke-width="0.9677" marker-end="url(#arrow)" />
  <text x="965.7144" y="474.9997" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--primary-text)">Fetch + Merge</text>
  <text x="965.7144" y="511.2497" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--primary-text)">Updates working branch</text>
  <text x="965.7144" y="547.4996" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--primary-text)">Can cause conflicts</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
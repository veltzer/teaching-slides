<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0001" y="80" text-anchor="middle" font-size="33.3333" font-weight="bold">Fetch vs Pull</text>
  <rect x="153.8888" y="142.4999" width="444.4445" height="437.5001" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.0078" />
  <text x="376.1111" y="189.375" text-anchor="middle" font-size="25" font-weight="bold">git fetch</text>
  <circle cx="376.1111" cy="267.5" r="34.7223" fill="var(--ok-fill)" />
  <text x="376.1111" y="275.3124" text-anchor="middle" font-size="13.8889" fill="var(--bg)">Remote</text>
  <path d="M 376.1111 306.5625 L 376.1111 353.4375" stroke="var(--text)" stroke-width="2.0813" marker-end="url(#arrow)" />
  <circle cx="376.1111" cy="392.5" r="34.7223" fill="var(--warn-fill)" />
  <text x="376.1111" y="400.3125" text-anchor="middle" font-size="13.8889" fill="var(--bg)">origin/main</text>
  <text x="376.1111" y="455" text-anchor="middle" font-size="16.6667">Updates references only</text>
  <text x="376.1111" y="486.25" text-anchor="middle" font-size="16.6667">Safe - no merge</text>
  <text x="376.1111" y="517.4999" text-anchor="middle" font-size="16.6667">Review before integrating</text>
  <rect x="681.6667" y="142.4999" width="444.4445" height="437.5001" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.0078" />
  <text x="903.8889" y="189.375" text-anchor="middle" font-size="25" font-weight="bold">git pull</text>
  <circle cx="903.8889" cy="267.5" r="34.7223" fill="var(--primary-fill)" />
  <text x="903.8889" y="275.3124" text-anchor="middle" font-size="13.8889" fill="var(--bg)">Remote</text>
  <path d="M 903.8889 306.5625 L 903.8889 353.4375" stroke="var(--text)" stroke-width="2.0813" marker-end="url(#arrow)" />
  <circle cx="834.4445" cy="392.5" r="34.7223" fill="var(--warn-fill)" />
  <text x="834.4445" y="400.3125" text-anchor="middle" font-size="13.8889" fill="var(--bg)">origin/main</text>
  <circle cx="973.3334" cy="392.5" r="34.7223" fill="var(--ok-fill)" />
  <text x="973.3334" y="400.3125" text-anchor="middle" font-size="13.8889" fill="var(--bg)">main</text>
  <path d="M 869.1667 392.5 L 938.6112 392.5" stroke="var(--text)" stroke-width="2.0813" marker-end="url(#arrow)" />
  <text x="903.8889" y="455" text-anchor="middle" font-size="16.6667">Fetch + Merge</text>
  <text x="903.8889" y="486.25" text-anchor="middle" font-size="16.6667">Updates working branch</text>
  <text x="903.8889" y="517.4999" text-anchor="middle" font-size="16.6667">Can cause conflicts</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
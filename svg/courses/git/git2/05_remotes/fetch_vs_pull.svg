<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="436.3895" y="54.5487" text-anchor="middle" font-size="22.7286" font-weight="bold">Fetch vs Pull</text>
  <rect x="104.9305" y="97.1648" width="303.0481" height="298.3132" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.3637" rx="6" />
  <text x="256.4545" y="129.1269" text-anchor="middle" font-size="17.0465" font-weight="bold">git fetch</text>
  <circle cx="256.4545" cy="182.3971" r="23.6757" fill="var(--ok-fill)" />
  <text x="256.4545" y="187.724" text-anchor="middle" font-size="10" fill="var(--bg)">Remote</text>
  <path d="M 256.4545 209.0322 L 256.4545 240.9944" stroke="var(--text)" stroke-width="0.9677" marker-end="url(#arrow)" />
  <circle cx="256.4545" cy="267.6295" r="23.6757" fill="var(--warn-fill)" />
  <text x="256.4545" y="272.9565" text-anchor="middle" font-size="10" fill="var(--bg)">origin/main</text>
  <text x="256.4545" y="310.2455" text-anchor="middle" font-size="11.3643">Updates references only</text>
  <text x="256.4545" y="331.5536" text-anchor="middle" font-size="11.3643">Safe - no merge</text>
  <text x="256.4545" y="352.8616" text-anchor="middle" font-size="11.3643">Review before integrating</text>
  <rect x="464.8002" y="97.1648" width="303.0481" height="298.3132" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.3637" rx="6" />
  <text x="616.3243" y="129.1269" text-anchor="middle" font-size="17.0465" font-weight="bold">git pull</text>
  <circle cx="616.3243" cy="182.3971" r="23.6757" fill="var(--primary-fill)" />
  <text x="616.3243" y="187.724" text-anchor="middle" font-size="10" fill="var(--bg)">Remote</text>
  <path d="M 616.3243 209.0322 L 616.3243 240.9944" stroke="var(--text)" stroke-width="0.9677" marker-end="url(#arrow)" />
  <circle cx="568.9731" cy="267.6295" r="23.6757" fill="var(--warn-fill)" />
  <text x="568.9731" y="272.9565" text-anchor="middle" font-size="10" fill="var(--bg)">origin/main</text>
  <circle cx="663.6756" cy="267.6295" r="23.6757" fill="var(--ok-fill)" />
  <text x="663.6756" y="272.9565" text-anchor="middle" font-size="10" fill="var(--bg)">main</text>
  <path d="M 592.6487 267.6295 L 640 267.6295" stroke="var(--text)" stroke-width="0.9677" marker-end="url(#arrow)" />
  <text x="616.3243" y="310.2455" text-anchor="middle" font-size="11.3643">Fetch + Merge</text>
  <text x="616.3243" y="331.5536" text-anchor="middle" font-size="11.3643">Updates working branch</text>
  <text x="616.3243" y="352.8616" text-anchor="middle" font-size="11.3643">Can cause conflicts</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
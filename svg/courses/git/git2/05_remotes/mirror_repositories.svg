<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Repository Mirroring</text>
  <circle cx="320" cy="360" r="64" fill="#24292E" />
  <text x="320" y="369" text-anchor="middle" font-size="22.4" fill="white">GitHub</text>
  <circle cx="640" cy="360" r="64" fill="#4CAF50" />
  <text x="640" y="369" text-anchor="middle" font-size="22.4" fill="white">Local</text>
  <circle cx="960" cy="360" r="64" fill="#FC6D26" />
  <text x="960" y="369" text-anchor="middle" font-size="22.4" fill="white">GitLab</text>
  <path d="M 384 360 L 576 360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow4)" marker-start="url(#arrow4)" />
  <path d="M 704 360 L 896 360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow4)" marker-start="url(#arrow4)" />
  <text x="480" y="342" text-anchor="middle" font-size="17.6">fetch/push</text>
  <text x="800" y="342" text-anchor="middle" font-size="17.6">fetch/push</text>
  <rect x="240" y="504" width="800" height="144" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="549" text-anchor="middle" font-size="19.2" font-family="monospace">git clone --mirror https://github.com/user/repo.git</text>
  <text x="640" y="585" text-anchor="middle" font-size="19.2" font-family="monospace">cd repo.git</text>
  <text x="640" y="621" text-anchor="middle" font-size="19.2" font-family="monospace">git remote set-url --push origin https://gitlab.com/user/repo.git</text>
  <defs>
    <marker id="arrow4" markerWidth="16" markerHeight="18" refX="8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
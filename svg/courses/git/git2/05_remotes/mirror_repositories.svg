  <ns0:text x="457.1429" y="392.1429" text-anchor="middle" font-size="13.7143" font-family="monospace">git clone --mirror https://github.com/user/repo.git</ns0:text>
  <ns0:text x="457.1429" y="417.8571" text-anchor="middle" font-size="13.7143" font-family="monospace">cd repo.git</ns0:text>
  <ns0:text x="457.1429" y="443.5714" text-anchor="middle" font-size="13.7143" font-family="monospace">git remote set-url --push origin https://gitlab.com/user/repo.git</ns0:text>

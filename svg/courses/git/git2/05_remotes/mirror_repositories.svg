<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="457.1429" y="51.4286" text-anchor="middle" font-size="27.4286" font-weight="bold">Repository Mirroring</text>
  <circle cx="228.5714" cy="257.1429" r="45.7143" fill="var(--text)" />
  <text x="228.5714" y="263.5714" text-anchor="middle" font-size="16" fill="var(--bg)">GitHub</text>
  <circle cx="457.1429" cy="257.1429" r="45.7143" fill="var(--ok-fill)" />
  <text x="457.1429" y="263.5714" text-anchor="middle" font-size="16" fill="var(--bg)">Local</text>
  <circle cx="685.7143" cy="257.1429" r="45.7143" fill="var(--warn-accent)" />
  <text x="685.7143" y="263.5714" text-anchor="middle" font-size="16" fill="var(--bg)">GitLab</text>
  <path d="M 274.2857 257.1429 L 411.4286 257.1429" stroke="var(--text)" stroke-width="2.2857" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <path d="M 502.8571 257.1429 L 640 257.1429" stroke="var(--text)" stroke-width="2.2857" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="342.8571" y="244.2857" text-anchor="middle" font-size="12.5714">fetch/push</text>
  <text x="571.4286" y="244.2857" text-anchor="middle" font-size="12.5714">fetch/push</text>
  <rect x="171.4286" y="360" width="571.4286" height="102.8571" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="457.1429" y="392.1429" text-anchor="middle" font-size="13.7143" font-family="monospace">git clone --mirror https://github.com/user/repo.git</text>
  <text x="457.1429" y="417.8571" text-anchor="middle" font-size="13.7143" font-family="monospace">cd repo.git</text>
  <text x="457.1429" y="443.5714" text-anchor="middle" font-size="13.7143" font-family="monospace">git remote set-url --push origin https://gitlab.com/user/repo.git</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Publishing a Repository</text>
  <rect x="160" y="144" width="960" height="144" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Step 1: Create Remote Repository</text>
  <text x="640" y="243" text-anchor="middle" font-size="19.2">GitHub/GitLab/Bitbucket → New Repository</text>
  <text x="640" y="270" text-anchor="middle" font-size="19.2">Don't initialize with README if pushing existing code</text>
  <rect x="160" y="324" width="448" height="324" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="384" y="378" text-anchor="middle" font-size="25.6" font-weight="bold">Existing Project</text>
  <text x="192" y="432" font-size="17.6" font-family="monospace">git remote add origin URL</text>
  <text x="192" y="468" font-size="17.6" font-family="monospace">git branch -M main</text>
  <text x="192" y="504" font-size="17.6" font-family="monospace">git push -u origin main</text>
  <text x="384" y="558" text-anchor="middle" font-size="19.2">Pushes existing commits</text>
  <text x="384" y="594" text-anchor="middle" font-size="19.2">Sets up tracking</text>
  <rect x="672" y="324" width="448" height="324" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="896" y="378" text-anchor="middle" font-size="25.6" font-weight="bold">New Project</text>
  <text x="704" y="432" font-size="17.6" font-family="monospace">git init</text>
  <text x="704" y="468" font-size="17.6" font-family="monospace">git add .</text>
  <text x="704" y="504" font-size="17.6" font-family="monospace">git commit -m "Initial"</text>
  <text x="704" y="540" font-size="17.6" font-family="monospace">git remote add origin URL</text>
  <text x="704" y="576" font-size="17.6" font-family="monospace">git push -u origin main</text>
  <text x="896" y="621" text-anchor="middle" font-size="19.2">Creates first commit</text>
</svg>
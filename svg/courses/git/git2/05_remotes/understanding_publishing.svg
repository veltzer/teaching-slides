<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Publishing a Repository</text>
  <rect x="158.0247" y="142.2222" width="948.1481" height="142.2222" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="632.0988" y="195.5556" text-anchor="middle" font-size="25.284" font-weight="bold">Step 1: Create Remote Repository</text>
  <text x="632.0988" y="240" text-anchor="middle" font-size="18.963">GitHub/GitLab/Bitbucket → New Repository</text>
  <text x="632.0988" y="266.6667" text-anchor="middle" font-size="18.963">Don't initialize with README if pushing existing code</text>
  <rect x="158.0247" y="320" width="442.4691" height="320" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="379.2593" y="373.3333" text-anchor="middle" font-size="25.284" font-weight="bold">Existing Project</text>
  <text x="189.6296" y="426.6667" font-size="17.3827" font-family="monospace">git remote add origin URL</text>
  <text x="189.6296" y="462.2222" font-size="17.3827" font-family="monospace">git branch -M main</text>
  <text x="189.6296" y="497.7778" font-size="17.3827" font-family="monospace">git push -u origin main</text>
  <text x="379.2593" y="551.1111" text-anchor="middle" font-size="18.963">Pushes existing commits</text>
  <text x="379.2593" y="586.6667" text-anchor="middle" font-size="18.963">Sets up tracking</text>
  <rect x="663.7037" y="320" width="442.4691" height="320" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="884.9383" y="373.3333" text-anchor="middle" font-size="25.284" font-weight="bold">New Project</text>
  <text x="695.3086" y="426.6667" font-size="17.3827" font-family="monospace">git init</text>
  <text x="695.3086" y="462.2222" font-size="17.3827" font-family="monospace">git add .</text>
  <text x="695.3086" y="497.7778" font-size="17.3827" font-family="monospace">git commit -m "Initial"</text>
  <text x="695.3086" y="533.3333" font-size="17.3827" font-family="monospace">git remote add origin URL</text>
  <text x="695.3086" y="568.8889" font-size="17.3827" font-family="monospace">git push -u origin main</text>
  <text x="884.9383" y="613.3333" text-anchor="middle" font-size="18.963">Creates first commit</text>
</svg>
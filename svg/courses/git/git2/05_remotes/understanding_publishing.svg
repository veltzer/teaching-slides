<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Publishing a Repository</ns0:text>
  <ns0:rect x="158.0247" y="142.2222" width="948.1481" height="142.2222" fill="#F5F5F5" stroke="#333" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="632.0988" y="195.5556" text-anchor="middle" font-size="25.284" font-weight="bold">Step 1: Create Remote Repository</ns0:text>
  <ns0:text x="632.0988" y="240" text-anchor="middle" font-size="18.963">GitHub/GitLab/Bitbucket → New Repository</ns0:text>
  <ns0:text x="632.0988" y="266.6667" text-anchor="middle" font-size="18.963">Don't initialize with README if pushing existing code</ns0:text>
  <ns0:rect x="158.0247" y="320" width="442.4691" height="320" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="379.2593" y="373.3333" text-anchor="middle" font-size="25.284" font-weight="bold">Existing Project</ns0:text>
  <ns0:text x="189.6296" y="426.6667" font-size="17.3827" font-family="monospace">git remote add origin URL</ns0:text>
  <ns0:text x="189.6296" y="462.2222" font-size="17.3827" font-family="monospace">git branch -M main</ns0:text>
  <ns0:text x="189.6296" y="497.7778" font-size="17.3827" font-family="monospace">git push -u origin main</ns0:text>
  <ns0:text x="379.2593" y="551.1111" text-anchor="middle" font-size="18.963">Pushes existing commits</ns0:text>
  <ns0:text x="379.2593" y="586.6667" text-anchor="middle" font-size="18.963">Sets up tracking</ns0:text>
  <ns0:rect x="663.7037" y="320" width="442.4691" height="320" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="884.9383" y="373.3333" text-anchor="middle" font-size="25.284" font-weight="bold">New Project</ns0:text>
  <ns0:text x="695.3086" y="426.6667" font-size="17.3827" font-family="monospace">git init</ns0:text>
  <ns0:text x="695.3086" y="462.2222" font-size="17.3827" font-family="monospace">git add .</ns0:text>
  <ns0:text x="695.3086" y="497.7778" font-size="17.3827" font-family="monospace">git commit -m "Initial"</ns0:text>
  <ns0:text x="695.3086" y="533.3333" font-size="17.3827" font-family="monospace">git remote add origin URL</ns0:text>
  <ns0:text x="695.3086" y="568.8889" font-size="17.3827" font-family="monospace">git push -u origin main</ns0:text>
  <ns0:text x="884.9383" y="613.3333" text-anchor="middle" font-size="18.963">Creates first commit</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">GitLab Features</text>
  <rect x="80" y="144" width="352" height="216" fill="#FC6D26" rx="8" />
  <text x="256" y="198" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Built-in CI/CD</text>
  <text x="256" y="243" text-anchor="middle" font-size="19.2" fill="white">• .gitlab-ci.yml</text>
  <text x="256" y="279" text-anchor="middle" font-size="19.2" fill="white">• Runners</text>
  <text x="256" y="315" text-anchor="middle" font-size="19.2" fill="white">• Pipelines</text>
  <rect x="464" y="144" width="352" height="216" fill="#554488" rx="8" />
  <text x="640" y="198" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">DevOps Platform</text>
  <text x="640" y="243" text-anchor="middle" font-size="19.2" fill="white">• Planning</text>
  <text x="640" y="279" text-anchor="middle" font-size="19.2" fill="white">• Monitoring</text>
  <text x="640" y="315" text-anchor="middle" font-size="19.2" fill="white">• Security</text>
  <rect x="848" y="144" width="352" height="216" fill="#FCA326" rx="8" />
  <text x="1024" y="198" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Self-Hosted Option</text>
  <text x="1024" y="243" text-anchor="middle" font-size="19.2" fill="white">• GitLab CE (free)</text>
  <text x="1024" y="279" text-anchor="middle" font-size="19.2" fill="white">• GitLab EE</text>
  <text x="1024" y="315" text-anchor="middle" font-size="19.2" fill="white">• Full control</text>
  <rect x="320" y="396" width="640" height="216" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="450" text-anchor="middle" font-size="25.6" font-weight="bold">GitLab vs GitHub</text>
  <text x="352" y="495" font-size="19.2">• All-in-one DevOps platform</text>
  <text x="352" y="531" font-size="19.2">• Free private repos (unlimited)</text>
  <text x="352" y="567" font-size="19.2">• Integrated CI/CD out of the box</text>
</svg>
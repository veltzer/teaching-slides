<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">GitLab Features</text>
  <rect x="80" y="144" width="352" height="216" fill="#ef6c00" rx="8" />
  <text x="256" y="198" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Built-in CI/CD</text>
  <text x="256" y="243" text-anchor="middle" font-size="19.2" fill="white">• .gitlab-ci.yml</text>
  <text x="256" y="279" text-anchor="middle" font-size="19.2" fill="white">• Runners</text>
  <text x="256" y="315" text-anchor="middle" font-size="19.2" fill="white">• Pipelines</text>
  <rect x="464" y="144" width="352" height="216" fill="#3949ab" rx="8" />
  <text x="640" y="198" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">DevOps Platform</text>
  <text x="640" y="243" text-anchor="middle" font-size="19.2" fill="white">• Planning</text>
  <text x="640" y="279" text-anchor="middle" font-size="19.2" fill="white">• Monitoring</text>
  <text x="640" y="315" text-anchor="middle" font-size="19.2" fill="white">• Security</text>
  <rect x="848" y="144" width="352" height="216" fill="#f9a825" rx="8" />
  <text x="1024" y="198" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Self-Hosted Option</text>
  <text x="1024" y="243" text-anchor="middle" font-size="19.2" fill="white">• GitLab CE (free)</text>
  <text x="1024" y="279" text-anchor="middle" font-size="19.2" fill="white">• GitLab EE</text>
  <text x="1024" y="315" text-anchor="middle" font-size="19.2" fill="white">• Full control</text>
  <rect x="320" y="396" width="640" height="216" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="450" text-anchor="middle" font-size="25.6" font-weight="bold">GitLab vs GitHub</text>
  <text x="352" y="495" font-size="19.2">• All-in-one DevOps platform</text>
  <text x="352" y="531" font-size="19.2">• Free private repos (unlimited)</text>
  <text x="352" y="567" font-size="19.2">• Integrated CI/CD out of the box</text>
</svg>
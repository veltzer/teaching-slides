<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="41.1936" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">GitLab Features</text>
  <rect x="40" y="117.3333" width="377.1429" height="232" fill="var(--warn-accent)" rx="6"/>
  <text x="228.5714" y="175.3333" text-anchor="middle" font-size="27.4624" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Built-in CI/CD</text>
  <text x="228.5714" y="223.6667" text-anchor="middle" font-size="20.5968" fill="var(--bg)" font-family="Arial, sans-serif">• .gitlab-ci.yml</text>
  <text x="228.5714" y="262.3333" text-anchor="middle" font-size="20.5968" fill="var(--bg)" font-family="Arial, sans-serif">• Runners</text>
  <text x="228.5714" y="301" text-anchor="middle" font-size="20.5968" fill="var(--bg)" font-family="Arial, sans-serif">• Pipelines</text>
  <rect x="451.4286" y="117.3333" width="377.1429" height="232" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="175.3333" text-anchor="middle" font-size="27.4624" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">DevOps Platform</text>
  <text x="640" y="223.6667" text-anchor="middle" font-size="20.5968" fill="var(--bg)" font-family="Arial, sans-serif">• Planning</text>
  <text x="640" y="262.3333" text-anchor="middle" font-size="20.5968" fill="var(--bg)" font-family="Arial, sans-serif">• Monitoring</text>
  <text x="640" y="301" text-anchor="middle" font-size="20.5968" fill="var(--bg)" font-family="Arial, sans-serif">• Security</text>
  <rect x="862.8571" y="117.3333" width="377.1429" height="232" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4286" y="175.3333" text-anchor="middle" font-size="27.4624" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Self-Hosted Option</text>
  <text x="1051.4286" y="223.6667" text-anchor="middle" font-size="20.5968" fill="var(--bg)" font-family="Arial, sans-serif">• GitLab CE (free)</text>
  <text x="1051.4286" y="262.3333" text-anchor="middle" font-size="20.5968" fill="var(--bg)" font-family="Arial, sans-serif">• GitLab EE</text>
  <text x="1051.4286" y="301" text-anchor="middle" font-size="20.5968" fill="var(--bg)" font-family="Arial, sans-serif">• Full control</text>
  <rect x="297.1429" y="388" width="685.7143" height="232" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="446" text-anchor="middle" font-size="27.4624" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">GitLab vs GitHub</text>
  <text x="331.4286" y="494.3333" font-size="20.5968" font-family="Arial, sans-serif" fill="var(--text)">• All-in-one DevOps platform</text>
  <text x="331.4286" y="533" font-size="20.5968" font-family="Arial, sans-serif" fill="var(--text)">• Free private repos (unlimited)</text>
  <text x="331.4286" y="571.6667" font-size="20.5968" font-family="Arial, sans-serif" fill="var(--text)">• Integrated CI/CD out of the box</text>
</svg>

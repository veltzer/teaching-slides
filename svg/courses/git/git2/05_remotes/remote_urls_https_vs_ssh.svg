<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">HTTPS vs SSH</ns0:text>
  <ns0:rect x="79.0123" y="142.2222" width="505.679" height="497.7778" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="331.8519" y="195.5556" text-anchor="middle" font-size="28.4444" font-weight="bold">HTTPS</ns0:text>
  <ns0:rect x="110.6173" y="231.1111" width="442.4691" height="53.3333" fill="#81C784" rx="4.7407" />
  <ns0:text x="331.8519" y="266.6667" text-anchor="middle" font-size="15.8025" fill="white" font-family="monospace">https://github.com/user/repo.git</ns0:text>
  <ns0:text x="110.6173" y="328.8889" font-size="18.963">✓ Works everywhere</ns0:text>
  <ns0:text x="110.6173" y="364.4444" font-size="18.963">✓ Firewall friendly</ns0:text>
  <ns0:text x="110.6173" y="400" font-size="18.963">✓ Easy setup</ns0:text>
  <ns0:text x="110.6173" y="435.5556" font-size="18.963">✗ Password/token each push</ns0:text>
  <ns0:text x="110.6173" y="471.1111" font-size="18.963">✗ Less secure (without 2FA)</ns0:text>
  <ns0:text x="331.8519" y="524.4444" text-anchor="middle" font-size="20.5432" font-weight="bold">Best for:</ns0:text>
  <ns0:text x="110.6173" y="560" font-size="17.3827">• Public repositories</ns0:text>
  <ns0:text x="110.6173" y="595.5556" font-size="17.3827">• Quick clones</ns0:text>
  <ns0:rect x="679.5062" y="142.2222" width="505.679" height="497.7778" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="932.3457" y="195.5556" text-anchor="middle" font-size="28.4444" font-weight="bold">SSH</ns0:text>
  <ns0:rect x="711.1111" y="231.1111" width="442.4691" height="53.3333" fill="#64B5F6" rx="4.7407" />
  <ns0:text x="932.3457" y="266.6667" text-anchor="middle" font-size="15.8025" fill="white" font-family="monospace">git@github.com:user/repo.git</ns0:text>
  <ns0:text x="711.1111" y="328.8889" font-size="18.963">✓ No password after setup</ns0:text>
  <ns0:text x="711.1111" y="364.4444" font-size="18.963">✓ More secure</ns0:text>
  <ns0:text x="711.1111" y="400" font-size="18.963">✓ Key-based auth</ns0:text>
  <ns0:text x="711.1111" y="435.5556" font-size="18.963">✗ Initial setup required</ns0:text>
  <ns0:text x="711.1111" y="471.1111" font-size="18.963">✗ Port 22 may be blocked</ns0:text>
  <ns0:text x="932.3457" y="524.4444" text-anchor="middle" font-size="20.5432" font-weight="bold">Best for:</ns0:text>
  <ns0:text x="711.1111" y="560" font-size="17.3827">• Regular contributors</ns0:text>
  <ns0:text x="711.1111" y="595.5556" font-size="17.3827">• Private repositories</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">HTTPS vs SSH</text>
  <rect x="79.0123" y="142.2222" width="505.679" height="497.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="331.8519" y="195.5556" text-anchor="middle" font-size="28.4444" font-weight="bold">HTTPS</text>
  <rect x="110.6173" y="231.1111" width="442.4691" height="53.3333" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="331.8519" y="266.6667" text-anchor="middle" font-size="15.8025" fill="var(--bg)" font-family="monospace">https://github.com/user/repo.git</text>
  <text x="110.6173" y="328.8889" font-size="18.963">✓ Works everywhere</text>
  <text x="110.6173" y="364.4444" font-size="18.963">✓ Firewall friendly</text>
  <text x="110.6173" y="400" font-size="18.963">✓ Easy setup</text>
  <text x="110.6173" y="435.5556" font-size="18.963">✗ Password/token each push</text>
  <text x="110.6173" y="471.1111" font-size="18.963">✗ Less secure (without 2FA)</text>
  <text x="331.8519" y="524.4444" text-anchor="middle" font-size="20.5432" font-weight="bold">Best for:</text>
  <text x="110.6173" y="560" font-size="17.3827">• Public repositories</text>
  <text x="110.6173" y="595.5556" font-size="17.3827">• Quick clones</text>
  <rect x="679.5062" y="142.2222" width="505.679" height="497.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="932.3457" y="195.5556" text-anchor="middle" font-size="28.4444" font-weight="bold">SSH</text>
  <rect x="711.1111" y="231.1111" width="442.4691" height="53.3333" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="932.3457" y="266.6667" text-anchor="middle" font-size="15.8025" fill="var(--bg)" font-family="monospace">git@github.com:user/repo.git</text>
  <text x="711.1111" y="328.8889" font-size="18.963">✓ No password after setup</text>
  <text x="711.1111" y="364.4444" font-size="18.963">✓ More secure</text>
  <text x="711.1111" y="400" font-size="18.963">✓ Key-based auth</text>
  <text x="711.1111" y="435.5556" font-size="18.963">✗ Initial setup required</text>
  <text x="711.1111" y="471.1111" font-size="18.963">✗ Port 22 may be blocked</text>
  <text x="932.3457" y="524.4444" text-anchor="middle" font-size="20.5432" font-weight="bold">Best for:</text>
  <text x="711.1111" y="560" font-size="17.3827">• Regular contributors</text>
  <text x="711.1111" y="595.5556" font-size="17.3827">• Private repositories</text>
</svg>
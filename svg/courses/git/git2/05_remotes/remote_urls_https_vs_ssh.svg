<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">HTTPS vs SSH</text>
  <rect x="80" y="144" width="512" height="504" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="336" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">HTTPS</text>
  <rect x="112" y="234" width="448" height="54" fill="#81C784" rx="4.8" />
  <text x="336" y="270" text-anchor="middle" font-size="16" fill="white" font-family="monospace">https://github.com/user/repo.git</text>
  <text x="112" y="333" font-size="19.2">✓ Works everywhere</text>
  <text x="112" y="369" font-size="19.2">✓ Firewall friendly</text>
  <text x="112" y="405" font-size="19.2">✓ Easy setup</text>
  <text x="112" y="441" font-size="19.2">✗ Password/token each push</text>
  <text x="112" y="477" font-size="19.2">✗ Less secure (without 2FA)</text>
  <text x="336" y="531" text-anchor="middle" font-size="20.8" font-weight="bold">Best for:</text>
  <text x="112" y="567" font-size="17.6">• Public repositories</text>
  <text x="112" y="603" font-size="17.6">• Quick clones</text>
  <rect x="688" y="144" width="512" height="504" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="944" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">SSH</text>
  <rect x="720" y="234" width="448" height="54" fill="#64B5F6" rx="4.8" />
  <text x="944" y="270" text-anchor="middle" font-size="16" fill="white" font-family="monospace">git@github.com:user/repo.git</text>
  <text x="720" y="333" font-size="19.2">✓ No password after setup</text>
  <text x="720" y="369" font-size="19.2">✓ More secure</text>
  <text x="720" y="405" font-size="19.2">✓ Key-based auth</text>
  <text x="720" y="441" font-size="19.2">✗ Initial setup required</text>
  <text x="720" y="477" font-size="19.2">✗ Port 22 may be blocked</text>
  <text x="944" y="531" text-anchor="middle" font-size="20.8" font-weight="bold">Best for:</text>
  <text x="720" y="567" font-size="17.6">• Regular contributors</text>
  <text x="720" y="603" font-size="17.6">• Private repositories</text>
</svg>
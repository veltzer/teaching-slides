<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Two Ways to Start</text>
  <rect x="80" y="144" width="512" height="504" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="336" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">git clone</text>
  <text x="112" y="252" font-size="19.2">✓ Downloads entire repository</text>
  <text x="112" y="288" font-size="19.2">✓ Sets up origin automatically</text>
  <text x="112" y="324" font-size="19.2">✓ Checks out default branch</text>
  <text x="112" y="360" font-size="19.2">✓ Configures tracking</text>
  <rect x="112" y="396" width="448" height="72" fill="#4CAF50" rx="4.8" />
  <text x="336" y="441" text-anchor="middle" font-size="19.2" fill="white" font-family="monospace">git clone URL</text>
  <text x="336" y="522" text-anchor="middle" font-size="22.4" font-weight="bold">Use when:</text>
  <text x="112" y="567" font-size="19.2">• Joining existing project</text>
  <text x="112" y="603" font-size="19.2">• Getting copy of repository</text>
  <rect x="688" y="144" width="512" height="504" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="944" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">git init + remote add</text>
  <text x="720" y="252" font-size="19.2">✓ Starts with empty repo</text>
  <text x="720" y="288" font-size="19.2">✓ You add remote manually</text>
  <text x="720" y="324" font-size="19.2">✓ No default content</text>
  <text x="720" y="360" font-size="19.2">✓ Full control over setup</text>
  <rect x="720" y="396" width="448" height="72" fill="#2196F3" rx="4.8" />
  <text x="944" y="441" text-anchor="middle" font-size="19.2" fill="white" font-family="monospace">git init &amp;&amp; git remote add</text>
  <text x="944" y="522" text-anchor="middle" font-size="22.4" font-weight="bold">Use when:</text>
  <text x="720" y="567" font-size="19.2">• Starting new project</text>
  <text x="720" y="603" font-size="19.2">• Converting existing code</text>
</svg>
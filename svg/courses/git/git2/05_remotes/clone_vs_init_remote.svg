<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Two Ways to Start</ns0:text>
  <ns0:rect x="79.0123" y="142.2222" width="505.679" height="497.7778" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="331.8519" y="195.5556" text-anchor="middle" font-size="28.4444" font-weight="bold">git clone</ns0:text>
  <ns0:text x="110.6173" y="248.8889" font-size="18.963">✓ Downloads entire repository</ns0:text>
  <ns0:text x="110.6173" y="284.4444" font-size="18.963">✓ Sets up origin automatically</ns0:text>
  <ns0:text x="110.6173" y="320" font-size="18.963">✓ Checks out default branch</ns0:text>
  <ns0:text x="110.6173" y="355.5556" font-size="18.963">✓ Configures tracking</ns0:text>
  <ns0:rect x="110.6173" y="391.1111" width="442.4691" height="71.1111" fill="#4CAF50" rx="4.7407" />
  <ns0:text x="331.8519" y="435.5556" text-anchor="middle" font-size="18.963" fill="white" font-family="monospace">git clone URL</ns0:text>
  <ns0:text x="331.8519" y="515.5556" text-anchor="middle" font-size="22.1235" font-weight="bold">Use when:</ns0:text>
  <ns0:text x="110.6173" y="560" font-size="18.963">• Joining existing project</ns0:text>
  <ns0:text x="110.6173" y="595.5556" font-size="18.963">• Getting copy of repository</ns0:text>
  <ns0:rect x="679.5062" y="142.2222" width="505.679" height="497.7778" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="932.3457" y="195.5556" text-anchor="middle" font-size="28.4444" font-weight="bold">git init + remote add</ns0:text>
  <ns0:text x="711.1111" y="248.8889" font-size="18.963">✓ Starts with empty repo</ns0:text>
  <ns0:text x="711.1111" y="284.4444" font-size="18.963">✓ You add remote manually</ns0:text>
  <ns0:text x="711.1111" y="320" font-size="18.963">✓ No default content</ns0:text>
  <ns0:text x="711.1111" y="355.5556" font-size="18.963">✓ Full control over setup</ns0:text>
  <ns0:rect x="711.1111" y="391.1111" width="442.4691" height="71.1111" fill="#2196F3" rx="4.7407" />
  <ns0:text x="932.3457" y="435.5556" text-anchor="middle" font-size="18.963" fill="white" font-family="monospace">git init &amp;&amp; git remote add</ns0:text>
  <ns0:text x="932.3457" y="515.5556" text-anchor="middle" font-size="22.1235" font-weight="bold">Use when:</ns0:text>
  <ns0:text x="711.1111" y="560" font-size="18.963">• Starting new project</ns0:text>
  <ns0:text x="711.1111" y="595.5556" font-size="18.963">• Converting existing code</ns0:text>
</ns0:svg>
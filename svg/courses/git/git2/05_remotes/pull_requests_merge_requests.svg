<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="513.7971" y="56.3369" text-anchor="middle" font-size="24.2309" font-weight="bold">Pull Request Workflow</text>
  <circle cx="210.9103" cy="181.2778" r="25.2406" fill="var(--ok-fill)" />
  <text x="210.9103" y="186.957" text-anchor="middle" font-size="12.1155" fill="var(--bg)">main</text>
  <circle cx="311.8724" cy="181.2778" r="25.2406" fill="var(--primary-fill)" />
  <text x="311.8724" y="186.957" text-anchor="middle" font-size="12.1155" fill="var(--bg)">feature</text>
  <path d="M 236.1508 181.2778 L 286.6319 181.2778" stroke="var(--text)" stroke-width="1.2091" marker-end="url(#arrow)" />
  <text x="261.3913" y="169.9196" text-anchor="middle" font-size="10.0962">1. Branch</text>
  <rect x="362.3536" y="158.5613" width="100.9623" height="45.433" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="1.4084" />
  <text x="412.8348" y="186.957" text-anchor="middle" font-size="12.1155" fill="var(--bg)">Commits</text>
  <path d="M 337.1131 181.2778 L 362.3536 181.2778" stroke="var(--text)" stroke-width="1.2091" />
  <text x="412.8348" y="226.7109" text-anchor="middle" font-size="10.0962">2. Work</text>
  <rect x="493.6046" y="147.203" width="121.1547" height="68.1496" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="1.4084" />
  <text x="554.1821" y="175.5985" text-anchor="middle" font-size="12.1155" fill="var(--bg)">Pull Request</text>
  <text x="554.1821" y="198.3151" text-anchor="middle" font-size="10.0962" fill="var(--bg)">Review &amp; Discuss</text>
  <path d="M 463.3159 181.2778 L 493.6046 181.2778" stroke="var(--text)" stroke-width="1.2091" />
  <text x="554.1821" y="238.069" text-anchor="middle" font-size="10.0962">3. Request merge</text>
  <circle cx="665.2406" cy="181.2778" r="25.2406" fill="var(--ok-fill)" />
  <text x="665.2406" y="186.957" text-anchor="middle" font-size="12.1155" fill="var(--bg)">main</text>
  <text x="665.2406" y="147.203" text-anchor="middle" font-size="10.0962">Updated</text>
  <path d="M 614.7594 181.2778 L 640 181.2778" stroke="var(--text)" stroke-width="1.2091" marker-end="url(#arrow)" />
  <text x="665.2406" y="238.069" text-anchor="middle" font-size="10.0962">4. Merge</text>
  <rect x="311.8724" y="294.8603" width="403.8492" height="113.5826" fill="var(--surface)" stroke="var(--border)" stroke-width="0.7042" rx="6" />
  <text x="513.7971" y="328.9352" text-anchor="middle" font-size="14.1347" font-weight="bold">Pull Request Benefits:</text>
  <text x="332.0651" y="357.3308" font-size="12.1155">• Code review before merge</text>
  <text x="332.0651" y="380.0473" font-size="12.1155">• Discussion and feedback</text>
  <text x="533.9896" y="357.3308" font-size="12.1155">• CI/CD integration</text>
  <text x="533.9896" y="380.0473" font-size="12.1155">• Documentation trail</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
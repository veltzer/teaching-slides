<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Pull Request Workflow</text>
  <circle cx="160" cy="270" r="40" fill="#4CAF50" />
  <text x="160" y="279" text-anchor="middle" font-size="19.2" fill="white">main</text>
  <circle cx="320" cy="270" r="40" fill="#2196F3" />
  <text x="320" y="279" text-anchor="middle" font-size="19.2" fill="white">feature</text>
  <path d="M 200 270 L 280 270" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <text x="240" y="252" text-anchor="middle" font-size="16">1. Branch</text>
  <rect x="400" y="234" width="160" height="72" fill="#FF9800" rx="8" />
  <text x="480" y="279" text-anchor="middle" font-size="19.2" fill="white">Commits</text>
  <path d="M 360 270 L 400 270" stroke="#333" stroke-width="3.2" />
  <text x="480" y="342" text-anchor="middle" font-size="16">2. Work</text>
  <rect x="608" y="216" width="192" height="108" fill="#9C27B0" rx="8" />
  <text x="704" y="261" text-anchor="middle" font-size="19.2" fill="white">Pull Request</text>
  <text x="704" y="297" text-anchor="middle" font-size="16" fill="white">Review &amp; Discuss</text>
  <path d="M 560 270 L 608 270" stroke="#333" stroke-width="3.2" />
  <text x="704" y="360" text-anchor="middle" font-size="16">3. Request merge</text>
  <circle cx="880" cy="270" r="40" fill="#4CAF50" />
  <text x="880" y="279" text-anchor="middle" font-size="19.2" fill="white">main</text>
  <text x="880" y="216" text-anchor="middle" font-size="16">Updated</text>
  <path d="M 800 270 L 840 270" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <text x="880" y="360" text-anchor="middle" font-size="16">4. Merge</text>
  <rect x="320" y="450" width="640" height="180" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="504" text-anchor="middle" font-size="22.4" font-weight="bold">Pull Request Benefits:</text>
  <text x="352" y="549" font-size="19.2">• Code review before merge</text>
  <text x="352" y="585" font-size="19.2">• Discussion and feedback</text>
  <text x="672" y="549" font-size="19.2">• CI/CD integration</text>
  <text x="672" y="585" font-size="19.2">• Documentation trail</text>
  <defs>
    <marker id="arrow1" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="487.619" y="54.8571" text-anchor="middle" font-size="29.2571" font-weight="bold">Pull Request Workflow</text>
  <circle cx="121.9048" cy="205.7143" r="30.4762" fill="var(--ok-fill)" />
  <text x="121.9048" y="212.5714" text-anchor="middle" font-size="14.6286" fill="var(--bg)">main</text>
  <circle cx="243.8095" cy="205.7143" r="30.4762" fill="var(--primary-fill)" />
  <text x="243.8095" y="212.5714" text-anchor="middle" font-size="14.6286" fill="var(--bg)">feature</text>
  <path d="M 152.381 205.7143 L 213.3333 205.7143" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <text x="182.8571" y="192" text-anchor="middle" font-size="12.1905">1. Branch</text>
  <rect x="304.7619" y="178.2857" width="121.9048" height="54.8571" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="365.7143" y="212.5714" text-anchor="middle" font-size="14.6286" fill="var(--bg)">Commits</text>
  <path d="M 274.2857 205.7143 L 304.7619 205.7143" stroke="var(--text)" stroke-width="2.4381" />
  <text x="365.7143" y="260.5714" text-anchor="middle" font-size="12.1905">2. Work</text>
  <rect x="463.2381" y="164.5714" width="146.2857" height="82.2857" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="536.381" y="198.8571" text-anchor="middle" font-size="14.6286" fill="var(--bg)">Pull Request</text>
  <text x="536.381" y="226.2857" text-anchor="middle" font-size="12.1905" fill="var(--bg)">Review &amp; Discuss</text>
  <path d="M 426.6667 205.7143 L 463.2381 205.7143" stroke="var(--text)" stroke-width="2.4381" />
  <text x="536.381" y="274.2857" text-anchor="middle" font-size="12.1905">3. Request merge</text>
  <circle cx="670.4762" cy="205.7143" r="30.4762" fill="var(--ok-fill)" />
  <text x="670.4762" y="212.5714" text-anchor="middle" font-size="14.6286" fill="var(--bg)">main</text>
  <text x="670.4762" y="164.5714" text-anchor="middle" font-size="12.1905">Updated</text>
  <path d="M 609.5238 205.7143 L 640 205.7143" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <text x="670.4762" y="274.2857" text-anchor="middle" font-size="12.1905">4. Merge</text>
  <rect x="243.8095" y="342.8571" width="487.619" height="137.1429" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="487.619" y="384" text-anchor="middle" font-size="17.0667" font-weight="bold">Pull Request Benefits:</text>
  <text x="268.1905" y="418.2857" font-size="14.6286">• Code review before merge</text>
  <text x="268.1905" y="445.7143" font-size="14.6286">• Discussion and feedback</text>
  <text x="512" y="418.2857" font-size="14.6286">• CI/CD integration</text>
  <text x="512" y="445.7143" font-size="14.6286">• Documentation trail</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
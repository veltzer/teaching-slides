<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="779.5672" y="40" text-anchor="middle" font-size="46.9608" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Pull Request Workflow</text>
  <rect x="40" y="196.889" width="97.8354" height="97.8354" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="88.9177" y="255.1615" text-anchor="middle" font-size="23.4805" fill="var(--bg)" font-family="Arial, sans-serif">main</text>
  <rect x="270.216" y="196.889" width="97.8354" height="97.8354" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="319.1339" y="255.1615" text-anchor="middle" font-size="23.4805" fill="var(--bg)" font-family="Arial, sans-serif">feature</text>
  <path d="M 146.4717 245.8066 L 261.5799 245.8066" stroke="var(--text)" stroke-width="1.2091" marker-end="url(#arrow)"/>
  <text x="204.0257" y="227.097" text-anchor="middle" font-size="19.5669" font-family="Arial, sans-serif" fill="var(--text)">1. Branch</text>
  <rect x="434.2421" y="208.3872" width="230.2165" height="74.8387" fill="url(#grad-warn)" rx="6.0004" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="549.3506" y="255.1615" text-anchor="middle" font-size="23.4805" fill="var(--bg)" font-family="Arial, sans-serif">Commits</text>
  <path d="M 376.6883 245.8066 L 434.2421 245.8066" stroke="var(--text)" stroke-width="1.2091"/>
  <text x="549.3506" y="320.6454" text-anchor="middle" font-size="19.5669" font-family="Arial, sans-serif" fill="var(--text)">2. Work</text>
  <rect x="733.5238" y="189.6775" width="276.2597" height="112.2581" fill="url(#grad-info)" rx="6.0004" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="871.654" y="236.4514" text-anchor="middle" font-size="23.4805" fill="var(--bg)" font-family="Arial, sans-serif">Pull Request</text>
  <text x="871.654" y="273.8709" text-anchor="middle" font-size="19.5669" fill="var(--bg)" font-family="Arial, sans-serif">Review &amp; Discuss</text>
  <path d="M 664.4589 245.8066 L 733.5238 245.8066" stroke="var(--text)" stroke-width="1.2091"/>
  <text x="871.654" y="339.3548" text-anchor="middle" font-size="19.5669" font-family="Arial, sans-serif" fill="var(--text)">3. Request merge</text>
  <rect x="1075.97" y="196.889" width="97.8354" height="97.8354" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="1124.8921" y="255.1615" text-anchor="middle" font-size="23.4805" fill="var(--bg)" font-family="Arial, sans-serif">main</text>
  <text x="1124.8921" y="189.6775" text-anchor="middle" font-size="19.5669" font-family="Arial, sans-serif" fill="var(--text)">Updated</text>
  <path d="M 1009.7837 245.8066 L 1067.3379 245.8066" stroke="var(--text)" stroke-width="1.2091" marker-end="url(#arrow)"/>
  <text x="1124.8921" y="339.3548" text-anchor="middle" font-size="19.5669" font-family="Arial, sans-serif" fill="var(--text)">4. Merge</text>
  <rect x="319.1339" y="432.9032" width="920.8661" height="187.0968" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.0004"/>
  <text x="779.5672" y="489.0324" text-anchor="middle" font-size="27.3938" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Pull Request Benefits:</text>
  <text x="365.1776" y="535.8066" font-size="23.4805" font-family="Arial, sans-serif" fill="var(--text)">• Code review before merge</text>
  <text x="365.1776" y="573.2259" font-size="23.4805" font-family="Arial, sans-serif" fill="var(--text)">• Discussion and feedback</text>
  <text x="825.6106" y="535.8066" font-size="23.4805" font-family="Arial, sans-serif" fill="var(--text)">• CI/CD integration</text>
  <text x="825.6106" y="573.2259" font-size="23.4805" font-family="Arial, sans-serif" fill="var(--text)">• Documentation trail</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="729.6057" y="80" text-anchor="middle" font-size="34.4085" font-weight="bold">Pull Request Workflow</text>
  <circle cx="299.4983" cy="257.4194" r="35.8423" fill="var(--ok-fill)" />
  <text x="299.4983" y="265.4839" text-anchor="middle" font-size="17.2043" fill="var(--bg)">main</text>
  <circle cx="442.8674" cy="257.4194" r="35.8423" fill="var(--primary-fill)" />
  <text x="442.8674" y="265.4839" text-anchor="middle" font-size="17.2043" fill="var(--bg)">feature</text>
  <path d="M 335.3406 257.4194 L 407.0251 257.4194" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <text x="371.1828" y="241.2904" text-anchor="middle" font-size="14.3369">1. Branch</text>
  <rect x="514.552" y="225.1613" width="143.3692" height="64.5161" fill="var(--warn-fill)" rx="7.0565" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="586.2366" y="265.4839" text-anchor="middle" font-size="17.2043" fill="var(--bg)">Commits</text>
  <path d="M 478.7097 257.4194 L 514.552 257.4194" stroke="var(--text)" stroke-width="2.4381" />
  <text x="586.2366" y="321.9355" text-anchor="middle" font-size="14.3369">2. Work</text>
  <rect x="700.9319" y="209.0323" width="172.043" height="96.7742" fill="var(--info-fill)" rx="7.0565" stroke="var(--info-border)" stroke-width="2"/>
  <text x="786.9535" y="249.3548" text-anchor="middle" font-size="17.2043" fill="var(--bg)">Pull Request</text>
  <text x="786.9535" y="281.6129" text-anchor="middle" font-size="14.3369" fill="var(--bg)">Review &amp; Discuss</text>
  <path d="M 657.9212 257.4194 L 700.9319 257.4194" stroke="var(--text)" stroke-width="2.4381" />
  <text x="786.9535" y="338.0645" text-anchor="middle" font-size="14.3369">3. Request merge</text>
  <circle cx="944.6595" cy="257.4194" r="35.8423" fill="var(--ok-fill)" />
  <text x="944.6595" y="265.4839" text-anchor="middle" font-size="17.2043" fill="var(--bg)">main</text>
  <text x="944.6595" y="209.0323" text-anchor="middle" font-size="14.3369">Updated</text>
  <path d="M 872.9749 257.4194 L 908.8172 257.4194" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <text x="944.6595" y="338.0645" text-anchor="middle" font-size="14.3369">4. Merge</text>
  <rect x="442.8674" y="418.7096" width="573.4766" height="161.2904" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.0565" />
  <text x="729.6057" y="467.0968" text-anchor="middle" font-size="20.0717" font-weight="bold">Pull Request Benefits:</text>
  <text x="471.5413" y="507.4193" font-size="17.2043">• Code review before merge</text>
  <text x="471.5413" y="539.6774" font-size="17.2043">• Discussion and feedback</text>
  <text x="758.2796" y="507.4193" font-size="17.2043">• CI/CD integration</text>
  <text x="758.2796" y="539.6774" font-size="17.2043">• Documentation trail</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
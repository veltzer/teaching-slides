<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <text x="779.5672" y="40" text-anchor="middle" font-size="46.9608" font-weight="bold">Pull Request Workflow</text>
  <rect x="40" y="196.889" width="97.8354" height="97.8354" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="88.9177" y="255.1615" text-anchor="middle" font-size="23.4805" fill="var(--bg)">main</text>
  <rect x="270.216" y="196.889" width="97.8354" height="97.8354" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="319.1339" y="255.1615" text-anchor="middle" font-size="23.4805" fill="var(--bg)">feature</text>
  <path d="M 146.4717 245.8066 L 261.5799 245.8066" stroke="var(--text)" stroke-width="1.2091" marker-end="url(#arrow)" />
  <text x="204.0257" y="227.097" text-anchor="middle" font-size="19.5669">1. Branch</text>
  <rect x="434.2421" y="208.3872" width="230.2165" height="74.8387" fill="var(--warn-fill)" rx="6.0004" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="549.3506" y="255.1615" text-anchor="middle" font-size="23.4805" fill="var(--bg)">Commits</text>
  <path d="M 376.6883 245.8066 L 434.2421 245.8066" stroke="var(--text)" stroke-width="1.2091" />
  <text x="549.3506" y="320.6454" text-anchor="middle" font-size="19.5669">2. Work</text>
  <rect x="733.5238" y="189.6775" width="276.2597" height="112.2581" fill="var(--info-fill)" rx="6.0004" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="871.654" y="236.4514" text-anchor="middle" font-size="23.4805" fill="var(--bg)">Pull Request</text>
  <text x="871.654" y="273.8709" text-anchor="middle" font-size="19.5669" fill="var(--bg)">Review &amp; Discuss</text>
  <path d="M 664.4589 245.8066 L 733.5238 245.8066" stroke="var(--text)" stroke-width="1.2091" />
  <text x="871.654" y="339.3548" text-anchor="middle" font-size="19.5669">3. Request merge</text>
  <rect x="1075.97" y="196.889" width="97.8354" height="97.8354" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="1124.8921" y="255.1615" text-anchor="middle" font-size="23.4805" fill="var(--bg)">main</text>
  <text x="1124.8921" y="189.6775" text-anchor="middle" font-size="19.5669">Updated</text>
  <path d="M 1009.7837 245.8066 L 1067.3379 245.8066" stroke="var(--text)" stroke-width="1.2091" marker-end="url(#arrow)" />
  <text x="1124.8921" y="339.3548" text-anchor="middle" font-size="19.5669">4. Merge</text>
  <rect x="319.1339" y="432.9032" width="920.8661" height="187.0968" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.0004" />
  <text x="779.5672" y="489.0324" text-anchor="middle" font-size="27.3938" font-weight="bold">Pull Request Benefits:</text>
  <text x="365.1776" y="535.8066" font-size="23.4805">• Code review before merge</text>
  <text x="365.1776" y="573.2259" font-size="23.4805">• Discussion and feedback</text>
  <text x="825.6106" y="535.8066" font-size="23.4805">• CI/CD integration</text>
  <text x="825.6106" y="573.2259" font-size="23.4805">• Documentation trail</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="779.6345" y="40" text-anchor="middle" font-size="46.9573" font-weight="bold">Pull Request Workflow</text>
  <circle cx="89.0862" cy="245.8066" r="48.9141" fill="var(--ok-fill)" />
  <text x="89.0862" y="255.1615" text-anchor="middle" font-size="23.4788" fill="var(--bg)">main</text>
  <circle cx="319.2687" cy="245.8066" r="48.9141" fill="var(--primary-fill)" />
  <text x="319.2687" y="255.1615" text-anchor="middle" font-size="23.4788" fill="var(--bg)">feature</text>
  <path d="M 146.6317 245.8066 L 261.7231 245.8066" stroke="var(--text)" stroke-width="1.2091" marker-end="url(#arrow)" />
  <text x="204.1773" y="227.097" text-anchor="middle" font-size="19.5655">1. Branch</text>
  <rect x="434.3601" y="208.3872" width="230.1828" height="74.8387" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="549.4517" y="255.1615" text-anchor="middle" font-size="23.4788" fill="var(--bg)">Commits</text>
  <path d="M 376.8146 245.8066 L 434.3601 245.8066" stroke="var(--text)" stroke-width="1.2091" />
  <text x="549.4517" y="320.6454" text-anchor="middle" font-size="19.5655">2. Work</text>
  <rect x="733.5979" y="189.6775" width="276.2193" height="112.2581" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2" />
  <text x="871.7079" y="236.4514" text-anchor="middle" font-size="23.4788" fill="var(--bg)">Pull Request</text>
  <text x="871.7079" y="273.8709" text-anchor="middle" font-size="19.5655" fill="var(--bg)">Review &amp; Discuss</text>
  <path d="M 664.5431 245.8066 L 733.5979 245.8066" stroke="var(--text)" stroke-width="1.2091" />
  <text x="871.7079" y="339.3548" text-anchor="middle" font-size="19.5655">3. Request merge</text>
  <circle cx="1124.9089" cy="245.8066" r="48.9141" fill="var(--ok-fill)" />
  <text x="1124.9089" y="255.1615" text-anchor="middle" font-size="23.4788" fill="var(--bg)">main</text>
  <text x="1124.9089" y="189.6775" text-anchor="middle" font-size="19.5655">Updated</text>
  <path d="M 1009.8174 245.8066 L 1067.3632 245.8066" stroke="var(--text)" stroke-width="1.2091" marker-end="url(#arrow)" />
  <text x="1124.9089" y="339.3548" text-anchor="middle" font-size="19.5655">4. Merge</text>
  <rect x="319.2687" y="432.9032" width="920.7313" height="187.0968" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="779.6345" y="489.0324" text-anchor="middle" font-size="27.3918" font-weight="bold">Pull Request Benefits:</text>
  <text x="365.3057" y="535.8066" font-size="23.4788">• Code review before merge</text>
  <text x="365.3057" y="573.2259" font-size="23.4788">• Discussion and feedback</text>
  <text x="825.6712" y="535.8066" font-size="23.4788">• CI/CD integration</text>
  <text x="825.6712" y="573.2259" font-size="23.4788">• Documentation trail</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="100" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--ok-text)">Connected to the World</text>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">local repo talks to many remotes</text>

  <rect x="40" y="165" width="290" height="300" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Share code</text>
  <text x="185" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Add remote by name</text>
  <text x="185" y="278" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--primary-text)">git remote add origin</text>
  <text x="185" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Publish a branch</text>
  <text x="185" y="353" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--primary-text)">git push -u origin main</text>
  <text x="185" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Inspect</text>
  <text x="185" y="428" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--primary-text)">git remote -v</text>

  <rect x="340" y="165" width="290" height="300" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Collaborate</text>
  <text x="485" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Fetch without merge</text>
  <text x="485" y="278" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--warn-text)">git fetch origin</text>
  <text x="485" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Integrate</text>
  <text x="485" y="353" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--warn-text)">git pull --rebase</text>
  <text x="485" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Resolve, then push</text>

  <rect x="640" y="165" width="290" height="300" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Open source</text>
  <text x="785" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Fork + clone</text>
  <text x="785" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Track upstream</text>
  <text x="785" y="323" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--info-text)">git remote add upstream</text>
  <text x="785" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Branch, push, PR</text>
  <text x="785" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Review until merged</text>

  <rect x="940" y="165" width="300" height="300" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Distributed</text>
  <text x="1090" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Many remotes per repo</text>
  <text x="1090" y="278" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--danger-text)">origin, upstream</text>
  <text x="1090" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Protected branches</text>
  <text x="1090" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">CI gates</text>
  <text x="1090" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">SSH / HTTPS auth</text>

  <rect x="40" y="490" width="1200" height="130" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--text)">Every clone is a full repo</text>
  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">fetch updates refs; merge/rebase integrates; push sends</text>
  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">No central server required</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--ok-text)">Connected to the World</text>
  <text x="640" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">local repo now talks to any number of remotes</text>

  <rect x="40" y="180" width="290" height="280" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Share code</text>
  <text x="185" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">add a remote by name</text>
  <text x="185" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">git remote add origin</text>
  <text x="185" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">publish a branch</text>
  <text x="185" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">git push -u origin main</text>
  <text x="185" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">inspect remotes</text>
  <text x="185" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">git remote -v</text>

  <rect x="340" y="180" width="290" height="280" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="485" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Collaborate</text>
  <text x="485" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">fetch without merging</text>
  <text x="485" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">git fetch origin</text>
  <text x="485" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">bring in their work</text>
  <text x="485" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">git pull --rebase</text>
  <text x="485" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">resolve conflicts locally</text>
  <text x="485" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">then push the result</text>

  <rect x="640" y="180" width="290" height="280" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="785" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Open source</text>
  <text x="785" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">fork on GitHub/GitLab</text>
  <text x="785" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">clone your fork</text>
  <text x="785" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">track upstream too</text>
  <text x="785" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">git remote add upstream</text>
  <text x="785" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">branch, push, open PR</text>
  <text x="785" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">review cycle until merged</text>

  <rect x="940" y="180" width="300" height="280" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1090" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Distributed</text>
  <text x="1090" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">many remotes per repo</text>
  <text x="1090" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">origin, upstream, staging</text>
  <text x="1090" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">protected branches</text>
  <text x="1090" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">CI gates before merge</text>
  <text x="1090" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">SSH or HTTPS auth</text>
  <text x="1090" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">credential helpers, tokens</text>

  <rect x="40" y="480" width="1200" height="130" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Every clone is a full repo — remotes are just named URLs</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">fetch updates refs, merge or rebase integrates them, push sends yours back</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">No central server needed — GitHub is one convention, not a requirement</text>
</svg>

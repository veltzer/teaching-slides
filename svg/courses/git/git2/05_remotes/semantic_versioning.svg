<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Semantic Versioning (SemVer)</text>
  <rect x="320" y="144" width="640" height="180" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="216" text-anchor="middle" font-size="57.6" font-family="monospace">v2.1.3</text>
  <text x="496" y="288" text-anchor="middle" font-size="22.4">MAJOR</text>
  <text x="640" y="288" text-anchor="middle" font-size="22.4">MINOR</text>
  <text x="784" y="288" text-anchor="middle" font-size="22.4">PATCH</text>
  <line x1="560" y1="225" x2="560" y2="261" stroke="#666" stroke-width="1.6" />
  <line x1="720" y1="225" x2="720" y2="261" stroke="#666" stroke-width="1.6" />
  <rect x="80" y="360" width="352" height="252" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="256" y="414" text-anchor="middle" font-size="22.4" font-weight="bold">MAJOR (v3.0.0)</text>
  <text x="112" y="459" font-size="17.6">Breaking changes</text>
  <text x="112" y="495" font-size="17.6">Incompatible API</text>
  <text x="112" y="531" font-size="17.6">Major rewrite</text>
  <text x="112" y="567" font-size="17.6">Example: v1.x → v2.0</text>
  <rect x="464" y="360" width="352" height="252" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="414" text-anchor="middle" font-size="22.4" font-weight="bold">MINOR (v2.2.0)</text>
  <text x="496" y="459" font-size="17.6">New features</text>
  <text x="496" y="495" font-size="17.6">Backwards compatible</text>
  <text x="496" y="531" font-size="17.6">Additions</text>
  <text x="496" y="567" font-size="17.6">Example: v2.1 → v2.2</text>
  <rect x="848" y="360" width="352" height="252" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="1024" y="414" text-anchor="middle" font-size="22.4" font-weight="bold">PATCH (v2.1.4)</text>
  <text x="880" y="459" font-size="17.6">Bug fixes</text>
  <text x="880" y="495" font-size="17.6">Security patches</text>
  <text x="880" y="531" font-size="17.6">No new features</text>
  <text x="880" y="567" font-size="17.6">Example: v2.1.3 → v2.1.4</text>
</svg>
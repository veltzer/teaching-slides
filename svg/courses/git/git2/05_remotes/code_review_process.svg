<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="403.1496" y="45.3543" text-anchor="middle" font-size="24.189" font-weight="bold">Code Review Workflow</text>
  <rect x="50.3937" y="90.7087" width="151.1811" height="90.7087" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="125.9843" y="124.7244" text-anchor="middle" font-size="14.1102" font-weight="bold">1. Submit PR</text>
  <text x="125.9843" y="153.0709" text-anchor="middle" font-size="11.0866">Author creates</text>
  <text x="125.9843" y="170.0787" text-anchor="middle" font-size="11.0866">pull request</text>
  <rect x="221.7323" y="90.7087" width="151.1811" height="90.7087" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="297.3228" y="124.7244" text-anchor="middle" font-size="14.1102" font-weight="bold">2. Review</text>
  <text x="297.3228" y="153.0709" text-anchor="middle" font-size="11.0866">Team reviews</text>
  <text x="297.3228" y="170.0787" text-anchor="middle" font-size="11.0866">code changes</text>
  <rect x="393.0709" y="90.7087" width="151.1811" height="90.7087" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="468.6614" y="124.7244" text-anchor="middle" font-size="14.1102" font-weight="bold">3. Feedback</text>
  <text x="468.6614" y="153.0709" text-anchor="middle" font-size="11.0866">Comments &amp;</text>
  <text x="468.6614" y="170.0787" text-anchor="middle" font-size="11.0866">suggestions</text>
  <rect x="564.4094" y="90.7087" width="151.1811" height="90.7087" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="640" y="124.7244" text-anchor="middle" font-size="14.1102" font-weight="bold">4. Update</text>
  <text x="640" y="153.0709" text-anchor="middle" font-size="11.0866">Author makes</text>
  <text x="640" y="170.0787" text-anchor="middle" font-size="11.0866">changes</text>
  <path d="M 201.5748 136.063 L 221.7323 136.063" stroke="var(--text)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <path d="M 372.9134 136.063 L 393.0709 136.063" stroke="var(--text)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <path d="M 544.252 136.063 L 564.4094 136.063" stroke="var(--text)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <path d="M 640 181.4173 Q 640 226.7717 297.3228 226.7717 Q 297.3228 181.4173 297.3228 181.4173" stroke="var(--text)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <text x="468.6614" y="243.7795" text-anchor="middle" font-size="10.0787">Iterate</text>
  <rect x="100.7874" y="283.4646" width="604.7244" height="113.3858" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="403.1496" y="317.4803" text-anchor="middle" font-size="16.126" font-weight="bold">5. Approve &amp; Merge</text>
  <text x="403.1496" y="345.8268" text-anchor="middle" font-size="12.0945">✓ Tests pass</text>
  <text x="403.1496" y="368.5039" text-anchor="middle" font-size="12.0945">✓ Reviews approved</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
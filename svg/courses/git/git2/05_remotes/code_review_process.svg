<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Code Review Workflow</text>
  <rect x="80" y="144" width="240" height="144" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="200" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">1. Submit PR</text>
  <text x="200" y="243" text-anchor="middle" font-size="17.6">Author creates</text>
  <text x="200" y="270" text-anchor="middle" font-size="17.6">pull request</text>
  <rect x="352" y="144" width="240" height="144" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="472" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">2. Review</text>
  <text x="472" y="243" text-anchor="middle" font-size="17.6">Team reviews</text>
  <text x="472" y="270" text-anchor="middle" font-size="17.6">code changes</text>
  <rect x="624" y="144" width="240" height="144" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="744" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">3. Feedback</text>
  <text x="744" y="243" text-anchor="middle" font-size="17.6">Comments &amp;</text>
  <text x="744" y="270" text-anchor="middle" font-size="17.6">suggestions</text>
  <rect x="896" y="144" width="240" height="144" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="3.2" rx="8" />
  <text x="1016" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">4. Update</text>
  <text x="1016" y="243" text-anchor="middle" font-size="17.6">Author makes</text>
  <text x="1016" y="270" text-anchor="middle" font-size="17.6">changes</text>
  <path d="M 320 216 L 352 216" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <path d="M 592 216 L 624 216" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <path d="M 864 216 L 896 216" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <path d="M 1016 288 Q 1016 360 472 360 Q 472 288 472 288" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <text x="744" y="387" text-anchor="middle" font-size="16">Iterate</text>
  <rect x="160" y="450" width="960" height="180" fill="#C8E6C9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="640" y="504" text-anchor="middle" font-size="25.6" font-weight="bold">5. Approve &amp; Merge</text>
  <text x="640" y="549" text-anchor="middle" font-size="19.2">✓ Tests pass</text>
  <text x="640" y="585" text-anchor="middle" font-size="19.2">✓ Reviews approved</text>
  <defs>
    <marker id="arrow2" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="403.1496" y="45.3543" text-anchor="middle" font-size="24.189" font-weight="bold">Code Review Workflow</ns0:text>
  <ns0:rect x="50.3937" y="90.7087" width="151.1811" height="90.7087" fill="var(--ok-pale)" stroke="var(--ok-mid)" stroke-width="2.0157" rx="5.0394" />
  <ns0:text x="125.9843" y="124.7244" text-anchor="middle" font-size="14.1102" font-weight="bold">1. Submit PR</ns0:text>
  <ns0:text x="125.9843" y="153.0709" text-anchor="middle" font-size="11.0866">Author creates</ns0:text>
  <ns0:text x="125.9843" y="170.0787" text-anchor="middle" font-size="11.0866">pull request</ns0:text>
  <ns0:rect x="221.7323" y="90.7087" width="151.1811" height="90.7087" fill="var(--primary-pale)" stroke="var(--primary-mid)" stroke-width="2.0157" rx="5.0394" />
  <ns0:text x="297.3228" y="124.7244" text-anchor="middle" font-size="14.1102" font-weight="bold">2. Review</ns0:text>
  <ns0:text x="297.3228" y="153.0709" text-anchor="middle" font-size="11.0866">Team reviews</ns0:text>
  <ns0:text x="297.3228" y="170.0787" text-anchor="middle" font-size="11.0866">code changes</ns0:text>
  <ns0:rect x="393.0709" y="90.7087" width="151.1811" height="90.7087" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="2.0157" rx="5.0394" />
  <ns0:text x="468.6614" y="124.7244" text-anchor="middle" font-size="14.1102" font-weight="bold">3. Feedback</ns0:text>
  <ns0:text x="468.6614" y="153.0709" text-anchor="middle" font-size="11.0866">Comments &amp;</ns0:text>
  <ns0:text x="468.6614" y="170.0787" text-anchor="middle" font-size="11.0866">suggestions</ns0:text>
  <ns0:rect x="564.4094" y="90.7087" width="151.1811" height="90.7087" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="2.0157" rx="5.0394" />
  <ns0:text x="640" y="124.7244" text-anchor="middle" font-size="14.1102" font-weight="bold">4. Update</ns0:text>
  <ns0:text x="640" y="153.0709" text-anchor="middle" font-size="11.0866">Author makes</ns0:text>
  <ns0:text x="640" y="170.0787" text-anchor="middle" font-size="11.0866">changes</ns0:text>
  <ns0:path d="M 201.5748 136.063 L 221.7323 136.063" stroke="var(--text-dark)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <ns0:path d="M 372.9134 136.063 L 393.0709 136.063" stroke="var(--text-dark)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <ns0:path d="M 544.252 136.063 L 564.4094 136.063" stroke="var(--text-dark)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <ns0:path d="M 640 181.4173 Q 640 226.7717 297.3228 226.7717 Q 297.3228 181.4173 297.3228 181.4173" stroke="var(--text-dark)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <ns0:text x="468.6614" y="243.7795" text-anchor="middle" font-size="10.0787">Iterate</ns0:text>
  <ns0:rect x="100.7874" y="283.4646" width="604.7244" height="113.3858" fill="var(--ok-lt)" stroke="var(--ok-mid)" stroke-width="2.0157" rx="5.0394" />
  <ns0:text x="403.1496" y="317.4803" text-anchor="middle" font-size="16.126" font-weight="bold">5. Approve &amp; Merge</ns0:text>
  <ns0:text x="403.1496" y="345.8268" text-anchor="middle" font-size="12.0945">✓ Tests pass</ns0:text>
  <ns0:text x="403.1496" y="368.5039" text-anchor="middle" font-size="12.0945">✓ Reviews approved</ns0:text>

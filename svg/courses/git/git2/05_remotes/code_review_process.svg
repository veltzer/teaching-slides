<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="403.1496" y="45.3543" text-anchor="middle" font-size="24.189" font-weight="bold">Code Review Workflow</ns0:text>
  <ns0:rect x="50.3937" y="90.7087" width="151.1811" height="90.7087" fill="#E8F5E9" stroke="#388E3C" stroke-width="2.0157" rx="5.0394" />
  <ns0:text x="125.9843" y="124.7244" text-anchor="middle" font-size="14.1102" font-weight="bold">1. Submit PR</ns0:text>
  <ns0:text x="125.9843" y="153.0709" text-anchor="middle" font-size="11.0866">Author creates</ns0:text>
  <ns0:text x="125.9843" y="170.0787" text-anchor="middle" font-size="11.0866">pull request</ns0:text>
  <ns0:rect x="221.7323" y="90.7087" width="151.1811" height="90.7087" fill="#E3F2FD" stroke="#1976D2" stroke-width="2.0157" rx="5.0394" />
  <ns0:text x="297.3228" y="124.7244" text-anchor="middle" font-size="14.1102" font-weight="bold">2. Review</ns0:text>
  <ns0:text x="297.3228" y="153.0709" text-anchor="middle" font-size="11.0866">Team reviews</ns0:text>
  <ns0:text x="297.3228" y="170.0787" text-anchor="middle" font-size="11.0866">code changes</ns0:text>
  <ns0:rect x="393.0709" y="90.7087" width="151.1811" height="90.7087" fill="#FFF3E0" stroke="#F57C00" stroke-width="2.0157" rx="5.0394" />
  <ns0:text x="468.6614" y="124.7244" text-anchor="middle" font-size="14.1102" font-weight="bold">3. Feedback</ns0:text>
  <ns0:text x="468.6614" y="153.0709" text-anchor="middle" font-size="11.0866">Comments &amp;</ns0:text>
  <ns0:text x="468.6614" y="170.0787" text-anchor="middle" font-size="11.0866">suggestions</ns0:text>
  <ns0:rect x="564.4094" y="90.7087" width="151.1811" height="90.7087" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2.0157" rx="5.0394" />
  <ns0:text x="640" y="124.7244" text-anchor="middle" font-size="14.1102" font-weight="bold">4. Update</ns0:text>
  <ns0:text x="640" y="153.0709" text-anchor="middle" font-size="11.0866">Author makes</ns0:text>
  <ns0:text x="640" y="170.0787" text-anchor="middle" font-size="11.0866">changes</ns0:text>
  <ns0:path d="M 201.5748 136.063 L 221.7323 136.063" stroke="#333" stroke-width="2.0157" marker-end="url(#arrow)" />
  <ns0:path d="M 372.9134 136.063 L 393.0709 136.063" stroke="#333" stroke-width="2.0157" marker-end="url(#arrow)" />
  <ns0:path d="M 544.252 136.063 L 564.4094 136.063" stroke="#333" stroke-width="2.0157" marker-end="url(#arrow)" />
  <ns0:path d="M 640 181.4173 Q 640 226.7717 297.3228 226.7717 Q 297.3228 181.4173 297.3228 181.4173" stroke="#333" stroke-width="2.0157" marker-end="url(#arrow)" />
  <ns0:text x="468.6614" y="243.7795" text-anchor="middle" font-size="10.0787">Iterate</ns0:text>
  <ns0:rect x="100.7874" y="283.4646" width="604.7244" height="113.3858" fill="#C8E6C9" stroke="#388E3C" stroke-width="2.0157" rx="5.0394" />
  <ns0:text x="403.1496" y="317.4803" text-anchor="middle" font-size="16.126" font-weight="bold">5. Approve &amp; Merge</ns0:text>
  <ns0:text x="403.1496" y="345.8268" text-anchor="middle" font-size="12.0945">✓ Tests pass</ns0:text>
  <ns0:text x="403.1496" y="368.5039" text-anchor="middle" font-size="12.0945">✓ Reviews approved</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrow2" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <ns0:polygon points="0,18 4.8,0" fill="#333" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="272.7273" height="171.85197517149" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.429101082089" filter="url(#shadow)"/>
  <text x="176.3637" y="104.444418930037" text-anchor="middle" font-size="26.085649033836" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">1. Submit PR</text>
  <text x="176.3637" y="158.148139643346" text-anchor="middle" font-size="20.495974249699" font-family="Arial, sans-serif" fill="var(--ok-text)">Author creates</text>
  <text x="176.3637" y="190.370234293528" text-anchor="middle" font-size="20.495974249699" font-family="Arial, sans-serif" fill="var(--ok-text)">pull request</text>
  <rect x="349.0909" y="40" width="272.7273" height="171.85197517149" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.429101082089" filter="url(#shadow)"/>
  <text x="485.4544" y="104.444418930037" text-anchor="middle" font-size="26.085649033836" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">2. Review</text>
  <text x="485.4544" y="158.148139643346" text-anchor="middle" font-size="20.495974249699" font-family="Arial, sans-serif" fill="var(--primary-text)">Team reviews</text>
  <text x="485.4544" y="190.370234293528" text-anchor="middle" font-size="20.495974249699" font-family="Arial, sans-serif" fill="var(--primary-text)">code changes</text>
  <rect x="658.182" y="40" width="272.7273" height="171.85197517149" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.429101082089" filter="url(#shadow)"/>
  <text x="794.5456" y="104.444418930037" text-anchor="middle" font-size="26.085649033836" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">3. Feedback</text>
  <text x="794.5456" y="158.148139643346" text-anchor="middle" font-size="20.495974249699" font-family="Arial, sans-serif" fill="var(--warn-text)">Comments &amp;</text>
  <text x="794.5456" y="190.370234293528" text-anchor="middle" font-size="20.495974249699" font-family="Arial, sans-serif" fill="var(--warn-text)">suggestions</text>
  <rect x="967.2727" y="40" width="272.7273" height="171.85197517149" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.429101082089" filter="url(#shadow)"/>
  <text x="1103.6365" y="104.444418930037" text-anchor="middle" font-size="26.085649033836" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">4. Update</text>
  <text x="1103.6365" y="158.148139643346" text-anchor="middle" font-size="20.495974249699" font-family="Arial, sans-serif" fill="var(--info-text)">Author makes</text>
  <text x="1103.6365" y="190.370234293528" text-anchor="middle" font-size="20.495974249699" font-family="Arial, sans-serif" fill="var(--info-text)">changes</text>
  <path d="M 312.7273 125.925930178327 L 349.0909 125.925930178327" stroke="var(--text)" stroke-width="0.8165" marker-end="url(#arrow)"/>
  <path d="M 621.8182 125.925930178327 L 658.182 125.925930178327" stroke="var(--text)" stroke-width="0.8165" marker-end="url(#arrow)"/>
  <path d="M 930.9091 125.925930178327 L 967.2727 125.925930178327" stroke="var(--text)" stroke-width="0.8165" marker-end="url(#arrow)"/>
  <path d="M 1103.6365 211.851745541819 Q 1103.6365 297.777790534982 485.4544 297.777790534982 Q 485.4544 211.851745541819 485.4544 211.851745541819" stroke="var(--text)" stroke-width="0.8165" marker-end="url(#arrow)"/>
  <text x="794.5456" y="329.999885185165" text-anchor="middle" font-size="20.420218008615" font-family="Arial, sans-serif" fill="var(--text)">Iterate</text>
  <rect x="130.909" y="405.1852319616" width="1090.9092" height="214.8147680384" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.429101082089" filter="url(#shadow)"/>
  <text x="676.3638" y="469.629536076801" text-anchor="middle" font-size="29.812277476069" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">5. Approve &amp; Merge</text>
  <text x="676.3638" y="523.333371604945" text-anchor="middle" font-size="22.359127743288" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Tests pass</text>
  <text x="676.3638" y="566.296164471856" text-anchor="middle" font-size="22.359127743288" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Reviews approved</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

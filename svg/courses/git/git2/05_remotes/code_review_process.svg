<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="668.6739" y="80" text-anchor="middle" font-size="34.4086" font-weight="bold">Code Review Workflow</text>
  <rect x="166.8818" y="144.5162" width="215.0537" height="129.0323" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.5349" />
  <text x="274.4087" y="192.9032" text-anchor="middle" font-size="20.0716" font-weight="bold">1. Submit PR</text>
  <text x="274.4087" y="233.2259" text-anchor="middle" font-size="15.7706">Author creates</text>
  <text x="274.4087" y="257.4193" text-anchor="middle" font-size="15.7706">pull request</text>
  <rect x="410.6094" y="144.5162" width="215.0537" height="129.0323" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.5349" />
  <text x="518.1362" y="192.9032" text-anchor="middle" font-size="20.0716" font-weight="bold">2. Review</text>
  <text x="518.1362" y="233.2259" text-anchor="middle" font-size="15.7706">Team reviews</text>
  <text x="518.1362" y="257.4193" text-anchor="middle" font-size="15.7706">code changes</text>
  <rect x="654.337" y="144.5162" width="215.0537" height="129.0323" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="8.5349" />
  <text x="761.8638" y="192.9032" text-anchor="middle" font-size="20.0716" font-weight="bold">3. Feedback</text>
  <text x="761.8638" y="233.2259" text-anchor="middle" font-size="15.7706">Comments &amp;</text>
  <text x="761.8638" y="257.4193" text-anchor="middle" font-size="15.7706">suggestions</text>
  <rect x="898.0645" y="144.5162" width="215.0537" height="129.0323" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="8.5349" />
  <text x="1005.5914" y="192.9032" text-anchor="middle" font-size="20.0716" font-weight="bold">4. Update</text>
  <text x="1005.5914" y="233.2259" text-anchor="middle" font-size="15.7706">Author makes</text>
  <text x="1005.5914" y="257.4193" text-anchor="middle" font-size="15.7706">changes</text>
  <path d="M 381.9355 209.0323 L 410.6094 209.0323" stroke="var(--text)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <path d="M 625.6631 209.0323 L 654.337 209.0323" stroke="var(--text)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <path d="M 869.3907 209.0323 L 898.0645 209.0323" stroke="var(--text)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <path d="M 1005.5914 273.5484 Q 1005.5914 338.0646 518.1362 338.0646 Q 518.1362 273.5484 518.1362 273.5484" stroke="var(--text)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <text x="761.8638" y="362.258" text-anchor="middle" font-size="14.3369">Iterate</text>
  <rect x="238.5664" y="418.7097" width="860.2149" height="161.2903" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.5349" />
  <text x="668.6739" y="467.0968" text-anchor="middle" font-size="22.9391" font-weight="bold">5. Approve &amp; Merge</text>
  <text x="668.6739" y="507.4194" text-anchor="middle" font-size="17.2043">✓ Tests pass</text>
  <text x="668.6739" y="539.6774" text-anchor="middle" font-size="17.2043">✓ Reviews approved</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Where Can Remotes Live?</text>
  <rect x="80" y="144" width="352" height="216" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="256" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Cloud Platforms</text>
  <text x="112" y="243" font-size="19.2">• GitHub</text>
  <text x="112" y="279" font-size="19.2">• GitLab</text>
  <text x="112" y="315" font-size="19.2">• Bitbucket</text>
  <rect x="464" y="144" width="352" height="216" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Self-Hosted</text>
  <text x="496" y="243" font-size="19.2">• GitLab CE/EE</text>
  <text x="496" y="279" font-size="19.2">• Gitea</text>
  <text x="496" y="315" font-size="19.2">• Bitbucket Server</text>
  <rect x="848" y="144" width="352" height="216" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="1024" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Simple Servers</text>
  <text x="880" y="243" font-size="19.2">• SSH server</text>
  <text x="880" y="279" font-size="19.2">• HTTP server</text>
  <text x="880" y="315" font-size="19.2">• File system</text>
  <rect x="272" y="396" width="736" height="216" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="450" text-anchor="middle" font-size="25.6" font-weight="bold">Remote URLs</text>
  <text x="304" y="504" font-size="19.2" font-family="monospace">https://github.com/user/repo.git</text>
  <text x="304" y="540" font-size="19.2" font-family="monospace">git@github.com:user/repo.git</text>
  <text x="304" y="576" font-size="19.2" font-family="monospace">file:///path/to/repo.git</text>
</svg>
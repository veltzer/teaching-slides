<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <text x="350" y="20" text-anchor="middle" font-size="16" font-weight="bold">Git Tool Selection Matrix</text>

  <!-- Individual Developer -->
  <rect x="50" y="50" width="150" height="120" fill="#3498db" rx="5"/>
  <text x="125" y="75" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Individual</text>
  <text x="125" y="90" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Developer</text>
  <text x="125" y="110" text-anchor="middle" fill="white" font-size="9">• Command line</text>
  <text x="125" y="125" text-anchor="middle" fill="white" font-size="9">• IDE integration</text>
  <text x="125" y="140" text-anchor="middle" fill="white" font-size="9">• Desktop apps</text>
  <text x="125" y="155" text-anchor="middle" fill="white" font-size="9">• GitHub Desktop</text>

  <!-- Small Team -->
  <rect x="250" y="50" width="150" height="120" fill="#e74c3c" rx="5"/>
  <text x="325" y="75" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Small Team</text>
  <text x="325" y="90" text-anchor="middle" fill="white" font-size="12" font-weight="bold">(2-10 people)</text>
  <text x="325" y="110" text-anchor="middle" fill="white" font-size="9">• GitHub/GitLab</text>
  <text x="325" y="125" text-anchor="middle" fill="white" font-size="9">• Basic CI/CD</text>
  <text x="325" y="140" text-anchor="middle" fill="white" font-size="9">• Shared workflows</text>
  <text x="325" y="155" text-anchor="middle" fill="white" font-size="9">• Code reviews</text>

  <!-- Enterprise -->
  <rect x="450" y="50" width="150" height="120" fill="#2ecc71" rx="5"/>
  <text x="525" y="75" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Enterprise</text>
  <text x="525" y="90" text-anchor="middle" fill="white" font-size="12" font-weight="bold">(10+ people)</text>
  <text x="525" y="110" text-anchor="middle" fill="white" font-size="9">• GitLab/BitBucket</text>
  <text x="525" y="125" text-anchor="middle" fill="white" font-size="9">• Advanced CI/CD</text>
  <text x="325" y="140" text-anchor="middle" fill="white" font-size="9">• Security scanning</text>
  <text x="525" y="155" text-anchor="middle" fill="white" font-size="9">• Compliance tools</text>

  <!-- Project Types -->
  <text x="50" y="200" font-size="14" font-weight="bold">Project Type Considerations:</text>

  <rect x="50" y="220" width="200" height="60" fill="#f39c12" rx="3"/>
  <text x="150" y="240" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Open Source</text>
  <text x="150" y="255" text-anchor="middle" fill="white" font-size="9">GitHub, Travis CI, Codecov</text>
  <text x="150" y="270" text-anchor="middle" fill="white" font-size="9">Community tools, public repos</text>

  <rect x="300" y="220" width="200" height="60" fill="#9b59b6" rx="3"/>
  <text x="400" y="240" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Corporate</text>
  <text x="400" y="255" text-anchor="middle" fill="white" font-size="9">GitLab, Jenkins, Bamboo</text>
  <text x="400" y="270" text-anchor="middle" fill="white" font-size="9">On-premise, security, compliance</text>

  <!-- Language-specific -->
  <text x="50" y="310" font-size="14" font-weight="bold">Language-Specific:</text>
  <text x="50" y="330" font-size="10">Python: GitPython, pre-commit, GitHub Actions</text>
  <text x="50" y="345" font-size="10">Java: Eclipse EGit, IntelliJ, Maven/Gradle integration</text>
  <text x="50" y="360" font-size="10">JavaScript: Husky, lint-staged, GitHub Actions</text>
  <text x="50" y="375" font-size="10">C#: Visual Studio, Azure DevOps, TFS</text>
</svg>

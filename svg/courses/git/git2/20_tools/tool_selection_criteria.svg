<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="606.8148" y="34.1333" text-anchor="middle" font-size="27.3067" font-weight="bold">Git Tool Selection Matrix</ns0:text>
  <ns0:rect x="86.6879" y="85.3333" width="260.0635" height="204.8" fill="#3498db" rx="8.5333" />
  <ns0:text x="216.7195" y="128" text-anchor="middle" fill="white" font-size="20.48" font-weight="bold">Individual</ns0:text>
  <ns0:text x="216.7195" y="153.6" text-anchor="middle" fill="white" font-size="20.48" font-weight="bold">Developer</ns0:text>
  <ns0:text x="216.7195" y="187.7333" text-anchor="middle" fill="white" font-size="17.0667">• Command line</ns0:text>
  <ns0:text x="216.7195" y="213.3333" text-anchor="middle" fill="white" font-size="17.0667">• IDE integration</ns0:text>
  <ns0:text x="216.7195" y="238.9333" text-anchor="middle" fill="white" font-size="17.0667">• Desktop apps</ns0:text>
  <ns0:text x="216.7195" y="264.5333" text-anchor="middle" fill="white" font-size="17.0667">• GitHub Desktop</ns0:text>
  <ns0:rect x="433.4392" y="85.3333" width="260.0635" height="204.8" fill="#e74c3c" rx="8.5333" />
  <ns0:text x="563.4709" y="128" text-anchor="middle" fill="white" font-size="20.48" font-weight="bold">Small Team</ns0:text>
  <ns0:text x="563.4709" y="153.6" text-anchor="middle" fill="white" font-size="20.48" font-weight="bold">(2-10 people)</ns0:text>
  <ns0:text x="563.4709" y="187.7333" text-anchor="middle" fill="white" font-size="17.0667">• GitHub/GitLab</ns0:text>
  <ns0:text x="563.4709" y="213.3333" text-anchor="middle" fill="white" font-size="17.0667">• Basic CI/CD</ns0:text>
  <ns0:text x="563.4709" y="238.9333" text-anchor="middle" fill="white" font-size="17.0667">• Shared workflows</ns0:text>
  <ns0:text x="563.4709" y="264.5333" text-anchor="middle" fill="white" font-size="17.0667">• Code reviews</ns0:text>
  <ns0:rect x="780.1904" y="85.3333" width="260.0635" height="204.8" fill="#2ecc71" rx="8.5333" />
  <ns0:text x="910.2222" y="128" text-anchor="middle" fill="white" font-size="20.48" font-weight="bold">Enterprise</ns0:text>
  <ns0:text x="910.2222" y="153.6" text-anchor="middle" fill="white" font-size="20.48" font-weight="bold">(10+ people)</ns0:text>
  <ns0:text x="910.2222" y="187.7333" text-anchor="middle" fill="white" font-size="17.0667">• GitLab/BitBucket</ns0:text>
  <ns0:text x="910.2222" y="213.3333" text-anchor="middle" fill="white" font-size="17.0667">• Advanced CI/CD</ns0:text>
  <ns0:text x="563.4709" y="238.9333" text-anchor="middle" fill="white" font-size="17.0667">• Security scanning</ns0:text>
  <ns0:text x="910.2222" y="264.5333" text-anchor="middle" fill="white" font-size="17.0667">• Compliance tools</ns0:text>
  <ns0:text x="86.6879" y="341.3333" font-size="23.8933" font-weight="bold">Project Type Considerations:</ns0:text>
  <ns0:rect x="86.6879" y="375.4667" width="346.7513" height="102.4" fill="#f39c12" rx="5.12" />
  <ns0:text x="260.0635" y="409.6" text-anchor="middle" fill="white" font-size="18.7733" font-weight="bold">Open Source</ns0:text>
  <ns0:text x="260.0635" y="435.2" text-anchor="middle" fill="white" font-size="17.0667">GitHub, Travis CI, Codecov</ns0:text>
  <ns0:text x="260.0635" y="460.8" text-anchor="middle" fill="white" font-size="17.0667">Community tools, public repos</ns0:text>
  <ns0:rect x="520.127" y="375.4667" width="346.7513" height="102.4" fill="#9b59b6" rx="5.12" />
  <ns0:text x="693.5027" y="409.6" text-anchor="middle" fill="white" font-size="18.7733" font-weight="bold">Corporate</ns0:text>
  <ns0:text x="693.5027" y="435.2" text-anchor="middle" fill="white" font-size="17.0667">GitLab, Jenkins, Bamboo</ns0:text>
  <ns0:text x="693.5027" y="460.8" text-anchor="middle" fill="white" font-size="17.0667">On-premise, security, compliance</ns0:text>
  <ns0:text x="86.6879" y="529.0667" font-size="23.8933" font-weight="bold">Language-Specific:</ns0:text>
  <ns0:text x="86.6879" y="563.2" font-size="17.0667">Python: GitPython, pre-commit, GitHub Actions</ns0:text>
  <ns0:text x="86.6879" y="588.8" font-size="17.0667">Java: Eclipse EGit, IntelliJ, Maven/Gradle integration</ns0:text>
  <ns0:text x="86.6879" y="614.4" font-size="17.0667">JavaScript: Husky, lint-staged, GitHub Actions</ns0:text>
  <ns0:text x="86.6879" y="640" font-size="17.0667">C#: Visual Studio, Azure DevOps, TFS</ns0:text>
</ns0:svg>
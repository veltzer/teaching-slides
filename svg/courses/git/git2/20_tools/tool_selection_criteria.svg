<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="36" text-anchor="middle" font-size="28.8" font-weight="bold">Git Tool Selection Matrix</text>
  <rect x="91.4286" y="90" width="274.2857" height="216" fill="#3498db" rx="9" />
  <text x="228.5714" y="135" text-anchor="middle" fill="white" font-size="21.6" font-weight="bold">Individual</text>
  <text x="228.5714" y="162" text-anchor="middle" fill="white" font-size="21.6" font-weight="bold">Developer</text>
  <text x="228.5714" y="198" text-anchor="middle" fill="white" font-size="18">• Command line</text>
  <text x="228.5714" y="225" text-anchor="middle" fill="white" font-size="18">• IDE integration</text>
  <text x="228.5714" y="252" text-anchor="middle" fill="white" font-size="18">• Desktop apps</text>
  <text x="228.5714" y="279" text-anchor="middle" fill="white" font-size="18">• GitHub Desktop</text>
  <rect x="457.1429" y="90" width="274.2857" height="216" fill="#e74c3c" rx="9" />
  <text x="594.2857" y="135" text-anchor="middle" fill="white" font-size="21.6" font-weight="bold">Small Team</text>
  <text x="594.2857" y="162" text-anchor="middle" fill="white" font-size="21.6" font-weight="bold">(2-10 people)</text>
  <text x="594.2857" y="198" text-anchor="middle" fill="white" font-size="18">• GitHub/GitLab</text>
  <text x="594.2857" y="225" text-anchor="middle" fill="white" font-size="18">• Basic CI/CD</text>
  <text x="594.2857" y="252" text-anchor="middle" fill="white" font-size="18">• Shared workflows</text>
  <text x="594.2857" y="279" text-anchor="middle" fill="white" font-size="18">• Code reviews</text>
  <rect x="822.8571" y="90" width="274.2857" height="216" fill="#2ecc71" rx="9" />
  <text x="960" y="135" text-anchor="middle" fill="white" font-size="21.6" font-weight="bold">Enterprise</text>
  <text x="960" y="162" text-anchor="middle" fill="white" font-size="21.6" font-weight="bold">(10+ people)</text>
  <text x="960" y="198" text-anchor="middle" fill="white" font-size="18">• GitLab/BitBucket</text>
  <text x="960" y="225" text-anchor="middle" fill="white" font-size="18">• Advanced CI/CD</text>
  <text x="594.2857" y="252" text-anchor="middle" fill="white" font-size="18">• Security scanning</text>
  <text x="960" y="279" text-anchor="middle" fill="white" font-size="18">• Compliance tools</text>
  <text x="91.4286" y="360" font-size="25.2" font-weight="bold">Project Type Considerations:</text>
  <rect x="91.4286" y="396" width="365.7143" height="108" fill="#f39c12" rx="5.4" />
  <text x="274.2857" y="432" text-anchor="middle" fill="white" font-size="19.8" font-weight="bold">Open Source</text>
  <text x="274.2857" y="459" text-anchor="middle" fill="white" font-size="18">GitHub, Travis CI, Codecov</text>
  <text x="274.2857" y="486" text-anchor="middle" fill="white" font-size="18">Community tools, public repos</text>
  <rect x="548.5714" y="396" width="365.7143" height="108" fill="#9b59b6" rx="5.4" />
  <text x="731.4286" y="432" text-anchor="middle" fill="white" font-size="19.8" font-weight="bold">Corporate</text>
  <text x="731.4286" y="459" text-anchor="middle" fill="white" font-size="18">GitLab, Jenkins, Bamboo</text>
  <text x="731.4286" y="486" text-anchor="middle" fill="white" font-size="18">On-premise, security, compliance</text>
  <text x="91.4286" y="558" font-size="25.2" font-weight="bold">Language-Specific:</text>
  <text x="91.4286" y="594" font-size="18">Python: GitPython, pre-commit, GitHub Actions</text>
  <text x="91.4286" y="621" font-size="18">Java: Eclipse EGit, IntelliJ, Maven/Gradle integration</text>
  <text x="91.4286" y="648" font-size="18">JavaScript: Husky, lint-staged, GitHub Actions</text>
  <text x="91.4286" y="675" font-size="18">C#: Visual Studio, Azure DevOps, TFS</text>
</svg>
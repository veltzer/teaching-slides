<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="694.5454" y="40" text-anchor="middle" font-size="29.9716" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Git Tool Selection Matrix</text>
  <rect x="40" y="89.0141" width="327.2728" height="196.0563" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6362" y="129.8592" text-anchor="middle" fill="var(--bg)" font-size="22.4787" font-weight="bold" font-family="Arial, sans-serif">Individual</text>
  <text x="203.6362" y="154.3662" text-anchor="middle" fill="var(--bg)" font-size="22.4787" font-weight="bold" font-family="Arial, sans-serif">Developer</text>
  <text x="203.6362" y="187.0422" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">• Command line</text>
  <text x="203.6362" y="211.5493" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">• IDE integration</text>
  <text x="203.6362" y="236.0563" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">• Desktop apps</text>
  <text x="203.6362" y="260.5634" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">• GitHub Desktop</text>
  <rect x="476.3637" y="89.0141" width="327.2728" height="196.0563" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="129.8592" text-anchor="middle" fill="var(--bg)" font-size="22.4787" font-weight="bold" font-family="Arial, sans-serif">Small Team</text>
  <text x="640" y="154.3662" text-anchor="middle" fill="var(--bg)" font-size="22.4787" font-weight="bold" font-family="Arial, sans-serif">(2-10 people)</text>
  <text x="640" y="187.0422" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">• GitHub/GitLab</text>
  <text x="640" y="211.5493" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">• Basic CI/CD</text>
  <text x="640" y="236.0563" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">• Shared workflows</text>
  <text x="640" y="260.5634" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">• Code reviews</text>
  <rect x="912.7272" y="89.0141" width="327.2728" height="196.0563" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3637" y="129.8592" text-anchor="middle" fill="var(--bg)" font-size="22.4787" font-weight="bold" font-family="Arial, sans-serif">Enterprise</text>
  <text x="1076.3637" y="154.3662" text-anchor="middle" fill="var(--bg)" font-size="22.4787" font-weight="bold" font-family="Arial, sans-serif">(10+ people)</text>
  <text x="1076.3637" y="187.0422" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">• GitLab/BitBucket</text>
  <text x="1076.3637" y="211.5493" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">• Advanced CI/CD</text>
  <text x="640" y="236.0563" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">• Security scanning</text>
  <text x="1076.3637" y="260.5634" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">• Compliance tools</text>
  <text x="40" y="334.0845" font-size="26.2251" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Project Type Considerations:</text>
  <rect x="40" y="366.7606" width="436.3637" height="98.0282" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="258.1818" y="399.4366" text-anchor="middle" fill="var(--bg)" font-size="20.6054" font-weight="bold" font-family="Arial, sans-serif">Open Source</text>
  <text x="258.1818" y="423.9437" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">GitHub, Travis CI, Codecov</text>
  <text x="258.1818" y="448.4507" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">Community tools, public repos</text>
  <rect x="585.4546" y="366.7606" width="436.3637" height="98.0282" fill="url(#grad-info)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="803.6365" y="399.4366" text-anchor="middle" fill="var(--bg)" font-size="20.6054" font-weight="bold" font-family="Arial, sans-serif">Corporate</text>
  <text x="803.6365" y="423.9437" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">GitLab, Jenkins, Bamboo</text>
  <text x="803.6365" y="448.4507" text-anchor="middle" fill="var(--bg)" font-size="18.7323" font-family="Arial, sans-serif">On-premise, security, compliance</text>
  <text x="40" y="513.8029" font-size="26.2251" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Language-Specific:</text>
  <text x="40" y="546.4789" font-size="18.7323" font-family="Arial, sans-serif" fill="var(--text)">Python: GitPython, pre-commit, GitHub Actions</text>
  <text x="40" y="570.9859" font-size="18.7323" font-family="Arial, sans-serif" fill="var(--text)">Java: Eclipse EGit, IntelliJ, Maven/Gradle integration</text>
  <text x="40" y="595.493" font-size="18.7323" font-family="Arial, sans-serif" fill="var(--text)">JavaScript: Husky, lint-staged, GitHub Actions</text>
  <text x="40" y="620" font-size="18.7323" font-family="Arial, sans-serif" fill="var(--text)">C#: Visual Studio, Azure DevOps, TFS</text>
</svg>

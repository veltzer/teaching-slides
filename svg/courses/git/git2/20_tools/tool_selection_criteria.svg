<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="694.5454" y="40" text-anchor="middle" font-size="29.9716" font-weight="bold">Git Tool Selection Matrix</text>
  <rect x="40" y="89.0141" width="327.2728" height="196.0563" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6362" y="129.8592" text-anchor="middle" fill="var(--bg)" font-size="22.4787" font-weight="bold">Individual</text>
  <text x="203.6362" y="154.3662" text-anchor="middle" fill="var(--bg)" font-size="22.4787" font-weight="bold">Developer</text>
  <text x="203.6362" y="187.0422" text-anchor="middle" fill="var(--bg)" font-size="18.7323">• Command line</text>
  <text x="203.6362" y="211.5493" text-anchor="middle" fill="var(--bg)" font-size="18.7323">• IDE integration</text>
  <text x="203.6362" y="236.0563" text-anchor="middle" fill="var(--bg)" font-size="18.7323">• Desktop apps</text>
  <text x="203.6362" y="260.5634" text-anchor="middle" fill="var(--bg)" font-size="18.7323">• GitHub Desktop</text>
  <rect x="476.3637" y="89.0141" width="327.2728" height="196.0563" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="129.8592" text-anchor="middle" fill="var(--bg)" font-size="22.4787" font-weight="bold">Small Team</text>
  <text x="640" y="154.3662" text-anchor="middle" fill="var(--bg)" font-size="22.4787" font-weight="bold">(2-10 people)</text>
  <text x="640" y="187.0422" text-anchor="middle" fill="var(--bg)" font-size="18.7323">• GitHub/GitLab</text>
  <text x="640" y="211.5493" text-anchor="middle" fill="var(--bg)" font-size="18.7323">• Basic CI/CD</text>
  <text x="640" y="236.0563" text-anchor="middle" fill="var(--bg)" font-size="18.7323">• Shared workflows</text>
  <text x="640" y="260.5634" text-anchor="middle" fill="var(--bg)" font-size="18.7323">• Code reviews</text>
  <rect x="912.7272" y="89.0141" width="327.2728" height="196.0563" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3637" y="129.8592" text-anchor="middle" fill="var(--bg)" font-size="22.4787" font-weight="bold">Enterprise</text>
  <text x="1076.3637" y="154.3662" text-anchor="middle" fill="var(--bg)" font-size="22.4787" font-weight="bold">(10+ people)</text>
  <text x="1076.3637" y="187.0422" text-anchor="middle" fill="var(--bg)" font-size="18.7323">• GitLab/BitBucket</text>
  <text x="1076.3637" y="211.5493" text-anchor="middle" fill="var(--bg)" font-size="18.7323">• Advanced CI/CD</text>
  <text x="640" y="236.0563" text-anchor="middle" fill="var(--bg)" font-size="18.7323">• Security scanning</text>
  <text x="1076.3637" y="260.5634" text-anchor="middle" fill="var(--bg)" font-size="18.7323">• Compliance tools</text>
  <text x="40" y="334.0845" font-size="26.2251" font-weight="bold">Project Type Considerations:</text>
  <rect x="40" y="366.7606" width="436.3637" height="98.0282" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="258.1818" y="399.4366" text-anchor="middle" fill="var(--bg)" font-size="20.6054" font-weight="bold">Open Source</text>
  <text x="258.1818" y="423.9437" text-anchor="middle" fill="var(--bg)" font-size="18.7323">GitHub, Travis CI, Codecov</text>
  <text x="258.1818" y="448.4507" text-anchor="middle" fill="var(--bg)" font-size="18.7323">Community tools, public repos</text>
  <rect x="585.4546" y="366.7606" width="436.3637" height="98.0282" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="803.6365" y="399.4366" text-anchor="middle" fill="var(--bg)" font-size="20.6054" font-weight="bold">Corporate</text>
  <text x="803.6365" y="423.9437" text-anchor="middle" fill="var(--bg)" font-size="18.7323">GitLab, Jenkins, Bamboo</text>
  <text x="803.6365" y="448.4507" text-anchor="middle" fill="var(--bg)" font-size="18.7323">On-premise, security, compliance</text>
  <text x="40" y="513.8029" font-size="26.2251" font-weight="bold">Language-Specific:</text>
  <text x="40" y="546.4789" font-size="18.7323">Python: GitPython, pre-commit, GitHub Actions</text>
  <text x="40" y="570.9859" font-size="18.7323">Java: Eclipse EGit, IntelliJ, Maven/Gradle integration</text>
  <text x="40" y="595.493" font-size="18.7323">JavaScript: Husky, lint-staged, GitHub Actions</text>
  <text x="40" y="620" font-size="18.7323">C#: Visual Studio, Azure DevOps, TFS</text>
</svg>
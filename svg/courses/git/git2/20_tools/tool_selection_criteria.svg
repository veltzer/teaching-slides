<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="606.8148" y="34.1333" text-anchor="middle" font-size="27.3067" font-weight="bold">Git Tool Selection Matrix</text>
  <rect x="86.6879" y="85.3333" width="260.0635" height="204.8" fill="var(--primary-soft)" rx="8.5333" />
  <text x="216.7195" y="128" text-anchor="middle" fill="var(--bg)" font-size="20.48" font-weight="bold">Individual</text>
  <text x="216.7195" y="153.6" text-anchor="middle" fill="var(--bg)" font-size="20.48" font-weight="bold">Developer</text>
  <text x="216.7195" y="187.7333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Command line</text>
  <text x="216.7195" y="213.3333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• IDE integration</text>
  <text x="216.7195" y="238.9333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Desktop apps</text>
  <text x="216.7195" y="264.5333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• GitHub Desktop</text>
  <rect x="433.4392" y="85.3333" width="260.0635" height="204.8" fill="var(--danger-light)" rx="8.5333" />
  <text x="563.4709" y="128" text-anchor="middle" fill="var(--bg)" font-size="20.48" font-weight="bold">Small Team</text>
  <text x="563.4709" y="153.6" text-anchor="middle" fill="var(--bg)" font-size="20.48" font-weight="bold">(2-10 people)</text>
  <text x="563.4709" y="187.7333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• GitHub/GitLab</text>
  <text x="563.4709" y="213.3333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Basic CI/CD</text>
  <text x="563.4709" y="238.9333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Shared workflows</text>
  <text x="563.4709" y="264.5333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Code reviews</text>
  <rect x="780.1904" y="85.3333" width="260.0635" height="204.8" fill="var(--ok-vivid)" rx="8.5333" />
  <text x="910.2222" y="128" text-anchor="middle" fill="var(--bg)" font-size="20.48" font-weight="bold">Enterprise</text>
  <text x="910.2222" y="153.6" text-anchor="middle" fill="var(--bg)" font-size="20.48" font-weight="bold">(10+ people)</text>
  <text x="910.2222" y="187.7333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• GitLab/BitBucket</text>
  <text x="910.2222" y="213.3333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Advanced CI/CD</text>
  <text x="563.4709" y="238.9333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Security scanning</text>
  <text x="910.2222" y="264.5333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Compliance tools</text>
  <text x="86.6879" y="341.3333" font-size="23.8933" font-weight="bold">Project Type Considerations:</text>
  <rect x="86.6879" y="375.4667" width="346.7513" height="102.4" fill="var(--warn-gold)" rx="5.12" />
  <text x="260.0635" y="409.6" text-anchor="middle" fill="var(--bg)" font-size="18.7733" font-weight="bold">Open Source</text>
  <text x="260.0635" y="435.2" text-anchor="middle" fill="var(--bg)" font-size="17.0667">GitHub, Travis CI, Codecov</text>
  <text x="260.0635" y="460.8" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Community tools, public repos</text>
  <rect x="520.127" y="375.4667" width="346.7513" height="102.4" fill="var(--info-soft)" rx="5.12" />
  <text x="693.5027" y="409.6" text-anchor="middle" fill="var(--bg)" font-size="18.7733" font-weight="bold">Corporate</text>
  <text x="693.5027" y="435.2" text-anchor="middle" fill="var(--bg)" font-size="17.0667">GitLab, Jenkins, Bamboo</text>
  <text x="693.5027" y="460.8" text-anchor="middle" fill="var(--bg)" font-size="17.0667">On-premise, security, compliance</text>
  <text x="86.6879" y="529.0667" font-size="23.8933" font-weight="bold">Language-Specific:</text>
  <text x="86.6879" y="563.2" font-size="17.0667">Python: GitPython, pre-commit, GitHub Actions</text>
  <text x="86.6879" y="588.8" font-size="17.0667">Java: Eclipse EGit, IntelliJ, Maven/Gradle integration</text>
  <text x="86.6879" y="614.4" font-size="17.0667">JavaScript: Husky, lint-staged, GitHub Actions</text>
  <text x="86.6879" y="640" font-size="17.0667">C#: Visual Studio, Azure DevOps, TFS</text>
</svg>
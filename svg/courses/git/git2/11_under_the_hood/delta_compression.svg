<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="57.6" text-anchor="middle" font-size="29.8667" font-weight="bold">Delta Compression Example</text>
  <rect x="106.6667" y="144" width="256" height="230.4" fill="#3498db" rx="10.6667" />
  <text x="234.6667" y="216" text-anchor="middle" fill="white" font-size="25.6" font-weight="bold">Base Object</text>
  <text x="234.6667" y="273.6" text-anchor="middle" fill="white" font-size="21.3333">Full Content</text>
  <text x="234.6667" y="316.8" text-anchor="middle" fill="white" font-size="21.3333">1000 bytes</text>
  <rect x="512" y="144" width="256" height="230.4" fill="#e74c3c" rx="10.6667" />
  <text x="640" y="216" text-anchor="middle" fill="white" font-size="25.6" font-weight="bold">Delta Object</text>
  <text x="640" y="273.6" text-anchor="middle" fill="white" font-size="21.3333">Changes Only</text>
  <text x="640" y="316.8" text-anchor="middle" fill="white" font-size="21.3333">50 bytes</text>
  <rect x="917.3333" y="144" width="256" height="230.4" fill="#2ecc71" rx="10.6667" />
  <text x="1045.3333" y="216" text-anchor="middle" fill="white" font-size="25.6" font-weight="bold">Reconstructed</text>
  <text x="1045.3333" y="273.6" text-anchor="middle" fill="white" font-size="21.3333">Base + Delta</text>
  <text x="1045.3333" y="316.8" text-anchor="middle" fill="white" font-size="21.3333">1000 bytes</text>
  <line x1="362.6667" y1="259.2" x2="490.6667" y2="259.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowhead)" />
  <line x1="768" y1="259.2" x2="896" y2="259.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowhead)" />
  <text x="426.6667" y="244.8" text-anchor="middle" font-size="21.3333">+</text>
  <text x="832" y="244.8" text-anchor="middle" font-size="21.3333">=</text>
  <text x="640" y="489.6" text-anchor="middle" font-size="25.6">Space saved: 95% in this example</text>
  <defs>
    <marker id="arrowhead" markerWidth="21.3333" markerHeight="20.16" refX="19.2" refY="10.08" orient="auto">
      <polygon points="0,28.8 7.4667,0" fill="#333" />
    </marker>
  </defs>
</svg>
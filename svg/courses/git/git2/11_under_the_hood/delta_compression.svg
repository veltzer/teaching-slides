<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="36.7058" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Delta Compression Example</text>
  <rect x="40" y="156" width="288" height="309.3333" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184" y="252.6667" text-anchor="middle" fill="var(--bg)" font-size="31.4621" font-weight="bold" font-family="Arial, sans-serif">Base Object</text>
  <text x="184" y="330" text-anchor="middle" fill="var(--bg)" font-size="26.2185" font-family="Arial, sans-serif">Full Content</text>
  <text x="184" y="388" text-anchor="middle" fill="var(--bg)" font-size="26.2185" font-family="Arial, sans-serif">1000 bytes</text>
  <rect x="496" y="156" width="288" height="309.3333" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="252.6667" text-anchor="middle" fill="var(--bg)" font-size="31.4621" font-weight="bold" font-family="Arial, sans-serif">Delta Object</text>
  <text x="640" y="330" text-anchor="middle" fill="var(--bg)" font-size="26.2185" font-family="Arial, sans-serif">Changes Only</text>
  <text x="640" y="388" text-anchor="middle" fill="var(--bg)" font-size="26.2185" font-family="Arial, sans-serif">50 bytes</text>
  <rect x="952" y="156" width="288" height="309.3333" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1096" y="252.6667" text-anchor="middle" fill="var(--bg)" font-size="31.4621" font-weight="bold" font-family="Arial, sans-serif">Reconstructed</text>
  <text x="1096" y="330" text-anchor="middle" fill="var(--bg)" font-size="26.2185" font-family="Arial, sans-serif">Base + Delta</text>
  <text x="1096" y="388" text-anchor="middle" fill="var(--bg)" font-size="26.2185" font-family="Arial, sans-serif">1000 bytes</text>
  <line x1="328" y1="310.6667" x2="472" y2="310.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="784" y1="310.6667" x2="928" y2="310.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="291.3333" text-anchor="middle" font-size="26.2185" font-family="Arial, sans-serif" fill="var(--text)">+</text>
  <text x="856" y="291.3333" text-anchor="middle" font-size="26.2185" font-family="Arial, sans-serif" fill="var(--text)">=</text>
  <text x="640" y="620" text-anchor="middle" font-size="31.4621" font-family="Arial, sans-serif" fill="var(--text)">Space saved: 95% in this example</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

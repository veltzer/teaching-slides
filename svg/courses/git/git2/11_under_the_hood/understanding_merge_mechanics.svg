<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="48" text-anchor="middle" font-size="29.8667" font-weight="bold">Three-Way Merge Process</text>
  <circle cx="640" cy="192" r="42.6667" fill="#95a5a6" />
  <text x="640" y="204" text-anchor="middle" fill="white" font-size="23.4667">Base</text>
  <text x="640" y="264" text-anchor="middle" font-size="21.3333">Common ancestor</text>
  <circle cx="320" cy="432" r="42.6667" fill="#3498db" />
  <text x="320" y="444" text-anchor="middle" fill="white" font-size="23.4667">A</text>
  <text x="320" y="504" text-anchor="middle" font-size="21.3333">Branch A</text>
  <circle cx="960" cy="432" r="42.6667" fill="#e74c3c" />
  <text x="960" y="444" text-anchor="middle" fill="white" font-size="23.4667">B</text>
  <text x="960" y="504" text-anchor="middle" font-size="21.3333">Branch B</text>
  <circle cx="640" cy="600" r="42.6667" fill="#2ecc71" />
  <text x="640" y="612" text-anchor="middle" fill="white" font-size="23.4667">M</text>
  <text x="640" y="672" text-anchor="middle" font-size="21.3333">Merge commit</text>
  <line x1="597.3333" y1="240" x2="362.6667" y2="384" stroke="#333" stroke-width="2.1333" stroke-dasharray="10.6667 10.6667" />
  <line x1="682.6667" y1="240" x2="917.3333" y2="384" stroke="#333" stroke-width="2.1333" stroke-dasharray="10.6667 10.6667" />
  <line x1="362.6667" y1="432" x2="597.3333" y2="552" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowhead)" />
  <line x1="917.3333" y1="432" x2="682.6667" y2="552" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowhead)" />
  <text x="469.3333" y="348" font-size="21.3333">diff base→A</text>
  <text x="768" y="348" font-size="21.3333">diff base→B</text>
  <defs>
    <marker id="arrowhead" markerWidth="21.3333" markerHeight="16.8" refX="19.2" refY="8.4" orient="auto">
      <polygon points="0,24 7.4667,0" fill="#333" />
    </marker>
  </defs>
</svg>
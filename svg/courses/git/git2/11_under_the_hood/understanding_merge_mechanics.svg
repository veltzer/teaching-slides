<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="609.5238" y="45.7143" text-anchor="middle" font-size="28.4445" font-weight="bold">Three-Way Merge Process</text>
  <circle cx="609.5238" cy="182.8571" r="40.635" fill="var(--text-faint)" />
  <text x="609.5238" y="194.2857" text-anchor="middle" fill="var(--bg)" font-size="22.3492">Base</text>
  <text x="609.5238" y="251.4286" text-anchor="middle" font-size="20.3174">Common ancestor</text>
  <circle cx="304.7619" cy="411.4286" r="40.635" fill="var(--primary-fill)" />
  <text x="304.7619" y="422.8571" text-anchor="middle" fill="var(--bg)" font-size="22.3492">A</text>
  <text x="304.7619" y="480" text-anchor="middle" font-size="20.3174">Branch A</text>
  <circle cx="914.2857" cy="411.4286" r="40.635" fill="var(--danger-fill)" />
  <text x="914.2857" y="422.8571" text-anchor="middle" fill="var(--bg)" font-size="22.3492">B</text>
  <text x="914.2857" y="480" text-anchor="middle" font-size="20.3174">Branch B</text>
  <circle cx="609.5238" cy="571.4286" r="40.635" fill="var(--ok-fill)" />
  <text x="609.5238" y="582.8571" text-anchor="middle" fill="var(--bg)" font-size="22.3492">M</text>
  <text x="609.5238" y="640" text-anchor="middle" font-size="20.3174">Merge commit</text>
  <line x1="568.8889" y1="228.5714" x2="345.3969" y2="365.7143" stroke="var(--text)" stroke-width="2" stroke-dasharray="10.1588 10.1588" />
  <line x1="650.1588" y1="228.5714" x2="873.6508" y2="365.7143" stroke="var(--text)" stroke-width="2" stroke-dasharray="10.1588 10.1588" />
  <line x1="345.3969" y1="411.4286" x2="568.8889" y2="525.7143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="873.6508" y1="411.4286" x2="650.1588" y2="525.7143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="446.9841" y="331.4286" font-size="20.3174">diff base→A</text>
  <text x="731.4286" y="331.4286" font-size="20.3174">diff base→B</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 7.4667,0" fill="#333" />
    </marker>
  </defs>
</svg>
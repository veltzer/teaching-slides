<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Three-Way Merge</text>
  <text x="640" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--text-muted)">Git finds the common ancestor, diffs both sides, then combines them</text>

  <rect x="40" y="210" width="380" height="200" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--info-text)">Base</text>
  <text x="230" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--info-text)">Common ancestor</text>
  <text x="230" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--info-text)">merge-base A B</text>

  <rect x="450" y="210" width="380" height="200" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--primary-text)">Branch A</text>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--primary-text)">diff base to A</text>
  <text x="640" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--primary-text)">our changes</text>

  <rect x="860" y="210" width="380" height="200" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--danger-text)">Branch B</text>
  <text x="1050" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-text)">diff base to B</text>
  <text x="1050" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-text)">their changes</text>

  <line x1="230" y1="410" x2="560" y2="440" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="410" x2="640" y2="440" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1050" y1="410" x2="720" y2="440" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="450" width="600" height="170" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--ok-text)">Merge Commit M</text>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">Two parents: A and B</text>
  <text x="640" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">Conflicts surface here</text>
</svg>

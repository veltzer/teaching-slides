<text x="186.218487" y="473.693694" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.531215" fill="var(--primary-text)">parent ref</text>
<line x1="327.394958" y1="348.288288" x2="347.563025" y2="348.288288" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="342.521008" y="76.576577" width="292.436975" height="543.423423" rx="6.159364" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="488.739496" y="149.72973" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.796822" font-weight="bold" fill="var(--ok-text)">Tree (root)</text>
<text x="488.739496" y="212.432432" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.584336" font-style="italic" fill="var(--ok-text)">d4e5f6...</text>
<text x="488.739496" y="306.486486" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.531215" fill="var(--ok-text)">src/ -&gt; tree</text>
<text x="488.739496" y="390.09009" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.531215" fill="var(--ok-text)">README -&gt; blob</text>

<line x1="629.915966" y1="348.288288" x2="650.084034" y2="348.288288" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="645.042017" y="76.576577" width="292.436975" height="543.423423" rx="6.159364" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="791.260504" y="149.72973" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.796822" font-weight="bold" fill="var(--warn-text)">Tree (src)</text>
<text x="791.260504" y="212.432432" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.584336" font-style="italic" fill="var(--warn-text)">7g8h9i...</text>
<text x="791.260504" y="306.486486" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.531215" fill="var(--warn-text)">main.c -&gt; blob</text>
<text x="791.260504" y="390.09009" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.531215" fill="var(--warn-text)">util.c -&gt; blob</text>
<text x="791.260504" y="473.693694" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.531215" fill="var(--warn-text)">util.h -&gt; blob</text>
<line x1="932.436975" y1="348.288288" x2="952.605042" y2="348.288288" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="947.563025" y="76.576577" width="292.436975" height="543.423423" rx="6.159364" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="1093.781513" y="149.72973" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.796822" font-weight="bold" fill="var(--info-text)">Blob</text>
<text x="1093.781513" y="212.432432" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.584336" font-style="italic" fill="var(--info-text)">j0k1l2...</text>
<text x="1093.781513" y="306.486486" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.531215" fill="var(--info-text)">raw bytes</text>
<text x="1093.781513" y="390.09009" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.531215" fill="var(--info-text)">no filename</text>

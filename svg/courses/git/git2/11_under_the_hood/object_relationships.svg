<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
  </defs>
<text x="640" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--text)">Git Object Relationships</text>
<rect x="40" y="100" width="290" height="520" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
<text x="185" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--primary-text)">Commit</text>
<text x="185" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-style="italic" fill="var(--primary-text)">a1b2c3...</text>
<text x="185" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--primary-text)">author, msg</text>
<text x="185" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--primary-text)">tree ref</text>
<text x="185" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--primary-text)">parent ref</text>
<line x1="325" y1="360" x2="345" y2="360" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="340" y="100" width="290" height="520" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="485" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--ok-text)">Tree (root)</text>
<text x="485" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-style="italic" fill="var(--ok-text)">d4e5f6...</text>
<text x="485" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">src/ -> tree</text>
<text x="485" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">README -> blob</text>
<text x="485" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">LICENSE -> blob</text>
<line x1="625" y1="360" x2="645" y2="360" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="640" y="100" width="290" height="520" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
<text x="785" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--warn-text)">Tree (src)</text>
<text x="785" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-style="italic" fill="var(--warn-text)">7g8h9i...</text>
<text x="785" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">main.c -> blob</text>
<text x="785" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">util.c -> blob</text>
<text x="785" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">util.h -> blob</text>
<line x1="925" y1="360" x2="945" y2="360" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="940" y="100" width="290" height="520" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
<text x="1085" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--info-text)">Blob</text>
<text x="1085" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-style="italic" fill="var(--info-text)">j0k1l2...</text>
<text x="1085" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--info-text)">raw bytes</text>
<text x="1085" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--info-text)">no filename</text>
<text x="1085" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--info-text)">SHA-1 of content</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="630.26563" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.163465" font-weight="bold" fill="var(--text)">Caret vs Tilde Navigation</text>

  <rect x="578.028" y="100.54" width="104.475" height="104.475" rx="14" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3"/>
  <text x="630.26563" y="163.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.163465" font-weight="bold" fill="var(--danger-text)">M</text>
  <text x="630.26563" y="238.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.805477" font-weight="bold" fill="var(--text)">HEAD — merge commit</text>

  <line x1="589.616673" y1="195.740741" x2="325.398448" y2="367.592593" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="670.91459" y1="195.740741" x2="935.132817" y2="367.592593" stroke="var(--text-muted)" stroke-width="2"/>

  <rect x="232.512" y="358.318" width="104.475" height="104.475" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3"/>
  <text x="284.749491" y="421.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.163465" font-weight="bold" fill="var(--primary-text)">A</text>
  <text x="284.749491" y="501.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.805477" font-weight="bold" fill="var(--text)">HEAD^  ==  HEAD^1</text>
  <text x="284.749491" y="534.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.67123" fill="var(--text-muted)">first parent</text>

  <rect x="923.544" y="358.318" width="104.475" height="104.475" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3"/>
  <text x="975.781773" y="421.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.163465" font-weight="bold" fill="var(--ok-text)">B</text>
  <text x="975.781773" y="501.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.805477" font-weight="bold" fill="var(--text)">HEAD^2</text>
  <text x="975.781773" y="534.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.67123" fill="var(--text-muted)">second parent (merged branch)</text>

  <line x1="244.100533" y1="440.62963" x2="101.82918" y2="555.555556" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="40" y="551.065" width="62.6849" height="62.6849" rx="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3"/>
  <text x="71.342461" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.894974" font-weight="bold" fill="var(--warn-text)">C</text>

  <rect x="152.640376" y="560.925926" width="335.353902" height="59.074074" rx="6.268492" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320.317328" y="587.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.715978" font-weight="bold" fill="var(--text)">HEAD~2  ==  HEAD^^</text>
  <text x="320.317328" y="609.259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.581733" fill="var(--text-muted)">two generations up first-parent chain</text>

  <rect x="548.967716" y="560.925926" width="691.032284" height="59.074074" rx="6.268492" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="894.483857" y="585.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.67123" font-weight="bold" fill="var(--text)">Combine: HEAD~2^2  =  go back 2, then take the second parent</text>
  <text x="894.483857" y="608.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.581733" fill="var(--text-muted)">~n walks linearly; ^n picks among parents of a merge</text>
</svg>

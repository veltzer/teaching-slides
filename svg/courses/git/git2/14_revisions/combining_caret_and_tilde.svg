<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="752.1233" y="40" text-anchor="middle" font-size="35.872" font-weight="bold">Caret vs Tilde Navigation</text>
  <circle cx="752.1233" cy="191.3043" r="33.6301" fill="var(--danger-fill)" />
  <text x="752.1233" y="203.913" text-anchor="middle" fill="var(--bg)" font-size="22.42">M</text>
  <text x="752.1233" y="266.9565" text-anchor="middle" font-size="22.42">HEAD</text>
  <circle cx="527.8768" cy="367.8261" r="33.6301" fill="var(--primary-fill)" />
  <text x="527.8768" y="380.4348" text-anchor="middle" fill="var(--bg)" font-size="22.42">A</text>
  <text x="527.8768" y="443.4783" text-anchor="middle" font-size="22.42">HEAD^</text>
  <circle cx="976.3699" cy="367.8261" r="33.6301" fill="var(--ok-fill)" />
  <text x="976.3699" y="380.4348" text-anchor="middle" fill="var(--bg)" font-size="22.42">B</text>
  <text x="976.3699" y="443.4783" text-anchor="middle" font-size="22.42">HEAD^2</text>
  <circle cx="303.6301" cy="544.3478" r="33.6301" fill="var(--warn-fill)" />
  <text x="303.6301" y="556.9565" text-anchor="middle" fill="var(--bg)" font-size="22.42">C</text>
  <text x="303.6301" y="620" text-anchor="middle" font-size="22.42">HEAD~2</text>
  <line x1="718.4863" y1="216.5217" x2="561.5138" y2="342.6087" stroke="var(--text)" stroke-width="2" />
  <line x1="785.7603" y1="216.5217" x2="942.7329" y2="342.6087" stroke="var(--text)" stroke-width="2" />
  <line x1="494.2398" y1="393.0435" x2="337.2671" y2="519.1304" stroke="var(--text)" stroke-width="2" />
  <text x="617.5754" y="292.1739" font-size="22.42">^1 (first parent)</text>
  <text x="864.2467" y="292.1739" font-size="22.42">^2 (second parent)</text>
  <text x="393.3288" y="468.6957" font-size="22.42">~2 (2 generations)</text>
</svg>
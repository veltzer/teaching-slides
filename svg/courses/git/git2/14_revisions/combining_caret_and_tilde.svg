<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--text)">Caret vs Tilde Navigation</text>

  <circle cx="640" cy="180" r="50" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3"/>
  <text x="640" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--danger-text)">M</text>
  <text x="640" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">HEAD — merge commit</text>

  <line x1="600" y1="220" x2="340" y2="380" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="680" y1="220" x2="940" y2="380" stroke="var(--text-muted)" stroke-width="2"/>

  <circle cx="300" cy="420" r="50" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3"/>
  <text x="300" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--primary-text)">A</text>
  <text x="300" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">HEAD^  ==  HEAD^1</text>
  <text x="300" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">first parent</text>

  <circle cx="980" cy="420" r="50" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3"/>
  <text x="980" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--ok-text)">B</text>
  <text x="980" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">HEAD^2</text>
  <text x="980" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">second parent (merged branch)</text>

  <line x1="260" y1="448" x2="120" y2="555" stroke="var(--text-muted)" stroke-width="2"/>
  <circle cx="90" cy="580" r="30" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3"/>
  <text x="90" y="588" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">C</text>

  <rect x="170" y="560" width="330" height="55" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">HEAD~2  ==  HEAD^^</text>
  <text x="335" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">two generations up first-parent chain</text>

  <rect x="560" y="560" width="680" height="55" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="900" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Combine: HEAD~2^2  =  go back 2, then take the second parent</text>
  <text x="900" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">~n walks linearly; ^n picks among parents of a merge</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="630.26563" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.163465" font-weight="bold" fill="var(--text)">Caret vs Tilde Navigation</text>

  <rect x="578.028" y="100.54" width="104.475" height="104.475" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="630.26563" y="163.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.163465" font-weight="bold" fill="var(--danger-text)">M</text>
  <text x="630.26563" y="238.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.805477" font-weight="bold" fill="var(--text)">HEAD — merge commit</text>

  <line x1="589.616673" y1="195.740741" x2="325.398448" y2="367.592593" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="670.91459" y1="195.740741" x2="935.132817" y2="367.592593" stroke="var(--text-muted)" stroke-width="2"/>

  <rect x="232.512" y="358.318" width="104.475" height="104.475" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="284.749491" y="421.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.163465" font-weight="bold" fill="var(--primary-text)">A</text>
  <text x="284.749491" y="501.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.805477" font-weight="bold" fill="var(--text)">HEAD^  ==  HEAD^1</text>
  <text x="284.749491" y="534.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.67123" fill="var(--text-muted)">first parent</text>

  <rect x="923.544" y="358.318" width="104.475" height="104.475" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="975.781773" y="421.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.163465" font-weight="bold" fill="var(--ok-text)">B</text>
  <text x="975.781773" y="501.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.805477" font-weight="bold" fill="var(--text)">HEAD^2</text>
  <text x="975.781773" y="534.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.67123" fill="var(--text-muted)">second parent (merged branch)</text>

  <line x1="244.100533" y1="440.62963" x2="101.82918" y2="555.555556" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="40" y="551.065" width="62.6849" height="62.6849" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="71.342461" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.894974" font-weight="bold" fill="var(--warn-text)">C</text>

  <rect x="152.640376" y="560.925926" width="335.353902" height="59.074074" rx="6.268492" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320.317328" y="587.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.715978" font-weight="bold" fill="var(--text)">HEAD~2  ==  HEAD^^</text>
  <text x="320.317328" y="609.259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.581733" fill="var(--text-muted)">two generations up first-parent chain</text>

  <rect x="548.967716" y="560.925926" width="691.032284" height="59.074074" rx="6.268492" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="894.483857" y="585.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.67123" font-weight="bold" fill="var(--text)">Combine: HEAD~2^2  =  go back 2, then take the second parent</text>
  <text x="894.483857" y="608.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.581733" fill="var(--text-muted)">~n walks linearly; ^n picks among parents of a merge</text>
</svg>

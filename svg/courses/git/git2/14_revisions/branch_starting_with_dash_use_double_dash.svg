  <text x="619.7979" y="330" text-anchor="middle" fill="var(--bg)" font-size="26.936">A</text>
  <circle cx="889.1583" cy="307.2727" r="40.404" fill="var(--ok-fill)" />
  <text x="889.1583" y="330" text-anchor="middle" fill="var(--bg)" font-size="26.936">B</text>

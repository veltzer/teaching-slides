  <text x="1158.5185" y="330" text-anchor="middle" fill="var(--bg)" font-size="26.936">C</text>
  <line x1="350.4377" y1="307.2727" x2="579.3939" y2="307.2727" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="660.202" y1="307.2727" x2="848.7542" y2="307.2727" stroke="var(--text)" stroke-width="2" />
  <line x1="929.5623" y1="307.2727" x2="1118.1145" y2="307.2727" stroke="var(--text)" stroke-width="2" />
  <text x="619.7979" y="443.6364" text-anchor="middle" font-size="26.936">a1b2c3d</text>
  <text x="889.1583" y="443.6364" text-anchor="middle" font-size="26.936">d4e5f6g</text>
  <text x="1158.5185" y="443.6364" text-anchor="middle" font-size="26.936">g7h8i9j</text>
  <text x="485.1179" y="580" text-anchor="middle" font-size="32.3232">"main" resolves to commit C (g7h8i9j)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->

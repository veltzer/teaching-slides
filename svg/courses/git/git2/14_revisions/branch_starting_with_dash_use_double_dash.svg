  <line x1="660.783821" y1="303.6363" x2="862.899623" y2="303.6363" stroke="var(--text)" stroke-width="2" />
  <line x1="949.52061" y1="303.6363" x2="1151.636312" y2="303.6363" stroke="var(--text)" stroke-width="2" />

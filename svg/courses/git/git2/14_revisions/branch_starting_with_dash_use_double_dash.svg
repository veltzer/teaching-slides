  <rect x="861.155821" y="258.582" width="90.10889" height="90.1088" rx="14.000007" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="906.210166" y="330" text-anchor="middle" fill="var(--bg)" font-size="30.036315">B</text>
  <rect x="1149.89111" y="258.582" width="90.10889" height="90.1088" rx="14.000007" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="1194.946755" y="330" text-anchor="middle" fill="var(--bg)" font-size="30.036315">C</text>

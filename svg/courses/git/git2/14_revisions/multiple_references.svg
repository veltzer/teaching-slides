<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="70" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">Revision Ranges: A..B vs A...B</text>

  <!-- Shared ancestor row -->
  <line x1="80" y1="260" x2="1240" y2="260" stroke="var(--text-faint)" stroke-width="2"/>

  <rect x="80" y="230" width="100" height="60" rx="6" fill="var(--text-faint)" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="130" y="267" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--bg)">base</text>

  <!-- Branch A (top) -->
  <rect x="260" y="150" width="100" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="310" y="187" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-text)">a1</text>
  <rect x="420" y="150" width="100" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="470" y="187" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-text)">a2</text>
  <rect x="580" y="150" width="100" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="630" y="187" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-text)">A</text>

  <line x1="180" y1="260" x2="260" y2="210" stroke="var(--text)" stroke-width="2"/>
  <line x1="360" y1="180" x2="420" y2="180" stroke="var(--text)" stroke-width="2"/>
  <line x1="520" y1="180" x2="580" y2="180" stroke="var(--text)" stroke-width="2"/>
  <text x="130" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-accent)">Branch A</text>

  <!-- Branch B (bottom) -->
  <rect x="260" y="310" width="100" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="310" y="347" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--danger-text)">b1</text>
  <rect x="420" y="310" width="100" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="470" y="347" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--danger-text)">b2</text>
  <rect x="580" y="310" width="100" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="630" y="347" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--danger-text)">B</text>

  <line x1="180" y1="260" x2="260" y2="310" stroke="var(--text)" stroke-width="2"/>
  <line x1="360" y1="340" x2="420" y2="340" stroke="var(--text)" stroke-width="2"/>
  <line x1="520" y1="340" x2="580" y2="340" stroke="var(--text)" stroke-width="2"/>
  <text x="130" y="380" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--danger-accent)">Branch B</text>

  <!-- Explanations -->
  <rect x="740" y="130" width="500" height="110" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="990" y="165" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--danger-text)">A..B</text>
  <text x="990" y="195" text-anchor="middle" font-size="15" fill="var(--danger-text)">Commits reachable from B</text>
  <text x="990" y="220" text-anchor="middle" font-size="15" fill="var(--danger-text)">but not from A — { b1, b2, B }</text>

  <rect x="740" y="280" width="500" height="110" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="990" y="315" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)">A...B</text>
  <text x="990" y="345" text-anchor="middle" font-size="15" fill="var(--info-text)">Symmetric difference — commits</text>
  <text x="990" y="370" text-anchor="middle" font-size="15" fill="var(--info-text)">on either side, not on both</text>

  <rect x="40" y="440" width="1200" height="180" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="480" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">Mental model</text>
  <text x="640" y="515" text-anchor="middle" font-size="15" fill="var(--text-muted)">A..B  ≡  B minus the commits already in A</text>
  <text x="640" y="545" text-anchor="middle" font-size="15" fill="var(--text-muted)">A...B ≡  (A ∪ B) minus their merge base</text>
  <text x="640" y="580" text-anchor="middle" font-size="15" fill="var(--text-muted)">Use two dots for "what's new on B"; three dots for "how they diverged"</text>
  <text x="640" y="610" text-anchor="middle" font-size="14" font-style="italic" fill="var(--text-faint)">git log A..B   |   git log A...B --left-right</text>
</svg>

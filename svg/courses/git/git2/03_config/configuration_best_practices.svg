<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="64" text-anchor="middle" font-size="38.4" font-weight="bold">Configuration Strategy</text>
  <rect x="80" y="128" width="512" height="240" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="336" y="176" text-anchor="middle" font-size="25.6" font-weight="bold">Global Settings</text>
  <text x="112" y="224" font-size="19.2">• User identity</text>
  <text x="112" y="256" font-size="19.2">• Editor preference</text>
  <text x="112" y="288" font-size="19.2">• Common aliases</text>
  <text x="112" y="320" font-size="19.2">• Color preferences</text>
  <rect x="688" y="128" width="512" height="240" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="944" y="176" text-anchor="middle" font-size="25.6" font-weight="bold">Local Settings</text>
  <text x="720" y="224" font-size="19.2">• Project-specific user</text>
  <text x="720" y="256" font-size="19.2">• Special workflows</text>
  <text x="720" y="288" font-size="19.2">• Hooks configuration</text>
  <text x="720" y="320" font-size="19.2">• Signing requirements</text>
  <rect x="80" y="400" width="512" height="240" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="336" y="448" text-anchor="middle" font-size="25.6" font-weight="bold">Team Settings</text>
  <text x="112" y="496" font-size="19.2">• .gitignore (tracked)</text>
  <text x="112" y="528" font-size="19.2">• .gitattributes (tracked)</text>
  <text x="112" y="560" font-size="19.2">• .editorconfig (tracked)</text>
  <text x="112" y="592" font-size="19.2">• Hooks in repo</text>
  <rect x="688" y="400" width="512" height="240" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="944" y="448" text-anchor="middle" font-size="25.6" font-weight="bold">Never Share</text>
  <text x="720" y="496" font-size="19.2">• Credentials</text>
  <text x="720" y="528" font-size="19.2">• Personal paths</text>
  <text x="720" y="560" font-size="19.2">• IDE-specific configs</text>
  <text x="720" y="592" font-size="19.2">• Local experiments</text>
</svg>
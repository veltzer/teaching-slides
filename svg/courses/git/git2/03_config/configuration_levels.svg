  <text x="766.2554" y="247.145" text-anchor="middle" font-size="12.6255">Only this repo</text>
  <rect x="697.3889" y="279.4263" width="137.7331" height="38.7374" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="1.4978" />
  <text x="766.2554" y="305.2513" text-anchor="middle" font-size="12.6255" fill="var(--bg)">--local (default)</text>
  <text x="766.2554" y="356.901" text-anchor="middle" font-size="16.0688">Highest Priority</text>
  <path d="M 307.1449 266.5138 L 353.056 266.5138" stroke="var(--text)" stroke-width="1.3295" marker-end="url(#arrow)" />
  <path d="M 594.089 266.5138 L 640 266.5138" stroke="var(--text)" stroke-width="1.3295" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">

  <text x="479.3114" y="305.2513" text-anchor="middle" font-size="12.6255" fill="var(--bg)">--global</text>
  <text x="479.3114" y="356.901" text-anchor="middle" font-size="16.0688">Medium Priority</text>
  <rect x="651.4779" y="111.5639" width="229.5552" height="322.812" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.4978" rx="6" />
  <text x="766.2554" y="156.7575" text-anchor="middle" font-size="20.66" font-weight="bold">Local</text>
  <text x="766.2554" y="189.0388" text-anchor="middle" font-size="13.7733">.git/config</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="40" text-anchor="middle" font-size="41.8976" font-weight="bold">Git Configuration Scopes</text>
  <rect x="40" y="120.0001" width="342.8571" height="499.9999" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4287" y="190" text-anchor="middle" font-size="31.4234" font-weight="bold">System</text>
  <text x="211.4287" y="240.0001" text-anchor="middle" font-size="20.9489">/etc/gitconfig</text>
  <text x="211.4287" y="290.0001" text-anchor="middle" font-size="19.2031">All users</text>
  <text x="211.4287" y="330.0002" text-anchor="middle" font-size="19.2031">All repositories</text>
  <rect x="108.5715" y="380.0003" width="205.7142" height="59.9999" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4287" y="420.0004" text-anchor="middle" font-size="19.2031" fill="var(--bg)">--system</text>
  <text x="211.4287" y="500" text-anchor="middle" font-size="24.4403">Lowest Priority</text>
  <rect x="468.5715" y="120.0001" width="342.8571" height="499.9999" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="190" text-anchor="middle" font-size="31.4234" font-weight="bold">Global</text>
  <text x="640" y="240.0001" text-anchor="middle" font-size="20.9489">~/.gitconfig</text>
  <text x="640" y="290.0001" text-anchor="middle" font-size="19.2031">Current user</text>
  <text x="640" y="330.0002" text-anchor="middle" font-size="19.2031">All repositories</text>
  <rect x="537.1427" y="380.0003" width="205.7142" height="59.9999" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="420.0004" text-anchor="middle" font-size="19.2031" fill="var(--bg)">--global</text>
  <text x="640" y="500" text-anchor="middle" font-size="24.4403">Medium Priority</text>
  <rect x="897.1429" y="120.0001" width="342.8571" height="499.9999" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5713" y="190" text-anchor="middle" font-size="31.4234" font-weight="bold">Local</text>
  <text x="1068.5713" y="240.0001" text-anchor="middle" font-size="20.9489">.git/config</text>
  <text x="1068.5713" y="290.0001" text-anchor="middle" font-size="19.2031">Current repository</text>
  <text x="1068.5713" y="330.0002" text-anchor="middle" font-size="19.2031">Only this repo</text>
  <rect x="965.7143" y="380.0003" width="205.7142" height="59.9999" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5713" y="420.0004" text-anchor="middle" font-size="19.2031" fill="var(--bg)">--local (default)</text>
  <text x="1068.5713" y="500" text-anchor="middle" font-size="24.4403">Highest Priority</text>
  <path d="M 382.8571 360.0003 L 451.4286 360.0003" stroke="var(--text)" stroke-width="1.3295" marker-end="url(#arrow)" />
  <path d="M 811.4285 360.0003 L 879.9999 360.0003" stroke="var(--text)" stroke-width="1.3295" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
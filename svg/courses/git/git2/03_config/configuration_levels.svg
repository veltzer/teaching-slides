<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="41.8976" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Git Configuration Scopes</text>
  <rect x="40" y="120.0001" width="342.8571" height="499.9999" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4287" y="190" text-anchor="middle" font-size="31.4234" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">System</text>
  <text x="211.4287" y="240.0001" text-anchor="middle" font-size="20.9489" font-family="Arial, sans-serif" fill="var(--danger-text)">/etc/gitconfig</text>
  <text x="211.4287" y="290.0001" text-anchor="middle" font-size="19.2031" font-family="Arial, sans-serif" fill="var(--danger-text)">All users</text>
  <text x="211.4287" y="330.0002" text-anchor="middle" font-size="19.2031" font-family="Arial, sans-serif" fill="var(--danger-text)">All repositories</text>
  <rect x="108.5715" y="380.0003" width="205.7142" height="59.9999" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4287" y="420.0004" text-anchor="middle" font-size="19.2031" fill="var(--bg)" font-family="Arial, sans-serif">--system</text>
  <text x="211.4287" y="500" text-anchor="middle" font-size="24.4403" font-family="Arial, sans-serif" fill="var(--danger-text)">Lowest Priority</text>
  <rect x="468.5715" y="120.0001" width="342.8571" height="499.9999" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="190" text-anchor="middle" font-size="31.4234" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Global</text>
  <text x="640" y="240.0001" text-anchor="middle" font-size="20.9489" font-family="Arial, sans-serif" fill="var(--warn-text)">~/.gitconfig</text>
  <text x="640" y="290.0001" text-anchor="middle" font-size="19.2031" font-family="Arial, sans-serif" fill="var(--warn-text)">Current user</text>
  <text x="640" y="330.0002" text-anchor="middle" font-size="19.2031" font-family="Arial, sans-serif" fill="var(--warn-text)">All repositories</text>
  <rect x="537.1427" y="380.0003" width="205.7142" height="59.9999" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="420.0004" text-anchor="middle" font-size="19.2031" fill="var(--bg)" font-family="Arial, sans-serif">--global</text>
  <text x="640" y="500" text-anchor="middle" font-size="24.4403" font-family="Arial, sans-serif" fill="var(--warn-text)">Medium Priority</text>
  <rect x="897.1429" y="120.0001" width="342.8571" height="499.9999" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5713" y="190" text-anchor="middle" font-size="31.4234" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Local</text>
  <text x="1068.5713" y="240.0001" text-anchor="middle" font-size="20.9489" font-family="Arial, sans-serif" fill="var(--ok-text)">.git/config</text>
  <text x="1068.5713" y="290.0001" text-anchor="middle" font-size="19.2031" font-family="Arial, sans-serif" fill="var(--ok-text)">Current repository</text>
  <text x="1068.5713" y="330.0002" text-anchor="middle" font-size="19.2031" font-family="Arial, sans-serif" fill="var(--ok-text)">Only this repo</text>
  <rect x="965.7143" y="380.0003" width="205.7142" height="59.9999" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5713" y="420.0004" text-anchor="middle" font-size="19.2031" fill="var(--bg)" font-family="Arial, sans-serif">--local (default)</text>
  <text x="1068.5713" y="500" text-anchor="middle" font-size="24.4403" font-family="Arial, sans-serif" fill="var(--ok-text)">Highest Priority</text>
  <path d="M 382.8571 360.0003 L 451.4286 360.0003" stroke="var(--text)" stroke-width="1.3295" marker-end="url(#arrow)" />
  <path d="M 811.4285 360.0003 L 879.9999 360.0003" stroke="var(--text)" stroke-width="1.3295" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="474.0741" y="53.3333" text-anchor="middle" font-size="28.4444" font-weight="bold">Git Configuration Scopes</text>
  <rect x="59.2593" y="106.6667" width="237.037" height="333.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="177.7778" y="153.3333" text-anchor="middle" font-size="21.3333" font-weight="bold">System</text>
  <text x="177.7778" y="186.6667" text-anchor="middle" font-size="14.2222">/etc/gitconfig</text>
  <text x="177.7778" y="220" text-anchor="middle" font-size="13.037">All users</text>
  <text x="177.7778" y="246.6667" text-anchor="middle" font-size="13.037">All repositories</text>
  <rect x="106.6667" y="280" width="142.2222" height="40" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="177.7778" y="306.6667" text-anchor="middle" font-size="13.037" fill="var(--bg)">--system</text>
  <text x="177.7778" y="360" text-anchor="middle" font-size="16.5926">Lowest Priority</text>
  <rect x="355.5556" y="106.6667" width="237.037" height="333.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="474.0741" y="153.3333" text-anchor="middle" font-size="21.3333" font-weight="bold">Global</text>
  <text x="474.0741" y="186.6667" text-anchor="middle" font-size="14.2222">~/.gitconfig</text>
  <text x="474.0741" y="220" text-anchor="middle" font-size="13.037">Current user</text>
  <text x="474.0741" y="246.6667" text-anchor="middle" font-size="13.037">All repositories</text>
  <rect x="402.963" y="280" width="142.2222" height="40" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="474.0741" y="306.6667" text-anchor="middle" font-size="13.037" fill="var(--bg)">--global</text>
  <text x="474.0741" y="360" text-anchor="middle" font-size="16.5926">Medium Priority</text>
  <rect x="651.8519" y="106.6667" width="237.037" height="333.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="770.3704" y="153.3333" text-anchor="middle" font-size="21.3333" font-weight="bold">Local</text>
  <text x="770.3704" y="186.6667" text-anchor="middle" font-size="14.2222">.git/config</text>
  <text x="770.3704" y="220" text-anchor="middle" font-size="13.037">Current repository</text>
  <text x="770.3704" y="246.6667" text-anchor="middle" font-size="13.037">Only this repo</text>
  <rect x="699.2593" y="280" width="142.2222" height="40" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="770.3704" y="306.6667" text-anchor="middle" font-size="13.037" fill="var(--bg)">--local (default)</text>
  <text x="770.3704" y="360" text-anchor="middle" font-size="16.5926">Highest Priority</text>
  <path d="M 296.2963 266.6667 L 343.7037 266.6667" stroke="var(--text)" stroke-width="2.3704" marker-end="url(#arrow)" />
  <path d="M 592.5926 266.6667 L 640 266.6667" stroke="var(--text)" stroke-width="2.3704" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="474.0741" y="53.3333" text-anchor="middle" font-size="28.4444" font-weight="bold">Git Configuration Scopes</ns0:text>
  <ns0:rect x="59.2593" y="106.6667" width="237.037" height="333.3333" fill="#FFEBEE" stroke="#C62828" stroke-width="2.3704" rx="5.9259" />
  <ns0:text x="177.7778" y="153.3333" text-anchor="middle" font-size="21.3333" font-weight="bold">System</ns0:text>
  <ns0:text x="177.7778" y="186.6667" text-anchor="middle" font-size="14.2222">/etc/gitconfig</ns0:text>
  <ns0:text x="177.7778" y="220" text-anchor="middle" font-size="13.037">All users</ns0:text>
  <ns0:text x="177.7778" y="246.6667" text-anchor="middle" font-size="13.037">All repositories</ns0:text>
  <ns0:rect x="106.6667" y="280" width="142.2222" height="40" fill="#e74c3c" rx="3.5556" />
  <ns0:text x="177.7778" y="306.6667" text-anchor="middle" font-size="13.037" fill="white">--system</ns0:text>
  <ns0:text x="177.7778" y="360" text-anchor="middle" font-size="16.5926">Lowest Priority</ns0:text>
  <ns0:rect x="355.5556" y="106.6667" width="237.037" height="333.3333" fill="#FFF3E0" stroke="#F57C00" stroke-width="2.3704" rx="5.9259" />
  <ns0:text x="474.0741" y="153.3333" text-anchor="middle" font-size="21.3333" font-weight="bold">Global</ns0:text>
  <ns0:text x="474.0741" y="186.6667" text-anchor="middle" font-size="14.2222">~/.gitconfig</ns0:text>
  <ns0:text x="474.0741" y="220" text-anchor="middle" font-size="13.037">Current user</ns0:text>
  <ns0:text x="474.0741" y="246.6667" text-anchor="middle" font-size="13.037">All repositories</ns0:text>
  <ns0:rect x="402.963" y="280" width="142.2222" height="40" fill="#FF9800" rx="3.5556" />
  <ns0:text x="474.0741" y="306.6667" text-anchor="middle" font-size="13.037" fill="white">--global</ns0:text>
  <ns0:text x="474.0741" y="360" text-anchor="middle" font-size="16.5926">Medium Priority</ns0:text>
  <ns0:rect x="651.8519" y="106.6667" width="237.037" height="333.3333" fill="#E8F5E9" stroke="#388E3C" stroke-width="2.3704" rx="5.9259" />
  <ns0:text x="770.3704" y="153.3333" text-anchor="middle" font-size="21.3333" font-weight="bold">Local</ns0:text>
  <ns0:text x="770.3704" y="186.6667" text-anchor="middle" font-size="14.2222">.git/config</ns0:text>
  <ns0:text x="770.3704" y="220" text-anchor="middle" font-size="13.037">Current repository</ns0:text>
  <ns0:text x="770.3704" y="246.6667" text-anchor="middle" font-size="13.037">Only this repo</ns0:text>
  <ns0:rect x="699.2593" y="280" width="142.2222" height="40" fill="#4CAF50" rx="3.5556" />
  <ns0:text x="770.3704" y="306.6667" text-anchor="middle" font-size="13.037" fill="white">--local (default)</ns0:text>
  <ns0:text x="770.3704" y="360" text-anchor="middle" font-size="16.5926">Highest Priority</ns0:text>
  <ns0:path d="M 296.2963 266.6667 L 343.7037 266.6667" stroke="#333" stroke-width="2.3704" marker-end="url(#arrow)" />
  <ns0:path d="M 592.5926 266.6667 L 640 266.6667" stroke="#333" stroke-width="2.3704" marker-end="url(#arrow)" />
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrow1" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <ns0:polygon points="0,18 4.8,0" fill="#333" />

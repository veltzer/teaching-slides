<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Git Configuration Scopes</text>
  <rect x="80" y="144" width="320" height="450" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="240" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">System</text>
  <text x="240" y="252" text-anchor="middle" font-size="19.2">/etc/gitconfig</text>
  <text x="240" y="297" text-anchor="middle" font-size="17.6">All users</text>
  <text x="240" y="333" text-anchor="middle" font-size="17.6">All repositories</text>
  <rect x="144" y="378" width="192" height="54" fill="#EF5350" rx="4.8" />
  <text x="240" y="414" text-anchor="middle" font-size="17.6" fill="white">--system</text>
  <text x="240" y="486" text-anchor="middle" font-size="22.4">Lowest Priority</text>
  <rect x="480" y="144" width="320" height="450" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">Global</text>
  <text x="640" y="252" text-anchor="middle" font-size="19.2">~/.gitconfig</text>
  <text x="640" y="297" text-anchor="middle" font-size="17.6">Current user</text>
  <text x="640" y="333" text-anchor="middle" font-size="17.6">All repositories</text>
  <rect x="544" y="378" width="192" height="54" fill="#FF9800" rx="4.8" />
  <text x="640" y="414" text-anchor="middle" font-size="17.6" fill="white">--global</text>
  <text x="640" y="486" text-anchor="middle" font-size="22.4">Medium Priority</text>
  <rect x="880" y="144" width="320" height="450" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="1040" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">Local</text>
  <text x="1040" y="252" text-anchor="middle" font-size="19.2">.git/config</text>
  <text x="1040" y="297" text-anchor="middle" font-size="17.6">Current repository</text>
  <text x="1040" y="333" text-anchor="middle" font-size="17.6">Only this repo</text>
  <rect x="944" y="378" width="192" height="54" fill="#4CAF50" rx="4.8" />
  <text x="1040" y="414" text-anchor="middle" font-size="17.6" fill="white">--local (default)</text>
  <text x="1040" y="486" text-anchor="middle" font-size="22.4">Highest Priority</text>
  <path d="M 400 360 L 464 360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <path d="M 800 360 L 864 360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <defs>
    <marker id="arrow1" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="80" text-anchor="middle" font-size="36.7815" font-weight="bold">Git Configuration Scopes</text>
  <rect x="103.6016" y="148.9656" width="306.5133" height="431.0344" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.7586" />
  <text x="256.8583" y="209.3103" text-anchor="middle" font-size="27.5862" font-weight="bold">System</text>
  <text x="256.8583" y="252.4139" text-anchor="middle" font-size="18.3908">/etc/gitconfig</text>
  <text x="256.8583" y="295.5173" text-anchor="middle" font-size="16.8582">All users</text>
  <text x="256.8583" y="330.0001" text-anchor="middle" font-size="16.8582">All repositories</text>
  <rect x="164.9043" y="373.1035" width="183.908" height="51.7241" fill="var(--danger-fill)" rx="7.7586" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="256.8583" y="407.5863" text-anchor="middle" font-size="16.8582" fill="var(--bg)">--system</text>
  <text x="256.8583" y="476.5517" text-anchor="middle" font-size="21.4559">Lowest Priority</text>
  <rect x="486.7433" y="148.9656" width="306.5133" height="431.0344" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.7586" />
  <text x="640" y="209.3103" text-anchor="middle" font-size="27.5862" font-weight="bold">Global</text>
  <text x="640" y="252.4139" text-anchor="middle" font-size="18.3908">~/.gitconfig</text>
  <text x="640" y="295.5173" text-anchor="middle" font-size="16.8582">Current user</text>
  <text x="640" y="330.0001" text-anchor="middle" font-size="16.8582">All repositories</text>
  <rect x="548.046" y="373.1035" width="183.908" height="51.7241" fill="var(--warn-fill)" rx="7.7586" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="407.5863" text-anchor="middle" font-size="16.8582" fill="var(--bg)">--global</text>
  <text x="640" y="476.5517" text-anchor="middle" font-size="21.4559">Medium Priority</text>
  <rect x="869.8851" y="148.9656" width="306.5133" height="431.0344" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.7586" />
  <text x="1023.1417" y="209.3103" text-anchor="middle" font-size="27.5862" font-weight="bold">Local</text>
  <text x="1023.1417" y="252.4139" text-anchor="middle" font-size="18.3908">.git/config</text>
  <text x="1023.1417" y="295.5173" text-anchor="middle" font-size="16.8582">Current repository</text>
  <text x="1023.1417" y="330.0001" text-anchor="middle" font-size="16.8582">Only this repo</text>
  <rect x="931.1877" y="373.1035" width="183.908" height="51.7241" fill="var(--ok-fill)" rx="7.7586" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1023.1417" y="407.5863" text-anchor="middle" font-size="16.8582" fill="var(--bg)">--local (default)</text>
  <text x="1023.1417" y="476.5517" text-anchor="middle" font-size="21.4559">Highest Priority</text>
  <path d="M 410.1149 355.8621 L 471.4176 355.8621" stroke="var(--text)" stroke-width="2.3704" marker-end="url(#arrow)" />
  <path d="M 793.2567 355.8621 L 854.5593 355.8621" stroke="var(--text)" stroke-width="2.3704" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
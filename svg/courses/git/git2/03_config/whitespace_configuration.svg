<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Whitespace Issues</text>
  <rect x="160" y="144" width="960" height="450" fill="#263238" stroke="#37474F" stroke-width="3.2" rx="8" />
  <text x="192" y="198" font-family="monospace" font-size="22.4" fill="#4CAF50">def hello():</text>
  <text x="192" y="243" font-family="monospace" font-size="22.4" fill="#FFFFFF">····print("Hello")</text>
  <rect x="528" y="216" width="64" height="36" fill="#F44336" opacity="0.5" />
  <text x="560" y="279" font-size="16" fill="#F44336">trailing space</text>
  <text x="192" y="288" font-family="monospace" font-size="22.4" fill="#FFFFFF">····</text>
  <rect x="256" y="261" width="64" height="36" fill="#FF9800" opacity="0.5" />
  <text x="288" y="324" font-size="16" fill="#FF9800">tab after space</text>
  <text x="256" y="288" font-family="monospace" font-size="22.4" fill="#FFFFFF">    return</text>
  <text x="192" y="396" font-family="monospace" font-size="22.4" fill="#4CAF50"># Configure Git to highlight these:</text>
  <text x="192" y="441" font-family="monospace" font-size="22.4" fill="#FFFFFF">git config core.whitespace \</text>
  <text x="224" y="486" font-family="monospace" font-size="22.4" fill="#FFFFFF">trailing-space,space-before-tab,indent-with-non-tab</text>
  <text x="192" y="549" font-family="monospace" font-size="22.4" fill="#4CAF50"># Show whitespace errors:</text>
  <text x="192" y="594" font-family="monospace" font-size="22.4" fill="#FFFFFF">git diff --check</text>
</svg>
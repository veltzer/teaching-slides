<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="45.2548" font-weight="bold">Whitespace Issues</text>
  <rect x="40" y="120" width="1200" height="500" fill="var(--text)" stroke="var(--text-muted)" stroke-width="3.2" rx="6" />
  <text x="80" y="180" font-family="monospace" font-size="26.3987" fill="var(--ok-accent)">def hello():</text>
  <text x="80" y="230" font-family="monospace" font-size="26.3987" fill="var(--bg)">····print("Hello")</text>
  <rect x="500" y="200" width="80" height="40" fill="var(--danger-fill)" opacity="0.5" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="270" font-size="18.8562" fill="var(--danger-accent)">trailing space</text>
  <text x="80" y="280" font-family="monospace" font-size="26.3987" fill="var(--bg)">····</text>
  <rect x="160" y="250" width="80" height="40" fill="var(--warn-fill)" opacity="0.5" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="320" font-size="18.8562" fill="var(--warn-accent)">tab after space</text>
  <text x="160" y="280" font-family="monospace" font-size="26.3987" fill="var(--bg)">    return</text>
  <text x="80" y="400" font-family="monospace" font-size="26.3987" fill="var(--ok-accent)"># Configure Git to highlight these:</text>
  <text x="80" y="450" font-family="monospace" font-size="26.3987" fill="var(--bg)">git config core.whitespace \</text>
  <text x="120" y="500" font-family="monospace" font-size="26.3987" fill="var(--bg)">trailing-space,space-before-tab,indent-with-non-tab</text>
  <text x="80" y="570" font-family="monospace" font-size="26.3987" fill="var(--ok-accent)"># Show whitespace errors:</text>
  <text x="80" y="620" font-family="monospace" font-size="26.3987" fill="var(--bg)">git diff --check</text>
</svg>
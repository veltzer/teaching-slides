<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">SSH vs HTTPS</text>
  <rect x="80" y="144" width="480" height="450" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="320" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">SSH</text>
  <text x="320" y="261" text-anchor="middle" font-size="19.2">git@github.com:user/repo.git</text>
  <text x="112" y="324" font-size="20.8">✓ No password after setup</text>
  <text x="112" y="369" font-size="20.8">✓ More secure</text>
  <text x="112" y="414" font-size="20.8">✓ Per-machine keys</text>
  <text x="112" y="459" font-size="20.8">✗ Initial setup required</text>
  <text x="112" y="504" font-size="20.8">✗ Firewall issues (port 22)</text>
  <rect x="720" y="144" width="480" height="450" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="960" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">HTTPS</text>
  <text x="960" y="261" text-anchor="middle" font-size="19.2">https://github.com/user/repo.git</text>
  <text x="752" y="324" font-size="20.8">✓ Works everywhere</text>
  <text x="752" y="369" font-size="20.8">✓ No setup needed</text>
  <text x="752" y="414" font-size="20.8">✓ Firewall friendly</text>
  <text x="752" y="459" font-size="20.8">✗ Need credentials often</text>
  <text x="752" y="504" font-size="20.8">✗ Less secure (if no 2FA)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Git Aliases Save Time</text>
  <rect x="80" y="144" width="480" height="108" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="320" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">Without Alias</text>
  <text x="320" y="225" text-anchor="middle" font-size="19.2" font-family="monospace">git log --oneline --graph --all</text>
  <rect x="720" y="144" width="480" height="108" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="960" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">With Alias</text>
  <text x="960" y="225" text-anchor="middle" font-size="19.2" font-family="monospace">git lol</text>
  <path d="M 560 198 L 720 198" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <text x="640" y="180" text-anchor="middle" font-size="19.2">Define once</text>
  <rect x="320" y="324" width="640" height="324" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="378" text-anchor="middle" font-size="25.6" font-weight="bold">Common Aliases</text>
  <text x="352" y="432" font-size="20.8" font-family="monospace">st = status</text>
  <text x="672" y="432" font-size="20.8" font-family="monospace">co = checkout</text>
  <text x="352" y="477" font-size="20.8" font-family="monospace">br = branch</text>
  <text x="672" y="477" font-size="20.8" font-family="monospace">cm = commit</text>
  <text x="352" y="522" font-size="20.8" font-family="monospace">unstage = restore --staged</text>
  <text x="352" y="567" font-size="20.8" font-family="monospace">last = log -1 HEAD</text>
  <text x="352" y="612" font-size="20.8" font-family="monospace">visual = !gitk</text>
  <defs>
    <marker id="arrow2" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
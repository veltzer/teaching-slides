<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="568.8889" y="64" text-anchor="middle" font-size="34.1333" font-weight="bold">Git Aliases Save Time</ns0:text>
  <ns0:rect x="71.1111" y="128" width="426.6667" height="96" fill="#FFEBEE" stroke="#C62828" stroke-width="2.8444" rx="7.1111" />
  <ns0:text x="284.4444" y="168" text-anchor="middle" font-size="19.9111" font-weight="bold">Without Alias</ns0:text>
  <ns0:text x="284.4444" y="200" text-anchor="middle" font-size="17.0667" font-family="monospace">git log --oneline --graph --all</ns0:text>
  <ns0:rect x="640" y="128" width="426.6667" height="96" fill="#E8F5E9" stroke="#388E3C" stroke-width="2.8444" rx="7.1111" />
  <ns0:text x="853.3333" y="168" text-anchor="middle" font-size="19.9111" font-weight="bold">With Alias</ns0:text>
  <ns0:text x="853.3333" y="200" text-anchor="middle" font-size="17.0667" font-family="monospace">git lol</ns0:text>
  <ns0:path d="M 497.7778 176 L 640 176" stroke="#333" stroke-width="2.8444" marker-end="url(#arrow)" />
  <ns0:text x="568.8889" y="160" text-anchor="middle" font-size="17.0667">Define once</ns0:text>
  <ns0:rect x="284.4444" y="288" width="568.8889" height="288" fill="#F5F5F5" stroke="#333" stroke-width="2.8444" rx="7.1111" />
  <ns0:text x="568.8889" y="336" text-anchor="middle" font-size="22.7556" font-weight="bold">Common Aliases</ns0:text>
  <ns0:text x="312.8889" y="384" font-size="18.4889" font-family="monospace">st = status</ns0:text>
  <ns0:text x="597.3333" y="384" font-size="18.4889" font-family="monospace">co = checkout</ns0:text>
  <ns0:text x="312.8889" y="424" font-size="18.4889" font-family="monospace">br = branch</ns0:text>
  <ns0:text x="597.3333" y="424" font-size="18.4889" font-family="monospace">cm = commit</ns0:text>
  <ns0:text x="312.8889" y="464" font-size="18.4889" font-family="monospace">unstage = restore --staged</ns0:text>
  <ns0:text x="312.8889" y="504" font-size="18.4889" font-family="monospace">last = log -1 HEAD</ns0:text>
  <ns0:text x="312.8889" y="544" font-size="18.4889" font-family="monospace">visual = !gitk</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrow2" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <ns0:polygon points="0,18 4.8,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
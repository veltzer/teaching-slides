<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="568.8889" y="64" text-anchor="middle" font-size="34.1333" font-weight="bold">Git Aliases Save Time</ns0:text>
  <ns0:rect x="71.1111" y="128" width="426.6667" height="96" fill="#FFEBEE" stroke="#C62828" stroke-width="2.8444" rx="7.1111" />
  <ns0:text x="284.4444" y="168" text-anchor="middle" font-size="19.9111" font-weight="bold">Without Alias</ns0:text>
  <ns0:text x="284.4444" y="200" text-anchor="middle" font-size="17.0667" font-family="monospace">git log --oneline --graph --all</ns0:text>
  <ns0:rect x="640" y="128" width="426.6667" height="96" fill="#E8F5E9" stroke="#388E3C" stroke-width="2.8444" rx="7.1111" />
  <ns0:text x="853.3333" y="168" text-anchor="middle" font-size="19.9111" font-weight="bold">With Alias</ns0:text>
  <ns0:text x="853.3333" y="200" text-anchor="middle" font-size="17.0667" font-family="monospace">git lol</ns0:text>
  <ns0:path d="M 497.7778 176 L 640 176" stroke="#333" stroke-width="2.8444" marker-end="url(#arrow2)" />
  <ns0:text x="568.8889" y="160" text-anchor="middle" font-size="17.0667">Define once</ns0:text>
  <ns0:rect x="284.4444" y="288" width="568.8889" height="288" fill="#F5F5F5" stroke="#333" stroke-width="2.8444" rx="7.1111" />
  <ns0:text x="568.8889" y="336" text-anchor="middle" font-size="22.7556" font-weight="bold">Common Aliases</ns0:text>
  <ns0:text x="312.8889" y="384" font-size="18.4889" font-family="monospace">st = status</ns0:text>
  <ns0:text x="597.3333" y="384" font-size="18.4889" font-family="monospace">co = checkout</ns0:text>
  <ns0:text x="312.8889" y="424" font-size="18.4889" font-family="monospace">br = branch</ns0:text>
  <ns0:text x="597.3333" y="424" font-size="18.4889" font-family="monospace">cm = commit</ns0:text>
  <ns0:text x="312.8889" y="464" font-size="18.4889" font-family="monospace">unstage = restore --staged</ns0:text>
  <ns0:text x="312.8889" y="504" font-size="18.4889" font-family="monospace">last = log -1 HEAD</ns0:text>
  <ns0:text x="312.8889" y="544" font-size="18.4889" font-family="monospace">visual = !gitk</ns0:text>
  <ns0:defs>
    <ns0:marker id="arrow2" markerWidth="14.2222" markerHeight="16" refX="11.3778" refY="4.8" orient="auto">
      <ns0:polygon points="0,16 4.2667,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
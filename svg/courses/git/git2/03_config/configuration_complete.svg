<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="93.214285714286" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="86.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.460212719154" font-weight="bold" fill="var(--ok-text)">Git is Your Tool</text>
  <text x="640" y="117.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" fill="var(--ok-text)">Tuned end-to-end for your workflow</text>

  <rect x="40" y="164.285714285714" width="290" height="284.821428571429" rx="6.106202935189" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--primary-text)">Efficiency</text>
  <text x="185" y="252.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">Aliases</text>
  <text x="185" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">Sensible defaults</text>
  <text x="185" y="314.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">core.editor, pager</text>
  <text x="185" y="355.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">Auto-correct</text>
  <text x="185" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">rerere merges</text>

  <rect x="340" y="164.285714285714" width="290" height="284.821428571429" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--warn-text)">Workflow</text>
  <text x="485" y="252.321428571429" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--warn-text)">pull.rebase=true</text>
  <text x="485" y="283.392857142857" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--warn-text)">push.autoSetupRemote</text>
  <text x="485" y="314.464285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--warn-text)">init.defaultBranch</text>
  <text x="485" y="355.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-text)">Scoped per repo</text>
  <text x="485" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-text)">includeIf by dir</text>

  <rect x="640" y="164.285714285714" width="290" height="284.821428571429" rx="6.106202935189" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--info-text)">Team Fit</text>
  <text x="785" y="252.321428571429" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--info-text)">core.hooksPath</text>
  <text x="785" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">.gitattributes EOL</text>
  <text x="785" y="314.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">Org user.email</text>
  <text x="785" y="355.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">Agreed merge tool</text>

  <rect x="940" y="164.285714285714" width="300" height="284.821428571429" rx="6.106202935189" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--danger-text)">Security</text>
  <text x="1090" y="252.321428571429" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--danger-text)">commit.gpgSign</text>
  <text x="1090" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--danger-text)">SSH/GPG key</text>
  <text x="1090" y="314.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--danger-text)">Credential helper</text>
  <text x="1090" y="355.892857142857" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--danger-text)">protocol.version=2</text>
  <text x="1090" y="386.964285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--danger-text)">maintenance.auto</text>

  <rect x="40" y="475" width="1200" height="145" rx="6.106202935189" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="511.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283207827171" font-weight="bold" fill="var(--text)">Three scopes: system, global, local</text>
  <text x="640" y="547.5" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text-muted)">git config --global &#8594; defaults everywhere</text>
  <text x="640" y="578.571428571429" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text-muted)">git config --local &#8594; per-repo override</text>
</svg>

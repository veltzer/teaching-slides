<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--ok-text)">Git is Now Your Tool</text>
  <text x="640" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">tuned end to end for the way you work</text>

  <rect x="40" y="180" width="290" height="280" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Efficiency</text>
  <text x="185" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">aliases save keystrokes</text>
  <text x="185" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">sensible defaults set once</text>
  <text x="185" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">core.editor, pager, diff</text>
  <text x="185" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">auto-correct near misses</text>
  <text x="185" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">rerere remembers merges</text>
  <text x="185" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">minutes saved every day</text>

  <rect x="340" y="180" width="290" height="280" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="485" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Your Workflow</text>
  <text x="485" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">pull.rebase true</text>
  <text x="485" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">push.autoSetupRemote</text>
  <text x="485" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">init.defaultBranch main</text>
  <text x="485" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">scoped per-repo overrides</text>
  <text x="485" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">includeIf by directory</text>
  <text x="485" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">personal vs work identities</text>

  <rect x="640" y="180" width="290" height="280" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="785" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Team Fit</text>
  <text x="785" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">shared hooks via</text>
  <text x="785" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">core.hooksPath</text>
  <text x="785" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">.gitattributes for EOL</text>
  <text x="785" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">user.email from org</text>
  <text x="785" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">merge tool agreed</text>
  <text x="785" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">reproducible on any box</text>

  <rect x="940" y="180" width="300" height="280" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1090" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Security</text>
  <text x="1090" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">commit.gpgSign true</text>
  <text x="1090" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">SSH or GPG signing key</text>
  <text x="1090" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">credential helper cached</text>
  <text x="1090" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">protocol.version 2</text>
  <text x="1090" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">maintenance.auto true</text>
  <text x="1090" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">faster clones and fetches</text>

  <rect x="40" y="480" width="1200" height="130" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Three scopes: system-wide, per-user, per-repo</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">git config --global for defaults you want everywhere</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">git config --local to override inside one repository only</text>
</svg>

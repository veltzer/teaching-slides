<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="615.015" y="69.1892" text-anchor="middle" font-size="36.9009" font-weight="bold">Your Git Setup Checklist</ns0:text>
  <ns0:rect x="153.7538" y="121.0811" width="922.5225" height="518.9189" fill="#F5F5F5" stroke="#333" stroke-width="3.0751" rx="7.6877" />
  <ns0:text x="184.5045" y="172.973" font-size="21.5255">☐ Set user.name and user.email</ns0:text>
  <ns0:text x="184.5045" y="216.2162" font-size="21.5255">☐ Configure preferred editor</ns0:text>
  <ns0:text x="184.5045" y="259.4595" font-size="21.5255">☐ Set up SSH keys</ns0:text>
  <ns0:text x="184.5045" y="302.7027" font-size="21.5255">☐ Create essential aliases</ns0:text>
  <ns0:text x="184.5045" y="345.9459" font-size="21.5255">☐ Configure credential helper</ns0:text>
  <ns0:text x="184.5045" y="389.1892" font-size="21.5255">☐ Set up global .gitignore</ns0:text>
  <ns0:text x="184.5045" y="432.4324" font-size="21.5255">☐ Configure line endings</ns0:text>
  <ns0:text x="184.5045" y="475.6757" font-size="21.5255">☐ Enable colors</ns0:text>
  <ns0:text x="184.5045" y="518.9189" font-size="21.5255">☐ Set default branch name</ns0:text>
  <ns0:text x="184.5045" y="562.1622" font-size="21.5255">☐ Configure pull strategy</ns0:text>
  <ns0:text x="184.5045" y="605.4054" font-size="21.5255">☐ Optional: Set up GPG signing</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Your Git Setup Checklist</text>
  <rect x="160" y="126" width="960" height="540" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="192" y="180" font-size="22.4">☐ Set user.name and user.email</text>
  <text x="192" y="225" font-size="22.4">☐ Configure preferred editor</text>
  <text x="192" y="270" font-size="22.4">☐ Set up SSH keys</text>
  <text x="192" y="315" font-size="22.4">☐ Create essential aliases</text>
  <text x="192" y="360" font-size="22.4">☐ Configure credential helper</text>
  <text x="192" y="405" font-size="22.4">☐ Set up global .gitignore</text>
  <text x="192" y="450" font-size="22.4">☐ Configure line endings</text>
  <text x="192" y="495" font-size="22.4">☐ Enable colors</text>
  <text x="192" y="540" font-size="22.4">☐ Set default branch name</text>
  <text x="192" y="585" font-size="22.4">☐ Configure pull strategy</text>
  <text x="192" y="630" font-size="22.4">☐ Optional: Set up GPG signing</text>
</svg>
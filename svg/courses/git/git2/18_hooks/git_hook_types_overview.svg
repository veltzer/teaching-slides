<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="622.2222" y="40" text-anchor="middle" font-size="28.4444" font-weight="bold">Git Hook Types</text>
  <rect x="88.8889" y="100" width="444.4445" height="500" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="311.1111" y="150" text-anchor="middle" fill="var(--bg)" font-size="24.8889" font-weight="bold">Client-Side Hooks</text>
  <text x="311.1111" y="190" text-anchor="middle" fill="var(--bg)" font-size="17.7778">(Developer's machine)</text>
  <rect x="124.4444" y="220" width="160" height="60" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="204.4444" y="260" text-anchor="middle" fill="var(--bg)" font-size="17.7778">pre-commit</text>
  <rect x="302.2222" y="220" width="195.5556" height="60" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="400" y="260" text-anchor="middle" fill="var(--bg)" font-size="17.7778">prepare-commit-msg</text>
  <rect x="124.4444" y="300" width="160" height="60" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="204.4444" y="340" text-anchor="middle" fill="var(--bg)" font-size="17.7778">commit-msg</text>
  <rect x="302.2222" y="300" width="195.5556" height="60" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="400" y="340" text-anchor="middle" fill="var(--bg)" font-size="17.7778">post-commit</text>
  <rect x="124.4444" y="380" width="160" height="60" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="204.4444" y="420" text-anchor="middle" fill="var(--bg)" font-size="17.7778">pre-rebase</text>
  <rect x="302.2222" y="380" width="195.5556" height="60" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="400" y="420" text-anchor="middle" fill="var(--bg)" font-size="17.7778">post-checkout</text>
  <rect x="124.4444" y="460.0001" width="160" height="60" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="204.4444" y="500" text-anchor="middle" fill="var(--bg)" font-size="17.7778">post-merge</text>
  <rect x="302.2222" y="460.0001" width="195.5556" height="60" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="400" y="500" text-anchor="middle" fill="var(--bg)" font-size="17.7778">pre-push</text>
  <rect x="711.1112" y="100" width="444.4445" height="500" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" />
  <text x="933.3334" y="150" text-anchor="middle" fill="var(--bg)" font-size="24.8889" font-weight="bold">Server-Side Hooks</text>
  <text x="933.3334" y="190" text-anchor="middle" fill="var(--bg)" font-size="17.7778">(Git server)</text>
  <rect x="746.6667" y="260" width="160" height="60" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="826.6667" y="300" text-anchor="middle" fill="var(--bg)" font-size="17.7778">pre-receive</text>
  <rect x="924.4444" y="260" width="195.5556" height="60" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1022.2223" y="300" text-anchor="middle" fill="var(--bg)" font-size="17.7778">update</text>
  <rect x="835.5556" y="380" width="195.5556" height="60" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="933.3334" y="420" text-anchor="middle" fill="var(--bg)" font-size="17.7778">post-receive</text>
  <text x="311.1111" y="640" text-anchor="middle" font-size="17.7778">Run locally on developer machine</text>
  <text x="933.3334" y="640" text-anchor="middle" font-size="17.7778">Run on Git server during push</text>
</svg>
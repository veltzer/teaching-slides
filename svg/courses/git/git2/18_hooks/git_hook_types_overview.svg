  <ns0:rect x="124.4444" y="300" width="160" height="60" fill="#2ecc71" rx="5.3333" />
  <ns0:text x="204.4444" y="340" text-anchor="middle" fill="white" font-size="17.7778">commit-msg</ns0:text>
  <ns0:rect x="302.2222" y="300" width="195.5556" height="60" fill="#2ecc71" rx="5.3333" />
  <ns0:text x="400" y="340" text-anchor="middle" fill="white" font-size="17.7778">post-commit</ns0:text>
  <ns0:rect x="124.4444" y="380" width="160" height="60" fill="#f39c12" rx="5.3333" />
  <ns0:text x="204.4444" y="420" text-anchor="middle" fill="white" font-size="17.7778">pre-rebase</ns0:text>
  <ns0:rect x="302.2222" y="380" width="195.5556" height="60" fill="#f39c12" rx="5.3333" />
  <ns0:text x="400" y="420" text-anchor="middle" fill="white" font-size="17.7778">post-checkout</ns0:text>
  <ns0:rect x="124.4444" y="460.0001" width="160" height="60" fill="#f39c12" rx="5.3333" />
  <ns0:text x="204.4444" y="500" text-anchor="middle" fill="white" font-size="17.7778">post-merge</ns0:text>
  <ns0:rect x="302.2222" y="460.0001" width="195.5556" height="60" fill="#f39c12" rx="5.3333" />
  <ns0:text x="400" y="500" text-anchor="middle" fill="white" font-size="17.7778">pre-push</ns0:text>
  <ns0:rect x="711.1112" y="100" width="444.4445" height="500" fill="#e74c3c" rx="8.8889" stroke="#333" stroke-width="3.5555" />
  <ns0:text x="933.3334" y="150" text-anchor="middle" fill="white" font-size="24.8889" font-weight="bold">Server-Side Hooks</ns0:text>
  <ns0:text x="933.3334" y="190" text-anchor="middle" fill="white" font-size="17.7778">(Git server)</ns0:text>
  <ns0:rect x="746.6667" y="260" width="160" height="60" fill="#9b59b6" rx="5.3333" />
  <ns0:text x="826.6667" y="300" text-anchor="middle" fill="white" font-size="17.7778">pre-receive</ns0:text>
  <ns0:rect x="924.4444" y="260" width="195.5556" height="60" fill="#9b59b6" rx="5.3333" />
  <ns0:text x="1022.2223" y="300" text-anchor="middle" fill="white" font-size="17.7778">update</ns0:text>
  <ns0:rect x="835.5556" y="380" width="195.5556" height="60" fill="#9b59b6" rx="5.3333" />
  <ns0:text x="933.3334" y="420" text-anchor="middle" fill="white" font-size="17.7778">post-receive</ns0:text>
  <ns0:text x="311.1111" y="640" text-anchor="middle" font-size="17.7778">Run locally on developer machine</ns0:text>
  <ns0:text x="933.3334" y="640" text-anchor="middle" font-size="17.7778">Run on Git server during push</ns0:text>

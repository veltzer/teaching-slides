<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <text x="350" y="20" text-anchor="middle" font-size="16" font-weight="bold">Git Hook Types</text>

  <!-- Client-side hooks -->
  <rect x="50" y="50" width="250" height="250" fill="#3498db" rx="5" stroke="#333" stroke-width="2"/>
  <text x="175" y="75" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Client-Side Hooks</text>
  <text x="175" y="95" text-anchor="middle" fill="white" font-size="10">(Developer's machine)</text>

  <rect x="70" y="110" width="90" height="30" fill="#2ecc71" rx="3"/>
  <text x="115" y="130" text-anchor="middle" fill="white" font-size="10">pre-commit</text>

  <rect x="170" y="110" width="110" height="30" fill="#2ecc71" rx="3"/>
  <text x="225" y="130" text-anchor="middle" fill="white" font-size="9">prepare-commit-msg</text>

  <rect x="70" y="150" width="90" height="30" fill="#2ecc71" rx="3"/>
  <text x="115" y="170" text-anchor="middle" fill="white" font-size="10">commit-msg</text>

  <rect x="170" y="150" width="110" height="30" fill="#2ecc71" rx="3"/>
  <text x="225" y="170" text-anchor="middle" fill="white" font-size="10">post-commit</text>

  <rect x="70" y="190" width="90" height="30" fill="#f39c12" rx="3"/>
  <text x="115" y="210" text-anchor="middle" fill="white" font-size="10">pre-rebase</text>

  <rect x="170" y="190" width="110" height="30" fill="#f39c12" rx="3"/>
  <text x="225" y="210" text-anchor="middle" fill="white" font-size="10">post-checkout</text>

  <rect x="70" y="230" width="90" height="30" fill="#f39c12" rx="3"/>
  <text x="115" y="250" text-anchor="middle" fill="white" font-size="10">post-merge</text>

  <rect x="170" y="230" width="110" height="30" fill="#f39c12" rx="3"/>
  <text x="225" y="250" text-anchor="middle" fill="white" font-size="10">pre-push</text>

  <!-- Server-side hooks -->
  <rect x="400" y="50" width="250" height="250" fill="#e74c3c" rx="5" stroke="#333" stroke-width="2"/>
  <text x="525" y="75" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Server-Side Hooks</text>
  <text x="525" y="95" text-anchor="middle" fill="white" font-size="10">(Git server)</text>

  <rect x="420" y="130" width="90" height="30" fill="#9b59b6" rx="3"/>
  <text x="465" y="150" text-anchor="middle" fill="white" font-size="10">pre-receive</text>

  <rect x="520" y="130" width="110" height="30" fill="#9b59b6" rx="3"/>
  <text x="575" y="150" text-anchor="middle" fill="white" font-size="10">update</text>

  <rect x="470" y="190" width="110" height="30" fill="#9b59b6" rx="3"/>
  <text x="525" y="210" text-anchor="middle" fill="white" font-size="10">post-receive</text>

  <text x="175" y="320" text-anchor="middle" font-size="10">Run locally on developer machine</text>
  <text x="525" y="320" text-anchor="middle" font-size="10">Run on Git server during push</text>
</svg>

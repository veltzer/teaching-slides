<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="29.6627" font-weight="bold">Git Hook Types</text>
  <rect x="40" y="98" width="500" height="483.3333" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="289.9999" y="146.3333" text-anchor="middle" fill="var(--bg)" font-size="25.955" font-weight="bold">Client-Side Hooks</text>
  <text x="289.9999" y="185" text-anchor="middle" fill="var(--bg)" font-size="18.5393">(Developer's machine)</text>
  <rect x="79.9999" y="214" width="180" height="58" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.9999" y="252.6667" text-anchor="middle" fill="var(--bg)" font-size="18.5393">pre-commit</text>
  <rect x="279.9999" y="214" width="220" height="58" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="389.9999" y="252.6667" text-anchor="middle" fill="var(--bg)" font-size="18.5393">prepare-commit-msg</text>
  <rect x="79.9999" y="291.3333" width="180" height="58" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.9999" y="330" text-anchor="middle" fill="var(--bg)" font-size="18.5393">commit-msg</text>
  <rect x="279.9999" y="291.3333" width="220" height="58" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="389.9999" y="330" text-anchor="middle" fill="var(--bg)" font-size="18.5393">post-commit</text>
  <rect x="79.9999" y="368.6667" width="180" height="58" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.9999" y="407.3333" text-anchor="middle" fill="var(--bg)" font-size="18.5393">pre-rebase</text>
  <rect x="279.9999" y="368.6667" width="220" height="58" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="389.9999" y="407.3333" text-anchor="middle" fill="var(--bg)" font-size="18.5393">post-checkout</text>
  <rect x="79.9999" y="446.0001" width="180" height="58" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.9999" y="484.6667" text-anchor="middle" fill="var(--bg)" font-size="18.5393">post-merge</text>
  <rect x="279.9999" y="446.0001" width="220" height="58" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="389.9999" y="484.6667" text-anchor="middle" fill="var(--bg)" font-size="18.5393">pre-push</text>
  <rect x="740" y="98" width="500" height="483.3333" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="989.9999" y="146.3333" text-anchor="middle" fill="var(--bg)" font-size="25.955" font-weight="bold">Server-Side Hooks</text>
  <text x="989.9999" y="185" text-anchor="middle" fill="var(--bg)" font-size="18.5393">(Git server)</text>
  <rect x="779.9999" y="252.6667" width="180" height="58" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="869.9999" y="291.3333" text-anchor="middle" fill="var(--bg)" font-size="18.5393">pre-receive</text>
  <rect x="979.9998" y="252.6667" width="220" height="58" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.9999" y="291.3333" text-anchor="middle" fill="var(--bg)" font-size="18.5393">update</text>
  <rect x="879.9999" y="368.6667" width="220" height="58" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="989.9999" y="407.3333" text-anchor="middle" fill="var(--bg)" font-size="18.5393">post-receive</text>
  <text x="289.9999" y="620" text-anchor="middle" font-size="18.5393">Run locally on developer machine</text>
  <text x="989.9999" y="620" text-anchor="middle" font-size="18.5393">Run on Git server during push</text>
</svg>
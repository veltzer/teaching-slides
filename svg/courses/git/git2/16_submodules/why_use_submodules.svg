<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="48" text-anchor="middle" font-size="34.1333" font-weight="bold">Submodule Relationship</text>
  <rect x="106.6667" y="120" width="533.3333" height="480" fill="#3498db" rx="10.6667" stroke="#333" stroke-width="4.2667" />

  <rect x="149.3333" y="216" width="170.6667" height="96" fill="#2ecc71" rx="6.4" />
  <text x="234.6667" y="276" text-anchor="middle" fill="white" font-size="21.3333">src/</text>
  <rect x="341.3333" y="216" width="170.6667" height="96" fill="#2ecc71" rx="6.4" />
  <text x="426.6667" y="276" text-anchor="middle" fill="white" font-size="21.3333">docs/</text>
  <rect x="149.3333" y="360" width="320" height="192" fill="#e74c3c" rx="6.4" />
  <text x="309.3333" y="420" text-anchor="middle" fill="white" font-size="25.6" font-weight="bold">Submodule</text>
  <text x="309.3333" y="468" text-anchor="middle" fill="white" font-size="21.3333">lib/shared-utils</text>
  <text x="309.3333" y="504" text-anchor="middle" fill="white" font-size="21.3333">→ commit: a1b2c3d</text>
  <rect x="746.6667" y="240" width="426.6667" height="288" fill="#f39c12" rx="10.6667" stroke="#333" stroke-width="4.2667" />
  <text x="960" y="300" text-anchor="middle" fill="white" font-size="29.8667" font-weight="bold">External Repository</text>
  <text x="960" y="348" text-anchor="middle" fill="white" font-size="25.6">shared-utils.git</text>
  <circle cx="810.6667" cy="408" r="17.0667" fill="#9e9e9e" />
  <circle cx="896" cy="408" r="17.0667" fill="#9e9e9e" />
  <circle cx="981.3333" cy="408" r="17.0667" fill="#9e9e9e" />
  <circle cx="1066.6667" cy="408" r="17.0667" fill="#27ae60" />
  <text x="960" y="468" text-anchor="middle" fill="white" font-size="21.3333">Submodule points to specific commit</text>
  <line x1="469.3333" y1="456" x2="725.3333" y2="384" stroke="#333" stroke-width="4.2667" stroke-dasharray="10.6667 10.6667" marker-end="url(#arrow)" />
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead" markerWidth="21.3333" markerHeight="16.8" refX="19.2" refY="8.4" orient="auto">
      <polygon points="0,24 7.4667,0" fill="#333" />

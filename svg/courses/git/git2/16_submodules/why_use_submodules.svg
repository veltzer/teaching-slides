<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="37.1107" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Submodule Relationship</text>
  <rect x="40" y="115.6522" width="599.9999" height="504.3478" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="339.9999" y="178.6957" text-anchor="middle" fill="var(--bg)" font-size="32.4719" font-weight="bold" font-family="Arial, sans-serif">Main Repository</text>
  <rect x="87.9999" y="216.5217" width="192" height="100.8696" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184" y="279.5652" text-anchor="middle" fill="var(--bg)" font-size="23.1942" font-family="Arial, sans-serif">src/</text>
  <rect x="303.9999" y="216.5217" width="192" height="100.8696" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="279.5652" text-anchor="middle" fill="var(--bg)" font-size="23.1942" font-family="Arial, sans-serif">docs/</text>
  <rect x="87.9999" y="367.8261" width="360" height="201.7391" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="267.9999" y="430.8696" text-anchor="middle" fill="var(--bg)" font-size="27.833" font-weight="bold" font-family="Arial, sans-serif">Submodule</text>
  <text x="267.9999" y="481.3043" text-anchor="middle" fill="var(--bg)" font-size="23.1942" font-family="Arial, sans-serif">lib/shared-utils</text>
  <text x="267.9999" y="519.1304" text-anchor="middle" fill="var(--bg)" font-size="23.1942" font-family="Arial, sans-serif">→ commit: a1b2c3d</text>
  <rect x="760" y="241.7391" width="480" height="302.6087" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.9999" y="304.7826" text-anchor="middle" fill="var(--bg)" font-size="32.4719" font-weight="bold" font-family="Arial, sans-serif">External Repository</text>
  <text x="999.9999" y="355.2174" text-anchor="middle" fill="var(--bg)" font-size="27.833" font-family="Arial, sans-serif">shared-utils.git</text>
  <rect x="813.445" y="399.705" width="37.1108" height="37.1108" rx="14" fill="var(--text-faint)"/>
  <rect x="909.445" y="399.705" width="37.1108" height="37.1108" rx="14" fill="var(--text-faint)"/>
  <rect x="1005.44" y="399.705" width="37.1108" height="37.1108" rx="14" fill="var(--text-faint)"/>
  <rect x="1101.44" y="399.705" width="37.1108" height="37.1108" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="999.9999" y="481.3043" text-anchor="middle" fill="var(--bg)" font-size="23.1942" font-family="Arial, sans-serif">Submodule points to specific commit</text>
  <line x1="447.9999" y1="468.6957" x2="735.9999" y2="393.0435" stroke="var(--text)" stroke-width="2" stroke-dasharray="10.6667 10.6667" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

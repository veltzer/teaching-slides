<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="37.1107" font-weight="bold">Submodule Relationship</text>
  <rect x="40" y="115.6522" width="599.9999" height="504.3478" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="339.9999" y="178.6957" text-anchor="middle" fill="var(--bg)" font-size="32.4719" font-weight="bold">Main Repository</text>
  <rect x="87.9999" y="216.5217" width="192" height="100.8696" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184" y="279.5652" text-anchor="middle" fill="var(--bg)" font-size="23.1942">src/</text>
  <rect x="303.9999" y="216.5217" width="192" height="100.8696" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="279.5652" text-anchor="middle" fill="var(--bg)" font-size="23.1942">docs/</text>
  <rect x="87.9999" y="367.8261" width="360" height="201.7391" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="267.9999" y="430.8696" text-anchor="middle" fill="var(--bg)" font-size="27.833" font-weight="bold">Submodule</text>
  <text x="267.9999" y="481.3043" text-anchor="middle" fill="var(--bg)" font-size="23.1942">lib/shared-utils</text>
  <text x="267.9999" y="519.1304" text-anchor="middle" fill="var(--bg)" font-size="23.1942">→ commit: a1b2c3d</text>
  <rect x="760" y="241.7391" width="480" height="302.6087" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.9999" y="304.7826" text-anchor="middle" fill="var(--bg)" font-size="32.4719" font-weight="bold">External Repository</text>
  <text x="999.9999" y="355.2174" text-anchor="middle" fill="var(--bg)" font-size="27.833">shared-utils.git</text>
  <rect x="813.445" y="399.705" width="37.1108" height="37.1108" rx="14" fill="var(--text-faint)"/>
  <rect x="909.445" y="399.705" width="37.1108" height="37.1108" rx="14" fill="var(--text-faint)"/>
  <rect x="1005.44" y="399.705" width="37.1108" height="37.1108" rx="14" fill="var(--text-faint)"/>
  <rect x="1101.44" y="399.705" width="37.1108" height="37.1108" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="999.9999" y="481.3043" text-anchor="middle" fill="var(--bg)" font-size="23.1942">Submodule points to specific commit</text>
  <line x1="447.9999" y1="468.6957" x2="735.9999" y2="393.0435" stroke="var(--text)" stroke-width="2" stroke-dasharray="10.6667 10.6667" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 7.4667,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="48" text-anchor="middle" font-size="29.2571" font-weight="bold">Git Content Search Methods</text>
  <rect x="91.4286" y="120" width="274.2857" height="192" fill="#3498db" rx="9.1429" />
  <text x="228.5714" y="192" text-anchor="middle" fill="white" font-size="21.9429" font-weight="bold">Current Files</text>
  <text x="228.5714" y="240" text-anchor="middle" fill="white" font-size="18.2857">git grep "pattern"</text>
  <rect x="457.1429" y="120" width="274.2857" height="192" fill="#e74c3c" rx="9.1429" />
  <text x="594.2857" y="192" text-anchor="middle" fill="white" font-size="21.9429" font-weight="bold">History</text>
  <text x="594.2857" y="240" text-anchor="middle" fill="white" font-size="18.2857">git log -S"text"</text>
  <rect x="822.8571" y="120" width="274.2857" height="192" fill="#2ecc71" rx="9.1429" />
  <text x="960" y="192" text-anchor="middle" fill="white" font-size="21.9429" font-weight="bold">Combined</text>
  <text x="960" y="240" text-anchor="middle" fill="white" font-size="18.2857">grep + rev-list</text>
  <text x="228.5714" y="408" text-anchor="middle" font-size="18.2857">• Fast current search</text>
  <text x="228.5714" y="444" text-anchor="middle" font-size="18.2857">• File type filtering</text>
  <text x="228.5714" y="480" text-anchor="middle" font-size="18.2857">• Context lines</text>
  <text x="594.2857" y="408" text-anchor="middle" font-size="18.2857">• When introduced</text>
  <text x="594.2857" y="444" text-anchor="middle" font-size="18.2857">• Evolution tracking</text>
  <text x="594.2857" y="480" text-anchor="middle" font-size="18.2857">• Commit messages</text>
  <text x="960" y="408" text-anchor="middle" font-size="18.2857">• Cross-history search</text>
  <text x="960" y="444" text-anchor="middle" font-size="18.2857">• Branch comparisons</text>
  <text x="960" y="480" text-anchor="middle" font-size="18.2857">• Time-based search</text>
</svg>
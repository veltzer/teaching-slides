<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="48" text-anchor="middle" font-size="29.2571" font-weight="bold">Git Content Search Methods</text>
  <rect x="91.4286" y="120" width="274.2857" height="192" fill="#3498db" rx="9.1429" />
  <text x="228.5714" y="192" text-anchor="middle" fill="white" font-size="21.9429" font-weight="bold">Current Files</text>
  <text x="228.5714" y="240" text-anchor="middle" fill="white" font-size="18.2857">git grep "pattern"</text>
  <rect x="457.1429" y="120" width="274.2857" height="192" fill="#e74c3c" rx="9.1429" />
  <text x="594.2857" y="192" text-anchor="middle" fill="white" font-size="21.9429" font-weight="bold">History</text>
  <text x="594.2857" y="240" text-anchor="middle" fill="white" font-size="18.2857">git log -S"text"</text>
  <rect x="822.8571" y="120" width="274.2857" height="192" fill="#2ecc71" rx="9.1429" />
  <text x="960" y="192" text-anchor="middle" fill="white" font-size="21.9429" font-weight="bold">Combined</text>
  <text x="960" y="240" text-anchor="middle" fill="white" font-size="18.2857">grep + rev-list</text>
  <text x="228.5714" y="408" text-anchor="middle" font-size="18.2857">• Fast current search</text>
  <text x="228.5714" y="444" text-anchor="middle" font-size="18.2857">• File type filtering</text>
  <text x="228.5714" y="480" text-anchor="middle" font-size="18.2857">• Context lines</text>
  <text x="594.2857" y="408" text-anchor="middle" font-size="18.2857">• When introduced</text>
  <text x="594.2857" y="444" text-anchor="middle" font-size="18.2857">• Evolution tracking</text>
  <text x="594.2857" y="480" text-anchor="middle" font-size="18.2857">• Commit messages</text>
  <text x="960" y="408" text-anchor="middle" font-size="18.2857">• Cross-history search</text>
  <text x="960" y="444" text-anchor="middle" font-size="18.2857">• Branch comparisons</text>
  <text x="960" y="480" text-anchor="middle" font-size="18.2857">• Time-based search</text>
</svg>
<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <text x="350" y="20" text-anchor="middle" font-size="16" font-weight="bold">Git Content Search Methods</text>

  <!-- Current files -->
  <rect x="50" y="50" width="150" height="80" fill="#3498db" rx="5"/>
  <text x="125" y="80" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Current Files</text>
  <text x="125" y="100" text-anchor="middle" fill="white" font-size="10">git grep "pattern"</text>

  <!-- History search -->
  <rect x="250" y="50" width="150" height="80" fill="#e74c3c" rx="5"/>
  <text x="325" y="80" text-anchor="middle" fill="white" font-size="12" font-weight="bold">History</text>
  <text x="325" y="100" text-anchor="middle" fill="white" font-size="10">git log -S"text"</text>

  <!-- Combined search -->
  <rect x="450" y="50" width="150" height="80" fill="#2ecc71" rx="5"/>
  <text x="525" y="80" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Combined</text>
  <text x="525" y="100" text-anchor="middle" fill="white" font-size="10">grep + rev-list</text>

  <!-- Examples -->
  <text x="125" y="170" text-anchor="middle" font-size="10">• Fast current search</text>
  <text x="125" y="185" text-anchor="middle" font-size="10">• File type filtering</text>
  <text x="125" y="200" text-anchor="middle" font-size="10">• Context lines</text>

  <text x="325" y="170" text-anchor="middle" font-size="10">• When introduced</text>
  <text x="325" y="185" text-anchor="middle" font-size="10">• Evolution tracking</text>
  <text x="325" y="200" text-anchor="middle" font-size="10">• Commit messages</text>

  <text x="525" y="170" text-anchor="middle" font-size="10">• Cross-history search</text>
  <text x="525" y="185" text-anchor="middle" font-size="10">• Branch comparisons</text>
  <text x="525" y="200" text-anchor="middle" font-size="10">• Time-based search</text>
</svg>

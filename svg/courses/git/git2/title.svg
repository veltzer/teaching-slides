<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <line x1="130" y1="330" x2="1149.9999" y2="330" stroke="var(--danger-border)" stroke-width="2" />
  <circle cx="190" cy="330" r="13.9044" fill="var(--danger-fill)" />
  <circle cx="415" cy="330" r="13.9044" fill="var(--danger-fill)" />
  <circle cx="640" cy="330" r="13.9044" fill="var(--danger-fill)" />
  <circle cx="865" cy="330" r="13.9044" fill="var(--danger-fill)" />
  <circle cx="1090" cy="330" r="13.9044" fill="var(--danger-fill)" />
  <line x1="190" y1="330" x2="265" y2="185" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="265" y1="185" x2="565" y2="185" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="565" y1="185" x2="640" y2="330" stroke="var(--primary-border)" stroke-width="2" />
  <circle cx="265" cy="185" r="11.1236" fill="var(--primary-fill)" />
  <circle cx="415" cy="185" r="11.1236" fill="var(--primary-fill)" />
  <circle cx="565" cy="185" r="11.1236" fill="var(--primary-fill)" />
  <line x1="415" y1="330" x2="490" y2="475" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="490" y1="475" x2="790" y2="475" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="790" y1="475" x2="865" y2="330" stroke="var(--ok-border)" stroke-width="2" />
  <circle cx="490" cy="475" r="11.1236" fill="var(--ok-fill)" />
  <circle cx="640" cy="475" r="11.1236" fill="var(--ok-fill)" />
  <circle cx="790" cy="475" r="11.1236" fill="var(--ok-fill)" />
  <line x1="415" y1="185" x2="490" y2="119.75" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.1111 4.2667" />
  <line x1="490" y1="119.75" x2="715" y2="119.75" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.1111 4.2667" />
  <circle cx="490" cy="119.75" r="8.3426" fill="var(--warn-fill)" />
  <circle cx="602.5" cy="119.75" r="8.3426" fill="var(--warn-fill)" />
  <circle cx="715" cy="119.75" r="8.3426" fill="var(--warn-fill)" />
  <text x="865" y="156" font-family="monospace" font-size="18.0758" fill="var(--warn-accent)">rebase</text>
  <text x="865" y="518.5" font-family="monospace" font-size="18.0758" fill="var(--ok-accent)">merge</text>
  <text x="939.9999" y="286.5" font-family="monospace" font-size="18.0758" fill="var(--primary-accent)">cherry-pick</text>
  <rect x="879.9999" y="90.75" width="285" height="65.25" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="910" y="134.25" font-family="monospace" font-size="33.3706" fill="var(--danger-accent)" font-weight="bold">git</text>
  <text x="1000" y="134.25" font-family="monospace" font-size="27.8088" fill="var(--primary-accent)" font-weight="bold">++</text>
  <rect x="167.5" y="351.75" width="45" height="26.1" rx="6" fill="var(--warn-fill)" opacity="0.8" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="175" y="372.05" font-family="monospace" font-size="13.9044" fill="var(--code-bg)">v1.0</text>
  <rect x="842.5" y="351.75" width="45" height="26.1" rx="6" fill="var(--warn-fill)" opacity="0.8" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="850" y="372.05" font-family="monospace" font-size="13.9044" fill="var(--code-bg)">v2.0</text>
</svg>
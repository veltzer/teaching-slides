<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Complex branch graph -->
  <!-- Main branch -->
  <line x1="60" y1="200" x2="740" y2="200" stroke="#e94560" stroke-width="4"/>
  <circle cx="100" cy="200" r="10" fill="#e94560"/>
  <circle cx="250" cy="200" r="10" fill="#e94560"/>
  <circle cx="400" cy="200" r="10" fill="#e94560"/>
  <circle cx="550" cy="200" r="10" fill="#e94560"/>
  <circle cx="700" cy="200" r="10" fill="#e94560"/>
  <!-- Feature branch 1 -->
  <line x1="100" y1="200" x2="150" y2="100" stroke="#53d8fb" stroke-width="2.5"/>
  <line x1="150" y1="100" x2="350" y2="100" stroke="#53d8fb" stroke-width="2.5"/>
  <line x1="350" y1="100" x2="400" y2="200" stroke="#53d8fb" stroke-width="2.5"/>
  <circle cx="150" cy="100" r="8" fill="#53d8fb"/>
  <circle cx="250" cy="100" r="8" fill="#53d8fb"/>
  <circle cx="350" cy="100" r="8" fill="#53d8fb"/>
  <!-- Feature branch 2 -->
  <line x1="250" y1="200" x2="300" y2="300" stroke="#00b894" stroke-width="2.5"/>
  <line x1="300" y1="300" x2="500" y2="300" stroke="#00b894" stroke-width="2.5"/>
  <line x1="500" y1="300" x2="550" y2="200" stroke="#00b894" stroke-width="2.5"/>
  <circle cx="300" cy="300" r="8" fill="#00b894"/>
  <circle cx="400" cy="300" r="8" fill="#00b894"/>
  <circle cx="500" cy="300" r="8" fill="#00b894"/>
  <!-- Rebase arrows -->
  <line x1="250" y1="100" x2="300" y2="55" stroke="#ffd93d" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="300" y1="55" x2="450" y2="55" stroke="#ffd93d" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="300" cy="55" r="6" fill="#ffd93d"/>
  <circle cx="375" cy="55" r="6" fill="#ffd93d"/>
  <circle cx="450" cy="55" r="6" fill="#ffd93d"/>
  <!-- Labels -->
  <text x="550" y="80" font-family="monospace" font-size="13" fill="#ffd93d">rebase</text>
  <text x="550" y="330" font-family="monospace" font-size="13" fill="#00b894">merge</text>
  <text x="600" y="170" font-family="monospace" font-size="13" fill="#53d8fb">cherry-pick</text>
  <!-- Advanced Git label -->
  <rect x="560" y="35" width="190" height="45" rx="8" fill="none" stroke="#e94560" stroke-width="2"/>
  <text x="580" y="65" font-family="monospace" font-size="24" fill="#e94560" font-weight="bold">git</text>
  <text x="640" y="65" font-family="monospace" font-size="20" fill="#53d8fb" font-weight="bold">++</text>
  <!-- Tag markers -->
  <rect x="85" y="215" width="30" height="18" rx="3" fill="#ffd93d" opacity="0.8"/>
  <text x="90" y="229" font-family="monospace" font-size="10" fill="#1a1a2e">v1.0</text>
  <rect x="535" y="215" width="30" height="18" rx="3" fill="#ffd93d" opacity="0.8"/>
  <text x="540" y="229" font-family="monospace" font-size="10" fill="#1a1a2e">v2.0</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--code-bg)" rx="6"/>
  <line x1="85.3333" y1="320" x2="1052.4444" y2="320" stroke="var(--danger-border)" stroke-width="2" />
  <circle cx="142.2222" cy="320" r="14.2222" fill="var(--danger-fill)" />
  <circle cx="355.5556" cy="320" r="14.2222" fill="var(--danger-fill)" />
  <circle cx="568.8889" cy="320" r="14.2222" fill="var(--danger-fill)" />
  <circle cx="782.2222" cy="320" r="14.2222" fill="var(--danger-fill)" />
  <circle cx="995.5556" cy="320" r="14.2222" fill="var(--danger-fill)" />
  <line x1="142.2222" y1="320" x2="213.3333" y2="160" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="213.3333" y1="160" x2="497.7778" y2="160" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="497.7778" y1="160" x2="568.8889" y2="320" stroke="var(--primary-border)" stroke-width="2" />
  <circle cx="213.3333" cy="160" r="11.3778" fill="var(--primary-fill)" />
  <circle cx="355.5556" cy="160" r="11.3778" fill="var(--primary-fill)" />
  <circle cx="497.7778" cy="160" r="11.3778" fill="var(--primary-fill)" />
  <line x1="355.5556" y1="320" x2="426.6667" y2="480" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="426.6667" y1="480" x2="711.1111" y2="480" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="711.1111" y1="480" x2="782.2222" y2="320" stroke="var(--ok-border)" stroke-width="2" />
  <circle cx="426.6667" cy="480" r="11.3778" fill="var(--ok-fill)" />
  <circle cx="568.8889" cy="480" r="11.3778" fill="var(--ok-fill)" />
  <circle cx="711.1111" cy="480" r="11.3778" fill="var(--ok-fill)" />
  <line x1="355.5556" y1="160" x2="426.6667" y2="88" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.1111 4.2667" />
  <line x1="426.6667" y1="88" x2="640" y2="88" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.1111 4.2667" />
  <circle cx="426.6667" cy="88" r="8.5333" fill="var(--warn-fill)" />
  <circle cx="533.3333" cy="88" r="8.5333" fill="var(--warn-fill)" />
  <circle cx="640" cy="88" r="8.5333" fill="var(--warn-fill)" />
  <text x="782.2222" y="128" font-family="monospace" font-size="18.4889" fill="var(--warn-accent)">rebase</text>
  <text x="782.2222" y="528" font-family="monospace" font-size="18.4889" fill="var(--ok-accent)">merge</text>
  <text x="853.3333" y="272" font-family="monospace" font-size="18.4889" fill="var(--primary-accent)">cherry-pick</text>
  <rect x="796.4444" y="56" width="270.2222" height="72" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="824.8889" y="104" font-family="monospace" font-size="34.1333" fill="var(--danger-accent)" font-weight="bold">git</text>
  <text x="910.2222" y="104" font-family="monospace" font-size="28.4444" fill="var(--primary-accent)" font-weight="bold">++</text>
  <rect x="120.8889" y="344" width="42.6667" height="28.8" rx="6" fill="var(--warn-fill)" opacity="0.8" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="128" y="366.4" font-family="monospace" font-size="14.2222" fill="var(--code-bg)">v1.0</text>
  <rect x="760.8889" y="344" width="42.6667" height="28.8" rx="6" fill="var(--warn-fill)" opacity="0.8" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="768" y="366.4" font-family="monospace" font-size="14.2222" fill="var(--code-bg)">v2.0</text>
</svg>
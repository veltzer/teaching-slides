<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="36.7058" font-weight="bold">Git Log Graph Visualization</text>
  <line x1="40" y1="330" x2="1240" y2="330" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="280" y1="330" x2="400" y2="523.3333" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="400" y1="523.3333" x2="640" y2="523.3333" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="640" y1="523.3333" x2="760" y2="330" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="149.512" y="319.513" width="20.9748" height="20.9748" rx="10.4874" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <rect x="389.513" y="319.513" width="20.9748" height="20.9748" rx="10.4874" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <rect x="509.513" y="512.846" width="20.9748" height="20.9748" rx="10.4874" fill="var(--danger-fill)" filter="url(#shadow)"/>
  <rect x="749.513" y="319.513" width="20.9748" height="20.9748" rx="10.4874" fill="var(--info-fill)" filter="url(#shadow)"/>
  <rect x="989.513" y="319.513" width="20.9748" height="20.9748" rx="10.4874" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="159.9999" y="426.6667" text-anchor="middle" font-size="26.2185">a1b2c3d</text>
  <text x="400" y="426.6667" text-anchor="middle" font-size="26.2185">d4e5f6g</text>
  <text x="520" y="620" text-anchor="middle" font-size="26.2185">g7h8i9j</text>
  <text x="760" y="426.6667" text-anchor="middle" font-size="26.2185">j1k2l3m</text>
  <text x="1000" y="426.6667" text-anchor="middle" font-size="26.2185">m4n5o6p</text>
  <text x="40" y="305.8333" font-size="26.2185" fill="var(--ok-accent)">main</text>
  <text x="520" y="620" font-size="26.2185" fill="var(--danger-accent)">feature</text>
</svg>
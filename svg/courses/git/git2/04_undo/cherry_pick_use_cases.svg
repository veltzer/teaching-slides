<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="614.1251" y="40" text-anchor="middle" font-size="45.193" font-weight="bold">Cherry-pick Scenarios</text>
  <text x="256.4822" y="129.2308" text-anchor="middle" font-size="26.3627" font-weight="bold">Hotfix from Development</text>
  <circle cx="77.6609" cy="218.4615" r="37.6609" fill="var(--ok-fill)" />
  <text x="77.6609" y="229.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)">v1.0</text>
  <circle cx="220.718" cy="218.4615" r="37.6609" fill="var(--ok-fill)" />
  <text x="220.718" y="229.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)">prod</text>
  <text x="149.1894" y="185" font-size="18.8304">main</text>
  <circle cx="77.6609" cy="352.3077" r="37.6609" fill="var(--primary-fill)" />
  <text x="77.6609" y="363.4616" text-anchor="middle" font-size="18.8304" fill="var(--bg)">feat</text>
  <circle cx="220.718" cy="352.3077" r="37.6609" fill="var(--danger-fill)" />
  <text x="220.718" y="363.4616" text-anchor="middle" font-size="18.8304" fill="var(--bg)">fix</text>
  <circle cx="363.775" cy="352.3077" r="37.6609" fill="var(--primary-fill)" />
  <text x="363.775" y="363.4616" text-anchor="middle" font-size="18.8304" fill="var(--bg)">feat2</text>
  <text x="220.718" y="318.8461" font-size="18.8304">develop</text>
  <path d="M 220.718 307.6923 Q 310.1286 240.7692 220.718 263.0769" stroke="var(--danger-border)" stroke-width="3.2" marker-end="url(#arrow)" fill="none" />
  <text x="310.1286" y="240.7692" font-size="20.7135" fill="var(--danger-accent)">cherry-pick</text>
  <line x1="113.4251" y1="218.4615" x2="184.9537" y2="218.4615" stroke="var(--text)" stroke-width="2" />
  <line x1="113.4251" y1="352.3077" x2="184.9537" y2="352.3077" stroke="var(--text)" stroke-width="2" />
  <line x1="256.4822" y1="352.3077" x2="328.0109" y2="352.3077" stroke="var(--text)" stroke-width="2" />
  <line x1="77.6609" y1="263.0769" x2="77.6609" y2="307.6923" stroke="var(--text)" stroke-width="2" />
  <rect x="703.5358" y="173.8461" width="536.4642" height="446.1539" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="5.9952" />
  <text x="971.7679" y="240.7692" text-anchor="middle" font-size="26.3627" font-weight="bold">Common Scenarios:</text>
  <text x="739.3001" y="307.6923" font-size="22.5965">• Hotfix to production branch</text>
  <text x="739.3001" y="363.4616" font-size="22.5965">• Feature from abandoned branch</text>
  <text x="739.3001" y="419.2308" font-size="22.5965">• Bug fix to multiple releases</text>
  <text x="739.3001" y="475" font-size="22.5965">• Selective feature merging</text>
  <text x="739.3001" y="530.7692" font-size="22.5965">• Backporting to older versions</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#f44336" />
    </marker>
  </defs>
</svg>
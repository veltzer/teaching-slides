<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Cherry-pick Scenarios</text>
  <text x="320" y="144" text-anchor="middle" font-size="22.4" font-weight="bold">Hotfix from Development</text>
  <circle cx="160" cy="216" r="32" fill="#4CAF50" />
  <text x="160" y="225" text-anchor="middle" font-size="16" fill="white">v1.0</text>
  <circle cx="288" cy="216" r="32" fill="#4CAF50" />
  <text x="288" y="225" text-anchor="middle" font-size="16" fill="white">prod</text>
  <text x="224" y="189" font-size="16">main</text>
  <circle cx="160" cy="324" r="32" fill="#2196F3" />
  <text x="160" y="333" text-anchor="middle" font-size="16" fill="white">feat</text>
  <circle cx="288" cy="324" r="32" fill="#f44336" />
  <text x="288" y="333" text-anchor="middle" font-size="16" fill="white">fix</text>
  <circle cx="416" cy="324" r="32" fill="#2196F3" />
  <text x="416" y="333" text-anchor="middle" font-size="16" fill="white">feat2</text>
  <text x="288" y="297" font-size="16">develop</text>
  <path d="M 288 288 Q 368 234 288 252" stroke="#f44336" stroke-width="3.2" marker-end="url(#arrow)" fill="none" />
  <text x="368" y="234" font-size="17.6" fill="#f44336">cherry-pick</text>
  <line x1="192" y1="216" x2="256" y2="216" stroke="#333" stroke-width="3.2" />
  <line x1="192" y1="324" x2="256" y2="324" stroke="#333" stroke-width="3.2" />
  <line x1="320" y1="324" x2="384" y2="324" stroke="#333" stroke-width="3.2" />
  <line x1="160" y1="252" x2="160" y2="288" stroke="#333" stroke-width="3.2" />
  <rect x="720" y="180" width="480" height="360" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="960" y="234" text-anchor="middle" font-size="22.4" font-weight="bold">Common Scenarios:</text>
  <text x="752" y="288" font-size="19.2">• Hotfix to production branch</text>
  <text x="752" y="333" font-size="19.2">• Feature from abandoned branch</text>
  <text x="752" y="378" font-size="19.2">• Bug fix to multiple releases</text>
  <text x="752" y="423" font-size="19.2">• Selective feature merging</text>
  <text x="752" y="468" font-size="19.2">• Backporting to older versions</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrow2" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#f44336" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="614.1251" y="40" text-anchor="middle" font-size="45.193" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Cherry-pick Scenarios</text>
  <text x="256.4822" y="129.2308" text-anchor="middle" font-size="26.3627" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Hotfix from Development</text>
  <rect x="40" y="180.801" width="75.3218" height="75.3218" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="77.6609" y="229.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">v1.0</text>
  <rect x="183.057" y="180.801" width="75.3218" height="75.3218" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="220.718" y="229.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">prod</text>
  <text x="149.1894" y="185" font-size="18.8304" font-family="Arial, sans-serif" fill="var(--text)">main</text>
  <rect x="40" y="314.647" width="75.3218" height="75.3218" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="77.6609" y="363.4616" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">feat</text>
  <rect x="183.057" y="314.647" width="75.3218" height="75.3218" rx="14" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="220.718" y="363.4616" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">fix</text>
  <rect x="326.114" y="314.647" width="75.3218" height="75.3218" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="363.775" y="363.4616" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">feat2</text>
  <text x="220.718" y="318.8461" font-size="18.8304" font-family="Arial, sans-serif" fill="var(--danger-text)">develop</text>
  <path d="M 220.718 307.6923 Q 310.1286 240.7692 220.718 263.0769" stroke="var(--danger-border)" stroke-width="3.2" marker-end="url(#arrow)" fill="none"/>
  <text x="310.1286" y="240.7692" font-size="20.7135" fill="var(--danger-accent)" font-family="Arial, sans-serif">cherry-pick</text>
  <line x1="113.4251" y1="218.4615" x2="184.9537" y2="218.4615" stroke="var(--text)" stroke-width="2"/>
  <line x1="113.4251" y1="352.3077" x2="184.9537" y2="352.3077" stroke="var(--text)" stroke-width="2"/>
  <line x1="256.4822" y1="352.3077" x2="328.0109" y2="352.3077" stroke="var(--text)" stroke-width="2"/>
  <line x1="77.6609" y1="263.0769" x2="77.6609" y2="307.6923" stroke="var(--text)" stroke-width="2"/>
  <rect x="703.5358" y="173.8461" width="536.4642" height="446.1539" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="5.9952"/>
  <text x="971.7679" y="240.7692" text-anchor="middle" font-size="26.3627" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Common Scenarios:</text>
  <text x="739.3001" y="307.6923" font-size="22.5965" font-family="Arial, sans-serif" fill="var(--text)">• Hotfix to production branch</text>
  <text x="739.3001" y="363.4616" font-size="22.5965" font-family="Arial, sans-serif" fill="var(--text)">• Feature from abandoned branch</text>
  <text x="739.3001" y="419.2308" font-size="22.5965" font-family="Arial, sans-serif" fill="var(--text)">• Bug fix to multiple releases</text>
  <text x="739.3001" y="475" font-size="22.5965" font-family="Arial, sans-serif" fill="var(--text)">• Selective feature merging</text>
  <text x="739.3001" y="530.7692" font-size="22.5965" font-family="Arial, sans-serif" fill="var(--text)">• Backporting to older versions</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

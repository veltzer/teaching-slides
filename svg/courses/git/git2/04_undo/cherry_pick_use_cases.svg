<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="614.9254" y="85.5224" text-anchor="middle" font-size="40.1194" font-weight="bold">Cherry-pick Scenarios</text>
  <text x="280.597" y="160.7463" text-anchor="middle" font-size="23.403" font-weight="bold">Hotfix from Development</text>
  <circle cx="113.4328" cy="235.9701" r="33.4328" fill="var(--ok-fill)" />
  <text x="113.4328" y="245.3731" text-anchor="middle" font-size="16.7164" fill="var(--bg)">v1.0</text>
  <circle cx="247.1642" cy="235.9701" r="33.4328" fill="var(--ok-fill)" />
  <text x="247.1642" y="245.3731" text-anchor="middle" font-size="16.7164" fill="var(--bg)">prod</text>
  <text x="180.2985" y="207.7612" font-size="16.7164">main</text>
  <circle cx="113.4328" cy="348.806" r="33.4328" fill="var(--primary-fill)" />
  <text x="113.4328" y="358.209" text-anchor="middle" font-size="16.7164" fill="var(--bg)">feat</text>
  <circle cx="247.1642" cy="348.806" r="33.4328" fill="var(--danger-fill)" />
  <text x="247.1642" y="358.209" text-anchor="middle" font-size="16.7164" fill="var(--bg)">fix</text>
  <circle cx="380.8955" cy="348.806" r="33.4328" fill="var(--primary-fill)" />
  <text x="380.8955" y="358.209" text-anchor="middle" font-size="16.7164" fill="var(--bg)">feat2</text>
  <text x="247.1642" y="320.597" font-size="16.7164">develop</text>
  <path d="M 247.1642 311.194 Q 330.7463 254.7761 247.1642 273.5821" stroke="var(--danger-border)" stroke-width="3.2" marker-end="url(#arrow)" fill="none" />
  <text x="330.7463" y="254.7761" font-size="18.3881" fill="var(--danger-accent)">cherry-pick</text>
  <line x1="146.8657" y1="235.9701" x2="213.7313" y2="235.9701" stroke="var(--text)" stroke-width="2" />
  <line x1="146.8657" y1="348.806" x2="213.7313" y2="348.806" stroke="var(--text)" stroke-width="2" />
  <line x1="280.597" y1="348.806" x2="347.4627" y2="348.806" stroke="var(--text)" stroke-width="2" />
  <line x1="113.4328" y1="273.5821" x2="113.4328" y2="311.194" stroke="var(--text)" stroke-width="2" />
  <rect x="698.5075" y="198.3582" width="501.4925" height="376.1194" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="949.2537" y="254.7761" text-anchor="middle" font-size="23.403" font-weight="bold">Common Scenarios:</text>
  <text x="731.9403" y="311.194" font-size="20.0597">• Hotfix to production branch</text>
  <text x="731.9403" y="358.209" font-size="20.0597">• Feature from abandoned branch</text>
  <text x="731.9403" y="405.2239" font-size="20.0597">• Bug fix to multiple releases</text>
  <text x="731.9403" y="452.2388" font-size="20.0597">• Selective feature merging</text>
  <text x="731.9403" y="499.2537" font-size="20.0597">• Backporting to older versions</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#f44336" />
    </marker>
  </defs>
</svg>
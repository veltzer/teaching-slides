<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="613.1344" y="40" text-anchor="middle" font-size="45.2288" font-weight="bold">Reset vs Revert</text>
  <text x="254.9254" y="129.2308" text-anchor="middle" font-size="30.1526" font-weight="bold">Reset (Rewrites History)</text>
  <circle cx="75.8209" cy="218.4615" r="37.6907" fill="var(--ok-fill)" />
  <text x="75.8209" y="229.6153" text-anchor="middle" font-size="18.8453" fill="var(--bg)">A</text>
  <circle cx="165.3731" cy="218.4615" r="37.6907" fill="var(--ok-fill)" />
  <text x="165.3731" y="229.6153" text-anchor="middle" font-size="18.8453" fill="var(--bg)">B</text>
  <circle cx="254.9254" cy="218.4615" r="37.6907" fill="var(--warn-fill)" stroke-dasharray="4.8 4.8" stroke="var(--text-faint)" stroke-width="3.2" />
  <text x="254.9254" y="229.6153" text-anchor="middle" font-size="18.8453" fill="var(--bg)">C</text>
  <circle cx="344.4776" cy="218.4615" r="37.6907" fill="var(--warn-fill)" stroke-dasharray="4.8 4.8" stroke="var(--text-faint)" stroke-width="3.2" />
  <text x="344.4776" y="229.6153" text-anchor="middle" font-size="18.8453" fill="var(--bg)">D</text>
  <line x1="111.6418" y1="218.4615" x2="129.5523" y2="218.4615" stroke="var(--text)" stroke-width="2" />
  <line x1="201.1941" y1="218.4615" x2="219.1045" y2="218.4615" stroke="var(--text)" stroke-width="2" />
  <line x1="290.7463" y1="218.4615" x2="308.6567" y2="218.4615" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4.8 4.8" />
  <text x="165.3731" y="296.5384" text-anchor="middle" font-size="22.6144">HEAD after reset</text>
  <path d="M 165.3731 274.2308 L 165.3731 240.7692" stroke="var(--danger-border)" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="254.9254" y="396.9231" text-anchor="middle" font-size="30.1526" font-weight="bold">Revert (Adds History)</text>
  <circle cx="75.8209" cy="508.4616" r="37.6907" fill="var(--ok-fill)" />
  <text x="75.8209" y="519.6153" text-anchor="middle" font-size="18.8453" fill="var(--bg)">A</text>
  <circle cx="165.3731" cy="508.4616" r="37.6907" fill="var(--ok-fill)" />
  <text x="165.3731" y="519.6153" text-anchor="middle" font-size="18.8453" fill="var(--bg)">B</text>
  <circle cx="254.9254" cy="508.4616" r="37.6907" fill="var(--ok-fill)" />
  <text x="254.9254" y="519.6153" text-anchor="middle" font-size="18.8453" fill="var(--bg)">C</text>
  <circle cx="344.4776" cy="508.4616" r="37.6907" fill="var(--ok-fill)" />
  <text x="344.4776" y="519.6153" text-anchor="middle" font-size="18.8453" fill="var(--bg)">D</text>
  <circle cx="434.0299" cy="508.4616" r="37.6907" fill="var(--primary-fill)" />
  <text x="434.0299" y="519.6153" text-anchor="middle" font-size="18.8453" fill="var(--bg)">!C</text>
  <line x1="111.6418" y1="508.4616" x2="129.5523" y2="508.4616" stroke="var(--text)" stroke-width="2" />
  <line x1="201.1941" y1="508.4616" x2="219.1045" y2="508.4616" stroke="var(--text)" stroke-width="2" />
  <line x1="290.7463" y1="508.4616" x2="308.6567" y2="508.4616" stroke="var(--text)" stroke-width="2" />
  <line x1="380.2985" y1="508.4616" x2="398.209" y2="508.4616" stroke="var(--text)" stroke-width="2" />
  <text x="434.0299" y="586.5385" text-anchor="middle" font-size="22.6144">Revert of C</text>
  <rect x="702.6866" y="173.8461" width="537.3134" height="446.1539" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="971.3433" y="240.7692" text-anchor="middle" font-size="30.1526" font-weight="bold">When to Use:</text>
  <text x="738.5075" y="307.6923" font-size="24.4989" font-weight="bold">Reset:</text>
  <text x="738.5075" y="352.3077" font-size="22.6144">• Local commits only</text>
  <text x="738.5075" y="396.9231" font-size="22.6144">• Clean up before push</text>
  <text x="738.5075" y="463.8461" font-size="24.4989" font-weight="bold">Revert:</text>
  <text x="738.5075" y="508.4616" font-size="22.6144">• Public commits</text>
  <text x="738.5075" y="553.0769" font-size="22.6144">• Preserving history</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#F44336" />
    </marker>
  </defs>
</svg>
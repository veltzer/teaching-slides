<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Reset vs Revert</text>
  <text x="320" y="144" text-anchor="middle" font-size="25.6" font-weight="bold">Reset (Rewrites History)</text>
  <circle cx="160" cy="216" r="32" fill="#4CAF50" />
  <text x="160" y="225" text-anchor="middle" font-size="16" fill="white">A</text>
  <circle cx="240" cy="216" r="32" fill="#4CAF50" />
  <text x="240" y="225" text-anchor="middle" font-size="16" fill="white">B</text>
  <circle cx="320" cy="216" r="32" fill="#FF9800" stroke-dasharray="4.8 4.8" stroke="#999" stroke-width="3.2" />
  <text x="320" y="225" text-anchor="middle" font-size="16" fill="white">C</text>
  <circle cx="400" cy="216" r="32" fill="#FF9800" stroke-dasharray="4.8 4.8" stroke="#999" stroke-width="3.2" />
  <text x="400" y="225" text-anchor="middle" font-size="16" fill="white">D</text>
  <line x1="192" y1="216" x2="208" y2="216" stroke="#333" stroke-width="3.2" />
  <line x1="272" y1="216" x2="288" y2="216" stroke="#333" stroke-width="3.2" />
  <line x1="352" y1="216" x2="368" y2="216" stroke="#999" stroke-width="3.2" stroke-dasharray="4.8 4.8" />
  <text x="240" y="279" text-anchor="middle" font-size="19.2">HEAD after reset</text>
  <path d="M 240 261 L 240 234" stroke="#F44336" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="320" y="360" text-anchor="middle" font-size="25.6" font-weight="bold">Revert (Adds History)</text>
  <circle cx="160" cy="450" r="32" fill="#4CAF50" />
  <text x="160" y="459" text-anchor="middle" font-size="16" fill="white">A</text>
  <circle cx="240" cy="450" r="32" fill="#4CAF50" />
  <text x="240" y="459" text-anchor="middle" font-size="16" fill="white">B</text>
  <circle cx="320" cy="450" r="32" fill="#4CAF50" />
  <text x="320" y="459" text-anchor="middle" font-size="16" fill="white">C</text>
  <circle cx="400" cy="450" r="32" fill="#4CAF50" />
  <text x="400" y="459" text-anchor="middle" font-size="16" fill="white">D</text>
  <circle cx="480" cy="450" r="32" fill="#2196F3" />
  <text x="480" y="459" text-anchor="middle" font-size="16" fill="white">!C</text>
  <line x1="192" y1="450" x2="208" y2="450" stroke="#333" stroke-width="3.2" />
  <line x1="272" y1="450" x2="288" y2="450" stroke="#333" stroke-width="3.2" />
  <line x1="352" y1="450" x2="368" y2="450" stroke="#333" stroke-width="3.2" />
  <line x1="432" y1="450" x2="448" y2="450" stroke="#333" stroke-width="3.2" />
  <text x="480" y="513" text-anchor="middle" font-size="19.2">Revert of C</text>
  <rect x="720" y="180" width="480" height="360" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="960" y="234" text-anchor="middle" font-size="25.6" font-weight="bold">When to Use:</text>
  <text x="752" y="288" font-size="20.8" font-weight="bold">Reset:</text>
  <text x="752" y="324" font-size="19.2">• Local commits only</text>
  <text x="752" y="360" font-size="19.2">• Clean up before push</text>
  <text x="752" y="414" font-size="20.8" font-weight="bold">Revert:</text>
  <text x="752" y="450" font-size="19.2">• Public commits</text>
  <text x="752" y="486" font-size="19.2">• Preserving history</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrow1" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#F44336" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="614.9254" y="85.5224" text-anchor="middle" font-size="40.1194" font-weight="bold">Reset vs Revert</text>
  <text x="280.597" y="160.7463" text-anchor="middle" font-size="26.7463" font-weight="bold">Reset (Rewrites History)</text>
  <circle cx="113.4328" cy="235.9701" r="33.4328" fill="var(--ok-fill)" />
  <text x="113.4328" y="245.3731" text-anchor="middle" font-size="16.7164" fill="var(--bg)">A</text>
  <circle cx="197.0149" cy="235.9701" r="33.4328" fill="var(--ok-fill)" />
  <text x="197.0149" y="245.3731" text-anchor="middle" font-size="16.7164" fill="var(--bg)">B</text>
  <circle cx="280.597" cy="235.9701" r="33.4328" fill="var(--warn-fill)" stroke-dasharray="4.8 4.8" stroke="var(--text-faint)" stroke-width="3.2" />
  <text x="280.597" y="245.3731" text-anchor="middle" font-size="16.7164" fill="var(--bg)">C</text>
  <circle cx="364.1791" cy="235.9701" r="33.4328" fill="var(--warn-fill)" stroke-dasharray="4.8 4.8" stroke="var(--text-faint)" stroke-width="3.2" />
  <text x="364.1791" y="245.3731" text-anchor="middle" font-size="16.7164" fill="var(--bg)">D</text>
  <line x1="146.8657" y1="235.9701" x2="163.5821" y2="235.9701" stroke="var(--text)" stroke-width="2" />
  <line x1="230.4478" y1="235.9701" x2="247.1642" y2="235.9701" stroke="var(--text)" stroke-width="2" />
  <line x1="314.0299" y1="235.9701" x2="330.7463" y2="235.9701" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4.8 4.8" />
  <text x="197.0149" y="301.791" text-anchor="middle" font-size="20.0597">HEAD after reset</text>
  <path d="M 197.0149 282.9851 L 197.0149 254.7761" stroke="var(--danger-border)" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="280.597" y="386.4179" text-anchor="middle" font-size="26.7463" font-weight="bold">Revert (Adds History)</text>
  <circle cx="113.4328" cy="480.4478" r="33.4328" fill="var(--ok-fill)" />
  <text x="113.4328" y="489.8507" text-anchor="middle" font-size="16.7164" fill="var(--bg)">A</text>
  <circle cx="197.0149" cy="480.4478" r="33.4328" fill="var(--ok-fill)" />
  <text x="197.0149" y="489.8507" text-anchor="middle" font-size="16.7164" fill="var(--bg)">B</text>
  <circle cx="280.597" cy="480.4478" r="33.4328" fill="var(--ok-fill)" />
  <text x="280.597" y="489.8507" text-anchor="middle" font-size="16.7164" fill="var(--bg)">C</text>
  <circle cx="364.1791" cy="480.4478" r="33.4328" fill="var(--ok-fill)" />
  <text x="364.1791" y="489.8507" text-anchor="middle" font-size="16.7164" fill="var(--bg)">D</text>
  <circle cx="447.7612" cy="480.4478" r="33.4328" fill="var(--primary-fill)" />
  <text x="447.7612" y="489.8507" text-anchor="middle" font-size="16.7164" fill="var(--bg)">!C</text>
  <line x1="146.8657" y1="480.4478" x2="163.5821" y2="480.4478" stroke="var(--text)" stroke-width="2" />
  <line x1="230.4478" y1="480.4478" x2="247.1642" y2="480.4478" stroke="var(--text)" stroke-width="2" />
  <line x1="314.0299" y1="480.4478" x2="330.7463" y2="480.4478" stroke="var(--text)" stroke-width="2" />
  <line x1="397.6119" y1="480.4478" x2="414.3284" y2="480.4478" stroke="var(--text)" stroke-width="2" />
  <text x="447.7612" y="546.2687" text-anchor="middle" font-size="20.0597">Revert of C</text>
  <rect x="698.5075" y="198.3582" width="501.4925" height="376.1194" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.2687" />
  <text x="949.2537" y="254.7761" text-anchor="middle" font-size="26.7463" font-weight="bold">When to Use:</text>
  <text x="731.9403" y="311.194" font-size="21.7313" font-weight="bold">Reset:</text>
  <text x="731.9403" y="348.806" font-size="20.0597">• Local commits only</text>
  <text x="731.9403" y="386.4179" font-size="20.0597">• Clean up before push</text>
  <text x="731.9403" y="442.8358" font-size="21.7313" font-weight="bold">Revert:</text>
  <text x="731.9403" y="480.4478" font-size="20.0597">• Public commits</text>
  <text x="731.9403" y="518.0597" font-size="20.0597">• Preserving history</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#F44336" />
    </marker>
  </defs>
</svg>
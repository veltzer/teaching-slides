<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="614.1251" y="40" text-anchor="middle" font-size="45.193" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Reset vs Revert</text>
  <text x="256.4822" y="129.2308" text-anchor="middle" font-size="30.1287" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Reset (Rewrites History)</text>
  <rect x="40" y="180.801" width="75.3218" height="75.3218" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="77.6609" y="229.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">A</text>
  <rect x="129.411" y="180.801" width="75.3218" height="75.3218" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="167.0715" y="229.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">B</text>
  <rect x="218.821" y="180.801" width="75.3218" height="75.3218" rx="14" fill="url(#grad-warn)" stroke-dasharray="4.8 4.8" stroke="var(--text-faint)" stroke-width="3.2" filter="url(#shadow)"/>
  <text x="256.4822" y="229.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">C</text>
  <rect x="308.232" y="180.801" width="75.3218" height="75.3218" rx="14" fill="url(#grad-warn)" stroke-dasharray="4.8 4.8" stroke="var(--text-faint)" stroke-width="3.2" filter="url(#shadow)"/>
  <text x="345.8929" y="229.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">D</text>
  <line x1="113.4251" y1="218.4615" x2="131.3074" y2="218.4615" stroke="var(--text)" stroke-width="2" />
  <line x1="202.8358" y1="218.4615" x2="220.718" y2="218.4615" stroke="var(--text)" stroke-width="2" />
  <line x1="292.2465" y1="218.4615" x2="310.1286" y2="218.4615" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4.8 4.8" />
  <text x="167.0715" y="296.5384" text-anchor="middle" font-size="22.5965" font-family="Arial, sans-serif" fill="var(--text)">HEAD after reset</text>
  <path d="M 167.0715 274.2308 L 167.0715 240.7692" stroke="var(--danger-border)" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="256.4822" y="396.9231" text-anchor="middle" font-size="30.1287" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Revert (Adds History)</text>
  <rect x="40" y="470.801" width="75.3218" height="75.3218" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="77.6609" y="519.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">A</text>
  <rect x="129.411" y="470.801" width="75.3218" height="75.3218" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="167.0715" y="519.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">B</text>
  <rect x="218.821" y="470.801" width="75.3218" height="75.3218" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="256.4822" y="519.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">C</text>
  <rect x="308.232" y="470.801" width="75.3218" height="75.3218" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="345.8929" y="519.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">D</text>
  <rect x="397.643" y="470.801" width="75.3218" height="75.3218" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="435.3037" y="519.6153" text-anchor="middle" font-size="18.8304" fill="var(--bg)" font-family="Arial, sans-serif">!C</text>
  <line x1="113.4251" y1="508.4616" x2="131.3074" y2="508.4616" stroke="var(--text)" stroke-width="2" />
  <line x1="202.8358" y1="508.4616" x2="220.718" y2="508.4616" stroke="var(--text)" stroke-width="2" />
  <line x1="292.2465" y1="508.4616" x2="310.1286" y2="508.4616" stroke="var(--text)" stroke-width="2" />
  <line x1="381.6573" y1="508.4616" x2="399.5394" y2="508.4616" stroke="var(--text)" stroke-width="2" />
  <text x="435.3037" y="586.5385" text-anchor="middle" font-size="22.5965" font-family="Arial, sans-serif" fill="var(--text)">Revert of C</text>
  <rect x="703.5358" y="173.8461" width="536.4642" height="446.1539" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="5.9952" />
  <text x="971.7679" y="240.7692" text-anchor="middle" font-size="30.1287" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">When to Use:</text>
  <text x="739.3001" y="307.6923" font-size="24.4795" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Reset:</text>
  <text x="739.3001" y="352.3077" font-size="22.5965" font-family="Arial, sans-serif" fill="var(--text)">• Local commits only</text>
  <text x="739.3001" y="396.9231" font-size="22.5965" font-family="Arial, sans-serif" fill="var(--text)">• Clean up before push</text>
  <text x="739.3001" y="463.8461" font-size="24.4795" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Revert:</text>
  <text x="739.3001" y="508.4616" font-size="22.5965" font-family="Arial, sans-serif" fill="var(--text)">• Public commits</text>
  <text x="739.3001" y="553.0769" font-size="22.5965" font-family="Arial, sans-serif" fill="var(--text)">• Preserving history</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="615.015" y="69.1892" text-anchor="middle" font-size="36.9009" font-weight="bold">Lost Something? Don't Panic!</ns0:text>
  <ns0:rect x="153.7538" y="121.0811" width="922.5225" height="518.9189" fill="#F5F5F5" stroke="#333" stroke-width="3.0751" rx="7.6877" />
  <ns0:text x="615.015" y="172.973" text-anchor="middle" font-size="27.6757" font-weight="bold">Recovery Steps</ns0:text>
  <ns0:rect x="199.8799" y="207.5676" width="830.2703" height="60.5405" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.5375" rx="4.6126" />
  <ns0:text x="230.6306" y="245.6216" font-size="21.5255">1. Check git status - Is it just unstaged?</ns0:text>
  <ns0:rect x="199.8799" y="276.7568" width="830.2703" height="60.5405" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5375" rx="4.6126" />
  <ns0:text x="230.6306" y="314.8108" font-size="21.5255">2. Check git reflog - Find the SHA</ns0:text>
  <ns0:rect x="199.8799" y="345.9459" width="830.2703" height="60.5405" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5375" rx="4.6126" />
  <ns0:text x="230.6306" y="384" font-size="21.5255">3. Check git fsck --lost-found - Dangling commits</ns0:text>
  <ns0:rect x="199.8799" y="415.1351" width="830.2703" height="60.5405" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5375" rx="4.6126" />
  <ns0:text x="230.6306" y="453.1892" font-size="21.5255">4. Check git stash list - Maybe you stashed it?</ns0:text>
  <ns0:rect x="199.8799" y="484.3243" width="830.2703" height="60.5405" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5375" rx="4.6126" />
  <ns0:text x="230.6306" y="522.3784" font-size="21.5255">5. Check backups/clones - Other copies?</ns0:text>
  <ns0:rect x="199.8799" y="553.5135" width="830.2703" height="60.5405" fill="#e8f4f8" stroke="#27ae60" stroke-width="1.5375" rx="4.6126" />
  <ns0:text x="230.6306" y="591.5676" font-size="21.5255">6. Act quickly - Garbage collection in 90 days</ns0:text>
</ns0:svg>
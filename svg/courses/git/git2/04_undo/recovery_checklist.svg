<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Lost Something? Don't Panic!</text>
  <rect x="160" y="126" width="960" height="540" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="180" text-anchor="middle" font-size="28.8" font-weight="bold">Recovery Steps</text>
  <rect x="208" y="216" width="864" height="63" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.6" rx="4.8" />
  <text x="240" y="255.6" font-size="22.4">1. Check git status - Is it just unstaged?</text>
  <rect x="208" y="288" width="864" height="63" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.6" rx="4.8" />
  <text x="240" y="327.6" font-size="22.4">2. Check git reflog - Find the SHA</text>
  <rect x="208" y="360" width="864" height="63" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.6" rx="4.8" />
  <text x="240" y="399.6" font-size="22.4">3. Check git fsck --lost-found - Dangling commits</text>
  <rect x="208" y="432" width="864" height="63" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.6" rx="4.8" />
  <text x="240" y="471.6" font-size="22.4">4. Check git stash list - Maybe you stashed it?</text>
  <rect x="208" y="504" width="864" height="63" fill="#FFEBEE" stroke="#C62828" stroke-width="1.6" rx="4.8" />
  <text x="240" y="543.6" font-size="22.4">5. Check backups/clones - Other copies?</text>
  <rect x="208" y="576" width="864" height="63" fill="#E0F2F1" stroke="#00796B" stroke-width="1.6" rx="4.8" />
  <text x="240" y="615.6" font-size="22.4">6. Act quickly - Garbage collection in 90 days</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="43.4219" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Reflog Tracks Everything</text>
  <rect x="40" y="113.6508" width="1200" height="460.3175" fill="var(--text)" stroke="var(--text-muted)" stroke-width="3.2" rx="6" />
  <text x="80" y="168.8889" font-size="21.7109" fill="var(--ok-accent)" font-family="Courier New, monospace">$ git reflog</text>
  <text x="80" y="214.9206" font-size="19.9017" fill="var(--warn-accent)" font-family="Courier New, monospace">a3f8d9c HEAD@{0}: reset: moving to HEAD~2</text>
  <text x="80" y="251.746" font-size="19.9017" fill="var(--ok-accent)" font-family="Courier New, monospace">b8e7a2d HEAD@{1}: commit: Add feature</text>
  <text x="80" y="288.5714" font-size="19.9017" fill="var(--ok-accent)" font-family="Courier New, monospace">c9d6b3e HEAD@{2}: commit: Fix bug</text>
  <text x="80" y="325.3968" font-size="19.9017" fill="var(--primary-accent)" font-family="Courier New, monospace">d7a5c1f HEAD@{3}: checkout: from main to feature</text>
  <text x="80" y="362.2222" font-size="19.9017" fill="var(--ok-accent)" font-family="Courier New, monospace">e8b4a2c HEAD@{4}: commit: Update README</text>
  <text x="80" y="399.0476" font-size="19.9017" fill="var(--warn-accent)" font-family="Courier New, monospace">f9c3b1d HEAD@{5}: rebase: Add tests</text>
  <text x="80" y="435.873" font-size="19.9017" fill="var(--danger-accent)" font-family="Courier New, monospace">g0d4e5f HEAD@{6}: merge: Merge branch 'hotfix'</text>
  <text x="80" y="472.6984" font-size="19.9017" fill="var(--text-faint)" font-family="Courier New, monospace">h1e5f6g HEAD@{7}: clone: from origin</text>
  <text x="640" y="620" text-anchor="middle" font-size="25.3294" font-style="italic" font-family="Arial, sans-serif" fill="var(--text)">Every HEAD movement is recorded for 90 days!</text>
</svg>
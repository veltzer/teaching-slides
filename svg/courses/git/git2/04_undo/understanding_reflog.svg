<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Reflog Tracks Everything</text>
  <rect x="160" y="144" width="960" height="450" fill="#263238" stroke="#37474F" stroke-width="3.2" rx="8" />
  <text x="192" y="198" font-family="monospace" font-size="19.2" fill="#4CAF50">$ git reflog</text>
  <text x="192" y="243" font-family="monospace" font-size="17.6" fill="#FFD54F">a3f8d9c HEAD@{0}: reset: moving to HEAD~2</text>
  <text x="192" y="279" font-family="monospace" font-size="17.6" fill="#81C784">b8e7a2d HEAD@{1}: commit: Add feature</text>
  <text x="192" y="315" font-family="monospace" font-size="17.6" fill="#81C784">c9d6b3e HEAD@{2}: commit: Fix bug</text>
  <text x="192" y="351" font-family="monospace" font-size="17.6" fill="#64B5F6">d7a5c1f HEAD@{3}: checkout: from main to feature</text>
  <text x="192" y="387" font-family="monospace" font-size="17.6" fill="#81C784">e8b4a2c HEAD@{4}: commit: Update README</text>
  <text x="192" y="423" font-family="monospace" font-size="17.6" fill="#FFB74D">f9c3b1d HEAD@{5}: rebase: Add tests</text>
  <text x="192" y="459" font-family="monospace" font-size="17.6" fill="#E57373">g0d4e5f HEAD@{6}: merge: Merge branch 'hotfix'</text>
  <text x="192" y="495" font-family="monospace" font-size="17.6" fill="#A1887F">h1e5f6g HEAD@{7}: clone: from origin</text>
  <text x="640" y="639" text-anchor="middle" font-size="22.4" font-style="italic">Every HEAD movement is recorded for 90 days!</text>
</svg>
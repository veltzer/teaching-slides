<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Repository Cleanup Strategy</ns0:text>
  <ns0:rect x="79.0123" y="142.2222" width="505.679" height="213.3333" fill="#FFEBEE" stroke="#C62828" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="331.8519" y="195.5556" text-anchor="middle" font-size="25.284" font-weight="bold">Problem: Large Files</ns0:text>
  <ns0:text x="110.6173" y="240" font-size="18.963">• Videos, images, binaries</ns0:text>
  <ns0:text x="110.6173" y="275.5556" font-size="18.963">• Generated files</ns0:text>
  <ns0:text x="110.6173" y="311.1111" font-size="18.963">• Dependencies checked in</ns0:text>
  <ns0:rect x="679.5062" y="142.2222" width="505.679" height="213.3333" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="932.3457" y="195.5556" text-anchor="middle" font-size="25.284" font-weight="bold">Solution: Clean History</ns0:text>
  <ns0:text x="711.1111" y="240" font-size="18.963">1. Use BFG or filter-repo</ns0:text>
  <ns0:text x="711.1111" y="275.5556" font-size="18.963">2. Remove from all commits</ns0:text>
  <ns0:text x="711.1111" y="311.1111" font-size="18.963">3. Force push (coordinate!)</ns0:text>
  <ns0:rect x="79.0123" y="391.1111" width="1106.1728" height="248.8889" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="632.0988" y="444.4444" text-anchor="middle" font-size="25.284" font-weight="bold">Prevention</ns0:text>
  <ns0:text x="110.6173" y="497.7778" font-size="18.963">• Use .gitignore from start</ns0:text>
  <ns0:text x="110.6173" y="533.3333" font-size="18.963">• Git LFS for large files</ns0:text>
  <ns0:text x="110.6173" y="568.8889" font-size="18.963">• Code review before commits</ns0:text>
  <ns0:text x="110.6173" y="604.4444" font-size="18.963">• Pre-commit hooks</ns0:text>
</ns0:svg>
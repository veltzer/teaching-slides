<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Repository Cleanup Strategy</text>
  <rect x="80" y="144" width="512" height="216" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="336" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Problem: Large Files</text>
  <text x="112" y="243" font-size="19.2">• Videos, images, binaries</text>
  <text x="112" y="279" font-size="19.2">• Generated files</text>
  <text x="112" y="315" font-size="19.2">• Dependencies checked in</text>
  <rect x="688" y="144" width="512" height="216" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="944" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Solution: Clean History</text>
  <text x="720" y="243" font-size="19.2">1. Use BFG or filter-repo</text>
  <text x="720" y="279" font-size="19.2">2. Remove from all commits</text>
  <text x="720" y="315" font-size="19.2">3. Force push (coordinate!)</text>
  <rect x="80" y="396" width="1120" height="252" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="450" text-anchor="middle" font-size="25.6" font-weight="bold">Prevention</text>
  <text x="112" y="504" font-size="19.2">• Use .gitignore from start</text>
  <text x="112" y="540" font-size="19.2">• Git LFS for large files</text>
  <text x="112" y="576" font-size="19.2">• Code review before commits</text>
  <text x="112" y="612" font-size="19.2">• Pre-commit hooks</text>
</svg>
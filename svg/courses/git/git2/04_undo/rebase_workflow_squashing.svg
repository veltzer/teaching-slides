<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="613.1343" y="40" text-anchor="middle" font-size="40.7687" font-weight="bold">Interactive Rebase: Squashing</text>
  <text x="254.9253" y="112.5" text-anchor="middle" font-size="23.7818" font-weight="bold">Before</text>
  <circle cx="75.8209" cy="185" r="33.9739" fill="var(--ok-fill)" />
  <text x="75.8209" y="194.0625" text-anchor="middle" font-size="16.987" fill="var(--bg)">main</text>
  <circle cx="219.1044" cy="185" r="33.9739" fill="var(--primary-fill)" />
  <text x="219.1044" y="194.0625" text-anchor="middle" font-size="16.987" fill="var(--bg)">WIP</text>
  <circle cx="362.388" cy="185" r="33.9739" fill="var(--primary-fill)" />
  <text x="362.388" y="194.0625" text-anchor="middle" font-size="16.987" fill="var(--bg)">typo</text>
  <circle cx="505.6717" cy="185" r="33.9739" fill="var(--primary-fill)" />
  <text x="505.6717" y="194.0625" text-anchor="middle" font-size="16.987" fill="var(--bg)">done</text>
  <line x1="111.6417" y1="185" x2="183.2835" y2="185" stroke="var(--text)" stroke-width="2" />
  <line x1="254.9253" y1="185" x2="326.5672" y2="185" stroke="var(--text)" stroke-width="2" />
  <line x1="398.2089" y1="185" x2="469.8507" y2="185" stroke="var(--text)" stroke-width="2" />
  <rect x="702.6865" y="130.625" width="537.3135" height="145" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="971.3432" y="175.9375" text-anchor="middle" font-size="20.3844" font-family="monospace">git rebase -i HEAD~3</text>
  <text x="738.5074" y="212.1875" font-size="18.6857" font-family="monospace">pick WIP</text>
  <text x="738.5074" y="239.375" font-size="18.6857" font-family="monospace">squash typo</text>
  <text x="738.5074" y="266.5625" font-size="18.6857" font-family="monospace">squash done</text>
  <text x="254.9253" y="366.25" text-anchor="middle" font-size="23.7818" font-weight="bold">After</text>
  <circle cx="75.8209" cy="438.75" r="33.9739" fill="var(--ok-fill)" />
  <text x="75.8209" y="447.8125" text-anchor="middle" font-size="16.987" fill="var(--bg)">main</text>
  <circle cx="254.9253" cy="438.75" r="42.4675" fill="var(--info-fill)" />
  <text x="254.9253" y="447.8125" text-anchor="middle" font-size="20.3844" fill="var(--bg)">Feature</text>
  <line x1="111.6417" y1="438.75" x2="210.1492" y2="438.75" stroke="var(--text)" stroke-width="2" />
  <text x="254.9253" y="502.1875" text-anchor="middle" font-size="20.3844">Clean single commit!</text>
  <rect x="523.582" y="402.5" width="716.418" height="217.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="881.791" y="456.875" text-anchor="middle" font-size="23.7818" font-weight="bold">Benefits:</text>
  <text x="559.403" y="502.1875" font-size="20.3844">• Clean, logical history</text>
  <text x="559.403" y="538.4375" font-size="20.3844">• Easier code review</text>
  <text x="559.403" y="574.6875" font-size="20.3844">• Better git blame/bisect</text>
</svg>
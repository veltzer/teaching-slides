<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Interactive Rebase: Squashing</text>
  <text x="316.0494" y="142.2222" text-anchor="middle" font-size="22.1235" font-weight="bold">Before</text>
  <circle cx="158.0247" cy="213.3333" r="31.6049" fill="var(--ok-fill)" />
  <text x="158.0247" y="222.2222" text-anchor="middle" font-size="15.8025" fill="var(--bg)">main</text>
  <circle cx="284.4444" cy="213.3333" r="31.6049" fill="var(--primary-fill)" />
  <text x="284.4444" y="222.2222" text-anchor="middle" font-size="15.8025" fill="var(--bg)">WIP</text>
  <circle cx="410.8642" cy="213.3333" r="31.6049" fill="var(--primary-fill)" />
  <text x="410.8642" y="222.2222" text-anchor="middle" font-size="15.8025" fill="var(--bg)">typo</text>
  <circle cx="537.284" cy="213.3333" r="31.6049" fill="var(--primary-fill)" />
  <text x="537.284" y="222.2222" text-anchor="middle" font-size="15.8025" fill="var(--bg)">done</text>
  <line x1="189.6296" y1="213.3333" x2="252.8395" y2="213.3333" stroke="var(--text)" stroke-width="2" />
  <line x1="316.0494" y1="213.3333" x2="379.2593" y2="213.3333" stroke="var(--text)" stroke-width="2" />
  <line x1="442.4691" y1="213.3333" x2="505.679" y2="213.3333" stroke="var(--text)" stroke-width="2" />
  <rect x="711.1111" y="160" width="474.0741" height="142.2222" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="948.1481" y="204.4444" text-anchor="middle" font-size="18.963" font-family="monospace">git rebase -i HEAD~3</text>
  <text x="742.716" y="240" font-size="17.3827" font-family="monospace">pick WIP</text>
  <text x="742.716" y="266.6667" font-size="17.3827" font-family="monospace">squash typo</text>
  <text x="742.716" y="293.3333" font-size="17.3827" font-family="monospace">squash done</text>
  <text x="316.0494" y="391.1111" text-anchor="middle" font-size="22.1235" font-weight="bold">After</text>
  <circle cx="158.0247" cy="462.2222" r="31.6049" fill="var(--ok-fill)" />
  <text x="158.0247" y="471.1111" text-anchor="middle" font-size="15.8025" fill="var(--bg)">main</text>
  <circle cx="316.0494" cy="462.2222" r="39.5062" fill="var(--info-fill)" />
  <text x="316.0494" y="471.1111" text-anchor="middle" font-size="18.963" fill="var(--bg)">Feature</text>
  <line x1="189.6296" y1="462.2222" x2="276.5432" y2="462.2222" stroke="var(--text)" stroke-width="2" />
  <text x="316.0494" y="524.4444" text-anchor="middle" font-size="18.963">Clean single commit!</text>
  <rect x="553.0864" y="426.6667" width="632.0988" height="213.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="869.1358" y="480" text-anchor="middle" font-size="22.1235" font-weight="bold">Benefits:</text>
  <text x="584.6914" y="524.4444" font-size="18.963">• Clean, logical history</text>
  <text x="584.6914" y="560" font-size="18.963">• Easier code review</text>
  <text x="584.6914" y="595.5556" font-size="18.963">• Better git blame/bisect</text>
</svg>
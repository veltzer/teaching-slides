<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Interactive Rebase: Squashing</text>
  <text x="320" y="144" text-anchor="middle" font-size="22.4" font-weight="bold">Before</text>
  <circle cx="160" cy="216" r="32" fill="#4CAF50" />
  <text x="160" y="225" text-anchor="middle" font-size="16" fill="white">main</text>
  <circle cx="288" cy="216" r="32" fill="#2196F3" />
  <text x="288" y="225" text-anchor="middle" font-size="16" fill="white">WIP</text>
  <circle cx="416" cy="216" r="32" fill="#2196F3" />
  <text x="416" y="225" text-anchor="middle" font-size="16" fill="white">typo</text>
  <circle cx="544" cy="216" r="32" fill="#2196F3" />
  <text x="544" y="225" text-anchor="middle" font-size="16" fill="white">done</text>
  <line x1="192" y1="216" x2="256" y2="216" stroke="#333" stroke-width="3.2" />
  <line x1="320" y1="216" x2="384" y2="216" stroke="#333" stroke-width="3.2" />
  <line x1="448" y1="216" x2="512" y2="216" stroke="#333" stroke-width="3.2" />
  <rect x="720" y="162" width="480" height="144" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="960" y="207" text-anchor="middle" font-size="19.2" font-family="monospace">git rebase -i HEAD~3</text>
  <text x="752" y="243" font-size="17.6" font-family="monospace">pick WIP</text>
  <text x="752" y="270" font-size="17.6" font-family="monospace">squash typo</text>
  <text x="752" y="297" font-size="17.6" font-family="monospace">squash done</text>
  <text x="320" y="396" text-anchor="middle" font-size="22.4" font-weight="bold">After</text>
  <circle cx="160" cy="468" r="32" fill="#4CAF50" />
  <text x="160" y="477" text-anchor="middle" font-size="16" fill="white">main</text>
  <circle cx="320" cy="468" r="40" fill="#9C27B0" />
  <text x="320" y="477" text-anchor="middle" font-size="19.2" fill="white">Feature</text>
  <line x1="192" y1="468" x2="280" y2="468" stroke="#333" stroke-width="3.2" />
  <text x="320" y="531" text-anchor="middle" font-size="19.2">Clean single commit!</text>
  <rect x="560" y="432" width="640" height="216" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="880" y="486" text-anchor="middle" font-size="22.4" font-weight="bold">Benefits:</text>
  <text x="592" y="531" font-size="19.2">• Clean, logical history</text>
  <text x="592" y="567" font-size="19.2">• Easier code review</text>
  <text x="592" y="603" font-size="19.2">• Better git blame/bisect</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64" text-anchor="middle" font-size="38.4" font-weight="bold">Interactive Rebase Options</text>
  <rect x="80" y="112" width="560" height="96" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="360" y="152" text-anchor="middle" font-size="22.4" font-weight="bold">pick - Keep commit as is</text>
  <text x="360" y="184" text-anchor="middle" font-size="19.2">Default option, no changes</text>
  <rect x="672" y="112" width="528" height="96" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="936" y="152" text-anchor="middle" font-size="22.4" font-weight="bold">reword - Edit commit message</text>
  <text x="936" y="184" text-anchor="middle" font-size="19.2">Fix typos, improve clarity</text>
  <rect x="80" y="224" width="560" height="96" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="360" y="264" text-anchor="middle" font-size="22.4" font-weight="bold">edit - Stop to amend commit</text>
  <text x="360" y="296" text-anchor="middle" font-size="19.2">Add files, split commit</text>
  <rect x="672" y="224" width="528" height="96" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="3.2" rx="8" />
  <text x="936" y="264" text-anchor="middle" font-size="22.4" font-weight="bold">squash - Combine with previous</text>
  <text x="936" y="296" text-anchor="middle" font-size="19.2">Keep both messages</text>
  <rect x="80" y="336" width="560" height="96" fill="#E0F2F1" stroke="#00796B" stroke-width="3.2" rx="8" />
  <text x="360" y="376" text-anchor="middle" font-size="22.4" font-weight="bold">fixup - Combine, discard message</text>
  <text x="360" y="408" text-anchor="middle" font-size="19.2">Clean up WIP commits</text>
  <rect x="672" y="336" width="528" height="96" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="936" y="376" text-anchor="middle" font-size="22.4" font-weight="bold">drop - Remove commit entirely</text>
  <text x="936" y="408" text-anchor="middle" font-size="19.2">Delete unwanted changes</text>
  <rect x="80" y="448" width="560" height="96" fill="#FCE4EC" stroke="#C2185B" stroke-width="3.2" rx="8" />
  <text x="360" y="488" text-anchor="middle" font-size="22.4" font-weight="bold">exec - Run shell command</text>
  <text x="360" y="520" text-anchor="middle" font-size="19.2">exec npm test</text>
  <rect x="672" y="448" width="528" height="96" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="3.2" rx="8" />
  <text x="936" y="488" text-anchor="middle" font-size="22.4" font-weight="bold">break - Pause rebase here</text>
  <text x="936" y="520" text-anchor="middle" font-size="19.2">Manual intervention needed</text>
  <text x="640" y="608" text-anchor="middle" font-size="22.4" font-style="italic">Tip: You can reorder lines to reorder commits!</text>
</svg>
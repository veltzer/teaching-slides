<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="41.0419" font-weight="bold">Interactive Rebase Options</text>
  <rect x="40" y="91.1765" width="600" height="102.3529" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="340" y="133.8235" text-anchor="middle" font-size="23.9411" font-weight="bold">pick - Keep commit as is</text>
  <text x="340" y="167.9412" text-anchor="middle" font-size="20.5209">Default option, no changes</text>
  <rect x="674.2857" y="91.1765" width="565.7143" height="102.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="957.1429" y="133.8235" text-anchor="middle" font-size="23.9411" font-weight="bold">reword - Edit commit message</text>
  <text x="957.1429" y="167.9412" text-anchor="middle" font-size="20.5209">Fix typos, improve clarity</text>
  <rect x="40" y="210.5882" width="600" height="102.3529" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="340" y="253.2353" text-anchor="middle" font-size="23.9411" font-weight="bold">edit - Stop to amend commit</text>
  <text x="340" y="287.3529" text-anchor="middle" font-size="20.5209">Add files, split commit</text>
  <rect x="674.2857" y="210.5882" width="565.7143" height="102.3529" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="957.1429" y="253.2353" text-anchor="middle" font-size="23.9411" font-weight="bold">squash - Combine with previous</text>
  <text x="957.1429" y="287.3529" text-anchor="middle" font-size="20.5209">Keep both messages</text>
  <rect x="40" y="330" width="600" height="102.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="340" y="372.6471" text-anchor="middle" font-size="23.9411" font-weight="bold">fixup - Combine, discard message</text>
  <text x="340" y="406.7647" text-anchor="middle" font-size="20.5209">Clean up WIP commits</text>
  <rect x="674.2857" y="330" width="565.7143" height="102.3529" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="957.1429" y="372.6471" text-anchor="middle" font-size="23.9411" font-weight="bold">drop - Remove commit entirely</text>
  <text x="957.1429" y="406.7647" text-anchor="middle" font-size="20.5209">Delete unwanted changes</text>
  <rect x="40" y="449.4118" width="600" height="102.3529" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="340" y="492.0588" text-anchor="middle" font-size="23.9411" font-weight="bold">exec - Run shell command</text>
  <text x="340" y="526.1765" text-anchor="middle" font-size="20.5209">exec npm test</text>
  <rect x="674.2857" y="449.4118" width="565.7143" height="102.3529" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="957.1429" y="492.0588" text-anchor="middle" font-size="23.9411" font-weight="bold">break - Pause rebase here</text>
  <text x="957.1429" y="526.1765" text-anchor="middle" font-size="20.5209">Manual intervention needed</text>
  <text x="640" y="620" text-anchor="middle" font-size="23.9411" font-style="italic">Tip: You can reorder lines to reorder commits!</text>
</svg>
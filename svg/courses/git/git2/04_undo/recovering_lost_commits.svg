<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Nothing is Really Lost (for 90 days)</text>
  <rect x="160" y="144" width="960" height="180" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="640" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Git's Safety Features</text>
  <text x="192" y="252" font-size="20.8">• Reflog tracks ALL HEAD movements (90 days default)</text>
  <text x="192" y="288" font-size="20.8">• Dangling commits exist until garbage collection</text>
  <circle cx="240" cy="396" r="32" fill="#4CAF50" />
  <text x="240" y="405" text-anchor="middle" font-size="16" fill="white">A</text>
  <circle cx="352" cy="396" r="32" fill="#4CAF50" />
  <text x="352" y="405" text-anchor="middle" font-size="16" fill="white">B</text>
  <circle cx="464" cy="396" r="32" fill="#FF9800" stroke-dasharray="4.8 4.8" stroke="#999" stroke-width="3.2" />
  <text x="464" y="405" text-anchor="middle" font-size="16" fill="white">C</text>
  <circle cx="576" cy="396" r="32" fill="#FF9800" stroke-dasharray="4.8 4.8" stroke="#999" stroke-width="3.2" />
  <text x="576" y="405" text-anchor="middle" font-size="16" fill="white">D</text>
  <text x="520" y="459" text-anchor="middle" font-size="17.6" fill="#999">"Lost" after reset</text>
  <line x1="272" y1="396" x2="320" y2="396" stroke="#333" stroke-width="3.2" />
  <line x1="384" y1="396" x2="432" y2="396" stroke="#999" stroke-width="3.2" stroke-dasharray="4.8 4.8" />
  <line x1="496" y1="396" x2="544" y2="396" stroke="#999" stroke-width="3.2" stroke-dasharray="4.8 4.8" />
  <rect x="720" y="360" width="448" height="270" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="944" y="414" text-anchor="middle" font-size="22.4" font-weight="bold">Recovery Methods:</text>
  <text x="752" y="459" font-size="19.2" font-family="monospace">git reflog</text>
  <text x="752" y="495" font-size="19.2" font-family="monospace">git fsck --lost-found</text>
  <text x="752" y="531" font-size="19.2" font-family="monospace">git log --all --oneline</text>
  <text x="752" y="567" font-size="19.2" font-family="monospace">  $( git fsck --no-reflog |</text>
  <text x="752" y="603" font-size="19.2" font-family="monospace">     awk '/dangling/ {print $3}' )</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="611.4286" y="40" text-anchor="middle" font-size="42.7158" font-weight="bold">Nothing is Really Lost (for 90 days)</text>
  <rect x="40" y="114.8387" width="1142.8571" height="187.0968" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="611.4286" y="170.9677" text-anchor="middle" font-size="28.4772" font-weight="bold">Git's Safety Features</text>
  <text x="78.0952" y="227.0968" font-size="23.1377">• Reflog tracks ALL HEAD movements (90 days default)</text>
  <text x="78.0952" y="264.5161" font-size="23.1377">• Dangling commits exist until garbage collection</text>
  <rect x="99.6416" y="341.178" width="71.193" height="71.193" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="135.2381" y="386.129" text-anchor="middle" font-size="17.7982" fill="var(--bg)">A</text>
  <rect x="232.975" y="341.178" width="71.193" height="71.193" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="268.5714" y="386.129" text-anchor="middle" font-size="17.7982" fill="var(--bg)">B</text>
  <rect x="366.308" y="341.178" width="71.193" height="71.193" rx="14" fill="var(--warn-fill)" stroke-dasharray="4.8 4.8" stroke="var(--text-faint)" stroke-width="3.2" filter="url(#shadow)"/>
  <text x="401.9048" y="386.129" text-anchor="middle" font-size="17.7982" fill="var(--bg)">C</text>
  <rect x="499.642" y="341.178" width="71.193" height="71.193" rx="14" fill="var(--warn-fill)" stroke-dasharray="4.8 4.8" stroke="var(--text-faint)" stroke-width="3.2" filter="url(#shadow)"/>
  <text x="535.2381" y="386.129" text-anchor="middle" font-size="17.7982" fill="var(--bg)">D</text>
  <text x="468.5714" y="442.2581" text-anchor="middle" font-size="19.5781" fill="var(--text-faint)">"Lost" after reset</text>
  <line x1="173.3333" y1="376.7742" x2="230.4762" y2="376.7742" stroke="var(--text)" stroke-width="2" />
  <line x1="306.6667" y1="376.7742" x2="363.8095" y2="376.7742" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4.8 4.8" />
  <line x1="440" y1="376.7742" x2="497.1429" y2="376.7742" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4.8 4.8" />
  <rect x="706.6667" y="339.3548" width="533.3333" height="280.6452" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="973.3333" y="395.4839" text-anchor="middle" font-size="24.9175" font-weight="bold">Recovery Methods:</text>
  <text x="744.7619" y="442.2581" font-size="21.3579" font-family="monospace">git reflog</text>
  <text x="744.7619" y="479.6774" font-size="21.3579" font-family="monospace">git fsck --lost-found</text>
  <text x="744.7619" y="517.0968" font-size="21.3579" font-family="monospace">git log --all --oneline</text>
  <text x="744.7619" y="554.5161" font-size="21.3579" font-family="monospace">  $( git fsck --no-reflog |</text>
  <text x="744.7619" y="591.9355" font-size="21.3579" font-family="monospace">     awk '/dangling/ {print $3}' )</text>
</svg>
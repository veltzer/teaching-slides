  <text x="74.2653" y="196.5079" text-anchor="middle" font-size="17.1328" fill="var(--bg)">A</text>
  <rect x="129.672" y="153.036" width="68.5306" height="68.5306" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="163.9371" y="196.5079" text-anchor="middle" font-size="17.1328" fill="var(--bg)">B</text>
  <rect x="219.344" y="153.036" width="68.5306" height="68.5306" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="253.6092" y="196.5079" text-anchor="middle" font-size="17.1328" fill="var(--bg)">C</text>
  <line x1="110.1341" y1="187.3016" x2="128.0685" y2="187.3016" stroke="var(--text)" stroke-width="2" />
  <line x1="199.8059" y1="187.3016" x2="217.7403" y2="187.3016" stroke="var(--text)" stroke-width="2" />
  <text x="74.2653" y="251.746" font-size="18.846">Dev 1 ✓</text>
  <text x="163.9371" y="251.746" font-size="18.846">Dev 2 ✓</text>
  <text x="253.6092" y="251.746" font-size="18.846">Dev 3 ✓</text>
  <text x="163.9371" y="334.6032" text-anchor="middle" font-size="23.9858" font-weight="bold">After Rewrite (Chaos!)</text>
  <rect x="40" y="373.989" width="68.5306" height="68.5306" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="74.2653" y="417.4603" text-anchor="middle" font-size="17.1328" fill="var(--bg)">A</text>
  <rect x="129.672" y="373.989" width="68.5306" height="68.5306" rx="14" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="163.9371" y="417.4603" text-anchor="middle" font-size="17.1328" fill="var(--bg)">B'</text>
  <rect x="219.344" y="373.989" width="68.5306" height="68.5306" rx="14" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="253.6092" y="417.4603" text-anchor="middle" font-size="17.1328" fill="var(--bg)">C'</text>
  <text x="163.9371" y="472.6984" font-size="18.846">Dev 1 (rewritten)</text>
  <rect x="40" y="521.29" width="68.5306" height="68.5306" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="74.2653" y="564.7619" text-anchor="middle" font-size="17.1328" fill="var(--bg)">A</text>
  <rect x="129.672" y="521.29" width="68.5306" height="68.5306" rx="14" fill="var(--danger-fill)" filter="url(#shadow)"/>
  <text x="163.9371" y="564.7619" text-anchor="middle" font-size="17.1328" fill="var(--bg)">B</text>
  <rect x="219.344" y="521.29" width="68.5306" height="68.5306" rx="14" fill="var(--danger-fill)" filter="url(#shadow)"/>
  <text x="253.6092" y="564.7619" text-anchor="middle" font-size="17.1328" fill="var(--bg)">C</text>
  <rect x="309.016" y="521.29" width="68.5306" height="68.5306" rx="14" fill="var(--info-fill)" filter="url(#shadow)"/>
  <text x="343.281" y="564.7619" text-anchor="middle" font-size="17.1328" fill="var(--bg)">D</text>
  <text x="208.7732" y="620" font-size="18.846">Dev 2 (conflicted!)</text>
  <rect x="612.2967" y="150.4762" width="627.7033" height="460.3175" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.004" filter="url(#shadow)"/>
  <text x="926.1484" y="205.7143" text-anchor="middle" font-size="27.4123" font-weight="bold">Problems Created:</text>
  <text x="648.1656" y="260.9524" font-size="22.2725">• Duplicate commits (B and B')</text>
  <text x="648.1656" y="306.9841" font-size="22.2725">• Merge conflicts everywhere</text>
  <text x="648.1656" y="353.0159" font-size="22.2725">• Lost work (commit D orphaned)</text>
  <text x="648.1656" y="399.0476" font-size="22.2725">• Confused team members</text>
  <text x="648.1656" y="445.0794" font-size="22.2725">• Broken CI/CD pipelines</text>
  <text x="648.1656" y="491.1111" font-size="22.2725">• History divergence</text>
  <text x="926.1484" y="555.5556" text-anchor="middle" font-size="23.9858" font-style="italic">Everyone must force pull and resolve!</text>
</svg>
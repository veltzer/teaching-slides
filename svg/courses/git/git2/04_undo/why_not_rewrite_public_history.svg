<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="612.2967" y="40" text-anchor="middle" font-size="41.1185" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">The Chaos of Rewriting</text>
  <text x="163.9371" y="113.6508" text-anchor="middle" font-size="23.9858" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Before (Everyone Synchronized)</text>
  <rect x="40" y="153.036" width="68.5306" height="68.5306" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="74.2653" y="196.5079" text-anchor="middle" font-size="17.1328" fill="var(--bg)" font-family="Arial, sans-serif">A</text>
  <rect x="129.672" y="153.036" width="68.5306" height="68.5306" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="163.9371" y="196.5079" text-anchor="middle" font-size="17.1328" fill="var(--bg)" font-family="Arial, sans-serif">B</text>
  <rect x="219.344" y="153.036" width="68.5306" height="68.5306" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="253.6092" y="196.5079" text-anchor="middle" font-size="17.1328" fill="var(--bg)" font-family="Arial, sans-serif">C</text>
  <line x1="110.1341" y1="187.3016" x2="128.0685" y2="187.3016" stroke="var(--text)" stroke-width="2" />
  <line x1="199.8059" y1="187.3016" x2="217.7403" y2="187.3016" stroke="var(--text)" stroke-width="2" />
  <text x="74.2653" y="251.746" font-size="18.846" font-family="Arial, sans-serif" fill="var(--text)">Dev 1 ✓</text>
  <text x="163.9371" y="251.746" font-size="18.846" font-family="Arial, sans-serif" fill="var(--text)">Dev 2 ✓</text>
  <text x="253.6092" y="251.746" font-size="18.846" font-family="Arial, sans-serif" fill="var(--text)">Dev 3 ✓</text>
  <text x="163.9371" y="334.6032" text-anchor="middle" font-size="23.9858" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">After Rewrite (Chaos!)</text>
  <rect x="40" y="373.989" width="68.5306" height="68.5306" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="74.2653" y="417.4603" text-anchor="middle" font-size="17.1328" fill="var(--bg)" font-family="Arial, sans-serif">A</text>
  <rect x="129.672" y="373.989" width="68.5306" height="68.5306" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="163.9371" y="417.4603" text-anchor="middle" font-size="17.1328" fill="var(--bg)" font-family="Arial, sans-serif">B'</text>
  <rect x="219.344" y="373.989" width="68.5306" height="68.5306" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="253.6092" y="417.4603" text-anchor="middle" font-size="17.1328" fill="var(--bg)" font-family="Arial, sans-serif">C'</text>
  <text x="163.9371" y="472.6984" font-size="18.846" font-family="Arial, sans-serif" fill="var(--text)">Dev 1 (rewritten)</text>
  <rect x="40" y="521.29" width="68.5306" height="68.5306" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="74.2653" y="564.7619" text-anchor="middle" font-size="17.1328" fill="var(--bg)" font-family="Arial, sans-serif">A</text>
  <rect x="129.672" y="521.29" width="68.5306" height="68.5306" rx="14" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="163.9371" y="564.7619" text-anchor="middle" font-size="17.1328" fill="var(--bg)" font-family="Arial, sans-serif">B</text>
  <rect x="219.344" y="521.29" width="68.5306" height="68.5306" rx="14" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="253.6092" y="564.7619" text-anchor="middle" font-size="17.1328" fill="var(--bg)" font-family="Arial, sans-serif">C</text>
  <rect x="309.016" y="521.29" width="68.5306" height="68.5306" rx="14" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="343.281" y="564.7619" text-anchor="middle" font-size="17.1328" fill="var(--bg)" font-family="Arial, sans-serif">D</text>
  <text x="208.7732" y="620" font-size="18.846" font-family="Arial, sans-serif" fill="var(--text)">Dev 2 (conflicted!)</text>
  <rect x="612.2967" y="150.4762" width="627.7033" height="460.3175" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.004" filter="url(#shadow)"/>
  <text x="926.1484" y="205.7143" text-anchor="middle" font-size="27.4123" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Problems Created:</text>
  <text x="648.1656" y="260.9524" font-size="22.2725" font-family="Arial, sans-serif" fill="var(--warn-text)">• Duplicate commits (B and B')</text>
  <text x="648.1656" y="306.9841" font-size="22.2725" font-family="Arial, sans-serif" fill="var(--warn-text)">• Merge conflicts everywhere</text>
  <text x="648.1656" y="353.0159" font-size="22.2725" font-family="Arial, sans-serif" fill="var(--warn-text)">• Lost work (commit D orphaned)</text>
  <text x="648.1656" y="399.0476" font-size="22.2725" font-family="Arial, sans-serif" fill="var(--warn-text)">• Confused team members</text>
  <text x="648.1656" y="445.0794" font-size="22.2725" font-family="Arial, sans-serif" fill="var(--warn-text)">• Broken CI/CD pipelines</text>
  <text x="648.1656" y="491.1111" font-size="22.2725" font-family="Arial, sans-serif" fill="var(--warn-text)">• History divergence</text>
  <text x="926.1484" y="555.5556" text-anchor="middle" font-size="23.9858" font-style="italic" font-family="Arial, sans-serif" fill="var(--warn-text)">Everyone must force pull and resolve!</text>
</svg>
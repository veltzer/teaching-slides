<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="613.1343" y="40" text-anchor="middle" font-size="41.091" font-weight="bold">The Chaos of Rewriting</text>
  <text x="165.3731" y="113.6508" text-anchor="middle" font-size="23.9698" font-weight="bold">Before (Everyone Synchronized)</text>
  <circle cx="75.8209" cy="187.3016" r="34.2425" fill="var(--ok-fill)" />
  <text x="75.8209" y="196.5079" text-anchor="middle" font-size="17.1213" fill="var(--bg)">A</text>
  <circle cx="165.3731" cy="187.3016" r="34.2425" fill="var(--ok-fill)" />
  <text x="165.3731" y="196.5079" text-anchor="middle" font-size="17.1213" fill="var(--bg)">B</text>
  <circle cx="254.9254" cy="187.3016" r="34.2425" fill="var(--ok-fill)" />
  <text x="254.9254" y="196.5079" text-anchor="middle" font-size="17.1213" fill="var(--bg)">C</text>
  <line x1="111.6418" y1="187.3016" x2="129.5522" y2="187.3016" stroke="var(--text)" stroke-width="2" />
  <line x1="201.194" y1="187.3016" x2="219.1045" y2="187.3016" stroke="var(--text)" stroke-width="2" />
  <text x="75.8209" y="251.746" font-size="18.8334">Dev 1 ✓</text>
  <text x="165.3731" y="251.746" font-size="18.8334">Dev 2 ✓</text>
  <text x="254.9254" y="251.746" font-size="18.8334">Dev 3 ✓</text>
  <text x="165.3731" y="334.6032" text-anchor="middle" font-size="23.9698" font-weight="bold">After Rewrite (Chaos!)</text>
  <circle cx="75.8209" cy="408.254" r="34.2425" fill="var(--ok-fill)" />
  <text x="75.8209" y="417.4603" text-anchor="middle" font-size="17.1213" fill="var(--bg)">A</text>
  <circle cx="165.3731" cy="408.254" r="34.2425" fill="var(--warn-fill)" />
  <text x="165.3731" y="417.4603" text-anchor="middle" font-size="17.1213" fill="var(--bg)">B'</text>
  <circle cx="254.9254" cy="408.254" r="34.2425" fill="var(--warn-fill)" />
  <text x="254.9254" y="417.4603" text-anchor="middle" font-size="17.1213" fill="var(--bg)">C'</text>
  <text x="165.3731" y="472.6984" font-size="18.8334">Dev 1 (rewritten)</text>
  <circle cx="75.8209" cy="555.5556" r="34.2425" fill="var(--ok-fill)" />
  <text x="75.8209" y="564.7619" text-anchor="middle" font-size="17.1213" fill="var(--bg)">A</text>
  <circle cx="165.3731" cy="555.5556" r="34.2425" fill="var(--danger-fill)" />
  <text x="165.3731" y="564.7619" text-anchor="middle" font-size="17.1213" fill="var(--bg)">B</text>
  <circle cx="254.9254" cy="555.5556" r="34.2425" fill="var(--danger-fill)" />
  <text x="254.9254" y="564.7619" text-anchor="middle" font-size="17.1213" fill="var(--bg)">C</text>
  <circle cx="344.4776" cy="555.5556" r="34.2425" fill="var(--info-fill)" />
  <text x="344.4776" y="564.7619" text-anchor="middle" font-size="17.1213" fill="var(--bg)">D</text>
  <text x="210.1493" y="620" font-size="18.8334">Dev 2 (conflicted!)</text>
  <rect x="613.1343" y="150.4762" width="626.8657" height="460.3175" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="926.5672" y="205.7143" text-anchor="middle" font-size="27.394" font-weight="bold">Problems Created:</text>
  <text x="648.9552" y="260.9524" font-size="22.2576">• Duplicate commits (B and B')</text>
  <text x="648.9552" y="306.9841" font-size="22.2576">• Merge conflicts everywhere</text>
  <text x="648.9552" y="353.0159" font-size="22.2576">• Lost work (commit D orphaned)</text>
  <text x="648.9552" y="399.0476" font-size="22.2576">• Confused team members</text>
  <text x="648.9552" y="445.0794" font-size="22.2576">• Broken CI/CD pipelines</text>
  <text x="648.9552" y="491.1111" font-size="22.2576">• History divergence</text>
  <text x="926.5672" y="555.5556" text-anchor="middle" font-size="23.9698" font-style="italic">Everyone must force pull and resolve!</text>
</svg>
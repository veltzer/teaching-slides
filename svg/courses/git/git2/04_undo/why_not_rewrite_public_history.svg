<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">The Chaos of Rewriting</text>
  <text x="240" y="144" text-anchor="middle" font-size="22.4" font-weight="bold">Before (Everyone Synchronized)</text>
  <circle cx="160" cy="216" r="32" fill="#4CAF50" />
  <text x="160" y="225" text-anchor="middle" font-size="16" fill="white">A</text>
  <circle cx="240" cy="216" r="32" fill="#4CAF50" />
  <text x="240" y="225" text-anchor="middle" font-size="16" fill="white">B</text>
  <circle cx="320" cy="216" r="32" fill="#4CAF50" />
  <text x="320" y="225" text-anchor="middle" font-size="16" fill="white">C</text>
  <line x1="192" y1="216" x2="208" y2="216" stroke="#333" stroke-width="3.2" />
  <line x1="272" y1="216" x2="288" y2="216" stroke="#333" stroke-width="3.2" />
  <text x="160" y="279" font-size="17.6">Dev 1 ✓</text>
  <text x="240" y="279" font-size="17.6">Dev 2 ✓</text>
  <text x="320" y="279" font-size="17.6">Dev 3 ✓</text>
  <text x="240" y="360" text-anchor="middle" font-size="22.4" font-weight="bold">After Rewrite (Chaos!)</text>
  <circle cx="160" cy="432" r="32" fill="#4CAF50" />
  <text x="160" y="441" text-anchor="middle" font-size="16" fill="white">A</text>
  <circle cx="240" cy="432" r="32" fill="#FF9800" />
  <text x="240" y="441" text-anchor="middle" font-size="16" fill="white">B'</text>
  <circle cx="320" cy="432" r="32" fill="#FF9800" />
  <text x="320" y="441" text-anchor="middle" font-size="16" fill="white">C'</text>
  <text x="240" y="495" font-size="17.6">Dev 1 (rewritten)</text>
  <circle cx="160" cy="576" r="32" fill="#4CAF50" />
  <text x="160" y="585" text-anchor="middle" font-size="16" fill="white">A</text>
  <circle cx="240" cy="576" r="32" fill="#F44336" />
  <text x="240" y="585" text-anchor="middle" font-size="16" fill="white">B</text>
  <circle cx="320" cy="576" r="32" fill="#F44336" />
  <text x="320" y="585" text-anchor="middle" font-size="16" fill="white">C</text>
  <circle cx="400" cy="576" r="32" fill="#9C27B0" />
  <text x="400" y="585" text-anchor="middle" font-size="16" fill="white">D</text>
  <text x="280" y="639" font-size="17.6">Dev 2 (conflicted!)</text>
  <rect x="640" y="180" width="560" height="450" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="920" y="234" text-anchor="middle" font-size="25.6" font-weight="bold">Problems Created:</text>
  <text x="672" y="288" font-size="20.8">• Duplicate commits (B and B')</text>
  <text x="672" y="333" font-size="20.8">• Merge conflicts everywhere</text>
  <text x="672" y="378" font-size="20.8">• Lost work (commit D orphaned)</text>
  <text x="672" y="423" font-size="20.8">• Confused team members</text>
  <text x="672" y="468" font-size="20.8">• Broken CI/CD pipelines</text>
  <text x="672" y="513" font-size="20.8">• History divergence</text>
  <text x="920" y="576" text-anchor="middle" font-size="22.4" font-style="italic">Everyone must force pull and resolve!</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">When to Use Each Reset Mode</text>
  <rect x="80" y="144" width="1120" height="144" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="640" y="189" text-anchor="middle" font-size="25.6" font-weight="bold">--soft: "I want to redo my commit"</text>
  <text x="112" y="234" font-size="20.8">Use case: Made 3 commits but want to combine them into one</text>
  <text x="112" y="270" font-size="19.2" font-family="monospace">git reset --soft HEAD~3 &amp;&amp; git commit -m "Feature complete"</text>
  <rect x="80" y="306" width="1120" height="144" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="351" text-anchor="middle" font-size="25.6" font-weight="bold">--mixed: "I want to unstage everything"</text>
  <text x="112" y="396" font-size="20.8">Use case: Added wrong files to staging, want to start over</text>
  <text x="112" y="432" font-size="19.2" font-family="monospace">git reset HEAD  # Unstages all files</text>
  <rect x="80" y="468" width="1120" height="144" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="640" y="513" text-anchor="middle" font-size="25.6" font-weight="bold">--hard: "I want to throw everything away"</text>
  <text x="112" y="558" font-size="20.8">Use case: Experiment failed, go back to clean state</text>
  <text x="112" y="594" font-size="19.2" font-family="monospace">git reset --hard HEAD  # ⚠️ Loses all uncommitted work!</text>
</svg>
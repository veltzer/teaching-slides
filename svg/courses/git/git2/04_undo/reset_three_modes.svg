<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Git Reset Modes</text>
  <rect x="79.0123" y="142.2222" width="347.6543" height="497.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="252.8395" y="204.4444" text-anchor="middle" font-size="28.4444" font-weight="bold">--soft</text>
  <circle cx="158.0247" cy="266.6667" r="31.6049" fill="var(--ok-fill)" />
  <text x="158.0247" y="275.5556" text-anchor="middle" font-size="15.8025" fill="var(--bg)">HEAD</text>
  <text x="221.2346" y="275.5556" font-size="22.1235">✓ Moves</text>
  <rect x="126.4198" y="320" width="63.2099" height="53.3333" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="158.0247" y="355.5556" text-anchor="middle" font-size="15.8025" fill="var(--bg)">Index</text>
  <text x="221.2346" y="346.6667" font-size="22.1235">✗ Unchanged</text>
  <rect x="126.4198" y="391.1111" width="63.2099" height="53.3333" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="158.0247" y="426.6667" text-anchor="middle" font-size="15.8025" fill="var(--bg)">Work</text>
  <text x="221.2346" y="417.7778" font-size="22.1235">✗ Unchanged</text>
  <text x="252.8395" y="497.7778" text-anchor="middle" font-size="18.963" font-style="italic">Changes stay staged</text>
  <text x="252.8395" y="533.3333" text-anchor="middle" font-size="18.963">Use: Squash commits</text>
  <rect x="458.2716" y="142.2222" width="347.6543" height="497.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="204.4444" text-anchor="middle" font-size="28.4444" font-weight="bold">--mixed (default)</text>
  <circle cx="537.284" cy="266.6667" r="31.6049" fill="var(--warn-fill)" />
  <text x="537.284" y="275.5556" text-anchor="middle" font-size="15.8025" fill="var(--bg)">HEAD</text>
  <text x="600.4938" y="275.5556" font-size="22.1235">✓ Moves</text>
  <rect x="505.679" y="320" width="63.2099" height="53.3333" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="537.284" y="355.5556" text-anchor="middle" font-size="15.8025" fill="var(--bg)">Index</text>
  <text x="600.4938" y="346.6667" font-size="22.1235">✓ Updates</text>
  <rect x="505.679" y="391.1111" width="63.2099" height="53.3333" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="537.284" y="426.6667" text-anchor="middle" font-size="15.8025" fill="var(--bg)">Work</text>
  <text x="600.4938" y="417.7778" font-size="22.1235">✗ Unchanged</text>
  <text x="632.0988" y="497.7778" text-anchor="middle" font-size="18.963" font-style="italic">Changes unstaged</text>
  <text x="632.0988" y="533.3333" text-anchor="middle" font-size="18.963">Use: Unstage files</text>
  <rect x="837.5309" y="142.2222" width="347.6543" height="497.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1011.358" y="204.4444" text-anchor="middle" font-size="28.4444" font-weight="bold">--hard</text>
  <circle cx="916.5432" cy="266.6667" r="31.6049" fill="var(--danger-fill)" />
  <text x="916.5432" y="275.5556" text-anchor="middle" font-size="15.8025" fill="var(--bg)">HEAD</text>
  <text x="979.7531" y="275.5556" font-size="22.1235">✓ Moves</text>
  <rect x="884.9383" y="320" width="63.2099" height="53.3333" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="916.5432" y="355.5556" text-anchor="middle" font-size="15.8025" fill="var(--bg)">Index</text>
  <text x="979.7531" y="346.6667" font-size="22.1235">✓ Updates</text>
  <rect x="884.9383" y="391.1111" width="63.2099" height="53.3333" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="916.5432" y="426.6667" text-anchor="middle" font-size="15.8025" fill="var(--bg)">Work</text>
  <text x="979.7531" y="417.7778" font-size="22.1235">✓ Updates</text>
  <text x="1011.358" y="497.7778" text-anchor="middle" font-size="18.963" font-style="italic">⚠️ Loses changes!</text>
  <text x="1011.358" y="533.3333" text-anchor="middle" font-size="18.963">Use: Discard work</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="39.8855" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Git Reset Modes</text>
  <rect x="40" y="112.5" width="377.1428" height="507.5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="228.5715" y="175.9375" text-anchor="middle" font-size="29.9141" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">--soft</text>
  <rect x="92.4764" y="206.137" width="66.4758" height="66.4758" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="125.7143" y="248.4376" text-anchor="middle" font-size="16.619" fill="var(--bg)" font-family="Arial, sans-serif">HEAD</text>
  <text x="194.2858" y="248.4376" font-size="23.2666" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Moves</text>
  <rect x="91.4287" y="293.75" width="68.5715" height="54.375" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.7143" y="330.0001" text-anchor="middle" font-size="16.619" fill="var(--bg)" font-family="Arial, sans-serif">Index</text>
  <text x="194.2858" y="320.9375" font-size="23.2666" font-family="Arial, sans-serif" fill="var(--ok-text)">✗ Unchanged</text>
  <rect x="91.4287" y="366.25" width="68.5715" height="54.375" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.7143" y="402.5" text-anchor="middle" font-size="16.619" fill="var(--bg)" font-family="Arial, sans-serif">Work</text>
  <text x="194.2858" y="393.4375" font-size="23.2666" font-family="Arial, sans-serif" fill="var(--ok-text)">✗ Unchanged</text>
  <text x="228.5715" y="475" text-anchor="middle" font-size="19.9428" font-style="italic" font-family="Arial, sans-serif" fill="var(--ok-text)">Changes stay staged</text>
  <text x="228.5715" y="511.25" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--ok-text)">Use: Squash commits</text>
  <rect x="451.4286" y="112.5" width="377.1428" height="507.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="175.9375" text-anchor="middle" font-size="29.9141" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">--mixed (default)</text>
  <rect x="503.905" y="206.137" width="66.4758" height="66.4758" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="537.1429" y="248.4376" text-anchor="middle" font-size="16.619" fill="var(--bg)" font-family="Arial, sans-serif">HEAD</text>
  <text x="605.7143" y="248.4376" font-size="23.2666" font-family="Arial, sans-serif" fill="var(--warn-text)">✓ Moves</text>
  <rect x="502.8572" y="293.75" width="68.5715" height="54.375" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="537.1429" y="330.0001" text-anchor="middle" font-size="16.619" fill="var(--bg)" font-family="Arial, sans-serif">Index</text>
  <text x="605.7143" y="320.9375" font-size="23.2666" font-family="Arial, sans-serif" fill="var(--warn-text)">✓ Updates</text>
  <rect x="502.8572" y="366.25" width="68.5715" height="54.375" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="537.1429" y="402.5" text-anchor="middle" font-size="16.619" fill="var(--bg)" font-family="Arial, sans-serif">Work</text>
  <text x="605.7143" y="393.4375" font-size="23.2666" font-family="Arial, sans-serif" fill="var(--warn-text)">✗ Unchanged</text>
  <text x="640.0001" y="475" text-anchor="middle" font-size="19.9428" font-style="italic" font-family="Arial, sans-serif" fill="var(--warn-text)">Changes unstaged</text>
  <text x="640.0001" y="511.25" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--warn-text)">Use: Unstage files</text>
  <rect x="862.8572" y="112.5" width="377.1428" height="507.5" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1051.4285" y="175.9375" text-anchor="middle" font-size="29.9141" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">--hard</text>
  <rect x="915.334" y="206.137" width="66.4758" height="66.4758" rx="14" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="948.5714" y="248.4376" text-anchor="middle" font-size="16.619" fill="var(--bg)" font-family="Arial, sans-serif">HEAD</text>
  <text x="1017.1429" y="248.4376" font-size="23.2666" font-family="Arial, sans-serif" fill="var(--danger-text)">✓ Moves</text>
  <rect x="914.2857" y="293.75" width="68.5715" height="54.375" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.5714" y="330.0001" text-anchor="middle" font-size="16.619" fill="var(--bg)" font-family="Arial, sans-serif">Index</text>
  <text x="1017.1429" y="320.9375" font-size="23.2666" font-family="Arial, sans-serif" fill="var(--danger-text)">✓ Updates</text>
  <rect x="914.2857" y="366.25" width="68.5715" height="54.375" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.5714" y="402.5" text-anchor="middle" font-size="16.619" fill="var(--bg)" font-family="Arial, sans-serif">Work</text>
  <text x="1017.1429" y="393.4375" font-size="23.2666" font-family="Arial, sans-serif" fill="var(--danger-text)">✓ Updates</text>
  <text x="1051.4285" y="475" text-anchor="middle" font-size="19.9428" font-style="italic" font-family="Arial, sans-serif" fill="var(--danger-text)">⚠️ Loses changes!</text>
  <text x="1051.4285" y="511.25" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--danger-text)">Use: Discard work</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Git Reset Modes</text>
  <rect x="80" y="144" width="352" height="504" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="256" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">--soft</text>
  <circle cx="160" cy="270" r="32" fill="#4CAF50" />
  <text x="160" y="279" text-anchor="middle" font-size="16" fill="white">HEAD</text>
  <text x="224" y="279" font-size="22.4">✓ Moves</text>
  <rect x="128" y="324" width="64" height="54" fill="#81C784" />
  <text x="160" y="360" text-anchor="middle" font-size="16" fill="white">Index</text>
  <text x="224" y="351" font-size="22.4">✗ Unchanged</text>
  <rect x="128" y="396" width="64" height="54" fill="#81C784" />
  <text x="160" y="432" text-anchor="middle" font-size="16" fill="white">Work</text>
  <text x="224" y="423" font-size="22.4">✗ Unchanged</text>
  <text x="256" y="504" text-anchor="middle" font-size="19.2" font-style="italic">Changes stay staged</text>
  <text x="256" y="540" text-anchor="middle" font-size="19.2">Use: Squash commits</text>
  <rect x="464" y="144" width="352" height="504" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">--mixed (default)</text>
  <circle cx="544" cy="270" r="32" fill="#FF9800" />
  <text x="544" y="279" text-anchor="middle" font-size="16" fill="white">HEAD</text>
  <text x="608" y="279" font-size="22.4">✓ Moves</text>
  <rect x="512" y="324" width="64" height="54" fill="#FFB74D" />
  <text x="544" y="360" text-anchor="middle" font-size="16" fill="white">Index</text>
  <text x="608" y="351" font-size="22.4">✓ Updates</text>
  <rect x="512" y="396" width="64" height="54" fill="#81C784" />
  <text x="544" y="432" text-anchor="middle" font-size="16" fill="white">Work</text>
  <text x="608" y="423" font-size="22.4">✗ Unchanged</text>
  <text x="640" y="504" text-anchor="middle" font-size="19.2" font-style="italic">Changes unstaged</text>
  <text x="640" y="540" text-anchor="middle" font-size="19.2">Use: Unstage files</text>
  <rect x="848" y="144" width="352" height="504" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="1024" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">--hard</text>
  <circle cx="928" cy="270" r="32" fill="#F44336" />
  <text x="928" y="279" text-anchor="middle" font-size="16" fill="white">HEAD</text>
  <text x="992" y="279" font-size="22.4">✓ Moves</text>
  <rect x="896" y="324" width="64" height="54" fill="#EF5350" />
  <text x="928" y="360" text-anchor="middle" font-size="16" fill="white">Index</text>
  <text x="992" y="351" font-size="22.4">✓ Updates</text>
  <rect x="896" y="396" width="64" height="54" fill="#EF5350" />
  <text x="928" y="432" text-anchor="middle" font-size="16" fill="white">Work</text>
  <text x="992" y="423" font-size="22.4">✓ Updates</text>
  <text x="1024" y="504" text-anchor="middle" font-size="19.2" font-style="italic">⚠️ Loses changes!</text>
  <text x="1024" y="540" text-anchor="middle" font-size="19.2">Use: Discard work</text>
</svg>
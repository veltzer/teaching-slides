<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Safer Force Pushing</ns0:text>
  <ns0:rect x="79.0123" y="142.2222" width="505.679" height="497.7778" fill="#FFEBEE" stroke="#C62828" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="331.8519" y="204.4444" text-anchor="middle" font-size="28.4444" font-weight="bold">--force</ns0:text>
  <ns0:text x="331.8519" y="257.7778" text-anchor="middle" font-size="22.1235">⚠️ Dangerous!</ns0:text>
  <ns0:text x="110.6173" y="320" font-size="20.5432">• Overwrites remote</ns0:text>
  <ns0:text x="110.6173" y="364.4444" font-size="20.5432">• No safety checks</ns0:text>
  <ns0:text x="110.6173" y="408.8889" font-size="20.5432">• Loses others' commits</ns0:text>
  <ns0:text x="110.6173" y="453.3333" font-size="20.5432">• Can't be undone</ns0:text>
  <ns0:rect x="110.6173" y="506.6667" width="442.4691" height="88.8889" fill="#D32F2F" rx="7.9012" />
  <ns0:text x="331.8519" y="560" text-anchor="middle" font-size="22.1235" fill="white">Will destroy teammates' work!</ns0:text>
  <ns0:rect x="679.5062" y="142.2222" width="505.679" height="497.7778" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="932.3457" y="204.4444" text-anchor="middle" font-size="28.4444" font-weight="bold">--force-lease</ns0:text>
  <ns0:text x="932.3457" y="257.7778" text-anchor="middle" font-size="22.1235">✓ Safer option</ns0:text>
  <ns0:text x="711.1111" y="320" font-size="20.5432">• Checks remote first</ns0:text>
  <ns0:text x="711.1111" y="364.4444" font-size="20.5432">• Fails if others pushed</ns0:text>
  <ns0:text x="711.1111" y="408.8889" font-size="20.5432">• Protects team's work</ns0:text>
  <ns0:text x="711.1111" y="453.3333" font-size="20.5432">• Requires pull first</ns0:text>
  <ns0:rect x="711.1111" y="506.6667" width="442.4691" height="88.8889" fill="#4CAF50" rx="7.9012" />
  <ns0:text x="932.3457" y="560" text-anchor="middle" font-size="22.1235" fill="white">Fails safely if remote changed</ns0:text>
</ns0:svg>
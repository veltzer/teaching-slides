<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Safer Force Pushing</text>
  <rect x="80" y="144" width="512" height="504" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="336" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">--force</text>
  <text x="336" y="261" text-anchor="middle" font-size="22.4">⚠️ Dangerous!</text>
  <text x="112" y="324" font-size="20.8">• Overwrites remote</text>
  <text x="112" y="369" font-size="20.8">• No safety checks</text>
  <text x="112" y="414" font-size="20.8">• Loses others' commits</text>
  <text x="112" y="459" font-size="20.8">• Can't be undone</text>
  <rect x="112" y="513" width="448" height="90" fill="#D32F2F" rx="8" />
  <text x="336" y="567" text-anchor="middle" font-size="22.4" fill="white">Will destroy teammates' work!</text>
  <rect x="688" y="144" width="512" height="504" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="944" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">--force-lease</text>
  <text x="944" y="261" text-anchor="middle" font-size="22.4">✓ Safer option</text>
  <text x="720" y="324" font-size="20.8">• Checks remote first</text>
  <text x="720" y="369" font-size="20.8">• Fails if others pushed</text>
  <text x="720" y="414" font-size="20.8">• Protects team's work</text>
  <text x="720" y="459" font-size="20.8">• Requires pull first</text>
  <rect x="720" y="513" width="448" height="90" fill="#4CAF50" rx="8" />
  <text x="944" y="567" text-anchor="middle" font-size="22.4" fill="white">Fails safely if remote changed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="512" y="57.6" text-anchor="middle" font-size="30.72" font-weight="bold">Binary Search for Bugs</text>
  <circle cx="128" cy="216" r="25.6" fill="var(--ok-fill)" />
  <text x="128" y="223.2" text-anchor="middle" font-size="12.8" fill="var(--bg)">v1.0</text>
  <text x="128" y="259.2" font-size="14.08" fill="var(--ok-accent)">Good</text>
  <circle cx="230.4" cy="216" r="25.6" fill="var(--text-faint)" />
  <text x="230.4" y="223.2" text-anchor="middle" font-size="12.8" fill="var(--bg)">?</text>
  <circle cx="332.8" cy="216" r="25.6" fill="var(--text-faint)" />
  <text x="332.8" y="223.2" text-anchor="middle" font-size="12.8" fill="var(--bg)">?</text>
  <circle cx="435.2" cy="216" r="25.6" fill="var(--text-faint)" />
  <text x="435.2" y="223.2" text-anchor="middle" font-size="12.8" fill="var(--bg)">?</text>
  <circle cx="537.6" cy="216" r="25.6" fill="var(--text-faint)" />
  <text x="537.6" y="223.2" text-anchor="middle" font-size="12.8" fill="var(--bg)">?</text>
  <circle cx="640" cy="216" r="25.6" fill="var(--text-faint)" />
  <text x="640" y="223.2" text-anchor="middle" font-size="12.8" fill="var(--bg)">?</text>
  <circle cx="742.4" cy="216" r="25.6" fill="var(--text-faint)" />
  <text x="742.4" y="223.2" text-anchor="middle" font-size="12.8" fill="var(--bg)">?</text>
  <circle cx="844.8" cy="216" r="25.6" fill="var(--danger-fill)" />
  <text x="844.8" y="223.2" text-anchor="middle" font-size="12.8" fill="var(--bg)">HEAD</text>
  <text x="844.8" y="259.2" font-size="14.08" fill="var(--danger-accent)">Bad</text>
  <line x1="153.6" y1="216" x2="819.2" y2="216" stroke="var(--text)" stroke-width="2" />
  <path d="M 486.4 172.8 L 435.2 201.6" stroke="var(--primary-border)" stroke-width="2.56" marker-end="url(#arrow)" />
  <text x="486.4" y="158.4" font-size="15.36" fill="var(--primary-accent)">Step 1: Test middle</text>
  <circle cx="435.2" cy="316.8" r="25.6" fill="var(--ok-fill)" />
  <text x="435.2" y="324" text-anchor="middle" font-size="12.8" fill="var(--bg)">Good</text>
  <path d="M 640 360 L 640 331.2" stroke="var(--warn-border)" stroke-width="2.56" marker-end="url(#arrow)" />
  <text x="640" y="388.8" font-size="15.36" fill="var(--warn-accent)">Step 2: Test between</text>
  <circle cx="640" cy="417.6" r="25.6" fill="var(--danger-fill)" />
  <text x="640" y="424.8" text-anchor="middle" font-size="12.8" fill="var(--bg)">Bad</text>
  <path d="M 537.6 460.8 L 537.6 432" stroke="var(--info-border)" stroke-width="2.56" marker-end="url(#arrow)" />
  <text x="537.6" y="489.6" font-size="15.36" fill="var(--info-accent)">Step 3: Narrow down</text>
  <text x="537.6" y="518.4" font-size="14.08" fill="var(--info-accent)">Found: First bad commit!</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" />
    </marker>
  </defs>
</svg>
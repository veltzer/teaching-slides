<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="614.9254" y="90.2239" text-anchor="middle" font-size="40.1194" font-weight="bold">Reordering with Interactive Rebase</text>
  <text x="280.597" y="165.4478" text-anchor="middle" font-size="23.403" font-weight="bold">Before</text>
  <circle cx="113.4328" cy="240.6716" r="33.4328" fill="var(--ok-fill)" />
  <text x="113.4328" y="250.0746" text-anchor="middle" font-size="16.7164" fill="var(--bg)">main</text>
  <circle cx="247.1642" cy="240.6716" r="33.4328" fill="var(--warn-fill)" />
  <text x="247.1642" y="250.0746" text-anchor="middle" font-size="16.7164" fill="var(--bg)">docs</text>
  <circle cx="380.8955" cy="240.6716" r="33.4328" fill="var(--primary-fill)" />
  <text x="380.8955" y="250.0746" text-anchor="middle" font-size="16.7164" fill="var(--bg)">feat</text>
  <circle cx="514.6269" cy="240.6716" r="33.4328" fill="var(--info-fill)" />
  <text x="514.6269" y="250.0746" text-anchor="middle" font-size="16.7164" fill="var(--bg)">test</text>
  <text x="314.0299" y="306.4925" text-anchor="middle" font-size="18.3881">Illogical order</text>
  <rect x="698.5075" y="184.2537" width="501.4925" height="150.4478" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="949.2537" y="231.2687" text-anchor="middle" font-size="20.0597" font-family="monospace">git rebase -i HEAD~3</text>
  <text x="731.9403" y="268.8806" font-size="18.3881" font-family="monospace">pick feat</text>
  <text x="731.9403" y="297.0896" font-size="18.3881" font-family="monospace">pick test</text>
  <text x="731.9403" y="325.2985" font-size="18.3881" font-family="monospace">pick docs</text>
  <text x="280.597" y="428.7313" text-anchor="middle" font-size="23.403" font-weight="bold">After (Reordered)</text>
  <circle cx="113.4328" cy="503.9552" r="33.4328" fill="var(--ok-fill)" />
  <text x="113.4328" y="513.3582" text-anchor="middle" font-size="16.7164" fill="var(--bg)">main</text>
  <circle cx="247.1642" cy="503.9552" r="33.4328" fill="var(--primary-fill)" />
  <text x="247.1642" y="513.3582" text-anchor="middle" font-size="16.7164" fill="var(--bg)">feat</text>
  <circle cx="380.8955" cy="503.9552" r="33.4328" fill="var(--info-fill)" />
  <text x="380.8955" y="513.3582" text-anchor="middle" font-size="16.7164" fill="var(--bg)">test</text>
  <circle cx="514.6269" cy="503.9552" r="33.4328" fill="var(--warn-fill)" />
  <text x="514.6269" y="513.3582" text-anchor="middle" font-size="16.7164" fill="var(--bg)">docs</text>
  <text x="314.0299" y="569.7761" text-anchor="middle" font-size="18.3881">Logical order!</text>
  <line x1="146.8657" y1="240.6716" x2="481.194" y2="240.6716" stroke="var(--text)" stroke-width="2" />
  <line x1="146.8657" y1="503.9552" x2="481.194" y2="503.9552" stroke="var(--text)" stroke-width="2" />
</svg>
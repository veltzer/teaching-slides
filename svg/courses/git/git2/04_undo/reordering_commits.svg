<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Reordering with Interactive Rebase</text>
  <text x="320" y="144" text-anchor="middle" font-size="22.4" font-weight="bold">Before</text>
  <circle cx="160" cy="216" r="32" fill="var(--ok-fill)" />
  <text x="160" y="225" text-anchor="middle" font-size="16" fill="var(--bg)">main</text>
  <circle cx="288" cy="216" r="32" fill="var(--warn-fill)" />
  <text x="288" y="225" text-anchor="middle" font-size="16" fill="var(--bg)">docs</text>
  <circle cx="416" cy="216" r="32" fill="var(--primary-fill)" />
  <text x="416" y="225" text-anchor="middle" font-size="16" fill="var(--bg)">feat</text>
  <circle cx="544" cy="216" r="32" fill="var(--info-fill)" />
  <text x="544" y="225" text-anchor="middle" font-size="16" fill="var(--bg)">test</text>
  <text x="352" y="279" text-anchor="middle" font-size="17.6">Illogical order</text>
  <rect x="720" y="162" width="480" height="144" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="960" y="207" text-anchor="middle" font-size="19.2" font-family="monospace">git rebase -i HEAD~3</text>
  <text x="752" y="243" font-size="17.6" font-family="monospace">pick feat</text>
  <text x="752" y="270" font-size="17.6" font-family="monospace">pick test</text>
  <text x="752" y="297" font-size="17.6" font-family="monospace">pick docs</text>
  <text x="320" y="396" text-anchor="middle" font-size="22.4" font-weight="bold">After (Reordered)</text>
  <circle cx="160" cy="468" r="32" fill="var(--ok-fill)" />
  <text x="160" y="477" text-anchor="middle" font-size="16" fill="var(--bg)">main</text>
  <circle cx="288" cy="468" r="32" fill="var(--primary-fill)" />
  <text x="288" y="477" text-anchor="middle" font-size="16" fill="var(--bg)">feat</text>
  <circle cx="416" cy="468" r="32" fill="var(--info-fill)" />
  <text x="416" y="477" text-anchor="middle" font-size="16" fill="var(--bg)">test</text>
  <circle cx="544" cy="468" r="32" fill="var(--warn-fill)" />
  <text x="544" y="477" text-anchor="middle" font-size="16" fill="var(--bg)">docs</text>
  <text x="352" y="531" text-anchor="middle" font-size="17.6">Logical order!</text>
  <line x1="192" y1="216" x2="512" y2="216" stroke="var(--text)" stroke-width="2" />
  <line x1="192" y1="468" x2="512" y2="468" stroke="var(--text)" stroke-width="2" />
</svg>
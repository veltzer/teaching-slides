<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Reordering with Interactive Rebase</text>
  <text x="320" y="144" text-anchor="middle" font-size="22.4" font-weight="bold">Before</text>
  <circle cx="160" cy="216" r="32" fill="#4CAF50" />
  <text x="160" y="225" text-anchor="middle" font-size="16" fill="white">main</text>
  <circle cx="288" cy="216" r="32" fill="#FF9800" />
  <text x="288" y="225" text-anchor="middle" font-size="16" fill="white">docs</text>
  <circle cx="416" cy="216" r="32" fill="#2196F3" />
  <text x="416" y="225" text-anchor="middle" font-size="16" fill="white">feat</text>
  <circle cx="544" cy="216" r="32" fill="#9C27B0" />
  <text x="544" y="225" text-anchor="middle" font-size="16" fill="white">test</text>
  <text x="352" y="279" text-anchor="middle" font-size="17.6">Illogical order</text>
  <rect x="720" y="162" width="480" height="144" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="960" y="207" text-anchor="middle" font-size="19.2" font-family="monospace">git rebase -i HEAD~3</text>
  <text x="752" y="243" font-size="17.6" font-family="monospace">pick feat</text>
  <text x="752" y="270" font-size="17.6" font-family="monospace">pick test</text>
  <text x="752" y="297" font-size="17.6" font-family="monospace">pick docs</text>
  <text x="320" y="396" text-anchor="middle" font-size="22.4" font-weight="bold">After (Reordered)</text>
  <circle cx="160" cy="468" r="32" fill="#4CAF50" />
  <text x="160" y="477" text-anchor="middle" font-size="16" fill="white">main</text>
  <circle cx="288" cy="468" r="32" fill="#2196F3" />
  <text x="288" y="477" text-anchor="middle" font-size="16" fill="white">feat</text>
  <circle cx="416" cy="468" r="32" fill="#9C27B0" />
  <text x="416" y="477" text-anchor="middle" font-size="16" fill="white">test</text>
  <circle cx="544" cy="468" r="32" fill="#FF9800" />
  <text x="544" y="477" text-anchor="middle" font-size="16" fill="white">docs</text>
  <text x="352" y="531" text-anchor="middle" font-size="17.6">Logical order!</text>
  <line x1="192" y1="216" x2="512" y2="216" stroke="#333" stroke-width="3.2" />
  <line x1="192" y1="468" x2="512" y2="468" stroke="#333" stroke-width="3.2" />
</svg>
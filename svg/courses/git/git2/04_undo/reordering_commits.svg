<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="614.3199" y="40" text-anchor="middle" font-size="45.6269" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Reordering with Interactive Rebase</text>
  <text x="256.7881" y="130.9804" text-anchor="middle" font-size="26.6157" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Before</text>
  <rect x="40" y="183.938" width="76.0448" height="76.0448" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="78.0224" y="233.3333" text-anchor="middle" font-size="19.0112" fill="var(--bg)" font-family="Arial, sans-serif">main</text>
  <rect x="183.013" y="183.938" width="76.0448" height="76.0448" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="221.035" y="233.3333" text-anchor="middle" font-size="19.0112" fill="var(--bg)" font-family="Arial, sans-serif">docs</text>
  <rect x="326.025" y="183.938" width="76.0448" height="76.0448" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="364.0475" y="233.3333" text-anchor="middle" font-size="19.0112" fill="var(--bg)" font-family="Arial, sans-serif">feat</text>
  <rect x="469.038" y="183.938" width="76.0448" height="76.0448" rx="14" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="507.0603" y="233.3333" text-anchor="middle" font-size="19.0112" fill="var(--bg)" font-family="Arial, sans-serif">test</text>
  <text x="292.5414" y="301.5686" text-anchor="middle" font-size="20.9124" font-family="Arial, sans-serif" fill="var(--text)">Illogical order</text>
  <rect x="703.7026" y="153.7254" width="536.2974" height="181.9608" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="5.9999" filter="url(#shadow)"/>
  <text x="971.8513" y="210.5883" text-anchor="middle" font-size="22.8135" font-family="Courier New, monospace" fill="var(--warn-text)">git rebase -i HEAD~3</text>
  <text x="739.4558" y="256.0784" font-size="20.9124" font-family="Courier New, monospace" fill="var(--warn-text)">pick feat</text>
  <text x="739.4558" y="290.1961" font-size="20.9124" font-family="Courier New, monospace" fill="var(--warn-text)">pick test</text>
  <text x="739.4558" y="324.3137" font-size="20.9124" font-family="Courier New, monospace" fill="var(--warn-text)">pick docs</text>
  <text x="256.7881" y="449.4117" text-anchor="middle" font-size="26.6157" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">After (Reordered)</text>
  <rect x="40" y="502.37" width="76.0448" height="76.0448" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="78.0224" y="551.7647" text-anchor="middle" font-size="19.0112" fill="var(--bg)" font-family="Arial, sans-serif">main</text>
  <rect x="183.013" y="502.37" width="76.0448" height="76.0448" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="221.035" y="551.7647" text-anchor="middle" font-size="19.0112" fill="var(--bg)" font-family="Arial, sans-serif">feat</text>
  <rect x="326.025" y="502.37" width="76.0448" height="76.0448" rx="14" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="364.0475" y="551.7647" text-anchor="middle" font-size="19.0112" fill="var(--bg)" font-family="Arial, sans-serif">test</text>
  <rect x="469.038" y="502.37" width="76.0448" height="76.0448" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="507.0603" y="551.7647" text-anchor="middle" font-size="19.0112" fill="var(--bg)" font-family="Arial, sans-serif">docs</text>
  <text x="292.5414" y="620" text-anchor="middle" font-size="20.9124" font-family="Arial, sans-serif" fill="var(--text)">Logical order!</text>
  <line x1="113.7755" y1="221.9607" x2="471.307" y2="221.9607" stroke="var(--text)" stroke-width="2" />
  <line x1="113.7755" y1="540.3921" x2="471.307" y2="540.3921" stroke="var(--text)" stroke-width="2" />
</svg>
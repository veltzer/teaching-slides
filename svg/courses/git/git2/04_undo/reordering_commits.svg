<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="614.3199" y="40" text-anchor="middle" font-size="45.6269" font-weight="bold">Reordering with Interactive Rebase</text>
  <text x="256.7881" y="130.9804" text-anchor="middle" font-size="26.6157" font-weight="bold">Before</text>
  <rect x="40" y="183.938" width="76.0448" height="76.0448" rx="14" fill="var(--ok-fill)"/>
  <text x="78.0224" y="233.3333" text-anchor="middle" font-size="19.0112" fill="var(--bg)">main</text>
  <rect x="183.013" y="183.938" width="76.0448" height="76.0448" rx="14" fill="var(--warn-fill)"/>
  <text x="221.035" y="233.3333" text-anchor="middle" font-size="19.0112" fill="var(--bg)">docs</text>
  <rect x="326.025" y="183.938" width="76.0448" height="76.0448" rx="14" fill="var(--primary-fill)"/>
  <text x="364.0475" y="233.3333" text-anchor="middle" font-size="19.0112" fill="var(--bg)">feat</text>
  <rect x="469.038" y="183.938" width="76.0448" height="76.0448" rx="14" fill="var(--info-fill)"/>
  <text x="507.0603" y="233.3333" text-anchor="middle" font-size="19.0112" fill="var(--bg)">test</text>
  <text x="292.5414" y="301.5686" text-anchor="middle" font-size="20.9124">Illogical order</text>
  <rect x="703.7026" y="153.7254" width="536.2974" height="181.9608" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="5.9999" />
  <text x="971.8513" y="210.5883" text-anchor="middle" font-size="22.8135" font-family="monospace">git rebase -i HEAD~3</text>
  <text x="739.4558" y="256.0784" font-size="20.9124" font-family="monospace">pick feat</text>
  <text x="739.4558" y="290.1961" font-size="20.9124" font-family="monospace">pick test</text>
  <text x="739.4558" y="324.3137" font-size="20.9124" font-family="monospace">pick docs</text>
  <text x="256.7881" y="449.4117" text-anchor="middle" font-size="26.6157" font-weight="bold">After (Reordered)</text>
  <rect x="40" y="502.37" width="76.0448" height="76.0448" rx="14" fill="var(--ok-fill)"/>
  <text x="78.0224" y="551.7647" text-anchor="middle" font-size="19.0112" fill="var(--bg)">main</text>
  <rect x="183.013" y="502.37" width="76.0448" height="76.0448" rx="14" fill="var(--primary-fill)"/>
  <text x="221.035" y="551.7647" text-anchor="middle" font-size="19.0112" fill="var(--bg)">feat</text>
  <rect x="326.025" y="502.37" width="76.0448" height="76.0448" rx="14" fill="var(--info-fill)"/>
  <text x="364.0475" y="551.7647" text-anchor="middle" font-size="19.0112" fill="var(--bg)">test</text>
  <rect x="469.038" y="502.37" width="76.0448" height="76.0448" rx="14" fill="var(--warn-fill)"/>
  <text x="507.0603" y="551.7647" text-anchor="middle" font-size="19.0112" fill="var(--bg)">docs</text>
  <text x="292.5414" y="620" text-anchor="middle" font-size="20.9124">Logical order!</text>
  <line x1="113.7755" y1="221.9607" x2="471.307" y2="221.9607" stroke="var(--text)" stroke-width="2" />
  <line x1="113.7755" y1="540.3921" x2="471.307" y2="540.3921" stroke="var(--text)" stroke-width="2" />
</svg>
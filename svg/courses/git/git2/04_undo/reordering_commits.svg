<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Reordering with Interactive Rebase</text>
  <text x="320" y="144" text-anchor="middle" font-size="22.4" font-weight="bold">Before</text>
  <circle cx="160" cy="216" r="32" fill="#4CAF50" />
  <text x="160" y="225" text-anchor="middle" font-size="16" fill="white">main</text>
  <circle cx="288" cy="216" r="32" fill="#FF9800" />
  <text x="288" y="225" text-anchor="middle" font-size="16" fill="white">docs</text>
  <circle cx="416" cy="216" r="32" fill="#2196F3" />
  <text x="416" y="225" text-anchor="middle" font-size="16" fill="white">feat</text>
  <circle cx="544" cy="216" r="32" fill="#9C27B0" />
  <text x="544" y="225" text-anchor="middle" font-size="16" fill="white">test</text>
  <text x="352" y="279" text-anchor="middle" font-size="17.6">Illogical order</text>
  <rect x="720" y="162" width="480" height="144" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="960" y="207" text-anchor="middle" font-size="19.2" font-family="monospace">git rebase -i HEAD~3</text>
  <text x="752" y="243" font-size="17.6" font-family="monospace">pick feat</text>
  <text x="752" y="270" font-size="17.6" font-family="monospace">pick test</text>
  <text x="752" y="297" font-size="17.6" font-family="monospace">pick docs</text>
  <text x="320" y="396" text-anchor="middle" font-size="22.4" font-weight="bold">After (Reordered)</text>
  <circle cx="160" cy="468" r="32" fill="#4CAF50" />
  <text x="160" y="477" text-anchor="middle" font-size="16" fill="white">main</text>
  <circle cx="288" cy="468" r="32" fill="#2196F3" />
  <text x="288" y="477" text-anchor="middle" font-size="16" fill="white">feat</text>
  <circle cx="416" cy="468" r="32" fill="#9C27B0" />
  <text x="416" y="477" text-anchor="middle" font-size="16" fill="white">test</text>
  <circle cx="544" cy="468" r="32" fill="#FF9800" />
  <text x="544" y="477" text-anchor="middle" font-size="16" fill="white">docs</text>
  <text x="352" y="531" text-anchor="middle" font-size="17.6">Logical order!</text>
  <line x1="192" y1="216" x2="512" y2="216" stroke="#333" stroke-width="3.2" />
  <line x1="192" y1="468" x2="512" y2="468" stroke="#333" stroke-width="3.2" />
</svg>
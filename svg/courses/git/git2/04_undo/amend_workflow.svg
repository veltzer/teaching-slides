<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="619.0941" y="40" text-anchor="middle" font-size="45.0133" font-weight="bold">Amending Commits</text>
  <text x="264.2905" y="129.2308" text-anchor="middle" font-size="26.2578" font-weight="bold">Before Amend</text>
  <rect x="40" y="171.573" width="93.7778" height="93.7778" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="86.8889" y="229.6154" text-anchor="middle" font-size="22.5066" fill="var(--bg)">A</text>
  <rect x="217.402" y="171.573" width="93.7778" height="93.7778" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="264.2905" y="229.6154" text-anchor="middle" font-size="22.5066" fill="var(--bg)">B</text>
  <rect x="394.803" y="171.573" width="93.7778" height="93.7778" rx="14" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="441.6923" y="229.6154" text-anchor="middle" font-size="22.5066" fill="var(--bg)">C</text>
  <text x="441.6923" y="296.5385" text-anchor="middle" font-size="20.6312" fill="var(--warn-accent)">Oops! Typo</text>
  <line x1="131.2393" y1="218.4616" x2="219.9402" y2="218.4616" stroke="var(--text)" stroke-width="2" />
  <line x1="308.641" y1="218.4616" x2="397.3419" y2="218.4616" stroke="var(--text)" stroke-width="2" />
  <text x="264.2905" y="419.2309" text-anchor="middle" font-size="26.2578" font-weight="bold">After Amend</text>
  <rect x="40" y="461.573" width="93.7778" height="93.7778" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="86.8889" y="519.6155" text-anchor="middle" font-size="22.5066" fill="var(--bg)">A</text>
  <rect x="217.402" y="461.573" width="93.7778" height="93.7778" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="264.2905" y="519.6155" text-anchor="middle" font-size="22.5066" fill="var(--bg)">B</text>
  <rect x="394.803" y="461.573" width="93.7778" height="93.7778" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="441.6923" y="519.6155" text-anchor="middle" font-size="22.5066" fill="var(--bg)">C'</text>
  <text x="441.6923" y="586.5386" text-anchor="middle" font-size="20.6312" fill="var(--primary-accent)">Fixed!</text>
  <line x1="131.2393" y1="508.4616" x2="219.9402" y2="508.4616" stroke="var(--text)" stroke-width="2" />
  <line x1="308.641" y1="508.4616" x2="397.3419" y2="508.4616" stroke="var(--text)" stroke-width="2" />
  <rect x="707.7948" y="173.8462" width="532.2052" height="446.1538" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="5.9999" filter="url(#shadow)"/>
  <text x="973.8974" y="240.7692" text-anchor="middle" font-size="30.0088" font-weight="bold">What Happens:</text>
  <text x="743.2752" y="307.6923" font-size="22.5066">1. Creates new commit C'</text>
  <text x="743.2752" y="363.4616" font-size="22.5066">2. Moves branch pointer to C'</text>
  <text x="743.2752" y="419.2309" font-size="22.5066">3. Old C becomes unreachable</text>
  <text x="743.2752" y="475" font-size="22.5066">4. Same tree, new SHA</text>
  <text x="973.8974" y="553.077" text-anchor="middle" font-size="24.3823" font-style="italic">C still exists in reflog!</text>
</svg>
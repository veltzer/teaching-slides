<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Amending Commits</text>
  <text x="320" y="144" text-anchor="middle" font-size="22.4" font-weight="bold">Before Amend</text>
  <circle cx="160" cy="216" r="40" fill="#4CAF50" />
  <text x="160" y="225" text-anchor="middle" font-size="19.2" fill="white">A</text>
  <circle cx="320" cy="216" r="40" fill="#4CAF50" />
  <text x="320" y="225" text-anchor="middle" font-size="19.2" fill="white">B</text>
  <circle cx="480" cy="216" r="40" fill="#FF9800" />
  <text x="480" y="225" text-anchor="middle" font-size="19.2" fill="white">C</text>
  <text x="480" y="279" text-anchor="middle" font-size="17.6" fill="#FF9800">Oops! Typo</text>
  <line x1="200" y1="216" x2="280" y2="216" stroke="#333" stroke-width="3.2" />
  <line x1="360" y1="216" x2="440" y2="216" stroke="#333" stroke-width="3.2" />
  <text x="320" y="378" text-anchor="middle" font-size="22.4" font-weight="bold">After Amend</text>
  <circle cx="160" cy="450" r="40" fill="#4CAF50" />
  <text x="160" y="459" text-anchor="middle" font-size="19.2" fill="white">A</text>
  <circle cx="320" cy="450" r="40" fill="#4CAF50" />
  <text x="320" y="459" text-anchor="middle" font-size="19.2" fill="white">B</text>
  <circle cx="480" cy="450" r="40" fill="#2196F3" />
  <text x="480" y="459" text-anchor="middle" font-size="19.2" fill="white">C'</text>
  <text x="480" y="513" text-anchor="middle" font-size="17.6" fill="#2196F3">Fixed!</text>
  <line x1="200" y1="450" x2="280" y2="450" stroke="#333" stroke-width="3.2" />
  <line x1="360" y1="450" x2="440" y2="450" stroke="#333" stroke-width="3.2" />
  <rect x="720" y="180" width="480" height="360" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="960" y="234" text-anchor="middle" font-size="25.6" font-weight="bold">What Happens:</text>
  <text x="752" y="288" font-size="19.2">1. Creates new commit C'</text>
  <text x="752" y="333" font-size="19.2">2. Moves branch pointer to C'</text>
  <text x="752" y="378" font-size="19.2">3. Old C becomes unreachable</text>
  <text x="752" y="423" font-size="19.2">4. Same tree, new SHA</text>
  <text x="960" y="486" text-anchor="middle" font-size="20.8" font-style="italic">C still exists in reflog!</text>
</svg>
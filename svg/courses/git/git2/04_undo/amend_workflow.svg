<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Amending Commits</text>
  <text x="320" y="144" text-anchor="middle" font-size="22.4" font-weight="bold">Before Amend</text>
  <circle cx="160" cy="216" r="40" fill="#4CAF50" />
  <text x="160" y="225" text-anchor="middle" font-size="19.2" fill="white">A</text>
  <circle cx="320" cy="216" r="40" fill="#4CAF50" />
  <text x="320" y="225" text-anchor="middle" font-size="19.2" fill="white">B</text>
  <circle cx="480" cy="216" r="40" fill="#FF9800" />
  <text x="480" y="225" text-anchor="middle" font-size="19.2" fill="white">C</text>
  <text x="480" y="279" text-anchor="middle" font-size="17.6" fill="#FF9800">Oops! Typo</text>
  <line x1="200" y1="216" x2="280" y2="216" stroke="#333" stroke-width="3.2" />
  <line x1="360" y1="216" x2="440" y2="216" stroke="#333" stroke-width="3.2" />
  <text x="320" y="378" text-anchor="middle" font-size="22.4" font-weight="bold">After Amend</text>
  <circle cx="160" cy="450" r="40" fill="#4CAF50" />
  <text x="160" y="459" text-anchor="middle" font-size="19.2" fill="white">A</text>
  <circle cx="320" cy="450" r="40" fill="#4CAF50" />
  <text x="320" y="459" text-anchor="middle" font-size="19.2" fill="white">B</text>
  <circle cx="480" cy="450" r="40" fill="#2196F3" />
  <text x="480" y="459" text-anchor="middle" font-size="19.2" fill="white">C'</text>
  <text x="480" y="513" text-anchor="middle" font-size="17.6" fill="#2196F3">Fixed!</text>
  <line x1="200" y1="450" x2="280" y2="450" stroke="#333" stroke-width="3.2" />
  <line x1="360" y1="450" x2="440" y2="450" stroke="#333" stroke-width="3.2" />
  <rect x="720" y="180" width="480" height="360" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="960" y="234" text-anchor="middle" font-size="25.6" font-weight="bold">What Happens:</text>
  <text x="752" y="288" font-size="19.2">1. Creates new commit C'</text>
  <text x="752" y="333" font-size="19.2">2. Moves branch pointer to C'</text>
  <text x="752" y="378" font-size="19.2">3. Old C becomes unreachable</text>
  <text x="752" y="423" font-size="19.2">4. Same tree, new SHA</text>
  <text x="960" y="486" text-anchor="middle" font-size="20.8" font-style="italic">C still exists in reflog!</text>
</svg>
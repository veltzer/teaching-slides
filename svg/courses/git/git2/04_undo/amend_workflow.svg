<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="619.0941" y="40" text-anchor="middle" font-size="45.0133" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Amending Commits</text>
  <text x="264.2905" y="129.2308" text-anchor="middle" font-size="26.2578" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Before Amend</text>
  <rect x="40" y="171.573" width="93.7778" height="93.7778" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="86.8889" y="229.6154" text-anchor="middle" font-size="22.5066" fill="var(--bg)" font-family="Arial, sans-serif">A</text>
  <rect x="217.402" y="171.573" width="93.7778" height="93.7778" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="264.2905" y="229.6154" text-anchor="middle" font-size="22.5066" fill="var(--bg)" font-family="Arial, sans-serif">B</text>
  <rect x="394.803" y="171.573" width="93.7778" height="93.7778" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="441.6923" y="229.6154" text-anchor="middle" font-size="22.5066" fill="var(--bg)" font-family="Arial, sans-serif">C</text>
  <text x="441.6923" y="296.5385" text-anchor="middle" font-size="20.6312" fill="var(--warn-accent)" font-family="Arial, sans-serif">Oops! Typo</text>
  <line x1="131.2393" y1="218.4616" x2="219.9402" y2="218.4616" stroke="var(--text)" stroke-width="2"/>
  <line x1="308.641" y1="218.4616" x2="397.3419" y2="218.4616" stroke="var(--text)" stroke-width="2"/>
  <text x="264.2905" y="419.2309" text-anchor="middle" font-size="26.2578" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">After Amend</text>
  <rect x="40" y="461.573" width="93.7778" height="93.7778" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="86.8889" y="519.6155" text-anchor="middle" font-size="22.5066" fill="var(--bg)" font-family="Arial, sans-serif">A</text>
  <rect x="217.402" y="461.573" width="93.7778" height="93.7778" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="264.2905" y="519.6155" text-anchor="middle" font-size="22.5066" fill="var(--bg)" font-family="Arial, sans-serif">B</text>
  <rect x="394.803" y="461.573" width="93.7778" height="93.7778" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="441.6923" y="519.6155" text-anchor="middle" font-size="22.5066" fill="var(--bg)" font-family="Arial, sans-serif">C'</text>
  <text x="441.6923" y="586.5386" text-anchor="middle" font-size="20.6312" fill="var(--primary-accent)" font-family="Arial, sans-serif">Fixed!</text>
  <line x1="131.2393" y1="508.4616" x2="219.9402" y2="508.4616" stroke="var(--text)" stroke-width="2"/>
  <line x1="308.641" y1="508.4616" x2="397.3419" y2="508.4616" stroke="var(--text)" stroke-width="2"/>
  <rect x="707.7948" y="173.8462" width="532.2052" height="446.1538" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="5.9999" filter="url(#shadow)"/>
  <text x="973.8974" y="240.7692" text-anchor="middle" font-size="30.0088" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">What Happens:</text>
  <text x="743.2752" y="307.6923" font-size="22.5066" font-family="Arial, sans-serif" fill="var(--primary-text)">1. Creates new commit C'</text>
  <text x="743.2752" y="363.4616" font-size="22.5066" font-family="Arial, sans-serif" fill="var(--primary-text)">2. Moves branch pointer to C'</text>
  <text x="743.2752" y="419.2309" font-size="22.5066" font-family="Arial, sans-serif" fill="var(--primary-text)">3. Old C becomes unreachable</text>
  <text x="743.2752" y="475" font-size="22.5066" font-family="Arial, sans-serif" fill="var(--primary-text)">4. Same tree, new SHA</text>
  <text x="973.8974" y="553.077" text-anchor="middle" font-size="24.3823" font-style="italic" font-family="Arial, sans-serif" fill="var(--primary-text)">C still exists in reflog!</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Modern Git Commands</text>
  <rect x="80" y="144" width="1120" height="144" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="640" y="189" text-anchor="middle" font-size="25.6" font-weight="bold">git restore (files)</text>
  <text x="112" y="234" font-size="20.8">Replaces: git checkout -- file.txt</text>
  <text x="112" y="270" font-size="19.2" font-family="monospace">git restore file.txt           # Discard changes</text>
  <rect x="80" y="306" width="1120" height="144" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="640" y="351" text-anchor="middle" font-size="25.6" font-weight="bold">git switch (branches)</text>
  <text x="112" y="396" font-size="20.8">Replaces: git checkout branch</text>
  <text x="112" y="432" font-size="19.2" font-family="monospace">git switch main                # Change branches</text>
  <rect x="80" y="468" width="1120" height="144" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="513" text-anchor="middle" font-size="25.6" font-weight="bold">git reset (commits)</text>
  <text x="112" y="558" font-size="20.8">Still used for: Moving HEAD, changing staging</text>
  <text x="112" y="594" font-size="19.2" font-family="monospace">git reset HEAD~1               # Undo commits</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="609.5238" y="60.9524" text-anchor="middle" font-size="36.5714" font-weight="bold">Choose Your Undo Strategy</ns0:text>
  <ns0:rect x="76.1905" y="106.6667" width="533.3333" height="121.9048" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.0476" rx="7.619" />
  <ns0:text x="342.8571" y="144.7619" text-anchor="middle" font-size="21.3333" font-weight="bold">Scenario: Typo in last commit message</ns0:text>
  <ns0:text x="342.8571" y="175.2381" text-anchor="middle" font-size="18.2857">Solution: git commit --amend</ns0:text>
  <ns0:text x="342.8571" y="205.7143" text-anchor="middle" font-size="16.7619" font-style="italic">Safe if not pushed</ns0:text>
  <ns0:rect x="640" y="106.6667" width="502.8571" height="121.9048" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.0476" rx="7.619" />
  <ns0:text x="891.4286" y="144.7619" text-anchor="middle" font-size="21.3333" font-weight="bold">Scenario: Wrong file in commit</ns0:text>
  <ns0:text x="891.4286" y="175.2381" text-anchor="middle" font-size="18.2857">Solution: git reset HEAD~ --soft</ns0:text>
  <ns0:text x="891.4286" y="205.7143" text-anchor="middle" font-size="16.7619" font-style="italic">Then recommit correctly</ns0:text>
  <ns0:rect x="76.1905" y="243.8095" width="533.3333" height="121.9048" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.0476" rx="7.619" />
  <ns0:text x="342.8571" y="281.9048" text-anchor="middle" font-size="21.3333" font-weight="bold">Scenario: Need to undo public commit</ns0:text>
  <ns0:text x="342.8571" y="312.381" text-anchor="middle" font-size="18.2857">Solution: git revert</ns0:text>
  <ns0:text x="342.8571" y="342.8571" text-anchor="middle" font-size="16.7619" font-style="italic">Creates new commit, preserves history</ns0:text>
  <ns0:rect x="640" y="243.8095" width="502.8571" height="121.9048" fill="#FFEBEE" stroke="#C62828" stroke-width="3.0476" rx="7.619" />
  <ns0:text x="891.4286" y="281.9048" text-anchor="middle" font-size="21.3333" font-weight="bold">Scenario: Discard all local changes</ns0:text>
  <ns0:text x="891.4286" y="312.381" text-anchor="middle" font-size="18.2857">Solution: git reset --hard HEAD</ns0:text>
  <ns0:text x="891.4286" y="342.8571" text-anchor="middle" font-size="16.7619" font-style="italic">⚠️ Destructive!</ns0:text>
  <ns0:rect x="76.1905" y="380.9524" width="533.3333" height="121.9048" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="3.0476" rx="7.619" />
  <ns0:text x="342.8571" y="419.0476" text-anchor="middle" font-size="21.3333" font-weight="bold">Scenario: Messy commit history</ns0:text>
  <ns0:text x="342.8571" y="449.5238" text-anchor="middle" font-size="18.2857">Solution: git rebase -i</ns0:text>
  <ns0:text x="342.8571" y="480" text-anchor="middle" font-size="16.7619" font-style="italic">Squash, reorder, edit</ns0:text>
  <ns0:rect x="640" y="380.9524" width="502.8571" height="121.9048" fill="#E0F2F1" stroke="#00796B" stroke-width="3.0476" rx="7.619" />
  <ns0:text x="891.4286" y="419.0476" text-anchor="middle" font-size="21.3333" font-weight="bold">Scenario: Need specific fix from branch</ns0:text>
  <ns0:text x="891.4286" y="449.5238" text-anchor="middle" font-size="18.2857">Solution: git cherry-pick</ns0:text>
  <ns0:text x="891.4286" y="480" text-anchor="middle" font-size="16.7619" font-style="italic">Apply single commit</ns0:text>
  <ns0:rect x="76.1905" y="518.0952" width="533.3333" height="121.9048" fill="#FCE4EC" stroke="#C2185B" stroke-width="3.0476" rx="7.619" />
  <ns0:text x="342.8571" y="556.1905" text-anchor="middle" font-size="21.3333" font-weight="bold">Scenario: Committed sensitive data</ns0:text>
  <ns0:text x="342.8571" y="586.6667" text-anchor="middle" font-size="18.2857">Solution: BFG or filter-branch</ns0:text>
  <ns0:text x="342.8571" y="617.1429" text-anchor="middle" font-size="16.7619" font-style="italic">Rewrites entire history</ns0:text>
  <ns0:rect x="640" y="518.0952" width="502.8571" height="121.9048" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="3.0476" rx="7.619" />
  <ns0:text x="891.4286" y="556.1905" text-anchor="middle" font-size="21.3333" font-weight="bold">Scenario: Lost commits after reset</ns0:text>
  <ns0:text x="891.4286" y="586.6667" text-anchor="middle" font-size="18.2857">Solution: git reflog + checkout/branch</ns0:text>
  <ns0:text x="891.4286" y="617.1429" text-anchor="middle" font-size="16.7619" font-style="italic">Recover within 90 days</ns0:text>
</ns0:svg>
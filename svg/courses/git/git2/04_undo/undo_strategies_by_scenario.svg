<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="38.8217" font-weight="bold">Choose Your Undo Strategy</text>
  <rect x="40" y="85.7895" width="600" height="122.1053" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="339.9999" y="123.9473" text-anchor="middle" font-size="22.646" font-weight="bold">Scenario: Typo in last commit message</text>
  <text x="339.9999" y="154.4737" text-anchor="middle" font-size="19.4109">Solution: git commit --amend</text>
  <text x="339.9999" y="185" text-anchor="middle" font-size="17.7933" font-style="italic">Safe if not pushed</text>
  <rect x="674.2857" y="85.7895" width="565.7143" height="122.1053" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1429" y="123.9473" text-anchor="middle" font-size="22.646" font-weight="bold">Scenario: Wrong file in commit</text>
  <text x="957.1429" y="154.4737" text-anchor="middle" font-size="19.4109">Solution: git reset HEAD~ --soft</text>
  <text x="957.1429" y="185" text-anchor="middle" font-size="17.7933" font-style="italic">Then recommit correctly</text>
  <rect x="40" y="223.1579" width="600" height="122.1053" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="339.9999" y="261.3158" text-anchor="middle" font-size="22.646" font-weight="bold">Scenario: Need to undo public commit</text>
  <text x="339.9999" y="291.8421" text-anchor="middle" font-size="19.4109">Solution: git revert</text>
  <text x="339.9999" y="322.3684" text-anchor="middle" font-size="17.7933" font-style="italic">Creates new commit, preserves history</text>
  <rect x="674.2857" y="223.1579" width="565.7143" height="122.1053" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1429" y="261.3158" text-anchor="middle" font-size="22.646" font-weight="bold">Scenario: Discard all local changes</text>
  <text x="957.1429" y="291.8421" text-anchor="middle" font-size="19.4109">Solution: git reset --hard HEAD</text>
  <text x="957.1429" y="322.3684" text-anchor="middle" font-size="17.7933" font-style="italic">⚠️ Destructive!</text>
  <rect x="40" y="360.5263" width="600" height="122.1053" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="339.9999" y="398.6842" text-anchor="middle" font-size="22.646" font-weight="bold">Scenario: Messy commit history</text>
  <text x="339.9999" y="429.2105" text-anchor="middle" font-size="19.4109">Solution: git rebase -i</text>
  <text x="339.9999" y="459.7368" text-anchor="middle" font-size="17.7933" font-style="italic">Squash, reorder, edit</text>
  <rect x="674.2857" y="360.5263" width="565.7143" height="122.1053" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1429" y="398.6842" text-anchor="middle" font-size="22.646" font-weight="bold">Scenario: Need specific fix from branch</text>
  <text x="957.1429" y="429.2105" text-anchor="middle" font-size="19.4109">Solution: git cherry-pick</text>
  <text x="957.1429" y="459.7368" text-anchor="middle" font-size="17.7933" font-style="italic">Apply single commit</text>
  <rect x="40" y="497.8947" width="600" height="122.1053" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="339.9999" y="536.0527" text-anchor="middle" font-size="22.646" font-weight="bold">Scenario: Committed sensitive data</text>
  <text x="339.9999" y="566.579" text-anchor="middle" font-size="19.4109">Solution: BFG or filter-branch</text>
  <text x="339.9999" y="597.1053" text-anchor="middle" font-size="17.7933" font-style="italic">Rewrites entire history</text>
  <rect x="674.2857" y="497.8947" width="565.7143" height="122.1053" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1429" y="536.0527" text-anchor="middle" font-size="22.646" font-weight="bold">Scenario: Lost commits after reset</text>
  <text x="957.1429" y="566.579" text-anchor="middle" font-size="19.4109">Solution: git reflog + checkout/branch</text>
  <text x="957.1429" y="597.1053" text-anchor="middle" font-size="17.7933" font-style="italic">Recover within 90 days</text>
</svg>
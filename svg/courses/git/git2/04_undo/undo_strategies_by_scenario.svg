<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64" text-anchor="middle" font-size="38.4" font-weight="bold">Choose Your Undo Strategy</text>
  <rect x="80" y="112" width="560" height="128" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="360" y="152" text-anchor="middle" font-size="22.4" font-weight="bold">Scenario: Typo in last commit message</text>
  <text x="360" y="184" text-anchor="middle" font-size="19.2">Solution: git commit --amend</text>
  <text x="360" y="216" text-anchor="middle" font-size="17.6" font-style="italic">Safe if not pushed</text>
  <rect x="672" y="112" width="528" height="128" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="936" y="152" text-anchor="middle" font-size="22.4" font-weight="bold">Scenario: Wrong file in commit</text>
  <text x="936" y="184" text-anchor="middle" font-size="19.2">Solution: git reset HEAD~ --soft</text>
  <text x="936" y="216" text-anchor="middle" font-size="17.6" font-style="italic">Then recommit correctly</text>
  <rect x="80" y="256" width="560" height="128" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="360" y="296" text-anchor="middle" font-size="22.4" font-weight="bold">Scenario: Need to undo public commit</text>
  <text x="360" y="328" text-anchor="middle" font-size="19.2">Solution: git revert</text>
  <text x="360" y="360" text-anchor="middle" font-size="17.6" font-style="italic">Creates new commit, preserves history</text>
  <rect x="672" y="256" width="528" height="128" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="936" y="296" text-anchor="middle" font-size="22.4" font-weight="bold">Scenario: Discard all local changes</text>
  <text x="936" y="328" text-anchor="middle" font-size="19.2">Solution: git reset --hard HEAD</text>
  <text x="936" y="360" text-anchor="middle" font-size="17.6" font-style="italic">⚠️ Destructive!</text>
  <rect x="80" y="400" width="560" height="128" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="3.2" rx="8" />
  <text x="360" y="440" text-anchor="middle" font-size="22.4" font-weight="bold">Scenario: Messy commit history</text>
  <text x="360" y="472" text-anchor="middle" font-size="19.2">Solution: git rebase -i</text>
  <text x="360" y="504" text-anchor="middle" font-size="17.6" font-style="italic">Squash, reorder, edit</text>
  <rect x="672" y="400" width="528" height="128" fill="#E0F2F1" stroke="#00796B" stroke-width="3.2" rx="8" />
  <text x="936" y="440" text-anchor="middle" font-size="22.4" font-weight="bold">Scenario: Need specific fix from branch</text>
  <text x="936" y="472" text-anchor="middle" font-size="19.2">Solution: git cherry-pick</text>
  <text x="936" y="504" text-anchor="middle" font-size="17.6" font-style="italic">Apply single commit</text>
  <rect x="80" y="544" width="560" height="128" fill="#FCE4EC" stroke="#C2185B" stroke-width="3.2" rx="8" />
  <text x="360" y="584" text-anchor="middle" font-size="22.4" font-weight="bold">Scenario: Committed sensitive data</text>
  <text x="360" y="616" text-anchor="middle" font-size="19.2">Solution: BFG or filter-branch</text>
  <text x="360" y="648" text-anchor="middle" font-size="17.6" font-style="italic">Rewrites entire history</text>
  <rect x="672" y="544" width="528" height="128" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="3.2" rx="8" />
  <text x="936" y="584" text-anchor="middle" font-size="22.4" font-weight="bold">Scenario: Lost commits after reset</text>
  <text x="936" y="616" text-anchor="middle" font-size="19.2">Solution: git reflog + checkout/branch</text>
  <text x="936" y="648" text-anchor="middle" font-size="17.6" font-style="italic">Recover within 90 days</text>
</svg>
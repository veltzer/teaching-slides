<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="38.8217" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Choose Your Undo Strategy</text>
  <rect x="40" y="85.7895" width="600" height="122.1053" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="339.9999" y="123.9473" text-anchor="middle" font-size="22.646" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Scenario: Typo in last commit message</text>
  <text x="339.9999" y="154.4737" text-anchor="middle" font-size="19.4109" font-family="Arial, sans-serif" fill="var(--ok-text)">Solution: git commit --amend</text>
  <text x="339.9999" y="185" text-anchor="middle" font-size="17.7933" font-style="italic" font-family="Arial, sans-serif" fill="var(--ok-text)">Safe if not pushed</text>
  <rect x="674.2857" y="85.7895" width="565.7143" height="122.1053" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1429" y="123.9473" text-anchor="middle" font-size="22.646" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Scenario: Wrong file in commit</text>
  <text x="957.1429" y="154.4737" text-anchor="middle" font-size="19.4109" font-family="Arial, sans-serif" fill="var(--primary-text)">Solution: git reset HEAD~ --soft</text>
  <text x="957.1429" y="185" text-anchor="middle" font-size="17.7933" font-style="italic" font-family="Arial, sans-serif" fill="var(--primary-text)">Then recommit correctly</text>
  <rect x="40" y="223.1579" width="600" height="122.1053" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="339.9999" y="261.3158" text-anchor="middle" font-size="22.646" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Scenario: Need to undo public commit</text>
  <text x="339.9999" y="291.8421" text-anchor="middle" font-size="19.4109" font-family="Arial, sans-serif" fill="var(--warn-text)">Solution: git revert</text>
  <text x="339.9999" y="322.3684" text-anchor="middle" font-size="17.7933" font-style="italic" font-family="Arial, sans-serif" fill="var(--warn-text)">Creates new commit, preserves history</text>
  <rect x="674.2857" y="223.1579" width="565.7143" height="122.1053" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1429" y="261.3158" text-anchor="middle" font-size="22.646" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Scenario: Discard all local changes</text>
  <text x="957.1429" y="291.8421" text-anchor="middle" font-size="19.4109" font-family="Arial, sans-serif" fill="var(--danger-text)">Solution: git reset --hard HEAD</text>
  <text x="957.1429" y="322.3684" text-anchor="middle" font-size="17.7933" font-style="italic" font-family="Arial, sans-serif" fill="var(--danger-text)">⚠️ Destructive!</text>
  <rect x="40" y="360.5263" width="600" height="122.1053" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="339.9999" y="398.6842" text-anchor="middle" font-size="22.646" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Scenario: Messy commit history</text>
  <text x="339.9999" y="429.2105" text-anchor="middle" font-size="19.4109" font-family="Arial, sans-serif" fill="var(--info-text)">Solution: git rebase -i</text>
  <text x="339.9999" y="459.7368" text-anchor="middle" font-size="17.7933" font-style="italic" font-family="Arial, sans-serif" fill="var(--info-text)">Squash, reorder, edit</text>
  <rect x="674.2857" y="360.5263" width="565.7143" height="122.1053" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1429" y="398.6842" text-anchor="middle" font-size="22.646" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Scenario: Need specific fix from branch</text>
  <text x="957.1429" y="429.2105" text-anchor="middle" font-size="19.4109" font-family="Arial, sans-serif" fill="var(--primary-text)">Solution: git cherry-pick</text>
  <text x="957.1429" y="459.7368" text-anchor="middle" font-size="17.7933" font-style="italic" font-family="Arial, sans-serif" fill="var(--primary-text)">Apply single commit</text>
  <rect x="40" y="497.8947" width="600" height="122.1053" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="339.9999" y="536.0527" text-anchor="middle" font-size="22.646" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Scenario: Committed sensitive data</text>
  <text x="339.9999" y="566.579" text-anchor="middle" font-size="19.4109" font-family="Arial, sans-serif" fill="var(--danger-text)">Solution: BFG or filter-branch</text>
  <text x="339.9999" y="597.1053" text-anchor="middle" font-size="17.7933" font-style="italic" font-family="Arial, sans-serif" fill="var(--danger-text)">Rewrites entire history</text>
  <rect x="674.2857" y="497.8947" width="565.7143" height="122.1053" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1429" y="536.0527" text-anchor="middle" font-size="22.646" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Scenario: Lost commits after reset</text>
  <text x="957.1429" y="566.579" text-anchor="middle" font-size="19.4109" font-family="Arial, sans-serif" fill="var(--info-text)">Solution: git reflog + checkout/branch</text>
  <text x="957.1429" y="597.1053" text-anchor="middle" font-size="17.7933" font-style="italic" font-family="Arial, sans-serif" fill="var(--info-text)">Recover within 90 days</text>
</svg>
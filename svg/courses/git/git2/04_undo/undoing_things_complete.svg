<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--ok-text)">Master of Time Travel</text>
  <text x="640" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">the right undo command for any situation</text>

  <rect x="40" y="180" width="290" height="280" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Working tree</text>
  <text x="185" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">drop uncommitted edits</text>
  <text x="185" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">git restore file.txt</text>
  <text x="185" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">unstage without losing</text>
  <text x="185" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">git restore --staged</text>
  <text x="185" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">stash away for later</text>
  <text x="185" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">git stash push</text>

  <rect x="340" y="180" width="290" height="280" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="485" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Local history</text>
  <text x="485" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">amend last commit</text>
  <text x="485" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">git commit --amend</text>
  <text x="485" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">rewrite older commits</text>
  <text x="485" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">git rebase -i HEAD~N</text>
  <text x="485" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">move the branch tip</text>
  <text x="485" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">git reset --hard SHA</text>

  <rect x="640" y="180" width="290" height="280" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="785" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Published work</text>
  <text x="785" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">never rewrite shared</text>
  <text x="785" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">history without asking</text>
  <text x="785" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">invert a commit safely</text>
  <text x="785" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">git revert SHA</text>
  <text x="785" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">force push carefully</text>
  <text x="785" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">push --force-with-lease</text>

  <rect x="940" y="180" width="300" height="280" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1090" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Recovery</text>
  <text x="1090" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">reflog sees everything</text>
  <text x="1090" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">git reflog</text>
  <text x="1090" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">bring back a dead branch</text>
  <text x="1090" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">git branch name SHA</text>
  <text x="1090" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">dangling blobs survive</text>
  <text x="1090" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">git fsck --lost-found</text>

  <rect x="40" y="480" width="1200" height="130" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Pick by scope: files, local commits, shared history, or deep recovery</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">revert is safe on shared branches; reset and rebase are for your own work</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">reflog survives 90 days by default — almost nothing is truly lost</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="111.929825" rx="6.052403" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="95.964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.262014" font-weight="bold" fill="var(--ok-text)">Master of Time Travel</text>
  <text x="640" y="129.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--ok-text)">the right undo command for any situation</text>

  <rect x="40" y="182.45614" width="290" height="284.912281" rx="6.052403" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="228.245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174676" font-weight="bold" fill="var(--primary-text)">Working tree</text>
  <text x="185" y="274.035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--primary-text)">drop uncommitted edits</text>
  <text x="185" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--primary-text)">git restore file.txt</text>
  <text x="185" y="345.263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--primary-text)">unstage without losing</text>
  <text x="185" y="368.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--primary-text)">git restore --staged</text>
  <text x="185" y="416.491228" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--primary-text)">stash away for later</text>
  <text x="185" y="439.894737" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--primary-text)">git stash push</text>

  <rect x="340" y="182.45614" width="290" height="284.912281" rx="6.052403" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="228.245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174676" font-weight="bold" fill="var(--warn-text)">Local history</text>
  <text x="485" y="274.035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--warn-text)">amend last commit</text>
  <text x="485" y="297.438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--warn-text)">git commit --amend</text>
  <text x="485" y="340.175439" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--warn-text)">rewrite older commits</text>
  <text x="485" y="363.578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--warn-text)">git rebase -i HEAD~N</text>
  <text x="485" y="406.315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--warn-text)">move the branch tip</text>
  <text x="485" y="429.719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--warn-text)">git reset --hard SHA</text>

  <rect x="640" y="182.45614" width="290" height="284.912281" rx="6.052403" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="228.245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174676" font-weight="bold" fill="var(--info-text)">Published work</text>
  <text x="785" y="274.035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--info-text)">never rewrite shared</text>
  <text x="785" y="297.438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--info-text)">history without asking</text>
  <text x="785" y="340.175439" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--info-text)">invert a commit safely</text>
  <text x="785" y="363.578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--info-text)">git revert SHA</text>
  <text x="785" y="406.315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--info-text)">force push carefully</text>
  <text x="785" y="429.719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--info-text)">push --force-with-lease</text>

  <rect x="940" y="182.45614" width="300" height="284.912281" rx="6.052403" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="228.245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174676" font-weight="bold" fill="var(--danger-text)">Recovery</text>
  <text x="1090" y="274.035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--danger-text)">reflog sees everything</text>
  <text x="1090" y="297.438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--danger-text)">git reflog</text>
  <text x="1090" y="340.175439" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--danger-text)">bring back a dead branch</text>
  <text x="1090" y="363.578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--danger-text)">git branch name SHA</text>
  <text x="1090" y="406.315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--danger-text)">dangling blobs survive</text>
  <text x="1090" y="429.719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--danger-text)">git fsck --lost-found</text>

  <rect x="40" y="487.719298" width="1200" height="132.280702" rx="6.052403" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="528.421053" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" font-weight="bold" fill="var(--text)">Pick by scope: files, local commits, shared history, or deep recovery</text>
  <text x="640" y="564.035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--text-muted)">revert is safe on shared branches; reset and rebase are for your own work</text>
  <text x="640" y="594.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--text-muted)">reflog survives 90 days by default — almost nothing is truly lost</text>
</svg>

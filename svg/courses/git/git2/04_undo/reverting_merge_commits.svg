<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="528.8889" y="80" text-anchor="middle" font-size="41.0256" font-weight="bold">Reverting Merges is Special</text>
  <circle cx="187.0085" cy="291.5385" r="34.188" fill="var(--ok-fill)" />
  <text x="187.0085" y="301.1538" text-anchor="middle" font-size="17.094" fill="var(--bg)">A</text>
  <circle cx="323.7607" cy="195.3846" r="34.188" fill="var(--primary-fill)" />
  <text x="323.7607" y="205" text-anchor="middle" font-size="17.094" fill="var(--bg)">B</text>
  <circle cx="323.7607" cy="387.6923" r="34.188" fill="var(--warn-fill)" />
  <text x="323.7607" y="397.3077" text-anchor="middle" font-size="17.094" fill="var(--bg)">C</text>
  <circle cx="460.5128" cy="291.5385" r="42.735" fill="var(--info-fill)" />
  <text x="460.5128" y="301.1538" text-anchor="middle" font-size="20.5128" fill="var(--bg)">M</text>
  <text x="460.5128" y="349.2308" text-anchor="middle" font-size="17.094">Merge</text>
  <line x1="221.1966" y1="291.5385" x2="417.7778" y2="291.5385" stroke="var(--text)" stroke-width="2" />
  <line x1="357.9487" y1="195.3846" x2="426.3248" y2="262.6923" stroke="var(--text)" stroke-width="2" />
  <line x1="357.9487" y1="387.6923" x2="426.3248" y2="320.3846" stroke="var(--text)" stroke-width="2" />
  <text x="323.7607" y="166.5385" text-anchor="middle" font-size="17.094">Parent 1</text>
  <text x="323.7607" y="455" text-anchor="middle" font-size="17.094">Parent 2</text>
  <rect x="614.359" y="195.3846" width="512.8205" height="288.4615" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="870.7692" y="253.0769" text-anchor="middle" font-size="23.9316" font-weight="bold">Reverting Merge Commit</text>
  <text x="648.547" y="310.7692" font-size="20.5128" font-family="monospace">git revert -m 1 M</text>
  <text x="648.547" y="349.2308" font-size="18.8034">Keeps changes from Parent 1</text>
  <text x="648.547" y="387.6923" font-size="20.5128" font-family="monospace">git revert -m 2 M</text>
  <text x="648.547" y="426.1538" font-size="18.8034">Keeps changes from Parent 2</text>
  <text x="870.7692" y="580" text-anchor="middle" font-size="22.2222" font-style="italic">Must specify which parent to keep!</text>
</svg>
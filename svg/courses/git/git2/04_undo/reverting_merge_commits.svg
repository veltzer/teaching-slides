<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="502.3813" y="40" text-anchor="middle" font-size="49.0618" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Reverting Merges is Special</text>
  <rect x="40" y="244.5" width="81.7698" height="81.7698" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="80.8849" y="296.5384" text-anchor="middle" font-size="20.4425" fill="var(--bg)" font-family="Arial, sans-serif">A</text>
  <rect x="208.599" y="132.961" width="81.7698" height="81.7698" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="249.4836" y="185" text-anchor="middle" font-size="20.4425" fill="var(--bg)" font-family="Arial, sans-serif">B</text>
  <rect x="208.599" y="356.038" width="81.7698" height="81.7698" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="249.4836" y="408.0769" text-anchor="middle" font-size="20.4425" fill="var(--bg)" font-family="Arial, sans-serif">C</text>
  <rect x="366.976" y="234.279" width="102.212" height="102.212" rx="14" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="418.082" y="296.5384" text-anchor="middle" font-size="24.5309" fill="var(--bg)" font-family="Arial, sans-serif">M</text>
  <text x="418.082" y="352.3077" text-anchor="middle" font-size="20.4425" font-family="Arial, sans-serif" fill="var(--text)">Merge</text>
  <line x1="123.0348" y1="285.3847" x2="365.3951" y2="285.3847" stroke="var(--text)" stroke-width="2" />
  <line x1="291.6332" y1="173.8461" x2="375.9325" y2="251.9231" stroke="var(--text)" stroke-width="2" />
  <line x1="291.6332" y1="396.9231" x2="375.9325" y2="318.8461" stroke="var(--text)" stroke-width="2" />
  <text x="249.4836" y="140.3847" text-anchor="middle" font-size="20.4425" font-family="Arial, sans-serif" fill="var(--primary-text)">Parent 1</text>
  <text x="249.4836" y="475" text-anchor="middle" font-size="20.4425" font-family="Arial, sans-serif" fill="var(--text)">Parent 2</text>
  <rect x="607.7555" y="173.8461" width="632.2445" height="334.6153" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.0032" filter="url(#shadow)"/>
  <text x="923.8776" y="240.7692" text-anchor="middle" font-size="28.6194" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Reverting Merge Commit</text>
  <text x="649.9051" y="307.6923" font-size="24.5309" font-family="Courier New, monospace" fill="var(--warn-text)">git revert -m 1 M</text>
  <text x="649.9051" y="352.3077" font-size="22.4866" font-family="Arial, sans-serif" fill="var(--warn-text)">Keeps changes from Parent 1</text>
  <text x="649.9051" y="396.9231" font-size="24.5309" font-family="Courier New, monospace" fill="var(--warn-text)">git revert -m 2 M</text>
  <text x="649.9051" y="441.5384" font-size="22.4866" font-family="Arial, sans-serif" fill="var(--warn-text)">Keeps changes from Parent 2</text>
  <text x="923.8776" y="620" text-anchor="middle" font-size="26.5752" font-style="italic" font-family="Arial, sans-serif" fill="var(--text)">Must specify which parent to keep!</text>
</svg>
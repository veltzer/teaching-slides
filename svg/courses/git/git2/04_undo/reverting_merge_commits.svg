<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Reverting Merges is Special</text>
  <circle cx="320" cy="270" r="32" fill="#4CAF50" />
  <text x="320" y="279" text-anchor="middle" font-size="16" fill="white">A</text>
  <circle cx="448" cy="180" r="32" fill="#2196F3" />
  <text x="448" y="189" text-anchor="middle" font-size="16" fill="white">B</text>
  <circle cx="448" cy="360" r="32" fill="#FF9800" />
  <text x="448" y="369" text-anchor="middle" font-size="16" fill="white">C</text>
  <circle cx="576" cy="270" r="40" fill="#9C27B0" />
  <text x="576" y="279" text-anchor="middle" font-size="19.2" fill="white">M</text>
  <text x="576" y="324" text-anchor="middle" font-size="16">Merge</text>
  <line x1="352" y1="270" x2="536" y2="270" stroke="#333" stroke-width="3.2" />
  <line x1="480" y1="180" x2="544" y2="243" stroke="#333" stroke-width="3.2" />
  <line x1="480" y1="360" x2="544" y2="297" stroke="#333" stroke-width="3.2" />
  <text x="448" y="153" text-anchor="middle" font-size="16">Parent 1</text>
  <text x="448" y="423" text-anchor="middle" font-size="16">Parent 2</text>
  <rect x="720" y="180" width="480" height="270" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="960" y="234" text-anchor="middle" font-size="22.4" font-weight="bold">Reverting Merge Commit</text>
  <text x="752" y="288" font-size="19.2" font-family="monospace">git revert -m 1 M</text>
  <text x="752" y="324" font-size="17.6">Keeps changes from Parent 1</text>
  <text x="752" y="360" font-size="19.2" font-family="monospace">git revert -m 2 M</text>
  <text x="752" y="396" font-size="17.6">Keeps changes from Parent 2</text>
  <text x="960" y="540" text-anchor="middle" font-size="20.8" font-style="italic">Must specify which parent to keep!</text>
</svg>
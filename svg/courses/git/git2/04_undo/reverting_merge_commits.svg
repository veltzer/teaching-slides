<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="502.3813" y="40" text-anchor="middle" font-size="49.0618" font-weight="bold">Reverting Merges is Special</text>
  <circle cx="80.8849" cy="285.3847" r="40.8849" fill="var(--ok-fill)" />
  <text x="80.8849" y="296.5384" text-anchor="middle" font-size="20.4425" fill="var(--bg)">A</text>
  <circle cx="249.4836" cy="173.8461" r="40.8849" fill="var(--primary-fill)" />
  <text x="249.4836" y="185" text-anchor="middle" font-size="20.4425" fill="var(--bg)">B</text>
  <circle cx="249.4836" cy="396.9231" r="40.8849" fill="var(--warn-fill)" />
  <text x="249.4836" y="408.0769" text-anchor="middle" font-size="20.4425" fill="var(--bg)">C</text>
  <circle cx="418.082" cy="285.3847" r="51.1061" fill="var(--info-fill)" />
  <text x="418.082" y="296.5384" text-anchor="middle" font-size="24.5309" fill="var(--bg)">M</text>
  <text x="418.082" y="352.3077" text-anchor="middle" font-size="20.4425">Merge</text>
  <line x1="123.0348" y1="285.3847" x2="365.3951" y2="285.3847" stroke="var(--text)" stroke-width="2" />
  <line x1="291.6332" y1="173.8461" x2="375.9325" y2="251.9231" stroke="var(--text)" stroke-width="2" />
  <line x1="291.6332" y1="396.9231" x2="375.9325" y2="318.8461" stroke="var(--text)" stroke-width="2" />
  <text x="249.4836" y="140.3847" text-anchor="middle" font-size="20.4425">Parent 1</text>
  <text x="249.4836" y="475" text-anchor="middle" font-size="20.4425">Parent 2</text>
  <rect x="607.7555" y="173.8461" width="632.2445" height="334.6153" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.0032" />
  <text x="923.8776" y="240.7692" text-anchor="middle" font-size="28.6194" font-weight="bold">Reverting Merge Commit</text>
  <text x="649.9051" y="307.6923" font-size="24.5309" font-family="monospace">git revert -m 1 M</text>
  <text x="649.9051" y="352.3077" font-size="22.4866">Keeps changes from Parent 1</text>
  <text x="649.9051" y="396.9231" font-size="24.5309" font-family="monospace">git revert -m 2 M</text>
  <text x="649.9051" y="441.5384" font-size="22.4866">Keeps changes from Parent 2</text>
  <text x="923.8776" y="620" text-anchor="middle" font-size="26.5752" font-style="italic">Must specify which parent to keep!</text>
</svg>
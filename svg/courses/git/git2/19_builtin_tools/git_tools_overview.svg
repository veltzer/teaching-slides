  <rect x="49.677419" y="281.666677" width="251.612903" height="251.333401" fill="var(--ok-fill)" rx="6.677842" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="49.677419" y="281.666677" width="251.612903" height="38.666779" fill="var(--ok-fill)" rx="6.677842" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

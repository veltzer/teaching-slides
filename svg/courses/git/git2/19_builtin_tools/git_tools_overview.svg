<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Central Git label -->
  <circle cx="640" cy="320" r="62" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="313" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">git</text>
  <text x="640" y="337" font-family="Arial,sans-serif" font-size="14" fill="#cce5ff" text-anchor="middle">built-in tools</text>

  <!-- === GROUP 1: Inspection === -->
  <rect x="30" y="40" width="260" height="220" fill="#e3f2fd" rx="12" filter="url(#shadow)"/>
  <rect x="30" y="40" width="260" height="40" fill="url(#grad-accent)" rx="12"/>
  <rect x="30" y="64" width="260" height="16" fill="url(#grad-accent)"/>
  <text x="160" y="67" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Inspection</text>
  <!-- Tools -->
  <rect x="50" y="98" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="90" y="121" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1565c0">bisect</text>
  <text x="180" y="121" font-family="Arial,sans-serif" font-size="12" fill="#555555">binary bug search</text>
  <rect x="50" y="144" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="90" y="167" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1565c0">describe</text>
  <text x="185" y="167" font-family="Arial,sans-serif" font-size="12" fill="#555555">human names</text>
  <rect x="50" y="190" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="90" y="213" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1565c0">log</text>
  <text x="140" y="213" font-family="Arial,sans-serif" font-size="12" fill="#555555">commit history &amp; graph</text>

  <!-- === GROUP 2: Network === -->
  <rect x="30" y="290" width="260" height="260" fill="#e8f5e9" rx="12" filter="url(#shadow)"/>
  <rect x="30" y="290" width="260" height="40" fill="#388e3c" rx="12"/>
  <rect x="30" y="314" width="260" height="16" fill="#388e3c"/>
  <text x="160" y="317" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Network</text>
  <rect x="50" y="348" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="90" y="371" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2e7d32">daemon</text>
  <text x="175" y="371" font-family="Arial,sans-serif" font-size="12" fill="#555555">git:// protocol</text>
  <rect x="50" y="394" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="90" y="417" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2e7d32">http-backend</text>
  <text x="205" y="417" font-family="Arial,sans-serif" font-size="12" fill="#555555">CGI/HTTP</text>
  <rect x="50" y="440" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="90" y="463" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2e7d32">instaweb</text>
  <text x="185" y="463" font-family="Arial,sans-serif" font-size="12" fill="#555555">web browser UI</text>
  <rect x="50" y="486" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="90" y="509" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2e7d32">shell</text>
  <text x="145" y="509" font-family="Arial,sans-serif" font-size="12" fill="#555555">restricted SSH shell</text>

  <!-- === GROUP 3: Packaging === -->
  <rect x="990" y="40" width="260" height="220" fill="#fff3e0" rx="12" filter="url(#shadow)"/>
  <rect x="990" y="40" width="260" height="40" fill="#e65100" rx="12"/>
  <rect x="990" y="64" width="260" height="16" fill="#e65100"/>
  <text x="1120" y="67" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Packaging</text>
  <rect x="1010" y="98" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="1055" y="121" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#bf360c">archive</text>
  <text x="1145" y="121" font-family="Arial,sans-serif" font-size="12" fill="#555555">tar / zip export</text>
  <rect x="1010" y="144" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="1055" y="167" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#bf360c">bundle</text>
  <text x="1140" y="167" font-family="Arial,sans-serif" font-size="12" fill="#555555">portable repo file</text>
  <rect x="1010" y="190" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="1055" y="213" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#bf360c">gc / fsck</text>
  <text x="1155" y="213" font-family="Arial,sans-serif" font-size="12" fill="#555555">maintenance</text>

  <!-- === GROUP 4: Collaboration === -->
  <rect x="990" y="290" width="260" height="220" fill="#f3e5f5" rx="12" filter="url(#shadow)"/>
  <rect x="990" y="290" width="260" height="40" fill="#7b1fa2" rx="12"/>
  <rect x="990" y="314" width="260" height="16" fill="#7b1fa2"/>
  <text x="1120" y="317" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Collaboration</text>
  <rect x="1010" y="348" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="1055" y="371" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#6a1b9a">notes</text>
  <text x="1120" y="371" font-family="Arial,sans-serif" font-size="12" fill="#555555">annotate commits</text>
  <rect x="1010" y="394" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="1055" y="417" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#6a1b9a">submodule</text>
  <text x="1170" y="417" font-family="Arial,sans-serif" font-size="12" fill="#555555">sub-repos</text>
  <rect x="1010" y="440" width="220" height="36" fill="#ffffff" rx="8" filter="url(#shadow)"/>
  <text x="1055" y="463" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#6a1b9a">worktree</text>
  <text x="1155" y="463" font-family="Arial,sans-serif" font-size="12" fill="#555555">parallel checkouts</text>

  <!-- Connector lines from center to groups -->
  <!-- Left-top: Inspection -->
  <line x1="578" y1="283" x2="290" y2="185" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-accent)"/>
  <!-- Left-bottom: Network -->
  <line x1="578" y1="340" x2="290" y2="400" stroke="#388e3c" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Right-top: Packaging -->
  <line x1="702" y1="283" x2="990" y2="185" stroke="#e65100" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Right-bottom: Collaboration -->
  <line x1="702" y1="340" x2="990" y2="400" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Bottom callout bar -->
  <rect x="20" y="590" width="1240" height="50" fill="#f5f5f5" rx="8" filter="url(#shadow)"/>
  <text x="640" y="610" font-family="Arial,sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">All tools ship with Git — no extra installs needed</text>
  <text x="640" y="628" font-family="Arial,sans-serif" font-size="12" fill="#555555" text-anchor="middle">Combine them in shell scripts for release pipelines, server setup, and team workflows</text>
</svg>

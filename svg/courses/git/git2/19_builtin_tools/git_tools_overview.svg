<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <circle cx="568.8889" cy="284.4444" r="55.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="568.8889" y="278.2222" font-family="Arial,sans-serif" font-size="21.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">git</text>
  <text x="568.8889" y="299.5556" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--primary-accent)" text-anchor="middle">built-in tools</text>
  <rect x="26.6667" y="35.5556" width="231.1111" height="195.5556" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="26.6667" y="35.5556" width="231.1111" height="35.5556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="26.6667" y="56.8889" width="231.1111" height="14.2222" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="142.2222" y="59.5556" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">Inspection</text>
  <rect x="44.4444" y="87.1111" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="80" y="107.5556" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">bisect</text>
  <text x="160" y="107.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">binary bug search</text>
  <rect x="44.4444" y="128" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="80" y="148.4444" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">describe</text>
  <text x="164.4444" y="148.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">human names</text>
  <rect x="44.4444" y="168.8889" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="80" y="189.3333" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">log</text>
  <text x="124.4444" y="189.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">commit history &amp; graph</text>
  <rect x="26.6667" y="257.7778" width="231.1111" height="231.1111" fill="var(--ok-fill)" rx="6" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="26.6667" y="257.7778" width="231.1111" height="35.5556" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="26.6667" y="279.1111" width="231.1111" height="14.2222" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="142.2222" y="281.7778" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">Network</text>
  <rect x="44.4444" y="309.3333" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="80" y="329.7778" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--ok-accent)">daemon</text>
  <text x="155.5556" y="329.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">git:// protocol</text>
  <rect x="44.4444" y="350.2222" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="80" y="370.6667" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--ok-accent)">http-backend</text>
  <text x="182.2222" y="370.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">CGI/HTTP</text>
  <rect x="44.4444" y="391.1111" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="80" y="411.5556" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--ok-accent)">instaweb</text>
  <text x="164.4444" y="411.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">web browser UI</text>
  <rect x="44.4444" y="432" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="80" y="452.4444" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--ok-accent)">shell</text>
  <text x="128.8889" y="452.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">restricted SSH shell</text>
  <rect x="880" y="35.5556" width="231.1111" height="195.5556" fill="var(--warn-fill)" rx="6" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="880" y="35.5556" width="231.1111" height="35.5556" fill="var(--warn-accent)" rx="6" />
  <rect x="880" y="56.8889" width="231.1111" height="14.2222" fill="var(--warn-accent)" rx="6"/>
  <text x="995.5556" y="59.5556" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">Packaging</text>
  <rect x="897.7778" y="87.1111" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="937.7778" y="107.5556" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--danger-accent)">archive</text>
  <text x="1017.7778" y="107.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">tar / zip export</text>
  <rect x="897.7778" y="128" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="937.7778" y="148.4444" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--danger-accent)">bundle</text>
  <text x="1013.3333" y="148.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">portable repo file</text>
  <rect x="897.7778" y="168.8889" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="937.7778" y="189.3333" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--danger-accent)">gc / fsck</text>
  <text x="1026.6667" y="189.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">maintenance</text>
  <rect x="880" y="257.7778" width="231.1111" height="195.5556" fill="var(--info-fill)" rx="6" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="880" y="257.7778" width="231.1111" height="35.5556" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="880" y="279.1111" width="231.1111" height="14.2222" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="995.5556" y="281.7778" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">Collaboration</text>
  <rect x="897.7778" y="309.3333" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="937.7778" y="329.7778" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--info-accent)">notes</text>
  <text x="995.5556" y="329.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">annotate commits</text>
  <rect x="897.7778" y="350.2222" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="937.7778" y="370.6667" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--info-accent)">submodule</text>
  <text x="1040" y="370.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">sub-repos</text>
  <rect x="897.7778" y="391.1111" width="195.5556" height="32" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="937.7778" y="411.5556" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--info-accent)">worktree</text>
  <text x="1026.6667" y="411.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">parallel checkouts</text>
  <line x1="513.7778" y1="251.5556" x2="257.7778" y2="164.4444" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow-primary)" />
  <line x1="513.7778" y1="302.2222" x2="257.7778" y2="355.5556" stroke="var(--ok-border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" />
  <line x1="624" y1="251.5556" x2="880" y2="164.4444" stroke="var(--warn-border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" />
  <line x1="624" y1="302.2222" x2="880" y2="355.5556" stroke="var(--info-border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" />
  <rect x="17.7778" y="524.4444" width="1102.2222" height="44.4444" fill="var(--surface)" rx="6" filter="url(#shadow)" />
  <text x="568.8889" y="542.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle" font-weight="bold">All tools ship with Git — no extra installs needed</text>
  <text x="568.8889" y="558.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Combine them in shell scripts for release pipelines, server setup, and team workflows</text>
</svg>
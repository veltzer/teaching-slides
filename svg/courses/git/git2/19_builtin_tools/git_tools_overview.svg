<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <circle cx="640" cy="297.7777" r="53.8797" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="640" y="292.1389" font-family="Arial,sans-serif" font-size="20.8566" font-weight="bold" fill="var(--bg)" text-anchor="middle">git</text>
  <text x="640" y="311.4723" font-family="Arial,sans-serif" font-size="12.1663" fill="var(--primary-accent)" text-anchor="middle">built-in tools</text>
  <rect x="68.125" y="72.2223" width="243.75" height="177.2223" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="68.125" y="72.2223" width="243.75" height="32.2223" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="68.125" y="91.5556" width="243.75" height="12.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="190" y="93.9723" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Inspection</text>
  <rect x="86.875" y="118.9444" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="124.375" y="137.4723" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">bisect</text>
  <text x="208.75" y="137.4723" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">binary bug search</text>
  <rect x="86.875" y="156" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="124.375" y="174.5277" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">describe</text>
  <text x="213.4374" y="174.5277" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">human names</text>
  <rect x="86.875" y="193.0556" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="124.375" y="211.5833" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">log</text>
  <text x="171.25" y="211.5833" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">commit history &amp; graph</text>
  <rect x="68.125" y="273.6111" width="243.75" height="209.4444" fill="var(--ok-fill)" rx="6" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="68.125" y="273.6111" width="243.75" height="32.2223" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="68.125" y="292.9444" width="243.75" height="12.8889" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="190" y="295.3611" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Network</text>
  <rect x="86.875" y="320.3333" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="124.375" y="338.8611" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--ok-accent)">daemon</text>
  <text x="204.0625" y="338.8611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">git:// protocol</text>
  <rect x="86.875" y="357.3889" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="124.375" y="375.9167" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--ok-accent)">http-backend</text>
  <text x="232.1875" y="375.9167" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">CGI/HTTP</text>
  <rect x="86.875" y="394.4444" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="124.375" y="412.9723" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--ok-accent)">instaweb</text>
  <text x="213.4374" y="412.9723" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">web browser UI</text>
  <rect x="86.875" y="431.5" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="124.375" y="450.0277" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--ok-accent)">shell</text>
  <text x="175.9375" y="450.0277" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">restricted SSH shell</text>
  <rect x="968.125" y="72.2223" width="243.75" height="177.2223" fill="var(--warn-fill)" rx="6" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="968.125" y="72.2223" width="243.75" height="32.2223" fill="var(--warn-accent)" rx="6" />
  <rect x="968.125" y="91.5556" width="243.75" height="12.8889" fill="var(--warn-accent)" rx="6"/>
  <text x="1090" y="93.9723" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Packaging</text>
  <rect x="986.875" y="118.9444" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="1029.0625" y="137.4723" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--danger-accent)">archive</text>
  <text x="1113.4375" y="137.4723" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">tar / zip export</text>
  <rect x="986.875" y="156" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="1029.0625" y="174.5277" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--danger-accent)">bundle</text>
  <text x="1108.7499" y="174.5277" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">portable repo file</text>
  <rect x="986.875" y="193.0556" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="1029.0625" y="211.5833" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--danger-accent)">gc / fsck</text>
  <text x="1122.8125" y="211.5833" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">maintenance</text>
  <rect x="968.125" y="273.6111" width="243.75" height="177.2223" fill="var(--info-fill)" rx="6" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="968.125" y="273.6111" width="243.75" height="32.2223" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="968.125" y="292.9444" width="243.75" height="12.8889" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1090" y="295.3611" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Collaboration</text>
  <rect x="986.875" y="320.3333" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="1029.0625" y="338.8611" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--info-accent)">notes</text>
  <text x="1090" y="338.8611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">annotate commits</text>
  <rect x="986.875" y="357.3889" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="1029.0625" y="375.9167" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--info-accent)">submodule</text>
  <text x="1136.875" y="375.9167" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">sub-repos</text>
  <rect x="986.875" y="394.4444" width="206.25" height="29" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="1029.0625" y="412.9723" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--info-accent)">worktree</text>
  <text x="1122.8125" y="412.9723" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">parallel checkouts</text>
  <line x1="581.875" y1="267.9723" x2="311.875" y2="189.0277" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow-primary)" />
  <line x1="581.875" y1="313.8889" x2="311.875" y2="362.2223" stroke="var(--ok-border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" />
  <line x1="698.125" y1="267.9723" x2="968.125" y2="189.0277" stroke="var(--warn-border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" />
  <line x1="698.125" y1="313.8889" x2="968.125" y2="362.2223" stroke="var(--info-border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" />
  <rect x="58.75" y="515.2777" width="1162.5" height="40.2777" fill="var(--surface)" rx="6" filter="url(#shadow)" />
  <text x="640" y="531.3889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle" font-weight="bold">All tools ship with Git — no extra installs needed</text>
  <text x="640" y="545.8889" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">Combine them in shell scripts for release pipelines, server setup, and team workflows</text>
</svg>
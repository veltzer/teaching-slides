  <rect x="49.677419" y="40" width="251.612903" height="38.666779" fill="var(--primary-fill)" rx="6.677842" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="49.677419" y="63.199971" width="251.612903" height="15.466687" fill="var(--primary-fill)" rx="6.677842" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="39.8855" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Branch Naming Best Practices</text>
  <rect x="40" y="112.4999" width="599.9999" height="145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="340.0001" y="157.8126" text-anchor="middle" font-size="23.2667" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Good Names ✓</text>
  <text x="74.2858" y="203.1249" font-size="19.9427" font-family="Courier New, monospace" fill="var(--ok-text)">feature/user-authentication</text>
  <text x="74.2858" y="239.3751" font-size="19.9427" font-family="Courier New, monospace" fill="var(--ok-text)">bugfix/login-error-handling</text>
  <rect x="674.2857" y="112.4999" width="565.7143" height="145" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1427" y="157.8126" text-anchor="middle" font-size="23.2667" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Bad Names ✗</text>
  <text x="708.5714" y="203.1249" font-size="19.9427" font-family="Courier New, monospace" fill="var(--danger-text)">my-branch</text>
  <text x="708.5714" y="239.3751" font-size="19.9427" font-family="Courier New, monospace" fill="var(--danger-text)">test123</text>
  <rect x="40" y="293.75" width="1199.9999" height="326.25" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="348.125" text-anchor="middle" font-size="26.5905" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Common Prefixes</text>
  <text x="74.2858" y="402.5" font-size="19.9427" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">feature/</tspan> - New features</text>
  <text x="74.2858" y="438.7501" font-size="19.9427" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">bugfix/</tspan> - Bug fixes</text>
  <text x="74.2858" y="475" font-size="19.9427" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">hotfix/</tspan> - Urgent fixes for production</text>
  <text x="74.2858" y="511.25" font-size="19.9427" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">release/</tspan> - Release preparation</text>
  <text x="640.0001" y="402.5" font-size="19.9427" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">chore/</tspan> - Maintenance tasks</text>
  <text x="640.0001" y="438.7501" font-size="19.9427" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">docs/</tspan> - Documentation</text>
  <text x="640.0001" y="475" font-size="19.9427" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">refactor/</tspan> - Code refactoring</text>
  <text x="640.0001" y="511.25" font-size="19.9427" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">test/</tspan> - Test additions/changes</text>
  <text x="640.0001" y="583.75" text-anchor="middle" font-size="21.6046" font-style="italic" font-family="Arial, sans-serif" fill="var(--warn-text)">Use lowercase, hyphens, and be descriptive!</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Branch Naming Best Practices</text>
  <rect x="80" y="144" width="560" height="144" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="360" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">Good Names ✓</text>
  <text x="112" y="234" font-size="19.2" font-family="monospace">feature/user-authentication</text>
  <text x="112" y="270" font-size="19.2" font-family="monospace">bugfix/login-error-handling</text>
  <rect x="672" y="144" width="528" height="144" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="936" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">Bad Names ✗</text>
  <text x="704" y="234" font-size="19.2" font-family="monospace">my-branch</text>
  <text x="704" y="270" font-size="19.2" font-family="monospace">test123</text>
  <rect x="80" y="324" width="1120" height="324" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="378" text-anchor="middle" font-size="25.6" font-weight="bold">Common Prefixes</text>
  <text x="112" y="432" font-size="19.2">
    <tspan font-family="monospace">feature/</tspan> - New features</text>
  <text x="112" y="468" font-size="19.2">
    <tspan font-family="monospace">bugfix/</tspan> - Bug fixes</text>
  <text x="112" y="504" font-size="19.2">
    <tspan font-family="monospace">hotfix/</tspan> - Urgent fixes for production</text>
  <text x="112" y="540" font-size="19.2">
    <tspan font-family="monospace">release/</tspan> - Release preparation</text>
  <text x="640" y="432" font-size="19.2">
    <tspan font-family="monospace">chore/</tspan> - Maintenance tasks</text>
  <text x="640" y="468" font-size="19.2">
    <tspan font-family="monospace">docs/</tspan> - Documentation</text>
  <text x="640" y="504" font-size="19.2">
    <tspan font-family="monospace">refactor/</tspan> - Code refactoring</text>
  <text x="640" y="540" font-size="19.2">
    <tspan font-family="monospace">test/</tspan> - Test additions/changes</text>
  <text x="640" y="612" text-anchor="middle" font-size="20.8" font-style="italic">Use lowercase, hyphens, and be descriptive!</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Branch Naming Best Practices</ns0:text>
  <ns0:rect x="79.0123" y="142.2222" width="553.0864" height="142.2222" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="355.5556" y="186.6667" text-anchor="middle" font-size="22.1235" font-weight="bold">Good Names ✓</ns0:text>
  <ns0:text x="110.6173" y="231.1111" font-size="18.963" font-family="monospace">feature/user-authentication</ns0:text>
  <ns0:text x="110.6173" y="266.6667" font-size="18.963" font-family="monospace">bugfix/login-error-handling</ns0:text>
  <ns0:rect x="663.7037" y="142.2222" width="521.4815" height="142.2222" fill="#FFEBEE" stroke="#C62828" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="924.4444" y="186.6667" text-anchor="middle" font-size="22.1235" font-weight="bold">Bad Names ✗</ns0:text>
  <ns0:text x="695.3086" y="231.1111" font-size="18.963" font-family="monospace">my-branch</ns0:text>
  <ns0:text x="695.3086" y="266.6667" font-size="18.963" font-family="monospace">test123</ns0:text>
  <ns0:rect x="79.0123" y="320" width="1106.1728" height="320" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="632.0988" y="373.3333" text-anchor="middle" font-size="25.284" font-weight="bold">Common Prefixes</ns0:text>
  <ns0:text x="110.6173" y="426.6667" font-size="18.963">
    <ns0:tspan font-family="monospace">feature/</ns0:tspan> - New features</ns0:text>
  <ns0:text x="110.6173" y="462.2222" font-size="18.963">
    <ns0:tspan font-family="monospace">bugfix/</ns0:tspan> - Bug fixes</ns0:text>
  <ns0:text x="110.6173" y="497.7778" font-size="18.963">
    <ns0:tspan font-family="monospace">hotfix/</ns0:tspan> - Urgent fixes for production</ns0:text>
  <ns0:text x="110.6173" y="533.3333" font-size="18.963">
    <ns0:tspan font-family="monospace">release/</ns0:tspan> - Release preparation</ns0:text>
  <ns0:text x="632.0988" y="426.6667" font-size="18.963">
    <ns0:tspan font-family="monospace">chore/</ns0:tspan> - Maintenance tasks</ns0:text>
  <ns0:text x="632.0988" y="462.2222" font-size="18.963">
    <ns0:tspan font-family="monospace">docs/</ns0:tspan> - Documentation</ns0:text>
  <ns0:text x="632.0988" y="497.7778" font-size="18.963">
    <ns0:tspan font-family="monospace">refactor/</ns0:tspan> - Code refactoring</ns0:text>
  <ns0:text x="632.0988" y="533.3333" font-size="18.963">
    <ns0:tspan font-family="monospace">test/</ns0:tspan> - Test additions/changes</ns0:text>
  <ns0:text x="632.0988" y="604.4444" text-anchor="middle" font-size="20.5432" font-style="italic">Use lowercase, hyphens, and be descriptive!</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="45.2548" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Branches are Lightweight Pointers</text>
  <rect x="40" y="120" width="1200" height="240" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="180" text-anchor="middle" font-size="30.1699" font-family="Arial, sans-serif" fill="var(--primary-text)">A branch is just a movable pointer to a commit</text>
  <text x="640" y="230" text-anchor="middle" font-size="26.3987" font-family="Arial, sans-serif" fill="var(--primary-text)">Creating a branch = Creating a 41-byte file</text>
  <text x="640" y="280" text-anchor="middle" font-size="26.3987" font-family="Arial, sans-serif" fill="var(--primary-text)">Switching branches = Moving HEAD pointer</text>
  <text x="640" y="330" text-anchor="middle" font-size="26.3987" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">That's why Git branches are so fast!</text>
  <rect x="140" y="400" width="240" height="120" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="470" text-anchor="middle" font-size="26.3987" fill="var(--bg)" font-family="Arial, sans-serif">Commit A</text>
  <rect x="520" y="400" width="240" height="120" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="470" text-anchor="middle" font-size="26.3987" fill="var(--bg)" font-family="Arial, sans-serif">Commit B</text>
  <rect x="900" y="400" width="240" height="120" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="470" text-anchor="middle" font-size="26.3987" fill="var(--bg)" font-family="Arial, sans-serif">Commit C</text>
  <line x1="380" y1="460" x2="520" y2="460" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="460" x2="900" y2="460" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="260" width="120" height="60" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="300" text-anchor="middle" font-size="22.6274" fill="var(--bg)" font-family="Arial, sans-serif">main</text>
  <line x1="960" y1="320" x2="1020" y2="400" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1040" y="260" width="120" height="60" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="300" text-anchor="middle" font-size="22.6274" fill="var(--bg)" font-family="Arial, sans-serif">feature</text>
  <line x1="1100" y1="320" x2="1020" y2="400" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="620" text-anchor="middle" font-size="22.6274" font-style="italic" font-family="Arial, sans-serif" fill="var(--text)">Both branches point to same commit - cost: 41 bytes each!</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

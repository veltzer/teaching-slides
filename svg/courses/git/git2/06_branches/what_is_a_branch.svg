<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Branches are Lightweight Pointers</text>
  <rect x="160" y="144" width="960" height="216" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="640" y="198" text-anchor="middle" font-size="25.6">A branch is just a movable pointer to a commit</text>
  <text x="640" y="243" text-anchor="middle" font-size="22.4">Creating a branch = Creating a 41-byte file</text>
  <text x="640" y="288" text-anchor="middle" font-size="22.4">Switching branches = Moving HEAD pointer</text>
  <text x="640" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">That's why Git branches are so fast!</text>
  <rect x="240" y="396" width="192" height="108" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="336" y="459" text-anchor="middle" font-size="22.4" fill="var(--bg)">Commit A</text>
  <rect x="544" y="396" width="192" height="108" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="459" text-anchor="middle" font-size="22.4" fill="var(--bg)">Commit B</text>
  <rect x="848" y="396" width="192" height="108" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="944" y="459" text-anchor="middle" font-size="22.4" fill="var(--bg)">Commit C</text>
  <line x1="432" y1="450" x2="544" y2="450" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="736" y1="450" x2="848" y2="450" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="848" y="270" width="96" height="54" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="896" y="306" text-anchor="middle" font-size="19.2" fill="var(--bg)">main</text>
  <line x1="896" y1="324" x2="944" y2="396" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="960" y="270" width="96" height="54" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1008" y="306" text-anchor="middle" font-size="19.2" fill="var(--bg)">feature</text>
  <line x1="1008" y1="324" x2="944" y2="396" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="594" text-anchor="middle" font-size="19.2" font-style="italic">Both branches point to same commit - cost: 41 bytes each!</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
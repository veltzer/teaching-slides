<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Branches are Lightweight Pointers</text>
  <rect x="160" y="144" width="960" height="216" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="640" y="198" text-anchor="middle" font-size="25.6">A branch is just a movable pointer to a commit</text>
  <text x="640" y="243" text-anchor="middle" font-size="22.4">Creating a branch = Creating a 41-byte file</text>
  <text x="640" y="288" text-anchor="middle" font-size="22.4">Switching branches = Moving HEAD pointer</text>
  <text x="640" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">That's why Git branches are so fast!</text>
  <rect x="240" y="396" width="192" height="108" fill="#4CAF50" rx="8" />
  <text x="336" y="459" text-anchor="middle" font-size="22.4" fill="white">Commit A</text>
  <rect x="544" y="396" width="192" height="108" fill="#4CAF50" rx="8" />
  <text x="640" y="459" text-anchor="middle" font-size="22.4" fill="white">Commit B</text>
  <rect x="848" y="396" width="192" height="108" fill="#4CAF50" rx="8" />
  <text x="944" y="459" text-anchor="middle" font-size="22.4" fill="white">Commit C</text>
  <line x1="432" y1="450" x2="544" y2="450" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <line x1="736" y1="450" x2="848" y2="450" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <rect x="848" y="270" width="96" height="54" fill="#2196F3" rx="4.8" />
  <text x="896" y="306" text-anchor="middle" font-size="19.2" fill="white">main</text>
  <line x1="896" y1="324" x2="944" y2="396" stroke="#2196F3" stroke-width="3.2" marker-end="url(#arrow1)" />
  <rect x="960" y="270" width="96" height="54" fill="#FF9800" rx="4.8" />
  <text x="1008" y="306" text-anchor="middle" font-size="19.2" fill="white">feature</text>
  <line x1="1008" y1="324" x2="944" y2="396" stroke="#FF9800" stroke-width="3.2" marker-end="url(#arrow1)" />
  <text x="640" y="594" text-anchor="middle" font-size="19.2" font-style="italic">Both branches point to same commit - cost: 41 bytes each!</text>
  <defs>
    <marker id="arrow1" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.753498" font-weight="bold" fill="var(--text)">Types of Merges</text>

  <rect x="40" y="71.636364" width="595" height="548.363636" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="337.5" y="113.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--ok-text)">Fast-Forward Merge</text>
  <text x="337.5" y="150.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">main has no new commits since branch point</text>

  <rect x="87.408" y="217.772" width="45.1841" height="45.1841" rx="14" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="197.408" y="217.772" width="45.1841" height="45.1841" rx="14" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="307.408" y="217.772" width="45.1841" height="45.1841" rx="14" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="417.408" y="217.772" width="45.1841" height="45.1841" rx="14" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="527.408" y="217.772" width="45.1841" height="45.1841" rx="14" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="132" y1="240.363636" x2="198" y2="240.363636" stroke="var(--ok-text)" stroke-width="2"/>
  <line x1="242" y1="240.363636" x2="308" y2="240.363636" stroke="var(--ok-text)" stroke-width="2"/>
  <line x1="352" y1="240.363636" x2="418" y2="240.363636" stroke="var(--ok-text)" stroke-width="2"/>
  <line x1="462" y1="240.363636" x2="528" y2="240.363636" stroke="var(--ok-text)" stroke-width="2"/>
  <text x="110" y="245.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--text)">A</text>
  <text x="220" y="245.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--text)">B</text>
  <text x="330" y="245.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--text)">C</text>
  <text x="440" y="245.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--text)">D</text>
  <text x="550" y="245.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--text)">E</text>
  <text x="220" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--ok-text)">main</text>
  <text x="500" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--ok-text)">feature</text>

  <text x="337.5" y="319.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" font-weight="bold" fill="var(--ok-text)">Linear history, no merge commit</text>
  <text x="337.5" y="356.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">Git simply moves the main pointer forward</text>
  <text x="337.5" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">Cleanest possible outcome</text>
  <text x="337.5" y="430.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">Easy to read, easy to bisect</text>
  <text x="337.5" y="461.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">Lose branch context — hard to tell features apart</text>
  <text x="337.5" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" font-weight="bold" fill="var(--ok-text)">Command</text>
  <text x="337.5" y="540.909091" text-anchor="middle" font-family="monospace" font-size="15.40366" fill="var(--ok-text)">git merge feature</text>
  <text x="337.5" y="577.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">Use --no-ff to force a merge commit</text>

  <rect x="645" y="71.636364" width="595" height="548.363636" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="942.5" y="113.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--primary-text)">3-Way Merge</text>
  <text x="942.5" y="150.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">Both branches moved since they diverged</text>

  <rect x="687.408" y="217.772" width="45.1841" height="45.1841" rx="14" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="797.408" y="217.772" width="45.1841" height="45.1841" rx="14" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="907.408" y="170.317" width="45.1841" height="45.1841" rx="14" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="907.408" y="265.226" width="45.1841" height="45.1841" rx="14" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1017.41" y="217.772" width="45.1841" height="45.1841" rx="14" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1125.35" y="215.718" width="49.2917" height="49.2917" rx="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="732" y1="240.363636" x2="798" y2="240.363636" stroke="var(--primary-text)" stroke-width="2"/>
  <line x1="838" y1="232.981818" x2="915" y2="200.290909" stroke="var(--primary-text)" stroke-width="2"/>
  <line x1="838" y1="247.745455" x2="915" y2="280.436364" stroke="var(--primary-text)" stroke-width="2"/>
  <line x1="945" y1="200.290909" x2="1025" y2="232.981818" stroke="var(--primary-text)" stroke-width="2"/>
  <line x1="945" y1="280.436364" x2="1025" y2="247.745455" stroke="var(--primary-text)" stroke-width="2"/>
  <line x1="1062" y1="240.363636" x2="1128" y2="240.363636" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="1150" y="245.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--warn-text)">M</text>
  <text x="930" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--primary-text)">main</text>
  <text x="930" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--primary-text)">feature</text>

  <text x="942.5" y="382.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" font-weight="bold" fill="var(--primary-text)">Creates a merge commit with two parents</text>
  <text x="942.5" y="414.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">Git compares both tips to their common ancestor</text>
  <text x="942.5" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">Combines changes from both sides automatically</text>
  <text x="942.5" y="477.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">Conflicts surface when the same lines changed</text>
  <text x="942.5" y="509.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">History keeps the branch shape and context</text>
  <text x="942.5" y="551.454545" text-anchor="middle" font-family="monospace" font-size="15.40366" fill="var(--primary-text)">git merge --no-ff feature</text>
  <text x="942.5" y="588.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">Rebase first if you prefer linear history</text>
</svg>

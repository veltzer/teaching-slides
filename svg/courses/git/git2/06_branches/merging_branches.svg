  <text x="337" y="327.387387387387" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--ok-text)">Linear, no merge commit</text>
  <text x="337" y="369.189189189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Main pointer moves forward</text>

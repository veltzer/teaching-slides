<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="156.5" text-anchor="middle" font-size="41.1344" font-weight="bold">Types of Merges</text>
  <rect x="40" y="233.6111" width="600" height="269.8889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="5.9988" />
  <text x="340" y="291.4445" text-anchor="middle" font-size="27.423" font-weight="bold">Fast-Forward Merge</text>
  <circle cx="160" cy="368.5555" r="25.709" fill="var(--ok-fill)" />
  <circle cx="262.8571" cy="368.5555" r="25.709" fill="var(--ok-fill)" />
  <circle cx="365.7143" cy="368.5555" r="25.709" fill="var(--ok-fill)" />
  <circle cx="468.5714" cy="368.5555" r="25.709" fill="var(--ok-fill)" />
  <line x1="185.7143" y1="368.5555" x2="237.1429" y2="368.5555" stroke="var(--text)" stroke-width="2" />
  <line x1="288.5714" y1="368.5555" x2="340" y2="368.5555" stroke="var(--text)" stroke-width="2" />
  <line x1="391.4286" y1="368.5555" x2="442.8571" y2="368.5555" stroke="var(--text)" stroke-width="2" />
  <text x="314.2857" y="330" font-size="17.1394">main</text>
  <text x="417.1429" y="330" font-size="17.1394">feature</text>
  <text x="340" y="455.3055" text-anchor="middle" font-size="20.5672">Linear history - just moves pointer</text>
  <rect x="674.2857" y="233.6111" width="565.7143" height="269.8889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="5.9988" />
  <text x="957.1429" y="291.4445" text-anchor="middle" font-size="27.423" font-weight="bold">3-Way Merge</text>
  <circle cx="777.1429" cy="349.2778" r="25.709" fill="var(--primary-fill)" />
  <circle cx="880" cy="349.2778" r="25.709" fill="var(--primary-fill)" />
  <circle cx="880" cy="426.3889" r="25.709" fill="var(--primary-fill)" />
  <circle cx="982.8571" cy="387.8333" r="25.709" fill="var(--primary-fill)" />
  <line x1="802.8571" y1="349.2778" x2="854.2857" y2="349.2778" stroke="var(--text)" stroke-width="2" />
  <line x1="880" y1="378.1945" x2="880" y2="397.4722" stroke="var(--text)" stroke-width="2" />
  <line x1="905.7143" y1="349.2778" x2="957.1429" y2="378.1945" stroke="var(--text)" stroke-width="2" />
  <line x1="905.7143" y1="426.3889" x2="957.1429" y2="397.4722" stroke="var(--text)" stroke-width="2" />
  <text x="957.1429" y="455.3055" text-anchor="middle" font-size="20.5672">Creates merge commit</text>
</svg>
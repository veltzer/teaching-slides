<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="168" text-anchor="middle" font-size="38.4" font-weight="bold">Types of Merges</text>
  <rect x="80" y="240" width="560" height="252" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="360" y="294" text-anchor="middle" font-size="25.6" font-weight="bold">Fast-Forward Merge</text>
  <circle cx="192" cy="366" r="24" fill="var(--ok-fill)" />
  <circle cx="288" cy="366" r="24" fill="var(--ok-fill)" />
  <circle cx="384" cy="366" r="24" fill="var(--ok-fill)" />
  <circle cx="480" cy="366" r="24" fill="var(--ok-fill)" />
  <line x1="216" y1="366" x2="264" y2="366" stroke="var(--text)" stroke-width="2" />
  <line x1="312" y1="366" x2="360" y2="366" stroke="var(--text)" stroke-width="2" />
  <line x1="408" y1="366" x2="456" y2="366" stroke="var(--text)" stroke-width="2" />
  <text x="336" y="330" font-size="16">main</text>
  <text x="432" y="330" font-size="16">feature</text>
  <text x="360" y="447" text-anchor="middle" font-size="19.2">Linear history - just moves pointer</text>
  <rect x="672" y="240" width="528" height="252" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="936" y="294" text-anchor="middle" font-size="25.6" font-weight="bold">3-Way Merge</text>
  <circle cx="768" cy="348" r="24" fill="var(--primary-fill)" />
  <circle cx="864" cy="348" r="24" fill="var(--primary-fill)" />
  <circle cx="864" cy="420" r="24" fill="var(--primary-fill)" />
  <circle cx="960" cy="384" r="24" fill="var(--primary-fill)" />
  <line x1="792" y1="348" x2="840" y2="348" stroke="var(--text)" stroke-width="2" />
  <line x1="864" y1="375" x2="864" y2="393" stroke="var(--text)" stroke-width="2" />
  <line x1="888" y1="348" x2="936" y2="375" stroke="var(--text)" stroke-width="2" />
  <line x1="888" y1="420" x2="936" y2="393" stroke="var(--text)" stroke-width="2" />
  <text x="936" y="447" text-anchor="middle" font-size="19.2">Creates merge commit</text>
</svg>
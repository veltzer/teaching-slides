<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Types of Merges</text>
  <rect x="80" y="144" width="560" height="252" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="360" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Fast-Forward Merge</text>
  <circle cx="192" cy="270" r="24" fill="#4CAF50" />
  <circle cx="288" cy="270" r="24" fill="#4CAF50" />
  <circle cx="384" cy="270" r="24" fill="#a5d6a7" />
  <circle cx="480" cy="270" r="24" fill="#a5d6a7" />
  <line x1="216" y1="270" x2="264" y2="270" stroke="#333" stroke-width="3.2" />
  <line x1="312" y1="270" x2="360" y2="270" stroke="#333" stroke-width="3.2" />
  <line x1="408" y1="270" x2="456" y2="270" stroke="#333" stroke-width="3.2" />
  <text x="336" y="234" font-size="16">main</text>
  <text x="432" y="234" font-size="16">feature</text>
  <text x="360" y="351" text-anchor="middle" font-size="19.2">Linear history - just moves pointer</text>
  <rect x="672" y="144" width="528" height="252" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="936" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">3-Way Merge</text>
  <circle cx="768" cy="252" r="24" fill="#2196F3" />
  <circle cx="864" cy="252" r="24" fill="#2196F3" />
  <circle cx="864" cy="324" r="24" fill="#90caf9" />
  <circle cx="960" cy="288" r="24" fill="#1976D2" />
  <line x1="792" y1="252" x2="840" y2="252" stroke="#333" stroke-width="3.2" />
  <line x1="864" y1="279" x2="864" y2="297" stroke="#333" stroke-width="3.2" />
  <line x1="888" y1="252" x2="936" y2="279" stroke="#333" stroke-width="3.2" />
  <line x1="888" y1="324" x2="936" y2="297" stroke="#333" stroke-width="3.2" />
  <text x="936" y="351" text-anchor="middle" font-size="19.2">Creates merge commit</text>
</svg>
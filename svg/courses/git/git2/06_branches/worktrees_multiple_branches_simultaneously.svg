<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Git Worktrees</text>
  <rect x="320" y="144" width="640" height="108" fill="#4CAF50" rx="8" />
  <text x="640" y="207" text-anchor="middle" font-size="25.6" fill="white">One Repository, Multiple Working Directories</text>
  <rect x="160" y="288" width="320" height="180" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="320" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">Main Worktree</text>
  <text x="320" y="369" text-anchor="middle" font-size="19.2">~/project/</text>
  <text x="320" y="405" text-anchor="middle" font-size="17.6">Branch: main</text>
  <text x="320" y="441" text-anchor="middle" font-size="17.6">Can edit files</text>
  <rect x="512" y="288" width="320" height="180" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="672" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">Feature Worktree</text>
  <text x="672" y="369" text-anchor="middle" font-size="19.2">~/project-feature/</text>
  <text x="672" y="405" text-anchor="middle" font-size="17.6">Branch: feature</text>
  <text x="672" y="441" text-anchor="middle" font-size="17.6">Can edit files</text>
  <rect x="864" y="288" width="320" height="180" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="1024" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">Hotfix Worktree</text>
  <text x="1024" y="369" text-anchor="middle" font-size="19.2">~/project-hotfix/</text>
  <text x="1024" y="405" text-anchor="middle" font-size="17.6">Branch: hotfix</text>
  <text x="1024" y="441" text-anchor="middle" font-size="17.6">Can edit files</text>
  <rect x="480" y="504" width="320" height="72" fill="#9C27B0" rx="8" />
  <text x="640" y="549" text-anchor="middle" font-size="22.4" fill="white">Shared .git</text>
  <line x1="320" y1="468" x2="560" y2="504" stroke="#333" stroke-width="3.2" />
  <line x1="672" y1="468" x2="640" y2="504" stroke="#333" stroke-width="3.2" />
  <line x1="1024" y1="468" x2="720" y2="504" stroke="#333" stroke-width="3.2" />
</svg>
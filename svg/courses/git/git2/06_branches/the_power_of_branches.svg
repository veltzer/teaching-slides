<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="613.1344" y="40" text-anchor="middle" font-size="44.8001" font-weight="bold">Life With Branches</text>
  <circle cx="75.8209" cy="390.1887" r="37.3334" fill="var(--ok-fill)" />
  <text x="75.8209" y="401.1321" text-anchor="middle" font-size="18.6667" fill="var(--bg)">v1.0</text>
  <circle cx="254.9254" cy="390.1887" r="37.3334" fill="var(--ok-fill)" />
  <text x="254.9254" y="401.1321" text-anchor="middle" font-size="18.6667" fill="var(--bg)">stable</text>
  <text x="165.3731" y="346.4151" text-anchor="middle" font-size="22.4001">main</text>
  <circle cx="254.9254" cy="215.0944" r="37.3334" fill="var(--primary-fill)" />
  <text x="254.9254" y="226.0377" text-anchor="middle" font-size="18.6667" fill="var(--bg)">feat</text>
  <circle cx="434.0299" cy="215.0944" r="37.3334" fill="var(--primary-fill)" />
  <text x="434.0299" y="226.0377" text-anchor="middle" font-size="18.6667" fill="var(--bg)">test</text>
  <circle cx="613.1344" cy="215.0944" r="37.3334" fill="var(--primary-fill)" />
  <text x="613.1344" y="226.0377" text-anchor="middle" font-size="18.6667" fill="var(--bg)">done</text>
  <text x="434.0299" y="171.3207" text-anchor="middle" font-size="22.4001">feature</text>
  <circle cx="254.9254" cy="565.283" r="37.3334" fill="var(--warn-fill)" />
  <text x="254.9254" y="576.2265" text-anchor="middle" font-size="18.6667" fill="var(--bg)">fix</text>
  <circle cx="434.0299" cy="565.283" r="37.3334" fill="var(--warn-fill)" />
  <text x="434.0299" y="576.2265" text-anchor="middle" font-size="18.6667" fill="var(--bg)">test</text>
  <text x="344.4776" y="620" text-anchor="middle" font-size="22.4001">hotfix</text>
  <line x1="111.6418" y1="390.1887" x2="219.1045" y2="390.1887" stroke="var(--text)" stroke-width="2" />
  <line x1="254.9254" y1="346.4151" x2="254.9254" y2="258.8679" stroke="var(--text)" stroke-width="2" />
  <line x1="290.7463" y1="215.0944" x2="398.209" y2="215.0944" stroke="var(--text)" stroke-width="2" />
  <line x1="469.8507" y1="215.0944" x2="577.3134" y2="215.0944" stroke="var(--text)" stroke-width="2" />
  <line x1="254.9254" y1="433.9623" x2="254.9254" y2="521.5094" stroke="var(--text)" stroke-width="2" />
  <line x1="290.7463" y1="565.283" x2="398.209" y2="565.283" stroke="var(--text)" stroke-width="2" />
  <rect x="702.6866" y="171.3207" width="537.3134" height="437.7359" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="971.3433" y="236.9811" text-anchor="middle" font-size="29.8668" font-weight="bold">Benefits:</text>
  <text x="738.5075" y="302.6415" font-size="22.4001">✓ Parallel development</text>
  <text x="738.5075" y="346.4151" font-size="22.4001">✓ Isolated experiments</text>
  <text x="738.5075" y="390.1887" font-size="22.4001">✓ Stable main branch</text>
  <text x="738.5075" y="433.9623" font-size="22.4001">✓ Easy collaboration</text>
  <text x="738.5075" y="477.7359" font-size="22.4001">✓ Feature toggles</text>
  <text x="738.5075" y="521.5094" font-size="22.4001">✓ Clean history</text>
</svg>
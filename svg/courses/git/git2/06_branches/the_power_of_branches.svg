<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="614.9254" y="80.8209" text-anchor="middle" font-size="40.1194" font-weight="bold">Life With Branches</text>
  <circle cx="113.4328" cy="381.7164" r="33.4328" fill="var(--ok-fill)" />
  <text x="113.4328" y="391.1194" text-anchor="middle" font-size="16.7164" fill="var(--bg)">v1.0</text>
  <circle cx="280.597" cy="381.7164" r="33.4328" fill="var(--ok-fill)" />
  <text x="280.597" y="391.1194" text-anchor="middle" font-size="16.7164" fill="var(--bg)">stable</text>
  <text x="197.0149" y="344.1045" text-anchor="middle" font-size="20.0597">main</text>
  <circle cx="280.597" cy="231.2687" r="33.4328" fill="var(--primary-fill)" />
  <text x="280.597" y="240.6716" text-anchor="middle" font-size="16.7164" fill="var(--bg)">feat</text>
  <circle cx="447.7612" cy="231.2687" r="33.4328" fill="var(--primary-fill)" />
  <text x="447.7612" y="240.6716" text-anchor="middle" font-size="16.7164" fill="var(--bg)">test</text>
  <circle cx="614.9254" cy="231.2687" r="33.4328" fill="var(--primary-fill)" />
  <text x="614.9254" y="240.6716" text-anchor="middle" font-size="16.7164" fill="var(--bg)">done</text>
  <text x="447.7612" y="193.6567" text-anchor="middle" font-size="20.0597">feature</text>
  <circle cx="280.597" cy="532.1642" r="33.4328" fill="var(--warn-fill)" />
  <text x="280.597" y="541.5672" text-anchor="middle" font-size="16.7164" fill="var(--bg)">fix</text>
  <circle cx="447.7612" cy="532.1642" r="33.4328" fill="var(--warn-fill)" />
  <text x="447.7612" y="541.5672" text-anchor="middle" font-size="16.7164" fill="var(--bg)">test</text>
  <text x="364.1791" y="579.1791" text-anchor="middle" font-size="20.0597">hotfix</text>
  <line x1="146.8657" y1="381.7164" x2="247.1642" y2="381.7164" stroke="var(--text)" stroke-width="2" />
  <line x1="280.597" y1="344.1045" x2="280.597" y2="268.8806" stroke="var(--text)" stroke-width="2" />
  <line x1="314.0299" y1="231.2687" x2="414.3284" y2="231.2687" stroke="var(--text)" stroke-width="2" />
  <line x1="481.194" y1="231.2687" x2="581.4925" y2="231.2687" stroke="var(--text)" stroke-width="2" />
  <line x1="280.597" y1="419.3284" x2="280.597" y2="494.5522" stroke="var(--text)" stroke-width="2" />
  <line x1="314.0299" y1="532.1642" x2="414.3284" y2="532.1642" stroke="var(--text)" stroke-width="2" />
  <rect x="698.5075" y="193.6567" width="501.4925" height="376.1194" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.2687" />
  <text x="949.2537" y="250.0746" text-anchor="middle" font-size="26.7463" font-weight="bold">Benefits:</text>
  <text x="731.9403" y="306.4925" font-size="20.0597">✓ Parallel development</text>
  <text x="731.9403" y="344.1045" font-size="20.0597">✓ Isolated experiments</text>
  <text x="731.9403" y="381.7164" font-size="20.0597">✓ Stable main branch</text>
  <text x="731.9403" y="419.3284" font-size="20.0597">✓ Easy collaboration</text>
  <text x="731.9403" y="456.9403" font-size="20.0597">✓ Feature toggles</text>
  <text x="731.9403" y="494.5522" font-size="20.0597">✓ Clean history</text>
</svg>
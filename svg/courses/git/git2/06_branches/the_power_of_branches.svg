<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Life With Branches</text>
  <circle cx="160" cy="360" r="32" fill="var(--ok-fill)" />
  <text x="160" y="369" text-anchor="middle" font-size="16" fill="var(--bg)">v1.0</text>
  <circle cx="320" cy="360" r="32" fill="var(--ok-fill)" />
  <text x="320" y="369" text-anchor="middle" font-size="16" fill="var(--bg)">stable</text>
  <text x="240" y="324" text-anchor="middle" font-size="19.2">main</text>
  <circle cx="320" cy="216" r="32" fill="var(--primary-fill)" />
  <text x="320" y="225" text-anchor="middle" font-size="16" fill="var(--bg)">feat</text>
  <circle cx="480" cy="216" r="32" fill="var(--primary-fill)" />
  <text x="480" y="225" text-anchor="middle" font-size="16" fill="var(--bg)">test</text>
  <circle cx="640" cy="216" r="32" fill="var(--primary-fill)" />
  <text x="640" y="225" text-anchor="middle" font-size="16" fill="var(--bg)">done</text>
  <text x="480" y="180" text-anchor="middle" font-size="19.2">feature</text>
  <circle cx="320" cy="504" r="32" fill="var(--warn-fill)" />
  <text x="320" y="513" text-anchor="middle" font-size="16" fill="var(--bg)">fix</text>
  <circle cx="480" cy="504" r="32" fill="var(--warn-fill)" />
  <text x="480" y="513" text-anchor="middle" font-size="16" fill="var(--bg)">test</text>
  <text x="400" y="549" text-anchor="middle" font-size="19.2">hotfix</text>
  <line x1="192" y1="360" x2="288" y2="360" stroke="var(--text)" stroke-width="2" />
  <line x1="320" y1="324" x2="320" y2="252" stroke="var(--text)" stroke-width="2" />
  <line x1="352" y1="216" x2="448" y2="216" stroke="var(--text)" stroke-width="2" />
  <line x1="512" y1="216" x2="608" y2="216" stroke="var(--text)" stroke-width="2" />
  <line x1="320" y1="396" x2="320" y2="468" stroke="var(--text)" stroke-width="2" />
  <line x1="352" y1="504" x2="448" y2="504" stroke="var(--text)" stroke-width="2" />
  <rect x="720" y="180" width="480" height="360" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="960" y="234" text-anchor="middle" font-size="25.6" font-weight="bold">Benefits:</text>
  <text x="752" y="288" font-size="19.2">✓ Parallel development</text>
  <text x="752" y="324" font-size="19.2">✓ Isolated experiments</text>
  <text x="752" y="360" font-size="19.2">✓ Stable main branch</text>
  <text x="752" y="396" font-size="19.2">✓ Easy collaboration</text>
  <text x="752" y="432" font-size="19.2">✓ Feature toggles</text>
  <text x="752" y="468" font-size="19.2">✓ Clean history</text>
</svg>
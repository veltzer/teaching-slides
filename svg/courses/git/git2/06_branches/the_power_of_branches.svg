<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="613.936" y="40" text-anchor="middle" font-size="44.7715" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Life With Branches</text>
  <rect x="40" y="352.879" width="74.619" height="74.619" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="77.3095" y="401.1321" text-anchor="middle" font-size="18.6547" fill="var(--bg)" font-family="Arial, sans-serif">v1.0</text>
  <rect x="218.875" y="352.879" width="74.619" height="74.619" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="256.1849" y="401.1321" text-anchor="middle" font-size="18.6547" fill="var(--bg)" font-family="Arial, sans-serif">stable</text>
  <text x="166.7472" y="346.4151" text-anchor="middle" font-size="22.3858" font-family="Arial, sans-serif" fill="var(--text)">main</text>
  <rect x="218.875" y="177.785" width="74.619" height="74.619" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="256.1849" y="226.0377" text-anchor="middle" font-size="18.6547" fill="var(--bg)" font-family="Arial, sans-serif">feat</text>
  <rect x="397.751" y="177.785" width="74.619" height="74.619" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="435.0605" y="226.0377" text-anchor="middle" font-size="18.6547" fill="var(--bg)" font-family="Arial, sans-serif">test</text>
  <rect x="576.627" y="177.785" width="74.619" height="74.619" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="613.936" y="226.0377" text-anchor="middle" font-size="18.6547" fill="var(--bg)" font-family="Arial, sans-serif">done</text>
  <text x="435.0605" y="171.3207" text-anchor="middle" font-size="22.3858" font-family="Arial, sans-serif" fill="var(--text)">feature</text>
  <rect x="218.875" y="527.974" width="74.619" height="74.619" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="256.1849" y="576.2265" text-anchor="middle" font-size="18.6547" fill="var(--bg)" font-family="Arial, sans-serif">fix</text>
  <rect x="397.751" y="527.974" width="74.619" height="74.619" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="435.0605" y="576.2265" text-anchor="middle" font-size="18.6547" fill="var(--bg)" font-family="Arial, sans-serif">test</text>
  <text x="345.6226" y="620" text-anchor="middle" font-size="22.3858" font-family="Arial, sans-serif" fill="var(--text)">hotfix</text>
  <line x1="113.0846" y1="390.1887" x2="220.4099" y2="390.1887" stroke="var(--text)" stroke-width="2" />
  <line x1="256.1849" y1="346.4151" x2="256.1849" y2="258.8679" stroke="var(--text)" stroke-width="2" />
  <line x1="291.96" y1="215.0944" x2="399.2854" y2="215.0944" stroke="var(--text)" stroke-width="2" />
  <line x1="470.8355" y1="215.0944" x2="578.1608" y2="215.0944" stroke="var(--text)" stroke-width="2" />
  <line x1="256.1849" y1="433.9623" x2="256.1849" y2="521.5094" stroke="var(--text)" stroke-width="2" />
  <line x1="291.96" y1="565.283" x2="399.2854" y2="565.283" stroke="var(--text)" stroke-width="2" />
  <rect x="703.3736" y="171.3207" width="536.6264" height="437.7359" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="5.9961" filter="url(#shadow)"/>
  <text x="971.6869" y="236.9811" text-anchor="middle" font-size="29.8477" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Benefits:</text>
  <text x="739.1487" y="302.6415" font-size="22.3858" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Parallel development</text>
  <text x="739.1487" y="346.4151" font-size="22.3858" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Isolated experiments</text>
  <text x="739.1487" y="390.1887" font-size="22.3858" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Stable main branch</text>
  <text x="739.1487" y="433.9623" font-size="22.3858" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Easy collaboration</text>
  <text x="739.1487" y="477.7359" font-size="22.3858" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Feature toggles</text>
  <text x="739.1487" y="521.5094" font-size="22.3858" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Clean history</text>
</svg>
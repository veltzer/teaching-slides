<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="613.936" y="40" text-anchor="middle" font-size="44.7715" font-weight="bold">Life With Branches</text>
  <rect x="40" y="352.879" width="74.619" height="74.619" rx="14" fill="var(--ok-fill)"/>
  <text x="77.3095" y="401.1321" text-anchor="middle" font-size="18.6547" fill="var(--bg)">v1.0</text>
  <rect x="218.875" y="352.879" width="74.619" height="74.619" rx="14" fill="var(--ok-fill)"/>
  <text x="256.1849" y="401.1321" text-anchor="middle" font-size="18.6547" fill="var(--bg)">stable</text>
  <text x="166.7472" y="346.4151" text-anchor="middle" font-size="22.3858">main</text>
  <rect x="218.875" y="177.785" width="74.619" height="74.619" rx="14" fill="var(--primary-fill)"/>
  <text x="256.1849" y="226.0377" text-anchor="middle" font-size="18.6547" fill="var(--bg)">feat</text>
  <rect x="397.751" y="177.785" width="74.619" height="74.619" rx="14" fill="var(--primary-fill)"/>
  <text x="435.0605" y="226.0377" text-anchor="middle" font-size="18.6547" fill="var(--bg)">test</text>
  <rect x="576.627" y="177.785" width="74.619" height="74.619" rx="14" fill="var(--primary-fill)"/>
  <text x="613.936" y="226.0377" text-anchor="middle" font-size="18.6547" fill="var(--bg)">done</text>
  <text x="435.0605" y="171.3207" text-anchor="middle" font-size="22.3858">feature</text>
  <rect x="218.875" y="527.974" width="74.619" height="74.619" rx="14" fill="var(--warn-fill)"/>
  <text x="256.1849" y="576.2265" text-anchor="middle" font-size="18.6547" fill="var(--bg)">fix</text>
  <rect x="397.751" y="527.974" width="74.619" height="74.619" rx="14" fill="var(--warn-fill)"/>
  <text x="435.0605" y="576.2265" text-anchor="middle" font-size="18.6547" fill="var(--bg)">test</text>
  <text x="345.6226" y="620" text-anchor="middle" font-size="22.3858">hotfix</text>
  <line x1="113.0846" y1="390.1887" x2="220.4099" y2="390.1887" stroke="var(--text)" stroke-width="2" />
  <line x1="256.1849" y1="346.4151" x2="256.1849" y2="258.8679" stroke="var(--text)" stroke-width="2" />
  <line x1="291.96" y1="215.0944" x2="399.2854" y2="215.0944" stroke="var(--text)" stroke-width="2" />
  <line x1="470.8355" y1="215.0944" x2="578.1608" y2="215.0944" stroke="var(--text)" stroke-width="2" />
  <line x1="256.1849" y1="433.9623" x2="256.1849" y2="521.5094" stroke="var(--text)" stroke-width="2" />
  <line x1="291.96" y1="565.283" x2="399.2854" y2="565.283" stroke="var(--text)" stroke-width="2" />
  <rect x="703.3736" y="171.3207" width="536.6264" height="437.7359" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="5.9961" />
  <text x="971.6869" y="236.9811" text-anchor="middle" font-size="29.8477" font-weight="bold">Benefits:</text>
  <text x="739.1487" y="302.6415" font-size="22.3858">✓ Parallel development</text>
  <text x="739.1487" y="346.4151" font-size="22.3858">✓ Isolated experiments</text>
  <text x="739.1487" y="390.1887" font-size="22.3858">✓ Stable main branch</text>
  <text x="739.1487" y="433.9623" font-size="22.3858">✓ Easy collaboration</text>
  <text x="739.1487" y="477.7359" font-size="22.3858">✓ Feature toggles</text>
  <text x="739.1487" y="521.5094" font-size="22.3858">✓ Clean history</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="686.1539" y="40" text-anchor="middle" font-size="41.3912" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Gitflow Branch Model</text>
  <line x1="132.3078" y1="148.75" x2="1240" y2="148.75" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="40" y="157.8125" font-size="20.6956" font-family="Arial, sans-serif" fill="var(--text)">main</text>
  <rect x="210.818" y="134.953" width="27.5942" height="27.5942" rx="13.7971" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="1133.9" y="134.953" width="27.5942" height="27.5942" rx="13.7971" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <line x1="132.3078" y1="257.5" x2="1240" y2="257.5" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="40" y="266.5625" font-size="20.6956" font-family="Arial, sans-serif" fill="var(--text)">develop</text>
  <line x1="316.9231" y1="257.5" x2="409.2308" y2="366.25" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="409.2308" y1="366.25" x2="593.8462" y2="366.25" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="593.8462" y1="366.25" x2="686.1539" y2="257.5" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="501.5385" y="402.5" text-anchor="middle" font-size="18.9709" font-family="Arial, sans-serif" fill="var(--text)">feature/</text>
  <line x1="778.4616" y1="257.5" x2="870.7693" y2="148.75" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="870.7693" y1="148.75" x2="963.077" y2="148.75" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="963.077" y1="148.75" x2="1055.3846" y2="257.5" stroke="var(--info-border)" stroke-width="2"/>
  <text x="916.9231" y="130.625" text-anchor="middle" font-size="18.9709" font-family="Arial, sans-serif" fill="var(--text)">release/</text>
  <line x1="501.5385" y1="148.75" x2="538.4616" y2="94.375" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="538.4616" y1="94.375" x2="575.3847" y2="94.375" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="575.3847" y1="94.375" x2="612.3078" y2="148.75" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="556.9231" y="76.25" text-anchor="middle" font-size="18.9709" font-family="Arial, sans-serif" fill="var(--text)">hotfix/</text>
  <rect x="224.6154" y="475" width="923.077" height="145" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="686.1539" y="520.3125" text-anchor="middle" font-size="20.6956" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Branch Types:</text>
  <text x="261.5385" y="556.5625" font-size="18.9709" font-family="Arial, sans-serif" fill="var(--text)">• main: Production-ready code</text>
  <text x="261.5385" y="592.8125" font-size="18.9709" font-family="Arial, sans-serif" fill="var(--text)">• develop: Integration branch</text>
  <text x="723.077" y="556.5625" font-size="18.9709" font-family="Arial, sans-serif" fill="var(--text)">• feature/: New features</text>
  <text x="723.077" y="592.8125" font-size="18.9709" font-family="Arial, sans-serif" fill="var(--text)">• release/: Release prep • hotfix/: Emergency fixes</text>
</svg>

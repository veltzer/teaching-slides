<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Gitflow Branch Model</text>
  <line x1="158.0247" y1="177.7778" x2="1106.1728" y2="177.7778" stroke="var(--ok-border)" stroke-width="2" />
  <text x="79.0123" y="186.6667" font-size="18.963">main</text>
  <circle cx="237.037" cy="177.7778" r="12.642" fill="var(--ok-fill)" />
  <circle cx="1027.1605" cy="177.7778" r="12.642" fill="var(--ok-fill)" />
  <line x1="158.0247" y1="284.4444" x2="1106.1728" y2="284.4444" stroke="var(--primary-border)" stroke-width="2" />
  <text x="79.0123" y="293.3333" font-size="18.963">develop</text>
  <line x1="316.0494" y1="284.4444" x2="395.0617" y2="391.1111" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="395.0617" y1="391.1111" x2="553.0864" y2="391.1111" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="553.0864" y1="391.1111" x2="632.0988" y2="284.4444" stroke="var(--warn-border)" stroke-width="2" />
  <text x="474.0741" y="426.6667" text-anchor="middle" font-size="17.3827">feature/</text>
  <line x1="711.1111" y1="284.4444" x2="790.1235" y2="177.7778" stroke="var(--info-border)" stroke-width="2" />
  <line x1="790.1235" y1="177.7778" x2="869.1358" y2="177.7778" stroke="var(--info-border)" stroke-width="2" />
  <line x1="869.1358" y1="177.7778" x2="948.1481" y2="284.4444" stroke="var(--info-border)" stroke-width="2" />
  <text x="829.6296" y="160" text-anchor="middle" font-size="17.3827">release/</text>
  <line x1="474.0741" y1="177.7778" x2="505.679" y2="124.4444" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="505.679" y1="124.4444" x2="537.284" y2="124.4444" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="537.284" y1="124.4444" x2="568.8889" y2="177.7778" stroke="var(--danger-border)" stroke-width="2" />
  <text x="521.4815" y="106.6667" text-anchor="middle" font-size="17.3827">hotfix/</text>
  <rect x="237.037" y="497.7778" width="790.1235" height="142.2222" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="632.0988" y="542.2222" text-anchor="middle" font-size="18.963" font-weight="bold">Branch Types:</text>
  <text x="268.642" y="577.7778" font-size="17.3827">• main: Production-ready code</text>
  <text x="268.642" y="613.3333" font-size="17.3827">• develop: Integration branch</text>
  <text x="663.7037" y="577.7778" font-size="17.3827">• feature/: New features</text>
  <text x="663.7037" y="613.3333" font-size="17.3827">• release/: Release prep • hotfix/: Emergency fixes</text>
</svg>
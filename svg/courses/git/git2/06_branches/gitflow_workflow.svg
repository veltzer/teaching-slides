<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Gitflow Branch Model</text>
  <line x1="160" y1="180" x2="1120" y2="180" stroke="#4CAF50" stroke-width="4.8" />
  <text x="80" y="189" font-size="19.2">main</text>
  <circle cx="240" cy="180" r="12.8" fill="#4CAF50" />
  <circle cx="1040" cy="180" r="12.8" fill="#4CAF50" />
  <line x1="160" y1="288" x2="1120" y2="288" stroke="#2196F3" stroke-width="4.8" />
  <text x="80" y="297" font-size="19.2">develop</text>
  <line x1="320" y1="288" x2="400" y2="396" stroke="#FF9800" stroke-width="3.2" />
  <line x1="400" y1="396" x2="560" y2="396" stroke="#FF9800" stroke-width="3.2" />
  <line x1="560" y1="396" x2="640" y2="288" stroke="#FF9800" stroke-width="3.2" />
  <text x="480" y="432" text-anchor="middle" font-size="17.6">feature/</text>
  <line x1="720" y1="288" x2="800" y2="180" stroke="#9C27B0" stroke-width="3.2" />
  <line x1="800" y1="180" x2="880" y2="180" stroke="#9C27B0" stroke-width="3.2" />
  <line x1="880" y1="180" x2="960" y2="288" stroke="#9C27B0" stroke-width="3.2" />
  <text x="840" y="162" text-anchor="middle" font-size="17.6">release/</text>
  <line x1="480" y1="180" x2="512" y2="126" stroke="#F44336" stroke-width="3.2" />
  <line x1="512" y1="126" x2="544" y2="126" stroke="#F44336" stroke-width="3.2" />
  <line x1="544" y1="126" x2="576" y2="180" stroke="#F44336" stroke-width="3.2" />
  <text x="528" y="108" text-anchor="middle" font-size="17.6">hotfix/</text>
  <rect x="240" y="504" width="800" height="144" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="549" text-anchor="middle" font-size="19.2" font-weight="bold">Branch Types:</text>
  <text x="272" y="585" font-size="17.6">• main: Production-ready code</text>
  <text x="272" y="621" font-size="17.6">• develop: Integration branch</text>
  <text x="672" y="585" font-size="17.6">• feature/: New features</text>
  <text x="672" y="621" font-size="17.6">• release/: Release prep • hotfix/: Emergency fixes</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">GitHub Flow - Simplified</text>
  <line x1="158.0247" y1="355.5556" x2="1106.1728" y2="355.5556" stroke="var(--ok-border)" stroke-width="2" />
  <text x="79.0123" y="364.4444" font-size="18.963">main</text>
  <circle cx="237.037" cy="355.5556" r="15.8025" fill="var(--ok-fill)" />
  <circle cx="474.0741" cy="355.5556" r="15.8025" fill="var(--ok-fill)" />
  <circle cx="790.1235" cy="355.5556" r="15.8025" fill="var(--ok-fill)" />
  <circle cx="1027.1605" cy="355.5556" r="15.8025" fill="var(--ok-fill)" />
  <line x1="316.0494" y1="355.5556" x2="395.0617" y2="248.8889" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="395.0617" y1="248.8889" x2="553.0864" y2="248.8889" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="553.0864" y1="248.8889" x2="632.0988" y2="355.5556" stroke="var(--primary-border)" stroke-width="2" />
  <text x="474.0741" y="231.1111" text-anchor="middle" font-size="17.3827">feature</text>
  <rect x="663.7037" y="213.3333" width="158.0247" height="71.1111" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="742.716" y="257.7778" text-anchor="middle" font-size="18.963" fill="var(--bg)">PR/Review</text>
  <rect x="316.0494" y="462.2222" width="632.0988" height="177.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="632.0988" y="506.6667" text-anchor="middle" font-size="22.1235" font-weight="bold">Simple Rules:</text>
  <text x="347.6543" y="551.1111" font-size="18.963">1. main is always deployable</text>
  <text x="347.6543" y="586.6667" font-size="18.963">2. Branch from main for features</text>
  <text x="663.7037" y="551.1111" font-size="18.963">3. Open PR for discussion</text>
  <text x="663.7037" y="586.6667" font-size="18.963">4. Merge after review</text>
  <text x="632.0988" y="622.2222" text-anchor="middle" font-size="17.3827" font-style="italic">Perfect for continuous deployment</text>
</svg>
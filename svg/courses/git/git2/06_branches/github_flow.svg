  <ns0:text x="632.0988" y="506.6667" text-anchor="middle" font-size="22.1235" font-weight="bold">Simple Rules:</ns0:text>
  <ns0:text x="347.6543" y="551.1111" font-size="18.963">1. main is always deployable</ns0:text>
  <ns0:text x="347.6543" y="586.6667" font-size="18.963">2. Branch from main for features</ns0:text>
  <ns0:text x="663.7037" y="551.1111" font-size="18.963">3. Open PR for discussion</ns0:text>
  <ns0:text x="663.7037" y="586.6667" font-size="18.963">4. Merge after review</ns0:text>
  <ns0:text x="632.0988" y="622.2222" text-anchor="middle" font-size="17.3827" font-style="italic">Perfect for continuous deployment</ns0:text>

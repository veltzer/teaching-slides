<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">GitHub Flow - Simplified</text>
  <line x1="160" y1="360" x2="1120" y2="360" stroke="#4CAF50" stroke-width="4.8" />
  <text x="80" y="369" font-size="19.2">main</text>
  <circle cx="240" cy="360" r="16" fill="#4CAF50" />
  <circle cx="480" cy="360" r="16" fill="#4CAF50" />
  <circle cx="800" cy="360" r="16" fill="#4CAF50" />
  <circle cx="1040" cy="360" r="16" fill="#4CAF50" />
  <line x1="320" y1="360" x2="400" y2="252" stroke="#2196F3" stroke-width="3.2" />
  <line x1="400" y1="252" x2="560" y2="252" stroke="#2196F3" stroke-width="3.2" />
  <line x1="560" y1="252" x2="640" y2="360" stroke="#2196F3" stroke-width="3.2" />
  <text x="480" y="234" text-anchor="middle" font-size="17.6">feature</text>
  <rect x="672" y="216" width="160" height="72" fill="#9C27B0" rx="8" />
  <text x="752" y="261" text-anchor="middle" font-size="19.2" fill="white">PR/Review</text>
  <rect x="320" y="468" width="640" height="180" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="513" text-anchor="middle" font-size="22.4" font-weight="bold">Simple Rules:</text>
  <text x="352" y="558" font-size="19.2">1. main is always deployable</text>
  <text x="352" y="594" font-size="19.2">2. Branch from main for features</text>
  <text x="672" y="558" font-size="19.2">3. Open PR for discussion</text>
  <text x="672" y="594" font-size="19.2">4. Merge after review</text>
  <text x="640" y="630" text-anchor="middle" font-size="17.6" font-style="italic">Perfect for continuous deployment</text>
</svg>
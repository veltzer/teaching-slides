<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Secure Branch Patterns</text>
  <rect x="80" y="144" width="1120" height="108" fill="#4CAF50" rx="8" />
  <text x="640" y="189" text-anchor="middle" font-size="22.4" fill="white" font-weight="bold">Environment Branches</text>
  <text x="640" y="225" text-anchor="middle" font-size="19.2" fill="white">main → staging → production</text>
  <rect x="80" y="288" width="352" height="180" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="256" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">Development</text>
  <text x="256" y="369" text-anchor="middle" font-size="17.6">Branch: main</text>
  <text x="256" y="405" text-anchor="middle" font-size="17.6">• Latest features</text>
  <text x="256" y="441" text-anchor="middle" font-size="17.6">• May be unstable</text>
  <rect x="464" y="288" width="352" height="180" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">Staging</text>
  <text x="640" y="369" text-anchor="middle" font-size="17.6">Branch: staging</text>
  <text x="640" y="405" text-anchor="middle" font-size="17.6">• Pre-production testing</text>
  <text x="640" y="441" text-anchor="middle" font-size="17.6">• Release candidates</text>
  <rect x="848" y="288" width="352" height="180" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="1024" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">Production</text>
  <text x="1024" y="369" text-anchor="middle" font-size="17.6">Branch: production</text>
  <text x="1024" y="405" text-anchor="middle" font-size="17.6">• Live code only</text>
  <text x="1024" y="441" text-anchor="middle" font-size="17.6">• Restricted access</text>
  <path d="M 432 378 L 464 378" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 816 378 L 848 378" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="640" y="522" text-anchor="middle" font-size="19.2">Progressive promotion through environments</text>
  <text x="640" y="558" text-anchor="middle" font-size="17.6" font-style="italic">Each branch has different protection levels</text>
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
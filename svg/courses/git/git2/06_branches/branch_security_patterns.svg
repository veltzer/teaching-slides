<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="483.0189" y="65.6604" text-anchor="middle" font-size="28.9811" font-weight="bold">Secure Branch Patterns</text>
  <rect x="60.3774" y="119.9999" width="845.283" height="81.5094" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="1.5094" />
  <text x="483.0189" y="153.9623" text-anchor="middle" font-size="16.9057" fill="var(--bg)" font-weight="bold">Environment Branches</text>
  <text x="483.0189" y="181.1321" text-anchor="middle" font-size="14.4906" fill="var(--bg)">main → staging → production</text>
  <rect x="60.3774" y="228.6792" width="265.6604" height="135.8491" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5094" rx="6" />
  <text x="193.2075" y="262.6416" text-anchor="middle" font-size="16.9057" font-weight="bold">Development</text>
  <text x="193.2075" y="289.8113" text-anchor="middle" font-size="13.283">Branch: main</text>
  <text x="193.2075" y="316.9811" text-anchor="middle" font-size="13.283">• Latest features</text>
  <text x="193.2075" y="344.1509" text-anchor="middle" font-size="13.283">• May be unstable</text>
  <rect x="350.1887" y="228.6792" width="265.6604" height="135.8491" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5094" rx="6" />
  <text x="483.0189" y="262.6416" text-anchor="middle" font-size="16.9057" font-weight="bold">Staging</text>
  <text x="483.0189" y="289.8113" text-anchor="middle" font-size="13.283">Branch: staging</text>
  <text x="483.0189" y="316.9811" text-anchor="middle" font-size="13.283">• Pre-production testing</text>
  <text x="483.0189" y="344.1509" text-anchor="middle" font-size="13.283">• Release candidates</text>
  <rect x="640" y="228.6792" width="265.6604" height="135.8491" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.5094" rx="6" />
  <text x="772.8302" y="262.6416" text-anchor="middle" font-size="16.9057" font-weight="bold">Production</text>
  <text x="772.8302" y="289.8113" text-anchor="middle" font-size="13.283">Branch: production</text>
  <text x="772.8302" y="316.9811" text-anchor="middle" font-size="13.283">• Live code only</text>
  <text x="772.8302" y="344.1509" text-anchor="middle" font-size="13.283">• Restricted access</text>
  <path d="M 326.0377 296.6038 L 350.1887 296.6038" stroke="var(--text)" stroke-width="1.3756" marker-end="url(#arrow)" />
  <path d="M 615.8491 296.6038 L 640 296.6038" stroke="var(--text)" stroke-width="1.3756" marker-end="url(#arrow)" />
  <text x="483.0189" y="405.2831" text-anchor="middle" font-size="14.4906">Progressive promotion through environments</text>
  <text x="483.0189" y="432.4528" text-anchor="middle" font-size="13.283" font-style="italic">Each branch has different protection levels</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="43.4218" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Secure Branch Patterns</text>
  <rect x="40" y="125.9257" width="1200" height="128.8889" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="179.6297" text-anchor="middle" font-size="25.3295" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Environment Branches</text>
  <text x="640" y="222.5926" text-anchor="middle" font-size="21.711" fill="var(--bg)" font-family="Arial, sans-serif">main → staging → production</text>
  <rect x="40" y="297.7777" width="377.1429" height="214.8149" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="228.5713" y="351.4816" text-anchor="middle" font-size="25.3295" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Development</text>
  <text x="228.5713" y="394.4444" text-anchor="middle" font-size="19.9017" font-family="Arial, sans-serif" fill="var(--ok-text)">Branch: main</text>
  <text x="228.5713" y="437.4074" text-anchor="middle" font-size="19.9017" font-family="Arial, sans-serif" fill="var(--ok-text)">• Latest features</text>
  <text x="228.5713" y="480.3703" text-anchor="middle" font-size="19.9017" font-family="Arial, sans-serif" fill="var(--ok-text)">• May be unstable</text>
  <rect x="451.4286" y="297.7777" width="377.1429" height="214.8149" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="351.4816" text-anchor="middle" font-size="25.3295" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Staging</text>
  <text x="640" y="394.4444" text-anchor="middle" font-size="19.9017" font-family="Arial, sans-serif" fill="var(--warn-text)">Branch: staging</text>
  <text x="640" y="437.4074" text-anchor="middle" font-size="19.9017" font-family="Arial, sans-serif" fill="var(--warn-text)">• Pre-production testing</text>
  <text x="640" y="480.3703" text-anchor="middle" font-size="19.9017" font-family="Arial, sans-serif" fill="var(--warn-text)">• Release candidates</text>
  <rect x="862.8571" y="297.7777" width="377.1429" height="214.8149" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1051.4286" y="351.4816" text-anchor="middle" font-size="25.3295" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Production</text>
  <text x="1051.4286" y="394.4444" text-anchor="middle" font-size="19.9017" font-family="Arial, sans-serif" fill="var(--danger-text)">Branch: production</text>
  <text x="1051.4286" y="437.4074" text-anchor="middle" font-size="19.9017" font-family="Arial, sans-serif" fill="var(--danger-text)">• Live code only</text>
  <text x="1051.4286" y="480.3703" text-anchor="middle" font-size="19.9017" font-family="Arial, sans-serif" fill="var(--danger-text)">• Restricted access</text>
  <path d="M 417.1428 405.1852 L 451.4286 405.1852" stroke="var(--text)" stroke-width="1.3756" marker-end="url(#arrow)"/>
  <path d="M 828.5714 405.1852 L 862.8571 405.1852" stroke="var(--text)" stroke-width="1.3756" marker-end="url(#arrow)"/>
  <text x="640" y="577.0372" text-anchor="middle" font-size="21.711" font-family="Arial, sans-serif" fill="var(--text)">Progressive promotion through environments</text>
  <text x="640" y="620" text-anchor="middle" font-size="19.9017" font-style="italic" font-family="Arial, sans-serif" fill="var(--text)">Each branch has different protection levels</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

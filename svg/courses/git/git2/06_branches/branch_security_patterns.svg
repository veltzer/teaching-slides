<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="483.0189" y="54.3396" text-anchor="middle" font-size="28.9811" font-weight="bold">Secure Branch Patterns</ns0:text>
  <ns0:rect x="60.3774" y="108.6792" width="845.283" height="81.5094" fill="#4CAF50" rx="6.0377" />
  <ns0:text x="483.0189" y="142.6415" text-anchor="middle" font-size="16.9057" fill="white" font-weight="bold">Environment Branches</ns0:text>
  <ns0:text x="483.0189" y="169.8113" text-anchor="middle" font-size="14.4906" fill="white">main → staging → production</ns0:text>
  <ns0:rect x="60.3774" y="217.3585" width="265.6604" height="135.8491" fill="#E8F5E9" stroke="#388E3C" stroke-width="2.4151" rx="6.0377" />
  <ns0:text x="193.2075" y="251.3208" text-anchor="middle" font-size="16.9057" font-weight="bold">Development</ns0:text>
  <ns0:text x="193.2075" y="278.4906" text-anchor="middle" font-size="13.283">Branch: main</ns0:text>
  <ns0:text x="193.2075" y="305.6604" text-anchor="middle" font-size="13.283">• Latest features</ns0:text>
  <ns0:text x="193.2075" y="332.8302" text-anchor="middle" font-size="13.283">• May be unstable</ns0:text>
  <ns0:rect x="350.1887" y="217.3585" width="265.6604" height="135.8491" fill="#FFF3E0" stroke="#F57C00" stroke-width="2.4151" rx="6.0377" />
  <ns0:text x="483.0189" y="251.3208" text-anchor="middle" font-size="16.9057" font-weight="bold">Staging</ns0:text>
  <ns0:text x="483.0189" y="278.4906" text-anchor="middle" font-size="13.283">Branch: staging</ns0:text>
  <ns0:text x="483.0189" y="305.6604" text-anchor="middle" font-size="13.283">• Pre-production testing</ns0:text>
  <ns0:text x="483.0189" y="332.8302" text-anchor="middle" font-size="13.283">• Release candidates</ns0:text>
  <ns0:rect x="640" y="217.3585" width="265.6604" height="135.8491" fill="#FFEBEE" stroke="#C62828" stroke-width="2.4151" rx="6.0377" />
  <ns0:text x="772.8302" y="251.3208" text-anchor="middle" font-size="16.9057" font-weight="bold">Production</ns0:text>
  <ns0:text x="772.8302" y="278.4906" text-anchor="middle" font-size="13.283">Branch: production</ns0:text>
  <ns0:text x="772.8302" y="305.6604" text-anchor="middle" font-size="13.283">• Live code only</ns0:text>
  <ns0:text x="772.8302" y="332.8302" text-anchor="middle" font-size="13.283">• Restricted access</ns0:text>
  <ns0:path d="M 326.0377 285.283 L 350.1887 285.283" stroke="#333" stroke-width="2.4151" marker-end="url(#arrow)" />
  <ns0:path d="M 615.8491 285.283 L 640 285.283" stroke="#333" stroke-width="2.4151" marker-end="url(#arrow)" />
  <ns0:text x="483.0189" y="393.9623" text-anchor="middle" font-size="14.4906">Progressive promotion through environments</ns0:text>
  <ns0:text x="483.0189" y="421.1321" text-anchor="middle" font-size="13.283" font-style="italic">Each branch has different protection levels</ns0:text>
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="12.0755" markerHeight="13.5849" refX="9.6604" refY="4.0755" orient="auto">
      <ns0:polygon points="0,13.5849 3.6226,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.807319" font-weight="bold" fill="var(--text)">Three-Way Merge Process</text>

  <rect x="40" y="198.181818" width="300" height="210.909091" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="190" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.86114" font-weight="bold" fill="var(--ok-text)">Base</text>
  <text x="190" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--ok-text)">Common ancestor</text>
  <text x="190" y="366.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--ok-text)">git merge-base</text>

  <rect x="460" y="71.636364" width="300" height="210.909091" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="610" y="145.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.86114" font-weight="bold" fill="var(--primary-text)">Ours</text>
  <text x="610" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--primary-text)">main branch tip</text>
  <text x="610" y="240.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--primary-text)">your changes</text>

  <rect x="460" y="324.727273" width="300" height="210.909091" rx="6.161464" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="610" y="398.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.86114" font-weight="bold" fill="var(--warn-text)">Theirs</text>
  <text x="610" y="456.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--warn-text)">feature branch tip</text>
  <text x="610" y="493.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--warn-text)">their changes</text>

  <rect x="880" y="198.181818" width="360" height="210.909091" rx="6.161464" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1060" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.86114" font-weight="bold" fill="var(--info-text)">Merge</text>
  <text x="1060" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--info-text)">Combined result</text>
  <text x="1060" y="366.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--info-text)">two-parent commit</text>

  <line x1="340" y1="272" x2="460" y2="177.090909" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="335.272727" x2="460" y2="430.181818" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="177.090909" x2="880" y2="272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="430.181818" x2="880" y2="335.272727" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="556.727273" width="1200" height="63.272727" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--text-muted)">Git finds the common ancestor and blends both sides' changes into one new commit</text>
</svg>

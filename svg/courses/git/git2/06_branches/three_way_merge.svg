<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="662.7452" y="40" text-anchor="middle" font-size="36.392" font-weight="bold">Three-Way Merge Process</text>
  <circle cx="359.4771" cy="312.9413" r="45.4901" fill="var(--ok-fill)" />
  <text x="359.4771" y="321.4704" text-anchor="middle" font-size="18.1961" fill="var(--bg)">Base</text>
  <text x="359.4771" y="381.1765" text-anchor="middle" font-size="18.1961">Common ancestor</text>
  <circle cx="586.9281" cy="176.4706" r="45.4901" fill="var(--primary-fill)" />
  <text x="586.9281" y="185.0001" text-anchor="middle" font-size="18.1961" fill="var(--bg)">Ours</text>
  <text x="586.9281" y="125.2941" text-anchor="middle" font-size="18.1961">main branch</text>
  <circle cx="586.9281" cy="449.4118" r="45.4901" fill="var(--warn-fill)" />
  <text x="586.9281" y="457.9413" text-anchor="middle" font-size="18.1961" fill="var(--bg)">Theirs</text>
  <text x="586.9281" y="517.6471" text-anchor="middle" font-size="18.1961">feature branch</text>
  <circle cx="890.196" cy="312.9413" r="53.0718" fill="var(--info-fill)" />
  <text x="890.196" y="321.4704" text-anchor="middle" font-size="21.2288" fill="var(--bg)">Merge</text>
  <text x="890.196" y="398.2354" text-anchor="middle" font-size="18.1961">Combined result</text>
  <path d="M 404.9671 287.3531 L 541.438 202.059" stroke="var(--text)" stroke-width="1.5518" marker-end="url(#arrow)" />
  <path d="M 404.9671 338.5294 L 541.438 423.8235" stroke="var(--text)" stroke-width="1.5518" marker-end="url(#arrow)" />
  <path d="M 632.4183 176.4706 L 837.1241 287.3531" stroke="var(--text)" stroke-width="1.5518" marker-end="url(#arrow)" />
  <path d="M 632.4183 449.4118 L 837.1241 338.5294" stroke="var(--text)" stroke-width="1.5518" marker-end="url(#arrow)" />
  <rect x="359.4771" y="551.7647" width="606.536" height="68.2353" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="662.7452" y="594.4119" text-anchor="middle" font-size="18.1961">Git finds common ancestor and combines changes from both branches</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
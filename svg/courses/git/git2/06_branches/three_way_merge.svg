<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.807319" font-weight="bold" fill="var(--text)">Three-Way Merge Process</text>

  <rect x="40" y="198.181818" width="300" height="210.909091" rx="6.161464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.86114" font-weight="bold" fill="var(--ok-text)">Base</text>
  <text x="190" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--ok-text)">Common ancestor</text>
  <text x="190" y="366.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--ok-text)">git merge-base</text>

  <rect x="460" y="71.636364" width="300" height="210.909091" rx="6.161464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="145.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.86114" font-weight="bold" fill="var(--primary-text)">Ours</text>
  <text x="610" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--primary-text)">main branch tip</text>
  <text x="610" y="240.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--primary-text)">your changes</text>

  <rect x="460" y="324.727273" width="300" height="210.909091" rx="6.161464" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="398.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.86114" font-weight="bold" fill="var(--warn-text)">Theirs</text>
  <text x="610" y="456.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--warn-text)">feature branch tip</text>
  <text x="610" y="493.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--warn-text)">their changes</text>

  <rect x="880" y="198.181818" width="360" height="210.909091" rx="6.161464" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.86114" font-weight="bold" fill="var(--info-text)">Merge</text>
  <text x="1060" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--info-text)">Combined result</text>
  <text x="1060" y="366.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--info-text)">two-parent commit</text>

  <line x1="340" y1="272" x2="460" y2="177.090909" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="335.272727" x2="460" y2="430.181818" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="177.090909" x2="880" y2="272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="430.181818" x2="880" y2="335.272727" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="556.727273" width="1200" height="63.272727" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--text-muted)">Git finds the common ancestor and blends both sides' changes into one new commit</text>
</svg>

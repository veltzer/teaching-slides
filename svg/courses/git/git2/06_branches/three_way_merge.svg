<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="521.2138" y="63.215" text-anchor="middle" font-size="24.7901" font-weight="bold">Three-Way Merge Process</text>
  <circle cx="314.6288" cy="249.1415" r="30.9877" fill="var(--ok-fill)" />
  <text x="314.6288" y="254.9515" text-anchor="middle" font-size="12.3951" fill="var(--bg)">Base</text>
  <text x="314.6288" y="295.623" text-anchor="middle" font-size="12.3951">Common ancestor</text>
  <circle cx="469.5675" cy="156.1782" r="30.9877" fill="var(--primary-fill)" />
  <text x="469.5675" y="161.9885" text-anchor="middle" font-size="12.3951" fill="var(--bg)">Ours</text>
  <text x="469.5675" y="121.317" text-anchor="middle" font-size="12.3951">main branch</text>
  <circle cx="469.5675" cy="342.1046" r="30.9877" fill="var(--warn-fill)" />
  <text x="469.5675" y="347.9149" text-anchor="middle" font-size="12.3951" fill="var(--bg)">Theirs</text>
  <text x="469.5675" y="388.5862" text-anchor="middle" font-size="12.3951">feature branch</text>
  <circle cx="676.1523" cy="249.1415" r="36.1523" fill="var(--info-fill)" />
  <text x="676.1523" y="254.9515" text-anchor="middle" font-size="14.461" fill="var(--bg)">Merge</text>
  <text x="676.1523" y="307.2435" text-anchor="middle" font-size="12.3951">Combined result</text>
  <path d="M 345.6165 231.7109 L 438.5798 173.6089" stroke="var(--text)" stroke-width="1.9639" marker-end="url(#arrow)" />
  <path d="M 345.6165 266.572 L 438.5798 324.674" stroke="var(--text)" stroke-width="1.9639" marker-end="url(#arrow)" />
  <path d="M 500.5552 156.1782 L 640 231.7109" stroke="var(--text)" stroke-width="1.9639" marker-end="url(#arrow)" />
  <path d="M 500.5552 342.1046 L 640 266.572" stroke="var(--text)" stroke-width="1.9639" marker-end="url(#arrow)" />
  <rect x="314.6288" y="411.827" width="413.1698" height="46.4816" fill="var(--surface)" stroke="var(--border)" stroke-width="0.7902" rx="4.9871" />
  <text x="521.2138" y="440.8781" text-anchor="middle" font-size="12.3951">Git finds common ancestor and combines changes from both branches</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
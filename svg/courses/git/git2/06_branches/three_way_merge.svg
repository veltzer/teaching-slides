<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--text)">Three-Way Merge Process</text>

  <rect x="40" y="220" width="300" height="200" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="190" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--ok-text)">Base</text>
  <text x="190" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Common ancestor</text>
  <text x="190" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">git merge-base</text>

  <rect x="460" y="100" width="300" height="200" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="610" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--primary-text)">Ours</text>
  <text x="610" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">main branch tip</text>
  <text x="610" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">your changes</text>

  <rect x="460" y="340" width="300" height="200" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="610" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--warn-text)">Theirs</text>
  <text x="610" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">feature branch tip</text>
  <text x="610" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">their changes</text>

  <rect x="880" y="220" width="360" height="200" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1060" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--info-text)">Merge</text>
  <text x="1060" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">Combined result</text>
  <text x="1060" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">two-parent commit</text>

  <line x1="340" y1="290" x2="460" y2="200" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="350" x2="460" y2="440" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="200" x2="880" y2="290" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="440" x2="880" y2="350" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="560" width="1200" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Git finds the common ancestor and blends both sides' changes into one new commit</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="497.0874" y="55.9223" text-anchor="middle" font-size="29.8252" font-weight="bold">Three-Way Merge Process</ns0:text>
  <ns0:circle cx="248.5437" cy="279.6117" r="37.2816" fill="#4CAF50" />
  <ns0:text x="248.5437" y="286.6019" text-anchor="middle" font-size="14.9126" fill="white">Base</ns0:text>
  <ns0:text x="248.5437" y="335.534" text-anchor="middle" font-size="14.9126">Common ancestor</ns0:text>
  <ns0:circle cx="434.9515" cy="167.767" r="37.2816" fill="#2196F3" />
  <ns0:text x="434.9515" y="174.7573" text-anchor="middle" font-size="14.9126" fill="white">Ours</ns0:text>
  <ns0:text x="434.9515" y="125.8252" text-anchor="middle" font-size="14.9126">main branch</ns0:text>
  <ns0:circle cx="434.9515" cy="391.4563" r="37.2816" fill="#FF9800" />
  <ns0:text x="434.9515" y="398.4466" text-anchor="middle" font-size="14.9126" fill="white">Theirs</ns0:text>
  <ns0:text x="434.9515" y="447.3786" text-anchor="middle" font-size="14.9126">feature branch</ns0:text>
  <ns0:circle cx="683.4951" cy="279.6117" r="43.4951" fill="#9C27B0" />
  <ns0:text x="683.4951" y="286.6019" text-anchor="middle" font-size="17.3981" fill="white">Merge</ns0:text>
  <ns0:text x="683.4951" y="349.5146" text-anchor="middle" font-size="14.9126">Combined result</ns0:text>
  <ns0:path d="M 285.8252 258.6408 L 397.6699 188.7379" stroke="#333" stroke-width="2.4854" marker-end="url(#arrow)" />
  <ns0:path d="M 285.8252 300.5825 L 397.6699 370.4854" stroke="#333" stroke-width="2.4854" marker-end="url(#arrow)" />
  <ns0:path d="M 472.233 167.767 L 640 258.6408" stroke="#333" stroke-width="2.4854" marker-end="url(#arrow)" />
  <ns0:path d="M 472.233 391.4563 L 640 300.5825" stroke="#333" stroke-width="2.4854" marker-end="url(#arrow)" />
  <ns0:rect x="248.5437" y="475.3398" width="497.0874" height="55.9223" fill="#F5F5F5" stroke="#333" stroke-width="2.4854" rx="6.2136" />
  <ns0:text x="497.0874" y="510.2913" text-anchor="middle" font-size="14.9126">Git finds common ancestor and combines changes from both branches</ns0:text>
  <ns0:defs>


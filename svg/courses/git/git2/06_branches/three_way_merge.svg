<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="497.0874" y="55.9223" text-anchor="middle" font-size="29.8252" font-weight="bold">Three-Way Merge Process</text>
  <circle cx="248.5437" cy="279.6117" r="37.2816" fill="var(--ok-fill)" />
  <text x="248.5437" y="286.6019" text-anchor="middle" font-size="14.9126" fill="var(--bg)">Base</text>
  <text x="248.5437" y="335.534" text-anchor="middle" font-size="14.9126">Common ancestor</text>
  <circle cx="434.9515" cy="167.767" r="37.2816" fill="var(--primary-fill)" />
  <text x="434.9515" y="174.7573" text-anchor="middle" font-size="14.9126" fill="var(--bg)">Ours</text>
  <text x="434.9515" y="125.8252" text-anchor="middle" font-size="14.9126">main branch</text>
  <circle cx="434.9515" cy="391.4563" r="37.2816" fill="var(--warn-fill)" />
  <text x="434.9515" y="398.4466" text-anchor="middle" font-size="14.9126" fill="var(--bg)">Theirs</text>
  <text x="434.9515" y="447.3786" text-anchor="middle" font-size="14.9126">feature branch</text>
  <circle cx="683.4951" cy="279.6117" r="43.4951" fill="var(--info-fill)" />
  <text x="683.4951" y="286.6019" text-anchor="middle" font-size="17.3981" fill="var(--bg)">Merge</text>
  <text x="683.4951" y="349.5146" text-anchor="middle" font-size="14.9126">Combined result</text>
  <path d="M 285.8252 258.6408 L 397.6699 188.7379" stroke="var(--text)" stroke-width="2.4854" marker-end="url(#arrow)" />
  <path d="M 285.8252 300.5825 L 397.6699 370.4854" stroke="var(--text)" stroke-width="2.4854" marker-end="url(#arrow)" />
  <path d="M 472.233 167.767 L 640 258.6408" stroke="var(--text)" stroke-width="2.4854" marker-end="url(#arrow)" />
  <path d="M 472.233 391.4563 L 640 300.5825" stroke="var(--text)" stroke-width="2.4854" marker-end="url(#arrow)" />
  <rect x="248.5437" y="475.3398" width="497.0874" height="55.9223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="497.0874" y="510.2913" text-anchor="middle" font-size="14.9126">Git finds common ancestor and combines changes from both branches</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
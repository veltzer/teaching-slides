<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Three-Way Merge Process</text>
  <circle cx="320" cy="360" r="48" fill="#4CAF50" />
  <text x="320" y="369" text-anchor="middle" font-size="19.2" fill="white">Base</text>
  <text x="320" y="432" text-anchor="middle" font-size="19.2">Common ancestor</text>
  <circle cx="560" cy="216" r="48" fill="#2196F3" />
  <text x="560" y="225" text-anchor="middle" font-size="19.2" fill="white">Ours</text>
  <text x="560" y="162" text-anchor="middle" font-size="19.2">main branch</text>
  <circle cx="560" cy="504" r="48" fill="#FF9800" />
  <text x="560" y="513" text-anchor="middle" font-size="19.2" fill="white">Theirs</text>
  <text x="560" y="576" text-anchor="middle" font-size="19.2">feature branch</text>
  <circle cx="880" cy="360" r="56" fill="#9C27B0" />
  <text x="880" y="369" text-anchor="middle" font-size="22.4" fill="white">Merge</text>
  <text x="880" y="450" text-anchor="middle" font-size="19.2">Combined result</text>
  <path d="M 368 333 L 512 243" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <path d="M 368 387 L 512 477" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <path d="M 608 216 L 824 333" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <path d="M 608 504 L 824 387" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <rect x="320" y="612" width="640" height="72" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="657" text-anchor="middle" font-size="19.2">Git finds common ancestor and combines changes from both branches</text>
  <defs>
    <marker id="arrow2" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="41.1936" font-weight="bold">Protecting Important Branches</text>
  <rect x="125.7143" y="117.3333" width="1028.5714" height="116" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="165.6667" text-anchor="middle" font-size="27.4624" fill="var(--bg)" font-weight="bold">Protected: main branch</text>
  <text x="640" y="204.3333" text-anchor="middle" font-size="20.5968" fill="var(--bg)">Requires pull request, reviews, passing tests</text>
  <rect x="40" y="272" width="548.5714" height="348" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="314.2857" y="330" text-anchor="middle" font-size="24.0296" font-weight="bold">Local Protection</text>
  <text x="74.2857" y="378.3333" font-size="18.8804">Pre-push hook example:</text>
  <text x="74.2857" y="417" font-family="monospace" font-size="17.164">#!/bin/sh</text>
  <text x="74.2857" y="446" font-family="monospace" font-size="17.164">branch=$(git symbolic-ref HEAD)</text>
  <text x="74.2857" y="475" font-family="monospace" font-size="17.164">if [ "$branch" = "refs/heads/main" ]</text>
  <text x="74.2857" y="504" font-family="monospace" font-size="17.164">then</text>
  <text x="74.2857" y="533" font-family="monospace" font-size="17.164">  echo "Direct push to main blocked"</text>
  <text x="74.2857" y="562" font-family="monospace" font-size="17.164">  exit 1</text>
  <text x="74.2857" y="591" font-family="monospace" font-size="17.164">fi</text>
  <rect x="691.4286" y="272" width="548.5714" height="348" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="965.7143" y="330" text-anchor="middle" font-size="24.0296" font-weight="bold">Remote Protection (GitHub/GitLab)</text>
  <text x="725.7143" y="378.3333" font-size="18.8804">• Require pull request reviews</text>
  <text x="725.7143" y="417" font-size="18.8804">• Dismiss stale reviews</text>
  <text x="725.7143" y="455.6667" font-size="18.8804">• Require status checks</text>
  <text x="725.7143" y="494.3333" font-size="18.8804">• Include administrators</text>
  <text x="725.7143" y="533" font-size="18.8804">• Restrict who can push</text>
  <text x="725.7143" y="571.6667" font-size="18.8804">• Prevent force pushes</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Protecting Important Branches</text>
  <rect x="160" y="144" width="960" height="108" fill="#4CAF50" rx="8" />
  <text x="640" y="189" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Protected: main branch</text>
  <text x="640" y="225" text-anchor="middle" font-size="19.2" fill="white">Requires pull request, reviews, passing tests</text>
  <rect x="80" y="288" width="512" height="324" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="336" y="342" text-anchor="middle" font-size="22.4" font-weight="bold">Local Protection</text>
  <text x="112" y="387" font-size="17.6">Pre-push hook example:</text>
  <text x="112" y="423" font-family="monospace" font-size="16">#!/bin/sh</text>
  <text x="112" y="450" font-family="monospace" font-size="16">branch=$(git symbolic-ref HEAD)</text>
  <text x="112" y="477" font-family="monospace" font-size="16">if [ "$branch" = "refs/heads/main" ]</text>
  <text x="112" y="504" font-family="monospace" font-size="16">then</text>
  <text x="112" y="531" font-family="monospace" font-size="16">  echo "Direct push to main blocked"</text>
  <text x="112" y="558" font-family="monospace" font-size="16">  exit 1</text>
  <text x="112" y="585" font-family="monospace" font-size="16">fi</text>
  <rect x="688" y="288" width="512" height="324" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="944" y="342" text-anchor="middle" font-size="22.4" font-weight="bold">Remote Protection (GitHub/GitLab)</text>
  <text x="720" y="387" font-size="17.6">• Require pull request reviews</text>
  <text x="720" y="423" font-size="17.6">• Dismiss stale reviews</text>
  <text x="720" y="459" font-size="17.6">• Require status checks</text>
  <text x="720" y="495" font-size="17.6">• Include administrators</text>
  <text x="720" y="531" font-size="17.6">• Restrict who can push</text>
  <text x="720" y="567" font-size="17.6">• Prevent force pushes</text>
</svg>
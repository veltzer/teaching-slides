<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>
  <rect x="40" y="40" width="1200" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="var(--ok-text)">Branch Master Achieved!</text>

  <rect x="40" y="160" width="385" height="210" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.5" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Work in Parallel</text>
  <text x="232.5" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Multiple features isolated</text>
  <text x="232.5" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">on independent branches</text>
  <text x="232.5" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">No stepping on each other</text>

  <rect x="447.5" y="160" width="385" height="210" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Collaborate Effectively</text>
  <text x="640" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Push, pull request, review,</text>
  <text x="640" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">merge — share work safely</text>
  <text x="640" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Remote branches sync teams</text>

  <rect x="855" y="160" width="385" height="210" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.5" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Clean History</text>
  <text x="1047.5" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Merge or rebase to keep</text>
  <text x="1047.5" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">commits readable and linear</text>
  <text x="1047.5" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Tags and releases are easy</text>

  <rect x="40" y="390" width="1200" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Choose the Right Workflow</text>
  <text x="640" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Trunk-based: tiny branches, continuous merge — best for CI/CD teams</text>
  <text x="640" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">GitHub Flow: feature branch + PR — great default for most projects</text>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Git Flow: release + hotfix branches — suits versioned releases</text>

  <rect x="40" y="550" width="385" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.5" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">git branch</text>
  <text x="232.5" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Create and list branches</text>

  <rect x="447.5" y="550" width="385" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">git merge / rebase</text>
  <text x="640" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Integrate changes</text>

  <rect x="855" y="550" width="385" height="70" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.5" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">git switch</text>
  <text x="1047.5" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Move between branches</text>
</svg>

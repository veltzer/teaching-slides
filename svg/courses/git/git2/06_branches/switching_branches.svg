<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="595.3488" y="66.9767" text-anchor="middle" font-size="35.7209" font-weight="bold">Switching Branches Changes Working Directory</ns0:text>
  <ns0:rect x="74.4186" y="133.9535" width="476.2791" height="200.9302" fill="#E8F5E9" stroke="#388E3C" stroke-width="2.9767" rx="7.4419" />
  <ns0:text x="312.5581" y="184.186" text-anchor="middle" font-size="23.814" font-weight="bold">On main branch</ns0:text>
  <ns0:text x="104.186" y="226.0465" font-size="17.8605" font-family="monospace">index.html (v1)</ns0:text>
  <ns0:text x="104.186" y="259.5349" font-size="17.8605" font-family="monospace">style.css (v1)</ns0:text>
  <ns0:text x="104.186" y="293.0233" font-size="17.8605" font-family="monospace">app.js (v1)</ns0:text>

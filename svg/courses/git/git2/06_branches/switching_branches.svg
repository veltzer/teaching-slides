  <ns0:text x="878.1395" y="184.186" text-anchor="middle" font-size="23.814" font-weight="bold">After switch to feature</ns0:text>
  <ns0:text x="669.7674" y="226.0465" font-size="17.8605" font-family="monospace">index.html (v2)</ns0:text>
  <ns0:text x="669.7674" y="259.5349" font-size="17.8605" font-family="monospace">style.css (v2)</ns0:text>
  <ns0:text x="669.7674" y="293.0233" font-size="17.8605" font-family="monospace">app.js (v2)</ns0:text>
  <ns0:text x="669.7674" y="326.5116" font-size="17.8605" font-family="monospace">new-file.js (new!)</ns0:text>
  <ns0:path d="M 550.6977 234.4186 L 640 234.4186" stroke="#333" stroke-width="4.4651" marker-end="url(#arrow)" />
  <ns0:text x="595.3488" y="217.6744" text-anchor="middle" font-size="17.8605">git switch feature</ns0:text>
  <ns0:rect x="297.6744" y="401.8605" width="595.3488" height="200.9302" fill="#FFEBEE" stroke="#C62828" stroke-width="2.9767" rx="7.4419" />
  <ns0:text x="595.3488" y="452.093" text-anchor="middle" font-size="23.814" font-weight="bold">⚠️ Warning: Uncommitted Changes</ns0:text>
  <ns0:text x="327.4419" y="502.3256" font-size="17.8605">Git will prevent switching if you have changes that</ns0:text>
  <ns0:text x="327.4419" y="535.814" font-size="17.8605">would be overwritten. Options:</ns0:text>
  <ns0:text x="327.4419" y="569.3023" font-size="17.8605">• Commit changes • Stash changes • Force switch (lose changes)</ns0:text>

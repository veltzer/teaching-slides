<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Switching Branches Changes Working Directory</text>
  <rect x="80" y="144" width="512" height="216" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="336" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">On main branch</text>
  <text x="112" y="243" font-size="19.2" font-family="monospace">index.html (v1)</text>
  <text x="112" y="279" font-size="19.2" font-family="monospace">style.css (v1)</text>
  <text x="112" y="315" font-size="19.2" font-family="monospace">app.js (v1)</text>
  <rect x="688" y="144" width="512" height="216" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="944" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">After switch to feature</text>
  <text x="720" y="243" font-size="19.2" font-family="monospace">index.html (v2)</text>
  <text x="720" y="279" font-size="19.2" font-family="monospace">style.css (v2)</text>
  <text x="720" y="315" font-size="19.2" font-family="monospace">app.js (v2)</text>
  <text x="720" y="351" font-size="19.2" font-family="monospace">new-file.js (new!)</text>
  <path d="M 592 252 L 688 252" stroke="#333" stroke-width="4.8" marker-end="url(#arrow2)" />
  <text x="640" y="234" text-anchor="middle" font-size="19.2">git switch feature</text>
  <rect x="320" y="432" width="640" height="216" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="640" y="486" text-anchor="middle" font-size="25.6" font-weight="bold">⚠️ Warning: Uncommitted Changes</text>
  <text x="352" y="540" font-size="19.2">Git will prevent switching if you have changes that</text>
  <text x="352" y="576" font-size="19.2">would be overwritten. Options:</text>
  <text x="352" y="612" font-size="19.2">• Commit changes • Stash changes • Force switch (lose changes)</text>
  <defs>
    <marker id="arrow2" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
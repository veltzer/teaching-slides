<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Merge vs Rebase</text>
  <rect x="79.0123" y="142.2222" width="553.0864" height="497.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="355.5556" y="195.5556" text-anchor="middle" font-size="28.4444" font-weight="bold">Merge</text>
  <circle cx="189.6296" cy="284.4444" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="284.4444" cy="284.4444" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="284.4444" cy="373.3333" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="379.2593" cy="373.3333" r="23.7037" fill="var(--ok-fill)" />
  <circle cx="474.0741" cy="284.4444" r="23.7037" fill="var(--ok-fill)" />
  <text x="474.0741" y="293.3333" text-anchor="middle" font-size="15.8025" fill="var(--bg)">M</text>
  <line x1="213.3333" y1="284.4444" x2="260.7407" y2="284.4444" stroke="var(--text)" stroke-width="2" />
  <line x1="284.4444" y1="311.1111" x2="284.4444" y2="346.6667" stroke="var(--text)" stroke-width="2" />
  <line x1="308.1481" y1="373.3333" x2="355.5556" y2="373.3333" stroke="var(--text)" stroke-width="2" />
  <line x1="308.1481" y1="284.4444" x2="450.3704" y2="284.4444" stroke="var(--text)" stroke-width="2" />
  <line x1="402.963" y1="373.3333" x2="450.3704" y2="302.2222" stroke="var(--text)" stroke-width="2" />
  <text x="355.5556" y="444.4444" text-anchor="middle" font-size="18.963">✓ Preserves history</text>
  <text x="355.5556" y="480" text-anchor="middle" font-size="18.963">✓ Shows branches</text>
  <text x="355.5556" y="515.5556" text-anchor="middle" font-size="18.963">✗ Merge commits</text>
  <text x="355.5556" y="551.1111" text-anchor="middle" font-size="18.963">✗ Complex history</text>
  <rect x="663.7037" y="142.2222" width="521.4815" height="497.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="924.4444" y="195.5556" text-anchor="middle" font-size="28.4444" font-weight="bold">Rebase</text>
  <circle cx="758.5185" cy="284.4444" r="23.7037" fill="var(--primary-fill)" />
  <circle cx="853.3333" cy="284.4444" r="23.7037" fill="var(--primary-fill)" />
  <circle cx="948.1481" cy="284.4444" r="23.7037" fill="var(--primary-fill)" />
  <circle cx="1042.963" cy="284.4444" r="23.7037" fill="var(--primary-fill)" />
  <line x1="782.2222" y1="284.4444" x2="829.6296" y2="284.4444" stroke="var(--text)" stroke-width="2" />
  <line x1="877.037" y1="284.4444" x2="924.4444" y2="284.4444" stroke="var(--text)" stroke-width="2" />
  <line x1="971.8519" y1="284.4444" x2="1019.2593" y2="284.4444" stroke="var(--text)" stroke-width="2" />
  <text x="924.4444" y="444.4444" text-anchor="middle" font-size="18.963">✓ Linear history</text>
  <text x="924.4444" y="480" text-anchor="middle" font-size="18.963">✓ Clean timeline</text>
  <text x="924.4444" y="515.5556" text-anchor="middle" font-size="18.963">✗ Rewrites history</text>
  <text x="924.4444" y="551.1111" text-anchor="middle" font-size="18.963">✗ Loses branch context</text>
</svg>
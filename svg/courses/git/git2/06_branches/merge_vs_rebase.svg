<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="39.8855" font-weight="bold">Merge vs Rebase</text>
  <rect x="40" y="112.5" width="599.9999" height="507.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="340.0001" y="166.8751" text-anchor="middle" font-size="29.9141" font-weight="bold">Merge</text>
  <rect x="135.072" y="232.572" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="237.929" y="232.572" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="237.929" y="323.197" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="340.786" y="323.197" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="443.643" y="232.572" width="49.857" height="49.857" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="468.5715" y="266.5625" text-anchor="middle" font-size="16.619" fill="var(--bg)">M</text>
  <line x1="185.7143" y1="257.5" x2="237.1429" y2="257.5" stroke="var(--text)" stroke-width="2" />
  <line x1="262.8571" y1="284.6875" x2="262.8571" y2="320.9375" stroke="var(--text)" stroke-width="2" />
  <line x1="288.5714" y1="348.125" x2="340.0001" y2="348.125" stroke="var(--text)" stroke-width="2" />
  <line x1="288.5714" y1="257.5" x2="442.8572" y2="257.5" stroke="var(--text)" stroke-width="2" />
  <line x1="391.4286" y1="348.125" x2="442.8572" y2="275.625" stroke="var(--text)" stroke-width="2" />
  <text x="340.0001" y="420.625" text-anchor="middle" font-size="19.9428">✓ Preserves history</text>
  <text x="340.0001" y="456.875" text-anchor="middle" font-size="19.9428">✓ Shows branches</text>
  <text x="340.0001" y="493.125" text-anchor="middle" font-size="19.9428">✗ Merge commits</text>
  <text x="340.0001" y="529.375" text-anchor="middle" font-size="19.9428">✗ Complex history</text>
  <rect x="674.2857" y="112.5" width="565.7143" height="507.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1428" y="166.8751" text-anchor="middle" font-size="29.9141" font-weight="bold">Rebase</text>
  <rect x="752.214" y="232.572" width="49.857" height="49.857" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <rect x="855.072" y="232.572" width="49.857" height="49.857" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <rect x="957.929" y="232.572" width="49.857" height="49.857" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <rect x="1060.79" y="232.572" width="49.857" height="49.857" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <line x1="802.8571" y1="257.5" x2="854.2857" y2="257.5" stroke="var(--text)" stroke-width="2" />
  <line x1="905.7142" y1="257.5" x2="957.1428" y2="257.5" stroke="var(--text)" stroke-width="2" />
  <line x1="1008.5715" y1="257.5" x2="1060" y2="257.5" stroke="var(--text)" stroke-width="2" />
  <text x="957.1428" y="420.625" text-anchor="middle" font-size="19.9428">✓ Linear history</text>
  <text x="957.1428" y="456.875" text-anchor="middle" font-size="19.9428">✓ Clean timeline</text>
  <text x="957.1428" y="493.125" text-anchor="middle" font-size="19.9428">✗ Rewrites history</text>
  <text x="957.1428" y="529.375" text-anchor="middle" font-size="19.9428">✗ Loses branch context</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Merge vs Rebase</text>
  <rect x="80" y="144" width="560" height="504" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="360" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">Merge</text>
  <circle cx="192" cy="288" r="24" fill="#4CAF50" />
  <circle cx="288" cy="288" r="24" fill="#4CAF50" />
  <circle cx="288" cy="378" r="24" fill="#81C784" />
  <circle cx="384" cy="378" r="24" fill="#81C784" />
  <circle cx="480" cy="288" r="24" fill="#66BB6A" />
  <text x="480" y="297" text-anchor="middle" font-size="16" fill="white">M</text>
  <line x1="216" y1="288" x2="264" y2="288" stroke="#333" stroke-width="3.2" />
  <line x1="288" y1="315" x2="288" y2="351" stroke="#333" stroke-width="3.2" />
  <line x1="312" y1="378" x2="360" y2="378" stroke="#333" stroke-width="3.2" />
  <line x1="312" y1="288" x2="456" y2="288" stroke="#333" stroke-width="3.2" />
  <line x1="408" y1="378" x2="456" y2="306" stroke="#333" stroke-width="3.2" />
  <text x="360" y="450" text-anchor="middle" font-size="19.2">✓ Preserves history</text>
  <text x="360" y="486" text-anchor="middle" font-size="19.2">✓ Shows branches</text>
  <text x="360" y="522" text-anchor="middle" font-size="19.2">✗ Merge commits</text>
  <text x="360" y="558" text-anchor="middle" font-size="19.2">✗ Complex history</text>
  <rect x="672" y="144" width="528" height="504" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="936" y="198" text-anchor="middle" font-size="28.8" font-weight="bold">Rebase</text>
  <circle cx="768" cy="288" r="24" fill="#2196F3" />
  <circle cx="864" cy="288" r="24" fill="#2196F3" />
  <circle cx="960" cy="288" r="24" fill="#64B5F6" />
  <circle cx="1056" cy="288" r="24" fill="#64B5F6" />
  <line x1="792" y1="288" x2="840" y2="288" stroke="#333" stroke-width="3.2" />
  <line x1="888" y1="288" x2="936" y2="288" stroke="#333" stroke-width="3.2" />
  <line x1="984" y1="288" x2="1032" y2="288" stroke="#333" stroke-width="3.2" />
  <text x="936" y="450" text-anchor="middle" font-size="19.2">✓ Linear history</text>
  <text x="936" y="486" text-anchor="middle" font-size="19.2">✓ Clean timeline</text>
  <text x="936" y="522" text-anchor="middle" font-size="19.2">✗ Rewrites history</text>
  <text x="936" y="558" text-anchor="middle" font-size="19.2">✗ Loses branch context</text>
</svg>
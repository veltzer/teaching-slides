<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Choosing Between Merge and Rebase</text>
  <rect x="80" y="144" width="560" height="216" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="360" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Use Merge When:</text>
  <text x="112" y="243" font-size="19.2">• Working on shared branches</text>
  <text x="112" y="279" font-size="19.2">• Want to preserve branch history</text>
  <text x="112" y="315" font-size="19.2">• After pushing to remote</text>
  <rect x="672" y="144" width="528" height="216" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="936" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Use Rebase When:</text>
  <text x="704" y="243" font-size="19.2">• Cleaning local commits</text>
  <text x="704" y="279" font-size="19.2">• Before pushing feature branch</text>
  <text x="704" y="315" font-size="19.2">• Want linear history</text>
  <rect x="240" y="396" width="800" height="252" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="640" y="450" text-anchor="middle" font-size="25.6" font-weight="bold">⚠️ Golden Rule of Rebase</text>
  <text x="640" y="504" text-anchor="middle" font-size="22.4" font-weight="bold">Never rebase public branches!</text>
  <text x="272" y="558" font-size="19.2">If others have based work on your commits,</text>
  <text x="272" y="594" font-size="19.2">rebase will cause problems. Use merge instead.</text>
</svg>
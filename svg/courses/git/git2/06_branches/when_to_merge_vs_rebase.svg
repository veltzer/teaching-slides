<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Choosing Between Merge and Rebase</ns0:text>
  <ns0:rect x="79.0123" y="142.2222" width="553.0864" height="213.3333" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="355.5556" y="195.5556" text-anchor="middle" font-size="25.284" font-weight="bold">Use Merge When:</ns0:text>
  <ns0:text x="110.6173" y="240" font-size="18.963">• Working on shared branches</ns0:text>
  <ns0:text x="110.6173" y="275.5556" font-size="18.963">• Want to preserve branch history</ns0:text>
  <ns0:text x="110.6173" y="311.1111" font-size="18.963">• After pushing to remote</ns0:text>
  <ns0:rect x="663.7037" y="142.2222" width="521.4815" height="213.3333" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="924.4444" y="195.5556" text-anchor="middle" font-size="25.284" font-weight="bold">Use Rebase When:</ns0:text>
  <ns0:text x="695.3086" y="240" font-size="18.963">• Cleaning local commits</ns0:text>
  <ns0:text x="695.3086" y="275.5556" font-size="18.963">• Before pushing feature branch</ns0:text>
  <ns0:text x="695.3086" y="311.1111" font-size="18.963">• Want linear history</ns0:text>
  <ns0:rect x="237.037" y="391.1111" width="790.1235" height="248.8889" fill="#FFEBEE" stroke="#C62828" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="632.0988" y="444.4444" text-anchor="middle" font-size="25.284" font-weight="bold">⚠️ Golden Rule of Rebase</ns0:text>
  <ns0:text x="632.0988" y="497.7778" text-anchor="middle" font-size="22.1235" font-weight="bold">Never rebase public branches!</ns0:text>
  <ns0:text x="268.642" y="551.1111" font-size="18.963">If others have based work on your commits,</ns0:text>
  <ns0:text x="268.642" y="586.6667" font-size="18.963">rebase will cause problems. Use merge instead.</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="472.6798" y="56.4706" text-anchor="middle" font-size="25.0981" font-weight="bold">Branch Lifecycle</text>
  <rect x="106.6667" y="103.5294" width="156.8628" height="94.1176" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.4118" rx="6" />
  <text x="185.098" y="138.8236" text-anchor="middle" font-size="14.6405" font-weight="bold">1. Create</text>
  <text x="185.098" y="168.2353" text-anchor="middle" font-size="11.5033">Branch from main</text>
  <text x="185.098" y="185.8823" text-anchor="middle" font-size="10.4576" font-family="monospace">git branch feature</text>
  <rect x="284.4445" y="103.5294" width="156.8628" height="94.1176" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.4118" rx="6" />
  <text x="362.8759" y="138.8236" text-anchor="middle" font-size="14.6405" font-weight="bold">2. Develop</text>
  <text x="362.8759" y="168.2353" text-anchor="middle" font-size="11.5033">Make commits</text>
  <text x="362.8759" y="185.8823" text-anchor="middle" font-size="10.4576" font-family="monospace">git commit</text>
  <rect x="462.2222" y="103.5294" width="156.8628" height="94.1176" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.4118" rx="6" />
  <text x="540.6536" y="138.8236" text-anchor="middle" font-size="14.6405" font-weight="bold">3. Merge</text>
  <text x="540.6536" y="168.2353" text-anchor="middle" font-size="11.5033">Integrate changes</text>
  <text x="540.6536" y="185.8823" text-anchor="middle" font-size="10.4576" font-family="monospace">git merge feature</text>
  <rect x="640" y="103.5294" width="156.8628" height="94.1176" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.4118" rx="6" />
  <text x="718.4314" y="138.8236" text-anchor="middle" font-size="14.6405" font-weight="bold">4. Delete</text>
  <text x="718.4314" y="168.2353" text-anchor="middle" font-size="11.5033">Clean up</text>
  <text x="718.4314" y="185.8823" text-anchor="middle" font-size="10.4576" font-family="monospace">git branch -d feature</text>
  <path d="M 263.5294 150.5882 L 284.4445 150.5882" stroke="var(--text)" stroke-width="1.1389" marker-end="url(#arrow)" />
  <path d="M 441.3072 150.5882 L 462.2222 150.5882" stroke="var(--text)" stroke-width="1.1389" marker-end="url(#arrow)" />
  <path d="M 619.085 150.5882 L 640 150.5882" stroke="var(--text)" stroke-width="1.1389" marker-end="url(#arrow)" />
  <rect x="263.5294" y="244.7059" width="418.3007" height="164.7059" fill="var(--surface)" stroke="var(--border)" stroke-width="0.7059" rx="6" />
  <text x="472.6798" y="280" text-anchor="middle" font-size="14.6405" font-weight="bold">Best Practices</text>
  <text x="284.4445" y="309.4117" font-size="12.549">• Keep branches short-lived (days, not months)</text>
  <text x="284.4445" y="332.9412" font-size="12.549">• Delete merged branches promptly</text>
  <text x="284.4445" y="356.4705" font-size="12.549">• Use descriptive names</text>
  <text x="284.4445" y="380" font-size="12.549">• One feature per branch</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
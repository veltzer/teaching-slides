<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="457.1429" y="51.4286" text-anchor="middle" font-size="27.4286" font-weight="bold">Branch Lifecycle</ns0:text>
  <ns0:rect x="57.1429" y="102.8571" width="171.4286" height="102.8571" fill="#E8F5E9" stroke="#388E3C" stroke-width="2.2857" rx="5.7143" />
  <ns0:text x="142.8571" y="141.4286" text-anchor="middle" font-size="16" font-weight="bold">1. Create</ns0:text>
  <ns0:text x="142.8571" y="173.5714" text-anchor="middle" font-size="12.5714">Branch from main</ns0:text>
  <ns0:text x="142.8571" y="192.8571" text-anchor="middle" font-size="11.4286" font-family="monospace">git branch feature</ns0:text>
  <ns0:rect x="251.4286" y="102.8571" width="171.4286" height="102.8571" fill="#E3F2FD" stroke="#1976D2" stroke-width="2.2857" rx="5.7143" />
  <ns0:text x="337.1429" y="141.4286" text-anchor="middle" font-size="16" font-weight="bold">2. Develop</ns0:text>
  <ns0:text x="337.1429" y="173.5714" text-anchor="middle" font-size="12.5714">Make commits</ns0:text>
  <ns0:text x="337.1429" y="192.8571" text-anchor="middle" font-size="11.4286" font-family="monospace">git commit</ns0:text>
  <ns0:rect x="445.7143" y="102.8571" width="171.4286" height="102.8571" fill="#FFF3E0" stroke="#F57C00" stroke-width="2.2857" rx="5.7143" />
  <ns0:text x="531.4286" y="141.4286" text-anchor="middle" font-size="16" font-weight="bold">3. Merge</ns0:text>
  <ns0:text x="531.4286" y="173.5714" text-anchor="middle" font-size="12.5714">Integrate changes</ns0:text>
  <ns0:text x="531.4286" y="192.8571" text-anchor="middle" font-size="11.4286" font-family="monospace">git merge feature</ns0:text>
  <ns0:rect x="640" y="102.8571" width="171.4286" height="102.8571" fill="#FFEBEE" stroke="#C62828" stroke-width="2.2857" rx="5.7143" />
  <ns0:text x="725.7143" y="141.4286" text-anchor="middle" font-size="16" font-weight="bold">4. Delete</ns0:text>
  <ns0:text x="725.7143" y="173.5714" text-anchor="middle" font-size="12.5714">Clean up</ns0:text>
  <ns0:text x="725.7143" y="192.8571" text-anchor="middle" font-size="11.4286" font-family="monospace">git branch -d feature</ns0:text>
  <ns0:path d="M 228.5714 154.2857 L 251.4286 154.2857" stroke="#333" stroke-width="2.2857" marker-end="url(#arrow1)" />
  <ns0:path d="M 422.8571 154.2857 L 445.7143 154.2857" stroke="#333" stroke-width="2.2857" marker-end="url(#arrow1)" />
  <ns0:path d="M 617.1429 154.2857 L 640 154.2857" stroke="#333" stroke-width="2.2857" marker-end="url(#arrow1)" />
  <ns0:rect x="228.5714" y="257.1429" width="457.1429" height="180" fill="#F5F5F5" stroke="#333" stroke-width="2.2857" rx="5.7143" />
  <ns0:text x="457.1429" y="295.7143" text-anchor="middle" font-size="16" font-weight="bold">Best Practices</ns0:text>
  <ns0:text x="251.4286" y="327.8571" font-size="13.7143">• Keep branches short-lived (days, not months)</ns0:text>
  <ns0:text x="251.4286" y="353.5714" font-size="13.7143">• Delete merged branches promptly</ns0:text>
  <ns0:text x="251.4286" y="379.2857" font-size="13.7143">• Use descriptive names</ns0:text>
  <ns0:text x="251.4286" y="405" font-size="13.7143">• One feature per branch</ns0:text>
  <ns0:defs>
    <ns0:marker id="arrow1" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <ns0:polygon points="0,18 4.8,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
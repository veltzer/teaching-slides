<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="676.3637" y="40" text-anchor="middle" font-size="42.4237" font-weight="bold">Branch Lifecycle</text>
  <rect x="40" y="117.3333" width="272.7274" height="154.6666" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="176.3635" y="175.3334" text-anchor="middle" font-size="24.747" font-weight="bold">1. Create</text>
  <text x="176.3635" y="223.6666" text-anchor="middle" font-size="19.4442">Branch from main</text>
  <text x="176.3635" y="252.6665" text-anchor="middle" font-size="17.6766" font-family="monospace">git branch feature</text>
  <rect x="349.0909" y="117.3333" width="272.7274" height="154.6666" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="485.4546" y="175.3334" text-anchor="middle" font-size="24.747" font-weight="bold">2. Develop</text>
  <text x="485.4546" y="223.6666" text-anchor="middle" font-size="19.4442">Make commits</text>
  <text x="485.4546" y="252.6665" text-anchor="middle" font-size="17.6766" font-family="monospace">git commit</text>
  <rect x="658.1817" y="117.3333" width="272.7274" height="154.6666" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="794.5454" y="175.3334" text-anchor="middle" font-size="24.747" font-weight="bold">3. Merge</text>
  <text x="794.5454" y="223.6666" text-anchor="middle" font-size="19.4442">Integrate changes</text>
  <text x="794.5454" y="252.6665" text-anchor="middle" font-size="17.6766" font-family="monospace">git merge feature</text>
  <rect x="967.2726" y="117.3333" width="272.7274" height="154.6666" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1103.6363" y="175.3334" text-anchor="middle" font-size="24.747" font-weight="bold">4. Delete</text>
  <text x="1103.6363" y="223.6666" text-anchor="middle" font-size="19.4442">Clean up</text>
  <text x="1103.6363" y="252.6665" text-anchor="middle" font-size="17.6766" font-family="monospace">git branch -d feature</text>
  <path d="M 312.7272 194.6666 L 349.0909 194.6666" stroke="var(--text)" stroke-width="1.1389" marker-end="url(#arrow)" />
  <path d="M 621.8181 194.6666 L 658.1817 194.6666" stroke="var(--text)" stroke-width="1.1389" marker-end="url(#arrow)" />
  <path d="M 930.9091 194.6666 L 967.2726 194.6666" stroke="var(--text)" stroke-width="1.1389" marker-end="url(#arrow)" />
  <rect x="312.7272" y="349.3333" width="727.2728" height="270.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="676.3637" y="407.3333" text-anchor="middle" font-size="24.747" font-weight="bold">Best Practices</text>
  <text x="349.0909" y="455.6665" font-size="21.2117">• Keep branches short-lived (days, not months)</text>
  <text x="349.0909" y="494.3333" font-size="21.2117">• Delete merged branches promptly</text>
  <text x="349.0909" y="532.9998" font-size="21.2117">• Use descriptive names</text>
  <text x="349.0909" y="571.6666" font-size="21.2117">• One feature per branch</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
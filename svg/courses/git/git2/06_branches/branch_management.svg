<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Branch Lifecycle</text>
  <rect x="80" y="144" width="240" height="144" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="200" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">1. Create</text>
  <text x="200" y="243" text-anchor="middle" font-size="17.6">Branch from main</text>
  <text x="200" y="270" text-anchor="middle" font-size="16" font-family="monospace">git branch feature</text>
  <rect x="352" y="144" width="240" height="144" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="472" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">2. Develop</text>
  <text x="472" y="243" text-anchor="middle" font-size="17.6">Make commits</text>
  <text x="472" y="270" text-anchor="middle" font-size="16" font-family="monospace">git commit</text>
  <rect x="624" y="144" width="240" height="144" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="744" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">3. Merge</text>
  <text x="744" y="243" text-anchor="middle" font-size="17.6">Integrate changes</text>
  <text x="744" y="270" text-anchor="middle" font-size="16" font-family="monospace">git merge feature</text>
  <rect x="896" y="144" width="240" height="144" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="1016" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">4. Delete</text>
  <text x="1016" y="243" text-anchor="middle" font-size="17.6">Clean up</text>
  <text x="1016" y="270" text-anchor="middle" font-size="16" font-family="monospace">git branch -d feature</text>
  <path d="M 320 216 L 352 216" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <path d="M 592 216 L 624 216" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <path d="M 864 216 L 896 216" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <rect x="320" y="360" width="640" height="252" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="414" text-anchor="middle" font-size="22.4" font-weight="bold">Best Practices</text>
  <text x="352" y="459" font-size="19.2">• Keep branches short-lived (days, not months)</text>
  <text x="352" y="495" font-size="19.2">• Delete merged branches promptly</text>
  <text x="352" y="531" font-size="19.2">• Use descriptive names</text>
  <text x="352" y="567" font-size="19.2">• One feature per branch</text>
  <defs>
    <marker id="arrow1" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="669.6296" y="80" text-anchor="middle" font-size="35.5556" font-weight="bold">Branch Lifecycle</text>
  <rect x="151.1111" y="146.6666" width="222.2223" height="133.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.7778" />
  <text x="262.2221" y="196.6667" text-anchor="middle" font-size="20.7407" font-weight="bold">1. Create</text>
  <text x="262.2221" y="238.3333" text-anchor="middle" font-size="16.2963">Branch from main</text>
  <text x="262.2221" y="263.3332" text-anchor="middle" font-size="14.8149" font-family="monospace">git branch feature</text>
  <rect x="402.963" y="146.6666" width="222.2223" height="133.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.7778" />
  <text x="514.0741" y="196.6667" text-anchor="middle" font-size="20.7407" font-weight="bold">2. Develop</text>
  <text x="514.0741" y="238.3333" text-anchor="middle" font-size="16.2963">Make commits</text>
  <text x="514.0741" y="263.3332" text-anchor="middle" font-size="14.8149" font-family="monospace">git commit</text>
  <rect x="654.8148" y="146.6666" width="222.2223" height="133.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.7778" />
  <text x="765.9259" y="196.6667" text-anchor="middle" font-size="20.7407" font-weight="bold">3. Merge</text>
  <text x="765.9259" y="238.3333" text-anchor="middle" font-size="16.2963">Integrate changes</text>
  <text x="765.9259" y="263.3332" text-anchor="middle" font-size="14.8149" font-family="monospace">git merge feature</text>
  <rect x="906.6666" y="146.6666" width="222.2223" height="133.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.7778" />
  <text x="1017.7777" y="196.6667" text-anchor="middle" font-size="20.7407" font-weight="bold">4. Delete</text>
  <text x="1017.7777" y="238.3333" text-anchor="middle" font-size="16.2963">Clean up</text>
  <text x="1017.7777" y="263.3332" text-anchor="middle" font-size="14.8149" font-family="monospace">git branch -d feature</text>
  <path d="M 373.3333 213.3333 L 402.963 213.3333" stroke="var(--text)" stroke-width="2.2857" marker-end="url(#arrow)" />
  <path d="M 625.1851 213.3333 L 654.8148 213.3333" stroke="var(--text)" stroke-width="2.2857" marker-end="url(#arrow)" />
  <path d="M 877.037 213.3333 L 906.6666 213.3333" stroke="var(--text)" stroke-width="2.2857" marker-end="url(#arrow)" />
  <rect x="373.3333" y="346.6667" width="592.5926" height="233.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.7778" />
  <text x="669.6296" y="396.6666" text-anchor="middle" font-size="20.7407" font-weight="bold">Best Practices</text>
  <text x="402.963" y="438.3332" font-size="17.7778">• Keep branches short-lived (days, not months)</text>
  <text x="402.963" y="471.6666" font-size="17.7778">• Delete merged branches promptly</text>
  <text x="402.963" y="504.9999" font-size="17.7778">• Use descriptive names</text>
  <text x="402.963" y="538.3333" font-size="17.7778">• One feature per branch</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
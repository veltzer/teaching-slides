<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Merge Conflict Anatomy</ns0:text>
  <ns0:rect x="158.0247" y="142.2222" width="948.1481" height="320" fill="#FFEBEE" stroke="#C62828" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="632.0988" y="186.6667" text-anchor="middle" font-size="22.1235" font-weight="bold">Conflicted File</ns0:text>
  <ns0:text x="189.6296" y="231.1111" font-family="monospace" font-size="18.963">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</ns0:text>
  <ns0:text x="189.6296" y="266.6667" font-family="monospace" font-size="18.963">console.log("main branch code");</ns0:text>
  <ns0:text x="189.6296" y="302.2222" font-family="monospace" font-size="18.963">=======</ns0:text>
  <ns0:text x="189.6296" y="337.7778" font-family="monospace" font-size="18.963">console.log("feature branch code");</ns0:text>
  <ns0:text x="189.6296" y="373.3333" font-family="monospace" font-size="18.963">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature</ns0:text>
  <ns0:text x="790.1235" y="266.6667" font-size="17.3827">← Your current branch (HEAD)</ns0:text>
  <ns0:text x="790.1235" y="302.2222" font-size="17.3827">← Separator</ns0:text>
  <ns0:text x="790.1235" y="337.7778" font-size="17.3827">← Incoming branch</ns0:text>
  <ns0:rect x="237.037" y="497.7778" width="790.1235" height="142.2222" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="632.0988" y="551.1111" text-anchor="middle" font-size="22.1235" font-weight="bold">Resolution: Choose or Combine</ns0:text>
  <ns0:text x="268.642" y="595.5556" font-family="monospace" font-size="18.963">console.log("combined solution");</ns0:text>
  <ns0:text x="268.642" y="622.2222" font-family="monospace" font-size="18.963">// or pick one side, or write new code</ns0:text>
</ns0:svg>
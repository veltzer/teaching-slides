<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="43.0813" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Merge Conflict Anatomy</text>
  <rect x="40" y="112.5" width="1200" height="326.25" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="157.8125" text-anchor="middle" font-size="25.1308" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Conflicted File</text>
  <text x="80" y="203.125" font-size="21.5407" font-family="Courier New, monospace" fill="var(--danger-text)">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
  <text x="80" y="239.375" font-size="21.5407" font-family="Courier New, monospace" fill="var(--danger-text)">console.log("main branch code");</text>
  <text x="80" y="275.625" font-size="21.5407" font-family="Courier New, monospace" fill="var(--danger-text)">=======</text>
  <text x="80" y="311.875" font-size="21.5407" font-family="Courier New, monospace" fill="var(--danger-text)">console.log("feature branch code");</text>
  <text x="80" y="348.125" font-size="21.5407" font-family="Courier New, monospace" fill="var(--danger-text)">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature</text>
  <text x="840.0001" y="239.375" font-size="19.7456" font-family="Arial, sans-serif" fill="var(--danger-text)">← Your current branch (HEAD)</text>
  <text x="840.0001" y="275.625" font-size="19.7456" font-family="Arial, sans-serif" fill="var(--danger-text)">← Separator</text>
  <text x="840.0001" y="311.875" font-size="19.7456" font-family="Arial, sans-serif" fill="var(--danger-text)">← Incoming branch</text>
  <rect x="139.9999" y="475" width="1000.0001" height="145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="529.375" text-anchor="middle" font-size="25.1308" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Resolution: Choose or Combine</text>
  <text x="180" y="574.6875" font-size="21.5407" font-family="Courier New, monospace" fill="var(--ok-text)">console.log("combined solution");</text>
  <text x="180" y="601.875" font-size="21.5407" font-family="Courier New, monospace" fill="var(--ok-text)">// or pick one side, or write new code</text>
</svg>

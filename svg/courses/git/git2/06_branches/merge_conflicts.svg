<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Merge Conflict Anatomy</text>
  <rect x="160" y="144" width="960" height="324" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="640" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">Conflicted File</text>
  <text x="192" y="234" font-family="monospace" font-size="19.2">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
  <text x="192" y="270" font-family="monospace" font-size="19.2">console.log("main branch code");</text>
  <text x="192" y="306" font-family="monospace" font-size="19.2">=======</text>
  <text x="192" y="342" font-family="monospace" font-size="19.2">console.log("feature branch code");</text>
  <text x="192" y="378" font-family="monospace" font-size="19.2">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature</text>
  <text x="800" y="270" font-size="17.6">← Your current branch (HEAD)</text>
  <text x="800" y="306" font-size="17.6">← Separator</text>
  <text x="800" y="342" font-size="17.6">← Incoming branch</text>
  <rect x="240" y="504" width="800" height="144" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="640" y="558" text-anchor="middle" font-size="22.4" font-weight="bold">Resolution: Choose or Combine</text>
  <text x="272" y="603" font-family="monospace" font-size="19.2">console.log("combined solution");</text>
  <text x="272" y="630" font-family="monospace" font-size="19.2">// or pick one side, or write new code</text>
</svg>
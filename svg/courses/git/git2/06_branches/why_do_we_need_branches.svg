<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Life Without Branches</text>
  <rect x="160" y="144" width="960" height="180" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <circle cx="240" cy="234" r="32" fill="#F44336" />
  <text x="240" y="243" text-anchor="middle" font-size="16" fill="white">v1.0</text>
  <circle cx="400" cy="234" r="32" fill="#e74c3c" />
  <text x="400" y="243" text-anchor="middle" font-size="16" fill="white">bug?</text>
  <circle cx="560" cy="234" r="32" fill="#e74c3c" />
  <text x="560" y="243" text-anchor="middle" font-size="16" fill="white">feat?</text>
  <circle cx="720" cy="234" r="32" fill="#FFCDD2" />
  <text x="720" y="243" text-anchor="middle" font-size="16">broken!</text>
  <circle cx="880" cy="234" r="32" fill="#FFEBEE" />
  <text x="880" y="243" text-anchor="middle" font-size="16">fix?</text>
  <line x1="272" y1="234" x2="368" y2="234" stroke="#333" stroke-width="3.2" />
  <line x1="432" y1="234" x2="528" y2="234" stroke="#333" stroke-width="3.2" />
  <line x1="592" y1="234" x2="688" y2="234" stroke="#333" stroke-width="3.2" />
  <line x1="752" y1="234" x2="848" y2="234" stroke="#333" stroke-width="3.2" />
  <text x="640" y="297" text-anchor="middle" font-size="22.4" font-style="italic">Everything mixed together - chaos!</text>
  <rect x="160" y="360" width="960" height="270" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="414" text-anchor="middle" font-size="25.6" font-weight="bold">Problems:</text>
  <text x="192" y="468" font-size="19.2">• Can't work on features independently</text>
  <text x="192" y="504" font-size="19.2">• Broken code affects everyone</text>
  <text x="192" y="540" font-size="19.2">• No way to isolate experiments</text>
  <text x="192" y="576" font-size="19.2">• Difficult to maintain stable version</text>
</svg>
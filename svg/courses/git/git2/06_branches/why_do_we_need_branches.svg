<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Life Without Branches</text>
  <rect x="160" y="144" width="960" height="180" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <circle cx="240" cy="234" r="32" fill="#F44336" />
  <text x="240" y="243" text-anchor="middle" font-size="16" fill="white">v1.0</text>
  <circle cx="400" cy="234" r="32" fill="#EF5350" />
  <text x="400" y="243" text-anchor="middle" font-size="16" fill="white">bug?</text>
  <circle cx="560" cy="234" r="32" fill="#E57373" />
  <text x="560" y="243" text-anchor="middle" font-size="16" fill="white">feat?</text>
  <circle cx="720" cy="234" r="32" fill="#FFCDD2" />
  <text x="720" y="243" text-anchor="middle" font-size="16">broken!</text>
  <circle cx="880" cy="234" r="32" fill="#FFEBEE" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="43.7707" font-weight="bold">Life Without Branches</text>
  <rect x="40" y="114.8387" width="1200" height="187.0968" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <rect x="103.524" y="171.911" width="72.9512" height="72.9512" rx="14" fill="var(--danger-fill)"/>
  <text x="140" y="217.7419" text-anchor="middle" font-size="18.2378" fill="var(--bg)">v1.0</text>
  <rect x="303.524" y="171.911" width="72.9512" height="72.9512" rx="14" fill="var(--danger-fill)"/>
  <text x="340" y="217.7419" text-anchor="middle" font-size="18.2378" fill="var(--bg)">bug?</text>
  <rect x="503.524" y="171.911" width="72.9512" height="72.9512" rx="14" fill="var(--danger-fill)"/>
  <text x="540" y="217.7419" text-anchor="middle" font-size="18.2378" fill="var(--bg)">feat?</text>
  <rect x="703.524" y="171.911" width="72.9512" height="72.9512" rx="14" fill="var(--danger-fill)"/>
  <text x="740" y="217.7419" text-anchor="middle" font-size="18.2378">broken!</text>
  <rect x="903.524" y="171.911" width="72.9512" height="72.9512" rx="14" fill="var(--danger-fill)"/>
  <text x="940" y="217.7419" text-anchor="middle" font-size="18.2378">fix?</text>
  <line x1="180" y1="208.3871" x2="300" y2="208.3871" stroke="var(--text)" stroke-width="2" />
  <line x1="380" y1="208.3871" x2="500" y2="208.3871" stroke="var(--text)" stroke-width="2" />
  <line x1="580" y1="208.3871" x2="700" y2="208.3871" stroke="var(--text)" stroke-width="2" />
  <line x1="780" y1="208.3871" x2="900" y2="208.3871" stroke="var(--text)" stroke-width="2" />
  <text x="640" y="273.871" text-anchor="middle" font-size="25.5329" font-style="italic">Everything mixed together - chaos!</text>
  <rect x="40" y="339.3548" width="1200" height="280.6452" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="640" y="395.4839" text-anchor="middle" font-size="29.1804" font-weight="bold">Problems:</text>
  <text x="80" y="451.6129" font-size="21.8853">• Can't work on features independently</text>
  <text x="80" y="489.0323" font-size="21.8853">• Broken code affects everyone</text>
  <text x="80" y="526.4516" font-size="21.8853">• No way to isolate experiments</text>
  <text x="80" y="563.871" font-size="21.8853">• Difficult to maintain stable version</text>
</svg>
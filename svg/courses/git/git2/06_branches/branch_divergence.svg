<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Branch Divergence</text>

  <!-- Commits on main -->
  <circle cx="150" cy="270" r="30" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">A</text>

  <circle cx="280" cy="270" r="30" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="280" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">B</text>

  <line x1="180" y1="270" x2="248" y2="270" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Fork point -->
  <circle cx="410" cy="270" r="30" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="410" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">C</text>
  <text x="410" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">fork point</text>
  <text x="410" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">(common ancestor)</text>

  <line x1="310" y1="270" x2="378" y2="270" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Main line -->
  <circle cx="620" cy="170" r="30" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="620" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">D</text>
  <circle cx="820" cy="170" r="30" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="820" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">E</text>
  <circle cx="1020" cy="170" r="30" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1020" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">F</text>

  <line x1="435" y1="255" x2="592" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="170" x2="788" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="850" y1="170" x2="988" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- main label -->
  <rect x="1070" y="150" width="120" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1130" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">main</text>

  <!-- Feature branch -->
  <circle cx="620" cy="380" r="30" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="620" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">X</text>
  <circle cx="820" cy="380" r="30" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="820" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">Y</text>

  <line x1="435" y1="285" x2="592" y2="365" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="380" x2="788" y2="380" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- feature label -->
  <rect x="870" y="360" width="160" height="40" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="950" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">feature-x</text>

  <!-- Explanation -->
  <rect x="40" y="480" width="1200" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">What divergence means</text>
  <text x="80" y="545" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">• Both branches share history up to C, then commit new work on different lines.</text>
  <text x="80" y="568" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">• main has D, E, F. feature-x has X, Y. Neither branch is "behind" the other — they are ahead and behind each other.</text>
  <text x="80" y="591" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">• git merge feature-x from main creates a merge commit with two parents. git rebase replays X, Y on top of F.</text>
</svg>

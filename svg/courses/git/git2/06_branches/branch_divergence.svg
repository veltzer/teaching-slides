<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0954" font-weight="bold" fill="var(--text)">Branch Divergence</text>

  <!-- Commits on main -->
  <rect x="119.87" y="236.826" width="60.2604" height="60.2604" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0564" font-weight="bold" fill="var(--primary-text)">A</text>

  <rect x="249.87" y="236.826" width="60.2604" height="60.2604" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0564" font-weight="bold" fill="var(--primary-text)">B</text>

  <line x1="180" y1="266.9565" x2="248" y2="266.9565" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Fork point -->
  <rect x="379.87" y="236.826" width="60.2604" height="60.2604" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0564" font-weight="bold" fill="var(--primary-text)">C</text>
  <text x="410" y="322.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" fill="var(--text-muted)">fork point</text>
  <text x="410" y="340.5913" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" fill="var(--text-muted)">(common ancestor)</text>

  <line x1="310" y1="266.9565" x2="378" y2="266.9565" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Main line -->
  <rect x="589.87" y="135.957" width="60.2604" height="60.2604" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="171.1304" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0564" font-weight="bold" fill="var(--primary-text)">D</text>
  <rect x="789.87" y="135.957" width="60.2604" height="60.2604" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="171.1304" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0564" font-weight="bold" fill="var(--primary-text)">E</text>
  <rect x="989.87" y="135.957" width="60.2604" height="60.2604" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="171.1304" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0564" font-weight="bold" fill="var(--primary-text)">F</text>

  <line x1="435" y1="251.8261" x2="592" y2="181.2174" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="166.087" x2="788" y2="166.087" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="850" y1="166.087" x2="988" y2="166.087" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- main label -->
  <rect x="1070" y="145.913" width="120" height="40.3478" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="171.1304" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0564" font-weight="bold" fill="var(--primary-text)">main</text>

  <!-- Feature branch -->
  <rect x="589.87" y="347.783" width="60.2604" height="60.2604" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="382.9565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0564" font-weight="bold" fill="var(--warn-text)">X</text>
  <rect x="789.87" y="347.783" width="60.2604" height="60.2604" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="382.9565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0564" font-weight="bold" fill="var(--warn-text)">Y</text>

  <line x1="435" y1="282.087" x2="592" y2="362.7826" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="377.913" x2="788" y2="377.913" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- feature label -->
  <rect x="870" y="357.7391" width="160" height="40.3478" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="382.9565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0564" font-weight="bold" fill="var(--warn-text)">feature-x</text>

  <!-- Explanation -->
  <rect x="40" y="478.7826" width="1200" height="141.2174" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="514.087" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0694" font-weight="bold" fill="var(--text)">What divergence means</text>
  <text x="80" y="544.3478" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text-muted)">• Both branches share history up to C, then commit new work on different lines.</text>
  <text x="80" y="567.5478" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text-muted)">• main has D, E, F. feature-x has X, Y. Neither branch is "behind" the other — they are ahead and behind each other.</text>
  <text x="80" y="590.7478" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text-muted)">• git merge feature-x from main creates a merge commit with two parents. git rebase replays X, Y on top of F.</text>
</svg>

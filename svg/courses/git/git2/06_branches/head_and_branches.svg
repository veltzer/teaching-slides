<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">HEAD and Branch Pointers</text>

  <!-- Commit chain -->
  <circle cx="180" cy="280" r="35" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">A</text>

  <circle cx="360" cy="280" r="35" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="360" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">B</text>

  <circle cx="540" cy="280" r="35" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="540" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">C</text>

  <circle cx="720" cy="280" r="35" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="720" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">D</text>

  <circle cx="900" cy="280" r="35" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="900" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">E</text>

  <circle cx="1080" cy="280" r="35" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1080" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">F</text>

  <line x1="215" y1="280" x2="325" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="280" x2="505" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="575" y1="280" x2="685" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="755" y1="280" x2="865" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="935" y1="280" x2="1045" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- main branch pointer -->
  <rect x="830" y="150" width="140" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="900" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">main</text>
  <line x1="900" y1="200" x2="900" y2="242" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- feature branch pointer -->
  <rect x="1020" y="150" width="140" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1090" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">feature</text>
  <line x1="1080" y1="200" x2="1080" y2="242" stroke="var(--warn-accent)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HEAD pointer -->
  <rect x="830" y="400" width="140" height="50" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="900" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-text)">HEAD</text>
  <line x1="900" y1="400" x2="900" y2="320" stroke="var(--danger-accent)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">symbolic ref to</text>
  <text x="900" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">refs/heads/main</text>

  <!-- Notes -->
  <rect x="40" y="540" width="1200" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Key ideas</text>
  <text x="80" y="598" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">• A branch is just a movable pointer to a commit (stored in .git/refs/heads/BRANCH). No data of its own.</text>
  <text x="80" y="620" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">• HEAD is a pointer to a branch (usually). git commit advances the branch HEAD points at. git switch moves HEAD.</text>
</svg>

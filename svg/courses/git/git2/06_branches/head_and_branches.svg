<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- PLACEHOLDERSVG — scaffolded diagram, needs real content -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7209" font-weight="bold" fill="var(--text)">HEAD and Branch Pointers</text>

  <!-- Commit chain -->
  <rect x="145.444" y="234.52" width="69.112" height="69.112" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="273.9496" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8351" font-weight="bold" fill="var(--primary-text)">A</text>

  <rect x="325.444" y="234.52" width="69.112" height="69.112" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="273.9496" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8351" font-weight="bold" fill="var(--primary-text)">B</text>

  <rect x="505.444" y="234.52" width="69.112" height="69.112" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="273.9496" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8351" font-weight="bold" fill="var(--primary-text)">C</text>

  <rect x="685.444" y="234.52" width="69.112" height="69.112" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="273.9496" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8351" font-weight="bold" fill="var(--primary-text)">D</text>

  <rect x="865.444" y="234.52" width="69.112" height="69.112" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="273.9496" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8351" font-weight="bold" fill="var(--primary-text)">E</text>

  <rect x="1045.44" y="234.52" width="69.112" height="69.112" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="273.9496" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8351" font-weight="bold" fill="var(--primary-text)">F</text>

  <line x1="215" y1="269.0756" x2="325" y2="269.0756" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="269.0756" x2="505" y2="269.0756" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="575" y1="269.0756" x2="685" y2="269.0756" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="755" y1="269.0756" x2="865" y2="269.0756" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="935" y1="269.0756" x2="1045" y2="269.0756" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- main branch pointer -->
  <rect x="830" y="142.3529" width="140" height="48.7395" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="173.5462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8224" font-weight="bold" fill="var(--ok-text)">main</text>
  <line x1="900" y1="191.0924" x2="900" y2="232.0336" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- feature branch pointer -->
  <rect x="1020" y="142.3529" width="140" height="48.7395" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="173.5462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8224" font-weight="bold" fill="var(--warn-text)">feature</text>
  <line x1="1080" y1="191.0924" x2="1080" y2="232.0336" stroke="var(--warn-accent)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HEAD pointer -->
  <rect x="830" y="386.0504" width="140" height="48.7395" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="417.2437" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8224" font-weight="bold" fill="var(--danger-text)">HEAD</text>
  <line x1="900" y1="386.0504" x2="900" y2="308.0672" stroke="var(--danger-accent)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="459.1597" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8478" fill="var(--text-muted)">symbolic ref to</text>
  <text x="900" y="476.7059" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8478" fill="var(--text-muted)">refs/heads/main</text>

  <!-- Notes -->
  <rect x="40" y="522.521" width="1200" height="97.479" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="551.7647" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8097" font-weight="bold" fill="var(--text)">Key ideas</text>
  <text x="80" y="579.0588" font-family="Arial, sans-serif" font-size="12.8351" fill="var(--text-muted)">• A branch is just a movable pointer to a commit (stored in .git/refs/heads/BRANCH). No data of its own.</text>
  <text x="80" y="600.5042" font-family="Arial, sans-serif" font-size="12.8351" fill="var(--text-muted)">• HEAD is a pointer to a branch (usually). git commit advances the branch HEAD points at. git switch moves HEAD.</text>
</svg>

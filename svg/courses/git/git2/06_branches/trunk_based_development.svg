<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="686.1538" y="40" text-anchor="middle" font-size="40.1553" font-weight="bold">Trunk-Based Development</text>
  <line x1="132.3077" y1="312.9412" x2="1240" y2="312.9412" stroke="var(--ok-border)" stroke-width="2" />
  <text x="40" y="321.4706" font-size="20.0777">trunk</text>
  <rect x="211.23" y="299.556" width="26.7702" height="26.7702" rx="13.3851" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="395.846" y="299.556" width="26.7702" height="26.7702" rx="13.3851" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="580.461" y="299.556" width="26.7702" height="26.7702" rx="13.3851" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="765.076" y="299.556" width="26.7702" height="26.7702" rx="13.3851" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="949.692" y="299.556" width="26.7702" height="26.7702" rx="13.3851" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="1134.31" y="299.556" width="26.7702" height="26.7702" rx="13.3851" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <line x1="501.5385" y1="312.9412" x2="538.4615" y2="261.7647" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="538.4615" y1="261.7647" x2="575.3846" y2="261.7647" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="575.3846" y1="261.7647" x2="612.3077" y2="312.9412" stroke="var(--primary-border)" stroke-width="2" />
  <text x="556.9231" y="244.7059" text-anchor="middle" font-size="16.7314">short-lived</text>
  <rect x="224.6154" y="415.2941" width="923.0769" height="204.7059" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="686.1538" y="466.4706" text-anchor="middle" font-size="23.424" font-weight="bold">Key Principles:</text>
  <text x="261.5384" y="509.1176" font-size="20.0777">• Very short-lived branches (&lt; 1 day)</text>
  <text x="261.5384" y="543.2353" font-size="20.0777">• Frequent integration to trunk</text>
  <text x="261.5384" y="577.3529" font-size="20.0777">• Feature flags for incomplete work</text>
  <text x="723.0769" y="509.1176" font-size="20.0777">• High test coverage required</text>
  <text x="723.0769" y="543.2353" font-size="20.0777">• Continuous integration essential</text>
  <text x="723.0769" y="577.3529" font-size="20.0777">• Small, incremental changes</text>
</svg>
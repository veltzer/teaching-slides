<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="686.1538" y="40" text-anchor="middle" font-size="40.1553" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Trunk-Based Development</text>
  <line x1="132.3077" y1="312.9412" x2="1240" y2="312.9412" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="40" y="321.4706" font-size="20.0777" font-family="Arial, sans-serif" fill="var(--text)">trunk</text>
  <rect x="211.23" y="299.556" width="26.7702" height="26.7702" rx="13.3851" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="395.846" y="299.556" width="26.7702" height="26.7702" rx="13.3851" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="580.461" y="299.556" width="26.7702" height="26.7702" rx="13.3851" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="765.076" y="299.556" width="26.7702" height="26.7702" rx="13.3851" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="949.692" y="299.556" width="26.7702" height="26.7702" rx="13.3851" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="1134.31" y="299.556" width="26.7702" height="26.7702" rx="13.3851" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <line x1="501.5385" y1="312.9412" x2="538.4615" y2="261.7647" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="538.4615" y1="261.7647" x2="575.3846" y2="261.7647" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="575.3846" y1="261.7647" x2="612.3077" y2="312.9412" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="556.9231" y="244.7059" text-anchor="middle" font-size="16.7314" font-family="Arial, sans-serif" fill="var(--text)">short-lived</text>
  <rect x="224.6154" y="415.2941" width="923.0769" height="204.7059" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="686.1538" y="466.4706" text-anchor="middle" font-size="23.424" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Key Principles:</text>
  <text x="261.5384" y="509.1176" font-size="20.0777" font-family="Arial, sans-serif" fill="var(--ok-text)">• Very short-lived branches (&lt; 1 day)</text>
  <text x="261.5384" y="543.2353" font-size="20.0777" font-family="Arial, sans-serif" fill="var(--ok-text)">• Frequent integration to trunk</text>
  <text x="261.5384" y="577.3529" font-size="20.0777" font-family="Arial, sans-serif" fill="var(--ok-text)">• Feature flags for incomplete work</text>
  <text x="723.0769" y="509.1176" font-size="20.0777" font-family="Arial, sans-serif" fill="var(--ok-text)">• High test coverage required</text>
  <text x="723.0769" y="543.2353" font-size="20.0777" font-family="Arial, sans-serif" fill="var(--ok-text)">• Continuous integration essential</text>
  <text x="723.0769" y="577.3529" font-size="20.0777" font-family="Arial, sans-serif" fill="var(--ok-text)">• Small, incremental changes</text>
</svg>

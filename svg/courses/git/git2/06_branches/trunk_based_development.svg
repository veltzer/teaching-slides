<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Trunk-Based Development</text>
  <line x1="160" y1="360" x2="1120" y2="360" stroke="#4CAF50" stroke-width="6.4" />
  <text x="80" y="369" font-size="19.2">trunk</text>
  <circle cx="240" cy="360" r="12.8" fill="#4CAF50" />
  <circle cx="400" cy="360" r="12.8" fill="#4CAF50" />
  <circle cx="560" cy="360" r="12.8" fill="#4CAF50" />
  <circle cx="720" cy="360" r="12.8" fill="#4CAF50" />
  <circle cx="880" cy="360" r="12.8" fill="#4CAF50" />
  <circle cx="1040" cy="360" r="12.8" fill="#4CAF50" />
  <line x1="480" y1="360" x2="512" y2="306" stroke="#2196F3" stroke-width="3.2" />
  <line x1="512" y1="306" x2="544" y2="306" stroke="#2196F3" stroke-width="3.2" />
  <line x1="544" y1="306" x2="576" y2="360" stroke="#2196F3" stroke-width="3.2" />
  <text x="528" y="288" text-anchor="middle" font-size="16">short-lived</text>
  <rect x="240" y="468" width="800" height="216" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="640" y="522" text-anchor="middle" font-size="22.4" font-weight="bold">Key Principles:</text>
  <text x="272" y="567" font-size="19.2">• Very short-lived branches (&lt; 1 day)</text>
  <text x="272" y="603" font-size="19.2">• Frequent integration to trunk</text>
  <text x="272" y="639" font-size="19.2">• Feature flags for incomplete work</text>
  <text x="672" y="567" font-size="19.2">• High test coverage required</text>
  <text x="672" y="603" font-size="19.2">• Continuous integration essential</text>
  <text x="672" y="639" font-size="19.2">• Small, incremental changes</text>
</svg>
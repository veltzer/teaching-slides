<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="598.8304" y="67.3684" text-anchor="middle" font-size="35.9298" font-weight="bold">Trunk-Based Development</text>
  <line x1="149.7076" y1="336.8421" x2="1047.9532" y2="336.8421" stroke="var(--ok-border)" stroke-width="2" />
  <text x="74.8538" y="345.2632" font-size="17.9649">trunk</text>
  <circle cx="224.5614" cy="336.8421" r="11.9766" fill="var(--ok-fill)" />
  <circle cx="374.269" cy="336.8421" r="11.9766" fill="var(--ok-fill)" />
  <circle cx="523.9766" cy="336.8421" r="11.9766" fill="var(--ok-fill)" />
  <circle cx="673.6842" cy="336.8421" r="11.9766" fill="var(--ok-fill)" />
  <circle cx="823.3918" cy="336.8421" r="11.9766" fill="var(--ok-fill)" />
  <circle cx="973.0994" cy="336.8421" r="11.9766" fill="var(--ok-fill)" />
  <line x1="449.1228" y1="336.8421" x2="479.0643" y2="286.3158" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="479.0643" y1="286.3158" x2="509.0058" y2="286.3158" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="509.0058" y1="286.3158" x2="538.9474" y2="336.8421" stroke="var(--primary-border)" stroke-width="2" />
  <text x="494.0351" y="269.4737" text-anchor="middle" font-size="14.9708">short-lived</text>
  <rect x="224.5614" y="437.8947" width="748.538" height="202.1053" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="488.4211" text-anchor="middle" font-size="20.9591" font-weight="bold">Key Principles:</text>
  <text x="254.5029" y="530.5263" font-size="17.9649">• Very short-lived branches (&lt; 1 day)</text>
  <text x="254.5029" y="564.2105" font-size="17.9649">• Frequent integration to trunk</text>
  <text x="254.5029" y="597.8947" font-size="17.9649">• Feature flags for incomplete work</text>
  <text x="628.7719" y="530.5263" font-size="17.9649">• High test coverage required</text>
  <text x="628.7719" y="564.2105" font-size="17.9649">• Continuous integration essential</text>
  <text x="628.7719" y="597.8947" font-size="17.9649">• Small, incremental changes</text>
</svg>
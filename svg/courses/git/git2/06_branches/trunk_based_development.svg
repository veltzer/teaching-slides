    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="598.8304" y="67.3684" text-anchor="middle" font-size="35.9298" font-weight="bold">Trunk-Based Development</ns0:text>
  <ns0:line x1="149.7076" y1="336.8421" x2="1047.9532" y2="336.8421" stroke="#4CAF50" stroke-width="5.9883" />
  <ns0:text x="74.8538" y="345.2632" font-size="17.9649">trunk</ns0:text>
  <ns0:circle cx="224.5614" cy="336.8421" r="11.9766" fill="#4CAF50" />
  <ns0:circle cx="374.269" cy="336.8421" r="11.9766" fill="#4CAF50" />
  <ns0:circle cx="523.9766" cy="336.8421" r="11.9766" fill="#4CAF50" />
  <ns0:circle cx="673.6842" cy="336.8421" r="11.9766" fill="#4CAF50" />
  <ns0:circle cx="823.3918" cy="336.8421" r="11.9766" fill="#4CAF50" />
  <ns0:circle cx="973.0994" cy="336.8421" r="11.9766" fill="#4CAF50" />
  <ns0:line x1="449.1228" y1="336.8421" x2="479.0643" y2="286.3158" stroke="#2196F3" stroke-width="2.9942" />
  <ns0:line x1="479.0643" y1="286.3158" x2="509.0058" y2="286.3158" stroke="#2196F3" stroke-width="2.9942" />
  <ns0:line x1="509.0058" y1="286.3158" x2="538.9474" y2="336.8421" stroke="#2196F3" stroke-width="2.9942" />
  <ns0:text x="494.0351" y="269.4737" text-anchor="middle" font-size="14.9708">short-lived</ns0:text>
  <ns0:rect x="224.5614" y="437.8947" width="748.538" height="202.1053" fill="#E8F5E9" stroke="#388E3C" stroke-width="2.9942" rx="7.4854" />
  <ns0:text x="598.8304" y="488.4211" text-anchor="middle" font-size="20.9591" font-weight="bold">Key Principles:</ns0:text>
  <ns0:text x="254.5029" y="530.5263" font-size="17.9649">• Very short-lived branches (&lt; 1 day)</ns0:text>
  <ns0:text x="254.5029" y="564.2105" font-size="17.9649">• Frequent integration to trunk</ns0:text>
  <ns0:text x="254.5029" y="597.8947" font-size="17.9649">• Feature flags for incomplete work</ns0:text>
  <ns0:text x="628.7719" y="530.5263" font-size="17.9649">• High test coverage required</ns0:text>
  <ns0:text x="628.7719" y="564.2105" font-size="17.9649">• Continuous integration essential</ns0:text>
  <ns0:text x="628.7719" y="597.8947" font-size="17.9649">• Small, incremental changes</ns0:text>
</ns0:svg>
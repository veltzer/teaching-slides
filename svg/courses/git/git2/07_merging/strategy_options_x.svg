<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Merge Strategy Options</text>
  <rect x="80" y="144" width="560" height="216" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="360" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">-X ours</text>
  <text x="112" y="243" font-size="19.2">Auto-resolve conflicts using our version</text>
  <text x="112" y="279" font-size="17.6" font-family="monospace">git merge -X ours feature</text>
  <text x="112" y="324" font-size="17.6">⚠️ Not same as -s ours</text>
  <rect x="672" y="144" width="528" height="216" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="936" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">-X theirs</text>
  <text x="704" y="243" font-size="19.2">Auto-resolve conflicts using their version</text>
  <text x="704" y="279" font-size="17.6" font-family="monospace">git merge -X theirs feature</text>
  <text x="704" y="324" font-size="17.6">⚠️ No -s theirs strategy exists</text>
  <rect x="80" y="396" width="560" height="216" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="360" y="450" text-anchor="middle" font-size="25.6" font-weight="bold">-X patience</text>
  <text x="112" y="495" font-size="19.2">Better algorithm for similar lines</text>
  <text x="112" y="531" font-size="17.6" font-family="monospace">git merge -X patience feature</text>
  <text x="112" y="567" font-size="17.6">Good for refactored code</text>
  <rect x="672" y="396" width="528" height="216" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="936" y="450" text-anchor="middle" font-size="25.6" font-weight="bold">-X ignore-space-change</text>
  <text x="704" y="495" font-size="19.2">Ignore whitespace in conflicts</text>
  <text x="704" y="531" font-size="17.6" font-family="monospace">git merge -X ignore-space-change</text>
  <text x="704" y="567" font-size="17.6">Useful for different formatting</text>
</svg>
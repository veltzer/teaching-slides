<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Merging Combines Histories</text>
  <rect x="160" y="144" width="960" height="180" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="640" y="198" text-anchor="middle" font-size="25.6">A merge combines changes from different branches</text>
  <text x="640" y="243" text-anchor="middle" font-size="22.4">Creating a unified history with all changes</text>
  <text x="640" y="288" text-anchor="middle" font-size="22.4">Preserves the complete development timeline</text>
  <circle cx="320" cy="450" r="40" fill="#4CAF50" />
  <text x="320" y="459" text-anchor="middle" font-size="19.2" fill="white">Base</text>
  <circle cx="480" cy="378" r="40" fill="#2196F3" />
  <text x="480" y="387" text-anchor="middle" font-size="19.2" fill="white">A</text>
  <circle cx="640" cy="378" r="40" fill="#2196F3" />
  <text x="640" y="387" text-anchor="middle" font-size="19.2" fill="white">B</text>
  <circle cx="480" cy="522" r="40" fill="#FF9800" />
  <text x="480" y="531" text-anchor="middle" font-size="19.2" fill="white">C</text>
  <circle cx="640" cy="522" r="40" fill="#FF9800" />
  <text x="640" y="531" text-anchor="middle" font-size="19.2" fill="white">D</text>
  <circle cx="800" cy="450" r="48" fill="#9C27B0" />
  <text x="800" y="459" text-anchor="middle" font-size="22.4" fill="white">M</text>
  <line x1="360" y1="432" x2="440" y2="396" stroke="#333" stroke-width="3.2" />
  <line x1="360" y1="468" x2="440" y2="504" stroke="#333" stroke-width="3.2" />
  <line x1="520" y1="378" x2="600" y2="378" stroke="#333" stroke-width="3.2" />
  <line x1="520" y1="522" x2="600" y2="522" stroke="#333" stroke-width="3.2" />
  <line x1="680" y1="378" x2="752" y2="423" stroke="#333" stroke-width="3.2" />
  <line x1="680" y1="522" x2="752" y2="477" stroke="#333" stroke-width="3.2" />
  <text x="800" y="576" text-anchor="middle" font-size="19.2">Merge commit</text>
  <text x="800" y="612" text-anchor="middle" font-size="17.6">Has two parents</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="44.4942" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Merging Combines Histories</text>
  <rect x="40" y="117.3333" width="1200" height="193.3333" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="175.3333" text-anchor="middle" font-size="29.6628" font-family="Arial, sans-serif" fill="var(--primary-text)">A merge combines changes from different branches</text>
  <text x="640" y="223.6667" text-anchor="middle" font-size="25.9549" font-family="Arial, sans-serif" fill="var(--primary-text)">Creating a unified history with all changes</text>
  <text x="640" y="272" text-anchor="middle" font-size="25.9549" font-family="Arial, sans-serif" fill="var(--primary-text)">Preserves the complete development timeline</text>
  <rect x="193.652" y="399.652" width="92.6962" height="92.6962" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="240" y="455.6667" text-anchor="middle" font-size="22.2471" fill="var(--bg)" font-family="Arial, sans-serif">Base</text>
  <rect x="393.652" y="322.319" width="92.6962" height="92.6962" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="440" y="378.3333" text-anchor="middle" font-size="22.2471" fill="var(--bg)" font-family="Arial, sans-serif">A</text>
  <rect x="593.652" y="322.319" width="92.6962" height="92.6962" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="378.3333" text-anchor="middle" font-size="22.2471" fill="var(--bg)" font-family="Arial, sans-serif">B</text>
  <rect x="393.652" y="476.985" width="92.6962" height="92.6962" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="440" y="533" text-anchor="middle" font-size="22.2471" fill="var(--bg)" font-family="Arial, sans-serif">C</text>
  <rect x="593.652" y="476.985" width="92.6962" height="92.6962" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="640" y="533" text-anchor="middle" font-size="22.2471" fill="var(--bg)" font-family="Arial, sans-serif">D</text>
  <rect x="784.382" y="390.382" width="111.235" height="111.235" rx="14" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="840" y="455.6667" text-anchor="middle" font-size="25.9549" fill="var(--bg)" font-family="Arial, sans-serif">M</text>
  <line x1="290" y1="426.6667" x2="390" y2="388" stroke="var(--text)" stroke-width="2"/>
  <line x1="290" y1="465.3333" x2="390" y2="504" stroke="var(--text)" stroke-width="2"/>
  <line x1="490" y1="368.6667" x2="590" y2="368.6667" stroke="var(--text)" stroke-width="2"/>
  <line x1="490" y1="523.3333" x2="590" y2="523.3333" stroke="var(--text)" stroke-width="2"/>
  <line x1="690" y1="368.6667" x2="780" y2="417" stroke="var(--text)" stroke-width="2"/>
  <line x1="690" y1="523.3333" x2="780" y2="475" stroke="var(--text)" stroke-width="2"/>
  <text x="840" y="581.3333" text-anchor="middle" font-size="22.2471" font-family="Arial, sans-serif" fill="var(--text)">Merge commit</text>
  <text x="840" y="620" text-anchor="middle" font-size="20.3932" font-family="Arial, sans-serif" fill="var(--text)">Has two parents</text>
</svg>

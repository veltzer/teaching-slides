<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Why Conflicts Happen</ns0:text>
  <ns0:rect x="158.0247" y="142.2222" width="948.1481" height="106.6667" fill="#FFEBEE" stroke="#C62828" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="632.0988" y="204.4444" text-anchor="middle" font-size="25.284">Conflict = Both branches changed the same part differently</ns0:text>
  <ns0:rect x="79.0123" y="284.4444" width="347.6543" height="213.3333" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="252.8395" y="328.8889" text-anchor="middle" font-size="22.1235" font-weight="bold">Base Version</ns0:text>
  <ns0:text x="94.8148" y="373.3333" font-family="monospace" font-size="15.8025">function greet() {</ns0:text>
  <ns0:text x="94.8148" y="408.8889" font-family="monospace" font-size="15.8025">  return "Hello";</ns0:text>
  <ns0:text x="94.8148" y="444.4444" font-family="monospace" font-size="15.8025">}</ns0:text>
  <ns0:rect x="458.2716" y="284.4444" width="347.6543" height="213.3333" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="632.0988" y="328.8889" text-anchor="middle" font-size="22.1235" font-weight="bold">Our Version</ns0:text>
  <ns0:text x="474.0741" y="373.3333" font-family="monospace" font-size="15.8025">function greet(name) {</ns0:text>
  <ns0:text x="474.0741" y="408.8889" font-family="monospace" font-size="15.8025">  return `Hi ${name}`;</ns0:text>
  <ns0:text x="474.0741" y="444.4444" font-family="monospace" font-size="15.8025">}</ns0:text>
  <ns0:rect x="837.5309" y="284.4444" width="347.6543" height="213.3333" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="1011.358" y="328.8889" text-anchor="middle" font-size="22.1235" font-weight="bold">Their Version</ns0:text>
  <ns0:text x="853.3333" y="373.3333" font-family="monospace" font-size="15.8025">function greet() {</ns0:text>
  <ns0:text x="853.3333" y="408.8889" font-family="monospace" font-size="15.8025">  return "Bonjour";</ns0:text>
  <ns0:text x="853.3333" y="444.4444" font-family="monospace" font-size="15.8025">}</ns0:text>
  <ns0:rect x="395.0617" y="533.3333" width="474.0741" height="106.6667" fill="#F44336" rx="7.9012" />
  <ns0:text x="632.0988" y="595.5556" text-anchor="middle" font-size="25.284" fill="white">CONFLICT!</ns0:text>
  <ns0:text x="632.0988" y="631.1111" text-anchor="middle" font-size="18.963" fill="white">Git can't auto-merge</ns0:text>
</ns0:svg>
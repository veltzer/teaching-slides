  <ns0:text x="632.0988" y="328.8889" text-anchor="middle" font-size="22.1235" font-weight="bold">Our Version</ns0:text>
  <ns0:text x="474.0741" y="373.3333" font-family="monospace" font-size="15.8025">function greet(name) {</ns0:text>
  <ns0:text x="474.0741" y="408.8889" font-family="monospace" font-size="15.8025">  return `Hi ${name}`;</ns0:text>
  <ns0:text x="474.0741" y="444.4444" font-family="monospace" font-size="15.8025">}</ns0:text>
  <ns0:rect x="837.5309" y="284.4444" width="347.6543" height="213.3333" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="1011.358" y="328.8889" text-anchor="middle" font-size="22.1235" font-weight="bold">Their Version</ns0:text>
  <ns0:text x="853.3333" y="373.3333" font-family="monospace" font-size="15.8025">function greet() {</ns0:text>

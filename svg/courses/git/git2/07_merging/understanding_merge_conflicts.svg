<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Why Conflicts Happen</text>
  <rect x="160" y="144" width="960" height="108" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="640" y="207" text-anchor="middle" font-size="25.6">Conflict = Both branches changed the same part differently</text>
  <rect x="80" y="288" width="352" height="216" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="256" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">Base Version</text>
  <text x="96" y="378" font-family="monospace" font-size="16">function greet() {</text>
  <text x="96" y="414" font-family="monospace" font-size="16">  return "Hello";</text>
  <text x="96" y="450" font-family="monospace" font-size="16">}</text>
  <rect x="464" y="288" width="352" height="216" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="640" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">Our Version</text>
  <text x="480" y="378" font-family="monospace" font-size="16">function greet(name) {</text>
  <text x="480" y="414" font-family="monospace" font-size="16">  return `Hi ${name}`;</text>
  <text x="480" y="450" font-family="monospace" font-size="16">}</text>
  <rect x="848" y="288" width="352" height="216" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="1024" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">Their Version</text>
  <text x="864" y="378" font-family="monospace" font-size="16">function greet() {</text>
  <text x="864" y="414" font-family="monospace" font-size="16">  return "Bonjour";</text>
  <text x="864" y="450" font-family="monospace" font-size="16">}</text>
  <rect x="400" y="540" width="480" height="108" fill="#F44336" rx="8" />
  <text x="640" y="603" text-anchor="middle" font-size="25.6" fill="white">CONFLICT!</text>
  <text x="640" y="639" text-anchor="middle" font-size="19.2" fill="white">Git can't auto-merge</text>
</svg>
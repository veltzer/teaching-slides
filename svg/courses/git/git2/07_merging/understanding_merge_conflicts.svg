  <ns0:text x="632.0988" y="204.4444" text-anchor="middle" font-size="25.284">Conflict = Both branches changed the same part differently</ns0:text>
  <ns0:rect x="79.0123" y="284.4444" width="347.6543" height="213.3333" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />

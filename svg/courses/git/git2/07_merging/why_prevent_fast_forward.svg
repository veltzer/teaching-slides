<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="40.5238" font-weight="bold">--no-ff: Preserving Branch Context</text>
  <rect x="40" y="114.8387" width="600" height="280.6452" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="340" y="161.6129" text-anchor="middle" font-size="23.6389" font-weight="bold">With Fast-Forward</text>
  <rect x="100.387" y="220.479" width="50.6546" height="50.6546" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="203.244" y="220.479" width="50.6546" height="50.6546" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="306.101" y="220.479" width="50.6546" height="50.6546" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="408.958" y="220.479" width="50.6546" height="50.6546" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="511.816" y="220.479" width="50.6546" height="50.6546" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <line x1="151.4286" y1="245.8065" x2="202.8571" y2="245.8065" stroke="var(--text)" stroke-width="2" />
  <line x1="254.2857" y1="245.8065" x2="305.7143" y2="245.8065" stroke="var(--text)" stroke-width="2" />
  <line x1="357.1429" y1="245.8065" x2="408.5714" y2="245.8065" stroke="var(--text)" stroke-width="2" />
  <line x1="460" y1="245.8065" x2="511.4286" y2="245.8065" stroke="var(--text)" stroke-width="2" />
  <text x="340" y="320.6452" text-anchor="middle" font-size="20.2619">❌ Can't see where feature was</text>
  <text x="340" y="358.0645" text-anchor="middle" font-size="20.2619">❌ Loses branch information</text>
  <rect x="674.2857" y="114.8387" width="565.7143" height="280.6452" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.1429" y="161.6129" text-anchor="middle" font-size="23.6389" font-weight="bold">With --no-ff</text>
  <rect x="734.673" y="220.479" width="50.6546" height="50.6546" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="837.53" y="220.479" width="50.6546" height="50.6546" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="888.958" y="164.35" width="50.6546" height="50.6546" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <rect x="991.816" y="164.35" width="50.6546" height="50.6546" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <rect x="1043.24" y="220.479" width="50.6546" height="50.6546" rx="14" fill="var(--info-fill)" filter="url(#shadow)"/>
  <text x="1068.5714" y="255.1613" text-anchor="middle" font-size="16.8849" fill="var(--bg)">M</text>
  <line x1="785.7143" y1="245.8065" x2="837.1429" y2="245.8065" stroke="var(--text)" stroke-width="2" />
  <line x1="888.5714" y1="217.7419" x2="888.5714" y2="217.7419" stroke="var(--text)" stroke-width="2" />
  <line x1="862.8571" y1="227.0968" x2="888.5714" y2="208.3871" stroke="var(--text)" stroke-width="2" />
  <line x1="940" y1="189.6774" x2="991.4286" y2="189.6774" stroke="var(--text)" stroke-width="2" />
  <line x1="1042.8571" y1="208.3871" x2="1042.8571" y2="227.0968" stroke="var(--text)" stroke-width="2" />
  <line x1="888.5714" y1="245.8065" x2="1042.8571" y2="245.8065" stroke="var(--text)" stroke-width="2" />
  <text x="957.1429" y="320.6452" text-anchor="middle" font-size="20.2619">✓ Feature branch visible</text>
  <text x="957.1429" y="358.0645" text-anchor="middle" font-size="20.2619">✓ Clear project history</text>
  <rect x="297.1429" y="432.9032" width="685.7143" height="187.0968" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="489.0323" text-anchor="middle" font-size="23.6389" font-weight="bold">Use --no-ff when:</text>
  <text x="331.4286" y="535.8065" font-size="20.2619">• Want to preserve feature branch context</text>
  <text x="331.4286" y="573.2258" font-size="20.2619">• Following GitFlow or similar workflow</text>
</svg>
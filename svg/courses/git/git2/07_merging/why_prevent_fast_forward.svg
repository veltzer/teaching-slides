<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">--no-ff: Preserving Branch Context</text>
  <rect x="80" y="144" width="560" height="270" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="360" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">With Fast-Forward</text>
  <circle cx="160" cy="270" r="24" fill="var(--ok-fill)" />
  <circle cx="256" cy="270" r="24" fill="var(--ok-fill)" />
  <circle cx="352" cy="270" r="24" fill="var(--ok-fill)" />
  <circle cx="448" cy="270" r="24" fill="var(--ok-fill)" />
  <circle cx="544" cy="270" r="24" fill="var(--ok-fill)" />
  <line x1="184" y1="270" x2="232" y2="270" stroke="var(--text)" stroke-width="2" />
  <line x1="280" y1="270" x2="328" y2="270" stroke="var(--text)" stroke-width="2" />
  <line x1="376" y1="270" x2="424" y2="270" stroke="var(--text)" stroke-width="2" />
  <line x1="472" y1="270" x2="520" y2="270" stroke="var(--text)" stroke-width="2" />
  <text x="360" y="342" text-anchor="middle" font-size="19.2">❌ Can't see where feature was</text>
  <text x="360" y="378" text-anchor="middle" font-size="19.2">❌ Loses branch information</text>
  <rect x="672" y="144" width="528" height="270" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="936" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">With --no-ff</text>
  <circle cx="752" cy="270" r="24" fill="var(--ok-fill)" />
  <circle cx="848" cy="270" r="24" fill="var(--ok-fill)" />
  <circle cx="896" cy="216" r="24" fill="var(--primary-fill)" />
  <circle cx="992" cy="216" r="24" fill="var(--primary-fill)" />
  <circle cx="1040" cy="270" r="24" fill="var(--info-fill)" />
  <text x="1040" y="279" text-anchor="middle" font-size="16" fill="var(--bg)">M</text>
  <line x1="776" y1="270" x2="824" y2="270" stroke="var(--text)" stroke-width="2" />
  <line x1="872" y1="243" x2="872" y2="243" stroke="var(--text)" stroke-width="2" />
  <line x1="848" y1="252" x2="872" y2="234" stroke="var(--text)" stroke-width="2" />
  <line x1="920" y1="216" x2="968" y2="216" stroke="var(--text)" stroke-width="2" />
  <line x1="1016" y1="234" x2="1016" y2="252" stroke="var(--text)" stroke-width="2" />
  <line x1="872" y1="270" x2="1016" y2="270" stroke="var(--text)" stroke-width="2" />
  <text x="936" y="342" text-anchor="middle" font-size="19.2">✓ Feature branch visible</text>
  <text x="936" y="378" text-anchor="middle" font-size="19.2">✓ Clear project history</text>
  <rect x="320" y="450" width="640" height="180" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="640" y="504" text-anchor="middle" font-size="22.4" font-weight="bold">Use --no-ff when:</text>
  <text x="352" y="549" font-size="19.2">• Want to preserve feature branch context</text>
  <text x="352" y="585" font-size="19.2">• Following GitFlow or similar workflow</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">--no-ff: Preserving Branch Context</text>
  <rect x="80" y="144" width="560" height="270" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="360" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">With Fast-Forward</text>
  <circle cx="160" cy="270" r="24" fill="#4CAF50" />
  <circle cx="256" cy="270" r="24" fill="#4CAF50" />
  <circle cx="352" cy="270" r="24" fill="#4CAF50" />
  <circle cx="448" cy="270" r="24" fill="#4CAF50" />
  <circle cx="544" cy="270" r="24" fill="#4CAF50" />
  <line x1="184" y1="270" x2="232" y2="270" stroke="#333" stroke-width="3.2" />
  <line x1="280" y1="270" x2="328" y2="270" stroke="#333" stroke-width="3.2" />
  <line x1="376" y1="270" x2="424" y2="270" stroke="#333" stroke-width="3.2" />
  <line x1="472" y1="270" x2="520" y2="270" stroke="#333" stroke-width="3.2" />
  <text x="360" y="342" text-anchor="middle" font-size="19.2">❌ Can't see where feature was</text>
  <text x="360" y="378" text-anchor="middle" font-size="19.2">❌ Loses branch information</text>
  <rect x="672" y="144" width="528" height="270" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="936" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">With --no-ff</text>
  <circle cx="752" cy="270" r="24" fill="#4CAF50" />
  <circle cx="848" cy="270" r="24" fill="#4CAF50" />
  <circle cx="896" cy="216" r="24" fill="#2196F3" />
  <circle cx="992" cy="216" r="24" fill="#2196F3" />
  <circle cx="1040" cy="270" r="24" fill="#9C27B0" />
  <text x="1040" y="279" text-anchor="middle" font-size="16" fill="white">M</text>
  <line x1="776" y1="270" x2="824" y2="270" stroke="#333" stroke-width="3.2" />
  <line x1="872" y1="243" x2="872" y2="243" stroke="#333" stroke-width="3.2" />
  <line x1="848" y1="252" x2="872" y2="234" stroke="#333" stroke-width="3.2" />
  <line x1="920" y1="216" x2="968" y2="216" stroke="#333" stroke-width="3.2" />
  <line x1="1016" y1="234" x2="1016" y2="252" stroke="#333" stroke-width="3.2" />
  <line x1="872" y1="270" x2="1016" y2="270" stroke="#333" stroke-width="3.2" />
  <text x="936" y="342" text-anchor="middle" font-size="19.2">✓ Feature branch visible</text>
  <text x="936" y="378" text-anchor="middle" font-size="19.2">✓ Clear project history</text>
  <rect x="320" y="450" width="640" height="180" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="504" text-anchor="middle" font-size="22.4" font-weight="bold">Use --no-ff when:</text>
  <text x="352" y="549" font-size="19.2">• Want to preserve feature branch context</text>
  <text x="352" y="585" font-size="19.2">• Following GitFlow or similar workflow</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="676.3638" y="40" text-anchor="middle" font-size="40.4494" font-weight="bold">Conflict Resolution Workflow</text>
  <rect x="40" y="110.3033" width="272.7273" height="105.4546" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.3635" y="171.8185" text-anchor="middle" font-size="23.5954" fill="var(--bg)">1. Merge Attempt</text>
  <text x="176.3635" y="250.9094" text-anchor="middle" font-size="19.2292">CONFLICT!</text>
  <rect x="349.0907" y="110.3033" width="272.7273" height="105.4546" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.4543" y="171.8185" text-anchor="middle" font-size="23.5954" fill="var(--bg)">2. Identify Files</text>
  <text x="485.4543" y="250.9094" text-anchor="middle" font-size="19.2292" font-family="monospace">git status</text>
  <rect x="658.1818" y="110.3033" width="272.7273" height="105.4546" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.5454" y="171.8185" text-anchor="middle" font-size="23.5954" fill="var(--bg)">3. Open &amp; Edit</text>
  <text x="794.5454" y="250.9094" text-anchor="middle" font-size="19.2292">Remove markers</text>
  <rect x="967.2727" y="110.3033" width="272.7273" height="105.4546" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1103.6365" y="171.8185" text-anchor="middle" font-size="23.5954" fill="var(--bg)">4. Stage Files</text>
  <text x="1103.6365" y="250.9094" text-anchor="middle" font-size="19.2292" font-family="monospace">git add</text>
  <path d="M 312.7271 163.0303 L 349.0907 163.0303" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)" />
  <path d="M 621.8182 163.0303 L 658.1818 163.0303" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)" />
  <path d="M 930.9093 163.0303 L 967.2727 163.0303" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)" />
  <rect x="494.5453" y="286.0608" width="363.6364" height="105.4546" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="676.3638" y="347.576" text-anchor="middle" font-size="23.5954" fill="var(--bg)">5. Complete Merge</text>
  <text x="676.3638" y="382.7275" text-anchor="middle" font-size="19.2292" font-family="monospace" fill="var(--bg)">git commit</text>
  <path d="M 1103.6365 215.7579 L 858.1818 286.0608" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)" />
  <rect x="312.7271" y="444.2425" width="727.2731" height="175.7575" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="676.3638" y="496.9698" text-anchor="middle" font-size="23.5954" font-weight="bold">Alternative: Abort Merge</text>
  <text x="349.0907" y="540.9091" font-size="20.2247" font-family="monospace">git merge --abort</text>
  <text x="349.0907" y="576.0607" font-size="19.2292">Returns to state before merge attempt</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
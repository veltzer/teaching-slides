<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Conflict Resolution Workflow</text>
  <rect x="80" y="144" width="240" height="108" fill="#F44336" rx="8" />
  <text x="200" y="207" text-anchor="middle" font-size="22.4" fill="white">1. Merge Attempt</text>
  <text x="200" y="288" text-anchor="middle" font-size="17.6">CONFLICT!</text>
  <rect x="352" y="144" width="240" height="108" fill="#FF9800" rx="8" />
  <text x="472" y="207" text-anchor="middle" font-size="22.4" fill="white">2. Identify Files</text>
  <text x="472" y="288" text-anchor="middle" font-size="16" font-family="monospace">git status</text>
  <rect x="624" y="144" width="240" height="108" fill="#FFC107" rx="8" />
  <text x="744" y="207" text-anchor="middle" font-size="22.4" fill="white">3. Open &amp; Edit</text>
  <text x="744" y="288" text-anchor="middle" font-size="17.6">Remove markers</text>
  <rect x="896" y="144" width="240" height="108" fill="#4CAF50" rx="8" />
  <text x="1016" y="207" text-anchor="middle" font-size="22.4" fill="white">4. Stage Files</text>
  <text x="1016" y="288" text-anchor="middle" font-size="16" font-family="monospace">git add</text>
  <path d="M 320 198 L 352 198" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <path d="M 592 198 L 624 198" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <path d="M 864 198 L 896 198" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <rect x="480" y="324" width="320" height="108" fill="#2196F3" rx="8" />
  <text x="640" y="387" text-anchor="middle" font-size="22.4" fill="white">5. Complete Merge</text>
  <text x="640" y="423" text-anchor="middle" font-size="16" font-family="monospace" fill="white">git commit</text>
  <path d="M 1016 252 L 800 324" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <rect x="320" y="486" width="640" height="180" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="540" text-anchor="middle" font-size="22.4" font-weight="bold">Alternative: Abort Merge</text>
  <text x="352" y="585" font-size="19.2" font-family="monospace">git merge --abort</text>
  <text x="352" y="621" font-size="17.6">Returns to state before merge attempt</text>
  <defs>
    <marker id="arrow2" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
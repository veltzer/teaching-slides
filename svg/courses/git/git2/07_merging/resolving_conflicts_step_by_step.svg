<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="434.0291" y="52.0624" text-anchor="middle" font-size="21.0354" font-weight="bold">Conflict Resolution Workflow</text>
  <rect x="127.2639" y="91.5038" width="131.4708" height="59.1619" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="1.3016" />
  <text x="192.9992" y="126.0149" text-anchor="middle" font-size="12.2706" fill="var(--bg)">1. Merge Attempt</text>
  <text x="192.9992" y="170.3863" text-anchor="middle" font-size="10">CONFLICT!</text>
  <rect x="276.264" y="91.5038" width="131.4708" height="59.1619" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="1.3016" />
  <text x="341.9994" y="126.0149" text-anchor="middle" font-size="12.2706" fill="var(--bg)">2. Identify Files</text>
  <text x="341.9994" y="170.3863" text-anchor="middle" font-size="10" font-family="monospace">git status</text>
  <rect x="425.2643" y="91.5038" width="131.4708" height="59.1619" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="1.3016" />
  <text x="490.9997" y="126.0149" text-anchor="middle" font-size="12.2706" fill="var(--bg)">3. Open &amp; Edit</text>
  <text x="490.9997" y="170.3863" text-anchor="middle" font-size="10">Remove markers</text>
  <rect x="574.2645" y="91.5038" width="131.4708" height="59.1619" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="1.3016" />
  <text x="640" y="126.0149" text-anchor="middle" font-size="12.2706" fill="var(--bg)">4. Stage Files</text>
  <text x="640" y="170.3863" text-anchor="middle" font-size="10" font-family="monospace">git add</text>
  <path d="M 258.7346 121.0846 L 276.264 121.0846" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)" />
  <path d="M 407.7349 121.0846 L 425.2643 121.0846" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)" />
  <path d="M 556.7352 121.0846 L 574.2645 121.0846" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)" />
  <rect x="346.3818" y="190.1069" width="175.2944" height="59.1619" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="1.3016" />
  <text x="434.0291" y="224.618" text-anchor="middle" font-size="12.2706" fill="var(--bg)">5. Complete Merge</text>
  <text x="434.0291" y="244.3386" text-anchor="middle" font-size="10" font-family="monospace" fill="var(--bg)">git commit</text>
  <path d="M 640 150.6657 L 521.6762 190.1069" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)" />
  <rect x="258.7346" y="278.8496" width="350.5889" height="98.6031" fill="var(--surface)" stroke="var(--border)" stroke-width="0.6508" rx="6" />
  <text x="434.0291" y="308.4306" text-anchor="middle" font-size="12.2706" font-weight="bold">Alternative: Abort Merge</text>
  <text x="276.264" y="333.0813" font-size="10.5177" font-family="monospace">git merge --abort</text>
  <text x="276.264" y="352.802" font-size="10">Returns to state before merge attempt</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
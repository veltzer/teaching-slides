<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="676.3638" y="40" text-anchor="middle" font-size="40.4494" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Conflict Resolution Workflow</text>
  <rect x="40" y="110.3033" width="272.7273" height="105.4546" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.3635" y="171.8185" text-anchor="middle" font-size="23.5954" fill="var(--bg)" font-family="Arial, sans-serif">1. Merge Attempt</text>
  <text x="176.3635" y="250.9094" text-anchor="middle" font-size="19.2292" font-family="Arial, sans-serif" fill="var(--text)">CONFLICT!</text>
  <rect x="349.0907" y="110.3033" width="272.7273" height="105.4546" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.4543" y="171.8185" text-anchor="middle" font-size="23.5954" fill="var(--bg)" font-family="Arial, sans-serif">2. Identify Files</text>
  <text x="485.4543" y="250.9094" text-anchor="middle" font-size="19.2292" font-family="Courier New, monospace" fill="var(--text)">git status</text>
  <rect x="658.1818" y="110.3033" width="272.7273" height="105.4546" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.5454" y="171.8185" text-anchor="middle" font-size="23.5954" fill="var(--bg)" font-family="Arial, sans-serif">3. Open &amp; Edit</text>
  <text x="794.5454" y="250.9094" text-anchor="middle" font-size="19.2292" font-family="Arial, sans-serif" fill="var(--text)">Remove markers</text>
  <rect x="967.2727" y="110.3033" width="272.7273" height="105.4546" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1103.6365" y="171.8185" text-anchor="middle" font-size="23.5954" fill="var(--bg)" font-family="Arial, sans-serif">4. Stage Files</text>
  <text x="1103.6365" y="250.9094" text-anchor="middle" font-size="19.2292" font-family="Courier New, monospace" fill="var(--text)">git add</text>
  <path d="M 312.7271 163.0303 L 349.0907 163.0303" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)"/>
  <path d="M 621.8182 163.0303 L 658.1818 163.0303" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)"/>
  <path d="M 930.9093 163.0303 L 967.2727 163.0303" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)"/>
  <rect x="494.5453" y="286.0608" width="363.6364" height="105.4546" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="676.3638" y="347.576" text-anchor="middle" font-size="23.5954" fill="var(--bg)" font-family="Arial, sans-serif">5. Complete Merge</text>
  <text x="676.3638" y="382.7275" text-anchor="middle" font-size="19.2292" fill="var(--bg)" font-family="Courier New, monospace">git commit</text>
  <path d="M 1103.6365 215.7579 L 858.1818 286.0608" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)"/>
  <rect x="312.7271" y="444.2425" width="727.2731" height="175.7575" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="676.3638" y="496.9698" text-anchor="middle" font-size="23.5954" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Alternative: Abort Merge</text>
  <text x="349.0907" y="540.9091" font-size="20.2247" font-family="Courier New, monospace" fill="var(--text)">git merge --abort</text>
  <text x="349.0907" y="576.0607" font-size="19.2292" font-family="Arial, sans-serif" fill="var(--text)">Returns to state before merge attempt</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

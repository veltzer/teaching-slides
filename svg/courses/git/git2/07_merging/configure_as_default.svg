  <rect x="1086.136426" y="166.813" width="47.113939" height="47.1141" rx="13.999976" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1192.886061" y="166.813" width="47.113939" height="47.1141" rx="13.999976" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="706.181913" y1="190.37037" x2="765.960978" y2="190.37037" stroke="var(--text)" stroke-width="2"/>

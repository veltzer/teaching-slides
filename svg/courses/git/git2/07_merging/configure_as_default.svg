<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="320" y="60" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)">git pull (merge)</text>
  <text x="960" y="60" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)">git pull --rebase</text>
  <circle cx="80" cy="200" r="22" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="180" cy="200" r="22" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="280" cy="200" r="22" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="380" cy="200" r="22" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="480" cy="200" r="22" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="102" y1="200" x2="158" y2="200" stroke="var(--text)" stroke-width="2"/>
  <line x1="202" y1="200" x2="258" y2="200" stroke="var(--text)" stroke-width="2"/>
  <line x1="302" y1="200" x2="358" y2="200" stroke="var(--text)" stroke-width="2"/>
  <line x1="402" y1="200" x2="458" y2="200" stroke="var(--text)" stroke-width="2"/>
  <circle cx="260" cy="360" r="22" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="360" cy="360" r="22" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="198" y1="214" x2="242" y2="346" stroke="var(--text)" stroke-width="2"/>
  <line x1="282" y1="360" x2="338" y2="360" stroke="var(--text)" stroke-width="2"/>
  <circle cx="560" cy="480" r="26" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="560" y="486" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--bg)">M</text>
  <line x1="502" y1="214" x2="544" y2="458" stroke="var(--text)" stroke-width="2"/>
  <line x1="382" y1="374" x2="542" y2="466" stroke="var(--text)" stroke-width="2"/>
  <text x="320" y="560" text-anchor="middle" font-size="18" fill="var(--text-muted)">Extra merge commit preserves history</text>
  <circle cx="660" cy="200" r="22" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="760" cy="200" r="22" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="860" cy="200" r="22" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="960" cy="200" r="22" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="1060" cy="200" r="22" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="1160" cy="200" r="22" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="682" y1="200" x2="738" y2="200" stroke="var(--text)" stroke-width="2"/>
  <line x1="782" y1="200" x2="838" y2="200" stroke="var(--text)" stroke-width="2"/>
  <line x1="882" y1="200" x2="938" y2="200" stroke="var(--text)" stroke-width="2"/>
  <line x1="982" y1="200" x2="1038" y2="200" stroke="var(--text)" stroke-width="2"/>
  <line x1="1082" y1="200" x2="1138" y2="200" stroke="var(--text)" stroke-width="2"/>
  <text x="960" y="560" text-anchor="middle" font-size="18" fill="var(--text-muted)">Linear history, replayed commits</text>
  <line x1="640" y1="100" x2="640" y2="600" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 4"/>
</svg>

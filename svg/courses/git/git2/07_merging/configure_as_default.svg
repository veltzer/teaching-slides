  <rect x="232.147343" y="338.665" width="47.113939" height="47.1141" rx="13.999976" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="338.894979" y="338.665" width="47.113939" height="47.1141" rx="13.999976" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="189.520007" y1="205.407407" x2="236.489272" y2="347.185185" stroke="var(--text)" stroke-width="2"/>
  <line x1="279.188603" y1="362.222222" x2="338.967666" y2="362.222222" stroke="var(--text)" stroke-width="2"/>
  <rect x="548.109264" y="463.271" width="55.68011" height="55.6803" rx="13.999976" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="575.948953" y="497.555556" text-anchor="middle" font-size="14.990831" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">M</text>
  <line x1="514.034922" y1="205.407407" x2="558.869221" y2="467.481481" stroke="var(--text)" stroke-width="2"/>
  <line x1="385.93693" y1="377.259259" x2="556.734254" y2="476.074074" stroke="var(--text)" stroke-width="2"/>
  <text x="319.752967" y="577.037037" text-anchor="middle" font-size="19.273926" fill="var(--text-muted)" font-family="Arial, sans-serif">Extra merge commit preserves history</text>
  <rect x="659.139885" y="166.813" width="47.113939" height="47.1141" rx="13.999976" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.1066" font-weight="bold" fill="var(--text)">Three-Way Merge</text>

  <rect x="227.695" y="151.846" width="104.611" height="104.611" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="198.6792" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" font-weight="bold" fill="var(--primary-text)">Base</text>
  <text x="280" y="220.566" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5072" fill="var(--primary-text)">common ancestor</text>

  <rect x="587.695" y="64.2985" width="104.611" height="104.611" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="111.1321" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" font-weight="bold" fill="var(--ok-text)">Ours</text>
  <text x="640" y="133.0189" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5072" fill="var(--ok-text)">main branch</text>

  <rect x="587.695" y="239.393" width="104.611" height="104.611" rx="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="286.2264" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" font-weight="bold" fill="var(--warn-text)">Theirs</text>
  <text x="640" y="308.1132" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5072" fill="var(--warn-text)">feature branch</text>

  <rect x="947.695" y="151.846" width="104.611" height="104.611" rx="14" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="198.6792" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" font-weight="bold" fill="var(--info-text)">Merged</text>
  <text x="1000" y="220.566" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5072" fill="var(--info-text)">new commit</text>

  <line x1="330" y1="176.7925" x2="588" y2="133.0189" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="231.5094" x2="588" y2="275.283" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="692" y1="133.0189" x2="950" y2="176.7925" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="692" y1="275.283" x2="950" y2="231.5094" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="401.1321" width="1200" height="218.8679" rx="6.2766" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="439.434" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7377" font-weight="bold" fill="var(--text)">Per-line decision</text>
  <text x="640" y="477.7358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" fill="var(--text-muted)">• Line unchanged in both → keep the base line</text>
  <text x="640" y="510.566" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" fill="var(--text-muted)">• Changed in only one side → take that side's change</text>
  <text x="640" y="543.3962" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" fill="var(--text-muted)">• Changed on both sides to the same value → take the change</text>
  <text x="640" y="576.2264" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" fill="var(--text-muted)">• Changed on both sides differently → conflict, human resolves</text>
  <text x="640" y="609.0566" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--text-muted)">git uses the merge-base commit as "Base"</text>
</svg>

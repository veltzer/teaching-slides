<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="751.1111" y="80" text-anchor="middle" font-size="31.3725" font-weight="bold">Three-Way Merge Algorithm</text>
  <circle cx="751.1111" cy="241.7648" r="39.2157" fill="var(--ok-fill)" />
  <text x="751.1111" y="249.1177" text-anchor="middle" font-size="15.6863" fill="var(--bg)">Base</text>
  <text x="751.1111" y="197.6471" text-anchor="middle" font-size="15.6863">Common Ancestor</text>
  <circle cx="555.0327" cy="388.8235" r="39.2157" fill="var(--primary-fill)" />
  <text x="555.0327" y="396.1765" text-anchor="middle" font-size="15.6863" fill="var(--bg)">Ours</text>
  <text x="555.0327" y="447.6471" text-anchor="middle" font-size="15.6863">Current Branch</text>
  <circle cx="947.1896" cy="388.8235" r="39.2157" fill="var(--warn-fill)" />
  <text x="947.1896" y="396.1765" text-anchor="middle" font-size="15.6863" fill="var(--bg)">Theirs</text>
  <text x="947.1896" y="447.6471" text-anchor="middle" font-size="15.6863">Merging Branch</text>
  <path d="M 718.4314 271.1766 L 587.7124 359.4118" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <path d="M 783.7908 271.1766 L 914.5098 359.4118" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <rect x="620.3922" y="491.7647" width="261.4379" height="88.2353" fill="var(--info-fill)" rx="6.4338" stroke="var(--info-border)" stroke-width="2"/>
  <text x="751.1111" y="543.2353" text-anchor="middle" font-size="18.3007" fill="var(--bg)">Merge Result</text>
  <path d="M 594.2483 410.8824 L 685.7517 491.7647" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <path d="M 907.9739 410.8824 L 816.4706 491.7647" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <rect x="293.5948" y="168.2354" width="156.8627" height="294.1176" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.4338" />
  <text x="372.0261" y="205.0001" text-anchor="middle" font-size="15.6863" font-weight="bold">File: app.js</text>
  <text x="372.0261" y="241.7648" text-anchor="middle" font-size="13.0719">Base: line A</text>
  <text x="372.0261" y="271.1766" text-anchor="middle" font-size="13.0719">Ours: line B</text>
  <text x="372.0261" y="300.5883" text-anchor="middle" font-size="13.0719">Theirs: line A</text>
  <text x="372.0261" y="344.706" text-anchor="middle" font-size="14.3791" font-weight="bold">Result: line B</text>
  <text x="372.0261" y="374.1177" text-anchor="middle" font-size="13.0719">(Ours changed,</text>
  <text x="372.0261" y="396.1765" text-anchor="middle" font-size="13.0719">theirs didn't)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
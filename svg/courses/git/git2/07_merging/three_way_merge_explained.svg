<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Three-Way Merge Algorithm</text>
  <circle cx="640" cy="270" r="48" fill="#4CAF50" />
  <text x="640" y="279" text-anchor="middle" font-size="19.2" fill="white">Base</text>
  <text x="640" y="216" text-anchor="middle" font-size="19.2">Common Ancestor</text>
  <circle cx="400" cy="450" r="48" fill="#2196F3" />
  <text x="400" y="459" text-anchor="middle" font-size="19.2" fill="white">Ours</text>
  <text x="400" y="522" text-anchor="middle" font-size="19.2">Current Branch</text>
  <circle cx="880" cy="450" r="48" fill="#FF9800" />
  <text x="880" y="459" text-anchor="middle" font-size="19.2" fill="white">Theirs</text>
  <text x="880" y="522" text-anchor="middle" font-size="19.2">Merging Branch</text>
  <path d="M 600 306 L 440 414" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <path d="M 680 306 L 840 414" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <rect x="480" y="576" width="320" height="108" fill="#9C27B0" rx="8" />
  <text x="640" y="639" text-anchor="middle" font-size="22.4" fill="white">Merge Result</text>
  <path d="M 448 477 L 560 576" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <path d="M 832 477 L 720 576" stroke="#333" stroke-width="3.2" marker-end="url(#arrow1)" />
  <rect x="80" y="180" width="192" height="360" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="176" y="225" text-anchor="middle" font-size="19.2" font-weight="bold">File: app.js</text>
  <text x="176" y="270" text-anchor="middle" font-size="16">Base: line A</text>
  <text x="176" y="306" text-anchor="middle" font-size="16">Ours: line B</text>
  <text x="176" y="342" text-anchor="middle" font-size="16">Theirs: line A</text>
  <text x="176" y="396" text-anchor="middle" font-size="17.6" font-weight="bold">Result: line B</text>
  <text x="176" y="432" text-anchor="middle" font-size="16">(Ours changed,</text>
  <text x="176" y="459" text-anchor="middle" font-size="16">theirs didn't)</text>
  <defs>
    <marker id="arrow1" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">

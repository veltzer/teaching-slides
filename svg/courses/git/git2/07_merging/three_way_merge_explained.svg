<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="832.4525" y="40" text-anchor="middle" font-size="44.4695" font-weight="bold">Three-Way Merge Algorithm</text>
  <circle cx="832.4525" cy="227.6471" r="55.587" fill="var(--ok-fill)" />
  <text x="832.4525" y="236.1765" text-anchor="middle" font-size="22.2347" fill="var(--bg)">Base</text>
  <text x="832.4525" y="176.4706" text-anchor="middle" font-size="22.2347">Common Ancestor</text>
  <circle cx="492.8301" cy="398.2354" r="55.587" fill="var(--primary-fill)" />
  <text x="492.8301" y="406.7646" text-anchor="middle" font-size="22.2347" fill="var(--bg)">Ours</text>
  <text x="492.8301" y="466.4705" text-anchor="middle" font-size="22.2347">Current Branch</text>
  <circle cx="1172.0754" cy="398.2354" r="55.587" fill="var(--warn-fill)" />
  <text x="1172.0754" y="406.7646" text-anchor="middle" font-size="22.2347" fill="var(--bg)">Theirs</text>
  <text x="1172.0754" y="466.4705" text-anchor="middle" font-size="22.2347">Merging Branch</text>
  <path d="M 775.849 261.7648 L 549.4336 364.1176" stroke="var(--text)" stroke-width="1.1941" marker-end="url(#arrow)" />
  <path d="M 889.0562 261.7648 L 1115.4714 364.1176" stroke="var(--text)" stroke-width="1.1941" marker-end="url(#arrow)" />
  <rect x="606.0376" y="517.647" width="452.8301" height="102.353" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2" />
  <text x="832.4525" y="577.3529" text-anchor="middle" font-size="25.9407" fill="var(--bg)">Merge Result</text>
  <path d="M 560.7545 423.8235 L 719.245 517.647" stroke="var(--text)" stroke-width="1.1941" marker-end="url(#arrow)" />
  <path d="M 1104.1507 423.8235 L 945.6602 517.647" stroke="var(--text)" stroke-width="1.1941" marker-end="url(#arrow)" />
  <rect x="40" y="142.353" width="271.698" height="341.1766" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="175.8488" y="185" text-anchor="middle" font-size="22.2347" font-weight="bold">File: app.js</text>
  <text x="175.8488" y="227.6471" text-anchor="middle" font-size="20.2545">Base: line A</text>
  <text x="175.8488" y="261.7648" text-anchor="middle" font-size="20.2545">Ours: line B</text>
  <text x="175.8488" y="295.8824" text-anchor="middle" font-size="20.2545">Theirs: line A</text>
  <text x="175.8488" y="347.0589" text-anchor="middle" font-size="20.3819" font-weight="bold">Result: line B</text>
  <text x="175.8488" y="381.1764" text-anchor="middle" font-size="20.2545">(Ours changed,</text>
  <text x="175.8488" y="406.7646" text-anchor="middle" font-size="20.2545">theirs didn't)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;

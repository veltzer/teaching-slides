<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="525.6489" y="55.9863" text-anchor="middle" font-size="21.9554" font-weight="bold">Three-Way Merge Algorithm</text>
  <circle cx="525.6489" cy="169.1939" r="27.4443" fill="var(--ok-fill)" />
  <text x="525.6489" y="174.3397" text-anchor="middle" font-size="10.9777" fill="var(--bg)">Base</text>
  <text x="525.6489" y="138.3191" text-anchor="middle" font-size="10.9777">Common Ancestor</text>
  <circle cx="388.4277" cy="272.1099" r="27.4443" fill="var(--primary-fill)" />
  <text x="388.4277" y="277.2556" text-anchor="middle" font-size="10.9777" fill="var(--bg)">Ours</text>
  <text x="388.4277" y="313.2762" text-anchor="middle" font-size="10.9777">Current Branch</text>
  <circle cx="662.8703" cy="272.1099" r="27.4443" fill="var(--warn-fill)" />
  <text x="662.8703" y="277.2556" text-anchor="middle" font-size="10.9777" fill="var(--bg)">Theirs</text>
  <text x="662.8703" y="313.2762" text-anchor="middle" font-size="10.9777">Merging Branch</text>
  <path d="M 502.7788 189.7771 L 411.2978 251.5266" stroke="var(--text)" stroke-width="1.1941" marker-end="url(#arrow)" />
  <path d="M 548.5191 189.7771 L 640 251.5266" stroke="var(--text)" stroke-width="1.1941" marker-end="url(#arrow)" />
  <rect x="434.1681" y="344.151" width="182.9617" height="61.7496" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="1.3997" />
  <text x="525.6489" y="380.1716" text-anchor="middle" font-size="12.8074" fill="var(--bg)">Merge Result</text>
  <path d="M 415.8719 287.5472 L 479.9085 344.151" stroke="var(--text)" stroke-width="1.1941" marker-end="url(#arrow)" />
  <path d="M 635.426 287.5472 L 571.3894 344.151" stroke="var(--text)" stroke-width="1.1941" marker-end="url(#arrow)" />
  <rect x="205.466" y="117.7359" width="109.777" height="205.832" fill="var(--surface)" stroke="var(--border)" stroke-width="0.6998" rx="6" />
  <text x="260.3544" y="143.4649" text-anchor="middle" font-size="10.9777" font-weight="bold">File: app.js</text>
  <text x="260.3544" y="169.1939" text-anchor="middle" font-size="10">Base: line A</text>
  <text x="260.3544" y="189.7771" text-anchor="middle" font-size="10">Ours: line B</text>
  <text x="260.3544" y="210.3603" text-anchor="middle" font-size="10">Theirs: line A</text>
  <text x="260.3544" y="241.2351" text-anchor="middle" font-size="10.0629" font-weight="bold">Result: line B</text>
  <text x="260.3544" y="261.8182" text-anchor="middle" font-size="10">(Ours changed,</text>
  <text x="260.3544" y="277.2556" text-anchor="middle" font-size="10">theirs didn't)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;

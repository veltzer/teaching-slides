<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="602.3529" y="42.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7059" font-weight="bold" fill="var(--text)">Fast-Forward Merge</text>
  <rect x="37.6471" y="80" width="1129.4118" height="225.8824" rx="5.6471" fill="var(--surface)" stroke="var(--border)" stroke-width="0.9412" />
  <text x="602.3529" y="108.2353" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588" font-weight="bold" fill="var(--text)">Before: feature is ahead of main, main has not moved since fork</text>
  <circle cx="122.3529" cy="197.6471" r="26.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="122.3529" y="202.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--primary-text)">A</text>
  <circle cx="263.5294" cy="197.6471" r="26.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="263.5294" y="202.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--primary-text)">B</text>
  <circle cx="404.7059" cy="197.6471" r="26.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="404.7059" y="202.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--primary-text)">C</text>
  <circle cx="545.8824" cy="197.6471" r="26.3529" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.8824" />
  <text x="545.8824" y="202.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--warn-text)">D</text>
  <circle cx="687.0588" cy="197.6471" r="26.3529" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.8824" />
  <text x="687.0588" y="202.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--warn-text)">E</text>
  <line x1="148.7059" y1="197.6471" x2="237.1765" y2="197.6471" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <line x1="289.8824" y1="197.6471" x2="378.3529" y2="197.6471" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <line x1="431.0588" y1="197.6471" x2="519.5294" y2="197.6471" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <line x1="572.2353" y1="197.6471" x2="660.7059" y2="197.6471" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="357.6471" y="244.7059" width="94.1176" height="32.9412" rx="5.6471" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="404.7059" y="266.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--primary-text)">main</text>
  <line x1="404.7059" y1="244.7059" x2="404.7059" y2="225.8824" stroke="var(--primary-accent)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="640" y="141.1765" width="94.1176" height="32.9412" rx="5.6471" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.8824" />
  <text x="687.0588" y="162.8235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--warn-text)">feature</text>
  <line x1="687.0588" y1="174.1176" x2="687.0588" y2="169.4118" stroke="var(--warn-accent)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <text x="847.0588" y="192.9412" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2353" font-weight="bold" fill="var(--text)">git merge feature</text>
  <text x="847.0588" y="216.4706" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" fill="var(--text-muted)">(while on main)</text>
  <rect x="37.6471" y="324.7059" width="1129.4118" height="225.8824" rx="5.6471" fill="var(--surface)" stroke="var(--border)" stroke-width="0.9412" />
  <text x="602.3529" y="352.9412" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588" font-weight="bold" fill="var(--text)">After: main pointer simply moves forward — no new commit created</text>
  <circle cx="122.3529" cy="442.3529" r="26.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="122.3529" y="447.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--primary-text)">A</text>
  <circle cx="263.5294" cy="442.3529" r="26.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="263.5294" y="447.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--primary-text)">B</text>
  <circle cx="404.7059" cy="442.3529" r="26.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="404.7059" y="447.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--primary-text)">C</text>
  <circle cx="545.8824" cy="442.3529" r="26.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="545.8824" y="447.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--primary-text)">D</text>
  <circle cx="687.0588" cy="442.3529" r="26.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="687.0588" y="447.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--primary-text)">E</text>
  <line x1="148.7059" y1="442.3529" x2="237.1765" y2="442.3529" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <line x1="289.8824" y1="442.3529" x2="378.3529" y2="442.3529" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <line x1="431.0588" y1="442.3529" x2="519.5294" y2="442.3529" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <line x1="572.2353" y1="442.3529" x2="660.7059" y2="442.3529" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="592.9412" y="489.4118" width="94.1176" height="32.9412" rx="5.6471" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="640" y="511.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--primary-text)">main</text>
  <line x1="672.9412" y1="489.4118" x2="687.0588" y2="470.5882" stroke="var(--primary-accent)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="715.2941" y="489.4118" width="94.1176" height="32.9412" rx="5.6471" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.8824" />
  <text x="762.3529" y="511.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2941" font-weight="bold" fill="var(--warn-text)">feature</text>
  <line x1="734.1176" y1="489.4118" x2="701.1765" y2="470.5882" stroke="var(--warn-accent)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="37.6471" y="564.7059" width="1129.4118" height="75.2941" rx="5.6471" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.8824" />
  <text x="75.2941" y="591.0588" font-family="Arial, sans-serif" font-size="12.2353" fill="var(--ok-text)">Fast-forward is possible only when main is an ancestor of feature (main has no commits since the fork).</text>
  <text x="75.2941" y="611.7647" font-family="Arial, sans-serif" font-size="12.2353" fill="var(--ok-text)">History stays linear — no merge commit. Use git merge --no-ff feature to force a merge commit even when ff is possible.</text>
  <text x="75.2941" y="632.4706" font-family="Arial, sans-serif" font-size="12.2353" fill="var(--ok-text)">Opposite case: if main has commits since fork, a true 3-way merge is needed (or a rebase).</text>
</svg>
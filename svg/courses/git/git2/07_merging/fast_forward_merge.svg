  <rect x="224" y="144" width="96" height="45" fill="var(--ok-light)" rx="4.8" />
  <text x="272" y="176.4" text-anchor="middle" font-size="16" fill="var(--bg)">main</text>
  <rect x="512" y="144" width="96" height="45" fill="var(--primary-vivid)" rx="4.8" />
  <text x="560" y="176.4" text-anchor="middle" font-size="16" fill="var(--bg)">feature</text>
  <line x1="192" y1="234" x2="256" y2="234" stroke="var(--text-dark)" stroke-width="3.2" />
  <line x1="320" y1="234" x2="384" y2="234" stroke="var(--text-dark)" stroke-width="3.2" />
  <line x1="448" y1="234" x2="512" y2="234" stroke="var(--text-dark)" stroke-width="3.2" />
  <text x="320" y="360" text-anchor="middle" font-size="22.4" font-weight="bold">After Fast-Forward</text>
  <circle cx="160" cy="432" r="32" fill="var(--ok-light)" />
  <text x="160" y="441" text-anchor="middle" font-size="16" fill="var(--bg)">A</text>
  <circle cx="288" cy="432" r="32" fill="var(--ok-light)" />
  <text x="288" y="441" text-anchor="middle" font-size="16" fill="var(--bg)">B</text>
  <circle cx="416" cy="432" r="32" fill="var(--ok-light)" />
  <text x="416" y="441" text-anchor="middle" font-size="16" fill="var(--bg)">C</text>
  <circle cx="544" cy="432" r="32" fill="var(--ok-light)" />
  <text x="544" y="441" text-anchor="middle" font-size="16" fill="var(--bg)">D</text>
  <rect x="512" y="342" width="96" height="45" fill="var(--ok-light)" rx="4.8" />
  <text x="560" y="374.4" text-anchor="middle" font-size="16" fill="var(--bg)">main</text>
  <line x1="192" y1="432" x2="256" y2="432" stroke="var(--text-dark)" stroke-width="3.2" />
  <line x1="320" y1="432" x2="384" y2="432" stroke="var(--text-dark)" stroke-width="3.2" />
  <line x1="448" y1="432" x2="512" y2="432" stroke="var(--text-dark)" stroke-width="3.2" />
  <rect x="720" y="216" width="480" height="252" fill="var(--ok-pale)" stroke="var(--ok-mid)" stroke-width="3.2" rx="8" />
  <text x="960" y="270" text-anchor="middle" font-size="22.4" font-weight="bold">Fast-Forward Characteristics</text>
  <text x="752" y="315" font-size="19.2">✓ No merge commit created</text>
  <text x="752" y="351" font-size="19.2">✓ Linear history maintained</text>
  <text x="752" y="387" font-size="19.2">✓ Branch pointer just moves</text>
  <text x="752" y="423" font-size="19.2">✓ Possible when no divergence</text>

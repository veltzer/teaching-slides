    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Fast-Forward: The Simple Case</text>
  <text x="320" y="162" text-anchor="middle" font-size="22.4" font-weight="bold">Before Merge</text>
  <circle cx="160" cy="234" r="32" fill="var(--ok-light)" />
  <text x="160" y="243" text-anchor="middle" font-size="16" fill="var(--bg)">A</text>
  <circle cx="288" cy="234" r="32" fill="var(--ok-light)" />
  <text x="288" y="243" text-anchor="middle" font-size="16" fill="var(--bg)">B</text>
  <circle cx="416" cy="234" r="32" fill="var(--primary-vivid)" />
  <text x="416" y="243" text-anchor="middle" font-size="16" fill="var(--bg)">C</text>
  <circle cx="544" cy="234" r="32" fill="var(--primary-vivid)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0257" font-weight="bold" fill="var(--text)">Fast-Forward Merge</text>
  <rect x="40" y="76.5355" width="1200" height="219.2126" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="103.937" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2914" font-weight="bold" fill="var(--text)">Before: feature is ahead of main, main has not moved since fork</text>
  <circle cx="129.9999" cy="190.7087" r="26.7599" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="129.9999" y="195.2756" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--primary-text)">A</text>
  <circle cx="279.9999" cy="190.7087" r="26.7599" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="279.9999" y="195.2756" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--primary-text)">B</text>
  <circle cx="430" cy="190.7087" r="26.7599" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="430" y="195.2756" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--primary-text)">C</text>
  <circle cx="580" cy="190.7087" r="26.7599" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.8824" />
  <text x="580" y="195.2756" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--warn-text)">D</text>
  <circle cx="729.9999" cy="190.7087" r="26.7599" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.8824" />
  <text x="729.9999" y="195.2756" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--warn-text)">E</text>
  <line x1="158" y1="190.7087" x2="252" y2="190.7087" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <line x1="308" y1="190.7087" x2="401.9999" y2="190.7087" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <line x1="457.9999" y1="190.7087" x2="551.9999" y2="190.7087" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <line x1="607.9999" y1="190.7087" x2="702" y2="190.7087" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="380" y="236.378" width="99.9999" height="31.9685" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="430" y="257.3858" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--primary-text)">main</text>
  <line x1="430" y1="236.378" x2="430" y2="218.1103" stroke="var(--primary-accent)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="679.9999" y="135.9056" width="99.9999" height="31.9685" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="729.9999" y="156.9134" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--warn-text)">feature</text>
  <line x1="729.9999" y1="167.874" x2="729.9999" y2="163.3072" stroke="var(--warn-accent)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <text x="899.9999" y="186.1418" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4243" font-weight="bold" fill="var(--text)">git merge feature</text>
  <text x="899.9999" y="208.9764" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" fill="var(--text-muted)">(while on main)</text>
  <rect x="40" y="314.0158" width="1200" height="219.2126" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="341.4174" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2914" font-weight="bold" fill="var(--text)">After: main pointer simply moves forward — no new commit created</text>
  <circle cx="129.9999" cy="428.1889" r="26.7599" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="129.9999" y="432.7559" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--primary-text)">A</text>
  <circle cx="279.9999" cy="428.1889" r="26.7599" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="279.9999" y="432.7559" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--primary-text)">B</text>
  <circle cx="430" cy="428.1889" r="26.7599" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="430" y="432.7559" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--primary-text)">C</text>
  <circle cx="580" cy="428.1889" r="26.7599" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="580" y="432.7559" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--primary-text)">D</text>
  <circle cx="729.9999" cy="428.1889" r="26.7599" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="729.9999" y="432.7559" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--primary-text)">E</text>
  <line x1="158" y1="428.1889" x2="252" y2="428.1889" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <line x1="308" y1="428.1889" x2="401.9999" y2="428.1889" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <line x1="457.9999" y1="428.1889" x2="551.9999" y2="428.1889" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <line x1="607.9999" y1="428.1889" x2="702" y2="428.1889" stroke="var(--text-muted)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="630" y="473.8583" width="99.9999" height="31.9685" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="679.9999" y="494.8661" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--primary-text)">main</text>
  <line x1="715" y1="473.8583" x2="729.9999" y2="455.5905" stroke="var(--primary-accent)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="759.9999" y="473.8583" width="99.9999" height="31.9685" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="809.9999" y="494.8661" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4685" font-weight="bold" fill="var(--warn-text)">feature</text>
  <line x1="779.9999" y1="473.8583" x2="745" y2="455.5905" stroke="var(--warn-accent)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="40" y="546.9292" width="1200" height="73.0708" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="79.9999" y="572.5039" font-family="Arial, sans-serif" font-size="12.4243" fill="var(--ok-text)">Fast-forward is possible only when main is an ancestor of feature (main has no commits since the fork).</text>
  <text x="79.9999" y="592.5984" font-family="Arial, sans-serif" font-size="12.4243" fill="var(--ok-text)">History stays linear — no merge commit. Use git merge --no-ff feature to force a merge commit even when ff is possible.</text>
  <text x="79.9999" y="612.6929" font-family="Arial, sans-serif" font-size="12.4243" fill="var(--ok-text)">Opposite case: if main has commits since fork, a true 3-way merge is needed (or a rebase).</text>
</svg>
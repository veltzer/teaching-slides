<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Fast-Forward: The Simple Case</text>
  <text x="320" y="162" text-anchor="middle" font-size="22.4" font-weight="bold">Before Merge</text>
  <circle cx="160" cy="234" r="32" fill="var(--ok-fill)" />
  <text x="160" y="243" text-anchor="middle" font-size="16" fill="var(--bg)">A</text>
  <circle cx="288" cy="234" r="32" fill="var(--ok-fill)" />
  <text x="288" y="243" text-anchor="middle" font-size="16" fill="var(--bg)">B</text>
  <circle cx="416" cy="234" r="32" fill="var(--primary-fill)" />
  <text x="416" y="243" text-anchor="middle" font-size="16" fill="var(--bg)">C</text>
  <circle cx="544" cy="234" r="32" fill="var(--primary-fill)" />
  <text x="544" y="243" text-anchor="middle" font-size="16" fill="var(--bg)">D</text>
  <rect x="224" y="144" width="96" height="45" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="272" y="176.4" text-anchor="middle" font-size="16" fill="var(--bg)">main</text>
  <rect x="512" y="144" width="96" height="45" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="560" y="176.4" text-anchor="middle" font-size="16" fill="var(--bg)">feature</text>
  <line x1="192" y1="234" x2="256" y2="234" stroke="var(--text)" stroke-width="2" />
  <line x1="320" y1="234" x2="384" y2="234" stroke="var(--text)" stroke-width="2" />
  <line x1="448" y1="234" x2="512" y2="234" stroke="var(--text)" stroke-width="2" />
  <text x="320" y="360" text-anchor="middle" font-size="22.4" font-weight="bold">After Fast-Forward</text>
  <circle cx="160" cy="432" r="32" fill="var(--ok-fill)" />
  <text x="160" y="441" text-anchor="middle" font-size="16" fill="var(--bg)">A</text>
  <circle cx="288" cy="432" r="32" fill="var(--ok-fill)" />
  <text x="288" y="441" text-anchor="middle" font-size="16" fill="var(--bg)">B</text>
  <circle cx="416" cy="432" r="32" fill="var(--ok-fill)" />
  <text x="416" y="441" text-anchor="middle" font-size="16" fill="var(--bg)">C</text>
  <circle cx="544" cy="432" r="32" fill="var(--ok-fill)" />
  <text x="544" y="441" text-anchor="middle" font-size="16" fill="var(--bg)">D</text>
  <rect x="512" y="342" width="96" height="45" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="560" y="374.4" text-anchor="middle" font-size="16" fill="var(--bg)">main</text>
  <line x1="192" y1="432" x2="256" y2="432" stroke="var(--text)" stroke-width="2" />
  <line x1="320" y1="432" x2="384" y2="432" stroke="var(--text)" stroke-width="2" />
  <line x1="448" y1="432" x2="512" y2="432" stroke="var(--text)" stroke-width="2" />
  <rect x="720" y="216" width="480" height="252" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="960" y="270" text-anchor="middle" font-size="22.4" font-weight="bold">Fast-Forward Characteristics</text>
  <text x="752" y="315" font-size="19.2">✓ No merge commit created</text>
  <text x="752" y="351" font-size="19.2">✓ Linear history maintained</text>
  <text x="752" y="387" font-size="19.2">✓ Branch pointer just moves</text>
  <text x="752" y="423" font-size="19.2">✓ Possible when no divergence</text>
</svg>
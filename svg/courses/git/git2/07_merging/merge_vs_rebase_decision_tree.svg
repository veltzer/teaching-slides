<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="547.6924" y="40" width="230.7692" height="110.4762" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="663.077" y="109.0476" text-anchor="middle" fill="var(--bg)" font-size="30.0576" font-family="Arial, sans-serif">Start Merge?</text>
  <rect x="201.5384" y="260.9524" width="276.9231" height="110.4762" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="302.381" text-anchor="middle" fill="var(--bg)" font-size="25.048" font-family="Arial, sans-serif">Public Branch?</text>
  <text x="340" y="343.8096" text-anchor="middle" fill="var(--bg)" font-size="25.048" font-family="Arial, sans-serif">(Shared)</text>
  <rect x="847.6924" y="260.9524" width="276.9231" height="110.4762" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="986.1539" y="302.381" text-anchor="middle" fill="var(--bg)" font-size="25.048" font-family="Arial, sans-serif">Private Branch?</text>
  <text x="986.1539" y="343.8096" text-anchor="middle" fill="var(--bg)" font-size="25.048" font-family="Arial, sans-serif">(Local Only)</text>
  <rect x="40" y="537.1428" width="184.6154" height="82.8572" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="132.3077" y="592.381" text-anchor="middle" fill="var(--bg)" font-size="27.5528" font-family="Arial, sans-serif">USE MERGE</text>
  <rect x="1055.3846" y="537.1428" width="184.6154" height="82.8572" fill="url(#grad-info)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1147.6924" y="592.381" text-anchor="middle" fill="var(--bg)" font-size="27.5528" font-family="Arial, sans-serif">USE REBASE</text>
  <line x1="593.8463" y1="150.4762" x2="409.2308" y2="260.9524" stroke="var(--text)" stroke-width="2"/>
  <line x1="732.3076" y1="150.4762" x2="916.9231" y2="260.9524" stroke="var(--text)" stroke-width="2"/>
  <line x1="270.7693" y1="371.4286" x2="155.3846" y2="537.1428" stroke="var(--text)" stroke-width="2"/>
  <line x1="1055.3846" y1="371.4286" x2="1170.7693" y2="537.1428" stroke="var(--text)" stroke-width="2"/>
  <text x="501.5385" y="219.5238" font-size="25.048" font-family="Arial, sans-serif" fill="var(--text)">Yes</text>
  <text x="824.6154" y="219.5238" font-size="25.048" font-family="Arial, sans-serif" fill="var(--text)">No</text>
</svg>

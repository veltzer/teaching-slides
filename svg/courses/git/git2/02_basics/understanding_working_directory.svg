<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="40" text-anchor="middle" font-size="47.0403" font-weight="bold">File Status Lifecycle</text>
  <rect x="40" y="189.457" width="156.8" height="156.8" rx="14" fill="var(--text-faint)"/>
  <text x="118.4001" y="278.2145" text-anchor="middle" font-size="27.4399" fill="var(--bg)">Untracked</text>
  <rect x="457.28" y="189.457" width="156.8" height="156.8" rx="14" fill="var(--ok-fill)"/>
  <text x="535.6802" y="278.2145" text-anchor="middle" font-size="27.4399" fill="var(--bg)">Unmodified</text>
  <rect x="874.56" y="189.457" width="156.8" height="156.8" rx="14" fill="var(--warn-fill)"/>
  <text x="952.96" y="278.2145" text-anchor="middle" font-size="27.4399" fill="var(--bg)">Modified</text>
  <rect x="1083.2" y="396.6" width="156.8" height="156.8" rx="14" fill="var(--primary-fill)"/>
  <text x="1161.5999" y="485.3572" text-anchor="middle" font-size="27.4399" fill="var(--bg)">Staged</text>
  <path d="M 201.8562 267.8571 L 452.2239 267.8571" stroke="var(--text)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="327.0402" y="247.1429" text-anchor="middle" font-size="23.5201">Add file</text>
  <path d="M 619.1362 267.8571 L 869.5037 267.8571" stroke="var(--text)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="744.32" y="247.1429" text-anchor="middle" font-size="23.5201">Edit file</text>
  <path d="M 994.6878 330.0001 L 1119.8717 412.8571" stroke="var(--text)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="1057.2798" y="361.0711" text-anchor="middle" font-size="23.5201">Stage file</text>
  <path d="M 1078.1438 475 Q 744.32 620 535.6802 350.7142" stroke="var(--text)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="806.9119" y="599.2854" text-anchor="middle" font-size="23.5201">Commit</text>
  <path d="M 911.2319 205.7142 Q 744.32 60.7143 160.128 205.7142" stroke="var(--danger-border)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="535.6802" y="102.1429" text-anchor="middle" font-size="23.5201" fill="var(--danger-accent)">Remove file</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="40" text-anchor="middle" font-size="47.0273" font-weight="bold">File Status Lifecycle</text>
  <circle cx="118.6865" cy="267.8571" r="78.3786" fill="var(--text-faint)" />
  <text x="118.6865" y="278.2145" text-anchor="middle" font-size="27.4324" fill="var(--bg)">Untracked</text>
  <circle cx="535.7374" cy="267.8571" r="78.3786" fill="var(--ok-fill)" />
  <text x="535.7374" y="278.2145" text-anchor="middle" font-size="27.4324" fill="var(--bg)">Unmodified</text>
  <circle cx="952.7881" cy="267.8571" r="78.3786" fill="var(--warn-fill)" />
  <text x="952.7881" y="278.2145" text-anchor="middle" font-size="27.4324" fill="var(--bg)">Modified</text>
  <circle cx="1161.3135" cy="475" r="78.3786" fill="var(--primary-fill)" />
  <text x="1161.3135" y="485.3572" text-anchor="middle" font-size="27.4324" fill="var(--bg)">Staged</text>
  <path d="M 202.0967 267.8571 L 452.327 267.8571" stroke="var(--text)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="327.2121" y="247.1429" text-anchor="middle" font-size="23.5137">Add file</text>
  <path d="M 619.1476 267.8571 L 869.3777 267.8571" stroke="var(--text)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="744.2628" y="247.1429" text-anchor="middle" font-size="23.5137">Edit file</text>
  <path d="M 994.493 330.0001 L 1119.6083 412.8571" stroke="var(--text)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="1057.0507" y="361.0711" text-anchor="middle" font-size="23.5137">Stage file</text>
  <path d="M 1077.9033 475 Q 744.2628 620 535.7374 350.7142" stroke="var(--text)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="806.8202" y="599.2854" text-anchor="middle" font-size="23.5137">Commit</text>
  <path d="M 911.083 205.7142 Q 744.2628 60.7143 160.3914 205.7142" stroke="var(--danger-border)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="535.7374" y="102.1429" text-anchor="middle" font-size="23.5137" fill="var(--danger-accent)">Remove file</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
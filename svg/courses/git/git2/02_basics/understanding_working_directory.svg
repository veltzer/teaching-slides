<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">File Status Lifecycle</text>
  <circle cx="240" cy="270" r="64" fill="#9E9E9E" />
  <text x="240" y="279" text-anchor="middle" font-size="22.4" fill="white">Untracked</text>
  <circle cx="560" cy="270" r="64" fill="#4CAF50" />
  <text x="560" y="279" text-anchor="middle" font-size="22.4" fill="white">Unmodified</text>
  <circle cx="880" cy="270" r="64" fill="#FF9800" />
  <text x="880" y="279" text-anchor="middle" font-size="22.4" fill="white">Modified</text>
  <circle cx="1040" cy="450" r="64" fill="#2196F3" />
  <text x="1040" y="459" text-anchor="middle" font-size="22.4" fill="white">Staged</text>
  <path d="M 304 270 L 496 270" stroke="#333" stroke-width="3.2" marker-end="url(#arrow4)" />
  <text x="400" y="252" text-anchor="middle" font-size="19.2">Add file</text>
  <path d="M 624 270 L 816 270" stroke="#333" stroke-width="3.2" marker-end="url(#arrow4)" />
  <text x="720" y="252" text-anchor="middle" font-size="19.2">Edit file</text>
  <path d="M 912 324 L 1008 396" stroke="#333" stroke-width="3.2" marker-end="url(#arrow4)" />
  <text x="960" y="351" text-anchor="middle" font-size="19.2">Stage file</text>
  <path d="M 976 450 Q 720 576 560 342" stroke="#333" stroke-width="3.2" marker-end="url(#arrow4)" />
  <text x="768" y="558" text-anchor="middle" font-size="19.2">Commit</text>
  <path d="M 848 216 Q 720 90 272 216" stroke="#FF5722" stroke-width="3.2" marker-end="url(#arrow4)" />
  <text x="560" y="126" text-anchor="middle" font-size="19.2" fill="#FF5722">Remove file</text>
  <defs>
    <marker id="arrow4" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
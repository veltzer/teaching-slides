  <text x="609.6778" y="227.1888" text-anchor="middle" font-size="12.1289">Stage file</text>
  <path d="M 619.7852 289.7284 Q 458.067 369.3241 356.9931 221.5035" stroke="var(--text)" stroke-width="1.2937" marker-end="url(#arrow)" />
  <text x="488.3891" y="357.9532" text-anchor="middle" font-size="12.1289">Commit</text>
  <path d="M 538.9261 141.9078 Q 458.067 62.3121 175.0599 141.9078" stroke="var(--danger-border)" stroke-width="1.2937" marker-end="url(#arrow)" />
  <text x="356.9931" y="85.0537" text-anchor="middle" font-size="12.1289" fill="var(--danger-accent)">Remove file</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;

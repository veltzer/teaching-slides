<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="47.0403" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">File Status Lifecycle</text>
  <rect x="40" y="189.457" width="156.8" height="156.8" rx="14" fill="var(--text-faint)"/>
  <text x="118.4001" y="278.2145" text-anchor="middle" font-size="27.4399" fill="var(--bg)" font-family="Arial, sans-serif">Untracked</text>
  <rect x="457.28" y="189.457" width="156.8" height="156.8" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="535.6802" y="278.2145" text-anchor="middle" font-size="27.4399" fill="var(--bg)" font-family="Arial, sans-serif">Unmodified</text>
  <rect x="874.56" y="189.457" width="156.8" height="156.8" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="952.96" y="278.2145" text-anchor="middle" font-size="27.4399" fill="var(--bg)" font-family="Arial, sans-serif">Modified</text>
  <rect x="1083.2" y="396.6" width="156.8" height="156.8" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="1161.5999" y="485.3572" text-anchor="middle" font-size="27.4399" fill="var(--bg)" font-family="Arial, sans-serif">Staged</text>
  <path d="M 201.8562 267.8571 L 452.2239 267.8571" stroke="var(--text)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="327.0402" y="247.1429" text-anchor="middle" font-size="23.5201" font-family="Arial, sans-serif" fill="var(--text)">Add file</text>
  <path d="M 619.1362 267.8571 L 869.5037 267.8571" stroke="var(--text)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="744.32" y="247.1429" text-anchor="middle" font-size="23.5201" font-family="Arial, sans-serif" fill="var(--text)">Edit file</text>
  <path d="M 994.6878 330.0001 L 1119.8717 412.8571" stroke="var(--text)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="1057.2798" y="361.0711" text-anchor="middle" font-size="23.5201" font-family="Arial, sans-serif" fill="var(--text)">Stage file</text>
  <path d="M 1078.1438 475 Q 744.32 620 535.6802 350.7142" stroke="var(--text)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="806.9119" y="599.2854" text-anchor="middle" font-size="23.5201" font-family="Arial, sans-serif" fill="var(--text)">Commit</text>
  <path d="M 911.2319 205.7142 Q 744.32 60.7143 160.128 205.7142" stroke="var(--danger-border)" stroke-width="0.8238" marker-end="url(#arrow)" />
  <text x="535.6802" y="102.1429" text-anchor="middle" font-size="23.5201" fill="var(--danger-accent)" font-family="Arial, sans-serif">Remove file</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
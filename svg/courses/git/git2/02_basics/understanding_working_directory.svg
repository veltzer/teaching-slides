<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="80" text-anchor="middle" font-size="38.0953" font-weight="bold">File Status Lifecycle</text>
  <circle cx="243.1746" cy="276.4286" r="63.492" fill="var(--text-faint)" />
  <text x="243.1746" y="285.3572" text-anchor="middle" font-size="22.2222" fill="var(--bg)">Untracked</text>
  <circle cx="560.6349" cy="276.4286" r="63.492" fill="var(--ok-fill)" />
  <text x="560.6349" y="285.3572" text-anchor="middle" font-size="22.2222" fill="var(--bg)">Unmodified</text>
  <circle cx="878.0952" cy="276.4286" r="63.492" fill="var(--warn-fill)" />
  <text x="878.0952" y="285.3572" text-anchor="middle" font-size="22.2222" fill="var(--bg)">Modified</text>
  <circle cx="1036.8254" cy="455" r="63.492" fill="var(--primary-fill)" />
  <text x="1036.8254" y="463.9286" text-anchor="middle" font-size="22.2222" fill="var(--bg)">Staged</text>
  <path d="M 306.6666 276.4286 L 497.1427 276.4286" stroke="var(--text)" stroke-width="2.0317" marker-end="url(#arrow)" />
  <text x="401.9048" y="258.5714" text-anchor="middle" font-size="19.0477">Add file</text>
  <path d="M 624.127 276.4286 L 814.603 276.4286" stroke="var(--text)" stroke-width="2.0317" marker-end="url(#arrow)" />
  <text x="719.3651" y="258.5714" text-anchor="middle" font-size="19.0477">Edit file</text>
  <path d="M 909.8412 330 L 1005.0793 401.4286" stroke="var(--text)" stroke-width="2.0317" marker-end="url(#arrow)" />
  <text x="957.4602" y="356.7856" text-anchor="middle" font-size="19.0477">Stage file</text>
  <path d="M 973.3332 455 Q 719.3651 580 560.6349 347.8572" stroke="var(--text)" stroke-width="2.0317" marker-end="url(#arrow)" />
  <text x="766.984" y="562.1428" text-anchor="middle" font-size="19.0477">Commit</text>
  <path d="M 846.3491 222.8572 Q 719.3651 97.8572 274.9205 222.8572" stroke="var(--danger-border)" stroke-width="2.0317" marker-end="url(#arrow)" />
  <text x="560.6349" y="133.5714" text-anchor="middle" font-size="19.0477" fill="var(--danger-accent)">Remove file</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
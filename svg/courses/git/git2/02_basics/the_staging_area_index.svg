<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640" y="40" text-anchor="middle" font-size="41.8978" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Why Stage Files?</text>
  <rect x="40" y="120.0002" width="342.8571" height="499.9998" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4286" y="179.9999" text-anchor="middle" font-size="27.9319" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Working Directory</text>
  <rect x="74.2857" y="219.9999" width="274.2857" height="59.9999" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4286" y="260" text-anchor="middle" font-size="20.949" fill="var(--bg)" font-family="Arial, sans-serif">feature.js (500 lines)</text>
  <rect x="74.2857" y="300.0001" width="274.2857" height="59.9999" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4286" y="339.9998" text-anchor="middle" font-size="20.949" fill="var(--bg)" font-family="Arial, sans-serif">bugfix.js (50 lines)</text>
  <rect x="74.2857" y="379.9999" width="274.2857" height="59.9999" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4286" y="419.9999" text-anchor="middle" font-size="20.949" fill="var(--bg)" font-family="Arial, sans-serif">README.md (docs)</text>
  <rect x="74.2857" y="459.9999" width="274.2857" height="59.9999" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4286" y="499.9998" text-anchor="middle" font-size="20.949" fill="var(--bg)" font-family="Arial, sans-serif">debug.log (testing)</text>
  <rect x="468.5715" y="120.0002" width="342.8571" height="499.9998" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="179.9999" text-anchor="middle" font-size="27.9319" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Staging Area</text>
  <rect x="502.8571" y="300.0001" width="274.2857" height="59.9999" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="339.9998" text-anchor="middle" font-size="20.949" fill="var(--bg)" font-family="Arial, sans-serif">bugfix.js</text>
  <text x="640" y="459.9999" text-anchor="middle" font-size="24.4403" font-style="italic" font-family="Arial, sans-serif" fill="var(--ok-text)">Only commit</text>
  <text x="640" y="499.9998" text-anchor="middle" font-size="24.4403" font-style="italic" font-family="Arial, sans-serif" fill="var(--ok-text)">the bugfix!</text>
  <rect x="897.1429" y="120.0002" width="342.8571" height="499.9998" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5715" y="179.9999" text-anchor="middle" font-size="27.9319" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Repository</text>
  <rect x="931.4286" y="300.0001" width="274.2857" height="59.9999" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5715" y="339.9998" text-anchor="middle" font-size="20.949" fill="var(--bg)" font-family="Arial, sans-serif">Commit: Fix bug #1a1a2e</text>
  <path d="M 382.8573 329.9998 L 468.5715 329.9998" stroke="var(--text)" stroke-width="1.8896" marker-end="url(#arrow)"/>
  <text x="425.7143" y="309.9998" text-anchor="middle" font-size="19.2032" font-family="Arial, sans-serif" fill="var(--text)">git add</text>
  <path d="M 811.4286 329.9998 L 897.1429 329.9998" stroke="var(--text)" stroke-width="1.8896" marker-end="url(#arrow)"/>
  <text x="854.2858" y="309.9998" text-anchor="middle" font-size="19.2032" font-family="Arial, sans-serif" fill="var(--text)">git commit</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Why Stage Files?</text>
  <rect x="80" y="144" width="320" height="450" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="240" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Working Directory</text>
  <rect x="112" y="234" width="256" height="54" fill="#EF5350" />
  <text x="240" y="270" text-anchor="middle" font-size="19.2" fill="white">feature.js (500 lines)</text>
  <rect x="112" y="306" width="256" height="54" fill="#EF5350" />
  <text x="240" y="342" text-anchor="middle" font-size="19.2" fill="white">bugfix.js (50 lines)</text>
  <rect x="112" y="378" width="256" height="54" fill="#EF5350" />
  <text x="240" y="414" text-anchor="middle" font-size="19.2" fill="white">README.md (docs)</text>
  <rect x="112" y="450" width="256" height="54" fill="#EF5350" />
  <text x="240" y="486" text-anchor="middle" font-size="19.2" fill="white">debug.log (testing)</text>
  <rect x="480" y="144" width="320" height="450" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3.2" rx="8" />
  <text x="640" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Staging Area</text>
  <rect x="512" y="306" width="256" height="54" fill="#66BB6A" />
  <text x="640" y="342" text-anchor="middle" font-size="19.2" fill="white">bugfix.js</text>
  <text x="640" y="450" text-anchor="middle" font-size="22.4" font-style="italic">Only commit</text>
  <text x="640" y="486" text-anchor="middle" font-size="22.4" font-style="italic">the bugfix!</text>
  <rect x="880" y="144" width="320" height="450" fill="#E3F2FD" stroke="#1565C0" stroke-width="3.2" rx="8" />
  <text x="1040" y="198" text-anchor="middle" font-size="25.6" font-weight="bold">Repository</text>
  <rect x="912" y="306" width="256" height="54" fill="#42A5F5" />
  <text x="1040" y="342" text-anchor="middle" font-size="19.2" fill="white">Commit: Fix bug #123</text>
  <path d="M 400 333 L 480 333" stroke="#333" stroke-width="4.8" marker-end="url(#arrow5)" />
  <text x="440" y="315" text-anchor="middle" font-size="17.6">git add</text>
  <path d="M 800 333 L 880 333" stroke="#333" stroke-width="4.8" marker-end="url(#arrow5)" />
  <text x="840" y="315" text-anchor="middle" font-size="17.6">git commit</text>
  <defs>
    <marker id="arrow5" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="64" text-anchor="middle" font-size="38.4" font-weight="bold">Commit Message Format</text>
  <rect x="160" y="128" width="960" height="512" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <rect x="192" y="160" width="896" height="64" fill="#4CAF50" />
  <text x="640" y="200" text-anchor="middle" font-size="25.6" fill="white">Subject line (50 chars or less)</text>
  <line x1="192" y1="256" x2="1088" y2="256" stroke="#999" stroke-width="1.6" stroke-dasharray="8 8" />
  <text x="640" y="248" text-anchor="middle" font-size="19.2" fill="#666">Blank line</text>
  <rect x="192" y="288" width="896" height="192" fill="#E3F2FD" />
  <text x="208" y="328" font-size="22.4">Detailed explanation of what and why (72 char wrap)</text>
  <text x="208" y="368" font-size="22.4">- Explain the problem this commit solves</text>
  <text x="208" y="408" font-size="22.4">- Justify the approach taken</text>
  <text x="208" y="448" font-size="22.4">- Reference issues: Fixes #1a1a2e</text>
  <rect x="192" y="512" width="320" height="96" fill="#C8E6C9" stroke="#388E3C" stroke-width="3.2" rx="4.8" />
  <text x="352" y="552" text-anchor="middle" font-size="22.4" font-weight="bold">DO</text>
  <text x="352" y="584" text-anchor="middle" font-size="19.2">Imperative mood</text>
  <rect x="544" y="512" width="320" height="96" fill="#C8E6C9" stroke="#388E3C" stroke-width="3.2" rx="4.8" />
  <text x="704" y="552" text-anchor="middle" font-size="22.4" font-weight="bold">DO</text>
  <text x="704" y="584" text-anchor="middle" font-size="19.2">Explain why</text>
  <rect x="896" y="512" width="192" height="96" fill="#FFCDD2" stroke="#D32F2F" stroke-width="3.2" rx="4.8" />
  <text x="992" y="552" text-anchor="middle" font-size="22.4" font-weight="bold">DON'T</text>
  <text x="992" y="584" text-anchor="middle" font-size="19.2">Just say what</text>
</svg>
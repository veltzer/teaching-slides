<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="43.0813" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Commit Message Format</text>
  <rect x="40" y="104.4444" width="1200" height="515.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="80" y="136.6667" width="1120" height="64.4444" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="176.9444" text-anchor="middle" font-size="28.7209" fill="var(--bg)" font-family="Arial, sans-serif">Subject line (50 chars or less)</text>
  <line x1="80" y1="233.3333" x2="1200" y2="233.3333" stroke="var(--text-faint)" stroke-width="1.6" stroke-dasharray="8 8"/>
  <text x="640" y="225.2778" text-anchor="middle" font-size="21.5407" fill="var(--text-muted)" font-family="Arial, sans-serif">Blank line</text>
  <rect x="80" y="265.5556" width="1120" height="193.3333" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="305.8333" font-size="25.1308" font-family="Arial, sans-serif" fill="var(--primary-text)">Detailed explanation of what and why (72 char wrap)</text>
  <text x="100" y="346.1111" font-size="25.1308" font-family="Arial, sans-serif" fill="var(--primary-text)">- Explain the problem this commit solves</text>
  <text x="100" y="386.3889" font-size="25.1308" font-family="Arial, sans-serif" fill="var(--primary-text)">- Justify the approach taken</text>
  <text x="100" y="426.6667" font-size="25.1308" font-family="Arial, sans-serif" fill="var(--primary-text)">- Reference issues: Fixes #1a1a2e</text>
  <rect x="80" y="491.1111" width="400" height="96.6667" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="280" y="531.3889" text-anchor="middle" font-size="25.1308" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">DO</text>
  <text x="280" y="563.6111" text-anchor="middle" font-size="21.5407" font-family="Arial, sans-serif" fill="var(--ok-text)">Imperative mood</text>
  <rect x="520" y="491.1111" width="400" height="96.6667" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="720" y="531.3889" text-anchor="middle" font-size="25.1308" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">DO</text>
  <text x="720" y="563.6111" text-anchor="middle" font-size="21.5407" font-family="Arial, sans-serif" fill="var(--ok-text)">Explain why</text>
  <rect x="960" y="491.1111" width="240" height="96.6667" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1080" y="531.3889" text-anchor="middle" font-size="25.1308" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">DON'T</text>
  <text x="1080" y="563.6111" text-anchor="middle" font-size="21.5407" font-family="Arial, sans-serif" fill="var(--danger-text)">Just say what</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Three Types of Reset</text>
  <rect x="80" y="144" width="352" height="504" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="256" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">--soft</text>
  <text x="256" y="261" text-anchor="middle" font-size="19.2">Moves HEAD</text>
  <rect x="128" y="306" width="256" height="72" fill="#81C784" />
  <text x="256" y="351" text-anchor="middle" font-size="19.2" fill="white">✓ Keep changes staged</text>
  <rect x="128" y="396" width="256" height="72" fill="#81C784" />
  <text x="256" y="441" text-anchor="middle" font-size="19.2" fill="white">✓ Keep working dir</text>
  <text x="256" y="522" text-anchor="middle" font-size="19.2">Use: Redo commit message</text>
  <rect x="464" y="144" width="352" height="504" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="640" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">--mixed (default)</text>
  <text x="640" y="261" text-anchor="middle" font-size="19.2">Moves HEAD + Index</text>
  <rect x="512" y="306" width="256" height="72" fill="#EF6C00" />
  <text x="640" y="351" text-anchor="middle" font-size="19.2" fill="white">✗ Unstage changes</text>
  <rect x="512" y="396" width="256" height="72" fill="#81C784" />
  <text x="640" y="441" text-anchor="middle" font-size="19.2" fill="white">✓ Keep working dir</text>
  <text x="640" y="522" text-anchor="middle" font-size="19.2">Use: Unstage everything</text>
  <rect x="848" y="144" width="352" height="504" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="1024" y="207" text-anchor="middle" font-size="28.8" font-weight="bold">--hard</text>
  <text x="1024" y="261" text-anchor="middle" font-size="19.2">Moves everything</text>
  <rect x="896" y="306" width="256" height="72" fill="#D32F2F" />
  <text x="1024" y="351" text-anchor="middle" font-size="19.2" fill="white">✗ Discard staged</text>
  <rect x="896" y="396" width="256" height="72" fill="#D32F2F" />
  <text x="1024" y="441" text-anchor="middle" font-size="19.2" fill="white">✗ Discard working dir</text>
  <text x="1024" y="522" text-anchor="middle" font-size="19.2">⚠️ DESTRUCTIVE!</text>
</svg>
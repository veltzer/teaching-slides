<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Three Types of Reset</ns0:text>
  <ns0:rect x="79.0123" y="142.2222" width="347.6543" height="497.7778" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="252.8395" y="204.4444" text-anchor="middle" font-size="28.4444" font-weight="bold">--soft</ns0:text>
  <ns0:text x="252.8395" y="257.7778" text-anchor="middle" font-size="18.963">Moves HEAD</ns0:text>
  <ns0:rect x="126.4198" y="302.2222" width="252.8395" height="71.1111" fill="#81C784" />
  <ns0:text x="252.8395" y="346.6667" text-anchor="middle" font-size="18.963" fill="white">✓ Keep changes staged</ns0:text>
  <ns0:rect x="126.4198" y="391.1111" width="252.8395" height="71.1111" fill="#81C784" />
  <ns0:text x="252.8395" y="435.5556" text-anchor="middle" font-size="18.963" fill="white">✓ Keep working dir</ns0:text>
  <ns0:text x="252.8395" y="515.5556" text-anchor="middle" font-size="18.963">Use: Redo commit message</ns0:text>
  <ns0:rect x="458.2716" y="142.2222" width="347.6543" height="497.7778" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="632.0988" y="204.4444" text-anchor="middle" font-size="28.4444" font-weight="bold">--mixed (default)</ns0:text>
  <ns0:text x="632.0988" y="257.7778" text-anchor="middle" font-size="18.963">Moves HEAD + Index</ns0:text>
  <ns0:rect x="505.679" y="302.2222" width="252.8395" height="71.1111" fill="#EF6C00" />
  <ns0:text x="632.0988" y="346.6667" text-anchor="middle" font-size="18.963" fill="white">✗ Unstage changes</ns0:text>
  <ns0:rect x="505.679" y="391.1111" width="252.8395" height="71.1111" fill="#81C784" />
  <ns0:text x="632.0988" y="435.5556" text-anchor="middle" font-size="18.963" fill="white">✓ Keep working dir</ns0:text>
  <ns0:text x="632.0988" y="515.5556" text-anchor="middle" font-size="18.963">Use: Unstage everything</ns0:text>
  <ns0:rect x="837.5309" y="142.2222" width="347.6543" height="497.7778" fill="#FFEBEE" stroke="#C62828" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="1011.358" y="204.4444" text-anchor="middle" font-size="28.4444" font-weight="bold">--hard</ns0:text>
  <ns0:text x="1011.358" y="257.7778" text-anchor="middle" font-size="18.963">Moves everything</ns0:text>
  <ns0:rect x="884.9383" y="302.2222" width="252.8395" height="71.1111" fill="#D32F2F" />
  <ns0:text x="1011.358" y="346.6667" text-anchor="middle" font-size="18.963" fill="white">✗ Discard staged</ns0:text>
  <ns0:rect x="884.9383" y="391.1111" width="252.8395" height="71.1111" fill="#D32F2F" />
  <ns0:text x="1011.358" y="435.5556" text-anchor="middle" font-size="18.963" fill="white">✗ Discard working dir</ns0:text>
  <ns0:text x="1011.358" y="515.5556" text-anchor="middle" font-size="18.963">⚠️ DESTRUCTIVE!</ns0:text>
</ns0:svg>
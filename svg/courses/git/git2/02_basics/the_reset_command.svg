<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Three Types of Reset</text>
  <rect x="79.0123" y="142.2222" width="347.6543" height="497.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="252.8395" y="204.4444" text-anchor="middle" font-size="28.4444" font-weight="bold">--soft</text>
  <text x="252.8395" y="257.7778" text-anchor="middle" font-size="18.963">Moves HEAD</text>
  <rect x="126.4198" y="302.2222" width="252.8395" height="71.1111" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="252.8395" y="346.6667" text-anchor="middle" font-size="18.963" fill="var(--bg)">✓ Keep changes staged</text>
  <rect x="126.4198" y="391.1111" width="252.8395" height="71.1111" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="252.8395" y="435.5556" text-anchor="middle" font-size="18.963" fill="var(--bg)">✓ Keep working dir</text>
  <text x="252.8395" y="515.5556" text-anchor="middle" font-size="18.963">Use: Redo commit message</text>
  <rect x="458.2716" y="142.2222" width="347.6543" height="497.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="204.4444" text-anchor="middle" font-size="28.4444" font-weight="bold">--mixed (default)</text>
  <text x="632.0988" y="257.7778" text-anchor="middle" font-size="18.963">Moves HEAD + Index</text>
  <rect x="505.679" y="302.2222" width="252.8395" height="71.1111" fill="var(--warn-accent)" rx="6"/>
  <text x="632.0988" y="346.6667" text-anchor="middle" font-size="18.963" fill="var(--bg)">✗ Unstage changes</text>
  <rect x="505.679" y="391.1111" width="252.8395" height="71.1111" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="632.0988" y="435.5556" text-anchor="middle" font-size="18.963" fill="var(--bg)">✓ Keep working dir</text>
  <text x="632.0988" y="515.5556" text-anchor="middle" font-size="18.963">Use: Unstage everything</text>
  <rect x="837.5309" y="142.2222" width="347.6543" height="497.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1011.358" y="204.4444" text-anchor="middle" font-size="28.4444" font-weight="bold">--hard</text>
  <text x="1011.358" y="257.7778" text-anchor="middle" font-size="18.963">Moves everything</text>
  <rect x="884.9383" y="302.2222" width="252.8395" height="71.1111" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1011.358" y="346.6667" text-anchor="middle" font-size="18.963" fill="var(--bg)">✗ Discard staged</text>
  <rect x="884.9383" y="391.1111" width="252.8395" height="71.1111" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1011.358" y="435.5556" text-anchor="middle" font-size="18.963" fill="var(--bg)">✗ Discard working dir</text>
  <text x="1011.358" y="515.5556" text-anchor="middle" font-size="18.963">⚠️ DESTRUCTIVE!</text>
</svg>
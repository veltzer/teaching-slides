  <ns0:text x="393.8462" y="155.0769" text-anchor="middle" font-size="11.8154">Save work temporarily</ns0:text>
  <ns0:text x="393.8462" y="177.2308" text-anchor="middle" font-size="11.8154">Clean working directory</ns0:text>

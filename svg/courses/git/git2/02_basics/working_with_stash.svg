  <text x="150.104" y="159.6081" text-anchor="middle" font-size="11.7575">Uncommitted changes</text>
  <text x="150.104" y="181.6535" text-anchor="middle" font-size="11.7575">Boss: "Fix bug NOW!"</text>
  <rect x="297.0728" y="93.4722" width="195.9584" height="110.2266" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.2345" rx="5.9706" />
  <text x="395.0521" y="132.0515" text-anchor="middle" font-size="13.7171" font-weight="bold">git stash</text>
  <text x="395.0521" y="159.6081" text-anchor="middle" font-size="11.7575">Save work temporarily</text>
  <text x="395.0521" y="181.6535" text-anchor="middle" font-size="11.7575">Clean working directory</text>
  <rect x="542.0209" y="93.4722" width="195.9584" height="110.2266" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2345" rx="5.9706" />
  <text x="640" y="132.0515" text-anchor="middle" font-size="13.7171" font-weight="bold">Fix Bug</text>
  <text x="640" y="159.6081" text-anchor="middle" font-size="11.7575">Switch branch</text>
  <text x="640" y="181.6535" text-anchor="middle" font-size="11.7575">Commit fix</text>
  <rect x="297.0728" y="247.7894" width="195.9584" height="110.2266" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="1.2345" rx="5.9706" />
  <text x="395.0521" y="286.3687" text-anchor="middle" font-size="13.7171" font-weight="bold">git stash pop</text>
  <text x="395.0521" y="313.9253" text-anchor="middle" font-size="11.7575">Restore work</text>
  <text x="395.0521" y="335.9707" text-anchor="middle" font-size="11.7575">Continue feature</text>

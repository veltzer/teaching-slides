  <text x="395.0521" y="49.3815" text-anchor="middle" font-size="23.515" font-weight="bold">Stash Workflow</text>
  <rect x="52.1248" y="93.4722" width="195.9584" height="110.2266" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2345" rx="5.9706" />

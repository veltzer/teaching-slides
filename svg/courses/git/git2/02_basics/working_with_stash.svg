<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="393.8462" y="44.3077" text-anchor="middle" font-size="23.6308" font-weight="bold">Stash Workflow</text>
  <rect x="49.2308" y="88.6154" width="196.9231" height="110.7692" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="147.6923" y="127.3846" text-anchor="middle" font-size="13.7846" font-weight="bold">Working on Feature</text>
  <text x="147.6923" y="155.0769" text-anchor="middle" font-size="11.8154">Uncommitted changes</text>
  <text x="147.6923" y="177.2308" text-anchor="middle" font-size="11.8154">Boss: "Fix bug NOW!"</text>
  <rect x="295.3846" y="88.6154" width="196.9231" height="110.7692" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="393.8462" y="127.3846" text-anchor="middle" font-size="13.7846" font-weight="bold">git stash</text>
  <text x="393.8462" y="155.0769" text-anchor="middle" font-size="11.8154">Save work temporarily</text>
  <text x="393.8462" y="177.2308" text-anchor="middle" font-size="11.8154">Clean working directory</text>
  <rect x="541.5385" y="88.6154" width="196.9231" height="110.7692" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640" y="127.3846" text-anchor="middle" font-size="13.7846" font-weight="bold">Fix Bug</text>
  <text x="640" y="155.0769" text-anchor="middle" font-size="11.8154">Switch branch</text>
  <text x="640" y="177.2308" text-anchor="middle" font-size="11.8154">Commit fix</text>
  <rect x="295.3846" y="243.6923" width="196.9231" height="110.7692" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="393.8462" y="282.4615" text-anchor="middle" font-size="13.7846" font-weight="bold">git stash pop</text>
  <text x="393.8462" y="310.1538" text-anchor="middle" font-size="11.8154">Restore work</text>
  <text x="393.8462" y="332.3077" text-anchor="middle" font-size="11.8154">Continue feature</text>
  <path d="M 246.1538 144 L 295.3846 144" stroke="var(--text)" stroke-width="1.9692" marker-end="url(#arrow7)" />
  <path d="M 492.3077 144 L 541.5385 144" stroke="var(--text)" stroke-width="1.9692" marker-end="url(#arrow7)" />
  <path d="M 640 199.3846 Q 640 221.5385 492.3077 243.6923" stroke="var(--text)" stroke-width="1.9692" marker-end="url(#arrow7)" />
  <path d="M 295.3846 299.0769 Q 147.6923 299.0769 147.6923 199.3846" stroke="var(--text)" stroke-width="1.9692" marker-end="url(#arrow7)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="80" text-anchor="middle" font-size="38.0953" font-weight="bold">Stash Workflow</text>
  <rect x="84.4443" y="151.4286" width="317.4604" height="178.5714" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="9.6726" />
  <text x="243.1745" y="213.9286" text-anchor="middle" font-size="22.2222" font-weight="bold">Working on Feature</text>
  <text x="243.1745" y="258.5714" text-anchor="middle" font-size="19.0476">Uncommitted changes</text>
  <text x="243.1745" y="294.2858" text-anchor="middle" font-size="19.0476">Boss: "Fix bug NOW!"</text>
  <rect x="481.2697" y="151.4286" width="317.4604" height="178.5714" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.6726" />
  <text x="640" y="213.9286" text-anchor="middle" font-size="22.2222" font-weight="bold">git stash</text>
  <text x="640" y="258.5714" text-anchor="middle" font-size="19.0476">Save work temporarily</text>
  <text x="640" y="294.2858" text-anchor="middle" font-size="19.0476">Clean working directory</text>
  <rect x="878.0953" y="151.4286" width="317.4604" height="178.5714" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="9.6726" />
  <text x="1036.8254" y="213.9286" text-anchor="middle" font-size="22.2222" font-weight="bold">Fix Bug</text>
  <text x="1036.8254" y="258.5714" text-anchor="middle" font-size="19.0476">Switch branch</text>
  <text x="1036.8254" y="294.2858" text-anchor="middle" font-size="19.0476">Commit fix</text>
  <rect x="481.2697" y="401.4286" width="317.4604" height="178.5714" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="9.6726" />
  <text x="640" y="463.9286" text-anchor="middle" font-size="22.2222" font-weight="bold">git stash pop</text>
  <text x="640" y="508.5714" text-anchor="middle" font-size="19.0476">Restore work</text>
  <text x="640" y="544.2858" text-anchor="middle" font-size="19.0476">Continue feature</text>
  <path d="M 401.9046 240.7143 L 481.2697 240.7143" stroke="var(--text)" stroke-width="1.9692" marker-end="url(#arrow7)" />
  <path d="M 798.7301 240.7143 L 878.0953 240.7143" stroke="var(--text)" stroke-width="1.9692" marker-end="url(#arrow7)" />
  <path d="M 1036.8254 330 Q 1036.8254 365.7144 798.7301 401.4286" stroke="var(--text)" stroke-width="1.9692" marker-end="url(#arrow7)" />
  <path d="M 481.2697 490.7143 Q 243.1745 490.7143 243.1745 330" stroke="var(--text)" stroke-width="1.9692" marker-end="url(#arrow7)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
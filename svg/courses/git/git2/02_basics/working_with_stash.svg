<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Stash Workflow</text>
  <rect x="80" y="144" width="320" height="180" fill="#FFCDD2" stroke="#D32F2F" stroke-width="3.2" rx="8" />
  <text x="240" y="207" text-anchor="middle" font-size="22.4" font-weight="bold">Working on Feature</text>
  <text x="240" y="252" text-anchor="middle" font-size="19.2">Uncommitted changes</text>
  <text x="240" y="288" text-anchor="middle" font-size="19.2">Boss: "Fix bug NOW!"</text>
  <rect x="480" y="144" width="320" height="180" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="640" y="207" text-anchor="middle" font-size="22.4" font-weight="bold">git stash</text>
  <text x="640" y="252" text-anchor="middle" font-size="19.2">Save work temporarily</text>
  <text x="640" y="288" text-anchor="middle" font-size="19.2">Clean working directory</text>
  <rect x="880" y="144" width="320" height="180" fill="#C8E6C9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="1040" y="207" text-anchor="middle" font-size="22.4" font-weight="bold">Fix Bug</text>
  <text x="1040" y="252" text-anchor="middle" font-size="19.2">Switch branch</text>
  <text x="1040" y="288" text-anchor="middle" font-size="19.2">Commit fix</text>
  <rect x="480" y="396" width="320" height="180" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="3.2" rx="8" />
  <text x="640" y="459" text-anchor="middle" font-size="22.4" font-weight="bold">git stash pop</text>
  <text x="640" y="504" text-anchor="middle" font-size="19.2">Restore work</text>
  <text x="640" y="540" text-anchor="middle" font-size="19.2">Continue feature</text>
  <path d="M 400 234 L 480 234" stroke="#333" stroke-width="3.2" marker-end="url(#arrow7)" />
  <path d="M 800 234 L 880 234" stroke="#333" stroke-width="3.2" marker-end="url(#arrow7)" />
  <path d="M 1040 324 Q 1040 360 800 396" stroke="#333" stroke-width="3.2" marker-end="url(#arrow7)" />
  <path d="M 480 486 Q 240 486 240 324" stroke="#333" stroke-width="3.2" marker-end="url(#arrow7)" />
  <defs>
    <marker id="arrow7" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
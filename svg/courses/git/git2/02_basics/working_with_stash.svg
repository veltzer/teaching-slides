<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0002" y="40" text-anchor="middle" font-size="42.6394" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Stash Workflow</text>
  <rect x="40" y="122.8573" width="342.8571" height="207.1428" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4286" y="195.3572" text-anchor="middle" font-size="24.873" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Working on Feature</text>
  <text x="211.4286" y="247.1428" text-anchor="middle" font-size="21.3197" font-family="Arial, sans-serif" fill="var(--danger-text)">Uncommitted changes</text>
  <text x="211.4286" y="288.5716" text-anchor="middle" font-size="21.3197" font-family="Arial, sans-serif" fill="var(--danger-text)">Boss: "Fix bug NOW!"</text>
  <rect x="468.5714" y="122.8573" width="342.8571" height="207.1428" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0002" y="195.3572" text-anchor="middle" font-size="24.873" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">git stash</text>
  <text x="640.0002" y="247.1428" text-anchor="middle" font-size="21.3197" font-family="Arial, sans-serif" fill="var(--primary-text)">Save work temporarily</text>
  <text x="640.0002" y="288.5716" text-anchor="middle" font-size="21.3197" font-family="Arial, sans-serif" fill="var(--primary-text)">Clean working directory</text>
  <rect x="897.1429" y="122.8573" width="342.8571" height="207.1428" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5713" y="195.3572" text-anchor="middle" font-size="24.873" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Fix Bug</text>
  <text x="1068.5713" y="247.1428" text-anchor="middle" font-size="21.3197" font-family="Arial, sans-serif" fill="var(--ok-text)">Switch branch</text>
  <text x="1068.5713" y="288.5716" text-anchor="middle" font-size="21.3197" font-family="Arial, sans-serif" fill="var(--ok-text)">Commit fix</text>
  <rect x="468.5714" y="412.8572" width="342.8571" height="207.1428" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0002" y="485.3571" text-anchor="middle" font-size="24.873" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">git stash pop</text>
  <text x="640.0002" y="537.1426" text-anchor="middle" font-size="21.3197" font-family="Arial, sans-serif" fill="var(--info-text)">Restore work</text>
  <text x="640.0002" y="578.5713" text-anchor="middle" font-size="21.3197" font-family="Arial, sans-serif" fill="var(--info-text)">Continue feature</text>
  <path d="M 382.8571 226.4285 L 468.5714 226.4285" stroke="var(--text)" stroke-width="0.7503" marker-end="url(#arrow)" />
  <path d="M 811.4284 226.4285 L 897.1429 226.4285" stroke="var(--text)" stroke-width="0.7503" marker-end="url(#arrow)" />
  <path d="M 1068.5713 329.9999 Q 1068.5713 371.4286 811.4284 412.8572" stroke="var(--text)" stroke-width="0.7503" marker-end="url(#arrow)" />
  <path d="M 468.5714 516.4282 Q 211.4286 516.4282 211.4286 329.9999" stroke="var(--text)" stroke-width="0.7503" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Two Ways to Start</ns0:text>
  <ns0:rect x="79.0123" y="142.2222" width="474.0741" height="497.7778" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="316.0494" y="213.3333" text-anchor="middle" font-size="31.6049" font-weight="bold">Option 1: New Repo</ns0:text>
  <ns0:rect x="118.5185" y="266.6667" width="395.0617" height="71.1111" fill="#4CAF50" rx="4.7407" />
  <ns0:text x="316.0494" y="311.1111" text-anchor="middle" font-size="22.1235" fill="white">mkdir myproject</ns0:text>
  <ns0:rect x="118.5185" y="355.5556" width="395.0617" height="71.1111" fill="#4CAF50" rx="4.7407" />
  <ns0:text x="316.0494" y="400" text-anchor="middle" font-size="22.1235" fill="white">cd myproject</ns0:text>
  <ns0:rect x="118.5185" y="444.4444" width="395.0617" height="71.1111" fill="#4CAF50" rx="4.7407" />
  <ns0:text x="316.0494" y="488.8889" text-anchor="middle" font-size="22.1235" fill="white">git init</ns0:text>
  <ns0:text x="316.0494" y="568.8889" text-anchor="middle" font-size="22.1235" font-style="italic">Creates .git directory</ns0:text>
  <ns0:rect x="711.1111" y="142.2222" width="474.0741" height="497.7778" fill="#E3F2FD" stroke="#1565C0" stroke-width="3.1605" rx="7.9012" />
  <ns0:text x="948.1481" y="213.3333" text-anchor="middle" font-size="31.6049" font-weight="bold">Option 2: Clone</ns0:text>
  <ns0:rect x="750.6173" y="266.6667" width="395.0617" height="106.6667" fill="#2196F3" rx="4.7407" />
  <ns0:text x="948.1481" y="328.8889" text-anchor="middle" font-size="22.1235" fill="white">git clone [url]</ns0:text>
  <ns0:text x="948.1481" y="444.4444" text-anchor="middle" font-size="22.1235" font-style="italic">Downloads entire</ns0:text>
  <ns0:text x="948.1481" y="480" text-anchor="middle" font-size="22.1235" font-style="italic">repository with history</ns0:text>
</ns0:svg>
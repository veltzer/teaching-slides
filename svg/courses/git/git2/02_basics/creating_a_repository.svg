<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Two Ways to Start</text>
  <rect x="80" y="144" width="480" height="504" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3.2" rx="8" />
  <text x="320" y="216" text-anchor="middle" font-size="32" font-weight="bold">Option 1: New Repo</text>
  <rect x="120" y="270" width="400" height="72" fill="#4CAF50" rx="4.8" />
  <text x="320" y="315" text-anchor="middle" font-size="22.4" fill="white">mkdir myproject</text>
  <rect x="120" y="360" width="400" height="72" fill="#4CAF50" rx="4.8" />
  <text x="320" y="405" text-anchor="middle" font-size="22.4" fill="white">cd myproject</text>
  <rect x="120" y="450" width="400" height="72" fill="#4CAF50" rx="4.8" />
  <text x="320" y="495" text-anchor="middle" font-size="22.4" fill="white">git init</text>
  <text x="320" y="576" text-anchor="middle" font-size="22.4" font-style="italic">Creates .git directory</text>
  <rect x="720" y="144" width="480" height="504" fill="#E3F2FD" stroke="#1565C0" stroke-width="3.2" rx="8" />
  <text x="960" y="216" text-anchor="middle" font-size="32" font-weight="bold">Option 2: Clone</text>
  <rect x="760" y="270" width="400" height="108" fill="#2196F3" rx="4.8" />
  <text x="960" y="333" text-anchor="middle" font-size="22.4" fill="white">git clone [url]</text>
  <text x="960" y="450" text-anchor="middle" font-size="22.4" font-style="italic">Downloads entire</text>
  <text x="960" y="486" text-anchor="middle" font-size="22.4" font-style="italic">repository with history</text>
</svg>
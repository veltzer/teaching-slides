<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0001" y="40" text-anchor="middle" font-size="43.0813" font-weight="bold">Git References</text>
  <rect x="86.1483" y="276.148" width="107.703" height="107.703" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="139.9999" y="342.6875" text-anchor="middle" font-size="21.5407" fill="var(--bg)">C1</text>
  <rect x="286.148" y="276.148" width="107.703" height="107.703" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="340" y="342.6875" text-anchor="middle" font-size="21.5407" fill="var(--bg)">C2</text>
  <rect x="486.148" y="276.148" width="107.703" height="107.703" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="540" y="342.6875" text-anchor="middle" font-size="21.5407" fill="var(--bg)">C3</text>
  <rect x="686.148" y="276.148" width="107.703" height="107.703" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="740" y="342.6875" text-anchor="middle" font-size="21.5407" fill="var(--bg)">C4</text>
  <line x1="199.9999" y1="330.0001" x2="280" y2="330.0001" stroke="var(--text)" stroke-width="2" />
  <line x1="400" y1="330.0001" x2="480" y2="330.0001" stroke="var(--text)" stroke-width="2" />
  <line x1="600" y1="330.0001" x2="680" y2="330.0001" stroke="var(--text)" stroke-width="2" />
  <rect x="640.0001" y="148.75" width="200" height="54.375" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="185" text-anchor="middle" font-size="21.5407" fill="var(--bg)">HEAD</text>
  <line x1="740" y1="203.125" x2="740" y2="275.625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow6)" />
  <rect x="840.0001" y="221.25" width="200" height="54.375" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="257.5" text-anchor="middle" font-size="21.5407" fill="var(--bg)">main</text>
  <line x1="880" y1="275.625" x2="780" y2="302.8125" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow6)" />
  <text x="139.9999" y="438.75" text-anchor="middle" font-size="21.5407">HEAD~3</text>
  <text x="340" y="438.75" text-anchor="middle" font-size="21.5407">HEAD~2</text>
  <text x="540" y="438.75" text-anchor="middle" font-size="21.5407">HEAD~1</text>
  <text x="740" y="438.75" text-anchor="middle" font-size="21.5407">HEAD</text>
  <rect x="40" y="511.25" width="1200" height="108.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="574.6875" text-anchor="middle" font-size="25.1308">HEAD^ = parent commit, HEAD~n = n commits back</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
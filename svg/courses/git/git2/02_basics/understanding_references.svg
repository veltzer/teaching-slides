<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Git References</text>
  <circle cx="240" cy="360" r="48" fill="#4CAF50" />
  <text x="240" y="372.6" text-anchor="middle" font-size="19.2" fill="white">C1</text>
  <circle cx="400" cy="360" r="48" fill="#4CAF50" />
  <text x="400" y="372.6" text-anchor="middle" font-size="19.2" fill="white">C2</text>
  <circle cx="560" cy="360" r="48" fill="#4CAF50" />
  <text x="560" y="372.6" text-anchor="middle" font-size="19.2" fill="white">C3</text>
  <circle cx="720" cy="360" r="48" fill="#4CAF50" />
  <text x="720" y="372.6" text-anchor="middle" font-size="19.2" fill="white">C4</text>
  <line x1="288" y1="360" x2="352" y2="360" stroke="#333" stroke-width="3.2" />
  <line x1="448" y1="360" x2="512" y2="360" stroke="#333" stroke-width="3.2" />
  <line x1="608" y1="360" x2="672" y2="360" stroke="#333" stroke-width="3.2" />
  <rect x="640" y="180" width="160" height="54" fill="#2196F3" rx="4.8" />
  <text x="720" y="216" text-anchor="middle" font-size="19.2" fill="white">HEAD</text>
  <line x1="720" y1="234" x2="720" y2="306" stroke="#2196F3" stroke-width="3.2" marker-end="url(#arrow6)" />
  <rect x="800" y="252" width="160" height="54" fill="#FF9800" rx="4.8" />
  <text x="880" y="288" text-anchor="middle" font-size="19.2" fill="white">main</text>
  <line x1="832" y1="306" x2="752" y2="333" stroke="#FF9800" stroke-width="3.2" marker-end="url(#arrow6)" />
  <text x="240" y="468" text-anchor="middle" font-size="19.2">HEAD~3</text>
  <text x="400" y="468" text-anchor="middle" font-size="19.2">HEAD~2</text>
  <text x="560" y="468" text-anchor="middle" font-size="19.2">HEAD~1</text>
  <text x="720" y="468" text-anchor="middle" font-size="19.2">HEAD</text>
  <rect x="160" y="540" width="960" height="108" fill="#FFF9C4" stroke="#F57F17" stroke-width="3.2" rx="8" />
  <text x="640" y="603" text-anchor="middle" font-size="22.4">HEAD^ = parent commit, HEAD~n = n commits back</text>
  <defs>
    <marker id="arrow6" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
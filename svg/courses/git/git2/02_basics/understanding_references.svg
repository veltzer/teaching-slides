<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640.0001" y="40" text-anchor="middle" font-size="43.0813" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Git References</text>
  <rect x="86.1483" y="276.148" width="107.703" height="107.703" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="139.9999" y="342.6875" text-anchor="middle" font-size="21.5407" fill="var(--bg)" font-family="Arial, sans-serif">C1</text>
  <rect x="286.148" y="276.148" width="107.703" height="107.703" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="340" y="342.6875" text-anchor="middle" font-size="21.5407" fill="var(--bg)" font-family="Arial, sans-serif">C2</text>
  <rect x="486.148" y="276.148" width="107.703" height="107.703" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="540" y="342.6875" text-anchor="middle" font-size="21.5407" fill="var(--bg)" font-family="Arial, sans-serif">C3</text>
  <rect x="686.148" y="276.148" width="107.703" height="107.703" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="740" y="342.6875" text-anchor="middle" font-size="21.5407" fill="var(--bg)" font-family="Arial, sans-serif">C4</text>
  <line x1="199.9999" y1="330.0001" x2="280" y2="330.0001" stroke="var(--text)" stroke-width="2"/>
  <line x1="400" y1="330.0001" x2="480" y2="330.0001" stroke="var(--text)" stroke-width="2"/>
  <line x1="600" y1="330.0001" x2="680" y2="330.0001" stroke="var(--text)" stroke-width="2"/>
  <rect x="640.0001" y="148.75" width="200" height="54.375" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="185" text-anchor="middle" font-size="21.5407" fill="var(--bg)" font-family="Arial, sans-serif">HEAD</text>
  <line x1="740" y1="203.125" x2="740" y2="275.625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="840.0001" y="221.25" width="200" height="54.375" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="257.5" text-anchor="middle" font-size="21.5407" fill="var(--bg)" font-family="Arial, sans-serif">main</text>
  <line x1="880" y1="275.625" x2="780" y2="302.8125" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="139.9999" y="438.75" text-anchor="middle" font-size="21.5407" font-family="Arial, sans-serif" fill="var(--text)">HEAD~3</text>
  <text x="340" y="438.75" text-anchor="middle" font-size="21.5407" font-family="Arial, sans-serif" fill="var(--text)">HEAD~2</text>
  <text x="540" y="438.75" text-anchor="middle" font-size="21.5407" font-family="Arial, sans-serif" fill="var(--text)">HEAD~1</text>
  <text x="740" y="438.75" text-anchor="middle" font-size="21.5407" font-family="Arial, sans-serif" fill="var(--text)">HEAD</text>
  <rect x="40" y="511.25" width="1200" height="108.75" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="574.6875" text-anchor="middle" font-size="25.1308" font-family="Arial, sans-serif" fill="var(--warn-text)">HEAD^ = parent commit, HEAD~n = n commits back</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

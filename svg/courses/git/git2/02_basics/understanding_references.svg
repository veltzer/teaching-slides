<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="37.9259" font-weight="bold">Git References</text>
  <circle cx="237.037" cy="355.5556" r="47.4074" fill="var(--ok-fill)" />
  <text x="237.037" y="368" text-anchor="middle" font-size="18.963" fill="var(--bg)">C1</text>
  <circle cx="395.0617" cy="355.5556" r="47.4074" fill="var(--ok-fill)" />
  <text x="395.0617" y="368" text-anchor="middle" font-size="18.963" fill="var(--bg)">C2</text>
  <circle cx="553.0864" cy="355.5556" r="47.4074" fill="var(--ok-fill)" />
  <text x="553.0864" y="368" text-anchor="middle" font-size="18.963" fill="var(--bg)">C3</text>
  <circle cx="711.1111" cy="355.5556" r="47.4074" fill="var(--ok-fill)" />
  <text x="711.1111" y="368" text-anchor="middle" font-size="18.963" fill="var(--bg)">C4</text>
  <line x1="284.4444" y1="355.5556" x2="347.6543" y2="355.5556" stroke="var(--text)" stroke-width="2" />
  <line x1="442.4691" y1="355.5556" x2="505.679" y2="355.5556" stroke="var(--text)" stroke-width="2" />
  <line x1="600.4938" y1="355.5556" x2="663.7037" y2="355.5556" stroke="var(--text)" stroke-width="2" />
  <rect x="632.0988" y="177.7778" width="158.0247" height="53.3333" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="711.1111" y="213.3333" text-anchor="middle" font-size="18.963" fill="var(--bg)">HEAD</text>
  <line x1="711.1111" y1="231.1111" x2="711.1111" y2="302.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow6)" />
  <rect x="790.1235" y="248.8889" width="158.0247" height="53.3333" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="869.1358" y="284.4444" text-anchor="middle" font-size="18.963" fill="var(--bg)">main</text>
  <line x1="821.7284" y1="302.2222" x2="742.716" y2="328.8889" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow6)" />
  <text x="237.037" y="462.2222" text-anchor="middle" font-size="18.963">HEAD~3</text>
  <text x="395.0617" y="462.2222" text-anchor="middle" font-size="18.963">HEAD~2</text>
  <text x="553.0864" y="462.2222" text-anchor="middle" font-size="18.963">HEAD~1</text>
  <text x="711.1111" y="462.2222" text-anchor="middle" font-size="18.963">HEAD</text>
  <rect x="158.0247" y="533.3333" width="948.1481" height="106.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="595.5556" text-anchor="middle" font-size="22.1235">HEAD^ = parent commit, HEAD~n = n commits back</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
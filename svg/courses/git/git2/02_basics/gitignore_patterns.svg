<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="40.5238" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">.gitignore Patterns</text>
  <rect x="40" y="114.8387" width="291.4286" height="112.2581" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="185.7143" y="161.6129" text-anchor="middle" font-size="23.6389" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">*.log</text>
  <text x="185.7143" y="199.0323" text-anchor="middle" font-size="20.2619" font-family="Arial, sans-serif" fill="var(--primary-text)">All .log files</text>
  <rect x="365.7143" y="114.8387" width="291.4286" height="112.2581" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="511.4286" y="161.6129" text-anchor="middle" font-size="23.6389" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">build/</text>
  <text x="511.4286" y="199.0323" text-anchor="middle" font-size="20.2619" font-family="Arial, sans-serif" fill="var(--ok-text)">build directory</text>
  <rect x="691.4286" y="114.8387" width="291.4286" height="112.2581" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="837.1429" y="161.6129" text-anchor="middle" font-size="23.6389" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">!keep.log</text>
  <text x="837.1429" y="199.0323" text-anchor="middle" font-size="20.2619" font-family="Arial, sans-serif" fill="var(--warn-text)">Exception to rule</text>
  <rect x="1017.1429" y="114.8387" width="222.8571" height="112.2581" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1128.5714" y="161.6129" text-anchor="middle" font-size="23.6389" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">/TODO</text>
  <text x="1128.5714" y="199.0323" text-anchor="middle" font-size="20.2619" font-family="Arial, sans-serif" fill="var(--danger-text)">Root only</text>
  <rect x="40" y="264.5161" width="291.4286" height="112.2581" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="185.7143" y="311.2903" text-anchor="middle" font-size="23.6389" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">doc/*.txt</text>
  <text x="185.7143" y="348.7097" text-anchor="middle" font-size="20.2619" font-family="Arial, sans-serif" fill="var(--info-text)">Direct children</text>
  <rect x="365.7143" y="264.5161" width="291.4286" height="112.2581" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="511.4286" y="311.2903" text-anchor="middle" font-size="23.6389" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">doc/**/*.pdf</text>
  <text x="511.4286" y="348.7097" text-anchor="middle" font-size="20.2619" font-family="Arial, sans-serif" fill="var(--primary-text)">All descendants</text>
  <rect x="691.4286" y="264.5161" width="291.4286" height="112.2581" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="837.1429" y="311.2903" text-anchor="middle" font-size="23.6389" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">[Dd]ebug/</text>
  <text x="837.1429" y="348.7097" text-anchor="middle" font-size="20.2619" font-family="Arial, sans-serif" fill="var(--danger-text)">Debug or debug</text>
  <rect x="1017.1429" y="264.5161" width="222.8571" height="112.2581" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="1128.5714" y="311.2903" text-anchor="middle" font-size="23.6389" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">#comment</text>
  <text x="1128.5714" y="348.7097" text-anchor="middle" font-size="20.2619" font-family="Arial, sans-serif" fill="var(--text)">Comments</text>
  <rect x="297.1429" y="432.9032" width="685.7143" height="187.0968" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="489.0323" text-anchor="middle" font-size="23.6389" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Check what's ignored:</text>
  <text x="640" y="535.8065" text-anchor="middle" font-size="21.9504" font-family="Courier New, monospace" fill="var(--text)">git check-ignore -v filename</text>
  <text x="640" y="582.5806" text-anchor="middle" font-size="21.9504" font-family="Courier New, monospace" fill="var(--text)">git status --ignored</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">.gitignore Patterns</text>
  <rect x="80" y="144" width="272" height="108" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="216" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">*.log</text>
  <text x="216" y="225" text-anchor="middle" font-size="19.2">All .log files</text>
  <rect x="384" y="144" width="272" height="108" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="520" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">build/</text>
  <text x="520" y="225" text-anchor="middle" font-size="19.2">build directory</text>
  <rect x="688" y="144" width="272" height="108" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="824" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">!keep.log</text>
  <text x="824" y="225" text-anchor="middle" font-size="19.2">Exception to rule</text>
  <rect x="992" y="144" width="208" height="108" fill="#FFEBEE" stroke="#C62828" stroke-width="3.2" rx="8" />
  <text x="1096" y="189" text-anchor="middle" font-size="22.4" font-weight="bold">/TODO</text>
  <text x="1096" y="225" text-anchor="middle" font-size="19.2">Root only</text>
  <rect x="80" y="288" width="272" height="108" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="3.2" rx="8" />
  <text x="216" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">doc/*.txt</text>
  <text x="216" y="369" text-anchor="middle" font-size="19.2">Direct children</text>
  <rect x="384" y="288" width="272" height="108" fill="#E0F2F1" stroke="#00796B" stroke-width="3.2" rx="8" />
  <text x="520" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">doc/**/*.pdf</text>
  <text x="520" y="369" text-anchor="middle" font-size="19.2">All descendants</text>
  <rect x="688" y="288" width="272" height="108" fill="#FCE4EC" stroke="#C2185B" stroke-width="3.2" rx="8" />
  <text x="824" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">[Dd]ebug/</text>
  <text x="824" y="369" text-anchor="middle" font-size="19.2">Debug or debug</text>
  <rect x="992" y="288" width="208" height="108" fill="#EFEBE9" stroke="#5D4037" stroke-width="3.2" rx="8" />
  <text x="1096" y="333" text-anchor="middle" font-size="22.4" font-weight="bold">#comment</text>
  <text x="1096" y="369" text-anchor="middle" font-size="19.2">Comments</text>
  <rect x="320" y="450" width="640" height="180" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="504" text-anchor="middle" font-size="22.4" font-weight="bold">Check what's ignored:</text>
  <text x="640" y="549" text-anchor="middle" font-size="20.8" font-family="monospace">git check-ignore -v filename</text>
  <text x="640" y="594" text-anchor="middle" font-size="20.8" font-family="monospace">git status --ignored</text>
</svg>
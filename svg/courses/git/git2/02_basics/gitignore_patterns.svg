<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="40.5238" font-weight="bold">.gitignore Patterns</text>
  <rect x="40" y="114.8387" width="291.4286" height="112.2581" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="185.7143" y="161.6129" text-anchor="middle" font-size="23.6389" font-weight="bold">*.log</text>
  <text x="185.7143" y="199.0323" text-anchor="middle" font-size="20.2619">All .log files</text>
  <rect x="365.7143" y="114.8387" width="291.4286" height="112.2581" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="511.4286" y="161.6129" text-anchor="middle" font-size="23.6389" font-weight="bold">build/</text>
  <text x="511.4286" y="199.0323" text-anchor="middle" font-size="20.2619">build directory</text>
  <rect x="691.4286" y="114.8387" width="291.4286" height="112.2581" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="837.1429" y="161.6129" text-anchor="middle" font-size="23.6389" font-weight="bold">!keep.log</text>
  <text x="837.1429" y="199.0323" text-anchor="middle" font-size="20.2619">Exception to rule</text>
  <rect x="1017.1429" y="114.8387" width="222.8571" height="112.2581" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1128.5714" y="161.6129" text-anchor="middle" font-size="23.6389" font-weight="bold">/TODO</text>
  <text x="1128.5714" y="199.0323" text-anchor="middle" font-size="20.2619">Root only</text>
  <rect x="40" y="264.5161" width="291.4286" height="112.2581" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="185.7143" y="311.2903" text-anchor="middle" font-size="23.6389" font-weight="bold">doc/*.txt</text>
  <text x="185.7143" y="348.7097" text-anchor="middle" font-size="20.2619">Direct children</text>
  <rect x="365.7143" y="264.5161" width="291.4286" height="112.2581" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="511.4286" y="311.2903" text-anchor="middle" font-size="23.6389" font-weight="bold">doc/**/*.pdf</text>
  <text x="511.4286" y="348.7097" text-anchor="middle" font-size="20.2619">All descendants</text>
  <rect x="691.4286" y="264.5161" width="291.4286" height="112.2581" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="837.1429" y="311.2903" text-anchor="middle" font-size="23.6389" font-weight="bold">[Dd]ebug/</text>
  <text x="837.1429" y="348.7097" text-anchor="middle" font-size="20.2619">Debug or debug</text>
  <rect x="1017.1429" y="264.5161" width="222.8571" height="112.2581" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1128.5714" y="311.2903" text-anchor="middle" font-size="23.6389" font-weight="bold">#comment</text>
  <text x="1128.5714" y="348.7097" text-anchor="middle" font-size="20.2619">Comments</text>
  <rect x="297.1429" y="432.9032" width="685.7143" height="187.0968" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="640" y="489.0323" text-anchor="middle" font-size="23.6389" font-weight="bold">Check what's ignored:</text>
  <text x="640" y="535.8065" text-anchor="middle" font-size="21.9504" font-family="monospace">git check-ignore -v filename</text>
  <text x="640" y="582.5806" text-anchor="middle" font-size="21.9504" font-family="monospace">git status --ignored</text>
</svg>
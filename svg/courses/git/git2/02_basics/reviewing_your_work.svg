<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Before You Commit Checklist</text>
  <rect x="160" y="144" width="960" height="504" fill="#F5F5F5" stroke="#333" stroke-width="3.2" rx="8" />
  <rect x="208" y="180" width="864" height="72" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.6" rx="4.8" />
  <text x="240" y="225" font-size="22.4">☐ git status - Check what's changed</text>
  <rect x="208" y="270" width="864" height="72" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.6" rx="4.8" />
  <text x="240" y="315" font-size="22.4">☐ git diff - Review unstaged changes</text>
  <rect x="208" y="360" width="864" height="72" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.6" rx="4.8" />
  <text x="240" y="405" font-size="22.4">☐ git diff --staged - Review what you're committing</text>
  <rect x="208" y="450" width="864" height="72" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.6" rx="4.8" />
  <text x="240" y="495" font-size="22.4">☐ Tests pass? Documentation updated?</text>
  <rect x="208" y="540" width="864" height="72" fill="#FFEBEE" stroke="#C62828" stroke-width="1.6" rx="4.8" />
  <text x="240" y="585" font-size="22.4">☐ Good commit message ready?</text>
</svg>
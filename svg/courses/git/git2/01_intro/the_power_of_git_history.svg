<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="35.2" font-weight="bold">Git History is Powerful</text>
  <rect x="160" y="144" width="288" height="144" fill="#E8EAF6" stroke="#3F51B5" stroke-width="3.2" rx="8" />
  <text x="304" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">git blame</text>
  <text x="304" y="243" text-anchor="middle" font-size="19.2">Who changed what</text>
  <rect x="496" y="144" width="288" height="144" fill="#E0F2F1" stroke="#009688" stroke-width="3.2" rx="8" />
  <text x="640" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">git bisect</text>
  <text x="640" y="243" text-anchor="middle" font-size="19.2">Find breaking commits</text>
  <rect x="832" y="144" width="288" height="144" fill="#FCE4EC" stroke="#C2185B" stroke-width="3.2" rx="8" />
  <text x="976" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">git log</text>
  <text x="976" y="243" text-anchor="middle" font-size="19.2">Explore history</text>
  <rect x="320" y="360" width="640" height="216" fill="#FFF9C4" stroke="#F57F17" stroke-width="3.2" rx="8" />
  <text x="640" y="423" text-anchor="middle" font-size="25.6" font-weight="bold">Your Git history is documentation</text>
  <text x="640" y="477" text-anchor="middle" font-size="22.4">• Why was this change made?</text>
  <text x="640" y="513" text-anchor="middle" font-size="22.4">• What problem did it solve?</text>
  <text x="640" y="549" text-anchor="middle" font-size="22.4">• Who can I ask about this?</text>
</svg>
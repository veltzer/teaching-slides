<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 33.2308 L 16.5161 16.6154 z" fill="#555" />
    </marker>
  </defs>
  <text x="40" y="148.7499" font-family="sans-serif" font-size="31.3401" font-weight="bold" fill="var(--text)">File A:</text>
  <rect x="194.8386" y="40" width="206.4516" height="205.4166" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="298.0645" y="172.9168" font-family="monospace" font-size="28.9294" fill="var(--text)" text-anchor="middle">version 1</text>
  <line x1="401.2903" y1="142.7084" x2="491.613" y2="142.7084" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="491.613" y="40" width="180.6451" height="205.4166" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="581.9354" y="172.9168" font-family="monospace" font-size="28.9294" fill="var(--ok-accent)" text-anchor="middle">+5 lines</text>
  <line x1="672.2581" y1="142.7084" x2="762.5807" y2="142.7084" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="762.5807" y="40" width="180.6451" height="205.4166" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="852.9032" y="172.9168" font-family="monospace" font-size="28.9294" fill="var(--danger-accent)" text-anchor="middle">-2 lines</text>
  <line x1="943.2258" y1="142.7084" x2="1033.5485" y2="142.7084" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="1033.5485" y="40" width="180.6451" height="205.4166" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1123.8709" y="172.9168" font-family="monospace" font-size="28.9294" fill="var(--ok-accent)" text-anchor="middle">+1 line</text>
  <text x="40" y="523.3334" font-family="sans-serif" font-size="31.3401" font-weight="bold" fill="var(--text)">File B:</text>
  <rect x="194.8386" y="414.5834" width="206.4516" height="205.4166" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="298.0645" y="547.5" font-family="monospace" font-size="28.9294" fill="var(--text)" text-anchor="middle">version 1</text>
  <line x1="401.2903" y1="517.2917" x2="491.613" y2="517.2917" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="491.613" y="414.5834" width="206.4516" height="205.4166" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="594.8387" y="547.5" font-family="monospace" font-size="28.9294" fill="var(--ok-accent)" text-anchor="middle">+10 lines</text>
  <line x1="698.0646" y1="517.2917" x2="788.387" y2="517.2917" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="788.387" y="414.5834" width="180.6451" height="205.4166" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="878.7097" y="547.5" font-family="monospace" font-size="28.9294" fill="var(--danger-accent)" text-anchor="middle">-5 lines</text>
  <line x1="969.0323" y1="517.2917" x2="1059.3549" y2="517.2917" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="1059.3549" y="414.5834" width="180.6451" height="205.4166" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1149.6774" y="547.5" font-family="monospace" font-size="28.9294" fill="var(--ok-accent)" text-anchor="middle">+3 lines</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 33.2308 L 16.5161 16.6154 z" fill="#555" />
    </marker>
  </defs>
  <text x="20.5661" y="209.6551" font-family="sans-serif" font-size="26.7359" font-weight="bold" fill="var(--text)">File A:</text>
  <rect x="143.9624" y="110.3448" width="164.5285" height="187.5862" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="226.2267" y="231.7242" font-family="monospace" font-size="24.6793" fill="var(--text)" text-anchor="middle">version 1</text>
  <line x1="308.4909" y1="204.138" x2="380.4722" y2="204.138" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="380.4722" y="110.3448" width="143.9624" height="187.5862" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="452.4533" y="231.7242" font-family="monospace" font-size="24.6793" fill="var(--ok-accent)" text-anchor="middle">+5 lines</text>
  <line x1="524.4346" y1="204.138" x2="596.4158" y2="204.138" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="596.4158" y="110.3448" width="143.9624" height="187.5862" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="668.397" y="231.7242" font-family="monospace" font-size="24.6793" fill="var(--danger-accent)" text-anchor="middle">-2 lines</text>
  <line x1="740.3782" y1="204.138" x2="812.3595" y2="204.138" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="812.3595" y="110.3448" width="143.9624" height="187.5862" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="884.3406" y="231.7242" font-family="monospace" font-size="24.6793" fill="var(--ok-accent)" text-anchor="middle">+1 line</text>
  <text x="20.5661" y="551.7242" font-family="sans-serif" font-size="26.7359" font-weight="bold" fill="var(--text)">File B:</text>
  <rect x="143.9624" y="452.4138" width="164.5285" height="187.5862" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="226.2267" y="573.7931" font-family="monospace" font-size="24.6793" fill="var(--text)" text-anchor="middle">version 1</text>
  <line x1="308.4909" y1="546.2069" x2="380.4722" y2="546.2069" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="380.4722" y="452.4138" width="164.5285" height="187.5862" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="462.7364" y="573.7931" font-family="monospace" font-size="24.6793" fill="var(--ok-accent)" text-anchor="middle">+10 lines</text>
  <line x1="545.0007" y1="546.2069" x2="616.9818" y2="546.2069" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="616.9818" y="452.4138" width="143.9624" height="187.5862" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="688.9631" y="573.7931" font-family="monospace" font-size="24.6793" fill="var(--danger-accent)" text-anchor="middle">-5 lines</text>
  <line x1="760.9443" y1="546.2069" x2="832.9255" y2="546.2069" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="832.9255" y="452.4138" width="143.9624" height="187.5862" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="904.9067" y="573.7931" font-family="monospace" font-size="24.6793" fill="var(--ok-accent)" text-anchor="middle">+3 lines</text>
</svg>
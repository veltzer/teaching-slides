<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="662.2222" y="40" text-anchor="middle" font-size="42.5516" font-weight="bold">Choose a Workflow</text>
  <rect x="40" y="134.6939" width="266.6667" height="236.7347" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="173.3333" y="205.7143" text-anchor="middle" font-size="27.0783" font-weight="bold">Centralized</text>
  <text x="173.3333" y="264.898" text-anchor="middle" font-size="21.2759">Like SVN</text>
  <text x="173.3333" y="312.2449" text-anchor="middle" font-size="21.2759">Simple</text>
  <rect x="351.1111" y="134.6939" width="266.6667" height="236.7347" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="484.4444" y="205.7143" text-anchor="middle" font-size="27.0783" font-weight="bold">Feature Branch</text>
  <text x="484.4444" y="264.898" text-anchor="middle" font-size="21.2759">Branch per feature</text>
  <text x="484.4444" y="312.2449" text-anchor="middle" font-size="21.2759">Popular</text>
  <rect x="662.2222" y="134.6939" width="266.6667" height="236.7347" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="795.5556" y="205.7143" text-anchor="middle" font-size="27.0783" font-weight="bold">Gitflow</text>
  <text x="795.5556" y="264.898" text-anchor="middle" font-size="21.2759">Structured</text>
  <text x="795.5556" y="312.2449" text-anchor="middle" font-size="21.2759">Releases</text>
  <rect x="973.3333" y="134.6939" width="266.6667" height="236.7347" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1106.6667" y="205.7143" text-anchor="middle" font-size="27.0783" font-weight="bold">Forking</text>
  <text x="1106.6667" y="264.898" text-anchor="middle" font-size="21.2759">Open source</text>
  <text x="1106.6667" y="312.2449" text-anchor="middle" font-size="21.2759">Pull requests</text>
  <text x="662.2222" y="489.7959" text-anchor="middle" font-size="30.9466" font-style="italic">No one-size-fits-all solution</text>
  <text x="662.2222" y="560.8163" text-anchor="middle" font-size="27.0783">Choose based on:</text>
  <text x="662.2222" y="620" text-anchor="middle" font-size="23.21">• Team size • Release cycle • Collaboration style</text>
</svg>
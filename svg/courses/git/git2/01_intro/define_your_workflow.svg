<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="35.2" font-weight="bold">Choose a Workflow</text>
  <rect x="80" y="144" width="240" height="180" fill="#E3F2FD" stroke="#1976D2" stroke-width="3.2" rx="8" />
  <text x="200" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">Centralized</text>
  <text x="200" y="243" text-anchor="middle" font-size="17.6">Like SVN</text>
  <text x="200" y="279" text-anchor="middle" font-size="17.6">Simple</text>
  <rect x="360" y="144" width="240" height="180" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="3.2" rx="8" />
  <text x="480" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">Feature Branch</text>
  <text x="480" y="243" text-anchor="middle" font-size="17.6">Branch per feature</text>
  <text x="480" y="279" text-anchor="middle" font-size="17.6">Popular</text>
  <rect x="640" y="144" width="240" height="180" fill="#E8F5E9" stroke="#388E3C" stroke-width="3.2" rx="8" />
  <text x="760" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">Gitflow</text>
  <text x="760" y="243" text-anchor="middle" font-size="17.6">Structured</text>
  <text x="760" y="279" text-anchor="middle" font-size="17.6">Releases</text>
  <rect x="920" y="144" width="240" height="180" fill="#FFF3E0" stroke="#F57C00" stroke-width="3.2" rx="8" />
  <text x="1040" y="198" text-anchor="middle" font-size="22.4" font-weight="bold">Forking</text>
  <text x="1040" y="243" text-anchor="middle" font-size="17.6">Open source</text>
  <text x="1040" y="279" text-anchor="middle" font-size="17.6">Pull requests</text>
  <text x="640" y="414" text-anchor="middle" font-size="25.6" font-style="italic">No one-size-fits-all solution</text>
  <text x="640" y="468" text-anchor="middle" font-size="22.4">Choose based on:</text>
  <text x="640" y="513" text-anchor="middle" font-size="19.2">• Team size • Release cycle • Collaboration style</text>
</svg>
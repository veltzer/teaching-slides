<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="271.9733" y="40" text-anchor="middle" font-size="38.368" font-weight="bold">Centralized (SVN)</text>
  <rect x="179.9668" y="100.0001" width="184.0134" height="120" fill="var(--danger-fill)" rx="5.9996" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="271.9733" y="170" text-anchor="middle" font-size="26.8577" fill="var(--bg)">Server</text>
  <rect x="40" y="372.04" width="95.92" height="95.92" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="87.96" y="499.9999" text-anchor="middle" font-size="23.0208">Dev 1</text>
  <rect x="224.013" y="372.04" width="95.92" height="95.92" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="271.9733" y="499.9999" text-anchor="middle" font-size="23.0208">Dev 2</text>
  <rect x="408.027" y="372.04" width="95.92" height="95.92" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="455.9866" y="499.9999" text-anchor="middle" font-size="23.0208">Dev 3</text>
  <line x1="87.96" y1="369.9999" x2="235.1707" y2="220.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="271.9733" y1="369.9999" x2="271.9733" y2="220.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="455.9866" y1="369.9999" x2="308.7762" y2="220.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1008.0267" y="40" text-anchor="middle" font-size="38.368" font-weight="bold">Distributed (Git)</text>
  <rect x="776.053" y="112.04" width="95.92" height="95.92" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="824.0134" y="240" text-anchor="middle" font-size="23.0208">Dev 1</text>
  <rect x="960.067" y="112.04" width="95.92" height="95.92" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="1008.0267" y="240" text-anchor="middle" font-size="23.0208">Dev 2</text>
  <rect x="1144.08" y="112.04" width="95.92" height="95.92" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="1192.04" y="240" text-anchor="middle" font-size="23.0208">Dev 3</text>
  <rect x="868.06" y="292.04" width="95.92" height="95.92" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="916.02" y="420" text-anchor="middle" font-size="23.0208">Dev 4</text>
  <rect x="1052.07" y="292.04" width="95.92" height="95.92" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="1100.0332" y="420" text-anchor="middle" font-size="23.0208">Dev 5</text>
  <line x1="860.816" y1="190" x2="971.2238" y2="190" stroke="var(--text)" stroke-width="2" />
  <line x1="1044.8293" y1="190" x2="1155.2372" y2="190" stroke="var(--text)" stroke-width="2" />
  <line x1="851.6152" y1="200" x2="888.4181" y2="300" stroke="var(--text)" stroke-width="2" />
  <line x1="980.4246" y1="200" x2="943.622" y2="300" stroke="var(--text)" stroke-width="2" />
  <line x1="1035.6286" y1="200" x2="1072.4314" y2="300" stroke="var(--text)" stroke-width="2" />
  <line x1="1164.438" y1="200" x2="1127.6354" y2="300" stroke="var(--text)" stroke-width="2" />
  <line x1="952.8226" y1="340" x2="1063.2307" y2="340" stroke="var(--text)" stroke-width="2" />
  <text x="271.9733" y="620" text-anchor="middle" font-size="26.8577" font-style="italic">Single point of failure</text>
  <text x="1008.0267" y="620" text-anchor="middle" font-size="26.8577" font-style="italic">Every clone is a full backup</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
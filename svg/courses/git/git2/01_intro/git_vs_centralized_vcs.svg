<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="320" y="48" text-anchor="middle" font-size="32" font-weight="bold">Centralized (SVN)</text>
  <rect x="240" y="96" width="160" height="96" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="320" y="152" text-anchor="middle" font-size="22.4" fill="var(--bg)">Server</text>
  <circle cx="160" cy="352" r="40" fill="var(--primary-fill)" />
  <text x="160" y="416" text-anchor="middle" font-size="19.2">Dev 1</text>
  <circle cx="320" cy="352" r="40" fill="var(--primary-fill)" />
  <text x="320" y="416" text-anchor="middle" font-size="19.2">Dev 2</text>
  <circle cx="480" cy="352" r="40" fill="var(--primary-fill)" />
  <text x="480" y="416" text-anchor="middle" font-size="19.2">Dev 3</text>
  <line x1="160" y1="312" x2="288" y2="192" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="320" y1="312" x2="320" y2="192" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="480" y1="312" x2="352" y2="192" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="960" y="48" text-anchor="middle" font-size="32" font-weight="bold">Distributed (Git)</text>
  <circle cx="800" cy="144" r="40" fill="var(--ok-fill)" />
  <text x="800" y="208" text-anchor="middle" font-size="19.2">Dev 1</text>
  <circle cx="960" cy="144" r="40" fill="var(--ok-fill)" />
  <text x="960" y="208" text-anchor="middle" font-size="19.2">Dev 2</text>
  <circle cx="1120" cy="144" r="40" fill="var(--ok-fill)" />
  <text x="1120" y="208" text-anchor="middle" font-size="19.2">Dev 3</text>
  <circle cx="880" cy="288" r="40" fill="var(--ok-fill)" />
  <text x="880" y="352" text-anchor="middle" font-size="19.2">Dev 4</text>
  <circle cx="1040" cy="288" r="40" fill="var(--ok-fill)" />
  <text x="1040" y="352" text-anchor="middle" font-size="19.2">Dev 5</text>
  <line x1="832" y1="168" x2="928" y2="168" stroke="var(--text)" stroke-width="2" />
  <line x1="992" y1="168" x2="1088" y2="168" stroke="var(--text)" stroke-width="2" />
  <line x1="824" y1="176" x2="856" y2="256" stroke="var(--text)" stroke-width="2" />
  <line x1="936" y1="176" x2="904" y2="256" stroke="var(--text)" stroke-width="2" />
  <line x1="984" y1="176" x2="1016" y2="256" stroke="var(--text)" stroke-width="2" />
  <line x1="1096" y1="176" x2="1064" y2="256" stroke="var(--text)" stroke-width="2" />
  <line x1="912" y1="288" x2="1008" y2="288" stroke="var(--text)" stroke-width="2" />
  <text x="320" y="512" text-anchor="middle" font-size="22.4" font-style="italic">Single point of failure</text>
  <text x="960" y="512" text-anchor="middle" font-size="22.4" font-style="italic">Every clone is a full backup</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
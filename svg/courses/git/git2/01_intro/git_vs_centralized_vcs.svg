<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="271.9253" y="40" text-anchor="middle" font-size="38.3705" font-weight="bold">Centralized (SVN)</text>
  <rect x="179.9068" y="100.0001" width="184.0373" height="120" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="271.9253" y="170" text-anchor="middle" font-size="26.8595" fill="var(--bg)">Server</text>
  <circle cx="87.888" cy="420" r="47.9631" fill="var(--primary-fill)" />
  <text x="87.888" y="499.9999" text-anchor="middle" font-size="23.0223">Dev 1</text>
  <circle cx="271.9253" cy="420" r="47.9631" fill="var(--primary-fill)" />
  <text x="271.9253" y="499.9999" text-anchor="middle" font-size="23.0223">Dev 2</text>
  <circle cx="455.9627" cy="420" r="47.9631" fill="var(--primary-fill)" />
  <text x="455.9627" y="499.9999" text-anchor="middle" font-size="23.0223">Dev 3</text>
  <line x1="87.888" y1="369.9999" x2="235.1179" y2="220.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="271.9253" y1="369.9999" x2="271.9253" y2="220.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="455.9627" y1="369.9999" x2="308.7329" y2="220.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1008.0747" y="40" text-anchor="middle" font-size="38.3705" font-weight="bold">Distributed (Git)</text>
  <circle cx="824.0373" cy="160.0001" r="47.9631" fill="var(--ok-fill)" />
  <text x="824.0373" y="240" text-anchor="middle" font-size="23.0223">Dev 1</text>
  <circle cx="1008.0747" cy="160.0001" r="47.9631" fill="var(--ok-fill)" />
  <text x="1008.0747" y="240" text-anchor="middle" font-size="23.0223">Dev 2</text>
  <circle cx="1192.112" cy="160.0001" r="47.9631" fill="var(--ok-fill)" />
  <text x="1192.112" y="240" text-anchor="middle" font-size="23.0223">Dev 3</text>
  <circle cx="916.0559" cy="340" r="47.9631" fill="var(--ok-fill)" />
  <text x="916.0559" y="420" text-anchor="middle" font-size="23.0223">Dev 4</text>
  <circle cx="1100.0932" cy="340" r="47.9631" fill="var(--ok-fill)" />
  <text x="1100.0932" y="420" text-anchor="middle" font-size="23.0223">Dev 5</text>
  <line x1="860.8447" y1="190" x2="971.2671" y2="190" stroke="var(--text)" stroke-width="2" />
  <line x1="1044.8821" y1="190" x2="1155.3044" y2="190" stroke="var(--text)" stroke-width="2" />
  <line x1="851.6428" y1="200" x2="888.4504" y2="300" stroke="var(--text)" stroke-width="2" />
  <line x1="980.469" y1="200" x2="943.6616" y2="300" stroke="var(--text)" stroke-width="2" />
  <line x1="1035.6802" y1="200" x2="1072.4878" y2="300" stroke="var(--text)" stroke-width="2" />
  <line x1="1164.5063" y1="200" x2="1127.6989" y2="300" stroke="var(--text)" stroke-width="2" />
  <line x1="952.8635" y1="340" x2="1063.2859" y2="340" stroke="var(--text)" stroke-width="2" />
  <text x="271.9253" y="620" text-anchor="middle" font-size="26.8595" font-style="italic">Single point of failure</text>
  <text x="1008.0747" y="620" text-anchor="middle" font-size="26.8595" font-style="italic">Every clone is a full backup</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="320" y="48" text-anchor="middle" font-size="32" font-weight="bold">Centralized (SVN)</text>
  <rect x="240" y="96" width="160" height="96" fill="#f44336" />
  <text x="320" y="152" text-anchor="middle" font-size="22.4" fill="white">Server</text>
  <circle cx="160" cy="352" r="40" fill="#2196F3" />
  <text x="160" y="416" text-anchor="middle" font-size="19.2">Dev 1</text>
  <circle cx="320" cy="352" r="40" fill="#2196F3" />
  <text x="320" y="416" text-anchor="middle" font-size="19.2">Dev 2</text>
  <circle cx="480" cy="352" r="40" fill="#2196F3" />
  <text x="480" y="416" text-anchor="middle" font-size="19.2">Dev 3</text>
  <line x1="160" y1="312" x2="288" y2="192" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="320" y1="312" x2="320" y2="192" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="480" y1="312" x2="352" y2="192" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="960" y="48" text-anchor="middle" font-size="32" font-weight="bold">Distributed (Git)</text>
  <circle cx="800" cy="144" r="40" fill="#4CAF50" />
  <text x="800" y="208" text-anchor="middle" font-size="19.2">Dev 1</text>
  <circle cx="960" cy="144" r="40" fill="#4CAF50" />
  <text x="960" y="208" text-anchor="middle" font-size="19.2">Dev 2</text>
  <circle cx="1120" cy="144" r="40" fill="#4CAF50" />
  <text x="1120" y="208" text-anchor="middle" font-size="19.2">Dev 3</text>
  <circle cx="880" cy="288" r="40" fill="#4CAF50" />
  <text x="880" y="352" text-anchor="middle" font-size="19.2">Dev 4</text>
  <circle cx="1040" cy="288" r="40" fill="#4CAF50" />
  <text x="1040" y="352" text-anchor="middle" font-size="19.2">Dev 5</text>
  <line x1="832" y1="168" x2="928" y2="168" stroke="#333" stroke-width="3.2" />
  <line x1="992" y1="168" x2="1088" y2="168" stroke="#333" stroke-width="3.2" />
  <line x1="824" y1="176" x2="856" y2="256" stroke="#333" stroke-width="3.2" />
  <line x1="936" y1="176" x2="904" y2="256" stroke="#333" stroke-width="3.2" />
  <line x1="984" y1="176" x2="1016" y2="256" stroke="#333" stroke-width="3.2" />
  <line x1="1096" y1="176" x2="1064" y2="256" stroke="#333" stroke-width="3.2" />
  <line x1="912" y1="288" x2="1008" y2="288" stroke="#333" stroke-width="3.2" />
  <text x="320" y="512" text-anchor="middle" font-size="22.4" font-style="italic">Single point of failure</text>
  <text x="960" y="512" text-anchor="middle" font-size="22.4" font-style="italic">Every clone is a full backup</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </defs>
</svg>
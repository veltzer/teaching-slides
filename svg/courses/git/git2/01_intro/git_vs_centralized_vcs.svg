<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="270.7692" y="40" text-anchor="middle" font-size="38.4307" font-weight="bold">Centralized (SVN)</text>
  <rect x="178.4616" y="100.0001" width="184.6154" height="120" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="270.7692" y="170" text-anchor="middle" font-size="26.9016" fill="var(--bg)">Server</text>
  <circle cx="86.1538" cy="420" r="48.0384" fill="var(--primary-fill)" />
  <text x="86.1538" y="499.9999" text-anchor="middle" font-size="23.0584">Dev 1</text>
  <circle cx="270.7692" cy="420" r="48.0384" fill="var(--primary-fill)" />
  <text x="270.7692" y="499.9999" text-anchor="middle" font-size="23.0584">Dev 2</text>
  <circle cx="455.3846" cy="420" r="48.0384" fill="var(--primary-fill)" />
  <text x="455.3846" y="499.9999" text-anchor="middle" font-size="23.0584">Dev 3</text>
  <line x1="86.1538" y1="369.9999" x2="233.8462" y2="220.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="270.7692" y1="369.9999" x2="270.7692" y2="220.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="455.3846" y1="369.9999" x2="307.6924" y2="220.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1009.2308" y="40" text-anchor="middle" font-size="38.4307" font-weight="bold">Distributed (Git)</text>
  <circle cx="824.6154" cy="160.0001" r="48.0384" fill="var(--ok-fill)" />
  <text x="824.6154" y="240" text-anchor="middle" font-size="23.0584">Dev 1</text>
  <circle cx="1009.2308" cy="160.0001" r="48.0384" fill="var(--ok-fill)" />
  <text x="1009.2308" y="240" text-anchor="middle" font-size="23.0584">Dev 2</text>
  <circle cx="1193.8462" cy="160.0001" r="48.0384" fill="var(--ok-fill)" />
  <text x="1193.8462" y="240" text-anchor="middle" font-size="23.0584">Dev 3</text>
  <circle cx="916.923" cy="340" r="48.0384" fill="var(--ok-fill)" />
  <text x="916.923" y="420" text-anchor="middle" font-size="23.0584">Dev 4</text>
  <circle cx="1101.5384" cy="340" r="48.0384" fill="var(--ok-fill)" />
  <text x="1101.5384" y="420" text-anchor="middle" font-size="23.0584">Dev 5</text>
  <line x1="861.5384" y1="190" x2="972.3076" y2="190" stroke="var(--text)" stroke-width="2" />
  <line x1="1046.1538" y1="190" x2="1156.923" y2="190" stroke="var(--text)" stroke-width="2" />
  <line x1="852.3076" y1="200" x2="889.2308" y2="300" stroke="var(--text)" stroke-width="2" />
  <line x1="981.5384" y1="200" x2="944.6154" y2="300" stroke="var(--text)" stroke-width="2" />
  <line x1="1036.923" y1="200" x2="1073.8462" y2="300" stroke="var(--text)" stroke-width="2" />
  <line x1="1166.1538" y1="200" x2="1129.2308" y2="300" stroke="var(--text)" stroke-width="2" />
  <line x1="953.8462" y1="340" x2="1064.6154" y2="340" stroke="var(--text)" stroke-width="2" />
  <text x="270.7692" y="620" text-anchor="middle" font-size="26.9016" font-style="italic">Single point of failure</text>
  <text x="1009.2308" y="620" text-anchor="middle" font-size="26.9016" font-style="italic">Every clone is a full backup</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
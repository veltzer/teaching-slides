<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="35.2" font-weight="bold">Git Objects</text>
  <rect x="160" y="144" width="192" height="108" fill="#4CAF50" rx="8" />
  <text x="256" y="207" text-anchor="middle" font-size="25.6" fill="white">Blob</text>
  <text x="256" y="306" text-anchor="middle" font-size="19.2">File content</text>
  <rect x="544" y="144" width="192" height="108" fill="#2196F3" rx="8" />
  <text x="640" y="207" text-anchor="middle" font-size="25.6" fill="white">Tree</text>
  <text x="640" y="306" text-anchor="middle" font-size="19.2">Directory structure</text>
  <rect x="928" y="144" width="192" height="108" fill="#FF9800" rx="8" />
  <text x="1024" y="207" text-anchor="middle" font-size="25.6" fill="white">Commit</text>
  <text x="1024" y="306" text-anchor="middle" font-size="19.2">Snapshot + metadata</text>
  <line x1="352" y1="198" x2="544" y2="198" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <line x1="736" y1="198" x2="928" y2="198" stroke="#333" stroke-width="3.2" marker-end="url(#arrow2)" />
  <rect x="400" y="450" width="480" height="144" fill="#f0f0f0" stroke="#333" stroke-width="3.2" rx="8" />
  <text x="640" y="504" text-anchor="middle" font-size="22.4" font-weight="bold">Every commit has a unique SHA-1 hash</text>
  <text x="640" y="549" text-anchor="middle" font-size="19.2">Example: 3b18e512dba79e4c8300dd08aeb37f8e728b8dad</text>
  <defs>
    <marker id="arrow2" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="40" y="40" font-size="27.1519" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Commit</text>
  <text x="282.4242" y="40" font-size="27.1519" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">File A</text>
  <text x="621.8181" y="40" font-size="27.1519" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">File B</text>
  <text x="961.2121" y="40" font-size="27.1519" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">File C</text>
  <rect x="40" y="76.8254" width="193.9394" height="156.5079" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="2.039" />
  <text x="136.9697" y="178.0952" font-size="27.1519" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">Commit 1</text>
  <rect x="270.303" y="76.8254" width="290.9091" height="156.5079" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="415.7576" y="178.0952" font-size="27.1519" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">FileA-v1</text>
  <rect x="609.697" y="76.8254" width="290.9091" height="156.5079" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.1515" y="178.0952" font-size="27.1519" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">FileB-v1</text>
  <rect x="949.0909" y="76.8254" width="290.9091" height="156.5079" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.5455" y="178.0952" font-size="27.1519" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">FileC-v1</text>
  <rect x="40" y="270.1587" width="193.9394" height="156.5079" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="2.039" />
  <text x="136.9697" y="371.4286" font-size="27.1519" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">Commit 2</text>
  <rect x="270.303" y="270.1587" width="290.9091" height="156.5079" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="415.7576" y="371.4286" font-size="27.1519" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">FileA-v2</text>
  <rect x="609.697" y="270.1587" width="290.9091" height="156.5079" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.1515" y="371.4286" font-size="27.1519" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">FileB-v1</text>
  <rect x="949.0909" y="270.1587" width="290.9091" height="156.5079" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.5455" y="371.4286" font-size="27.1519" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">FileC-v2</text>
  <rect x="40" y="463.4921" width="193.9394" height="156.5079" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="2.039" />
  <text x="136.9697" y="564.7619" font-size="27.1519" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">Commit 3</text>
  <rect x="270.303" y="463.4921" width="290.9091" height="156.5079" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="415.7576" y="564.7619" font-size="27.1519" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">FileA-v2</text>
  <rect x="609.697" y="463.4921" width="290.9091" height="156.5079" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.1515" y="564.7619" font-size="27.1519" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">FileB-v2</text>
  <rect x="949.0909" y="463.4921" width="290.9091" height="156.5079" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.5455" y="564.7619" font-size="27.1519" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">FileC-v3</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 27 L 16.5161 13.5 z" fill="#555" />
    </marker>
  </defs>
  <text x="40" y="40" font-family="sans-serif" font-size="27.1519" font-weight="bold" fill="var(--text-muted)">Commit</text>
  <text x="282.4242" y="40" font-family="sans-serif" font-size="27.1519" font-weight="bold" fill="var(--text-muted)">File A</text>
  <text x="621.8181" y="40" font-family="sans-serif" font-size="27.1519" font-weight="bold" fill="var(--text-muted)">File B</text>
  <text x="961.2121" y="40" font-family="sans-serif" font-size="27.1519" font-weight="bold" fill="var(--text-muted)">File C</text>
  <rect x="40" y="76.8254" width="193.9394" height="156.5079" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="2.039" />
  <text x="136.9697" y="178.0952" font-family="monospace" font-size="27.1519" fill="var(--bg)" text-anchor="middle">Commit 1</text>
  <rect x="270.303" y="76.8254" width="290.9091" height="156.5079" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="415.7576" y="178.0952" font-family="monospace" font-size="27.1519" fill="var(--text)" text-anchor="middle">FileA-v1</text>
  <rect x="609.697" y="76.8254" width="290.9091" height="156.5079" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.1515" y="178.0952" font-family="monospace" font-size="27.1519" fill="var(--text)" text-anchor="middle">FileB-v1</text>
  <rect x="949.0909" y="76.8254" width="290.9091" height="156.5079" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.5455" y="178.0952" font-family="monospace" font-size="27.1519" fill="var(--text)" text-anchor="middle">FileC-v1</text>
  <rect x="40" y="270.1587" width="193.9394" height="156.5079" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="2.039" />
  <text x="136.9697" y="371.4286" font-family="monospace" font-size="27.1519" fill="var(--bg)" text-anchor="middle">Commit 2</text>
  <rect x="270.303" y="270.1587" width="290.9091" height="156.5079" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="415.7576" y="371.4286" font-family="monospace" font-size="27.1519" fill="var(--ok-accent)" text-anchor="middle">FileA-v2</text>
  <rect x="609.697" y="270.1587" width="290.9091" height="156.5079" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.1515" y="371.4286" font-family="monospace" font-size="27.1519" fill="var(--text)" text-anchor="middle">FileB-v1</text>
  <rect x="949.0909" y="270.1587" width="290.9091" height="156.5079" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.5455" y="371.4286" font-family="monospace" font-size="27.1519" fill="var(--ok-accent)" text-anchor="middle">FileC-v2</text>
  <rect x="40" y="463.4921" width="193.9394" height="156.5079" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="2.039" />
  <text x="136.9697" y="564.7619" font-family="monospace" font-size="27.1519" fill="var(--bg)" text-anchor="middle">Commit 3</text>
  <rect x="270.303" y="463.4921" width="290.9091" height="156.5079" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="415.7576" y="564.7619" font-family="monospace" font-size="27.1519" fill="var(--text)" text-anchor="middle">FileA-v2</text>
  <rect x="609.697" y="463.4921" width="290.9091" height="156.5079" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.1515" y="564.7619" font-family="monospace" font-size="27.1519" fill="var(--ok-accent)" text-anchor="middle">FileB-v2</text>
  <rect x="949.0909" y="463.4921" width="290.9091" height="156.5079" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.5455" y="564.7619" font-family="monospace" font-size="27.1519" fill="var(--ok-accent)" text-anchor="middle">FileC-v3</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="465.4545" y="52.3636" text-anchor="middle" font-size="27.9273" font-weight="bold">Git File States</ns0:text>
  <ns0:rect x="58.1818" y="130.9091" width="232.7273" height="327.2727" fill="#FFE0B2" stroke="#E65100" stroke-width="2.3273" rx="5.8182" />
  <ns0:text x="174.5455" y="170.1818" text-anchor="middle" font-size="20.9455" font-weight="bold">Working Directory</ns0:text>
  <ns0:text x="174.5455" y="209.4545" text-anchor="middle" font-size="16.2909">Files you see</ns0:text>
  <ns0:text x="174.5455" y="235.6364" text-anchor="middle" font-size="16.2909">and edit</ns0:text>
  <ns0:rect x="349.0909" y="130.9091" width="232.7273" height="327.2727" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2.3273" rx="5.8182" />
  <ns0:text x="465.4545" y="170.1818" text-anchor="middle" font-size="20.9455" font-weight="bold">Staging Area</ns0:text>
  <ns0:text x="465.4545" y="209.4545" text-anchor="middle" font-size="16.2909">Files ready to</ns0:text>
  <ns0:text x="465.4545" y="235.6364" text-anchor="middle" font-size="16.2909">be committed</ns0:text>
  <ns0:rect x="640" y="130.9091" width="232.7273" height="327.2727" fill="#BBDEFB" stroke="#1565C0" stroke-width="2.3273" rx="5.8182" />
  <ns0:text x="756.3636" y="170.1818" text-anchor="middle" font-size="20.9455" font-weight="bold">Repository</ns0:text>
  <ns0:text x="756.3636" y="209.4545" text-anchor="middle" font-size="16.2909">Committed</ns0:text>
  <ns0:text x="756.3636" y="235.6364" text-anchor="middle" font-size="16.2909">snapshots</ns0:text>
  <ns0:path d="M 290.9091 294.5455 L 337.4545 294.5455" stroke="#333" stroke-width="3.4909" marker-end="url(#arrow)" />
  <ns0:text x="314.1818" y="281.4545" text-anchor="middle" font-size="13.9636">git add</ns0:text>
  <ns0:path d="M 581.8182 294.5455 L 628.3636 294.5455" stroke="#333" stroke-width="3.4909" marker-end="url(#arrow)" />
  <ns0:text x="605.0909" y="281.4545" text-anchor="middle" font-size="13.9636">git commit</ns0:text>
  <ns0:path d="M 640 360 Q 465.4545 418.9091 290.9091 360" stroke="#333" stroke-width="3.4909" marker-end="url(#arrow)" fill="none" />
  <ns0:text x="465.4545" y="445.0909" text-anchor="middle" font-size="13.9636">git checkout</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>

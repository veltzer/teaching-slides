  <text x="210.7579" y="204.7485" text-anchor="middle" font-size="15.0235">Files you see</text>
  <text x="210.7579" y="228.8934" text-anchor="middle" font-size="15.0235">and edit</text>
  <rect x="371.7237" y="132.3139" width="214.6211" height="301.8109" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.497" rx="5.5332" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="479.0342" y="59.8793" text-anchor="middle" font-size="25.7545" font-weight="bold">Git File States</text>
  <rect x="103.4474" y="132.3139" width="214.6211" height="301.8109" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.497" rx="5.5332" />

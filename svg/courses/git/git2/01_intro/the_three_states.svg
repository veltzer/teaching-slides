<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Git File States</text>
  <rect x="80" y="180" width="320" height="450" fill="#FFE0B2" stroke="#E65100" stroke-width="3.2" rx="8" />
  <text x="240" y="234" text-anchor="middle" font-size="28.8" font-weight="bold">Working Directory</text>
  <text x="240" y="288" text-anchor="middle" font-size="22.4">Files you see</text>
  <text x="240" y="324" text-anchor="middle" font-size="22.4">and edit</text>
  <rect x="480" y="180" width="320" height="450" fill="#C8E6C9" stroke="#2E7D32" stroke-width="3.2" rx="8" />
  <text x="640" y="234" text-anchor="middle" font-size="28.8" font-weight="bold">Staging Area</text>
  <text x="640" y="288" text-anchor="middle" font-size="22.4">Files ready to</text>
  <text x="640" y="324" text-anchor="middle" font-size="22.4">be committed</text>
  <rect x="880" y="180" width="320" height="450" fill="#BBDEFB" stroke="#1565C0" stroke-width="3.2" rx="8" />
  <text x="1040" y="234" text-anchor="middle" font-size="28.8" font-weight="bold">Repository</text>
  <text x="1040" y="288" text-anchor="middle" font-size="22.4">Committed</text>
  <text x="1040" y="324" text-anchor="middle" font-size="22.4">snapshots</text>
  <path d="M 400 405 L 464 405" stroke="#333" stroke-width="4.8" marker-end="url(#arrow3)" />
  <text x="432" y="387" text-anchor="middle" font-size="19.2">git add</text>
  <path d="M 800 405 L 864 405" stroke="#333" stroke-width="4.8" marker-end="url(#arrow3)" />
  <text x="832" y="387" text-anchor="middle" font-size="19.2">git commit</text>
  <path d="M 880 495 Q 640 576 400 495" stroke="#333" stroke-width="4.8" marker-end="url(#arrow3)" fill="none" />
  <text x="640" y="612" text-anchor="middle" font-size="19.2">git checkout</text>
  <defs>
    <marker id="arrow3" markerWidth="16" markerHeight="18" refX="12.8" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
  <text x="479.0342" y="204.7485" text-anchor="middle" font-size="15.0235">Files ready to</text>
  <text x="479.0342" y="228.8934" text-anchor="middle" font-size="15.0235">be committed</text>
  <rect x="640" y="132.3139" width="214.6211" height="301.8109" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.497" rx="5.5332" />
  <text x="747.3106" y="168.5312" text-anchor="middle" font-size="19.3159" font-weight="bold">Repository</text>
  <text x="747.3106" y="204.7485" text-anchor="middle" font-size="15.0235">Committed</text>
  <text x="747.3106" y="228.8934" text-anchor="middle" font-size="15.0235">snapshots</text>
  <path d="M 318.0685 283.2194 L 360.9926 283.2194" stroke="var(--text)" stroke-width="2.6129" marker-end="url(#arrow)" />
  <text x="339.5306" y="271.1469" text-anchor="middle" font-size="12.8773">git add</text>
  <path d="M 586.3448 283.2194 L 629.269 283.2194" stroke="var(--text)" stroke-width="2.6129" marker-end="url(#arrow)" />
  <text x="607.8069" y="271.1469" text-anchor="middle" font-size="12.8773">git commit</text>
  <path d="M 640 343.5815 Q 479.0342 397.9075 318.0685 343.5815" stroke="var(--text)" stroke-width="2.6129" marker-end="url(#arrow)" fill="none" />
  <text x="479.0342" y="422.0524" text-anchor="middle" font-size="12.8773">git checkout</text>

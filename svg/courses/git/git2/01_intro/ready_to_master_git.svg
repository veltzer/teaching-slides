  <circle cx="205.2174" cy="321.8478" r="8.6956" fill="var(--text-muted)" />
  <circle cx="313.9131" cy="291.2772" r="8.6956" fill="var(--text-muted)" />
  <circle cx="422.6088" cy="279.0489" r="8.6956" fill="var(--text-muted)" />
  <circle cx="531.3043" cy="291.2772" r="8.6956" fill="var(--text-muted)" />
  <circle cx="640" cy="321.8478" r="8.6956" fill="var(--text-muted)" />
  <text x="422.6088" y="382.9891" text-anchor="middle" font-size="19.5652" font-style="italic">Your journey to Git mastery begins now</text>

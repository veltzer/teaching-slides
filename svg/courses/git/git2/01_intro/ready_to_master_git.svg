  <text x="422.6088" y="52.8261" text-anchor="middle" font-size="39.1305" font-weight="bold" fill="var(--danger-accent)">Let's Git Started!</text>
  <circle cx="422.6088" cy="199.5652" r="65.2174" fill="var(--primary-fill)" />
  <text x="422.6088" y="211.7935" text-anchor="middle" font-size="52.1739" fill="var(--bg)">Git</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="748.1538" y="40" text-anchor="middle" font-size="39.9232" font-weight="bold">Branching is Cheap and Fast</text>
  <circle cx="332.1923" cy="339.3548" r="33.2693" fill="var(--ok-fill)" />
  <text x="332.1923" y="404.8387" text-anchor="middle" font-size="19.9616">C1</text>
  <circle cx="498.5769" cy="339.3548" r="33.2693" fill="var(--ok-fill)" />
  <text x="498.5769" y="404.8387" text-anchor="middle" font-size="19.9616">C2</text>
  <circle cx="664.9615" cy="339.3548" r="33.2693" fill="var(--ok-fill)" />
  <text x="664.9615" y="404.8387" text-anchor="middle" font-size="19.9616">C3</text>
  <circle cx="831.3461" cy="227.0968" r="33.2693" fill="var(--primary-fill)" />
  <text x="831.3461" y="292.5806" text-anchor="middle" font-size="19.9616">C4</text>
  <circle cx="997.7307" cy="227.0968" r="33.2693" fill="var(--primary-fill)" />
  <text x="997.7307" y="292.5806" text-anchor="middle" font-size="19.9616">C5</text>
  <circle cx="831.3461" cy="451.6129" r="33.2693" fill="var(--warn-fill)" />
  <text x="831.3461" y="517.0968" text-anchor="middle" font-size="19.9616">C6</text>
  <line x1="365.4692" y1="339.3548" x2="465.2999" y2="339.3548" stroke="var(--text)" stroke-width="2" />
  <line x1="531.8538" y1="339.3548" x2="631.6845" y2="339.3548" stroke="var(--text)" stroke-width="2" />
  <line x1="698.2385" y1="320.6452" x2="798.0692" y2="245.8065" stroke="var(--text)" stroke-width="2" />
  <line x1="698.2385" y1="358.0645" x2="798.0692" y2="432.9032" stroke="var(--text)" stroke-width="2" />
  <line x1="864.623" y1="227.0968" x2="964.4538" y2="227.0968" stroke="var(--text)" stroke-width="2" />
  <rect x="249" y="563.871" width="133.1077" height="56.129" fill="var(--ok-fill)" rx="6.0013" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="315.5538" y="601.2903" text-anchor="middle" font-size="19.9616" fill="var(--bg)">main</text>
  <rect x="498.5769" y="563.871" width="133.1077" height="56.129" fill="var(--primary-fill)" rx="6.0013" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="565.1307" y="601.2903" text-anchor="middle" font-size="19.9616" fill="var(--bg)">feature</text>
  <rect x="748.1538" y="563.871" width="133.1077" height="56.129" fill="var(--warn-fill)" rx="6.0013" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="814.7077" y="601.2903" text-anchor="middle" font-size="19.9616" fill="var(--bg)">hotfix</text>
</svg>
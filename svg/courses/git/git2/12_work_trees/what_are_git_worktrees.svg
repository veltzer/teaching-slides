<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="694.5455" y="40" text-anchor="middle" font-size="30.519" font-weight="bold">Git Worktrees Architecture</text>
  <rect x="476.3636" y="105.6604" width="436.3636" height="175.0943" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="694.5455" y="160.3774" text-anchor="middle" fill="var(--bg)" font-size="26.7041" font-weight="bold">Main Repository</text>
  <text x="694.5455" y="204.1509" text-anchor="middle" fill="var(--bg)" font-size="20.9818">.git/ (shared)</text>
  <text x="694.5455" y="236.9811" text-anchor="middle" fill="var(--bg)" font-size="20.9818">main branch</text>
  <rect x="40" y="390.1886" width="327.2727" height="175.0943" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="444.9057" text-anchor="middle" fill="var(--bg)" font-size="22.8893" font-weight="bold">Worktree 1</text>
  <text x="203.6364" y="477.7359" text-anchor="middle" fill="var(--bg)" font-size="19.0743">feature-auth</text>
  <text x="203.6364" y="510.566" text-anchor="middle" fill="var(--bg)" font-size="19.0743">separate files</text>
  <rect x="476.3636" y="390.1886" width="327.2727" height="175.0943" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="444.9057" text-anchor="middle" fill="var(--bg)" font-size="22.8893" font-weight="bold">Worktree 2</text>
  <text x="640" y="477.7359" text-anchor="middle" fill="var(--bg)" font-size="19.0743">hotfix-bug</text>
  <text x="640" y="510.566" text-anchor="middle" fill="var(--bg)" font-size="19.0743">separate files</text>
  <rect x="912.7273" y="390.1886" width="327.2727" height="175.0943" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3636" y="444.9057" text-anchor="middle" fill="var(--bg)" font-size="22.8893" font-weight="bold">Worktree 3</text>
  <text x="1076.3636" y="477.7359" text-anchor="middle" fill="var(--bg)" font-size="19.0743">experiment</text>
  <text x="1076.3636" y="510.566" text-anchor="middle" fill="var(--bg)" font-size="19.0743">separate files</text>
  <line x1="585.4545" y1="280.7547" x2="203.6364" y2="390.1886" stroke="var(--text)" stroke-width="2" stroke-dasharray="8.5548 8.5548" />
  <line x1="694.5455" y1="280.7547" x2="640" y2="390.1886" stroke="var(--text)" stroke-width="2" stroke-dasharray="8.5548 8.5548" />
  <line x1="803.6364" y1="280.7547" x2="1076.3636" y2="390.1886" stroke="var(--text)" stroke-width="2" stroke-dasharray="8.5548 8.5548" />
  <text x="694.5455" y="620" text-anchor="middle" font-size="22.8893">All share same .git database</text>
</svg>
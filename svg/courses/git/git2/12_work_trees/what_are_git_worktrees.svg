<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="48" text-anchor="middle" font-size="29.2571" font-weight="bold">Git Worktrees Architecture</text>
  <rect x="457.1429" y="120" width="365.7143" height="192" fill="#3498db" rx="9.1429" />
  <text x="640" y="180" text-anchor="middle" fill="white" font-size="25.6" font-weight="bold">Main Repository</text>
  <text x="640" y="228" text-anchor="middle" fill="white" font-size="20.1143">.git/ (shared)</text>
  <text x="640" y="264" text-anchor="middle" fill="white" font-size="20.1143">main branch</text>
  <rect x="91.4286" y="432" width="274.2857" height="192" fill="#e74c3c" rx="9.1429" />
  <text x="228.5714" y="492" text-anchor="middle" fill="white" font-size="21.9429" font-weight="bold">Worktree 1</text>
  <text x="228.5714" y="528" text-anchor="middle" fill="white" font-size="18.2857">feature-auth</text>
  <text x="228.5714" y="564" text-anchor="middle" fill="white" font-size="18.2857">separate files</text>
  <rect x="457.1429" y="432" width="274.2857" height="192" fill="#2ecc71" rx="9.1429" />
  <text x="594.2857" y="492" text-anchor="middle" fill="white" font-size="21.9429" font-weight="bold">Worktree 2</text>
  <text x="594.2857" y="528" text-anchor="middle" fill="white" font-size="18.2857">hotfix-bug</text>
  <text x="594.2857" y="564" text-anchor="middle" fill="white" font-size="18.2857">separate files</text>
  <rect x="822.8571" y="432" width="274.2857" height="192" fill="#f39c12" rx="9.1429" />
  <text x="960" y="492" text-anchor="middle" fill="white" font-size="21.9429" font-weight="bold">Worktree 3</text>
  <text x="960" y="528" text-anchor="middle" fill="white" font-size="18.2857">experiment</text>
  <text x="960" y="564" text-anchor="middle" fill="white" font-size="18.2857">separate files</text>
  <line x1="548.5714" y1="312" x2="228.5714" y2="432" stroke="#333" stroke-width="3.6571" stroke-dasharray="9.1429 9.1429" />
  <line x1="640" y1="312" x2="594.2857" y2="432" stroke="#333" stroke-width="3.6571" stroke-dasharray="9.1429 9.1429" />
  <line x1="731.4286" y1="312" x2="960" y2="432" stroke="#333" stroke-width="3.6571" stroke-dasharray="9.1429 9.1429" />
  <text x="640" y="684" text-anchor="middle" font-size="21.9429">All share same .git database</text>
</svg>
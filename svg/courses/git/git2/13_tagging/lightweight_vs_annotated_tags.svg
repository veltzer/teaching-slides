<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="57.6" text-anchor="middle" font-size="34.1333" font-weight="bold">Lightweight vs Annotated Tags</text>
  <text x="320" y="144" text-anchor="middle" font-size="29.8667" font-weight="bold">Lightweight Tag</text>
  <rect x="106.6667" y="201.6" width="426.6667" height="172.8" fill="#3498db" rx="10.6667" />
  <text x="320" y="259.2" text-anchor="middle" fill="white" font-size="25.6">v1.0-beta</text>
  <text x="320" y="316.8" text-anchor="middle" fill="white" font-size="21.3333">→ commit a1b2c3d</text>
  <text x="960" y="144" text-anchor="middle" font-size="29.8667" font-weight="bold">Annotated Tag</text>
  <rect x="746.6667" y="201.6" width="426.6667" height="345.6" fill="#e74c3c" rx="10.6667" />
  <text x="960" y="259.2" text-anchor="middle" fill="white" font-size="25.6">v1.0.0</text>
  <text x="960" y="316.8" text-anchor="middle" fill="white" font-size="21.3333">Tag Object:</text>

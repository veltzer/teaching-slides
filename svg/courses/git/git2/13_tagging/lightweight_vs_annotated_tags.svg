<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="34.934912" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Lightweight vs Annotated Tags</text>
  <text x="280" y="120.449855" text-anchor="middle" font-size="30.568111" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Lightweight Tag</text>
  <rect x="40" y="174.082992" width="480" height="160.899411" fill="url(#grad-primary)" rx="5.979602" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="227.716029" text-anchor="middle" fill="var(--bg)" font-size="26.201309" font-family="Arial, sans-serif">v1.0-beta</text>
  <text x="280" y="281.349266" text-anchor="middle" fill="var(--bg)" font-size="21.834208" font-family="Arial, sans-serif">→ commit a1b2c3d</text>
  <text x="999.9999" y="120.449855" text-anchor="middle" font-size="30.568111" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Annotated Tag</text>
  <rect x="760" y="174.082992" width="480" height="321.798922" fill="url(#grad-danger)" rx="5.979602" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.9999" y="227.716029" text-anchor="middle" fill="var(--bg)" font-size="26.201309" font-family="Arial, sans-serif">v1.0.0</text>
  <text x="999.9999" y="281.349266" text-anchor="middle" fill="var(--bg)" font-size="21.834208" font-family="Arial, sans-serif">Tag Object:</text>
  <text x="999.9999" y="321.574094" text-anchor="middle" fill="var(--bg)" font-size="21.834208" font-family="Arial, sans-serif">- Message</text>
  <text x="999.9999" y="361.799022" text-anchor="middle" fill="var(--bg)" font-size="21.834208" font-family="Arial, sans-serif">- Tagger info</text>
  <text x="999.9999" y="402.02365" text-anchor="middle" fill="var(--bg)" font-size="21.834208" font-family="Arial, sans-serif">- Date/time</text>
  <text x="999.9999" y="442.248777" text-anchor="middle" fill="var(--bg)" font-size="21.834208" font-family="Arial, sans-serif">→ commit a1b2c3d</text>
  <rect x="596.331" y="532.66234" width="87.3376" height="87.33766" rx="14.000005" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="639.9999" y="589.739979" text-anchor="middle" fill="var(--bg)" font-size="21.834208" font-family="Arial, sans-serif">Commit</text>
  <line x1="280" y1="334.982503" x2="591.9999" y2="522.698433" stroke="var(--text)" stroke-width="2" stroke-dasharray="10.0947 10.0947"/>
  <line x1="999.9999" y1="495.881914" x2="688" y2="549.515051" stroke="var(--text)" stroke-width="2"/>
</svg>

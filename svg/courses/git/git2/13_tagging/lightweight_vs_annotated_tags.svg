<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="34.934912" font-weight="bold">Lightweight vs Annotated Tags</text>
  <text x="280" y="120.449855" text-anchor="middle" font-size="30.568111" font-weight="bold">Lightweight Tag</text>
  <rect x="40" y="174.082992" width="480" height="160.899411" fill="var(--primary-fill)" rx="5.979602" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="227.716029" text-anchor="middle" fill="var(--bg)" font-size="26.201309">v1.0-beta</text>
  <text x="280" y="281.349266" text-anchor="middle" fill="var(--bg)" font-size="21.834208">→ commit a1b2c3d</text>
  <text x="999.9999" y="120.449855" text-anchor="middle" font-size="30.568111" font-weight="bold">Annotated Tag</text>
  <rect x="760" y="174.082992" width="480" height="321.798922" fill="var(--danger-fill)" rx="5.979602" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.9999" y="227.716029" text-anchor="middle" fill="var(--bg)" font-size="26.201309">v1.0.0</text>
  <text x="999.9999" y="281.349266" text-anchor="middle" fill="var(--bg)" font-size="21.834208">Tag Object:</text>
  <text x="999.9999" y="321.574094" text-anchor="middle" fill="var(--bg)" font-size="21.834208">- Message</text>
  <text x="999.9999" y="361.799022" text-anchor="middle" fill="var(--bg)" font-size="21.834208">- Tagger info</text>
  <text x="999.9999" y="402.02365" text-anchor="middle" fill="var(--bg)" font-size="21.834208">- Date/time</text>
  <text x="999.9999" y="442.248777" text-anchor="middle" fill="var(--bg)" font-size="21.834208">→ commit a1b2c3d</text>
  <rect x="596.331" y="532.66234" width="87.3376" height="87.33766" rx="14.000005" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="639.9999" y="589.739979" text-anchor="middle" fill="var(--bg)" font-size="21.834208">Commit</text>
  <line x1="280" y1="334.982503" x2="591.9999" y2="522.698433" stroke="var(--text)" stroke-width="2" stroke-dasharray="10.0947 10.0947" />
  <line x1="999.9999" y1="495.881914" x2="688" y2="549.515051" stroke="var(--text)" stroke-width="2" />
</svg>
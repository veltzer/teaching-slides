<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="20" text-anchor="middle" font-size="16" font-weight="bold">Lightweight vs Annotated Tags</text>

  <!-- Lightweight tag -->
  <text x="150" y="50" text-anchor="middle" font-size="14" font-weight="bold">Lightweight Tag</text>
  <rect x="50" y="70" width="200" height="60" fill="#3498db" rx="5"/>
  <text x="150" y="90" text-anchor="middle" fill="white" font-size="12">v1.0-beta</text>
  <text x="150" y="110" text-anchor="middle" fill="white" font-size="10">→ commit a1b2c3d</text>

  <!-- Annotated tag -->
  <text x="450" y="50" text-anchor="middle" font-size="14" font-weight="bold">Annotated Tag</text>
  <rect x="350" y="70" width="200" height="120" fill="#e74c3c" rx="5"/>
  <text x="450" y="90" text-anchor="middle" fill="white" font-size="12">v1.0.0</text>
  <text x="450" y="110" text-anchor="middle" fill="white" font-size="10">Tag Object:</text>
  <text x="450" y="125" text-anchor="middle" fill="white" font-size="9">- Message</text>
  <text x="450" y="140" text-anchor="middle" fill="white" font-size="9">- Tagger info</text>
  <text x="450" y="155" text-anchor="middle" fill="white" font-size="9">- Date/time</text>
  <text x="450" y="170" text-anchor="middle" fill="white" font-size="9">→ commit a1b2c3d</text>

  <!-- Commit -->
  <circle cx="300" cy="220" r="20" fill="#2ecc71"/>
  <text x="300" y="225" text-anchor="middle" fill="white" font-size="10">Commit</text>

  <!-- Arrows -->
  <line x1="150" y1="130" x2="280" y2="200" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="450" y1="190" x2="320" y2="210" stroke="#333" stroke-width="2"/>
</svg>

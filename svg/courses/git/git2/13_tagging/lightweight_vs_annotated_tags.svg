  <text x="960" y="403.2" text-anchor="middle" fill="white" font-size="21.3333">- Tagger info</text>
  <text x="960" y="446.4" text-anchor="middle" fill="white" font-size="21.3333">- Date/time</text>
  <text x="960" y="489.6" text-anchor="middle" fill="white" font-size="21.3333">→ commit a1b2c3d</text>
  <circle cx="640" cy="633.6" r="42.6667" fill="#2ecc71" />
  <text x="640" y="648" text-anchor="middle" fill="white" font-size="21.3333">Commit</text>
  <line x1="320" y1="374.4" x2="597.3333" y2="576" stroke="#333" stroke-width="4.2667" stroke-dasharray="10.6667 10.6667" />
  <line x1="960" y1="547.2" x2="682.6667" y2="604.8" stroke="#333" stroke-width="4.2667" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="605.6782" y="54.511" text-anchor="middle" font-size="32.3028" font-weight="bold">Lightweight vs Annotated Tags</text>
  <text x="302.8391" y="136.2776" text-anchor="middle" font-size="28.265" font-weight="bold">Lightweight Tag</text>
  <rect x="100.9464" y="190.7886" width="403.7855" height="163.5331" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="302.8391" y="245.2997" text-anchor="middle" fill="var(--bg)" font-size="24.2271">v1.0-beta</text>
  <text x="302.8391" y="299.8107" text-anchor="middle" fill="var(--bg)" font-size="20.1892">→ commit a1b2c3d</text>
  <text x="908.5173" y="136.2776" text-anchor="middle" font-size="28.265" font-weight="bold">Annotated Tag</text>
  <rect x="706.6246" y="190.7886" width="403.7855" height="327.0662" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="908.5173" y="245.2997" text-anchor="middle" fill="var(--bg)" font-size="24.2271">v1.0.0</text>
  <text x="908.5173" y="299.8107" text-anchor="middle" fill="var(--bg)" font-size="20.1892">Tag Object:</text>
  <text x="908.5173" y="340.694" text-anchor="middle" fill="var(--bg)" font-size="20.1892">- Message</text>
  <text x="908.5173" y="381.5773" text-anchor="middle" fill="var(--bg)" font-size="20.1892">- Tagger info</text>
  <text x="908.5173" y="422.4605" text-anchor="middle" fill="var(--bg)" font-size="20.1892">- Date/time</text>
  <text x="908.5173" y="463.3438" text-anchor="middle" fill="var(--bg)" font-size="20.1892">→ commit a1b2c3d</text>
  <circle cx="605.6782" cy="599.6214" r="40.3786" fill="var(--ok-fill)" />
  <text x="605.6782" y="613.2492" text-anchor="middle" fill="var(--bg)" font-size="20.1892">Commit</text>
  <line x1="302.8391" y1="354.3217" x2="565.2996" y2="545.1104" stroke="var(--text)" stroke-width="2" stroke-dasharray="10.0947 10.0947" />
  <line x1="908.5173" y1="517.8549" x2="646.0568" y2="572.3659" stroke="var(--text)" stroke-width="2" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Git Stash Stack</text>

  <rect x="40" y="150" width="480" height="470" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="280" y="195" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Stash Stack (LIFO)</text>

  <rect x="80" y="220" width="400" height="110" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="258" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">stash@{0}</text>
  <text x="280" y="290" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">latest — top of stack</text>
  <text x="280" y="315" text-anchor="middle" font-size="15" fill="var(--primary-text)" font-family="Arial, sans-serif">git stash pop restores this</text>

  <rect x="80" y="345" width="400" height="110" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="383" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">stash@{1}</text>
  <text x="280" y="415" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">previous stash</text>
  <text x="280" y="440" text-anchor="middle" font-size="15" fill="var(--warn-text)" font-family="Arial, sans-serif">apply by name to restore</text>

  <rect x="80" y="470" width="400" height="110" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="508" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">stash@{2}</text>
  <text x="280" y="540" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">older stash</text>
  <text x="280" y="565" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">kept until dropped</text>

  <line x1="540" y1="275" x2="700" y2="275" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="260" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">pop / apply</text>
  <line x1="700" y1="495" x2="540" y2="495" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="480" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">push</text>

  <rect x="720" y="150" width="520" height="470" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="200" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Working Directory</text>
  <text x="980" y="240" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">modified + staged files</text>
  <text x="980" y="310" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">git stash push</text>
  <text x="980" y="335" text-anchor="middle" font-size="15" fill="var(--danger-text)" font-family="Arial, sans-serif">saves changes, resets to HEAD</text>
  <text x="980" y="390" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">git stash pop</text>
  <text x="980" y="415" text-anchor="middle" font-size="15" fill="var(--danger-text)" font-family="Arial, sans-serif">applies top entry, removes it</text>
  <text x="980" y="470" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">git stash apply stash@{N}</text>
  <text x="980" y="495" text-anchor="middle" font-size="15" fill="var(--danger-text)" font-family="Arial, sans-serif">applies entry, keeps it on stack</text>
  <text x="980" y="550" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">git stash drop / clear</text>
  <text x="980" y="575" text-anchor="middle" font-size="15" fill="var(--danger-text)" font-family="Arial, sans-serif">remove one / wipe all entries</text>

</svg>

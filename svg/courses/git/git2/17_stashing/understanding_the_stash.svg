<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">The Git Stash Stack</text>

  <rect x="40" y="150" width="480" height="470" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="280" y="195" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">Stash Stack (LIFO)</text>

  <rect x="80" y="220" width="400" height="110" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="258" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">stash@{0}</text>
  <text x="280" y="290" text-anchor="middle" font-size="18" fill="var(--primary-text)">latest — top of stack</text>
  <text x="280" y="315" text-anchor="middle" font-size="15" fill="var(--primary-text)">git stash pop restores this</text>

  <rect x="80" y="345" width="400" height="110" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="383" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)">stash@{1}</text>
  <text x="280" y="415" text-anchor="middle" font-size="18" fill="var(--warn-text)">previous stash</text>
  <text x="280" y="440" text-anchor="middle" font-size="15" fill="var(--warn-text)">apply by name to restore</text>

  <rect x="80" y="470" width="400" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="508" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)">stash@{2}</text>
  <text x="280" y="540" text-anchor="middle" font-size="18" fill="var(--ok-text)">older stash</text>
  <text x="280" y="565" text-anchor="middle" font-size="15" fill="var(--ok-text)">kept until dropped</text>

  <line x1="540" y1="275" x2="700" y2="275" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="260" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">pop / apply</text>
  <line x1="700" y1="495" x2="540" y2="495" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="480" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">push</text>

  <rect x="720" y="150" width="520" height="470" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="200" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--danger-text)">Working Directory</text>
  <text x="980" y="240" text-anchor="middle" font-size="18" fill="var(--danger-text)">modified + staged files</text>
  <text x="980" y="310" text-anchor="middle" font-size="18" fill="var(--danger-text)">git stash push</text>
  <text x="980" y="335" text-anchor="middle" font-size="15" fill="var(--danger-text)">saves changes, resets to HEAD</text>
  <text x="980" y="390" text-anchor="middle" font-size="18" fill="var(--danger-text)">git stash pop</text>
  <text x="980" y="415" text-anchor="middle" font-size="15" fill="var(--danger-text)">applies top entry, removes it</text>
  <text x="980" y="470" text-anchor="middle" font-size="18" fill="var(--danger-text)">git stash apply stash@{N}</text>
  <text x="980" y="495" text-anchor="middle" font-size="15" fill="var(--danger-text)">applies entry, keeps it on stack</text>
  <text x="980" y="550" text-anchor="middle" font-size="18" fill="var(--danger-text)">git stash drop / clear</text>
  <text x="980" y="575" text-anchor="middle" font-size="15" fill="var(--danger-text)">remove one / wipe all entries</text>

</svg>

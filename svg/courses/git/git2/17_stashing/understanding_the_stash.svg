<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="609.5238" y="45.7143" text-anchor="middle" font-size="32.5079" font-weight="bold">Git Stash Stack</ns0:text>
  <ns0:rect x="406.3492" y="114.2857" width="406.3492" height="91.4286" fill="#3498db" rx="10.1588" />
  <ns0:text x="609.5238" y="171.4286" text-anchor="middle" fill="white" font-size="24.381">stash@{0} - Latest stash</ns0:text>
  <ns0:rect x="406.3492" y="228.5714" width="406.3492" height="91.4286" fill="#e74c3c" rx="10.1588" />
  <ns0:text x="609.5238" y="285.7143" text-anchor="middle" fill="white" font-size="24.381">stash@{1} - Previous stash</ns0:text>
  <ns0:rect x="406.3492" y="342.8571" width="406.3492" height="91.4286" fill="#2ecc71" rx="10.1588" />
  <ns0:text x="609.5238" y="400" text-anchor="middle" fill="white" font-size="24.381">stash@{2} - Older stash</ns0:text>
  <ns0:text x="304.7619" y="171.4286" text-anchor="middle" font-size="24.381">← pop</ns0:text>
  <ns0:text x="914.2857" y="171.4286" text-anchor="middle" font-size="24.381">push →</ns0:text>
  <ns0:rect x="101.5873" y="502.8571" width="304.7619" height="137.1429" fill="#f39c12" rx="10.1588" />
  <ns0:text x="253.9683" y="560" text-anchor="middle" fill="white" font-size="24.381" font-weight="bold">Working Directory</ns0:text>
  <ns0:text x="253.9683" y="605.7143" text-anchor="middle" fill="white" font-size="20.3174">Modified files</ns0:text>
  <ns0:line x1="406.3492" y1="571.4286" x2="507.9365" y2="205.7143" stroke="#333" stroke-width="4.0635" stroke-dasharray="10.1588 10.1588" marker-end="url(#arrow)" />
  <ns0:text x="446.9841" y="388.5714" font-size="20.3174">apply/pop</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>

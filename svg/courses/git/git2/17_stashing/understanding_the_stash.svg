<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="48" text-anchor="middle" font-size="34.1333" font-weight="bold">Git Stash Stack</text>
  <rect x="426.6667" y="120" width="426.6667" height="96" fill="#3498db" rx="10.6667" />
  <text x="640" y="180" text-anchor="middle" fill="white" font-size="25.6">stash@{0} - Latest stash</text>
  <rect x="426.6667" y="240" width="426.6667" height="96" fill="#e74c3c" rx="10.6667" />
  <text x="640" y="300" text-anchor="middle" fill="white" font-size="25.6">stash@{1} - Previous stash</text>
  <rect x="426.6667" y="360" width="426.6667" height="96" fill="#2ecc71" rx="10.6667" />
  <text x="640" y="420" text-anchor="middle" fill="white" font-size="25.6">stash@{2} - Older stash</text>
  <text x="320" y="180" text-anchor="middle" font-size="25.6">← pop</text>
  <text x="960" y="180" text-anchor="middle" font-size="25.6">push →</text>
  <rect x="106.6667" y="528" width="320" height="144" fill="#f39c12" rx="10.6667" />
  <text x="266.6667" y="588" text-anchor="middle" fill="white" font-size="25.6" font-weight="bold">Working Directory</text>
  <text x="266.6667" y="636" text-anchor="middle" fill="white" font-size="21.3333">Modified files</text>
  <line x1="426.6667" y1="600" x2="533.3333" y2="216" stroke="#333" stroke-width="4.2667" stroke-dasharray="10.6667 10.6667" marker-end="url(#arrowhead)" />
  <text x="469.3333" y="408" font-size="21.3333">apply/pop</text>
  <defs>
    <marker id="arrowhead" markerWidth="21.3333" markerHeight="16.8" refX="19.2" refY="8.4" orient="auto">
      <polygon points="0,24 7.4667,0" fill="#333" />
    </marker>
  </defs>
</svg>
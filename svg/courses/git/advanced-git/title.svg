<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Advanced Git</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Rebasing, hooks, monorepos and recovery techniques</text>

  <!-- Branch lines -->
  <path d="M 200 350 L 1080 350" fill="none" stroke="var(--text-faint)" stroke-width="3"/>
  <path d="M 400 350 C 480 350 480 430 560 430 L 880 430 C 920 430 920 350 960 350" fill="none" stroke="var(--text-faint)" stroke-width="3"/>

  <!-- Commit nodes on main -->
  <rect x="180" y="332" width="36" height="36" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="380" y="332" width="36" height="36" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="560" y="332" width="36" height="36" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="740" y="332" width="36" height="36" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="940" y="332" width="36" height="36" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1060" y="332" width="36" height="36" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- Feature branch commits -->
  <rect x="560" y="412" width="36" height="36" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="700" y="412" width="36" height="36" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="840" y="412" width="36" height="36" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>

  <text x="180" y="500" font-family="Arial, sans-serif" font-size="18" fill="var(--surface)">main</text>
  <text x="540" y="490" font-family="Arial, sans-serif" font-size="18" fill="var(--surface)">feature branch</text>

  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--text-faint)">rebase · cherry-pick · bisect · hooks · worktrees · reflog</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="624.347826086957" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.273928827286" font-weight="bold" fill="var(--text)">Merge vs Rebase</text>

  <!-- MERGE side -->
  <text x="290.434782608696" y="92.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.979945251759" font-weight="bold" fill="var(--text-muted)">Merge: preserves history</text>

  <!-- main commits (left side) -->
  <rect x="40" y="166.545454545455" width="52.173913043478" height="42.181818181818" rx="6.293983575528" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.086956521739" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--primary-text)">A</text>
  <rect x="133.913043478261" y="166.545454545455" width="52.173913043478" height="42.181818181818" rx="6.293983575528" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--primary-text)">B</text>
  <rect x="227.826086956522" y="166.545454545455" width="52.173913043478" height="42.181818181818" rx="6.293983575528" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.913043478261" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--primary-text)">C</text>
  <rect x="415.652173913043" y="166.545454545455" width="52.173913043478" height="42.181818181818" rx="6.293983575528" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="441.739130434783" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--primary-text)">M</text>

  <path d="M 92.173913043478 187.636363636364 L 133.913043478261 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 186.086956521739 187.636363636364 L 227.826086956522 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 280 187.636363636364 L 415.652173913043 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="145.454545454545" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--text-muted)">main</text>

  <!-- feature branch -->
  <rect x="227.826086956522" y="272" width="52.173913043478" height="42.181818181818" rx="6.293983575528" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.913043478261" y="298.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--ok-text)">D</text>
  <rect x="321.739130434783" y="272" width="52.173913043478" height="42.181818181818" rx="6.293983575528" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="347.826086956522" y="298.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--ok-text)">E</text>

  <path d="M 253.913043478261 208.727272727273 L 253.913043478261 272" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 280 293.090909090909 L 321.739130434783 293.090909090909" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 373.913043478261 293.090909090909 Q 415.652173913043 293.090909090909 436.521739130435 208.727272727273" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="227.826086956522" y="345.818181818182" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--text-muted)">feature</text>

  <text x="248.695652173913" y="393.272727272727" font-family="Arial, sans-serif" font-size="13.636964413643" fill="var(--text-muted)">M = merge commit (two parents)</text>
  <text x="248.695652173913" y="414.363636363636" font-family="Arial, sans-serif" font-size="13.636964413643" fill="var(--text-muted)">history shows the branching</text>

  <!-- divider -->
  <line x1="624.347826086957" y1="82.181818181818" x2="624.347826086957" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- REBASE side -->
  <text x="958.260869565217" y="92.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.979945251759" font-weight="bold" fill="var(--text-muted)">Rebase: linear history</text>

  <rect x="686.95652173913" y="166.545454545455" width="52.173913043478" height="42.181818181818" rx="6.293983575528" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="713.04347826087" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--primary-text)">A</text>
  <rect x="780.869565217391" y="166.545454545455" width="52.173913043478" height="42.181818181818" rx="6.293983575528" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="806.95652173913" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--primary-text)">B</text>
  <rect x="874.782608695652" y="166.545454545455" width="52.173913043478" height="42.181818181818" rx="6.293983575528" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900.869565217391" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--primary-text)">C</text>
  <rect x="968.695652173913" y="166.545454545455" width="52.173913043478" height="42.181818181818" rx="6.293983575528" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="994.782608695652" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--info-text)">D'</text>
  <rect x="1062.608695652174" y="166.545454545455" width="52.173913043478" height="42.181818181818" rx="6.293983575528" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1088.695652173913" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--info-text)">E'</text>
  <rect x="1156.521739130435" y="166.545454545455" width="83.478260869565" height="42.181818181818" rx="6.293983575528" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1198.260869565217" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--info-text)">HEAD</text>

  <path d="M 739.130434782609 187.636363636364 L 780.869565217391 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 833.04347826087 187.636363636364 L 874.782608695652 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 926.95652173913 187.636363636364 L 968.695652173913 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1020.869565217391 187.636363636364 L 1062.608695652174 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1114.782608695652 187.636363636364 L 1156.521739130435 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="686.95652173913" y="145.454545454545" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--text-muted)">main</text>
  <text x="989.565217391304" y="145.454545454545" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--info-accent)">replayed feature</text>

  <text x="686.95652173913" y="272" font-family="Arial, sans-serif" font-size="13.636964413643" fill="var(--text-muted)">D' and E' are new commits — same diffs,</text>
  <text x="686.95652173913" y="293.090909090909" font-family="Arial, sans-serif" font-size="13.636964413643" fill="var(--text-muted)">different SHAs. Original D, E are abandoned.</text>
  <text x="686.95652173913" y="314.181818181818" font-family="Arial, sans-serif" font-size="13.636964413643" fill="var(--text-muted)">No merge commit. Linear log.</text>

  <!-- bottom summary -->
  <rect x="40" y="504" width="563.478260869565" height="105.454545454545" rx="6.293983575528" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="321.739130434783" y="533.527272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.783956201407" font-weight="bold" fill="var(--text)">Merge: true history, more commits</text>
  <text x="60.869565217391" y="565.163636363636" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--text-muted)">+ Records actual order of work</text>
  <text x="60.869565217391" y="590.472727272727" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--text-muted)">- Many merge commits clutter the log</text>

  <rect x="645.217391304348" y="504" width="563.478260869565" height="105.454545454545" rx="6.293983575528" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="926.95652173913" y="533.527272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.783956201407" font-weight="bold" fill="var(--text)">Rebase: clean history, rewritten</text>
  <text x="666.086956521739" y="565.163636363636" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--text-muted)">+ Linear, easy to read with bisect</text>
  <text x="666.086956521739" y="590.472727272727" font-family="Arial, sans-serif" font-size="14.685961676231" fill="var(--text-muted)">- Never rebase shared/published commits</text>
</svg>

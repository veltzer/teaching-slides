  <rect x="40" y="119.816513761468" width="85.714285714286" height="53.211009174312" rx="6.406909769273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857142857143" y="151.743119266055" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.881637833426" fill="var(--primary-text)">A</text>

  <rect x="168.571428571429" y="119.816513761468" width="85.714285714286" height="53.211009174312" rx="6.406909769273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.428571428571" y="151.743119266055" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.881637833426" fill="var(--primary-text)">B</text>

  <rect x="297.142857142857" y="119.816513761468" width="85.714285714286" height="53.211009174312" rx="6.406909769273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="146.422018348624" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.881637833426" fill="var(--ok-text)">C</text>
  <text x="340" y="164.51376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.746001243668" fill="var(--ok-text)">important!</text>


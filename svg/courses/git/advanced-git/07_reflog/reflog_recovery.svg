  <text x="468.571428571428" y="151.743119266055" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.881637833426" fill="var(--ok-text)">D</text>

  <rect x="554.285714285714" y="119.816513761468" width="85.714285714286" height="53.211009174312" rx="6.406909769273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="597.142857142857" y="151.743119266055" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.881637833426" fill="var(--ok-text)">E</text>

  <path d="M 125.714285714286 146.422018348624 L 168.571428571429 146.422018348624" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 254.285714285714 146.422018348624 L 297.142857142857 146.422018348624" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 382.857142857143 146.422018348624 L 425.714285714286 146.422018348624" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 511.428571428571 146.422018348624 L 554.285714285714 146.422018348624" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Disaster: reset hard -->
  <rect x="704.285714285714" y="109.174311926606" width="535.714285714286" height="74.495412844037" rx="6.406909769273" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="972.142857142857" y="138.97247706422" text-anchor="middle" font-family="Courier New, monospace" font-size="14.949456128305" fill="var(--danger-text)">$ git reset --hard B</text>
  <text x="972.142857142857" y="164.51376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.881637833426" fill="var(--danger-text)">C, D, E unreferenced (not deleted)</text>

  <!-- After reset -->
  <text x="40" y="236.880733944954" font-family="Arial, sans-serif" font-size="19.22072930782" font-weight="bold" fill="var(--text-muted)">After</text>

  <rect x="40" y="268.807339449541" width="85.714285714286" height="53.211009174312" rx="6.406909769273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857142857143" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.881637833426" fill="var(--primary-text)">A</text>

  <rect x="168.571428571429" y="268.807339449541" width="85.714285714286" height="53.211009174312" rx="6.406909769273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.428571428571" y="295.412844036697" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.881637833426" fill="var(--primary-text)">B</text>
  <text x="211.428571428571" y="313.504587155963" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.746001243668" fill="var(--primary-text)">HEAD</text>

  <rect x="297.142857142857" y="268.807339449541" width="85.714285714286" height="53.211009174312" rx="6.406909769273" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.5"/>
  <text x="340" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.881637833426" fill="var(--text-faint)">C</text>

  <rect x="425.714285714286" y="268.807339449541" width="85.714285714286" height="53.211009174312" rx="6.406909769273" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.5"/>
  <text x="468.571428571428" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.881637833426" fill="var(--text-faint)">D</text>

  <rect x="554.285714285714" y="268.807339449541" width="85.714285714286" height="53.211009174312" rx="6.406909769273" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.5"/>
  <text x="597.142857142857" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.881637833426" fill="var(--text-faint)">E</text>

  <path d="M 125.714285714286 295.412844036697 L 168.571428571429 295.412844036697" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="297.142857142857" y="353.94495412844" font-family="Arial, sans-serif" font-size="12.813819538547" fill="var(--text-faint)">unreachable, still in object database</text>

  <!-- Reflog rescue -->
  <rect x="40" y="407.155963302752" width="685.714285714286" height="212.844036697248" rx="6.406909769273" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="61.428571428571" y="439.082568807339" font-family="Courier New, monospace" font-size="14.949456128305" fill="var(--surface)">$ git reflog</text>
  <text x="61.428571428571" y="465.688073394495" font-family="Courier New, monospace" font-size="13.881637833426" fill="var(--text-faint)">b22f456 HEAD@{0}: reset to B</text>
  <text x="61.428571428571" y="490.165137614679" font-family="Courier New, monospace" font-size="13.881637833426" fill="var(--surface)">e51c789 HEAD@{1}: commit E (lost!)</text>
  <text x="61.428571428571" y="514.642201834862" font-family="Courier New, monospace" font-size="13.881637833426" fill="var(--text-faint)">d40b234 HEAD@{2}: D</text>
  <text x="61.428571428571" y="539.119266055046" font-family="Courier New, monospace" font-size="13.881637833426" fill="var(--text-faint)">c93a567 HEAD@{3}: C</text>
  <text x="61.428571428571" y="568.917431192661" font-family="Courier New, monospace" font-size="14.949456128305" fill="var(--surface)">$ git reset --hard HEAD@{1}</text>
  <text x="61.428571428571" y="596.587155963303" font-family="Courier New, monospace" font-size="14.949456128305" fill="var(--ok-text)">recovered!</text>

  <!-- right panel facts -->
  <rect x="768.571428571429" y="236.880733944954" width="471.428571428571" height="383.119266055046" rx="6.406909769273" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1004.285714285714" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.22072930782" font-weight="bold" fill="var(--text)">Reflog facts</text>

  <text x="790" y="316.697247706422" font-family="Arial, sans-serif" font-size="14.949456128305" fill="var(--text)">- Records HEAD movements</text>
  <text x="790" y="346.495412844037" font-family="Arial, sans-serif" font-size="14.949456128305" fill="var(--text)">- Per-branch reflog</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_hooks" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <line x1="58.0499" y1="326.5306" x2="1102.9478" y2="326.5306" stroke="var(--border)" stroke-width="2" marker-end="url(#arr_hooks)" />
  <text x="580.4989" y="640" text-anchor="middle" font-size="19.3499" fill="var(--text-faint)">Workflow Timeline: commit → push → receive</text>
  <rect x="58.0499" y="26.1224" width="483.749" height="65.3061" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <text x="299.9244" y="71.8367" text-anchor="middle" font-size="21.285" font-weight="bold" fill="var(--primary-accent)">Client-side Hooks</text>
  <rect x="67.7249" y="124.0816" width="193.4996" height="156.7347" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="164.4746" y="179.5918" text-anchor="middle" font-size="19.3499" font-weight="bold" fill="var(--primary-accent)">pre-commit</text>
  <text x="164.4746" y="222.0408" text-anchor="middle" font-size="19.3499" fill="var(--text-muted)">lint, test, format</text>
  <circle cx="164.4746" cy="326.5306" r="7.74" fill="var(--primary-accent)" />
  <rect x="280.5744" y="124.0816" width="193.4996" height="156.7347" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="377.3243" y="169.7959" text-anchor="middle" font-size="19.3499" font-weight="bold" fill="var(--primary-accent)">prepare-</text>
  <text x="377.3243" y="205.7143" text-anchor="middle" font-size="19.3499" font-weight="bold" fill="var(--primary-accent)">commit-msg</text>
  <text x="377.3243" y="248.1633" text-anchor="middle" font-size="19.3499" fill="var(--text-muted)">template msg</text>
  <circle cx="377.3243" cy="326.5306" r="7.74" fill="var(--primary-accent)" />
  <rect x="493.424" y="359.1837" width="174.1497" height="130.6122" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="580.4989" y="414.6939" text-anchor="middle" font-size="19.3499" font-weight="bold" fill="var(--info-accent)">commit-msg</text>
  <text x="580.4989" y="457.1429" text-anchor="middle" font-size="19.3499" fill="var(--text-muted)">validate msg</text>
  <circle cx="580.4989" cy="326.5306" r="7.74" fill="var(--info-fill)" />
  <rect x="686.9236" y="359.1837" width="174.1497" height="130.6122" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="773.9985" y="414.6939" text-anchor="middle" font-size="19.3499" font-weight="bold" fill="var(--warn-accent)">post-commit</text>
  <text x="773.9985" y="457.1429" text-anchor="middle" font-size="19.3499" fill="var(--text-muted)">notify</text>
  <circle cx="773.9985" cy="326.5306" r="7.74" fill="var(--warn-accent)" />
  <rect x="870.7483" y="26.1224" width="270.8995" height="65.3061" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="1006.198" y="71.8367" text-anchor="middle" font-size="21.285" font-weight="bold" fill="var(--ok-accent)">Server-side Hooks</text>
  <rect x="880.4233" y="124.0816" width="164.4746" height="156.7347" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="961.6932" y="179.5918" text-anchor="middle" font-size="19.3499" font-weight="bold" fill="var(--ok-accent)">pre-receive</text>
  <text x="961.6932" y="222.0408" text-anchor="middle" font-size="19.3499" fill="var(--text-muted)">policy check</text>
  <circle cx="961.6932" cy="326.5306" r="7.74" fill="var(--ok-accent)" />
  <rect x="880.4233" y="359.1837" width="164.4746" height="130.6122" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="961.6932" y="414.6939" text-anchor="middle" font-size="19.3499" font-weight="bold" fill="var(--ok-accent)">update</text>
  <text x="961.6932" y="457.1429" text-anchor="middle" font-size="19.3499" fill="var(--text-muted)">per-ref check</text>
  <rect x="880.4233" y="506.1224" width="164.4746" height="114.2857" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="961.6932" y="561.6327" text-anchor="middle" font-size="19.3499" font-weight="bold" fill="var(--ok-accent)">post-receive</text>
  <text x="961.6932" y="600.8163" text-anchor="middle" font-size="19.3499" fill="var(--text-muted)">CI/CD trigger</text>
  <line x1="861.0733" y1="16.3265" x2="861.0733" y2="620.4082" stroke="var(--border)" stroke-width="1.935" stroke-dasharray="9.675 5.805" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_hooks" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <line x1="40" y1="328.4817" x2="1197.1428" y2="328.4817" stroke="var(--border)" stroke-width="2" marker-end="url(#arr_hooks)" />
  <text x="618.5714" y="620" text-anchor="middle" font-size="19.6368" fill="var(--text-faint)">Workflow Timeline: commit → push → receive</text>
  <rect x="40" y="49.1099" width="535.7142" height="60.733" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <text x="307.8571" y="91.623" text-anchor="middle" font-size="21.6006" font-weight="bold" fill="var(--primary-accent)">Client-side Hooks</text>
  <rect x="50.7143" y="140.2094" width="214.2857" height="145.7592" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="157.857" y="191.8324" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--primary-accent)">pre-commit</text>
  <text x="157.857" y="231.3089" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)">lint, test, format</text>
  <circle cx="157.857" cy="328.4817" r="7.8548" fill="var(--primary-accent)" />
  <rect x="286.4285" y="140.2094" width="214.2857" height="145.7592" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="393.5714" y="182.7225" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--primary-accent)">prepare-</text>
  <text x="393.5714" y="216.1257" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--primary-accent)">commit-msg</text>
  <text x="393.5714" y="255.6021" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)">template msg</text>
  <circle cx="393.5714" cy="328.4817" r="7.8548" fill="var(--primary-accent)" />
  <rect x="522.1428" y="358.8482" width="192.8572" height="121.4659" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="618.5714" y="410.4712" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--info-accent)">commit-msg</text>
  <text x="618.5714" y="449.9477" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)">validate msg</text>
  <circle cx="618.5714" cy="328.4817" r="7.8548" fill="var(--info-fill)" />
  <rect x="736.4285" y="358.8482" width="192.8572" height="121.4659" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="832.8571" y="410.4712" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--warn-accent)">post-commit</text>
  <text x="832.8571" y="449.9477" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)">notify</text>
  <circle cx="832.8571" cy="328.4817" r="7.8548" fill="var(--warn-accent)" />
  <rect x="940" y="49.1099" width="300" height="60.733" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="1089.9999" y="91.623" text-anchor="middle" font-size="21.6006" font-weight="bold" fill="var(--ok-accent)">Server-side Hooks</text>
  <rect x="950.7143" y="140.2094" width="182.1428" height="145.7592" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1040.7143" y="191.8324" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--ok-accent)">pre-receive</text>
  <text x="1040.7143" y="231.3089" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)">policy check</text>
  <circle cx="1040.7143" cy="328.4817" r="7.8548" fill="var(--ok-accent)" />
  <rect x="950.7143" y="358.8482" width="182.1428" height="121.4659" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1040.7143" y="410.4712" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--ok-accent)">update</text>
  <text x="1040.7143" y="449.9477" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)">per-ref check</text>
  <rect x="950.7143" y="495.4973" width="182.1428" height="106.2827" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1040.7143" y="547.1205" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--ok-accent)">post-receive</text>
  <text x="1040.7143" y="583.5602" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)">CI/CD trigger</text>
  <line x1="929.2857" y1="40" x2="929.2857" y2="601.7801" stroke="var(--border)" stroke-width="1.935" stroke-dasharray="9.675 5.805" />
</svg>
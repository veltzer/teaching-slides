<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="56.1111" width="248.2759" height="177.2223" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="164.1379" y="114.1111" text-anchor="middle" font-size="21.8638" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Commit</text>
  <text x="164.1379" y="159.2222" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)" font-family="Arial, sans-serif">a1b2c3d</text>
  <text x="164.1379" y="204.3333" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)" font-family="Arial, sans-serif">tree: f4e5d6a</text>
  <rect x="433.1034" y="56.1111" width="248.2759" height="177.2223" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="557.2414" y="114.1111" text-anchor="middle" font-size="21.8638" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Tree</text>
  <text x="557.2414" y="159.2222" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)" font-family="Arial, sans-serif">f4e5d6a</text>
  <text x="557.2414" y="204.3333" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)" font-family="Arial, sans-serif">entries: 3</text>
  <line x1="288.2759" y1="143.1111" x2="428.9655" y2="143.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="826.2069" y="40" width="227.5862" height="128.8889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="939.9999" y="88.3333" text-anchor="middle" font-size="19.8762" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Blob</text>
  <text x="939.9999" y="133.4444" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)" font-family="Arial, sans-serif">README.md</text>
  <rect x="826.2069" y="201.1111" width="227.5862" height="128.8889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="939.9999" y="249.4445" text-anchor="middle" font-size="19.8762" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Blob</text>
  <text x="939.9999" y="294.5556" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)" font-family="Arial, sans-serif">main.py</text>
  <rect x="826.2069" y="362.2222" width="227.5862" height="128.8889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="939.9999" y="410.5555" text-anchor="middle" font-size="19.8762" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Tree</text>
  <text x="939.9999" y="455.6667" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)" font-family="Arial, sans-serif">src/</text>
  <line x1="681.3793" y1="120.5556" x2="822.069" y2="104.4445" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="681.3793" y1="152.7778" x2="822.069" y2="255.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="681.3793" y1="185" x2="822.069" y2="417" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1095.1724" y="442.7777" width="144.8276" height="112.7778" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1167.5863" y="491.1111" text-anchor="middle" font-size="19.8762" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Blob</text>
  <text x="1167.5863" y="533" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)" font-family="Arial, sans-serif">util.py</text>
  <line x1="1053.7932" y1="442.7777" x2="1091.0346" y2="491.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="410.5555" width="248.2759" height="145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="164.1379" y="468.5555" text-anchor="middle" font-size="19.8762" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Parent Commit</text>
  <text x="164.1379" y="523.3333" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)" font-family="Arial, sans-serif">9f8e7d6</text>
  <line x1="164.1379" y1="233.3334" x2="164.1379" y2="404.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="433.1034" y="620" font-size="19.8762" fill="var(--text-muted)" font-family="Arial, sans-serif">Git Object Model: Commit → Tree → Blobs/Trees</text>
</svg>

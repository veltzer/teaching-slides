<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_internals" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="56.1111" width="248.2759" height="177.2223" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="164.1379" y="114.1111" text-anchor="middle" font-size="21.8638" font-weight="bold" fill="var(--warn-accent)">Commit</text>
  <text x="164.1379" y="159.2222" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)">a1b2c3d</text>
  <text x="164.1379" y="204.3333" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)">tree: f4e5d6a</text>
  <rect x="433.1034" y="56.1111" width="248.2759" height="177.2223" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="557.2414" y="114.1111" text-anchor="middle" font-size="21.8638" font-weight="bold" fill="var(--ok-accent)">Tree</text>
  <text x="557.2414" y="159.2222" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)">f4e5d6a</text>
  <text x="557.2414" y="204.3333" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)">entries: 3</text>
  <line x1="288.2759" y1="143.1111" x2="428.9655" y2="143.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr_internals)" />
  <rect x="826.2069" y="40" width="227.5862" height="128.8889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="939.9999" y="88.3333" text-anchor="middle" font-size="19.8762" font-weight="bold" fill="var(--primary-accent)">Blob</text>
  <text x="939.9999" y="133.4444" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)">README.md</text>
  <rect x="826.2069" y="201.1111" width="227.5862" height="128.8889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="939.9999" y="249.4445" text-anchor="middle" font-size="19.8762" font-weight="bold" fill="var(--primary-accent)">Blob</text>
  <text x="939.9999" y="294.5556" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)">main.py</text>
  <rect x="826.2069" y="362.2222" width="227.5862" height="128.8889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="939.9999" y="410.5555" text-anchor="middle" font-size="19.8762" font-weight="bold" fill="var(--ok-accent)">Tree</text>
  <text x="939.9999" y="455.6667" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)">src/</text>
  <line x1="681.3793" y1="120.5556" x2="822.069" y2="104.4445" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr_internals)" />
  <line x1="681.3793" y1="152.7778" x2="822.069" y2="255.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr_internals)" />
  <line x1="681.3793" y1="185" x2="822.069" y2="417" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr_internals)" />
  <rect x="1095.1724" y="442.7777" width="144.8276" height="112.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1167.5863" y="491.1111" text-anchor="middle" font-size="19.8762" font-weight="bold" fill="var(--primary-accent)">Blob</text>
  <text x="1167.5863" y="533" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)">util.py</text>
  <line x1="1053.7932" y1="442.7777" x2="1091.0346" y2="491.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr_internals)" />
  <rect x="40" y="410.5555" width="248.2759" height="145" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="164.1379" y="468.5555" text-anchor="middle" font-size="19.8762" font-weight="bold" fill="var(--warn-accent)">Parent Commit</text>
  <text x="164.1379" y="523.3333" text-anchor="middle" font-size="19.8762" fill="var(--text-muted)">9f8e7d6</text>
  <line x1="164.1379" y1="233.3334" x2="164.1379" y2="404.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr_internals)" />
  <text x="433.1034" y="620" font-size="19.8762" fill="var(--text-muted)">Git Object Model: Commit → Tree → Blobs/Trees</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_internals" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="20.5005" y="34.5946" width="246.006" height="190.2703" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="143.5035" y="96.8649" text-anchor="middle" font-size="22.5506" font-weight="bold" fill="var(--warn-accent)">Commit</text>
  <text x="143.5035" y="145.2973" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">a1b2c3d</text>
  <text x="143.5035" y="193.7297" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">tree: f4e5d6a</text>
  <rect x="410.01" y="34.5946" width="246.006" height="190.2703" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="533.013" y="96.8649" text-anchor="middle" font-size="22.5506" font-weight="bold" fill="var(--ok-accent)">Tree</text>
  <text x="533.013" y="145.2973" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">f4e5d6a</text>
  <text x="533.013" y="193.7297" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">entries: 3</text>
  <line x1="266.5065" y1="128" x2="405.9099" y2="128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr_internals)" />
  <rect x="799.5195" y="17.2973" width="225.5055" height="138.3784" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="912.2722" y="69.1892" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="var(--primary-accent)">Blob</text>
  <text x="912.2722" y="117.6216" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">README.md</text>
  <rect x="799.5195" y="190.2703" width="225.5055" height="138.3784" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="912.2722" y="242.1622" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="var(--primary-accent)">Blob</text>
  <text x="912.2722" y="290.5946" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">main.py</text>
  <rect x="799.5195" y="363.2432" width="225.5055" height="138.3784" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="912.2722" y="415.1351" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="var(--ok-accent)">Tree</text>
  <text x="912.2722" y="463.5676" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">src/</text>
  <line x1="656.016" y1="103.7838" x2="795.4194" y2="86.4865" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr_internals)" />
  <line x1="656.016" y1="138.3784" x2="795.4194" y2="249.0811" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr_internals)" />
  <line x1="656.016" y1="172.973" x2="795.4194" y2="422.0541" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr_internals)" />
  <rect x="1066.026" y="449.7297" width="143.5035" height="121.0811" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1137.7778" y="501.6216" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="var(--primary-accent)">Blob</text>
  <text x="1137.7778" y="546.5946" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">util.py</text>
  <line x1="1025.0251" y1="449.7297" x2="1061.926" y2="501.6216" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr_internals)" />
  <rect x="20.5005" y="415.1351" width="246.006" height="155.6757" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="143.5035" y="477.4054" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="var(--warn-accent)">Parent Commit</text>
  <text x="143.5035" y="536.2162" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">9f8e7d6</text>
  <line x1="143.5035" y1="224.8649" x2="143.5035" y2="408.2162" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr_internals)" />
  <text x="410.01" y="640" font-size="20.5005" fill="var(--text-muted)">Git Object Model: Commit → Tree → Blobs/Trees</text>
</svg>
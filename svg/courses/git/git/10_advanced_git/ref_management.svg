<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_refs" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="29.9415" y="84.2105" width="149.7076" height="107.7895" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="103.7972" y="154.9474" text-anchor="middle" font-size="23.9532" font-weight="bold" fill="var(--warn-accent)">HEAD</text>
  <line x1="179.6491" y1="138.1053" x2="275.462" y2="138.1053" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr_refs)" />
  <rect x="279.4542" y="67.3684" width="279.4542" height="141.4737" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="419.1813" y="124.6316" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--primary-accent)">refs/heads/main</text>
  <text x="419.1813" y="175.1579" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">a1b2c3d4e5f6</text>
  <line x1="558.9084" y1="138.1053" x2="734.5653" y2="138.1053" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr_refs)" />
  <rect x="738.5575" y="67.3684" width="239.5322" height="141.4737" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="858.3236" y="124.6316" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--text)">Commit</text>
  <text x="858.3236" y="175.1579" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">a1b2c3d4e5f6</text>
  <rect x="279.4542" y="252.6316" width="279.4542" height="141.4737" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="419.1813" y="309.8947" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--info-accent)">refs/tags/v1.0</text>
  <text x="419.1813" y="360.4211" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">7a8b9c0d1e2f</text>
  <line x1="558.9084" y1="323.3684" x2="734.5653" y2="185.2632" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="9.9805 5.9883" marker-end="url(#arr_refs)" />
  <rect x="279.4542" y="437.8947" width="279.4542" height="141.4737" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="419.1813" y="495.1579" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--ok-accent)">refs/remotes/</text>
  <text x="419.1813" y="542.3158" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--ok-accent)">origin/main</text>
  <line x1="558.9084" y1="508.6316" x2="734.5653" y2="185.2632" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="9.9805 5.9883" marker-end="url(#arr_refs)" />
  <rect x="998.0507" y="235.7895" width="179.6491" height="404.2105" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1087.8753" y="289.6842" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--text)">.git/refs/</text>
  <text x="1037.9727" y="343.5789" font-size="19.961" fill="var(--primary-accent)">heads/</text>
  <text x="1057.9338" y="387.3684" font-size="19.961" fill="var(--text-muted)">main</text>
  <text x="1037.9727" y="444.6316" font-size="19.961" fill="var(--info-accent)">tags/</text>
  <text x="1057.9338" y="488.4211" font-size="19.961" fill="var(--text-muted)">v1.0</text>
  <text x="1037.9727" y="545.6842" font-size="19.961" fill="var(--ok-accent)">remotes/</text>
  <text x="1057.9338" y="589.4737" font-size="19.961" fill="var(--text-muted)">origin/main</text>
</svg>
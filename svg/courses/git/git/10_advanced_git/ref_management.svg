<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="57.0588" width="156.5217" height="109.1765" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="117.2173" y="128.7059" text-anchor="middle" font-size="24.6493" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">HEAD</text>
  <line x1="196.5217" y1="111.6471" x2="296.6957" y2="111.6471" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="300.8696" y="40" width="292.1739" height="143.2941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="446.9566" y="98" text-anchor="middle" font-size="20.5411" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">refs/heads/main</text>
  <text x="446.9566" y="149.1765" text-anchor="middle" font-size="20.5411" fill="var(--text-muted)" font-family="Arial, sans-serif">a1b2c3d4e5f6</text>
  <line x1="593.0435" y1="111.6471" x2="776.6957" y2="111.6471" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="780.8696" y="40" width="250.4348" height="143.2941" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="906.087" y="98" text-anchor="middle" font-size="20.5411" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Commit</text>
  <text x="906.087" y="149.1765" text-anchor="middle" font-size="20.5411" fill="var(--text-muted)" font-family="Arial, sans-serif">a1b2c3d4e5f6</text>
  <rect x="300.8696" y="227.6471" width="292.1739" height="143.2941" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="446.9566" y="285.647" text-anchor="middle" font-size="20.5411" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">refs/tags/v1.0</text>
  <text x="446.9566" y="336.8236" text-anchor="middle" font-size="20.5411" fill="var(--text-muted)" font-family="Arial, sans-serif">7a8b9c0d1e2f</text>
  <line x1="593.0435" y1="299.2941" x2="776.6957" y2="159.4118" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="9.9805 5.9883" marker-end="url(#arrow)" />
  <rect x="300.8696" y="415.2941" width="292.1739" height="143.2941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="446.9566" y="473.2941" text-anchor="middle" font-size="20.5411" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">refs/remotes/</text>
  <text x="446.9566" y="521.0588" text-anchor="middle" font-size="20.5411" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">origin/main</text>
  <line x1="593.0435" y1="486.9412" x2="776.6957" y2="159.4118" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="9.9805 5.9883" marker-end="url(#arrow)" />
  <rect x="1052.1739" y="210.5883" width="187.8261" height="409.4117" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1146.087" y="265.1765" text-anchor="middle" font-size="20.5411" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">.git/refs/</text>
  <text x="1093.913" y="319.7647" font-size="20.5411" fill="var(--primary-accent)" font-family="Arial, sans-serif">heads/</text>
  <text x="1114.7827" y="364.1176" font-size="20.5411" fill="var(--text-muted)" font-family="Arial, sans-serif">main</text>
  <text x="1093.913" y="422.1177" font-size="20.5411" fill="var(--info-accent)" font-family="Arial, sans-serif">tags/</text>
  <text x="1114.7827" y="466.4706" font-size="20.5411" fill="var(--text-muted)" font-family="Arial, sans-serif">v1.0</text>
  <text x="1093.913" y="524.4706" font-size="20.5411" fill="var(--ok-accent)" font-family="Arial, sans-serif">remotes/</text>
  <text x="1114.7827" y="568.8235" font-size="20.5411" fill="var(--text-muted)" font-family="Arial, sans-serif">origin/main</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_refs" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="57.0588" width="156.5217" height="109.1765" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="117.2173" y="128.7059" text-anchor="middle" font-size="24.6493" font-weight="bold" fill="var(--warn-accent)">HEAD</text>
  <line x1="196.5217" y1="111.6471" x2="296.6957" y2="111.6471" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr_refs)" />
  <rect x="300.8696" y="40" width="292.1739" height="143.2941" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="446.9566" y="98" text-anchor="middle" font-size="20.5411" font-weight="bold" fill="var(--primary-accent)">refs/heads/main</text>
  <text x="446.9566" y="149.1765" text-anchor="middle" font-size="20.5411" fill="var(--text-muted)">a1b2c3d4e5f6</text>
  <line x1="593.0435" y1="111.6471" x2="776.6957" y2="111.6471" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr_refs)" />
  <rect x="780.8696" y="40" width="250.4348" height="143.2941" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="906.087" y="98" text-anchor="middle" font-size="20.5411" font-weight="bold" fill="var(--text)">Commit</text>
  <text x="906.087" y="149.1765" text-anchor="middle" font-size="20.5411" fill="var(--text-muted)">a1b2c3d4e5f6</text>
  <rect x="300.8696" y="227.6471" width="292.1739" height="143.2941" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="446.9566" y="285.647" text-anchor="middle" font-size="20.5411" font-weight="bold" fill="var(--info-accent)">refs/tags/v1.0</text>
  <text x="446.9566" y="336.8236" text-anchor="middle" font-size="20.5411" fill="var(--text-muted)">7a8b9c0d1e2f</text>
  <line x1="593.0435" y1="299.2941" x2="776.6957" y2="159.4118" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="9.9805 5.9883" marker-end="url(#arr_refs)" />
  <rect x="300.8696" y="415.2941" width="292.1739" height="143.2941" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="446.9566" y="473.2941" text-anchor="middle" font-size="20.5411" font-weight="bold" fill="var(--ok-accent)">refs/remotes/</text>
  <text x="446.9566" y="521.0588" text-anchor="middle" font-size="20.5411" font-weight="bold" fill="var(--ok-accent)">origin/main</text>
  <line x1="593.0435" y1="486.9412" x2="776.6957" y2="159.4118" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="9.9805 5.9883" marker-end="url(#arr_refs)" />
  <rect x="1052.1739" y="210.5883" width="187.8261" height="409.4117" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1146.087" y="265.1765" text-anchor="middle" font-size="20.5411" font-weight="bold" fill="var(--text)">.git/refs/</text>
  <text x="1093.913" y="319.7647" font-size="20.5411" fill="var(--primary-accent)">heads/</text>
  <text x="1114.7827" y="364.1176" font-size="20.5411" fill="var(--text-muted)">main</text>
  <text x="1093.913" y="422.1177" font-size="20.5411" fill="var(--info-accent)">tags/</text>
  <text x="1114.7827" y="466.4706" font-size="20.5411" fill="var(--text-muted)">v1.0</text>
  <text x="1093.913" y="524.4706" font-size="20.5411" fill="var(--ok-accent)">remotes/</text>
  <text x="1114.7827" y="568.8235" font-size="20.5411" fill="var(--text-muted)">origin/main</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arr_core" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#888" />
    </marker>
  </defs>
  <rect x="64" y="316.8" width="1152" height="86.4" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2.1333" rx="25.6" />
  <text x="640" y="378" text-anchor="middle" font-size="21.3333" fill="#777" font-style="italic">Unified by immutable, hash-based object storage</text>
  <rect x="64" y="54" width="341.3333" height="216" fill="#e3f2fd" stroke="#1565c0" stroke-width="4.2667" rx="17.0667" />
  <text x="234.6667" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="#1565c0">Snapshots</text>
  <text x="234.6667" y="180" text-anchor="middle" font-size="21.3333" fill="#555">not Diffs</text>
  <text x="234.6667" y="234" text-anchor="middle" font-size="21.3333" fill="#888">Full state per commit</text>
  <rect x="106.6667" y="79.2" width="25.6" height="32.4" fill="none" stroke="#1565c0" stroke-width="3.2" rx="4.2667" />
  <circle cx="119.4667" cy="97.2" r="6.4" fill="none" stroke="#1565c0" stroke-width="2.1333" />
  <rect x="469.3333" y="54" width="341.3333" height="216" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="4.2667" rx="17.0667" />
  <text x="640" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="#7b1fa2">Content-Addressable</text>
  <text x="640" y="180" text-anchor="middle" font-size="21.3333" fill="#555">Store</text>
  <text x="640" y="234" text-anchor="middle" font-size="21.3333" fill="#888">SHA-1 identifies data</text>
  <text x="505.6" y="126" font-size="27.7333" fill="#7b1fa2">#</text>
  <rect x="874.6667" y="54" width="341.3333" height="216" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="17.0667" />
  <text x="1045.3333" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="#2e7d32">Directed Acyclic</text>
  <text x="1045.3333" y="180" text-anchor="middle" font-size="21.3333" fill="#555">Graph</text>
  <text x="1045.3333" y="234" text-anchor="middle" font-size="21.3333" fill="#888">History as a DAG</text>
  <circle cx="913.0667" cy="100.8" r="8.5333" fill="#2e7d32" />
  <circle cx="938.6667" cy="79.2" r="8.5333" fill="#2e7d32" />
  <circle cx="938.6667" cy="122.4" r="8.5333" fill="#2e7d32" />
  <line x1="921.6" y1="97.2" x2="932.2667" y2="82.8" stroke="#2e7d32" stroke-width="3.2" />
  <line x1="921.6" y1="104.4" x2="932.2667" y2="118.8" stroke="#2e7d32" stroke-width="3.2" />
  <line x1="234.6667" y1="270" x2="234.6667" y2="316.8" stroke="#1565c0" stroke-width="3.2" stroke-dasharray="8.5333 4.2667" />
  <line x1="640" y1="270" x2="640" y2="316.8" stroke="#7b1fa2" stroke-width="3.2" stroke-dasharray="8.5333 4.2667" />
  <line x1="1045.3333" y1="270" x2="1045.3333" y2="316.8" stroke="#2e7d32" stroke-width="3.2" stroke-dasharray="8.5333 4.2667" />
  <text x="234.6667" y="486" text-anchor="middle" font-size="21.3333" fill="#1565c0">Each commit stores</text>
  <text x="234.6667" y="529.2" text-anchor="middle" font-size="21.3333" fill="#1565c0">a complete tree</text>
  <text x="640" y="486" text-anchor="middle" font-size="21.3333" fill="#7b1fa2">Same content =</text>
  <text x="640" y="529.2" text-anchor="middle" font-size="21.3333" fill="#7b1fa2">same hash always</text>
  <text x="1045.3333" y="486" text-anchor="middle" font-size="21.3333" fill="#2e7d32">Commits point to</text>
  <text x="1045.3333" y="529.2" text-anchor="middle" font-size="21.3333" fill="#2e7d32">parent commits</text>
  <line x1="405.3333" y1="162" x2="465.0667" y2="162" stroke="#888" stroke-width="3.2" marker-end="url(#arr_core)" />
  <line x1="810.6667" y1="162" x2="870.4" y2="162" stroke="#888" stroke-width="3.2" marker-end="url(#arr_core)" />
</svg>
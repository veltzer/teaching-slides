<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="360.7576" width="1200" height="105.4545" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="435.4545" text-anchor="middle" font-size="24.0546" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">Unified by immutable, hash-based object storage</text>
  <rect x="40" y="40" width="355.5555" height="263.6364" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="217.7778" y="127.8788" text-anchor="middle" font-size="26.4601" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Snapshots</text>
  <text x="217.7778" y="193.7879" text-anchor="middle" font-size="24.0546" fill="var(--text-muted)" font-family="Arial, sans-serif">not Diffs</text>
  <text x="217.7778" y="259.697" text-anchor="middle" font-size="24.0546" fill="var(--text-faint)" font-family="Arial, sans-serif">Full state per commit</text>
  <rect x="84.4445" y="70.7576" width="26.6667" height="39.5455" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="90.5614" y="85.5109" width="14.4328" height="14.4328" rx="7.2164" fill="none" stroke="var(--primary-border)" stroke-width="2.1333"/>
  <rect x="462.2222" y="40" width="355.5555" height="263.6364" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="127.8788" text-anchor="middle" font-size="26.4601" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Content-Addressable</text>
  <text x="640" y="193.7879" text-anchor="middle" font-size="24.0546" fill="var(--text-muted)" font-family="Arial, sans-serif">Store</text>
  <text x="640" y="259.697" text-anchor="middle" font-size="24.0546" fill="var(--text-faint)" font-family="Arial, sans-serif">SHA-1 identifies data</text>
  <text x="500" y="127.8788" font-size="31.271" fill="var(--info-accent)" font-family="Arial, sans-serif">#</text>
  <rect x="884.4445" y="40" width="355.5555" height="263.6364" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1062.2222" y="127.8788" text-anchor="middle" font-size="26.4601" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Directed Acyclic</text>
  <text x="1062.2222" y="193.7879" text-anchor="middle" font-size="24.0546" fill="var(--text-muted)" font-family="Arial, sans-serif">Graph</text>
  <text x="1062.2222" y="259.697" text-anchor="middle" font-size="24.0546" fill="var(--text-faint)" font-family="Arial, sans-serif">History as a DAG</text>
  <rect x="914.823" y="87.4994" width="19.2436" height="19.2436" rx="9.6218" fill="var(--ok-accent)"/>
  <rect x="941.489" y="61.1358" width="19.2436" height="19.2436" rx="9.6218" fill="var(--ok-accent)"/>
  <rect x="941.489" y="113.863" width="19.2436" height="19.2436" rx="9.6218" fill="var(--ok-accent)"/>
  <line x1="933.3333" y1="92.7273" x2="944.4445" y2="75.1515" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="933.3333" y1="101.5152" x2="944.4445" y2="119.0909" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="217.7778" y1="303.6364" x2="217.7778" y2="360.7576" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.5333 4.2667"/>
  <line x1="640" y1="303.6364" x2="640" y2="360.7576" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8.5333 4.2667"/>
  <line x1="1062.2222" y1="303.6364" x2="1062.2222" y2="360.7576" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.5333 4.2667"/>
  <text x="217.7778" y="567.2727" text-anchor="middle" font-size="24.0546" fill="var(--primary-accent)" font-family="Arial, sans-serif">Each commit stores</text>
  <text x="217.7778" y="620" text-anchor="middle" font-size="24.0546" fill="var(--primary-accent)" font-family="Arial, sans-serif">a complete tree</text>
  <text x="640" y="567.2727" text-anchor="middle" font-size="24.0546" fill="var(--info-accent)" font-family="Arial, sans-serif">Same content =</text>
  <text x="640" y="620" text-anchor="middle" font-size="24.0546" fill="var(--info-accent)" font-family="Arial, sans-serif">same hash always</text>
  <text x="1062.2222" y="567.2727" text-anchor="middle" font-size="24.0546" fill="var(--ok-accent)" font-family="Arial, sans-serif">Commits point to</text>
  <text x="1062.2222" y="620" text-anchor="middle" font-size="24.0546" fill="var(--ok-accent)" font-family="Arial, sans-serif">parent commits</text>
  <line x1="395.5555" y1="171.8182" x2="457.7778" y2="171.8182" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="817.7778" y1="171.8182" x2="880" y2="171.8182" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

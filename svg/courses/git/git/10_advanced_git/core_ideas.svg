<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_core" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#888" />
    </marker>
  </defs>
  <rect x="40" y="360.7576" width="1200" height="105.4545" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="640" y="435.4545" text-anchor="middle" font-size="24.0546" fill="var(--text-muted)" font-style="italic">Unified by immutable, hash-based object storage</text>
  <rect x="40" y="40" width="355.5555" height="263.6364" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="217.7778" y="127.8788" text-anchor="middle" font-size="26.4601" font-weight="bold" fill="var(--primary-accent)">Snapshots</text>
  <text x="217.7778" y="193.7879" text-anchor="middle" font-size="24.0546" fill="var(--text-muted)">not Diffs</text>
  <text x="217.7778" y="259.697" text-anchor="middle" font-size="24.0546" fill="var(--text-faint)">Full state per commit</text>
  <rect x="84.4445" y="70.7576" width="26.6667" height="39.5455" fill="none" stroke="var(--border)" stroke-width="1" rx="6" />
  <rect x="90.5614" y="85.5109" width="14.4328" height="14.4328" rx="7.2164" fill="none" stroke="var(--primary-border)" stroke-width="2.1333"/>
  <rect x="462.2222" y="40" width="355.5555" height="263.6364" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="127.8788" text-anchor="middle" font-size="26.4601" font-weight="bold" fill="var(--info-accent)">Content-Addressable</text>
  <text x="640" y="193.7879" text-anchor="middle" font-size="24.0546" fill="var(--text-muted)">Store</text>
  <text x="640" y="259.697" text-anchor="middle" font-size="24.0546" fill="var(--text-faint)">SHA-1 identifies data</text>
  <text x="500" y="127.8788" font-size="31.271" fill="var(--info-accent)">#</text>
  <rect x="884.4445" y="40" width="355.5555" height="263.6364" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1062.2222" y="127.8788" text-anchor="middle" font-size="26.4601" font-weight="bold" fill="var(--ok-accent)">Directed Acyclic</text>
  <text x="1062.2222" y="193.7879" text-anchor="middle" font-size="24.0546" fill="var(--text-muted)">Graph</text>
  <text x="1062.2222" y="259.697" text-anchor="middle" font-size="24.0546" fill="var(--text-faint)">History as a DAG</text>
  <rect x="914.823" y="87.4994" width="19.2436" height="19.2436" rx="9.6218" fill="var(--ok-accent)"/>
  <rect x="941.489" y="61.1358" width="19.2436" height="19.2436" rx="9.6218" fill="var(--ok-accent)"/>
  <rect x="941.489" y="113.863" width="19.2436" height="19.2436" rx="9.6218" fill="var(--ok-accent)"/>
  <line x1="933.3333" y1="92.7273" x2="944.4445" y2="75.1515" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="933.3333" y1="101.5152" x2="944.4445" y2="119.0909" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="217.7778" y1="303.6364" x2="217.7778" y2="360.7576" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.5333 4.2667" />
  <line x1="640" y1="303.6364" x2="640" y2="360.7576" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8.5333 4.2667" />
  <line x1="1062.2222" y1="303.6364" x2="1062.2222" y2="360.7576" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.5333 4.2667" />
  <text x="217.7778" y="567.2727" text-anchor="middle" font-size="24.0546" fill="var(--primary-accent)">Each commit stores</text>
  <text x="217.7778" y="620" text-anchor="middle" font-size="24.0546" fill="var(--primary-accent)">a complete tree</text>
  <text x="640" y="567.2727" text-anchor="middle" font-size="24.0546" fill="var(--info-accent)">Same content =</text>
  <text x="640" y="620" text-anchor="middle" font-size="24.0546" fill="var(--info-accent)">same hash always</text>
  <text x="1062.2222" y="567.2727" text-anchor="middle" font-size="24.0546" fill="var(--ok-accent)">Commits point to</text>
  <text x="1062.2222" y="620" text-anchor="middle" font-size="24.0546" fill="var(--ok-accent)">parent commits</text>
  <line x1="395.5555" y1="171.8182" x2="457.7778" y2="171.8182" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arr_core)" />
  <line x1="817.7778" y1="171.8182" x2="880" y2="171.8182" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arr_core)" />
</svg>
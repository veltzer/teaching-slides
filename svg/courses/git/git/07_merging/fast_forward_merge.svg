  <text x="79.9999" y="569.310878631447" font-family="Arial, sans-serif" font-size="12.835131896915" fill="var(--ok-text)">Fast-forward is possible only when main is an ancestor of feature (main has no commits since the fork).</text>
  <text x="79.9999" y="590.756272028808" font-family="Arial, sans-serif" font-size="12.835131896915" fill="var(--ok-text)">History stays linear — no merge commit. Use git merge --no-ff feature to force a merge commit even when ff is possible.</text>
  <text x="79.9999" y="612.201665426168" font-family="Arial, sans-serif" font-size="12.835131896915" fill="var(--ok-text)">Opposite case: if main has commits since fork, a true 3-way merge is needed (or a rebase).</text>

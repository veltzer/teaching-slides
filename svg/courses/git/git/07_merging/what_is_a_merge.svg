<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="223.076869822489" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="640" y="106.923072485207" text-anchor="middle" font-size="31.862957372021" font-family="Arial, sans-serif" fill="var(--primary-text)">A merge combines changes from different branches</text>
  <text x="640" y="162.692376479285" text-anchor="middle" font-size="27.880033991905" font-family="Arial, sans-serif" fill="var(--primary-text)">Creating a unified history with all changes</text>
  <text x="640" y="218.461565088756" text-anchor="middle" font-size="27.880033991905" font-family="Arial, sans-serif" fill="var(--primary-text)">Preserves the complete development timeline</text>
  <rect x="193.652" y="365.752324552233" width="92.6962" height="106.957146753505" rx="15.038411856207" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="240" y="430.384666420115" text-anchor="middle" font-size="23.897218029016" fill="var(--bg)" font-family="Arial, sans-serif">Base</text>
  <rect x="393.652" y="276.521945853982" width="92.6962" height="106.957146753505" rx="15.038411856207" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="440" y="341.153826183433" text-anchor="middle" font-size="23.897218029016" fill="var(--bg)" font-family="Arial, sans-serif">A</text>
  <rect x="593.652" y="276.521945853982" width="92.6962" height="106.957146753505" rx="15.038411856207" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="341.153826183433" text-anchor="middle" font-size="23.897218029016" fill="var(--bg)" font-family="Arial, sans-serif">B</text>
  <rect x="393.652" y="454.982703250484" width="92.6962" height="106.957146753505" rx="15.038411856207" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="440" y="519.615391272189" text-anchor="middle" font-size="23.897218029016" fill="var(--bg)" font-family="Arial, sans-serif">C</text>
  <rect x="593.652" y="454.982703250484" width="92.6962" height="106.957146753505" rx="15.038411856207" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="640" y="519.615391272189" text-anchor="middle" font-size="23.897218029016" fill="var(--bg)" font-family="Arial, sans-serif">D</text>
  <rect x="784.382" y="355.056171415373" width="111.235" height="128.348068411932" rx="15.038411856207" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="840" y="430.384666420115" text-anchor="middle" font-size="27.880033991905" fill="var(--bg)" font-family="Arial, sans-serif">M</text>
  <line x1="290" y1="396.923130177511" x2="390" y2="352.30771005917" stroke="var(--text)" stroke-width="2"/>
  <line x1="290" y1="441.538434911244" x2="390" y2="486.153855029585" stroke="var(--text)" stroke-width="2"/>
  <line x1="490" y1="330.000057692304" x2="590" y2="330.000057692304" stroke="var(--text)" stroke-width="2"/>
  <line x1="490" y1="508.461507396452" x2="590" y2="508.461507396452" stroke="var(--text)" stroke-width="2"/>
  <line x1="690" y1="330.000057692304" x2="780" y2="385.769246301774" stroke="var(--text)" stroke-width="2"/>
  <line x1="690" y1="508.461507396452" x2="780" y2="452.692318786982" stroke="var(--text)" stroke-width="2"/>
  <text x="840" y="575.384579881659" text-anchor="middle" font-size="23.897218029016" font-family="Arial, sans-serif" fill="var(--text)">Merge commit</text>
  <text x="840" y="620" text-anchor="middle" font-size="21.905810047571" font-family="Arial, sans-serif" fill="var(--text)">Has two parents</text>
</svg>

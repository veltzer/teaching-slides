  <circle cx="83.3735" cy="233.3334" r="38.6104" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="83.3735" y="246.2223" text-anchor="middle" font-size="23.5952" font-family="sans-serif">C1</text>
  <circle cx="276.1444" cy="233.3334" r="38.6104" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="276.1444" y="246.2223" text-anchor="middle" font-size="23.5952" font-family="sans-serif">C2</text>
  <circle cx="468.9156" cy="233.3334" r="38.6104" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="468.9156" y="246.2223" text-anchor="middle" font-size="23.5952" font-family="sans-serif">C3</text>
  <line x1="126.7469" y1="233.3334" x2="227.9518" y2="233.3334" stroke="var(--text)" stroke-width="2" marker-end="url(#arrFF)" />
  <line x1="319.518" y1="233.3334" x2="420.7227" y2="233.3334" stroke="var(--text)" stroke-width="2" marker-end="url(#arrFF)" />
  <text x="83.3735" y="378.3333" text-anchor="middle" font-size="23.5952" font-family="sans-serif" fill="var(--primary-accent)" font-weight="bold">main</text>
  <line x1="83.3735" y1="355.7778" x2="83.3735" y2="297.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrFF)" />
  <text x="468.9156" y="378.3333" text-anchor="middle" font-size="23.5952" font-family="sans-serif" fill="var(--ok-accent)" font-weight="bold">feature</text>
  <line x1="468.9156" y1="355.7778" x2="468.9156" y2="297.7778" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrFF)" />
  <circle cx="782.1685" cy="233.3334" r="38.6104" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="782.1685" y="246.2223" text-anchor="middle" font-size="23.5952" font-family="sans-serif">C1</text>
  <circle cx="974.9397" cy="233.3334" r="38.6104" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="974.9397" y="246.2223" text-anchor="middle" font-size="23.5952" font-family="sans-serif">C2</text>
  <circle cx="1167.7108" cy="233.3334" r="38.6104" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="1167.7108" y="246.2223" text-anchor="middle" font-size="23.5952" font-family="sans-serif">C3</text>
  <line x1="825.5421" y1="233.3334" x2="926.7468" y2="233.3334" stroke="var(--text)" stroke-width="2" marker-end="url(#arrFF)" />
  <line x1="1018.3132" y1="233.3334" x2="1119.518" y2="233.3334" stroke="var(--text)" stroke-width="2" marker-end="url(#arrFF)" />
  <text x="1107.4697" y="426.6666" text-anchor="middle" font-size="23.5952" font-family="sans-serif" fill="var(--primary-accent)" font-weight="bold">main</text>
  <line x1="1143.6143" y1="404.1111" x2="1162.8915" y2="297.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrFF)" />
  <text x="1240" y="378.3333" text-anchor="middle" font-size="23.5952" font-family="sans-serif" fill="var(--ok-accent)" font-weight="bold">feature</text>
  <line x1="1215.9035" y1="355.7778" x2="1196.6264" y2="297.7778" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrFF)" />
  <text x="999.0361" y="555.5556" text-anchor="middle" font-size="21.4502" font-family="sans-serif" fill="var(--text-muted)">main pointer moves forward</text>
  <text x="999.0361" y="603.8889" text-anchor="middle" font-size="21.4502" font-family="sans-serif" fill="var(--text-muted)">No new merge commit created</text>
</svg>
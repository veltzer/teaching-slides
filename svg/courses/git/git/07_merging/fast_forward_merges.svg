<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="272.2403" y="72.2222" text-anchor="middle" font-size="27.9417" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Before</text>
  <line x1="610.9561" y1="40" x2="610.9561" y2="620" stroke="var(--text-faint)" stroke-width="1.9961" stroke-dasharray="9.9805 9.9805"/>
  <text x="998.06" y="72.2222" text-anchor="middle" font-size="27.9417" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">After</text>
  <rect x="40" y="194.645" width="77.377" height="77.377" rx="14" fill="url(#grad-primary)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="78.6885" y="246.2223" text-anchor="middle" font-size="23.643" font-family="Arial, sans-serif" fill="var(--primary-text)">C1</text>
  <rect x="233.552" y="194.645" width="77.377" height="77.377" rx="14" fill="url(#grad-ok)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="272.2403" y="246.2223" text-anchor="middle" font-size="23.643" font-family="Arial, sans-serif" fill="var(--ok-text)">C2</text>
  <rect x="427.104" y="194.645" width="77.377" height="77.377" rx="14" fill="url(#grad-ok)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="465.7923" y="246.2223" text-anchor="middle" font-size="23.643" font-family="Arial, sans-serif" fill="var(--ok-text)">C3</text>
  <line x1="122.2376" y1="233.3334" x2="223.8524" y2="233.3334" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315.7895" y1="233.3334" x2="417.4041" y2="233.3334" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="78.6885" y="378.3333" text-anchor="middle" font-size="23.643" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">main</text>
  <line x1="78.6885" y1="355.7778" x2="78.6885" y2="297.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465.7923" y="378.3333" text-anchor="middle" font-size="23.643" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">feature</text>
  <line x1="465.7923" y1="355.7778" x2="465.7923" y2="297.7778" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="741.625" y="194.645" width="77.377" height="77.377" rx="14" fill="url(#grad-primary)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="780.314" y="246.2223" text-anchor="middle" font-size="23.643" font-family="Arial, sans-serif" fill="var(--primary-text)">C1</text>
  <rect x="935.178" y="194.645" width="77.377" height="77.377" rx="14" fill="url(#grad-ok)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="973.866" y="246.2223" text-anchor="middle" font-size="23.643" font-family="Arial, sans-serif" fill="var(--ok-text)">C2</text>
  <rect x="1128.73" y="194.645" width="77.377" height="77.377" rx="14" fill="url(#grad-ok)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="1167.4179" y="246.2223" text-anchor="middle" font-size="23.643" font-family="Arial, sans-serif" fill="var(--ok-text)">C3</text>
  <line x1="823.8633" y1="233.3334" x2="925.478" y2="233.3334" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1017.4153" y1="233.3334" x2="1119.03" y2="233.3334" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1106.933" y="426.6666" text-anchor="middle" font-size="23.643" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">main</text>
  <line x1="1143.2239" y1="404.1111" x2="1162.5791" y2="297.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1240" y="378.3333" text-anchor="middle" font-size="23.643" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">feature</text>
  <line x1="1215.8059" y1="355.7778" x2="1196.4508" y2="297.7778" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="998.06" y="555.5556" text-anchor="middle" font-size="21.4936" fill="var(--text-muted)" font-family="Arial, sans-serif">main pointer moves forward</text>
  <text x="998.06" y="603.8889" text-anchor="middle" font-size="21.4936" fill="var(--text-muted)" font-family="Arial, sans-serif">No new merge commit created</text>
</svg>

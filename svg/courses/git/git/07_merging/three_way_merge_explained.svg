<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="227.695" y="131.375585633654" width="104.611" height="109.185201047685" rx="14.302805997176" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="180.256605389764" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.962267516546" font-weight="bold" fill="var(--primary-text)">Base</text>
  <text x="280" y="203.100423518742" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.756089226479" fill="var(--primary-text)">common ancestor</text>

  <rect x="587.695" y="40" width="104.611" height="109.185201047685" rx="14.302805997176" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="88.881437246435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.962267516546" font-weight="bold" fill="var(--ok-text)">Ours</text>
  <text x="640" y="111.725255375413" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.756089226479" fill="var(--ok-text)">main branch</text>

  <rect x="587.695" y="222.750649404401" width="104.611" height="109.185201047685" rx="14.302805997176" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="271.631877905674" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.962267516546" font-weight="bold" fill="var(--warn-text)">Theirs</text>
  <text x="640" y="294.475696034652" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.756089226479" fill="var(--warn-text)">feature branch</text>

  <rect x="947.695" y="131.375585633654" width="104.611" height="109.185201047685" rx="14.302805997176" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="180.256605389764" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.962267516546" font-weight="bold" fill="var(--info-text)">Merged</text>
  <text x="1000" y="203.100423518742" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.756089226479" fill="var(--info-text)">new commit</text>

  <line x1="330" y1="157.412891633368" x2="588" y2="111.725255375413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="214.52233258323" x2="588" y2="260.209968841185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="692" y1="111.725255375413" x2="950" y2="157.412891633368" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="692" y1="260.209968841185" x2="950" y2="214.52233258323" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="391.561923082806" width="1200" height="228.438076917194" rx="6.412356580134" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="431.538604808517" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.099719709924" font-weight="bold" fill="var(--text)">Per-line decision</text>
  <text x="640" y="471.515182161646" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.962267516546" fill="var(--text-muted)">• Line unchanged in both → keep the base line</text>
  <text x="640" y="505.780909355112" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.962267516546" fill="var(--text-muted)">• Changed in only one side → take that side's change</text>
  <text x="640" y="540.046636548579" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.962267516546" fill="var(--text-muted)">• Changed on both sides to the same value → take the change</text>
  <text x="640" y="574.312363742045" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.962267516546" fill="var(--text-muted)">• Changed on both sides differently → conflict, human resolves</text>
  <text x="640" y="608.578090935511" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.893541419857" fill="var(--text-muted)">git uses the merge-base commit as "Base"</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="272.7273" height="120.00012556487" fill="url(#grad-danger)" rx="6.400432713306" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.3635" y="110.000092211702" text-anchor="middle" font-size="25.17012834059" fill="var(--bg)" font-family="Arial, sans-serif">1. Merge Attempt</text>
  <text x="176.3635" y="200.000129488772" text-anchor="middle" font-size="20.512533455117" font-family="Arial, sans-serif" fill="var(--text)">CONFLICT!</text>
  <rect x="349.0907" y="40" width="272.7273" height="120.00012556487" fill="url(#grad-warn)" rx="6.400432713306" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.4543" y="110.000092211702" text-anchor="middle" font-size="25.17012834059" fill="var(--bg)" font-family="Arial, sans-serif">2. Identify Files</text>
  <text x="485.4543" y="200.000129488772" text-anchor="middle" font-size="20.512533455117" font-family="Courier New, monospace" fill="var(--text)">git status</text>
  <rect x="658.1818" y="40" width="272.7273" height="120.00012556487" fill="url(#grad-warn)" rx="6.400432713306" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.5454" y="110.000092211702" text-anchor="middle" font-size="25.17012834059" fill="var(--bg)" font-family="Arial, sans-serif">3. Open &amp; Edit</text>
  <text x="794.5454" y="200.000129488772" text-anchor="middle" font-size="20.512533455117" font-family="Arial, sans-serif" fill="var(--text)">Remove markers</text>
  <rect x="967.2727" y="40" width="272.7273" height="120.00012556487" fill="url(#grad-ok)" rx="6.400432713306" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1103.6365" y="110.000092211702" text-anchor="middle" font-size="25.17012834059" fill="var(--bg)" font-family="Arial, sans-serif">4. Stage Files</text>
  <text x="1103.6365" y="200.000129488772" text-anchor="middle" font-size="20.512533455117" font-family="Courier New, monospace" fill="var(--text)">git add</text>
  <path d="M 312.7271 99.999721402944 L 349.0907 99.999721402944" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)"/>
  <path d="M 621.8182 99.999721402944 L 658.1818 99.999721402944" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)"/>
  <path d="M 930.9093 99.999721402944 L 967.2727 99.999721402944" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)"/>
  <rect x="494.5453" y="240.000019619511" width="363.6364" height="120.00012556487" fill="url(#grad-primary)" rx="6.400432713306" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="676.3638" y="310.000111831213" text-anchor="middle" font-size="25.17012834059" fill="var(--bg)" font-family="Arial, sans-serif">5. Complete Merge</text>
  <text x="676.3638" y="350.000115755115" text-anchor="middle" font-size="20.512533455117" fill="var(--bg)" font-family="Courier New, monospace">git commit</text>
  <path d="M 1103.6365 160.00012556487 L 858.1818 240.000019619511" stroke="var(--text)" stroke-width="0.8537" marker-end="url(#arrow)"/>
  <rect x="312.7271" y="419.999980380489" width="727.2731" height="200.000019619511" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.400432713306"/>
  <text x="676.3638" y="480.000043162924" text-anchor="middle" font-size="25.17012834059" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Alternative: Abort Merge</text>
  <text x="349.0907" y="529.999962722929" font-size="21.574471916133" font-family="Courier New, monospace" fill="var(--text)">git merge --abort</text>
  <text x="349.0907" y="570.000080439995" font-size="20.512533455117" font-family="Arial, sans-serif" fill="var(--text)">Returns to state before merge attempt</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

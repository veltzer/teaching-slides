<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="125.7143" y="40" width="1028.5713" height="124.285714285714" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="640.0001" y="112.5" text-anchor="middle" font-size="28.426333307793" font-family="Arial, sans-serif" fill="var(--danger-text)">Conflict = Both branches changed the same part differently</text>
  <rect x="40" y="205.714285714286" width="377.1428" height="248.571428571429" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="228.5715" y="257.5" text-anchor="middle" font-size="24.873041644318" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Base Version</text>
  <text x="57.1429" y="309.285714285714" font-size="17.76645831737" font-family="Courier New, monospace" fill="var(--ok-text)">function greet() {</text>
  <text x="57.1429" y="350.714285714286" font-size="17.76645831737" font-family="Courier New, monospace" fill="var(--ok-text)">  return "Hello";</text>
  <text x="57.1429" y="392.142857142857" font-size="17.76645831737" font-family="Courier New, monospace" fill="var(--ok-text)">}</text>
  <rect x="451.4286" y="205.714285714286" width="377.1428" height="248.571428571429" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="640.0001" y="257.5" text-anchor="middle" font-size="24.873041644318" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Our Version</text>
  <text x="468.5715" y="309.285714285714" font-size="17.76645831737" font-family="Courier New, monospace" fill="var(--primary-text)">function greet(name) {</text>
  <text x="468.5715" y="350.714285714286" font-size="17.76645831737" font-family="Courier New, monospace" fill="var(--primary-text)">  return `Hi ${name}`;</text>
  <text x="468.5715" y="392.142857142857" font-size="17.76645831737" font-family="Courier New, monospace" fill="var(--primary-text)">}</text>
  <rect x="862.8572" y="205.714285714286" width="377.1428" height="248.571428571429" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="1051.4285" y="257.5" text-anchor="middle" font-size="24.873041644318" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Their Version</text>
  <text x="880" y="309.285714285714" font-size="17.76645831737" font-family="Courier New, monospace" fill="var(--warn-text)">function greet() {</text>
  <text x="880" y="350.714285714286" font-size="17.76645831737" font-family="Courier New, monospace" fill="var(--warn-text)">  return "Bonjour";</text>
  <text x="880" y="392.142857142857" font-size="17.76645831737" font-family="Courier New, monospace" fill="var(--warn-text)">}</text>
  <rect x="382.8571" y="495.714285714286" width="514.2857" height="124.285714285714" fill="url(#grad-danger)" rx="6.414269805898" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="568.214285714286" text-anchor="middle" font-size="28.426333307793" fill="var(--bg)" font-family="Arial, sans-serif">CONFLICT!</text>
  <text x="640.0001" y="609.642857142857" text-anchor="middle" font-size="21.319749980844" fill="var(--bg)" font-family="Arial, sans-serif">Git can't auto-merge</text>
</svg>

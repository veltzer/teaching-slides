<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrCP" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
    <marker id="arrCPr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#e65100" />
    </marker>
  </defs>
  <text x="40" y="182.25" font-size="24" font-family="sans-serif" fill="var(--primary-accent)" font-weight="bold">main</text>
  <circle cx="160" cy="168.75" r="36" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4" />
  <text x="160" y="182.25" text-anchor="middle" font-size="22" font-family="sans-serif">M1</text>
  <circle cx="320" cy="168.75" r="36" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4" />
  <text x="320" y="182.25" text-anchor="middle" font-size="22" font-family="sans-serif">M2</text>
  <line x1="196" y1="168.75" x2="280" y2="168.75" stroke="var(--text)" stroke-width="2" marker-end="url(#arrCP)" />
  <circle cx="559.9999" cy="168.75" r="36" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="5" />
  <text x="559.9999" y="182.25" text-anchor="middle" font-size="24" font-family="sans-serif" font-weight="bold">C'</text>
  <line x1="356" y1="168.75" x2="520" y2="168.75" stroke="var(--text)" stroke-width="2" marker-end="url(#arrCP)" />
  <text x="559.9999" y="94.5" text-anchor="middle" font-size="20" font-family="sans-serif" fill="var(--warn-accent)">cherry-picked</text>
  <text x="40" y="519.75" font-size="24" font-family="sans-serif" fill="var(--info-accent)" font-weight="bold">feature</text>
  <circle cx="240" cy="506.25" r="36" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4" />
  <text x="240" y="519.75" text-anchor="middle" font-size="22" font-family="sans-serif">A</text>
  <circle cx="439.9999" cy="506.25" r="36" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4" />
  <text x="439.9999" y="519.75" text-anchor="middle" font-size="22" font-family="sans-serif">B</text>
  <circle cx="640" cy="506.25" r="36" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="5" />
  <text x="640" y="519.75" text-anchor="middle" font-size="24" font-family="sans-serif" font-weight="bold">C</text>
  <circle cx="840" cy="506.25" r="36" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4" />
  <text x="840" y="519.75" text-anchor="middle" font-size="22" font-family="sans-serif">D</text>
  <line x1="276" y1="506.25" x2="400" y2="506.25" stroke="var(--text)" stroke-width="2" marker-end="url(#arrCP)" />
  <line x1="475.9999" y1="506.25" x2="600" y2="506.25" stroke="var(--text)" stroke-width="2" marker-end="url(#arrCP)" />
  <line x1="676" y1="506.25" x2="799.9999" y2="506.25" stroke="var(--text)" stroke-width="2" marker-end="url(#arrCP)" />
  <path d="M 640 445.5 C 640 303.75 559.9999 303.75 559.9999 236.25" stroke="var(--warn-border)" stroke-width="5" fill="none" stroke-dasharray="12 6" marker-end="url(#arrCPr)" />
  <text x="739.9999" y="337.5" font-size="20" font-family="sans-serif" fill="var(--warn-accent)" font-style="italic">git cherry-pick</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrCP" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
    <marker id="arrCPr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#e65100" />
    </marker>
  </defs>
  <text x="173.2217" y="177.9899" font-size="26.8007" font-family="sans-serif" fill="var(--primary-accent)" font-weight="bold">main</text>
  <circle cx="307.225" cy="162.9146" r="40.201" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4" />
  <text x="307.225" y="177.9899" text-anchor="middle" font-size="24.5673" font-family="sans-serif">M1</text>
  <circle cx="485.8961" cy="162.9146" r="40.201" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4" />
  <text x="485.8961" y="177.9899" text-anchor="middle" font-size="24.5673" font-family="sans-serif">M2</text>
  <line x1="347.426" y1="162.9146" x2="441.2284" y2="162.9146" stroke="var(--text)" stroke-width="2" marker-end="url(#arrCP)" />
  <circle cx="753.9027" cy="162.9146" r="40.201" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="5" />
  <text x="753.9027" y="177.9899" text-anchor="middle" font-size="26.8007" font-family="sans-serif" font-weight="bold">C'</text>
  <line x1="526.0972" y1="162.9146" x2="709.2351" y2="162.9146" stroke="var(--text)" stroke-width="2" marker-end="url(#arrCP)" />
  <text x="753.9027" y="80" text-anchor="middle" font-size="22.3339" font-family="sans-serif" fill="var(--warn-accent)">cherry-picked</text>
  <text x="173.2217" y="554.8744" font-size="26.8007" font-family="sans-serif" fill="var(--info-accent)" font-weight="bold">feature</text>
  <circle cx="396.5606" cy="539.799" r="40.201" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4" />
  <text x="396.5606" y="554.8744" text-anchor="middle" font-size="24.5673" font-family="sans-serif">A</text>
  <circle cx="619.8994" cy="539.799" r="40.201" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4" />
  <text x="619.8994" y="554.8744" text-anchor="middle" font-size="24.5673" font-family="sans-serif">B</text>
  <circle cx="843.2384" cy="539.799" r="40.201" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="5" />
  <text x="843.2384" y="554.8744" text-anchor="middle" font-size="26.8007" font-family="sans-serif" font-weight="bold">C</text>
  <circle cx="1066.5773" cy="539.799" r="40.201" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4" />
  <text x="1066.5773" y="554.8744" text-anchor="middle" font-size="24.5673" font-family="sans-serif">D</text>
  <line x1="436.7616" y1="539.799" x2="575.2317" y2="539.799" stroke="var(--text)" stroke-width="2" marker-end="url(#arrCP)" />
  <line x1="660.1004" y1="539.799" x2="798.5706" y2="539.799" stroke="var(--text)" stroke-width="2" marker-end="url(#arrCP)" />
  <line x1="883.4394" y1="539.799" x2="1021.9094" y2="539.799" stroke="var(--text)" stroke-width="2" marker-end="url(#arrCP)" />
  <path d="M 843.2384 471.9598 C 843.2384 313.6683 753.9027 313.6683 753.9027 238.2915" stroke="var(--warn-border)" stroke-width="5" fill="none" stroke-dasharray="12 6" marker-end="url(#arrCPr)" />
  <text x="954.9078" y="351.3568" font-size="22.3339" font-family="sans-serif" fill="var(--warn-accent)" font-style="italic">git cherry-pick</text>
</svg>
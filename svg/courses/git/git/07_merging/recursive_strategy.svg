<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="261.274" width="94.852758" height="94.8526" rx="14.000012" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3.8899" filter="url(#shadow)"/>
  <text x="87.426379" y="321.8079" text-anchor="middle" font-size="26.084522" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Base</text>
  <text x="87.426379" y="439.774" text-anchor="middle" font-size="23.71322" fill="var(--warn-accent)" font-family="Arial, sans-serif">Common Ancestor</text>
  <rect x="619.161965" y="64.6642" width="94.852758" height="94.8526" rx="14.000012" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3.8899" filter="url(#shadow)"/>
  <text x="666.587844" y="125.1978" text-anchor="middle" font-size="26.084522" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Ours</text>
  <text x="666.587844" y="40" text-anchor="middle" font-size="23.71322" fill="var(--primary-accent)" font-family="Arial, sans-serif">main tip</text>
  <rect x="619.161965" y="457.884" width="94.852758" height="94.8526" rx="14.000012" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3.8899" filter="url(#shadow)"/>
  <text x="666.587844" y="518.4181" text-anchor="middle" font-size="26.084522" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Theirs</text>
  <text x="666.587844" y="620" text-anchor="middle" font-size="23.71322" fill="var(--info-accent)" font-family="Arial, sans-serif">feature tip</text>
  <rect x="1135.661826" y="256.532" width="104.338174" height="104.338" rx="14.000012" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="4.8623" filter="url(#shadow)"/>
  <text x="1187.833013" y="295.5932" text-anchor="middle" font-size="23.71322" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Merge</text>
  <text x="1187.833013" y="338.1921" text-anchor="middle" font-size="23.71322" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Commit</text>
  <line x1="139.550666" y1="269.3785" x2="602.880038" y2="131.7515" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="9.7246 5.8348" marker-end="url(#arrow)"/>
  <line x1="139.550666" y1="348.0226" x2="602.880038" y2="485.6497" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="9.7246 5.8348" marker-end="url(#arrow)"/>
  <line x1="724.503941" y1="131.7515" x2="1118.333597" y2="275.9322" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="724.503941" y1="485.6497" x2="1118.333597" y2="341.4689" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348.2481" y="226.7796" text-anchor="middle" font-size="23.7042" fill="var(--text-muted)" transform="rotate(-16,190,75)" font-family="Arial, sans-serif">diverged</text>
  <text x="348.2481" y="407.0057" text-anchor="middle" font-size="23.7042" fill="var(--text-muted)" transform="rotate(16,190,130)" font-family="Arial, sans-serif">diverged</text>
</svg>

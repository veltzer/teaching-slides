<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrRS" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
    <marker id="arrRSd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#999" />
    </marker>
  </defs>
  <circle cx="87.8235" cy="308.7005" r="47.4084" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.8899" />
  <text x="87.8235" y="321.8079" text-anchor="middle" font-size="26.0746" font-family="sans-serif" font-weight="bold">Base</text>
  <text x="87.8235" y="439.774" text-anchor="middle" font-size="23.7042" font-family="sans-serif" fill="var(--warn-accent)">Common Ancestor</text>
  <circle cx="666.545" cy="112.0905" r="47.4084" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.8899" />
  <text x="666.545" y="125.1978" text-anchor="middle" font-size="26.0746" font-family="sans-serif" font-weight="bold">Ours</text>
  <text x="666.545" y="40" text-anchor="middle" font-size="23.7042" font-family="sans-serif" fill="var(--primary-accent)">main tip</text>
  <circle cx="666.545" cy="505.3107" r="47.4084" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.8899" />
  <text x="666.545" y="518.4181" text-anchor="middle" font-size="26.0746" font-family="sans-serif" font-weight="bold">Theirs</text>
  <text x="666.545" y="620" text-anchor="middle" font-size="23.7042" font-family="sans-serif" fill="var(--info-accent)">feature tip</text>
  <circle cx="1187.3943" cy="308.7005" r="52.1492" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="4.8623" />
  <text x="1187.3943" y="295.5932" text-anchor="middle" font-size="23.7042" font-weight="bold" font-family="sans-serif">Merge</text>
  <text x="1187.3943" y="338.1921" text-anchor="middle" font-size="23.7042" font-weight="bold" font-family="sans-serif">Commit</text>
  <line x1="139.9083" y1="269.3785" x2="602.8857" y2="131.7515" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="9.7246 5.8348" marker-end="url(#arrRSd)" />
  <line x1="139.9083" y1="348.0226" x2="602.8857" y2="485.6497" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="9.7246 5.8348" marker-end="url(#arrRSd)" />
  <line x1="724.4171" y1="131.7515" x2="1117.9477" y2="275.9322" stroke="var(--text)" stroke-width="2" marker-end="url(#arrRS)" />
  <line x1="724.4171" y1="485.6497" x2="1117.9477" y2="341.4689" stroke="var(--text)" stroke-width="2" marker-end="url(#arrRS)" />
  <text x="348.2481" y="226.7796" text-anchor="middle" font-size="23.7042" font-family="sans-serif" fill="var(--text-muted)" transform="rotate(-16,190,75)">diverged</text>
  <text x="348.2481" y="407.0057" text-anchor="middle" font-size="23.7042" font-family="sans-serif" fill="var(--text-muted)" transform="rotate(16,190,130)">diverged</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrMO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <circle cx="119.7661" cy="269.4737" r="35.9298" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="119.7661" y="282.9474" text-anchor="middle" font-size="21.9571" font-family="sans-serif">C1</text>
  <circle cx="299.4152" cy="269.4737" r="35.9298" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="299.4152" y="282.9474" text-anchor="middle" font-size="21.9571" font-family="sans-serif">C2</text>
  <circle cx="698.6355" cy="269.4737" r="35.9298" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="698.6355" y="282.9474" text-anchor="middle" font-size="21.9571" font-family="sans-serif">C5</text>
  <circle cx="938.1677" cy="269.4737" r="43.9142" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="4.9902" />
  <text x="938.1677" y="256" text-anchor="middle" font-size="19.961" font-weight="bold" font-family="sans-serif">Merge</text>
  <text x="938.1677" y="299.7895" text-anchor="middle" font-size="19.961" font-weight="bold" font-family="sans-serif">Commit</text>
  <circle cx="419.1813" cy="522.1053" r="35.9298" fill="var(--info-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="419.1813" y="535.5789" text-anchor="middle" font-size="21.9571" font-family="sans-serif">C3</text>
  <circle cx="618.7914" cy="522.1053" r="35.9298" fill="var(--info-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="618.7914" y="535.5789" text-anchor="middle" font-size="21.9571" font-family="sans-serif">C4</text>
  <line x1="155.6959" y1="269.4737" x2="259.4931" y2="269.4737" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="335.345" y1="269.4737" x2="658.7135" y2="269.4737" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="734.5653" y1="269.4737" x2="890.2612" y2="269.4737" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="323.3684" y1="323.3684" x2="391.2358" y2="474.9474" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="455.1111" y1="522.1053" x2="578.8694" y2="522.1053" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="646.7368" y1="474.9474" x2="910.2222" y2="323.3684" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <text x="119.7661" y="151.5789" text-anchor="middle" font-size="23.9532" font-family="sans-serif" fill="var(--primary-accent)" font-weight="bold">main</text>
  <text x="518.9864" y="640" text-anchor="middle" font-size="23.9532" font-family="sans-serif" fill="var(--info-accent)" font-weight="bold">feature</text>
</svg>
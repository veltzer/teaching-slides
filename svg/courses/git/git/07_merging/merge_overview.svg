<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrMO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="134.625" width="90.751027" height="90.7508" rx="14.000018" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="85.375513" y="196" text-anchor="middle" font-size="27.729435" font-family="sans-serif">C1</text>
  <rect x="281.280603" y="134.625" width="90.751027" height="90.7508" rx="14.000018" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="326.656317" y="196" text-anchor="middle" font-size="27.729435" font-family="sans-serif">C2</text>
  <rect x="817.460944" y="134.625" width="90.751027" height="90.7508" rx="14.000018" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="862.836357" y="196" text-anchor="middle" font-size="27.729435" font-family="sans-serif">C5</text>
  <rect x="1129.082723" y="124.541" width="110.917277" height="110.917" rx="14.000018" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="4.9902" filter="url(#shadow)"/>
  <text x="1184.544161" y="164.0001" text-anchor="middle" font-size="25.208532" font-weight="bold" font-family="sans-serif">Merge</text>
  <text x="1184.544161" y="216.0001" text-anchor="middle" font-size="25.208532" font-weight="bold" font-family="sans-serif">Commit</text>
  <rect x="442.135005" y="434.625" width="90.751027" height="90.7508" rx="14.000018" fill="var(--info-fill)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="487.510419" y="495.9999" text-anchor="middle" font-size="27.729435" font-family="sans-serif">C3</text>
  <rect x="710.224676" y="434.625" width="90.751027" height="90.7508" rx="14.000018" fill="var(--info-fill)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="755.600289" y="495.9999" text-anchor="middle" font-size="27.729435" font-family="sans-serif">C4</text>
  <line x1="133.631734" y1="180.0001" x2="273.038283" y2="180.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="374.912537" y1="180.0001" x2="809.218323" y2="180.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="911.092378" y1="180.0001" x2="1120.202601" y2="180.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="358.827297" y1="244" x2="449.977725" y2="424" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="535.766739" y1="480.0001" x2="701.982355" y2="480.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="793.132783" y1="424" x2="1147.011568" y2="244" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <text x="85.375513" y="40" text-anchor="middle" font-size="30.250238" font-family="sans-serif" fill="var(--primary-accent)" font-weight="bold">main</text>
  <text x="621.555354" y="620" text-anchor="middle" font-size="30.250238" font-family="sans-serif" fill="var(--info-accent)" font-weight="bold">feature</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="134.625" width="90.751027" height="90.7508" rx="14.000018" fill="url(#grad-primary)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="85.375513" y="196" text-anchor="middle" font-size="27.729435" font-family="Arial, sans-serif" fill="var(--primary-text)">C1</text>
  <rect x="281.280603" y="134.625" width="90.751027" height="90.7508" rx="14.000018" fill="url(#grad-primary)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="326.656317" y="196" text-anchor="middle" font-size="27.729435" font-family="Arial, sans-serif" fill="var(--primary-text)">C2</text>
  <rect x="817.460944" y="134.625" width="90.751027" height="90.7508" rx="14.000018" fill="url(#grad-primary)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="862.836357" y="196" text-anchor="middle" font-size="27.729435" font-family="Arial, sans-serif" fill="var(--primary-text)">C5</text>
  <rect x="1129.082723" y="124.541" width="110.917277" height="110.917" rx="14.000018" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="4.9902" filter="url(#shadow)"/>
  <text x="1184.544161" y="164.0001" text-anchor="middle" font-size="25.208532" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Merge</text>
  <text x="1184.544161" y="216.0001" text-anchor="middle" font-size="25.208532" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Commit</text>
  <rect x="442.135005" y="434.625" width="90.751027" height="90.7508" rx="14.000018" fill="url(#grad-info)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="487.510419" y="495.9999" text-anchor="middle" font-size="27.729435" font-family="Arial, sans-serif" fill="var(--info-text)">C3</text>
  <rect x="710.224676" y="434.625" width="90.751027" height="90.7508" rx="14.000018" fill="url(#grad-info)" stroke="var(--text)" stroke-width="3.9922" filter="url(#shadow)"/>
  <text x="755.600289" y="495.9999" text-anchor="middle" font-size="27.729435" font-family="Arial, sans-serif" fill="var(--info-text)">C4</text>
  <line x1="133.631734" y1="180.0001" x2="273.038283" y2="180.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="374.912537" y1="180.0001" x2="809.218323" y2="180.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="911.092378" y1="180.0001" x2="1120.202601" y2="180.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="358.827297" y1="244" x2="449.977725" y2="424" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="535.766739" y1="480.0001" x2="701.982355" y2="480.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="793.132783" y1="424" x2="1147.011568" y2="244" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="85.375513" y="40" text-anchor="middle" font-size="30.250238" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">main</text>
  <text x="621.555354" y="620" text-anchor="middle" font-size="30.250238" fill="var(--info-accent)" font-weight="bold" font-family="Arial, sans-serif">feature</text>
</svg>

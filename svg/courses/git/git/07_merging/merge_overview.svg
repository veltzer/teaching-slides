<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrMO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <circle cx="217.0115" cy="200.6897" r="36.7816" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="217.0115" y="214.4828" text-anchor="middle" font-size="22.4776" font-family="sans-serif">C1</text>
  <circle cx="400.9195" cy="200.6897" r="36.7816" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="400.9195" y="214.4828" text-anchor="middle" font-size="22.4776" font-family="sans-serif">C2</text>
  <circle cx="809.6041" cy="200.6897" r="36.7816" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="809.6041" y="214.4828" text-anchor="middle" font-size="22.4776" font-family="sans-serif">C5</text>
  <circle cx="1054.8148" cy="200.6897" r="44.9553" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="4.9902" />
  <text x="1054.8148" y="186.8966" text-anchor="middle" font-size="20.4342" font-weight="bold" font-family="sans-serif">Merge</text>
  <text x="1054.8148" y="231.7242" text-anchor="middle" font-size="20.4342" font-weight="bold" font-family="sans-serif">Commit</text>
  <circle cx="523.5249" cy="459.3104" r="36.7816" fill="var(--info-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="523.5249" y="473.1034" text-anchor="middle" font-size="22.4776" font-family="sans-serif">C3</text>
  <circle cx="727.8671" cy="459.3104" r="36.7816" fill="var(--info-fill)" stroke="var(--text)" stroke-width="3.9922" />
  <text x="727.8671" y="473.1034" text-anchor="middle" font-size="22.4776" font-family="sans-serif">C4</text>
  <line x1="253.7931" y1="200.6897" x2="360.051" y2="200.6897" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="437.7011" y1="200.6897" x2="768.7356" y2="200.6897" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="846.3856" y1="200.6897" x2="1005.7726" y2="200.6897" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="425.4406" y1="255.8621" x2="494.9169" y2="411.0345" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="560.3065" y1="459.3104" x2="686.9987" y2="459.3104" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <line x1="756.475" y1="411.0345" x2="1026.2068" y2="255.8621" stroke="var(--text)" stroke-width="2" marker-end="url(#arrMO)" />
  <text x="217.0115" y="80" text-anchor="middle" font-size="24.5211" font-family="sans-serif" fill="var(--primary-accent)" font-weight="bold">main</text>
  <text x="625.6961" y="580" text-anchor="middle" font-size="24.5211" font-family="sans-serif" fill="var(--info-accent)" font-weight="bold">feature</text>
</svg>
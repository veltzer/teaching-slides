<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="199.262" height="128" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="139.631" y="124" text-anchor="middle" font-size="22.9086" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Introduction</text>
  <line x1="239.262" y1="104" x2="283.5424" y2="104" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="290.1844" y="40" width="199.262" height="128" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="389.8154" y="124" text-anchor="middle" font-size="22.9086" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Basics</text>
  <line x1="489.4465" y1="104" x2="533.7269" y2="104" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="540.369" y="40" width="199.262" height="128" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="124" text-anchor="middle" font-size="22.9086" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Config</text>
  <line x1="739.631" y1="104" x2="783.9115" y2="104" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="790.5535" y="40" width="199.262" height="128" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="890.1846" y="124" text-anchor="middle" font-size="22.9086" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Undoing</text>
  <line x1="989.8156" y1="104" x2="1034.0959" y2="104" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1040.738" y="40" width="199.262" height="128" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1140.369" y="124" text-anchor="middle" font-size="22.9086" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Remotes</text>
  <line x1="1140.369" y1="168" x2="1140.369" y2="280" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1140.369" y1="280" x2="139.631" y2="280" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="139.631" y1="280" x2="139.631" y2="340" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="352" width="199.262" height="128" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="139.631" y="436" text-anchor="middle" font-size="22.9086" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Branches</text>
  <line x1="239.262" y1="416" x2="283.5424" y2="416" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="290.1844" y="352" width="199.262" height="128" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="389.8154" y="436" text-anchor="middle" font-size="22.9086" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Merging</text>
  <line x1="489.4465" y1="416" x2="533.7269" y2="416" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="540.369" y="352" width="199.262" height="128" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="436" text-anchor="middle" font-size="22.9086" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Workflows</text>
  <line x1="739.631" y1="416" x2="783.9115" y2="416" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="790.5535" y="352" width="199.262" height="128" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="890.1846" y="436" text-anchor="middle" font-size="22.9086" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Tools</text>
  <line x1="989.8156" y1="416" x2="1034.0959" y2="416" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1040.738" y="352" width="199.262" height="128" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1140.369" y="436" text-anchor="middle" font-size="22.9086" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Advanced</text>
  <text x="693.1365" y="620" text-anchor="middle" font-size="27.4904" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">Course Learning Path</text>
</svg>

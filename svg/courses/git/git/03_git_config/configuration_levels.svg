<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- System level -->
  <rect x="107" y="504" width="1066" height="180" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="10" filter="url(#shadow)"/>
  <text x="640" y="582" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">System</text>
  <text x="640" y="638" text-anchor="middle" font-size="18" fill="#555">/etc/gitconfig</text>
  <!-- User level -->
  <rect x="256" y="288" width="768" height="180" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="4" rx="10" filter="url(#shadow)"/>
  <text x="640" y="366" text-anchor="middle" font-size="22" font-weight="bold" fill="#7b1fa2">User</text>
  <text x="640" y="422" text-anchor="middle" font-size="18" fill="#555">~/.gitconfig</text>
  <!-- Repository level -->
  <rect x="416" y="72" width="448" height="180" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4" rx="10" filter="url(#shadow)"/>
  <text x="640" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">Repository</text>
  <text x="640" y="206" text-anchor="middle" font-size="18" fill="#555">.git/config</text>
  <!-- Higher priority arrow -->
  <line x1="1180" y1="612" x2="1180" y2="126" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1240" y="390" text-anchor="start" font-size="18" fill="#333" transform="rotate(-90,1240,390)">Higher priority</text>
</svg>

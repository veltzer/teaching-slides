<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="56.8889" y="128" width="379.5556" height="384" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="246.2222" y="208" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">Working Directory</text>
  <rect x="104" y="248.8889" width="284.4444" height="76.4444" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" rx="6" />
  <text x="246.2222" y="298.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">file1.js (modified)</text>
  <rect x="104" y="344.8889" width="284.4444" height="76.4444" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" rx="6" />
  <text x="246.2222" y="394.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">file2.css (modified)</text>
  <rect x="701.3333" y="128" width="379.5556" height="384" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="891.5556" y="208" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--warn-accent)">Staging Area</text>
  <rect x="749.3333" y="248.8889" width="284.4444" height="76.4444" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.7778" rx="6" />
  <text x="891.5556" y="298.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">file1.js (staged)</text>
  <line x1="436.4444" y1="272" x2="696" y2="272" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="565.3333" y="252.4444" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">git add</text>
  <line x1="701.3333" y1="416" x2="441.7778" y2="416" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="565.3333" y="483.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--danger-accent)">git restore --staged</text>
</svg>
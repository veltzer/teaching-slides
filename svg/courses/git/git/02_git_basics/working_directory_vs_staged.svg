<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="444.791667" height="580" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.164966" filter="url(#shadow)" />
  <text x="261.875" y="160.833333" text-anchor="middle" font-size="23.652001" font-weight="bold" fill="var(--primary-accent)">Working Directory</text>
  <rect x="95.208333" y="222.592667" width="333.333222" height="115.462833" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" rx="8.164966" />
  <text x="261.875" y="297.777833" text-anchor="middle" font-size="21.286746" fill="var(--text-muted)">file1.js (modified)</text>
  <rect x="95.208333" y="367.592667" width="333.333222" height="115.462833" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" rx="8.164966" />
  <text x="261.875" y="442.777833" text-anchor="middle" font-size="21.286746" fill="var(--text-muted)">file2.css (modified)</text>
  <rect x="795.208333" y="40" width="444.791667" height="580" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="8.164966" filter="url(#shadow)" />
  <text x="1018.125" y="160.833333" text-anchor="middle" font-size="23.652001" font-weight="bold" fill="var(--warn-accent)">Staging Area</text>
  <rect x="851.458222" y="222.592667" width="333.333222" height="115.462833" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.7778" rx="8.164966" />
  <text x="1018.125" y="297.777833" text-anchor="middle" font-size="21.286746" fill="var(--text-muted)">file1.js (staged)</text>
  <line x1="484.791556" y1="257.5" x2="788.958333" y2="257.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="635.833333" y="227.962833" text-anchor="middle" font-size="23.652001" font-weight="bold" fill="var(--primary-accent)">git add</text>
  <line x1="795.208333" y1="475" x2="491.041667" y2="475" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="635.833333" y="577.037167" text-anchor="middle" font-size="21.286746" font-weight="bold" fill="var(--danger-accent)">git restore --staged</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Working Directory -->
  <rect x="43" y="216" width="320" height="288" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="10" filter="url(#shadow)"/>
  <text x="203" y="320" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">Working</text>
  <text x="203" y="364" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">Directory</text>
  <text x="203" y="432" text-anchor="middle" font-size="18" fill="#555">edit files here</text>
  <!-- Staging Area -->
  <rect x="480" y="216" width="320" height="288" fill="#fff3e0" stroke="#f57c00" stroke-width="4" rx="10" filter="url(#shadow)"/>
  <text x="640" y="320" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">Staging Area</text>
  <text x="640" y="364" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">(Index)</text>
  <text x="640" y="432" text-anchor="middle" font-size="18" fill="#555">prepare commits</text>
  <!-- Repository -->
  <rect x="917" y="216" width="320" height="288" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4" rx="10" filter="url(#shadow)"/>
  <text x="1077" y="342" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">Repository</text>
  <text x="1077" y="400" text-anchor="middle" font-size="18" fill="#555">permanent history</text>
  <!-- Arrows -->
  <line x1="363" y1="360" x2="474" y2="360" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="418" y="330" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">git add</text>
  <line x1="800" y1="360" x2="911" y2="360" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="855" y="330" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">git commit</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="329.583333" y="40" text-anchor="middle" font-size="21.038436" font-weight="bold" fill="var(--text)">Mode</text>
  <text x="684.791667" y="40" text-anchor="middle" font-size="21.038436" font-weight="bold" fill="var(--text)">HEAD</text>
  <text x="906.666667" y="40" text-anchor="middle" font-size="21.038436" font-weight="bold" fill="var(--text)">Staging</text>
  <text x="1151.458333" y="40" text-anchor="middle" font-size="21.038436" font-weight="bold" fill="var(--text)">Working Dir</text>
  <line x1="106.666667" y1="56.996353" x2="1240" y2="56.996353" stroke="var(--border)" stroke-width="1.7778" />
  <rect x="106.666667" y="71.868178" width="444.791667" height="144.468934" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.262731" filter="url(#shadow)" />
  <text x="329.583333" y="156.849811" text-anchor="middle" font-size="21.038436" font-weight="bold" fill="var(--ok-accent)">--soft</text>
  <text x="684.791667" y="156.849811" text-anchor="middle" font-size="23.142207" fill="var(--ok-accent)">✔</text>
  <text x="906.666667" y="156.849811" text-anchor="middle" font-size="21.038436" fill="var(--text-faint)">unchanged</text>
  <text x="1151.458333" y="156.849811" text-anchor="middle" font-size="21.038436" fill="var(--text-faint)">unchanged</text>
  <text x="40" y="156.849811" text-anchor="middle" font-size="18.934544" fill="var(--ok-accent)">safe</text>
  <line x1="106.666667" y1="224.835223" x2="1240" y2="224.835223" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111" />
  <rect x="106.666667" y="237.582389" width="444.791667" height="144.468934" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.262731" filter="url(#shadow)" />
  <text x="329.583333" y="318.315098" text-anchor="middle" font-size="21.038436" font-weight="bold" fill="var(--warn-accent)">--mixed (default)</text>
  <text x="684.791667" y="318.315098" text-anchor="middle" font-size="23.142207" fill="var(--warn-accent)">✔</text>
  <text x="906.666667" y="318.315098" text-anchor="middle" font-size="23.142207" fill="var(--warn-accent)">✔ cleared</text>
  <text x="1151.458333" y="318.315098" text-anchor="middle" font-size="21.038436" fill="var(--text-faint)">unchanged</text>
  <text x="40" y="318.315098" text-anchor="middle" font-size="18.934544" fill="var(--warn-accent)">caution</text>
  <line x1="106.666667" y1="390.549433" x2="1240" y2="390.549433" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111" />
  <rect x="106.666667" y="403.296731" width="444.791667" height="144.468934" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.262731" filter="url(#shadow)" />
  <text x="329.583333" y="486.153836" text-anchor="middle" font-size="21.038436" font-weight="bold" fill="var(--danger-accent)">--hard</text>
  <text x="684.791667" y="486.153836" text-anchor="middle" font-size="23.142207" fill="var(--danger-accent)">✔</text>
  <text x="906.666667" y="486.153836" text-anchor="middle" font-size="23.142207" fill="var(--danger-accent)">✔ cleared</text>
  <text x="1151.458333" y="486.153836" text-anchor="middle" font-size="23.142207" fill="var(--danger-accent)">✔ cleared</text>
  <text x="40" y="486.153836" text-anchor="middle" font-size="18.934544" fill="var(--danger-accent)">danger!</text>
  <text x="618.125" y="620" text-anchor="middle" font-size="18.934544" fill="var(--text-muted)" font-style="italic">⚠ --hard discards uncommitted changes permanently</text>
</svg>
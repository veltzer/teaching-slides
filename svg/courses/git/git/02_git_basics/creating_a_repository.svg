<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- git init -->
  <rect x="213" y="72" width="256" height="144" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="10" filter="url(#shadow)"/>
  <text x="341" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">git init</text>
  <!-- git clone -->
  <rect x="811" y="72" width="256" height="144" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="4" rx="10" filter="url(#shadow)"/>
  <text x="939" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="#7b1fa2">git clone URL</text>
  <!-- Arrows -->
  <line x1="341" y1="216" x2="640" y2="468" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="939" y1="216" x2="640" y2="468" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="427" y="324" text-anchor="middle" font-size="18" fill="#555">creates new</text>
  <text x="853" y="324" text-anchor="middle" font-size="18" fill="#555">copies from remote</text>
  <!-- Local Repository result -->
  <rect x="427" y="468" width="426" height="180" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4" rx="10" filter="url(#shadow)"/>
  <text x="640" y="546" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">Local Repository</text>
  <text x="640" y="606" text-anchor="middle" font-size="18" fill="#555">(.git directory)</text>
</svg>

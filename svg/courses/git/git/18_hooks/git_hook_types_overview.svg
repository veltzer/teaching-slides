<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="500" height="537.037" fill="url(#grad-primary)" rx="6.324555320337" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="289.9999" y="93.703666666667" text-anchor="middle" fill="var(--bg)" font-size="27.358972223223" font-weight="bold" font-family="Arial, sans-serif">Client-Side Hooks</text>
  <text x="289.9999" y="136.666666666667" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">(Developer's machine)</text>
  <rect x="79.9999" y="168.888888888889" width="180" height="64.444444444444" fill="url(#grad-ok)" rx="6.324555320337" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="169.9999" y="211.851888888889" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">pre-commit</text>
  <rect x="279.9999" y="168.888888888889" width="220" height="64.444444444444" fill="url(#grad-ok)" rx="6.324555320337" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="389.9999" y="211.851888888889" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">prepare-commit-msg</text>
  <rect x="79.9999" y="254.814777777778" width="180" height="64.444444444444" fill="url(#grad-ok)" rx="6.324555320337" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="169.9999" y="297.777777777778" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">commit-msg</text>
  <rect x="279.9999" y="254.814777777778" width="220" height="64.444444444444" fill="url(#grad-ok)" rx="6.324555320337" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="389.9999" y="297.777777777778" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">post-commit</text>
  <rect x="79.9999" y="340.740777777778" width="180" height="64.444444444444" fill="url(#grad-warn)" rx="6.324555320337" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="169.9999" y="383.703666666667" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">pre-rebase</text>
  <rect x="279.9999" y="340.740777777778" width="220" height="64.444444444444" fill="url(#grad-warn)" rx="6.324555320337" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="389.9999" y="383.703666666667" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">post-checkout</text>
  <rect x="79.9999" y="426.666777777778" width="180" height="64.444444444444" fill="url(#grad-warn)" rx="6.324555320337" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="169.9999" y="469.629666666667" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">post-merge</text>
  <rect x="279.9999" y="426.666777777778" width="220" height="64.444444444444" fill="url(#grad-warn)" rx="6.324555320337" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="389.9999" y="469.629666666667" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">pre-push</text>
  <rect x="740" y="40" width="500" height="537.037" fill="url(#grad-danger)" rx="6.324555320337" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="989.9999" y="93.703666666667" text-anchor="middle" fill="var(--bg)" font-size="27.358972223223" font-weight="bold" font-family="Arial, sans-serif">Server-Side Hooks</text>
  <text x="989.9999" y="136.666666666667" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">(Git server)</text>
  <rect x="779.9999" y="211.851888888889" width="180" height="64.444444444444" fill="url(#grad-info)" rx="6.324555320337" stroke="var(--info-border)" stroke-width="2"/>
  <text x="869.9999" y="254.814777777778" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">pre-receive</text>
  <rect x="979.9998" y="211.851888888889" width="220" height="64.444444444444" fill="url(#grad-info)" rx="6.324555320337" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1089.9999" y="254.814777777778" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">update</text>
  <rect x="879.9999" y="340.740777777778" width="220" height="64.444444444444" fill="url(#grad-info)" rx="6.324555320337" stroke="var(--info-border)" stroke-width="2"/>
  <text x="989.9999" y="383.703666666667" text-anchor="middle" fill="var(--bg)" font-size="19.542138075053" font-family="Arial, sans-serif">post-receive</text>
  <text x="289.9999" y="620" text-anchor="middle" font-size="19.542138075053" font-family="Arial, sans-serif" fill="var(--text)">Run locally on developer machine</text>
  <text x="989.9999" y="620" text-anchor="middle" font-size="19.542138075053" font-family="Arial, sans-serif" fill="var(--text)">Run on Git server during push</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="372.4137" height="580" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="226.2069" y="120.5555" text-anchor="middle" font-size="25.839" font-weight="bold" fill="var(--primary-accent)">GitHub</text>
  <line x1="81.3793" y1="152.7777" x2="371.0346" y2="152.7777" stroke="var(--primary-border)" stroke-width="1.9961" />
  <text x="226.2069" y="233.3334" text-anchor="middle" font-size="21.8638">Pull Requests</text>
  <text x="226.2069" y="313.8889" text-anchor="middle" font-size="21.8638">Actions (CI/CD)</text>
  <text x="226.2069" y="394.4444" text-anchor="middle" font-size="21.8638">Issues</text>
  <text x="226.2069" y="475" text-anchor="middle" font-size="21.8638">Packages</text>
  <rect x="453.7931" y="40" width="372.4137" height="580" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="640" y="120.5555" text-anchor="middle" font-size="25.839" font-weight="bold" fill="var(--warn-accent)">GitLab</text>
  <line x1="495.1724" y1="152.7777" x2="784.8276" y2="152.7777" stroke="var(--warn-border)" stroke-width="1.9961" />
  <text x="640" y="233.3334" text-anchor="middle" font-size="21.8638">CI/CD Pipelines</text>
  <text x="640" y="313.8889" text-anchor="middle" font-size="21.8638">Container Registry</text>
  <text x="640" y="394.4444" text-anchor="middle" font-size="21.8638">Wiki</text>
  <text x="640" y="475" text-anchor="middle" font-size="21.8638">Issue Boards</text>
  <rect x="867.5863" y="40" width="372.4137" height="580" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1053.7931" y="120.5555" text-anchor="middle" font-size="25.839" font-weight="bold" fill="var(--primary-accent)">BitBucket</text>
  <line x1="908.9655" y1="152.7777" x2="1198.6207" y2="152.7777" stroke="var(--primary-border)" stroke-width="1.9961" />
  <text x="1053.7931" y="233.3334" text-anchor="middle" font-size="21.8638">Pipelines</text>
  <text x="1053.7931" y="313.8889" text-anchor="middle" font-size="21.8638">Jira Integration</text>
  <text x="1053.7931" y="394.4444" text-anchor="middle" font-size="21.8638">Teams</text>
  <text x="1053.7931" y="475" text-anchor="middle" font-size="21.8638">Code Review</text>
</svg>
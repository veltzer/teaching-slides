<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="19.961" y="33.6842" width="359.2982" height="606.3158" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="199.6101" y="117.8947" text-anchor="middle" font-size="25.9493" font-weight="bold" fill="var(--primary-accent)">GitHub</text>
  <line x1="59.883" y1="151.5789" x2="339.3373" y2="151.5789" stroke="var(--primary-border)" stroke-width="1.9961" />
  <text x="199.6101" y="235.7895" text-anchor="middle" font-size="21.9571">Pull Requests</text>
  <text x="199.6101" y="320" text-anchor="middle" font-size="21.9571">Actions (CI/CD)</text>
  <text x="199.6101" y="404.2105" text-anchor="middle" font-size="21.9571">Issues</text>
  <text x="199.6101" y="488.4211" text-anchor="middle" font-size="21.9571">Packages</text>
  <rect x="419.1813" y="33.6842" width="359.2982" height="606.3158" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="117.8947" text-anchor="middle" font-size="25.9493" font-weight="bold" fill="var(--warn-accent)">GitLab</text>
  <line x1="459.1033" y1="151.5789" x2="738.5575" y2="151.5789" stroke="var(--warn-border)" stroke-width="1.9961" />
  <text x="598.8304" y="235.7895" text-anchor="middle" font-size="21.9571">CI/CD Pipelines</text>
  <text x="598.8304" y="320" text-anchor="middle" font-size="21.9571">Container Registry</text>
  <text x="598.8304" y="404.2105" text-anchor="middle" font-size="21.9571">Wiki</text>
  <text x="598.8304" y="488.4211" text-anchor="middle" font-size="21.9571">Issue Boards</text>
  <rect x="818.4016" y="33.6842" width="359.2982" height="606.3158" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="998.0507" y="117.8947" text-anchor="middle" font-size="25.9493" font-weight="bold" fill="var(--primary-accent)">BitBucket</text>
  <line x1="858.3236" y1="151.5789" x2="1137.7778" y2="151.5789" stroke="var(--primary-border)" stroke-width="1.9961" />
  <text x="998.0507" y="235.7895" text-anchor="middle" font-size="21.9571">Pipelines</text>
  <text x="998.0507" y="320" text-anchor="middle" font-size="21.9571">Jira Integration</text>
  <text x="998.0507" y="404.2105" text-anchor="middle" font-size="21.9571">Teams</text>
  <text x="998.0507" y="488.4211" text-anchor="middle" font-size="21.9571">Code Review</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="bisect_arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 14.9333 10.8 z" fill="#333" />
    </marker>
  </defs>
  <circle cx="45.7143" cy="115.7143" r="20.5714" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.2857" />
  <text x="45.7143" y="123.4286" text-anchor="middle" font-size="11.4286" font-weight="bold">C1</text>
  <circle cx="137.1429" cy="115.7143" r="20.5714" fill="var(--ok-fill)" stroke="var(--text-faint)" stroke-width="1.7143" />
  <text x="137.1429" y="123.4286" text-anchor="middle" font-size="11.4286">C2</text>
  <circle cx="228.5714" cy="115.7143" r="20.5714" fill="var(--ok-fill)" stroke="var(--text-faint)" stroke-width="1.7143" />
  <text x="228.5714" y="123.4286" text-anchor="middle" font-size="11.4286">C3</text>
  <circle cx="320" cy="115.7143" r="20.5714" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2857" />
  <text x="320" y="123.4286" text-anchor="middle" font-size="11.4286" font-weight="bold">C4</text>
  <circle cx="411.4286" cy="115.7143" r="20.5714" fill="var(--danger-fill)" stroke="var(--text-faint)" stroke-width="1.7143" />
  <text x="411.4286" y="123.4286" text-anchor="middle" font-size="11.4286">C5</text>
  <circle cx="502.8571" cy="115.7143" r="20.5714" fill="var(--danger-fill)" stroke="var(--text-faint)" stroke-width="1.7143" />
  <text x="502.8571" y="123.4286" text-anchor="middle" font-size="11.4286">C6</text>
  <circle cx="594.2857" cy="115.7143" r="20.5714" fill="var(--danger-fill)" stroke="var(--text-faint)" stroke-width="1.7143" />
  <text x="594.2857" y="123.4286" text-anchor="middle" font-size="11.4286">C7</text>
  <circle cx="640" cy="115.7143" r="20.5714" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.2857" />
  <text x="640" y="123.4286" text-anchor="middle" font-size="11.4286" font-weight="bold">C8</text>
  <line x1="66.2857" y1="115.7143" x2="114.2857" y2="115.7143" stroke="var(--text)" stroke-width="1.7143" marker-end="url(#bisect_arrow)" />
  <line x1="157.7143" y1="115.7143" x2="205.7143" y2="115.7143" stroke="var(--text)" stroke-width="1.7143" marker-end="url(#bisect_arrow)" />
  <line x1="249.1429" y1="115.7143" x2="297.1429" y2="115.7143" stroke="var(--text)" stroke-width="1.7143" marker-end="url(#bisect_arrow)" />
  <line x1="340.5714" y1="115.7143" x2="388.5714" y2="115.7143" stroke="var(--text)" stroke-width="1.7143" marker-end="url(#bisect_arrow)" />
  <line x1="432" y1="115.7143" x2="480" y2="115.7143" stroke="var(--text)" stroke-width="1.7143" marker-end="url(#bisect_arrow)" />
  <line x1="523.4286" y1="115.7143" x2="571.4286" y2="115.7143" stroke="var(--text)" stroke-width="1.7143" marker-end="url(#bisect_arrow)" />
  <line x1="614.8571" y1="115.7143" x2="617.1428" y2="115.7143" stroke="var(--text)" stroke-width="1.7143" />
  <text x="45.7143" y="38.5714" text-anchor="middle" font-size="12.5714" fill="var(--ok-accent)" font-weight="bold">good</text>
  <line x1="45.7143" y1="46.2857" x2="45.7143" y2="81" stroke="var(--ok-border)" stroke-width="1.1428" stroke-dasharray="3.4286" />
  <text x="640" y="38.5714" text-anchor="middle" font-size="12.5714" fill="var(--danger-accent)" font-weight="bold">bad</text>
  <line x1="640" y1="46.2857" x2="640" y2="81" stroke="var(--danger-border)" stroke-width="1.1428" stroke-dasharray="3.4286" />
  <text x="320" y="192.8571" text-anchor="middle" font-size="12.5714" fill="var(--warn-accent)" font-weight="bold">bisect test</text>
  <line x1="320" y1="150.4286" x2="320" y2="173.5714" stroke="var(--warn-border)" stroke-width="1.1428" stroke-dasharray="3.4286" />
  <path d="M 45.7143 231.4286 L 45.7143 250.7143 L 320 250.7143 L 320 231.4286" fill="none" stroke="var(--ok-border)" stroke-width="1.7143" />
  <text x="182.8571" y="279.6428" text-anchor="middle" font-size="11.4286" fill="var(--ok-accent)">if good, search right half</text>
  <path d="M 320 298.9286 L 320 318.2143 L 640 318.2143 L 640 298.9286" fill="none" stroke="var(--danger-border)" stroke-width="1.7143" />
  <text x="480" y="347.1428" text-anchor="middle" font-size="11.4286" fill="var(--danger-accent)">if bad, search left half</text>
</svg>
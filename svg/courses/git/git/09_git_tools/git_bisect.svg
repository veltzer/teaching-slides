  <line x1="447.6618" y1="116.9882" x2="492.0475" y2="116.9882" stroke="var(--text)" stroke-width="0.9783" marker-end="url(#bisect_arrow)" />
  <line x1="532.2061" y1="116.9882" x2="576.5918" y2="116.9882" stroke="var(--text)" stroke-width="0.9783" marker-end="url(#bisect_arrow)" />
  <line x1="616.7503" y1="116.9882" x2="618.8639" y2="116.9882" stroke="var(--text)" stroke-width="0.9783" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="bisect_arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 14.9333 10.8 z" fill="#333" />
    </marker>
  </defs>
  <circle cx="158.5185" cy="205.0001" r="33.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.2857" />
  <text x="158.5185" y="217.5001" text-anchor="middle" font-size="18.5186" font-weight="bold">C1</text>
  <circle cx="306.6667" cy="205.0001" r="33.3333" fill="var(--ok-fill)" stroke="var(--text-faint)" stroke-width="1.7143" />
  <text x="306.6667" y="217.5001" text-anchor="middle" font-size="18.5186">C2</text>
  <circle cx="454.8147" cy="205.0001" r="33.3333" fill="var(--ok-fill)" stroke="var(--text-faint)" stroke-width="1.7143" />
  <text x="454.8147" y="217.5001" text-anchor="middle" font-size="18.5186">C3</text>
  <circle cx="602.9629" cy="205.0001" r="33.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2857" />
  <text x="602.9629" y="217.5001" text-anchor="middle" font-size="18.5186" font-weight="bold">C4</text>
  <circle cx="751.1112" cy="205.0001" r="33.3333" fill="var(--danger-fill)" stroke="var(--text-faint)" stroke-width="1.7143" />
  <text x="751.1112" y="217.5001" text-anchor="middle" font-size="18.5186">C5</text>
  <circle cx="899.2592" cy="205.0001" r="33.3333" fill="var(--danger-fill)" stroke="var(--text-faint)" stroke-width="1.7143" />
  <text x="899.2592" y="217.5001" text-anchor="middle" font-size="18.5186">C6</text>
  <circle cx="1047.4074" cy="205.0001" r="33.3333" fill="var(--danger-fill)" stroke="var(--text-faint)" stroke-width="1.7143" />
  <text x="1047.4074" y="217.5001" text-anchor="middle" font-size="18.5186">C7</text>
  <circle cx="1121.4815" cy="205.0001" r="33.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.2857" />
  <text x="1121.4815" y="217.5001" text-anchor="middle" font-size="18.5186" font-weight="bold">C8</text>
  <line x1="191.8518" y1="205.0001" x2="269.6296" y2="205.0001" stroke="var(--text)" stroke-width="1.7143" marker-end="url(#bisect_arrow)" />
  <line x1="340" y1="205.0001" x2="417.7778" y2="205.0001" stroke="var(--text)" stroke-width="1.7143" marker-end="url(#bisect_arrow)" />
  <line x1="488.1482" y1="205.0001" x2="565.926" y2="205.0001" stroke="var(--text)" stroke-width="1.7143" marker-end="url(#bisect_arrow)" />
  <line x1="636.2962" y1="205.0001" x2="714.074" y2="205.0001" stroke="var(--text)" stroke-width="1.7143" marker-end="url(#bisect_arrow)" />
  <line x1="784.4444" y1="205.0001" x2="862.2222" y2="205.0001" stroke="var(--text)" stroke-width="1.7143" marker-end="url(#bisect_arrow)" />
  <line x1="932.5927" y1="205.0001" x2="1010.3704" y2="205.0001" stroke="var(--text)" stroke-width="1.7143" marker-end="url(#bisect_arrow)" />
  <line x1="1080.7407" y1="205.0001" x2="1084.4444" y2="205.0001" stroke="var(--text)" stroke-width="1.7143" />
  <text x="158.5185" y="80" text-anchor="middle" font-size="20.3703" fill="var(--ok-accent)" font-weight="bold">good</text>
  <line x1="158.5185" y1="92.5" x2="158.5185" y2="148.7501" stroke="var(--ok-border)" stroke-width="1.1428" stroke-dasharray="3.4286" />
  <text x="1121.4815" y="80" text-anchor="middle" font-size="20.3703" fill="var(--danger-accent)" font-weight="bold">bad</text>
  <line x1="1121.4815" y1="92.5" x2="1121.4815" y2="148.7501" stroke="var(--danger-border)" stroke-width="1.1428" stroke-dasharray="3.4286" />
  <text x="602.9629" y="330" text-anchor="middle" font-size="20.3703" fill="var(--warn-accent)" font-weight="bold">bisect test</text>
  <line x1="602.9629" y1="261.2501" x2="602.9629" y2="298.75" stroke="var(--warn-border)" stroke-width="1.1428" stroke-dasharray="3.4286" />
  <path d="M 158.5185 392.5001 L 158.5185 423.7501 L 602.9629 423.7501 L 602.9629 392.5001" fill="none" stroke="var(--ok-border)" stroke-width="1.7143" />
  <text x="380.7406" y="470.625" text-anchor="middle" font-size="18.5186" fill="var(--ok-accent)">if good, search right half</text>
  <path d="M 602.9629 501.8751 L 602.9629 533.1251 L 1121.4815 533.1251 L 1121.4815 501.8751" fill="none" stroke="var(--danger-border)" stroke-width="1.7143" />
  <text x="862.2222" y="580" text-anchor="middle" font-size="18.5186" fill="var(--danger-accent)">if bad, search left half</text>
</svg>
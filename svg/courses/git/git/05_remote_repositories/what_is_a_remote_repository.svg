<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="514.2858" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.462197768561" filter="url(#shadow)"/>
  <text x="297.1428" y="109.600116" text-anchor="middle" font-size="33.843929856806" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Local Repository</text>
  <rect x="159.056" y="164.84848" width="104.744" height="121.50304" rx="15.078461459977" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="211.4285" y="237.2" text-anchor="middle" font-size="22.562655805636" fill="var(--bg)" font-family="Arial, sans-serif">.git</text>
  <text x="297.1428" y="341.6" text-anchor="middle" font-size="26.323008687162" font-family="Arial, sans-serif" fill="var(--ok-text)">Your Machine</text>
  <text x="74.2859" y="411.2" font-size="22.562655805636" font-family="Arial, sans-serif" fill="var(--ok-text)">• Full history</text>
  <text x="74.2859" y="457.599884" font-size="22.562655805636" font-family="Arial, sans-serif" fill="var(--ok-text)">• All branches</text>
  <text x="74.2859" y="504" font-size="22.562655805636" font-family="Arial, sans-serif" fill="var(--ok-text)">• Working directory</text>
  <text x="74.2859" y="550.4" font-size="22.562655805636" font-family="Arial, sans-serif" fill="var(--ok-text)">• Can work offline</text>
  <rect x="725.7142" y="40" width="514.2858" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.462197768561" filter="url(#shadow)"/>
  <text x="982.857" y="109.600116" text-anchor="middle" font-size="33.843929856806" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Remote Repository</text>
  <rect x="844.77" y="164.84848" width="104.744" height="121.50304" rx="15.078461459977" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="897.1427" y="237.2" text-anchor="middle" font-size="22.562655805636" fill="var(--bg)" font-family="Arial, sans-serif">origin</text>
  <text x="982.857" y="341.6" text-anchor="middle" font-size="26.323008687162" font-family="Arial, sans-serif" fill="var(--primary-text)">Server/Cloud</text>
  <text x="759.9998" y="411.2" font-size="22.562655805636" font-family="Arial, sans-serif" fill="var(--primary-text)">• Central location</text>
  <text x="759.9998" y="457.599884" font-size="22.562655805636" font-family="Arial, sans-serif" fill="var(--primary-text)">• Team collaboration</text>
  <text x="759.9998" y="504" font-size="22.562655805636" font-family="Arial, sans-serif" fill="var(--primary-text)">• Backup</text>
  <text x="759.9998" y="550.4" font-size="22.562655805636" font-family="Arial, sans-serif" fill="var(--primary-text)">• CI/CD integration</text>
  <path d="M 554.2858 272 L 725.7142 272" stroke="var(--text)" stroke-width="2.2687" marker-end="url(#arrow)"/>
  <path d="M 725.7142 318.4 L 554.2858 318.4" stroke="var(--text)" stroke-width="2.2687" marker-end="url(#arrow)"/>
  <text x="640" y="260.4" text-anchor="middle" font-size="20.682479364873" font-family="Arial, sans-serif" fill="var(--text)">push</text>
  <text x="640" y="364.799884" text-anchor="middle" font-size="20.682479364873" font-family="Arial, sans-serif" fill="var(--text)">fetch/pull</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

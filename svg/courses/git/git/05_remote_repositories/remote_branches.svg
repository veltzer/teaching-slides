<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="514.2857" height="310.714285714286" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="297.1429" y="102.142971428571" text-anchor="middle" font-size="28.426333307793" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Local Branches</text>
  <rect x="74.2858" y="143.571428571429" width="171.4286" height="62.142857142857" fill="url(#grad-ok)" rx="6.414269805898" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="185" text-anchor="middle" font-size="21.319749980844" fill="var(--bg)" font-family="Arial, sans-serif">main</text>
  <rect x="74.2858" y="226.428571428571" width="171.4286" height="62.142857142857" fill="url(#grad-ok)" rx="6.414269805898" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="267.857142857143" text-anchor="middle" font-size="21.319749980844" fill="var(--bg)" font-family="Arial, sans-serif">feature</text>
  <text x="297.1429" y="319.642857142857" text-anchor="middle" font-size="19.543104149107" font-family="Arial, sans-serif" fill="var(--ok-text)">You can modify</text>
  <rect x="725.7143" y="40" width="514.2857" height="310.714285714286" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="982.8571" y="102.142971428571" text-anchor="middle" font-size="28.426333307793" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Remote-Tracking Branches</text>
  <rect x="760" y="143.571428571429" width="257.1428" height="62.142857142857" fill="url(#grad-warn)" rx="6.414269805898" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="888.5715" y="185" text-anchor="middle" font-size="21.319749980844" fill="var(--bg)" font-family="Arial, sans-serif">origin/main</text>
  <rect x="760" y="226.428571428571" width="257.1428" height="62.142857142857" fill="url(#grad-warn)" rx="6.414269805898" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="888.5715" y="267.857142857143" text-anchor="middle" font-size="21.319749980844" fill="var(--bg)" font-family="Arial, sans-serif">origin/feature</text>
  <text x="982.8571" y="319.642857142857" text-anchor="middle" font-size="19.543104149107" font-family="Arial, sans-serif" fill="var(--warn-text)">Read-only references</text>
  <rect x="297.1429" y="412.857142857143" width="685.7143" height="207.142857142857" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.414269805898"/>
  <text x="640.0001" y="475" text-anchor="middle" font-size="24.873041644318" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Remote-tracking branches:</text>
  <text x="331.4286" y="526.785714285714" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--text)">• Show state of remote branches</text>
  <text x="331.4286" y="568.214285714286" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--text)">• Updated with fetch/pull</text>
  <text x="331.4286" y="609.642857142857" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--text)">• Cannot be directly modified</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="460" y="228.5" width="319.6875" height="203" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="620.3125" y="318.7223" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">Local Repository</text>
  <text x="620.3125" y="370.2777" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(your machine)</text>
  <rect x="920.3125" y="69" width="299.9999" height="145" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1070.3125" y="132.6389" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--info-accent)">origin</text>
  <text x="1070.3125" y="178.5556" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(your fork)</text>
  <rect x="920.3125" y="257.5" width="299.9999" height="145" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1070.3125" y="321.1389" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">upstream</text>
  <text x="1070.3125" y="367.8611" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(original project)</text>
  <rect x="920.3125" y="446" width="299.9999" height="145" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1070.3125" y="509.6389" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--warn-accent)">staging</text>
  <text x="1070.3125" y="556.3611" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(deploy target)</text>
  <line x1="779.6875" y1="286.5" x2="920.3125" y2="156" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="920.3125" y1="185" x2="779.6875" y2="301" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <line x1="920.3125" y1="330" x2="779.6875" y2="330" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <text x="850" y="315.5" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)">fetch</text>
  <line x1="779.6875" y1="359" x2="920.3125" y2="489.5" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="830.3124" y="446" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)">push</text>
  <text x="830.3124" y="219.6389" text-anchor="middle" font-size="13.9044" fill="var(--info-accent)">push/fetch</text>
</svg>
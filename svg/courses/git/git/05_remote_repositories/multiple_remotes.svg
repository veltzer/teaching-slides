<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="217.222222" width="504.562335" height="225.555556" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.945561" filter="url(#shadow)"/>
  <text x="293.020995" y="317.469222" text-anchor="middle" font-size="25.318001" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Local Repository</text>
  <text x="293.020995" y="374.753" text-anchor="middle" font-size="18.413044" fill="var(--text-muted)" font-family="Arial, sans-serif">(your machine)</text>
  <rect x="766.510576" y="40" width="473.489424" height="161.111111" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.945561" filter="url(#shadow)"/>
  <text x="1003.255367" y="110.709889" text-anchor="middle" font-size="23.016437" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">origin</text>
  <text x="1003.255367" y="161.728444" text-anchor="middle" font-size="18.413044" fill="var(--text-muted)" font-family="Arial, sans-serif">(your fork)</text>
  <rect x="766.510576" y="249.444444" width="473.489424" height="161.111111" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.945561" filter="url(#shadow)"/>
  <text x="1003.255367" y="320.154333" text-anchor="middle" font-size="23.016437" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">upstream</text>
  <text x="1003.255367" y="372.067889" text-anchor="middle" font-size="18.413044" fill="var(--text-muted)" font-family="Arial, sans-serif">(original project)</text>
  <rect x="766.510576" y="458.888889" width="473.489424" height="161.111111" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.945561" filter="url(#shadow)"/>
  <text x="1003.255367" y="529.598778" text-anchor="middle" font-size="23.016437" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">staging</text>
  <text x="1003.255367" y="581.512333" text-anchor="middle" font-size="18.413044" fill="var(--text-muted)" font-family="Arial, sans-serif">(deploy target)</text>
  <line x1="544.562335" y1="281.666667" x2="766.510576" y2="136.666667" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="766.510576" y1="168.888889" x2="544.562335" y2="297.777778" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)"/>
  <line x1="766.510576" y1="330" x2="544.562335" y2="330" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)"/>
  <text x="655.536456" y="313.888889" text-anchor="middle" font-size="18.413044" fill="var(--ok-accent)" font-family="Arial, sans-serif">fetch</text>
  <line x1="544.562335" y1="362.222222" x2="766.510576" y2="507.222222" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="624.463544" y="458.888889" text-anchor="middle" font-size="18.413044" fill="var(--warn-accent)" font-family="Arial, sans-serif">push</text>
  <text x="624.463544" y="207.376556" text-anchor="middle" font-size="18.413044" fill="var(--info-accent)" font-family="Arial, sans-serif">push/fetch</text>
</svg>

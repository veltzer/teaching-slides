<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Local Repository -->
  <rect x="448" y="234" width="341" height="252" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="619" y="346" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Local Repository</text>
  <text x="619" y="410" text-anchor="middle" font-size="16" fill="#555">(your machine)</text>
  <!-- origin -->
  <rect x="939" y="36" width="320" height="180" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="1099" y="115" text-anchor="middle" font-size="20" font-weight="bold" fill="#6a1b9a">origin</text>
  <text x="1099" y="172" text-anchor="middle" font-size="16" fill="#555">(your fork)</text>
  <!-- upstream -->
  <rect x="939" y="270" width="320" height="180" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="1099" y="349" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">upstream</text>
  <text x="1099" y="407" text-anchor="middle" font-size="16" fill="#555">(original project)</text>
  <!-- staging -->
  <rect x="939" y="504" width="320" height="180" fill="#fff3e0" stroke="#e65100" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="1099" y="583" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">staging</text>
  <text x="1099" y="641" text-anchor="middle" font-size="16" fill="#555">(deploy target)</text>
  <!-- Arrows: push to origin -->
  <line x1="789" y1="306" x2="939" y2="144" stroke="#6a1b9a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="939" y1="180" x2="789" y2="324" stroke="#6a1b9a" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <!-- fetch upstream -->
  <line x1="939" y1="360" x2="789" y2="360" stroke="#2e7d32" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="864" y="342" text-anchor="middle" font-size="16" fill="#2e7d32">fetch</text>
  <!-- push staging -->
  <line x1="789" y1="396" x2="939" y2="558" stroke="#e65100" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="843" y="504" text-anchor="middle" font-size="16" fill="#e65100">push</text>
  <text x="843" y="223" text-anchor="middle" font-size="16" fill="#6a1b9a">push/fetch</text>
</svg>

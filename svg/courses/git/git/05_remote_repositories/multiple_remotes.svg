<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="217.222222" width="504.562335" height="225.555556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.945561" filter="url(#shadow)" />
  <text x="293.020995" y="317.469222" text-anchor="middle" font-size="25.318001" font-weight="bold" fill="var(--primary-accent)">Local Repository</text>
  <text x="293.020995" y="374.753" text-anchor="middle" font-size="18.413044" fill="var(--text-muted)">(your machine)</text>
  <rect x="766.510576" y="40" width="473.489424" height="161.111111" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.945561" filter="url(#shadow)" />
  <text x="1003.255367" y="110.709889" text-anchor="middle" font-size="23.016437" font-weight="bold" fill="var(--info-accent)">origin</text>
  <text x="1003.255367" y="161.728444" text-anchor="middle" font-size="18.413044" fill="var(--text-muted)">(your fork)</text>
  <rect x="766.510576" y="249.444444" width="473.489424" height="161.111111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.945561" filter="url(#shadow)" />
  <text x="1003.255367" y="320.154333" text-anchor="middle" font-size="23.016437" font-weight="bold" fill="var(--ok-accent)">upstream</text>
  <text x="1003.255367" y="372.067889" text-anchor="middle" font-size="18.413044" fill="var(--text-muted)">(original project)</text>
  <rect x="766.510576" y="458.888889" width="473.489424" height="161.111111" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.945561" filter="url(#shadow)" />
  <text x="1003.255367" y="529.598778" text-anchor="middle" font-size="23.016437" font-weight="bold" fill="var(--warn-accent)">staging</text>
  <text x="1003.255367" y="581.512333" text-anchor="middle" font-size="18.413044" fill="var(--text-muted)">(deploy target)</text>
  <line x1="544.562335" y1="281.666667" x2="766.510576" y2="136.666667" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="766.510576" y1="168.888889" x2="544.562335" y2="297.777778" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <line x1="766.510576" y1="330" x2="544.562335" y2="330" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <text x="655.536456" y="313.888889" text-anchor="middle" font-size="18.413044" fill="var(--ok-accent)">fetch</text>
  <line x1="544.562335" y1="362.222222" x2="766.510576" y2="507.222222" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="624.463544" y="458.888889" text-anchor="middle" font-size="18.413044" fill="var(--warn-accent)">push</text>
  <text x="624.463544" y="207.376556" text-anchor="middle" font-size="18.413044" fill="var(--info-accent)">push/fetch</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="548.5714" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.414269173951" filter="url(#shadow)"/>
  <text x="314.2856" y="102.142844897962" text-anchor="middle" font-size="31.979621820565" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">git fetch</text>
  <rect x="272.738" y="158.230948131833" width="83.0952" height="94.965924144645" rx="14.966628072551" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="314.2856" y="216.071051020483" text-anchor="middle" font-size="18.760240670998" fill="var(--bg)" font-family="Arial, sans-serif">Remote</text>
  <path d="M 314.2856 257.499842857174 L 314.2856 319.642916326519" stroke="var(--text)" stroke-width="0.9677" marker-end="url(#arrow)"/>
  <rect x="272.738" y="323.945201193064" width="83.0952" height="94.965924144645" rx="14.966628072551" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="314.2856" y="381.785646938789" text-anchor="middle" font-size="18.760240670998" fill="var(--bg)" font-family="Arial, sans-serif">origin/main</text>
  <text x="314.2856" y="454.285404081694" text-anchor="middle" font-size="21.319747880377" font-family="Arial, sans-serif" fill="var(--ok-text)">Updates references only</text>
  <text x="314.2856" y="495.713967347002" text-anchor="middle" font-size="21.319747880377" font-family="Arial, sans-serif" fill="var(--ok-text)">Safe - no merge</text>
  <text x="314.2856" y="537.142416326618" text-anchor="middle" font-size="21.319747880377" font-family="Arial, sans-serif" fill="var(--ok-text)">Review before integrating</text>
  <rect x="691.4286" y="40" width="548.5714" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.414269173951" filter="url(#shadow)"/>
  <text x="965.7144" y="102.142844897962" text-anchor="middle" font-size="31.979621820565" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">git pull</text>
  <rect x="924.167" y="158.230948131833" width="83.0952" height="94.965924144645" rx="14.966628072551" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="965.7144" y="216.071051020483" text-anchor="middle" font-size="18.760240670998" fill="var(--bg)" font-family="Arial, sans-serif">Remote</text>
  <path d="M 965.7144 257.499842857174 L 965.7144 319.642916326519" stroke="var(--text)" stroke-width="0.9677" marker-end="url(#arrow)"/>
  <rect x="838.453" y="323.945201193064" width="83.0952" height="94.965924144645" rx="14.966628072551" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="880.0003" y="381.785646938789" text-anchor="middle" font-size="18.760240670998" fill="var(--bg)" font-family="Arial, sans-serif">origin/main</text>
  <rect x="1009.88" y="323.945201193064" width="83.0952" height="94.965924144645" rx="14.966628072551" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="1051.4287" y="381.785646938789" text-anchor="middle" font-size="18.760240670998" fill="var(--bg)" font-family="Arial, sans-serif">main</text>
  <path d="M 922.8573 371.428620408154 L 1008.5717 371.428620408154" stroke="var(--text)" stroke-width="0.9677" marker-end="url(#arrow)"/>
  <text x="965.7144" y="454.285404081694" text-anchor="middle" font-size="21.319747880377" font-family="Arial, sans-serif" fill="var(--primary-text)">Fetch + Merge</text>
  <text x="965.7144" y="495.713967347002" text-anchor="middle" font-size="21.319747880377" font-family="Arial, sans-serif" fill="var(--primary-text)">Updates working branch</text>
  <text x="965.7144" y="537.142416326618" text-anchor="middle" font-size="21.319747880377" font-family="Arial, sans-serif" fill="var(--primary-text)">Can cause conflicts</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

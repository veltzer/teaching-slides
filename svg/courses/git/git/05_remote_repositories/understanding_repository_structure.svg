<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Working Directory -->
  <rect x="21" y="252" width="235" height="216" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="139" y="346" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">Working</text>
  <text x="139" y="404" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">Directory</text>
  <!-- Staging Area -->
  <rect x="341" y="252" width="235" height="216" fill="#fff3e0" stroke="#e65100" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="459" y="346" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">Staging</text>
  <text x="459" y="404" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">Area</text>
  <!-- Local Repository -->
  <rect x="661" y="252" width="235" height="216" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="779" y="346" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">Local</text>
  <text x="779" y="404" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">Repository</text>
  <!-- Remote Repository -->
  <rect x="981" y="252" width="256" height="216" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="1109" y="346" text-anchor="middle" font-size="18" font-weight="bold" fill="#6a1b9a">Remote</text>
  <text x="1109" y="404" text-anchor="middle" font-size="18" font-weight="bold" fill="#6a1b9a">Repository</text>
  <!-- Forward arrows -->
  <line x1="256" y1="317" x2="341" y2="317" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="299" y="297" text-anchor="middle" font-size="16" fill="#333">git add</text>
  <line x1="576" y1="317" x2="661" y2="317" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="619" y="297" text-anchor="middle" font-size="16" fill="#333">git commit</text>
  <line x1="896" y1="317" x2="981" y2="317" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="939" y="297" text-anchor="middle" font-size="16" fill="#333">git push</text>
  <!-- Back arrows -->
  <line x1="981" y1="425" x2="896" y2="425" stroke="#888" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="939" y="504" text-anchor="middle" font-size="16" fill="#888">git fetch</text>
  <line x1="661" y1="425" x2="256" y2="425" stroke="#888" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="459" y="558" text-anchor="middle" font-size="16" fill="#888">git checkout / git restore</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="18.6667" y="224" width="208.8889" height="192" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="123.5556" y="307.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-accent)">Working</text>
  <text x="123.5556" y="359.1111" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-accent)">Directory</text>
  <rect x="303.1111" y="224" width="208.8889" height="192" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="408" y="307.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-accent)">Staging</text>
  <text x="408" y="359.1111" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-accent)">Area</text>
  <rect x="587.5556" y="224" width="208.8889" height="192" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="692.4444" y="307.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-accent)">Local</text>
  <text x="692.4444" y="359.1111" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-accent)">Repository</text>
  <rect x="872" y="224" width="227.5556" height="192" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="985.7778" y="307.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--info-accent)">Remote</text>
  <text x="985.7778" y="359.1111" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--info-accent)">Repository</text>
  <line x1="227.5556" y1="281.7778" x2="303.1111" y2="281.7778" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="265.7778" y="264" text-anchor="middle" font-size="14.2222" fill="var(--text)">git add</text>
  <line x1="512" y1="281.7778" x2="587.5556" y2="281.7778" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="550.2222" y="264" text-anchor="middle" font-size="14.2222" fill="var(--text)">git commit</text>
  <line x1="796.4444" y1="281.7778" x2="872" y2="281.7778" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="834.6667" y="264" text-anchor="middle" font-size="14.2222" fill="var(--text)">git push</text>
  <line x1="872" y1="377.7778" x2="796.4444" y2="377.7778" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="834.6667" y="448" text-anchor="middle" font-size="14.2222" fill="var(--text-faint)">git fetch</text>
  <line x1="587.5556" y1="377.7778" x2="227.5556" y2="377.7778" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <text x="408" y="496" text-anchor="middle" font-size="14.2222" fill="var(--text-faint)">git checkout / git restore</text>
</svg>
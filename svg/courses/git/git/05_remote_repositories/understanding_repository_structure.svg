<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="231.907895" height="409.411766" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.442673" filter="url(#shadow)" />
  <text x="156.447368" y="218.170117" text-anchor="middle" font-size="24.617837" font-weight="bold" fill="var(--primary-accent)">Working</text>
  <text x="156.447368" y="328.104471" text-anchor="middle" font-size="24.617837" font-weight="bold" fill="var(--primary-accent)">Directory</text>
  <rect x="355.789474" y="40" width="231.907895" height="409.411766" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="9.442673" filter="url(#shadow)" />
  <text x="472.236842" y="218.170117" text-anchor="middle" font-size="24.617837" font-weight="bold" fill="var(--warn-accent)">Staging</text>
  <text x="472.236842" y="328.104471" text-anchor="middle" font-size="24.617837" font-weight="bold" fill="var(--warn-accent)">Area</text>
  <rect x="671.578947" y="40" width="231.907895" height="409.411766" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="9.442673" filter="url(#shadow)" />
  <text x="788.026211" y="218.170117" text-anchor="middle" font-size="24.617837" font-weight="bold" fill="var(--ok-accent)">Local</text>
  <text x="788.026211" y="328.104471" text-anchor="middle" font-size="24.617837" font-weight="bold" fill="var(--ok-accent)">Repository</text>
  <rect x="987.368421" y="40" width="252.631579" height="409.411766" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="9.442673" filter="url(#shadow)" />
  <text x="1113.684211" y="218.170117" text-anchor="middle" font-size="24.617837" font-weight="bold" fill="var(--info-accent)">Remote</text>
  <text x="1113.684211" y="328.104471" text-anchor="middle" font-size="24.617837" font-weight="bold" fill="var(--info-accent)">Repository</text>
  <line x1="271.907895" y1="163.202588" x2="355.789474" y2="163.202588" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="314.342105" y="125.294118" text-anchor="middle" font-size="21.882453" fill="var(--text)">git add</text>
  <line x1="587.697368" y1="163.202588" x2="671.578947" y2="163.202588" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="630.131579" y="125.294118" text-anchor="middle" font-size="21.882453" fill="var(--text)">git commit</text>
  <line x1="903.486737" y1="163.202588" x2="987.368421" y2="163.202588" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="945.921053" y="125.294118" text-anchor="middle" font-size="21.882453" fill="var(--text)">git push</text>
  <line x1="987.368421" y1="367.908471" x2="903.486737" y2="367.908471" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="945.921053" y="517.647058" text-anchor="middle" font-size="21.882453" fill="var(--text-faint)">git fetch</text>
  <line x1="671.578947" y1="367.908471" x2="271.907895" y2="367.908471" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <text x="472.236842" y="620" text-anchor="middle" font-size="21.882453" fill="var(--text-faint)">git checkout / git restore</text>
</svg>
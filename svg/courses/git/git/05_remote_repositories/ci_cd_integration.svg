<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="106.183" height="179.503805112929" rx="18.20276530425" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="93.0914" y="145.071336759052" text-anchor="middle" font-size="27.611644670265" fill="var(--bg)" font-family="Arial, sans-serif">Push</text>
  <path d="M 151.4085 129.751057299667 L 229.1653 129.751057299667" stroke="var(--text)" stroke-width="1.0237" marker-end="url(#arrow)"/>
  <rect x="229.1653" y="53.14966000274" width="194.3913" height="153.202963645214" fill="url(#grad-primary)" rx="7.801575189649" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.361" y="145.071336759052" text-anchor="middle" font-size="27.611644670265" fill="var(--bg)" font-family="Arial, sans-serif">Webhook</text>
  <path d="M 423.5566 129.751057299667 L 501.3133 129.751057299667" stroke="var(--text)" stroke-width="1.0237" marker-end="url(#arrow)"/>
  <rect x="501.3133" y="53.14966000274" width="194.3913" height="153.202963645214" fill="url(#grad-warn)" rx="7.801575189649" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.5086" y="145.071336759052" text-anchor="middle" font-size="27.611644670265" fill="var(--bg)" font-family="Arial, sans-serif">CI Build</text>
  <path d="M 695.7046 129.751057299667 L 773.4609 129.751057299667" stroke="var(--text)" stroke-width="1.0237" marker-end="url(#arrow)"/>
  <rect x="773.4609" y="53.14966000274" width="194.3913" height="153.202963645214" fill="url(#grad-info)" rx="7.801575189649" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870.6567" y="145.071336759052" text-anchor="middle" font-size="27.611644670265" fill="var(--bg)" font-family="Arial, sans-serif">Tests</text>
  <path d="M 967.8524 129.751057299667 L 1045.6087 129.751057299667" stroke="var(--text)" stroke-width="1.0237" marker-end="url(#arrow)"/>
  <rect x="1045.6087" y="53.14966000274" width="194.3913" height="153.202963645214" fill="url(#grad-danger)" rx="7.801575189649" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1142.8045" y="145.071336759052" text-anchor="middle" font-size="27.611644670265" fill="var(--bg)" font-family="Arial, sans-serif">Deploy</text>
  <rect x="287.4827" y="313.594410812292" width="777.5655" height="306.405589187708" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.801575189649"/>
  <text x="676.2654" y="405.516256619964" text-anchor="middle" font-size="32.213563778683" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Triggers:</text>
  <text x="326.361" y="482.11782296825" font-size="27.611644670265" font-family="Arial, sans-serif" fill="var(--text)">• Push to branch</text>
  <text x="326.361" y="543.398940805792" font-size="27.611644670265" font-family="Arial, sans-serif" fill="var(--text)">• Pull request</text>
  <text x="637.387" y="482.11782296825" font-size="27.611644670265" font-family="Arial, sans-serif" fill="var(--text)">• Tag creation</text>
  <text x="637.387" y="543.398940805792" font-size="27.611644670265" font-family="Arial, sans-serif" fill="var(--text)">• Schedule</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="599.9999" height="165.714285714286" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="340.0001" y="91.785714285714" text-anchor="middle" font-size="24.873041644318" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Fast-Forward Push</text>
  <rect x="135.072" y="115.082285714286" width="49.857" height="56.979428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="220.786" y="115.082285714286" width="49.857" height="56.979428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="306.5" y="115.082285714286" width="49.857" height="56.979428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="392.214" y="115.082285714286" width="49.857" height="56.979428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <line x1="185.7143" y1="143.571428571429" x2="220.0001" y2="143.571428571429" stroke="var(--text)" stroke-width="2"/>
  <line x1="271.4286" y1="143.571428571429" x2="305.7143" y2="143.571428571429" stroke="var(--text)" stroke-width="2"/>
  <line x1="357.1429" y1="143.571428571429" x2="391.4286" y2="143.571428571429" stroke="var(--text)" stroke-width="2"/>
  <text x="502.8572" y="153.928571428571" font-size="19.543104149107" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Success</text>
  <rect x="674.2857" y="40" width="565.7143" height="165.714285714286" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="957.1428" y="91.785714285714" text-anchor="middle" font-size="24.873041644318" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Non-Fast-Forward Push</text>
  <rect x="752.214" y="115.082285714286" width="49.857" height="56.979428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="837.929" y="73.653714285714" width="49.857" height="56.979428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="837.929" y="156.510857142857" width="49.857" height="56.979428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="923.643" y="156.510857142857" width="49.857" height="56.979428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <line x1="802.8571" y1="143.571428571429" x2="837.1429" y2="112.5" stroke="var(--text)" stroke-width="2"/>
  <line x1="802.8571" y1="143.571428571429" x2="837.1429" y2="174.642857142857" stroke="var(--text)" stroke-width="2"/>
  <line x1="888.5715" y1="185" x2="922.8571" y2="185" stroke="var(--text)" stroke-width="2"/>
  <text x="1102.8571" y="153.928571428571" font-size="19.543104149107" font-family="Arial, sans-serif" fill="var(--danger-text)">✗ Rejected</text>
  <rect x="40" y="247.142857142857" width="1199.9999" height="165.714285714286" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="640.0001" y="298.928571428571" text-anchor="middle" font-size="24.873041644318" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Force Push (Rewrites History)</text>
  <rect x="357.929" y="322.225142857143" width="49.857" height="56.979428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="443.643" y="322.225142857143" width="49.857" height="56.979428571429" rx="14.966629547096" fill="url(#grad-warn)" stroke-dasharray="4.7407 4.7407" filter="url(#shadow)"/>
  <rect x="529.357" y="322.225142857143" width="49.857" height="56.979428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="615.072" y="322.225142857143" width="49.857" height="56.979428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <line x1="408.5714" y1="350.714285714286" x2="442.8572" y2="350.714285714286" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4.7407 4.7407"/>
  <line x1="494.2858" y1="350.714285714286" x2="528.5714" y2="350.714285714286" stroke="var(--text)" stroke-width="2"/>
  <line x1="580" y1="350.714285714286" x2="614.2858" y2="350.714285714286" stroke="var(--text)" stroke-width="2"/>
  <text x="811.4286" y="361.071428571429" font-size="19.543104149107" font-family="Arial, sans-serif" fill="var(--warn-text)">⚠️ Dangerous!</text>
  <rect x="297.1429" y="454.285714285714" width="685.7143" height="165.714285714286" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.414269805898"/>
  <text x="640.0001" y="516.428571428571" text-anchor="middle" font-size="23.096395812581" font-family="Arial, sans-serif" fill="var(--text)">Non-fast-forward? Pull first, then push</text>
  <text x="640.0001" y="568.214285714286" text-anchor="middle" font-size="21.319749980844" font-family="Courier New, monospace" fill="var(--text)">git pull --rebase &amp;&amp; git push</text>
</svg>

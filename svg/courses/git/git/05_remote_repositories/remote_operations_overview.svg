<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Local Repository -->
  <rect x="107" y="216" width="384" height="288" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="299" y="342" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Local Repository</text>
  <text x="299" y="414" text-anchor="middle" font-size="16" fill="#555">(your machine)</text>
  <!-- Remote Repository -->
  <rect x="789" y="216" width="384" height="288" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="981" y="342" text-anchor="middle" font-size="22" font-weight="bold" fill="#6a1b9a">Remote Repository</text>
  <text x="981" y="414" text-anchor="middle" font-size="16" fill="#555">(e.g., GitHub)</text>
  <!-- push arrow -->
  <line x1="491" y1="280" x2="789" y2="280" stroke="#1565c0" stroke-width="4" marker-end="url(#arrow-accent)"/>
  <text x="640" y="258" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">git push</text>
  <!-- fetch arrow -->
  <line x1="789" y1="360" x2="491" y2="360" stroke="#6a1b9a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="640" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#6a1b9a">git fetch</text>
  <!-- pull arrow -->
  <line x1="789" y1="450" x2="491" y2="450" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="640" y="435" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">git pull (fetch+merge)</text>
</svg>

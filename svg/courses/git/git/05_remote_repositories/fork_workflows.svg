<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="151.232279" y="40" width="502.508179" height="152.631579" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.272936" filter="url(#shadow)"/>
  <text x="402.486369" y="109.532211" text-anchor="middle" font-size="21.067999" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Original Repo</text>
  <text x="402.486369" y="158.713368" text-anchor="middle" font-size="16.854302" fill="var(--text-muted)" font-family="Arial, sans-serif">(upstream)</text>
  <rect x="737.491821" y="253.684211" width="502.508179" height="152.631579" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.272936" filter="url(#shadow)"/>
  <text x="988.745911" y="321.520421" text-anchor="middle" font-size="21.067999" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Your Fork</text>
  <text x="988.745911" y="370.701789" text-anchor="middle" font-size="16.854302" fill="var(--text-muted)" font-family="Arial, sans-serif">(origin, on GitHub)</text>
  <rect x="151.232279" y="467.368421" width="502.508179" height="152.631579" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.272936" filter="url(#shadow)"/>
  <text x="402.486369" y="535.204632" text-anchor="middle" font-size="21.067999" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Local Clone</text>
  <text x="402.486369" y="584.386" text-anchor="middle" font-size="16.854302" fill="var(--text-muted)" font-family="Arial, sans-serif">(your machine)</text>
  <line x1="653.740458" y1="116.315789" x2="737.491821" y2="284.210526" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="764.972737" y="192.631579" text-anchor="middle" font-size="16.854302" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">fork</text>
  <line x1="877.513631" y1="406.315789" x2="653.740458" y2="497.894737" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="806.848419" y="476.695895" text-anchor="middle" font-size="16.854302" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">git clone</text>
  <line x1="653.740458" y1="513.157895" x2="877.513631" y2="391.052632" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <text x="821.243045" y="528.421053" text-anchor="middle" font-size="16.854302" fill="var(--info-accent)" font-family="Arial, sans-serif">git push</text>
  <line x1="988.745911" y1="253.684211" x2="626.259542" y2="116.315789" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="14.2222 7.1111" marker-end="url(#arrow)" />
  <text x="877.513631" y="146.842105" text-anchor="middle" font-size="16.854302" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Pull Request</text>
  <line x1="234.983642" y1="192.631579" x2="234.983642" y2="467.368421" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <text x="40" y="345.263158" text-anchor="middle" font-size="16.854302" fill="var(--ok-accent)" font-family="Arial, sans-serif">fetch upstream</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="341.3333" y="16" width="341.3333" height="160" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="512" y="88.8889" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">Original Repo</text>
  <text x="512" y="140.4444" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">(upstream)</text>
  <rect x="739.5556" y="240" width="341.3333" height="160" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="910.2222" y="311.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--info-accent)">Your Fork</text>
  <text x="910.2222" y="362.6667" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">(origin, on GitHub)</text>
  <rect x="341.3333" y="464" width="341.3333" height="160" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="512" y="535.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">Local Clone</text>
  <text x="512" y="586.6667" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">(your machine)</text>
  <line x1="682.6667" y1="96" x2="739.5556" y2="272" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="758.2222" y="176" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--info-accent)">fork</text>
  <line x1="834.6667" y1="400" x2="682.6667" y2="496" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="786.6667" y="473.7778" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">git clone</text>
  <line x1="682.6667" y1="512" x2="834.6667" y2="384" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <text x="796.4444" y="528" text-anchor="middle" font-size="14.2222" fill="var(--info-accent)">git push</text>
  <line x1="910.2222" y1="240" x2="664" y2="96" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="14.2222 7.1111" marker-end="url(#arrow)" />
  <text x="834.6667" y="128" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--warn-accent)">Pull Request</text>
  <line x1="398.2222" y1="176" x2="398.2222" y2="464" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <text x="265.7778" y="336" text-anchor="middle" font-size="14.2222" fill="var(--ok-accent)">fetch upstream</text>
</svg>
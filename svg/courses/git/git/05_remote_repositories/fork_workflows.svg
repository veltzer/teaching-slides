<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Original Repo -->
  <rect x="384" y="18" width="384" height="180" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="576" y="100" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">Original Repo</text>
  <text x="576" y="158" text-anchor="middle" font-size="16" fill="#555">(upstream)</text>
  <!-- Your Fork -->
  <rect x="832" y="270" width="384" height="180" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="1024" y="350" text-anchor="middle" font-size="20" font-weight="bold" fill="#6a1b9a">Your Fork</text>
  <text x="1024" y="408" text-anchor="middle" font-size="16" fill="#555">(origin, on GitHub)</text>
  <!-- Local Clone -->
  <rect x="384" y="522" width="384" height="180" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="576" y="602" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">Local Clone</text>
  <text x="576" y="660" text-anchor="middle" font-size="16" fill="#555">(your machine)</text>
  <!-- Fork arrow -->
  <line x1="768" y1="108" x2="832" y2="306" stroke="#6a1b9a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="853" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#6a1b9a">fork</text>
  <!-- Clone arrow -->
  <line x1="939" y1="450" x2="768" y2="558" stroke="#1565c0" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="885" y="533" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">git clone</text>
  <!-- Push arrow (dashed) -->
  <line x1="768" y1="576" x2="939" y2="432" stroke="#6a1b9a" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="896" y="594" text-anchor="middle" font-size="16" fill="#6a1b9a">git push</text>
  <!-- Pull Request arrow (dashed) -->
  <line x1="1024" y1="270" x2="747" y2="108" stroke="#e65100" stroke-width="4" stroke-dasharray="16 8" marker-end="url(#arrow)"/>
  <text x="939" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">Pull Request</text>
  <!-- fetch upstream arrow (dashed) -->
  <line x1="448" y1="198" x2="448" y2="522" stroke="#2e7d32" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="299" y="378" text-anchor="middle" font-size="16" fill="#2e7d32">fetch upstream</text>
</svg>

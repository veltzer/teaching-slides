<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="297.1429" y="40" width="685.7143" height="223.076869822489" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.44503365266"/>
  <text x="640" y="129.230840236682" text-anchor="middle" font-size="66.373534568555" font-family="Courier New, monospace" fill="var(--text)">v2.1.3</text>
  <text x="485.7143" y="218.461565088756" text-anchor="middle" font-size="25.811930109994" font-family="Arial, sans-serif" fill="var(--text)">MAJOR</text>
  <text x="640" y="218.461565088756" text-anchor="middle" font-size="25.811930109994" font-family="Arial, sans-serif" fill="var(--text)">MINOR</text>
  <text x="794.2857" y="218.461565088756" text-anchor="middle" font-size="25.811930109994" font-family="Arial, sans-serif" fill="var(--text)">PATCH</text>
  <line x1="554.2857" y1="140.384608727811" x2="554.2857" y2="185.000028846152" stroke="var(--text-muted)" stroke-width="1.6"/>
  <line x1="725.7143" y1="140.384608727811" x2="725.7143" y2="185.000028846152" stroke="var(--text-muted)" stroke-width="1.6"/>
  <rect x="40" y="307.69228994083" width="377.1429" height="312.30771005917" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="228.5714" y="374.615362426037" text-anchor="middle" font-size="25.811930109994" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">MAJOR (v3.0.0)</text>
  <text x="74.2857" y="430.384666420115" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--danger-text)">Breaking changes</text>
  <text x="74.2857" y="474.999971153848" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--danger-text)">Incompatible API</text>
  <text x="74.2857" y="519.615391272189" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--danger-text)">Major rewrite</text>
  <text x="74.2857" y="564.23081139053" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--danger-text)">Example: v1.x → v2.0</text>
  <rect x="451.4286" y="307.69228994083" width="377.1429" height="312.30771005917" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="640" y="374.615362426037" text-anchor="middle" font-size="25.811930109994" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">MINOR (v2.2.0)</text>
  <text x="485.7143" y="430.384666420115" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--warn-text)">New features</text>
  <text x="485.7143" y="474.999971153848" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--warn-text)">Backwards compatible</text>
  <text x="485.7143" y="519.615391272189" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--warn-text)">Additions</text>
  <text x="485.7143" y="564.23081139053" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--warn-text)">Example: v2.1 → v2.2</text>
  <rect x="862.8571" y="307.69228994083" width="377.1429" height="312.30771005917" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="1051.4286" y="374.615362426037" text-anchor="middle" font-size="25.811930109994" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">PATCH (v2.1.4)</text>
  <text x="897.1429" y="430.384666420115" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--ok-text)">Bug fixes</text>
  <text x="897.1429" y="474.999971153848" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--ok-text)">Security patches</text>
  <text x="897.1429" y="519.615391272189" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--ok-text)">No new features</text>
  <text x="897.1429" y="564.23081139053" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--ok-text)">Example: v2.1.3 → v2.1.4</text>
</svg>

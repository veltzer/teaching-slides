<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="165.714285714286" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.414269805898"/>
  <text x="640.0001" y="102.142971428571" text-anchor="middle" font-size="30.70393361137" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Step 1: Create Remote Repository</text>
  <text x="640.0001" y="153.928571428571" text-anchor="middle" font-size="23.027976934652" font-family="Arial, sans-serif" fill="var(--text)">GitHub/GitLab/Bitbucket → New Repository</text>
  <text x="640.0001" y="185" text-anchor="middle" font-size="23.027976934652" font-family="Arial, sans-serif" fill="var(--text)">Don't initialize with README if pushing existing code</text>
  <rect x="40" y="247.142857142857" width="560" height="372.857142857143" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="320.0001" y="309.285714285714" text-anchor="middle" font-size="30.70393361137" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Existing Project</text>
  <text x="80" y="371.428571428571" font-size="21.108934313224" font-family="Courier New, monospace" fill="var(--ok-text)">git remote add origin URL</text>
  <text x="80" y="412.857142857143" font-size="21.108934313224" font-family="Courier New, monospace" fill="var(--ok-text)">git branch -M main</text>
  <text x="80" y="454.285714285714" font-size="21.108934313224" font-family="Courier New, monospace" fill="var(--ok-text)">git push -u origin main</text>
  <text x="320.0001" y="516.428571428571" text-anchor="middle" font-size="23.027976934652" font-family="Arial, sans-serif" fill="var(--ok-text)">Pushes existing commits</text>
  <text x="320.0001" y="557.857142857143" text-anchor="middle" font-size="23.027976934652" font-family="Arial, sans-serif" fill="var(--ok-text)">Sets up tracking</text>
  <rect x="680" y="247.142857142857" width="560" height="372.857142857143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="960.0001" y="309.285714285714" text-anchor="middle" font-size="30.70393361137" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">New Project</text>
  <text x="720" y="371.428571428571" font-size="21.108934313224" font-family="Courier New, monospace" fill="var(--primary-text)">git init</text>
  <text x="720" y="412.857142857143" font-size="21.108934313224" font-family="Courier New, monospace" fill="var(--primary-text)">git add .</text>
  <text x="720" y="454.285714285714" font-size="21.108934313224" font-family="Courier New, monospace" fill="var(--primary-text)">git commit -m "Initial"</text>
  <text x="720" y="495.714285714286" font-size="21.108934313224" font-family="Courier New, monospace" fill="var(--primary-text)">git remote add origin URL</text>
  <text x="720" y="537.142857142857" font-size="21.108934313224" font-family="Courier New, monospace" fill="var(--primary-text)">git push -u origin main</text>
  <text x="960.0001" y="588.928571428571" text-anchor="middle" font-size="23.027976934652" font-family="Arial, sans-serif" fill="var(--primary-text)">Creates first commit</text>
</svg>

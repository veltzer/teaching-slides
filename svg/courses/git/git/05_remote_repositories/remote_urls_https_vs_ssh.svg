<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="548.5714" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="314.2858" y="102.142971428571" text-anchor="middle" font-size="31.97951806677" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">HTTPS</text>
  <rect x="74.2858" y="143.571428571429" width="479.9999" height="62.142857142857" fill="url(#grad-ok)" rx="6.414269805898" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2858" y="185" text-anchor="middle" font-size="17.76645831737" fill="var(--bg)" font-family="Courier New, monospace">https://github.com/user/repo.git</text>
  <text x="74.2858" y="257.5" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Works everywhere</text>
  <text x="74.2858" y="298.928571428571" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Firewall friendly</text>
  <text x="74.2858" y="340.357142857143" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Easy setup</text>
  <text x="74.2858" y="381.785714285714" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--ok-text)">✗ Password/token each push</text>
  <text x="74.2858" y="423.214285714286" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--ok-text)">✗ Less secure (without 2FA)</text>
  <text x="314.2858" y="485.357142857143" text-anchor="middle" font-size="23.096395812581" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Best for:</text>
  <text x="74.2858" y="526.785714285714" font-size="19.543104149107" font-family="Arial, sans-serif" fill="var(--ok-text)">• Public repositories</text>
  <text x="74.2858" y="568.214285714286" font-size="19.543104149107" font-family="Arial, sans-serif" fill="var(--ok-text)">• Quick clones</text>
  <rect x="691.4286" y="40" width="548.5714" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="965.7143" y="102.142971428571" text-anchor="middle" font-size="31.97951806677" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">SSH</text>
  <rect x="725.7143" y="143.571428571429" width="479.9999" height="62.142857142857" fill="url(#grad-primary)" rx="6.414269805898" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965.7143" y="185" text-anchor="middle" font-size="17.76645831737" fill="var(--bg)" font-family="Courier New, monospace">git@github.com:user/repo.git</text>
  <text x="725.7143" y="257.5" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--primary-text)">✓ No password after setup</text>
  <text x="725.7143" y="298.928571428571" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--primary-text)">✓ More secure</text>
  <text x="725.7143" y="340.357142857143" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--primary-text)">✓ Key-based auth</text>
  <text x="725.7143" y="381.785714285714" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--primary-text)">✗ Initial setup required</text>
  <text x="725.7143" y="423.214285714286" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--primary-text)">✗ Port 22 may be blocked</text>
  <text x="965.7143" y="485.357142857143" text-anchor="middle" font-size="23.096395812581" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Best for:</text>
  <text x="725.7143" y="526.785714285714" font-size="19.543104149107" font-family="Arial, sans-serif" fill="var(--primary-text)">• Regular contributors</text>
  <text x="725.7143" y="568.214285714286" font-size="19.543104149107" font-family="Arial, sans-serif" fill="var(--primary-text)">• Private repositories</text>
</svg>

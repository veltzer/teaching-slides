<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="40" y1="328.4817" x2="1197.1428" y2="328.4817" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618.5714" y="620" text-anchor="middle" font-size="19.6368" fill="var(--text-faint)" font-family="Arial, sans-serif">Workflow Timeline: commit → push → receive</text>
  <rect x="40" y="49.1099" width="535.7142" height="60.733" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.8571" y="91.623" text-anchor="middle" font-size="21.6006" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Client-side Hooks</text>
  <rect x="50.7143" y="140.2094" width="214.2857" height="145.7592" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="157.857" y="191.8324" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">pre-commit</text>
  <text x="157.857" y="231.3089" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)" font-family="Arial, sans-serif">lint, test, format</text>
  <rect x="150.002" y="320.627" width="15.7096" height="15.7096" rx="7.8548" fill="var(--primary-accent)"/>
  <rect x="286.4285" y="140.2094" width="214.2857" height="145.7592" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="393.5714" y="182.7225" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">prepare-</text>
  <text x="393.5714" y="216.1257" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">commit-msg</text>
  <text x="393.5714" y="255.6021" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)" font-family="Arial, sans-serif">template msg</text>
  <rect x="385.717" y="320.627" width="15.7096" height="15.7096" rx="7.8548" fill="var(--primary-accent)"/>
  <rect x="522.1428" y="358.8482" width="192.8572" height="121.4659" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="618.5714" y="410.4712" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">commit-msg</text>
  <text x="618.5714" y="449.9477" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)" font-family="Arial, sans-serif">validate msg</text>
  <rect x="610.717" y="320.627" width="15.7096" height="15.7096" rx="7.8548" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="736.4285" y="358.8482" width="192.8572" height="121.4659" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="832.8571" y="410.4712" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">post-commit</text>
  <text x="832.8571" y="449.9477" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)" font-family="Arial, sans-serif">notify</text>
  <rect x="825.002" y="320.627" width="15.7096" height="15.7096" rx="7.8548" fill="var(--warn-accent)"/>
  <rect x="940" y="49.1099" width="300" height="60.733" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.9999" y="91.623" text-anchor="middle" font-size="21.6006" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Server-side Hooks</text>
  <rect x="950.7143" y="140.2094" width="182.1428" height="145.7592" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1040.7143" y="191.8324" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">pre-receive</text>
  <text x="1040.7143" y="231.3089" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)" font-family="Arial, sans-serif">policy check</text>
  <rect x="1032.86" y="320.627" width="15.7096" height="15.7096" rx="7.8548" fill="var(--ok-accent)"/>
  <rect x="950.7143" y="358.8482" width="182.1428" height="121.4659" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1040.7143" y="410.4712" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">update</text>
  <text x="1040.7143" y="449.9477" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)" font-family="Arial, sans-serif">per-ref check</text>
  <rect x="950.7143" y="495.4973" width="182.1428" height="106.2827" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1040.7143" y="547.1205" text-anchor="middle" font-size="19.6368" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">post-receive</text>
  <text x="1040.7143" y="583.5602" text-anchor="middle" font-size="19.6368" fill="var(--text-muted)" font-family="Arial, sans-serif">CI/CD trigger</text>
  <line x1="929.2857" y1="40" x2="929.2857" y2="601.7801" stroke="var(--border)" stroke-width="1.935" stroke-dasharray="9.675 5.805"/>
</svg>

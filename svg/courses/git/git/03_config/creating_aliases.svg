<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="514.2857" height="124.285714285714" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="297.1428" y="91.785714285714" text-anchor="middle" font-size="24.873041644318" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Without Alias</text>
  <text x="297.1428" y="133.214285714286" text-anchor="middle" font-size="21.319749980844" font-family="Courier New, monospace" fill="var(--danger-text)">git log --oneline --graph --all</text>
  <rect x="725.7143" y="40" width="514.2857" height="124.285714285714" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="982.8571" y="91.785714285714" text-anchor="middle" font-size="24.873041644318" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">With Alias</text>
  <text x="982.8571" y="133.214285714286" text-anchor="middle" font-size="21.319749980844" font-family="Courier New, monospace" fill="var(--ok-text)">git lol</text>
  <path d="M 554.2857 102.142857142857 L 725.7143 102.142857142857" stroke="var(--text)" stroke-width="2.8444" marker-end="url(#arrow)"/>
  <text x="640" y="81.428571428571" text-anchor="middle" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--text)">Define once</text>
  <rect x="297.1428" y="247.142857142857" width="685.7143" height="372.857142857143" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.414269805898"/>
  <text x="640" y="309.285714285714" text-anchor="middle" font-size="28.426333307793" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Common Aliases</text>
  <text x="331.4286" y="371.428571428571" font-size="23.096395812581" font-family="Courier New, monospace" fill="var(--text)">st = status</text>
  <text x="674.2857" y="371.428571428571" font-size="23.096395812581" font-family="Courier New, monospace" fill="var(--text)">co = checkout</text>
  <text x="331.4286" y="423.214285714286" font-size="23.096395812581" font-family="Courier New, monospace" fill="var(--text)">br = branch</text>
  <text x="674.2857" y="423.214285714286" font-size="23.096395812581" font-family="Courier New, monospace" fill="var(--text)">cm = commit</text>
  <text x="331.4286" y="475" font-size="23.096395812581" font-family="Courier New, monospace" fill="var(--text)">unstage = restore --staged</text>
  <text x="331.4286" y="526.785714285714" font-size="23.096395812581" font-family="Courier New, monospace" fill="var(--text)">last = log -1 HEAD</text>
  <text x="331.4286" y="578.571428571429" font-size="23.096395812581" font-family="Courier New, monospace" fill="var(--text)">visual = !gitk</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

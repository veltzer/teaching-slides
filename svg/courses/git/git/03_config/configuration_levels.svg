<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="449.411765" width="1192.171482" height="170.588235" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.107992"/>
  <text x="636.085741" y="523.333294" text-anchor="middle" font-size="22.649142" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">System</text>
  <text x="636.085741" y="576.405176" text-anchor="middle" font-size="18.531127" fill="var(--text-muted)" font-family="Arial, sans-serif">/etc/gitconfig</text>
  <rect x="206.635601" y="244.705882" width="858.90028" height="170.588235" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.107992"/>
  <text x="636.085741" y="318.627412" text-anchor="middle" font-size="22.649142" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">User</text>
  <text x="636.085741" y="371.699294" text-anchor="middle" font-size="18.531127" fill="var(--text-muted)" font-family="Arial, sans-serif">~/.gitconfig</text>
  <rect x="385.573159" y="40" width="501.025163" height="170.588235" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.107992"/>
  <text x="636.085741" y="113.921529" text-anchor="middle" font-size="22.649142" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Repository</text>
  <text x="636.085741" y="166.993412" text-anchor="middle" font-size="18.531127" fill="var(--text-muted)" font-family="Arial, sans-serif">.git/config</text>
  <line x1="1240" y1="551.764706" x2="1240" y2="91.176471" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1202.5" y="354.1667" text-anchor="start" font-size="15.6425" fill="var(--text)" transform="rotate(-90,1240,390)" font-family="Arial, sans-serif">Higher priority</text>
</svg>

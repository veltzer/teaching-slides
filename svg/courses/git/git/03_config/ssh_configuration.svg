<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="514.2857" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.462197768561"/>
  <text x="297.1429" y="121.2" text-anchor="middle" font-size="33.844037560102" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">SSH</text>
  <text x="297.1429" y="190.8" text-anchor="middle" font-size="22.562655805636" font-family="Arial, sans-serif" fill="var(--primary-text)">git@github.com:user/repo.git</text>
  <text x="74.2857" y="272" font-size="24.442939949695" font-family="Arial, sans-serif" fill="var(--primary-text)">✓ No password after setup</text>
  <text x="74.2857" y="330" font-size="24.442939949695" font-family="Arial, sans-serif" fill="var(--primary-text)">✓ More secure</text>
  <text x="74.2857" y="388" font-size="24.442939949695" font-family="Arial, sans-serif" fill="var(--primary-text)">✓ Per-machine keys</text>
  <text x="74.2857" y="446" font-size="24.442939949695" font-family="Arial, sans-serif" fill="var(--primary-text)">✗ Initial setup required</text>
  <text x="74.2857" y="504" font-size="24.442939949695" font-family="Arial, sans-serif" fill="var(--primary-text)">✗ Firewall issues (port 22)</text>
  <rect x="725.7143" y="40" width="514.2857" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.462197768561"/>
  <text x="982.8571" y="121.2" text-anchor="middle" font-size="33.844037560102" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">HTTPS</text>
  <text x="982.8571" y="190.8" text-anchor="middle" font-size="22.562655805636" font-family="Arial, sans-serif" fill="var(--warn-text)">https://github.com/user/repo.git</text>
  <text x="760" y="272" font-size="24.442939949695" font-family="Arial, sans-serif" fill="var(--warn-text)">✓ Works everywhere</text>
  <text x="760" y="330" font-size="24.442939949695" font-family="Arial, sans-serif" fill="var(--warn-text)">✓ No setup needed</text>
  <text x="760" y="388" font-size="24.442939949695" font-family="Arial, sans-serif" fill="var(--warn-text)">✓ Firewall friendly</text>
  <text x="760" y="446" font-size="24.442939949695" font-family="Arial, sans-serif" fill="var(--warn-text)">✗ Need credentials often</text>
  <text x="760" y="504" font-size="24.442939949695" font-family="Arial, sans-serif" fill="var(--warn-text)">✗ Less secure (if no 2FA)</text>
</svg>

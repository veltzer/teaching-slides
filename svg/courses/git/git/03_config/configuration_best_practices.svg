<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="548.5714" height="271.875014062499" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="314.2857" y="94.375070312494" text-anchor="middle" font-size="28.203377016031" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Global Settings</text>
  <text x="74.2857" y="148.750028124998" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--ok-text)">• User identity</text>
  <text x="74.2857" y="185" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--ok-text)">• Editor preference</text>
  <text x="74.2857" y="221.250084374993" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--ok-text)">• Common aliases</text>
  <text x="74.2857" y="257.500056249995" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--ok-text)">• Color preferences</text>
  <rect x="691.4286" y="40" width="548.5714" height="271.875014062499" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="965.7143" y="94.375070312494" text-anchor="middle" font-size="28.203377016031" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Local Settings</text>
  <text x="725.7143" y="148.750028124998" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--primary-text)">• Project-specific user</text>
  <text x="725.7143" y="185" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--primary-text)">• Special workflows</text>
  <text x="725.7143" y="221.250084374993" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--primary-text)">• Hooks configuration</text>
  <text x="725.7143" y="257.500056249995" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--primary-text)">• Signing requirements</text>
  <rect x="40" y="348.124985937501" width="548.5714" height="271.875014062499" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="314.2857" y="402.500056249995" text-anchor="middle" font-size="28.203377016031" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Team Settings</text>
  <text x="74.2857" y="456.875014062499" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--warn-text)">• .gitignore (tracked)</text>
  <text x="74.2857" y="493.124985937501" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--warn-text)">• .gitattributes (tracked)</text>
  <text x="74.2857" y="529.374957812504" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--warn-text)">• .editorconfig (tracked)</text>
  <text x="74.2857" y="565.625042187496" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--warn-text)">• Hooks in repo</text>
  <rect x="691.4286" y="348.124985937501" width="548.5714" height="271.875014062499" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="965.7143" y="402.500056249995" text-anchor="middle" font-size="28.203377016031" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Never Share</text>
  <text x="725.7143" y="456.875014062499" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--danger-text)">• Credentials</text>
  <text x="725.7143" y="493.124985937501" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--danger-text)">• Personal paths</text>
  <text x="725.7143" y="529.374957812504" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--danger-text)">• IDE-specific configs</text>
  <text x="725.7143" y="565.625042187496" font-size="21.152532762024" font-family="Arial, sans-serif" fill="var(--danger-text)">• Local experiments</text>
</svg>

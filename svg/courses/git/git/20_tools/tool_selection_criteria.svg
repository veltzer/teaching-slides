<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="327.2728" height="214.153810863904" fill="url(#grad-primary)" rx="6.270811595833" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6362" y="84.615418224853" text-anchor="middle" fill="var(--bg)" font-size="23.493282103209" font-weight="bold" font-family="Arial, sans-serif">Individual</text>
  <text x="203.6362" y="111.384603621301" text-anchor="middle" fill="var(--bg)" font-size="23.493282103209" font-weight="bold" font-family="Arial, sans-serif">Developer</text>
  <text x="203.6362" y="147.076850816566" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">• Command line</text>
  <text x="203.6362" y="173.846145443787" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">• IDE integration</text>
  <text x="203.6362" y="200.615330840235" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">• Desktop apps</text>
  <text x="203.6362" y="227.384625467456" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">• GitHub Desktop</text>
  <rect x="476.3637" y="40" width="327.2728" height="214.153810863904" fill="url(#grad-danger)" rx="6.270811595833" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.615418224853" text-anchor="middle" fill="var(--bg)" font-size="23.493282103209" font-weight="bold" font-family="Arial, sans-serif">Small Team</text>
  <text x="640" y="111.384603621301" text-anchor="middle" fill="var(--bg)" font-size="23.493282103209" font-weight="bold" font-family="Arial, sans-serif">(2-10 people)</text>
  <text x="640" y="147.076850816566" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">• GitHub/GitLab</text>
  <text x="640" y="173.846145443787" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">• Basic CI/CD</text>
  <text x="640" y="200.615330840235" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">• Shared workflows</text>
  <text x="640" y="227.384625467456" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">• Code reviews</text>
  <rect x="912.7272" y="40" width="327.2728" height="214.153810863904" fill="url(#grad-ok)" rx="6.270811595833" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3637" y="84.615418224853" text-anchor="middle" fill="var(--bg)" font-size="23.493282103209" font-weight="bold" font-family="Arial, sans-serif">Enterprise</text>
  <text x="1076.3637" y="111.384603621301" text-anchor="middle" fill="var(--bg)" font-size="23.493282103209" font-weight="bold" font-family="Arial, sans-serif">(10+ people)</text>
  <text x="1076.3637" y="147.076850816566" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">• GitLab/BitBucket</text>
  <text x="1076.3637" y="173.846145443787" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">• Advanced CI/CD</text>
  <text x="640" y="200.615330840235" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">• Security scanning</text>
  <text x="1076.3637" y="227.384625467456" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">• Compliance tools</text>
  <text x="40" y="307.692290887573" font-size="27.408776863647" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Project Type Considerations:</text>
  <rect x="40" y="343.38464731361" width="436.3637" height="107.076960047338" fill="url(#grad-warn)" rx="6.270811595833" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="258.1818" y="379.076894508875" text-anchor="middle" fill="var(--bg)" font-size="21.535430209463" font-weight="bold" font-family="Arial, sans-serif">Open Source</text>
  <text x="258.1818" y="405.846189136096" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">GitHub, Travis CI, Codecov</text>
  <text x="258.1818" y="432.615374532544" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">Community tools, public repos</text>
  <rect x="585.4546" y="343.38464731361" width="436.3637" height="107.076960047338" fill="url(#grad-info)" rx="6.270811595833" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="803.6365" y="379.076894508875" text-anchor="middle" fill="var(--bg)" font-size="21.535430209463" font-weight="bold" font-family="Arial, sans-serif">Corporate</text>
  <text x="803.6365" y="405.846189136096" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">GitLab, Jenkins, Bamboo</text>
  <text x="803.6365" y="432.615374532544" text-anchor="middle" fill="var(--bg)" font-size="19.577787342771" font-family="Arial, sans-serif">On-premise, security, compliance</text>
  <text x="40" y="504.000087384618" font-size="27.408776863647" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Language-Specific:</text>
  <text x="40" y="539.692334579882" font-size="19.577787342771" font-family="Arial, sans-serif" fill="var(--text)">Python: GitPython, pre-commit, GitHub Actions</text>
  <text x="40" y="566.461519976331" font-size="19.577787342771" font-family="Arial, sans-serif" fill="var(--text)">Java: Eclipse EGit, IntelliJ, Maven/Gradle integration</text>
  <text x="40" y="593.230814603552" font-size="19.577787342771" font-family="Arial, sans-serif" fill="var(--text)">JavaScript: Husky, lint-staged, GitHub Actions</text>
  <text x="40" y="620" font-size="19.577787342771" font-family="Arial, sans-serif" fill="var(--text)">C#: Visual Studio, Azure DevOps, TFS</text>
</svg>

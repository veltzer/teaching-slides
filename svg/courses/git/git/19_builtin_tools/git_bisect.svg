<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="146.24" width="77.521122" height="77.5212" rx="13.999993" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="0.7444" filter="url(#shadow)"/>
  <text x="78.760561" y="199.5002" text-anchor="middle" font-size="21.533889" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">C1</text>
  <rect x="212.688827" y="146.24" width="77.521122" height="77.5212" rx="13.999993" fill="url(#grad-ok)" stroke="var(--text-faint)" stroke-width="0.5583" filter="url(#shadow)"/>
  <text x="251.449289" y="199.5002" text-anchor="middle" font-size="21.533889" font-family="Arial, sans-serif" fill="var(--ok-text)">C2</text>
  <rect x="385.377655" y="146.24" width="77.521122" height="77.5212" rx="13.999993" fill="url(#grad-ok)" stroke="var(--text-faint)" stroke-width="0.5583" filter="url(#shadow)"/>
  <text x="424.138316" y="199.5002" text-anchor="middle" font-size="21.533889" font-family="Arial, sans-serif" fill="var(--ok-text)">C3</text>
  <rect x="558.066482" y="146.24" width="77.521122" height="77.5212" rx="13.999993" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="0.7444" filter="url(#shadow)"/>
  <text x="596.827243" y="199.5002" text-anchor="middle" font-size="21.533889" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">C4</text>
  <rect x="730.755309" y="146.24" width="77.521122" height="77.5212" rx="13.999993" fill="url(#grad-danger)" stroke="var(--text-faint)" stroke-width="0.5583" filter="url(#shadow)"/>
  <text x="769.51607" y="199.5002" text-anchor="middle" font-size="21.533889" font-family="Arial, sans-serif" fill="var(--danger-text)">C5</text>
  <rect x="903.444137" y="146.24" width="77.521122" height="77.5212" rx="13.999993" fill="url(#grad-danger)" stroke="var(--text-faint)" stroke-width="0.5583" filter="url(#shadow)"/>
  <text x="942.204898" y="199.5002" text-anchor="middle" font-size="21.533889" font-family="Arial, sans-serif" fill="var(--danger-text)">C6</text>
  <rect x="1076.128964" y="146.24" width="77.521122" height="77.5212" rx="13.999993" fill="url(#grad-danger)" stroke="var(--text-faint)" stroke-width="0.5583" filter="url(#shadow)"/>
  <text x="1114.893925" y="199.5002" text-anchor="middle" font-size="21.533889" font-family="Arial, sans-serif" fill="var(--danger-text)">C7</text>
  <rect x="1162.478878" y="146.24" width="77.521122" height="77.5212" rx="13.999993" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="0.7444" filter="url(#shadow)"/>
  <text x="1201.238239" y="199.5002" text-anchor="middle" font-size="21.533889" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">C8</text>
  <line x1="117.615622" y1="185.0002" x2="208.277132" y2="185.0002" stroke="var(--text)" stroke-width="0.5583" marker-end="url(#arrow)"/>
  <line x1="290.30455" y1="185.0002" x2="380.966159" y2="185.0002" stroke="var(--text)" stroke-width="0.5583" marker-end="url(#arrow)"/>
  <line x1="462.993377" y1="185.0002" x2="553.655186" y2="185.0002" stroke="var(--text)" stroke-width="0.5583" marker-end="url(#arrow)"/>
  <line x1="635.682104" y1="185.0002" x2="726.343814" y2="185.0002" stroke="var(--text)" stroke-width="0.5583" marker-end="url(#arrow)"/>
  <line x1="808.370932" y1="185.0002" x2="899.032641" y2="185.0002" stroke="var(--text)" stroke-width="0.5583" marker-end="url(#arrow)"/>
  <line x1="981.059959" y1="185.0002" x2="1071.721668" y2="185.0002" stroke="var(--text)" stroke-width="0.5583" marker-end="url(#arrow)"/>
  <line x1="1153.748786" y1="185.0002" x2="1158.065882" y2="185.0002" stroke="var(--text)" stroke-width="0.5583"/>
  <text x="78.760561" y="40" text-anchor="middle" font-size="23.687088" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">good</text>
  <line x1="78.760561" y1="54.5" x2="78.760561" y2="119.7502" stroke="var(--ok-border)" stroke-width="0.3722" stroke-dasharray="1.1166"/>
  <text x="1201.238239" y="40" text-anchor="middle" font-size="23.687088" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">bad</text>
  <line x1="1201.238239" y1="54.5" x2="1201.238239" y2="119.7502" stroke="var(--danger-border)" stroke-width="0.3722" stroke-dasharray="1.1166"/>
  <text x="596.827243" y="330" text-anchor="middle" font-size="23.687088" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">bisect test</text>
  <line x1="596.827243" y1="250.2502" x2="596.827243" y2="293.7501" stroke="var(--warn-border)" stroke-width="0.3722" stroke-dasharray="1.1166"/>
  <path d="M 78.760561 402.5002 L 78.760561 438.7501 L 596.827243 438.7501 L 596.827243 402.5002" fill="none" stroke="var(--ok-border)" stroke-width="0.5583"/>
  <text x="337.793702" y="493.1251" text-anchor="middle" font-size="21.533889" fill="var(--ok-accent)" font-family="Arial, sans-serif">if good, search right half</text>
  <path d="M 596.827243 529.3752 L 596.827243 565.6253 L 1201.238239 565.6253 L 1201.238239 529.3752" fill="none" stroke="var(--danger-border)" stroke-width="0.5583"/>
  <text x="899.032641" y="620" text-anchor="middle" font-size="21.533889" fill="var(--danger-accent)" font-family="Arial, sans-serif">if bad, search left half</text>
</svg>

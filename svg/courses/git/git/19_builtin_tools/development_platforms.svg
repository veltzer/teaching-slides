<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="372.4137" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="226.2069" y="120.5555" text-anchor="middle" font-size="25.839" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">GitHub</text>
  <line x1="81.3793" y1="152.7777" x2="371.0346" y2="152.7777" stroke="var(--primary-border)" stroke-width="1.9961"/>
  <text x="226.2069" y="233.3334" text-anchor="middle" font-size="21.8638" font-family="Arial, sans-serif" fill="var(--primary-text)">Pull Requests</text>
  <text x="226.2069" y="313.8889" text-anchor="middle" font-size="21.8638" font-family="Arial, sans-serif" fill="var(--primary-text)">Actions (CI/CD)</text>
  <text x="226.2069" y="394.4444" text-anchor="middle" font-size="21.8638" font-family="Arial, sans-serif" fill="var(--primary-text)">Issues</text>
  <text x="226.2069" y="475" text-anchor="middle" font-size="21.8638" font-family="Arial, sans-serif" fill="var(--primary-text)">Packages</text>
  <rect x="453.7931" y="40" width="372.4137" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="640" y="120.5555" text-anchor="middle" font-size="25.839" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">GitLab</text>
  <line x1="495.1724" y1="152.7777" x2="784.8276" y2="152.7777" stroke="var(--warn-border)" stroke-width="1.9961"/>
  <text x="640" y="233.3334" text-anchor="middle" font-size="21.8638" font-family="Arial, sans-serif" fill="var(--warn-text)">CI/CD Pipelines</text>
  <text x="640" y="313.8889" text-anchor="middle" font-size="21.8638" font-family="Arial, sans-serif" fill="var(--warn-text)">Container Registry</text>
  <text x="640" y="394.4444" text-anchor="middle" font-size="21.8638" font-family="Arial, sans-serif" fill="var(--warn-text)">Wiki</text>
  <text x="640" y="475" text-anchor="middle" font-size="21.8638" font-family="Arial, sans-serif" fill="var(--warn-text)">Issue Boards</text>
  <rect x="867.5863" y="40" width="372.4137" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="1053.7931" y="120.5555" text-anchor="middle" font-size="25.839" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">BitBucket</text>
  <line x1="908.9655" y1="152.7777" x2="1198.6207" y2="152.7777" stroke="var(--primary-border)" stroke-width="1.9961"/>
  <text x="1053.7931" y="233.3334" text-anchor="middle" font-size="21.8638" font-family="Arial, sans-serif" fill="var(--primary-text)">Pipelines</text>
  <text x="1053.7931" y="313.8889" text-anchor="middle" font-size="21.8638" font-family="Arial, sans-serif" fill="var(--primary-text)">Jira Integration</text>
  <text x="1053.7931" y="394.4444" text-anchor="middle" font-size="21.8638" font-family="Arial, sans-serif" fill="var(--primary-text)">Teams</text>
  <text x="1053.7931" y="475" text-anchor="middle" font-size="21.8638" font-family="Arial, sans-serif" fill="var(--primary-text)">Code Review</text>
</svg>

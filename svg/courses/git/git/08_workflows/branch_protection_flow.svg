<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="217.2223" width="168.75" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="152.5" y="245.4167" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Developer</text>
  <text x="152.5" y="263.9444" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">git push</text>
  <line x1="238.7499" y1="249.4444" x2="300.625" y2="249.4444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="302.5" y="217.2223" width="187.5" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="396.25" y="245.4167" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">Pull Request</text>
  <text x="396.25" y="263.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">opened</text>
  <line x1="491.8749" y1="249.4444" x2="553.75" y2="249.4444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="555.625" y="152.7777" width="206.25" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="658.75" y="178.5556" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">CI Checks</text>
  <text x="658.75" y="196.2777" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">tests · lint · build</text>
  <rect x="555.625" y="225.2777" width="206.25" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="658.75" y="251.0556" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">Code Review</text>
  <text x="658.75" y="268.7777" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">≥2 approvals required</text>
  <rect x="555.625" y="297.7777" width="206.25" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="658.75" y="323.5556" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">Up-to-date</text>
  <text x="658.75" y="341.2777" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">branch not stale</text>
  <line x1="555.625" y1="249.4444" x2="555.625" y2="180.9723" stroke="var(--primary-border)" stroke-width="1.3333" />
  <line x1="555.625" y1="249.4444" x2="555.625" y2="253.4723" stroke="var(--primary-border)" stroke-width="1.3333" />
  <line x1="555.625" y1="249.4444" x2="555.625" y2="325.9723" stroke="var(--primary-border)" stroke-width="1.3333" />
  <line x1="763.75" y1="180.9723" x2="827.5" y2="249.4444" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <line x1="763.75" y1="253.4723" x2="827.5" y2="249.4444" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <line x1="763.75" y1="325.9723" x2="827.5" y2="265.5556" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <polygon points="902.5,217.2223 1033.75,249.4444 902.5,281.6667 771.25,249.4444" fill="url(#grad-surface)" stroke="var(--primary-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="902.5" y="244.6111" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">All gates</text>
  <text x="902.5" y="260.7223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">passed?</text>
  <line x1="1035.625" y1="249.4444" x2="1097.5" y2="249.4444" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1066.5624" y="239.7777" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--ok-accent)">yes</text>
  <rect x="1099.3749" y="217.2223" width="112.5" height="64.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1155.625" y="247.8333" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--ok-accent)">Merge</text>
  <text x="1155.625" y="265.5556" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--ok-accent)">to main ✓</text>
  <line x1="902.5" y1="283.2777" x2="902.5" y2="346.1111" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="921.25" y="318.7223" font-family="sans-serif" font-size="12.1663" fill="var(--danger-accent)">no</text>
  <rect x="808.75" y="347.7223" width="187.5" height="56.3889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="902.5" y="374.3056" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--danger-accent)">Blocked</text>
  <text x="902.5" y="392.8333" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">fix and repush</text>
  <rect x="68.125" y="442.7777" width="1143.7499" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="463.7223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">Configure in: Settings → Branches → Branch protection rules</text>
  <text x="86.875" y="486.2777" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">✓ Require a pull request before merging</text>
  <text x="86.875" y="504" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">✓ Require status checks to pass (CI)</text>
  <text x="86.875" y="521.7223" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">✓ Require branches to be up to date</text>
  <text x="658.75" y="486.2777" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">✓ Require signed commits</text>
  <text x="658.75" y="504" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">✓ Restrict who can push to matching branches</text>
  <text x="658.75" y="521.7223" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">✓ Include administrators</text>
</svg>
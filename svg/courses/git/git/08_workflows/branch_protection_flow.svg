  <ns0:text x="568.8889" y="467.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#212121">Configure in: Settings → Branches → Branch protection rules</ns0:text>
  <ns0:text x="44.4444" y="492.4444" font-family="monospace" font-size="12.4444" fill="#1565c0">✓ Require a pull request before merging</ns0:text>
  <ns0:text x="44.4444" y="512" font-family="monospace" font-size="12.4444" fill="#1565c0">✓ Require status checks to pass (CI)</ns0:text>

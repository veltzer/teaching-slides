<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="195.5556" width="160" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="106.6667" y="226.6667" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Developer</text>
  <text x="106.6667" y="247.1111" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">git push</text>
  <line x1="188.4444" y1="231.1111" x2="247.1111" y2="231.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="248.8889" y="195.5556" width="177.7778" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="337.7778" y="226.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Pull Request</text>
  <text x="337.7778" y="247.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">opened</text>
  <line x1="428.4444" y1="231.1111" x2="487.1111" y2="231.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="488.8889" y="124.4444" width="195.5556" height="62.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="586.6667" y="152.8889" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">CI Checks</text>
  <text x="586.6667" y="172.4444" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">tests · lint · build</text>
  <rect x="488.8889" y="204.4444" width="195.5556" height="62.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="586.6667" y="232.8889" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Code Review</text>
  <text x="586.6667" y="252.4444" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">≥2 approvals required</text>
  <rect x="488.8889" y="284.4444" width="195.5556" height="62.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="586.6667" y="312.8889" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Up-to-date</text>
  <text x="586.6667" y="332.4444" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">branch not stale</text>
  <line x1="488.8889" y1="231.1111" x2="488.8889" y2="155.5556" stroke="var(--primary-border)" stroke-width="1.3333" />
  <line x1="488.8889" y1="231.1111" x2="488.8889" y2="235.5556" stroke="var(--primary-border)" stroke-width="1.3333" />
  <line x1="488.8889" y1="231.1111" x2="488.8889" y2="315.5556" stroke="var(--primary-border)" stroke-width="1.3333" />
  <line x1="686.2222" y1="155.5556" x2="746.6667" y2="231.1111" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <line x1="686.2222" y1="235.5556" x2="746.6667" y2="231.1111" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <line x1="686.2222" y1="315.5556" x2="746.6667" y2="248.8889" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <polygon points="817.7778,195.5556 942.2222,231.1111 817.7778,266.6667 693.3333,231.1111" fill="url(#grad-surface)" stroke="var(--primary-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="817.7778" y="225.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">All gates</text>
  <text x="817.7778" y="243.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">passed?</text>
  <line x1="944" y1="231.1111" x2="1002.6667" y2="231.1111" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="973.3333" y="220.4444" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--ok-accent)">yes</text>
  <rect x="1004.4444" y="195.5556" width="106.6667" height="71.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1057.7778" y="229.3333" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Merge</text>
  <text x="1057.7778" y="248.8889" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--ok-accent)">to main ✓</text>
  <line x1="817.7778" y1="268.4444" x2="817.7778" y2="337.7778" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="835.5556" y="307.5556" font-family="sans-serif" font-size="12.4444" fill="var(--danger-accent)">no</text>
  <rect x="728.8889" y="339.5556" width="177.7778" height="62.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="817.7778" y="368.8889" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--danger-accent)">Blocked</text>
  <text x="817.7778" y="389.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">fix and repush</text>
  <rect x="26.6667" y="444.4444" width="1084.4444" height="106.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="467.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Configure in: Settings → Branches → Branch protection rules</text>
  <text x="44.4444" y="492.4444" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">✓ Require a pull request before merging</text>
  <text x="44.4444" y="512" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">✓ Require status checks to pass (CI)</text>
  <text x="44.4444" y="531.5556" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">✓ Require branches to be up to date</text>
  <text x="586.6667" y="492.4444" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">✓ Require signed commits</text>
  <text x="586.6667" y="512" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">✓ Restrict who can push to matching branches</text>
  <text x="586.6667" y="531.5556" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">✓ Include administrators</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
  </defs>
  <rect x="40" y="136.666892" width="177.049196" height="96.666592" rx="7.527001" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="128.524598" y="178.958488" text-anchor="middle" font-family="sans-serif" font-size="19.623518" font-weight="bold" fill="var(--text)">Developer</text>
  <text x="128.524598" y="206.750036" text-anchor="middle" font-family="monospace" font-size="15.262625" fill="var(--primary-accent)">git push</text>
  <line x1="219.016304" y1="185.000037" x2="283.934448" y2="185.000037" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="285.901661" y="136.666892" width="196.721329" height="96.666592" rx="7.527001" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="384.262325" y="178.958488" text-anchor="middle" font-family="sans-serif" font-size="17.443071" font-weight="bold" fill="var(--text)">Pull Request</text>
  <text x="384.262325" y="206.750036" text-anchor="middle" font-family="sans-serif" font-size="15.262625" fill="var(--text-muted)">opened</text>
  <line x1="484.590098" y1="185.000037" x2="549.508241" y2="185.000037" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="551.475455" y="40" width="216.393462" height="84.583343" rx="7.527001" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="659.672185" y="78.666847" text-anchor="middle" font-family="sans-serif" font-size="17.443071" font-weight="bold" fill="var(--text)">CI Checks</text>
  <text x="659.672185" y="105.249994" text-anchor="middle" font-family="sans-serif" font-size="14.172589" fill="var(--text-muted)">tests · lint · build</text>
  <rect x="551.475455" y="148.749991" width="216.393462" height="84.583343" rx="7.527001" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="659.672185" y="187.416837" text-anchor="middle" font-family="sans-serif" font-size="17.443071" font-weight="bold" fill="var(--text)">Code Review</text>
  <text x="659.672185" y="213.999985" text-anchor="middle" font-family="sans-serif" font-size="14.172589" fill="var(--text-muted)">≥2 approvals required</text>
  <rect x="551.475455" y="257.499981" width="216.393462" height="84.583343" rx="7.527001" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="659.672185" y="296.166828" text-anchor="middle" font-family="sans-serif" font-size="17.443071" font-weight="bold" fill="var(--text)">Up-to-date</text>
  <text x="659.672185" y="322.749976" text-anchor="middle" font-family="sans-serif" font-size="14.172589" fill="var(--text-muted)">branch not stale</text>
  <line x1="551.475455" y1="185.000037" x2="551.475455" y2="82.291896" stroke="var(--primary-border)" stroke-width="1.3333" />
  <line x1="551.475455" y1="185.000037" x2="551.475455" y2="191.041887" stroke="var(--primary-border)" stroke-width="1.3333" />
  <line x1="551.475455" y1="185.000037" x2="551.475455" y2="299.791878" stroke="var(--primary-border)" stroke-width="1.3333" />
  <line x1="769.836129" y1="82.291896" x2="836.721381" y2="185.000037" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <line x1="769.836129" y1="191.041887" x2="836.721381" y2="185.000037" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <line x1="769.836129" y1="299.791878" x2="836.721381" y2="209.166835" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <polygon points="915.409913,136.666892 1053.114843,185.000037 915.409913,233.333483 777.704983,185.000037" fill="url(#grad-surface)" stroke="var(--primary-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="915.409913" y="177.750088" text-anchor="middle" font-family="sans-serif" font-size="16.352911" fill="var(--primary-accent)">All gates</text>
  <text x="915.409913" y="201.916886" text-anchor="middle" font-family="sans-serif" font-size="16.352911" fill="var(--primary-accent)">passed?</text>
  <line x1="1055.082056" y1="185.000037" x2="1120.000094" y2="185.000037" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1087.54097" y="170.499989" text-anchor="middle" font-family="sans-serif" font-size="15.262625" fill="var(--ok-accent)">yes</text>
  <rect x="1121.967203" y="136.666892" width="118.032797" height="96.666592" rx="7.527001" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1180.983706" y="182.583388" text-anchor="middle" font-family="sans-serif" font-size="19.623518" font-weight="bold" fill="var(--ok-accent)">Merge</text>
  <text x="1180.983706" y="209.166835" text-anchor="middle" font-family="sans-serif" font-size="15.262625" fill="var(--ok-accent)">to main ✓</text>
  <line x1="915.409913" y1="235.749983" x2="915.409913" y2="330.000075" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="935.082045" y="288.916879" font-family="sans-serif" font-size="15.262625" fill="var(--danger-accent)">no</text>
  <rect x="817.049248" y="332.416875" width="196.721329" height="84.583343" rx="7.527001" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="915.409913" y="372.291821" text-anchor="middle" font-family="sans-serif" font-size="17.443071" font-weight="bold" fill="var(--danger-accent)">Blocked</text>
  <text x="915.409913" y="400.083369" text-anchor="middle" font-family="sans-serif" font-size="14.172589" fill="var(--text-muted)">fix and repush</text>
  <rect x="40" y="474.999963" width="1200" height="145.000037" rx="7.527001" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000052" y="506.41686" text-anchor="middle" font-family="sans-serif" font-size="17.443071" font-weight="bold" fill="var(--text)">Configure in: Settings → Branches → Branch protection rules</text>
  <text x="59.672133" y="540.249957" font-family="monospace" font-size="15.262625" fill="var(--primary-accent)">✓ Require a pull request before merging</text>
  <text x="59.672133" y="566.833405" font-family="monospace" font-size="15.262625" fill="var(--primary-accent)">✓ Require status checks to pass (CI)</text>
  <text x="59.672133" y="593.416852" font-family="monospace" font-size="15.262625" fill="var(--primary-accent)">✓ Require branches to be up to date</text>
  <text x="659.672185" y="540.249957" font-family="monospace" font-size="15.262625" fill="var(--primary-accent)">✓ Require signed commits</text>
  <text x="659.672185" y="566.833405" font-family="monospace" font-size="15.262625" fill="var(--primary-accent)">✓ Restrict who can push to matching branches</text>
  <text x="659.672185" y="593.416852" font-family="monospace" font-size="15.262625" fill="var(--primary-accent)">✓ Include administrators</text>
</svg>
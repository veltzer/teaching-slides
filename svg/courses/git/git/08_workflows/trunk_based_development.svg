<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Trunk (main) branch -->
  <text x="50" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">trunk</text>
  <line x1="130" y1="190" x2="1230" y2="190" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- Commits on trunk -->
  <circle cx="200" cy="190" r="16" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="360" cy="190" r="16" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="520" cy="190" r="16" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="680" cy="190" r="16" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="840" cy="190" r="16" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="1000" cy="190" r="16" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="1160" cy="190" r="16" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- Short-lived branch 1 -->
  <line x1="360" y1="206" x2="380" y2="290" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="380" y1="290" x2="500" y2="290" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="500" y1="290" x2="520" y2="206" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="440" cy="290" r="12" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="440" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">1-2 days</text>

  <!-- Short-lived branch 2 -->
  <line x1="680" y1="206" x2="700" y2="290" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="700" y1="290" x2="820" y2="290" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="820" y1="290" x2="840" y2="206" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="760" cy="290" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="760" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)">hours</text>

  <!-- CI/CD pipeline indicator -->
  <rect x="160" y="50" width="1100" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="710" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Continuous Integration - every commit triggers build + tests</text>

  <!-- Release tags -->
  <rect x="505" y="125" width="30" height="30" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="520" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">v1</text>
  <rect x="985" y="125" width="30" height="30" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1000" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">v2</text>

  <!-- Key principles -->
  <rect x="100" y="390" width="520" height="220" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="360" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--ok-accent)">Key Principles</text>
  <text x="130" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1. Branches live at most 1-2 days</text>
  <text x="130" y="490" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">2. Merge to trunk at least once per day</text>
  <text x="130" y="520" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">3. Feature flags hide incomplete work</text>
  <text x="130" y="550" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">4. Automated tests run on every commit</text>
  <text x="130" y="580" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">5. Trunk is always releasable</text>

  <!-- Benefits -->
  <rect x="660" y="390" width="520" height="220" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="920" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--primary-accent)">Benefits</text>
  <text x="690" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Faster integration and feedback</text>
  <text x="690" y="490" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Fewer merge conflicts</text>
  <text x="690" y="520" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Simpler branching model</text>
  <text x="690" y="550" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Enables continuous delivery</text>
  <text x="690" y="580" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Used by Google, Meta, Microsoft</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Upstream repository -->
  <rect x="306.6667" y="40" width="666.6667" height="63.8983" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="79.322" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9024" font-weight="bold" fill="var(--primary-accent)">Upstream Repository (original)</text>
  <line x1="151.1111" y1="148.1356" x2="1128.8889" y2="148.1356" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="262.2222" cy="148.1356" r="14.6317" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="484.4444" cy="148.1356" r="14.6317" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="795.5556" cy="148.1356" r="14.6317" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="1017.7778" cy="148.1356" r="14.6317" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- Fork arrow -->
  <text x="117.7778" y="216.9492" font-family="Arial, sans-serif" font-size="14.6317" font-weight="bold" fill="var(--ok-accent)">fork</text>
  <line x1="262.2222" y1="161.8983" x2="262.2222" y2="256.2712" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon points="256.6667,256.2712 267.7778,256.2712 262.2222,266.1017" fill="var(--ok-fill)"/>

  <!-- Fork A -->
  <rect x="40" y="275.9322" width="444.4444" height="49.1525" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="262.2222" y="307.3898" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7219" font-weight="bold" fill="var(--ok-accent)">Fork A (Developer A)</text>
  <line x1="151.1111" y1="325.0847" x2="684.4444" y2="325.0847" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="217.7778" cy="325.0847" r="12.5415" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <circle cx="328.8889" cy="325.0847" r="12.5415" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <circle cx="440" cy="325.0847" r="12.5415" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>

  <!-- Feature branch on fork A -->
  <line x1="328.8889" y1="336.8814" x2="351.1111" y2="393.8983" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="351.1111" y1="393.8983" x2="462.2222" y2="393.8983" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="406.6667" cy="393.8983" r="10.4512" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="495.5556" y="398.8136" font-family="Arial, sans-serif" font-size="12.5415" fill="var(--ok-accent)">feature branch</text>

  <!-- PR arrow from fork A to upstream -->
  <line x1="484.4444" y1="305.4237" x2="795.5556" y2="161.8983" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="791.1111,165.8305 800,157.9661 788.8889,156" fill="var(--warn-fill)"/>
  <text x="673.3333" y="216.9492" font-family="Arial, sans-serif" font-size="14.6317" font-weight="bold" fill="var(--warn-accent)">Pull Request</text>

  <!-- Fork B -->
  <rect x="795.5556" y="275.9322" width="444.4444" height="49.1525" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1017.7778" y="307.3898" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7219" font-weight="bold" fill="var(--warn-accent)">Fork B (Developer B)</text>
  <line x1="817.7778" y1="325.0847" x2="1240" y2="325.0847" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="884.4444" cy="325.0847" r="12.5415" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="995.5556" cy="325.0847" r="12.5415" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="1106.6667" cy="325.0847" r="12.5415" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>

  <!-- Fork arrow B -->
  <text x="1051.1111" y="216.9492" font-family="Arial, sans-serif" font-size="14.6317" font-weight="bold" fill="var(--warn-accent)">fork</text>
  <line x1="1017.7778" y1="161.8983" x2="1017.7778" y2="266.1017" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon points="1012.2222,266.1017 1023.3333,266.1017 1017.7778,275.9322" fill="var(--warn-fill)"/>

  <!-- Sync arrow -->
  <line x1="217.7778" y1="325.0847" x2="217.7778" y2="167.7966" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="84.4444" y="246.4407" font-family="Arial, sans-serif" font-size="12.5415" fill="var(--text-faint)">sync upstream</text>

  <!-- Key points -->
  <rect x="40" y="452.8814" width="1200" height="167.1186" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="487.2881" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8122" font-weight="bold" fill="var(--text)">Forking Workflow</text>
  <text x="106.6667" y="521.6949" font-family="Arial, sans-serif" font-size="14.6317" fill="var(--text)">Each contributor has their own server-side copy</text>
  <text x="106.6667" y="546.2712" font-family="Arial, sans-serif" font-size="14.6317" fill="var(--text)">Contributors push to their fork, not upstream</text>
  <text x="106.6667" y="570.8475" font-family="Arial, sans-serif" font-size="14.6317" fill="var(--text)">Pull requests merge changes from fork to upstream</text>
  <text x="662.2222" y="521.6949" font-family="Arial, sans-serif" font-size="14.6317" fill="var(--text)">Standard for open-source projects</text>
  <text x="662.2222" y="546.2712" font-family="Arial, sans-serif" font-size="14.6317" fill="var(--text)">No write access needed to upstream</text>
  <text x="662.2222" y="570.8475" font-family="Arial, sans-serif" font-size="14.6317" fill="var(--text)">Maintainers control what gets merged</text>
</svg>
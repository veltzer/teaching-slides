<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Upstream repository -->
  <rect x="340" y="30" width="600" height="65" rx="12" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2.5"/>
  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)">Upstream Repository (original)</text>
  <line x1="200" y1="140" x2="1080" y2="140" stroke="var(--primary)" stroke-width="3"/>
  <circle cx="300" cy="140" r="14" fill="var(--primary)" stroke="var(--primary-dk)" stroke-width="2"/>
  <circle cx="500" cy="140" r="14" fill="var(--primary)" stroke="var(--primary-dk)" stroke-width="2"/>
  <circle cx="780" cy="140" r="14" fill="var(--primary)" stroke="var(--primary-dk)" stroke-width="2"/>
  <circle cx="980" cy="140" r="14" fill="var(--primary)" stroke="var(--primary-dk)" stroke-width="2"/>

  <!-- Fork arrow -->
  <text x="170" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">fork</text>
  <line x1="300" y1="154" x2="300" y2="250" stroke="var(--ok)" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon points="295,250 305,250 300,260" fill="var(--ok)"/>

  <!-- Fork A -->
  <rect x="100" y="270" width="400" height="50" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2"/>
  <text x="300" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)">Fork A (Developer A)</text>
  <line x1="200" y1="320" x2="680" y2="320" stroke="var(--ok)" stroke-width="2.5"/>
  <circle cx="260" cy="320" r="12" fill="var(--ok)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <circle cx="360" cy="320" r="12" fill="var(--ok)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <circle cx="460" cy="320" r="12" fill="var(--ok)" stroke="var(--ok-dk)" stroke-width="1.5"/>

  <!-- Feature branch on fork A -->
  <line x1="360" y1="332" x2="380" y2="390" stroke="var(--ok-mid)" stroke-width="2"/>
  <line x1="380" y1="390" x2="480" y2="390" stroke="var(--ok-mid)" stroke-width="2"/>
  <circle cx="430" cy="390" r="10" fill="var(--ok-mid)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="510" y="395" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">feature branch</text>

  <!-- PR arrow from fork A to upstream -->
  <line x1="500" y1="300" x2="780" y2="154" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="776,158 784,150 774,148" fill="var(--warn)"/>
  <text x="670" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)">Pull Request</text>

  <!-- Fork B -->
  <rect x="780" y="270" width="400" height="50" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
  <text x="980" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-dk)">Fork B (Developer B)</text>
  <line x1="800" y1="320" x2="1180" y2="320" stroke="var(--warn)" stroke-width="2.5"/>
  <circle cx="860" cy="320" r="12" fill="var(--warn)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="960" cy="320" r="12" fill="var(--warn)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="1060" cy="320" r="12" fill="var(--warn)" stroke="var(--warn-dk)" stroke-width="1.5"/>

  <!-- Fork arrow B -->
  <text x="1010" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)">fork</text>
  <line x1="980" y1="154" x2="980" y2="260" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon points="975,260 985,260 980,270" fill="var(--warn)"/>

  <!-- Sync arrow -->
  <line x1="260" y1="320" x2="260" y2="160" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="140" y="240" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">sync upstream</text>

  <!-- Key points -->
  <rect x="100" y="450" width="1080" height="170" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="640" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Forking Workflow</text>
  <text x="160" y="520" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Each contributor has their own server-side copy</text>
  <text x="160" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Contributors push to their fork, not upstream</text>
  <text x="160" y="570" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Pull requests merge changes from fork to upstream</text>
  <text x="660" y="520" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Standard for open-source projects</text>
  <text x="660" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">No write access needed to upstream</text>
  <text x="660" y="570" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Maintainers control what gets merged</text>
</svg>
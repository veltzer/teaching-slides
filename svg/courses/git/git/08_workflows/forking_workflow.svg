<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Upstream repository -->
  <rect x="306.6667" y="40" width="666.6667" height="63.8983" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="79.322" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9024" font-weight="bold" fill="var(--primary-accent)">Upstream Repository (original)</text>
  <line x1="151.1111" y1="148.1356" x2="1128.8889" y2="148.1356" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="247.59" y="133.504" width="29.2634" height="29.2634" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="469.813" y="133.504" width="29.2634" height="29.2634" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="780.924" y="133.504" width="29.2634" height="29.2634" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1003.15" y="133.504" width="29.2634" height="29.2634" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Fork arrow -->
  <text x="117.7778" y="216.9492" font-family="Arial, sans-serif" font-size="14.6317" font-weight="bold" fill="var(--ok-accent)">fork</text>
  <line x1="262.2222" y1="161.8983" x2="262.2222" y2="256.2712" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon points="256.6667,256.2712 267.7778,256.2712 262.2222,266.1017" fill="var(--ok-fill)"/>

  <!-- Fork A -->
  <rect x="40" y="275.9322" width="444.4444" height="49.1525" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="262.2222" y="307.3898" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7219" font-weight="bold" fill="var(--ok-accent)">Fork A (Developer A)</text>
  <line x1="151.1111" y1="325.0847" x2="684.4444" y2="325.0847" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="205.236" y="312.543" width="25.083" height="25.083" rx="12.5415" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="316.347" y="312.543" width="25.083" height="25.083" rx="12.5415" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="427.459" y="312.543" width="25.083" height="25.083" rx="12.5415" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Feature branch on fork A -->
  <line x1="328.8889" y1="336.8814" x2="351.1111" y2="393.8983" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="351.1111" y1="393.8983" x2="462.2222" y2="393.8983" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="396.216" y="383.447" width="20.9024" height="20.9024" rx="10.4512" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="495.5556" y="398.8136" font-family="Arial, sans-serif" font-size="12.5415" fill="var(--ok-accent)">feature branch</text>

  <!-- PR arrow from fork A to upstream -->
  <line x1="484.4444" y1="305.4237" x2="795.5556" y2="161.8983" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="791.1111,165.8305 800,157.9661 788.8889,156" fill="var(--warn-fill)"/>
  <text x="673.3333" y="216.9492" font-family="Arial, sans-serif" font-size="14.6317" font-weight="bold" fill="var(--warn-accent)">Pull Request</text>

  <!-- Fork B -->
  <rect x="795.5556" y="275.9322" width="444.4444" height="49.1525" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.7778" y="307.3898" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7219" font-weight="bold" fill="var(--warn-accent)">Fork B (Developer B)</text>
  <line x1="817.7778" y1="325.0847" x2="1240" y2="325.0847" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="871.903" y="312.543" width="25.083" height="25.083" rx="12.5415" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="983.014" y="312.543" width="25.083" height="25.083" rx="12.5415" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1094.13" y="312.543" width="25.083" height="25.083" rx="12.5415" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Fork arrow B -->
  <text x="1051.1111" y="216.9492" font-family="Arial, sans-serif" font-size="14.6317" font-weight="bold" fill="var(--warn-accent)">fork</text>
  <line x1="1017.7778" y1="161.8983" x2="1017.7778" y2="266.1017" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon points="1012.2222,266.1017 1023.3333,266.1017 1017.7778,275.9322" fill="var(--warn-fill)"/>

  <!-- Sync arrow -->
  <line x1="217.7778" y1="325.0847" x2="217.7778" y2="167.7966" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="84.4444" y="246.4407" font-family="Arial, sans-serif" font-size="12.5415" fill="var(--text-faint)">sync upstream</text>

  <!-- Key points -->
  <rect x="40" y="452.8814" width="1200" height="167.1186" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="487.2881" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8122" font-weight="bold" fill="var(--text)">Forking Workflow</text>
  <text x="106.6667" y="521.6949" font-family="Arial, sans-serif" font-size="14.6317" fill="var(--text)">Each contributor has their own server-side copy</text>
  <text x="106.6667" y="546.2712" font-family="Arial, sans-serif" font-size="14.6317" fill="var(--text)">Contributors push to their fork, not upstream</text>
  <text x="106.6667" y="570.8475" font-family="Arial, sans-serif" font-size="14.6317" fill="var(--text)">Pull requests merge changes from fork to upstream</text>
  <text x="662.2222" y="521.6949" font-family="Arial, sans-serif" font-size="14.6317" fill="var(--text)">Standard for open-source projects</text>
  <text x="662.2222" y="546.2712" font-family="Arial, sans-serif" font-size="14.6317" fill="var(--text)">No write access needed to upstream</text>
  <text x="662.2222" y="570.8475" font-family="Arial, sans-serif" font-size="14.6317" fill="var(--text)">Maintainers control what gets merged</text>
</svg>

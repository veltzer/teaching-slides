<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Upstream repository -->
  <rect x="340" y="30" width="600" height="65" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-accent)">Upstream Repository (original)</text>
  <line x1="200" y1="140" x2="1080" y2="140" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="300" cy="140" r="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="500" cy="140" r="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="780" cy="140" r="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="980" cy="140" r="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- Fork arrow -->
  <text x="170" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">fork</text>
  <line x1="300" y1="154" x2="300" y2="250" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon points="295,250 305,250 300,260" fill="var(--ok-fill)"/>

  <!-- Fork A -->
  <rect x="100" y="270" width="400" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="300" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Fork A (Developer A)</text>
  <line x1="200" y1="320" x2="680" y2="320" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="260" cy="320" r="12" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <circle cx="360" cy="320" r="12" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <circle cx="460" cy="320" r="12" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>

  <!-- Feature branch on fork A -->
  <line x1="360" y1="332" x2="380" y2="390" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="380" y1="390" x2="480" y2="390" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="430" cy="390" r="10" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="510" y="395" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">feature branch</text>

  <!-- PR arrow from fork A to upstream -->
  <line x1="500" y1="300" x2="780" y2="154" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="776,158 784,150 774,148" fill="var(--warn-fill)"/>
  <text x="670" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">Pull Request</text>

  <!-- Fork B -->
  <rect x="780" y="270" width="400" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="980" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)">Fork B (Developer B)</text>
  <line x1="800" y1="320" x2="1180" y2="320" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="860" cy="320" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="960" cy="320" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="1060" cy="320" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>

  <!-- Fork arrow B -->
  <text x="1010" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">fork</text>
  <line x1="980" y1="154" x2="980" y2="260" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon points="975,260 985,260 980,270" fill="var(--warn-fill)"/>

  <!-- Sync arrow -->
  <line x1="260" y1="320" x2="260" y2="160" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="140" y="240" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">sync upstream</text>

  <!-- Key points -->
  <rect x="100" y="450" width="1080" height="170" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Forking Workflow</text>
  <text x="160" y="520" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Each contributor has their own server-side copy</text>
  <text x="160" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Contributors push to their fork, not upstream</text>
  <text x="160" y="570" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Pull requests merge changes from fork to upstream</text>
  <text x="660" y="520" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Standard for open-source projects</text>
  <text x="660" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">No write access needed to upstream</text>
  <text x="660" y="570" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Maintainers control what gets merged</text>
</svg>
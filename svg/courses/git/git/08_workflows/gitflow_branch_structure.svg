<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="40" y="62.2842" font-size="20.8534" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">main</text>
  <text x="40" y="201.7132" font-size="20.8534" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">hotfix</text>
  <text x="40" y="341.142" font-size="20.8534" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">release</text>
  <text x="40" y="480.571" font-size="20.8534" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">develop</text>
  <text x="40" y="620" font-size="20.8534" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">feature</text>
  <line x1="166.3158" y1="48.3413" x2="1240" y2="48.3413" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="221.132" y="40" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <rect x="810.606" y="40" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <rect x="1126.4" y="40" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <line x1="818.9474" y1="48.3413" x2="861.0526" y2="187.7702" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="861.0526" y1="187.7702" x2="987.3684" y2="187.7702" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="915.869" y="179.429" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <line x1="987.3684" y1="187.7702" x2="1134.7368" y2="48.3413" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="987.3684" y1="187.7702" x2="1071.579" y2="466.6281" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="650.5263" y1="466.6281" x2="692.6316" y2="327.1993" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="692.6316" y1="327.1993" x2="797.8947" y2="327.1993" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="736.922" y="318.858" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <line x1="797.8947" y1="327.1993" x2="818.9474" y2="48.3413" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="166.3158" y1="466.6281" x2="1240" y2="466.6281" stroke="var(--info-border)" stroke-width="2" />
  <rect x="221.132" y="458.287" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <rect x="389.553" y="458.287" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <rect x="557.975" y="458.287" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <rect x="642.185" y="458.287" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <rect x="1063.24" y="458.287" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <rect x="1168.5" y="458.287" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <line x1="271.579" y1="466.6281" x2="292.6315" y2="606.0571" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="292.6315" y1="606.0571" x2="524.2105" y2="606.0571" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="347.448" y="597.716" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <rect x="431.659" y="597.716" width="16.6826" height="16.6826" rx="8.3413" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="4.1677" filter="url(#shadow)"/>
  <line x1="524.2105" y1="606.0571" x2="566.3159" y2="466.6281" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
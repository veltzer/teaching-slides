<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="42.14" y="71.1111" width="547.819" height="248.8889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="316.0494" y="160" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="var(--primary-accent)">Centralized</text>
  <line x1="126.4198" y1="231.1111" x2="505.679" y2="231.1111" stroke="var(--primary-border)" stroke-width="2" />
  <circle cx="210.6996" cy="231.1111" r="8.428" fill="var(--primary-accent)" />
  <circle cx="316.0494" cy="231.1111" r="8.428" fill="var(--primary-accent)" />
  <circle cx="421.3992" cy="231.1111" r="8.428" fill="var(--primary-accent)" />
  <text x="316.0494" y="284.4444" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">single branch</text>
  <rect x="674.2387" y="71.1111" width="547.819" height="248.8889" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="948.1481" y="160" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="var(--info-accent)">Feature Branch</text>
  <line x1="758.5185" y1="241.7778" x2="1137.7778" y2="241.7778" stroke="var(--info-border)" stroke-width="2" />
  <line x1="842.7983" y1="241.7778" x2="884.9383" y2="195.5556" stroke="var(--info-border)" stroke-width="2" />
  <line x1="884.9383" y1="195.5556" x2="969.2181" y2="195.5556" stroke="var(--info-border)" stroke-width="2" />
  <line x1="969.2181" y1="195.5556" x2="990.2881" y2="241.7778" stroke="var(--info-border)" stroke-width="2" />
  <line x1="1011.358" y1="241.7778" x2="1032.428" y2="195.5556" stroke="var(--info-border)" stroke-width="2" />
  <line x1="1032.428" y1="195.5556" x2="1095.6378" y2="195.5556" stroke="var(--info-border)" stroke-width="2" />
  <line x1="1095.6378" y1="195.5556" x2="1116.7079" y2="241.7778" stroke="var(--info-border)" stroke-width="2" />
  <text x="948.1481" y="291.5556" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">short-lived branches</text>
  <rect x="42.14" y="391.1111" width="547.819" height="248.8889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="316.0494" y="480" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="var(--ok-accent)">GitFlow</text>
  <line x1="126.4198" y1="551.1111" x2="505.679" y2="551.1111" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="126.4198" y1="586.6667" x2="505.679" y2="586.6667" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.428 4.214" />
  <line x1="126.4198" y1="515.5556" x2="505.679" y2="515.5556" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.428 4.214" />
  <text x="316.0494" y="632.8889" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">multiple long-lived branches</text>
  <rect x="674.2387" y="391.1111" width="547.819" height="248.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="948.1481" y="480" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="var(--warn-accent)">Trunk-Based</text>
  <line x1="758.5185" y1="561.7778" x2="1137.7778" y2="561.7778" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="842.7983" y1="561.7778" x2="863.8683" y2="533.3333" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="863.8683" y1="533.3333" x2="884.9383" y2="561.7778" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="969.2181" y1="561.7778" x2="990.2881" y2="533.3333" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="990.2881" y1="533.3333" x2="1011.358" y2="561.7778" stroke="var(--warn-border)" stroke-width="2" />
  <text x="948.1481" y="622.2222" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">very short branches off main</text>
</svg>
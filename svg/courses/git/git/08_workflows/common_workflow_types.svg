<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="557.1429" height="253.75" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="318.5714" y="130.625" text-anchor="middle" font-size="27.8915" font-weight="bold" fill="var(--primary-accent)">Centralized</text>
  <line x1="125.7142" y1="203.125" x2="511.4285" y2="203.125" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="202.847" y="194.543" width="17.164" height="17.164" rx="8.582" fill="var(--primary-accent)"/>
  <rect x="309.989" y="194.543" width="17.164" height="17.164" rx="8.582" fill="var(--primary-accent)"/>
  <rect x="417.132" y="194.543" width="17.164" height="17.164" rx="8.582" fill="var(--primary-accent)"/>
  <text x="318.5714" y="257.5" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)">single branch</text>
  <rect x="682.8571" y="40" width="557.1429" height="253.75" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="961.4284" y="130.625" text-anchor="middle" font-size="27.8915" font-weight="bold" fill="var(--info-accent)">Feature Branch</text>
  <line x1="768.5713" y1="214" x2="1154.2856" y2="214" stroke="var(--info-border)" stroke-width="2" />
  <line x1="854.2856" y1="214" x2="897.1428" y2="166.8751" stroke="var(--info-border)" stroke-width="2" />
  <line x1="897.1428" y1="166.8751" x2="982.857" y2="166.8751" stroke="var(--info-border)" stroke-width="2" />
  <line x1="982.857" y1="166.8751" x2="1004.2857" y2="214" stroke="var(--info-border)" stroke-width="2" />
  <line x1="1025.7142" y1="214" x2="1047.1428" y2="166.8751" stroke="var(--info-border)" stroke-width="2" />
  <line x1="1047.1428" y1="166.8751" x2="1111.4284" y2="166.8751" stroke="var(--info-border)" stroke-width="2" />
  <line x1="1111.4284" y1="166.8751" x2="1132.8571" y2="214" stroke="var(--info-border)" stroke-width="2" />
  <text x="961.4284" y="264.7501" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)">short-lived branches</text>
  <rect x="40" y="366.25" width="557.1429" height="253.75" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="318.5714" y="456.875" text-anchor="middle" font-size="27.8915" font-weight="bold" fill="var(--ok-accent)">GitFlow</text>
  <line x1="125.7142" y1="529.375" x2="511.4285" y2="529.375" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="125.7142" y1="565.625" x2="511.4285" y2="565.625" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.428 4.214" />
  <line x1="125.7142" y1="493.125" x2="511.4285" y2="493.125" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.428 4.214" />
  <text x="318.5714" y="612.75" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)">multiple long-lived branches</text>
  <rect x="682.8571" y="366.25" width="557.1429" height="253.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="961.4284" y="456.875" text-anchor="middle" font-size="27.8915" font-weight="bold" fill="var(--warn-accent)">Trunk-Based</text>
  <line x1="768.5713" y1="540.25" x2="1154.2856" y2="540.25" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="854.2856" y1="540.25" x2="875.7142" y2="511.25" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="875.7142" y1="511.25" x2="897.1428" y2="540.25" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="982.857" y1="540.25" x2="1004.2857" y2="511.25" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="1004.2857" y1="511.25" x2="1025.7142" y2="540.25" stroke="var(--warn-border)" stroke-width="2" />
  <text x="961.4284" y="601.875" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)">very short branches off main</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Central remote repository -->
  <rect x="440" y="30" width="400" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-accent)">Remote: main</text>

  <!-- Commit nodes on main timeline -->
  <line x1="240" y1="180" x2="1040" y2="180" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="320" cy="180" r="18" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="320" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" font-weight="bold">C1</text>
  <circle cx="480" cy="180" r="18" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="480" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" font-weight="bold">C2</text>
  <circle cx="640" cy="180" r="18" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" font-weight="bold">C3</text>
  <circle cx="800" cy="180" r="18" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="800" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" font-weight="bold">C4</text>
  <circle cx="960" cy="180" r="18" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="960" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" font-weight="bold">C5</text>

  <!-- Developer A -->
  <rect x="100" y="300" width="280" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="240" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-accent)">Developer A</text>
  <line x1="240" y1="300" x2="480" y2="198" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="330" y="255" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)">push</text>

  <!-- Developer B -->
  <rect x="500" y="300" width="280" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-accent)">Developer B</text>
  <line x1="640" y1="300" x2="640" y2="198" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="655" y="255" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">push</text>

  <!-- Developer C -->
  <rect x="900" y="300" width="280" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1040" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">Developer C</text>
  <line x1="1040" y1="300" x2="800" y2="198" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="950" y="255" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">push</text>

  <!-- Key characteristics -->
  <rect x="140" y="430" width="1000" height="180" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Characteristics</text>
  <circle cx="200" cy="500" r="6" fill="var(--primary-fill)"/>
  <text x="220" y="505" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Single shared branch (main/master)</text>
  <circle cx="200" cy="535" r="6" fill="var(--primary-fill)"/>
  <text x="220" y="540" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">All developers push directly to main</text>
  <circle cx="200" cy="570" r="6" fill="var(--primary-fill)"/>
  <text x="220" y="575" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Requires frequent pull/rebase to avoid conflicts</text>
  <circle cx="680" cy="500" r="6" fill="var(--ok-fill)"/>
  <text x="700" y="505" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Simple and easy to understand</text>
  <circle cx="680" cy="535" r="6" fill="var(--danger-fill)"/>
  <text x="700" y="540" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">High risk of merge conflicts</text>
  <circle cx="680" cy="570" r="6" fill="var(--danger-fill)"/>
  <text x="700" y="575" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Best for small teams (2-3 developers)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Main branch -->
  <text x="40" y="133.3898" font-family="Arial, sans-serif" font-size="17.9974" font-weight="bold" fill="var(--primary-accent)">main</text>
  <line x1="111.1864" y1="128.4746" x2="1240" y2="128.4746" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="156.206" y="112.477" width="31.9954" height="31.9954" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="522.307" y="112.477" width="31.9954" height="31.9954" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1071.46" y="112.477" width="31.9954" height="31.9954" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Feature branch -->
  <line x1="172.2034" y1="144.2034" x2="212.8814" y2="256.2712" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="212.8814" y1="256.2712" x2="507.7966" y2="256.2712" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="507.7966" y1="256.2712" x2="538.3051" y2="144.2034" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="121.3559" y="266.1017" font-family="Arial, sans-serif" font-size="13.998" font-weight="bold" fill="var(--ok-accent)">feature</text>
  <rect x="280.239" y="242.273" width="27.996" height="27.996" rx="13.998" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="381.934" y="242.273" width="27.996" height="27.996" rx="13.998" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Step labels with numbered flow -->
  <!-- Step 1: Branch -->
  <rect x="121.3559" y="40" width="111.8644" height="44.2373" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.2881" y="51.7966" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.9984" font-weight="bold" fill="var(--primary-accent)">1. Branch</text>
  <text x="177.2881" y="71.4576" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.9984" fill="var(--text-muted)">from main</text>

  <!-- Step 2: Commit -->
  <rect x="268.8136" y="305.4237" width="111.8644" height="44.2373" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="324.7458" y="317.2203" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.9984" font-weight="bold" fill="var(--ok-accent)">2. Commit</text>
  <text x="324.7458" y="336.8814" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.9984" fill="var(--text-muted)">add changes</text>

  <!-- Step 3: Pull Request -->
  <rect x="416.2712" y="305.4237" width="132.2034" height="44.2373" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482.3729" y="317.2203" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.9984" font-weight="bold" fill="var(--warn-accent)">3. Pull Request</text>
  <text x="482.3729" y="336.8814" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.9984" fill="var(--text-muted)">discuss + review</text>

  <!-- Step 4: Merge -->
  <rect x="487.4576" y="40" width="111.8644" height="44.2373" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="543.3898" y="51.7966" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.9984" font-weight="bold" fill="var(--ok-accent)">4. Merge</text>
  <text x="543.3898" y="71.4576" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.9984" fill="var(--text-muted)">to main</text>

  <!-- Step 5: Deploy -->
  <rect x="1026.4407" y="40" width="122.0339" height="44.2373" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.4576" y="51.7966" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.9984" font-weight="bold" fill="var(--danger-accent)">5. Deploy</text>
  <text x="1087.4576" y="71.4576" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.9984" fill="var(--text-muted)">to production</text>

  <!-- Deploy arrow -->
  <line x1="1087.4576" y1="144.2034" x2="1087.4576" y2="177.6271" stroke="var(--danger-border)" stroke-width="2"/>
  <polygon points="1082.3729,177.6271 1092.5424,177.6271 1087.4576,187.4576" fill="var(--danger-fill)"/>

  <!-- Production server -->
  <rect x="1026.4407" y="192.3729" width="122.0339" height="39.322" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.4576" y="216.9492" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9981" fill="var(--danger-accent)">Production</text>

  <!-- GitHub Flow summary -->
  <rect x="90.8475" y="403.7288" width="1098.3051" height="216.2712" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="441.0847" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9971" font-weight="bold" fill="var(--text)">GitHub Flow Rules</text>

  <rect x="131.5254" y="462.7119" width="488.1356" height="39.322" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="375.5932" y="487.2881" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.998" fill="var(--primary-accent)">Anything in main is deployable</text>

  <rect x="131.5254" y="511.8644" width="488.1356" height="39.322" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="375.5932" y="536.4407" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.998" fill="var(--ok-accent)">Create descriptive branch names</text>

  <rect x="131.5254" y="561.0169" width="488.1356" height="39.322" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="375.5932" y="585.5932" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.998" fill="var(--warn-accent)">Open PR early for discussion</text>

  <rect x="660.339" y="462.7119" width="488.1356" height="39.322" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="904.4068" y="487.2881" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.998" fill="var(--primary-accent)">Review and approve before merge</text>

  <rect x="660.339" y="511.8644" width="488.1356" height="39.322" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="904.4068" y="536.4407" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.998" fill="var(--ok-accent)">Deploy immediately after merge</text>

  <rect x="660.339" y="561.0169" width="488.1356" height="39.322" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="904.4068" y="585.5932" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.998" fill="var(--danger-accent)">No long-lived branches</text>
</svg>
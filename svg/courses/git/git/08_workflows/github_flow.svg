<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Main branch -->
  <text x="50" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">main</text>
  <line x1="120" y1="120" x2="1230" y2="120" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="180" cy="120" r="16" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="540" cy="120" r="16" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="1080" cy="120" r="16" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- Feature branch -->
  <line x1="180" y1="136" x2="220" y2="250" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="220" y1="250" x2="510" y2="250" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="510" y1="250" x2="540" y2="136" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="130" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">feature</text>
  <circle cx="300" cy="250" r="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="400" cy="250" r="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>

  <!-- Step labels with numbered flow -->
  <!-- Step 1: Branch -->
  <rect x="130" y="30" width="110" height="45" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--primary-accent)">1. Branch</text>
  <text x="185" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">from main</text>

  <!-- Step 2: Commit -->
  <rect x="275" y="300" width="110" height="45" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="330" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-accent)">2. Commit</text>
  <text x="330" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">add changes</text>

  <!-- Step 3: Pull Request -->
  <rect x="420" y="300" width="130" height="45" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="485" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--warn-accent)">3. Pull Request</text>
  <text x="485" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">discuss + review</text>

  <!-- Step 4: Merge -->
  <rect x="490" y="30" width="110" height="45" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="545" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-accent)">4. Merge</text>
  <text x="545" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">to main</text>

  <!-- Step 5: Deploy -->
  <rect x="1020" y="30" width="120" height="45" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1080" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--danger-accent)">5. Deploy</text>
  <text x="1080" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">to production</text>

  <!-- Deploy arrow -->
  <line x1="1080" y1="136" x2="1080" y2="170" stroke="var(--danger-border)" stroke-width="2"/>
  <polygon points="1075,170 1085,170 1080,180" fill="var(--danger-fill)"/>

  <!-- Production server -->
  <rect x="1020" y="185" width="120" height="40" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1080" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-accent)">Production</text>

  <!-- GitHub Flow summary -->
  <rect x="100" y="400" width="1080" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">GitHub Flow Rules</text>

  <rect x="140" y="460" width="480" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="380" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)">Anything in main is deployable</text>

  <rect x="140" y="510" width="480" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="380" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">Create descriptive branch names</text>

  <rect x="140" y="560" width="480" height="40" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="380" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-accent)">Open PR early for discussion</text>

  <rect x="660" y="460" width="480" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="900" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)">Review and approve before merge</text>

  <rect x="660" y="510" width="480" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="900" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">Deploy immediately after merge</text>

  <rect x="660" y="560" width="480" height="40" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="900" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">No long-lived branches</text>
</svg>
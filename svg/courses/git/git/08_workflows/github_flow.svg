<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Main branch -->
  <text x="50" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">main</text>
  <line x1="120" y1="120" x2="1230" y2="120" stroke="var(--primary)" stroke-width="4"/>
  <circle cx="180" cy="120" r="16" fill="var(--primary)" stroke="var(--primary-dk)" stroke-width="2"/>
  <circle cx="540" cy="120" r="16" fill="var(--primary)" stroke="var(--primary-dk)" stroke-width="2"/>
  <circle cx="1080" cy="120" r="16" fill="var(--primary)" stroke="var(--primary-dk)" stroke-width="2"/>

  <!-- Feature branch -->
  <line x1="180" y1="136" x2="220" y2="250" stroke="var(--ok)" stroke-width="2.5"/>
  <line x1="220" y1="250" x2="510" y2="250" stroke="var(--ok)" stroke-width="2.5"/>
  <line x1="510" y1="250" x2="540" y2="136" stroke="var(--ok)" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="130" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">feature</text>
  <circle cx="300" cy="250" r="14" fill="var(--ok)" stroke="var(--ok-dk)" stroke-width="2"/>
  <circle cx="400" cy="250" r="14" fill="var(--ok)" stroke="var(--ok-dk)" stroke-width="2"/>

  <!-- Step labels with numbered flow -->
  <!-- Step 1: Branch -->
  <rect x="130" y="30" width="110" height="45" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="185" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--primary-dk)">1. Branch</text>
  <text x="185" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">from main</text>

  <!-- Step 2: Commit -->
  <rect x="275" y="300" width="110" height="45" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="330" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-dk)">2. Commit</text>
  <text x="330" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">add changes</text>

  <!-- Step 3: Pull Request -->
  <rect x="420" y="300" width="130" height="45" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="485" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--warn-dk)">3. Pull Request</text>
  <text x="485" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">discuss + review</text>

  <!-- Step 4: Merge -->
  <rect x="490" y="30" width="110" height="45" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="545" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-dk)">4. Merge</text>
  <text x="545" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">to main</text>

  <!-- Step 5: Deploy -->
  <rect x="1020" y="30" width="120" height="45" rx="8" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="1080" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--danger-dk)">5. Deploy</text>
  <text x="1080" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">to production</text>

  <!-- Deploy arrow -->
  <line x1="1080" y1="136" x2="1080" y2="170" stroke="var(--danger)" stroke-width="2"/>
  <polygon points="1075,170 1085,170 1080,180" fill="var(--danger)"/>

  <!-- Production server -->
  <rect x="1020" y="185" width="120" height="40" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="1080" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-dk)">Production</text>

  <!-- GitHub Flow summary -->
  <rect x="100" y="400" width="1080" height="220" rx="12" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="640" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">GitHub Flow Rules</text>

  <rect x="140" y="460" width="480" height="40" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="380" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-dk)">Anything in main is deployable</text>

  <rect x="140" y="510" width="480" height="40" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="380" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)">Create descriptive branch names</text>

  <rect x="140" y="560" width="480" height="40" rx="6" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="380" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-dk)">Open PR early for discussion</text>

  <rect x="660" y="460" width="480" height="40" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="900" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-dk)">Review and approve before merge</text>

  <rect x="660" y="510" width="480" height="40" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="900" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)">Deploy immediately after merge</text>

  <rect x="660" y="560" width="480" height="40" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1"/>
  <text x="900" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)">No long-lived branches</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Main branch -->
  <text x="60" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">main</text>
  <line x1="120" y1="110" x2="1200" y2="110" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="180" cy="110" r="16" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" font-weight="bold">C1</text>
  <circle cx="360" cy="110" r="16" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="360" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" font-weight="bold">C2</text>
  <circle cx="720" cy="110" r="16" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="720" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" font-weight="bold">M1</text>
  <circle cx="1080" cy="110" r="16" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1080" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" font-weight="bold">M2</text>

  <!-- Feature branch A -->
  <text x="250" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">feature/login</text>
  <line x1="360" y1="126" x2="400" y2="250" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="400" y1="250" x2="680" y2="250" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="680" y1="250" x2="720" y2="126" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="460" cy="250" r="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="460" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" font-weight="bold">A1</text>
  <circle cx="560" cy="250" r="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="560" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" font-weight="bold">A2</text>
  <circle cx="640" cy="250" r="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" font-weight="bold">A3</text>

  <!-- Merge arrow label -->
  <text x="715" y="185" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle">merge</text>

  <!-- Feature branch B -->
  <text x="610" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">feature/search</text>
  <line x1="720" y1="126" x2="760" y2="380" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="760" y1="380" x2="1040" y2="380" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="1040" y1="380" x2="1080" y2="126" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="830" cy="380" r="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="830" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" font-weight="bold">B1</text>
  <circle cx="930" cy="380" r="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="930" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" font-weight="bold">B2</text>

  <!-- Merge arrow label -->
  <text x="1075" y="260" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)" text-anchor="middle">merge</text>

  <!-- Code Review callout -->
  <rect x="780" y="290" width="160" height="40" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="860" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Code Review</text>

  <!-- Key points -->
  <rect x="100" y="470" width="1080" height="160" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--text)">Feature Branch Workflow</text>
  <circle cx="160" cy="540" r="5" fill="var(--ok-fill)"/>
  <text x="180" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Each feature developed in isolation on its own branch</text>
  <circle cx="160" cy="570" r="5" fill="var(--ok-fill)"/>
  <text x="180" y="575" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Pull/Merge request triggers code review before merge</text>
  <circle cx="660" cy="540" r="5" fill="var(--ok-fill)"/>
  <text x="680" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Main branch stays clean and deployable</text>
  <circle cx="660" cy="570" r="5" fill="var(--ok-fill)"/>
  <text x="680" y="575" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Most popular workflow for team development</text>
</svg>
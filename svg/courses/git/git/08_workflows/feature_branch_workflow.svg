<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Main branch -->
  <text x="40" y="62.4924" font-family="Arial, sans-serif" font-size="17.0797" font-weight="bold" fill="var(--primary-accent)">main</text>
  <line x1="103.1579" y1="57.0797" x2="1240" y2="57.0797" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="149.236" y="40" width="34.1594" height="34.1594" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.3158" y="63.5749" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7422" fill="var(--bg)" font-weight="bold">C1</text>
  <rect x="338.71" y="40" width="34.1594" height="34.1594" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="355.7895" y="63.5749" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7422" fill="var(--bg)" font-weight="bold">C2</text>
  <rect x="717.657" y="40" width="34.1594" height="34.1594" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="734.7368" y="63.5749" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7422" fill="var(--bg)" font-weight="bold">M1</text>
  <rect x="1096.6" y="40" width="34.1594" height="34.1594" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1113.6842" y="63.5749" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7422" fill="var(--bg)" font-weight="bold">M2</text>

  <!-- Feature branch A -->
  <text x="240" y="192.3971" font-family="Arial, sans-serif" font-size="14.9447" font-weight="bold" fill="var(--ok-accent)">feature/login</text>
  <line x1="355.7895" y1="74.4004" x2="397.8947" y2="208.6352" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="397.8947" y1="208.6352" x2="692.6316" y2="208.6352" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="692.6316" y1="208.6352" x2="734.7368" y2="74.4004" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="446.108" y="193.69" width="29.8894" height="29.8894" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="461.0526" y="214.0479" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.6748" fill="var(--bg)" font-weight="bold">A1</text>
  <rect x="551.371" y="193.69" width="29.8894" height="29.8894" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="566.3158" y="214.0479" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.6748" fill="var(--bg)" font-weight="bold">A2</text>
  <rect x="635.582" y="193.69" width="29.8894" height="29.8894" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.5263" y="214.0479" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.6748" fill="var(--bg)" font-weight="bold">A3</text>

  <!-- Merge arrow label -->
  <text x="729.4737" y="138.2701" font-family="Arial, sans-serif" font-size="12.8097" fill="var(--ok-accent)" text-anchor="middle">merge</text>

  <!-- Feature branch B -->
  <text x="618.9474" y="333.1272" font-family="Arial, sans-serif" font-size="14.9447" font-weight="bold" fill="var(--warn-accent)">feature/search</text>
  <line x1="734.7368" y1="74.4004" x2="776.8421" y2="349.3653" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="776.8421" y1="349.3653" x2="1071.5789" y2="349.3653" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="1071.5789" y1="349.3653" x2="1113.6842" y2="74.4004" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="835.582" y="334.421" width="29.8894" height="29.8894" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850.5263" y="354.778" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.6748" fill="var(--bg)" font-weight="bold">B1</text>
  <rect x="940.845" y="334.421" width="29.8894" height="29.8894" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955.7895" y="354.778" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.6748" fill="var(--bg)" font-weight="bold">B2</text>

  <!-- Merge arrow label -->
  <text x="1108.4211" y="219.4606" font-family="Arial, sans-serif" font-size="12.8097" fill="var(--warn-accent)" text-anchor="middle">merge</text>

  <!-- Code Review callout -->
  <rect x="797.8947" y="251.9368" width="168.4211" height="43.3016" rx="6.0012" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="882.1053" y="279.0002" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8772" fill="var(--primary-accent)">Code Review</text>

  <!-- Key points -->
  <rect x="82.1053" y="446.7938" width="1136.8421" height="173.2062" rx="6.0012" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650.5263" y="484.6826" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1472" font-weight="bold" fill="var(--text)">Feature Branch Workflow</text>
  <rect x="139.926" y="517.234" width="10.6748" height="10.6748" rx="5.3374" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="166.3158" y="527.9842" font-family="Arial, sans-serif" font-size="14.9447" fill="var(--text)">Each feature developed in isolation on its own branch</text>
  <rect x="139.926" y="549.71" width="10.6748" height="10.6748" rx="5.3374" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="166.3158" y="560.4603" font-family="Arial, sans-serif" font-size="14.9447" fill="var(--text)">Pull/Merge request triggers code review before merge</text>
  <rect x="666.241" y="517.234" width="10.6748" height="10.6748" rx="5.3374" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="692.6316" y="527.9842" font-family="Arial, sans-serif" font-size="14.9447" fill="var(--text)">Main branch stays clean and deployable</text>
  <rect x="666.241" y="549.71" width="10.6748" height="10.6748" rx="5.3374" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="692.6316" y="560.4603" font-family="Arial, sans-serif" font-size="14.9447" fill="var(--text)">Most popular workflow for team development</text>
</svg>

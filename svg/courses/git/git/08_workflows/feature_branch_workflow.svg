<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Main branch -->
  <text x="40" y="62.4924" font-family="Arial, sans-serif" font-size="17.0797" font-weight="bold" fill="var(--primary-accent)">main</text>
  <line x1="103.1579" y1="57.0797" x2="1240" y2="57.0797" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="166.3158" cy="57.0797" r="17.0797" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="166.3158" y="63.5749" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7422" fill="var(--bg)" font-weight="bold">C1</text>
  <circle cx="355.7895" cy="57.0797" r="17.0797" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="355.7895" y="63.5749" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7422" fill="var(--bg)" font-weight="bold">C2</text>
  <circle cx="734.7368" cy="57.0797" r="17.0797" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="734.7368" y="63.5749" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7422" fill="var(--bg)" font-weight="bold">M1</text>
  <circle cx="1113.6842" cy="57.0797" r="17.0797" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1113.6842" y="63.5749" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7422" fill="var(--bg)" font-weight="bold">M2</text>

  <!-- Feature branch A -->
  <text x="240" y="192.3971" font-family="Arial, sans-serif" font-size="14.9447" font-weight="bold" fill="var(--ok-accent)">feature/login</text>
  <line x1="355.7895" y1="74.4004" x2="397.8947" y2="208.6352" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="397.8947" y1="208.6352" x2="692.6316" y2="208.6352" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="692.6316" y1="208.6352" x2="734.7368" y2="74.4004" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="461.0526" cy="208.6352" r="14.9447" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="461.0526" y="214.0479" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.6748" fill="var(--bg)" font-weight="bold">A1</text>
  <circle cx="566.3158" cy="208.6352" r="14.9447" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="566.3158" y="214.0479" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.6748" fill="var(--bg)" font-weight="bold">A2</text>
  <circle cx="650.5263" cy="208.6352" r="14.9447" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="650.5263" y="214.0479" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.6748" fill="var(--bg)" font-weight="bold">A3</text>

  <!-- Merge arrow label -->
  <text x="729.4737" y="138.2701" font-family="Arial, sans-serif" font-size="12.8097" fill="var(--ok-accent)" text-anchor="middle">merge</text>

  <!-- Feature branch B -->
  <text x="618.9474" y="333.1272" font-family="Arial, sans-serif" font-size="14.9447" font-weight="bold" fill="var(--warn-accent)">feature/search</text>
  <line x1="734.7368" y1="74.4004" x2="776.8421" y2="349.3653" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="776.8421" y1="349.3653" x2="1071.5789" y2="349.3653" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="1071.5789" y1="349.3653" x2="1113.6842" y2="74.4004" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="850.5263" cy="349.3653" r="14.9447" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="850.5263" y="354.778" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.6748" fill="var(--bg)" font-weight="bold">B1</text>
  <circle cx="955.7895" cy="349.3653" r="14.9447" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="955.7895" y="354.778" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.6748" fill="var(--bg)" font-weight="bold">B2</text>

  <!-- Merge arrow label -->
  <text x="1108.4211" y="219.4606" font-family="Arial, sans-serif" font-size="12.8097" fill="var(--warn-accent)" text-anchor="middle">merge</text>

  <!-- Code Review callout -->
  <rect x="797.8947" y="251.9368" width="168.4211" height="43.3016" rx="6.0012" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="882.1053" y="279.0002" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8772" fill="var(--primary-accent)">Code Review</text>

  <!-- Key points -->
  <rect x="82.1053" y="446.7938" width="1136.8421" height="173.2062" rx="6.0012" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650.5263" y="484.6826" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1472" font-weight="bold" fill="var(--text)">Feature Branch Workflow</text>
  <circle cx="145.2632" cy="522.5714" r="5.3374" fill="var(--ok-fill)"/>
  <text x="166.3158" y="527.9842" font-family="Arial, sans-serif" font-size="14.9447" fill="var(--text)">Each feature developed in isolation on its own branch</text>
  <circle cx="145.2632" cy="555.0476" r="5.3374" fill="var(--ok-fill)"/>
  <text x="166.3158" y="560.4603" font-family="Arial, sans-serif" font-size="14.9447" fill="var(--text)">Pull/Merge request triggers code review before merge</text>
  <circle cx="671.5789" cy="522.5714" r="5.3374" fill="var(--ok-fill)"/>
  <text x="692.6316" y="527.9842" font-family="Arial, sans-serif" font-size="14.9447" fill="var(--text)">Main branch stays clean and deployable</text>
  <circle cx="671.5789" cy="555.0476" r="5.3374" fill="var(--ok-fill)"/>
  <text x="692.6316" y="560.4603" font-family="Arial, sans-serif" font-size="14.9447" fill="var(--text)">Most popular workflow for team development</text>
</svg>
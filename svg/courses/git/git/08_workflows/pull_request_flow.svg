<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Flow steps as connected boxes -->

  <!-- Step 1: Create Branch -->
  <rect x="80" y="60" width="200" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">1. Create Branch</text>
  <text x="180" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">git checkout -b</text>
  <text x="180" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">feature/my-feature</text>

  <!-- Arrow -->
  <line x1="280" y1="105" x2="340" y2="105" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="340,100 340,110 355,105" fill="var(--text-muted)"/>

  <!-- Step 2: Make Changes -->
  <rect x="360" y="60" width="200" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="460" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">2. Make Changes</text>
  <text x="460" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Write code, add tests</text>
  <text x="460" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">git commit -m "..."</text>

  <!-- Arrow -->
  <line x1="560" y1="105" x2="620" y2="105" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="620,100 620,110 635,105" fill="var(--text-muted)"/>

  <!-- Step 3: Push & Open PR -->
  <rect x="640" y="60" width="200" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="740" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">3. Open PR</text>
  <text x="740" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">git push -u origin</text>
  <text x="740" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Create pull request</text>

  <!-- Arrow down -->
  <line x1="740" y1="150" x2="740" y2="200" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="735,200 745,200 740,215" fill="var(--text-muted)"/>

  <!-- Step 4: Code Review -->
  <rect x="540" y="220" width="400" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="740" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">4. Code Review</text>

  <!-- Review substeps -->
  <rect x="560" y="270" width="160" height="55" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-accent)">Reviewers comment</text>
  <text x="640" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Discuss changes</text>

  <rect x="760" y="270" width="160" height="55" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="840" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)">CI/CD runs</text>
  <text x="840" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Automated tests</text>

  <!-- Feedback loop arrow -->
  <path d="M 540 280 Q 460 280 460 200 Q 460 150 560 150" fill="none" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="420" y="215" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">fix issues</text>

  <!-- Arrow down -->
  <line x1="740" y1="340" x2="740" y2="380" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="735,380 745,380 740,395" fill="var(--text-muted)"/>

  <!-- Step 5: Approve -->
  <rect x="640" y="400" width="200" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="740" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">5. Approve</text>
  <text x="740" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">LGTM - all checks pass</text>

  <!-- Arrow -->
  <line x1="840" y1="435" x2="920" y2="435" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="920,430 920,440 935,435" fill="var(--text-muted)"/>

  <!-- Step 6: Merge -->
  <rect x="940" y="400" width="200" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1040" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">6. Merge</text>
  <text x="1040" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Squash / Rebase / Merge</text>

  <!-- Merge strategies -->
  <rect x="100" y="510" width="350" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="275" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Merge Strategies</text>
  <text x="130" y="570" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Merge commit</text>
  <text x="270" y="570" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">preserves all commits</text>
  <text x="130" y="595" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)">Squash merge</text>
  <text x="270" y="595" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">single clean commit</text>
  <text x="130" y="620" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Rebase merge</text>
  <text x="270" y="620" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">linear history</text>

  <!-- Post-merge cleanup -->
  <rect x="520" y="510" width="350" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="695" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">After Merge</text>
  <text x="550" y="570" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Delete the feature branch</text>
  <text x="550" y="595" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Deploy to staging/production</text>
  <text x="550" y="620" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Close related issues</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Flow steps as connected boxes -->

  <!-- Step 1: Create Branch -->
  <rect x="40" y="40" width="226.4151" height="91.5789" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.2075" y="75.614" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.026" font-weight="bold" fill="var(--primary-accent)">1. Create Branch</text>
  <text x="153.2075" y="101.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8794" fill="var(--text-muted)">git checkout -b</text>
  <text x="153.2075" y="119.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8794" fill="var(--text-muted)">feature/my-feature</text>

  <!-- Arrow -->
  <line x1="266.4151" y1="85.7895" x2="334.3396" y2="85.7895" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="334.3396,80.7018 334.3396,90.8772 351.3208,85.7895" fill="var(--text-muted)"/>

  <!-- Step 2: Make Changes -->
  <rect x="356.9811" y="40" width="226.4151" height="91.5789" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470.1887" y="75.614" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.026" font-weight="bold" fill="var(--ok-accent)">2. Make Changes</text>
  <text x="470.1887" y="101.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8794" fill="var(--text-muted)">Write code, add tests</text>
  <text x="470.1887" y="119.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8794" fill="var(--text-muted)">git commit -m "..."</text>

  <!-- Arrow -->
  <line x1="583.3962" y1="85.7895" x2="651.3208" y2="85.7895" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="651.3208,80.7018 651.3208,90.8772 668.3019,85.7895" fill="var(--text-muted)"/>

  <!-- Step 3: Push & Open PR -->
  <rect x="673.9623" y="40" width="226.4151" height="91.5789" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.1698" y="75.614" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.026" font-weight="bold" fill="var(--warn-accent)">3. Open PR</text>
  <text x="787.1698" y="101.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8794" fill="var(--text-muted)">git push -u origin</text>
  <text x="787.1698" y="119.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8794" fill="var(--text-muted)">Create pull request</text>

  <!-- Arrow down -->
  <line x1="787.1698" y1="131.5789" x2="787.1698" y2="182.4561" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="781.5094,182.4561 792.8302,182.4561 787.1698,197.7193" fill="var(--text-muted)"/>

  <!-- Step 4: Code Review -->
  <rect x="560.7547" y="202.807" width="452.8302" height="122.1053" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="787.1698" y="238.4211" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1725" font-weight="bold" fill="var(--text)">4. Code Review</text>

  <!-- Review substeps -->
  <rect x="583.3962" y="253.6842" width="181.1321" height="55.9649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="673.9623" y="276.0702" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8794" font-weight="bold" fill="var(--primary-accent)">Reviewers comment</text>
  <text x="673.9623" y="296.4211" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8061" fill="var(--text-muted)">Discuss changes</text>

  <rect x="809.8113" y="253.6842" width="181.1321" height="55.9649" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900.3774" y="276.0702" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8794" font-weight="bold" fill="var(--ok-accent)">CI/CD runs</text>
  <text x="900.3774" y="296.4211" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8061" fill="var(--text-muted)">Automated tests</text>

  <!-- Feedback loop arrow -->
  <path d="M 560.7547 263.8596 Q 470.1887 263.8596 470.1887 182.4561 Q 470.1887 131.5789 583.3962 131.5789" fill="none" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="424.9057" y="197.7193" font-family="Arial, sans-serif" font-size="11.8061" fill="var(--warn-accent)">fix issues</text>

  <!-- Arrow down -->
  <line x1="787.1698" y1="324.9123" x2="787.1698" y2="365.614" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="781.5094,365.614 792.8302,365.614 787.1698,380.8772" fill="var(--text-muted)"/>

  <!-- Step 5: Approve -->
  <rect x="673.9623" y="385.9649" width="226.4151" height="71.2281" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.1698" y="416.4912" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.026" font-weight="bold" fill="var(--ok-accent)">5. Approve</text>
  <text x="787.1698" y="438.8772" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8794" fill="var(--text-muted)">LGTM - all checks pass</text>

  <!-- Arrow -->
  <line x1="900.3774" y1="421.5789" x2="990.9434" y2="421.5789" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="990.9434,416.4912 990.9434,426.6667 1007.9245,421.5789" fill="var(--text-muted)"/>

  <!-- Step 6: Merge -->
  <rect x="1013.5849" y="385.9649" width="226.4151" height="71.2281" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.7925" y="416.4912" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.026" font-weight="bold" fill="var(--primary-accent)">6. Merge</text>
  <text x="1126.7925" y="438.8772" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8794" fill="var(--text-muted)">Squash / Rebase / Merge</text>

  <!-- Merge strategies -->
  <rect x="62.6415" y="497.8947" width="396.2264" height="122.1053" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="260.7547" y="528.4211" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0992" font-weight="bold" fill="var(--text)">Merge Strategies</text>
  <text x="96.6038" y="558.9474" font-family="Arial, sans-serif" font-size="13.9527" fill="var(--primary-accent)">Merge commit</text>
  <text x="255.0943" y="558.9474" font-family="Arial, sans-serif" font-size="13.9527" fill="var(--text-muted)">preserves all commits</text>
  <text x="96.6038" y="584.386" font-family="Arial, sans-serif" font-size="13.9527" fill="var(--ok-accent)">Squash merge</text>
  <text x="255.0943" y="584.386" font-family="Arial, sans-serif" font-size="13.9527" fill="var(--text-muted)">single clean commit</text>
  <text x="96.6038" y="609.8246" font-family="Arial, sans-serif" font-size="13.9527" fill="var(--warn-accent)">Rebase merge</text>
  <text x="255.0943" y="609.8246" font-family="Arial, sans-serif" font-size="13.9527" fill="var(--text-muted)">linear history</text>

  <!-- Post-merge cleanup -->
  <rect x="538.1132" y="497.8947" width="396.2264" height="122.1053" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="736.2264" y="528.4211" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0992" font-weight="bold" fill="var(--text)">After Merge</text>
  <text x="572.0755" y="558.9474" font-family="Arial, sans-serif" font-size="13.9527" fill="var(--text)">Delete the feature branch</text>
  <text x="572.0755" y="584.386" font-family="Arial, sans-serif" font-size="13.9527" fill="var(--text)">Deploy to staging/production</text>
  <text x="572.0755" y="609.8246" font-family="Arial, sans-serif" font-size="13.9527" fill="var(--text)">Close related issues</text>
</svg>
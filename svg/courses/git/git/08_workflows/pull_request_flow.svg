<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Flow steps as connected boxes -->

  <!-- Step 1: Create Branch -->
  <rect x="80" y="60" width="200" height="90" rx="12" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2.5"/>
  <text x="180" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">1. Create Branch</text>
  <text x="180" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">git checkout -b</text>
  <text x="180" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">feature/my-feature</text>

  <!-- Arrow -->
  <line x1="280" y1="105" x2="340" y2="105" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="340,100 340,110 355,105" fill="var(--text-muted)"/>

  <!-- Step 2: Make Changes -->
  <rect x="360" y="60" width="200" height="90" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2.5"/>
  <text x="460" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">2. Make Changes</text>
  <text x="460" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Write code, add tests</text>
  <text x="460" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">git commit -m "..."</text>

  <!-- Arrow -->
  <line x1="560" y1="105" x2="620" y2="105" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="620,100 620,110 635,105" fill="var(--text-muted)"/>

  <!-- Step 3: Push & Open PR -->
  <rect x="640" y="60" width="200" height="90" rx="12" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2.5"/>
  <text x="740" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)">3. Open PR</text>
  <text x="740" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">git push -u origin</text>
  <text x="740" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Create pull request</text>

  <!-- Arrow down -->
  <line x1="740" y1="150" x2="740" y2="200" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="735,200 745,200 740,215" fill="var(--text-muted)"/>

  <!-- Step 4: Code Review -->
  <rect x="540" y="220" width="400" height="120" rx="12" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2"/>
  <text x="740" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">4. Code Review</text>

  <!-- Review substeps -->
  <rect x="560" y="270" width="160" height="55" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="640" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">Reviewers comment</text>
  <text x="640" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Discuss changes</text>

  <rect x="760" y="270" width="160" height="55" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="840" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">CI/CD runs</text>
  <text x="840" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Automated tests</text>

  <!-- Feedback loop arrow -->
  <path d="M 540 280 Q 460 280 460 200 Q 460 150 560 150" fill="none" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="420" y="215" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-dk)">fix issues</text>

  <!-- Arrow down -->
  <line x1="740" y1="340" x2="740" y2="380" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="735,380 745,380 740,395" fill="var(--text-muted)"/>

  <!-- Step 5: Approve -->
  <rect x="640" y="400" width="200" height="70" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2.5"/>
  <text x="740" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">5. Approve</text>
  <text x="740" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">LGTM - all checks pass</text>

  <!-- Arrow -->
  <line x1="840" y1="435" x2="920" y2="435" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="920,430 920,440 935,435" fill="var(--text-muted)"/>

  <!-- Step 6: Merge -->
  <rect x="940" y="400" width="200" height="70" rx="12" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2.5"/>
  <text x="1040" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">6. Merge</text>
  <text x="1040" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Squash / Rebase / Merge</text>

  <!-- Merge strategies -->
  <rect x="100" y="510" width="350" height="120" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="275" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Merge Strategies</text>
  <text x="130" y="570" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Merge commit</text>
  <text x="270" y="570" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">preserves all commits</text>
  <text x="130" y="595" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-dk)">Squash merge</text>
  <text x="270" y="595" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">single clean commit</text>
  <text x="130" y="620" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Rebase merge</text>
  <text x="270" y="620" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">linear history</text>

  <!-- Post-merge cleanup -->
  <rect x="520" y="510" width="350" height="120" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="695" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">After Merge</text>
  <text x="550" y="570" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Delete the feature branch</text>
  <text x="550" y="595" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Deploy to staging/production</text>
  <text x="550" y="620" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Close related issues</text>
</svg>
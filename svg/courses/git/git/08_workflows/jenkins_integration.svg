<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd3_08_workflows" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="234.958" width="189.4737" height="243.6975" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="134.7368" y="332.437" text-anchor="middle" font-size="27.1247" font-weight="bold" fill="var(--primary-accent)">Git</text>
  <text x="134.7368" y="405.5462" text-anchor="middle" font-size="24.6588" fill="var(--primary-accent)">git push</text>
  <line x1="229.4737" y1="356.8067" x2="324.2105" y2="356.8067" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_08_workflows)" />
  <text x="277.8948" y="317.8151" text-anchor="middle" font-size="24.6588" fill="var(--text-muted)">webhook</text>
  <rect x="334.7369" y="186.2185" width="231.579" height="341.1765" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="450.5263" y="317.8151" text-anchor="middle" font-size="29.5906" font-weight="bold" fill="var(--info-accent)">Jenkins</text>
  <text x="450.5263" y="405.5462" text-anchor="middle" font-size="24.6588" fill="var(--info-accent)">Build</text>
  <text x="450.5263" y="478.6555" text-anchor="middle" font-size="24.6588" fill="var(--text-faint)">compile + package</text>
  <line x1="566.3158" y1="356.8067" x2="661.0526" y2="356.8067" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_08_workflows)" />
  <rect x="671.5789" y="186.2185" width="231.579" height="341.1765" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="787.3684" y="317.8151" text-anchor="middle" font-size="29.5906" font-weight="bold" fill="var(--ok-accent)">Test</text>
  <text x="787.3684" y="405.5462" text-anchor="middle" font-size="24.6588" fill="var(--ok-accent)">Run Suite</text>
  <text x="787.3684" y="478.6555" text-anchor="middle" font-size="24.6588" fill="var(--text-faint)">unit + integration</text>
  <line x1="903.1579" y1="356.8067" x2="997.8947" y2="356.8067" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_08_workflows)" />
  <rect x="1008.421" y="186.2185" width="231.579" height="341.1765" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1124.2105" y="317.8151" text-anchor="middle" font-size="29.5906" font-weight="bold" fill="var(--warn-accent)">Deploy</text>
  <text x="1124.2105" y="405.5462" text-anchor="middle" font-size="24.6588" fill="var(--warn-accent)">Release</text>
  <text x="1124.2105" y="478.6555" text-anchor="middle" font-size="24.6588" fill="var(--text-faint)">staging / prod</text>
  <text x="650.5263" y="40" text-anchor="middle" font-size="27.1247" fill="var(--text-muted)">CI/CD Pipeline</text>
  <line x1="334.7369" y1="74.1176" x2="966.3157" y2="74.1176" stroke="var(--border)" stroke-width="2" stroke-dasharray="8.5333 6.4" />
  <rect x="435.731" y="585.709" width="29.5906" height="29.5906" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="482.1052" y="620" font-size="24.6588" fill="var(--text-muted)">pass</text>
  <rect x="772.573" y="585.709" width="29.5906" height="29.5906" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="818.9474" y="620" font-size="24.6588" fill="var(--text-muted)">pass</text>
  <rect x="1109.42" y="585.709" width="29.5906" height="29.5906" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="1155.7894" y="620" font-size="24.6588" fill="var(--text-muted)">live</text>
</svg>
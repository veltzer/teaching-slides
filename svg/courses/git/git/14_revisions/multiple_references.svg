<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Shared ancestor row -->
  <line x1="80" y1="193.877550837151" x2="1240" y2="193.877550837151" stroke="var(--text-faint)" stroke-width="2"/>

  <rect x="80" y="158.367347488546" width="100" height="71.020407819658" rx="6.527805711862" fill="var(--text-faint)" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="130" y="202.16326603686" text-anchor="middle" font-size="19.58341607613" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">base</text>

  <!-- Branch A (top) -->
  <rect x="260" y="63.673469273219" width="100" height="71.020407819658" rx="6.527805711862" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="107.469387821533" text-anchor="middle" font-size="19.58341607613" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">a1</text>
  <rect x="420" y="63.673469273219" width="100" height="71.020407819658" rx="6.527805711862" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="107.469387821533" text-anchor="middle" font-size="19.58341607613" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">a2</text>
  <rect x="580" y="63.673469273219" width="100" height="71.020407819658" rx="6.527805711862" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="107.469387821533" text-anchor="middle" font-size="19.58341607613" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">A</text>

  <line x1="180" y1="193.877550837151" x2="260" y2="134.693878215327" stroke="var(--text)" stroke-width="2"/>
  <line x1="360" y1="99.183673744273" x2="420" y2="99.183673744273" stroke="var(--text)" stroke-width="2"/>
  <line x1="520" y1="99.183673744273" x2="580" y2="99.183673744273" stroke="var(--text)" stroke-width="2"/>
  <text x="130" y="51.836735197834" text-anchor="middle" font-size="19.58341607613" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Branch A</text>

  <!-- Branch B (bottom) -->
  <rect x="260" y="253.061224581424" width="100" height="71.020407819658" rx="6.527805711862" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="296.857143129738" text-anchor="middle" font-size="19.58341607613" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">b1</text>
  <rect x="420" y="253.061224581424" width="100" height="71.020407819658" rx="6.527805711862" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="296.857143129738" text-anchor="middle" font-size="19.58341607613" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">b2</text>
  <rect x="580" y="253.061224581424" width="100" height="71.020407819658" rx="6.527805711862" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="296.857143129738" text-anchor="middle" font-size="19.58341607613" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">B</text>

  <line x1="180" y1="193.877550837151" x2="260" y2="253.061224581424" stroke="var(--text)" stroke-width="2"/>
  <line x1="360" y1="288.571429052478" x2="420" y2="288.571429052478" stroke="var(--text)" stroke-width="2"/>
  <line x1="520" y1="288.571429052478" x2="580" y2="288.571429052478" stroke="var(--text)" stroke-width="2"/>
  <text x="130" y="335.918367598917" text-anchor="middle" font-size="19.58341607613" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Branch B</text>

  <!-- Explanations -->
  <rect x="740" y="40" width="500" height="130.204081563932" rx="6.527805711862" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="81.428571508746" text-anchor="middle" font-size="21.759352019722" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">A..B</text>
  <text x="990" y="116.9387759798" text-anchor="middle" font-size="16.319514279656" fill="var(--danger-text)" font-family="Arial, sans-serif">Commits reachable from B</text>
  <text x="990" y="146.530612290712" text-anchor="middle" font-size="16.319514279656" fill="var(--danger-text)" font-family="Arial, sans-serif">but not from A — { b1, b2, B }</text>

  <rect x="740" y="217.551020110371" width="500" height="130.204081563932" rx="6.527805711862" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="258.979591619117" text-anchor="middle" font-size="21.759352019722" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">A...B</text>
  <text x="990" y="294.489796090171" text-anchor="middle" font-size="16.319514279656" fill="var(--info-text)" font-family="Arial, sans-serif">Symmetric difference — commits</text>
  <text x="990" y="324.081632401083" text-anchor="middle" font-size="16.319514279656" fill="var(--info-text)" font-family="Arial, sans-serif">on either side, not on both</text>

  <rect x="40" y="406.938775418576" width="1200" height="213.061224581424" rx="6.527805711862" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="454.285713965015" text-anchor="middle" font-size="19.58341607613" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mental model</text>
  <text x="640" y="495.714285473761" text-anchor="middle" font-size="16.319514279656" fill="var(--text-muted)" font-family="Arial, sans-serif">A..B  ≡  B minus the commits already in A</text>
  <text x="640" y="531.224489944815" text-anchor="middle" font-size="16.319514279656" fill="var(--text-muted)" font-family="Arial, sans-serif">A...B ≡  (A ∪ B) minus their merge base</text>
  <text x="640" y="572.653061453561" text-anchor="middle" font-size="16.319514279656" fill="var(--text-muted)" font-family="Arial, sans-serif">Use two dots for "what's new on B"; three dots for "how they diverged"</text>
  <text x="640" y="608.163264802166" text-anchor="middle" font-size="15.23154630786" font-style="italic" fill="var(--text-faint)" font-family="Arial, sans-serif">git log A..B   |   git log A...B --left-right</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrNL" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="406.6667" y="483.5294" width="466.6666" height="136.4706" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="595.5555" y="544.9412" text-anchor="middle" font-size="23.3161" fill="var(--ok-accent)" font-weight="bold">Git Fundamentals</text>
  <text x="595.5555" y="592.7059" text-anchor="middle" font-size="21.1964" fill="var(--ok-accent)">Completed</text>
  <circle cx="839.9999" cy="551.7647" r="21.1964" fill="var(--ok-accent)" />
  <text x="839.9999" y="568.8235" text-anchor="middle" font-size="27.5552" fill="var(--bg)">✓</text>
  <line x1="484.4444" y1="483.5294" x2="217.7778" y2="210.5883" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrNL)" />
  <line x1="639.9999" y1="483.5294" x2="639.9999" y2="210.5883" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrNL)" />
  <line x1="795.5555" y1="483.5294" x2="1062.2221" y2="210.5883" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrNL)" />
  <rect x="40" y="40" width="355.5555" height="170.5883" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="217.7778" y="108.2353" text-anchor="middle" font-size="25.4356" font-weight="bold" fill="var(--primary-accent)">Advanced Git</text>
  <text x="217.7778" y="159.4118" text-anchor="middle" font-size="21.1964" fill="var(--text-muted)">Internals, custom commands,</text>
  <text x="217.7778" y="193.5294" text-anchor="middle" font-size="21.1964" fill="var(--text-muted)">hooks, plumbing</text>
  <rect x="462.2222" y="40" width="355.5555" height="170.5883" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="639.9999" y="108.2353" text-anchor="middle" font-size="25.4356" font-weight="bold" fill="var(--info-accent)">DevOps Integration</text>
  <text x="639.9999" y="159.4118" text-anchor="middle" font-size="21.1964" fill="var(--text-muted)">CI/CD pipelines,</text>
  <text x="639.9999" y="193.5294" text-anchor="middle" font-size="21.1964" fill="var(--text-muted)">automation, deployment</text>
  <rect x="884.4445" y="40" width="355.5555" height="170.5883" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1062.2221" y="108.2353" text-anchor="middle" font-size="25.4356" font-weight="bold" fill="var(--warn-accent)">Platform Mastery</text>
  <text x="1062.2221" y="159.4118" text-anchor="middle" font-size="21.1964" fill="var(--text-muted)">GitHub/GitLab features,</text>
  <text x="1062.2221" y="193.5294" text-anchor="middle" font-size="21.1964" fill="var(--text-muted)">PRs, actions, pages</text>
</svg>
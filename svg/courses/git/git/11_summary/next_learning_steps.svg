<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrNL" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="399.7598" y="501.6216" width="430.5105" height="138.3784" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="4.1001" rx="12.3003" />
  <text x="574.014" y="563.8919" text-anchor="middle" font-size="22.5506" fill="var(--ok-dk)" font-weight="bold">Git Fundamentals</text>
  <text x="574.014" y="612.3243" text-anchor="middle" font-size="20.5005" fill="var(--ok-dk)">Completed</text>
  <circle cx="799.5195" cy="570.8108" r="20.5005" fill="var(--ok-dk)" />
  <text x="799.5195" y="588.1081" text-anchor="middle" font-size="26.6506" fill="var(--bg)">✓</text>
  <line x1="471.5115" y1="501.6216" x2="225.5055" y2="224.8649" stroke="var(--primary-dk)" stroke-width="3.0751" marker-end="url(#arrNL)" />
  <line x1="615.015" y1="501.6216" x2="615.015" y2="224.8649" stroke="var(--info-mid)" stroke-width="3.0751" marker-end="url(#arrNL)" />
  <line x1="758.5185" y1="501.6216" x2="1004.5245" y2="224.8649" stroke="var(--warn-dk)" stroke-width="3.0751" marker-end="url(#arrNL)" />
  <rect x="61.5015" y="51.8919" width="328.008" height="172.973" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="3.0751" rx="12.3003" />
  <text x="225.5055" y="121.0811" text-anchor="middle" font-size="24.6006" font-weight="bold" fill="var(--primary-dk)">Advanced Git</text>
  <text x="225.5055" y="172.973" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Internals, custom commands,</text>
  <text x="225.5055" y="207.5676" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">hooks, plumbing</text>
  <rect x="451.011" y="51.8919" width="328.008" height="172.973" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="3.0751" rx="12.3003" />
  <text x="615.015" y="121.0811" text-anchor="middle" font-size="24.6006" font-weight="bold" fill="var(--info-mid)">DevOps Integration</text>
  <text x="615.015" y="172.973" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">CI/CD pipelines,</text>
  <text x="615.015" y="207.5676" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">automation, deployment</text>
  <rect x="840.5206" y="51.8919" width="328.008" height="172.973" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="3.0751" rx="12.3003" />
  <text x="1004.5245" y="121.0811" text-anchor="middle" font-size="24.6006" font-weight="bold" fill="var(--warn-dk)">Platform Mastery</text>
  <text x="1004.5245" y="172.973" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">GitHub/GitLab features,</text>
  <text x="1004.5245" y="207.5676" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">PRs, actions, pages</text>
</svg>
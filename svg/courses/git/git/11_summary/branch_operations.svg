<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrBO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <ellipse cx="362.2641" cy="203.7736" rx="66.4151" ry="33.8113" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.4151" />
  <text x="362.2641" y="213.9623" text-anchor="middle" font-size="15.6981" font-weight="bold" fill="var(--info-accent)">Branch</text>
  <rect x="84.5283" y="30.566" width="120.7547" height="73.3585" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="144.9057" y="61.1321" text-anchor="middle" font-size="13.283" font-weight="bold" fill="var(--primary-accent)">Create</text>
  <text x="144.9057" y="87.6226" text-anchor="middle" font-size="12.0755" fill="var(--text-muted)">git branch &lt;name&gt;</text>
  <line x1="205.283" y1="85.5849" x2="307.9245" y2="167.0943" stroke="var(--primary-border)" stroke-width="1.8113" marker-end="url(#arrBO)" />
  <rect x="519.2452" y="30.566" width="120.7547" height="73.3585" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="579.6226" y="61.1321" text-anchor="middle" font-size="13.283" font-weight="bold" fill="var(--ok-accent)">Develop</text>
  <text x="579.6226" y="87.6226" text-anchor="middle" font-size="12.0755" fill="var(--text-muted)">switch + commit</text>
  <line x1="519.2452" y1="85.5849" x2="416.6038" y2="167.0943" stroke="var(--ok-border)" stroke-width="1.8113" marker-end="url(#arrBO)" />
  <rect x="519.2452" y="295.4717" width="120.7547" height="73.3585" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="579.6226" y="326.0377" text-anchor="middle" font-size="13.283" font-weight="bold" fill="var(--warn-accent)">Merge</text>
  <text x="579.6226" y="352.5283" text-anchor="middle" font-size="12.0755" fill="var(--text-muted)">git merge &lt;br&gt;</text>
  <line x1="519.2452" y1="315.849" x2="416.6038" y2="240.4528" stroke="var(--warn-border)" stroke-width="1.8113" marker-end="url(#arrBO)" />
  <rect x="84.5283" y="295.4717" width="120.7547" height="73.3585" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="144.9057" y="326.0377" text-anchor="middle" font-size="13.283" font-weight="bold" fill="var(--danger-accent)">Delete</text>
  <text x="144.9057" y="352.5283" text-anchor="middle" font-size="12.0755" fill="var(--text-muted)">git branch -d</text>
  <line x1="205.283" y1="315.849" x2="307.9245" y2="240.4528" stroke="var(--danger-border)" stroke-width="1.8113" marker-end="url(#arrBO)" />
  <path d="M 205.283 67.2453 L 519.2452 67.2453" stroke="var(--text-faint)" stroke-width="1.2075" stroke-dasharray="4.8302 3.6226" marker-end="url(#arrBO)" />
  <text x="362.2641" y="20.3774" text-anchor="middle" font-size="12.0755" fill="var(--text-faint)">lifecycle</text>
  <path d="M 640 103.9245 L 640 295.4717" stroke="var(--text-faint)" stroke-width="1.2075" stroke-dasharray="4.8302 3.6226" marker-end="url(#arrBO)" />
  <path d="M 519.2452 332.1509 L 205.283 332.1509" stroke="var(--text-faint)" stroke-width="1.2075" stroke-dasharray="4.8302 3.6226" marker-end="url(#arrBO)" />
</svg>
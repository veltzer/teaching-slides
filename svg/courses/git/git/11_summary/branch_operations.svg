<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrBO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <ellipse cx="639.9999" cy="343.1579" rx="95.3" ry="48.5163" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.4151" />
  <text x="639.9999" y="357.7778" text-anchor="middle" font-size="22.5254" font-weight="bold" fill="var(--info-accent)">Branch</text>
  <rect x="241.4728" y="94.6198" width="173.2727" height="105.2632" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.6095" />
  <text x="328.1092" y="138.4795" text-anchor="middle" font-size="19.06" font-weight="bold" fill="var(--primary-accent)">Create</text>
  <text x="328.1092" y="176.4911" text-anchor="middle" font-size="17.3273" fill="var(--text-muted)">git branch &lt;name&gt;</text>
  <line x1="414.7455" y1="173.5672" x2="562.0272" y2="290.5262" stroke="var(--primary-border)" stroke-width="1.8113" marker-end="url(#arrBO)" />
  <rect x="865.2544" y="94.6198" width="173.2727" height="105.2632" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.6095" />
  <text x="951.8908" y="138.4795" text-anchor="middle" font-size="19.06" font-weight="bold" fill="var(--ok-accent)">Develop</text>
  <text x="951.8908" y="176.4911" text-anchor="middle" font-size="17.3273" fill="var(--text-muted)">switch + commit</text>
  <line x1="865.2544" y1="173.5672" x2="717.9728" y2="290.5262" stroke="var(--ok-border)" stroke-width="1.8113" marker-end="url(#arrBO)" />
  <rect x="865.2544" y="474.7368" width="173.2727" height="105.2632" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="8.6095" />
  <text x="951.8908" y="518.5964" text-anchor="middle" font-size="19.06" font-weight="bold" fill="var(--warn-accent)">Merge</text>
  <text x="951.8908" y="556.6082" text-anchor="middle" font-size="17.3273" fill="var(--text-muted)">git merge &lt;br&gt;</text>
  <line x1="865.2544" y1="503.9765" x2="717.9728" y2="395.7894" stroke="var(--warn-border)" stroke-width="1.8113" marker-end="url(#arrBO)" />
  <rect x="241.4728" y="474.7368" width="173.2727" height="105.2632" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="8.6095" />
  <text x="328.1092" y="518.5964" text-anchor="middle" font-size="19.06" font-weight="bold" fill="var(--danger-accent)">Delete</text>
  <text x="328.1092" y="556.6082" text-anchor="middle" font-size="17.3273" fill="var(--text-muted)">git branch -d</text>
  <line x1="414.7455" y1="503.9765" x2="562.0272" y2="395.7894" stroke="var(--danger-border)" stroke-width="1.8113" marker-end="url(#arrBO)" />
  <path d="M 414.7455 147.2514 L 865.2544 147.2514" stroke="var(--text-faint)" stroke-width="1.2075" stroke-dasharray="4.8302 3.6226" marker-end="url(#arrBO)" />
  <text x="639.9999" y="80" text-anchor="middle" font-size="17.3273" fill="var(--text-faint)">lifecycle</text>
  <path d="M 1038.5272 199.883 L 1038.5272 474.7368" stroke="var(--text-faint)" stroke-width="1.2075" stroke-dasharray="4.8302 3.6226" marker-end="url(#arrBO)" />
  <path d="M 865.2544 527.3683 L 414.7455 527.3683" stroke="var(--text-faint)" stroke-width="1.2075" stroke-dasharray="4.8302 3.6226" marker-end="url(#arrBO)" />
</svg>
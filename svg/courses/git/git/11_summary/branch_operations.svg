<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrBO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <ellipse cx="394.4045" cy="211.4736" rx="58.7293" ry="29.8985" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="0.9172" />
  <text x="394.4045" y="220.4832" text-anchor="middle" font-size="13.8814" font-weight="bold" fill="var(--info-accent)">Branch</text>
  <rect x="148.8093" y="58.3101" width="106.7806" height="64.8692" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.2325" rx="6" />
  <text x="202.1996" y="85.339" text-anchor="middle" font-size="11.7459" font-weight="bold" fill="var(--primary-accent)">Create</text>
  <text x="202.1996" y="108.7639" text-anchor="middle" font-size="10.6781" fill="var(--text-muted)">git branch &lt;name&gt;</text>
  <line x1="255.5899" y1="106.9621" x2="346.3533" y2="179.0389" stroke="var(--primary-border)" stroke-width="0.6879" marker-end="url(#arrBO)" />
  <rect x="533.2194" y="58.3101" width="106.7806" height="64.8692" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2325" rx="6" />
  <text x="586.6097" y="85.339" text-anchor="middle" font-size="11.7459" font-weight="bold" fill="var(--ok-accent)">Develop</text>
  <text x="586.6097" y="108.7639" text-anchor="middle" font-size="10.6781" fill="var(--text-muted)">switch + commit</text>
  <line x1="533.2194" y1="106.9621" x2="442.456" y2="179.0389" stroke="var(--ok-border)" stroke-width="0.6879" marker-end="url(#arrBO)" />
  <rect x="533.2194" y="292.56" width="106.7806" height="64.8692" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.2325" rx="6" />
  <text x="586.6097" y="319.5888" text-anchor="middle" font-size="11.7459" font-weight="bold" fill="var(--warn-accent)">Merge</text>
  <text x="586.6097" y="343.0139" text-anchor="middle" font-size="10.6781" fill="var(--text-muted)">git merge &lt;br&gt;</text>
  <line x1="533.2194" y1="310.5792" x2="442.456" y2="243.9081" stroke="var(--warn-border)" stroke-width="0.6879" marker-end="url(#arrBO)" />
  <rect x="148.8093" y="292.56" width="106.7806" height="64.8692" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2325" rx="6" />
  <text x="202.1996" y="319.5888" text-anchor="middle" font-size="11.7459" font-weight="bold" fill="var(--danger-accent)">Delete</text>
  <text x="202.1996" y="343.0139" text-anchor="middle" font-size="10.6781" fill="var(--text-muted)">git branch -d</text>
  <line x1="255.5899" y1="310.5792" x2="346.3533" y2="243.9081" stroke="var(--danger-border)" stroke-width="0.6879" marker-end="url(#arrBO)" />
  <path d="M 255.5899 90.7448 L 533.2194 90.7448" stroke="var(--text-faint)" stroke-width="0.4586" stroke-dasharray="1.8344 1.3758" marker-end="url(#arrBO)" />
  <text x="394.4045" y="49.3006" text-anchor="middle" font-size="10.6781" fill="var(--text-faint)">lifecycle</text>
  <path d="M 640 123.1794 L 640 292.56" stroke="var(--text-faint)" stroke-width="0.4586" stroke-dasharray="1.8344 1.3758" marker-end="url(#arrBO)" />
  <path d="M 533.2194 324.9946 L 255.5899 324.9946" stroke="var(--text-faint)" stroke-width="0.4586" stroke-dasharray="1.8344 1.3758" marker-end="url(#arrBO)" />
</svg>
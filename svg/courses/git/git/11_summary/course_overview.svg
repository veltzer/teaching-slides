<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrCO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="199.262" height="128" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="139.631" y="124" text-anchor="middle" font-size="22.9086" font-weight="bold">Introduction</text>
  <line x1="239.262" y1="104" x2="283.5424" y2="104" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="290.1844" y="40" width="199.262" height="128" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="389.8154" y="124" text-anchor="middle" font-size="22.9086" font-weight="bold">Basics</text>
  <line x1="489.4465" y1="104" x2="533.7269" y2="104" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="540.369" y="40" width="199.262" height="128" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="124" text-anchor="middle" font-size="22.9086" font-weight="bold">Config</text>
  <line x1="739.631" y1="104" x2="783.9115" y2="104" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="790.5535" y="40" width="199.262" height="128" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="890.1846" y="124" text-anchor="middle" font-size="22.9086" font-weight="bold">Undoing</text>
  <line x1="989.8156" y1="104" x2="1034.0959" y2="104" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="1040.738" y="40" width="199.262" height="128" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1140.369" y="124" text-anchor="middle" font-size="22.9086" font-weight="bold">Remotes</text>
  <line x1="1140.369" y1="168" x2="1140.369" y2="280" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="1140.369" y1="280" x2="139.631" y2="280" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="139.631" y1="280" x2="139.631" y2="340" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="40" y="352" width="199.262" height="128" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="139.631" y="436" text-anchor="middle" font-size="22.9086" font-weight="bold">Branches</text>
  <line x1="239.262" y1="416" x2="283.5424" y2="416" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="290.1844" y="352" width="199.262" height="128" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="389.8154" y="436" text-anchor="middle" font-size="22.9086" font-weight="bold">Merging</text>
  <line x1="489.4465" y1="416" x2="533.7269" y2="416" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="540.369" y="352" width="199.262" height="128" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="436" text-anchor="middle" font-size="22.9086" font-weight="bold">Workflows</text>
  <line x1="739.631" y1="416" x2="783.9115" y2="416" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="790.5535" y="352" width="199.262" height="128" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="890.1846" y="436" text-anchor="middle" font-size="22.9086" font-weight="bold">Tools</text>
  <line x1="989.8156" y1="416" x2="1034.0959" y2="416" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="1040.738" y="352" width="199.262" height="128" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1140.369" y="436" text-anchor="middle" font-size="22.9086" font-weight="bold">Advanced</text>
  <text x="693.1365" y="620" text-anchor="middle" font-size="27.4904" fill="var(--text)" font-style="italic">Course Learning Path</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrCO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="10.6667" y="72" width="192" height="115.2" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="106.6667" y="147.6" text-anchor="middle" font-size="21.3333" font-weight="bold">Introduction</text>
  <line x1="202.6667" y1="129.6" x2="245.3333" y2="129.6" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="251.7333" y="72" width="192" height="115.2" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="347.7333" y="147.6" text-anchor="middle" font-size="21.3333" font-weight="bold">Basics</text>
  <line x1="443.7333" y1="129.6" x2="486.4" y2="129.6" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="492.8" y="72" width="192" height="115.2" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="588.8" y="147.6" text-anchor="middle" font-size="21.3333" font-weight="bold">Config</text>
  <line x1="684.8" y1="129.6" x2="727.4667" y2="129.6" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="733.8667" y="72" width="192" height="115.2" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="829.8667" y="147.6" text-anchor="middle" font-size="21.3333" font-weight="bold">Undoing</text>
  <line x1="925.8667" y1="129.6" x2="968.5333" y2="129.6" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="974.9333" y="72" width="192" height="115.2" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1070.9333" y="147.6" text-anchor="middle" font-size="21.3333" font-weight="bold">Remotes</text>
  <line x1="1070.9333" y1="187.2" x2="1070.9333" y2="288" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="1070.9333" y1="288" x2="106.6667" y2="288" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="106.6667" y1="288" x2="106.6667" y2="342" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="10.6667" y="352.8" width="192" height="115.2" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="106.6667" y="428.4" text-anchor="middle" font-size="21.3333" font-weight="bold">Branches</text>
  <line x1="202.6667" y1="410.4" x2="245.3333" y2="410.4" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="251.7333" y="352.8" width="192" height="115.2" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="347.7333" y="428.4" text-anchor="middle" font-size="21.3333" font-weight="bold">Merging</text>
  <line x1="443.7333" y1="410.4" x2="486.4" y2="410.4" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="492.8" y="352.8" width="192" height="115.2" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="588.8" y="428.4" text-anchor="middle" font-size="21.3333" font-weight="bold">Workflows</text>
  <line x1="684.8" y1="410.4" x2="727.4667" y2="410.4" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="733.8667" y="352.8" width="192" height="115.2" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="829.8667" y="428.4" text-anchor="middle" font-size="21.3333" font-weight="bold">Tools</text>
  <line x1="925.8667" y1="410.4" x2="968.5333" y2="410.4" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrCO)" />
  <rect x="974.9333" y="352.8" width="192" height="115.2" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1070.9333" y="428.4" text-anchor="middle" font-size="21.3333" font-weight="bold">Advanced</text>
  <text x="640" y="594" text-anchor="middle" font-size="25.6" fill="var(--text)" font-style="italic">Course Learning Path</text>
</svg>
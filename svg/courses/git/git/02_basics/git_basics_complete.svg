<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="240.586834" y="40" width="798.828331" height="375.675853278412" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.497441511346"/>
  <text x="640.001" y="152.702580074844" text-anchor="middle" font-size="48.694478691259" font-family="Arial, sans-serif" fill="var(--ok-text)">Ready to:</text>
  <text x="640.001" y="227.837868002979" text-anchor="middle" font-size="38.955734995546" font-family="Arial, sans-serif" fill="var(--ok-text)">• Track changes effectively</text>
  <text x="640.001" y="290.450686124728" text-anchor="middle" font-size="38.955734995546" font-family="Arial, sans-serif" fill="var(--ok-text)">• Commit with confidence</text>
  <text x="640.001" y="353.063152429117" text-anchor="middle" font-size="38.955734995546" font-family="Arial, sans-serif" fill="var(--ok-text)">• Navigate Git's three states</text>
  <rect x="40" y="461.801806319287" width="134.898225" height="158.198193680713" rx="15.160949903064" fill="url(#grad-warn)"/>
  <text x="107.448912" y="558.432665796963" text-anchor="middle" font-size="58.433548347116" font-family="Arial, sans-serif" fill="var(--warn-text)">✓</text>
  <rect x="572.551888" y="461.801806319287" width="134.898225" height="158.198193680713" rx="15.160949903064" fill="url(#grad-warn)"/>
  <text x="640.001" y="558.432665796963" text-anchor="middle" font-size="58.433548347116" font-family="Arial, sans-serif" fill="var(--warn-text)">✓</text>
  <rect x="1105.101775" y="461.801806319287" width="134.898225" height="158.198193680713" rx="15.160949903064" fill="url(#grad-warn)"/>
  <text x="1172.553088" y="558.432665796963" text-anchor="middle" font-size="58.433548347116" font-family="Arial, sans-serif" fill="var(--warn-text)">✓</text>
</svg>

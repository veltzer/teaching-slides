<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="377.1428" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="228.5715" y="112.5" text-anchor="middle" font-size="31.97951806677" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">--soft</text>
  <text x="228.5715" y="174.642857142857" text-anchor="middle" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--ok-text)">Moves HEAD</text>
  <rect x="91.4287" y="226.428571428571" width="274.2857" height="82.857142857143" fill="url(#grad-ok)" rx="6.414269805898" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5715" y="278.214285714286" text-anchor="middle" font-size="21.319749980844" fill="var(--bg)" font-family="Arial, sans-serif">✓ Keep changes staged</text>
  <rect x="91.4287" y="330" width="274.2857" height="82.857142857143" fill="url(#grad-ok)" rx="6.414269805898" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5715" y="381.785714285714" text-anchor="middle" font-size="21.319749980844" fill="var(--bg)" font-family="Arial, sans-serif">✓ Keep working dir</text>
  <text x="228.5715" y="475" text-anchor="middle" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--ok-text)">Use: Redo commit message</text>
  <rect x="451.4286" y="40" width="377.1428" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="640.0001" y="112.5" text-anchor="middle" font-size="31.97951806677" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">--mixed (default)</text>
  <text x="640.0001" y="174.642857142857" text-anchor="middle" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--warn-text)">Moves HEAD + Index</text>
  <rect x="502.8572" y="226.428571428571" width="274.2857" height="82.857142857143" fill="var(--warn-accent)" rx="6.414269805898"/>
  <text x="640.0001" y="278.214285714286" text-anchor="middle" font-size="21.319749980844" fill="var(--bg)" font-family="Arial, sans-serif">✗ Unstage changes</text>
  <rect x="502.8572" y="330" width="274.2857" height="82.857142857143" fill="url(#grad-ok)" rx="6.414269805898" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="381.785714285714" text-anchor="middle" font-size="21.319749980844" fill="var(--bg)" font-family="Arial, sans-serif">✓ Keep working dir</text>
  <text x="640.0001" y="475" text-anchor="middle" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--warn-text)">Use: Unstage everything</text>
  <rect x="862.8572" y="40" width="377.1428" height="580" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="1051.4285" y="112.5" text-anchor="middle" font-size="31.97951806677" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">--hard</text>
  <text x="1051.4285" y="174.642857142857" text-anchor="middle" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--danger-text)">Moves everything</text>
  <rect x="914.2857" y="226.428571428571" width="274.2857" height="82.857142857143" fill="url(#grad-danger)" rx="6.414269805898" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4285" y="278.214285714286" text-anchor="middle" font-size="21.319749980844" fill="var(--bg)" font-family="Arial, sans-serif">✗ Discard staged</text>
  <rect x="914.2857" y="330" width="274.2857" height="82.857142857143" fill="url(#grad-danger)" rx="6.414269805898" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4285" y="381.785714285714" text-anchor="middle" font-size="21.319749980844" fill="var(--bg)" font-family="Arial, sans-serif">✗ Discard working dir</text>
  <text x="1051.4285" y="475" text-anchor="middle" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--danger-text)">⚠️ DESTRUCTIVE!</text>
</svg>

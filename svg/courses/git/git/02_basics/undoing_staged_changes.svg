<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="500" height="151.304347826087" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.737306906163" filter="url(#shadow)"/>
  <text x="290" y="128.260869565217" text-anchor="middle" font-size="33.877312604706" font-family="Arial, sans-serif" fill="var(--danger-text)">git restore --staged file</text>
  <text x="290" y="266.95652173913" text-anchor="middle" font-size="29.642690637286" font-family="Arial, sans-serif" fill="var(--text)">Removes from staging area</text>
  <text x="290" y="317.391304347826" text-anchor="middle" font-size="29.642690637286" font-family="Arial, sans-serif" fill="var(--text)">Keeps changes in working dir</text>
  <rect x="740" y="40" width="500" height="151.304347826087" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.737306906163" filter="url(#shadow)"/>
  <text x="990" y="128.260869565217" text-anchor="middle" font-size="33.877312604706" font-family="Arial, sans-serif" fill="var(--warn-text)">git reset HEAD file</text>
  <text x="990" y="266.95652173913" text-anchor="middle" font-size="29.642690637286" font-family="Arial, sans-serif" fill="var(--text)">Alternative method</text>
  <text x="990" y="317.391304347826" text-anchor="middle" font-size="29.642690637286" font-family="Arial, sans-serif" fill="var(--text)">Same effect</text>
  <rect x="390" y="418.260869565217" width="500" height="151.304347826087" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.737306906163" filter="url(#shadow)"/>
  <text x="640" y="506.521739130435" text-anchor="middle" font-size="33.877312604706" font-family="Arial, sans-serif" fill="var(--ok-text)">git reset</text>
  <text x="640" y="620" text-anchor="middle" font-size="29.642690637286" font-family="Arial, sans-serif" fill="var(--text)">Unstages ALL files</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="82.857087755101" fill="url(#grad-ok)" rx="7.042147254649" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="91.785615561222" text-anchor="middle" font-size="33.709467847677" fill="var(--bg)" font-family="Arial, sans-serif">Subject line (50 chars or less)</text>
  <line x1="40" y1="164.285631632651" x2="1240" y2="164.285631632651" stroke="var(--text-faint)" stroke-width="1.6" stroke-dasharray="8 8"/>
  <text x="640" y="153.928559948979" text-anchor="middle" font-size="25.282130228039" fill="var(--text-muted)" font-family="Arial, sans-serif">Blank line</text>
  <rect x="40" y="205.714304081633" width="1200" height="248.571391836734" fill="url(#grad-primary)" rx="7.042147254649" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.428571428571" y="257.499919642855" font-size="29.495799037858" font-family="Arial, sans-serif" fill="var(--primary-text)">Detailed explanation of what and why (72 char wrap)</text>
  <text x="61.428571428571" y="309.285663775509" font-size="29.495799037858" font-family="Arial, sans-serif" fill="var(--primary-text)">- Explain the problem this commit solves</text>
  <text x="61.428571428571" y="361.071407908162" font-size="29.495799037858" font-family="Arial, sans-serif" fill="var(--primary-text)">- Justify the approach taken</text>
  <text x="61.428571428571" y="412.857152040816" font-size="29.495799037858" font-family="Arial, sans-serif" fill="var(--primary-text)">- Reference issues: Fixes #1a1a2e</text>
  <rect x="40" y="495.714239795917" width="428.571428571429" height="124.285760204083" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.042147254649" filter="url(#shadow)"/>
  <text x="254.285714285714" y="547.49998392857" text-anchor="middle" font-size="29.495799037858" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">DO</text>
  <text x="254.285714285714" y="588.928527806121" text-anchor="middle" font-size="25.282130228039" font-family="Arial, sans-serif" fill="var(--ok-text)">Imperative mood</text>
  <rect x="511.428571428571" y="495.714239795917" width="428.571428571429" height="124.285760204083" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.042147254649" filter="url(#shadow)"/>
  <text x="725.714285714286" y="547.49998392857" text-anchor="middle" font-size="29.495799037858" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">DO</text>
  <text x="725.714285714286" y="588.928527806121" text-anchor="middle" font-size="25.282130228039" font-family="Arial, sans-serif" fill="var(--ok-text)">Explain why</text>
  <rect x="982.857142857143" y="495.714239795917" width="257.142857142857" height="124.285760204083" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.042147254649" filter="url(#shadow)"/>
  <text x="1111.428571428571" y="547.49998392857" text-anchor="middle" font-size="29.495799037858" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">DON'T</text>
  <text x="1111.428571428571" y="588.928527806121" text-anchor="middle" font-size="25.282130228039" font-family="Arial, sans-serif" fill="var(--danger-text)">Just say what</text>
</svg>

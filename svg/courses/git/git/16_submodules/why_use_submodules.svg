  <rect x="760" y="184.999942499997" width="480" height="348.000023000001" fill="url(#grad-warn)" rx="6.434283343262" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.9999" y="257.499971249999" text-anchor="middle" fill="var(--bg)" font-size="34.822234215678" font-weight="bold" font-family="Arial, sans-serif">External Repository</text>

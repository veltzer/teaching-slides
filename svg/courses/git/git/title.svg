<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <line x1="190" y1="330" x2="1090" y2="330" stroke="var(--danger-border)" stroke-width="2"/>
  <circle cx="265" cy="330" r="16.6854" fill="var(--danger-fill)"/>
  <circle cx="490" cy="330" r="16.6854" fill="var(--danger-fill)"/>
  <circle cx="790" cy="330" r="16.6854" fill="var(--danger-fill)"/>
  <circle cx="1014.9999" cy="330" r="16.6854" fill="var(--danger-fill)"/>
  <line x1="490" y1="330" x2="565" y2="214" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="565" y1="214" x2="715" y2="214" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="715" y1="214" x2="790" y2="330" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="565" cy="214" r="13.9044" fill="var(--primary-fill)"/>
  <circle cx="715" cy="214" r="13.9044" fill="var(--primary-fill)"/>
  <line x1="265" y1="330" x2="339.9999" y2="460.5" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="339.9999" y1="460.5" x2="460" y2="460.5" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="460" y1="460.5" x2="490" y2="330" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="339.9999" cy="460.5" r="13.9044" fill="var(--ok-fill)"/>
  <circle cx="460" cy="460.5" r="13.9044" fill="var(--ok-fill)"/>
  <text x="160" y="293.75" font-size="19.4662" fill="var(--danger-accent)" font-family="Courier New, monospace">main</text>
  <text x="595" y="192.25" font-size="19.4662" fill="var(--primary-accent)" font-family="Courier New, monospace">feature</text>
  <text x="355" y="504" font-size="19.4662" fill="var(--ok-accent)" font-family="Courier New, monospace">hotfix</text>
  <rect x="910" y="127" width="225" height="72.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <text x="970" y="174.85" font-size="41.7133" fill="var(--danger-accent)" font-weight="bold" font-family="Courier New, monospace">git</text>
  <polygon points="1082.4999,330 1105,319.85 1105,340.15" fill="var(--danger-fill)"/>
</svg>

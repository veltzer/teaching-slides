<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Main branch line -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#e94560" stroke-width="4"/>
  <!-- Commits on main -->
  <circle cx="150" cy="200" r="12" fill="#e94560"/>
  <circle cx="300" cy="200" r="12" fill="#e94560"/>
  <circle cx="500" cy="200" r="12" fill="#e94560"/>
  <circle cx="650" cy="200" r="12" fill="#e94560"/>
  <!-- Feature branch -->
  <line x1="300" y1="200" x2="350" y2="120" stroke="#53d8fb" stroke-width="3"/>
  <line x1="350" y1="120" x2="450" y2="120" stroke="#53d8fb" stroke-width="3"/>
  <line x1="450" y1="120" x2="500" y2="200" stroke="#53d8fb" stroke-width="3"/>
  <circle cx="350" cy="120" r="10" fill="#53d8fb"/>
  <circle cx="450" cy="120" r="10" fill="#53d8fb"/>
  <!-- Hotfix branch -->
  <line x1="150" y1="200" x2="200" y2="290" stroke="#00b894" stroke-width="3"/>
  <line x1="200" y1="290" x2="280" y2="290" stroke="#00b894" stroke-width="3"/>
  <line x1="280" y1="290" x2="300" y2="200" stroke="#00b894" stroke-width="3"/>
  <circle cx="200" cy="290" r="10" fill="#00b894"/>
  <circle cx="280" cy="290" r="10" fill="#00b894"/>
  <!-- Branch labels -->
  <text x="80" y="175" font-family="monospace" font-size="14" fill="#e94560">main</text>
  <text x="370" y="105" font-family="monospace" font-size="14" fill="#53d8fb">feature</text>
  <text x="210" y="320" font-family="monospace" font-size="14" fill="#00b894">hotfix</text>
  <!-- Git logo representation -->
  <rect x="580" y="60" width="150" height="50" rx="8" fill="none" stroke="#e94560" stroke-width="2"/>
  <text x="620" y="93" font-family="monospace" font-size="30" fill="#e94560" font-weight="bold">git</text>
  <!-- Arrow heads -->
  <polygon points="695,200 710,193 710,207" fill="#e94560"/>
</svg>

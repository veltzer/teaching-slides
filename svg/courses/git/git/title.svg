<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <line x1="190" y1="330" x2="1090" y2="330" stroke="var(--danger-border)" stroke-width="2" />
  <circle cx="265" cy="330" r="16.6854" fill="var(--danger-fill)" />
  <circle cx="490" cy="330" r="16.6854" fill="var(--danger-fill)" />
  <circle cx="790" cy="330" r="16.6854" fill="var(--danger-fill)" />
  <circle cx="1014.9999" cy="330" r="16.6854" fill="var(--danger-fill)" />
  <line x1="490" y1="330" x2="565" y2="214" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="565" y1="214" x2="715" y2="214" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="715" y1="214" x2="790" y2="330" stroke="var(--primary-border)" stroke-width="2" />
  <circle cx="565" cy="214" r="13.9044" fill="var(--primary-fill)" />
  <circle cx="715" cy="214" r="13.9044" fill="var(--primary-fill)" />
  <line x1="265" y1="330" x2="339.9999" y2="460.5" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="339.9999" y1="460.5" x2="460" y2="460.5" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="460" y1="460.5" x2="490" y2="330" stroke="var(--ok-border)" stroke-width="2" />
  <circle cx="339.9999" cy="460.5" r="13.9044" fill="var(--ok-fill)" />
  <circle cx="460" cy="460.5" r="13.9044" fill="var(--ok-fill)" />
  <text x="160" y="293.75" font-size="19.4662" fill="var(--danger-accent)" font-family="Courier New, monospace">main</text>
  <text x="595" y="192.25" font-size="19.4662" fill="var(--primary-accent)" font-family="Courier New, monospace">feature</text>
  <text x="355" y="504" font-size="19.4662" fill="var(--ok-accent)" font-family="Courier New, monospace">hotfix</text>
  <rect x="910" y="127" width="225" height="72.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="970" y="174.85" font-size="41.7133" fill="var(--danger-accent)" font-weight="bold" font-family="Courier New, monospace">git</text>
  <polygon points="1082.4999,330 1105,319.85 1105,340.15" fill="var(--danger-fill)" />
</svg>
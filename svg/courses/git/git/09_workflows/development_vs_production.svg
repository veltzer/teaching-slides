<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="163.0303" font-size="23.4506" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">develop</text>
  <line x1="192.7273" y1="152.4848" x2="1240" y2="152.4848" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="269.341" y="141.825" width="21.3188" height="21.3188" rx="10.6594" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.1001" filter="url(#shadow)"/>
  <rect x="443.886" y="141.825" width="21.3188" height="21.3188" rx="10.6594" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.1001" filter="url(#shadow)"/>
  <rect x="662.068" y="141.825" width="21.3188" height="21.3188" rx="10.6594" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.1001" filter="url(#shadow)"/>
  <rect x="880.25" y="141.825" width="21.3188" height="21.3188" rx="10.6594" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.1001" filter="url(#shadow)"/>
  <rect x="1098.43" y="141.825" width="21.3188" height="21.3188" rx="10.6594" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.1001" filter="url(#shadow)"/>
  <text x="40" y="514.5454" font-size="23.4506" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">main</text>
  <line x1="192.7273" y1="504" x2="1240" y2="504" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="269.341" y="493.341" width="21.3188" height="21.3188" rx="10.6594" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="4.1001" filter="url(#shadow)"/>
  <rect x="659.936" y="491.209" width="25.5824" height="25.5824" rx="12.7912" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="4.1001" filter="url(#shadow)"/>
  <rect x="1096.3" y="491.209" width="25.5824" height="25.5824" rx="12.7912" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="4.1001" filter="url(#shadow)"/>
  <line x1="323.6363" y1="57.5758" x2="454.5454" y2="134.9091" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="323.6363" y="40" font-size="21.3186" fill="var(--ok-accent)" font-family="Arial, sans-serif">feat-A</text>
  <line x1="759.9999" y1="57.5758" x2="890.909" y2="134.9091" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="759.9999" y="40" font-size="21.3186" fill="var(--ok-accent)" font-family="Arial, sans-serif">feat-B</text>
  <line x1="672.7272" y1="170.0606" x2="672.7272" y2="479.3939" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1109.0909" y1="170.0606" x2="1109.0909" y2="479.3939" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="607.2727" y="549.697" width="130.9091" height="70.303" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="672.7272" y="598.909" text-anchor="middle" font-size="21.3186" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">v1.0</text>
  <rect x="1043.6364" y="549.697" width="130.9091" height="70.303" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1109.0909" y="598.909" text-anchor="middle" font-size="21.3186" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">v2.0</text>
  <text x="672.7272" y="338.7878" text-anchor="middle" font-size="21.3186" fill="var(--warn-accent)" font-family="Arial, sans-serif">release</text>
  <text x="1109.0909" y="338.7878" text-anchor="middle" font-size="21.3186" fill="var(--warn-accent)" font-family="Arial, sans-serif">release</text>
</svg>

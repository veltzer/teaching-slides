<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="302.608767107761" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.500836553951"/>
  <text x="640.0001" y="166.08696672968" text-anchor="middle" font-size="50.815955869473" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Never Rewrite Public History</text>
  <text x="640.0001" y="266.956399243838" text-anchor="middle" font-size="38.111912728467" font-family="Arial, sans-serif" fill="var(--danger-text)">If it's been pushed and others might have it,</text>
  <text x="640.0001" y="317.391232892239" text-anchor="middle" font-size="38.111912728467" font-family="Arial, sans-serif" fill="var(--danger-text)">don't change it!</text>
  <rect x="140.0001" y="418.26090018904" width="400" height="201.739099810959" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.500836553951"/>
  <text x="340" y="493.91303327032" text-anchor="middle" font-size="29.642731213256" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Safe to Rewrite</text>
  <text x="340" y="556.95651663516" text-anchor="middle" font-size="25.407977934737" font-family="Arial, sans-serif" fill="var(--ok-text)">Local commits</text>
  <text x="340" y="594.7825831758" text-anchor="middle" font-size="25.407977934737" font-family="Arial, sans-serif" fill="var(--ok-text)">Feature branches (solo)</text>
  <rect x="740" y="418.26090018904" width="400" height="201.739099810959" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.500836553951"/>
  <text x="940" y="493.91303327032" text-anchor="middle" font-size="29.642731213256" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Never Rewrite</text>
  <text x="940" y="556.95651663516" text-anchor="middle" font-size="25.407977934737" font-family="Arial, sans-serif" fill="var(--danger-text)">main/master branch</text>
  <text x="940" y="594.7825831758" text-anchor="middle" font-size="25.407977934737" font-family="Arial, sans-serif" fill="var(--danger-text)">Shared branches</text>
</svg>

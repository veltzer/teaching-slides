<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="172.828418258086" width="81.7698" height="97.377179240266" rx="15.277776870419" fill="url(#grad-ok)"/>
  <text x="80.8849" y="234.799373356138" text-anchor="middle" font-size="22.308282405253" fill="var(--bg)" font-family="Arial, sans-serif">A</text>
  <rect x="208.599" y="40" width="81.7698" height="97.377179240266" rx="15.277776870419" fill="url(#grad-primary)"/>
  <text x="249.4836" y="101.971669619887" text-anchor="middle" font-size="22.308282405253" fill="var(--bg)" font-family="Arial, sans-serif">B</text>
  <rect x="208.599" y="305.655645646447" width="81.7698" height="97.377179240266" rx="15.277776870419" fill="url(#grad-warn)"/>
  <text x="249.4836" y="367.627196179361" text-anchor="middle" font-size="22.308282405253" fill="var(--bg)" font-family="Arial, sans-serif">C</text>
  <rect x="366.976" y="160.656538798741" width="102.212" height="121.721176332901" rx="15.277776870419" fill="url(#grad-info)"/>
  <text x="418.082" y="234.799373356138" text-anchor="middle" font-size="26.769829759325" fill="var(--bg)" font-family="Arial, sans-serif">M</text>
  <text x="418.082" y="301.213344311236" text-anchor="middle" font-size="22.308282405253" font-family="Arial, sans-serif" fill="var(--text)">Merge</text>
  <line x1="123.0348" y1="221.516769704274" x2="365.3951" y2="221.516769704274" stroke="var(--text)" stroke-width="2"/>
  <line x1="291.6332" y1="88.688827794078" x2="375.9325" y2="181.668363313821" stroke="var(--text)" stroke-width="2"/>
  <line x1="291.6332" y1="354.344473440525" x2="375.9325" y2="261.364937920782" stroke="var(--text)" stroke-width="2"/>
  <text x="249.4836" y="48.84065957757" text-anchor="middle" font-size="22.308282405253" font-family="Arial, sans-serif" fill="var(--primary-text)">Parent 1</text>
  <text x="249.4836" y="447.323889873296" text-anchor="middle" font-size="22.308282405253" font-family="Arial, sans-serif" fill="var(--text)">Parent 2</text>
  <rect x="607.7555" y="88.688827794078" width="632.2445" height="398.483230295726" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.551110722036"/>
  <text x="923.8776" y="168.385521488012" text-anchor="middle" font-size="31.231486240376" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Reverting Merge Commit</text>
  <text x="649.9051" y="248.082215181946" font-size="26.769829759325" font-family="Courier New, monospace" fill="var(--warn-text)">git revert -m 1 M</text>
  <text x="649.9051" y="301.213344311236" font-size="24.538946955311" font-family="Arial, sans-serif" fill="var(--warn-text)">Keeps changes from Parent 1</text>
  <text x="649.9051" y="354.344473440525" font-size="26.769829759325" font-family="Courier New, monospace" fill="var(--warn-text)">git revert -m 2 M</text>
  <text x="649.9051" y="407.475483482842" font-size="24.538946955311" font-family="Arial, sans-serif" fill="var(--warn-text)">Keeps changes from Parent 2</text>
  <text x="923.8776" y="620" text-anchor="middle" font-size="29.00071256334" font-style="italic" font-family="Arial, sans-serif" fill="var(--text)">Must specify which parent to keep!</text>
</svg>

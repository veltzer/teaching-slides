<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="256.4822" y="40" text-anchor="middle" font-size="28.659277306788" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Hotfix from Development</text>
  <rect x="40" y="100.946603821104" width="75.3218" height="89.016678308256" rx="15.219605059233" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="77.6609" y="158.636234710736" text-anchor="middle" font-size="20.470803650527" fill="var(--bg)" font-family="Arial, sans-serif">v1.0</text>
  <rect x="183.057" y="100.946603821104" width="75.3218" height="89.016678308256" rx="15.219605059233" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="220.718" y="158.636234710736" text-anchor="middle" font-size="20.470803650527" fill="var(--bg)" font-family="Arial, sans-serif">prod</text>
  <text x="149.1894" y="105.909058677684" font-size="20.470803650527" font-family="Arial, sans-serif" fill="var(--text)">main</text>
  <rect x="40" y="259.128250102085" width="75.3218" height="89.016678308256" rx="15.219605059233" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="77.6609" y="316.818235537193" text-anchor="middle" font-size="20.470803650527" fill="var(--bg)" font-family="Arial, sans-serif">feat</text>
  <rect x="183.057" y="259.128250102085" width="75.3218" height="89.016678308256" rx="15.219605059233" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="220.718" y="316.818235537193" text-anchor="middle" font-size="20.470803650527" fill="var(--bg)" font-family="Arial, sans-serif">fix</text>
  <rect x="326.114" y="259.128250102085" width="75.3218" height="89.016678308256" rx="15.219605059233" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="363.775" y="316.818235537193" text-anchor="middle" font-size="20.470803650527" fill="var(--bg)" font-family="Arial, sans-serif">feat2</text>
  <text x="220.718" y="264.09082314049" font-size="20.470803650527" font-family="Arial, sans-serif" fill="var(--danger-text)">develop</text>
  <path d="M 220.718 250.909058677684 Q 310.1286 171.818117355368 220.718 198.181764462807" stroke="var(--danger-border)" stroke-width="3.2" marker-end="url(#arrow)" fill="none"/>
  <text x="310.1286" y="171.818117355368" font-size="22.517949242458" fill="var(--danger-accent)" font-family="Arial, sans-serif">cherry-pick</text>
  <line x1="113.4251" y1="145.454470247929" x2="184.9537" y2="145.454470247929" stroke="var(--text)" stroke-width="2"/>
  <line x1="113.4251" y1="303.636352892561" x2="184.9537" y2="303.636352892561" stroke="var(--text)" stroke-width="2"/>
  <line x1="256.4822" y1="303.636352892561" x2="328.0109" y2="303.636352892561" stroke="var(--text)" stroke-width="2"/>
  <line x1="77.6609" y1="198.181764462807" x2="77.6609" y2="250.909058677684" stroke="var(--text)" stroke-width="2"/>
  <rect x="703.5358" y="92.727176033052" width="536.4642" height="527.272823966948" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.517469732222"/>
  <text x="971.7679" y="171.818117355368" text-anchor="middle" font-size="28.659277306788" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Common Scenarios:</text>
  <text x="739.3001" y="250.909058677684" font-size="24.564986122925" font-family="Arial, sans-serif" fill="var(--text)">• Hotfix to production branch</text>
  <text x="739.3001" y="316.818235537193" font-size="24.564986122925" font-family="Arial, sans-serif" fill="var(--text)">• Feature from abandoned branch</text>
  <text x="739.3001" y="382.727294214877" font-size="24.564986122925" font-family="Arial, sans-serif" fill="var(--text)">• Bug fix to multiple releases</text>
  <text x="739.3001" y="448.636352892561" font-size="24.564986122925" font-family="Arial, sans-serif" fill="var(--text)">• Selective feature merging</text>
  <text x="739.3001" y="514.545411570245" font-size="24.564986122925" font-family="Arial, sans-serif" fill="var(--text)">• Backporting to older versions</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

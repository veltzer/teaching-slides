<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1142.8571" height="214.814840329218" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.429100445747" filter="url(#shadow)"/>
  <text x="611.4286" y="104.44440617284" text-anchor="middle" font-size="30.513796535605" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Git's Safety Features</text>
  <text x="78.0952" y="168.888927160493" font-size="24.792432897261" font-family="Arial, sans-serif" fill="var(--ok-text)">• Reflog tracks ALL HEAD movements (90 days default)</text>
  <text x="78.0952" y="211.851826337449" font-size="24.792432897261" font-family="Arial, sans-serif" fill="var(--ok-text)">• Dangling commits exist until garbage collection</text>
  <rect x="99.6416" y="299.871043169776" width="71.193" height="81.740109545209" rx="15.00123437341" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="135.2381" y="351.481449588478" text-anchor="middle" font-size="19.071069258916" fill="var(--bg)" font-family="Arial, sans-serif">A</text>
  <rect x="232.975" y="299.871043169776" width="71.193" height="81.740109545209" rx="15.00123437341" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="268.5714" y="351.481449588478" text-anchor="middle" font-size="19.071069258916" fill="var(--bg)" font-family="Arial, sans-serif">B</text>
  <rect x="366.308" y="299.871043169776" width="71.193" height="81.740109545209" rx="15.00123437341" fill="url(#grad-warn)" stroke-dasharray="4.8 4.8" stroke="var(--text-faint)" stroke-width="3.2" filter="url(#shadow)"/>
  <text x="401.9048" y="351.481449588478" text-anchor="middle" font-size="19.071069258916" fill="var(--bg)" font-family="Arial, sans-serif">C</text>
  <rect x="499.642" y="299.871043169776" width="71.193" height="81.740109545209" rx="15.00123437341" fill="url(#grad-warn)" stroke-dasharray="4.8 4.8" stroke="var(--text-faint)" stroke-width="3.2" filter="url(#shadow)"/>
  <text x="535.2381" y="351.481449588478" text-anchor="middle" font-size="19.071069258916" fill="var(--bg)" font-family="Arial, sans-serif">D</text>
  <text x="468.5714" y="415.925970576131" text-anchor="middle" font-size="20.978261906147" fill="var(--text-faint)" font-family="Arial, sans-serif">"Lost" after reset</text>
  <line x1="173.3333" y1="340.740753497942" x2="230.4762" y2="340.740753497942" stroke="var(--text)" stroke-width="2"/>
  <line x1="306.6667" y1="340.740753497942" x2="363.8095" y2="340.740753497942" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4.8 4.8"/>
  <line x1="440" y1="340.740753497942" x2="497.1429" y2="340.740753497942" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4.8 4.8"/>
  <rect x="706.6667" y="297.777739506174" width="533.3333" height="322.222260493826" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.429100445747" filter="url(#shadow)"/>
  <text x="973.3333" y="362.222260493826" text-anchor="middle" font-size="26.699518392818" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Recovery Methods:</text>
  <text x="744.7619" y="415.925970576131" font-size="22.885347401704" font-family="Courier New, monospace" fill="var(--warn-text)">git reflog</text>
  <text x="744.7619" y="458.888869753087" font-size="22.885347401704" font-family="Courier New, monospace" fill="var(--warn-text)">git fsck --lost-found</text>
  <text x="744.7619" y="501.851883744855" font-size="22.885347401704" font-family="Courier New, monospace" fill="var(--warn-text)">git log --all --oneline</text>
  <text x="744.7619" y="544.814782921811" font-size="22.885347401704" font-family="Courier New, monospace" fill="var(--warn-text)">  $( git fsck --no-reflog |</text>
  <text x="744.7619" y="587.77779691358" font-size="22.885347401704" font-family="Courier New, monospace" fill="var(--warn-text)">     awk '/dangling/ {print $3}' )</text>
</svg>

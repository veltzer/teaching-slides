  <text x="537.1429" y="371.428571428571" text-anchor="middle" font-size="17.76645831737" fill="var(--bg)" font-family="Arial, sans-serif">Work</text>
  <text x="605.7143" y="361.071428571429" font-size="24.873041644318" font-family="Arial, sans-serif" fill="var(--warn-text)">✗ Unchanged</text>
  <text x="640.0001" y="454.285714285714" text-anchor="middle" font-size="21.319749980844" font-style="italic" font-family="Arial, sans-serif" fill="var(--warn-text)">Changes unstaged</text>

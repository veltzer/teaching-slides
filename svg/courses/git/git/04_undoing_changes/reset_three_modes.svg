  <text x="228.5715" y="454.285714285714" text-anchor="middle" font-size="21.319749980844" font-style="italic" font-family="Arial, sans-serif" fill="var(--ok-text)">Changes stay staged</text>
  <text x="228.5715" y="495.714285714286" text-anchor="middle" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--ok-text)">Use: Squash commits</text>
  <rect x="451.4286" y="40" width="377.1428" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.414269805898" filter="url(#shadow)"/>
  <text x="640.0001" y="112.5" text-anchor="middle" font-size="31.97951806677" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">--mixed (default)</text>

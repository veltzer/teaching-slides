  <text x="1017.1429" y="361.071428571429" font-size="24.873041644318" font-family="Arial, sans-serif" fill="var(--danger-text)">✓ Updates</text>
  <text x="1051.4285" y="454.285714285714" text-anchor="middle" font-size="21.319749980844" font-style="italic" font-family="Arial, sans-serif" fill="var(--danger-text)">⚠️ Loses changes!</text>
  <text x="1051.4285" y="495.714285714286" text-anchor="middle" font-size="21.319749980844" font-family="Arial, sans-serif" fill="var(--danger-text)">Use: Discard work</text>

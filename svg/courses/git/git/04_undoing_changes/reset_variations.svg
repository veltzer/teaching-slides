<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="56.8889" y="48" width="132.4444" height="112" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="123.5556" y="112" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">C1</text>
  <line x1="189.3333" y1="102.2222" x2="246.2222" y2="102.2222" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="256" y="48" width="132.4444" height="112" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="322.6667" y="112" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">C2</text>
  <line x1="388.4444" y1="102.2222" x2="445.3333" y2="102.2222" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="455.1111" y="48" width="132.4444" height="112" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="521.7778" y="112" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">C3</text>
  <text x="521.7778" y="24.8889" text-anchor="middle" font-size="16" fill="var(--danger-accent)" font-weight="bold">HEAD</text>
  <text x="758.2222" y="64" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text)">git reset C1</text>
  <rect x="645.3333" y="96" width="473.7778" height="128" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="692.4444" y="156.4444" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">--soft</text>
  <text x="817.7778" y="156.4444" font-size="16" fill="var(--text-muted)">Staged: C2+C3</text>
  <text x="817.7778" y="200.8889" font-size="16" fill="var(--text-muted)">Working dir: C2+C3</text>
  <rect x="645.3333" y="250.6667" width="473.7778" height="128" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="692.4444" y="314.6667" font-size="17.7778" font-weight="bold" fill="var(--warn-accent)">--mixed</text>
  <text x="826.6667" y="314.6667" font-size="16" fill="var(--text-muted)">Staged: empty</text>
  <text x="826.6667" y="359.1111" font-size="16" fill="var(--text-muted)">Working dir: C2+C3</text>
  <rect x="645.3333" y="405.3333" width="473.7778" height="128" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="692.4444" y="469.3333" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">--hard</text>
  <text x="817.7778" y="469.3333" font-size="16" fill="var(--text-muted)">Staged: empty</text>
  <text x="817.7778" y="513.7778" font-size="16" fill="var(--text-muted)">Working dir: empty</text>
  <line x1="521.7778" y1="160" x2="641.7778" y2="174.2222" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.1111 5.3333" marker-end="url(#arrow)" />
  <line x1="521.7778" y1="160" x2="641.7778" y2="328.8889" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.1111 5.3333" marker-end="url(#arrow)" />
  <line x1="521.7778" y1="160" x2="641.7778" y2="485.3333" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.1111 5.3333" marker-end="url(#arrow)" />
  <text x="123.5556" y="240" text-anchor="middle" font-size="16" fill="var(--text-faint)">keeps all</text>
  <text x="123.5556" y="368" text-anchor="middle" font-size="16" fill="var(--text-faint)">keeps working</text>
  <text x="123.5556" y="496" text-anchor="middle" font-size="16" fill="var(--text-faint)">discards all</text>
</svg>
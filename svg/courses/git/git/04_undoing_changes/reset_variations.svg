<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="66.363585" width="149.623431" height="127.762259" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.966916" filter="url(#shadow)" />
  <text x="115.313808" y="139.37059" text-anchor="middle" font-size="20.181529" font-weight="bold" fill="var(--primary-accent)">C1</text>
  <line x1="189.623431" y1="128.216756" x2="253.891213" y2="128.216756" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="264.937238" y="66.363585" width="149.623431" height="127.762259" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.966916" filter="url(#shadow)" />
  <text x="340.251046" y="139.37059" text-anchor="middle" font-size="20.181529" font-weight="bold" fill="var(--primary-accent)">C2</text>
  <line x1="414.560562" y1="128.216756" x2="478.828452" y2="128.216756" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="489.874477" y="66.363585" width="149.623431" height="127.762259" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.966916" filter="url(#shadow)" />
  <text x="565.188285" y="139.37059" text-anchor="middle" font-size="20.181529" font-weight="bold" fill="var(--primary-accent)">C3</text>
  <text x="565.188285" y="40" text-anchor="middle" font-size="18.16333" fill="var(--danger-accent)" font-weight="bold">HEAD</text>
  <text x="832.301255" y="84.615336" text-anchor="middle" font-size="20.181529" font-weight="bold" fill="var(--text)">git reset C1</text>
  <rect x="704.769874" y="121.118839" width="535.230126" height="146.014011" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.966916" filter="url(#shadow)" />
  <text x="757.991525" y="190.069802" font-size="20.181529" font-weight="bold" fill="var(--ok-accent)">--soft</text>
  <text x="899.58159" y="190.069802" font-size="18.16333" fill="var(--text-muted)">Staged: C2+C3</text>
  <text x="899.58159" y="240.769265" font-size="18.16333" fill="var(--text-muted)">Working dir: C2+C3</text>
  <rect x="704.769874" y="297.552477" width="535.230126" height="146.014011" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.966916" filter="url(#shadow)" />
  <text x="757.991525" y="370.559482" font-size="20.181529" font-weight="bold" fill="var(--warn-accent)">--mixed</text>
  <text x="909.623431" y="370.559482" font-size="18.16333" fill="var(--text-muted)">Staged: empty</text>
  <text x="909.623431" y="421.258694" font-size="18.16333" fill="var(--text-muted)">Working dir: C2+C3</text>
  <rect x="704.769874" y="473.985989" width="535.230126" height="146.014011" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.966916" filter="url(#shadow)" />
  <text x="757.991525" y="546.992995" font-size="20.181529" font-weight="bold" fill="var(--danger-accent)">--hard</text>
  <text x="899.58159" y="546.992995" font-size="18.16333" fill="var(--text-muted)">Staged: empty</text>
  <text x="899.58159" y="597.692332" font-size="18.16333" fill="var(--text-muted)">Working dir: empty</text>
  <line x1="565.188285" y1="194.125844" x2="700.753138" y2="210.349637" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.1111 5.3333" marker-end="url(#arrow)" />
  <line x1="565.188285" y1="194.125844" x2="700.753138" y2="386.783275" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.1111 5.3333" marker-end="url(#arrow)" />
  <line x1="565.188285" y1="194.125844" x2="700.753138" y2="565.244746" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.1111 5.3333" marker-end="url(#arrow)" />
  <text x="115.313808" y="285.384601" text-anchor="middle" font-size="18.16333" fill="var(--text-faint)">keeps all</text>
  <text x="115.313808" y="431.398612" text-anchor="middle" font-size="18.16333" fill="var(--text-faint)">keeps working</text>
  <text x="115.313808" y="577.412622" text-anchor="middle" font-size="18.16333" fill="var(--text-faint)">discards all</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="66.363585" width="149.623431" height="127.762259" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.966916" filter="url(#shadow)"/>
  <text x="115.313808" y="139.37059" text-anchor="middle" font-size="20.181529" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">C1</text>
  <line x1="189.623431" y1="128.216756" x2="253.891213" y2="128.216756" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="264.937238" y="66.363585" width="149.623431" height="127.762259" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.966916" filter="url(#shadow)"/>
  <text x="340.251046" y="139.37059" text-anchor="middle" font-size="20.181529" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">C2</text>
  <line x1="414.560562" y1="128.216756" x2="478.828452" y2="128.216756" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="489.874477" y="66.363585" width="149.623431" height="127.762259" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.966916" filter="url(#shadow)"/>
  <text x="565.188285" y="139.37059" text-anchor="middle" font-size="20.181529" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">C3</text>
  <text x="565.188285" y="40" text-anchor="middle" font-size="18.16333" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">HEAD</text>
  <text x="832.301255" y="84.615336" text-anchor="middle" font-size="20.181529" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">git reset C1</text>
  <rect x="704.769874" y="121.118839" width="535.230126" height="146.014011" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.966916" filter="url(#shadow)"/>
  <text x="757.991525" y="190.069802" font-size="20.181529" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">--soft</text>
  <text x="899.58159" y="190.069802" font-size="18.16333" fill="var(--text-muted)" font-family="Arial, sans-serif">Staged: C2+C3</text>
  <text x="899.58159" y="240.769265" font-size="18.16333" fill="var(--text-muted)" font-family="Arial, sans-serif">Working dir: C2+C3</text>
  <rect x="704.769874" y="297.552477" width="535.230126" height="146.014011" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.966916" filter="url(#shadow)"/>
  <text x="757.991525" y="370.559482" font-size="20.181529" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">--mixed</text>
  <text x="909.623431" y="370.559482" font-size="18.16333" fill="var(--text-muted)" font-family="Arial, sans-serif">Staged: empty</text>
  <text x="909.623431" y="421.258694" font-size="18.16333" fill="var(--text-muted)" font-family="Arial, sans-serif">Working dir: C2+C3</text>
  <rect x="704.769874" y="473.985989" width="535.230126" height="146.014011" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.966916" filter="url(#shadow)"/>
  <text x="757.991525" y="546.992995" font-size="20.181529" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">--hard</text>
  <text x="899.58159" y="546.992995" font-size="18.16333" fill="var(--text-muted)" font-family="Arial, sans-serif">Staged: empty</text>
  <text x="899.58159" y="597.692332" font-size="18.16333" fill="var(--text-muted)" font-family="Arial, sans-serif">Working dir: empty</text>
  <line x1="565.188285" y1="194.125844" x2="700.753138" y2="210.349637" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.1111 5.3333" marker-end="url(#arrow)"/>
  <line x1="565.188285" y1="194.125844" x2="700.753138" y2="386.783275" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.1111 5.3333" marker-end="url(#arrow)"/>
  <line x1="565.188285" y1="194.125844" x2="700.753138" y2="565.244746" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.1111 5.3333" marker-end="url(#arrow)"/>
  <text x="115.313808" y="285.384601" text-anchor="middle" font-size="18.16333" fill="var(--text-faint)" font-family="Arial, sans-serif">keeps all</text>
  <text x="115.313808" y="431.398612" text-anchor="middle" font-size="18.16333" fill="var(--text-faint)" font-family="Arial, sans-serif">keeps working</text>
  <text x="115.313808" y="577.412622" text-anchor="middle" font-size="18.16333" fill="var(--text-faint)" font-family="Arial, sans-serif">discards all</text>
</svg>

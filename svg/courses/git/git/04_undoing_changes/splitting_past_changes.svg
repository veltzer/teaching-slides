<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="319.375" y="91.5556" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--text)">Before</text>
  <rect x="149.6875" y="127" width="340.3125" height="159.5" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="319.375" y="191.4444" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--info-accent)">Commit "ABC"</text>
  <text x="319.375" y="247.8333" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">3 unrelated changes</text>
  <line x1="319.375" y1="294.5556" x2="319.375" y2="371.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="440.3125" y="349.3333" font-size="15.6425" font-style="italic" fill="var(--info-accent)">rebase -i → edit</text>
  <text x="640" y="434.7223" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--text)">After</text>
  <rect x="100" y="462.1111" width="199.6875" height="116" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="199.375" y="533" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--ok-accent)">A</text>
  <line x1="299.6875" y1="520.1111" x2="359.6875" y2="520.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="370" y="462.1111" width="199.6875" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="470.3125" y="533" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">B</text>
  <line x1="569.6875" y1="520.1111" x2="629.6875" y2="520.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="640" y="462.1111" width="199.6875" height="116" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="740.3125" y="533" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--warn-accent)">C</text>
  <text x="920.3125" y="156" font-size="15.6425" fill="var(--text-muted)">1. git rebase -i HEAD~N</text>
  <text x="920.3125" y="207.5556" font-size="15.6425" fill="var(--text-muted)">2. Mark commit as "edit"</text>
  <text x="920.3125" y="259.1111" font-size="15.6425" fill="var(--text-muted)">3. git reset HEAD~1</text>
  <text x="920.3125" y="310.6667" font-size="15.6425" fill="var(--text-muted)">4. git add + commit (A)</text>
  <text x="920.3125" y="362.2223" font-size="15.6425" fill="var(--text-muted)">5. git add + commit (B)</text>
  <text x="920.3125" y="413.7777" font-size="15.6425" fill="var(--text-muted)">6. git add + commit (C)</text>
  <text x="920.3125" y="465.3333" font-size="15.6425" fill="var(--text-muted)">7. git rebase --continue</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="360.914286" y="40" text-anchor="middle" font-size="25.246713" font-weight="bold" fill="var(--text)">Before</text>
  <rect x="112.685714" y="82.251607" width="497.828571" height="190.132472" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.923189" filter="url(#shadow)" />
  <text x="360.914286" y="159.072755" text-anchor="middle" font-size="25.246713" font-weight="bold" fill="var(--info-accent)">Commit "ABC"</text>
  <text x="360.914286" y="226.291319" text-anchor="middle" font-size="20.656414" fill="var(--text-muted)">3 unrelated changes</text>
  <line x1="360.914286" y1="281.986783" x2="360.914286" y2="374.172184" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="537.828571" y="347.284711" font-size="20.656414" font-style="italic" fill="var(--info-accent)">rebase -i → edit</text>
  <text x="829.942857" y="449.072934" text-anchor="middle" font-size="25.246713" font-weight="bold" fill="var(--text)">After</text>
  <rect x="40" y="481.721839" width="292.114286" height="138.278161" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.923189" filter="url(#shadow)" />
  <text x="185.371429" y="566.225173" text-anchor="middle" font-size="25.246713" font-weight="bold" fill="var(--ok-accent)">A</text>
  <line x1="332.114286" y1="550.860919" x2="419.885714" y2="550.860919" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="434.971429" y="481.721839" width="292.114286" height="138.278161" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.923189" filter="url(#shadow)" />
  <text x="581.714286" y="566.225173" text-anchor="middle" font-size="25.246713" font-weight="bold" fill="var(--primary-accent)">B</text>
  <line x1="727.085714" y1="550.860919" x2="814.857143" y2="550.860919" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="829.942857" y="481.721839" width="292.114286" height="138.278161" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.923189" filter="url(#shadow)" />
  <text x="976.685714" y="566.225173" text-anchor="middle" font-size="25.246713" font-weight="bold" fill="var(--warn-accent)">C</text>
  <text x="1240" y="116.821148" font-size="20.656414" fill="var(--text-muted)">1. git rebase -i HEAD~N</text>
  <text x="1240" y="178.278161" font-size="20.656414" fill="var(--text-muted)">2. Mark commit as "edit"</text>
  <text x="1240" y="239.735056" font-size="20.656414" fill="var(--text-muted)">3. git reset HEAD~1</text>
  <text x="1240" y="301.19207" font-size="20.656414" fill="var(--text-muted)">4. git add + commit (A)</text>
  <text x="1240" y="362.649083" font-size="20.656414" fill="var(--text-muted)">5. git add + commit (B)</text>
  <text x="1240" y="424.105858" font-size="20.656414" fill="var(--text-muted)">6. git add + commit (C)</text>
  <text x="1240" y="485.562872" font-size="20.656414" fill="var(--text-muted)">7. git rebase --continue</text>
</svg>
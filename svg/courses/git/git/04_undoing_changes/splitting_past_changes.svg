  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="264.8889" y="56.8889" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#333">Before</ns0:text>
  <ns0:rect x="104" y="96" width="322.6667" height="176" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3.5556" rx="14.2222" filter="url(#shadow)" />
  <ns0:text x="264.8889" y="167.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#7b1fa2">Commit "ABC"</ns0:text>
  <ns0:text x="264.8889" y="229.3333" text-anchor="middle" font-size="16" fill="#555">3 unrelated changes</ns0:text>
  <ns0:line x1="264.8889" y1="280.8889" x2="264.8889" y2="366.2222" stroke="#555" stroke-width="3.5556" marker-end="url(#arrow)" />
  <ns0:text x="379.5556" y="341.3333" font-size="16" font-style="italic" fill="#7b1fa2">rebase -i → edit</ns0:text>
  <ns0:text x="568.8889" y="435.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#333">After</ns0:text>
  <ns0:rect x="56.8889" y="465.7778" width="189.3333" height="128" fill="#e8f5e9" stroke="#4caf50" stroke-width="3.5556" rx="10.6667" filter="url(#shadow)" />
  <ns0:text x="151.1111" y="544" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#2e7d32">A</ns0:text>
  <ns0:line x1="246.2222" y1="529.7778" x2="303.1111" y2="529.7778" stroke="#555" stroke-width="3.5556" marker-end="url(#arrow)" />
  <ns0:rect x="312.8889" y="465.7778" width="189.3333" height="128" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3.5556" rx="10.6667" filter="url(#shadow)" />
  <ns0:text x="408" y="544" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#1565c0">B</ns0:text>
  <ns0:line x1="502.2222" y1="529.7778" x2="559.1111" y2="529.7778" stroke="#555" stroke-width="3.5556" marker-end="url(#arrow)" />
  <ns0:rect x="568.8889" y="465.7778" width="189.3333" height="128" fill="#fff3e0" stroke="#f57c00" stroke-width="3.5556" rx="10.6667" filter="url(#shadow)" />
  <ns0:text x="664" y="544" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#e65100">C</ns0:text>
  <ns0:text x="834.6667" y="128" font-size="16" fill="#555">1. git rebase -i HEAD~N</ns0:text>
  <ns0:text x="834.6667" y="184.8889" font-size="16" fill="#555">2. Mark commit as "edit"</ns0:text>
  <ns0:text x="834.6667" y="241.7778" font-size="16" fill="#555">3. git reset HEAD~1</ns0:text>
  <ns0:text x="834.6667" y="298.6667" font-size="16" fill="#555">4. git add + commit (A)</ns0:text>
  <ns0:text x="834.6667" y="355.5556" font-size="16" fill="#555">5. git add + commit (B)</ns0:text>
  <ns0:text x="834.6667" y="412.4444" font-size="16" fill="#555">6. git add + commit (C)</ns0:text>
  <ns0:text x="834.6667" y="469.3333" font-size="16" fill="#555">7. git rebase --continue</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="360.914286" y="40" text-anchor="middle" font-size="25.246713" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Before</text>
  <rect x="112.685714" y="82.251607" width="497.828571" height="190.132472" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.923189" filter="url(#shadow)"/>
  <text x="360.914286" y="159.072755" text-anchor="middle" font-size="25.246713" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Commit "ABC"</text>
  <text x="360.914286" y="226.291319" text-anchor="middle" font-size="20.656414" fill="var(--text-muted)" font-family="Arial, sans-serif">3 unrelated changes</text>
  <line x1="360.914286" y1="281.986783" x2="360.914286" y2="374.172184" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="537.828571" y="347.284711" font-size="20.656414" font-style="italic" fill="var(--info-accent)" font-family="Arial, sans-serif">rebase -i → edit</text>
  <text x="829.942857" y="449.072934" text-anchor="middle" font-size="25.246713" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">After</text>
  <rect x="40" y="481.721839" width="292.114286" height="138.278161" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.923189" filter="url(#shadow)"/>
  <text x="185.371429" y="566.225173" text-anchor="middle" font-size="25.246713" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">A</text>
  <line x1="332.114286" y1="550.860919" x2="419.885714" y2="550.860919" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="434.971429" y="481.721839" width="292.114286" height="138.278161" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.923189" filter="url(#shadow)"/>
  <text x="581.714286" y="566.225173" text-anchor="middle" font-size="25.246713" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">B</text>
  <line x1="727.085714" y1="550.860919" x2="814.857143" y2="550.860919" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="829.942857" y="481.721839" width="292.114286" height="138.278161" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.923189" filter="url(#shadow)"/>
  <text x="976.685714" y="566.225173" text-anchor="middle" font-size="25.246713" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">C</text>
  <text x="1240" y="116.821148" font-size="20.656414" fill="var(--text-muted)" font-family="Arial, sans-serif">1. git rebase -i HEAD~N</text>
  <text x="1240" y="178.278161" font-size="20.656414" fill="var(--text-muted)" font-family="Arial, sans-serif">2. Mark commit as "edit"</text>
  <text x="1240" y="239.735056" font-size="20.656414" fill="var(--text-muted)" font-family="Arial, sans-serif">3. git reset HEAD~1</text>
  <text x="1240" y="301.19207" font-size="20.656414" fill="var(--text-muted)" font-family="Arial, sans-serif">4. git add + commit (A)</text>
  <text x="1240" y="362.649083" font-size="20.656414" fill="var(--text-muted)" font-family="Arial, sans-serif">5. git add + commit (B)</text>
  <text x="1240" y="424.105858" font-size="20.656414" fill="var(--text-muted)" font-family="Arial, sans-serif">6. git add + commit (C)</text>
  <text x="1240" y="485.562872" font-size="20.656414" fill="var(--text-muted)" font-family="Arial, sans-serif">7. git rebase --continue</text>
</svg>
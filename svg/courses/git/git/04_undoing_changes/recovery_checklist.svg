<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999833333349" y="40" text-anchor="middle" font-size="38.153505345352" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Recovery Steps</text>
  <rect x="40" y="85.490188465972" width="1200" height="79.607797462502" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.194769957354" filter="url(#shadow)"/>
  <text x="84.444329218118" y="135.529331072643" font-size="29.674828689108" font-family="Arial, sans-serif" fill="var(--ok-text)">1. Check git status - Is it just unstaged?</text>
  <rect x="40" y="176.470565397917" width="1200" height="79.607797462502" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.194769957354" filter="url(#shadow)"/>
  <text x="84.444329218118" y="226.509708004589" font-size="29.674828689108" font-family="Arial, sans-serif" fill="var(--primary-text)">2. Check git reflog - Find the SHA</text>
  <rect x="40" y="267.450942329863" width="1200" height="79.607797462502" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.194769957354" filter="url(#shadow)"/>
  <text x="84.444329218118" y="317.490214348333" font-size="29.674828689108" font-family="Arial, sans-serif" fill="var(--warn-text)">3. Check git fsck --lost-found - Dangling commits</text>
  <rect x="40" y="358.431319261808" width="1200" height="79.607797462502" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.194769957354" filter="url(#shadow)"/>
  <text x="84.444329218118" y="408.470591280277" font-size="29.674828689108" font-family="Arial, sans-serif" fill="var(--info-text)">4. Check git stash list - Maybe you stashed it?</text>
  <rect x="40" y="449.411825605553" width="1200" height="79.607797462502" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.194769957354" filter="url(#shadow)"/>
  <text x="84.444329218118" y="499.451097624022" font-size="29.674828689108" font-family="Arial, sans-serif" fill="var(--danger-text)">5. Check backups/clones - Other copies?</text>
  <rect x="40" y="540.392202537498" width="1200" height="79.607797462502" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.194769957354" filter="url(#shadow)"/>
  <text x="84.444329218118" y="590.431474555967" font-size="29.674828689108" font-family="Arial, sans-serif" fill="var(--primary-text)">6. Act quickly - Garbage collection in 90 days</text>
</svg>

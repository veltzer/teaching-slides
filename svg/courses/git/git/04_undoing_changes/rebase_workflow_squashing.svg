<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="253.3851" y="40" text-anchor="middle" font-size="25.44369784805" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Before</text>
  <rect x="40" y="84" width="68.001" height="77.715428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="74.0005" y="133.214285714286" text-anchor="middle" font-size="18.174085163535" fill="var(--bg)" font-family="Arial, sans-serif">main</text>
  <rect x="183.507" y="84" width="68.001" height="77.715428571429" rx="14.966629547096" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="217.508" y="133.214285714286" text-anchor="middle" font-size="18.174085163535" fill="var(--bg)" font-family="Arial, sans-serif">WIP</text>
  <rect x="327.015" y="84" width="68.001" height="77.715428571429" rx="14.966629547096" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="361.0157" y="133.214285714286" text-anchor="middle" font-size="18.174085163535" fill="var(--bg)" font-family="Arial, sans-serif">typo</text>
  <rect x="470.523" y="84" width="68.001" height="77.715428571429" rx="14.966629547096" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="504.5234" y="133.214285714286" text-anchor="middle" font-size="18.174085163535" fill="var(--bg)" font-family="Arial, sans-serif">done</text>
  <line x1="109.8773" y1="122.857142857143" x2="181.6311" y2="122.857142857143" stroke="var(--text)" stroke-width="2"/>
  <line x1="253.3851" y1="122.857142857143" x2="325.1389" y2="122.857142857143" stroke="var(--text)" stroke-width="2"/>
  <line x1="396.8926" y1="122.857142857143" x2="468.6465" y2="122.857142857143" stroke="var(--text)" stroke-width="2"/>
  <rect x="701.8464" y="60.714285714286" width="538.1536" height="165.714285714286" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.419294317246" filter="url(#shadow)"/>
  <text x="970.9231" y="112.5" text-anchor="middle" font-size="21.808838053544" font-family="Courier New, monospace" fill="var(--warn-text)">git rebase -i HEAD~3</text>
  <text x="737.7232" y="153.928571428571" font-size="19.99146160854" font-family="Courier New, monospace" fill="var(--warn-text)">pick WIP</text>
  <text x="737.7232" y="185" font-size="19.99146160854" font-family="Courier New, monospace" fill="var(--warn-text)">squash typo</text>
  <text x="737.7232" y="216.071428571429" font-size="19.99146160854" font-family="Courier New, monospace" fill="var(--warn-text)">squash done</text>
  <text x="253.3851" y="330" text-anchor="middle" font-size="25.44369784805" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">After</text>
  <rect x="40" y="374" width="68.001" height="77.715428571429" rx="14.966629547096" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="74.0005" y="423.214285714286" text-anchor="middle" font-size="18.174085163535" fill="var(--bg)" font-family="Arial, sans-serif">main</text>
  <rect x="210.884" y="364.284571428571" width="85.0014" height="97.144457142857" rx="14.966629547096" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="253.3851" y="423.214285714286" text-anchor="middle" font-size="21.808838053544" fill="var(--bg)" font-family="Arial, sans-serif">Feature</text>
  <line x1="109.8773" y1="412.857142857143" x2="208.5388" y2="412.857142857143" stroke="var(--text)" stroke-width="2"/>
  <text x="253.3851" y="485.357142857143" text-anchor="middle" font-size="21.808838053544" font-family="Arial, sans-serif" fill="var(--text)">Clean single commit!</text>
  <rect x="522.4617" y="371.428571428571" width="717.5383" height="248.571428571429" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.419294317246" filter="url(#shadow)"/>
  <text x="881.2309" y="433.571428571429" text-anchor="middle" font-size="25.44369784805" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Benefits:</text>
  <text x="558.3387" y="485.357142857143" font-size="21.808838053544" font-family="Arial, sans-serif" fill="var(--ok-text)">• Clean, logical history</text>
  <text x="558.3387" y="526.785714285714" font-size="21.808838053544" font-family="Arial, sans-serif" fill="var(--ok-text)">• Easier code review</text>
  <text x="558.3387" y="568.214285714286" font-size="21.808838053544" font-family="Arial, sans-serif" fill="var(--ok-text)">• Better git blame/bisect</text>
</svg>

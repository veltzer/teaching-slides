<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="64" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#333">Danger Level: Low → High</ns0:text>
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <ns0:stop offset="0%" stop-color="#4caf50" />
      <ns0:stop offset="50%" stop-color="#ff9800" />
      <ns0:stop offset="100%" stop-color="#f44336" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f0f0f0" />
    </ns0:linearGradient>
  </ns0:defs>
  <ns0:rect x="56.8889" y="497.7778" width="1024" height="32" rx="8.8889" fill="url(#dangerGrad)" opacity="0.7" />
  <ns0:text x="56.8889" y="568.8889" font-size="16" fill="#4caf50">Safe</ns0:text>
  <ns0:text x="1024" y="568.8889" font-size="16" fill="#f44336" text-anchor="end">Destructive</ns0:text>
  <ns0:rect x="56.8889" y="117.3333" width="227.5556" height="337.7778" fill="#e8f5e9" stroke="#4caf50" stroke-width="3.5556" rx="14.2222" filter="url(#shadow)" />
  <ns0:text x="170.6667" y="188.4444" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#2e7d32">commit</ns0:text>
  <ns0:text x="170.6667" y="227.5556" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#2e7d32">--amend</ns0:text>
  <ns0:text x="170.6667" y="293.3333" text-anchor="middle" font-size="16" fill="#555">Fixes last</ns0:text>
  <ns0:text x="170.6667" y="328.8889" text-anchor="middle" font-size="16" fill="#555">commit only</ns0:text>
  <ns0:text x="170.6667" y="400" text-anchor="middle" font-size="16" fill="#4caf50">● Low risk</ns0:text>
  <ns0:rect x="322.6667" y="117.3333" width="227.5556" height="337.7778" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3.5556" rx="14.2222" filter="url(#shadow)" />
  <ns0:text x="436.4444" y="208" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#1565c0">rebase -i</ns0:text>
  <ns0:text x="436.4444" y="284.4444" text-anchor="middle" font-size="16" fill="#555">Rewrite multiple</ns0:text>
  <ns0:text x="436.4444" y="318.2222" text-anchor="middle" font-size="16" fill="#555">past commits</ns0:text>
  <ns0:text x="436.4444" y="400" text-anchor="middle" font-size="16" fill="#1976d2">● Medium risk</ns0:text>
  <ns0:rect x="587.5556" y="117.3333" width="227.5556" height="337.7778" fill="#fff3e0" stroke="#f57c00" stroke-width="3.5556" rx="14.2222" filter="url(#shadow)" />
  <ns0:text x="701.3333" y="208" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#e65100">filter-branch</ns0:text>
  <ns0:text x="701.3333" y="284.4444" text-anchor="middle" font-size="16" fill="#555">Rewrites entire</ns0:text>
  <ns0:text x="701.3333" y="318.2222" text-anchor="middle" font-size="16" fill="#555">repo history</ns0:text>
  <ns0:text x="701.3333" y="400" text-anchor="middle" font-size="16" fill="#f57c00">● High risk</ns0:text>
  <ns0:rect x="853.3333" y="117.3333" width="227.5556" height="337.7778" fill="#ffebee" stroke="#c62828" stroke-width="3.5556" rx="14.2222" filter="url(#shadow)" />
  <ns0:text x="967.1111" y="208" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#b71c1c">reset --hard</ns0:text>
  <ns0:text x="967.1111" y="284.4444" text-anchor="middle" font-size="16" fill="#555">Discards commits</ns0:text>
  <ns0:text x="967.1111" y="318.2222" text-anchor="middle" font-size="16" fill="#555">and changes</ns0:text>
  <ns0:text x="967.1111" y="400" text-anchor="middle" font-size="16" fill="#c62828">● Destructive</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="98" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--text)">Danger Level: Low → High</text>
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--primary)" />
      <stop offset="100%" stop-color="var(--primary-dk)" />
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--ok-light)" />
      <stop offset="50%" stop-color="var(--warn-orange)" />
      <stop offset="100%" stop-color="var(--danger-vivid)" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)" />
      <stop offset="100%" stop-color="var(--surface-dark)" />
    </linearGradient>
  </defs>
  <rect x="100" y="491.1111" width="1080" height="29" rx="6" fill="url(#dangerGrad)" opacity="0.7" />
  <text x="100" y="555.5556" font-size="15.6425" fill="var(--ok-accent)">Safe</text>
  <text x="1120" y="555.5556" font-size="15.6425" fill="var(--danger-accent)" text-anchor="end">Destructive</text>
  <rect x="100" y="146.3333" width="240" height="306.1111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="220" y="210.7777" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">commit</text>
  <text x="220" y="246.2223" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">--amend</text>
  <text x="220" y="305.8333" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Fixes last</text>
  <text x="220" y="338.0556" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">commit only</text>
  <text x="220" y="402.5" text-anchor="middle" font-size="15.6425" fill="var(--ok-accent)">● Low risk</text>
  <rect x="380.3125" y="146.3333" width="240" height="306.1111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="500.3124" y="228.5" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">rebase -i</text>
  <text x="500.3124" y="297.7777" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Rewrite multiple</text>
  <text x="500.3124" y="328.3889" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">past commits</text>
  <text x="500.3124" y="402.5" text-anchor="middle" font-size="15.6425" fill="var(--primary-accent)">● Medium risk</text>
  <rect x="659.6875" y="146.3333" width="240" height="306.1111" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="779.6875" y="228.5" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--warn-accent)">filter-branch</text>
  <text x="779.6875" y="297.7777" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Rewrites entire</text>
  <text x="779.6875" y="328.3889" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">repo history</text>
  <text x="779.6875" y="402.5" text-anchor="middle" font-size="15.6425" fill="var(--warn-accent)">● High risk</text>
  <rect x="939.9999" y="146.3333" width="240" height="306.1111" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1060" y="228.5" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--danger-accent)">reset --hard</text>
  <text x="1060" y="297.7777" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Discards commits</text>
  <text x="1060" y="328.3889" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">and changes</text>
  <text x="1060" y="402.5" text-anchor="middle" font-size="15.6425" fill="var(--danger-accent)">● Destructive</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--primary)"/>
      <stop offset="100%" stop-color="var(--primary-dk)"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--ok-light)"/>
      <stop offset="50%" stop-color="var(--warn-orange)"/>
      <stop offset="100%" stop-color="var(--danger-vivid)"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface-dark)"/>
    </linearGradient>
  </defs>
  <rect x="40" y="528.661356390235" width="1200" height="41.102354571642" rx="7.52946936245" fill="url(#dangerGrad)" opacity="0.7"/>
  <text x="40" y="620" font-size="19.62995279277" fill="var(--ok-accent)" font-family="Arial, sans-serif">Safe</text>
  <text x="1173.333333" y="620" font-size="19.62995279277" fill="var(--danger-accent)" text-anchor="end" font-family="Arial, sans-serif">Destructive</text>
  <rect x="40" y="40" width="266.666667" height="433.858168882643" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.52946936245" filter="url(#shadow)"/>
  <text x="173.333333" y="131.338502727889" text-anchor="middle" font-size="21.811114348749" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">commit</text>
  <text x="173.333333" y="181.574933765999" text-anchor="middle" font-size="21.811114348749" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">--amend</text>
  <text x="173.333333" y="266.06294902592" text-anchor="middle" font-size="19.62995279277" fill="var(--text-muted)" font-family="Arial, sans-serif">Fixes last</text>
  <text x="173.333333" y="311.732341830796" text-anchor="middle" font-size="19.62995279277" fill="var(--text-muted)" font-family="Arial, sans-serif">commit only</text>
  <text x="173.333333" y="403.070844558685" text-anchor="middle" font-size="19.62995279277" fill="var(--ok-accent)" font-family="Arial, sans-serif">● Low risk</text>
  <rect x="351.458333" y="40" width="266.666667" height="433.858168882643" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.52946936245" filter="url(#shadow)"/>
  <text x="484.791556" y="156.456718246944" text-anchor="middle" font-size="21.811114348749" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">rebase -i</text>
  <text x="484.791556" y="254.645565324704" text-anchor="middle" font-size="19.62995279277" fill="var(--text-muted)" font-family="Arial, sans-serif">Rewrite multiple</text>
  <text x="484.791556" y="298.031510012957" text-anchor="middle" font-size="19.62995279277" fill="var(--text-muted)" font-family="Arial, sans-serif">past commits</text>
  <text x="484.791556" y="403.070844558685" text-anchor="middle" font-size="19.62995279277" fill="var(--primary-accent)" font-family="Arial, sans-serif">● Medium risk</text>
  <rect x="661.875" y="40" width="266.666667" height="433.858168882643" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.52946936245" filter="url(#shadow)"/>
  <text x="795.208333" y="156.456718246944" text-anchor="middle" font-size="21.811114348749" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">filter-branch</text>
  <text x="795.208333" y="254.645565324704" text-anchor="middle" font-size="19.62995279277" fill="var(--text-muted)" font-family="Arial, sans-serif">Rewrites entire</text>
  <text x="795.208333" y="298.031510012957" text-anchor="middle" font-size="19.62995279277" fill="var(--text-muted)" font-family="Arial, sans-serif">repo history</text>
  <text x="795.208333" y="403.070844558685" text-anchor="middle" font-size="19.62995279277" fill="var(--warn-accent)" font-family="Arial, sans-serif">● High risk</text>
  <rect x="973.333222" y="40" width="266.666667" height="433.858168882643" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.52946936245" filter="url(#shadow)"/>
  <text x="1106.666667" y="156.456718246944" text-anchor="middle" font-size="21.811114348749" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">reset --hard</text>
  <text x="1106.666667" y="254.645565324704" text-anchor="middle" font-size="19.62995279277" fill="var(--text-muted)" font-family="Arial, sans-serif">Discards commits</text>
  <text x="1106.666667" y="298.031510012957" text-anchor="middle" font-size="19.62995279277" fill="var(--text-muted)" font-family="Arial, sans-serif">and changes</text>
  <text x="1106.666667" y="403.070844558685" text-anchor="middle" font-size="19.62995279277" fill="var(--danger-accent)" font-family="Arial, sans-serif">● Destructive</text>
</svg>

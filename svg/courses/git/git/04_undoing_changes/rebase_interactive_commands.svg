<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="600" height="112.258025598333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="340" y="86.774131633711" text-anchor="middle" font-size="25.072793529789" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">pick - Keep commit as is</text>
  <text x="340" y="124.193546618106" text-anchor="middle" font-size="21.490920999681" font-family="Arial, sans-serif" fill="var(--ok-text)">Default option, no changes</text>
  <rect x="674.2857" y="40" width="565.7143" height="112.258025598333" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="957.1429" y="86.774131633711" text-anchor="middle" font-size="25.072793529789" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">reword - Edit commit message</text>
  <text x="957.1429" y="124.193546618106" text-anchor="middle" font-size="21.490920999681" font-family="Arial, sans-serif" fill="var(--primary-text)">Fix typos, improve clarity</text>
  <rect x="40" y="170.967678251817" width="600" height="112.258025598333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="340" y="217.741919562954" text-anchor="middle" font-size="25.072793529789" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">edit - Stop to amend commit</text>
  <text x="340" y="255.161224869924" text-anchor="middle" font-size="21.490920999681" font-family="Arial, sans-serif" fill="var(--warn-text)">Add files, split commit</text>
  <rect x="674.2857" y="170.967678251817" width="565.7143" height="112.258025598333" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="957.1429" y="217.741919562954" text-anchor="middle" font-size="25.072793529789" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">squash - Combine with previous</text>
  <text x="957.1429" y="255.161224869924" text-anchor="middle" font-size="21.490920999681" font-family="Arial, sans-serif" fill="var(--info-text)">Keep both messages</text>
  <rect x="40" y="301.93546618106" width="600" height="112.258025598333" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="340" y="348.709707492197" text-anchor="middle" font-size="25.072793529789" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">fixup - Combine, discard message</text>
  <text x="340" y="386.129012799167" text-anchor="middle" font-size="21.490920999681" font-family="Arial, sans-serif" fill="var(--primary-text)">Clean up WIP commits</text>
  <rect x="674.2857" y="301.93546618106" width="565.7143" height="112.258025598333" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="957.1429" y="348.709707492197" text-anchor="middle" font-size="25.072793529789" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">drop - Remove commit entirely</text>
  <text x="957.1429" y="386.129012799167" text-anchor="middle" font-size="21.490920999681" font-family="Arial, sans-serif" fill="var(--danger-text)">Delete unwanted changes</text>
  <rect x="40" y="432.903254110303" width="600" height="112.258025598333" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="340" y="479.677385744015" text-anchor="middle" font-size="25.072793529789" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">exec - Run shell command</text>
  <text x="340" y="517.09680072841" text-anchor="middle" font-size="21.490920999681" font-family="Arial, sans-serif" fill="var(--danger-text)">exec npm test</text>
  <rect x="674.2857" y="432.903254110303" width="565.7143" height="112.258025598333" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="957.1429" y="479.677385744015" text-anchor="middle" font-size="25.072793529789" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">break - Pause rebase here</text>
  <text x="957.1429" y="517.09680072841" text-anchor="middle" font-size="21.490920999681" font-family="Arial, sans-serif" fill="var(--info-text)">Manual intervention needed</text>
  <text x="640" y="620" text-anchor="middle" font-size="25.072793529789" font-style="italic" font-family="Arial, sans-serif" fill="var(--text)">Tip: You can reorder lines to reorder commits!</text>
</svg>

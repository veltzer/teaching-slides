<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="600" height="133.846153846154" rx="8.44894167246" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="79.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--ok-text)">Typo in last message</text>
  <text x="340" y="118.076923076922" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--ok-text)">git commit --amend</text>
  <text x="340" y="151.538461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" font-style="italic" fill="var(--ok-text)">safe if unpushed</text>

  <rect x="680" y="40" width="560" height="133.846153846154" rx="8.44894167246" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="79.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--primary-text)">Wrong file in commit</text>
  <text x="960" y="118.076923076922" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--primary-text)">git reset HEAD~ --soft</text>
  <text x="960" y="151.538461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" font-style="italic" fill="var(--primary-text)">recommit correctly</text>

  <rect x="40" y="196.153846153846" width="600" height="133.846153846154" rx="8.44894167246" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="235.192307692307" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--warn-text)">Undo public commit</text>
  <text x="340" y="274.230769230769" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--warn-text)">git revert</text>
  <text x="340" y="307.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" font-style="italic" fill="var(--warn-text)">preserves history</text>

  <rect x="680" y="196.153846153846" width="560" height="133.846153846154" rx="8.44894167246" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="235.192307692307" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--danger-text)">Discard local changes</text>
  <text x="960" y="274.230769230769" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--danger-text)">git reset --hard HEAD</text>
  <text x="960" y="307.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" font-style="italic" fill="var(--danger-text)">destructive</text>

  <rect x="40" y="352.307692307692" width="600" height="133.846153846154" rx="8.44894167246" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="391.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--info-text)">Messy history</text>
  <text x="340" y="430.384615384615" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--info-text)">git rebase -i</text>
  <text x="340" y="463.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" font-style="italic" fill="var(--info-text)">squash, reorder</text>

  <rect x="680" y="352.307692307692" width="560" height="133.846153846154" rx="8.44894167246" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="391.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--primary-text)">Pick a fix from branch</text>
  <text x="960" y="430.384615384615" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--primary-text)">git cherry-pick</text>
  <text x="960" y="463.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" font-style="italic" fill="var(--primary-text)">apply single commit</text>

  <rect x="40" y="497.307692307692" width="600" height="122.692307692308" rx="8.44894167246" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="536.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--danger-text)">Committed secrets</text>
  <text x="340" y="575.384615384616" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--danger-text)">BFG or filter-branch</text>
  <text x="340" y="608.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" font-style="italic" fill="var(--danger-text)">rewrites history</text>

  <rect x="680" y="497.307692307692" width="560" height="122.692307692308" rx="8.44894167246" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="536.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--info-text)">Recover after reset</text>
  <text x="960" y="575.384615384616" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--info-text)">git reflog</text>
  <text x="960" y="608.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" font-style="italic" fill="var(--info-text)">90 day window</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="599.9999" height="165.714253061231" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.414269173951"/>
  <text x="340.0001" y="91.785932653018" text-anchor="middle" font-size="24.873146098259" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Good Names ✓</text>
  <text x="74.2858" y="143.571408163269" font-size="21.31964097589" font-family="Courier New, monospace" fill="var(--ok-text)">feature/user-authentication</text>
  <text x="74.2858" y="185.000199999961" font-size="21.31964097589" font-family="Courier New, monospace" fill="var(--ok-text)">bugfix/login-error-handling</text>
  <rect x="674.2857" y="40" width="565.7143" height="165.714253061231" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.414269173951"/>
  <text x="957.1427" y="91.785932653018" text-anchor="middle" font-size="24.873146098259" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Bad Names ✗</text>
  <text x="708.5714" y="143.571408163269" font-size="21.31964097589" font-family="Courier New, monospace" fill="var(--danger-text)">my-branch</text>
  <text x="708.5714" y="185.000199999961" font-size="21.31964097589" font-family="Courier New, monospace" fill="var(--danger-text)">test123</text>
  <rect x="40" y="247.14293061223" width="1199.9999" height="372.85706938777" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.414269173951"/>
  <text x="640.0001" y="309.285775510192" text-anchor="middle" font-size="28.426437411655" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Common Prefixes</text>
  <text x="74.2858" y="371.428620408154" font-size="21.31964097589" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">feature/</tspan> - New features</text>
  <text x="74.2858" y="412.857297959153" font-size="21.31964097589" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">bugfix/</tspan> - Bug fixes</text>
  <text x="74.2858" y="454.285746938769" font-size="21.31964097589" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">hotfix/</tspan> - Urgent fixes for production</text>
  <text x="74.2858" y="495.714310204077" font-size="21.31964097589" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">release/</tspan> - Release preparation</text>
  <text x="640.0001" y="371.428620408154" font-size="21.31964097589" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">chore/</tspan> - Maintenance tasks</text>
  <text x="640.0001" y="412.857297959153" font-size="21.31964097589" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">docs/</tspan> - Documentation</text>
  <text x="640.0001" y="454.285746938769" font-size="21.31964097589" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">refactor/</tspan> - Code refactoring</text>
  <text x="640.0001" y="495.714310204077" font-size="21.31964097589" font-family="Arial, sans-serif" fill="var(--warn-text)">
    <tspan font-family="Courier New, monospace" fill="var(--text)">test/</tspan> - Test additions/changes</text>
  <text x="640.0001" y="578.571436734692" text-anchor="middle" font-size="23.096286632589" font-style="italic" font-family="Arial, sans-serif" fill="var(--warn-text)">Use lowercase, hyphens, and be descriptive!</text>
</svg>

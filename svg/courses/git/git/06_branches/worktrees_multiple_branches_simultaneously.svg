<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="227.5" y="40" width="750" height="144.999970833336" fill="url(#grad-ok)" rx="6.480740419066" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="602.5" y="124.583326041667" text-anchor="middle" font-size="32.110880640727" fill="var(--bg)" font-family="Arial, sans-serif">One Repository, Multiple Working Directories</text>
  <rect x="40" y="233.333333333333" width="375" height="241.666695833331" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.480740419066" filter="url(#shadow)"/>
  <text x="227.5" y="293.749978125002" text-anchor="middle" font-size="28.097034062178" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Main Worktree</text>
  <text x="227.5" y="342.083340624999" text-anchor="middle" font-size="24.08318748363" font-family="Arial, sans-serif" fill="var(--ok-text)">~/project/</text>
  <text x="227.5" y="390.416703124997" text-anchor="middle" font-size="22.076210188186" font-family="Arial, sans-serif" fill="var(--ok-text)">Branch: main</text>
  <text x="227.5" y="438.750065624994" text-anchor="middle" font-size="22.076210188186" font-family="Arial, sans-serif" fill="var(--ok-text)">Can edit files</text>
  <rect x="452.5" y="233.333333333333" width="375" height="241.666695833331" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.480740419066" filter="url(#shadow)"/>
  <text x="640" y="293.749978125002" text-anchor="middle" font-size="28.097034062178" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Feature Worktree</text>
  <text x="640" y="342.083340624999" text-anchor="middle" font-size="24.08318748363" font-family="Arial, sans-serif" fill="var(--primary-text)">~/project-feature/</text>
  <text x="640" y="390.416703124997" text-anchor="middle" font-size="22.076210188186" font-family="Arial, sans-serif" fill="var(--primary-text)">Branch: feature</text>
  <text x="640" y="438.750065624994" text-anchor="middle" font-size="22.076210188186" font-family="Arial, sans-serif" fill="var(--primary-text)">Can edit files</text>
  <rect x="865" y="233.333333333333" width="375" height="241.666695833331" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.480740419066" filter="url(#shadow)"/>
  <text x="1052.5" y="293.749978125002" text-anchor="middle" font-size="28.097034062178" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Hotfix Worktree</text>
  <text x="1052.5" y="342.083340624999" text-anchor="middle" font-size="24.08318748363" font-family="Arial, sans-serif" fill="var(--warn-text)">~/project-hotfix/</text>
  <text x="1052.5" y="390.416703124997" text-anchor="middle" font-size="22.076210188186" font-family="Arial, sans-serif" fill="var(--warn-text)">Branch: hotfix</text>
  <text x="1052.5" y="438.750065624994" text-anchor="middle" font-size="22.076210188186" font-family="Arial, sans-serif" fill="var(--warn-text)">Can edit files</text>
  <rect x="415" y="523.333391666662" width="375" height="96.666608333338" fill="url(#grad-info)" rx="6.480740419066" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="602.5" y="583.75003645833" text-anchor="middle" font-size="28.097034062178" fill="var(--bg)" font-family="Arial, sans-serif">Shared .git</text>
  <line x1="227.5" y1="475.000029166664" x2="508.75" y2="523.333391666662" stroke="var(--text)" stroke-width="2"/>
  <line x1="640" y1="475.000029166664" x2="602.5" y2="523.333391666662" stroke="var(--text)" stroke-width="2"/>
  <line x1="1052.5" y1="475.000029166664" x2="696.25" y2="523.333391666662" stroke="var(--text)" stroke-width="2"/>
</svg>

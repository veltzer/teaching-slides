  <text x="435.0605" y="40" text-anchor="middle" font-size="25.451805709073" font-family="Arial, sans-serif" fill="var(--text)">feature</text>
  <rect x="218.875" y="501.039575482979" width="74.619" height="96.458695553818" rx="15.917469106622" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="256.1849" y="563.414750803079" text-anchor="middle" font-size="21.20968649595" fill="var(--bg)" font-family="Arial, sans-serif">fix</text>
  <rect x="397.751" y="501.039575482979" width="74.619" height="96.458695553818" rx="15.917469106622" fill="url(#grad-warn)" filter="url(#shadow)"/>

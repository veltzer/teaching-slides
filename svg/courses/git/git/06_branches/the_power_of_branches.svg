  <text x="971.6869" y="124.878067697797" text-anchor="middle" font-size="33.935703046694" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Benefits:</text>
  <text x="739.1487" y="209.756135395593" font-size="25.451805709073" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Parallel development</text>
  <text x="739.1487" y="266.341513860791" font-size="25.451805709073" font-family="Arial, sans-serif" fill="var(--ok-text)">✓ Isolated experiments</text>

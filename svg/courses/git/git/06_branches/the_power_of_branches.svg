  <text x="345.6226" y="620" text-anchor="middle" font-size="25.451805709073" font-family="Arial, sans-serif" fill="var(--text)">hotfix</text>
  <line x1="113.0846" y1="322.926892325989" x2="220.4099" y2="322.926892325989" stroke="var(--text)" stroke-width="2"/>
  <line x1="256.1849" y1="266.341513860791" x2="256.1849" y2="153.170756930396" stroke="var(--text)" stroke-width="2"/>
  <line x1="291.96" y1="96.585507733475" x2="399.2854" y2="96.585507733475" stroke="var(--text)" stroke-width="2"/>
  <line x1="470.8355" y1="96.585507733475" x2="578.1608" y2="96.585507733475" stroke="var(--text)" stroke-width="2"/>
  <line x1="256.1849" y1="379.512270791187" x2="256.1849" y2="492.682898453305" stroke="var(--text)" stroke-width="2"/>
  <line x1="291.96" y1="549.268276918503" x2="399.2854" y2="549.268276918503" stroke="var(--text)" stroke-width="2"/>

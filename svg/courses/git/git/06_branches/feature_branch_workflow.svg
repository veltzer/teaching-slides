<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowFW" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
    <marker id="arrowFWp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#9c27b0" />
    </marker>
  </defs>
  <rect x="40" y="432.06" width="79.52888" height="79.5288" rx="14.000007" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.2667" filter="url(#shadow)"/>
  <text x="79.76444" y="488.7591" text-anchor="middle" font-size="26.509513" font-family="sans-serif">C1</text>
  <rect x="264.094224" y="432.06" width="79.52888" height="79.5288" rx="14.000007" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.2667" filter="url(#shadow)"/>
  <text x="303.858664" y="488.7591" text-anchor="middle" font-size="26.509513" font-family="sans-serif">C2</text>
  <rect x="488.188448" y="432.06" width="79.52888" height="79.5288" rx="14.000007" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.2667" filter="url(#shadow)"/>
  <text x="527.953288" y="488.7591" text-anchor="middle" font-size="26.509513" font-family="sans-serif">C3</text>
  <line x1="121.781982" y1="471.8248" x2="256.238816" y2="471.8248" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowFW)" />
  <line x1="345.876506" y1="471.8248" x2="480.33324" y2="471.8248" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowFW)" />
  <line x1="555.965016" y1="412.5548" x2="682.018142" y2="217.8103" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrowFWp)" />
  <text x="569.97103" y="281.3139" text-anchor="start" font-size="26.509513" font-family="sans-serif" fill="var(--info-accent)" font-style="italic">1. Create</text>
  <rect x="698.277658" y="114.542" width="79.52888" height="79.5288" rx="14.000007" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="4.2667" filter="url(#shadow)"/>
  <text x="738.041898" y="171.2409" text-anchor="middle" font-size="26.509513" font-family="sans-serif">F1</text>
  <rect x="922.371882" y="114.542" width="79.52888" height="79.5288" rx="14.000007" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="4.2667" filter="url(#shadow)"/>
  <text x="962.136522" y="171.2409" text-anchor="middle" font-size="26.509513" font-family="sans-serif">F2</text>
  <line x1="780.05964" y1="154.3065" x2="914.516375" y2="154.3065" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrowFWp)" />
  <text x="850.08901" y="90.8029" text-anchor="middle" font-size="26.509513" font-family="sans-serif" fill="var(--info-accent)" font-style="italic">2. Develop</text>
  <line x1="569.97103" y1="471.8248" x2="1152.616813" y2="471.8248" stroke="var(--text)" stroke-width="2" stroke-dasharray="12.8 8.5333" />
  <rect x="1160.47112" y="432.06" width="79.52888" height="79.5288" rx="14.000007" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="6.4" filter="url(#shadow)"/>
  <text x="1200.23676" y="488.7591" text-anchor="middle" font-size="26.509513" font-family="sans-serif">M</text>
  <line x1="995.750556" y1="200.8759" x2="1166.622727" y2="421.022" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrowFW)" />
  <text x="1144.213204" y="302.4818" text-anchor="end" font-size="26.509513" font-family="sans-serif" fill="var(--ok-accent)" font-style="italic">3. Merge/PR</text>
  <text x="303.858664" y="620" text-anchor="middle" font-size="31.811516" font-family="sans-serif" fill="var(--ok-accent)" font-weight="bold">main</text>
  <text x="850.08901" y="40" text-anchor="middle" font-size="31.811516" font-family="sans-serif" fill="var(--info-accent)" font-weight="bold">feature</text>
</svg>
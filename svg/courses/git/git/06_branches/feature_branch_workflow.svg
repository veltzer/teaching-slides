<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowFW" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
    <marker id="arrowFWp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#9c27b0" />
    </marker>
  </defs>
  <circle cx="106.6667" cy="504" r="32" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="106.6667" y="518.4" text-anchor="middle" font-size="21.3333" font-family="sans-serif">C1</text>
  <circle cx="277.3333" cy="504" r="32" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="277.3333" y="518.4" text-anchor="middle" font-size="21.3333" font-family="sans-serif">C2</text>
  <circle cx="448" cy="504" r="32" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="448" y="518.4" text-anchor="middle" font-size="21.3333" font-family="sans-serif">C3</text>
  <line x1="138.6667" y1="504" x2="241.0667" y2="504" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowFW)" />
  <line x1="309.3333" y1="504" x2="411.7333" y2="504" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowFW)" />
  <line x1="469.3333" y1="453.6" x2="565.3333" y2="288" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrowFWp)" />
  <text x="480" y="342" text-anchor="start" font-size="21.3333" font-family="sans-serif" fill="var(--info-accent)" font-style="italic">1. Create</text>
  <circle cx="608" cy="234" r="32" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="4.2667" />
  <text x="608" y="248.4" text-anchor="middle" font-size="21.3333" font-family="sans-serif">F1</text>
  <circle cx="778.6667" cy="234" r="32" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="4.2667" />
  <text x="778.6667" y="248.4" text-anchor="middle" font-size="21.3333" font-family="sans-serif">F2</text>
  <line x1="640" y1="234" x2="742.4" y2="234" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrowFWp)" />
  <text x="693.3333" y="180" text-anchor="middle" font-size="21.3333" font-family="sans-serif" fill="var(--info-accent)" font-style="italic">2. Develop</text>
  <line x1="480" y1="504" x2="923.7333" y2="504" stroke="var(--text)" stroke-width="2" stroke-dasharray="12.8 8.5333" />
  <circle cx="960" cy="504" r="32" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="6.4" />
  <text x="960" y="518.4" text-anchor="middle" font-size="21.3333" font-family="sans-serif">M</text>
  <line x1="804.2667" y1="273.6" x2="934.4" y2="460.8" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrowFW)" />
  <text x="917.3333" y="360" text-anchor="end" font-size="21.3333" font-family="sans-serif" fill="var(--ok-accent)" font-style="italic">3. Merge/PR</text>
  <text x="277.3333" y="630" text-anchor="middle" font-size="25.6" font-family="sans-serif" fill="var(--ok-accent)" font-weight="bold">main</text>
  <text x="693.3333" y="136.8" text-anchor="middle" font-size="25.6" font-family="sans-serif" fill="var(--info-accent)" font-weight="bold">feature</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="432.06" width="79.52888" height="79.5288" rx="14.000007" fill="url(#grad-ok)" stroke="var(--text)" stroke-width="4.2667" filter="url(#shadow)"/>
  <text x="79.76444" y="488.7591" text-anchor="middle" font-size="26.509513" font-family="Arial, sans-serif" fill="var(--ok-text)">C1</text>
  <rect x="264.094224" y="432.06" width="79.52888" height="79.5288" rx="14.000007" fill="url(#grad-ok)" stroke="var(--text)" stroke-width="4.2667" filter="url(#shadow)"/>
  <text x="303.858664" y="488.7591" text-anchor="middle" font-size="26.509513" font-family="Arial, sans-serif" fill="var(--ok-text)">C2</text>
  <rect x="488.188448" y="432.06" width="79.52888" height="79.5288" rx="14.000007" fill="url(#grad-ok)" stroke="var(--text)" stroke-width="4.2667" filter="url(#shadow)"/>
  <text x="527.953288" y="488.7591" text-anchor="middle" font-size="26.509513" font-family="Arial, sans-serif" fill="var(--ok-text)">C3</text>
  <line x1="121.781982" y1="471.8248" x2="256.238816" y2="471.8248" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345.876506" y1="471.8248" x2="480.33324" y2="471.8248" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="555.965016" y1="412.5548" x2="682.018142" y2="217.8103" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="569.97103" y="281.3139" text-anchor="start" font-size="26.509513" fill="var(--info-accent)" font-style="italic" font-family="Arial, sans-serif">1. Create</text>
  <rect x="698.277658" y="114.542" width="79.52888" height="79.5288" rx="14.000007" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.2667" filter="url(#shadow)"/>
  <text x="738.041898" y="171.2409" text-anchor="middle" font-size="26.509513" font-family="Arial, sans-serif" fill="var(--info-text)">F1</text>
  <rect x="922.371882" y="114.542" width="79.52888" height="79.5288" rx="14.000007" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4.2667" filter="url(#shadow)"/>
  <text x="962.136522" y="171.2409" text-anchor="middle" font-size="26.509513" font-family="Arial, sans-serif" fill="var(--info-text)">F2</text>
  <line x1="780.05964" y1="154.3065" x2="914.516375" y2="154.3065" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850.08901" y="90.8029" text-anchor="middle" font-size="26.509513" fill="var(--info-accent)" font-style="italic" font-family="Arial, sans-serif">2. Develop</text>
  <line x1="569.97103" y1="471.8248" x2="1152.616813" y2="471.8248" stroke="var(--text)" stroke-width="2" stroke-dasharray="12.8 8.5333"/>
  <rect x="1160.47112" y="432.06" width="79.52888" height="79.5288" rx="14.000007" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="6.4" filter="url(#shadow)"/>
  <text x="1200.23676" y="488.7591" text-anchor="middle" font-size="26.509513" font-family="Arial, sans-serif" fill="var(--ok-text)">M</text>
  <line x1="995.750556" y1="200.8759" x2="1166.622727" y2="421.022" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1144.213204" y="302.4818" text-anchor="end" font-size="26.509513" fill="var(--ok-accent)" font-style="italic" font-family="Arial, sans-serif">3. Merge/PR</text>
  <text x="303.858664" y="620" text-anchor="middle" font-size="31.811516" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">main</text>
  <text x="850.08901" y="40" text-anchor="middle" font-size="31.811516" fill="var(--info-accent)" font-weight="bold" font-family="Arial, sans-serif">feature</text>
</svg>

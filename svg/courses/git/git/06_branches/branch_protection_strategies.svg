<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="125.7143" y="40" width="1028.5714" height="133.846144970415" fill="url(#grad-ok)" rx="6.44503365266" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="95.769303994078" text-anchor="middle" font-size="29.499348697136" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Protected: main branch</text>
  <text x="640" y="140.384608727811" text-anchor="middle" font-size="22.124511522852" fill="var(--bg)" font-family="Arial, sans-serif">Requires pull request, reviews, passing tests</text>
  <rect x="40" y="218.461565088756" width="548.5714" height="401.538434911244" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="314.2857" y="285.384637573963" text-anchor="middle" font-size="25.811930109994" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Local Protection</text>
  <text x="74.2857" y="341.153826183433" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--ok-text)">Pre-push hook example:</text>
  <text x="74.2857" y="385.769246301774" font-size="18.43709293571" font-family="Courier New, monospace" fill="var(--ok-text)">#!/bin/sh</text>
  <text x="74.2857" y="419.230782544378" font-size="18.43709293571" font-family="Courier New, monospace" fill="var(--ok-text)">branch=$(git symbolic-ref HEAD)</text>
  <text x="74.2857" y="452.692318786982" font-size="18.43709293571" font-family="Courier New, monospace" fill="var(--ok-text)">if [ "$branch" = "refs/heads/main" ]</text>
  <text x="74.2857" y="486.153855029585" font-size="18.43709293571" font-family="Courier New, monospace" fill="var(--ok-text)">then</text>
  <text x="74.2857" y="519.615391272189" font-size="18.43709293571" font-family="Courier New, monospace" fill="var(--ok-text)">  echo "Direct push to main blocked"</text>
  <text x="74.2857" y="553.076927514793" font-size="18.43709293571" font-family="Courier New, monospace" fill="var(--ok-text)">  exit 1</text>
  <text x="74.2857" y="586.538463757396" font-size="18.43709293571" font-family="Courier New, monospace" fill="var(--ok-text)">fi</text>
  <rect x="691.4286" y="218.461565088756" width="548.5714" height="401.538434911244" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="965.7143" y="285.384637573963" text-anchor="middle" font-size="25.811930109994" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Remote Protection (GitHub/GitLab)</text>
  <text x="725.7143" y="341.153826183433" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--warn-text)">• Require pull request reviews</text>
  <text x="725.7143" y="385.769246301774" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--warn-text)">• Dismiss stale reviews</text>
  <text x="725.7143" y="430.384666420115" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--warn-text)">• Require status checks</text>
  <text x="725.7143" y="474.999971153848" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--warn-text)">• Include administrators</text>
  <text x="725.7143" y="519.615391272189" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--warn-text)">• Restrict who can push</text>
  <text x="725.7143" y="564.23081139053" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--warn-text)">• Prevent force pushes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="272.7274" height="178.461449704148" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="176.3635" y="106.923187869815" text-anchor="middle" font-size="26.582541300397" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">1. Create</text>
  <text x="176.3635" y="162.692261094678" text-anchor="middle" font-size="20.886420558176" font-family="Arial, sans-serif" fill="var(--ok-text)">Branch from main</text>
  <text x="176.3635" y="196.153681952674" text-anchor="middle" font-size="18.987713644102" font-family="Courier New, monospace" fill="var(--ok-text)">git branch feature</text>
  <rect x="349.0909" y="40" width="272.7274" height="178.461449704148" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="485.4546" y="106.923187869815" text-anchor="middle" font-size="26.582541300397" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">2. Develop</text>
  <text x="485.4546" y="162.692261094678" text-anchor="middle" font-size="20.886420558176" font-family="Arial, sans-serif" fill="var(--primary-text)">Make commits</text>
  <text x="485.4546" y="196.153681952674" text-anchor="middle" font-size="18.987713644102" font-family="Courier New, monospace" fill="var(--primary-text)">git commit</text>
  <rect x="658.1817" y="40" width="272.7274" height="178.461449704148" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="794.5454" y="106.923187869815" text-anchor="middle" font-size="26.582541300397" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">3. Merge</text>
  <text x="794.5454" y="162.692261094678" text-anchor="middle" font-size="20.886420558176" font-family="Arial, sans-serif" fill="var(--warn-text)">Integrate changes</text>
  <text x="794.5454" y="196.153681952674" text-anchor="middle" font-size="18.987713644102" font-family="Courier New, monospace" fill="var(--warn-text)">git merge feature</text>
  <rect x="967.2726" y="40" width="272.7274" height="178.461449704148" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="1103.6363" y="106.923187869815" text-anchor="middle" font-size="26.582541300397" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">4. Delete</text>
  <text x="1103.6363" y="162.692261094678" text-anchor="middle" font-size="20.886420558176" font-family="Arial, sans-serif" fill="var(--danger-text)">Clean up</text>
  <text x="1103.6363" y="196.153681952674" text-anchor="middle" font-size="18.987713644102" font-family="Courier New, monospace" fill="var(--danger-text)">git branch -d feature</text>
  <path d="M 312.7272 129.230724852074 L 349.0909 129.230724852074" stroke="var(--text)" stroke-width="1.1389" marker-end="url(#arrow)"/>
  <path d="M 621.8181 129.230724852074 L 658.1817 129.230724852074" stroke="var(--text)" stroke-width="1.1389" marker-end="url(#arrow)"/>
  <path d="M 930.9091 129.230724852074 L 967.2726 129.230724852074" stroke="var(--text)" stroke-width="1.1389" marker-end="url(#arrow)"/>
  <rect x="312.7272" y="307.69228994083" width="727.2728" height="312.30771005917" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.44503365266"/>
  <text x="676.3637" y="374.615362426037" text-anchor="middle" font-size="26.582541300397" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Best Practices</text>
  <text x="349.0909" y="430.384435650899" font-size="22.785020055022" font-family="Arial, sans-serif" fill="var(--text)">• Keep branches short-lived (days, not months)</text>
  <text x="349.0909" y="474.999971153848" font-size="22.785020055022" font-family="Arial, sans-serif" fill="var(--text)">• Delete merged branches promptly</text>
  <text x="349.0909" y="519.615160502973" font-size="22.785020055022" font-family="Arial, sans-serif" fill="var(--text)">• Use descriptive names</text>
  <text x="349.0909" y="564.230696005922" font-size="22.785020055022" font-family="Arial, sans-serif" fill="var(--text)">• One feature per branch</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

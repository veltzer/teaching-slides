<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="214.814840329218" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.429100445747" filter="url(#shadow)"/>
  <rect x="103.524" y="105.52745430024" width="72.9512" height="83.758783580611" rx="15.00123437341" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="140" y="158.148116255145" text-anchor="middle" font-size="19.542108018241" fill="var(--bg)" font-family="Arial, sans-serif">v1.0</text>
  <rect x="303.524" y="105.52745430024" width="72.9512" height="83.758783580611" rx="15.00123437341" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="340" y="158.148116255145" text-anchor="middle" font-size="19.542108018241" fill="var(--bg)" font-family="Arial, sans-serif">bug?</text>
  <rect x="503.524" y="105.52745430024" width="72.9512" height="83.758783580611" rx="15.00123437341" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="540" y="158.148116255145" text-anchor="middle" font-size="19.542108018241" fill="var(--bg)" font-family="Arial, sans-serif">feat?</text>
  <rect x="703.524" y="105.52745430024" width="72.9512" height="83.758783580611" rx="15.00123437341" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="740" y="158.148116255145" text-anchor="middle" font-size="19.542108018241" font-family="Arial, sans-serif" fill="var(--danger-text)">broken!</text>
  <rect x="903.524" y="105.52745430024" width="72.9512" height="83.758783580611" rx="15.00123437341" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="940" y="158.148116255145" text-anchor="middle" font-size="19.542108018241" font-family="Arial, sans-serif" fill="var(--danger-text)">fix?</text>
  <line x1="180" y1="147.407420164609" x2="300" y2="147.407420164609" stroke="var(--text)" stroke-width="2"/>
  <line x1="380" y1="147.407420164609" x2="500" y2="147.407420164609" stroke="var(--text)" stroke-width="2"/>
  <line x1="580" y1="147.407420164609" x2="700" y2="147.407420164609" stroke="var(--text)" stroke-width="2"/>
  <line x1="780" y1="147.407420164609" x2="900" y2="147.407420164609" stroke="var(--text)" stroke-width="2"/>
  <text x="640" y="222.592637242797" text-anchor="middle" font-size="27.358929795203" font-style="italic" font-family="Arial, sans-serif" fill="var(--danger-text)">Everything mixed together - chaos!</text>
  <rect x="40" y="297.777739506174" width="1200" height="322.222260493826" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.429100445747"/>
  <text x="640" y="362.222260493826" text-anchor="middle" font-size="31.267287107847" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Problems:</text>
  <text x="80" y="426.666666666667" font-size="23.450465330885" font-family="Arial, sans-serif" fill="var(--text)">• Can't work on features independently</text>
  <text x="80" y="469.629680658435" font-size="23.450465330885" font-family="Arial, sans-serif" fill="var(--text)">• Broken code affects everyone</text>
  <text x="80" y="512.592579835391" font-size="23.450465330885" font-family="Arial, sans-serif" fill="var(--text)">• No way to isolate experiments</text>
  <text x="80" y="555.55559382716" font-size="23.450465330885" font-family="Arial, sans-serif" fill="var(--text)">• Difficult to maintain stable version</text>
</svg>

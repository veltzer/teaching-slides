<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="600" height="267.69228994083" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="340" y="106.923072485207" text-anchor="middle" font-size="25.811930109994" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Problem: Diverged Branches</text>
  <text x="74.2857" y="162.692376479285" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--danger-text)">Your branch and origin have diverged</text>
  <text x="74.2857" y="207.307681213018" font-size="20.280802229281" font-family="Courier New, monospace" fill="var(--danger-text)">git pull --rebase</text>
  <text x="74.2857" y="251.923101331359" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--danger-text)">or merge remote changes:</text>
  <text x="74.2857" y="285.384637573963" font-size="20.280802229281" font-family="Courier New, monospace" fill="var(--danger-text)">git pull --no-rebase</text>
  <rect x="674.2857" y="40" width="565.7143" height="267.69228994083" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="957.1429" y="106.923072485207" text-anchor="middle" font-size="25.811930109994" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Problem: Detached HEAD</text>
  <text x="708.5714" y="162.692376479285" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--warn-text)">Not on any branch</text>
  <text x="708.5714" y="207.307681213018" font-size="20.280802229281" font-family="Courier New, monospace" fill="var(--warn-text)">git branch temp-branch</text>
  <text x="708.5714" y="251.923101331359" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--warn-text)">or return to branch:</text>
  <text x="708.5714" y="285.384637573963" font-size="20.280802229281" font-family="Courier New, monospace" fill="var(--warn-text)">git switch main</text>
  <rect x="40" y="352.30771005917" width="600" height="267.69228994083" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="340" y="419.230782544378" text-anchor="middle" font-size="25.811930109994" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Problem: Can't Delete Branch</text>
  <text x="74.2857" y="474.999971153848" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--primary-text)">Branch not fully merged</text>
  <text x="74.2857" y="519.615391272189" font-size="20.280802229281" font-family="Courier New, monospace" fill="var(--primary-text)">git branch -D branch-name</text>
  <text x="74.2857" y="564.23081139053" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--primary-text)">⚠️ Force delete (loses commits)</text>
  <rect x="674.2857" y="352.30771005917" width="565.7143" height="267.69228994083" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="957.1429" y="419.230782544378" text-anchor="middle" font-size="25.811930109994" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Problem: Lost Branch</text>
  <text x="708.5714" y="474.999971153848" font-size="20.280802229281" font-family="Arial, sans-serif" fill="var(--ok-text)">Accidentally deleted branch</text>
  <text x="708.5714" y="519.615391272189" font-size="20.280802229281" font-family="Courier New, monospace" fill="var(--ok-text)">git reflog | grep branch-name</text>
  <text x="708.5714" y="564.23081139053" font-size="20.280802229281" font-family="Courier New, monospace" fill="var(--ok-text)">git branch recovered abc123</text>
</svg>

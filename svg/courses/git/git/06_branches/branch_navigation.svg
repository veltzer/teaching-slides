<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <circle cx="152" cy="448" r="30.2222" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556" />
  <text x="152" y="460.4444" text-anchor="middle" font-size="16">C1</text>
  <circle cx="303.1111" cy="448" r="30.2222" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556" />
  <text x="303.1111" y="460.4444" text-anchor="middle" font-size="16">C2</text>
  <circle cx="455.1111" cy="448" r="30.2222" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556" />
  <text x="455.1111" y="460.4444" text-anchor="middle" font-size="16">C3</text>
  <line x1="182.2222" y1="448" x2="269.3333" y2="448" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="333.3333" y1="448" x2="420.4444" y2="448" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="303.1111" y="549.3333" text-anchor="middle" font-size="17.7778" fill="var(--ok-accent)" font-weight="bold">main</text>
  <circle cx="152" cy="192" r="30.2222" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.5556" />
  <text x="152" y="204.4444" text-anchor="middle" font-size="16">F1</text>
  <circle cx="303.1111" cy="192" r="30.2222" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.5556" />
  <text x="303.1111" y="204.4444" text-anchor="middle" font-size="16">F2</text>
  <circle cx="455.1111" cy="192" r="30.2222" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.5556" />
  <text x="455.1111" y="204.4444" text-anchor="middle" font-size="16">F3</text>
  <line x1="182.2222" y1="192" x2="269.3333" y2="192" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="333.3333" y1="192" x2="420.4444" y2="192" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="303.1111" y="128" text-anchor="middle" font-size="17.7778" fill="var(--info-accent)" font-weight="bold">feature</text>
  <rect x="701.3333" y="153.7778" width="95.1111" height="70.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="749.3333" y="201.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-accent)">HEAD</text>
  <line x1="701.3333" y1="192" x2="488.8889" y2="192" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <line x1="749.3333" y1="224" x2="488.8889" y2="432" stroke="var(--border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <text x="834.6667" y="320" text-anchor="start" font-size="14.2222" fill="var(--text-muted)">git switch feature</text>
  <text x="834.6667" y="377.7778" text-anchor="start" font-size="14.2222" fill="var(--text-faint)">git switch main</text>
  <text x="806.2222" y="320" text-anchor="end" font-size="21.3333" fill="var(--warn-accent)">←</text>
  <text x="806.2222" y="377.7778" text-anchor="end" font-size="21.3333" fill="var(--border)">←</text>
</svg>
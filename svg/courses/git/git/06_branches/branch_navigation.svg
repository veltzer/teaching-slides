<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="434.406" width="92.2012" height="92.2012" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.5556" filter="url(#shadow)"/>
  <text x="86.100617" y="497.637053" text-anchor="middle" font-size="24.406246" font-family="Arial, sans-serif" fill="var(--ok-text)">C1</text>
  <rect x="295.42" y="434.406" width="92.2012" height="92.2012" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.5556" filter="url(#shadow)"/>
  <text x="341.521054" y="497.637053" text-anchor="middle" font-size="24.406246" font-family="Arial, sans-serif" fill="var(--ok-text)">C2</text>
  <rect x="552.343" y="434.406" width="92.2012" height="92.2012" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.5556" filter="url(#shadow)"/>
  <text x="598.443964" y="497.637053" text-anchor="middle" font-size="24.406246" font-family="Arial, sans-serif" fill="var(--ok-text)">C3</text>
  <line x1="137.184705" y1="480.506368" x2="284.427074" y2="480.506368" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="392.60514" y1="480.506368" x2="539.847349" y2="480.506368" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="341.521054" y="620" text-anchor="middle" font-size="27.118121" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">main</text>
  <rect x="40" y="82.0007" width="92.2012" height="92.2012" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3.5556" filter="url(#shadow)"/>
  <text x="86.100617" y="145.231959" text-anchor="middle" font-size="24.406246" font-family="Arial, sans-serif" fill="var(--info-text)">F1</text>
  <rect x="295.42" y="82.0007" width="92.2012" height="92.2012" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3.5556" filter="url(#shadow)"/>
  <text x="341.521054" y="145.231959" text-anchor="middle" font-size="24.406246" font-family="Arial, sans-serif" fill="var(--info-text)">F2</text>
  <rect x="552.343" y="82.0007" width="92.2012" height="92.2012" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3.5556" filter="url(#shadow)"/>
  <text x="598.443964" y="145.231959" text-anchor="middle" font-size="24.406246" font-family="Arial, sans-serif" fill="var(--info-text)">F3</text>
  <line x1="137.184705" y1="128.101274" x2="284.427074" y2="128.101274" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="392.60514" y1="128.101274" x2="539.847349" y2="128.101274" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="341.521054" y="40" text-anchor="middle" font-size="27.118121" fill="var(--info-accent)" font-weight="bold" font-family="Arial, sans-serif">feature</text>
  <rect x="1014.629027" y="75.485218" width="160.764628" height="96.666692" rx="9.361513" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.762417" y="141.561173" text-anchor="middle" font-size="24.406246" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">HEAD</text>
  <line x1="1014.629027" y1="128.101274" x2="655.537942" y2="128.101274" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)"/>
  <line x1="1095.762417" y1="172.15191" x2="655.537942" y2="458.481049" stroke="var(--border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)"/>
  <text x="1240" y="304.303821" text-anchor="start" font-size="21.694371" fill="var(--text-muted)" font-family="Arial, sans-serif">git switch feature</text>
  <text x="1240" y="383.839676" text-anchor="start" font-size="21.694371" fill="var(--text-faint)" font-family="Arial, sans-serif">git switch main</text>
  <text x="1191.92086" y="304.303821" text-anchor="end" font-size="32.541557" fill="var(--warn-accent)" font-family="Arial, sans-serif">←</text>
  <text x="1191.92086" y="383.839676" text-anchor="end" font-size="32.541557" fill="var(--border)" font-family="Arial, sans-serif">←</text>
</svg>

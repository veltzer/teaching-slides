<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <circle cx="200.3125" cy="446" r="29.5469" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556" />
  <text x="200.3125" y="457.2777" text-anchor="middle" font-size="15.6425">C1</text>
  <circle cx="359.6875" cy="446" r="29.5469" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556" />
  <text x="359.6875" y="457.2777" text-anchor="middle" font-size="15.6425">C2</text>
  <circle cx="520" cy="446" r="29.5469" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556" />
  <text x="520" y="457.2777" text-anchor="middle" font-size="15.6425">C3</text>
  <line x1="232.1875" y1="446" x2="324.0625" y2="446" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="391.5625" y1="446" x2="483.4374" y2="446" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="359.6875" y="537.8333" text-anchor="middle" font-size="17.3806" fill="var(--ok-accent)" font-weight="bold">main</text>
  <circle cx="200.3125" cy="214" r="29.5469" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.5556" />
  <text x="200.3125" y="225.2777" text-anchor="middle" font-size="15.6425">F1</text>
  <circle cx="359.6875" cy="214" r="29.5469" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.5556" />
  <text x="359.6875" y="225.2777" text-anchor="middle" font-size="15.6425">F2</text>
  <circle cx="520" cy="214" r="29.5469" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.5556" />
  <text x="520" y="225.2777" text-anchor="middle" font-size="15.6425">F3</text>
  <line x1="232.1875" y1="214" x2="324.0625" y2="214" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="391.5625" y1="214" x2="483.4374" y2="214" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="359.6875" y="156" text-anchor="middle" font-size="17.3806" fill="var(--info-accent)" font-weight="bold">feature</text>
  <rect x="779.6875" y="179.3611" width="100.3125" height="63.6389" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="830.3124" y="222.8611" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--warn-accent)">HEAD</text>
  <line x1="779.6875" y1="214" x2="555.625" y2="214" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <line x1="830.3124" y1="243" x2="555.625" y2="431.5" stroke="var(--border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <text x="920.3125" y="330" text-anchor="start" font-size="13.9044" fill="var(--text-muted)">git switch feature</text>
  <text x="920.3125" y="382.3611" text-anchor="start" font-size="13.9044" fill="var(--text-faint)">git switch main</text>
  <text x="890.3125" y="330" text-anchor="end" font-size="20.8566" fill="var(--warn-accent)">←</text>
  <text x="890.3125" y="382.3611" text-anchor="end" font-size="20.8566" fill="var(--border)">←</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="434.406" width="92.2012" height="92.2012" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556"/>
  <text x="86.100617" y="497.637053" text-anchor="middle" font-size="24.406246">C1</text>
  <rect x="295.42" y="434.406" width="92.2012" height="92.2012" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556"/>
  <text x="341.521054" y="497.637053" text-anchor="middle" font-size="24.406246">C2</text>
  <rect x="552.343" y="434.406" width="92.2012" height="92.2012" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556"/>
  <text x="598.443964" y="497.637053" text-anchor="middle" font-size="24.406246">C3</text>
  <line x1="137.184705" y1="480.506368" x2="284.427074" y2="480.506368" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="392.60514" y1="480.506368" x2="539.847349" y2="480.506368" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="341.521054" y="620" text-anchor="middle" font-size="27.118121" fill="var(--ok-accent)" font-weight="bold">main</text>
  <rect x="40" y="82.0007" width="92.2012" height="92.2012" rx="14" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.5556"/>
  <text x="86.100617" y="145.231959" text-anchor="middle" font-size="24.406246">F1</text>
  <rect x="295.42" y="82.0007" width="92.2012" height="92.2012" rx="14" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.5556"/>
  <text x="341.521054" y="145.231959" text-anchor="middle" font-size="24.406246">F2</text>
  <rect x="552.343" y="82.0007" width="92.2012" height="92.2012" rx="14" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.5556"/>
  <text x="598.443964" y="145.231959" text-anchor="middle" font-size="24.406246">F3</text>
  <line x1="137.184705" y1="128.101274" x2="284.427074" y2="128.101274" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="392.60514" y1="128.101274" x2="539.847349" y2="128.101274" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="341.521054" y="40" text-anchor="middle" font-size="27.118121" fill="var(--info-accent)" font-weight="bold">feature</text>
  <rect x="1014.629027" y="75.485218" width="160.764628" height="96.666692" rx="9.361513" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1095.762417" y="141.561173" text-anchor="middle" font-size="24.406246" font-weight="bold" fill="var(--warn-accent)">HEAD</text>
  <line x1="1014.629027" y1="128.101274" x2="655.537942" y2="128.101274" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <line x1="1095.762417" y1="172.15191" x2="655.537942" y2="458.481049" stroke="var(--border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" marker-end="url(#arrow)" />
  <text x="1240" y="304.303821" text-anchor="start" font-size="21.694371" fill="var(--text-muted)">git switch feature</text>
  <text x="1240" y="383.839676" text-anchor="start" font-size="21.694371" fill="var(--text-faint)">git switch main</text>
  <text x="1191.92086" y="304.303821" text-anchor="end" font-size="32.541557" fill="var(--warn-accent)">←</text>
  <text x="1191.92086" y="383.839676" text-anchor="end" font-size="32.541557" fill="var(--border)">←</text>
</svg>
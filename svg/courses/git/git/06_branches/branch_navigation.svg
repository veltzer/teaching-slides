<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- main branch commits -->
  <circle cx="171" cy="504" r="34" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/>
  <text x="171" y="518" text-anchor="middle" font-size="18">C1</text>
  <circle cx="341" cy="504" r="34" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/>
  <text x="341" y="518" text-anchor="middle" font-size="18">C2</text>
  <circle cx="512" cy="504" r="34" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/>
  <text x="512" y="518" text-anchor="middle" font-size="18">C3</text>
  <line x1="205" y1="504" x2="303" y2="504" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="375" y1="504" x2="473" y2="504" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="341" y="618" text-anchor="middle" font-size="20" fill="#2e7d32" font-weight="bold">main</text>
  <!-- feature branch commits -->
  <circle cx="171" cy="216" r="34" fill="#f3e5f5" stroke="#9c27b0" stroke-width="4"/>
  <text x="171" y="230" text-anchor="middle" font-size="18">F1</text>
  <circle cx="341" cy="216" r="34" fill="#f3e5f5" stroke="#9c27b0" stroke-width="4"/>
  <text x="341" y="230" text-anchor="middle" font-size="18">F2</text>
  <circle cx="512" cy="216" r="34" fill="#f3e5f5" stroke="#9c27b0" stroke-width="4"/>
  <text x="512" y="230" text-anchor="middle" font-size="18">F3</text>
  <line x1="205" y1="216" x2="303" y2="216" stroke="#9c27b0" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="375" y1="216" x2="473" y2="216" stroke="#9c27b0" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="341" y="144" text-anchor="middle" font-size="20" fill="#9c27b0" font-weight="bold">feature</text>
  <!-- HEAD box -->
  <rect x="789" y="173" width="107" height="79" rx="8" fill="#fff9c4" stroke="#f57f17" stroke-width="3"/>
  <text x="843" y="227" text-anchor="middle" font-size="18" font-weight="bold" fill="#f57f17">HEAD</text>
  <!-- HEAD arrows -->
  <line x1="789" y1="216" x2="550" y2="216" stroke="#f57f17" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <line x1="843" y1="252" x2="550" y2="486" stroke="#bbb" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <!-- Labels -->
  <text x="939" y="360" text-anchor="start" font-size="16" fill="#555">git switch feature</text>
  <text x="939" y="425" text-anchor="start" font-size="16" fill="#999">git switch main</text>
  <text x="907" y="360" text-anchor="end" font-size="24" fill="#f57f17">←</text>
  <text x="907" y="425" text-anchor="end" font-size="24" fill="#bbb">←</text>
</svg>

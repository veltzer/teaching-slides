<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="132.3078" y1="233.333466666667" x2="1240" y2="233.333466666667" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="40" y="245.416666666667" font-size="23.897220462082" font-family="Arial, sans-serif" fill="var(--text)">main</text>
  <rect x="207.369" y="210.338666666667" width="34.4928" height="45.9904" rx="16.16580753731" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="484.292" y="210.338666666667" width="34.4928" height="45.9904" rx="16.16580753731" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="853.523" y="210.338666666667" width="34.4928" height="45.9904" rx="16.16580753731" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="1130.45" y="210.338666666667" width="34.4928" height="45.9904" rx="16.16580753731" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <line x1="316.9231" y1="233.333466666667" x2="409.2308" y2="88.333333333333" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="409.2308" y1="88.333333333333" x2="593.8462" y2="88.333333333333" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="593.8462" y1="88.333333333333" x2="686.1539" y2="233.333466666667" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="501.5385" y="64.166666666667" text-anchor="middle" font-size="21.905708443539" font-family="Arial, sans-serif" fill="var(--text)">feature</text>
  <rect x="723.077" y="40" width="184.6154" height="96.666666666667" fill="url(#grad-info)" rx="6.928203230276" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="815.3846" y="100.416666666667" text-anchor="middle" font-size="23.897220462082" fill="var(--bg)" font-family="Arial, sans-serif">PR/Review</text>
  <rect x="316.9231" y="378.333333333333" width="738.4616" height="241.666666666667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.928203230276"/>
  <text x="686.1539" y="438.75" text-anchor="middle" font-size="27.880129029113" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Simple Rules:</text>
  <text x="353.8462" y="499.166666666667" font-size="23.897220462082" font-family="Arial, sans-serif" fill="var(--text)">1. main is always deployable</text>
  <text x="353.8462" y="547.5" font-size="23.897220462082" font-family="Arial, sans-serif" fill="var(--text)">2. Branch from main for features</text>
  <text x="723.077" y="499.166666666667" font-size="23.897220462082" font-family="Arial, sans-serif" fill="var(--text)">3. Open PR for discussion</text>
  <text x="723.077" y="547.5" font-size="23.897220462082" font-family="Arial, sans-serif" fill="var(--text)">4. Merge after review</text>
  <text x="686.1539" y="595.833333333333" text-anchor="middle" font-size="21.905708443539" font-style="italic" font-family="Arial, sans-serif" fill="var(--text)">Perfect for continuous deployment</text>
</svg>

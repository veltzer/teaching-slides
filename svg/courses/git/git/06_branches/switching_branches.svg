<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="548.5714" height="248.571363265293" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.414270437846" filter="url(#shadow)"/>
  <text x="314.2857" y="102.142755102021" text-anchor="middle" font-size="28.426336108417" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">On main branch</text>
  <text x="74.2857" y="153.928479591819" font-size="21.319752081313" font-family="Courier New, monospace" fill="var(--ok-text)">index.html (v1)</text>
  <text x="74.2857" y="195.357059183657" font-size="21.319752081313" font-family="Courier New, monospace" fill="var(--ok-text)">style.css (v1)</text>
  <text x="74.2857" y="236.785753061232" font-size="21.319752081313" font-family="Courier New, monospace" fill="var(--ok-text)">app.js (v1)</text>
  <rect x="691.4286" y="40" width="548.5714" height="248.571363265293" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.414270437846" filter="url(#shadow)"/>
  <text x="965.7142" y="102.142755102021" text-anchor="middle" font-size="28.426336108417" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">After switch to feature</text>
  <text x="725.7142" y="153.928479591819" font-size="21.319752081313" font-family="Courier New, monospace" fill="var(--primary-text)">index.html (v2)</text>
  <text x="725.7142" y="195.357059183657" font-size="21.319752081313" font-family="Courier New, monospace" fill="var(--primary-text)">style.css (v2)</text>
  <text x="725.7142" y="236.785753061232" font-size="21.319752081313" font-family="Courier New, monospace" fill="var(--primary-text)">app.js (v2)</text>
  <text x="725.7142" y="278.214218367334" font-size="21.319752081313" font-family="Courier New, monospace" fill="var(--primary-text)">new-file.js (new!)</text>
  <path d="M 588.5714 164.285624489778 L 691.4286 164.285624489778" stroke="var(--text)" stroke-width="4.4651" marker-end="url(#arrow)"/>
  <text x="639.9999" y="143.571334693859" text-anchor="middle" font-size="21.319752081313" font-family="Arial, sans-serif" fill="var(--text)">git switch feature</text>
  <rect x="297.1428" y="371.428636734707" width="685.7142" height="248.571363265293" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.414270437846" filter="url(#shadow)"/>
  <text x="639.9999" y="433.571391836727" text-anchor="middle" font-size="28.426336108417" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">⚠️ Warning: Uncommitted Changes</text>
  <text x="331.4286" y="495.714261224485" font-size="21.319752081313" font-family="Arial, sans-serif" fill="var(--danger-text)">Git will prevent switching if you have changes that</text>
  <text x="331.4286" y="537.14295510206" font-size="21.319752081313" font-family="Arial, sans-serif" fill="var(--danger-text)">would be overwritten. Options:</text>
  <text x="331.4286" y="578.571420408162" font-size="21.319752081313" font-family="Arial, sans-serif" fill="var(--danger-text)">• Commit changes • Stash changes • Force switch (lose changes)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

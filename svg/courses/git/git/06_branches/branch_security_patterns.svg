<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="151.304291682445" fill="url(#grad-ok)" rx="6.500834580309" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="103.043797258833" text-anchor="middle" font-size="27.443814916989" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Environment Branches</text>
  <text x="640" y="153.478482892148" text-anchor="middle" font-size="23.523269928848" fill="var(--bg)" font-family="Arial, sans-serif">main → staging → production</text>
  <rect x="40" y="241.739212098261" width="377.1429" height="252.173897731576" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.500834580309" filter="url(#shadow)"/>
  <text x="228.5713" y="304.782891965844" text-anchor="middle" font-size="27.443814916989" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Development</text>
  <text x="228.5713" y="355.217460207908" text-anchor="middle" font-size="21.562943261156" font-family="Arial, sans-serif" fill="var(--ok-text)">Branch: main</text>
  <text x="228.5713" y="405.652263232473" text-anchor="middle" font-size="21.562943261156" font-family="Arial, sans-serif" fill="var(--ok-text)">• Latest features</text>
  <text x="228.5713" y="456.086948865788" text-anchor="middle" font-size="21.562943261156" font-family="Arial, sans-serif" fill="var(--ok-text)">• May be unstable</text>
  <rect x="451.4286" y="241.739212098261" width="377.1429" height="252.173897731576" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.500834580309" filter="url(#shadow)"/>
  <text x="640" y="304.782891965844" text-anchor="middle" font-size="27.443814916989" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Staging</text>
  <text x="640" y="355.217460207908" text-anchor="middle" font-size="21.562943261156" font-family="Arial, sans-serif" fill="var(--warn-text)">Branch: staging</text>
  <text x="640" y="405.652263232473" text-anchor="middle" font-size="21.562943261156" font-family="Arial, sans-serif" fill="var(--warn-text)">• Pre-production testing</text>
  <text x="640" y="456.086948865788" text-anchor="middle" font-size="21.562943261156" font-family="Arial, sans-serif" fill="var(--warn-text)">• Release candidates</text>
  <rect x="862.8571" y="241.739212098261" width="377.1429" height="252.173897731576" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.500834580309" filter="url(#shadow)"/>
  <text x="1051.4286" y="304.782891965844" text-anchor="middle" font-size="27.443814916989" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Production</text>
  <text x="1051.4286" y="355.217460207908" text-anchor="middle" font-size="21.562943261156" font-family="Arial, sans-serif" fill="var(--danger-text)">Branch: production</text>
  <text x="1051.4286" y="405.652263232473" text-anchor="middle" font-size="21.562943261156" font-family="Arial, sans-serif" fill="var(--danger-text)">• Live code only</text>
  <text x="1051.4286" y="456.086948865788" text-anchor="middle" font-size="21.562943261156" font-family="Arial, sans-serif" fill="var(--danger-text)">• Restricted access</text>
  <path d="M 417.1428 367.826219659675 L 451.4286 367.826219659675" stroke="var(--text)" stroke-width="1.3756" marker-end="url(#arrow)"/>
  <path d="M 828.5714 367.826219659675 L 862.8571 367.826219659675" stroke="var(--text)" stroke-width="1.3756" marker-end="url(#arrow)"/>
  <text x="640" y="569.565431757936" text-anchor="middle" font-size="23.523269928848" font-family="Arial, sans-serif" fill="var(--text)">Progressive promotion through environments</text>
  <text x="640" y="620" text-anchor="middle" font-size="21.562943261156" font-style="italic" font-family="Arial, sans-serif" fill="var(--text)">Each branch has different protection levels</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

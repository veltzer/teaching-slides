  <text x="500" y="163.66037735849" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--ok-text)">feature</text>

  <text x="337" y="313.584905660377" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--ok-text)">Linear, no merge commit</text>
  <text x="337" y="357.358490566038" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Main pointer moves forward</text>

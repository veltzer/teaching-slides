<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="151.962169" y1="605.4088" x2="1226.797915" y2="605.4088" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="138.761885" y="592.208" width="26.401369" height="26.4014" rx="13.200692" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="4.2376" filter="url(#shadow)"/>
  <rect x="586.609362" y="592.208" width="26.401369" height="26.4014" rx="13.200692" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="4.2376" filter="url(#shadow)"/>
  <rect x="1213.598631" y="592.208" width="26.401369" height="26.4014" rx="13.200692" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="4.2376" filter="url(#shadow)"/>
  <text x="40" y="620" text-anchor="middle" font-size="24.201286" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">main</text>
  <line x1="151.962169" y1="404.7799" x2="1226.797915" y2="404.7799" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="138.761885" y="391.579" width="26.401369" height="26.4014" rx="13.200692" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="4.2376" filter="url(#shadow)"/>
  <rect x="317.900676" y="391.579" width="26.401369" height="26.4014" rx="13.200692" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="4.2376" filter="url(#shadow)"/>
  <rect x="676.179258" y="391.579" width="26.401369" height="26.4014" rx="13.200692" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="4.2376" filter="url(#shadow)"/>
  <rect x="944.887944" y="391.579" width="26.401369" height="26.4014" rx="13.200692" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="4.2376" filter="url(#shadow)"/>
  <rect x="1213.598631" y="391.579" width="26.401369" height="26.4014" rx="13.200692" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="4.2376" filter="url(#shadow)"/>
  <text x="40" y="419.3711" text-anchor="middle" font-size="24.201286" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">dev</text>
  <line x1="331.10136" y1="404.7799" x2="375.886208" y2="222.3899" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="375.886208" y1="222.3899" x2="599.810347" y2="222.3899" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="599.810347" y1="222.3899" x2="689.380042" y2="404.7799" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="364.885621" y="211.389" width="22.001174" height="22.0012" rx="11.000594" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3.1782" filter="url(#shadow)"/>
  <rect x="476.84749" y="211.389" width="22.001174" height="22.0012" rx="11.000594" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3.1782" filter="url(#shadow)"/>
  <rect x="588.80936" y="211.389" width="22.001174" height="22.0012" rx="11.000594" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3.1782" filter="url(#shadow)"/>
  <text x="487.848278" y="185.9119" text-anchor="middle" font-size="22.000987" fill="var(--info-accent)" font-family="Arial, sans-serif">feature</text>
  <line x1="689.380042" y1="404.7799" x2="734.16479" y2="222.3899" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="734.16479" y1="222.3899" x2="913.304181" y2="222.3899" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="913.304181" y1="222.3899" x2="958.089029" y2="404.7799" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="913.304181" y1="222.3899" x2="980.481403" y2="605.4088" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.475 6.3563" marker-end="url(#arrow)"/>
  <rect x="723.164203" y="211.389" width="22.001174" height="22.0012" rx="11.000594" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3.1782" filter="url(#shadow)"/>
  <rect x="812.734098" y="211.389" width="22.001174" height="22.0012" rx="11.000594" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3.1782" filter="url(#shadow)"/>
  <rect x="902.303994" y="211.389" width="22.001174" height="22.0012" rx="11.000594" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3.1782" filter="url(#shadow)"/>
  <text x="823.734386" y="185.9119" text-anchor="middle" font-size="22.000987" fill="var(--warn-accent)" font-family="Arial, sans-serif">release</text>
  <line x1="599.810347" y1="605.4088" x2="644.595195" y2="69.1823" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="644.595195" y1="69.1823" x2="778.949638" y2="69.1823" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="778.949638" y1="69.1823" x2="823.734386" y2="404.7799" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.475 6.3563" marker-end="url(#arrow)"/>
  <line x1="778.949638" y1="69.1823" x2="801.342012" y2="605.4088" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.475 6.3563" marker-end="url(#arrow)"/>
  <rect x="633.594307" y="58.1817" width="22.001174" height="22.0012" rx="11.000594" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="3.1782" filter="url(#shadow)"/>
  <rect x="767.949151" y="58.1817" width="22.001174" height="22.0012" rx="11.000594" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="3.1782" filter="url(#shadow)"/>
  <text x="711.772416" y="40" text-anchor="middle" font-size="22.000987" fill="var(--danger-accent)" font-family="Arial, sans-serif">hotfix</text>
</svg>

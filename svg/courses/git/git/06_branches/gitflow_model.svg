  <text x="805.1314" y="214.5251" text-anchor="middle" font-size="21.1876" font-family="sans-serif" fill="var(--warn-accent)">release</text>
  <line x1="593.2547" y1="625.6983" x2="635.63" y2="100.1117" stroke="var(--danger-border)" stroke-width="2" />

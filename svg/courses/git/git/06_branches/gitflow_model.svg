  <line x1="339.0027" y1="429.0503" x2="381.378" y2="250.2793" stroke="var(--info-border)" stroke-width="2" />
  <line x1="381.378" y1="250.2793" x2="593.2547" y2="250.2793" stroke="var(--info-border)" stroke-width="2" />
  <line x1="593.2547" y1="250.2793" x2="678.0054" y2="429.0503" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrowGF)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="402.928" width="94.7559" height="94.7559" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.5556" filter="url(#shadow)"/>
  <text x="87.377965" y="468.034864" text-anchor="middle" font-size="22.442163" font-family="Arial, sans-serif" fill="var(--ok-text)">C1</text>
  <rect x="275.68" y="402.928" width="94.7559" height="94.7559" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.5556" filter="url(#shadow)"/>
  <text x="323.057869" y="468.034864" text-anchor="middle" font-size="22.442163" font-family="Arial, sans-serif" fill="var(--ok-text)">C2</text>
  <rect x="511.36" y="402.928" width="94.7559" height="94.7559" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.5556" filter="url(#shadow)"/>
  <text x="558.737775" y="468.034864" text-anchor="middle" font-size="22.442163" font-family="Arial, sans-serif" fill="var(--ok-text)">C3</text>
  <rect x="747.04" y="402.928" width="94.7559" height="94.7559" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.5556" filter="url(#shadow)"/>
  <text x="794.417679" y="468.034864" text-anchor="middle" font-size="22.442163" font-family="Arial, sans-serif" fill="var(--ok-text)">C4</text>
  <line x1="134.022946" y1="450.305726" x2="271.50289" y2="450.305726" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="369.702719" y1="450.305726" x2="507.182796" y2="450.305726" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="605.382755" y1="450.305726" x2="742.8627" y2="450.305726" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="794.417679" y="620" text-anchor="middle" font-size="24.935802" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">main</text>
  <line x1="589.425262" y1="376.855814" x2="715.857711" y2="199.563338" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="720.035" y="83.8011" width="94.7559" height="94.7559" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3.5556" filter="url(#shadow)"/>
  <text x="767.412559" y="148.908188" text-anchor="middle" font-size="22.442163" font-family="Arial, sans-serif" fill="var(--info-text)">F1</text>
  <rect x="955.715" y="83.8011" width="94.7559" height="94.7559" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3.5556" filter="url(#shadow)"/>
  <text x="1003.092596" y="148.908188" text-anchor="middle" font-size="22.442163" font-family="Arial, sans-serif" fill="var(--info-text)">F2</text>
  <line x1="814.057672" y1="131.17905" x2="951.537617" y2="131.17905" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1003.092596" y="40" text-anchor="middle" font-size="24.935802" fill="var(--info-accent)" font-weight="bold" font-family="Arial, sans-serif">feature</text>
  <rect x="1108.657552" y="62.794763" width="131.342448" height="100.043698" rx="8.608149" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1173.715027" y="131.17905" text-anchor="middle" font-size="22.442163" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">HEAD</text>
  <line x1="1108.657552" y1="121.048115" x2="1055.874943" y2="131.17905" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- main branch -->
  <circle cx="171" cy="468" r="38" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/>
  <text x="171" y="482" text-anchor="middle" font-size="18">C1</text>
  <circle cx="363" cy="468" r="38" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/>
  <text x="363" y="482" text-anchor="middle" font-size="18">C2</text>
  <circle cx="555" cy="468" r="38" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/>
  <text x="555" y="482" text-anchor="middle" font-size="18">C3</text>
  <circle cx="747" cy="468" r="38" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/>
  <text x="747" y="482" text-anchor="middle" font-size="18">C4</text>
  <line x1="209" y1="468" x2="321" y2="468" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="401" y1="468" x2="513" y2="468" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="593" y1="468" x2="705" y2="468" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="747" y="602" text-anchor="middle" font-size="20" fill="#2e7d32" font-weight="bold">main</text>
  <!-- feature branch diverges from C3 -->
  <line x1="580" y1="410" x2="683" y2="270" stroke="#9c27b0" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="725" cy="216" r="38" fill="#f3e5f5" stroke="#9c27b0" stroke-width="4"/>
  <text x="725" y="230" text-anchor="middle" font-size="18">F1</text>
  <circle cx="917" cy="216" r="38" fill="#f3e5f5" stroke="#9c27b0" stroke-width="4"/>
  <text x="917" y="230" text-anchor="middle" font-size="18">F2</text>
  <line x1="763" y1="216" x2="875" y2="216" stroke="#9c27b0" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="917" y="144" text-anchor="middle" font-size="20" fill="#9c27b0" font-weight="bold">feature</text>
  <!-- HEAD box -->
  <rect x="1003" y="162" width="107" height="79" rx="8" fill="#fff9c4" stroke="#f57f17" stroke-width="3"/>
  <text x="1056" y="216" text-anchor="middle" font-size="18" font-weight="bold" fill="#f57f17">HEAD</text>
  <line x1="1003" y1="208" x2="960" y2="216" stroke="#f57f17" stroke-width="3" marker-end="url(#arrow)"/>
</svg>

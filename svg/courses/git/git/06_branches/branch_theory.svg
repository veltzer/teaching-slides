<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="402.928" width="94.7559" height="94.7559" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556"/>
  <text x="87.377965" y="468.034864" text-anchor="middle" font-size="22.442163">C1</text>
  <rect x="275.68" y="402.928" width="94.7559" height="94.7559" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556"/>
  <text x="323.057869" y="468.034864" text-anchor="middle" font-size="22.442163">C2</text>
  <rect x="511.36" y="402.928" width="94.7559" height="94.7559" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556"/>
  <text x="558.737775" y="468.034864" text-anchor="middle" font-size="22.442163">C3</text>
  <rect x="747.04" y="402.928" width="94.7559" height="94.7559" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.5556"/>
  <text x="794.417679" y="468.034864" text-anchor="middle" font-size="22.442163">C4</text>
  <line x1="134.022946" y1="450.305726" x2="271.50289" y2="450.305726" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="369.702719" y1="450.305726" x2="507.182796" y2="450.305726" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="605.382755" y1="450.305726" x2="742.8627" y2="450.305726" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="794.417679" y="620" text-anchor="middle" font-size="24.935802" fill="var(--ok-accent)" font-weight="bold">main</text>
  <line x1="589.425262" y1="376.855814" x2="715.857711" y2="199.563338" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="720.035" y="83.8011" width="94.7559" height="94.7559" rx="14" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.5556"/>
  <text x="767.412559" y="148.908188" text-anchor="middle" font-size="22.442163">F1</text>
  <rect x="955.715" y="83.8011" width="94.7559" height="94.7559" rx="14" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.5556"/>
  <text x="1003.092596" y="148.908188" text-anchor="middle" font-size="22.442163">F2</text>
  <line x1="814.057672" y1="131.17905" x2="951.537617" y2="131.17905" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1003.092596" y="40" text-anchor="middle" font-size="24.935802" fill="var(--info-accent)" font-weight="bold">feature</text>
  <rect x="1108.657552" y="62.794763" width="131.342448" height="100.043698" rx="8.608149" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1173.715027" y="131.17905" text-anchor="middle" font-size="22.442163" font-weight="bold" fill="var(--warn-accent)">HEAD</text>
  <line x1="1108.657552" y1="121.048115" x2="1055.874943" y2="131.17905" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
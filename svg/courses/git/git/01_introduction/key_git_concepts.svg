<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="38.2222" y="192" width="264.8889" height="192" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3.5556" rx="14.2222" filter="url(#shadow)" />
  <ns0:text x="170.6667" y="272" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#1565c0">Working</ns0:text>
  <ns0:text x="170.6667" y="311.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#1565c0">Directory</ns0:text>
  <ns0:rect x="436.4444" y="192" width="264.8889" height="192" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3.5556" rx="14.2222" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="272" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#7b1fa2">Staging Area</ns0:text>
  <ns0:text x="568.8889" y="311.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#7b1fa2">(Index)</ns0:text>
  <ns0:rect x="834.6667" y="192" width="264.8889" height="192" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.5556" rx="14.2222" filter="url(#shadow)" />
  <ns0:text x="967.1111" y="272" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#2e7d32">Local</ns0:text>
  <ns0:text x="967.1111" y="311.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#2e7d32">Repository</ns0:text>
  <ns0:line x1="303.1111" y1="288" x2="432" y2="288" stroke="#555" stroke-width="3.5556" marker-end="url(#arrow)" />
  <ns0:text x="368" y="266.6667" text-anchor="middle" font-size="17.7778" fill="#555" font-style="italic">git add</ns0:text>
  <ns0:line x1="701.3333" y1="288" x2="830.2222" y2="288" stroke="#555" stroke-width="3.5556" marker-end="url(#arrow)" />
  <ns0:text x="766.2222" y="266.6667" text-anchor="middle" font-size="17.7778" fill="#555" font-style="italic">git commit</ns0:text>
  <ns0:text x="568.8889" y="506.6667" text-anchor="middle" font-size="17.7778" fill="#777">The three main areas of a Git project</ns0:text>
</ns0:svg>
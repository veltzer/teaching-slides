<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Working Directory -->
  <rect x="43" y="216" width="298" height="216" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="192" y="306" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Working</text>
  <text x="192" y="350" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Directory</text>
  <!-- Staging Area -->
  <rect x="491" y="216" width="298" height="216" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="640" y="306" text-anchor="middle" font-size="22" font-weight="bold" fill="#7b1fa2">Staging Area</text>
  <text x="640" y="350" text-anchor="middle" font-size="22" font-weight="bold" fill="#7b1fa2">(Index)</text>
  <!-- Local Repository -->
  <rect x="939" y="216" width="298" height="216" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="1088" y="306" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">Local</text>
  <text x="1088" y="350" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">Repository</text>
  <!-- Arrows -->
  <line x1="341" y1="324" x2="486" y2="324" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="414" y="300" text-anchor="middle" font-size="20" fill="#555" font-style="italic">git add</text>
  <line x1="789" y1="324" x2="934" y2="324" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="862" y="300" text-anchor="middle" font-size="20" fill="#555" font-style="italic">git commit</text>
  <text x="640" y="570" text-anchor="middle" font-size="20" fill="#777">The three main areas of a Git project</text>
</svg>

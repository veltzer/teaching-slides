<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="342.8572" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.681316774616" filter="url(#shadow)"/>
  <text x="211.4285" y="109.60007439999" text-anchor="middle" font-size="33.843987411256" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Working Directory</text>
  <text x="211.4285" y="179.200024799997" text-anchor="middle" font-size="26.32316318391" font-family="Arial, sans-serif" fill="var(--warn-text)">Files you see</text>
  <text x="211.4285" y="225.60007439999" text-anchor="middle" font-size="26.32316318391" font-family="Arial, sans-serif" fill="var(--warn-text)">and edit</text>
  <rect x="468.5714" y="40" width="342.8572" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.681316774616" filter="url(#shadow)"/>
  <text x="639.9999" y="109.60007439999" text-anchor="middle" font-size="33.843987411256" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Staging Area</text>
  <text x="639.9999" y="179.200024799997" text-anchor="middle" font-size="26.32316318391" font-family="Arial, sans-serif" fill="var(--ok-text)">Files ready to</text>
  <text x="639.9999" y="225.60007439999" text-anchor="middle" font-size="26.32316318391" font-family="Arial, sans-serif" fill="var(--ok-text)">be committed</text>
  <rect x="897.1428" y="40" width="342.8572" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.681316774616" filter="url(#shadow)"/>
  <text x="1068.5715" y="109.60007439999" text-anchor="middle" font-size="33.843987411256" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Repository</text>
  <text x="1068.5715" y="179.200024799997" text-anchor="middle" font-size="26.32316318391" font-family="Arial, sans-serif" fill="var(--primary-text)">Committed</text>
  <text x="1068.5715" y="225.60007439999" text-anchor="middle" font-size="26.32316318391" font-family="Arial, sans-serif" fill="var(--primary-text)">snapshots</text>
  <path d="M 382.8572 330.000123999983 L 451.4285 330.000123999983" stroke="var(--text)" stroke-width="1.9557" marker-end="url(#arrow)"/>
  <text x="417.1429" y="306.799975200003" text-anchor="middle" font-size="22.562695392597" font-family="Arial, sans-serif" fill="var(--text)">git add</text>
  <path d="M 811.4286 330.000123999983 L 880 330.000123999983" stroke="var(--text)" stroke-width="1.9557" marker-end="url(#arrow)"/>
  <text x="845.7143" y="306.799975200003" text-anchor="middle" font-size="22.562695392597" font-family="Arial, sans-serif" fill="var(--text)">git commit</text>
  <path d="M 897.1428 446 Q 639.9999 550.400049599993 382.8572 446" stroke="var(--text)" stroke-width="1.9557" marker-end="url(#arrow)" fill="none"/>
  <text x="639.9999" y="596.800099199986" text-anchor="middle" font-size="22.562695392597" font-family="Arial, sans-serif" fill="var(--ok-text)">git checkout</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="148.7499" font-size="31.3401" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">File A:</text>
  <rect x="194.8386" y="40" width="206.4516" height="205.4166" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="298.0645" y="172.9168" font-size="28.9294" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">version 1</text>
  <line x1="401.2903" y1="142.7084" x2="491.613" y2="142.7084" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="491.613" y="40" width="180.6451" height="205.4166" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="581.9354" y="172.9168" font-size="28.9294" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">+5 lines</text>
  <line x1="672.2581" y1="142.7084" x2="762.5807" y2="142.7084" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="762.5807" y="40" width="180.6451" height="205.4166" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="852.9032" y="172.9168" font-size="28.9294" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">-2 lines</text>
  <line x1="943.2258" y1="142.7084" x2="1033.5485" y2="142.7084" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1033.5485" y="40" width="180.6451" height="205.4166" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1123.8709" y="172.9168" font-size="28.9294" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">+1 line</text>
  <text x="40" y="523.3334" font-size="31.3401" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">File B:</text>
  <rect x="194.8386" y="414.5834" width="206.4516" height="205.4166" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="298.0645" y="547.5" font-size="28.9294" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">version 1</text>
  <line x1="401.2903" y1="517.2917" x2="491.613" y2="517.2917" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="491.613" y="414.5834" width="206.4516" height="205.4166" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="594.8387" y="547.5" font-size="28.9294" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">+10 lines</text>
  <line x1="698.0646" y1="517.2917" x2="788.387" y2="517.2917" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="788.387" y="414.5834" width="180.6451" height="205.4166" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="878.7097" y="547.5" font-size="28.9294" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">-5 lines</text>
  <line x1="969.0323" y1="517.2917" x2="1059.3549" y2="517.2917" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1059.3549" y="414.5834" width="180.6451" height="205.4166" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1149.6774" y="547.5" font-size="28.9294" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">+3 lines</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="102.702703" text-anchor="middle" font-size="20.414955" fill="var(--text-muted)" font-family="Arial, sans-serif">Object Store:</text>
  <rect x="424.047729" y="40" width="306.281157" height="125.405405" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.047497" filter="url(#shadow)"/>
  <text x="577.188435" y="111.411459" text-anchor="middle" font-size="22.456379" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Commit</text>
  <rect x="424.047729" y="259.459459" width="306.281157" height="125.405405" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.047497" filter="url(#shadow)"/>
  <text x="577.188435" y="330.870919" text-anchor="middle" font-size="22.456379" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Tree</text>
  <rect x="41.196411" y="494.594595" width="279.96012" height="125.405405" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.047497" filter="url(#shadow)"/>
  <text x="181.176471" y="566.006054" text-anchor="middle" font-size="22.456379" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Blob (file)</text>
  <rect x="449.172483" y="494.594595" width="279.96012" height="125.405405" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.047497" filter="url(#shadow)"/>
  <text x="589.152542" y="566.006054" text-anchor="middle" font-size="22.456379" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Blob (file)</text>
  <rect x="960.03988" y="40" width="279.96012" height="125.405405" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.047497" filter="url(#shadow)"/>
  <text x="1100.01994" y="111.411459" text-anchor="middle" font-size="22.456379" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Tag</text>
  <line x1="960.03988" y1="102.702703" x2="735.114656" y2="102.702703" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="577.188435" y1="165.405405" x2="577.188435" y2="253.363351" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="474.297109" y1="384.864865" x2="257.74676" y2="488.498486" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="627.437687" y1="384.864865" x2="589.152542" y2="488.498486" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="170" y="108" text-anchor="middle" font-size="20" fill="#777">Object Store:</text>
  <!-- Commit box -->
  <rect x="491" y="36" width="256" height="144" fill="#fff3e0" stroke="#f57c00" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="619" y="118" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">Commit</text>
  <!-- Tree box -->
  <rect x="491" y="288" width="256" height="144" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="619" y="370" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">Tree</text>
  <!-- Blob boxes -->
  <rect x="171" y="558" width="234" height="144" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="288" y="640" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Blob (file)</text>
  <rect x="512" y="558" width="234" height="144" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="629" y="640" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Blob (file)</text>
  <!-- Tag box -->
  <rect x="939" y="36" width="234" height="144" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="4" rx="16" filter="url(#shadow)"/>
  <text x="1056" y="118" text-anchor="middle" font-size="22" font-weight="bold" fill="#7b1fa2">Tag</text>
  <!-- Arrows -->
  <line x1="939" y1="108" x2="751" y2="108" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="619" y1="180" x2="619" y2="281" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="533" y1="432" x2="352" y2="551" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="661" y1="432" x2="629" y2="551" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
</svg>

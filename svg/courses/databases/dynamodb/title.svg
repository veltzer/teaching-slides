<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">DynamoDB</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="240" y="205" width="220" height="40" fill="var(--warn-fill)"/>
  <text x="350" y="231" font-size="17" font-weight="bold" fill="var(--warn-text)">PK (partition key)</text>
  <rect x="460" y="205" width="240" height="40" fill="var(--info-fill)"/>
  <text x="580" y="231" font-size="17" font-weight="bold" fill="var(--info-text)">SK (sort key)</text>
  <rect x="700" y="205" width="340" height="40" fill="var(--primary-fill)"/>
  <text x="870" y="231" font-size="17" font-weight="bold" fill="var(--primary-text)">attributes</text>
  <rect x="240" y="245" width="800" height="176" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="240" y1="289" x2="1040" y2="289" stroke="var(--text-muted)" stroke-width="1"/>
  <line x1="240" y1="333" x2="1040" y2="333" stroke="var(--text-muted)" stroke-width="1"/>
  <line x1="240" y1="377" x2="1040" y2="377" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="460" y1="245" x2="460" y2="421" stroke="var(--text-muted)" stroke-width="1"/>
  <line x1="700" y1="245" x2="700" y2="421" stroke="var(--text-muted)" stroke-width="1"/>
  <g font-family="Courier New, monospace" font-size="17">
    <text x="350" y="273" fill="var(--warn-fill)">USER#42</text>
    <text x="580" y="273" fill="var(--surface)">PROFILE</text>
    <text x="870" y="273" fill="var(--text-faint)">name: Ada, plan: pro</text>
    <text x="350" y="317" fill="var(--warn-fill)">USER#42</text>
    <text x="580" y="317" fill="var(--surface)">ORDER#1001</text>
    <text x="870" y="317" fill="var(--text-faint)">total: 59, status: shipped</text>
    <text x="350" y="361" fill="var(--warn-fill)">USER#42</text>
    <text x="580" y="361" fill="var(--surface)">ORDER#1002</text>
    <text x="870" y="361" fill="var(--text-faint)">total: 12, status: pending</text>
    <text x="350" y="405" fill="var(--warn-fill)">USER#77</text>
    <text x="580" y="405" fill="var(--surface)">PROFILE</text>
    <text x="870" y="405" fill="var(--text-faint)">name: Lin, plan: free</text>
  </g>
  <path d="M224,250 L212,250 L212,372 L224,372" fill="none" stroke="var(--ok-fill)" stroke-width="3"/>
  <text x="150" y="306" font-size="16" fill="var(--ok-fill)">item</text>
  <text x="150" y="328" font-size="16" fill="var(--ok-fill)">collection</text>
  <text x="640" y="460" font-family="Courier New, monospace" font-size="18" fill="var(--ok-fill)">Query(PK = USER#42, SK begins_with ORDER#)</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">access patterns first • single-table design • GSI &amp; LSI • capacity &amp; cost • global tables • streams</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">DuckDB Integration Patterns</text>

  <rect x="40" y="102.142857142857" width="300" height="207.142857142857" rx="10.534200859823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--info-text)">Notebook</text>
  <text x="61.428571428571" y="174.642857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">Mix SQL with Python</text>
  <text x="61.428571428571" y="200.535714285714" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">Query Pandas frames</text>
  <text x="61.428571428571" y="226.428571428571" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">No data movement</text>
  <text x="190" y="278.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">Replace heavy DataFrame ops</text>

  <rect x="361.428571428571" y="102.142857142857" width="300" height="207.142857142857" rx="10.534200859823" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="511.428571428571" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--warn-text)">Embedded reporting</text>
  <text x="382.857142857143" y="174.642857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">Ship in your CLI tool</text>
  <text x="382.857142857143" y="200.535714285714" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">Read user files</text>
  <text x="382.857142857143" y="226.428571428571" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">No server to deploy</text>
  <text x="511.428571428571" y="278.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">Desktop apps, log analysis</text>

  <rect x="682.857142857143" y="102.142857142857" width="300" height="207.142857142857" rx="10.534200859823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.857142857143" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--primary-text)">Local ETL</text>
  <text x="704.285714285714" y="174.642857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">Read CSV / JSON</text>
  <text x="704.285714285714" y="200.535714285714" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">Transform with SQL</text>
  <text x="704.285714285714" y="226.428571428571" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">Write Parquet</text>
  <text x="832.857142857143" y="278.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">One-machine pipelines</text>

  <rect x="1004.285714285714" y="102.142857142857" width="235.714285714286" height="207.142857142857" rx="10.534200859823" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.142857142857" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--ok-text)">Tests</text>
  <text x="1025.714285714286" y="174.642857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">Fast startup</text>
  <text x="1025.714285714286" y="200.535714285714" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">Isolated</text>
  <text x="1025.714285714286" y="226.428571428571" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">No fixtures</text>
  <text x="1122.142857142857" y="278.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">Replace Postgres in unit tests</text>

  <rect x="40" y="350.714285714286" width="1200" height="103.571428571429" rx="10.534200859823" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--warn-text)">Lakehouse exploration</text>
  <text x="640" y="418.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">Query Iceberg/Delta tables on object storage</text>
  <text x="640" y="441.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">Skip warehouse cost for ad-hoc analysis</text>

  <rect x="40" y="485.357142857143" width="1200" height="134.642857142857" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="516.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Where DuckDB does NOT fit</text>
  <text x="640" y="545.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--danger-accent)">Multi-user transactional service — use Postgres</text>
  <text x="640" y="570.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--danger-accent)">Distributed analytics — use Spark or warehouse</text>
  <text x="640" y="599.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--danger-accent)">Concurrent writers, replication, multi-tenant</text>
</svg>

  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.235882783068" font-weight="bold" fill="var(--text)">DuckDB Connection Lifecycle</text>

  <rect x="40" y="102.142857142857" width="231.578947368421" height="103.571428571429" rx="10.441386708238" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.789473684211" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--info-text)">Open</text>
  <text x="155.789473684211" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">in-memory or path</text>
  <text x="155.789473684211" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">read-only optional</text>

  <rect x="313.684210526316" y="102.142857142857" width="231.578947368421" height="103.571428571429" rx="10.441386708238" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="429.473684210526" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--warn-text)">Configure</text>
  <text x="429.473684210526" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">memory limit</text>
  <text x="429.473684210526" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">threads, format</text>

  <rect x="587.368421052632" y="102.142857142857" width="231.578947368421" height="103.571428571429" rx="10.441386708238" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="703.157894736842" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--primary-text)">Query</text>
  <text x="703.157894736842" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">SQL or DataFrame</text>
  <text x="703.157894736842" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">microsecond overhead</text>

  <rect x="861.052631578947" y="102.142857142857" width="231.578947368421" height="103.571428571429" rx="10.441386708238" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="976.842105263158" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--ok-text)">Result</text>
  <text x="976.842105263158" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">Arrow / Pandas</text>
  <text x="976.842105263158" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">zero-copy</text>

  <rect x="1113.684210526316" y="102.142857142857" width="126.315789473684" height="103.571428571429" rx="10.441386708238" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1176.842105263158" y="153.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--danger-text)">Close</text>

  <path d="M 271.578947368421 153.928571428571 L 313.684210526316 153.928571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 545.263157894737 153.928571428571 L 587.368421052632 153.928571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 818.947368421053 153.928571428571 L 861.052631578947 153.928571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1092.631578947369 153.928571428571 L 1113.684210526316 153.928571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 976.842105263158 205.714285714286 Q 976.842105263158 247.142857142857 703.157894736842 205.714285714286" fill="none" stroke="var(--ok-accent)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-ok)"/>
  <text x="840" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-accent)">repeat queries cheap</text>

  <rect x="40" y="309.285714285714" width="568.421052631579" height="165.714285714286" rx="10.441386708238" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="324.210526315789" y="340.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">In-process</text>
  <text x="61.052631578947" y="371.428571428571" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">No network — direct function calls</text>
  <text x="61.052631578947" y="397.321428571429" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Single writer, many readers</text>
  <text x="61.052631578947" y="423.214285714286" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">File lock arbitrates writers</text>
  <text x="61.052631578947" y="449.107142857143" font-family="Arial, sans-serif" font-size="13.57380272071" font-weight="bold" fill="var(--ok-accent)">Reuse connection across queries</text>

  <rect x="650.526315789474" y="309.285714285714" width="568.421052631579" height="165.714285714286" rx="10.441386708238" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="934.736842105263" y="340.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">Multi-language bindings</text>
  <text x="671.578947368421" y="371.428571428571" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Python, R, Java, Go, Rust, Node</text>
  <text x="671.578947368421" y="397.321428571429" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Same engine across all</text>
  <text x="671.578947368421" y="423.214285714286" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Embedded in app process</text>
  <text x="671.578947368421" y="449.107142857143" font-family="Arial, sans-serif" font-size="13.57380272071" font-weight="bold" fill="var(--ok-accent)">Scripts, notebooks, services</text>

  <rect x="40" y="506.071428571429" width="1178.947368421052" height="113.928571428571" rx="10.441386708238" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.473684210526" y="537.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--info-text)">Common pattern in Python</text>
  <text x="629.473684210526" y="566.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">con = duckdb.connect("data.db")</text>
  <text x="629.473684210526" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">df = con.execute("SELECT ...").df()</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Vectorized Pipeline Execution</text>

  <rect x="40" y="102.142857142857" width="171.428571428571" height="82.857142857143" rx="8.427360687859" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.714285714286" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">Read</text>
  <text x="125.714285714286" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">2k-row vector</text>

  <rect x="254.285714285714" y="102.142857142857" width="171.428571428571" height="82.857142857143" rx="8.427360687859" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--warn-text)">Filter</text>
  <text x="340" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--warn-text)">selection mask</text>

  <rect x="468.571428571428" y="102.142857142857" width="171.428571428571" height="82.857142857143" rx="8.427360687859" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="554.285714285714" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--warn-text)">Project</text>
  <text x="554.285714285714" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--warn-text)">compute columns</text>

  <rect x="682.857142857143" y="102.142857142857" width="171.428571428571" height="82.857142857143" rx="8.427360687859" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="768.571428571429" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--primary-text)">Aggregate</text>
  <text x="768.571428571429" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--primary-text)">hash table</text>

  <rect x="897.142857142857" y="102.142857142857" width="171.428571428571" height="82.857142857143" rx="8.427360687859" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.857142857143" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--ok-text)">Output</text>
  <text x="982.857142857143" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--ok-text)">Arrow buffer</text>

  <path d="M 211.428571428571 143.571428571429 L 254.285714285714 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 425.714285714286 143.571428571429 L 468.571428571428 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 640 143.571428571429 L 682.857142857143 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 854.285714285714 143.571428571429 L 897.142857142857 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text-muted)">Each operator processes one vector at a time, in cache</text>

  <rect x="40" y="267.857142857143" width="578.571428571429" height="176.071428571429" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="329.285714285714" y="298.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Why fast</text>
  <text x="61.428571428571" y="330" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Parallel: many cores per query</text>
  <text x="61.428571428571" y="355.892857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">SIMD: 8 values per CPU instruction</text>
  <text x="61.428571428571" y="381.785714285714" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Cache-friendly: vectors fit L1</text>
  <text x="61.428571428571" y="407.678571428571" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Lazy: pull-based pipeline</text>

  <rect x="661.428571428571" y="267.857142857143" width="578.571428571429" height="176.071428571429" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.714285714286" y="298.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Tunables</text>
  <text x="682.857142857143" y="330" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">memory_limit: avoid OS-killed</text>
  <text x="682.857142857143" y="355.892857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">threads: match CPU cores</text>
  <text x="682.857142857143" y="381.785714285714" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">temp_directory: SSD for spill</text>
  <text x="682.857142857143" y="407.678571428571" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">EXPLAIN ANALYZE for profiling</text>

  <rect x="40" y="485.357142857143" width="1200" height="134.642857142857" rx="10.534200859823" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="516.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--ok-text)">Spilling</text>
  <text x="640" y="542.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--ok-text)">When working set exceeds memory_limit, spills to disk</text>
  <text x="640" y="568.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--ok-text)">Slower but query still completes</text>
  <text x="640" y="599.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">SSD strongly preferred for spill directory</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">DuckDB</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="150" y="230" width="180" height="44" rx="22" fill="var(--primary-fill)"/>
  <text x="240" y="259" font-size="18" fill="var(--primary-text)">CSV</text>
  <rect x="150" y="310" width="180" height="44" rx="22" fill="var(--ok-fill)"/>
  <text x="240" y="339" font-size="18" fill="var(--ok-text)">Parquet</text>
  <rect x="150" y="390" width="180" height="44" rx="22" fill="var(--info-fill)"/>
  <text x="240" y="419" font-size="18" fill="var(--info-text)">JSON</text>
  <line x1="340" y1="252" x2="500" y2="320" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="340" y1="332" x2="498" y2="332" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="340" y1="412" x2="500" y2="344" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="512,332 496,324 496,340" fill="var(--text-muted)"/>
  <rect x="520" y="240" width="240" height="180" fill="var(--warn-fill)"/>
  <ellipse cx="640" cy="420" rx="120" ry="24" fill="var(--warn-fill)"/>
  <ellipse cx="640" cy="240" rx="120" ry="24" fill="var(--warn-border)"/>
  <text x="640" y="320" font-size="28" font-weight="bold" fill="var(--warn-text)">DuckDB</text>
  <text x="640" y="352" font-size="17" fill="var(--warn-text)">in-process SQL</text>
  <text x="640" y="380" font-size="17" fill="var(--warn-text)">columnar engine</text>
  <line x1="770" y1="332" x2="868" y2="332" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="880,332 864,324 864,340" fill="var(--text-muted)"/>
  <rect x="890" y="250" width="240" height="40" fill="var(--primary-accent)"/>
  <text x="950" y="276" font-size="17" font-weight="bold" fill="var(--primary-text)">region</text>
  <text x="1070" y="276" font-size="17" font-weight="bold" fill="var(--primary-text)">total</text>
  <rect x="890" y="290" width="240" height="122" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1010" y1="250" x2="1010" y2="412" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="890" y1="331" x2="1130" y2="331" stroke="var(--text-muted)" stroke-width="1"/>
  <line x1="890" y1="372" x2="1130" y2="372" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="950" y="316" font-size="16" fill="var(--text-faint)">north</text>
  <text x="1070" y="316" font-size="16" fill="var(--text-faint)">1204</text>
  <text x="950" y="357" font-size="16" fill="var(--text-faint)">south</text>
  <text x="1070" y="357" font-size="16" fill="var(--text-faint)">988</text>
  <text x="950" y="398" font-size="16" fill="var(--text-faint)">west</text>
  <text x="1070" y="398" font-size="16" fill="var(--text-faint)">1517</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">SQL basics • files &amp; formats • Parquet • query plans • parallelism • embedding</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

  <text x="512" y="424.8" text-anchor="middle" font-size="21.3333">ops/sec, memory</text>
  <rect x="704" y="288" width="256" height="180" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="832" y="360" text-anchor="middle" font-size="21.3333" font-weight="bold">CLUSTER NODES</text>
  <text x="832" y="424.8" text-anchor="middle" font-size="21.3333">topology, flags</text>
  <rect x="1024" y="288" width="213.3333" height="180" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1130.6667" y="360" text-anchor="middle" font-size="21.3333" font-weight="bold">SLOWLOG</text>
  <text x="1130.6667" y="424.8" text-anchor="middle" font-size="21.3333">slow queries</text>
  <line x1="618.6667" y1="162" x2="192" y2="288" stroke="#333" stroke-width="2.1333" marker-end="url(#arrowd13_07_cluster_scalability)" />
  <line x1="618.6667" y1="162" x2="512" y2="288" stroke="#333" stroke-width="2.1333" marker-end="url(#arrowd13_07_cluster_scalability)" />
  <line x1="618.6667" y1="162" x2="832" y2="288" stroke="#333" stroke-width="2.1333" marker-end="url(#arrowd13_07_cluster_scalability)" />
  <line x1="618.6667" y1="162" x2="1130.6667" y2="288" stroke="#333" stroke-width="2.1333" marker-end="url(#arrowd13_07_cluster_scalability)" />
  <text x="618.6667" y="576" text-anchor="middle" font-size="21.3333" fill="#333">Export metrics to Grafana/Prometheus for alerting</text>
  <defs>


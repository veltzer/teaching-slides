<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="240" height="145" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="130.625" text-anchor="middle" font-size="24.9765" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Master 1</text>
  <rect x="520" y="40" width="240" height="145" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="130.625" text-anchor="middle" font-size="24.9765" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Master 2</text>
  <rect x="1000" y="40" width="240" height="145" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="130.625" text-anchor="middle" font-size="24.9765" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Master 3</text>
  <rect x="40" y="330.0001" width="240" height="126.875" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="409.75" text-anchor="middle" font-size="22.7058" font-family="Arial, sans-serif" fill="var(--primary-text)">Replica 1</text>
  <rect x="520" y="330.0001" width="240" height="126.875" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="409.75" text-anchor="middle" font-size="22.7058" font-family="Arial, sans-serif" fill="var(--primary-text)">Replica 2</text>
  <rect x="1000" y="330.0001" width="240" height="126.875" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="409.75" text-anchor="middle" font-size="22.7058" font-family="Arial, sans-serif" fill="var(--primary-text)">Replica 3</text>
  <line x1="160" y1="185" x2="160" y2="330.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="185" x2="640" y2="330.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="185" x2="1120" y2="330.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280.0001" y1="112.5" x2="520" y2="112.5" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.428 6.321"/>
  <line x1="760" y1="112.5" x2="1000" y2="112.5" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.428 6.321"/>
  <text x="400" y="94.375" text-anchor="middle" font-size="22.7058" fill="var(--text-faint)" font-family="Arial, sans-serif">bus</text>
  <text x="880" y="94.375" text-anchor="middle" font-size="22.7058" fill="var(--text-faint)" font-family="Arial, sans-serif">bus</text>
  <text x="640" y="547.5" text-anchor="middle" font-size="22.7058" fill="var(--text)" font-family="Arial, sans-serif">3 masters + 3 replicas = 6 nodes minimum</text>
  <text x="640" y="620" text-anchor="middle" font-size="22.7058" fill="var(--text-muted)" font-family="Arial, sans-serif">Cross-replicate: Replica 1 on different host than Master 1</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="172.973" height="120" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="126.4865" y="120" text-anchor="middle" font-size="22.6387" font-family="Arial, sans-serif" fill="var(--warn-text)">key: "foo"</text>
  <line x1="212.9729" y1="100" x2="342.7026" y2="100" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="342.7026" y="40" width="302.7027" height="120" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="494.0541" y="120" text-anchor="middle" font-size="22.6387" font-family="Arial, sans-serif" fill="var(--info-text)">CRC16("foo") % 16384</text>
  <line x1="645.4054" y1="100" x2="731.8918" y2="100" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="731.8918" y="40" width="172.973" height="120" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="818.3784" y="120" text-anchor="middle" font-size="22.6387" font-family="Arial, sans-serif" fill="var(--ok-text)">Slot 12182</text>
  <rect x="40" y="280" width="324.3243" height="200" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="202.1622" y="360" text-anchor="middle" font-size="24.9026" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Master A</text>
  <text x="202.1622" y="428" text-anchor="middle" font-size="22.6387" font-family="Arial, sans-serif" fill="var(--primary-text)">Slots 0 - 5460</text>
  <rect x="472.4324" y="280" width="324.3243" height="200" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="634.5945" y="360" text-anchor="middle" font-size="24.9026" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Master B</text>
  <text x="634.5945" y="428" text-anchor="middle" font-size="22.6387" font-family="Arial, sans-serif" fill="var(--info-text)">Slots 5461 - 10922</text>
  <rect x="904.8648" y="280" width="335.1352" height="200" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1071.3514" y="360" text-anchor="middle" font-size="24.9026" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Master C</text>
  <text x="1071.3514" y="428" text-anchor="middle" font-size="22.6387" font-family="Arial, sans-serif" fill="var(--ok-text)">Slots 10923 - 16383</text>
  <line x1="818.3784" y1="160" x2="1071.3514" y2="280" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="818.3784" y1="160" x2="1071.3514" y2="280" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="645.4054" y="620" text-anchor="middle" font-size="22.6387" fill="var(--text)" font-family="Arial, sans-serif">Each key deterministically maps to exactly one master node</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="402.2641" y="40" width="430.1886" height="116" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="617.3585" y="116.2286" text-anchor="middle" font-size="23.1963" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Application Server</text>
  <rect x="40" y="338.2857" width="294.3396" height="182.2857" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="187.1699" y="404.5714" text-anchor="middle" font-size="23.1963" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Redis: Sessions</text>
  <text x="187.1699" y="470.8571" text-anchor="middle" font-size="21.0875" font-family="Arial, sans-serif" fill="var(--primary-text)">:6379 / db0</text>
  <rect x="470.1886" y="338.2857" width="294.3396" height="182.2857" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="617.3585" y="404.5714" text-anchor="middle" font-size="23.1963" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Redis: Cache</text>
  <text x="617.3585" y="470.8571" text-anchor="middle" font-size="21.0875" font-family="Arial, sans-serif" fill="var(--info-text)">:6380 / db0</text>
  <rect x="900.3774" y="338.2857" width="339.6226" height="182.2857" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1070.1886" y="404.5714" text-anchor="middle" font-size="23.1963" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Redis: Queues</text>
  <text x="1070.1886" y="470.8571" text-anchor="middle" font-size="21.0875" font-family="Arial, sans-serif" fill="var(--ok-text)">:6381 / db0</text>
  <line x1="492.8301" y1="156" x2="187.1699" y2="338.2857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="617.3585" y1="156" x2="617.3585" y2="338.2857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="741.8867" y1="156" x2="1070.1886" y2="338.2857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="617.3585" y="620" text-anchor="middle" font-size="21.0875" fill="var(--text)" font-family="Arial, sans-serif">Separate Redis instances by function for isolation and tuning</text>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
</svg>

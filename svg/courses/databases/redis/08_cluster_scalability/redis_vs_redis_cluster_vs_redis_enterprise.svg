<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="324.3243" height="343.7037" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="202.1622" y="125.9259" text-anchor="middle" font-size="25.8085" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Redis Standalone</text>
  <text x="202.1622" y="198.963" text-anchor="middle" font-size="23.4622" font-family="Arial, sans-serif" fill="var(--primary-text)">Single node</text>
  <text x="202.1622" y="263.4074" text-anchor="middle" font-size="23.4622" font-family="Arial, sans-serif" fill="var(--primary-text)">Simple setup</text>
  <text x="202.1622" y="327.8519" text-anchor="middle" font-size="23.4622" fill="var(--text-muted)" font-family="Arial, sans-serif">No HA / No shard</text>
  <rect x="461.6216" y="40" width="345.9459" height="343.7037" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="634.5945" y="125.9259" text-anchor="middle" font-size="25.8085" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Redis Cluster (OSS)</text>
  <text x="634.5945" y="198.963" text-anchor="middle" font-size="23.4622" font-family="Arial, sans-serif" fill="var(--info-text)">Auto-sharding</text>
  <text x="634.5945" y="263.4074" text-anchor="middle" font-size="23.4622" font-family="Arial, sans-serif" fill="var(--info-text)">Auto-failover</text>
  <text x="634.5945" y="327.8519" text-anchor="middle" font-size="23.4622" fill="var(--text-muted)" font-family="Arial, sans-serif">Multi-key limits</text>
  <rect x="904.8648" y="40" width="335.1352" height="343.7037" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1071.3514" y="125.9259" text-anchor="middle" font-size="25.8085" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Redis Enterprise</text>
  <text x="1071.3514" y="198.963" text-anchor="middle" font-size="23.4622" font-family="Arial, sans-serif" fill="var(--ok-text)">Active-Active geo</text>
  <text x="1071.3514" y="263.4074" text-anchor="middle" font-size="23.4622" font-family="Arial, sans-serif" fill="var(--ok-text)">Flash tiering</text>
  <text x="1071.3514" y="327.8519" text-anchor="middle" font-size="23.4622" fill="var(--text-muted)" font-family="Arial, sans-serif">Commercial license</text>
  <line x1="364.3243" y1="211.8519" x2="461.6216" y2="211.8519" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="807.5675" y1="211.8519" x2="904.8648" y2="211.8519" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="411.8919" y="181.7778" text-anchor="middle" font-size="23.4622" fill="var(--text-muted)" font-family="Arial, sans-serif"/>
  <rect x="212.9729" y="491.1111" width="864.8648" height="128.8889" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="645.4054" y="577.037" text-anchor="middle" font-size="23.4622" font-family="Arial, sans-serif" fill="var(--warn-text)">Complexity and cost increase; choose based on requirements</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="324.3243" height="343.7037" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="202.1622" y="125.9259" text-anchor="middle" font-size="25.8085" font-weight="bold">Redis Standalone</text>
  <text x="202.1622" y="198.963" text-anchor="middle" font-size="23.4622">Single node</text>
  <text x="202.1622" y="263.4074" text-anchor="middle" font-size="23.4622">Simple setup</text>
  <text x="202.1622" y="327.8519" text-anchor="middle" font-size="23.4622" fill="var(--text-muted)">No HA / No shard</text>
  <rect x="461.6216" y="40" width="345.9459" height="343.7037" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="634.5945" y="125.9259" text-anchor="middle" font-size="25.8085" font-weight="bold">Redis Cluster (OSS)</text>
  <text x="634.5945" y="198.963" text-anchor="middle" font-size="23.4622">Auto-sharding</text>
  <text x="634.5945" y="263.4074" text-anchor="middle" font-size="23.4622">Auto-failover</text>
  <text x="634.5945" y="327.8519" text-anchor="middle" font-size="23.4622" fill="var(--text-muted)">Multi-key limits</text>
  <rect x="904.8648" y="40" width="335.1352" height="343.7037" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1071.3514" y="125.9259" text-anchor="middle" font-size="25.8085" font-weight="bold">Redis Enterprise</text>
  <text x="1071.3514" y="198.963" text-anchor="middle" font-size="23.4622">Active-Active geo</text>
  <text x="1071.3514" y="263.4074" text-anchor="middle" font-size="23.4622">Flash tiering</text>
  <text x="1071.3514" y="327.8519" text-anchor="middle" font-size="23.4622" fill="var(--text-muted)">Commercial license</text>
  <line x1="364.3243" y1="211.8519" x2="461.6216" y2="211.8519" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd17_07_cluster_scalability)" />
  <line x1="807.5675" y1="211.8519" x2="904.8648" y2="211.8519" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd17_07_cluster_scalability)" />
  <text x="411.8919" y="181.7778" text-anchor="middle" font-size="23.4622" fill="var(--text-muted)" />
  <rect x="212.9729" y="491.1111" width="864.8648" height="128.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="645.4054" y="577.037" text-anchor="middle" font-size="23.4622">Complexity and cost increase; choose based on requirements</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd17_07_cluster_scalability" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
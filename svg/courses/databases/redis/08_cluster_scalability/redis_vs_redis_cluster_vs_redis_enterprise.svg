<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="54" width="320" height="288" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="202.6667" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Redis Standalone</text>
  <text x="202.6667" y="187.2" text-anchor="middle" font-size="21.3333">Single node</text>
  <text x="202.6667" y="241.2" text-anchor="middle" font-size="21.3333">Simple setup</text>
  <text x="202.6667" y="295.2" text-anchor="middle" font-size="21.3333" fill="#666">No HA / No shard</text>
  <rect x="458.6667" y="54" width="341.3333" height="288" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="629.3333" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Redis Cluster (OSS)</text>
  <text x="629.3333" y="187.2" text-anchor="middle" font-size="21.3333">Auto-sharding</text>
  <text x="629.3333" y="241.2" text-anchor="middle" font-size="21.3333">Auto-failover</text>
  <text x="629.3333" y="295.2" text-anchor="middle" font-size="21.3333" fill="#666">Multi-key limits</text>
  <rect x="896" y="54" width="330.6667" height="288" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1060.2667" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Redis Enterprise</text>
  <text x="1060.2667" y="187.2" text-anchor="middle" font-size="21.3333">Active-Active geo</text>
  <text x="1060.2667" y="241.2" text-anchor="middle" font-size="21.3333">Flash tiering</text>
  <text x="1060.2667" y="295.2" text-anchor="middle" font-size="21.3333" fill="#666">Commercial license</text>
  <line x1="362.6667" y1="198" x2="458.6667" y2="198" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd17_07_cluster_scalability)" />
  <line x1="800" y1="198" x2="896" y2="198" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd17_07_cluster_scalability)" />
  <text x="409.6" y="172.8" text-anchor="middle" font-size="21.3333" fill="#666" />
  <rect x="213.3333" y="432" width="853.3333" height="108" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="504" text-anchor="middle" font-size="21.3333">Complexity and cost increase; choose based on requirements</text>
  <defs>


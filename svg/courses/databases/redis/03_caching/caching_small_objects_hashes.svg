<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="318.5714" y="40" text-anchor="middle" font-size="23.1006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">String Keys (wasteful)</text>
  <rect x="40" y="64.3114" width="557.1429" height="347.3054" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" opacity="0.3" filter="url(#shadow)"/>
  <rect x="61.4286" y="88.6227" width="514.2857" height="69.4611" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="318.5714" y="140.7185" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">user:42:name = "Alice"</text>
  <rect x="61.4286" y="175.4491" width="514.2857" height="69.4611" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="318.5714" y="227.5449" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">user:42:email = "a@b.com"</text>
  <rect x="61.4286" y="262.2755" width="514.2857" height="69.4611" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="318.5714" y="314.3713" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">user:42:role = "admin"</text>
  <text x="318.5714" y="394.2515" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)" font-family="Arial, sans-serif">3 keys x overhead each</text>
  <text x="961.4286" y="40" text-anchor="middle" font-size="23.1006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Hash (efficient)</text>
  <rect x="682.8571" y="64.3114" width="557.1429" height="347.3054" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.3" filter="url(#shadow)"/>
  <rect x="704.2857" y="88.6227" width="514.2857" height="295.2096" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="961.4286" y="151.1377" text-anchor="middle" font-size="21.0005" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">HSET user:42</text>
  <rect x="736.4286" y="178.9221" width="214.2857" height="62.515" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="843.5715" y="224.0718" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">name: "Alice"</text>
  <rect x="736.4286" y="248.3832" width="214.2857" height="62.515" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="843.5715" y="293.5329" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">email: "a@b.com"</text>
  <rect x="972.1429" y="178.9221" width="214.2857" height="62.515" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2857" y="224.0718" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">role: "admin"</text>
  <text x="961.4286" y="394.2515" text-anchor="middle" font-size="21.0005" fill="var(--ok-accent)" font-family="Arial, sans-serif">1 key, ziplist encoding</text>
  <line x1="597.1429" y1="237.9641" x2="678.5714" y2="237.9641" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="318.5714" y="463.7125" width="642.8571" height="156.2875" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="526.2275" text-anchor="middle" font-size="21.0005" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Memory savings: up to 10x fewer bytes</text>
  <text x="640" y="585.2695" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--ok-text)">HGETALL user:42 retrieves all fields at once</text>
</svg>

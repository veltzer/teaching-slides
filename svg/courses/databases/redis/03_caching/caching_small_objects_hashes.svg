<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd13_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="318.5714" y="40" text-anchor="middle" font-size="23.1006" font-weight="bold">String Keys (wasteful)</text>
  <rect x="40" y="64.3114" width="557.1429" height="347.3054" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" opacity="0.3" filter="url(#shadow)"/>
  <rect x="61.4286" y="88.6227" width="514.2857" height="69.4611" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="318.5714" y="140.7185" text-anchor="middle" font-size="21.0005">user:42:name = "Alice"</text>
  <rect x="61.4286" y="175.4491" width="514.2857" height="69.4611" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="318.5714" y="227.5449" text-anchor="middle" font-size="21.0005">user:42:email = "a@b.com"</text>
  <rect x="61.4286" y="262.2755" width="514.2857" height="69.4611" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="318.5714" y="314.3713" text-anchor="middle" font-size="21.0005">user:42:role = "admin"</text>
  <text x="318.5714" y="394.2515" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)">3 keys x overhead each</text>
  <text x="961.4286" y="40" text-anchor="middle" font-size="23.1006" font-weight="bold">Hash (efficient)</text>
  <rect x="682.8571" y="64.3114" width="557.1429" height="347.3054" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.3" filter="url(#shadow)"/>
  <rect x="704.2857" y="88.6227" width="514.2857" height="295.2096" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="961.4286" y="151.1377" text-anchor="middle" font-size="21.0005" font-weight="bold">HSET user:42</text>
  <rect x="736.4286" y="178.9221" width="214.2857" height="62.515" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="843.5715" y="224.0718" text-anchor="middle" font-size="21.0005">name: "Alice"</text>
  <rect x="736.4286" y="248.3832" width="214.2857" height="62.515" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="843.5715" y="293.5329" text-anchor="middle" font-size="21.0005">email: "a@b.com"</text>
  <rect x="972.1429" y="178.9221" width="214.2857" height="62.515" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2857" y="224.0718" text-anchor="middle" font-size="21.0005">role: "admin"</text>
  <text x="961.4286" y="394.2515" text-anchor="middle" font-size="21.0005" fill="var(--ok-accent)">1 key, ziplist encoding</text>
  <line x1="597.1429" y1="237.9641" x2="678.5714" y2="237.9641" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd13_02_caching)" />
  <rect x="318.5714" y="463.7125" width="642.8571" height="156.2875" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="526.2275" text-anchor="middle" font-size="21.0005" font-weight="bold">Memory savings: up to 10x fewer bytes</text>
  <text x="640" y="585.2695" text-anchor="middle" font-size="21.0005">HGETALL user:42 retrieves all fields at once</text>
</svg>
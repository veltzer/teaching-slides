<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="253.8462" height="263.6363" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="166.923" y="145.4547" text-anchor="middle" font-size="29.5377" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">L1: In-Process</text>
  <text x="166.923" y="224.5455" text-anchor="middle" font-size="26.8524" font-family="Arial, sans-serif" fill="var(--primary-text)">HashMap/LRU</text>
  <rect x="501.5385" y="40" width="253.8462" height="263.6363" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="628.4616" y="145.4547" text-anchor="middle" font-size="29.5377" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">L2: Redis</text>
  <text x="628.4616" y="224.5455" text-anchor="middle" font-size="26.8524" font-family="Arial, sans-serif" fill="var(--info-text)">Shared Cache</text>
  <rect x="963.077" y="40" width="276.923" height="263.6363" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1101.5384" y="145.4547" text-anchor="middle" font-size="29.5377" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">L3: Database</text>
  <text x="1101.5384" y="224.5455" text-anchor="middle" font-size="26.8524" font-family="Arial, sans-serif" fill="var(--ok-text)">Source of Truth</text>
  <text x="166.923" y="435.4545" text-anchor="middle" font-size="26.8524" fill="var(--primary-accent)" font-family="Arial, sans-serif">~1 us</text>
  <text x="628.4616" y="435.4545" text-anchor="middle" font-size="26.8524" fill="var(--info-accent)" font-family="Arial, sans-serif">~1 ms</text>
  <text x="1101.5384" y="435.4545" text-anchor="middle" font-size="26.8524" fill="var(--ok-accent)" font-family="Arial, sans-serif">~10 ms</text>
  <line x1="293.8462" y1="171.8182" x2="501.5385" y2="171.8182" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="755.3846" y1="171.8182" x2="963.077" y2="171.8182" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="397.6924" y="134.9091" text-anchor="middle" font-size="26.8524" fill="var(--text-muted)" font-family="Arial, sans-serif">miss</text>
  <text x="859.2308" y="134.9091" text-anchor="middle" font-size="26.8524" fill="var(--text-muted)" font-family="Arial, sans-serif">miss</text>
  <text x="663.077" y="620" text-anchor="middle" font-size="29.5377" fill="var(--text)" font-family="Arial, sans-serif">Request flows L1 -&gt; L2 -&gt; L3 on cache miss</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
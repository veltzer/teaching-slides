<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd8_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="73.1429" width="189.4737" height="132.5715" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="134.7368" y="152.6857" text-anchor="middle" font-size="20.3342" font-weight="bold">Writer App</text>
  <rect x="355.7895" y="73.1429" width="189.4737" height="132.5715" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="450.5263" y="152.6857" text-anchor="middle" font-size="20.3342" font-weight="bold">Database</text>
  <rect x="671.5789" y="40" width="231.5789" height="182.2857" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="787.3685" y="112.9143" text-anchor="middle" font-size="20.3342" font-weight="bold">Redis Pub/Sub</text>
  <text x="787.3685" y="165.9429" text-anchor="middle" font-size="20.3342" fill="var(--warn-accent)">invalidation channel</text>
  <rect x="1050.5263" y="40" width="189.4737" height="116" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1145.2631" y="112.9143" text-anchor="middle" font-size="20.3342">App Instance 1</text>
  <rect x="1050.5263" y="172.5715" width="189.4737" height="116" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1145.2631" y="245.4857" text-anchor="middle" font-size="20.3342">App Instance 2</text>
  <line x1="229.4737" y1="122.8572" x2="351.5789" y2="122.8572" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrowd8_02_caching)" />
  <text x="292.6316" y="106.2857" text-anchor="middle" font-size="20.3342" fill="var(--info-accent)">1. Write</text>
  <line x1="229.4737" y1="189.1429" x2="667.3684" y2="156" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrowd8_02_caching)" />
  <text x="440" y="232.2285" text-anchor="middle" font-size="20.3342" fill="var(--warn-accent)">2. PUBLISH "invalidate:item:42"</text>
  <line x1="903.1579" y1="99.6572" x2="1046.3159" y2="99.6572" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd8_02_caching)" />
  <line x1="903.1579" y1="172.5715" x2="1046.3159" y2="222.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd8_02_caching)" />
  <text x="976.8422" y="66.5143" text-anchor="middle" font-size="20.3342" fill="var(--ok-accent)">3. Notify</text>
  <rect x="1050.5263" y="338.2857" width="189.4737" height="99.4286" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1145.2631" y="401.2572" text-anchor="middle" font-size="20.3342" fill="var(--danger-accent)">DEL item:42</text>
  <line x1="1145.2631" y1="288.5715" x2="1145.2631" y2="331.6571" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd8_02_caching)" />
  <rect x="40" y="487.4285" width="1200" height="132.5715" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.4" filter="url(#shadow)"/>
  <text x="650.5263" y="563.6572" text-anchor="middle" font-size="20.3342">All instances invalidate stale data on event. More accurate than TTL-based expiry.</text>
</svg>
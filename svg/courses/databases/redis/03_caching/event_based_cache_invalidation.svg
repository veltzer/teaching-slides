<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd8_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="20.5005" y="69.1892" width="184.5045" height="138.3784" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="112.7527" y="152.2162" text-anchor="middle" font-size="20.5005" font-weight="bold">Writer App</text>
  <rect x="328.008" y="69.1892" width="184.5045" height="138.3784" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="420.2602" y="152.2162" text-anchor="middle" font-size="20.5005" font-weight="bold">Database</text>
  <rect x="635.5155" y="34.5946" width="225.5055" height="190.2703" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="748.2683" y="110.7027" text-anchor="middle" font-size="20.5005" font-weight="bold">Redis Pub/Sub</text>
  <text x="748.2683" y="166.0541" text-anchor="middle" font-size="20.5005" fill="var(--warn-accent)">invalidation channel</text>
  <rect x="1004.5245" y="34.5946" width="184.5045" height="121.0811" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1096.7767" y="110.7027" text-anchor="middle" font-size="20.5005">App Instance 1</text>
  <rect x="1004.5245" y="172.973" width="184.5045" height="121.0811" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1096.7767" y="249.0811" text-anchor="middle" font-size="20.5005">App Instance 2</text>
  <line x1="205.005" y1="121.0811" x2="323.9079" y2="121.0811" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrowd8_02_caching)" />
  <text x="266.5065" y="103.7838" text-anchor="middle" font-size="20.5005" fill="var(--info-accent)">1. Write</text>
  <line x1="205.005" y1="190.2703" x2="631.4154" y2="155.6757" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrowd8_02_caching)" />
  <text x="410.01" y="235.2432" text-anchor="middle" font-size="20.5005" fill="var(--warn-accent)">2. PUBLISH "invalidate:item:42"</text>
  <line x1="861.021" y1="96.8649" x2="1000.4245" y2="96.8649" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd8_02_caching)" />
  <line x1="861.021" y1="172.973" x2="1000.4245" y2="224.8649" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd8_02_caching)" />
  <text x="932.7728" y="62.2703" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">3. Notify</text>
  <rect x="1004.5245" y="345.9459" width="184.5045" height="103.7838" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1096.7767" y="411.6757" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">DEL item:42</text>
  <line x1="1096.7767" y1="294.0541" x2="1096.7767" y2="339.027" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd8_02_caching)" />
  <rect x="20.5005" y="501.6216" width="1168.5285" height="138.3784" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.4" />
  <text x="615.015" y="581.1892" text-anchor="middle" font-size="20.5005">All instances invalidate stale data on event. More accurate than TTL-based expiry.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd14_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="20.5005" y="172.973" width="164.004" height="138.3784" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="102.5025" y="256" text-anchor="middle" font-size="20.5005" font-weight="bold">Client</text>
  <rect x="328.008" y="86.4865" width="348.5085" height="311.3514" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="502.2623" y="155.6757" text-anchor="middle" font-size="22.5506" font-weight="bold">Redis Counter</text>
  <text x="502.2623" y="214.4865" text-anchor="middle" font-size="20.5005">rate:user42:1710000</text>
  <rect x="358.7587" y="242.1622" width="287.007" height="62.2703" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="502.2623" y="290.5946" text-anchor="middle" font-size="20.5005">INCR = 3 (limit: 5)</text>
  <text x="502.2623" y="373.6216" text-anchor="middle" font-size="20.5005" fill="var(--warn-accent)">EXPIRE 60s (window)</text>
  <rect x="861.021" y="172.973" width="164.004" height="138.3784" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="943.023" y="256" text-anchor="middle" font-size="20.5005" font-weight="bold">API</text>
  <line x1="184.5045" y1="224.8649" x2="323.9079" y2="207.5676" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd14_02_caching)" />
  <text x="256.2563" y="190.2703" text-anchor="middle" font-size="20.5005">Request</text>
  <line x1="676.5165" y1="207.5676" x2="856.9209" y2="224.8649" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd14_02_caching)" />
  <text x="768.7688" y="190.2703" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">count &lt; limit</text>
  <rect x="328.008" y="449.7297" width="348.5085" height="190.2703" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="502.2623" y="518.9189" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="var(--danger-accent)">When count &gt;= limit:</text>
  <text x="502.2623" y="581.1892" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">HTTP 429 Too Many Requests</text>
  <text x="502.2623" y="622.7027" text-anchor="middle" font-size="20.5005">Retry-After: remaining TTL</text>
  <rect x="861.021" y="449.7297" width="328.008" height="190.2703" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.5" />
  <text x="1025.0251" y="512" text-anchor="middle" font-size="20.5005" font-weight="bold">Sliding Window:</text>
  <text x="1025.0251" y="563.8919" text-anchor="middle" font-size="20.5005">INCR + EXPIRE = atomic</text>
  <text x="1025.0251" y="615.7838" text-anchor="middle" font-size="20.5005">counter per time window</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="130.625" width="168.4211" height="145" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="124.2105" y="217.625" text-anchor="middle" font-size="21.266" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Client</text>
  <rect x="355.7895" y="40" width="357.8947" height="326.2501" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="534.7369" y="112.5" text-anchor="middle" font-size="23.3926" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Counter</text>
  <text x="534.7369" y="174.125" text-anchor="middle" font-size="21.266" font-family="Arial, sans-serif" fill="var(--warn-text)">rate:user42:1710000</text>
  <rect x="387.3684" y="203.125" width="294.7368" height="65.25" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="534.7369" y="253.875" text-anchor="middle" font-size="21.266" font-family="Arial, sans-serif" fill="var(--ok-text)">INCR = 3 (limit: 5)</text>
  <text x="534.7369" y="340.875" text-anchor="middle" font-size="21.266" fill="var(--warn-accent)" font-family="Arial, sans-serif">EXPIRE 60s (window)</text>
  <rect x="903.1579" y="130.625" width="168.4211" height="145" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="987.3684" y="217.625" text-anchor="middle" font-size="21.266" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">API</text>
  <line x1="208.4211" y1="185" x2="351.5789" y2="166.875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="282.1053" y="148.75" text-anchor="middle" font-size="21.266" font-family="Arial, sans-serif" fill="var(--text)">Request</text>
  <line x1="713.6842" y1="166.875" x2="898.9474" y2="185" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="808.4211" y="148.75" text-anchor="middle" font-size="21.266" fill="var(--ok-accent)" font-family="Arial, sans-serif">count &lt; limit</text>
  <rect x="355.7895" y="420.625" width="357.8947" height="199.375" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="534.7369" y="493.125" text-anchor="middle" font-size="21.266" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">When count &gt;= limit:</text>
  <text x="534.7369" y="558.375" text-anchor="middle" font-size="21.266" fill="var(--danger-accent)" font-family="Arial, sans-serif">HTTP 429 Too Many Requests</text>
  <text x="534.7369" y="601.875" text-anchor="middle" font-size="21.266" font-family="Arial, sans-serif" fill="var(--danger-text)">Retry-After: remaining TTL</text>
  <rect x="903.1579" y="420.625" width="336.8421" height="199.375" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.5" filter="url(#shadow)"/>
  <text x="1071.5791" y="485.875" text-anchor="middle" font-size="21.266" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Sliding Window:</text>
  <text x="1071.5791" y="540.25" text-anchor="middle" font-size="21.266" font-family="Arial, sans-serif" fill="var(--ok-text)">INCR + EXPIRE = atomic</text>
  <text x="1071.5791" y="594.625" text-anchor="middle" font-size="21.266" font-family="Arial, sans-serif" fill="var(--ok-text)">counter per time window</text>
</svg>

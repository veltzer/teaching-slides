<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd14_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="130.625" width="168.4211" height="145" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="124.2105" y="217.625" text-anchor="middle" font-size="21.266" font-weight="bold">Client</text>
  <rect x="355.7895" y="40" width="357.8947" height="326.2501" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="534.7369" y="112.5" text-anchor="middle" font-size="23.3926" font-weight="bold">Redis Counter</text>
  <text x="534.7369" y="174.125" text-anchor="middle" font-size="21.266">rate:user42:1710000</text>
  <rect x="387.3684" y="203.125" width="294.7368" height="65.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="534.7369" y="253.875" text-anchor="middle" font-size="21.266">INCR = 3 (limit: 5)</text>
  <text x="534.7369" y="340.875" text-anchor="middle" font-size="21.266" fill="var(--warn-accent)">EXPIRE 60s (window)</text>
  <rect x="903.1579" y="130.625" width="168.4211" height="145" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="987.3684" y="217.625" text-anchor="middle" font-size="21.266" font-weight="bold">API</text>
  <line x1="208.4211" y1="185" x2="351.5789" y2="166.875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd14_02_caching)" />
  <text x="282.1053" y="148.75" text-anchor="middle" font-size="21.266">Request</text>
  <line x1="713.6842" y1="166.875" x2="898.9474" y2="185" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd14_02_caching)" />
  <text x="808.4211" y="148.75" text-anchor="middle" font-size="21.266" fill="var(--ok-accent)">count &lt; limit</text>
  <rect x="355.7895" y="420.625" width="357.8947" height="199.375" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="534.7369" y="493.125" text-anchor="middle" font-size="21.266" font-weight="bold" fill="var(--danger-accent)">When count &gt;= limit:</text>
  <text x="534.7369" y="558.375" text-anchor="middle" font-size="21.266" fill="var(--danger-accent)">HTTP 429 Too Many Requests</text>
  <text x="534.7369" y="601.875" text-anchor="middle" font-size="21.266">Retry-After: remaining TTL</text>
  <rect x="903.1579" y="420.625" width="336.8421" height="199.375" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.5" filter="url(#shadow)"/>
  <text x="1071.5791" y="485.875" text-anchor="middle" font-size="21.266" font-weight="bold">Sliding Window:</text>
  <text x="1071.5791" y="540.25" text-anchor="middle" font-size="21.266">INCR + EXPIRE = atomic</text>
  <text x="1071.5791" y="594.625" text-anchor="middle" font-size="21.266">counter per time window</text>
</svg>
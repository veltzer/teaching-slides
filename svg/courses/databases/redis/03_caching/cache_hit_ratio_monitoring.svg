<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="618.5715" y="40" text-anchor="middle" font-size="25.9908" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Cache Hit Ratio Visualization</text>
  <text x="40" y="139.7452" font-size="21.659" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Hits:</text>
  <rect x="125.7143" y="91.7197" width="857.1429" height="73.8854" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="554.2857" y="147.1338" text-anchor="middle" font-size="23.825" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">keyspace_hits: 85,000</text>
  <text x="40" y="250.5732" font-size="21.659" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Miss:</text>
  <rect x="125.7143" y="202.5478" width="171.4286" height="73.8854" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4286" y="257.9618" text-anchor="middle" font-size="23.825" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">15,000</text>
  <rect x="1025.7143" y="91.7197" width="214.2857" height="184.7134" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1132.8572" y="165.6051" text-anchor="middle" font-size="23.825" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Hit Ratio</text>
  <text x="1132.8572" y="239.4904" text-anchor="middle" font-size="28.1567" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">85%</text>
  <rect x="40" y="342.9299" width="235.7143" height="166.242" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="157.8571" y="409.4268" text-anchor="middle" font-size="21.659" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Poor &lt; 60%</text>
  <text x="157.8571" y="472.2293" text-anchor="middle" font-size="21.659" font-family="Arial, sans-serif" fill="var(--danger-text)">Review TTL, size</text>
  <rect x="318.5714" y="342.9299" width="235.7143" height="166.242" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="436.4286" y="409.4268" text-anchor="middle" font-size="21.659" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">OK 60-80%</text>
  <text x="436.4286" y="472.2293" text-anchor="middle" font-size="21.659" font-family="Arial, sans-serif" fill="var(--warn-text)">Room to improve</text>
  <rect x="597.1429" y="342.9299" width="235.7143" height="166.242" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="715" y="409.4268" text-anchor="middle" font-size="21.659" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Good 80-95%</text>
  <text x="715" y="472.2293" text-anchor="middle" font-size="21.659" font-family="Arial, sans-serif" fill="var(--ok-text)">Target range</text>
  <rect x="875.7143" y="342.9299" width="235.7143" height="166.242" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="993.5714" y="409.4268" text-anchor="middle" font-size="21.659" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Excellent &gt;95%</text>
  <text x="993.5714" y="472.2293" text-anchor="middle" font-size="21.659" font-family="Arial, sans-serif" fill="var(--primary-text)">Well optimized</text>
  <text x="618.5715" y="620" text-anchor="middle" font-size="21.659" font-family="Arial, sans-serif" fill="var(--text)">Formula: keyspace_hits / (keyspace_hits + keyspace_misses) x 100</text>
</svg>

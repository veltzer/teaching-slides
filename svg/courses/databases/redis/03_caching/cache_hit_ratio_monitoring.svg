<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="92.727292689127" font-size="22.694477596369" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Hits:</text>
  <rect x="125.7143" y="40" width="857.1429" height="81.118928720227" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.286849142537" filter="url(#shadow)"/>
  <text x="554.2857" y="100.83925143527" text-anchor="middle" font-size="24.964030136825" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">keyspace_hits: 85,000</text>
  <text x="40" y="214.405575979267" font-size="22.694477596369" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Miss:</text>
  <rect x="125.7143" y="161.67839308034" width="171.4286" height="81.118928720227" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.286849142537" filter="url(#shadow)"/>
  <text x="211.4286" y="222.51753472541" text-anchor="middle" font-size="24.964030136825" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">15,000</text>
  <rect x="1025.7143" y="40" width="214.2857" height="202.797212010366" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.286849142537" filter="url(#shadow)"/>
  <text x="1132.8572" y="121.118928720227" text-anchor="middle" font-size="24.964030136825" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Hit Ratio</text>
  <text x="1132.8572" y="202.237747650253" text-anchor="middle" font-size="29.502820875279" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">85%</text>
  <rect x="40" y="315.80418198445" width="235.7143" height="182.51742493521" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.286849142537" filter="url(#shadow)"/>
  <text x="157.8571" y="388.811261748735" text-anchor="middle" font-size="22.694477596369" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Poor &lt; 60%</text>
  <text x="157.8571" y="457.762252349747" text-anchor="middle" font-size="22.694477596369" font-family="Arial, sans-serif" fill="var(--danger-text)">Review TTL, size</text>
  <rect x="318.5714" y="315.80418198445" width="235.7143" height="182.51742493521" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.286849142537" filter="url(#shadow)"/>
  <text x="436.4286" y="388.811261748735" text-anchor="middle" font-size="22.694477596369" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">OK 60-80%</text>
  <text x="436.4286" y="457.762252349747" text-anchor="middle" font-size="22.694477596369" font-family="Arial, sans-serif" fill="var(--warn-text)">Room to improve</text>
  <rect x="597.1429" y="315.80418198445" width="235.7143" height="182.51742493521" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.286849142537" filter="url(#shadow)"/>
  <text x="715" y="388.811261748735" text-anchor="middle" font-size="22.694477596369" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Good 80-95%</text>
  <text x="715" y="457.762252349747" text-anchor="middle" font-size="22.694477596369" font-family="Arial, sans-serif" fill="var(--ok-text)">Target range</text>
  <rect x="875.7143" y="315.80418198445" width="235.7143" height="182.51742493521" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.286849142537" filter="url(#shadow)"/>
  <text x="993.5714" y="388.811261748735" text-anchor="middle" font-size="22.694477596369" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Excellent &gt;95%</text>
  <text x="993.5714" y="457.762252349747" text-anchor="middle" font-size="22.694477596369" font-family="Arial, sans-serif" fill="var(--primary-text)">Well optimized</text>
  <text x="618.5715" y="620" text-anchor="middle" font-size="22.694477596369" font-family="Arial, sans-serif" fill="var(--text)">Formula: keyspace_hits / (keyspace_hits + keyspace_misses) x 100</text>
</svg>

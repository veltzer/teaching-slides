<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowd12_02_caching" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">Cache Hit Ratio Visualization</text>
  <text x="64" y="162" font-size="21.3333" font-weight="bold">Hits:</text>
  <rect x="149.3333" y="115.2" width="853.3333" height="72" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="6.4" />
  <text x="576" y="169.2" text-anchor="middle" font-size="23.4667" fill="#2e7d32" font-weight="bold">keyspace_hits: 85,000</text>
  <text x="64" y="270" font-size="21.3333" font-weight="bold">Miss:</text>
  <rect x="149.3333" y="223.2" width="170.6667" height="72" fill="#ffebee" stroke="#c62828" stroke-width="4.2667" rx="6.4" />
  <text x="234.6667" y="277.2" text-anchor="middle" font-size="23.4667" fill="#c62828" font-weight="bold">15,000</text>
  <rect x="1045.3333" y="115.2" width="213.3333" height="180" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1152" y="187.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Hit Ratio</text>
  <text x="1152" y="259.2" text-anchor="middle" font-size="27.7333" fill="#2e7d32" font-weight="bold">85%</text>
  <rect x="64" y="360" width="234.6667" height="162" fill="#ffebee" stroke="#c62828" stroke-width="2.1333" rx="10.6667" />
  <text x="181.3333" y="424.8" text-anchor="middle" font-size="21.3333" fill="#c62828" font-weight="bold">Poor &lt; 60%</text>
  <text x="181.3333" y="486" text-anchor="middle" font-size="21.3333">Review TTL, size</text>
  <rect x="341.3333" y="360" width="234.6667" height="162" fill="#fff3e0" stroke="#e65100" stroke-width="2.1333" rx="10.6667" />
  <text x="458.6667" y="424.8" text-anchor="middle" font-size="21.3333" fill="#e65100" font-weight="bold">OK 60-80%</text>
  <text x="458.6667" y="486" text-anchor="middle" font-size="21.3333">Room to improve</text>
  <rect x="618.6667" y="360" width="234.6667" height="162" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="10.6667" />
  <text x="736" y="424.8" text-anchor="middle" font-size="21.3333" fill="#2e7d32" font-weight="bold">Good 80-95%</text>
  <text x="736" y="486" text-anchor="middle" font-size="21.3333">Target range</text>
  <rect x="896" y="360" width="234.6667" height="162" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.1333" rx="10.6667" />
  <text x="1013.3333" y="424.8" text-anchor="middle" font-size="21.3333" fill="#1565c0" font-weight="bold">Excellent &gt;95%</text>
  <text x="1013.3333" y="486" text-anchor="middle" font-size="21.3333">Well optimized</text>
  <text x="640" y="630" text-anchor="middle" font-size="21.3333">Formula: keyspace_hits / (keyspace_hits + keyspace_misses) x 100</text>
</svg>
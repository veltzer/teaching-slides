<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd7_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="307.5075" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold">LRU (Least Recently Used)</text>
  <rect x="41.001" y="86.4865" width="533.013" height="553.5135" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" opacity="0.3" />
  <rect x="61.5015" y="121.0811" width="112.7527" height="103.7838" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="116.8529" y="186.8108" text-anchor="middle" font-size="20.5005">Key A</text>
  <text x="116.8529" y="269.8378" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">1s ago</text>
  <rect x="194.7548" y="121.0811" width="112.7527" height="103.7838" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="250.1061" y="186.8108" text-anchor="middle" font-size="20.5005">Key B</text>
  <text x="250.1061" y="269.8378" text-anchor="middle" font-size="20.5005" fill="var(--warn-accent)">30s ago</text>
  <rect x="328.008" y="121.0811" width="112.7527" height="103.7838" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="383.3593" y="186.8108" text-anchor="middle" font-size="20.5005">Key C</text>
  <text x="383.3593" y="269.8378" text-anchor="middle" font-size="20.5005" fill="var(--warn-accent)">2m ago</text>
  <rect x="461.2613" y="121.0811" width="112.7527" height="103.7838" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="516.6126" y="186.8108" text-anchor="middle" font-size="20.5005">Key D</text>
  <text x="516.6126" y="269.8378" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">5m ago</text>
  <text x="516.6126" y="345.9459" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">EVICTED</text>
  <line x1="516.6126" y1="224.8649" x2="516.6126" y2="311.3514" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd7_02_caching)" />
  <text x="307.5075" y="449.7297" text-anchor="middle" font-size="20.5005">Evicts key not used for</text>
  <text x="307.5075" y="501.6216" text-anchor="middle" font-size="20.5005">the longest time</text>
  <text x="922.5225" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold">LFU (Least Frequently Used)</text>
  <rect x="656.016" y="86.4865" width="533.013" height="553.5135" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" opacity="0.3" />
  <rect x="676.5165" y="121.0811" width="112.7527" height="103.7838" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="731.8679" y="186.8108" text-anchor="middle" font-size="20.5005">Key A</text>
  <text x="731.8679" y="269.8378" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">100 hits</text>
  <rect x="809.7698" y="121.0811" width="112.7527" height="103.7838" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="865.1212" y="186.8108" text-anchor="middle" font-size="20.5005">Key B</text>
  <text x="865.1212" y="269.8378" text-anchor="middle" font-size="20.5005" fill="var(--warn-accent)">25 hits</text>
  <rect x="943.023" y="121.0811" width="112.7527" height="103.7838" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="998.3743" y="186.8108" text-anchor="middle" font-size="20.5005">Key C</text>
  <text x="998.3743" y="269.8378" text-anchor="middle" font-size="20.5005" fill="var(--warn-accent)">10 hits</text>
  <rect x="1076.2763" y="121.0811" width="112.7527" height="103.7838" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1131.6276" y="186.8108" text-anchor="middle" font-size="20.5005">Key D</text>
  <text x="1131.6276" y="269.8378" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">2 hits</text>
  <text x="1131.6276" y="345.9459" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">EVICTED</text>
  <line x1="1131.6276" y1="224.8649" x2="1131.6276" y2="311.3514" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd7_02_caching)" />
  <text x="922.5225" y="449.7297" text-anchor="middle" font-size="20.5005">Evicts key with fewest</text>
  <text x="922.5225" y="501.6216" text-anchor="middle" font-size="20.5005">access count</text>
  <text x="615.015" y="622.7027" text-anchor="middle" font-size="20.5005" font-weight="bold">LFU (Redis 4.0+) better for frequency-skewed workloads</text>
</svg>
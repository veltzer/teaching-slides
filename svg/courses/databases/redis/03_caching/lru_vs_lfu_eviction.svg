<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd7_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="318.5714" y="40" text-anchor="middle" font-size="25.2006" font-weight="bold">LRU (Least Recently Used)</text>
  <rect x="40" y="64.3114" width="557.1429" height="555.6886" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" opacity="0.3" />
  <rect x="61.4286" y="99.0419" width="117.8571" height="104.1916" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="119.2858" y="165.0299" text-anchor="middle" font-size="21.0005">Key A</text>
  <text x="119.2858" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--ok-accent)">1s ago</text>
  <rect x="200.7143" y="99.0419" width="117.8571" height="104.1916" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="258.5714" y="165.0299" text-anchor="middle" font-size="21.0005">Key B</text>
  <text x="258.5714" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--warn-accent)">30s ago</text>
  <rect x="340" y="99.0419" width="117.8571" height="104.1916" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="397.8571" y="165.0299" text-anchor="middle" font-size="21.0005">Key C</text>
  <text x="397.8571" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--warn-accent)">2m ago</text>
  <rect x="479.2858" y="99.0419" width="117.8571" height="104.1916" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="537.1429" y="165.0299" text-anchor="middle" font-size="21.0005">Key D</text>
  <text x="537.1429" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)">5m ago</text>
  <text x="537.1429" y="324.7904" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)">EVICTED</text>
  <line x1="537.1429" y1="203.2335" x2="537.1429" y2="290.0599" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd7_02_caching)" />
  <text x="318.5714" y="428.982" text-anchor="middle" font-size="21.0005">Evicts key not used for</text>
  <text x="318.5714" y="481.0778" text-anchor="middle" font-size="21.0005">the longest time</text>
  <text x="961.4286" y="40" text-anchor="middle" font-size="25.2006" font-weight="bold">LFU (Least Frequently Used)</text>
  <rect x="682.8571" y="64.3114" width="557.1429" height="555.6886" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" opacity="0.3" />
  <rect x="704.2857" y="99.0419" width="117.8571" height="104.1916" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="762.1429" y="165.0299" text-anchor="middle" font-size="21.0005">Key A</text>
  <text x="762.1429" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--ok-accent)">100 hits</text>
  <rect x="843.5715" y="99.0419" width="117.8571" height="104.1916" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="901.4287" y="165.0299" text-anchor="middle" font-size="21.0005">Key B</text>
  <text x="901.4287" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--warn-accent)">25 hits</text>
  <rect x="982.8571" y="99.0419" width="117.8571" height="104.1916" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1040.7142" y="165.0299" text-anchor="middle" font-size="21.0005">Key C</text>
  <text x="1040.7142" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--warn-accent)">10 hits</text>
  <rect x="1122.1429" y="99.0419" width="117.8571" height="104.1916" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1180" y="165.0299" text-anchor="middle" font-size="21.0005">Key D</text>
  <text x="1180" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)">2 hits</text>
  <text x="1180" y="324.7904" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)">EVICTED</text>
  <line x1="1180" y1="203.2335" x2="1180" y2="290.0599" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd7_02_caching)" />
  <text x="961.4286" y="428.982" text-anchor="middle" font-size="21.0005">Evicts key with fewest</text>
  <text x="961.4286" y="481.0778" text-anchor="middle" font-size="21.0005">access count</text>
  <text x="640" y="602.6347" text-anchor="middle" font-size="21.0005" font-weight="bold">LFU (Redis 4.0+) better for frequency-skewed workloads</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="318.5714" y="40" text-anchor="middle" font-size="25.2006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">LRU (Least Recently Used)</text>
  <rect x="40" y="64.3114" width="557.1429" height="555.6886" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" opacity="0.3" filter="url(#shadow)"/>
  <rect x="61.4286" y="99.0419" width="117.8571" height="104.1916" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="119.2858" y="165.0299" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--ok-text)">Key A</text>
  <text x="119.2858" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--ok-accent)" font-family="Arial, sans-serif">1s ago</text>
  <rect x="200.7143" y="99.0419" width="117.8571" height="104.1916" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="258.5714" y="165.0299" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">Key B</text>
  <text x="258.5714" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--warn-accent)" font-family="Arial, sans-serif">30s ago</text>
  <rect x="340" y="99.0419" width="117.8571" height="104.1916" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="397.8571" y="165.0299" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">Key C</text>
  <text x="397.8571" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--warn-accent)" font-family="Arial, sans-serif">2m ago</text>
  <rect x="479.2858" y="99.0419" width="117.8571" height="104.1916" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="537.1429" y="165.0299" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--danger-text)">Key D</text>
  <text x="537.1429" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)" font-family="Arial, sans-serif">5m ago</text>
  <text x="537.1429" y="324.7904" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)" font-family="Arial, sans-serif">EVICTED</text>
  <line x1="537.1429" y1="203.2335" x2="537.1429" y2="290.0599" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318.5714" y="428.982" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--primary-text)">Evicts key not used for</text>
  <text x="318.5714" y="481.0778" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--primary-text)">the longest time</text>
  <text x="961.4286" y="40" text-anchor="middle" font-size="25.2006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">LFU (Least Frequently Used)</text>
  <rect x="682.8571" y="64.3114" width="557.1429" height="555.6886" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" opacity="0.3" filter="url(#shadow)"/>
  <rect x="704.2857" y="99.0419" width="117.8571" height="104.1916" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="762.1429" y="165.0299" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--ok-text)">Key A</text>
  <text x="762.1429" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--ok-accent)" font-family="Arial, sans-serif">100 hits</text>
  <rect x="843.5715" y="99.0419" width="117.8571" height="104.1916" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="901.4287" y="165.0299" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">Key B</text>
  <text x="901.4287" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--warn-accent)" font-family="Arial, sans-serif">25 hits</text>
  <rect x="982.8571" y="99.0419" width="117.8571" height="104.1916" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1040.7142" y="165.0299" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">Key C</text>
  <text x="1040.7142" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--warn-accent)" font-family="Arial, sans-serif">10 hits</text>
  <rect x="1122.1429" y="99.0419" width="117.8571" height="104.1916" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1180" y="165.0299" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--danger-text)">Key D</text>
  <text x="1180" y="248.3832" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)" font-family="Arial, sans-serif">2 hits</text>
  <text x="1180" y="324.7904" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)" font-family="Arial, sans-serif">EVICTED</text>
  <line x1="1180" y1="203.2335" x2="1180" y2="290.0599" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="961.4286" y="428.982" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--info-text)">Evicts key with fewest</text>
  <text x="961.4286" y="481.0778" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--info-text)">access count</text>
  <text x="640" y="602.6347" text-anchor="middle" font-size="21.0005" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">LFU (Redis 4.0+) better for frequency-skewed workloads</text>
</svg>

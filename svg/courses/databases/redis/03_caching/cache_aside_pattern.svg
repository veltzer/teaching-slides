<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="206.8965" height="153.5294" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="143.4484" y="132.1176" text-anchor="middle" font-size="22.4977" font-weight="bold">Application</text>
  <rect x="433.1035" y="40" width="206.8965" height="153.5294" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="536.5517" y="132.1176" text-anchor="middle" font-size="22.4977" font-weight="bold">Redis Cache</text>
  <rect x="846.8966" y="40" width="206.8965" height="153.5294" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="950.3448" y="132.1176" text-anchor="middle" font-size="22.4977" font-weight="bold">Database</text>
  <line x1="246.8966" y1="91.1765" x2="428.9656" y2="91.1765" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd1_02_caching)" />
  <text x="340.0001" y="74.1176" text-anchor="middle" font-size="20.4523" fill="var(--primary-accent)">1. GET key</text>
  <line x1="428.9656" y1="142.3529" x2="251.0346" y2="142.3529" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.5852 7.5852" marker-end="url(#arrowd1_02_caching)" />
  <text x="340.0001" y="193.5294" text-anchor="middle" font-size="20.4523" fill="var(--warn-accent)">2. MISS</text>
  <line x1="246.8966" y1="312.9412" x2="842.7587" y2="312.9412" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrowd1_02_caching)" />
  <text x="546.8966" y="295.8824" text-anchor="middle" font-size="20.4523" fill="var(--info-accent)">3. Query DB</text>
  <line x1="842.7587" y1="364.1176" x2="251.0346" y2="364.1176" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="7.5852 7.5852" marker-end="url(#arrowd1_02_caching)" />
  <text x="546.8966" y="415.2941" text-anchor="middle" font-size="20.4523" fill="var(--info-accent)">4. Return data</text>
  <line x1="246.8966" y1="483.5294" x2="428.9656" y2="483.5294" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd1_02_caching)" />
  <text x="340.0001" y="466.4706" text-anchor="middle" font-size="20.4523" fill="var(--ok-accent)">5. SET key</text>
  <rect x="1074.4828" y="40" width="165.5172" height="580" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.6" />
  <text x="1157.2413" y="125.2941" text-anchor="middle" font-size="20.4523" font-weight="bold">Lazy</text>
  <text x="1157.2413" y="176.4706" text-anchor="middle" font-size="20.4523" font-weight="bold">Loading</text>
  <text x="1157.2413" y="278.8235" text-anchor="middle" font-size="20.4523">Cache only</text>
  <text x="1157.2413" y="330" text-anchor="middle" font-size="20.4523">populated</text>
  <text x="1157.2413" y="381.1765" text-anchor="middle" font-size="20.4523">on read</text>
</svg>
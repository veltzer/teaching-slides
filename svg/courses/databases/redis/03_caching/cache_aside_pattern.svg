<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="206.8965" height="153.5294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="143.4484" y="132.1176" text-anchor="middle" font-size="22.4977" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Application</text>
  <rect x="433.1035" y="40" width="206.8965" height="153.5294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="536.5517" y="132.1176" text-anchor="middle" font-size="22.4977" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Cache</text>
  <rect x="846.8966" y="40" width="206.8965" height="153.5294" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="950.3448" y="132.1176" text-anchor="middle" font-size="22.4977" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Database</text>
  <line x1="246.8966" y1="91.1765" x2="428.9656" y2="91.1765" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340.0001" y="74.1176" text-anchor="middle" font-size="20.4523" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. GET key</text>
  <line x1="428.9656" y1="142.3529" x2="251.0346" y2="142.3529" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.5852 7.5852" marker-end="url(#arrow)"/>
  <text x="340.0001" y="193.5294" text-anchor="middle" font-size="20.4523" fill="var(--warn-accent)" font-family="Arial, sans-serif">2. MISS</text>
  <line x1="246.8966" y1="312.9412" x2="842.7587" y2="312.9412" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="546.8966" y="295.8824" text-anchor="middle" font-size="20.4523" fill="var(--info-accent)" font-family="Arial, sans-serif">3. Query DB</text>
  <line x1="842.7587" y1="364.1176" x2="251.0346" y2="364.1176" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="7.5852 7.5852" marker-end="url(#arrow)"/>
  <text x="546.8966" y="415.2941" text-anchor="middle" font-size="20.4523" fill="var(--info-accent)" font-family="Arial, sans-serif">4. Return data</text>
  <line x1="246.8966" y1="483.5294" x2="428.9656" y2="483.5294" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340.0001" y="466.4706" text-anchor="middle" font-size="20.4523" fill="var(--ok-accent)" font-family="Arial, sans-serif">5. SET key</text>
  <rect x="1074.4828" y="40" width="165.5172" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.6" filter="url(#shadow)"/>
  <text x="1157.2413" y="125.2941" text-anchor="middle" font-size="20.4523" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Lazy</text>
  <text x="1157.2413" y="176.4706" text-anchor="middle" font-size="20.4523" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Loading</text>
  <text x="1157.2413" y="278.8235" text-anchor="middle" font-size="20.4523" font-family="Arial, sans-serif" fill="var(--ok-text)">Cache only</text>
  <text x="1157.2413" y="330" text-anchor="middle" font-size="20.4523" font-family="Arial, sans-serif" fill="var(--ok-text)">populated</text>
  <text x="1157.2413" y="381.1765" text-anchor="middle" font-size="20.4523" font-family="Arial, sans-serif" fill="var(--ok-text)">on read</text>
</svg>

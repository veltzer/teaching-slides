<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="478.2609" y="40" width="333.913" height="108.75" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="645.2174" y="112.5" text-anchor="middle" font-size="23.2907" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Popular key EXPIRES!</text>
  <rect x="40" y="203.125" width="166.9565" height="90.625" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="123.4783" y="264.75" text-anchor="middle" font-size="21.1733" font-family="Arial, sans-serif" fill="var(--primary-text)">Request 1</text>
  <rect x="40" y="311.875" width="166.9565" height="90.625" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="123.4783" y="373.5" text-anchor="middle" font-size="21.1733" font-family="Arial, sans-serif" fill="var(--primary-text)">Request 2</text>
  <rect x="40" y="420.625" width="166.9565" height="90.625" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="123.4783" y="482.25" text-anchor="middle" font-size="21.1733" font-family="Arial, sans-serif" fill="var(--primary-text)">Request 3</text>
  <rect x="40" y="529.375" width="166.9565" height="90.625" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="123.4783" y="591" text-anchor="middle" font-size="21.1733" font-family="Arial, sans-serif" fill="var(--primary-text)">Request N</text>
  <rect x="332.1739" y="221.25" width="187.8261" height="380.625" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="426.087" y="311.875" text-anchor="middle" font-size="21.1733" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Redis</text>
  <text x="426.087" y="366.25" text-anchor="middle" font-size="23.2907" fill="var(--danger-accent)" font-family="Arial, sans-serif">MISS!</text>
  <text x="426.087" y="420.625" text-anchor="middle" font-size="23.2907" fill="var(--danger-accent)" font-family="Arial, sans-serif">MISS!</text>
  <text x="426.087" y="475" text-anchor="middle" font-size="23.2907" fill="var(--danger-accent)" font-family="Arial, sans-serif">MISS!</text>
  <text x="426.087" y="547.5" text-anchor="middle" font-size="23.2907" fill="var(--danger-accent)" font-family="Arial, sans-serif">MISS!</text>
  <line x1="206.9565" y1="246.625" x2="328" y2="293.75" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="206.9565" y1="355.375" x2="328" y2="355.375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="206.9565" y1="464.125" x2="328" y2="420.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="206.9565" y1="572.875" x2="328" y2="493.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="666.0869" y="221.25" width="208.6956" height="380.625" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="770.4348" y="311.875" text-anchor="middle" font-size="21.1733" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Database</text>
  <text x="770.4348" y="384.375" text-anchor="middle" font-size="25.408" fill="var(--danger-accent)" font-family="Arial, sans-serif">OVERLOAD</text>
  <text x="770.4348" y="456.875" text-anchor="middle" font-size="21.1733" fill="var(--danger-accent)" font-family="Arial, sans-serif">N identical</text>
  <text x="770.4348" y="511.25" text-anchor="middle" font-size="21.1733" fill="var(--danger-accent)" font-family="Arial, sans-serif">queries!</text>
  <line x1="520" y1="311.875" x2="661.9131" y2="311.875" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="384.375" x2="661.9131" y2="384.375" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="456.875" x2="661.9131" y2="456.875" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="529.375" x2="661.9131" y2="529.375" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="937.3913" y="221.25" width="302.6087" height="380.625" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" opacity="0.6" filter="url(#shadow)"/>
  <text x="1087.6522" y="311.875" text-anchor="middle" font-size="21.1733" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Result:</text>
  <text x="1087.6522" y="384.375" text-anchor="middle" font-size="21.1733" font-family="Arial, sans-serif" fill="var(--info-text)">Cascading failures</text>
  <text x="1087.6522" y="438.75" text-anchor="middle" font-size="21.1733" font-family="Arial, sans-serif" fill="var(--info-text)">Slow responses</text>
  <text x="1087.6522" y="493.125" text-anchor="middle" font-size="21.1733" font-family="Arial, sans-serif" fill="var(--info-text)">Possible DB crash</text>
</svg>

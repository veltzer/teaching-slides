  <text x="106.6667" y="457.2" text-anchor="middle" font-size="21.3333">Request 3</text>
  <rect x="21.3333" y="504" width="170.6667" height="90" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="106.6667" y="565.2" text-anchor="middle" font-size="21.3333">Request N</text>
  <rect x="320" y="198" width="192" height="378" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="416" y="288" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--warn-accent)">Redis</text>
  <text x="416" y="342" text-anchor="middle" font-size="23.4667" fill="var(--danger-accent)">MISS!</text>
  <text x="416" y="396" text-anchor="middle" font-size="23.4667" fill="var(--danger-accent)">MISS!</text>
  <text x="416" y="450" text-anchor="middle" font-size="23.4667" fill="var(--danger-accent)">MISS!</text>
  <text x="416" y="522" text-anchor="middle" font-size="23.4667" fill="var(--danger-accent)">MISS!</text>
  <line x1="192" y1="223.2" x2="315.7333" y2="270" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd9_02_caching)" />
  <line x1="192" y1="331.2" x2="315.7333" y2="331.2" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd9_02_caching)" />
  <line x1="192" y1="439.2" x2="315.7333" y2="396" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd9_02_caching)" />
  <line x1="192" y1="547.2" x2="315.7333" y2="468" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd9_02_caching)" />
  <rect x="661.3333" y="198" width="213.3333" height="378" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="768" y="288" text-anchor="middle" font-size="21.3333" font-weight="bold">Database</text>
  <text x="768" y="360" text-anchor="middle" font-size="25.6" fill="var(--danger-accent)">OVERLOAD</text>
  <text x="768" y="432" text-anchor="middle" font-size="21.3333" fill="var(--danger-accent)">N identical</text>
  <text x="768" y="486" text-anchor="middle" font-size="21.3333" fill="var(--danger-accent)">queries!</text>
  <line x1="512" y1="288" x2="657.0667" y2="288" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd9_02_caching)" />
  <line x1="512" y1="360" x2="657.0667" y2="360" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd9_02_caching)" />
  <line x1="512" y1="432" x2="657.0667" y2="432" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd9_02_caching)" />
  <line x1="512" y1="504" x2="657.0667" y2="504" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd9_02_caching)" />
  <rect x="938.6667" y="198" width="309.3333" height="378" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" opacity="0.6" />
  <text x="1092.2667" y="288" text-anchor="middle" font-size="21.3333" font-weight="bold">Result:</text>

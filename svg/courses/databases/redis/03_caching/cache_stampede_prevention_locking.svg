<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="56.5714" width="157.8948" height="82.8572" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="117.8948" y="112.9143" text-anchor="middle" font-size="20.3342" font-family="Arial, sans-serif" fill="var(--ok-text)">Req 1</text>
  <rect x="40" y="189.1429" width="157.8948" height="82.8572" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="117.8948" y="245.4857" text-anchor="middle" font-size="20.3342" font-family="Arial, sans-serif" fill="var(--warn-text)">Req 2</text>
  <rect x="40" y="305.1429" width="157.8948" height="82.8572" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="117.8948" y="361.4857" text-anchor="middle" font-size="20.3342" font-family="Arial, sans-serif" fill="var(--warn-text)">Req 3</text>
  <rect x="292.6316" y="40" width="231.5789" height="182.2857" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="408.4211" y="106.2857" text-anchor="middle" font-size="20.3342" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Lock</text>
  <text x="408.4211" y="165.9429" text-anchor="middle" font-size="20.3342" fill="var(--ok-accent)" font-family="Arial, sans-serif">SET NX EX 5</text>
  <line x1="197.8947" y1="96.3428" x2="288.421" y2="106.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="244.2106" y="73.1429" text-anchor="middle" font-size="20.3342" fill="var(--ok-accent)" font-family="Arial, sans-serif">Lock OK</text>
  <line x1="197.8947" y1="228.9143" x2="288.421" y2="172.5715" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrow)"/>
  <line x1="197.8947" y1="344.9143" x2="288.421" y2="189.1429" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrow)"/>
  <text x="244.2106" y="278.6286" text-anchor="middle" font-size="20.3342" fill="var(--warn-accent)" font-family="Arial, sans-serif">Wait...</text>
  <rect x="650.5263" y="40" width="189.4737" height="132.5715" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="745.2631" y="119.5428" text-anchor="middle" font-size="20.3342" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Database</text>
  <line x1="524.2105" y1="106.2857" x2="646.3157" y2="106.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="587.3684" y="79.7714" text-anchor="middle" font-size="20.3342" fill="var(--ok-accent)" font-family="Arial, sans-serif">1 query</text>
  <rect x="650.5263" y="238.8572" width="189.4737" height="132.5715" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="745.2631" y="295.2" text-anchor="middle" font-size="20.3342" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Cache SET</text>
  <text x="745.2631" y="344.9143" text-anchor="middle" font-size="20.3342" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Release lock</text>
  <line x1="745.2631" y1="172.5715" x2="745.2631" y2="232.2285" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="945.2632" y="189.1429" width="294.7368" height="182.2857" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1092.6315" y="245.4857" text-anchor="middle" font-size="20.3342" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Req 2, 3 retry</text>
  <text x="1092.6315" y="298.5143" text-anchor="middle" font-size="20.3342" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cache HIT!</text>
  <text x="1092.6315" y="348.2285" text-anchor="middle" font-size="20.3342" font-family="Arial, sans-serif" fill="var(--primary-text)">No DB query needed</text>
  <line x1="839.9999" y1="305.1429" x2="941.0526" y2="288.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="470.8571" width="1199.9999" height="149.1429" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.4" filter="url(#shadow)"/>
  <text x="650.5263" y="530.5143" text-anchor="middle" font-size="20.3342" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Only 1 request rebuilds cache. Others wait and read from cache.</text>
  <text x="650.5263" y="586.8571" text-anchor="middle" font-size="20.3342" font-family="Arial, sans-serif" fill="var(--ok-text)">Uses SET key lock_id NX EX timeout for atomic lock acquisition.</text>
</svg>

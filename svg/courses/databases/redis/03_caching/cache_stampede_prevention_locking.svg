  <line x1="174.2542" y1="352.8649" x2="262.4064" y2="190.2703" stroke="var(--warn-dk)" stroke-width="2.05" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrowd10_02_caching)" />

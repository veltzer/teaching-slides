  <text x="615.015" y="546.5946" text-anchor="middle" font-size="20.5005" font-weight="bold">Only 1 request rebuilds cache. Others wait and read from cache.</text>
  <text x="615.015" y="605.4054" text-anchor="middle" font-size="20.5005">Uses SET key lock_id NX EX timeout for atomic lock acquisition.</text>

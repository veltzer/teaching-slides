<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd10_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="56.5714" width="157.8948" height="82.8572" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="117.8948" y="112.9143" text-anchor="middle" font-size="20.3342">Req 1</text>
  <rect x="40" y="189.1429" width="157.8948" height="82.8572" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="117.8948" y="245.4857" text-anchor="middle" font-size="20.3342">Req 2</text>
  <rect x="40" y="305.1429" width="157.8948" height="82.8572" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="117.8948" y="361.4857" text-anchor="middle" font-size="20.3342">Req 3</text>
  <rect x="292.6316" y="40" width="231.5789" height="182.2857" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="408.4211" y="106.2857" text-anchor="middle" font-size="20.3342" font-weight="bold">Redis Lock</text>
  <text x="408.4211" y="165.9429" text-anchor="middle" font-size="20.3342" fill="var(--ok-accent)">SET NX EX 5</text>
  <line x1="197.8947" y1="96.3428" x2="288.421" y2="106.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd10_02_caching)" />
  <text x="244.2106" y="73.1429" text-anchor="middle" font-size="20.3342" fill="var(--ok-accent)">Lock OK</text>
  <line x1="197.8947" y1="228.9143" x2="288.421" y2="172.5715" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrowd10_02_caching)" />
  <line x1="197.8947" y1="344.9143" x2="288.421" y2="189.1429" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrowd10_02_caching)" />
  <text x="244.2106" y="278.6286" text-anchor="middle" font-size="20.3342" fill="var(--warn-accent)">Wait...</text>
  <rect x="650.5263" y="40" width="189.4737" height="132.5715" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="745.2631" y="119.5428" text-anchor="middle" font-size="20.3342" font-weight="bold">Database</text>
  <line x1="524.2105" y1="106.2857" x2="646.3157" y2="106.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd10_02_caching)" />
  <text x="587.3684" y="79.7714" text-anchor="middle" font-size="20.3342" fill="var(--ok-accent)">1 query</text>
  <rect x="650.5263" y="238.8572" width="189.4737" height="132.5715" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="745.2631" y="295.2" text-anchor="middle" font-size="20.3342" font-weight="bold">Cache SET</text>
  <text x="745.2631" y="344.9143" text-anchor="middle" font-size="20.3342" fill="var(--ok-accent)">+ Release lock</text>
  <line x1="745.2631" y1="172.5715" x2="745.2631" y2="232.2285" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd10_02_caching)" />
  <rect x="945.2632" y="189.1429" width="294.7368" height="182.2857" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1092.6315" y="245.4857" text-anchor="middle" font-size="20.3342" font-weight="bold">Req 2, 3 retry</text>
  <text x="1092.6315" y="298.5143" text-anchor="middle" font-size="20.3342" fill="var(--ok-accent)">Cache HIT!</text>
  <text x="1092.6315" y="348.2285" text-anchor="middle" font-size="20.3342">No DB query needed</text>
  <line x1="839.9999" y1="305.1429" x2="941.0526" y2="288.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd10_02_caching)" />
  <rect x="40" y="470.8571" width="1199.9999" height="149.1429" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.4" />
  <text x="650.5263" y="530.5143" text-anchor="middle" font-size="20.3342" font-weight="bold">Only 1 request rebuilds cache. Others wait and read from cache.</text>
  <text x="650.5263" y="586.8571" text-anchor="middle" font-size="20.3342">Uses SET key lock_id NX EX timeout for atomic lock acquisition.</text>
</svg>
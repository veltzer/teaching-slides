<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd10_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="20.5005" y="51.8919" width="153.7538" height="86.4865" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="96.3524" y="110.7027" text-anchor="middle" font-size="20.5005">Req 1</text>
  <rect x="20.5005" y="190.2703" width="153.7538" height="86.4865" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="96.3524" y="249.0811" text-anchor="middle" font-size="20.5005">Req 2</text>
  <rect x="20.5005" y="311.3514" width="153.7538" height="86.4865" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="96.3524" y="370.1622" text-anchor="middle" font-size="20.5005">Req 3</text>
  <rect x="266.5065" y="34.5946" width="225.5055" height="190.2703" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="379.2593" y="103.7838" text-anchor="middle" font-size="20.5005" font-weight="bold">Redis Lock</text>
  <text x="379.2593" y="166.0541" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">SET NX EX 5</text>
  <line x1="174.2542" y1="93.4054" x2="262.4064" y2="103.7838" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd10_02_caching)" />
  <text x="219.3554" y="69.1892" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">Lock OK</text>
  <line x1="174.2542" y1="231.7838" x2="262.4064" y2="172.973" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrowd10_02_caching)" />
  <line x1="174.2542" y1="352.8649" x2="262.4064" y2="190.2703" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrowd10_02_caching)" />
  <text x="219.3554" y="283.6757" text-anchor="middle" font-size="20.5005" fill="var(--warn-accent)">Wait...</text>
  <rect x="615.015" y="34.5946" width="184.5045" height="138.3784" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="707.2673" y="117.6216" text-anchor="middle" font-size="20.5005" font-weight="bold">Database</text>
  <line x1="492.012" y1="103.7838" x2="610.9149" y2="103.7838" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd10_02_caching)" />
  <text x="553.5135" y="76.1081" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">1 query</text>
  <rect x="615.015" y="242.1622" width="184.5045" height="138.3784" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="707.2673" y="300.973" text-anchor="middle" font-size="20.5005" font-weight="bold">Cache SET</text>
  <text x="707.2673" y="352.8649" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">+ Release lock</text>
  <line x1="707.2673" y1="172.973" x2="707.2673" y2="235.2432" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd10_02_caching)" />
  <rect x="902.0221" y="190.2703" width="287.007" height="190.2703" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1045.5255" y="249.0811" text-anchor="middle" font-size="20.5005" font-weight="bold">Req 2, 3 retry</text>
  <text x="1045.5255" y="304.4324" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">Cache HIT!</text>
  <text x="1045.5255" y="356.3243" text-anchor="middle" font-size="20.5005">No DB query needed</text>
  <line x1="799.5195" y1="311.3514" x2="897.9219" y2="294.0541" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd10_02_caching)" />
  <rect x="20.5005" y="484.3243" width="1168.5285" height="155.6757" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.4" />
  <text x="615.015" y="546.5946" text-anchor="middle" font-size="20.5005" font-weight="bold">Only 1 request rebuilds cache. Others wait and read from cache.</text>
  <text x="615.015" y="605.4054" text-anchor="middle" font-size="20.5005">Uses SET key lock_id NX EX timeout for atomic lock acquisition.</text>
</svg>
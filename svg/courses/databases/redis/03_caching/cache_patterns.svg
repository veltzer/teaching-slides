<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="230" height="270" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Cache-Aside</text>
  <text x="155" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Read: cache, then DB</text>
  <text x="155" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Write: DB, then invalidate</text>
  <text x="155" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">App manages cache</text>
  <text x="155" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">Most common</text>

  <rect x="290" y="40" width="230" height="270" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="405" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Write-Through</text>
  <text x="405" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Sync: cache + DB</text>
  <text x="405" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Always consistent</text>
  <text x="405" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Slower writes</text>
  <text x="405" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-text)">Strong consistency</text>

  <rect x="540" y="40" width="230" height="270" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Write-Behind</text>
  <text x="655" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Write cache first</text>
  <text x="655" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Async flush</text>
  <text x="655" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Loss risk</text>
  <text x="655" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">High throughput</text>

  <rect x="790" y="40" width="230" height="270" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="905" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Read-Through</text>
  <text x="905" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Cache loads from DB</text>
  <text x="905" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">App only sees cache</text>
  <text x="905" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Simple app</text>
  <text x="905" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">Transparent</text>

  <rect x="1040" y="40" width="200" height="270" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Refresh-Ahead</text>
  <text x="1140" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Proactive refresh</text>
  <text x="1140" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Before TTL</text>
  <text x="1140" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">No misses</text>
  <text x="1140" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-text)">Lowest latency</text>

  <rect x="40" y="340" width="1200" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Selection Guide</text>

  <text x="200" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Pattern</text>
  <text x="500" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Write</text>
  <text x="760" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Consistency</text>
  <text x="1050" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Best For</text>

  <text x="200" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)">Cache-Aside</text>
  <text x="500" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">N/A</text>
  <text x="760" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-accent)">Eventual</text>
  <text x="1050" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Read-heavy</text>

  <text x="200" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">Write-Through</text>
  <text x="500" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-accent)">Slow</text>
  <text x="760" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">Strong</text>
  <text x="1050" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Critical data</text>

  <text x="200" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-accent)">Write-Behind</text>
  <text x="500" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">Fast</text>
  <text x="760" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">Weak</text>
  <text x="1050" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Write-heavy</text>

  <text x="200" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)">Read-Through</text>
  <text x="500" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">N/A</text>
  <text x="760" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-accent)">Eventual</text>
  <text x="1050" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Simpler apps</text>

  <text x="200" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">Refresh-Ahead</text>
  <text x="500" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">N/A</text>
  <text x="760" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">Good</text>
  <text x="1050" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Predictable</text>
</svg>

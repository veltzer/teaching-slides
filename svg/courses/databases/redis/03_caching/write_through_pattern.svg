<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowd2_02_caching" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="21.3333" y="252" width="213.3333" height="162" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="128" y="349.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Application</text>
  <rect x="426.6667" y="72" width="213.3333" height="162" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="533.3333" y="169.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Redis Cache</text>
  <rect x="426.6667" y="432" width="213.3333" height="162" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="533.3333" y="529.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Database</text>
  <line x1="234.6667" y1="295.2" x2="422.4" y2="172.8" stroke="#e65100" stroke-width="4.2667" marker-end="url(#arrowd2_02_caching)" />
  <text x="298.6667" y="187.2" text-anchor="middle" font-size="21.3333" fill="#e65100">1. Write</text>
  <line x1="234.6667" y1="367.2" x2="422.4" y2="486" stroke="#6a1b9a" stroke-width="4.2667" marker-end="url(#arrowd2_02_caching)" />
  <text x="298.6667" y="486" text-anchor="middle" font-size="21.3333" fill="#6a1b9a">2. Write</text>
  <line x1="533.3333" y1="234" x2="533.3333" y2="424.8" stroke="#333" stroke-width="2.1333" stroke-dasharray="6.4 6.4" />
  <text x="586.6667" y="342" text-anchor="middle" font-size="21.3333" fill="#333">Sync</text>
  <rect x="810.6667" y="72" width="426.6667" height="540" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="10.6667" opacity="0.5" />
  <text x="1024" y="162" text-anchor="middle" font-size="23.4667" font-weight="bold">Write-Through</text>
  <text x="1024" y="234" text-anchor="middle" font-size="21.3333">+ Data consistency</text>
  <text x="1024" y="288" text-anchor="middle" font-size="21.3333">+ Cache always fresh</text>
  <text x="1024" y="360" text-anchor="middle" font-size="21.3333">- Higher write latency</text>
  <text x="1024" y="414" text-anchor="middle" font-size="21.3333">- Both must succeed</text>
</svg>
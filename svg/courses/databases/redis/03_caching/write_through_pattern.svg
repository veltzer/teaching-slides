<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="233.3333" width="210.5263" height="174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="145.2632" y="337.7333" text-anchor="middle" font-size="24.1598" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Application</text>
  <rect x="440" y="40" width="210.5263" height="174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="545.2631" y="144.4" text-anchor="middle" font-size="24.1598" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Cache</text>
  <rect x="440" y="426.6667" width="210.5263" height="174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="545.2631" y="531.0667" text-anchor="middle" font-size="24.1598" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Database</text>
  <line x1="250.5264" y1="279.7333" x2="435.7895" y2="148.2667" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="313.6843" y="163.7333" text-anchor="middle" font-size="21.9634" fill="var(--warn-accent)" font-family="Arial, sans-serif">1. Write</text>
  <line x1="250.5264" y1="357.0667" x2="435.7895" y2="484.6667" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="313.6843" y="484.6667" text-anchor="middle" font-size="21.9634" fill="var(--info-accent)" font-family="Arial, sans-serif">2. Write</text>
  <line x1="545.2631" y1="214" x2="545.2631" y2="418.9333" stroke="var(--text)" stroke-width="2" stroke-dasharray="6.4 6.4"/>
  <text x="597.8948" y="330" text-anchor="middle" font-size="21.9634" fill="var(--text)" font-family="Arial, sans-serif">Sync</text>
  <rect x="818.9474" y="40" width="421.0526" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.5" filter="url(#shadow)"/>
  <text x="1029.4736" y="136.6667" text-anchor="middle" font-size="24.1598" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Write-Through</text>
  <text x="1029.4736" y="214" text-anchor="middle" font-size="21.9634" font-family="Arial, sans-serif" fill="var(--ok-text)">+ Data consistency</text>
  <text x="1029.4736" y="272" text-anchor="middle" font-size="21.9634" font-family="Arial, sans-serif" fill="var(--ok-text)">+ Cache always fresh</text>
  <text x="1029.4736" y="349.3333" text-anchor="middle" font-size="21.9634" font-family="Arial, sans-serif" fill="var(--ok-text)">- Higher write latency</text>
  <text x="1029.4736" y="407.3333" text-anchor="middle" font-size="21.9634" font-family="Arial, sans-serif" fill="var(--ok-text)">- Both must succeed</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd0_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="42.14" y="213.3333" width="231.7696" height="177.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="158.0247" y="291.5556" text-anchor="middle" font-size="23.177" font-weight="bold">Application</text>
  <text x="158.0247" y="348.4444" text-anchor="middle" font-size="21.0699">Request data</text>
  <rect x="505.679" y="213.3333" width="252.8395" height="177.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="291.5556" text-anchor="middle" font-size="23.177" font-weight="bold">Redis Cache</text>
  <text x="632.0988" y="348.4444" text-anchor="middle" font-size="21.0699">Fast in-memory</text>
  <rect x="969.2181" y="213.3333" width="252.8395" height="177.7778" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1095.6378" y="291.5556" text-anchor="middle" font-size="23.177" font-weight="bold">Database</text>
  <text x="1095.6378" y="348.4444" text-anchor="middle" font-size="21.0699">Persistent store</text>
  <line x1="273.9094" y1="284.4444" x2="501.465" y2="284.4444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_02_caching)" />
  <line x1="758.5185" y1="284.4444" x2="965.0041" y2="284.4444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_02_caching)" />
  <text x="389.7943" y="256" text-anchor="middle" font-size="21.0699" fill="var(--primary-accent)">GET</text>
  <text x="863.8683" y="256" text-anchor="middle" font-size="21.0699" fill="var(--info-accent)">Miss</text>
  <line x1="501.465" y1="355.5556" x2="273.9094" y2="355.5556" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="10.535 10.535" marker-end="url(#arrowd0_02_caching)" />
  <text x="389.7943" y="419.5556" text-anchor="middle" font-size="21.0699" fill="var(--ok-accent)">Hit: ~0.5ms</text>
  <text x="863.8683" y="419.5556" text-anchor="middle" font-size="21.0699" fill="var(--warn-accent)">Fallback: ~10ms</text>
  <rect x="42.14" y="497.7778" width="1179.9177" height="142.2222" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.5" />
  <text x="632.0988" y="586.6667" text-anchor="middle" font-size="23.177">Caching reduces latency and offloads the database</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="210.5263" height="226.9566" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="145.2632" y="176.1739" text-anchor="middle" font-size="27.5924" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Application</text>
  <rect x="397.8947" y="40" width="210.5263" height="226.9566" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="503.1579" y="176.1739" text-anchor="middle" font-size="27.5924" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Cache</text>
  <rect x="734.7368" y="40" width="168.4211" height="226.9566" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="818.9475" y="140.8696" text-anchor="middle" font-size="25.084" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Write</text>
  <text x="818.9475" y="206.4347" text-anchor="middle" font-size="25.084" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Queue</text>
  <rect x="1029.4737" y="40" width="210.5263" height="226.9566" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1134.7369" y="176.1739" text-anchor="middle" font-size="27.5924" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Database</text>
  <line x1="250.5263" y1="125.7391" x2="393.6842" y2="125.7391" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="324.2105" y="100.5217" text-anchor="middle" font-size="25.084" fill="var(--warn-accent)" font-family="Arial, sans-serif">1. Write</text>
  <line x1="608.4211" y1="150.9565" x2="730.5263" y2="150.9565" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="671.5789" y="100.5217" text-anchor="middle" font-size="25.084" fill="var(--danger-accent)" font-family="Arial, sans-serif">2. Queue</text>
  <line x1="903.1579" y1="150.9565" x2="1025.2632" y2="150.9565" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrow)" />
  <text x="966.3158" y="100.5217" text-anchor="middle" font-size="25.084" fill="var(--info-accent)" font-family="Arial, sans-serif">3. Async</text>
  <line x1="393.6842" y1="201.3913" x2="254.7368" y2="201.3913" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrow)" />
  <text x="324.2105" y="292.1738" text-anchor="middle" font-size="25.084" fill="var(--ok-accent)" font-family="Arial, sans-serif">ACK (fast)</text>
  <rect x="40" y="418.2608" width="1200" height="201.7392" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.5" filter="url(#shadow)"/>
  <text x="650.5263" y="534.2609" text-anchor="middle" font-size="25.084" font-family="Arial, sans-serif" fill="var(--ok-text)">Low write latency, eventual DB persistence. Risk: data loss if cache fails before flush.</text>
</svg>
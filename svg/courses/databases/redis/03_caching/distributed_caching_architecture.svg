<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd11_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="189.4737" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="134.7368" y="112.9143" text-anchor="middle" font-size="20.3341" font-weight="bold">App Server 1</text>
  <rect x="40" y="189.1429" width="189.4737" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="134.7368" y="262.0571" text-anchor="middle" font-size="20.3341" font-weight="bold">App Server 2</text>
  <rect x="40" y="338.2857" width="189.4737" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="134.7368" y="411.2" text-anchor="middle" font-size="20.3341" font-weight="bold">App Server 3</text>
  <rect x="397.8947" y="73.1428" width="294.7368" height="364.5714" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="545.2631" y="156.0001" text-anchor="middle" font-size="24.401" font-weight="bold">Redis Cache</text>
  <text x="545.2631" y="215.6571" text-anchor="middle" font-size="20.3341">(shared instance)</text>
  <rect x="429.4737" y="248.8" width="231.579" height="66.2857" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="545.2631" y="298.5143" text-anchor="middle" font-size="20.3341">user:42 = {...}</text>
  <rect x="429.4737" y="328.3428" width="231.579" height="66.2857" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="545.2631" y="378.0572" text-anchor="middle" font-size="20.3341">product:7 = {...}</text>
  <rect x="924.2105" y="139.4285" width="252.6316" height="198.8572" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1050.5262" y="228.9143" text-anchor="middle" font-size="22.3676" font-weight="bold">Database</text>
  <text x="1050.5262" y="295.2" text-anchor="middle" font-size="20.3341">Source of truth</text>
  <line x1="229.4737" y1="96.3429" x2="393.6842" y2="189.1429" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrowd11_02_caching)" />
  <line x1="229.4737" y1="245.4857" x2="393.6842" y2="245.4857" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrowd11_02_caching)" />
  <line x1="229.4737" y1="394.6286" x2="393.6842" y2="321.7143" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrowd11_02_caching)" />
  <line x1="692.6316" y1="245.4857" x2="920" y2="245.4857" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="7.9844 7.9844" marker-end="url(#arrowd11_02_caching)" />
  <text x="808.421" y="222.2858" text-anchor="middle" font-size="20.3341" fill="var(--info-accent)">On miss</text>
  <rect x="40" y="504" width="1200" height="116" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.4" />
  <text x="650.5263" y="576.9143" text-anchor="middle" font-size="20.3341">All app servers share one Redis cache -- consistent view, no local cache drift</text>
</svg>
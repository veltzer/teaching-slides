<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd11_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="19.961" y="50.5263" width="179.6491" height="117.8947" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="109.7855" y="124.6316" text-anchor="middle" font-size="19.961" font-weight="bold">App Server 1</text>
  <rect x="19.961" y="202.1053" width="179.6491" height="117.8947" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="109.7855" y="276.2105" text-anchor="middle" font-size="19.961" font-weight="bold">App Server 2</text>
  <rect x="19.961" y="353.6842" width="179.6491" height="117.8947" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="109.7855" y="427.7895" text-anchor="middle" font-size="19.961" font-weight="bold">App Server 3</text>
  <rect x="359.2982" y="84.2105" width="279.4542" height="370.5263" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="499.0253" y="168.4211" text-anchor="middle" font-size="23.9532" font-weight="bold">Redis Cache</text>
  <text x="499.0253" y="229.0526" text-anchor="middle" font-size="19.961">(shared instance)</text>
  <rect x="389.2398" y="262.7368" width="219.5712" height="67.3684" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="499.0253" y="313.2632" text-anchor="middle" font-size="19.961">user:42 = {...}</text>
  <rect x="389.2398" y="343.5789" width="219.5712" height="67.3684" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="499.0253" y="394.1053" text-anchor="middle" font-size="19.961">product:7 = {...}</text>
  <rect x="858.3236" y="151.5789" width="239.5322" height="202.1053" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="978.0896" y="242.5263" text-anchor="middle" font-size="21.9571" font-weight="bold">Database</text>
  <text x="978.0896" y="309.8947" text-anchor="middle" font-size="19.961">Source of truth</text>
  <line x1="199.6101" y1="107.7895" x2="355.306" y2="202.1053" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrowd11_02_caching)" />
  <line x1="199.6101" y1="259.3684" x2="355.306" y2="259.3684" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrowd11_02_caching)" />
  <line x1="199.6101" y1="410.9474" x2="355.306" y2="336.8421" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrowd11_02_caching)" />
  <line x1="638.7525" y1="259.3684" x2="854.3314" y2="259.3684" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="7.9844 7.9844" marker-end="url(#arrowd11_02_caching)" />
  <text x="748.538" y="235.7895" text-anchor="middle" font-size="19.961" fill="var(--info-accent)">On miss</text>
  <rect x="19.961" y="522.1053" width="1137.7778" height="117.8947" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.4" />
  <text x="598.8304" y="596.2105" text-anchor="middle" font-size="19.961">All app servers share one Redis cache -- consistent view, no local cache drift</text>
</svg>
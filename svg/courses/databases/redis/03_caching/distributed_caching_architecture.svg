<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="189.4737" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="134.7368" y="112.9143" text-anchor="middle" font-size="20.3341" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">App Server 1</text>
  <rect x="40" y="189.1429" width="189.4737" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="134.7368" y="262.0571" text-anchor="middle" font-size="20.3341" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">App Server 2</text>
  <rect x="40" y="338.2857" width="189.4737" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="134.7368" y="411.2" text-anchor="middle" font-size="20.3341" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">App Server 3</text>
  <rect x="397.8947" y="73.1428" width="294.7368" height="364.5714" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="545.2631" y="156.0001" text-anchor="middle" font-size="24.401" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Cache</text>
  <text x="545.2631" y="215.6571" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--warn-text)">(shared instance)</text>
  <rect x="429.4737" y="248.8" width="231.579" height="66.2857" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="545.2631" y="298.5143" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--ok-text)">user:42 = {...}</text>
  <rect x="429.4737" y="328.3428" width="231.579" height="66.2857" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="545.2631" y="378.0572" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--ok-text)">product:7 = {...}</text>
  <rect x="924.2105" y="139.4285" width="252.6316" height="198.8572" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1050.5262" y="228.9143" text-anchor="middle" font-size="22.3676" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Database</text>
  <text x="1050.5262" y="295.2" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--info-text)">Source of truth</text>
  <line x1="229.4737" y1="96.3429" x2="393.6842" y2="189.1429" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrow)"/>
  <line x1="229.4737" y1="245.4857" x2="393.6842" y2="245.4857" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrow)"/>
  <line x1="229.4737" y1="394.6286" x2="393.6842" y2="321.7143" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrow)"/>
  <line x1="692.6316" y1="245.4857" x2="920" y2="245.4857" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="7.9844 7.9844" marker-end="url(#arrow)"/>
  <text x="808.421" y="222.2858" text-anchor="middle" font-size="20.3341" fill="var(--info-accent)" font-family="Arial, sans-serif">On miss</text>
  <rect x="40" y="504" width="1200" height="116" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.4" filter="url(#shadow)"/>
  <text x="650.5263" y="576.9143" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--ok-text)">All app servers share one Redis cache -- consistent view, no local cache drift</text>
</svg>

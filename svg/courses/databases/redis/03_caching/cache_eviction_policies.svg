    <ns0:marker id="arrowd6_02_caching" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold">Redis Memory (maxmemory reached)</ns0:text>
  <ns0:rect x="61.5015" y="86.4865" width="1107.027" height="86.4865" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="4.1001" rx="6.1502" />
  <ns0:rect x="61.5015" y="86.4865" width="984.024" height="86.4865" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2.05" rx="6.1502" />
  <ns0:rect x="61.5015" y="86.4865" width="738.018" height="86.4865" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="410.01" y="145.2973" text-anchor="middle" font-size="20.5005">Used: 3.6 GB</ns0:text>
  <ns0:text x="1107.027" y="145.2973" text-anchor="middle" font-size="20.5005" fill="var(--danger-dk)">4 GB limit</ns0:text>
  <ns0:rect x="41.001" y="224.8649" width="266.5065" height="190.2703" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="174.2542" y="283.6757" text-anchor="middle" font-size="20.5005" font-weight="bold">noeviction</ns0:text>
  <ns0:text x="174.2542" y="328.6486" text-anchor="middle" font-size="20.5005">Returns error</ns0:text>
  <ns0:text x="174.2542" y="373.6216" text-anchor="middle" font-size="20.5005">on new writes</ns0:text>
  <ns0:rect x="328.008" y="224.8649" width="266.5065" height="190.2703" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="461.2613" y="283.6757" text-anchor="middle" font-size="20.5005" font-weight="bold">allkeys-lru</ns0:text>
  <ns0:text x="461.2613" y="328.6486" text-anchor="middle" font-size="20.5005">Evict least</ns0:text>
  <ns0:text x="461.2613" y="373.6216" text-anchor="middle" font-size="20.5005">recently used</ns0:text>
  <ns0:rect x="615.015" y="224.8649" width="266.5065" height="190.2703" fill="var(--info-pale)" stroke="var(--text-dark)" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="748.2683" y="283.6757" text-anchor="middle" font-size="20.5005" font-weight="bold">volatile-ttl</ns0:text>
  <ns0:text x="748.2683" y="328.6486" text-anchor="middle" font-size="20.5005">Evict nearest</ns0:text>
  <ns0:text x="748.2683" y="373.6216" text-anchor="middle" font-size="20.5005">expiration</ns0:text>
  <ns0:rect x="902.0221" y="224.8649" width="287.007" height="190.2703" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="1045.5255" y="283.6757" text-anchor="middle" font-size="20.5005" font-weight="bold">allkeys-random</ns0:text>
  <ns0:text x="1045.5255" y="328.6486" text-anchor="middle" font-size="20.5005">Evict random</ns0:text>
  <ns0:text x="1045.5255" y="373.6216" text-anchor="middle" font-size="20.5005">keys</ns0:text>
  <ns0:rect x="41.001" y="484.3243" width="1148.0281" height="155.6757" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.05" rx="10.2503" opacity="0.4" />
  <ns0:text x="615.015" y="553.5135" text-anchor="middle" font-size="20.5005">Set maxmemory-policy in redis.conf: <ns0:tspan font-weight="bold">maxmemory-policy allkeys-lru</ns0:tspan>
  </ns0:text>
  <ns0:text x="615.015" y="605.4054" text-anchor="middle" font-size="20.5005">volatile-* policies only evict keys with TTL set</ns0:text>
</ns0:svg>
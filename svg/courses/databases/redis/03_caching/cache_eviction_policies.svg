<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9998" y="40" text-anchor="middle" font-size="25.2007" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Redis Memory (maxmemory reached)</text>
  <rect x="61.4285" y="64.3115" width="1157.1428" height="86.8264" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="61.4285" y="64.3115" width="1028.5714" height="86.8264" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="61.4285" y="64.3115" width="771.4285" height="86.8264" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="425.7143" y="123.3533" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--ok-text)">Used: 3.6 GB</text>
  <text x="1154.2856" y="123.3533" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)" font-family="Arial, sans-serif">4 GB limit</text>
  <rect x="40" y="203.2336" width="278.5714" height="191.018" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="179.2856" y="262.2755" text-anchor="middle" font-size="21.0005" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">noeviction</text>
  <text x="179.2856" y="307.4252" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--primary-text)">Returns error</text>
  <text x="179.2856" y="352.5748" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--primary-text)">on new writes</text>
  <rect x="340" y="203.2336" width="278.5714" height="191.018" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="479.2858" y="262.2755" text-anchor="middle" font-size="21.0005" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">allkeys-lru</text>
  <text x="479.2858" y="307.4252" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">Evict least</text>
  <text x="479.2858" y="352.5748" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">recently used</text>
  <rect x="639.9998" y="203.2336" width="278.5714" height="191.018" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="779.2857" y="262.2755" text-anchor="middle" font-size="21.0005" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">volatile-ttl</text>
  <text x="779.2857" y="307.4252" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--info-text)">Evict nearest</text>
  <text x="779.2857" y="352.5748" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--info-text)">expiration</text>
  <rect x="940" y="203.2336" width="300" height="191.018" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1090" y="262.2755" text-anchor="middle" font-size="21.0005" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">allkeys-random</text>
  <text x="1090" y="307.4252" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--ok-text)">Evict random</text>
  <text x="1090" y="352.5748" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--ok-text)">keys</text>
  <rect x="40" y="463.7125" width="1200" height="156.2875" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" opacity="0.4" filter="url(#shadow)"/>
  <text x="639.9998" y="533.1736" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--primary-text)">Set maxmemory-policy in redis.conf: <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">maxmemory-policy allkeys-lru</tspan>
  </text>
  <text x="639.9998" y="585.2695" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--primary-text)">volatile-* policies only evict keys with TTL set</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowd6_02_caching" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold">Redis Memory (maxmemory reached)</ns0:text>
  <ns0:rect x="61.5015" y="86.4865" width="1107.027" height="86.4865" fill="#ffebee" stroke="#c62828" stroke-width="4.1001" rx="6.1502" />
  <ns0:rect x="61.5015" y="86.4865" width="984.024" height="86.4865" fill="#fff3e0" stroke="#e65100" stroke-width="2.05" rx="6.1502" />
  <ns0:rect x="61.5015" y="86.4865" width="738.018" height="86.4865" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="410.01" y="145.2973" text-anchor="middle" font-size="20.5005">Used: 3.6 GB</ns0:text>
  <ns0:text x="1107.027" y="145.2973" text-anchor="middle" font-size="20.5005" fill="#c62828">4 GB limit</ns0:text>
  <ns0:rect x="41.001" y="224.8649" width="266.5065" height="190.2703" fill="#e3f2fd" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="174.2542" y="283.6757" text-anchor="middle" font-size="20.5005" font-weight="bold">noeviction</ns0:text>
  <ns0:text x="174.2542" y="328.6486" text-anchor="middle" font-size="20.5005">Returns error</ns0:text>
  <ns0:text x="174.2542" y="373.6216" text-anchor="middle" font-size="20.5005">on new writes</ns0:text>
  <ns0:rect x="328.008" y="224.8649" width="266.5065" height="190.2703" fill="#fff3e0" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="461.2613" y="283.6757" text-anchor="middle" font-size="20.5005" font-weight="bold">allkeys-lru</ns0:text>
  <ns0:text x="461.2613" y="328.6486" text-anchor="middle" font-size="20.5005">Evict least</ns0:text>
  <ns0:text x="461.2613" y="373.6216" text-anchor="middle" font-size="20.5005">recently used</ns0:text>
  <ns0:rect x="615.015" y="224.8649" width="266.5065" height="190.2703" fill="#f3e5f5" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="748.2683" y="283.6757" text-anchor="middle" font-size="20.5005" font-weight="bold">volatile-ttl</ns0:text>
  <ns0:text x="748.2683" y="328.6486" text-anchor="middle" font-size="20.5005">Evict nearest</ns0:text>
  <ns0:text x="748.2683" y="373.6216" text-anchor="middle" font-size="20.5005">expiration</ns0:text>
  <ns0:rect x="902.0221" y="224.8649" width="287.007" height="190.2703" fill="#e8f5e9" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="1045.5255" y="283.6757" text-anchor="middle" font-size="20.5005" font-weight="bold">allkeys-random</ns0:text>
  <ns0:text x="1045.5255" y="328.6486" text-anchor="middle" font-size="20.5005">Evict random</ns0:text>
  <ns0:text x="1045.5255" y="373.6216" text-anchor="middle" font-size="20.5005">keys</ns0:text>
  <ns0:rect x="41.001" y="484.3243" width="1148.0281" height="155.6757" fill="#e3f2fd" stroke="#333" stroke-width="2.05" rx="10.2503" opacity="0.4" />
  <ns0:text x="615.015" y="553.5135" text-anchor="middle" font-size="20.5005">Set maxmemory-policy in redis.conf: <ns0:tspan font-weight="bold">maxmemory-policy allkeys-lru</ns0:tspan>
  </ns0:text>
  <ns0:text x="615.015" y="605.4054" text-anchor="middle" font-size="20.5005">volatile-* policies only evict keys with TTL set</ns0:text>
</ns0:svg>
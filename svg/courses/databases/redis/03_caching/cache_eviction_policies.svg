  <rect x="42.6667" y="234" width="277.3333" height="198" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="181.3333" y="295.2" text-anchor="middle" font-size="21.3333" font-weight="bold">noeviction</text>
  <text x="181.3333" y="342" text-anchor="middle" font-size="21.3333">Returns error</text>
  <text x="181.3333" y="388.8" text-anchor="middle" font-size="21.3333">on new writes</text>
  <rect x="341.3333" y="234" width="277.3333" height="198" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="480" y="295.2" text-anchor="middle" font-size="21.3333" font-weight="bold">allkeys-lru</text>
  <text x="480" y="342" text-anchor="middle" font-size="21.3333">Evict least</text>
  <text x="480" y="388.8" text-anchor="middle" font-size="21.3333">recently used</text>
  <rect x="640" y="234" width="277.3333" height="198" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="778.6667" y="295.2" text-anchor="middle" font-size="21.3333" font-weight="bold">volatile-ttl</text>
  <text x="778.6667" y="342" text-anchor="middle" font-size="21.3333">Evict nearest</text>
  <text x="778.6667" y="388.8" text-anchor="middle" font-size="21.3333">expiration</text>
  <rect x="938.6667" y="234" width="298.6667" height="198" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="1088" y="295.2" text-anchor="middle" font-size="21.3333" font-weight="bold">allkeys-random</text>

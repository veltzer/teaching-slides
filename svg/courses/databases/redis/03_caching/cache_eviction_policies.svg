<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd6_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="639.9998" y="40" text-anchor="middle" font-size="25.2007" font-weight="bold">Redis Memory (maxmemory reached)</text>
  <rect x="61.4285" y="64.3115" width="1157.1428" height="86.8264" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="61.4285" y="64.3115" width="1028.5714" height="86.8264" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="61.4285" y="64.3115" width="771.4285" height="86.8264" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="425.7143" y="123.3533" text-anchor="middle" font-size="21.0005">Used: 3.6 GB</text>
  <text x="1154.2856" y="123.3533" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)">4 GB limit</text>
  <rect x="40" y="203.2336" width="278.5714" height="191.018" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="179.2856" y="262.2755" text-anchor="middle" font-size="21.0005" font-weight="bold">noeviction</text>
  <text x="179.2856" y="307.4252" text-anchor="middle" font-size="21.0005">Returns error</text>
  <text x="179.2856" y="352.5748" text-anchor="middle" font-size="21.0005">on new writes</text>
  <rect x="340" y="203.2336" width="278.5714" height="191.018" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="479.2858" y="262.2755" text-anchor="middle" font-size="21.0005" font-weight="bold">allkeys-lru</text>
  <text x="479.2858" y="307.4252" text-anchor="middle" font-size="21.0005">Evict least</text>
  <text x="479.2858" y="352.5748" text-anchor="middle" font-size="21.0005">recently used</text>
  <rect x="639.9998" y="203.2336" width="278.5714" height="191.018" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="779.2857" y="262.2755" text-anchor="middle" font-size="21.0005" font-weight="bold">volatile-ttl</text>
  <text x="779.2857" y="307.4252" text-anchor="middle" font-size="21.0005">Evict nearest</text>
  <text x="779.2857" y="352.5748" text-anchor="middle" font-size="21.0005">expiration</text>
  <rect x="940" y="203.2336" width="300" height="191.018" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1090" y="262.2755" text-anchor="middle" font-size="21.0005" font-weight="bold">allkeys-random</text>
  <text x="1090" y="307.4252" text-anchor="middle" font-size="21.0005">Evict random</text>
  <text x="1090" y="352.5748" text-anchor="middle" font-size="21.0005">keys</text>
  <rect x="40" y="463.7125" width="1200" height="156.2875" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" opacity="0.4" filter="url(#shadow)"/>
  <text x="639.9998" y="533.1736" text-anchor="middle" font-size="21.0005">Set maxmemory-policy in redis.conf: <tspan font-weight="bold">maxmemory-policy allkeys-lru</tspan>
  </text>
  <text x="639.9998" y="585.2695" text-anchor="middle" font-size="21.0005">volatile-* policies only evict keys with TTL set</text>
</svg>
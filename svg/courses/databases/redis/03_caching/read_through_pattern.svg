<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd4_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="189.6774" width="210.5263" height="168.3871" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="145.2632" y="290.7097" text-anchor="middle" font-size="23.7669" font-weight="bold">Application</text>
  <rect x="440" y="40" width="252.6316" height="261.9355" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="566.3158" y="122.3226" text-anchor="middle" font-size="23.7669" font-weight="bold">Cache Layer</text>
  <text x="566.3158" y="182.1935" text-anchor="middle" font-size="21.6063">(Read-Through)</text>
  <text x="566.3158" y="242.0645" text-anchor="middle" font-size="21.6063" fill="var(--warn-accent)">Auto-loads on miss</text>
  <rect x="924.2105" y="189.6774" width="210.5263" height="168.3871" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1029.4737" y="290.7097" text-anchor="middle" font-size="23.7669" font-weight="bold">Database</text>
  <line x1="250.5263" y1="234.5807" x2="435.7895" y2="152.2581" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd4_02_caching)" />
  <text x="313.6842" y="152.2581" text-anchor="middle" font-size="21.6063" fill="var(--primary-accent)">1. Read</text>
  <line x1="692.6316" y1="227.0968" x2="920.0001" y2="253.2903" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrowd4_02_caching)" />
  <text x="808.4211" y="197.1613" text-anchor="middle" font-size="21.6063" fill="var(--info-accent)">2. Fetch (on miss)</text>
  <line x1="920.0001" y1="301.9354" x2="696.8421" y2="275.7419" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrowd4_02_caching)" />
  <text x="808.4211" y="358.0645" text-anchor="middle" font-size="21.6063" fill="var(--info-accent)">3. Data</text>
  <line x1="435.7895" y1="264.5162" x2="254.7368" y2="290.7097" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrowd4_02_caching)" />
  <text x="324.2105" y="358.0645" text-anchor="middle" font-size="21.6063" fill="var(--ok-accent)">4. Return</text>
  <rect x="40" y="470.3226" width="1200" height="149.6774" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.5" filter="url(#shadow)"/>
  <text x="650.5263" y="556.3871" text-anchor="middle" font-size="21.6063">App only talks to cache. Cache handles DB interaction transparently.</text>
</svg>
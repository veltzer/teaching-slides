<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="189.6774" width="210.5263" height="168.3871" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="145.2632" y="290.7097" text-anchor="middle" font-size="23.7669" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Application</text>
  <rect x="440" y="40" width="252.6316" height="261.9355" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="566.3158" y="122.3226" text-anchor="middle" font-size="23.7669" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Cache Layer</text>
  <text x="566.3158" y="182.1935" text-anchor="middle" font-size="21.6063" font-family="Arial, sans-serif" fill="var(--warn-text)">(Read-Through)</text>
  <text x="566.3158" y="242.0645" text-anchor="middle" font-size="21.6063" fill="var(--warn-accent)" font-family="Arial, sans-serif">Auto-loads on miss</text>
  <rect x="924.2105" y="189.6774" width="210.5263" height="168.3871" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1029.4737" y="290.7097" text-anchor="middle" font-size="23.7669" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Database</text>
  <line x1="250.5263" y1="234.5807" x2="435.7895" y2="152.2581" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="313.6842" y="152.2581" text-anchor="middle" font-size="21.6063" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Read</text>
  <line x1="692.6316" y1="227.0968" x2="920.0001" y2="253.2903" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="808.4211" y="197.1613" text-anchor="middle" font-size="21.6063" fill="var(--info-accent)" font-family="Arial, sans-serif">2. Fetch (on miss)</text>
  <line x1="920.0001" y1="301.9354" x2="696.8421" y2="275.7419" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrow)" />
  <text x="808.4211" y="358.0645" text-anchor="middle" font-size="21.6063" fill="var(--info-accent)" font-family="Arial, sans-serif">3. Data</text>
  <line x1="435.7895" y1="264.5162" x2="254.7368" y2="290.7097" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrow)" />
  <text x="324.2105" y="358.0645" text-anchor="middle" font-size="21.6063" fill="var(--ok-accent)" font-family="Arial, sans-serif">4. Return</text>
  <rect x="40" y="470.3226" width="1200" height="149.6774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.5" filter="url(#shadow)"/>
  <text x="650.5263" y="556.3871" text-anchor="middle" font-size="21.6063" font-family="Arial, sans-serif" fill="var(--ok-text)">App only talks to cache. Cache handles DB interaction transparently.</text>
</svg>
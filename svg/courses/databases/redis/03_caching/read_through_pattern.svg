<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd4_02_caching" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="20.5005" y="242.1622" width="205.005" height="155.6757" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="123.003" y="335.5676" text-anchor="middle" font-size="22.5506" font-weight="bold">Application</text>
  <rect x="410.01" y="103.7838" width="246.006" height="242.1622" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="533.013" y="179.8919" text-anchor="middle" font-size="22.5506" font-weight="bold">Cache Layer</text>
  <text x="533.013" y="235.2432" text-anchor="middle" font-size="20.5005">(Read-Through)</text>
  <text x="533.013" y="290.5946" text-anchor="middle" font-size="20.5005" fill="var(--warn-accent)">Auto-loads on miss</text>
  <rect x="881.5215" y="242.1622" width="205.005" height="155.6757" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="984.024" y="335.5676" text-anchor="middle" font-size="22.5506" font-weight="bold">Database</text>
  <line x1="225.5055" y1="283.6757" x2="405.9099" y2="207.5676" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd4_02_caching)" />
  <text x="287.007" y="207.5676" text-anchor="middle" font-size="20.5005" fill="var(--primary-accent)">1. Read</text>
  <line x1="656.016" y1="276.7568" x2="877.4215" y2="300.973" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrowd4_02_caching)" />
  <text x="768.7688" y="249.0811" text-anchor="middle" font-size="20.5005" fill="var(--info-accent)">2. Fetch (on miss)</text>
  <line x1="877.4215" y1="345.9459" x2="660.1161" y2="321.7297" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrowd4_02_caching)" />
  <text x="768.7688" y="397.8378" text-anchor="middle" font-size="20.5005" fill="var(--info-accent)">3. Data</text>
  <line x1="405.9099" y1="311.3514" x2="229.6056" y2="335.5676" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.2002 8.2002" marker-end="url(#arrowd4_02_caching)" />
  <text x="297.2572" y="397.8378" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">4. Return</text>
  <rect x="20.5005" y="501.6216" width="1168.5285" height="138.3784" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.5" />
  <text x="615.015" y="581.1892" text-anchor="middle" font-size="20.5005">App only talks to cache. Cache handles DB interaction transparently.</text>
</svg>
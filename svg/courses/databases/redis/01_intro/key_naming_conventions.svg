<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="355.5555" height="154.666568444443" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.387487805778" filter="url(#shadow)"/>
  <text x="217.7779" y="136.666761111112" text-anchor="middle" font-size="24.821777613254" font-family="Courier New, monospace" fill="var(--primary-text)">user:1000:name</text>
  <rect x="462.2222" y="40" width="355.5555" height="154.666568444443" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.387487805778" filter="url(#shadow)"/>
  <text x="640" y="136.666761111112" text-anchor="middle" font-size="24.821777613254" font-family="Courier New, monospace" fill="var(--info-text)">product:42:views</text>
  <rect x="884.4445" y="40" width="355.5555" height="154.666568444443" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.387487805778" filter="url(#shadow)"/>
  <text x="1062.2221" y="136.666761111112" text-anchor="middle" font-size="24.821777613254" font-family="Courier New, monospace" fill="var(--ok-text)">session:abc123</text>
  <rect x="151.1111" y="310.666636444444" width="200" height="115.999954666666" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.387487805778" filter="url(#shadow)"/>
  <text x="251.1112" y="387.999977333333" text-anchor="middle" font-size="22.565184629603" font-family="Arial, sans-serif" fill="var(--warn-text)">object-type</text>
  <rect x="540" y="310.666636444444" width="200" height="115.999954666666" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.387487805778" filter="url(#shadow)"/>
  <text x="640" y="387.999977333333" text-anchor="middle" font-size="22.565184629603" font-family="Arial, sans-serif" fill="var(--warn-text)">id</text>
  <rect x="928.8889" y="310.666636444444" width="200" height="115.999954666666" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.387487805778" filter="url(#shadow)"/>
  <text x="1028.8888" y="387.999977333333" text-anchor="middle" font-size="22.565184629603" font-family="Arial, sans-serif" fill="var(--warn-text)">field</text>
  <line x1="217.7779" y1="194.666681777778" x2="251.1112" y2="310.666636444444" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="5.9883 3.9922"/>
  <line x1="640" y1="194.666681777778" x2="640" y2="310.666636444444" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="5.9883 3.9922"/>
  <line x1="1062.2221" y1="194.666681777778" x2="1028.8888" y2="310.666636444444" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="5.9883 3.9922"/>
  <text x="640" y="542.666659111111" text-anchor="middle" font-size="22.565184629603" fill="var(--text-muted)" font-family="Arial, sans-serif">Colons (:) separate namespace segments for clarity and consistency</text>
  <text x="640" y="620" text-anchor="middle" font-size="22.565184629603" fill="var(--danger-accent)" font-family="Arial, sans-serif">Avoid very long keys -- keep them readable and short</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="21.0699" y="88.8889" width="189.6296" height="177.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="115.8847" y="167.1111" text-anchor="middle" font-size="23.177" font-weight="bold">Strings</text>
  <text x="115.8847" y="220.4444" text-anchor="middle" font-size="21.0699">"hello"</text>
  <rect x="231.7696" y="88.8889" width="189.6296" height="177.7778" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="326.5844" y="167.1111" text-anchor="middle" font-size="23.177" font-weight="bold">Lists</text>
  <text x="326.5844" y="220.4444" text-anchor="middle" font-size="21.0699">[a, b, c]</text>
  <rect x="442.4691" y="88.8889" width="189.6296" height="177.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="537.284" y="167.1111" text-anchor="middle" font-size="23.177" font-weight="bold">Sets</text>
  <text x="537.284" y="220.4444" text-anchor="middle" font-size="21.0699">{a, b, c}</text>
  <rect x="653.1687" y="88.8889" width="189.6296" height="177.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="747.9835" y="167.1111" text-anchor="middle" font-size="23.177" font-weight="bold">Sorted Sets</text>
  <text x="747.9835" y="220.4444" text-anchor="middle" font-size="21.0699">score:member</text>
  <rect x="863.8683" y="88.8889" width="189.6296" height="177.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="958.6832" y="167.1111" text-anchor="middle" font-size="23.177" font-weight="bold">Hashes</text>
  <text x="958.6832" y="220.4444" text-anchor="middle" font-size="21.0699">field:value</text>
  <rect x="1074.5679" y="88.8889" width="168.5597" height="177.7778" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1158.8477" y="167.1111" text-anchor="middle" font-size="23.177" font-weight="bold">Streams</text>
  <text x="1158.8477" y="220.4444" text-anchor="middle" font-size="21.0699">time-series</text>
  <rect x="210.6996" y="355.5556" width="842.7983" height="177.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="433.7778" text-anchor="middle" font-size="27.3909" font-weight="bold">Redis Key-Value Engine</text>
  <text x="632.0988" y="497.7778" text-anchor="middle" font-size="21.0699">All data accessed by unique string keys</text>
  <line x1="115.8847" y1="266.6667" x2="421.3992" y2="355.5556" stroke="var(--text)" stroke-width="2" />
  <line x1="326.5844" y1="266.6667" x2="484.6091" y2="355.5556" stroke="var(--text)" stroke-width="2" />
  <line x1="537.284" y1="266.6667" x2="589.9588" y2="355.5556" stroke="var(--text)" stroke-width="2" />
  <line x1="747.9835" y1="266.6667" x2="695.3086" y2="355.5556" stroke="var(--text)" stroke-width="2" />
  <line x1="958.6832" y1="266.6667" x2="821.7284" y2="355.5556" stroke="var(--text)" stroke-width="2" />
  <line x1="1158.8477" y1="266.6667" x2="906.0082" y2="355.5556" stroke="var(--text)" stroke-width="2" />
  <text x="632.0988" y="640" text-anchor="middle" font-size="23.177" fill="var(--text-muted)">SET key value | GET key | DEL key | EXISTS key</text>
</svg>
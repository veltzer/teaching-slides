<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="186.2069" height="187.0968" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="133.1034" y="122.3226" text-anchor="middle" font-size="23.5611" font-weight="bold">Strings</text>
  <text x="133.1034" y="178.4516" text-anchor="middle" font-size="21.4191">"hello"</text>
  <rect x="246.8966" y="40" width="186.2069" height="187.0968" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="340.0001" y="122.3226" text-anchor="middle" font-size="23.5611" font-weight="bold">Lists</text>
  <text x="340.0001" y="178.4516" text-anchor="middle" font-size="21.4191">[a, b, c]</text>
  <rect x="453.7931" y="40" width="186.2069" height="187.0968" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="546.8966" y="122.3226" text-anchor="middle" font-size="23.5611" font-weight="bold">Sets</text>
  <text x="546.8966" y="178.4516" text-anchor="middle" font-size="21.4191">{a, b, c}</text>
  <rect x="660.6896" y="40" width="186.2069" height="187.0968" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="753.7931" y="122.3226" text-anchor="middle" font-size="23.5611" font-weight="bold">Sorted Sets</text>
  <text x="753.7931" y="178.4516" text-anchor="middle" font-size="21.4191">score:member</text>
  <rect x="867.5862" y="40" width="186.2069" height="187.0968" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="960.6897" y="122.3226" text-anchor="middle" font-size="23.5611" font-weight="bold">Hashes</text>
  <text x="960.6897" y="178.4516" text-anchor="middle" font-size="21.4191">field:value</text>
  <rect x="1074.4827" y="40" width="165.5173" height="187.0968" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1157.2413" y="122.3226" text-anchor="middle" font-size="23.5611" font-weight="bold">Streams</text>
  <text x="1157.2413" y="178.4516" text-anchor="middle" font-size="21.4191">time-series</text>
  <rect x="226.207" y="320.6452" width="827.5861" height="187.0968" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="402.9678" text-anchor="middle" font-size="27.8449" font-weight="bold">Redis Key-Value Engine</text>
  <text x="640" y="470.3226" text-anchor="middle" font-size="21.4191">All data accessed by unique string keys</text>
  <line x1="133.1034" y1="227.0968" x2="433.1035" y2="320.6452" stroke="var(--text)" stroke-width="2" />
  <line x1="340.0001" y1="227.0968" x2="495.1725" y2="320.6452" stroke="var(--text)" stroke-width="2" />
  <line x1="546.8966" y1="227.0968" x2="598.6207" y2="320.6452" stroke="var(--text)" stroke-width="2" />
  <line x1="753.7931" y1="227.0968" x2="702.0689" y2="320.6452" stroke="var(--text)" stroke-width="2" />
  <line x1="960.6897" y1="227.0968" x2="826.2069" y2="320.6452" stroke="var(--text)" stroke-width="2" />
  <line x1="1157.2413" y1="227.0968" x2="908.9655" y2="320.6452" stroke="var(--text)" stroke-width="2" />
  <text x="640" y="620" text-anchor="middle" font-size="23.5611" fill="var(--text-muted)">SET key value | GET key | DEL key | EXISTS key</text>
</svg>
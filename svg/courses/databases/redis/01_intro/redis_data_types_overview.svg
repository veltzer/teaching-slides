<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="186.2069" height="187.0968" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="133.1034" y="122.3226" text-anchor="middle" font-size="23.5611" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Strings</text>
  <text x="133.1034" y="178.4516" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--primary-text)">"hello"</text>
  <rect x="246.8966" y="40" width="186.2069" height="187.0968" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="340.0001" y="122.3226" text-anchor="middle" font-size="23.5611" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Lists</text>
  <text x="340.0001" y="178.4516" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--info-text)">[a, b, c]</text>
  <rect x="453.7931" y="40" width="186.2069" height="187.0968" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="546.8966" y="122.3226" text-anchor="middle" font-size="23.5611" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Sets</text>
  <text x="546.8966" y="178.4516" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--ok-text)">{a, b, c}</text>
  <rect x="660.6896" y="40" width="186.2069" height="187.0968" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="753.7931" y="122.3226" text-anchor="middle" font-size="23.5611" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Sorted Sets</text>
  <text x="753.7931" y="178.4516" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--warn-text)">score:member</text>
  <rect x="867.5862" y="40" width="186.2069" height="187.0968" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="960.6897" y="122.3226" text-anchor="middle" font-size="23.5611" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Hashes</text>
  <text x="960.6897" y="178.4516" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--danger-text)">field:value</text>
  <rect x="1074.4827" y="40" width="165.5173" height="187.0968" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1157.2413" y="122.3226" text-anchor="middle" font-size="23.5611" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Streams</text>
  <text x="1157.2413" y="178.4516" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--info-text)">time-series</text>
  <rect x="226.207" y="320.6452" width="827.5861" height="187.0968" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="402.9678" text-anchor="middle" font-size="27.8449" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Redis Key-Value Engine</text>
  <text x="640" y="470.3226" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--primary-text)">All data accessed by unique string keys</text>
  <line x1="133.1034" y1="227.0968" x2="433.1035" y2="320.6452" stroke="var(--text)" stroke-width="2"/>
  <line x1="340.0001" y1="227.0968" x2="495.1725" y2="320.6452" stroke="var(--text)" stroke-width="2"/>
  <line x1="546.8966" y1="227.0968" x2="598.6207" y2="320.6452" stroke="var(--text)" stroke-width="2"/>
  <line x1="753.7931" y1="227.0968" x2="702.0689" y2="320.6452" stroke="var(--text)" stroke-width="2"/>
  <line x1="960.6897" y1="227.0968" x2="826.2069" y2="320.6452" stroke="var(--text)" stroke-width="2"/>
  <line x1="1157.2413" y1="227.0968" x2="908.9655" y2="320.6452" stroke="var(--text)" stroke-width="2"/>
  <text x="640" y="620" text-anchor="middle" font-size="23.5611" fill="var(--text-muted)" font-family="Arial, sans-serif">SET key value | GET key | DEL key | EXISTS key</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="400" y="40" width="480.0001" height="141.0811" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="102.7027" text-anchor="middle" font-size="25.3392" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Redis Server (RAM)</text>
  <text x="640" y="149.7297" text-anchor="middle" font-size="21.116" font-family="Arial, sans-serif" fill="var(--primary-text)">In-Memory Data</text>
  <rect x="40" y="322.1621" width="336" height="172.4324" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="207.9999" y="384.8649" text-anchor="middle" font-size="25.3392" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">RDB Snapshot</text>
  <text x="207.9999" y="431.8919" text-anchor="middle" font-size="21.116" font-family="Arial, sans-serif" fill="var(--danger-text)">Point-in-time .rdb file</text>
  <text x="207.9999" y="472.6487" text-anchor="middle" font-size="21.116" font-family="Arial, sans-serif" fill="var(--danger-text)">Compact, fast restart</text>
  <rect x="472.0001" y="322.1621" width="336" height="172.4324" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="384.8649" text-anchor="middle" font-size="25.3392" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">AOF Log</text>
  <text x="640" y="431.8919" text-anchor="middle" font-size="21.116" font-family="Arial, sans-serif" fill="var(--warn-text)">Append-only file</text>
  <text x="640" y="472.6487" text-anchor="middle" font-size="21.116" font-family="Arial, sans-serif" fill="var(--warn-text)">Every write logged</text>
  <rect x="904" y="322.1621" width="336" height="172.4324" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1072.0001" y="384.8649" text-anchor="middle" font-size="25.3392" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">RDB + AOF</text>
  <text x="1072.0001" y="431.8919" text-anchor="middle" font-size="21.116" font-family="Arial, sans-serif" fill="var(--ok-text)">Combined approach</text>
  <text x="1072.0001" y="472.6487" text-anchor="middle" font-size="21.116" font-family="Arial, sans-serif" fill="var(--ok-text)">Best durability</text>
  <line x1="472.0001" y1="181.0811" x2="207.9999" y2="322.1621" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="181.0811" x2="640" y2="322.1621" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="807.9999" y1="181.0811" x2="1072.0001" y2="322.1621" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="328" y="541.6216" width="624" height="78.3784" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="594.9189" text-anchor="middle" font-size="23.2276" font-family="Arial, sans-serif" fill="var(--text)">Disk Storage (survives restart)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="388.9839" y="32.8205" width="388.9839" height="147.6923" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="583.4758" y="98.4615" text-anchor="middle" font-size="23.339" font-weight="bold">Redis Server (RAM)</text>
  <text x="583.4758" y="147.6923" text-anchor="middle" font-size="19.4492">In-Memory Data</text>
  <rect x="97.246" y="328.2051" width="272.2887" height="180.5128" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="233.3903" y="393.8462" text-anchor="middle" font-size="23.339" font-weight="bold">RDB Snapshot</text>
  <text x="233.3903" y="443.0769" text-anchor="middle" font-size="19.4492">Point-in-time .rdb file</text>
  <text x="233.3903" y="485.7436" text-anchor="middle" font-size="19.4492">Compact, fast restart</text>
  <rect x="447.3315" y="328.2051" width="272.2887" height="180.5128" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="583.4758" y="393.8462" text-anchor="middle" font-size="23.339" font-weight="bold">AOF Log</text>
  <text x="583.4758" y="443.0769" text-anchor="middle" font-size="19.4492">Append-only file</text>
  <text x="583.4758" y="485.7436" text-anchor="middle" font-size="19.4492">Every write logged</text>
  <rect x="797.4169" y="328.2051" width="272.2887" height="180.5128" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="933.5613" y="393.8462" text-anchor="middle" font-size="23.339" font-weight="bold">RDB + AOF</text>
  <text x="933.5613" y="443.0769" text-anchor="middle" font-size="19.4492">Combined approach</text>
  <text x="933.5613" y="485.7436" text-anchor="middle" font-size="19.4492">Best durability</text>
  <line x1="447.3315" y1="180.5128" x2="233.3903" y2="328.2051" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd5_00_intro)" />
  <line x1="583.4758" y1="180.5128" x2="583.4758" y2="328.2051" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd5_00_intro)" />
  <line x1="719.6201" y1="180.5128" x2="933.5613" y2="328.2051" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd5_00_intro)" />
  <rect x="330.6363" y="557.9487" width="505.679" height="82.0513" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="583.4758" y="613.7436" text-anchor="middle" font-size="21.3941">Disk Storage (survives restart)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd5_00_intro" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
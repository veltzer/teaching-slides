<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="210.5263" height="145" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="145.2633" y="130.625" text-anchor="middle" font-size="23.3926" font-weight="bold">Web App</text>
  <rect x="40" y="257.5" width="210.5263" height="145" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="145.2633" y="348.125" text-anchor="middle" font-size="23.3926" font-weight="bold">API Service</text>
  <rect x="40" y="475" width="210.5263" height="145" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="145.2633" y="565.625" text-anchor="middle" font-size="23.3926" font-weight="bold">Worker</text>
  <rect x="482.1053" y="166.8751" width="336.842" height="326.25" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="650.5263" y="275.625" text-anchor="middle" font-size="27.6457" font-weight="bold">Redis</text>
  <text x="650.5263" y="330.0001" text-anchor="middle" font-size="21.2659">Shared cache</text>
  <text x="650.5263" y="384.375" text-anchor="middle" font-size="21.2659">Session store</text>
  <text x="650.5263" y="438.75" text-anchor="middle" font-size="21.2659">Message broker</text>
  <rect x="1008.421" y="112.5" width="231.579" height="181.25" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1124.2104" y="192.25" text-anchor="middle" font-size="23.3926" font-weight="bold">Database</text>
  <text x="1124.2104" y="246.625" text-anchor="middle" font-size="21.2659">Primary store</text>
  <rect x="1008.421" y="366.25" width="231.579" height="181.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1124.2104" y="446" text-anchor="middle" font-size="23.3926" font-weight="bold">Queue</text>
  <text x="1124.2104" y="500.375" text-anchor="middle" font-size="21.2659">Job processing</text>
  <line x1="250.5264" y1="112.5" x2="482.1053" y2="257.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_00_intro)" />
  <line x1="250.5264" y1="330.0001" x2="482.1053" y2="330.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_00_intro)" />
  <line x1="250.5264" y1="547.5" x2="482.1053" y2="402.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_00_intro)" />
  <line x1="818.9474" y1="257.5" x2="1008.421" y2="203.125" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.428 4.214" marker-end="url(#arrowd6_00_intro)" />
  <line x1="818.9474" y1="402.5" x2="1008.421" y2="456.875" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.428 4.214" marker-end="url(#arrowd6_00_intro)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd6_00_intro" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="210.5263" height="145" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="145.2633" y="130.625" text-anchor="middle" font-size="23.3926" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Web App</text>
  <rect x="40" y="257.5" width="210.5263" height="145" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="145.2633" y="348.125" text-anchor="middle" font-size="23.3926" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">API Service</text>
  <rect x="40" y="475" width="210.5263" height="145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="145.2633" y="565.625" text-anchor="middle" font-size="23.3926" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Worker</text>
  <rect x="482.1053" y="166.8751" width="336.842" height="326.25" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="650.5263" y="275.625" text-anchor="middle" font-size="27.6457" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Redis</text>
  <text x="650.5263" y="330.0001" text-anchor="middle" font-size="21.2659" font-family="Arial, sans-serif" fill="var(--danger-text)">Shared cache</text>
  <text x="650.5263" y="384.375" text-anchor="middle" font-size="21.2659" font-family="Arial, sans-serif" fill="var(--danger-text)">Session store</text>
  <text x="650.5263" y="438.75" text-anchor="middle" font-size="21.2659" font-family="Arial, sans-serif" fill="var(--danger-text)">Message broker</text>
  <rect x="1008.421" y="112.5" width="231.579" height="181.25" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1124.2104" y="192.25" text-anchor="middle" font-size="23.3926" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Database</text>
  <text x="1124.2104" y="246.625" text-anchor="middle" font-size="21.2659" font-family="Arial, sans-serif" fill="var(--warn-text)">Primary store</text>
  <rect x="1008.421" y="366.25" width="231.579" height="181.25" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1124.2104" y="446" text-anchor="middle" font-size="23.3926" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Queue</text>
  <text x="1124.2104" y="500.375" text-anchor="middle" font-size="21.2659" font-family="Arial, sans-serif" fill="var(--ok-text)">Job processing</text>
  <line x1="250.5264" y1="112.5" x2="482.1053" y2="257.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="250.5264" y1="330.0001" x2="482.1053" y2="330.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="250.5264" y1="547.5" x2="482.1053" y2="402.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="818.9474" y1="257.5" x2="1008.421" y2="203.125" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.428 4.214" marker-end="url(#arrow)" />
  <line x1="818.9474" y1="402.5" x2="1008.421" y2="456.875" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.428 4.214" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="166.875" width="235.2941" height="181.25" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="157.6471" y="246.625" text-anchor="middle" font-size="24.7304" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Client</text>
  <text x="157.6471" y="304.625" text-anchor="middle" font-size="22.4821" font-family="Arial, sans-serif" fill="var(--primary-text)">API Request</text>
  <rect x="416.4706" y="58.125" width="329.4118" height="326.2501" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="581.1765" y="137.875" text-anchor="middle" font-size="26.9786" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Redis</text>
  <text x="581.1765" y="195.8749" text-anchor="middle" font-size="22.4821" font-family="Courier New, monospace" fill="var(--danger-text)">INCR rate:ip:x</text>
  <text x="581.1765" y="250.25" text-anchor="middle" font-size="22.4821" font-family="Courier New, monospace" fill="var(--danger-text)">EXPIRE rate:ip:x 60</text>
  <rect x="451.7648" y="297.375" width="117.6471" height="65.25" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="510.5882" y="344.5" text-anchor="middle" font-size="22.4821" font-family="Arial, sans-serif" fill="var(--ok-text)">count</text>
  <rect x="592.9412" y="297.375" width="117.6471" height="65.25" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="651.7647" y="344.5" text-anchor="middle" font-size="22.4821" font-family="Arial, sans-serif" fill="var(--warn-text)">TTL</text>
  <rect x="934.1176" y="40" width="305.8824" height="163.125" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1087.0589" y="101.625" text-anchor="middle" font-size="24.7304" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">count &lt; limit</text>
  <text x="1087.0589" y="159.6249" text-anchor="middle" font-size="24.7304" fill="var(--ok-accent)" font-family="Arial, sans-serif">ALLOW</text>
  <rect x="934.1176" y="275.625" width="305.8824" height="163.125" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1087.0589" y="340.875" text-anchor="middle" font-size="24.7304" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">count &gt;= limit</text>
  <text x="1087.0589" y="398.875" text-anchor="middle" font-size="24.7304" fill="var(--danger-accent)" font-family="Arial, sans-serif">REJECT 429</text>
  <line x1="275.2941" y1="257.5" x2="416.4706" y2="221.25" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="745.8824" y1="148.75" x2="934.1176" y2="119.75" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="745.8824" y1="293.7499" x2="934.1176" y2="355.375" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="698.8235" y="547.5" text-anchor="middle" font-size="22.4821" fill="var(--text-muted)" font-family="Arial, sans-serif">Each key tracks request count per IP with auto-expiring TTL window</text>
  <text x="698.8235" y="620" text-anchor="middle" font-size="22.4821" fill="var(--text-muted)" font-family="Arial, sans-serif">Atomic INCR ensures accuracy under concurrent requests</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="166.875" width="235.2941" height="181.25" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="157.6471" y="246.625" text-anchor="middle" font-size="24.7304" font-weight="bold">Client</text>
  <text x="157.6471" y="304.625" text-anchor="middle" font-size="22.4821">API Request</text>
  <rect x="416.4706" y="58.125" width="329.4118" height="326.2501" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="581.1765" y="137.875" text-anchor="middle" font-size="26.9786" font-weight="bold">Redis</text>
  <text x="581.1765" y="195.8749" text-anchor="middle" font-size="22.4821" font-family="monospace">INCR rate:ip:x</text>
  <text x="581.1765" y="250.25" text-anchor="middle" font-size="22.4821" font-family="monospace">EXPIRE rate:ip:x 60</text>
  <rect x="451.7648" y="297.375" width="117.6471" height="65.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="510.5882" y="344.5" text-anchor="middle" font-size="22.4821">count</text>
  <rect x="592.9412" y="297.375" width="117.6471" height="65.25" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="651.7647" y="344.5" text-anchor="middle" font-size="22.4821">TTL</text>
  <rect x="934.1176" y="40" width="305.8824" height="163.125" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1087.0589" y="101.625" text-anchor="middle" font-size="24.7304" font-weight="bold">count &lt; limit</text>
  <text x="1087.0589" y="159.6249" text-anchor="middle" font-size="24.7304" fill="var(--ok-accent)">ALLOW</text>
  <rect x="934.1176" y="275.625" width="305.8824" height="163.125" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1087.0589" y="340.875" text-anchor="middle" font-size="24.7304" font-weight="bold">count &gt;= limit</text>
  <text x="1087.0589" y="398.875" text-anchor="middle" font-size="24.7304" fill="var(--danger-accent)">REJECT 429</text>
  <line x1="275.2941" y1="257.5" x2="416.4706" y2="221.25" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_00_intro)" />
  <line x1="745.8824" y1="148.75" x2="934.1176" y2="119.75" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd8_00_intro)" />
  <line x1="745.8824" y1="293.7499" x2="934.1176" y2="355.375" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd8_00_intro)" />
  <text x="698.8235" y="547.5" text-anchor="middle" font-size="22.4821" fill="var(--text-muted)">Each key tracks request count per IP with auto-expiring TTL window</text>
  <text x="698.8235" y="620" text-anchor="middle" font-size="22.4821" fill="var(--text-muted)">Atomic INCR ensures accuracy under concurrent requests</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd8_00_intro" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
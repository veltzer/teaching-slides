<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect x="41.001" y="207.5676" width="205.005" height="172.973" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />

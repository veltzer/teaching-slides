  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="41.001" y="207.5676" width="205.005" height="172.973" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="143.5035" y="283.6757" text-anchor="middle" font-size="22.5506" font-weight="bold">Client</text>
  <text x="143.5035" y="339.027" text-anchor="middle" font-size="20.5005">API Request</text>
  <rect x="369.009" y="103.7838" width="287.007" height="311.3514" fill="var(--danger-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="512.5125" y="179.8919" text-anchor="middle" font-size="24.6006" font-weight="bold">Redis</text>
  <text x="512.5125" y="235.2432" text-anchor="middle" font-size="20.5005" font-family="monospace">INCR rate:ip:x</text>
  <text x="512.5125" y="287.1351" text-anchor="middle" font-size="20.5005" font-family="monospace">EXPIRE rate:ip:x 60</text>
  <rect x="399.7598" y="332.1081" width="102.5025" height="62.2703" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.05" rx="4.1001" />
  <text x="451.011" y="377.0811" text-anchor="middle" font-size="20.5005">count</text>
  <rect x="522.7628" y="332.1081" width="102.5025" height="62.2703" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="2.05" rx="4.1001" />
  <text x="574.014" y="377.0811" text-anchor="middle" font-size="20.5005">TTL</text>
  <rect x="820.02" y="86.4865" width="266.5065" height="155.6757" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="953.2733" y="145.2973" text-anchor="middle" font-size="22.5506" font-weight="bold">count &lt; limit</text>
  <text x="953.2733" y="200.6486" text-anchor="middle" font-size="22.5506" fill="var(--ok-dk)">ALLOW</text>
  <rect x="820.02" y="311.3514" width="266.5065" height="155.6757" fill="var(--danger-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="953.2733" y="373.6216" text-anchor="middle" font-size="22.5506" font-weight="bold">count &gt;= limit</text>
  <text x="953.2733" y="428.973" text-anchor="middle" font-size="22.5506" fill="var(--danger-dk)">REJECT 429</text>
  <line x1="246.006" y1="294.0541" x2="369.009" y2="259.4595" stroke="var(--text-dark)" stroke-width="3.0751" marker-end="url(#arrowd8_00_intro)" />
  <line x1="656.016" y1="190.2703" x2="820.02" y2="162.5946" stroke="var(--ok-dk)" stroke-width="3.0751" marker-end="url(#arrowd8_00_intro)" />
  <line x1="656.016" y1="328.6486" x2="820.02" y2="387.4595" stroke="var(--danger-dk)" stroke-width="3.0751" marker-end="url(#arrowd8_00_intro)" />
  <text x="615.015" y="570.8108" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Each key tracks request count per IP with auto-expiring TTL window</text>
  <text x="615.015" y="640" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Atomic INCR ensures accuracy under concurrent requests</text>

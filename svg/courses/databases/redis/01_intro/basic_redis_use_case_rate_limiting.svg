<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="41.001" y="207.5676" width="205.005" height="172.973" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="143.5035" y="283.6757" text-anchor="middle" font-size="22.5506" font-weight="bold">Client</text>
  <text x="143.5035" y="339.027" text-anchor="middle" font-size="20.5005">API Request</text>
  <rect x="369.009" y="103.7838" width="287.007" height="311.3514" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="512.5125" y="179.8919" text-anchor="middle" font-size="24.6006" font-weight="bold">Redis</text>
  <text x="512.5125" y="235.2432" text-anchor="middle" font-size="20.5005" font-family="monospace">INCR rate:ip:x</text>
  <text x="512.5125" y="287.1351" text-anchor="middle" font-size="20.5005" font-family="monospace">EXPIRE rate:ip:x 60</text>
  <rect x="399.7598" y="332.1081" width="102.5025" height="62.2703" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="451.011" y="377.0811" text-anchor="middle" font-size="20.5005">count</text>
  <rect x="522.7628" y="332.1081" width="102.5025" height="62.2703" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="574.014" y="377.0811" text-anchor="middle" font-size="20.5005">TTL</text>
  <rect x="820.02" y="86.4865" width="266.5065" height="155.6757" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="953.2733" y="145.2973" text-anchor="middle" font-size="22.5506" font-weight="bold">count &lt; limit</text>
  <text x="953.2733" y="200.6486" text-anchor="middle" font-size="22.5506" fill="var(--ok-accent)">ALLOW</text>
  <rect x="820.02" y="311.3514" width="266.5065" height="155.6757" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="953.2733" y="373.6216" text-anchor="middle" font-size="22.5506" font-weight="bold">count &gt;= limit</text>
  <text x="953.2733" y="428.973" text-anchor="middle" font-size="22.5506" fill="var(--danger-accent)">REJECT 429</text>
  <line x1="246.006" y1="294.0541" x2="369.009" y2="259.4595" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_00_intro)" />
  <line x1="656.016" y1="190.2703" x2="820.02" y2="162.5946" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd8_00_intro)" />
  <line x1="656.016" y1="328.6486" x2="820.02" y2="387.4595" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd8_00_intro)" />
  <text x="615.015" y="570.8108" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Each key tracks request count per IP with auto-expiring TTL window</text>
  <text x="615.015" y="640" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Atomic INCR ensures accuracy under concurrent requests</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd8_00_intro" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
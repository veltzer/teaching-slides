<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="266.6667" height="497.1429" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="173.3333" y="122.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.243" font-weight="bold" fill="var(--ok-text)">Key-Value</text>
  <line x1="69.6296" y1="156" x2="277.037" y2="156" stroke="var(--ok-border)" stroke-width="1.4222" />
  <text x="173.3333" y="222.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6858" font-weight="bold" fill="var(--ok-accent)">Redis</text>
  <text x="173.3333" y="288.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1286" fill="var(--ok-text)">Memcached</text>
  <text x="173.3333" y="354.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1286" fill="var(--ok-text)">DynamoDB</text>
  <text x="173.3333" y="421.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1286" fill="var(--ok-text)">etcd</text>
  <text x="173.3333" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5715" fill="var(--text-faint)">Caching, Sessions</text>
  <rect x="351.111" y="40" width="266.6667" height="497.1429" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="484.4444" y="122.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.243" font-weight="bold" fill="var(--primary-text)">Document</text>
  <line x1="380.7407" y1="156" x2="588.1481" y2="156" stroke="var(--primary-border)" stroke-width="1.4222" />
  <text x="484.4444" y="222.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1286" fill="var(--primary-text)">MongoDB</text>
  <text x="484.4444" y="288.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1286" fill="var(--primary-text)">CouchDB</text>
  <text x="484.4444" y="354.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1286" fill="var(--primary-text)">Firestore</text>
  <text x="484.4444" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5715" fill="var(--text-faint)">Content, Catalogs</text>
  <rect x="662.2222" y="40" width="266.6667" height="497.1429" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795.5555" y="122.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.243" font-weight="bold" fill="var(--warn-text)">Column-Family</text>
  <line x1="691.8518" y1="156" x2="899.2593" y2="156" stroke="var(--warn-border)" stroke-width="1.4222" />
  <text x="795.5555" y="222.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1286" fill="var(--warn-text)">Cassandra</text>
  <text x="795.5555" y="288.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1286" fill="var(--warn-text)">HBase</text>
  <text x="795.5555" y="354.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1286" fill="var(--warn-text)">ScyllaDB</text>
  <text x="795.5555" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5715" fill="var(--text-faint)">Time-series, IoT</text>
  <rect x="973.3333" y="40" width="266.6667" height="497.1429" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1106.6667" y="122.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.243" font-weight="bold" fill="var(--danger-text)">Graph</text>
  <line x1="1002.9629" y1="156" x2="1210.3703" y2="156" stroke="var(--danger-border)" stroke-width="1.4222" />
  <text x="1106.6667" y="222.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1286" fill="var(--danger-text)">Neo4j</text>
  <text x="1106.6667" y="288.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1286" fill="var(--danger-text)">ArangoDB</text>
  <text x="1106.6667" y="354.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1286" fill="var(--danger-text)">Amazon Neptune</text>
  <text x="1106.6667" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5715" fill="var(--text-faint)">Social, Knowledge</text>
</svg>
<svg viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Key-Value -->
  <rect x="30" y="30" width="180" height="150" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="120" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Key-Value</text>
  <line x1="50" y1="65" x2="190" y2="65" stroke="#28a745" stroke-width="1"/>
  <text x="120" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#28a745">Redis</text>
  <text x="120" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Memcached</text>
  <text x="120" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">DynamoDB</text>
  <text x="120" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">etcd</text>
  <text x="120" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Caching, Sessions</text>
  <!-- Document -->
  <rect x="240" y="30" width="180" height="150" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="330" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Document</text>
  <line x1="260" y1="65" x2="400" y2="65" stroke="#4a90e2" stroke-width="1"/>
  <text x="330" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">MongoDB</text>
  <text x="330" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">CouchDB</text>
  <text x="330" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Firestore</text>
  <text x="330" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Content, Catalogs</text>
  <!-- Column-Family -->
  <rect x="450" y="30" width="180" height="150" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="540" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Column-Family</text>
  <line x1="470" y1="65" x2="610" y2="65" stroke="#ffc107" stroke-width="1"/>
  <text x="540" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Cassandra</text>
  <text x="540" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">HBase</text>
  <text x="540" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">ScyllaDB</text>
  <text x="540" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Time-series, IoT</text>
  <!-- Graph -->
  <rect x="660" y="30" width="180" height="150" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Graph</text>
  <line x1="680" y1="65" x2="820" y2="65" stroke="#dc3545" stroke-width="1"/>
  <text x="750" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Neo4j</text>
  <text x="750" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">ArangoDB</text>
  <text x="750" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Amazon Neptune</text>
  <text x="750" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Social, Knowledge</text>
</svg>

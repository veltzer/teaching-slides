<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="42.6667" y="86.4" width="256" height="432" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="170.6667" y="158.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Key-Value</text>
  <line x1="71.1111" y1="187.2" x2="270.2222" y2="187.2" stroke="var(--ok-border)" stroke-width="1.4222" />
  <text x="170.6667" y="244.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0667" font-weight="bold" fill="var(--ok-accent)">Redis</text>
  <text x="170.6667" y="302.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">Memcached</text>
  <text x="170.6667" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">DynamoDB</text>
  <text x="170.6667" y="417.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">etcd</text>
  <text x="170.6667" y="590.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--text-faint)">Caching, Sessions</text>
  <rect x="341.3333" y="86.4" width="256" height="432" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="469.3333" y="158.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Document</text>
  <line x1="369.7778" y1="187.2" x2="568.8889" y2="187.2" stroke="var(--primary-border)" stroke-width="1.4222" />
  <text x="469.3333" y="244.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">MongoDB</text>
  <text x="469.3333" y="302.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">CouchDB</text>
  <text x="469.3333" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">Firestore</text>
  <text x="469.3333" y="590.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--text-faint)">Content, Catalogs</text>
  <rect x="640" y="86.4" width="256" height="432" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="768" y="158.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Column-Family</text>
  <line x1="668.4444" y1="187.2" x2="867.5556" y2="187.2" stroke="var(--warn-border)" stroke-width="1.4222" />
  <text x="768" y="244.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">Cassandra</text>
  <text x="768" y="302.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">HBase</text>
  <text x="768" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">ScyllaDB</text>
  <text x="768" y="590.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--text-faint)">Time-series, IoT</text>
  <rect x="938.6667" y="86.4" width="256" height="432" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1066.6667" y="158.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Graph</text>
  <line x1="967.1111" y1="187.2" x2="1166.2222" y2="187.2" stroke="var(--danger-border)" stroke-width="1.4222" />
  <text x="1066.6667" y="244.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">Neo4j</text>
  <text x="1066.6667" y="302.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">ArangoDB</text>
  <text x="1066.6667" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">Amazon Neptune</text>
  <text x="1066.6667" y="590.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--text-faint)">Social, Knowledge</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="198.2609" height="128.8888" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="138.087" y="94.7778" text-anchor="middle" font-size="19.9624" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">App Server</text>
  <text x="138.087" y="143.1111" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)" font-family="Arial, sans-serif">CPU, mem, rps</text>
  <rect x="40" y="201.1112" width="198.2609" height="128.8888" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="138.087" y="255.8889" text-anchor="middle" font-size="19.9624" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">DB Server</text>
  <text x="138.087" y="304.2222" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)" font-family="Arial, sans-serif">queries/s, lag</text>
  <rect x="40" y="362.2222" width="198.2609" height="128.8888" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="138.087" y="417" text-anchor="middle" font-size="19.9624" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Load Balancer</text>
  <text x="138.087" y="465.3333" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)" font-family="Arial, sans-serif">connections</text>
  <rect x="384.3478" y="88.3333" width="271.3043" height="354.4444" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="520" y="152.7777" text-anchor="middle" font-size="21.9586" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis</text>
  <rect x="405.2175" y="175.3333" width="229.5653" height="58" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.9961" rx="6"/>
  <text x="520" y="217.2223" text-anchor="middle" font-size="19.9624" font-family="Arial, sans-serif" fill="var(--warn-text)">metrics:app:*</text>
  <rect x="405.2175" y="246.2223" width="229.5653" height="58" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.9961" rx="6"/>
  <text x="520" y="288.1111" text-anchor="middle" font-size="19.9624" font-family="Arial, sans-serif" fill="var(--warn-text)">metrics:db:*</text>
  <rect x="405.2175" y="317.1111" width="229.5653" height="58" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.9961" rx="6"/>
  <text x="520" y="359" text-anchor="middle" font-size="19.9624" font-family="Arial, sans-serif" fill="var(--warn-text)">metrics:lb:*</text>
  <rect x="801.7391" y="120.5555" width="208.6956" height="145" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="906.087" y="178.5555" text-anchor="middle" font-size="19.9624" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Aggregator</text>
  <text x="906.087" y="226.8889" text-anchor="middle" font-size="19.9624" font-family="Arial, sans-serif" fill="var(--info-text)">PSUBSCRIBE</text>
  <text x="906.087" y="259.1111" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)" font-family="Arial, sans-serif">metrics:*</text>
  <rect x="801.7391" y="313.8889" width="208.6956" height="128.8888" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="906.087" y="371.8889" text-anchor="middle" font-size="19.9624" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Grafana</text>
  <text x="906.087" y="417" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)" font-family="Arial, sans-serif">live graphs</text>
  <rect x="1062.6087" y="120.5555" width="177.3913" height="145" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1150.2609" y="178.5555" text-anchor="middle" font-size="19.9624" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Alert Eng.</text>
  <text x="1150.2609" y="226.8889" text-anchor="middle" font-size="19.9624" fill="var(--danger-accent)" font-family="Arial, sans-serif">thresholds</text>
  <line x1="238.2608" y1="104.4444" x2="380.174" y2="201.1112" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="238.2608" y1="265.5556" x2="380.174" y2="275.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="238.2608" y1="426.6666" x2="380.174" y2="346.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="655.6522" y1="201.1112" x2="797.5652" y2="191.4445" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="906.087" y1="265.5556" x2="906.087" y2="307.4445" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="655.6522" y1="249.4445" x2="1058.4348" y2="191.4445" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="645.2174" y="571.6667" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)" font-family="Arial, sans-serif">Servers publish metrics every N seconds; consumers process in real-time</text>
  <text x="645.2174" y="620" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)" font-family="Arial, sans-serif">Pattern subscriptions (metrics:*) capture all metric channels at once</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd14_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="19.961" y="33.6842" width="189.6297" height="134.7368" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="113.7778" y="90.9474" text-anchor="middle" font-size="19.961" font-weight="bold">App Server</text>
  <text x="113.7778" y="141.4737" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">CPU, mem, rps</text>
  <rect x="19.961" y="202.1053" width="189.6297" height="134.7368" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="113.7778" y="259.3684" text-anchor="middle" font-size="19.961" font-weight="bold">DB Server</text>
  <text x="113.7778" y="309.8947" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">queries/s, lag</text>
  <rect x="19.961" y="370.5263" width="189.6297" height="134.7368" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="113.7778" y="427.7895" text-anchor="middle" font-size="19.961" font-weight="bold">Load Balancer</text>
  <text x="113.7778" y="478.3158" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">connections</text>
  <rect x="349.3177" y="84.2105" width="259.4931" height="370.5263" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="479.0643" y="151.5789" text-anchor="middle" font-size="21.9571" font-weight="bold">Redis</text>
  <rect x="369.2788" y="175.1579" width="219.5712" height="60.6316" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.9961" rx="6" />
  <text x="479.0643" y="218.9474" text-anchor="middle" font-size="19.961">metrics:app:*</text>
  <rect x="369.2788" y="249.2632" width="219.5712" height="60.6316" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.9961" rx="6" />
  <text x="479.0643" y="293.0526" text-anchor="middle" font-size="19.961">metrics:db:*</text>
  <rect x="369.2788" y="323.3684" width="219.5712" height="60.6316" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.9961" rx="6" />
  <text x="479.0643" y="367.1579" text-anchor="middle" font-size="19.961">metrics:lb:*</text>
  <rect x="748.538" y="117.8947" width="199.6101" height="151.5789" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="848.3431" y="178.5263" text-anchor="middle" font-size="19.961" font-weight="bold">Aggregator</text>
  <text x="848.3431" y="229.0526" text-anchor="middle" font-size="19.961">PSUBSCRIBE</text>
  <text x="848.3431" y="262.7368" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">metrics:*</text>
  <rect x="748.538" y="320" width="199.6101" height="134.7368" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="848.3431" y="380.6316" text-anchor="middle" font-size="19.961" font-weight="bold">Grafana</text>
  <text x="848.3431" y="427.7895" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">live graphs</text>
  <rect x="998.0507" y="117.8947" width="169.6686" height="151.5789" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1081.887" y="178.5263" text-anchor="middle" font-size="19.961" font-weight="bold">Alert Eng.</text>
  <text x="1081.887" y="229.0526" text-anchor="middle" font-size="19.961" fill="var(--danger-accent)">thresholds</text>
  <line x1="209.5906" y1="101.0526" x2="345.3256" y2="202.1053" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd14_03_pubsub)" />
  <line x1="209.5906" y1="269.4737" x2="345.3256" y2="279.5789" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd14_03_pubsub)" />
  <line x1="209.5906" y1="437.8947" x2="345.3256" y2="353.6842" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd14_03_pubsub)" />
  <line x1="608.8109" y1="202.1053" x2="744.5458" y2="192" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd14_03_pubsub)" />
  <line x1="848.3431" y1="269.4737" x2="848.3431" y2="313.2632" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd14_03_pubsub)" />
  <line x1="608.8109" y1="252.6316" x2="994.0585" y2="192" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd14_03_pubsub)" />
  <text x="598.8304" y="589.4737" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Servers publish metrics every N seconds; consumers process in real-time</text>
  <text x="598.8304" y="640" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Pattern subscriptions (metrics:*) capture all metric channels at once</text>
</svg>
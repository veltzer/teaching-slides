<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd14_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="198.2609" height="128.8888" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="138.087" y="94.7778" text-anchor="middle" font-size="19.9624" font-weight="bold">App Server</text>
  <text x="138.087" y="143.1111" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)">CPU, mem, rps</text>
  <rect x="40" y="201.1112" width="198.2609" height="128.8888" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="138.087" y="255.8889" text-anchor="middle" font-size="19.9624" font-weight="bold">DB Server</text>
  <text x="138.087" y="304.2222" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)">queries/s, lag</text>
  <rect x="40" y="362.2222" width="198.2609" height="128.8888" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="138.087" y="417" text-anchor="middle" font-size="19.9624" font-weight="bold">Load Balancer</text>
  <text x="138.087" y="465.3333" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)">connections</text>
  <rect x="384.3478" y="88.3333" width="271.3043" height="354.4444" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="520" y="152.7777" text-anchor="middle" font-size="21.9586" font-weight="bold">Redis</text>
  <rect x="405.2175" y="175.3333" width="229.5653" height="58" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.9961" rx="6" />
  <text x="520" y="217.2223" text-anchor="middle" font-size="19.9624">metrics:app:*</text>
  <rect x="405.2175" y="246.2223" width="229.5653" height="58" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.9961" rx="6" />
  <text x="520" y="288.1111" text-anchor="middle" font-size="19.9624">metrics:db:*</text>
  <rect x="405.2175" y="317.1111" width="229.5653" height="58" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.9961" rx="6" />
  <text x="520" y="359" text-anchor="middle" font-size="19.9624">metrics:lb:*</text>
  <rect x="801.7391" y="120.5555" width="208.6956" height="145" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="906.087" y="178.5555" text-anchor="middle" font-size="19.9624" font-weight="bold">Aggregator</text>
  <text x="906.087" y="226.8889" text-anchor="middle" font-size="19.9624">PSUBSCRIBE</text>
  <text x="906.087" y="259.1111" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)">metrics:*</text>
  <rect x="801.7391" y="313.8889" width="208.6956" height="128.8888" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="906.087" y="371.8889" text-anchor="middle" font-size="19.9624" font-weight="bold">Grafana</text>
  <text x="906.087" y="417" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)">live graphs</text>
  <rect x="1062.6087" y="120.5555" width="177.3913" height="145" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1150.2609" y="178.5555" text-anchor="middle" font-size="19.9624" font-weight="bold">Alert Eng.</text>
  <text x="1150.2609" y="226.8889" text-anchor="middle" font-size="19.9624" fill="var(--danger-accent)">thresholds</text>
  <line x1="238.2608" y1="104.4444" x2="380.174" y2="201.1112" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd14_03_pubsub)" />
  <line x1="238.2608" y1="265.5556" x2="380.174" y2="275.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd14_03_pubsub)" />
  <line x1="238.2608" y1="426.6666" x2="380.174" y2="346.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd14_03_pubsub)" />
  <line x1="655.6522" y1="201.1112" x2="797.5652" y2="191.4445" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd14_03_pubsub)" />
  <line x1="906.087" y1="265.5556" x2="906.087" y2="307.4445" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd14_03_pubsub)" />
  <line x1="655.6522" y1="249.4445" x2="1058.4348" y2="191.4445" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd14_03_pubsub)" />
  <text x="645.2174" y="571.6667" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)">Servers publish metrics every N seconds; consumers process in real-time</text>
  <text x="645.2174" y="620" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)">Pattern subscriptions (metrics:*) capture all metric channels at once</text>
</svg>
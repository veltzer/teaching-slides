<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd5_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 19.2 8.64 z" fill="#333" />
    </marker>
  </defs>
  <text x="667.027" y="40" text-anchor="middle" font-size="24.6581" font-weight="bold" fill="var(--text)">Cache Invalidation via Pub/Sub</text>
  <rect x="40" y="105.9091" width="237.8378" height="118.6364" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="158.919" y="153.3636" text-anchor="middle" font-size="22.6033" font-weight="bold">Write Service</text>
  <text x="158.919" y="192.9091" text-anchor="middle" font-size="20.5484" fill="var(--text-muted)">updates DB</text>
  <rect x="494.0541" y="92.7272" width="281.081" height="145" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="634.5946" y="150.7272" text-anchor="middle" font-size="22.6033" font-weight="bold">Redis Pub/Sub</text>
  <text x="634.5946" y="192.9091" text-anchor="middle" font-size="20.5484">cache:invalidate</text>
  <rect x="1002.1622" y="66.3636" width="237.8378" height="92.2727" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1121.0811" y="124.3636" text-anchor="middle" font-size="20.5484">App Server 1</text>
  <rect x="1002.1622" y="179.7273" width="237.8378" height="92.2727" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1121.0811" y="237.7273" text-anchor="middle" font-size="20.5484">App Server 2</text>
  <line x1="277.8379" y1="163.9091" x2="489.7298" y2="163.9091" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd5_03_pubsub)" />
  <text x="385.946" y="145.4545" text-anchor="middle" font-size="20.5484" fill="var(--primary-accent)">1. PUBLISH</text>
  <line x1="775.1352" y1="137.5454" x2="997.8378" y2="111.1818" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd5_03_pubsub)" />
  <line x1="775.1352" y1="179.7273" x2="997.8378" y2="224.5455" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd5_03_pubsub)" />
  <text x="883.2433" y="119.0909" text-anchor="middle" font-size="20.5484" fill="var(--ok-accent)">2. notify</text>
  <rect x="1012.973" y="303.6364" width="216.2162" height="92.2727" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1121.0811" y="343.1818" text-anchor="middle" font-size="20.5484" fill="var(--danger-accent)">Local Cache</text>
  <text x="1121.0811" y="377.4545" text-anchor="middle" font-size="22.6033" fill="var(--danger-accent)" font-weight="bold">DEL key</text>
  <line x1="1121.0811" y1="271.9999" x2="1121.0811" y2="298.3636" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd5_03_pubsub)" />
  <text x="1196.7568" y="295.7273" font-size="20.5484" fill="var(--danger-accent)">3.</text>
  <rect x="83.2433" y="369.5454" width="735.1351" height="250.4546" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="126.4866" y="427.5455" font-size="20.5484" fill="var(--text)">1. Write service updates DB and publishes invalidation</text>
  <text x="126.4866" y="475" font-size="20.5484" fill="var(--text)">2. Redis delivers to all subscribed app servers</text>
  <text x="126.4866" y="522.4545" font-size="20.5484" fill="var(--text)">3. Each server evicts stale key from local cache</text>
  <text x="126.4866" y="580.4545" font-size="20.5484" fill="var(--text-muted)">Result: all caches stay consistent without polling</text>
</svg>
    <ns0:marker id="arrowd5_03_pubsub" markerWidth="21.3333" markerHeight="28.8" refX="19.2" refY="8.64" orient="auto">
      <ns0:path d="M 0 0 L 0 17.28 L 19.2 8.64 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="605.2009" y="40.8511" text-anchor="middle" font-size="24.208" font-weight="bold" fill="#333">Cache Invalidation via Pub/Sub</ns0:text>
  <ns0:rect x="20.1733" y="108.9362" width="221.907" height="122.5532" fill="#e3f2fd" stroke="#333" stroke-width="4.0347" rx="10.0867" />
  <ns0:text x="131.1269" y="157.9574" text-anchor="middle" font-size="22.1907" font-weight="bold">Write Service</ns0:text>
  <ns0:text x="131.1269" y="198.8085" text-anchor="middle" font-size="20.1733" fill="#666">updates DB</ns0:text>
  <ns0:rect x="443.814" y="95.3191" width="262.2537" height="149.7872" fill="#fff3e0" stroke="#333" stroke-width="4.0347" rx="16.1387" />
  <ns0:text x="574.9409" y="155.234" text-anchor="middle" font-size="22.1907" font-weight="bold">Redis Pub/Sub</ns0:text>
  <ns0:text x="574.9409" y="198.8085" text-anchor="middle" font-size="20.1733">cache:invalidate</ns0:text>
  <ns0:rect x="917.8881" y="68.0851" width="221.907" height="95.3191" fill="#e8f5e9" stroke="#333" stroke-width="4.0347" rx="10.0867" />
  <ns0:text x="1028.8416" y="128" text-anchor="middle" font-size="20.1733">App Server 1</ns0:text>
  <ns0:rect x="917.8881" y="185.1915" width="221.907" height="95.3191" fill="#e8f5e9" stroke="#333" stroke-width="4.0347" rx="10.0867" />
  <ns0:text x="1028.8416" y="245.1064" text-anchor="middle" font-size="20.1733">App Server 2</ns0:text>
  <ns0:line x1="242.0804" y1="168.8511" x2="439.7794" y2="168.8511" stroke="#1565c0" stroke-width="4.0347" marker-end="url(#arrowd5_03_pubsub)" />
  <ns0:text x="342.9472" y="149.7872" text-anchor="middle" font-size="20.1733" fill="#1565c0">1. PUBLISH</ns0:text>
  <ns0:line x1="706.0678" y1="141.617" x2="913.8534" y2="114.383" stroke="#2e7d32" stroke-width="4.0347" marker-end="url(#arrowd5_03_pubsub)" />
  <ns0:line x1="706.0678" y1="185.1915" x2="913.8534" y2="231.4894" stroke="#2e7d32" stroke-width="4.0347" marker-end="url(#arrowd5_03_pubsub)" />
  <ns0:text x="806.9346" y="122.5532" text-anchor="middle" font-size="20.1733" fill="#2e7d32">2. notify</ns0:text>
  <ns0:rect x="927.9748" y="313.1915" width="201.7336" height="95.3191" fill="#ffebee" stroke="#c62828" stroke-width="3.026" rx="8.0693" />
  <ns0:text x="1028.8416" y="354.0426" text-anchor="middle" font-size="20.1733" fill="#c62828">Local Cache</ns0:text>
  <ns0:text x="1028.8416" y="389.4468" text-anchor="middle" font-size="22.1907" fill="#c62828" font-weight="bold">DEL key</ns0:text>
  <ns0:line x1="1028.8416" y1="280.5106" x2="1028.8416" y2="307.7447" stroke="#c62828" stroke-width="3.026" marker-end="url(#arrowd5_03_pubsub)" />
  <ns0:text x="1099.4484" y="305.0213" font-size="20.1733" fill="#c62828">3.</ns0:text>
  <ns0:rect x="60.5201" y="381.2766" width="685.8944" height="258.7234" fill="#f5f5f5" stroke="#999" stroke-width="2.0173" rx="10.0867" />
  <ns0:text x="100.8669" y="441.1915" font-size="20.1733" fill="#333">1. Write service updates DB and publishes invalidation</ns0:text>
  <ns0:text x="100.8669" y="490.2128" font-size="20.1733" fill="#333">2. Redis delivers to all subscribed app servers</ns0:text>
  <ns0:text x="100.8669" y="539.234" font-size="20.1733" fill="#333">3. Each server evicts stale key from local cache</ns0:text>
  <ns0:text x="100.8669" y="599.1489" font-size="20.1733" fill="#666">Result: all caches stay consistent without polling</ns0:text>
</ns0:svg>
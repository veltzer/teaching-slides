    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd5_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 19.2 8.64 z" fill="#333" />
    </marker>
  </defs>
  <text x="605.2009" y="40.8511" text-anchor="middle" font-size="24.208" font-weight="bold" fill="var(--text-dark)">Cache Invalidation via Pub/Sub</text>
  <rect x="20.1733" y="108.9362" width="221.907" height="122.5532" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="4.0347" rx="10.0867" />
  <text x="131.1269" y="157.9574" text-anchor="middle" font-size="22.1907" font-weight="bold">Write Service</text>
  <text x="131.1269" y="198.8085" text-anchor="middle" font-size="20.1733" fill="var(--text-mid)">updates DB</text>
  <rect x="443.814" y="95.3191" width="262.2537" height="149.7872" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="4.0347" rx="16.1387" />
  <text x="574.9409" y="155.234" text-anchor="middle" font-size="22.1907" font-weight="bold">Redis Pub/Sub</text>
  <text x="574.9409" y="198.8085" text-anchor="middle" font-size="20.1733">cache:invalidate</text>
  <rect x="917.8881" y="68.0851" width="221.907" height="95.3191" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="4.0347" rx="10.0867" />
  <text x="1028.8416" y="128" text-anchor="middle" font-size="20.1733">App Server 1</text>
  <rect x="917.8881" y="185.1915" width="221.907" height="95.3191" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="4.0347" rx="10.0867" />
  <text x="1028.8416" y="245.1064" text-anchor="middle" font-size="20.1733">App Server 2</text>
  <line x1="242.0804" y1="168.8511" x2="439.7794" y2="168.8511" stroke="var(--primary-dk)" stroke-width="4.0347" marker-end="url(#arrowd5_03_pubsub)" />
  <text x="342.9472" y="149.7872" text-anchor="middle" font-size="20.1733" fill="var(--primary-dk)">1. PUBLISH</text>
  <line x1="706.0678" y1="141.617" x2="913.8534" y2="114.383" stroke="var(--ok-dk)" stroke-width="4.0347" marker-end="url(#arrowd5_03_pubsub)" />
  <line x1="706.0678" y1="185.1915" x2="913.8534" y2="231.4894" stroke="var(--ok-dk)" stroke-width="4.0347" marker-end="url(#arrowd5_03_pubsub)" />
  <text x="806.9346" y="122.5532" text-anchor="middle" font-size="20.1733" fill="var(--ok-dk)">2. notify</text>
  <rect x="927.9748" y="313.1915" width="201.7336" height="95.3191" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="3.026" rx="8.0693" />
  <text x="1028.8416" y="354.0426" text-anchor="middle" font-size="20.1733" fill="var(--danger-dk)">Local Cache</text>
  <text x="1028.8416" y="389.4468" text-anchor="middle" font-size="22.1907" fill="var(--danger-dk)" font-weight="bold">DEL key</text>
  <line x1="1028.8416" y1="280.5106" x2="1028.8416" y2="307.7447" stroke="var(--danger-dk)" stroke-width="3.026" marker-end="url(#arrowd5_03_pubsub)" />
  <text x="1099.4484" y="305.0213" font-size="20.1733" fill="var(--danger-dk)">3.</text>
  <rect x="60.5201" y="381.2766" width="685.8944" height="258.7234" fill="var(--surface)" stroke="var(--text-faintest)" stroke-width="2.0173" rx="10.0867" />
  <text x="100.8669" y="441.1915" font-size="20.1733" fill="var(--text-dark)">1. Write service updates DB and publishes invalidation</text>
  <text x="100.8669" y="490.2128" font-size="20.1733" fill="var(--text-dark)">2. Redis delivers to all subscribed app servers</text>
  <text x="100.8669" y="539.234" font-size="20.1733" fill="var(--text-dark)">3. Each server evicts stale key from local cache</text>
  <text x="100.8669" y="599.1489" font-size="20.1733" fill="var(--text-mid)">Result: all caches stay consistent without polling</text>
</svg>
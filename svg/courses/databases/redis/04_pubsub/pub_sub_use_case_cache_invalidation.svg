<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="81.428616326528" width="237.8378" height="124.285744217685" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.141195586949" filter="url(#shadow)"/>
  <text x="158.919" y="131.142851156463" text-anchor="middle" font-size="23.135214368413" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Write Service</text>
  <text x="158.919" y="172.571467482991" text-anchor="middle" font-size="21.031957233142" fill="var(--text-muted)" font-family="Arial, sans-serif">updates DB</text>
  <rect x="494.0541" y="67.619007709753" width="281.081" height="151.904751927438" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.141195586949" filter="url(#shadow)"/>
  <text x="634.5946" y="128.380908480729" text-anchor="middle" font-size="23.135214368413" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Pub/Sub</text>
  <text x="634.5946" y="172.571467482991" text-anchor="middle" font-size="21.031957233142" font-family="Arial, sans-serif" fill="var(--warn-text)">cache:invalidate</text>
  <rect x="1002.1622" y="40" width="237.8378" height="96.666631746034" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.141195586949" filter="url(#shadow)"/>
  <text x="1121.0811" y="100.761900770975" text-anchor="middle" font-size="21.031957233142" font-family="Arial, sans-serif" fill="var(--ok-text)">App Server 1</text>
  <rect x="1002.1622" y="158.761963628114" width="237.8378" height="96.666631746034" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.141195586949" filter="url(#shadow)"/>
  <text x="1121.0811" y="219.523864399089" text-anchor="middle" font-size="21.031957233142" font-family="Arial, sans-serif" fill="var(--ok-text)">App Server 2</text>
  <line x1="277.8379" y1="142.190517097503" x2="489.7298" y2="142.190517097503" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385.946" y="122.857127891157" text-anchor="middle" font-size="21.031957233142" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. PUBLISH</text>
  <line x1="775.1352" y1="114.571404625852" x2="997.8378" y2="86.952396916099" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="775.1352" y1="158.761963628114" x2="997.8378" y2="205.714360544213" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="883.2433" y="95.238120181404" text-anchor="middle" font-size="21.031957233142" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. notify</text>
  <rect x="1012.973" y="288.57148843537" width="216.2162" height="96.666631746034" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.141195586949" filter="url(#shadow)"/>
  <text x="1121.0811" y="330" text-anchor="middle" font-size="21.031957233142" fill="var(--danger-accent)" font-family="Arial, sans-serif">Local Cache</text>
  <text x="1121.0811" y="365.904730975059" text-anchor="middle" font-size="23.135214368413" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">DEL key</text>
  <line x1="1121.0811" y1="255.42849061225" x2="1121.0811" y2="283.047603083901" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1196.7568" y="280.285765170065" font-size="21.031957233142" fill="var(--danger-accent)" font-family="Arial, sans-serif">3.</text>
  <rect x="83.2433" y="357.619007709753" width="735.1351" height="262.380992290247" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.141195586949"/>
  <text x="126.4866" y="418.381013242626" font-size="21.031957233142" fill="var(--text)" font-family="Arial, sans-serif">1. Write service updates DB and publishes invalidation</text>
  <text x="126.4866" y="468.095248072562" font-size="21.031957233142" fill="var(--text)" font-family="Arial, sans-serif">2. Redis delivers to all subscribed app servers</text>
  <text x="126.4866" y="517.809482902497" font-size="21.031957233142" fill="var(--text)" font-family="Arial, sans-serif">3. Each server evicts stale key from local cache</text>
  <text x="126.4866" y="578.571383673472" font-size="21.031957233142" fill="var(--text-muted)" font-family="Arial, sans-serif">Result: all caches stay consistent without polling</text>
</svg>

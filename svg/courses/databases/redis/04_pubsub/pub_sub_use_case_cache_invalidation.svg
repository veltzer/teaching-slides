<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd5_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 19.2 8.64 z" fill="#333" />
    </marker>
  </defs>
  <text x="605.2009" y="40.8511" text-anchor="middle" font-size="24.208" font-weight="bold" fill="var(--text)">Cache Invalidation via Pub/Sub</text>
  <rect x="20.1733" y="108.9362" width="221.907" height="122.5532" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="131.1269" y="157.9574" text-anchor="middle" font-size="22.1907" font-weight="bold">Write Service</text>
  <text x="131.1269" y="198.8085" text-anchor="middle" font-size="20.1733" fill="var(--text-muted)">updates DB</text>
  <rect x="443.814" y="95.3191" width="262.2537" height="149.7872" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="574.9409" y="155.234" text-anchor="middle" font-size="22.1907" font-weight="bold">Redis Pub/Sub</text>
  <text x="574.9409" y="198.8085" text-anchor="middle" font-size="20.1733">cache:invalidate</text>
  <rect x="917.8881" y="68.0851" width="221.907" height="95.3191" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1028.8416" y="128" text-anchor="middle" font-size="20.1733">App Server 1</text>
  <rect x="917.8881" y="185.1915" width="221.907" height="95.3191" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1028.8416" y="245.1064" text-anchor="middle" font-size="20.1733">App Server 2</text>
  <line x1="242.0804" y1="168.8511" x2="439.7794" y2="168.8511" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd5_03_pubsub)" />
  <text x="342.9472" y="149.7872" text-anchor="middle" font-size="20.1733" fill="var(--primary-accent)">1. PUBLISH</text>
  <line x1="706.0678" y1="141.617" x2="913.8534" y2="114.383" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd5_03_pubsub)" />
  <line x1="706.0678" y1="185.1915" x2="913.8534" y2="231.4894" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd5_03_pubsub)" />
  <text x="806.9346" y="122.5532" text-anchor="middle" font-size="20.1733" fill="var(--ok-accent)">2. notify</text>
  <rect x="927.9748" y="313.1915" width="201.7336" height="95.3191" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1028.8416" y="354.0426" text-anchor="middle" font-size="20.1733" fill="var(--danger-accent)">Local Cache</text>
  <text x="1028.8416" y="389.4468" text-anchor="middle" font-size="22.1907" fill="var(--danger-accent)" font-weight="bold">DEL key</text>
  <line x1="1028.8416" y1="280.5106" x2="1028.8416" y2="307.7447" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd5_03_pubsub)" />
  <text x="1099.4484" y="305.0213" font-size="20.1733" fill="var(--danger-accent)">3.</text>
  <rect x="60.5201" y="381.2766" width="685.8944" height="258.7234" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="100.8669" y="441.1915" font-size="20.1733" fill="var(--text)">1. Write service updates DB and publishes invalidation</text>
  <text x="100.8669" y="490.2128" font-size="20.1733" fill="var(--text)">2. Redis delivers to all subscribed app servers</text>
  <text x="100.8669" y="539.234" font-size="20.1733" fill="var(--text)">3. Each server evicts stale key from local cache</text>
  <text x="100.8669" y="599.1489" font-size="20.1733" fill="var(--text-muted)">Result: all caches stay consistent without polling</text>
</svg>
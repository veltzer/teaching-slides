<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="667.027" y="40" text-anchor="middle" font-size="24.6581" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cache Invalidation via Pub/Sub</text>
  <rect x="40" y="105.9091" width="237.8378" height="118.6364" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="158.919" y="153.3636" text-anchor="middle" font-size="22.6033" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Write Service</text>
  <text x="158.919" y="192.9091" text-anchor="middle" font-size="20.5484" fill="var(--text-muted)" font-family="Arial, sans-serif">updates DB</text>
  <rect x="494.0541" y="92.7272" width="281.081" height="145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="634.5946" y="150.7272" text-anchor="middle" font-size="22.6033" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Pub/Sub</text>
  <text x="634.5946" y="192.9091" text-anchor="middle" font-size="20.5484" font-family="Arial, sans-serif" fill="var(--warn-text)">cache:invalidate</text>
  <rect x="1002.1622" y="66.3636" width="237.8378" height="92.2727" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1121.0811" y="124.3636" text-anchor="middle" font-size="20.5484" font-family="Arial, sans-serif" fill="var(--ok-text)">App Server 1</text>
  <rect x="1002.1622" y="179.7273" width="237.8378" height="92.2727" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1121.0811" y="237.7273" text-anchor="middle" font-size="20.5484" font-family="Arial, sans-serif" fill="var(--ok-text)">App Server 2</text>
  <line x1="277.8379" y1="163.9091" x2="489.7298" y2="163.9091" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385.946" y="145.4545" text-anchor="middle" font-size="20.5484" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. PUBLISH</text>
  <line x1="775.1352" y1="137.5454" x2="997.8378" y2="111.1818" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="775.1352" y1="179.7273" x2="997.8378" y2="224.5455" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="883.2433" y="119.0909" text-anchor="middle" font-size="20.5484" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. notify</text>
  <rect x="1012.973" y="303.6364" width="216.2162" height="92.2727" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1121.0811" y="343.1818" text-anchor="middle" font-size="20.5484" fill="var(--danger-accent)" font-family="Arial, sans-serif">Local Cache</text>
  <text x="1121.0811" y="377.4545" text-anchor="middle" font-size="22.6033" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">DEL key</text>
  <line x1="1121.0811" y1="271.9999" x2="1121.0811" y2="298.3636" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1196.7568" y="295.7273" font-size="20.5484" fill="var(--danger-accent)" font-family="Arial, sans-serif">3.</text>
  <rect x="83.2433" y="369.5454" width="735.1351" height="250.4546" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="126.4866" y="427.5455" font-size="20.5484" fill="var(--text)" font-family="Arial, sans-serif">1. Write service updates DB and publishes invalidation</text>
  <text x="126.4866" y="475" font-size="20.5484" fill="var(--text)" font-family="Arial, sans-serif">2. Redis delivers to all subscribed app servers</text>
  <text x="126.4866" y="522.4545" font-size="20.5484" fill="var(--text)" font-family="Arial, sans-serif">3. Each server evicts stale key from local cache</text>
  <text x="126.4866" y="580.4545" font-size="20.5484" fill="var(--text-muted)" font-family="Arial, sans-serif">Result: all caches stay consistent without polling</text>
</svg>

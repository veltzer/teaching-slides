<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd3_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 19.2 8.64 z" fill="#333" />
    </marker>
  </defs>
  <rect x="21.0699" y="56.8889" width="189.6296" height="113.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="115.8847" y="128" text-anchor="middle" font-size="23.177">User Alice</text>
  <rect x="21.0699" y="256" width="189.6296" height="113.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="115.8847" y="327.1111" text-anchor="middle" font-size="23.177">User Bob</text>
  <rect x="21.0699" y="455.1111" width="189.6296" height="113.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="115.8847" y="526.2222" text-anchor="middle" font-size="23.177">User Carol</text>
  <rect x="421.3992" y="170.6667" width="252.8395" height="312.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="547.819" y="241.7778" text-anchor="middle" font-size="25.284" font-weight="bold">Redis</text>
  <rect x="442.4691" y="270.2222" width="210.6996" height="71.1111" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="547.819" y="318.5778" text-anchor="middle" font-size="21.0699">chat:room:general</text>
  <rect x="442.4691" y="355.5556" width="210.6996" height="71.1111" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="547.819" y="403.9111" text-anchor="middle" font-size="21.0699">chat:room:dev</text>
  <rect x="906.0082" y="56.8889" width="210.6996" height="113.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1011.358" y="102.4" text-anchor="middle" font-size="21.0699">Alice + Bob</text>
  <text x="1011.358" y="142.2222" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">#general</text>
  <rect x="906.0082" y="256" width="210.6996" height="113.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1011.358" y="301.5111" text-anchor="middle" font-size="21.0699">Bob + Carol</text>
  <text x="1011.358" y="341.3333" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">#dev</text>
  <line x1="210.6996" y1="113.7778" x2="417.1852" y2="298.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd3_03_pubsub)" />
  <line x1="210.6996" y1="312.8889" x2="417.1852" y2="327.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd3_03_pubsub)" />
  <line x1="210.6996" y1="512" x2="417.1852" y2="398.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd3_03_pubsub)" />
  <line x1="674.2387" y1="304.3556" x2="901.7943" y2="113.7778" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd3_03_pubsub)" />
  <line x1="674.2387" y1="389.6889" x2="901.7943" y2="312.8889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd3_03_pubsub)" />
  <text x="305.5144" y="170.6667" text-anchor="middle" font-size="21.0699" fill="var(--primary-accent)">PUBLISH</text>
  <text x="800.6585" y="184.8889" text-anchor="middle" font-size="21.0699" fill="var(--ok-accent)">deliver</text>
  <text x="632.0988" y="597.3333" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">Each chat room = a Redis Pub/Sub channel</text>
  <text x="632.0988" y="640" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">Users subscribe to rooms they join</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd3_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 19.2 8.64 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="207.6923" height="113.1708" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="143.8461" y="110.7317" text-anchor="middle" font-size="24.1909">User Alice</text>
  <rect x="40" y="238.0488" width="207.6923" height="113.1708" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="143.8461" y="308.7805" text-anchor="middle" font-size="24.1909">User Bob</text>
  <rect x="40" y="436.0975" width="207.6923" height="113.1708" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="143.8461" y="506.8292" text-anchor="middle" font-size="24.1909">User Carol</text>
  <rect x="478.4616" y="153.1708" width="276.9231" height="311.2195" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="616.9232" y="223.9025" text-anchor="middle" font-size="26.3901" font-weight="bold">Redis</text>
  <rect x="501.5385" y="252.1951" width="230.7692" height="70.7317" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="616.9232" y="300.2927" text-anchor="middle" font-size="21.9917">chat:room:general</text>
  <rect x="501.5385" y="337.0732" width="230.7692" height="70.7317" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="616.9232" y="385.1707" text-anchor="middle" font-size="21.9917">chat:room:dev</text>
  <rect x="1009.2308" y="40" width="230.7692" height="113.1708" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1124.6154" y="85.2683" text-anchor="middle" font-size="21.9917">Alice + Bob</text>
  <text x="1124.6154" y="124.878" text-anchor="middle" font-size="21.9917" fill="var(--text-muted)">#general</text>
  <rect x="1009.2308" y="238.0488" width="230.7692" height="113.1708" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1124.6154" y="283.3171" text-anchor="middle" font-size="21.9917">Bob + Carol</text>
  <text x="1124.6154" y="322.9268" text-anchor="middle" font-size="21.9917" fill="var(--text-muted)">#dev</text>
  <line x1="247.6924" y1="96.5854" x2="473.8462" y2="280.4878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd3_03_pubsub)" />
  <line x1="247.6924" y1="294.6342" x2="473.8462" y2="308.7805" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd3_03_pubsub)" />
  <line x1="247.6924" y1="492.6829" x2="473.8462" y2="379.5122" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd3_03_pubsub)" />
  <line x1="755.3847" y1="286.1464" x2="1004.6155" y2="96.5854" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd3_03_pubsub)" />
  <line x1="755.3847" y1="371.0244" x2="1004.6155" y2="294.6342" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd3_03_pubsub)" />
  <text x="351.5385" y="153.1708" text-anchor="middle" font-size="21.9917" fill="var(--primary-accent)">PUBLISH</text>
  <text x="893.8463" y="167.3171" text-anchor="middle" font-size="21.9917" fill="var(--ok-accent)">deliver</text>
  <text x="709.2308" y="577.5609" text-anchor="middle" font-size="21.9917" fill="var(--text-muted)">Each chat room = a Redis Pub/Sub channel</text>
  <text x="709.2308" y="620" text-anchor="middle" font-size="21.9917" fill="var(--text-muted)">Users subscribe to rooms they join</text>
</svg>
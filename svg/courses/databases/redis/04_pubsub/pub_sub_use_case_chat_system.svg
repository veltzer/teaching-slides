<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="207.6923" height="113.1708" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="143.8461" y="110.7317" text-anchor="middle" font-size="24.1909" font-family="Arial, sans-serif" fill="var(--primary-text)">User Alice</text>
  <rect x="40" y="238.0488" width="207.6923" height="113.1708" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="143.8461" y="308.7805" text-anchor="middle" font-size="24.1909" font-family="Arial, sans-serif" fill="var(--primary-text)">User Bob</text>
  <rect x="40" y="436.0975" width="207.6923" height="113.1708" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="143.8461" y="506.8292" text-anchor="middle" font-size="24.1909" font-family="Arial, sans-serif" fill="var(--primary-text)">User Carol</text>
  <rect x="478.4616" y="153.1708" width="276.9231" height="311.2195" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="616.9232" y="223.9025" text-anchor="middle" font-size="26.3901" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis</text>
  <rect x="501.5385" y="252.1951" width="230.7692" height="70.7317" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6"/>
  <text x="616.9232" y="300.2927" text-anchor="middle" font-size="21.9917" font-family="Arial, sans-serif" fill="var(--warn-text)">chat:room:general</text>
  <rect x="501.5385" y="337.0732" width="230.7692" height="70.7317" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6"/>
  <text x="616.9232" y="385.1707" text-anchor="middle" font-size="21.9917" font-family="Arial, sans-serif" fill="var(--warn-text)">chat:room:dev</text>
  <rect x="1009.2308" y="40" width="230.7692" height="113.1708" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1124.6154" y="85.2683" text-anchor="middle" font-size="21.9917" font-family="Arial, sans-serif" fill="var(--ok-text)">Alice + Bob</text>
  <text x="1124.6154" y="124.878" text-anchor="middle" font-size="21.9917" fill="var(--text-muted)" font-family="Arial, sans-serif">#general</text>
  <rect x="1009.2308" y="238.0488" width="230.7692" height="113.1708" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1124.6154" y="283.3171" text-anchor="middle" font-size="21.9917" font-family="Arial, sans-serif" fill="var(--ok-text)">Bob + Carol</text>
  <text x="1124.6154" y="322.9268" text-anchor="middle" font-size="21.9917" fill="var(--text-muted)" font-family="Arial, sans-serif">#dev</text>
  <line x1="247.6924" y1="96.5854" x2="473.8462" y2="280.4878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="247.6924" y1="294.6342" x2="473.8462" y2="308.7805" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="247.6924" y1="492.6829" x2="473.8462" y2="379.5122" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="755.3847" y1="286.1464" x2="1004.6155" y2="96.5854" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="755.3847" y1="371.0244" x2="1004.6155" y2="294.6342" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="351.5385" y="153.1708" text-anchor="middle" font-size="21.9917" fill="var(--primary-accent)" font-family="Arial, sans-serif">PUBLISH</text>
  <text x="893.8463" y="167.3171" text-anchor="middle" font-size="21.9917" fill="var(--ok-accent)" font-family="Arial, sans-serif">deliver</text>
  <text x="709.2308" y="577.5609" text-anchor="middle" font-size="21.9917" fill="var(--text-muted)" font-family="Arial, sans-serif">Each chat room = a Redis Pub/Sub channel</text>
  <text x="709.2308" y="620" text-anchor="middle" font-size="21.9917" fill="var(--text-muted)" font-family="Arial, sans-serif">Users subscribe to rooms they join</text>
</svg>

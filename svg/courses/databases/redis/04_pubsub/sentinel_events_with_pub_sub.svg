<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd8_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="32" y="36" width="192" height="126" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="128" y="115.2" text-anchor="middle" font-size="21.3333">Sentinel 1</text>
  <rect x="32" y="198" width="192" height="126" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="128" y="277.2" text-anchor="middle" font-size="21.3333">Sentinel 2</text>
  <rect x="32" y="360" width="192" height="126" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="128" y="439.2" text-anchor="middle" font-size="21.3333">Sentinel 3</text>
  <rect x="394.6667" y="54" width="362.6667" height="432" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="576" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Sentinel Channels</text>
  <rect x="416" y="151.2" width="320" height="72" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="576" y="201.6" text-anchor="middle" font-size="21.3333" fill="var(--danger-accent)">+sdown (subj. down)</text>
  <rect x="416" y="241.2" width="320" height="72" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="576" y="291.6" text-anchor="middle" font-size="21.3333" fill="var(--danger-accent)">+odown (obj. down)</text>
  <rect x="416" y="331.2" width="320" height="72" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="576" y="381.6" text-anchor="middle" font-size="21.3333" fill="var(--ok-accent)">+switch-master</text>
  <rect x="416" y="421.2" width="320" height="43.2" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.1333" rx="6" />
  <text x="576" y="457.2" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">...more events</text>
  <rect x="938.6667" y="126" width="256" height="288" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1066.6667" y="208.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Application</text>
  <text x="1066.6667" y="270" text-anchor="middle" font-size="21.3333">SUBSCRIBE</text>
  <text x="1066.6667" y="324" text-anchor="middle" font-size="21.3333">+switch-master</text>
  <text x="1066.6667" y="378" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">reconnect logic</text>
  <line x1="224" y1="100.8" x2="390.4" y2="180" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_03_pubsub)" />
  <line x1="224" y1="259.2" x2="390.4" y2="270" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_03_pubsub)" />
  <line x1="224" y1="424.8" x2="390.4" y2="367.2" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_03_pubsub)" />
  <line x1="757.3333" y1="270" x2="934.4" y2="270" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd8_03_pubsub)" />
  <text x="640" y="612" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Apps subscribe to Sentinel events for automatic failover handling</text>
</svg>
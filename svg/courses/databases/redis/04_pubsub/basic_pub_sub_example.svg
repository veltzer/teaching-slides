<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 19.2 8.64 z" fill="#333" />
    </marker>
  </defs>
  <line x1="169.4117" y1="130.2222" x2="169.4117" y2="620" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259" />
  <line x1="640" y1="130.2222" x2="640" y2="620" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259" />
  <line x1="1110.5883" y1="130.2222" x2="1110.5883" y2="620" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259" />
  <rect x="40" y="40" width="258.8236" height="90.2222" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="169.4117" y="96.7111" text-anchor="middle" font-size="23.316" font-weight="bold">Subscriber</text>
  <rect x="510.5882" y="40" width="258.8236" height="90.2222" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="640" y="96.7111" text-anchor="middle" font-size="23.316" font-weight="bold">Redis Server</text>
  <rect x="981.1764" y="40" width="258.8236" height="90.2222" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1110.5883" y="96.7111" text-anchor="middle" font-size="23.316" font-weight="bold">Publisher</text>
  <line x1="169.4117" y1="194.6667" x2="635.294" y2="194.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd2_03_pubsub)" />
  <text x="404.706" y="181.7778" text-anchor="middle" font-size="21.1964" fill="var(--primary-accent)">SUBSCRIBE my-channel</text>
  <line x1="640" y1="272" x2="174.1177" y2="272" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.8766 5.9259" marker-end="url(#arrowd2_03_pubsub)" />
  <text x="404.706" y="259.1111" text-anchor="middle" font-size="21.1964" fill="var(--text-muted)">subscribe confirmation</text>
  <line x1="1110.5883" y1="362.2222" x2="644.7059" y2="362.2222" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd2_03_pubsub)" />
  <text x="875.294" y="349.3333" text-anchor="middle" font-size="21.1964" fill="var(--ok-accent)">PUBLISH my-channel "Hello"</text>
  <line x1="640" y1="439.5555" x2="174.1177" y2="439.5555" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrowd2_03_pubsub)" />
  <text x="404.706" y="426.6667" text-anchor="middle" font-size="21.1964" fill="var(--warn-accent)">message: "Hello"</text>
  <line x1="640" y1="516.8889" x2="1105.8823" y2="516.8889" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="9.8766 5.9259" marker-end="url(#arrowd2_03_pubsub)" />
  <text x="875.294" y="504" text-anchor="middle" font-size="21.1964" fill="var(--text-muted)">(integer) 1</text>
</svg>
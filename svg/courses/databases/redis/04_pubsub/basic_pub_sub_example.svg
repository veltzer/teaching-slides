<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <line x1="169.4117" y1="130.2222" x2="169.4117" y2="620" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259" />
  <line x1="640" y1="130.2222" x2="640" y2="620" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259" />
  <line x1="1110.5883" y1="130.2222" x2="1110.5883" y2="620" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259" />
  <rect x="40" y="40" width="258.8236" height="90.2222" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="169.4117" y="96.7111" text-anchor="middle" font-size="23.316" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Subscriber</text>
  <rect x="510.5882" y="40" width="258.8236" height="90.2222" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="96.7111" text-anchor="middle" font-size="23.316" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Server</text>
  <rect x="981.1764" y="40" width="258.8236" height="90.2222" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1110.5883" y="96.7111" text-anchor="middle" font-size="23.316" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Publisher</text>
  <line x1="169.4117" y1="194.6667" x2="635.294" y2="194.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="404.706" y="181.7778" text-anchor="middle" font-size="21.1964" fill="var(--primary-accent)" font-family="Arial, sans-serif">SUBSCRIBE my-channel</text>
  <line x1="640" y1="272" x2="174.1177" y2="272" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.8766 5.9259" marker-end="url(#arrow)" />
  <text x="404.706" y="259.1111" text-anchor="middle" font-size="21.1964" fill="var(--text-muted)" font-family="Arial, sans-serif">subscribe confirmation</text>
  <line x1="1110.5883" y1="362.2222" x2="644.7059" y2="362.2222" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="875.294" y="349.3333" text-anchor="middle" font-size="21.1964" fill="var(--ok-accent)" font-family="Arial, sans-serif">PUBLISH my-channel "Hello"</text>
  <line x1="640" y1="439.5555" x2="174.1177" y2="439.5555" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="404.706" y="426.6667" text-anchor="middle" font-size="21.1964" fill="var(--warn-accent)" font-family="Arial, sans-serif">message: "Hello"</text>
  <line x1="640" y1="516.8889" x2="1105.8823" y2="516.8889" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="9.8766 5.9259" marker-end="url(#arrow)" />
  <text x="875.294" y="504" text-anchor="middle" font-size="21.1964" fill="var(--text-muted)" font-family="Arial, sans-serif">(integer) 1</text>
</svg>
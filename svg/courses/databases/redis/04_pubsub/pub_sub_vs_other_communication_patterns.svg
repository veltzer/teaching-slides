<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="228.2352" y="40" text-anchor="middle" font-size="23.316" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Request/Response</text>
  <rect x="40" y="72.2222" width="164.7058" height="112.7778" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="122.3529" y="143.1111" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--primary-text)">Client</text>
  <rect x="275.2941" y="72.2222" width="164.7058" height="112.7778" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="357.6471" y="143.1111" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--info-text)">Server</text>
  <line x1="204.7058" y1="110.8889" x2="270.5881" y2="110.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="275.2941" y1="152.7778" x2="209.4117" y2="152.7778" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.5852 5.6889" marker-end="url(#arrow)"/>
  <text x="722.3528" y="40" text-anchor="middle" font-size="23.316" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Message Queue</text>
  <rect x="522.3529" y="72.2222" width="164.7058" height="112.7778" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="604.7059" y="143.1111" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--primary-text)">Producer</text>
  <rect x="722.3528" y="72.2222" width="117.647" height="112.7778" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="781.1764" y="143.1111" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--warn-text)">Queue</text>
  <rect x="875.294" y="72.2222" width="164.7058" height="112.7778" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.647" y="143.1111" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--ok-text)">Consumer</text>
  <line x1="687.0587" y1="130.2222" x2="717.647" y2="130.2222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="130.2222" x2="870.5881" y2="130.2222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="698.8235" y="281.6667" text-anchor="middle" font-size="23.316" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Pub/Sub (broadcast to all)</text>
  <rect x="63.5293" y="330" width="211.7647" height="112.7778" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="169.4116" y="400.8889" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--primary-text)">Publisher</text>
  <rect x="534.1176" y="313.8889" width="282.353" height="145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="675.2941" y="378.3333" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--warn-text)">Channel</text>
  <text x="675.2941" y="426.6667" text-anchor="middle" font-size="21.1963" fill="var(--text-muted)" font-family="Arial, sans-serif">"events"</text>
  <rect x="1028.2353" y="297.7778" width="211.7647" height="96.6667" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1134.1176" y="362.2222" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--ok-text)">Sub 1</text>
  <rect x="1028.2353" y="410.5556" width="211.7647" height="96.6667" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1134.1176" y="475" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--ok-text)">Sub 2</text>
  <rect x="1028.2353" y="523.3333" width="211.7647" height="96.6667" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1134.1176" y="587.7778" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--ok-text)">Sub 3</text>
  <line x1="275.2941" y1="388" x2="529.4117" y2="388" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="816.4705" y1="355.7778" x2="1023.5294" y2="346.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="816.4705" y1="388" x2="1023.5294" y2="458.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="816.4705" y1="420.2222" x2="1023.5294" y2="571.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
    <marker id="arrowd1b_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="228.2352" y="40" text-anchor="middle" font-size="23.316" font-weight="bold">Request/Response</text>
  <rect x="40" y="72.2222" width="164.7058" height="112.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="122.3529" y="143.1111" text-anchor="middle" font-size="21.1963">Client</text>
  <rect x="275.2941" y="72.2222" width="164.7058" height="112.7778" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="357.6471" y="143.1111" text-anchor="middle" font-size="21.1963">Server</text>
  <line x1="204.7058" y1="110.8889" x2="270.5881" y2="110.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
  <line x1="275.2941" y1="152.7778" x2="209.4117" y2="152.7778" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.5852 5.6889" marker-end="url(#arrowd1b_03_pubsub)" />
  <text x="722.3528" y="40" text-anchor="middle" font-size="23.316" font-weight="bold">Message Queue</text>
  <rect x="522.3529" y="72.2222" width="164.7058" height="112.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="604.7059" y="143.1111" text-anchor="middle" font-size="21.1963">Producer</text>
  <rect x="722.3528" y="72.2222" width="117.647" height="112.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="781.1764" y="143.1111" text-anchor="middle" font-size="21.1963">Queue</text>
  <rect x="875.294" y="72.2222" width="164.7058" height="112.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="957.647" y="143.1111" text-anchor="middle" font-size="21.1963">Consumer</text>
  <line x1="687.0587" y1="130.2222" x2="717.647" y2="130.2222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
  <line x1="840" y1="130.2222" x2="870.5881" y2="130.2222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
  <text x="698.8235" y="281.6667" text-anchor="middle" font-size="23.316" font-weight="bold">Pub/Sub (broadcast to all)</text>
  <rect x="63.5293" y="330" width="211.7647" height="112.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="169.4116" y="400.8889" text-anchor="middle" font-size="21.1963">Publisher</text>
  <rect x="534.1176" y="313.8889" width="282.353" height="145" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="675.2941" y="378.3333" text-anchor="middle" font-size="21.1963">Channel</text>
  <text x="675.2941" y="426.6667" text-anchor="middle" font-size="21.1963" fill="var(--text-muted)">"events"</text>
  <rect x="1028.2353" y="297.7778" width="211.7647" height="96.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1134.1176" y="362.2222" text-anchor="middle" font-size="21.1963">Sub 1</text>
  <rect x="1028.2353" y="410.5556" width="211.7647" height="96.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1134.1176" y="475" text-anchor="middle" font-size="21.1963">Sub 2</text>
  <rect x="1028.2353" y="523.3333" width="211.7647" height="96.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1134.1176" y="587.7778" text-anchor="middle" font-size="21.1963">Sub 3</text>
  <line x1="275.2941" y1="388" x2="529.4117" y2="388" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
  <line x1="816.4705" y1="355.7778" x2="1023.5294" y2="346.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
  <line x1="816.4705" y1="388" x2="1023.5294" y2="458.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
  <line x1="816.4705" y1="420.2222" x2="1023.5294" y2="571.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
    <marker id="arrowd1b_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="189.6296" y="64" text-anchor="middle" font-size="20.8593" font-weight="bold">Request/Response</text>
  <rect x="37.926" y="96" width="132.7407" height="112" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="104.2963" y="166.4" text-anchor="middle" font-size="18.9629">Client</text>
  <rect x="227.5556" y="96" width="132.7407" height="112" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="293.926" y="166.4" text-anchor="middle" font-size="18.9629">Server</text>
  <line x1="170.6667" y1="134.4" x2="223.7629" y2="134.4" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
  <line x1="227.5556" y1="176" x2="174.4593" y2="176" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.5852 5.6889" marker-end="url(#arrowd1b_03_pubsub)" />
  <text x="587.8518" y="64" text-anchor="middle" font-size="20.8593" font-weight="bold">Message Queue</text>
  <rect x="426.6667" y="96" width="132.7407" height="112" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="493.0371" y="166.4" text-anchor="middle" font-size="18.9629">Producer</text>
  <rect x="587.8518" y="96" width="94.8148" height="112" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="635.2593" y="166.4" text-anchor="middle" font-size="18.9629">Queue</text>
  <rect x="711.1111" y="96" width="132.7407" height="112" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="777.4815" y="166.4" text-anchor="middle" font-size="18.9629">Consumer</text>
  <line x1="559.4074" y1="153.6" x2="584.0593" y2="153.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
  <line x1="682.6667" y1="153.6" x2="707.3185" y2="153.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
  <text x="568.8889" y="304" text-anchor="middle" font-size="20.8593" font-weight="bold">Pub/Sub (broadcast to all)</text>
  <rect x="56.8889" y="352" width="170.6667" height="112" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="142.2222" y="422.4" text-anchor="middle" font-size="18.9629">Publisher</text>
  <rect x="436.1482" y="336" width="227.5556" height="144" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="549.926" y="400" text-anchor="middle" font-size="18.9629">Channel</text>
  <text x="549.926" y="448" text-anchor="middle" font-size="18.9629" fill="var(--text-muted)">"events"</text>
  <rect x="834.3704" y="320" width="170.6667" height="96" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="919.7037" y="384" text-anchor="middle" font-size="18.9629">Sub 1</text>
  <rect x="834.3704" y="432" width="170.6667" height="96" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="919.7037" y="496" text-anchor="middle" font-size="18.9629">Sub 2</text>
  <rect x="834.3704" y="544" width="170.6667" height="96" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="919.7037" y="608" text-anchor="middle" font-size="18.9629">Sub 3</text>
  <line x1="227.5556" y1="409.6" x2="432.3556" y2="409.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
  <line x1="663.7037" y1="377.6" x2="830.5778" y2="368" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
  <line x1="663.7037" y1="409.6" x2="830.5778" y2="480" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
  <line x1="663.7037" y1="441.6" x2="830.5778" y2="592" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_pubsub)" />
</svg>
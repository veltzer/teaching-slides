<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="217.7777" y1="143.1111" x2="217.7777" y2="620" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259"/>
  <line x1="662.2222" y1="143.1111" x2="662.2222" y2="620" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259"/>
  <line x1="1106.6668" y1="143.1111" x2="1106.6668" y2="620" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259"/>
  <rect x="84.4444" y="40" width="266.6666" height="90.2222" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="217.7777" y="96.7111" text-anchor="middle" font-size="22.6591" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Publisher</text>
  <rect x="528.8889" y="40" width="266.6666" height="90.2222" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="662.2222" y="96.7111" text-anchor="middle" font-size="22.6591" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis</text>
  <rect x="973.3334" y="40" width="266.6666" height="90.2222" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1106.6668" y="96.7111" text-anchor="middle" font-size="22.6591" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Subscriber</text>
  <line x1="217.7777" y1="194.6667" x2="657.7777" y2="194.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440.0001" y="181.7778" text-anchor="middle" font-size="20.5992" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. PUBLISH task:{id:"t1", data:...}</text>
  <line x1="662.2222" y1="259.1111" x2="1102.2223" y2="259.1111" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="884.4444" y="246.2222" text-anchor="middle" font-size="20.5992" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. deliver message</text>
  <rect x="1051.1111" y="284.8889" width="111.1112" height="64.4445" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1106.6668" y="328.7111" text-anchor="middle" font-size="20.5992" fill="var(--ok-accent)" font-family="Arial, sans-serif">process</text>
  <line x1="1106.6668" y1="388" x2="666.6667" y2="388" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="884.4444" y="375.1111" text-anchor="middle" font-size="20.5992" fill="var(--warn-accent)" font-family="Arial, sans-serif">3. PUBLISH ack:{id:"t1"}</text>
  <line x1="662.2222" y1="452.4445" x2="222.2222" y2="452.4445" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440.0001" y="439.5555" text-anchor="middle" font-size="20.5992" fill="var(--warn-accent)" font-family="Arial, sans-serif">4. deliver ACK</text>
  <rect x="40" y="504" width="400.0001" height="103.1111" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="240" y="547.8222" text-anchor="middle" font-size="20.5992" fill="var(--danger-accent)" font-family="Arial, sans-serif">If no ACK within timeout:</text>
  <text x="240" y="583.9111" text-anchor="middle" font-size="20.5992" fill="var(--danger-accent)" font-family="Arial, sans-serif">re-publish message</text>
</svg>

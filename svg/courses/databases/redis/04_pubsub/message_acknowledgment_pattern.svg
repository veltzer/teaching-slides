<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd7_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 19.2 8.64 z" fill="#333" />
    </marker>
  </defs>
  <line x1="197.5308" y1="146.6667" x2="197.5308" y2="640" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259" />
  <line x1="592.5926" y1="146.6667" x2="592.5926" y2="640" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259" />
  <line x1="987.6544" y1="146.6667" x2="987.6544" y2="640" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259" />
  <rect x="79.0123" y="40" width="237.037" height="93.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="197.5308" y="98.6667" text-anchor="middle" font-size="21.7284" font-weight="bold">Publisher</text>
  <rect x="474.0741" y="40" width="237.037" height="93.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="592.5926" y="98.6667" text-anchor="middle" font-size="21.7284" font-weight="bold">Redis</text>
  <rect x="869.1358" y="40" width="237.037" height="93.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="987.6544" y="98.6667" text-anchor="middle" font-size="21.7284" font-weight="bold">Subscriber</text>
  <line x1="197.5308" y1="200" x2="588.6419" y2="200" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd7_03_pubsub)" />
  <text x="395.0618" y="186.6667" text-anchor="middle" font-size="19.7531" fill="var(--primary-accent)">1. PUBLISH task:{id:"t1", data:...}</text>
  <line x1="592.5926" y1="266.6667" x2="983.7037" y2="266.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd7_03_pubsub)" />
  <text x="790.1234" y="253.3333" text-anchor="middle" font-size="19.7531" fill="var(--ok-accent)">2. deliver message</text>
  <rect x="938.2716" y="293.3333" width="98.7655" height="66.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="987.6544" y="338.6667" text-anchor="middle" font-size="19.7531" fill="var(--ok-accent)">process</text>
  <line x1="987.6544" y1="400" x2="596.5432" y2="400" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrowd7_03_pubsub)" />
  <text x="790.1234" y="386.6667" text-anchor="middle" font-size="19.7531" fill="var(--warn-accent)">3. PUBLISH ack:{id:"t1"}</text>
  <line x1="592.5926" y1="466.6667" x2="201.4815" y2="466.6667" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrowd7_03_pubsub)" />
  <text x="395.0618" y="453.3333" text-anchor="middle" font-size="19.7531" fill="var(--warn-accent)">4. deliver ACK</text>
  <rect x="39.5062" y="520" width="355.5556" height="106.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="217.284" y="565.3333" text-anchor="middle" font-size="19.7531" fill="var(--danger-accent)">If no ACK within timeout:</text>
  <text x="217.284" y="602.6667" text-anchor="middle" font-size="19.7531" fill="var(--danger-accent)">re-publish message</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd7_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 19.2 8.64 z" fill="#333" />
    </marker>
  </defs>
  <line x1="217.7777" y1="143.1111" x2="217.7777" y2="620" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259" />
  <line x1="662.2222" y1="143.1111" x2="662.2222" y2="620" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259" />
  <line x1="1106.6668" y1="143.1111" x2="1106.6668" y2="620" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.9012 5.9259" />
  <rect x="84.4444" y="40" width="266.6666" height="90.2222" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="217.7777" y="96.7111" text-anchor="middle" font-size="22.6591" font-weight="bold">Publisher</text>
  <rect x="528.8889" y="40" width="266.6666" height="90.2222" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="662.2222" y="96.7111" text-anchor="middle" font-size="22.6591" font-weight="bold">Redis</text>
  <rect x="973.3334" y="40" width="266.6666" height="90.2222" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1106.6668" y="96.7111" text-anchor="middle" font-size="22.6591" font-weight="bold">Subscriber</text>
  <line x1="217.7777" y1="194.6667" x2="657.7777" y2="194.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd7_03_pubsub)" />
  <text x="440.0001" y="181.7778" text-anchor="middle" font-size="20.5992" fill="var(--primary-accent)">1. PUBLISH task:{id:"t1", data:...}</text>
  <line x1="662.2222" y1="259.1111" x2="1102.2223" y2="259.1111" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd7_03_pubsub)" />
  <text x="884.4444" y="246.2222" text-anchor="middle" font-size="20.5992" fill="var(--ok-accent)">2. deliver message</text>
  <rect x="1051.1111" y="284.8889" width="111.1112" height="64.4445" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1106.6668" y="328.7111" text-anchor="middle" font-size="20.5992" fill="var(--ok-accent)">process</text>
  <line x1="1106.6668" y1="388" x2="666.6667" y2="388" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrowd7_03_pubsub)" />
  <text x="884.4444" y="375.1111" text-anchor="middle" font-size="20.5992" fill="var(--warn-accent)">3. PUBLISH ack:{id:"t1"}</text>
  <line x1="662.2222" y1="452.4445" x2="222.2222" y2="452.4445" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrowd7_03_pubsub)" />
  <text x="440.0001" y="439.5555" text-anchor="middle" font-size="20.5992" fill="var(--warn-accent)">4. deliver ACK</text>
  <rect x="40" y="504" width="400.0001" height="103.1111" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="240" y="547.8222" text-anchor="middle" font-size="20.5992" fill="var(--danger-accent)">If no ACK within timeout:</text>
  <text x="240" y="583.9111" text-anchor="middle" font-size="20.5992" fill="var(--danger-accent)">re-publish message</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowd10_03_pubsub" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="21.3333" y="54" width="533.3333" height="576" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="17.0667" />
  <text x="288" y="126" text-anchor="middle" font-size="25.6" font-weight="bold">Pub/Sub</text>
  <text x="288" y="198" text-anchor="middle" font-size="21.3333">Fire-and-forget broadcast</text>
  <text x="64" y="270" font-size="21.3333" fill="#333">+ Real-time, low latency</text>
  <text x="64" y="331.2" font-size="21.3333" fill="#333">+ All subscribers get all msgs</text>
  <text x="64" y="392.4" font-size="21.3333" fill="#333">+ Simple API</text>
  <text x="64" y="468" font-size="21.3333" fill="#c62828">- No persistence</text>
  <text x="64" y="529.2" font-size="21.3333" fill="#c62828">- No replay / history</text>
  <text x="64" y="590.4" font-size="21.3333" fill="#c62828">- No consumer groups</text>
  <rect x="618.6667" y="54" width="597.3333" height="576" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="17.0667" />
  <text x="917.3333" y="126" text-anchor="middle" font-size="25.6" font-weight="bold">Streams</text>
  <text x="917.3333" y="198" text-anchor="middle" font-size="21.3333">Persistent log with consumers</text>
  <text x="661.3333" y="270" font-size="21.3333" fill="#333">+ Messages persisted on disk</text>
  <text x="661.3333" y="331.2" font-size="21.3333" fill="#333">+ Consumer groups / load balance</text>
  <text x="661.3333" y="392.4" font-size="21.3333" fill="#333">+ Message ACK and replay</text>
  <text x="661.3333" y="468" font-size="21.3333" fill="#c62828">- Higher latency than Pub/Sub</text>
  <text x="661.3333" y="529.2" font-size="21.3333" fill="#c62828">- More complex API</text>
  <text x="661.3333" y="590.4" font-size="21.3333" fill="#c62828">- Needs storage management</text>
  <text x="586.6667" y="360" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">vs</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd13_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="57.0588" width="224.2991" height="102.353" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="152.1496" y="125.294" text-anchor="middle" font-size="21.2951">New Order</text>
  <rect x="40" y="193.5294" width="224.2991" height="102.353" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="152.1496" y="261.7647" text-anchor="middle" font-size="21.2951">User Signup</text>
  <rect x="40" y="330" width="224.2991" height="102.353" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="152.1496" y="398.2353" text-anchor="middle" font-size="21.2951">System Alert</text>
  <rect x="410.0934" y="40" width="358.8785" height="426.4706" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="589.5328" y="108.2353" text-anchor="middle" font-size="23.4247" font-weight="bold">Redis Channels</text>
  <rect x="432.5235" y="135.5294" width="314.0188" height="68.2353" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="589.5328" y="183.2941" text-anchor="middle" font-size="21.2951">notify:user:{uid}:order</text>
  <rect x="432.5235" y="220.8235" width="314.0188" height="68.2353" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="589.5328" y="268.5882" text-anchor="middle" font-size="21.2951">notify:admin:signup</text>
  <rect x="432.5235" y="306.1176" width="314.0188" height="68.2353" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="589.5328" y="353.8824" text-anchor="middle" font-size="21.2951">notify:ops:alert</text>
  <text x="589.5328" y="442.5882" text-anchor="middle" font-size="21.2951" fill="var(--text-muted)">PSUBSCRIBE notify:*</text>
  <rect x="948.4113" y="40" width="291.5887" height="119.4117" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1094.2056" y="87.7646" text-anchor="middle" font-size="21.2951" font-weight="bold">Push Handler</text>
  <text x="1094.2056" y="135.5294" text-anchor="middle" font-size="21.2951" fill="var(--text-muted)">WebSocket/SSE</text>
  <rect x="948.4113" y="193.5294" width="291.5887" height="119.4117" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1094.2056" y="241.2941" text-anchor="middle" font-size="21.2951" font-weight="bold">Email Handler</text>
  <text x="1094.2056" y="289.0588" text-anchor="middle" font-size="21.2951" fill="var(--text-muted)">SMTP queue</text>
  <rect x="948.4113" y="347.0588" width="291.5887" height="119.4117" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1094.2056" y="394.8235" text-anchor="middle" font-size="21.2951" font-weight="bold">SMS Handler</text>
  <text x="1094.2056" y="442.5882" text-anchor="middle" font-size="21.2951" fill="var(--text-muted)">Twilio API</text>
  <line x1="264.2992" y1="108.2353" x2="405.6076" y2="169.6471" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd13_03_pubsub)" />
  <line x1="264.2992" y1="244.7059" x2="405.6076" y2="254.9412" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd13_03_pubsub)" />
  <line x1="264.2992" y1="381.1764" x2="405.6076" y2="340.2352" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd13_03_pubsub)" />
  <line x1="768.9721" y1="169.6471" x2="943.9253" y2="98" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd13_03_pubsub)" />
  <line x1="768.9721" y1="254.9412" x2="943.9253" y2="251.5294" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd13_03_pubsub)" />
  <line x1="768.9721" y1="340.2352" x2="943.9253" y2="405.0588" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd13_03_pubsub)" />
  <text x="690.4674" y="568.8236" text-anchor="middle" font-size="21.2951" fill="var(--text-muted)">Pattern subscriptions route notifications to appropriate handlers</text>
  <text x="690.4674" y="620" text-anchor="middle" font-size="21.2951" fill="var(--text-muted)">Each handler processes only relevant notification types</text>
</svg>
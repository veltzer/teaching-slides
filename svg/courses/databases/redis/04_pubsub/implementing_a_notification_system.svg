<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="57.0588" width="224.2991" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="152.1496" y="125.294" text-anchor="middle" font-size="21.2951" font-family="Arial, sans-serif" fill="var(--primary-text)">New Order</text>
  <rect x="40" y="193.5294" width="224.2991" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="152.1496" y="261.7647" text-anchor="middle" font-size="21.2951" font-family="Arial, sans-serif" fill="var(--primary-text)">User Signup</text>
  <rect x="40" y="330" width="224.2991" height="102.353" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="152.1496" y="398.2353" text-anchor="middle" font-size="21.2951" font-family="Arial, sans-serif" fill="var(--danger-text)">System Alert</text>
  <rect x="410.0934" y="40" width="358.8785" height="426.4706" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="589.5328" y="108.2353" text-anchor="middle" font-size="23.4247" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Channels</text>
  <rect x="432.5235" y="135.5294" width="314.0188" height="68.2353" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6"/>
  <text x="589.5328" y="183.2941" text-anchor="middle" font-size="21.2951" font-family="Arial, sans-serif" fill="var(--warn-text)">notify:user:{uid}:order</text>
  <rect x="432.5235" y="220.8235" width="314.0188" height="68.2353" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6"/>
  <text x="589.5328" y="268.5882" text-anchor="middle" font-size="21.2951" font-family="Arial, sans-serif" fill="var(--warn-text)">notify:admin:signup</text>
  <rect x="432.5235" y="306.1176" width="314.0188" height="68.2353" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6"/>
  <text x="589.5328" y="353.8824" text-anchor="middle" font-size="21.2951" font-family="Arial, sans-serif" fill="var(--warn-text)">notify:ops:alert</text>
  <text x="589.5328" y="442.5882" text-anchor="middle" font-size="21.2951" fill="var(--text-muted)" font-family="Arial, sans-serif">PSUBSCRIBE notify:*</text>
  <rect x="948.4113" y="40" width="291.5887" height="119.4117" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1094.2056" y="87.7646" text-anchor="middle" font-size="21.2951" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Push Handler</text>
  <text x="1094.2056" y="135.5294" text-anchor="middle" font-size="21.2951" fill="var(--text-muted)" font-family="Arial, sans-serif">WebSocket/SSE</text>
  <rect x="948.4113" y="193.5294" width="291.5887" height="119.4117" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1094.2056" y="241.2941" text-anchor="middle" font-size="21.2951" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Email Handler</text>
  <text x="1094.2056" y="289.0588" text-anchor="middle" font-size="21.2951" fill="var(--text-muted)" font-family="Arial, sans-serif">SMTP queue</text>
  <rect x="948.4113" y="347.0588" width="291.5887" height="119.4117" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1094.2056" y="394.8235" text-anchor="middle" font-size="21.2951" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">SMS Handler</text>
  <text x="1094.2056" y="442.5882" text-anchor="middle" font-size="21.2951" fill="var(--text-muted)" font-family="Arial, sans-serif">Twilio API</text>
  <line x1="264.2992" y1="108.2353" x2="405.6076" y2="169.6471" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="264.2992" y1="244.7059" x2="405.6076" y2="254.9412" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="264.2992" y1="381.1764" x2="405.6076" y2="340.2352" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="768.9721" y1="169.6471" x2="943.9253" y2="98" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="768.9721" y1="254.9412" x2="943.9253" y2="251.5294" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="768.9721" y1="340.2352" x2="943.9253" y2="405.0588" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690.4674" y="568.8236" text-anchor="middle" font-size="21.2951" fill="var(--text-muted)" font-family="Arial, sans-serif">Pattern subscriptions route notifications to appropriate handlers</text>
  <text x="690.4674" y="620" text-anchor="middle" font-size="21.2951" fill="var(--text-muted)" font-family="Arial, sans-serif">Each handler processes only relevant notification types</text>
</svg>

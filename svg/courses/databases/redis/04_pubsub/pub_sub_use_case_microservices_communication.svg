  <text x="533.013" y="145.2973" text-anchor="middle" font-size="22.5506" font-weight="bold">Redis Pub/Sub</text>
  <rect x="420.2602" y="172.973" width="225.5055" height="69.1892" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.05" rx="6" />
  <text x="533.013" y="221.4054" text-anchor="middle" font-size="20.5005">order:created</text>
  <rect x="420.2602" y="259.4595" width="225.5055" height="69.1892" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.05" rx="6" />
  <text x="533.013" y="307.8919" text-anchor="middle" font-size="20.5005">user:updated</text>
  <rect x="420.2602" y="345.9459" width="225.5055" height="69.1892" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.05" rx="6" />
  <text x="533.013" y="394.3784" text-anchor="middle" font-size="20.5005">payment:complete</text>
  <rect x="840.5206" y="34.5946" width="225.5055" height="103.7838" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="953.2733" y="103.7838" text-anchor="middle" font-size="20.5005">Email Service</text>
  <rect x="840.5206" y="172.973" width="225.5055" height="103.7838" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="953.2733" y="242.1622" text-anchor="middle" font-size="20.5005">Inventory Svc</text>
  <rect x="840.5206" y="311.3514" width="225.5055" height="103.7838" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="953.2733" y="380.5405" text-anchor="middle" font-size="20.5005">Analytics Svc</text>
  <rect x="840.5206" y="449.7297" width="225.5055" height="103.7838" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="953.2733" y="518.9189" text-anchor="middle" font-size="20.5005">Billing Service</text>
  <line x1="225.5055" y1="110.7027" x2="395.6596" y2="207.5676" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd6_03_pubsub)" />
  <line x1="225.5055" y1="283.6757" x2="395.6596" y2="294.0541" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd6_03_pubsub)" />
  <line x1="666.2662" y1="190.2703" x2="836.4204" y2="86.4865" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd6_03_pubsub)" />
  <line x1="666.2662" y1="224.8649" x2="836.4204" y2="224.8649" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd6_03_pubsub)" />
  <line x1="666.2662" y1="294.0541" x2="836.4204" y2="363.2432" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd6_03_pubsub)" />
  <line x1="666.2662" y1="380.5405" x2="836.4204" y2="501.6216" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd6_03_pubsub)" />
  <text x="615.015" y="640" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Services communicate via events -- no direct coupling</text>
</svg>
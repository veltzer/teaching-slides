<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="56.5714" width="235.2941" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="157.647" y="129.4857" text-anchor="middle" font-size="21.497" font-family="Arial, sans-serif" fill="var(--primary-text)">Order Service</text>
  <rect x="40" y="222.2857" width="235.2941" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="157.647" y="295.2" text-anchor="middle" font-size="21.497" font-family="Arial, sans-serif" fill="var(--primary-text)">User Service</text>
  <rect x="475.2941" y="73.1429" width="305.8823" height="364.5714" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="628.2352" y="146.0571" text-anchor="middle" font-size="23.6468" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Pub/Sub</text>
  <rect x="498.8234" y="172.5715" width="258.8235" height="66.2857" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.05" rx="6"/>
  <text x="628.2352" y="218.9714" text-anchor="middle" font-size="21.497" font-family="Arial, sans-serif" fill="var(--warn-text)">order:created</text>
  <rect x="498.8234" y="255.4286" width="258.8235" height="66.2857" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.05" rx="6"/>
  <text x="628.2352" y="301.8286" text-anchor="middle" font-size="21.497" font-family="Arial, sans-serif" fill="var(--warn-text)">user:updated</text>
  <rect x="498.8234" y="338.2857" width="258.8235" height="66.2857" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.05" rx="6"/>
  <text x="628.2352" y="384.6857" text-anchor="middle" font-size="21.497" font-family="Arial, sans-serif" fill="var(--warn-text)">payment:complete</text>
  <rect x="981.1765" y="40" width="258.8235" height="99.4286" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1110.5882" y="106.2857" text-anchor="middle" font-size="21.497" font-family="Arial, sans-serif" fill="var(--ok-text)">Email Service</text>
  <rect x="981.1765" y="172.5715" width="258.8235" height="99.4286" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1110.5882" y="238.8572" text-anchor="middle" font-size="21.497" font-family="Arial, sans-serif" fill="var(--ok-text)">Inventory Svc</text>
  <rect x="981.1765" y="305.1429" width="258.8235" height="99.4286" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="1110.5882" y="371.4285" text-anchor="middle" font-size="21.497" font-family="Arial, sans-serif" fill="var(--info-text)">Analytics Svc</text>
  <rect x="981.1765" y="437.7143" width="258.8235" height="99.4286" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="1110.5882" y="504" text-anchor="middle" font-size="21.497" font-family="Arial, sans-serif" fill="var(--info-text)">Billing Service</text>
  <line x1="275.2941" y1="112.9143" x2="470.5881" y2="205.7143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="275.2941" y1="278.6286" x2="470.5881" y2="288.5715" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="781.1763" y1="189.1429" x2="976.4705" y2="89.7143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="781.1763" y1="222.2857" x2="976.4705" y2="222.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="781.1763" y1="288.5715" x2="976.4705" y2="354.8571" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="781.1763" y1="371.4285" x2="976.4705" y2="487.4285" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="722.3529" y="620" text-anchor="middle" font-size="21.497" fill="var(--text-muted)" font-family="Arial, sans-serif">Services communicate via events -- no direct coupling</text>
</svg>

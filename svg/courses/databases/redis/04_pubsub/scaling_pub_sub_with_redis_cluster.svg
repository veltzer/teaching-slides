<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="233.3334" width="189.4737" height="128.8888" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="134.7368" y="284.8889" text-anchor="middle" font-size="20.0497" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Publisher</text>
  <text x="134.7368" y="330" text-anchor="middle" font-size="20.0497" font-family="Arial, sans-serif" fill="var(--primary-text)">PUBLISH</text>
  <rect x="345.2632" y="40" width="610.5263" height="515.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="9.9805 5.9883"/>
  <text x="650.5263" y="98" text-anchor="middle" font-size="22.0547" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Redis Cluster</text>
  <rect x="376.8422" y="136.6666" width="168.421" height="145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="461.0527" y="194.6667" text-anchor="middle" font-size="20.0497" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Node A</text>
  <text x="461.0527" y="243" text-anchor="middle" font-size="20.0497" fill="var(--text-muted)" font-family="Arial, sans-serif">slots 0-5460</text>
  <rect x="566.3158" y="136.6666" width="168.421" height="145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="650.5263" y="194.6667" text-anchor="middle" font-size="20.0497" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Node B</text>
  <text x="650.5263" y="243" text-anchor="middle" font-size="20.0497" fill="var(--text-muted)" font-family="Arial, sans-serif">slots 5461-10922</text>
  <rect x="755.7895" y="136.6666" width="168.421" height="145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="840" y="194.6667" text-anchor="middle" font-size="20.0497" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Node C</text>
  <text x="840" y="243" text-anchor="middle" font-size="20.0497" fill="var(--text-muted)" font-family="Arial, sans-serif">slots 10923-16383</text>
  <line x1="461.0527" y1="281.6667" x2="461.0527" y2="346.1111" stroke="var(--warn-border)" stroke-width="1.9961" marker-end="url(#arrow)"/>
  <line x1="650.5263" y1="281.6667" x2="650.5263" y2="346.1111" stroke="var(--warn-border)" stroke-width="1.9961" marker-end="url(#arrow)"/>
  <line x1="840" y1="281.6667" x2="840" y2="346.1111" stroke="var(--warn-border)" stroke-width="1.9961" marker-end="url(#arrow)"/>
  <rect x="387.3684" y="346.1111" width="526.3157" height="70.8889" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="650.5263" y="394.4444" text-anchor="middle" font-size="20.0497" fill="var(--danger-accent)" font-family="Arial, sans-serif">PUBLISH broadcasts to ALL nodes</text>
  <rect x="376.8422" y="442.7777" width="168.421" height="80.5555" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="461.0527" y="497.5556" text-anchor="middle" font-size="20.0497" font-family="Arial, sans-serif" fill="var(--ok-text)">Sub on A</text>
  <rect x="755.7895" y="442.7777" width="168.421" height="80.5555" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="840" y="497.5556" text-anchor="middle" font-size="20.0497" font-family="Arial, sans-serif" fill="var(--ok-text)">Sub on C</text>
  <line x1="229.4737" y1="297.7778" x2="372.6316" y2="207.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1071.579" y="136.6666" width="168.421" height="112.7777" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1155.7894" y="185" text-anchor="middle" font-size="20.0497" font-family="Arial, sans-serif" fill="var(--ok-text)">Sub Client</text>
  <text x="1155.7894" y="226.8889" text-anchor="middle" font-size="20.0497" fill="var(--text-muted)" font-family="Arial, sans-serif">any node</text>
  <line x1="924.2105" y1="207.5556" x2="1067.3684" y2="191.4445" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650.5263" y="620" text-anchor="middle" font-size="20.0497" fill="var(--text-muted)" font-family="Arial, sans-serif">Messages propagated cluster-wide via internal bus</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd12_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="233.3334" width="189.4737" height="128.8888" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="134.7368" y="284.8889" text-anchor="middle" font-size="20.0497" font-weight="bold">Publisher</text>
  <text x="134.7368" y="330" text-anchor="middle" font-size="20.0497">PUBLISH</text>
  <rect x="345.2632" y="40" width="610.5263" height="515.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="9.9805 5.9883" />
  <text x="650.5263" y="98" text-anchor="middle" font-size="22.0547" font-weight="bold">Redis Cluster</text>
  <rect x="376.8422" y="136.6666" width="168.421" height="145" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="461.0527" y="194.6667" text-anchor="middle" font-size="20.0497" font-weight="bold">Node A</text>
  <text x="461.0527" y="243" text-anchor="middle" font-size="20.0497" fill="var(--text-muted)">slots 0-5460</text>
  <rect x="566.3158" y="136.6666" width="168.421" height="145" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="650.5263" y="194.6667" text-anchor="middle" font-size="20.0497" font-weight="bold">Node B</text>
  <text x="650.5263" y="243" text-anchor="middle" font-size="20.0497" fill="var(--text-muted)">slots 5461-10922</text>
  <rect x="755.7895" y="136.6666" width="168.421" height="145" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="840" y="194.6667" text-anchor="middle" font-size="20.0497" font-weight="bold">Node C</text>
  <text x="840" y="243" text-anchor="middle" font-size="20.0497" fill="var(--text-muted)">slots 10923-16383</text>
  <line x1="461.0527" y1="281.6667" x2="461.0527" y2="346.1111" stroke="var(--warn-border)" stroke-width="1.9961" marker-end="url(#arrowd12_03_pubsub)" />
  <line x1="650.5263" y1="281.6667" x2="650.5263" y2="346.1111" stroke="var(--warn-border)" stroke-width="1.9961" marker-end="url(#arrowd12_03_pubsub)" />
  <line x1="840" y1="281.6667" x2="840" y2="346.1111" stroke="var(--warn-border)" stroke-width="1.9961" marker-end="url(#arrowd12_03_pubsub)" />
  <rect x="387.3684" y="346.1111" width="526.3157" height="70.8889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="650.5263" y="394.4444" text-anchor="middle" font-size="20.0497" fill="var(--danger-accent)">PUBLISH broadcasts to ALL nodes</text>
  <rect x="376.8422" y="442.7777" width="168.421" height="80.5555" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="461.0527" y="497.5556" text-anchor="middle" font-size="20.0497">Sub on A</text>
  <rect x="755.7895" y="442.7777" width="168.421" height="80.5555" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="840" y="497.5556" text-anchor="middle" font-size="20.0497">Sub on C</text>
  <line x1="229.4737" y1="297.7778" x2="372.6316" y2="207.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd12_03_pubsub)" />
  <rect x="1071.579" y="136.6666" width="168.421" height="112.7777" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1155.7894" y="185" text-anchor="middle" font-size="20.0497">Sub Client</text>
  <text x="1155.7894" y="226.8889" text-anchor="middle" font-size="20.0497" fill="var(--text-muted)">any node</text>
  <line x1="924.2105" y1="207.5556" x2="1067.3684" y2="191.4445" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd12_03_pubsub)" />
  <text x="650.5263" y="620" text-anchor="middle" font-size="20.0497" fill="var(--text-muted)">Messages propagated cluster-wide via internal bus</text>
</svg>
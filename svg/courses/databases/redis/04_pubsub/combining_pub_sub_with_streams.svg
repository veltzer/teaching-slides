<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd11_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="19.961" y="185.2632" width="179.6491" height="168.4211" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="109.7855" y="256" text-anchor="middle" font-size="21.9571" font-weight="bold">Producer</text>
  <text x="109.7855" y="309.8947" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">app code</text>
  <rect x="309.3957" y="50.5263" width="459.1033" height="522.1053" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="538.9474" y="117.8947" text-anchor="middle" font-size="21.9571" font-weight="bold">Redis Server</text>
  <rect x="339.3373" y="151.5789" width="239.5322" height="134.7368" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="459.1033" y="208.8421" text-anchor="middle" font-size="19.961" font-weight="bold">Stream</text>
  <text x="459.1033" y="262.7368" text-anchor="middle" font-size="19.961">XADD (persist)</text>
  <rect x="339.3373" y="336.8421" width="239.5322" height="134.7368" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="459.1033" y="394.1053" text-anchor="middle" font-size="19.961" font-weight="bold">Pub/Sub</text>
  <text x="459.1033" y="448" text-anchor="middle" font-size="19.961">PUBLISH (notify)</text>
  <line x1="459.1033" y1="286.3158" x2="459.1033" y2="330.1053" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrowd11_03_pubsub)" />
  <text x="618.7914" y="320" font-size="19.961" fill="var(--warn-accent)">trigger</text>
  <rect x="898.2456" y="84.2105" width="239.5322" height="168.4211" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1018.0117" y="151.5789" text-anchor="middle" font-size="19.961" font-weight="bold">Live Consumer</text>
  <text x="1018.0117" y="202.1053" text-anchor="middle" font-size="19.961">SUBSCRIBE</text>
  <rect x="898.2456" y="336.8421" width="239.5322" height="168.4211" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1018.0117" y="397.4737" text-anchor="middle" font-size="19.961" font-weight="bold">Catch-up</text>
  <text x="1018.0117" y="454.7368" text-anchor="middle" font-size="19.961">XREAD / XRANGE</text>
  <line x1="199.6101" y1="242.5263" x2="335.345" y2="202.1053" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd11_03_pubsub)" />
  <line x1="199.6101" y1="296.4211" x2="335.345" y2="397.4737" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd11_03_pubsub)" />
  <text x="249.5127" y="202.1053" font-size="19.961" fill="var(--primary-accent)">1. XADD</text>
  <text x="219.5712" y="397.4737" font-size="19.961" fill="var(--primary-accent)">2. PUBLISH</text>
  <line x1="578.8694" y1="404.2105" x2="894.2534" y2="168.4211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd11_03_pubsub)" />
  <line x1="578.8694" y1="218.9474" x2="894.2534" y2="421.0526" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="9.9805 5.9883" marker-end="url(#arrowd11_03_pubsub)" />
  <text x="598.8304" y="640" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Stream for persistence + Pub/Sub for real-time notification</text>
</svg>
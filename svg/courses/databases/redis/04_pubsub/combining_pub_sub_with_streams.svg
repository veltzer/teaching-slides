<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="172.5715" width="192.8571" height="165.7143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="136.4285" y="242.1714" text-anchor="middle" font-size="22.5664" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Producer</text>
  <text x="136.4285" y="295.2" text-anchor="middle" font-size="20.5149" fill="var(--text-muted)" font-family="Arial, sans-serif">app code</text>
  <rect x="350.7143" y="40" width="492.8571" height="513.7143" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="597.1429" y="106.2857" text-anchor="middle" font-size="22.5664" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Server</text>
  <rect x="382.8572" y="139.4285" width="257.1429" height="132.5714" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="511.4286" y="195.7714" text-anchor="middle" font-size="20.5149" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Stream</text>
  <text x="511.4286" y="248.8" text-anchor="middle" font-size="20.5149" font-family="Arial, sans-serif" fill="var(--ok-text)">XADD (persist)</text>
  <rect x="382.8572" y="321.7143" width="257.1429" height="132.5714" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="511.4286" y="378.0572" text-anchor="middle" font-size="20.5149" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Pub/Sub</text>
  <text x="511.4286" y="431.0857" text-anchor="middle" font-size="20.5149" font-family="Arial, sans-serif" fill="var(--info-text)">PUBLISH (notify)</text>
  <line x1="511.4286" y1="272" x2="511.4286" y2="315.0858" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="682.8571" y="305.1429" font-size="20.5149" fill="var(--warn-accent)" font-family="Arial, sans-serif">trigger</text>
  <rect x="982.8571" y="73.1428" width="257.1429" height="165.7143" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1111.4286" y="139.4285" text-anchor="middle" font-size="20.5149" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Live Consumer</text>
  <text x="1111.4286" y="189.1429" text-anchor="middle" font-size="20.5149" font-family="Arial, sans-serif" fill="var(--ok-text)">SUBSCRIBE</text>
  <rect x="982.8571" y="321.7143" width="257.1429" height="165.7143" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1111.4286" y="381.3715" text-anchor="middle" font-size="20.5149" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Catch-up</text>
  <text x="1111.4286" y="437.7142" text-anchor="middle" font-size="20.5149" font-family="Arial, sans-serif" fill="var(--info-text)">XREAD / XRANGE</text>
  <line x1="232.8571" y1="228.9143" x2="378.5714" y2="189.1429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="232.8571" y1="281.9429" x2="378.5714" y2="381.3715" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="286.4286" y="189.1429" font-size="20.5149" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. XADD</text>
  <text x="254.2858" y="381.3715" font-size="20.5149" fill="var(--primary-accent)" font-family="Arial, sans-serif">2. PUBLISH</text>
  <line x1="640" y1="388" x2="978.5714" y2="156.0001" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="205.7143" x2="978.5714" y2="404.5714" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="9.9805 5.9883" marker-end="url(#arrow)"/>
  <text x="661.4286" y="620" text-anchor="middle" font-size="20.5149" fill="var(--text-muted)" font-family="Arial, sans-serif">Stream for persistence + Pub/Sub for real-time notification</text>
</svg>

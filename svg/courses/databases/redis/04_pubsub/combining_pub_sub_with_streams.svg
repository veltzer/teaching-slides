<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd11_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="172.5715" width="192.8571" height="165.7143" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="136.4285" y="242.1714" text-anchor="middle" font-size="22.5664" font-weight="bold">Producer</text>
  <text x="136.4285" y="295.2" text-anchor="middle" font-size="20.5149" fill="var(--text-muted)">app code</text>
  <rect x="350.7143" y="40" width="492.8571" height="513.7143" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="597.1429" y="106.2857" text-anchor="middle" font-size="22.5664" font-weight="bold">Redis Server</text>
  <rect x="382.8572" y="139.4285" width="257.1429" height="132.5714" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="511.4286" y="195.7714" text-anchor="middle" font-size="20.5149" font-weight="bold">Stream</text>
  <text x="511.4286" y="248.8" text-anchor="middle" font-size="20.5149">XADD (persist)</text>
  <rect x="382.8572" y="321.7143" width="257.1429" height="132.5714" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="511.4286" y="378.0572" text-anchor="middle" font-size="20.5149" font-weight="bold">Pub/Sub</text>
  <text x="511.4286" y="431.0857" text-anchor="middle" font-size="20.5149">PUBLISH (notify)</text>
  <line x1="511.4286" y1="272" x2="511.4286" y2="315.0858" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrowd11_03_pubsub)" />
  <text x="682.8571" y="305.1429" font-size="20.5149" fill="var(--warn-accent)">trigger</text>
  <rect x="982.8571" y="73.1428" width="257.1429" height="165.7143" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1111.4286" y="139.4285" text-anchor="middle" font-size="20.5149" font-weight="bold">Live Consumer</text>
  <text x="1111.4286" y="189.1429" text-anchor="middle" font-size="20.5149">SUBSCRIBE</text>
  <rect x="982.8571" y="321.7143" width="257.1429" height="165.7143" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1111.4286" y="381.3715" text-anchor="middle" font-size="20.5149" font-weight="bold">Catch-up</text>
  <text x="1111.4286" y="437.7142" text-anchor="middle" font-size="20.5149">XREAD / XRANGE</text>
  <line x1="232.8571" y1="228.9143" x2="378.5714" y2="189.1429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd11_03_pubsub)" />
  <line x1="232.8571" y1="281.9429" x2="378.5714" y2="381.3715" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd11_03_pubsub)" />
  <text x="286.4286" y="189.1429" font-size="20.5149" fill="var(--primary-accent)">1. XADD</text>
  <text x="254.2858" y="381.3715" font-size="20.5149" fill="var(--primary-accent)">2. PUBLISH</text>
  <line x1="640" y1="388" x2="978.5714" y2="156.0001" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd11_03_pubsub)" />
  <line x1="640" y1="205.7143" x2="978.5714" y2="404.5714" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="9.9805 5.9883" marker-end="url(#arrowd11_03_pubsub)" />
  <text x="661.4286" y="620" text-anchor="middle" font-size="20.5149" fill="var(--text-muted)">Stream for persistence + Pub/Sub for real-time notification</text>
</svg>
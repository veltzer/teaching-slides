  <text x="430.9333" y="262.8" text-anchor="middle" font-size="21.3333">1609459200-0</text>
  <text x="430.9333" y="306" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">{temp:22}</text>
  <rect x="529.0667" y="216" width="160" height="108" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.1333" rx="6" />
  <text x="608" y="262.8" text-anchor="middle" font-size="21.3333">1609459201-0</text>
  <text x="608" y="306" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">{temp:23}</text>
  <rect x="706.1333" y="216" width="160" height="108" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.1333" rx="6" />
  <text x="785.0667" y="262.8" text-anchor="middle" font-size="21.3333">1609459202-0</text>
  <text x="785.0667" y="306" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">{temp:21}</text>
  <text x="618.6667" y="424.8" text-anchor="middle" font-size="21.3333" fill="var(--warn-accent)">persisted on disk -- survives restart</text>
  <rect x="1013.3333" y="72" width="234.6667" height="180" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1130.6667" y="136.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Consumer Grp</text>
  <text x="1130.6667" y="187.2" text-anchor="middle" font-size="21.3333">XREADGROUP</text>
  <rect x="1013.3333" y="324" width="234.6667" height="144" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1130.6667" y="388.8" text-anchor="middle" font-size="21.3333">Consumer</text>
  <text x="1130.6667" y="439.2" text-anchor="middle" font-size="21.3333">XREAD</text>
  <line x1="213.3333" y1="288" x2="326.4" y2="288" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd9_03_pubsub)" />
  <line x1="906.6667" y1="198" x2="1009.0667" y2="162" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd9_03_pubsub)" />
  <line x1="906.6667" y1="288" x2="1009.0667" y2="378" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd9_03_pubsub)" />
  <text x="618.6667" y="594" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Unlike Pub/Sub: messages are stored, replayable, and support consumer groups</text>

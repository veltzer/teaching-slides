  <rect x="363.4783" y="200" width="156.5217" height="120" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.1333" rx="6" />
  <text x="440.6956" y="252" text-anchor="middle" font-size="22.2415">1609459200-0</text>
  <text x="440.6956" y="300" text-anchor="middle" font-size="22.2415" fill="var(--text-muted)">{temp:22}</text>
  <rect x="536.6957" y="200" width="156.5217" height="120" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.1333" rx="6" />
  <text x="613.9131" y="252" text-anchor="middle" font-size="22.2415">1609459201-0</text>
  <text x="613.9131" y="300" text-anchor="middle" font-size="22.2415" fill="var(--text-muted)">{temp:23}</text>
  <rect x="709.913" y="200" width="156.5217" height="120" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.1333" rx="6" />
  <text x="787.1305" y="252" text-anchor="middle" font-size="22.2415">1609459202-0</text>
  <text x="787.1305" y="300" text-anchor="middle" font-size="22.2415" fill="var(--text-muted)">{temp:21}</text>
  <text x="624.3479" y="432" text-anchor="middle" font-size="22.2415" fill="var(--warn-accent)">persisted on disk -- survives restart</text>
  <rect x="1010.4348" y="40" width="229.5652" height="200" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1125.2174" y="112" text-anchor="middle" font-size="22.2415" font-weight="bold">Consumer Grp</text>
  <text x="1125.2174" y="168" text-anchor="middle" font-size="22.2415">XREADGROUP</text>
  <rect x="1010.4348" y="320" width="229.5652" height="160" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />

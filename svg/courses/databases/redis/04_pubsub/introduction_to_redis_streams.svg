  <line x1="227.8261" y1="280" x2="338.4348" y2="280" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd9_03_pubsub)" />
  <line x1="906.087" y1="180" x2="1006.2609" y2="140" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd9_03_pubsub)" />
  <line x1="906.087" y1="280" x2="1006.2609" y2="380" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd9_03_pubsub)" />
  <text x="624.3479" y="620" text-anchor="middle" font-size="22.2415" fill="var(--text-muted)">Unlike Pub/Sub: messages are stored, replayable, and support consumer groups</text>

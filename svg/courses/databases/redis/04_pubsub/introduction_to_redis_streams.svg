<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="200" width="187.8261" height="160" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="133.913" y="264" text-anchor="middle" font-size="22.2415" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Producer</text>
  <text x="133.913" y="320" text-anchor="middle" font-size="22.2415" font-family="Arial, sans-serif" fill="var(--primary-text)">XADD</text>
  <rect x="342.6088" y="80" width="563.4782" height="400" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="624.3479" y="160" text-anchor="middle" font-size="24.4657" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Stream (append-only log)</text>
  <rect x="363.4783" y="200" width="156.5217" height="120" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.1333" rx="6" />
  <text x="440.6956" y="252" text-anchor="middle" font-size="22.2415" font-family="Arial, sans-serif" fill="var(--warn-text)">1609459200-0</text>
  <text x="440.6956" y="300" text-anchor="middle" font-size="22.2415" fill="var(--text-muted)" font-family="Arial, sans-serif">{temp:22}</text>
  <rect x="536.6957" y="200" width="156.5217" height="120" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.1333" rx="6" />
  <text x="613.9131" y="252" text-anchor="middle" font-size="22.2415" font-family="Arial, sans-serif" fill="var(--warn-text)">1609459201-0</text>
  <text x="613.9131" y="300" text-anchor="middle" font-size="22.2415" fill="var(--text-muted)" font-family="Arial, sans-serif">{temp:23}</text>
  <rect x="709.913" y="200" width="156.5217" height="120" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.1333" rx="6" />
  <text x="787.1305" y="252" text-anchor="middle" font-size="22.2415" font-family="Arial, sans-serif" fill="var(--warn-text)">1609459202-0</text>
  <text x="787.1305" y="300" text-anchor="middle" font-size="22.2415" fill="var(--text-muted)" font-family="Arial, sans-serif">{temp:21}</text>
  <text x="624.3479" y="432" text-anchor="middle" font-size="22.2415" fill="var(--warn-accent)" font-family="Arial, sans-serif">persisted on disk -- survives restart</text>
  <rect x="1010.4348" y="40" width="229.5652" height="200" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1125.2174" y="112" text-anchor="middle" font-size="22.2415" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Consumer Grp</text>
  <text x="1125.2174" y="168" text-anchor="middle" font-size="22.2415" font-family="Arial, sans-serif" fill="var(--ok-text)">XREADGROUP</text>
  <rect x="1010.4348" y="320" width="229.5652" height="160" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1125.2174" y="392" text-anchor="middle" font-size="22.2415" font-family="Arial, sans-serif" fill="var(--info-text)">Consumer</text>
  <text x="1125.2174" y="448" text-anchor="middle" font-size="22.2415" font-family="Arial, sans-serif" fill="var(--info-text)">XREAD</text>
  <line x1="227.8261" y1="280" x2="338.4348" y2="280" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="906.087" y1="180" x2="1006.2609" y2="140" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="906.087" y1="280" x2="1006.2609" y2="380" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="624.3479" y="620" text-anchor="middle" font-size="22.2415" fill="var(--text-muted)" font-family="Arial, sans-serif">Unlike Pub/Sub: messages are stored, replayable, and support consumer groups</text>
</svg>
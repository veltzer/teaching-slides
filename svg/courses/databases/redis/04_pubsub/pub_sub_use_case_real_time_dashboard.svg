<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd4_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="207.2727" height="123.0303" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="142.5456" y="117.3334" text-anchor="middle" font-size="21.3186">Web Server</text>
  <rect x="40" y="198.1818" width="207.2727" height="123.0303" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="142.5456" y="275.5152" text-anchor="middle" font-size="21.3186">API Service</text>
  <rect x="40" y="356.3636" width="207.2727" height="123.0303" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="142.5456" y="433.697" text-anchor="middle" font-size="21.3186">DB Monitor</text>
  <rect x="410.9092" y="57.5758" width="305.4546" height="421.8182" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="563.6364" y="134.9091" text-anchor="middle" font-size="23.4505" font-weight="bold">Redis Channels</text>
  <rect x="432.7273" y="163.0304" width="261.8182" height="77.3333" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="563.6364" y="215.7576" text-anchor="middle" font-size="21.3186">metrics:cpu</text>
  <rect x="432.7273" y="257.9394" width="261.8182" height="77.3333" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="563.6364" y="310.6667" text-anchor="middle" font-size="21.3186">metrics:requests</text>
  <rect x="432.7273" y="352.8485" width="261.8182" height="77.3333" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="563.6364" y="405.5758" text-anchor="middle" font-size="21.3186">metrics:errors</text>
  <rect x="890.9091" y="75.1516" width="349.0909" height="386.6666" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1065.4546" y="156.0001" text-anchor="middle" font-size="23.4505" font-weight="bold">Live Dashboard</text>
  <rect x="923.6365" y="191.1515" width="130.9091" height="105.4546" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="989.0909" y="257.9394" text-anchor="middle" font-size="21.3186">CPU %</text>
  <rect x="1076.3637" y="191.1515" width="130.9091" height="105.4546" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="1141.8183" y="257.9394" text-anchor="middle" font-size="21.3186">RPS</text>
  <rect x="923.6365" y="321.2122" width="283.6363" height="105.4546" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1065.4546" y="388" text-anchor="middle" font-size="21.3186">Error Alerts</text>
  <line x1="247.2728" y1="99.7576" x2="406.5455" y2="198.1818" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd4_03_pubsub)" />
  <line x1="247.2728" y1="261.4545" x2="406.5455" y2="296.6061" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd4_03_pubsub)" />
  <line x1="247.2728" y1="416.1212" x2="406.5455" y2="391.5152" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd4_03_pubsub)" />
  <line x1="716.3637" y1="268.4848" x2="886.5456" y2="268.4848" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd4_03_pubsub)" />
  <text x="323.6365" y="549.697" text-anchor="middle" font-size="21.3186" fill="var(--primary-accent)">PUBLISH</text>
  <text x="803.6364" y="226.3031" text-anchor="middle" font-size="21.3186" fill="var(--ok-accent)">SUBSCRIBE</text>
  <text x="672.7274" y="620" text-anchor="middle" font-size="21.3186" fill="var(--text-muted)">Real-time metrics streamed via Pub/Sub to dashboard</text>
</svg>
  <text x="360" y="68" text-anchor="middle" font-size="10" fill="#2e7d32">SUBSCRIBE</text>
  <text x="300" y="180" text-anchor="middle" font-size="10" fill="#666">Real-time metrics streamed via Pub/Sub to dashboard</text>

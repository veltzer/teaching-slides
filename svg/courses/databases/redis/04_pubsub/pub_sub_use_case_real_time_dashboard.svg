<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd4_03_pubsub" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="21.0699" y="53.3333" width="200.1646" height="124.4444" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="120.0988" y="131.5556" text-anchor="middle" font-size="21.0699">Web Server</text>
  <rect x="21.0699" y="213.3333" width="200.1646" height="124.4444" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="120.0988" y="291.5556" text-anchor="middle" font-size="21.0699">API Service</text>
  <rect x="21.0699" y="373.3333" width="200.1646" height="124.4444" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="120.0988" y="451.5556" text-anchor="middle" font-size="21.0699">DB Monitor</text>
  <rect x="379.2593" y="71.1111" width="294.9795" height="426.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="526.7489" y="149.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Redis Channels</text>
  <rect x="400.3292" y="177.7778" width="252.8395" height="78.2222" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="526.7489" y="231.1111" text-anchor="middle" font-size="21.0699">metrics:cpu</text>
  <rect x="400.3292" y="273.7778" width="252.8395" height="78.2222" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="526.7489" y="327.1111" text-anchor="middle" font-size="21.0699">metrics:requests</text>
  <rect x="400.3292" y="369.7778" width="252.8395" height="78.2222" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="526.7489" y="423.1111" text-anchor="middle" font-size="21.0699">metrics:errors</text>
  <rect x="842.7983" y="88.8889" width="337.1193" height="391.1111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1011.358" y="170.6667" text-anchor="middle" font-size="23.177" font-weight="bold">Live Dashboard</text>
  <rect x="874.4033" y="206.2222" width="126.4198" height="106.6667" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="937.6131" y="273.7778" text-anchor="middle" font-size="21.0699">CPU %</text>
  <rect x="1021.893" y="206.2222" width="126.4198" height="106.6667" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="1085.1029" y="273.7778" text-anchor="middle" font-size="21.0699">RPS</text>
  <rect x="874.4033" y="337.7778" width="273.9094" height="106.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1011.358" y="405.3333" text-anchor="middle" font-size="21.0699">Error Alerts</text>
  <line x1="221.2346" y1="113.7778" x2="375.0452" y2="213.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd4_03_pubsub)" />
  <line x1="221.2346" y1="277.3333" x2="375.0452" y2="312.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd4_03_pubsub)" />
  <line x1="221.2346" y1="433.7778" x2="375.0452" y2="408.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd4_03_pubsub)" />
  <line x1="674.2387" y1="284.4444" x2="838.5844" y2="284.4444" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd4_03_pubsub)" />
  <text x="294.9795" y="568.8889" text-anchor="middle" font-size="21.0699" fill="var(--primary-accent)">PUBLISH</text>
  <text x="758.5185" y="241.7778" text-anchor="middle" font-size="21.0699" fill="var(--ok-accent)">SUBSCRIBE</text>
  <text x="632.0988" y="640" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">Real-time metrics streamed via Pub/Sub to dashboard</text>
</svg>
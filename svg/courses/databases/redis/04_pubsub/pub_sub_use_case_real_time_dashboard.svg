<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="207.2727" height="123.0303" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="142.5456" y="117.3334" text-anchor="middle" font-size="21.3186" font-family="Arial, sans-serif" fill="var(--primary-text)">Web Server</text>
  <rect x="40" y="198.1818" width="207.2727" height="123.0303" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="142.5456" y="275.5152" text-anchor="middle" font-size="21.3186" font-family="Arial, sans-serif" fill="var(--primary-text)">API Service</text>
  <rect x="40" y="356.3636" width="207.2727" height="123.0303" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="142.5456" y="433.697" text-anchor="middle" font-size="21.3186" font-family="Arial, sans-serif" fill="var(--primary-text)">DB Monitor</text>
  <rect x="410.9092" y="57.5758" width="305.4546" height="421.8182" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="563.6364" y="134.9091" text-anchor="middle" font-size="23.4505" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis Channels</text>
  <rect x="432.7273" y="163.0304" width="261.8182" height="77.3333" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6"/>
  <text x="563.6364" y="215.7576" text-anchor="middle" font-size="21.3186" font-family="Arial, sans-serif" fill="var(--warn-text)">metrics:cpu</text>
  <rect x="432.7273" y="257.9394" width="261.8182" height="77.3333" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6"/>
  <text x="563.6364" y="310.6667" text-anchor="middle" font-size="21.3186" font-family="Arial, sans-serif" fill="var(--warn-text)">metrics:requests</text>
  <rect x="432.7273" y="352.8485" width="261.8182" height="77.3333" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6"/>
  <text x="563.6364" y="405.5758" text-anchor="middle" font-size="21.3186" font-family="Arial, sans-serif" fill="var(--warn-text)">metrics:errors</text>
  <rect x="890.9091" y="75.1516" width="349.0909" height="386.6666" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1065.4546" y="156.0001" text-anchor="middle" font-size="23.4505" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Live Dashboard</text>
  <rect x="923.6365" y="191.1515" width="130.9091" height="105.4546" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6"/>
  <text x="989.0909" y="257.9394" text-anchor="middle" font-size="21.3186" font-family="Arial, sans-serif" fill="var(--ok-text)">CPU %</text>
  <rect x="1076.3637" y="191.1515" width="130.9091" height="105.4546" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6"/>
  <text x="1141.8183" y="257.9394" text-anchor="middle" font-size="21.3186" font-family="Arial, sans-serif" fill="var(--ok-text)">RPS</text>
  <rect x="923.6365" y="321.2122" width="283.6363" height="105.4546" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1065.4546" y="388" text-anchor="middle" font-size="21.3186" font-family="Arial, sans-serif" fill="var(--danger-text)">Error Alerts</text>
  <line x1="247.2728" y1="99.7576" x2="406.5455" y2="198.1818" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="247.2728" y1="261.4545" x2="406.5455" y2="296.6061" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="247.2728" y1="416.1212" x2="406.5455" y2="391.5152" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="716.3637" y1="268.4848" x2="886.5456" y2="268.4848" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="323.6365" y="549.697" text-anchor="middle" font-size="21.3186" fill="var(--primary-accent)" font-family="Arial, sans-serif">PUBLISH</text>
  <text x="803.6364" y="226.3031" text-anchor="middle" font-size="21.3186" fill="var(--ok-accent)" font-family="Arial, sans-serif">SUBSCRIBE</text>
  <text x="672.7274" y="620" text-anchor="middle" font-size="21.3186" fill="var(--text-muted)" font-family="Arial, sans-serif">Real-time metrics streamed via Pub/Sub to dashboard</text>
</svg>

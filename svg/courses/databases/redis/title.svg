<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Redis diamond/logo shape -->
  <polygon points="400,60 500,160 400,260 300,160" fill="#d63031" opacity="0.8"/>
  <polygon points="400,80 480,160 400,240 320,160" fill="#e17055" opacity="0.5"/>
  <!-- Key-value pairs -->
  <rect x="100" y="80" width="100" height="35" rx="5" fill="#00b894" opacity="0.6"/>
  <text x="150" y="103" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff" opacity="0.8">key</text>
  <rect x="100" y="125" width="140" height="35" rx="5" fill="#0984e3" opacity="0.6"/>
  <text x="170" y="148" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff" opacity="0.8">value</text>
  <!-- Data structure: list -->
  <rect x="580" y="80" width="40" height="30" rx="3" fill="#6c5ce7" opacity="0.6"/>
  <rect x="625" y="80" width="40" height="30" rx="3" fill="#6c5ce7" opacity="0.6"/>
  <rect x="670" y="80" width="40" height="30" rx="3" fill="#6c5ce7" opacity="0.6"/>
  <!-- Data structure: hash -->
  <rect x="590" y="140" width="110" height="30" rx="3" fill="#fdcb6e" opacity="0.5"/>
  <line x1="645" y1="140" x2="645" y2="170" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Speed lightning bolts -->
  <polygon points="140,250 130,280 145,280 135,310" fill="#ffeaa7" opacity="0.6"/>
  <polygon points="660,250 650,280 665,280 655,310" fill="#ffeaa7" opacity="0.6"/>
  <!-- Memory chip icon -->
  <rect x="350" y="290" width="100" height="50" rx="5" fill="#2d3436" stroke="#74b9ff" stroke-width="2" opacity="0.7"/>
  <line x1="360" y1="290" x2="360" y2="275" stroke="#74b9ff" stroke-width="2" opacity="0.5"/>
  <line x1="380" y1="290" x2="380" y2="275" stroke="#74b9ff" stroke-width="2" opacity="0.5"/>
  <line x1="400" y1="290" x2="400" y2="275" stroke="#74b9ff" stroke-width="2" opacity="0.5"/>
  <line x1="420" y1="290" x2="420" y2="275" stroke="#74b9ff" stroke-width="2" opacity="0.5"/>
  <line x1="440" y1="290" x2="440" y2="275" stroke="#74b9ff" stroke-width="2" opacity="0.5"/>
  <line x1="360" y1="340" x2="360" y2="355" stroke="#74b9ff" stroke-width="2" opacity="0.5"/>
  <line x1="380" y1="340" x2="380" y2="355" stroke="#74b9ff" stroke-width="2" opacity="0.5"/>
  <line x1="400" y1="340" x2="400" y2="355" stroke="#74b9ff" stroke-width="2" opacity="0.5"/>
  <line x1="420" y1="340" x2="420" y2="355" stroke="#74b9ff" stroke-width="2" opacity="0.5"/>
  <line x1="440" y1="340" x2="440" y2="355" stroke="#74b9ff" stroke-width="2" opacity="0.5"/>
  <!-- Title -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#adb5bd" letter-spacing="3">REDIS IN-MEMORY DATA STORE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <polygon points="640,127 790,272 640,417 490,272" fill="var(--danger-fill)" opacity="0.8"/>
  <polygon points="640,156 760,272 640,388 520,272" fill="var(--danger-fill)" opacity="0.5"/>
  <rect x="190" y="156" width="150" height="50.75" rx="6" fill="url(#grad-ok)" opacity="0.6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="265" y="189.35" text-anchor="middle" font-size="19.4662" fill="var(--bg)" opacity="0.8" font-family="Courier New, monospace">key</text>
  <rect x="190" y="221.25" width="210" height="50.75" rx="6" fill="url(#grad-primary)" opacity="0.6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="295" y="254.6" text-anchor="middle" font-size="19.4662" fill="var(--bg)" opacity="0.8" font-family="Courier New, monospace">value</text>
  <rect x="910" y="156" width="60" height="43.5" rx="6" fill="url(#grad-info)" opacity="0.6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="977.5" y="156" width="60" height="43.5" rx="6" fill="url(#grad-info)" opacity="0.6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1045" y="156" width="60" height="43.5" rx="6" fill="url(#grad-info)" opacity="0.6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="925" y="243" width="164.9999" height="43.5" rx="6" fill="url(#grad-warn)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="1007.4999" y1="243" x2="1007.4999" y2="286.5" stroke="var(--code-bg)" stroke-width="2"/>
  <polygon points="250,402.5 235,446 257.5,446 242.5,489.5" fill="var(--warn-fill)" opacity="0.6"/>
  <polygon points="1030,402.5 1014.9999,446 1037.5,446 1022.5,489.5" fill="var(--warn-fill)" opacity="0.6"/>
  <rect x="565" y="460.5" width="150" height="72.5" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="2.8444" opacity="0.7"/>
  <line x1="580" y1="460.5" x2="580" y2="438.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="609.9999" y1="460.5" x2="609.9999" y2="438.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="640" y1="460.5" x2="640" y2="438.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="670" y1="460.5" x2="670" y2="438.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="700" y1="460.5" x2="700" y2="438.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="580" y1="533" x2="580" y2="554.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="609.9999" y1="533" x2="609.9999" y2="554.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="640" y1="533" x2="640" y2="554.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="670" y1="533" x2="670" y2="554.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="700" y1="533" x2="700" y2="554.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <text x="640" y="605.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.028" fill="var(--border)" letter-spacing="3">REDIS IN-MEMORY DATA STORE</text>
</svg>

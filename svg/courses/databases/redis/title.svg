  <line x1="568.8889" y1="544" x2="568.8889" y2="568" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="597.3333" y1="544" x2="597.3333" y2="568" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="625.7778" y1="544" x2="625.7778" y2="568" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <text x="568.8889" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" fill="var(--border)" letter-spacing="3">REDIS IN-MEMORY DATA STORE</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="271.6981" height="214.8149" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="175.8491" y="125.9259" text-anchor="middle" font-size="26.4102" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Master A</text>
  <text x="175.8491" y="190.3704" text-anchor="middle" font-size="24.0092" font-family="Arial, sans-serif" fill="var(--danger-text)">Slots 0-5460</text>
  <rect x="492.8302" y="40" width="271.6981" height="214.8149" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="628.6793" y="125.9259" text-anchor="middle" font-size="26.4102" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Master B</text>
  <text x="628.6793" y="190.3704" text-anchor="middle" font-size="24.0092" font-family="Arial, sans-serif" fill="var(--info-text)">Slots 5461-10922</text>
  <rect x="945.6605" y="40" width="294.3395" height="214.8149" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1092.8303" y="125.9259" text-anchor="middle" font-size="26.4102" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Master C</text>
  <text x="1092.8303" y="190.3704" text-anchor="middle" font-size="24.0092" font-family="Arial, sans-serif" fill="var(--ok-text)">Slots 10923-16383</text>
  <rect x="96.6038" y="383.7036" width="158.4905" height="128.8889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="175.8491" y="469.6296" text-anchor="middle" font-size="24.0092" font-family="Arial, sans-serif" fill="var(--primary-text)">Replica A</text>
  <rect x="549.434" y="383.7036" width="158.4905" height="128.8889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="628.6793" y="469.6296" text-anchor="middle" font-size="24.0092" font-family="Arial, sans-serif" fill="var(--primary-text)">Replica B</text>
  <rect x="1013.585" y="383.7036" width="158.4905" height="128.8889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1092.8303" y="469.6296" text-anchor="middle" font-size="24.0092" font-family="Arial, sans-serif" fill="var(--primary-text)">Replica C</text>
  <line x1="175.8491" y1="254.8148" x2="175.8491" y2="383.7036" stroke="var(--text)" stroke-width="1.9961" stroke-dasharray="7.9844 5.9883" />
  <line x1="628.6793" y1="254.8148" x2="628.6793" y2="383.7036" stroke="var(--text)" stroke-width="1.9961" stroke-dasharray="7.9844 5.9883" />
  <line x1="1092.8303" y1="254.8148" x2="1092.8303" y2="383.7036" stroke="var(--text)" stroke-width="1.9961" stroke-dasharray="7.9844 5.9883" />
  <line x1="311.6981" y1="147.4074" x2="492.8302" y2="147.4074" stroke="var(--text)" stroke-width="1.9961" stroke-dasharray="5.9883 5.9883" />
  <line x1="764.5284" y1="147.4074" x2="945.6605" y2="147.4074" stroke="var(--text)" stroke-width="1.9961" stroke-dasharray="5.9883 5.9883" />
  <text x="651.3208" y="620" text-anchor="middle" font-size="24.0092" fill="var(--text-muted)" font-family="Arial, sans-serif">16,384 hash slots distributed across cluster nodes</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="364.2857" height="251.3333" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1428" y="128.9333" text-anchor="middle" font-size="22.1586" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">redis-cli</text>
  <text x="222.1428" y="194.6667" text-anchor="middle" font-size="22.1586" font-family="Arial, sans-serif" fill="var(--primary-text)">Built-in CLI tool</text>
  <text x="222.1428" y="248.8" text-anchor="middle" font-size="22.1586" font-family="Arial, sans-serif" fill="var(--primary-text)">--stat, --bigkeys</text>
  <rect x="457.8571" y="40" width="364.2857" height="251.3333" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="128.9333" text-anchor="middle" font-size="22.1586" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Redis Insight</text>
  <text x="639.9999" y="194.6667" text-anchor="middle" font-size="22.1586" font-family="Arial, sans-serif" fill="var(--info-text)">GUI management</text>
  <text x="639.9999" y="248.8" text-anchor="middle" font-size="22.1586" font-family="Arial, sans-serif" fill="var(--info-text)">Visual browser</text>
  <rect x="875.7143" y="40" width="364.2857" height="251.3333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1057.8571" y="128.9333" text-anchor="middle" font-size="22.1586" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Monitoring</text>
  <text x="1057.8571" y="194.6667" text-anchor="middle" font-size="22.1586" font-family="Arial, sans-serif" fill="var(--ok-text)">Grafana + Prometheus</text>
  <text x="1057.8571" y="248.8" text-anchor="middle" font-size="22.1586" font-family="Arial, sans-serif" fill="var(--ok-text)">redis_exporter</text>
  <rect x="254.2857" y="368.6667" width="364.2857" height="251.3333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="436.4285" y="457.6" text-anchor="middle" font-size="22.1586" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">redis-benchmark</text>
  <text x="436.4285" y="523.3333" text-anchor="middle" font-size="22.1586" font-family="Arial, sans-serif" fill="var(--warn-text)">Performance testing</text>
  <text x="436.4285" y="577.4667" text-anchor="middle" font-size="22.1586" font-family="Arial, sans-serif" fill="var(--warn-text)">Throughput/latency</text>
  <rect x="672.1428" y="368.6667" width="364.2857" height="251.3333" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="854.2856" y="457.6" text-anchor="middle" font-size="22.1586" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">redis-check-*</text>
  <text x="854.2856" y="523.3333" text-anchor="middle" font-size="22.1586" font-family="Arial, sans-serif" fill="var(--danger-text)">redis-check-rdb</text>
  <text x="854.2856" y="577.4667" text-anchor="middle" font-size="22.1586" font-family="Arial, sans-serif" fill="var(--danger-text)">redis-check-aof</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="42.6667" y="72" width="256" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="170.6667" y="151.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Network</text>
  <text x="170.6667" y="208.8" text-anchor="middle" font-size="21.3333">bind, port</text>
  <text x="170.6667" y="259.2" text-anchor="middle" font-size="21.3333">timeout, TLS</text>
  <rect x="341.3333" y="72" width="256" height="252" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="469.3333" y="151.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Memory</text>
  <text x="469.3333" y="208.8" text-anchor="middle" font-size="21.3333">maxmemory</text>
  <text x="469.3333" y="259.2" text-anchor="middle" font-size="21.3333">eviction policy</text>
  <rect x="640" y="72" width="256" height="252" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="768" y="151.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Persistence</text>
  <text x="768" y="208.8" text-anchor="middle" font-size="21.3333">save, appendonly</text>
  <text x="768" y="259.2" text-anchor="middle" font-size="21.3333">fsync policy</text>
  <rect x="938.6667" y="72" width="298.6667" height="252" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1088" y="151.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Security</text>
  <text x="1088" y="208.8" text-anchor="middle" font-size="21.3333">requirepass, ACL</text>
  <text x="1088" y="259.2" text-anchor="middle" font-size="21.3333">TLS, rename-cmd</text>
  <rect x="170.6667" y="396" width="426.6667" height="216" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="384" y="475.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Replication</text>
  <text x="384" y="540" text-anchor="middle" font-size="21.3333">replicaof, replica-read-only</text>
  <rect x="682.6667" y="396" width="426.6667" height="216" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="896" y="475.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Logging/Debug</text>
  <text x="896" y="540" text-anchor="middle" font-size="21.3333">loglevel, slowlog, latency</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="63.2099" y="71.1111" width="526.7489" height="248.8889" fill="#ffebee" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="326.5844" y="149.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Critical Parameters</ns0:text>
  <ns0:text x="326.5844" y="213.3333" text-anchor="middle" font-size="21.0699">maxmemory, bind, requirepass</ns0:text>
  <ns0:text x="326.5844" y="266.6667" text-anchor="middle" font-size="21.0699">maxmemory-policy, protected-mode</ns0:text>
  <ns0:rect x="674.2387" y="71.1111" width="526.7489" height="248.8889" fill="#fff3e0" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="937.6131" y="149.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Runtime Changeable</ns0:text>
  <ns0:text x="937.6131" y="213.3333" text-anchor="middle" font-size="21.0699">CONFIG SET maxmemory 2gb</ns0:text>
  <ns0:text x="937.6131" y="266.6667" text-anchor="middle" font-size="21.0699">CONFIG SET loglevel debug</ns0:text>
  <ns0:rect x="63.2099" y="391.1111" width="526.7489" height="248.8889" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="326.5844" y="469.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Restart Required</ns0:text>
  <ns0:text x="326.5844" y="533.3333" text-anchor="middle" font-size="21.0699">bind, port, daemonize</ns0:text>
  <ns0:text x="326.5844" y="586.6667" text-anchor="middle" font-size="21.0699">cluster-enabled</ns0:text>
  <ns0:rect x="674.2387" y="391.1111" width="526.7489" height="248.8889" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="937.6131" y="469.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Save to Disk</ns0:text>
  <ns0:text x="937.6131" y="533.3333" text-anchor="middle" font-size="21.0699">CONFIG REWRITE</ns0:text>
  <ns0:text x="937.6131" y="586.6667" text-anchor="middle" font-size="21.0699">persists runtime changes</ns0:text>
</ns0:svg>
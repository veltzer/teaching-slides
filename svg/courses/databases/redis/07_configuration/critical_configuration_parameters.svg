<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="64" y="72" width="533.3333" height="252" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="330.6667" y="151.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Critical Parameters</text>
  <text x="330.6667" y="216" text-anchor="middle" font-size="21.3333">maxmemory, bind, requirepass</text>
  <text x="330.6667" y="270" text-anchor="middle" font-size="21.3333">maxmemory-policy, protected-mode</text>
  <rect x="682.6667" y="72" width="533.3333" height="252" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="949.3333" y="151.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Runtime Changeable</text>
  <text x="949.3333" y="216" text-anchor="middle" font-size="21.3333">CONFIG SET maxmemory 2gb</text>
  <text x="949.3333" y="270" text-anchor="middle" font-size="21.3333">CONFIG SET loglevel debug</text>
  <rect x="64" y="396" width="533.3333" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="330.6667" y="475.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Restart Required</text>
  <text x="330.6667" y="540" text-anchor="middle" font-size="21.3333">bind, port, daemonize</text>
  <text x="330.6667" y="594" text-anchor="middle" font-size="21.3333">cluster-enabled</text>
  <rect x="682.6667" y="396" width="533.3333" height="252" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="949.3333" y="475.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Save to Disk</text>
  <text x="949.3333" y="540" text-anchor="middle" font-size="21.3333">CONFIG REWRITE</text>
  <text x="949.3333" y="594" text-anchor="middle" font-size="21.3333">persists runtime changes</text>
</svg>
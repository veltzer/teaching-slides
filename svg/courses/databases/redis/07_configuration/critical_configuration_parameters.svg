<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="555.5555" height="253.75" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="317.7778" y="119.75" text-anchor="middle" font-size="24.0336" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Critical Parameters</text>
  <text x="317.7778" y="185" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--danger-text)">maxmemory, bind, requirepass</text>
  <text x="317.7778" y="239.375" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--danger-text)">maxmemory-policy, protected-mode</text>
  <rect x="684.4445" y="40" width="555.5555" height="253.75" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="962.2222" y="119.75" text-anchor="middle" font-size="24.0336" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Runtime Changeable</text>
  <text x="962.2222" y="185" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--warn-text)">CONFIG SET maxmemory 2gb</text>
  <text x="962.2222" y="239.375" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--warn-text)">CONFIG SET loglevel debug</text>
  <rect x="40" y="366.25" width="555.5555" height="253.75" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="317.7778" y="446" text-anchor="middle" font-size="24.0336" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Restart Required</text>
  <text x="317.7778" y="511.25" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--primary-text)">bind, port, daemonize</text>
  <text x="317.7778" y="565.625" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--primary-text)">cluster-enabled</text>
  <rect x="684.4445" y="366.25" width="555.5555" height="253.75" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="962.2222" y="446" text-anchor="middle" font-size="24.0336" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Save to Disk</text>
  <text x="962.2222" y="511.25" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--ok-text)">CONFIG REWRITE</text>
  <text x="962.2222" y="565.625" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--ok-text)">persists runtime changes</text>
</svg>

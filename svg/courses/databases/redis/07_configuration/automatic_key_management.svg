<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect x="63.2099" y="53.3333" width="526.7489" height="284.4444" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="326.5844" y="124.4444" text-anchor="middle" font-size="21.0699" font-weight="bold">Explicit Expiration (TTL)</ns0:text>
  <ns0:text x="326.5844" y="184.8889" text-anchor="middle" font-size="21.0699">EXPIRE key 3600</ns0:text>
  <ns0:text x="326.5844" y="234.6667" text-anchor="middle" font-size="21.0699">SETEX key 60 value</ns0:text>
  <ns0:text x="326.5844" y="284.4444" text-anchor="middle" font-size="21.0699">Key auto-deleted after TTL</ns0:text>
  <ns0:rect x="674.2387" y="53.3333" width="526.7489" height="284.4444" fill="#f3e5f5" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="937.6131" y="124.4444" text-anchor="middle" font-size="21.0699" font-weight="bold">Implicit Eviction</ns0:text>
  <ns0:text x="937.6131" y="184.8889" text-anchor="middle" font-size="21.0699">When maxmemory reached</ns0:text>
  <ns0:text x="937.6131" y="234.6667" text-anchor="middle" font-size="21.0699">Policy: LRU, LFU, TTL, random</ns0:text>
  <ns0:text x="937.6131" y="284.4444" text-anchor="middle" font-size="21.0699">Automatic, based on config</ns0:text>
  <ns0:line x1="326.5844" y1="355.5556" x2="326.5844" y2="462.2222" stroke="#333" stroke-width="2.107" stroke-dasharray="6.321 6.321" />
  <ns0:line x1="937.6131" y1="355.5556" x2="937.6131" y2="462.2222" stroke="#333" stroke-width="2.107" stroke-dasharray="6.321 6.321" />
  <ns0:rect x="63.2099" y="462.2222" width="1137.7778" height="177.7778" fill="#fff3e0" stroke="#333" stroke-width="2.107" rx="10.535" />
  <ns0:text x="632.0988" y="533.3333" text-anchor="middle" font-size="21.0699" font-weight="bold">Lazy expiration + Active expiration (sampling)</ns0:text>
  <ns0:text x="632.0988" y="597.3333" text-anchor="middle" font-size="21.0699">Redis checks keys on access (lazy) and periodically samples expired keys (active)</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="64" y="54" width="533.3333" height="288" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="330.6667" y="126" text-anchor="middle" font-size="21.3333" font-weight="bold">Explicit Expiration (TTL)</text>
  <text x="330.6667" y="187.2" text-anchor="middle" font-size="21.3333">EXPIRE key 3600</text>
  <text x="330.6667" y="237.6" text-anchor="middle" font-size="21.3333">SETEX key 60 value</text>
  <text x="330.6667" y="288" text-anchor="middle" font-size="21.3333">Key auto-deleted after TTL</text>
  <rect x="682.6667" y="54" width="533.3333" height="288" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="949.3333" y="126" text-anchor="middle" font-size="21.3333" font-weight="bold">Implicit Eviction</text>
  <text x="949.3333" y="187.2" text-anchor="middle" font-size="21.3333">When maxmemory reached</text>
  <text x="949.3333" y="237.6" text-anchor="middle" font-size="21.3333">Policy: LRU, LFU, TTL, random</text>
  <text x="949.3333" y="288" text-anchor="middle" font-size="21.3333">Automatic, based on config</text>
  <line x1="330.6667" y1="360" x2="330.6667" y2="468" stroke="#333" stroke-width="2.1333" stroke-dasharray="6.4 6.4" />
  <line x1="949.3333" y1="360" x2="949.3333" y2="468" stroke="#333" stroke-width="2.1333" stroke-dasharray="6.4 6.4" />
  <rect x="64" y="468" width="1152" height="180" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="540" text-anchor="middle" font-size="21.3333" font-weight="bold">Lazy expiration + Active expiration (sampling)</text>
  <text x="640" y="604.8" text-anchor="middle" font-size="21.3333">Redis checks keys on access (lazy) and periodically samples expired keys (active)</text>
</svg>
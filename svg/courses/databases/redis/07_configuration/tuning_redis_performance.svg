<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="25.284" font-weight="bold">Performance Tuning Areas</ns0:text>
  <ns0:rect x="42.14" y="124.4444" width="358.1893" height="248.8889" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="221.2346" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">Memory</ns0:text>
  <ns0:text x="221.2346" y="256" text-anchor="middle" font-size="21.0699">maxmemory limits</ns0:text>
  <ns0:text x="221.2346" y="305.7778" text-anchor="middle" font-size="21.0699">activedefrag, lazyfree</ns0:text>
  <ns0:rect x="453.0041" y="124.4444" width="358.1893" height="248.8889" fill="#f3e5f5" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="632.0988" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">CPU</ns0:text>
  <ns0:text x="632.0988" y="256" text-anchor="middle" font-size="21.0699">io-threads (Redis 6+)</ns0:text>
  <ns0:text x="632.0988" y="305.7778" text-anchor="middle" font-size="21.0699">avoid KEYS, large O(N)</ns0:text>
  <ns0:rect x="863.8683" y="124.4444" width="358.1893" height="248.8889" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1042.963" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">Network</ns0:text>
  <ns0:text x="1042.963" y="256" text-anchor="middle" font-size="21.0699">tcp-backlog, keepalive</ns0:text>
  <ns0:text x="1042.963" y="305.7778" text-anchor="middle" font-size="21.0699">pipelining, connection pool</ns0:text>
  <ns0:rect x="252.8395" y="426.6667" width="358.1893" height="213.3333" fill="#fff3e0" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="431.9341" y="504.8889" text-anchor="middle" font-size="21.0699" font-weight="bold">Persistence</ns0:text>
  <ns0:text x="431.9341" y="568.8889" text-anchor="middle" font-size="21.0699">save intervals, fsync</ns0:text>
  <ns0:rect x="663.7037" y="426.6667" width="358.1893" height="213.3333" fill="#ffebee" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="842.7983" y="504.8889" text-anchor="middle" font-size="21.0699" font-weight="bold">OS Tuning</ns0:text>
  <ns0:text x="842.7983" y="568.8889" text-anchor="middle" font-size="21.0699">overcommit, THP, swappiness</ns0:text>

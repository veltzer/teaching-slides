<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="25.6" font-weight="bold">Performance Tuning Areas</text>
  <rect x="42.6667" y="126" width="362.6667" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Memory</text>
  <text x="224" y="259.2" text-anchor="middle" font-size="21.3333">maxmemory limits</text>
  <text x="224" y="309.6" text-anchor="middle" font-size="21.3333">activedefrag, lazyfree</text>
  <rect x="458.6667" y="126" width="362.6667" height="252" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">CPU</text>
  <text x="640" y="259.2" text-anchor="middle" font-size="21.3333">io-threads (Redis 6+)</text>
  <text x="640" y="309.6" text-anchor="middle" font-size="21.3333">avoid KEYS, large O(N)</text>
  <rect x="874.6667" y="126" width="362.6667" height="252" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Network</text>
  <text x="1056" y="259.2" text-anchor="middle" font-size="21.3333">tcp-backlog, keepalive</text>
  <text x="1056" y="309.6" text-anchor="middle" font-size="21.3333">pipelining, connection pool</text>
  <rect x="256" y="432" width="362.6667" height="216" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="437.3333" y="511.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Persistence</text>
  <text x="437.3333" y="576" text-anchor="middle" font-size="21.3333">save intervals, fsync</text>
  <rect x="672" y="432" width="362.6667" height="216" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="853.3333" y="511.2" text-anchor="middle" font-size="21.3333" font-weight="bold">OS Tuning</text>
  <text x="853.3333" y="576" text-anchor="middle" font-size="21.3333">overcommit, THP, swappiness</text>
</svg>
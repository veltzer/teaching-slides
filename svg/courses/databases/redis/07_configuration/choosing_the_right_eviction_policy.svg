<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="25.6" font-weight="bold">Eviction Policy Decision Tree</text>
  <rect x="426.6667" y="108" width="426.6667" height="108" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="180" text-anchor="middle" font-size="21.3333">Is all data cacheable?</text>
  <line x1="533.3333" y1="216" x2="256" y2="288" stroke="#333" stroke-width="2.1333" />
  <line x1="746.6667" y1="216" x2="1024" y2="288" stroke="#333" stroke-width="2.1333" />
  <text x="362.6667" y="270" font-size="21.3333">Yes</text>
  <text x="917.3333" y="270" font-size="21.3333">No (some persistent)</text>
  <rect x="64" y="295.2" width="384" height="108" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="256" y="367.2" text-anchor="middle" font-size="21.3333">allkeys-lru / allkeys-lfu</text>
  <rect x="832" y="295.2" width="384" height="108" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="1024" y="367.2" text-anchor="middle" font-size="21.3333">volatile-lru / volatile-ttl</text>
  <rect x="64" y="450" width="384" height="108" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="256" y="522" text-anchor="middle" font-size="21.3333">Best for pure caching</text>
  <rect x="832" y="450" width="384" height="108" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="1024" y="522" text-anchor="middle" font-size="21.3333">Only evicts keys with TTL</text>
  <rect x="320" y="594" width="640" height="108" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="666" text-anchor="middle" font-size="21.3333">noeviction: returns errors (safest for data integrity)</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="583.4758" y="65.641" text-anchor="middle" font-size="23.339" font-weight="bold">Eviction Policy Decision Tree</ns0:text>
  <ns0:rect x="388.9839" y="98.4615" width="388.9839" height="98.4615" fill="#fff3e0" stroke="#333" stroke-width="1.9449" rx="5.8348" />
  <ns0:text x="583.4758" y="164.1026" text-anchor="middle" font-size="19.4492">Is all data cacheable?</ns0:text>
  <ns0:line x1="486.2298" y1="196.9231" x2="233.3903" y2="262.5641" stroke="#333" stroke-width="1.9449" />
  <ns0:line x1="680.7218" y1="196.9231" x2="933.5613" y2="262.5641" stroke="#333" stroke-width="1.9449" />
  <ns0:text x="330.6363" y="246.1538" font-size="19.4492">Yes</ns0:text>
  <ns0:text x="836.3153" y="246.1538" font-size="19.4492">No (some persistent)</ns0:text>
  <ns0:rect x="58.3476" y="269.1282" width="350.0855" height="98.4615" fill="#e3f2fd" stroke="#333" stroke-width="1.9449" rx="5.8348" />
  <ns0:text x="233.3903" y="334.7692" text-anchor="middle" font-size="19.4492">allkeys-lru / allkeys-lfu</ns0:text>
  <ns0:rect x="758.5185" y="269.1282" width="350.0855" height="98.4615" fill="#f3e5f5" stroke="#333" stroke-width="1.9449" rx="5.8348" />
  <ns0:text x="933.5613" y="334.7692" text-anchor="middle" font-size="19.4492">volatile-lru / volatile-ttl</ns0:text>
  <ns0:rect x="58.3476" y="410.2564" width="350.0855" height="98.4615" fill="#e8f5e9" stroke="#333" stroke-width="1.9449" rx="5.8348" />
  <ns0:text x="233.3903" y="475.8974" text-anchor="middle" font-size="19.4492">Best for pure caching</ns0:text>
  <ns0:rect x="758.5185" y="410.2564" width="350.0855" height="98.4615" fill="#e8f5e9" stroke="#333" stroke-width="1.9449" rx="5.8348" />
  <ns0:text x="933.5613" y="475.8974" text-anchor="middle" font-size="19.4492">Only evicts keys with TTL</ns0:text>
  <ns0:rect x="291.7379" y="541.5385" width="583.4758" height="98.4615" fill="#ffebee" stroke="#333" stroke-width="1.9449" rx="5.8348" />
  <ns0:text x="583.4758" y="607.1795" text-anchor="middle" font-size="19.4492">noeviction: returns errors (safest for data integrity)</ns0:text>
</ns0:svg>
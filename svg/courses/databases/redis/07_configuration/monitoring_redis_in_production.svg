<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="257.1428" height="271.875" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="168.5714" y="112.5" text-anchor="middle" font-size="21.4549" font-weight="bold">Memory</text>
  <text x="168.5714" y="166.8751" text-anchor="middle" font-size="21.4549">used_memory</text>
  <text x="168.5714" y="214" text-anchor="middle" font-size="21.4549">fragmentation</text>
  <text x="168.5714" y="261.125" text-anchor="middle" font-size="21.4549">evicted_keys</text>
  <rect x="339.9999" y="40" width="257.1428" height="271.875" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="468.5713" y="112.5" text-anchor="middle" font-size="21.4549" font-weight="bold">Throughput</text>
  <text x="468.5713" y="166.8751" text-anchor="middle" font-size="21.4549">ops/second</text>
  <text x="468.5713" y="214" text-anchor="middle" font-size="21.4549">hit/miss ratio</text>
  <text x="468.5713" y="261.125" text-anchor="middle" font-size="21.4549">commands/sec</text>
  <rect x="639.9999" y="40" width="257.1428" height="271.875" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="768.5713" y="112.5" text-anchor="middle" font-size="21.4549" font-weight="bold">Latency</text>
  <text x="768.5713" y="166.8751" text-anchor="middle" font-size="21.4549">avg response</text>
  <text x="768.5713" y="214" text-anchor="middle" font-size="21.4549">p99 latency</text>
  <text x="768.5713" y="261.125" text-anchor="middle" font-size="21.4549">slow log</text>
  <rect x="939.9999" y="40" width="300.0001" height="271.875" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1089.9999" y="112.5" text-anchor="middle" font-size="21.4549" font-weight="bold">Connections</text>
  <text x="1089.9999" y="166.8751" text-anchor="middle" font-size="21.4549">connected_clients</text>
  <text x="1089.9999" y="214" text-anchor="middle" font-size="21.4549">blocked_clients</text>
  <text x="1089.9999" y="261.125" text-anchor="middle" font-size="21.4549">rejected_conns</text>
  <rect x="40" y="384.375" width="1200" height="235.625" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="639.9999" y="456.875" text-anchor="middle" font-size="21.4549" font-weight="bold">Alert Thresholds</text>
  <text x="639.9999" y="518.5" text-anchor="middle" font-size="21.4549">Memory &gt; 80% | Hit ratio &lt; 90% | Latency &gt; 5ms | Evictions increasing</text>
  <text x="639.9999" y="576.5" text-anchor="middle" font-size="21.4549">Use INFO command sections: server, clients, memory, stats, keyspace</text>
</svg>
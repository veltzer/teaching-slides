<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="257.1428" height="271.875" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="168.5714" y="112.5" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Memory</text>
  <text x="168.5714" y="166.8751" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--primary-text)">used_memory</text>
  <text x="168.5714" y="214" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--primary-text)">fragmentation</text>
  <text x="168.5714" y="261.125" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--primary-text)">evicted_keys</text>
  <rect x="339.9999" y="40" width="257.1428" height="271.875" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="468.5713" y="112.5" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Throughput</text>
  <text x="468.5713" y="166.8751" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--info-text)">ops/second</text>
  <text x="468.5713" y="214" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--info-text)">hit/miss ratio</text>
  <text x="468.5713" y="261.125" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--info-text)">commands/sec</text>
  <rect x="639.9999" y="40" width="257.1428" height="271.875" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="768.5713" y="112.5" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Latency</text>
  <text x="768.5713" y="166.8751" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--ok-text)">avg response</text>
  <text x="768.5713" y="214" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--ok-text)">p99 latency</text>
  <text x="768.5713" y="261.125" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--ok-text)">slow log</text>
  <rect x="939.9999" y="40" width="300.0001" height="271.875" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="1089.9999" y="112.5" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Connections</text>
  <text x="1089.9999" y="166.8751" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--warn-text)">connected_clients</text>
  <text x="1089.9999" y="214" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--warn-text)">blocked_clients</text>
  <text x="1089.9999" y="261.125" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--warn-text)">rejected_conns</text>
  <rect x="40" y="384.375" width="1200" height="235.625" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="639.9999" y="456.875" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Alert Thresholds</text>
  <text x="639.9999" y="518.5" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--danger-text)">Memory &gt; 80% | Hit ratio &lt; 90% | Latency &gt; 5ms | Evictions increasing</text>
  <text x="639.9999" y="576.5" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--danger-text)">Use INFO command sections: server, clients, memory, stats, keyspace</text>
</svg>

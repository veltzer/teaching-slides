<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="583.4758" y="72.2051" text-anchor="middle" font-size="25.2839" font-weight="bold" fill="var(--text)">Redis Set: Unordered Unique Members</text>
  <text x="233.3903" y="147.6923" text-anchor="middle" font-size="21.3941" fill="var(--text)">tags:article:42</text>
  <ellipse cx="233.3903" cy="393.8462" rx="204.2165" ry="136.1443" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.8899" />
  <text x="155.5936" y="278.9744" text-anchor="middle" font-size="19.4492">"redis"</text>
  <text x="272.2887" y="328.2051" text-anchor="middle" font-size="19.4492">"nosql"</text>
  <text x="184.7674" y="393.8462" text-anchor="middle" font-size="19.4492">"database"</text>
  <text x="291.7379" y="459.4872" text-anchor="middle" font-size="19.4492">"cache"</text>
  <text x="204.2165" y="508.7179" text-anchor="middle" font-size="19.4492">"fast"</text>
  <rect x="544.5774" y="196.9231" width="252.8395" height="98.4615" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="670.9972" y="262.5641" text-anchor="middle" font-size="19.4492">SADD "python"</text>
  <rect x="544.5774" y="328.2051" width="252.8395" height="98.4615" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="670.9972" y="393.8462" text-anchor="middle" font-size="19.4492">SREM "cache"</text>
  <rect x="544.5774" y="459.4872" width="252.8395" height="98.4615" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="670.9972" y="525.1282" text-anchor="middle" font-size="19.4492">SISMEMBER "redis"</text>
  <text x="894.6628" y="262.5641" text-anchor="middle" font-size="19.4492" fill="var(--ok-accent)">+ added</text>
  <text x="894.6628" y="393.8462" text-anchor="middle" font-size="19.4492" fill="var(--warn-accent)">- removed</text>
  <text x="894.6628" y="525.1282" text-anchor="middle" font-size="19.4492" fill="var(--info-accent)">= true</text>
  <text x="583.4758" y="640" text-anchor="middle" font-size="19.4492" fill="var(--text-muted)">No duplicates allowed; O(1) membership check</text>
</svg>
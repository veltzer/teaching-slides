<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="808.5394" y="40" text-anchor="middle" font-size="30.09" font-weight="bold" fill="var(--text)">Redis Set: Unordered Unique Members</text>
  <text x="323.1461" y="117.1098" text-anchor="middle" font-size="25.4608" fill="var(--text)">tags:article:42</text>
  <ellipse cx="323.1461" cy="368.555" rx="283.1461" ry="139.0708" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.8899" />
  <text x="215.281" y="251.2139" text-anchor="middle" font-size="23.1462">"redis"</text>
  <text x="377.0787" y="301.5029" text-anchor="middle" font-size="23.1462">"nosql"</text>
  <text x="255.7304" y="368.555" text-anchor="middle" font-size="23.1462">"database"</text>
  <text x="404.045" y="435.607" text-anchor="middle" font-size="23.1462">"cache"</text>
  <text x="282.6966" y="485.8959" text-anchor="middle" font-size="23.1462">"fast"</text>
  <rect x="754.6068" y="167.3989" width="350.5618" height="100.578" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="929.8878" y="234.4509" text-anchor="middle" font-size="23.1462">SADD "python"</text>
  <rect x="754.6068" y="301.5029" width="350.5618" height="100.578" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="929.8878" y="368.555" text-anchor="middle" font-size="23.1462">SREM "cache"</text>
  <rect x="754.6068" y="435.607" width="350.5618" height="100.578" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="929.8878" y="502.659" text-anchor="middle" font-size="23.1462">SISMEMBER "redis"</text>
  <text x="1240" y="234.4509" text-anchor="middle" font-size="23.1462" fill="var(--ok-accent)">+ added</text>
  <text x="1240" y="368.555" text-anchor="middle" font-size="23.1462" fill="var(--warn-accent)">- removed</text>
  <text x="1240" y="502.659" text-anchor="middle" font-size="23.1462" fill="var(--info-accent)">= true</text>
  <text x="808.5394" y="620" text-anchor="middle" font-size="23.1462" fill="var(--text-muted)">No duplicates allowed; O(1) membership check</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="808.5394" y="40" text-anchor="middle" font-size="30.09" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Redis Set: Unordered Unique Members</text>
  <text x="323.1461" y="117.1098" text-anchor="middle" font-size="25.4608" fill="var(--text)" font-family="Arial, sans-serif">tags:article:42</text>
  <ellipse cx="323.1461" cy="368.555" rx="283.1461" ry="139.0708" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.8899" />
  <text x="215.281" y="251.2139" text-anchor="middle" font-size="23.1462" font-family="Arial, sans-serif" fill="var(--text)">"redis"</text>
  <text x="377.0787" y="301.5029" text-anchor="middle" font-size="23.1462" font-family="Arial, sans-serif" fill="var(--text)">"nosql"</text>
  <text x="255.7304" y="368.555" text-anchor="middle" font-size="23.1462" font-family="Arial, sans-serif" fill="var(--text)">"database"</text>
  <text x="404.045" y="435.607" text-anchor="middle" font-size="23.1462" font-family="Arial, sans-serif" fill="var(--text)">"cache"</text>
  <text x="282.6966" y="485.8959" text-anchor="middle" font-size="23.1462" font-family="Arial, sans-serif" fill="var(--text)">"fast"</text>
  <rect x="754.6068" y="167.3989" width="350.5618" height="100.578" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="929.8878" y="234.4509" text-anchor="middle" font-size="23.1462" font-family="Arial, sans-serif" fill="var(--ok-text)">SADD "python"</text>
  <rect x="754.6068" y="301.5029" width="350.5618" height="100.578" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="929.8878" y="368.555" text-anchor="middle" font-size="23.1462" font-family="Arial, sans-serif" fill="var(--warn-text)">SREM "cache"</text>
  <rect x="754.6068" y="435.607" width="350.5618" height="100.578" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="929.8878" y="502.659" text-anchor="middle" font-size="23.1462" font-family="Arial, sans-serif" fill="var(--info-text)">SISMEMBER "redis"</text>
  <text x="1240" y="234.4509" text-anchor="middle" font-size="23.1462" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ added</text>
  <text x="1240" y="368.555" text-anchor="middle" font-size="23.1462" fill="var(--warn-accent)" font-family="Arial, sans-serif">- removed</text>
  <text x="1240" y="502.659" text-anchor="middle" font-size="23.1462" fill="var(--info-accent)" font-family="Arial, sans-serif">= true</text>
  <text x="808.5394" y="620" text-anchor="middle" font-size="23.1462" fill="var(--text-muted)" font-family="Arial, sans-serif">No duplicates allowed; O(1) membership check</text>
</svg>
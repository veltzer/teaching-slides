  <text x="181.3333" y="262.8" text-anchor="middle" font-size="21.3333">product:42:details</text>
  <rect x="42.6667" y="342" width="277.3333" height="180" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="181.3333" y="414" text-anchor="middle" font-size="21.3333" font-weight="bold">Sorted Set</text>
  <text x="181.3333" y="478.8" text-anchor="middle" font-size="21.3333">product:42:reviews</text>

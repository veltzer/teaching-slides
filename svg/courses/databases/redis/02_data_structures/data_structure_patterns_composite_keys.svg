<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="629.4737" y="40" text-anchor="middle" font-size="26.4344" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Composite Keys: E-commerce Product Example</text>
  <rect x="40" y="89.7143" width="273.6842" height="165.7143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="176.8421" y="156" text-anchor="middle" font-size="20.3342" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Hash</text>
  <text x="176.8421" y="215.6571" text-anchor="middle" font-size="20.3342" font-family="Arial, sans-serif" fill="var(--primary-text)">product:42:details</text>
  <rect x="40" y="288.5715" width="273.6842" height="165.7143" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="176.8421" y="354.8572" text-anchor="middle" font-size="20.3342" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Sorted Set</text>
  <text x="176.8421" y="414.5143" text-anchor="middle" font-size="20.3342" font-family="Arial, sans-serif" fill="var(--info-text)">product:42:reviews</text>
  <rect x="40" y="487.4285" width="273.6842" height="116" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="176.8421" y="560.3429" text-anchor="middle" font-size="20.3342" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Set</text>
  <line x1="313.6842" y1="172.5715" x2="397.8947" y2="172.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="313.6842" y1="371.4286" x2="397.8947" y2="371.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="313.6842" y1="543.7714" x2="397.8947" y2="543.7714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="797.8949" y="139.4286" font-size="20.3342" fill="var(--text)" font-family="Arial, sans-serif">name="Widget" price="29.99" stock="150"</text>
  <text x="797.8949" y="205.7143" font-size="20.3342" fill="var(--text-muted)" font-family="Arial, sans-serif">HSET / HGET / HINCRBY stock</text>
  <text x="797.8949" y="338.2857" font-size="20.3342" fill="var(--text)" font-family="Arial, sans-serif">user:7 score:5, user:12 score:3, ...</text>
  <text x="797.8949" y="404.5715" font-size="20.3342" fill="var(--text-muted)" font-family="Arial, sans-serif">ZADD / ZRANGEBYSCORE for filtering</text>
  <text x="797.8949" y="530.5143" font-size="20.3342" fill="var(--text)" font-family="Arial, sans-serif">product:42:tags = {"electronics","sale"}</text>
  <text x="797.8949" y="586.8572" font-size="20.3342" fill="var(--text-muted)" font-family="Arial, sans-serif">SADD / SINTER for tag-based search</text>
  <rect x="397.8947" y="106.2858" width="842.1053" height="132.5715" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="397.8947" y="305.1428" width="842.1053" height="132.5715" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="397.8947" y="487.4285" width="842.1053" height="132.5715" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

  <line x1="320" y1="619.2" x2="405.3333" y2="619.2" stroke="#333" stroke-width="3.2" marker-end="url(#arrowd14)" />
  <text x="810.6667" y="180" font-size="21.3333" fill="#333">name="Widget" price="29.99" stock="150"</text>
  <text x="810.6667" y="252" font-size="21.3333" fill="#666">HSET / HGET / HINCRBY stock</text>
  <text x="810.6667" y="396" font-size="21.3333" fill="#333">user:7 score:5, user:12 score:3, ...</text>
  <text x="810.6667" y="468" font-size="21.3333" fill="#666">ZADD / ZRANGEBYSCORE for filtering</text>
  <text x="810.6667" y="604.8" font-size="21.3333" fill="#333">product:42:tags = {"electronics","sale"}</text>
  <text x="810.6667" y="666" font-size="21.3333" fill="#666">SADD / SINTER for tag-based search</text>

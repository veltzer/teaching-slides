  <rect x="96.6038" y="40" width="203.7735" height="217.499950000011" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.92820243393" filter="url(#shadow)"/>
  <text x="198.4906" y="126.999980000005" text-anchor="middle" font-size="25.465531806236" font-family="Arial, sans-serif" fill="var(--primary-text)">"task1"</text>

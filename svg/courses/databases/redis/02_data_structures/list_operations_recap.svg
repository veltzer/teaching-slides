<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="40" y="112.50011666664" text-anchor="middle" font-size="25.465531806236" fill="var(--text)" font-family="Arial, sans-serif">HEAD</text>

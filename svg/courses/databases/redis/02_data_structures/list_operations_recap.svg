  <text x="198.4906" y="426.666577777798" text-anchor="middle" font-size="25.465531806236" fill="var(--primary-accent)" font-family="Arial, sans-serif">LPUSH</text>
  <path d="M 198.4906 441.166707777768 L 198.4906 523.33335555555 L 119.2454 523.33335555555" stroke="var(--primary-border)" stroke-width="0.6032" fill="none" marker-end="url(#arrow-primary)"/>
  <text x="1115.4717" y="426.666577777798" text-anchor="middle" font-size="25.465531806236" fill="var(--info-accent)" font-family="Arial, sans-serif">RPUSH</text>

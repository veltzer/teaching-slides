<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0001" y="80" text-anchor="middle" font-size="24.074" font-weight="bold" fill="var(--text)">Redis List: Doubly-Linked List</text>
  <text x="149.2592" y="251.875" text-anchor="middle" font-size="18.5185" fill="var(--text)">HEAD</text>
  <text x="1130.7408" y="251.875" text-anchor="middle" font-size="18.5185" fill="var(--text)">TAIL</text>
  <rect x="195.5555" y="204.9999" width="166.6667" height="140.625" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.4618" />
  <text x="278.8888" y="261.25" text-anchor="middle" font-size="18.5185">"task1"</text>
  <text x="278.8888" y="314.3749" text-anchor="middle" font-size="18.5185" fill="var(--text-muted)">index 0</text>
  <rect x="445.5555" y="204.9999" width="166.6667" height="140.625" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="9.4618" />
  <text x="528.889" y="261.25" text-anchor="middle" font-size="18.5185">"task2"</text>
  <text x="528.889" y="314.3749" text-anchor="middle" font-size="18.5185" fill="var(--text-muted)">index 1</text>
  <rect x="695.5555" y="204.9999" width="166.6667" height="140.625" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="9.4618" />
  <text x="778.889" y="261.25" text-anchor="middle" font-size="18.5185">"task3"</text>
  <text x="778.889" y="314.3749" text-anchor="middle" font-size="18.5185" fill="var(--text-muted)">index 2</text>
  <rect x="945.5555" y="204.9999" width="166.6667" height="140.625" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="9.4618" />
  <text x="1028.889" y="261.25" text-anchor="middle" font-size="18.5185">"task4"</text>
  <text x="1028.889" y="314.3749" text-anchor="middle" font-size="18.5185" fill="var(--text-muted)">index 3</text>
  <line x1="362.2223" y1="273.75" x2="441.8519" y2="273.75" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2)" />
  <line x1="612.2223" y1="273.75" x2="691.8519" y2="273.75" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2)" />
  <line x1="862.2223" y1="273.75" x2="941.8519" y2="273.75" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2)" />
  <line x1="441.8519" y1="292.5" x2="362.2223" y2="292.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2)" />
  <line x1="691.8519" y1="292.5" x2="612.2223" y2="292.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2)" />
  <line x1="941.8519" y1="292.5" x2="862.2223" y2="292.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2)" />
  <text x="278.8888" y="454.9999" text-anchor="middle" font-size="18.5185" fill="var(--primary-accent)">LPUSH</text>
  <path d="M 278.8888 464.375 L 278.8888 517.5 L 214.074 517.5" stroke="var(--primary-border)" stroke-width="1.7615" fill="none" marker-end="url(#arrowblue2)" />
  <text x="1028.889" y="454.9999" text-anchor="middle" font-size="18.5185" fill="var(--info-accent)">RPUSH</text>
  <path d="M 1028.889 464.375 L 1028.889 517.5 L 1093.7038 517.5" stroke="var(--info-border)" stroke-width="1.7615" fill="none" marker-end="url(#arrowpurp2)" />
  <text x="640.0001" y="580" text-anchor="middle" font-size="18.5185" fill="var(--text)">LPOP / RPOP remove from head / tail</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
    <marker id="arrowblue2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#1565c0" />
    </marker>
    <marker id="arrowpurp2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#4a148c" />
    </marker>
  </defs>
</svg>
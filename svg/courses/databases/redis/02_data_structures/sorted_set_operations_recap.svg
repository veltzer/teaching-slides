<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="722.1053" y="40" text-anchor="middle" font-size="29.1243" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Redis Sorted Set: Members Ordered by Score</text>
  <text x="722.1053" y="117.1098" text-anchor="middle" font-size="24.6437" fill="var(--text)" font-family="Arial, sans-serif">leaderboard:game1</text>
  <rect x="40" y="167.3989" width="252.6316" height="184.393" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="166.3158" y="234.4509" text-anchor="middle" font-size="22.4034" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">score: 150</text>
  <text x="166.3158" y="301.5029" text-anchor="middle" font-size="22.4034" font-family="Arial, sans-serif" fill="var(--ok-text)">"alice"</text>
  <rect x="355.7895" y="167.3989" width="252.6316" height="184.393" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="482.1052" y="234.4509" text-anchor="middle" font-size="22.4034" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">score: 320</text>
  <text x="482.1052" y="301.5029" text-anchor="middle" font-size="22.4034" font-family="Arial, sans-serif" fill="var(--primary-text)">"bob"</text>
  <rect x="671.579" y="167.3989" width="252.6316" height="184.393" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="797.8948" y="234.4509" text-anchor="middle" font-size="22.4034" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">score: 475</text>
  <text x="797.8948" y="301.5029" text-anchor="middle" font-size="22.4034" font-family="Arial, sans-serif" fill="var(--info-text)">"carol"</text>
  <rect x="987.3684" y="167.3989" width="252.6316" height="184.393" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1113.6843" y="234.4509" text-anchor="middle" font-size="22.4034" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">score: 890</text>
  <text x="1113.6843" y="301.5029" text-anchor="middle" font-size="22.4034" font-family="Arial, sans-serif" fill="var(--warn-text)">"dave"</text>
  <line x1="40" y1="402.081" x2="1240" y2="402.081" stroke="var(--text)" stroke-width="1.9449"/>
  <text x="40" y="452.3699" font-size="22.4034" fill="var(--text-muted)" font-family="Arial, sans-serif">low score</text>
  <text x="1240" y="452.3699" text-anchor="end" font-size="22.4034" fill="var(--text-muted)" font-family="Arial, sans-serif">high score</text>
  <text x="166.3158" y="536.185" text-anchor="middle" font-size="22.4034" fill="var(--ok-accent)" font-family="Arial, sans-serif">rank 0</text>
  <text x="482.1052" y="536.185" text-anchor="middle" font-size="22.4034" fill="var(--primary-accent)" font-family="Arial, sans-serif">rank 1</text>
  <text x="797.8948" y="536.185" text-anchor="middle" font-size="22.4034" fill="var(--info-accent)" font-family="Arial, sans-serif">rank 2</text>
  <text x="1113.6843" y="536.185" text-anchor="middle" font-size="22.4034" fill="var(--warn-accent)" font-family="Arial, sans-serif">rank 3</text>
  <text x="722.1053" y="620" text-anchor="middle" font-size="22.4034" fill="var(--text-muted)" font-family="Arial, sans-serif">ZRANGE returns by rank; ZRANGEBYSCORE returns by score range</text>
</svg>

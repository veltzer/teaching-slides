<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="722.1053" y="40" text-anchor="middle" font-size="29.1243" font-weight="bold" fill="var(--text)">Redis Sorted Set: Members Ordered by Score</text>
  <text x="722.1053" y="117.1098" text-anchor="middle" font-size="24.6437" fill="var(--text)">leaderboard:game1</text>
  <rect x="40" y="167.3989" width="252.6316" height="184.393" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="166.3158" y="234.4509" text-anchor="middle" font-size="22.4034" font-weight="bold">score: 150</text>
  <text x="166.3158" y="301.5029" text-anchor="middle" font-size="22.4034">"alice"</text>
  <rect x="355.7895" y="167.3989" width="252.6316" height="184.393" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="482.1052" y="234.4509" text-anchor="middle" font-size="22.4034" font-weight="bold">score: 320</text>
  <text x="482.1052" y="301.5029" text-anchor="middle" font-size="22.4034">"bob"</text>
  <rect x="671.579" y="167.3989" width="252.6316" height="184.393" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="797.8948" y="234.4509" text-anchor="middle" font-size="22.4034" font-weight="bold">score: 475</text>
  <text x="797.8948" y="301.5029" text-anchor="middle" font-size="22.4034">"carol"</text>
  <rect x="987.3684" y="167.3989" width="252.6316" height="184.393" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1113.6843" y="234.4509" text-anchor="middle" font-size="22.4034" font-weight="bold">score: 890</text>
  <text x="1113.6843" y="301.5029" text-anchor="middle" font-size="22.4034">"dave"</text>
  <line x1="40" y1="402.081" x2="1240" y2="402.081" stroke="var(--text)" stroke-width="1.9449" />
  <text x="40" y="452.3699" font-size="22.4034" fill="var(--text-muted)">low score</text>
  <text x="1240" y="452.3699" text-anchor="end" font-size="22.4034" fill="var(--text-muted)">high score</text>
  <text x="166.3158" y="536.185" text-anchor="middle" font-size="22.4034" fill="var(--ok-accent)">rank 0</text>
  <text x="482.1052" y="536.185" text-anchor="middle" font-size="22.4034" fill="var(--primary-accent)">rank 1</text>
  <text x="797.8948" y="536.185" text-anchor="middle" font-size="22.4034" fill="var(--info-accent)">rank 2</text>
  <text x="1113.6843" y="536.185" text-anchor="middle" font-size="22.4034" fill="var(--warn-accent)">rank 3</text>
  <text x="722.1053" y="620" text-anchor="middle" font-size="22.4034" fill="var(--text-muted)">ZRANGE returns by rank; ZRANGEBYSCORE returns by score range</text>
</svg>
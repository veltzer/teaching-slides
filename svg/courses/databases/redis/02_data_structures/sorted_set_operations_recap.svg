<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="583.4758" y="72.2051" text-anchor="middle" font-size="25.2839" font-weight="bold" fill="var(--text)">Redis Sorted Set: Members Ordered by Score</text>
  <text x="583.4758" y="147.6923" text-anchor="middle" font-size="21.3941" fill="var(--text)">leaderboard:game1</text>
  <rect x="58.3476" y="196.9231" width="194.4919" height="180.5128" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="155.5936" y="262.5641" text-anchor="middle" font-size="19.4492" font-weight="bold">score: 150</text>
  <text x="155.5936" y="328.2051" text-anchor="middle" font-size="19.4492">"alice"</text>
  <rect x="301.4625" y="196.9231" width="194.4919" height="180.5128" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="398.7084" y="262.5641" text-anchor="middle" font-size="19.4492" font-weight="bold">score: 320</text>
  <text x="398.7084" y="328.2051" text-anchor="middle" font-size="19.4492">"bob"</text>
  <rect x="544.5774" y="196.9231" width="194.4919" height="180.5128" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="641.8234" y="262.5641" text-anchor="middle" font-size="19.4492" font-weight="bold">score: 475</text>
  <text x="641.8234" y="328.2051" text-anchor="middle" font-size="19.4492">"carol"</text>
  <rect x="787.6923" y="196.9231" width="194.4919" height="180.5128" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="884.9383" y="262.5641" text-anchor="middle" font-size="19.4492" font-weight="bold">score: 890</text>
  <text x="884.9383" y="328.2051" text-anchor="middle" font-size="19.4492">"dave"</text>
  <line x1="58.3476" y1="426.6667" x2="982.1842" y2="426.6667" stroke="var(--text)" stroke-width="1.9449" />
  <text x="58.3476" y="475.8974" font-size="19.4492" fill="var(--text-muted)">low score</text>
  <text x="982.1842" y="475.8974" text-anchor="end" font-size="19.4492" fill="var(--text-muted)">high score</text>
  <text x="155.5936" y="557.9487" text-anchor="middle" font-size="19.4492" fill="var(--ok-accent)">rank 0</text>
  <text x="398.7084" y="557.9487" text-anchor="middle" font-size="19.4492" fill="var(--primary-accent)">rank 1</text>
  <text x="641.8234" y="557.9487" text-anchor="middle" font-size="19.4492" fill="var(--info-accent)">rank 2</text>
  <text x="884.9383" y="557.9487" text-anchor="middle" font-size="19.4492" fill="var(--warn-accent)">rank 3</text>
  <text x="583.4758" y="640" text-anchor="middle" font-size="19.4492" fill="var(--text-muted)">ZRANGE returns by rank; ZRANGEBYSCORE returns by score range</text>
</svg>
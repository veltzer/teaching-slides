<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="58.125101367185" width="286.2385" height="108.749959453126" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="183.1193" y="130.625074335935" text-anchor="middle" font-size="23.923096031924" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">user:1001</text>
  <line x1="326.2385" y1="112.499972968751" x2="392.2935" y2="112.499972968751" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="403.3027" y="40" width="836.6973" height="561.874898632815" fill="var(--bg)" stroke="var(--text)" stroke-width="3.8899" rx="6.238990215526"/>
  <text x="821.6513" y="112.499972968751" text-anchor="middle" font-size="23.923096031924" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Hash Fields</text>
  <rect x="436.3302" y="148.749959453126" width="220.1834" height="101.499962156251" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="546.4219" y="217.625041898436" text-anchor="middle" font-size="21.748288025961" font-family="Arial, sans-serif" fill="var(--info-text)">name</text>
  <rect x="678.5321" y="148.749959453126" width="528.4403" height="101.499962156251" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="942.7522" y="217.625041898436" text-anchor="middle" font-size="21.748288025961" font-family="Arial, sans-serif" fill="var(--ok-text)">"Alice Smith"</text>
  <rect x="436.3302" y="275.625020273437" width="220.1834" height="101.499962156251" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="546.4219" y="344.49999459375" text-anchor="middle" font-size="21.748288025961" font-family="Arial, sans-serif" fill="var(--info-text)">email</text>
  <rect x="678.5321" y="275.625020273437" width="528.4403" height="101.499962156251" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="942.7522" y="344.49999459375" text-anchor="middle" font-size="21.748288025961" font-family="Arial, sans-serif" fill="var(--ok-text)">"alice@example.com"</text>
  <rect x="436.3302" y="402.499972968751" width="220.1834" height="101.499962156251" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="546.4219" y="471.375055414061" text-anchor="middle" font-size="21.748288025961" font-family="Arial, sans-serif" fill="var(--info-text)">login_count</text>
  <rect x="678.5321" y="402.499972968751" width="528.4403" height="101.499962156251" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="942.7522" y="471.375055414061" text-anchor="middle" font-size="21.748288025961" font-family="Arial, sans-serif" fill="var(--warn-text)">47 (HINCRBY increments this)</text>
  <text x="183.1193" y="620" text-anchor="middle" font-size="21.748288025961" fill="var(--text-muted)" font-family="Arial, sans-serif">HSET / HGET</text>
  <text x="634.4954" y="620" text-anchor="middle" font-size="21.748288025961" fill="var(--text-muted)" font-family="Arial, sans-serif">HGETALL returns all pairs</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

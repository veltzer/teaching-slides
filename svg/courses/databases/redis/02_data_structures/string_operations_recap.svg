<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="266.6667" height="171.851851851852" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.531972647422" filter="url(#shadow)"/>
  <text x="173.3333" y="147.407407407407" text-anchor="middle" font-size="26.164469636513" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Key</text>
  <rect x="328.8889" y="40" width="355.5556" height="171.851851851852" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.531972647422" filter="url(#shadow)"/>
  <text x="506.6667" y="147.407407407407" text-anchor="middle" font-size="26.164469636513" font-family="Arial, sans-serif" fill="var(--info-text)">Value (up to 512MB)</text>
  <rect x="40" y="276.296177777778" width="266.6667" height="150.37037037037" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.531972647422" filter="url(#shadow)"/>
  <text x="173.3333" y="370.814814814815" text-anchor="middle" font-size="23.785851796954" font-family="Arial, sans-serif" fill="var(--primary-text)">"user:name"</text>
  <rect x="328.8889" y="276.296177777778" width="355.5556" height="150.37037037037" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.531972647422" filter="url(#shadow)"/>
  <text x="506.6667" y="370.814814814815" text-anchor="middle" font-size="23.785851796954" font-family="Arial, sans-serif" fill="var(--ok-text)">"Alice"</text>
  <rect x="40" y="469.62962962963" width="266.6667" height="150.37037037037" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.531972647422" filter="url(#shadow)"/>
  <text x="173.3333" y="564.148148148148" text-anchor="middle" font-size="23.785851796954" font-family="Arial, sans-serif" fill="var(--primary-text)">"counter"</text>
  <rect x="328.8889" y="469.62962962963" width="355.5556" height="150.37037037037" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.531972647422" filter="url(#shadow)"/>
  <text x="506.6667" y="564.148148148148" text-anchor="middle" font-size="23.785851796954" font-family="Arial, sans-serif" fill="var(--warn-text)">42 (integer)</text>
  <rect x="795.5556" y="125.925925925926" width="444.4444" height="472.592592592593" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.531972647422" filter="url(#shadow)"/>
  <text x="1017.7779" y="233.333214814815" text-anchor="middle" font-size="26.164469636513" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Operations</text>
  <text x="1017.7779" y="319.259259259259" text-anchor="middle" font-size="23.785851796954" font-family="Arial, sans-serif" fill="var(--danger-text)">SET / GET</text>
  <text x="1017.7779" y="396.592592592593" text-anchor="middle" font-size="23.785851796954" font-family="Arial, sans-serif" fill="var(--danger-text)">INCR / DECR</text>
  <text x="1017.7779" y="473.925925925926" text-anchor="middle" font-size="23.785851796954" font-family="Arial, sans-serif" fill="var(--danger-text)">MSET / MGET</text>
  <text x="1017.7779" y="551.259140740741" text-anchor="middle" font-size="23.785851796954" font-family="Arial, sans-serif" fill="var(--danger-text)">APPEND / STRLEN</text>
</svg>

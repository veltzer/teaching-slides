<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="28.623685" font-weight="bold" fill="var(--text)">Bitmap: User Online Status Tracking</text>
  <text x="640" y="81.801802" text-anchor="middle" font-size="18.40094" fill="var(--text-muted)">key "online:2024-03-23" — each bit is one user ID</text>

  <!-- Bit index row -->
  <text x="140" y="154.954955" text-anchor="middle" font-size="16.356391" fill="var(--text-muted)">bit offset</text>
  <g font-size="20" font-weight="bold" fill="var(--text)" text-anchor="middle">
    <text x="255" y="154.954955">0</text>
    <text x="375" y="154.954955">1</text>
    <text x="495" y="154.954955">2</text>
    <text x="615" y="154.954955">3</text>
    <text x="735" y="154.954955">4</text>
    <text x="855" y="154.954955">5</text>
    <text x="975" y="154.954955">6</text>
    <text x="1095" y="154.954955">7</text>
  </g>

  <!-- Bit cells -->
  <rect x="210" y="181.081081" width="90" height="250.810811" rx="6.133647" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="255" y="327.387387" text-anchor="middle" font-size="92.0047" font-weight="bold" fill="var(--ok-text)">1</text>
  <rect x="330" y="181.081081" width="90" height="250.810811" rx="6.133647" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="375" y="327.387387" text-anchor="middle" font-size="92.0047" font-weight="bold" fill="var(--danger-text)">0</text>
  <rect x="450" y="181.081081" width="90" height="250.810811" rx="6.133647" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="327.387387" text-anchor="middle" font-size="92.0047" font-weight="bold" fill="var(--ok-text)">1</text>
  <rect x="570" y="181.081081" width="90" height="250.810811" rx="6.133647" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="327.387387" text-anchor="middle" font-size="92.0047" font-weight="bold" fill="var(--ok-text)">1</text>
  <rect x="690" y="181.081081" width="90" height="250.810811" rx="6.133647" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="735" y="327.387387" text-anchor="middle" font-size="92.0047" font-weight="bold" fill="var(--danger-text)">0</text>
  <rect x="810" y="181.081081" width="90" height="250.810811" rx="6.133647" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="855" y="327.387387" text-anchor="middle" font-size="92.0047" font-weight="bold" fill="var(--ok-text)">1</text>
  <rect x="930" y="181.081081" width="90" height="250.810811" rx="6.133647" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="975" y="327.387387" text-anchor="middle" font-size="92.0047" font-weight="bold" fill="var(--danger-text)">0</text>
  <rect x="1050" y="181.081081" width="90" height="250.810811" rx="6.133647" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095" y="327.387387" text-anchor="middle" font-size="92.0047" font-weight="bold" fill="var(--ok-text)">1</text>

  <!-- Legend row -->
  <rect x="1170" y="181.081081" width="70" height="114.954955" rx="6.133647" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1205" y="249.009009" text-anchor="middle" font-size="18.40094" font-weight="bold" fill="var(--ok-text)">online</text>
  <rect x="1170" y="316.936937" width="70" height="114.954955" rx="6.133647" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1205" y="384.864865" text-anchor="middle" font-size="18.40094" font-weight="bold" fill="var(--danger-text)">offline</text>

  <!-- Commands/info -->
  <rect x="40" y="463.243243" width="1200" height="156.756757" rx="6.133647" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="505.045045" font-size="18.40094" font-family="monospace" fill="var(--text)">SETBIT online:2024-03-23 0 1</text>
  <text x="600" y="505.045045" font-size="16.356391" fill="var(--text-muted)">— mark user 0 as online</text>
  <text x="60" y="541.621622" font-size="18.40094" font-family="monospace" fill="var(--text)">BITCOUNT online:2024-03-23</text>
  <text x="600" y="541.621622" font-size="16.356391" fill="var(--text-muted)">— returns 5 (users online)</text>
  <text x="60" y="578.198198" font-size="18.40094" font-family="monospace" fill="var(--text)">BITOP AND / OR / XOR ...</text>
  <text x="600" y="578.198198" font-size="16.356391" fill="var(--text-muted)">— combine days for multi-day analytics</text>
  <text x="640" y="611.63964" text-anchor="middle" font-size="16.356391" font-weight="bold" fill="var(--primary-accent)">1 million users ≈ 125 KB of memory</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="65" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">Bitmap: User Online Status Tracking</text>
  <text x="640" y="105" text-anchor="middle" font-size="18" fill="var(--text-muted)">key "online:2024-03-23" — each bit is one user ID</text>

  <!-- Bit index row -->
  <text x="140" y="175" text-anchor="middle" font-size="16" fill="var(--text-muted)">bit offset</text>
  <g font-size="20" font-weight="bold" fill="var(--text)" text-anchor="middle">
    <text x="255" y="175">0</text>
    <text x="375" y="175">1</text>
    <text x="495" y="175">2</text>
    <text x="615" y="175">3</text>
    <text x="735" y="175">4</text>
    <text x="855" y="175">5</text>
    <text x="975" y="175">6</text>
    <text x="1095" y="175">7</text>
  </g>

  <!-- Bit cells -->
  <rect x="210" y="200" width="90" height="240" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="255" y="340" text-anchor="middle" font-size="90" font-weight="bold" fill="var(--ok-text)">1</text>
  <rect x="330" y="200" width="90" height="240" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="375" y="340" text-anchor="middle" font-size="90" font-weight="bold" fill="var(--danger-text)">0</text>
  <rect x="450" y="200" width="90" height="240" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="495" y="340" text-anchor="middle" font-size="90" font-weight="bold" fill="var(--ok-text)">1</text>
  <rect x="570" y="200" width="90" height="240" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="615" y="340" text-anchor="middle" font-size="90" font-weight="bold" fill="var(--ok-text)">1</text>
  <rect x="690" y="200" width="90" height="240" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="735" y="340" text-anchor="middle" font-size="90" font-weight="bold" fill="var(--danger-text)">0</text>
  <rect x="810" y="200" width="90" height="240" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="855" y="340" text-anchor="middle" font-size="90" font-weight="bold" fill="var(--ok-text)">1</text>
  <rect x="930" y="200" width="90" height="240" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="975" y="340" text-anchor="middle" font-size="90" font-weight="bold" fill="var(--danger-text)">0</text>
  <rect x="1050" y="200" width="90" height="240" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1095" y="340" text-anchor="middle" font-size="90" font-weight="bold" fill="var(--ok-text)">1</text>

  <!-- Legend row -->
  <rect x="1170" y="200" width="70" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1205" y="265" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-text)">online</text>
  <rect x="1170" y="330" width="70" height="110" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1205" y="395" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--danger-text)">offline</text>

  <!-- Commands/info -->
  <rect x="40" y="470" width="1200" height="150" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="510" font-size="18" font-family="monospace" fill="var(--text)">SETBIT online:2024-03-23 0 1</text>
  <text x="600" y="510" font-size="16" fill="var(--text-muted)">— mark user 0 as online</text>
  <text x="60" y="545" font-size="18" font-family="monospace" fill="var(--text)">BITCOUNT online:2024-03-23</text>
  <text x="600" y="545" font-size="16" fill="var(--text-muted)">— returns 5 (users online)</text>
  <text x="60" y="580" font-size="18" font-family="monospace" fill="var(--text)">BITOP AND / OR / XOR ...</text>
  <text x="600" y="580" font-size="16" fill="var(--text-muted)">— combine days for multi-day analytics</text>
  <text x="640" y="612" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-accent)">1 million users ≈ 125 KB of memory</text>
</svg>

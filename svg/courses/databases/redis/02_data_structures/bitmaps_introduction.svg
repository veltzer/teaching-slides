<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="19.102177943208" fill="var(--text-muted)" font-family="Arial, sans-serif">key "online:2024-03-23" — each bit is one user ID</text>

  <!-- Bit index row -->
  <text x="140" y="118.834951320294" text-anchor="middle" font-size="16.979713611951" fill="var(--text-muted)" font-family="Arial, sans-serif">bit offset</text>
  <g font-size="20" font-weight="bold" fill="var(--text)" text-anchor="middle">
    <text x="255" y="118.834951320294" font-family="Arial, sans-serif" fill="var(--text)">0</text>
    <text x="375" y="118.834951320294" font-family="Arial, sans-serif" fill="var(--text)">1</text>
    <text x="495" y="118.834951320294" font-family="Arial, sans-serif" fill="var(--text)">2</text>
    <text x="615" y="118.834951320294" font-family="Arial, sans-serif" fill="var(--text)">3</text>
    <text x="735" y="118.834951320294" font-family="Arial, sans-serif" fill="var(--text)">4</text>
    <text x="855" y="118.834951320294" font-family="Arial, sans-serif" fill="var(--text)">5</text>
    <text x="975" y="118.834951320294" font-family="Arial, sans-serif" fill="var(--text)">6</text>
    <text x="1095" y="118.834951320294" font-family="Arial, sans-serif" fill="var(--text)">7</text>
  </g>

  <!-- Bit cells -->
  <rect x="210" y="146.990291000566" width="90" height="270.291262439344" rx="6.367392993772" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="255" y="304.660193641154" text-anchor="middle" font-size="95.51088971604" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">1</text>
  <rect x="330" y="146.990291000566" width="90" height="270.291262439344" rx="6.367392993772" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="375" y="304.660193641154" text-anchor="middle" font-size="95.51088971604" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">0</text>
  <rect x="450" y="146.990291000566" width="90" height="270.291262439344" rx="6.367392993772" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="304.660193641154" text-anchor="middle" font-size="95.51088971604" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">1</text>
  <rect x="570" y="146.990291000566" width="90" height="270.291262439344" rx="6.367392993772" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="304.660193641154" text-anchor="middle" font-size="95.51088971604" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">1</text>
  <rect x="690" y="146.990291000566" width="90" height="270.291262439344" rx="6.367392993772" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="735" y="304.660193641154" text-anchor="middle" font-size="95.51088971604" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">0</text>
  <rect x="810" y="146.990291000566" width="90" height="270.291262439344" rx="6.367392993772" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="855" y="304.660193641154" text-anchor="middle" font-size="95.51088971604" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">1</text>
  <rect x="930" y="146.990291000566" width="90" height="270.291262439344" rx="6.367392993772" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="975" y="304.660193641154" text-anchor="middle" font-size="95.51088971604" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">0</text>
  <rect x="1050" y="146.990291000566" width="90" height="270.291262439344" rx="6.367392993772" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095" y="304.660193641154" text-anchor="middle" font-size="95.51088971604" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">1</text>

  <!-- Legend row -->
  <rect x="1170" y="146.990291000566" width="70" height="123.883495239796" rx="6.367392993772" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1205" y="220.194174600339" text-anchor="middle" font-size="19.102177943208" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">online</text>
  <rect x="1170" y="293.398058200113" width="70" height="123.883495239796" rx="6.367392993772" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1205" y="366.601941799887" text-anchor="middle" font-size="19.102177943208" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">offline</text>

  <!-- Commands/info -->
  <rect x="40" y="451.067960840701" width="1200" height="168.932039159299" rx="6.367392993772" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="496.116504760204" font-size="19.102177943208" fill="var(--text)" font-family="Courier New, monospace">SETBIT online:2024-03-23 0 1</text>
  <text x="600" y="496.116504760204" font-size="16.979713611951" fill="var(--text-muted)" font-family="Arial, sans-serif">— mark user 0 as online</text>
  <text x="60" y="535.533980959186" font-size="19.102177943208" fill="var(--text)" font-family="Courier New, monospace">BITCOUNT online:2024-03-23</text>
  <text x="600" y="535.533980959186" font-size="16.979713611951" fill="var(--text-muted)" font-family="Arial, sans-serif">— returns 5 (users online)</text>
  <text x="60" y="574.951456080498" font-size="19.102177943208" fill="var(--text)" font-family="Courier New, monospace">BITOP AND / OR / XOR ...</text>
  <text x="600" y="574.951456080498" font-size="16.979713611951" fill="var(--text-muted)" font-family="Arial, sans-serif">— combine days for multi-day analytics</text>
  <text x="640" y="610.990291647168" text-anchor="middle" font-size="16.979713611951" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1 million users ≈ 125 KB of memory</text>
</svg>

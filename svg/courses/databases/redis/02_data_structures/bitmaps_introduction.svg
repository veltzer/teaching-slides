<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="592.5926" y="73.3333" text-anchor="middle" font-size="25.679" font-weight="bold" fill="var(--text)">Bitmap: User Online Status Tracking</text>
  <text x="592.5926" y="140" text-anchor="middle" font-size="19.7531" fill="var(--text-muted)">Key: "online:2024-03-23" -- each bit = one user ID</text>
  <text x="69.1358" y="260" text-anchor="middle" font-size="19.7531" fill="var(--text)">Bit offset:</text>
  <text x="217.284" y="260" text-anchor="middle" font-size="19.7531">0</text>
  <text x="296.2963" y="260" text-anchor="middle" font-size="19.7531">1</text>
  <text x="375.3086" y="260" text-anchor="middle" font-size="19.7531">2</text>
  <text x="454.321" y="260" text-anchor="middle" font-size="19.7531">3</text>
  <text x="533.3333" y="260" text-anchor="middle" font-size="19.7531">4</text>
  <text x="612.3456" y="260" text-anchor="middle" font-size="19.7531">5</text>
  <text x="691.3581" y="260" text-anchor="middle" font-size="19.7531">6</text>
  <text x="770.3704" y="260" text-anchor="middle" font-size="19.7531">7</text>
  <rect x="177.7778" y="283.3333" width="79.0123" height="100" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="217.284" y="350" text-anchor="middle" font-size="23.7037" font-weight="bold" fill="var(--ok-accent)">1</text>
  <rect x="256.7901" y="283.3333" width="79.0123" height="100" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="296.2963" y="350" text-anchor="middle" font-size="23.7037" fill="var(--danger-accent)">0</text>
  <rect x="335.8025" y="283.3333" width="79.0123" height="100" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="375.3086" y="350" text-anchor="middle" font-size="23.7037" font-weight="bold" fill="var(--ok-accent)">1</text>
  <rect x="414.8148" y="283.3333" width="79.0123" height="100" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="454.321" y="350" text-anchor="middle" font-size="23.7037" font-weight="bold" fill="var(--ok-accent)">1</text>
  <rect x="493.8271" y="283.3333" width="79.0123" height="100" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="533.3333" y="350" text-anchor="middle" font-size="23.7037" fill="var(--danger-accent)">0</text>
  <rect x="572.8395" y="283.3333" width="79.0123" height="100" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="612.3456" y="350" text-anchor="middle" font-size="23.7037" font-weight="bold" fill="var(--ok-accent)">1</text>
  <rect x="651.8519" y="283.3333" width="79.0123" height="100" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="691.3581" y="350" text-anchor="middle" font-size="23.7037" fill="var(--danger-accent)">0</text>
  <rect x="730.8642" y="283.3333" width="79.0123" height="100" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="770.3704" y="350" text-anchor="middle" font-size="23.7037" font-weight="bold" fill="var(--ok-accent)">1</text>
  <text x="217.284" y="433.3333" text-anchor="middle" font-size="19.7531" fill="var(--ok-accent)">online</text>
  <text x="296.2963" y="433.3333" text-anchor="middle" font-size="19.7531" fill="var(--danger-accent)">offline</text>
  <text x="592.5926" y="516.6667" text-anchor="middle" font-size="19.7531" fill="var(--text)">SETBIT online:2024-03-23 0 1  -- mark user 0 as online</text>
  <text x="592.5926" y="573.3333" text-anchor="middle" font-size="19.7531" fill="var(--text)">BITCOUNT online:2024-03-23    -- returns 5 (users online)</text>
  <text x="592.5926" y="640" text-anchor="middle" font-size="19.7531" fill="var(--text-muted)">1 million users = only 125 KB of memory</text>
</svg>
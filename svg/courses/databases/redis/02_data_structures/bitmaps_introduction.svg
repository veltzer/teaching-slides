<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="796.6885" y="40" text-anchor="middle" font-size="26.2832" font-weight="bold" fill="var(--text)">Bitmap: User Online Status Tracking</text>
  <text x="796.6885" y="108.2353" text-anchor="middle" font-size="20.2179" fill="var(--text-muted)">Key: "online:2024-03-23" -- each bit = one user ID</text>
  <text x="260.9151" y="231.0588" text-anchor="middle" font-size="20.2179" fill="var(--text)">Bit offset:</text>
  <text x="412.5491" y="231.0588" text-anchor="middle" font-size="20.2179">0</text>
  <text x="493.4205" y="231.0588" text-anchor="middle" font-size="20.2179">1</text>
  <text x="574.2919" y="231.0588" text-anchor="middle" font-size="20.2179">2</text>
  <text x="655.1634" y="231.0588" text-anchor="middle" font-size="20.2179">3</text>
  <text x="736.0348" y="231.0588" text-anchor="middle" font-size="20.2179">4</text>
  <text x="816.9063" y="231.0588" text-anchor="middle" font-size="20.2179">5</text>
  <text x="897.7779" y="231.0588" text-anchor="middle" font-size="20.2179">6</text>
  <text x="978.6493" y="231.0588" text-anchor="middle" font-size="20.2179">7</text>
  <rect x="372.1134" y="254.9412" width="80.8714" height="102.3529" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="412.5491" y="323.1765" text-anchor="middle" font-size="24.2614" font-weight="bold" fill="var(--ok-accent)">1</text>
  <rect x="452.9848" y="254.9412" width="80.8714" height="102.3529" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="493.4205" y="323.1765" text-anchor="middle" font-size="24.2614" fill="var(--danger-accent)">0</text>
  <rect x="533.8563" y="254.9412" width="80.8714" height="102.3529" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="574.2919" y="323.1765" text-anchor="middle" font-size="24.2614" font-weight="bold" fill="var(--ok-accent)">1</text>
  <rect x="614.7277" y="254.9412" width="80.8714" height="102.3529" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="655.1634" y="323.1765" text-anchor="middle" font-size="24.2614" font-weight="bold" fill="var(--ok-accent)">1</text>
  <rect x="695.5991" y="254.9412" width="80.8714" height="102.3529" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="736.0348" y="323.1765" text-anchor="middle" font-size="24.2614" fill="var(--danger-accent)">0</text>
  <rect x="776.4706" y="254.9412" width="80.8714" height="102.3529" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="816.9063" y="323.1765" text-anchor="middle" font-size="24.2614" font-weight="bold" fill="var(--ok-accent)">1</text>
  <rect x="857.3421" y="254.9412" width="80.8714" height="102.3529" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="897.7779" y="323.1765" text-anchor="middle" font-size="24.2614" fill="var(--danger-accent)">0</text>
  <rect x="938.2135" y="254.9412" width="80.8714" height="102.3529" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="978.6493" y="323.1765" text-anchor="middle" font-size="24.2614" font-weight="bold" fill="var(--ok-accent)">1</text>
  <text x="412.5491" y="408.4706" text-anchor="middle" font-size="20.2179" fill="var(--ok-accent)">online</text>
  <text x="493.4205" y="408.4706" text-anchor="middle" font-size="20.2179" fill="var(--danger-accent)">offline</text>
  <text x="796.6885" y="493.7647" text-anchor="middle" font-size="20.2179" fill="var(--text)">SETBIT online:2024-03-23 0 1  -- mark user 0 as online</text>
  <text x="796.6885" y="551.7647" text-anchor="middle" font-size="20.2179" fill="var(--text)">BITCOUNT online:2024-03-23    -- returns 5 (users online)</text>
  <text x="796.6885" y="620" text-anchor="middle" font-size="20.2179" fill="var(--text-muted)">1 million users = only 125 KB of memory</text>
</svg>
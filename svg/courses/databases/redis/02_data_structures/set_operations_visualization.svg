<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="557.6471" y="40" text-anchor="middle" font-size="28.1072" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Set Operations: SINTER, SUNION, SDIFF</text>
  <ellipse cx="275.2941" cy="351.7919" rx="235.2941" ry="139.0708" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.8899" fill-opacity="0.7" />
  <ellipse cx="651.7647" cy="351.7919" rx="235.2941" ry="139.0708" fill="var(--info-fill)" stroke="var(--text)" stroke-width="3.8899" fill-opacity="0.7" />
  <text x="275.2941" y="133.8729" text-anchor="middle" font-size="23.783" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Set A</text>
  <text x="651.7647" y="133.8729" text-anchor="middle" font-size="23.783" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Set B</text>
  <text x="157.647" y="318.2659" text-anchor="middle" font-size="21.6209" font-family="Arial, sans-serif" fill="var(--text)">"alice"</text>
  <text x="157.647" y="385.3179" text-anchor="middle" font-size="21.6209" font-family="Arial, sans-serif" fill="var(--text)">"bob"</text>
  <text x="463.5294" y="318.2659" text-anchor="middle" font-size="21.6209" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">"carol"</text>
  <text x="463.5294" y="385.3179" text-anchor="middle" font-size="21.6209" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">"dave"</text>
  <text x="757.6471" y="318.2659" text-anchor="middle" font-size="21.6209" font-family="Arial, sans-serif" fill="var(--text)">"eve"</text>
  <text x="757.6471" y="385.3179" text-anchor="middle" font-size="21.6209" font-family="Arial, sans-serif" fill="var(--text)">"frank"</text>
  <rect x="934.1176" y="150.6358" width="305.8824" height="100.578" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1087.0589" y="214.3353" text-anchor="middle" font-size="21.6209" font-family="Arial, sans-serif" fill="var(--ok-text)">SINTER: carol, dave</text>
  <rect x="934.1176" y="284.7399" width="305.8824" height="100.578" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1087.0589" y="348.4393" text-anchor="middle" font-size="21.6209" font-family="Arial, sans-serif" fill="var(--warn-text)">SDIFF A B: alice, bob</text>
  <rect x="934.1176" y="418.8439" width="305.8824" height="100.578" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1087.0589" y="482.5434" text-anchor="middle" font-size="21.6209" font-family="Arial, sans-serif" fill="var(--danger-text)">SUNION: all six</text>
  <text x="463.5294" y="620" text-anchor="middle" font-size="21.6209" fill="var(--danger-accent)" font-family="Arial, sans-serif">Intersection (shared members)</text>
</svg>
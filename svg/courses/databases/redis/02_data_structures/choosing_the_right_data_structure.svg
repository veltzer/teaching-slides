<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="223.0088" height="149.677330905302" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="150.4425" y="103.612906763788" text-anchor="middle" font-size="21.701631704627" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">String</text>
  <text x="150.4425" y="156" text-anchor="middle" font-size="21.701631704627" font-family="Arial, sans-serif" fill="var(--primary-text)">simple values</text>
  <rect x="284.2477" y="40" width="223.0088" height="149.677330905302" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="394.6904" y="103.612906763788" text-anchor="middle" font-size="21.701631704627" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">List</text>
  <text x="394.6904" y="156" text-anchor="middle" font-size="21.701631704627" font-family="Arial, sans-serif" fill="var(--info-text)">ordered, queues</text>
  <rect x="528.4957" y="40" width="223.0088" height="149.677330905302" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="638.9381" y="103.612906763788" text-anchor="middle" font-size="21.701631704627" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Set</text>
  <text x="638.9381" y="156" text-anchor="middle" font-size="21.701631704627" font-family="Arial, sans-serif" fill="var(--ok-text)">unique, unordered</text>
  <rect x="772.7434" y="40" width="223.0088" height="149.677330905302" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="883.1858" y="103.612906763788" text-anchor="middle" font-size="21.701631704627" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Sorted Set</text>
  <text x="883.1858" y="156" text-anchor="middle" font-size="21.701631704627" font-family="Arial, sans-serif" fill="var(--warn-text)">ranked, scored</text>
  <rect x="1016.9912" y="40" width="223.0088" height="149.677330905302" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="1127.4338" y="103.612906763788" text-anchor="middle" font-size="21.701631704627" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Hash</text>
  <text x="1127.4338" y="156" text-anchor="middle" font-size="21.701631704627" font-family="Arial, sans-serif" fill="var(--danger-text)">objects, fields</text>
  <rect x="71.8584" y="245.806398543181" width="1146.9027" height="374.193601456819" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.283619431803"/>
  <text x="114.3363" y="320.645118834545" font-size="21.701631704627" fill="var(--text)" font-family="Arial, sans-serif">Need a counter or cache?</text>
  <text x="793.9824" y="320.645118834545" font-size="21.701631704627" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">String</text>
  <text x="114.3363" y="388" font-size="21.701631704627" fill="var(--text)" font-family="Arial, sans-serif">Need FIFO queue or recent items?</text>
  <text x="793.9824" y="388" font-size="21.701631704627" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">List</text>
  <text x="114.3363" y="455.354881165455" font-size="21.701631704627" fill="var(--text)" font-family="Arial, sans-serif">Need unique members or set operations?</text>
  <text x="793.9824" y="455.354881165455" font-size="21.701631704627" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Set</text>
  <text x="114.3363" y="522.70976233091" font-size="21.701631704627" fill="var(--text)" font-family="Arial, sans-serif">Need ranking or score-based queries?</text>
  <text x="793.9824" y="522.70976233091" font-size="21.701631704627" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Sorted Set</text>
  <text x="114.3363" y="590.06453381894" font-size="21.701631704627" fill="var(--text)" font-family="Arial, sans-serif">Need to store object with multiple fields?</text>
  <text x="793.9824" y="590.06453381894" font-size="21.701631704627" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Hash</text>
</svg>

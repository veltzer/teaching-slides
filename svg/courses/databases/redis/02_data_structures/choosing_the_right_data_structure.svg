<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Choosing the Right Data Structure</text>
  <rect x="32" y="126" width="224" height="144" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="142.9333" y="187.2" text-anchor="middle" font-size="21.3333" font-weight="bold">String</text>
  <text x="142.9333" y="237.6" text-anchor="middle" font-size="21.3333">simple values</text>
  <rect x="277.3333" y="126" width="224" height="144" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="388.2667" y="187.2" text-anchor="middle" font-size="21.3333" font-weight="bold">List</text>
  <text x="388.2667" y="237.6" text-anchor="middle" font-size="21.3333">ordered, queues</text>
  <rect x="522.6667" y="126" width="224" height="144" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="633.6" y="187.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Set</text>
  <text x="633.6" y="237.6" text-anchor="middle" font-size="21.3333">unique, unordered</text>
  <rect x="768" y="126" width="224" height="144" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="878.9333" y="187.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Sorted Set</text>
  <text x="878.9333" y="237.6" text-anchor="middle" font-size="21.3333">ranked, scored</text>
  <rect x="1013.3333" y="126" width="224" height="144" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1124.2667" y="187.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Hash</text>
  <text x="1124.2667" y="237.6" text-anchor="middle" font-size="21.3333">objects, fields</text>
  <rect x="64" y="324" width="1152" height="360" fill="#f5f5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="106.6667" y="396" font-size="21.3333" fill="#333">Need a counter or cache?</text>
  <text x="789.3333" y="396" font-size="21.3333" font-weight="bold" fill="#1565c0">String</text>
  <text x="106.6667" y="460.8" font-size="21.3333" fill="#333">Need FIFO queue or recent items?</text>
  <text x="789.3333" y="460.8" font-size="21.3333" font-weight="bold" fill="#4a148c">List</text>
  <text x="106.6667" y="525.6" font-size="21.3333" fill="#333">Need unique members or set operations?</text>
  <text x="789.3333" y="525.6" font-size="21.3333" font-weight="bold" fill="#2e7d32">Set</text>
  <text x="106.6667" y="590.4" font-size="21.3333" fill="#333">Need ranking or score-based queries?</text>
  <text x="789.3333" y="590.4" font-size="21.3333" font-weight="bold" fill="#e65100">Sorted Set</text>
  <text x="106.6667" y="655.2" font-size="21.3333" fill="#333">Need to store object with multiple fields?</text>
  <text x="789.3333" y="655.2" font-size="21.3333" font-weight="bold" fill="#c62828">Hash</text>
</svg>
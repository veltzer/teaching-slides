<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="645.3098" y="40" text-anchor="middle" font-size="26.9387" font-weight="bold" fill="var(--text)">Choosing the Right Data Structure</text>
  <rect x="40" y="91.1765" width="223.0088" height="136.4705" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="150.4425" y="149.1765" text-anchor="middle" font-size="20.7221" font-weight="bold">String</text>
  <text x="150.4425" y="196.9412" text-anchor="middle" font-size="20.7221">simple values</text>
  <rect x="284.2477" y="91.1765" width="223.0088" height="136.4705" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="394.6904" y="149.1765" text-anchor="middle" font-size="20.7221" font-weight="bold">List</text>
  <text x="394.6904" y="196.9412" text-anchor="middle" font-size="20.7221">ordered, queues</text>
  <rect x="528.4957" y="91.1765" width="223.0088" height="136.4705" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="638.9381" y="149.1765" text-anchor="middle" font-size="20.7221" font-weight="bold">Set</text>
  <text x="638.9381" y="196.9412" text-anchor="middle" font-size="20.7221">unique, unordered</text>
  <rect x="772.7434" y="91.1765" width="223.0088" height="136.4705" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="883.1858" y="149.1765" text-anchor="middle" font-size="20.7221" font-weight="bold">Sorted Set</text>
  <text x="883.1858" y="196.9412" text-anchor="middle" font-size="20.7221">ranked, scored</text>
  <rect x="1016.9912" y="91.1765" width="223.0088" height="136.4705" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1127.4338" y="149.1765" text-anchor="middle" font-size="20.7221" font-weight="bold">Hash</text>
  <text x="1127.4338" y="196.9412" text-anchor="middle" font-size="20.7221">objects, fields</text>
  <rect x="71.8584" y="278.8235" width="1146.9027" height="341.1765" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="114.3363" y="347.0588" font-size="20.7221" fill="var(--text)">Need a counter or cache?</text>
  <text x="793.9824" y="347.0588" font-size="20.7221" font-weight="bold" fill="var(--primary-accent)">String</text>
  <text x="114.3363" y="408.4706" font-size="20.7221" fill="var(--text)">Need FIFO queue or recent items?</text>
  <text x="793.9824" y="408.4706" font-size="20.7221" font-weight="bold" fill="var(--info-accent)">List</text>
  <text x="114.3363" y="469.8824" font-size="20.7221" fill="var(--text)">Need unique members or set operations?</text>
  <text x="793.9824" y="469.8824" font-size="20.7221" font-weight="bold" fill="var(--ok-accent)">Set</text>
  <text x="114.3363" y="531.2942" font-size="20.7221" fill="var(--text)">Need ranking or score-based queries?</text>
  <text x="793.9824" y="531.2942" font-size="20.7221" font-weight="bold" fill="var(--warn-accent)">Sorted Set</text>
  <text x="114.3363" y="592.7059" font-size="20.7221" fill="var(--text)">Need to store object with multiple fields?</text>
  <text x="793.9824" y="592.7059" font-size="20.7221" font-weight="bold" fill="var(--danger-accent)">Hash</text>
</svg>
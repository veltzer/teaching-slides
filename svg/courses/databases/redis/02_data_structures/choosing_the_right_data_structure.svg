<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="598.8304" y="67.3684" text-anchor="middle" font-size="25.9493" font-weight="bold" fill="#333">Choosing the Right Data Structure</ns0:text>
  <ns0:rect x="29.9415" y="117.8947" width="209.5906" height="134.7368" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="133.7388" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">String</ns0:text>
  <ns0:text x="133.7388" y="222.3158" text-anchor="middle" font-size="19.961">simple values</ns0:text>
  <ns0:rect x="259.4931" y="117.8947" width="209.5906" height="134.7368" fill="#f3e5f5" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="363.2905" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">List</ns0:text>
  <ns0:text x="363.2905" y="222.3158" text-anchor="middle" font-size="19.961">ordered, queues</ns0:text>
  <ns0:rect x="489.0449" y="117.8947" width="209.5906" height="134.7368" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="592.8421" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">Set</ns0:text>
  <ns0:text x="592.8421" y="222.3158" text-anchor="middle" font-size="19.961">unique, unordered</ns0:text>
  <ns0:rect x="718.5965" y="117.8947" width="209.5906" height="134.7368" fill="#fff3e0" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="822.3937" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">Sorted Set</ns0:text>
  <ns0:text x="822.3937" y="222.3158" text-anchor="middle" font-size="19.961">ranked, scored</ns0:text>
  <ns0:rect x="948.1481" y="117.8947" width="209.5906" height="134.7368" fill="#ffebee" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="1051.9455" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">Hash</ns0:text>
  <ns0:text x="1051.9455" y="222.3158" text-anchor="middle" font-size="19.961">objects, fields</ns0:text>
  <ns0:rect x="59.883" y="303.1579" width="1077.8947" height="336.8421" fill="#f5f5f5" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="99.8051" y="370.5263" font-size="19.961" fill="#333">Need a counter or cache?</ns0:text>
  <ns0:text x="738.5575" y="370.5263" font-size="19.961" font-weight="bold" fill="#1565c0">String</ns0:text>
  <ns0:text x="99.8051" y="431.1579" font-size="19.961" fill="#333">Need FIFO queue or recent items?</ns0:text>
  <ns0:text x="738.5575" y="431.1579" font-size="19.961" font-weight="bold" fill="#4a148c">List</ns0:text>
  <ns0:text x="99.8051" y="491.7895" font-size="19.961" fill="#333">Need unique members or set operations?</ns0:text>
  <ns0:text x="738.5575" y="491.7895" font-size="19.961" font-weight="bold" fill="#2e7d32">Set</ns0:text>
  <ns0:text x="99.8051" y="552.4211" font-size="19.961" fill="#333">Need ranking or score-based queries?</ns0:text>
  <ns0:text x="738.5575" y="552.4211" font-size="19.961" font-weight="bold" fill="#e65100">Sorted Set</ns0:text>
  <ns0:text x="99.8051" y="613.0526" font-size="19.961" fill="#333">Need to store object with multiple fields?</ns0:text>
  <ns0:text x="738.5575" y="613.0526" font-size="19.961" font-weight="bold" fill="#c62828">Hash</ns0:text>
</ns0:svg>
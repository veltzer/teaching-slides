<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="216" width="234.6667" height="162" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />

  <text x="781.8182" y="249.6923" text-anchor="middle" font-size="24.0176">job 1</text>
  <text x="629.0909" y="419.2308" text-anchor="middle" font-size="24.0176" fill="var(--text-muted)">BRPOP (blocking pop)</text>
  <rect x="978.1818" y="84.6154" width="261.8182" height="156.1538" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1109.0909" y="182.7692" text-anchor="middle" font-size="26.4194" font-weight="bold">Worker 1</text>

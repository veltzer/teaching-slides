  <text x="160" y="330" text-anchor="middle" font-size="24.0176">LPUSH job</text>
  <rect x="432.7273" y="40" width="392.7273" height="446.1538" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>

  <text x="1088" y="403.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Worker 2</text>
  <line x1="277.3333" y1="295.2" x2="426.6667" y2="295.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd7_08_integration)" />
  <line x1="810.6667" y1="259.2" x2="960" y2="208.8" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd7_08_integration)" />
  <line x1="810.6667" y1="295.2" x2="960" y2="385.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd7_08_integration)" />
  <text x="618.6667" y="576" text-anchor="middle" font-size="21.3333" fill="#333">LPUSH + BRPOP = reliable FIFO queue with blocking consumers</text>

  <text x="1109.0909" y="405.8462" text-anchor="middle" font-size="26.4194" font-weight="bold">Worker 2</text>
  <line x1="279.9999" y1="272" x2="432.7273" y2="272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd7_08_integration)" />
  <line x1="825.4546" y1="227.3846" x2="978.1818" y2="164.9231" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd7_08_integration)" />
  <line x1="825.4546" y1="272" x2="978.1818" y2="383.5385" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd7_08_integration)" />
  <text x="629.0909" y="620" text-anchor="middle" font-size="24.0176" fill="var(--text)">LPUSH + BRPOP = reliable FIFO queue with blocking consumers</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;

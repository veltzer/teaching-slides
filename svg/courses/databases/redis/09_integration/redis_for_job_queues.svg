<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="173.8462" width="240" height="200.7692" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="263.0769" text-anchor="middle" font-size="26.4194" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Producer</text>
  <text x="160" y="330" text-anchor="middle" font-size="24.0176" font-family="Arial, sans-serif" fill="var(--warn-text)">LPUSH job</text>
  <rect x="432.7273" y="40" width="392.7273" height="446.1538" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.0909" y="129.2308" text-anchor="middle" font-size="26.4194" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Redis List (Queue)</text>
  <rect x="465.4546" y="173.8462" width="109.0909" height="111.5385" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="520" y="249.6923" text-anchor="middle" font-size="24.0176" font-family="Arial, sans-serif" fill="var(--primary-text)">job 3</text>
  <rect x="596.3637" y="173.8462" width="109.0909" height="111.5385" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="650.9091" y="249.6923" text-anchor="middle" font-size="24.0176" font-family="Arial, sans-serif" fill="var(--primary-text)">job 2</text>
  <rect x="727.2727" y="173.8462" width="109.0909" height="111.5385" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="781.8182" y="249.6923" text-anchor="middle" font-size="24.0176" font-family="Arial, sans-serif" fill="var(--primary-text)">job 1</text>
  <text x="629.0909" y="419.2308" text-anchor="middle" font-size="24.0176" fill="var(--text-muted)" font-family="Arial, sans-serif">BRPOP (blocking pop)</text>
  <rect x="978.1818" y="84.6154" width="261.8182" height="156.1538" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1109.0909" y="182.7692" text-anchor="middle" font-size="26.4194" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Worker 1</text>
  <rect x="978.1818" y="307.6923" width="261.8182" height="156.1538" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1109.0909" y="405.8462" text-anchor="middle" font-size="26.4194" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Worker 2</text>
  <line x1="279.9999" y1="272" x2="432.7273" y2="272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825.4546" y1="227.3846" x2="978.1818" y2="164.9231" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825.4546" y1="272" x2="978.1818" y2="383.5385" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="629.0909" y="620" text-anchor="middle" font-size="24.0176" fill="var(--text)" font-family="Arial, sans-serif">LPUSH + BRPOP = reliable FIFO queue with blocking consumers</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

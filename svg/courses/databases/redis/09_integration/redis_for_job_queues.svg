  <text x="768" y="277.2" text-anchor="middle" font-size="21.3333">job 1</text>
  <text x="618.6667" y="414" text-anchor="middle" font-size="21.3333" fill="#666">BRPOP (blocking pop)</text>
  <rect x="960" y="144" width="256" height="126" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1088" y="223.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Worker 1</text>

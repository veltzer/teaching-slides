  <text x="170.9091" y="302.2609" text-anchor="middle" font-size="25.5359">{name, age, ...}</text>
  <rect x="454.5454" y="40" width="327.2727" height="403.4783" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="618.1818" y="140.8696" text-anchor="middle" font-size="28.0896" font-weight="bold">Serialization</text>
  <rect x="487.2727" y="176.1739" width="120" height="100.8696" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>

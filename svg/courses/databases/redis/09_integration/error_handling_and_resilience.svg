<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="193.5294" width="218.1818" height="136.4706" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="149.0909" y="278.8236" text-anchor="middle" font-size="23.1031" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">App Request</text>
  <rect x="345.4545" y="40" width="283.6364" height="153.5294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="487.2728" y="101.4118" text-anchor="middle" font-size="23.1031" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Redis OK</text>
  <text x="487.2728" y="159.4118" text-anchor="middle" font-size="21.0028" fill="var(--ok-accent)" font-family="Arial, sans-serif">Normal path</text>
  <rect x="345.4545" y="312.9411" width="283.6364" height="153.5294" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="487.2728" y="374.3529" text-anchor="middle" font-size="23.1031" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Redis Down</text>
  <text x="487.2728" y="432.3529" text-anchor="middle" font-size="21.0028" fill="var(--danger-accent)" font-family="Arial, sans-serif">Connection error</text>
  <rect x="760" y="40" width="480" height="153.5294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1000" y="101.4118" text-anchor="middle" font-size="21.0028" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Retry with backoff</text>
  <text x="1000" y="159.4118" text-anchor="middle" font-size="21.0028" font-family="Arial, sans-serif" fill="var(--primary-text)">Exponential: 100ms, 200ms, 400ms</text>
  <rect x="760" y="244.7059" width="480" height="119.4118" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1000" y="319.7647" text-anchor="middle" font-size="21.0028" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Circuit breaker: skip Redis</text>
  <rect x="760" y="415.2941" width="480" height="119.4118" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1000" y="490.3529" text-anchor="middle" font-size="21.0028" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Fallback: query DB directly</text>
  <line x1="258.1818" y1="234.4706" x2="345.4545" y2="118.4706" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="258.1818" y1="289.0588" x2="345.4545" y2="391.4117" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="629.0909" y1="391.4117" x2="760" y2="302.7059" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650.9091" y="620" text-anchor="middle" font-size="21.0028" fill="var(--text)" font-family="Arial, sans-serif">Never let Redis failure break your application</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

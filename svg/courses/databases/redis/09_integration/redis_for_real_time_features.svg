  <text x="629.0909" y="620" text-anchor="middle" font-size="21.9956" fill="var(--text)">PubSub enables chat, notifications, live updates via WebSockets</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;

  <text x="312.7272" y="176.7143" text-anchor="middle" font-size="23.1439" fill="var(--text-muted)">1. read</text>
  <line x1="552.7273" y1="247.1429" x2="552.7273" y2="412.8571" stroke="var(--text)" stroke-width="2" stroke-dasharray="8.5333 6.4" marker-end="url(#arrowd10_08_integration)" />
  <text x="607.2727" y="342.4286" text-anchor="middle" font-size="23.1439" fill="var(--danger-accent)">miss</text>
  <line x1="258.1818" y1="350.7143" x2="410.909" y2="516.4286" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrowd10_08_integration)" />
  <text x="301.8182" y="466.7143" text-anchor="middle" font-size="23.1439" fill="var(--text-muted)">write</text>
  <rect x="847.2727" y="40" width="392.7273" height="227.8571" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1043.6364" y="114.5714" text-anchor="middle" font-size="23.1439" font-weight="bold">Write-Through</text>
  <text x="1043.6364" y="185" text-anchor="middle" font-size="23.1439">Write to cache + DB</text>
  <text x="1043.6364" y="238.8571" text-anchor="middle" font-size="23.1439" fill="var(--text-muted)">together</text>
  <rect x="847.2727" y="392.1429" width="392.7273" height="227.8571" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1043.6364" y="466.7143" text-anchor="middle" font-size="23.1439" font-weight="bold">Cache-Aside</text>
  <text x="1043.6364" y="537.1429" text-anchor="middle" font-size="23.1439">App manages cache</text>
  <text x="1043.6364" y="591" text-anchor="middle" font-size="23.1439" fill="var(--text-muted)">populate on miss</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;

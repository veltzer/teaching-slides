  <text x="552.7273" y="193.2857" text-anchor="middle" font-size="23.1439">Fast reads</text>
  <rect x="410.909" y="412.8571" width="283.6363" height="207.1429" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="552.7273" y="504" text-anchor="middle" font-size="25.4584" font-weight="bold">PostgreSQL</text>

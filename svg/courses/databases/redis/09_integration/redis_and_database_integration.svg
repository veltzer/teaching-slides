<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="226.4286" width="218.1818" height="186.4286" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="149.0908" y="309.2857" text-anchor="middle" font-size="25.4584" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">App</text>
  <text x="149.0908" y="371.4286" text-anchor="middle" font-size="23.1439" font-family="Arial, sans-serif" fill="var(--warn-text)">GET/SET</text>
  <rect x="410.909" y="40" width="283.6363" height="207.1429" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="552.7273" y="131.1429" text-anchor="middle" font-size="25.4584" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Redis Cache</text>
  <text x="552.7273" y="193.2857" text-anchor="middle" font-size="23.1439" font-family="Arial, sans-serif" fill="var(--danger-text)">Fast reads</text>
  <rect x="410.909" y="412.8571" width="283.6363" height="207.1429" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="552.7273" y="504" text-anchor="middle" font-size="25.4584" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">PostgreSQL</text>
  <text x="552.7273" y="566.1429" text-anchor="middle" font-size="23.1439" font-family="Arial, sans-serif" fill="var(--ok-text)">Persistent store</text>
  <line x1="258.1818" y1="276.1429" x2="410.909" y2="143.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="312.7272" y="176.7143" text-anchor="middle" font-size="23.1439" fill="var(--text-muted)" font-family="Arial, sans-serif">1. read</text>
  <line x1="552.7273" y1="247.1429" x2="552.7273" y2="412.8571" stroke="var(--text)" stroke-width="2" stroke-dasharray="8.5333 6.4" marker-end="url(#arrow)"/>
  <text x="607.2727" y="342.4286" text-anchor="middle" font-size="23.1439" fill="var(--danger-accent)" font-family="Arial, sans-serif">miss</text>
  <line x1="258.1818" y1="350.7143" x2="410.909" y2="516.4286" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="301.8182" y="466.7143" text-anchor="middle" font-size="23.1439" fill="var(--text-muted)" font-family="Arial, sans-serif">write</text>
  <rect x="847.2727" y="40" width="392.7273" height="227.8571" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1043.6364" y="114.5714" text-anchor="middle" font-size="23.1439" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Write-Through</text>
  <text x="1043.6364" y="185" text-anchor="middle" font-size="23.1439" font-family="Arial, sans-serif" fill="var(--primary-text)">Write to cache + DB</text>
  <text x="1043.6364" y="238.8571" text-anchor="middle" font-size="23.1439" fill="var(--text-muted)" font-family="Arial, sans-serif">together</text>
  <rect x="847.2727" y="392.1429" width="392.7273" height="227.8571" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1043.6364" y="466.7143" text-anchor="middle" font-size="23.1439" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Cache-Aside</text>
  <text x="1043.6364" y="537.1429" text-anchor="middle" font-size="23.1439" font-family="Arial, sans-serif" fill="var(--info-text)">App manages cache</text>
  <text x="1043.6364" y="591" text-anchor="middle" font-size="23.1439" fill="var(--text-muted)" font-family="Arial, sans-serif">populate on miss</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

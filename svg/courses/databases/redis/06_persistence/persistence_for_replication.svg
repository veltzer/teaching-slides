<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <line x1="190.0001" y1="108.2353" x2="190.0001" y2="620" stroke="var(--text)" stroke-width="2" />
  <line x1="1090.0001" y1="108.2353" x2="1090.0001" y2="620" stroke="var(--text)" stroke-width="2" />
  <rect x="40" y="40" width="300" height="136.4706" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <rect x="940" y="40" width="300" height="136.4706" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="190.0001" y="125.2941" text-anchor="middle" font-size="33.0419">Actor A</text>
  <text x="1090.0001" y="125.2941" text-anchor="middle" font-size="33.0419">Actor B</text>
  <line x1="190.0001" y1="278.8236" x2="1090.0001" y2="278.8236" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd11_05_persistence)" />
  <line x1="1090.0001" y1="449.4118" x2="190.0001" y2="449.4118" stroke="var(--text)" stroke-width="2" stroke-dasharray="10.6667 10.6667" marker-end="url(#arrowd11_05_persistence)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;

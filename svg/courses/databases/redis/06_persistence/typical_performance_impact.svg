<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="214.2857" height="486.451627055152" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="147.1428" y="114.838720291364" text-anchor="middle" font-size="21.798294716886" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">None</text>
  <rect x="72.1428" y="152.258135275758" width="150" height="336.774186472424" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="147.1428" y="339.35477148803" text-anchor="middle" font-size="21.798294716886" font-family="Arial, sans-serif" fill="var(--ok-text)">0%</text>
  <rect x="297.1428" y="40" width="214.2857" height="486.451627055152" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="404.2856" y="114.838720291364" text-anchor="middle" font-size="21.798294716886" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">RDB</text>
  <rect x="329.2856" y="227.096745889697" width="150" height="261.93546618106" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="404.2856" y="376.774186472424" text-anchor="middle" font-size="21.798294716886" font-family="Arial, sans-serif" fill="var(--primary-text)">~2-5%</text>
  <rect x="554.2857" y="40" width="214.2857" height="486.451627055152" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="661.4285" y="114.838720291364" text-anchor="middle" font-size="21.798294716886" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">AOF/sec</text>
  <rect x="586.4286" y="189.677440582728" width="150" height="299.354881165455" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="661.4285" y="358.06453381894" text-anchor="middle" font-size="21.798294716886" font-family="Arial, sans-serif" fill="var(--warn-text)">~5-15%</text>
  <rect x="811.4285" y="40" width="214.2857" height="486.451627055152" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="918.5714" y="114.838720291364" text-anchor="middle" font-size="21.798294716886" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">AOF/always</text>
  <rect x="843.5715" y="133.548372944848" width="150" height="355.483839125909" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="918.5714" y="339.35477148803" text-anchor="middle" font-size="21.798294716886" font-family="Arial, sans-serif" fill="var(--danger-text)">~30-50%</text>
  <rect x="1068.5714" y="40" width="171.4286" height="486.451627055152" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="1154.2857" y="114.838720291364" text-anchor="middle" font-size="21.798294716886" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Hybrid</text>
  <rect x="1090" y="208.387093236212" width="128.5715" height="280.64522851197" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.283619431803" filter="url(#shadow)"/>
  <text x="1154.2857" y="365.548372944848" text-anchor="middle" font-size="21.798294716886" font-family="Arial, sans-serif" fill="var(--info-text)">~5-15%</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="21.798294716886" font-family="Arial, sans-serif" fill="var(--text)">Approximate throughput reduction (write-heavy workload)</text>
</svg>

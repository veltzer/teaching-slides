  <rect x="884.4445" y="40" width="355.5555" height="193.3334" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1062.2221" y="117.3333" text-anchor="middle" font-size="23.6667" font-weight="bold">Master C</text>
  <text x="1062.2221" y="180.6061" text-anchor="middle" font-size="21.5151">Slots 10923-16383</text>
  <rect x="84.4444" y="303.6363" width="266.6666" height="123.0303" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="217.7778" y="380.9697" text-anchor="middle" font-size="21.5151">RDB + AOF</text>
  <rect x="506.6666" y="303.6363" width="266.6666" height="123.0303" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="380.9697" text-anchor="middle" font-size="21.5151">RDB + AOF</text>
  <rect x="928.8888" y="303.6363" width="266.6666" height="123.0303" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1062.2221" y="380.9697" text-anchor="middle" font-size="21.5151">RDB + AOF</text>
  <rect x="106.6667" y="479.3939" width="1066.6666" height="140.6061" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="539.1515" text-anchor="middle" font-size="21.5151">Each node persists independently -- coordinate backups cluster-wide</text>
  <text x="639.9999" y="595.394" text-anchor="middle" font-size="21.5151">Use consistent persistence config across all nodes</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="64" y="54" width="341.3333" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="234.6667" y="136.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Parent Process</text>
  <text x="234.6667" y="198" text-anchor="middle" font-size="21.3333">Shared memory</text>
  <text x="234.6667" y="259.2" text-anchor="middle" font-size="21.3333">pages: A B C D</text>
  <rect x="64" y="378" width="341.3333" height="252" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="234.6667" y="460.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Child Process</text>
  <text x="234.6667" y="522" text-anchor="middle" font-size="21.3333">Reads shared pages</text>
  <text x="234.6667" y="583.2" text-anchor="middle" font-size="21.3333">for RDB dump</text>
  <line x1="426.6667" y1="180" x2="597.3333" y2="180" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd7_05_persistence)" />
  <text x="512" y="154.8" font-size="21.3333">write to A</text>
  <rect x="618.6667" y="54" width="277.3333" height="252" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="757.3333" y="136.8" text-anchor="middle" font-size="23.4667" font-weight="bold">COW Copy</text>
  <text x="757.3333" y="198" text-anchor="middle" font-size="21.3333">Page A copied</text>
  <text x="757.3333" y="259.2" text-anchor="middle" font-size="21.3333">before write</text>
  <rect x="938.6667" y="54" width="298.6667" height="252" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1088" y="136.8" text-anchor="middle" font-size="21.3333">B, C, D still shared</text>
  <text x="1088" y="198" text-anchor="middle" font-size="21.3333">Memory efficient</text>
  <text x="1088" y="259.2" text-anchor="middle" font-size="21.3333">until modified</text>
  <rect x="618.6667" y="396" width="618.6667" height="198" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="928" y="475.2" text-anchor="middle" font-size="21.3333">Peak memory = base + modified pages only</text>
  <text x="928" y="540" text-anchor="middle" font-size="21.3333">High write load = more COW memory usage</text>
  <defs>
    <marker id="arrowd7_05_persistence" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
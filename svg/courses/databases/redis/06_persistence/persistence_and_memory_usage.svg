<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="349.0909" height="253.75" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="214.5455" y="123.375" text-anchor="middle" font-size="23.8141" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Parent Process</text>
  <text x="214.5455" y="185" text-anchor="middle" font-size="21.6491" font-family="Arial, sans-serif" fill="var(--primary-text)">Shared memory</text>
  <text x="214.5455" y="246.625" text-anchor="middle" font-size="21.6491" font-family="Arial, sans-serif" fill="var(--primary-text)">pages: A B C D</text>
  <rect x="40" y="366.25" width="349.0909" height="253.75" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="214.5455" y="449.625" text-anchor="middle" font-size="23.8141" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Child Process</text>
  <text x="214.5455" y="511.25" text-anchor="middle" font-size="21.6491" font-family="Arial, sans-serif" fill="var(--warn-text)">Reads shared pages</text>
  <text x="214.5455" y="572.875" text-anchor="middle" font-size="21.6491" font-family="Arial, sans-serif" fill="var(--warn-text)">for RDB dump</text>
  <line x1="410.9091" y1="166.875" x2="585.4545" y2="166.875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="498.1818" y="141.5" font-size="21.6491" font-family="Arial, sans-serif" fill="var(--text)">write to A</text>
  <rect x="607.2727" y="40" width="283.6363" height="253.75" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="749.0908" y="123.375" text-anchor="middle" font-size="23.8141" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">COW Copy</text>
  <text x="749.0908" y="185" text-anchor="middle" font-size="21.6491" font-family="Arial, sans-serif" fill="var(--danger-text)">Page A copied</text>
  <text x="749.0908" y="246.625" text-anchor="middle" font-size="21.6491" font-family="Arial, sans-serif" fill="var(--danger-text)">before write</text>
  <rect x="934.5454" y="40" width="305.4546" height="253.75" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1087.2727" y="123.375" text-anchor="middle" font-size="21.6491" font-family="Arial, sans-serif" fill="var(--ok-text)">B, C, D still shared</text>
  <text x="1087.2727" y="185" text-anchor="middle" font-size="21.6491" font-family="Arial, sans-serif" fill="var(--ok-text)">Memory efficient</text>
  <text x="1087.2727" y="246.625" text-anchor="middle" font-size="21.6491" font-family="Arial, sans-serif" fill="var(--ok-text)">until modified</text>
  <rect x="607.2727" y="384.375" width="632.7273" height="199.375" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="923.6363" y="464.125" text-anchor="middle" font-size="21.6491" font-family="Arial, sans-serif" fill="var(--info-text)">Peak memory = base + modified pages only</text>
  <text x="923.6363" y="529.375" text-anchor="middle" font-size="21.6491" font-family="Arial, sans-serif" fill="var(--info-text)">High write load = more COW memory usage</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
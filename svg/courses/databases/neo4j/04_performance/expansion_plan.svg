<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Expansion Plan and Selectivity</text>

  <rect x="40" y="102.142857142857" width="1200" height="82.857142857143" rx="10.534200859823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--info-text)">MATCH (a:Person)-[:WORKS_AT]-&gt;(c:Company) WHERE a.name = "Alice"</text>
  <text x="640" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">Index on Person.name → start at the matching node</text>

  <rect x="40" y="205.714285714286" width="578.571428571429" height="207.142857142857" rx="10.534200859823" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--ok-text)">Good plan</text>
  <text x="61.428571428571" y="278.214285714286" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--ok-text)">1. Index seek: Person(name="Alice")</text>
  <text x="61.428571428571" y="304.107142857143" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--ok-text)">2. Returns 1 node</text>
  <text x="61.428571428571" y="330" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--ok-text)">3. Expand WORKS_AT (1-3 edges)</text>
  <text x="61.428571428571" y="355.892857142857" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--ok-text)">4. Reach 1-3 companies</text>
  <text x="329.285714285714" y="392.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-text)">~5 graph hits</text>

  <rect x="661.428571428571" y="205.714285714286" width="578.571428571429" height="207.142857142857" rx="10.534200859823" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--danger-text)">Bad plan</text>
  <text x="682.857142857143" y="278.214285714286" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--danger-text)">1. Label scan: all Companies</text>
  <text x="682.857142857143" y="304.107142857143" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--danger-text)">2. Returns 100k nodes</text>
  <text x="682.857142857143" y="330" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--danger-text)">3. Expand WORKS_AT inverse (each)</text>
  <text x="682.857142857143" y="355.892857142857" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--danger-text)">4. Filter for "Alice" at end</text>
  <text x="950.714285714286" y="392.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--danger-text)">~10M graph hits</text>

  <rect x="40" y="443.928571428571" width="1200" height="176.071428571429" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Profile</text>
  <text x="61.428571428571" y="506.071428571429" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">PROFILE shows actual db hits per operator</text>
  <text x="61.428571428571" y="531.964285714286" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">EXPLAIN shows planned operators without execution</text>
  <text x="61.428571428571" y="557.857142857143" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">Always start at the most selective node</text>
  <text x="61.428571428571" y="591" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--danger-accent)">Missing index on lookup column = label scan</text>
</svg>

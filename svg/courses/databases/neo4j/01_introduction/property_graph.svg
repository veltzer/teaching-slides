<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.982753492379" font-weight="bold" fill="var(--text)">Property Graph Model</text>

  <rect x="184.827586206897" y="164.285714285714" width="186.206896551724" height="103.571428571429" rx="51.754916950677" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="277.931034482759" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--primary-text)">:Person</text>
  <text x="277.931034482759" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--primary-text)">name: Alice</text>
  <text x="277.931034482759" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--primary-text)">age: 30</text>

  <rect x="702.068965517241" y="164.285714285714" width="186.206896551724" height="103.571428571429" rx="51.754916950677" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795.172413793103" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--primary-text)">:Person</text>
  <text x="795.172413793103" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--primary-text)">name: Bob</text>
  <text x="795.172413793103" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--primary-text)">age: 28</text>

  <rect x="960.689655172414" y="371.428571428571" width="186.206896551724" height="103.571428571429" rx="51.754916950677" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.793103448276" y="407.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--ok-text)">:Company</text>
  <text x="1053.793103448276" y="433.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--ok-text)">name: Acme</text>
  <text x="1053.793103448276" y="454.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--ok-text)">founded: 2010</text>

  <rect x="443.448275862069" y="371.428571428571" width="186.206896551724" height="103.571428571429" rx="51.754916950677" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="536.551724137931" y="407.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--info-text)">:Skill</text>
  <text x="536.551724137931" y="433.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">name: Python</text>
  <text x="536.551724137931" y="454.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">level: expert</text>

  <path d="M 371.034482758621 216.071428571429 L 702.068965517241 216.071428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="536.551724137931" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--text)">:KNOWS</text>
  <text x="536.551724137931" y="238.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386081729149" fill="var(--text-muted)">since: 2018</text>

  <path d="M 277.931034482759 267.857142857143 L 474.48275862069 371.428571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="324.821428571429" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--text)">:HAS_SKILL</text>

  <path d="M 888.275862068966 267.857142857143 L 1002.068965517241 371.428571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="908.965517241379" y="335.178571428571" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--text)">:WORKS_AT</text>
  <text x="903.793103448276" y="352.785714285714" font-family="Arial, sans-serif" font-size="11.386081729149" fill="var(--text-muted)">role: engineer</text>

  <path d="M 629.655172413793 423.214285714286 L 960.689655172414 423.214285714286" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795.172413793103" y="412.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--text)">:USES</text>

  <rect x="40" y="537.142857142857" width="558.620689655172" height="82.857142857143" rx="8.280786712108" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="319.310344827586" y="566.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--text)">Nodes</text>
  <text x="319.310344827586" y="588.928571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">Labels (:Person, :Skill) + properties</text>
  <text x="319.310344827586" y="609.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">First-class entities, queryable directly</text>

  <rect x="681.379310344828" y="537.142857142857" width="558.620689655172" height="82.857142857143" rx="8.280786712108" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="960.689655172414" y="566.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--text)">Relationships</text>
  <text x="960.689655172414" y="588.928571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">Typed (:KNOWS), directed, with properties</text>
  <text x="960.689655172414" y="609.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">Index-free adjacency = constant-time traversal</text>
</svg>

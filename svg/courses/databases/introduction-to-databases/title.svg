<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Introduction to Databases</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Relational, NoSQL, choosing</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <text x="430" y="225" font-size="18" font-weight="bold" fill="var(--text-faint)">Relational</text>
  <text x="1015" y="225" font-size="18" font-weight="bold" fill="var(--text-faint)">Document</text>
  <rect x="110" y="250" width="260" height="40" fill="var(--primary-fill)"/>
  <text x="240" y="277" font-size="18" font-weight="bold" fill="var(--primary-text)">users</text>
  <rect x="110" y="290" width="260" height="40" fill="var(--primary-accent)"/>
  <text x="145" y="317" font-size="16" fill="var(--primary-text)">id</text>
  <text x="275" y="317" font-size="16" fill="var(--primary-text)">name</text>
  <rect x="110" y="330" width="260" height="80" fill="var(--surface)" stroke="var(--border)"/>
  <line x1="110" y1="370" x2="370" y2="370" stroke="var(--border)"/>
  <line x1="180" y1="330" x2="180" y2="410" stroke="var(--border)"/>
  <text x="145" y="357" font-size="16" fill="var(--text)">1</text>
  <text x="275" y="357" font-size="16" fill="var(--text)">Ada</text>
  <text x="145" y="397" font-size="16" fill="var(--text)">2</text>
  <text x="275" y="397" font-size="16" fill="var(--text)">Linus</text>
  <rect x="490" y="250" width="260" height="40" fill="var(--info-fill)"/>
  <text x="620" y="277" font-size="18" font-weight="bold" fill="var(--info-text)">orders</text>
  <rect x="490" y="290" width="260" height="40" fill="var(--info-accent)"/>
  <text x="520" y="317" font-size="16" fill="var(--info-text)">id</text>
  <text x="605" y="317" font-size="16" fill="var(--info-text)">user_id</text>
  <text x="705" y="317" font-size="16" fill="var(--info-text)">total</text>
  <rect x="490" y="330" width="260" height="80" fill="var(--surface)" stroke="var(--border)"/>
  <line x1="490" y1="370" x2="750" y2="370" stroke="var(--border)"/>
  <line x1="550" y1="330" x2="550" y2="410" stroke="var(--border)"/>
  <line x1="660" y1="330" x2="660" y2="410" stroke="var(--border)"/>
  <text x="520" y="357" font-size="16" fill="var(--text)">10</text>
  <text x="605" y="357" font-size="16" fill="var(--text)">1</text>
  <text x="705" y="357" font-size="16" fill="var(--text)">42</text>
  <text x="520" y="397" font-size="16" fill="var(--text)">11</text>
  <text x="605" y="397" font-size="16" fill="var(--text)">2</text>
  <text x="705" y="397" font-size="16" fill="var(--text)">17</text>
  <path d="M605,412 V450 H145 V424" fill="none" stroke="var(--warn-fill)" stroke-width="3" stroke-dasharray="8 5"/>
  <polygon points="137,426 145,412 153,426" fill="var(--warn-fill)"/>
  <text x="375" y="478" font-size="16" fill="var(--warn-fill)">foreign key</text>
  <rect x="850" y="250" width="330" height="210" rx="10" fill="none" stroke="var(--ok-border)" stroke-width="2"/>
  <g font-family="Courier New, monospace" font-size="18" text-anchor="start" fill="var(--surface)">
    <text x="872" y="288">{</text>
    <text x="894" y="318"><tspan fill="var(--ok-fill)">"name"</tspan>: "Ada",</text>
    <text x="894" y="348"><tspan fill="var(--ok-fill)">"orders"</tspan>: [</text>
    <text x="916" y="378">{<tspan fill="var(--ok-fill)">"id"</tspan>: 10,</text>
    <text x="927" y="408"><tspan fill="var(--ok-fill)">"total"</tspan>: 42}</text>
    <text x="894" y="438">]}</text>
  </g>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">schemas • SQL • NoSQL • ORMs</text>
</svg>

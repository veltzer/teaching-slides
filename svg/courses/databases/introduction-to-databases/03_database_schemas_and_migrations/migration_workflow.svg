<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.854226236055" font-weight="bold" fill="var(--text)">Database Migration Workflow</text>

  <rect x="40" y="86.194690265487" width="227.586206896552" height="102.654867256637" rx="8.244064638873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.793103448276" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--info-text)">1. Write</text>
  <text x="153.793103448276" y="147.787610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">SQL file:</text>
  <text x="153.793103448276" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">2024_01_add_email.sql</text>

  <path d="M 269.655172413793 137.522123893805 L 311.034482758621 137.522123893805" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="319.310344827586" y="86.194690265487" width="227.586206896552" height="102.654867256637" rx="8.244064638873" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="433.103448275862" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--primary-text)">2. Test</text>
  <text x="433.103448275862" y="147.787610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">CI runs against</text>
  <text x="433.103448275862" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">copy of prod schema</text>

  <path d="M 548.965517241379 137.522123893805 L 590.344827586207 137.522123893805" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="598.620689655172" y="86.194690265487" width="227.586206896552" height="102.654867256637" rx="8.244064638873" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="712.413793103448" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--warn-text)">3. Deploy</text>
  <text x="712.413793103448" y="147.787610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--warn-text)">Run migration before</text>
  <text x="712.413793103448" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--warn-text)">app deploy</text>

  <path d="M 828.275862068966 137.522123893805 L 869.655172413793 137.522123893805" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="877.931034482759" y="86.194690265487" width="227.586206896552" height="102.654867256637" rx="8.244064638873" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.724137931035" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--ok-text)">4. Track</text>
  <text x="991.724137931035" y="147.787610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">schema_migrations</text>
  <text x="991.724137931035" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">table records run IDs</text>

  <rect x="40" y="229.911504424779" width="579.310344827586" height="184.778761061947" rx="10.305080798591" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="265.840707964602" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--ok-text)">Safe changes</text>
  <text x="60.689655172414" y="296.637168141593" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">- Add nullable column</text>
  <text x="60.689655172414" y="322.300884955752" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">- Add index CONCURRENTLY</text>
  <text x="60.689655172414" y="347.964601769912" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">- Add new table</text>
  <text x="60.689655172414" y="373.628318584071" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">- Backfill in batches</text>

  <rect x="660.689655172414" y="229.911504424779" width="579.310344827586" height="184.778761061947" rx="10.305080798591" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="265.840707964602" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--danger-text)">Risky changes</text>
  <text x="681.379310344828" y="296.637168141593" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--danger-text)">- ALTER TABLE locks (Postgres ok-ish, MySQL ouch)</text>
  <text x="681.379310344828" y="322.300884955752" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--danger-text)">- Rename column (breaks running app)</text>
  <text x="681.379310344828" y="347.964601769912" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--danger-text)">- Drop column / table</text>
  <text x="681.379310344828" y="373.628318584071" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--danger-text)">- NOT NULL on big table</text>

  <rect x="40" y="445.486725663717" width="1200" height="174.513274336283" rx="10.305080798591" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="481.41592920354" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--text)">Expand-contract pattern</text>
  <text x="640" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text-muted)">1. Expand: add new, write both</text>
  <text x="640" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text-muted)">2. Backfill</text>
  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text-muted)">3. Switch reads, then drop old</text>
</svg>

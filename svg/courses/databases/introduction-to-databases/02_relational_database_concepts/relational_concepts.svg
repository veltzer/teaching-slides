<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.113013714962" font-weight="bold" fill="var(--text)">Relational Concepts</text>

  <rect x="40" y="87.027027027027" width="558.620689655172" height="313.513513513513" rx="10.397504898201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="319.310344827586" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--primary-text)">customers</text>
  <line x1="60.689655172414" y1="144.504504504504" x2="577.931034482759" y2="144.504504504504" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="81.379310344828" y="170.630630630631" font-family="Arial, sans-serif" font-size="13.516756367661" font-weight="bold" fill="var(--primary-text)">id (PK)</text>
  <text x="226.206896551724" y="170.630630630631" font-family="Arial, sans-serif" font-size="13.516756367661" font-weight="bold" fill="var(--primary-text)">name</text>
  <text x="371.034482758621" y="170.630630630631" font-family="Arial, sans-serif" font-size="13.516756367661" font-weight="bold" fill="var(--primary-text)">email</text>
  <line x1="60.689655172414" y1="186.306306306306" x2="577.931034482759" y2="186.306306306306" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="81.379310344828" y="212.432432432432" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">1</text>
  <text x="226.206896551724" y="212.432432432432" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">Alice</text>
  <text x="371.034482758621" y="212.432432432432" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">a@x.com</text>
  <text x="81.379310344828" y="243.783783783784" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">2</text>
  <text x="226.206896551724" y="243.783783783784" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">Bob</text>
  <text x="371.034482758621" y="243.783783783784" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">b@x.com</text>
  <text x="60.689655172414" y="316.936936936937" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--primary-text)">Row = entity. PK is unique.</text>
  <text x="60.689655172414" y="358.738738738739" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--primary-text)">Column = attribute. Type fixed.</text>

  <rect x="660.689655172414" y="87.027027027027" width="579.310344827586" height="313.513513513513" rx="10.397504898201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--ok-text)">orders</text>
  <line x1="681.379310344828" y1="144.504504504504" x2="1219.310344827586" y2="144.504504504504" stroke="var(--ok-text)" stroke-width="1"/>
  <text x="702.068965517241" y="170.630630630631" font-family="Arial, sans-serif" font-size="13.516756367661" font-weight="bold" fill="var(--ok-text)">id (PK)</text>
  <text x="857.241379310345" y="170.630630630631" font-family="Arial, sans-serif" font-size="13.516756367661" font-weight="bold" fill="var(--ok-text)">customer_id (FK)</text>
  <text x="1095.172413793103" y="170.630630630631" font-family="Arial, sans-serif" font-size="13.516756367661" font-weight="bold" fill="var(--ok-text)">total</text>
  <line x1="681.379310344828" y1="186.306306306306" x2="1219.310344827586" y2="186.306306306306" stroke="var(--ok-text)" stroke-width="1"/>
  <text x="702.068965517241" y="212.432432432432" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">100</text>
  <text x="857.241379310345" y="212.432432432432" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">1</text>
  <text x="1095.172413793103" y="212.432432432432" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">49.99</text>
  <text x="702.068965517241" y="243.783783783784" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">101</text>
  <text x="857.241379310345" y="243.783783783784" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">2</text>
  <text x="1095.172413793103" y="243.783783783784" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">29.50</text>
  <text x="702.068965517241" y="275.135135135135" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">102</text>
  <text x="857.241379310345" y="275.135135135135" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">1</text>
  <text x="1095.172413793103" y="275.135135135135" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">12.00</text>
  <text x="681.379310344828" y="327.387387387387" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--ok-text)">FK references customers.id</text>
  <text x="681.379310344828" y="358.738738738739" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--ok-text)">DB enforces it exists</text>

  <path d="M 184.827586206897 264.684684684685 Q 112.413793103448 379.63963963964 702.068965517241 233.333333333333" stroke="var(--text)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="431.891891891892" width="1200" height="188.108108108108" rx="10.397504898201" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--text)">Core ideas</text>
  <text x="81.379310344828" y="505.045045045045" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">Schema: types and constraints declared up front. SQL queries declarative.</text>
  <text x="81.379310344828" y="531.171171171171" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">Joins: combine rows by matching keys. Indexes: speed lookups by column.</text>
  <text x="81.379310344828" y="557.297297297297" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">Transactions: ACID. Normalization: avoid duplicating data.</text>
  <text x="640" y="604.324324324324" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--text-muted)">Postgres, MySQL, SQL Server, Oracle, SQLite</text>
</svg>

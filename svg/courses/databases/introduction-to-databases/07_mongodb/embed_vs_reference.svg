<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Embed vs Reference in MongoDB</text>
  <rect x="40" y="80" width="600" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="340" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Embed</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Sub-document inside parent</text>
  <text x="60" y="195" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">One read fetches everything</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Atomic updates on parent</text>
  <text x="60" y="265" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Bounded child count</text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Best when:</text>
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Order with line items</text>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Blog post with comments</text>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Always read together</text>
  <text x="60" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Watch out for:</text>
  <text x="60" y="495" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Unbounded array growth</text>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--info-text)">Read-heavy, locality matters</text>
  <rect x="660" y="80" width="580" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="950" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Reference</text>
  <text x="680" y="160" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Store identifier, not body</text>
  <text x="680" y="195" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Lookup or aggregation join</text>
  <text x="680" y="230" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">No size limits</text>
  <text x="680" y="265" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Independent updates</text>
  <text x="680" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Best when:</text>
  <text x="680" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">User has many posts</text>
  <text x="680" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Shared catalogue records</text>
  <text x="680" y="410" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Independent lifecycles</text>
  <text x="680" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Watch out for:</text>
  <text x="680" y="495" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Many round trips per query</text>
  <text x="680" y="540" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--primary-text)">Write-heavy, scale matters</text>
</svg>

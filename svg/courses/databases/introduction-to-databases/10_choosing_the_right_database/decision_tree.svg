<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.369246717036" font-weight="bold" fill="var(--text)">Choosing a Database</text>

  <rect x="540" y="75.929203539823" width="200" height="61.592920353982" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="111.858407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--primary-text)">Need ACID transactions?</text>

  <path d="M 540 106.725663716814 L 320 188.849557522124" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="158.053097345133" font-family="Arial, sans-serif" font-size="13.171435975767" font-weight="bold" fill="var(--ok-fill)">yes</text>
  <path d="M 740 106.725663716814 L 960 188.849557522124" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="158.053097345133" font-family="Arial, sans-serif" font-size="13.171435975767" font-weight="bold" fill="var(--warn-fill)">no</text>

  <rect x="220" y="188.849557522124" width="200" height="61.592920353982" rx="8.10549906201" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="224.778761061947" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--info-text)">Relational shape?</text>

  <path d="M 220 219.646017699115 L 100 312.035398230089" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 420 219.646017699115 L 480 312.035398230089" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="312.035398230089" width="180" height="102.654867256637" rx="8.10549906201" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="130" y="347.964601769912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)">Postgres / MySQL</text>
  <text x="130" y="373.628318584071" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">Default choice</text>
  <text x="130" y="396.212389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">for OLTP</text>

  <rect x="380" y="312.035398230089" width="200" height="102.654867256637" rx="8.10549906201" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="480" y="347.964601769912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)">Spanner / Cockroach</text>
  <text x="480" y="373.628318584071" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">Distributed SQL</text>
  <text x="480" y="396.212389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">global scale</text>

  <rect x="860" y="188.849557522124" width="200" height="61.592920353982" rx="8.10549906201" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="224.778761061947" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--info-text)">What shape?</text>

  <path d="M 860 219.646017699115 L 720 312.035398230089" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="270.973451327434" font-family="Arial, sans-serif" font-size="11.145061210264" fill="var(--text-muted)">docs</text>
  <path d="M 920 250.442477876106 L 920 312.035398230089" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="930" y="281.238938053097" font-family="Arial, sans-serif" font-size="11.145061210264" fill="var(--text-muted)">key/val</text>
  <path d="M 1060 219.646017699115 L 1180 312.035398230089" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1130" y="270.973451327434" font-family="Arial, sans-serif" font-size="11.145061210264" fill="var(--text-muted)">timeseries</text>

  <rect x="660" y="312.035398230089" width="120" height="102.654867256637" rx="8.10549906201" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="720" y="347.964601769912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--warn-text)">Mongo</text>
  <text x="720" y="373.628318584071" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--warn-text)">DynamoDB</text>

  <rect x="820" y="312.035398230089" width="180" height="102.654867256637" rx="8.10549906201" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="910" y="347.964601769912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--warn-text)">Redis</text>
  <text x="910" y="373.628318584071" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--warn-text)">DynamoDB, etcd</text>

  <rect x="1040" y="312.035398230089" width="200" height="102.654867256637" rx="8.10549906201" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="1140" y="347.964601769912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--warn-text)">InfluxDB</text>
  <text x="1140" y="373.628318584071" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--warn-text)">TimescaleDB</text>

  <rect x="60" y="455.752212389381" width="1160" height="164.247787610619" rx="10.131873827513" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="491.681415929204" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--text)">When in doubt: Postgres</text>
  <text x="640" y="522.477876106195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--text-muted)">Handles JSON, geo, full-text, time-series adequately</text>
  <text x="640" y="553.274336283186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--text-muted)">"Use Postgres until it breaks" — saves choice paralysis</text>
  <text x="640" y="589.203539823009" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--text-muted)">Optimize databases per workload only when one DB stops fitting</text>
</svg>

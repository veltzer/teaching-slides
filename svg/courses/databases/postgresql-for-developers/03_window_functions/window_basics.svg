<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Window Functions</text>

  <rect x="40" y="87.889908256881" width="579.310344827586" height="255.412844036697" rx="10.49246125174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--info-text)">GROUP BY collapses</text>
  <rect x="60.689655172414" y="146.422018348624" width="537.931034482759" height="170.275229357798" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="81.379310344828" y="178.348623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">SELECT dept, AVG(salary)</text>
  <text x="81.379310344828" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">FROM employees GROUP BY dept;</text>
  <text x="81.379310344828" y="242.201834862385" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text-muted)">-- one row per dept</text>
  <text x="81.379310344828" y="274.128440366972" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text-muted)">eng | 80000</text>
  <text x="81.379310344828" y="295.412844036697" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text-muted)">sales | 65000</text>

  <rect x="660.689655172414" y="87.889908256881" width="579.310344827586" height="255.412844036697" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-with="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--ok-text)">Window keeps rows</text>
  <rect x="681.379310344828" y="146.422018348624" width="537.931034482759" height="170.275229357798" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="702.068965517241" y="178.348623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">SELECT name, salary,</text>
  <text x="702.068965517241" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">  AVG(salary) OVER (PARTITION BY dept)</text>
  <text x="702.068965517241" y="231.559633027523" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">FROM employees;</text>
  <text x="702.068965517241" y="268.807339449541" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text-muted)">-- all rows + dept avg alongside</text>
  <text x="702.068965517241" y="295.412844036697" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text-muted)">Alice | 90000 | 80000</text>

  <rect x="40" y="385.871559633028" width="382.758620689655" height="234.128440366972" rx="10.49246125174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="423.119266055046" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--primary-text)">Ranking</text>
  <text x="60.689655172414" y="460.366972477064" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">ROW_NUMBER()</text>
  <text x="60.689655172414" y="486.97247706422" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">RANK()  DENSE_RANK()</text>
  <text x="60.689655172414" y="524.220183486239" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">NTILE(4) -- quartiles</text>
  <text x="60.689655172414" y="572.110091743119" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--primary-text)">Top-N per group</text>

  <rect x="448.620689655172" y="385.871559633028" width="382.758620689655" height="234.128440366972" rx="10.49246125174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="423.119266055046" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--warn-text)">Offset</text>
  <text x="469.310344827586" y="460.366972477064" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">LAG(col)  LEAD(col)</text>
  <text x="469.310344827586" y="486.97247706422" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">FIRST_VALUE  LAST_VALUE</text>
  <text x="469.310344827586" y="524.220183486239" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Diff to previous row</text>
  <text x="469.310344827586" y="572.110091743119" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--warn-text)">Time-series deltas</text>

  <rect x="857.241379310345" y="385.871559633028" width="382.758620689655" height="234.128440366972" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="423.119266055046" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--ok-text)">Aggregate</text>
  <text x="877.931034482759" y="460.366972477064" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">SUM/AVG/COUNT OVER ()</text>
  <text x="877.931034482759" y="486.97247706422" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Running totals</text>
  <text x="877.931034482759" y="524.220183486239" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Moving averages</text>
  <text x="877.931034482759" y="572.110091743119" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--ok-text)">ROWS BETWEEN ...</text>
</svg>

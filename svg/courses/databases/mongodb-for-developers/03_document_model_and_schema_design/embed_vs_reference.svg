<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.245046200557" font-weight="bold" fill="var(--text)">Embed vs Reference</text>

  <rect x="40" y="82.181818181818" width="579.310344827586" height="537.818181818182" rx="10.444659357342" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--ok-text)">Embed</text>

  <rect x="60.689655172414" y="145.454545454545" width="537.931034482759" height="232" rx="6.266795614405" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="81.379310344828" y="177.090909090909" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">{ "_id": 1,</text>
  <text x="81.379310344828" y="203.454545454545" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">  "name": "Alice",</text>
  <text x="81.379310344828" y="229.818181818182" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">  "email": "a@x.com",</text>
  <text x="81.379310344828" y="256.181818181818" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-fill)">  "addresses": [</text>
  <text x="81.379310344828" y="282.545454545455" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-fill)">    {"city": "NYC", "zip": "10001"},</text>
  <text x="81.379310344828" y="308.909090909091" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-fill)">    {"city": "SF",  "zip": "94101"}</text>
  <text x="81.379310344828" y="335.272727272727" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-fill)">  ]</text>
  <text x="81.379310344828" y="361.636363636364" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">}</text>

  <text x="60.689655172414" y="419.636363636364" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--ok-text)">When:</text>
  <text x="60.689655172414" y="446" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">- One-to-few, bounded</text>
  <text x="60.689655172414" y="472.363636363636" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">- Read together always</text>
  <text x="60.689655172414" y="498.727272727273" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">- Atomic updates needed</text>
  <text x="60.689655172414" y="540.909090909091" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--ok-text)">Pros: 1 read, atomic</text>
  <text x="60.689655172414" y="572.545454545455" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--ok-text)">Cons: duplication, 16MB cap</text>

  <rect x="660.689655172414" y="82.181818181818" width="579.310344827586" height="537.818181818182" rx="10.444659357342" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--info-text)">Reference</text>

  <rect x="681.379310344828" y="145.454545454545" width="537.931034482759" height="105.454545454545" rx="6.266795614405" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="702.068965517241" y="177.090909090909" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">// users</text>
  <text x="702.068965517241" y="203.454545454545" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">{ "_id": 1, "name": "Alice" }</text>
  <text x="702.068965517241" y="235.090909090909" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)"/>

  <rect x="681.379310344828" y="261.454545454545" width="537.931034482759" height="126.545454545455" rx="6.266795614405" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="702.068965517241" y="293.090909090909" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">// orders</text>
  <text x="702.068965517241" y="319.454545454545" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">{ "_id": 100,</text>
  <text x="702.068965517241" y="345.818181818182" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-fill)">  "user_id": 1,</text>
  <text x="702.068965517241" y="372.181818181818" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">  "total": 49.99 }</text>

  <text x="681.379310344828" y="430.181818181818" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--info-text)">When:</text>
  <text x="681.379310344828" y="456.545454545455" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--info-text)">- One-to-many, unbounded</text>
  <text x="681.379310344828" y="482.909090909091" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--info-text)">- Independent updates</text>
  <text x="681.379310344828" y="509.272727272727" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--info-text)">- Shared by many parents</text>
  <text x="681.379310344828" y="540.909090909091" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--info-text)">Pros: no duplication</text>
  <text x="681.379310344828" y="572.545454545455" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--info-text)">Cons: $lookup or 2 round-trips</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">MongoDB for Developers</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Documents, schemas, queries</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="150" y="208" width="460" height="270" rx="10" fill="none" stroke="var(--text-faint)" stroke-width="2"/>
  <g font-family="Courier New, monospace" font-size="20" text-anchor="start" fill="var(--surface)">
    <text x="180" y="250">{</text>
    <text x="210" y="284"><tspan fill="var(--primary-fill)">"name"</tspan>: <tspan fill="var(--ok-fill)">"Alice"</tspan>,</text>
    <text x="210" y="318"><tspan fill="var(--primary-fill)">"skills"</tspan>: [<tspan fill="var(--ok-fill)">"SQL"</tspan>, <tspan fill="var(--ok-fill)">"Python"</tspan>],</text>
    <text x="210" y="352"><tspan fill="var(--primary-fill)">"address"</tspan>: {</text>
    <text x="240" y="386"><tspan fill="var(--primary-fill)">"city"</tspan>: <tspan fill="var(--ok-fill)">"London"</tspan></text>
    <text x="210" y="420">}</text>
    <text x="180" y="454">}</text>
  </g>
  <text x="725" y="232" font-size="16" fill="var(--text-faint)">aggregate</text>
  <line x1="625" y1="243" x2="826" y2="243" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="838,243 826,236 826,250" fill="var(--text-muted)"/>
  <rect x="840" y="220" width="240" height="46" rx="23" fill="var(--primary-fill)"/>
  <text x="960" y="250" font-size="19" fill="var(--primary-text)">$match</text>
  <line x1="960" y1="266" x2="960" y2="286" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="960,296 953,284 967,284" fill="var(--text-muted)"/>
  <rect x="840" y="296" width="240" height="46" rx="23" fill="var(--warn-fill)"/>
  <text x="960" y="326" font-size="19" fill="var(--warn-text)">$group</text>
  <line x1="960" y1="342" x2="960" y2="362" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="960,372 953,360 967,360" fill="var(--text-muted)"/>
  <rect x="840" y="372" width="240" height="46" rx="23" fill="var(--info-fill)"/>
  <text x="960" y="402" font-size="19" fill="var(--info-text)">$sort</text>
  <line x1="960" y1="418" x2="960" y2="438" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="960,448 953,436 967,436" fill="var(--text-muted)"/>
  <rect x="840" y="448" width="240" height="46" rx="10" fill="var(--ok-fill)"/>
  <text x="960" y="478" font-size="19" fill="var(--ok-text)">Results</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">schema • CRUD • aggregation • indexes • transactions</text>
</svg>

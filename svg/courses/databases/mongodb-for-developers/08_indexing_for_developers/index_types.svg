<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.26339891413" font-weight="bold" fill="var(--text)">MongoDB Index Types</text>

  <rect x="40" y="82.962962962963" width="386.440677966102" height="257.777777777778" rx="10.451213897904" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="120.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.902427795807" font-weight="bold" fill="var(--primary-text)">Single field</text>
  <text x="60.338983050847" y="163.518518518519" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--primary-text)">db.users.createIndex({email: 1})</text>
  <text x="60.338983050847" y="210" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">B-tree on one key</text>
  <text x="60.338983050847" y="245" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">Equality + range</text>
  <text x="60.338983050847" y="280" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">_id index by default</text>
  <text x="60.338983050847" y="315" font-family="Arial, sans-serif" font-size="13.586578067275" font-style="italic" fill="var(--primary-text)">1 / -1 = direction</text>

  <rect x="446.779661016949" y="82.962962962963" width="386.440677966102" height="257.777777777778" rx="10.451213897904" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="120.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.902427795807" font-weight="bold" fill="var(--warn-text)">Compound</text>
  <text x="467.118644067797" y="163.518518518519" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--warn-text)">{user: 1, date: -1}</text>
  <text x="467.118644067797" y="210" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--warn-text)">Multiple fields, ordered</text>
  <text x="467.118644067797" y="245" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--warn-text)">ESR: Equality, Sort, Range</text>
  <text x="467.118644067797" y="280" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--warn-text)">Prefix queries supported</text>
  <text x="467.118644067797" y="315" font-family="Arial, sans-serif" font-size="13.586578067275" font-style="italic" fill="var(--warn-text)">Order matters</text>

  <rect x="853.559322033898" y="82.962962962963" width="386.440677966102" height="257.777777777778" rx="10.451213897904" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.779661016949" y="120.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.902427795807" font-weight="bold" fill="var(--info-text)">Multi-key</text>
  <text x="873.898305084746" y="163.518518518519" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--info-text)">{tags: 1}</text>
  <text x="873.898305084746" y="210" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">Field is an array</text>
  <text x="873.898305084746" y="245" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">Entry per element</text>
  <text x="873.898305084746" y="280" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">Cannot compound 2</text>
  <text x="873.898305084746" y="315" font-family="Arial, sans-serif" font-size="13.586578067275" font-style="italic" fill="var(--info-text)">Auto-detected</text>

  <rect x="40" y="362.222222222222" width="386.440677966102" height="257.777777777778" rx="10.451213897904" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="399.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.902427795807" font-weight="bold" fill="var(--ok-text)">Text</text>
  <text x="60.338983050847" y="442.777777777778" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--ok-text)">{title: "text"}</text>
  <text x="60.338983050847" y="485" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--ok-text)">Full-text search</text>
  <text x="60.338983050847" y="520" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--ok-text)">Tokenized + stemmed</text>
  <text x="60.338983050847" y="555" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--ok-text)">$text operator</text>
  <text x="60.338983050847" y="590" font-family="Arial, sans-serif" font-size="13.586578067275" font-style="italic" fill="var(--ok-text)">Atlas Search is richer</text>

  <rect x="446.779661016949" y="362.222222222222" width="386.440677966102" height="257.777777777778" rx="10.451213897904" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="399.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.902427795807" font-weight="bold" fill="var(--danger-text)">Geospatial</text>
  <text x="467.118644067797" y="442.777777777778" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--danger-text)">{loc: "2dsphere"}</text>
  <text x="467.118644067797" y="485" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--danger-text)">GeoJSON</text>
  <text x="467.118644067797" y="520" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--danger-text)">$near, $geoWithin</text>
  <text x="467.118644067797" y="555" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--danger-text)">Spherical math</text>
  <text x="467.118644067797" y="590" font-family="Arial, sans-serif" font-size="13.586578067275" font-style="italic" fill="var(--danger-text)">Default 2dsphere</text>

  <rect x="853.559322033898" y="362.222222222222" width="386.440677966102" height="257.777777777778" rx="10.451213897904" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.779661016949" y="399.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.902427795807" font-weight="bold" fill="var(--info-text)">Special properties</text>
  <text x="873.898305084746" y="442.777777777778" font-family="Arial, sans-serif" font-size="13.586578067275" font-weight="bold" fill="var(--info-text)">unique:</text>
  <text x="924.745762711864" y="442.777777777778" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">uniqueness</text>
  <text x="873.898305084746" y="475" font-family="Arial, sans-serif" font-size="13.586578067275" font-weight="bold" fill="var(--info-text)">sparse:</text>
  <text x="924.745762711864" y="475" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">skip null docs</text>
  <text x="873.898305084746" y="507.222222222222" font-family="Arial, sans-serif" font-size="13.586578067275" font-weight="bold" fill="var(--info-text)">partial:</text>
  <text x="924.745762711864" y="507.222222222222" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">filter expr</text>
  <text x="873.898305084746" y="539.444444444444" font-family="Arial, sans-serif" font-size="13.586578067275" font-weight="bold" fill="var(--info-text)">TTL:</text>
  <text x="924.745762711864" y="539.444444444444" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">auto-expire</text>
  <text x="873.898305084746" y="571.666666666667" font-family="Arial, sans-serif" font-size="13.586578067275" font-weight="bold" fill="var(--info-text)">hidden:</text>
  <text x="924.745762711864" y="571.666666666667" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">pre-drop test</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="626.846543" y="40" text-anchor="middle" font-size="27.830935" font-weight="bold" fill="var(--primary-accent)">ES|QL Architecture</text>
  <rect x="40" y="223.569008" width="263.06914" height="156.229002" rx="6.862573" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="171.53457" y="289.966355" text-anchor="middle" font-size="23.854989" font-weight="bold" fill="var(--ok-accent)">Source</text>
  <text x="171.53457" y="329.023576" text-anchor="middle" font-size="14.909397" fill="var(--text-muted)">FROM index*</text>
  <line x1="303.069032" y1="301.683449" x2="361.753794" y2="301.683449" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="365.801012" y="223.569008" width="263.06914" height="156.229002" rx="6.862573" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="497.335582" y="289.966355" text-anchor="middle" font-size="23.854989" font-weight="bold" fill="var(--primary-accent)">Process</text>
  <text x="497.335582" y="329.023576" text-anchor="middle" font-size="14.909397" fill="var(--text-muted)">WHERE, LIMIT, SORT</text>
  <line x1="628.870152" y1="301.683449" x2="687.554806" y2="301.683449" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="691.602024" y="223.569008" width="263.06914" height="156.229002" rx="6.862573" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="823.136486" y="289.966355" text-anchor="middle" font-size="23.854989" font-weight="bold" fill="var(--text-muted)">Transform</text>
  <text x="823.136486" y="329.023576" text-anchor="middle" font-size="14.909397" fill="var(--text-muted)">EVAL, STATS BY</text>
  <line x1="954.671164" y1="301.683449" x2="1013.35571" y2="301.683449" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1017.403035" y="223.569008" width="222.596965" height="156.229002" rx="6.862573" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1128.701518" y="289.966355" text-anchor="middle" font-size="23.854989" font-weight="bold" fill="var(--info-accent)">Result</text>
  <text x="1128.701518" y="329.023576" text-anchor="middle" font-size="14.909397" fill="var(--text-muted)">Table format</text>
  <rect x="40" y="438.383962" width="1173.693086" height="78.114441" rx="6.862573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="626.846543" y="469.629666" text-anchor="middle" font-size="16.89737" fill="var(--text)" font-family="monospace">FROM logs-* | WHERE level == "ERROR" | STATS count=COUNT() BY service</text>
  <text x="626.846543" y="500.87549" text-anchor="middle" font-size="14.909397" fill="var(--text-faint)" font-family="monospace">Pipe-separated: each stage processes output of the previous</text>
  <rect x="40" y="565.319867" width="1173.693086" height="54.680133" rx="6.862573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="626.846543" y="598.518662" text-anchor="middle" font-size="16.89737" fill="var(--primary-accent)">ES|QL is designed for analytics workloads - more readable than Query DSL for data exploration</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="263.06914" height="228.571486560264" rx="8.300746948477" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.53457" y="137.142912731707" text-anchor="middle" font-size="28.854225251624" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Source</text>
  <text x="171.53457" y="194.285741211676" text-anchor="middle" font-size="18.033925708533" fill="var(--text-muted)" font-family="Arial, sans-serif">FROM index*</text>
  <line x1="303.069032" y1="154.285655496884" x2="361.753794" y2="154.285655496884" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="365.801012" y="40" width="263.06914" height="228.571486560264" rx="8.300746948477" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.335582" y="137.142912731707" text-anchor="middle" font-size="28.854225251624" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Process</text>
  <text x="497.335582" y="194.285741211676" text-anchor="middle" font-size="18.033925708533" fill="var(--text-muted)" font-family="Arial, sans-serif">WHERE, LIMIT, SORT</text>
  <line x1="628.870152" y1="154.285655496884" x2="687.554806" y2="154.285655496884" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="691.602024" y="40" width="263.06914" height="228.571486560264" rx="8.300746948477" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.136486" y="137.142912731707" text-anchor="middle" font-size="28.854225251624" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Transform</text>
  <text x="823.136486" y="194.285741211676" text-anchor="middle" font-size="18.033925708533" fill="var(--text-muted)" font-family="Arial, sans-serif">EVAL, STATS BY</text>
  <line x1="954.671164" y1="154.285655496884" x2="1013.35571" y2="154.285655496884" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1017.403035" y="40" width="222.596965" height="228.571486560264" rx="8.300746948477" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1128.701518" y="137.142912731707" text-anchor="middle" font-size="28.854225251624" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Result</text>
  <text x="1128.701518" y="194.285741211676" text-anchor="middle" font-size="18.033925708533" fill="var(--text-muted)" font-family="Arial, sans-serif">Table format</text>
  <rect x="40" y="354.28590557824" width="1173.693086" height="114.285655496884" rx="8.300746948477" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="626.846543" y="400.000061851875" text-anchor="middle" font-size="20.438513727256" fill="var(--text)" font-family="Courier New, monospace">FROM logs-* | WHERE level == "ERROR" | STATS count=COUNT() BY service</text>
  <text x="626.846543" y="445.714393692005" text-anchor="middle" font-size="18.033925708533" fill="var(--text-faint)" font-family="Courier New, monospace">Pipe-separated: each stage processes output of the previous</text>
  <rect x="40" y="540.000005599966" width="1173.693086" height="79.999994400034" rx="8.300746948477" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="626.846543" y="588.571639726896" text-anchor="middle" font-size="20.438513727256" fill="var(--primary-accent)" font-family="Arial, sans-serif">ES|QL is designed for analytics workloads - more readable than Query DSL for data exploration</text>
</svg>

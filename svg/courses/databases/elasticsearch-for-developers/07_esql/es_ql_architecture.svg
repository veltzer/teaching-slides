<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">ES|QL Architecture</text>
  <!-- Pipeline -->
  <rect x="60" y="240" width="260" height="160" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="190" y="308" text-anchor="middle" font-size="24" font-weight="bold" fill="#2e7d32">Source</text>
  <text x="190" y="348" text-anchor="middle" font-size="15" fill="#555555">FROM index*</text>
  <line x1="320" y1="320" x2="378" y2="320" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="382" y="240" width="260" height="160" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="512" y="308" text-anchor="middle" font-size="24" font-weight="bold" fill="#1565c0">Process</text>
  <text x="512" y="348" text-anchor="middle" font-size="15" fill="#555555">WHERE, LIMIT, SORT</text>
  <line x1="642" y1="320" x2="700" y2="320" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="704" y="240" width="260" height="160" rx="14" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="834" y="308" text-anchor="middle" font-size="24" font-weight="bold" fill="#795548">Transform</text>
  <text x="834" y="348" text-anchor="middle" font-size="15" fill="#555555">EVAL, STATS BY</text>
  <line x1="964" y1="320" x2="1022" y2="320" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1026" y="240" width="220" height="160" rx="14" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1136" y="308" text-anchor="middle" font-size="24" font-weight="bold" fill="#7b1fa2">Result</text>
  <text x="1136" y="348" text-anchor="middle" font-size="15" fill="#555555">Table format</text>
  <!-- Example query -->
  <rect x="60" y="460" width="1160" height="80" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="640" y="492" text-anchor="middle" font-size="17" fill="#333333" font-family="monospace">FROM logs-* | WHERE level == "ERROR" | STATS count=COUNT() BY service</text>
  <text x="640" y="524" text-anchor="middle" font-size="15" fill="#888888" font-family="monospace">Pipe-separated: each stage processes output of the previous</text>
  <!-- Note -->
  <rect x="60" y="590" width="1160" height="56" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="624" text-anchor="middle" font-size="17" fill="#1565c0">ES|QL is designed for analytics workloads - more readable than Query DSL for data exploration</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="46.2222" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#1565c0">ES|QL Architecture</ns0:text>
  <ns0:rect x="53.3333" y="213.3333" width="231.1111" height="142.2222" rx="12.4444" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="168.8889" y="273.7778" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#2e7d32">Source</ns0:text>
  <ns0:text x="168.8889" y="309.3333" text-anchor="middle" font-size="13.3333" fill="#555555">FROM index*</ns0:text>
  <ns0:line x1="284.4444" y1="284.4444" x2="336" y2="284.4444" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="339.5556" y="213.3333" width="231.1111" height="142.2222" rx="12.4444" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="455.1111" y="273.7778" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#1565c0">Process</ns0:text>
  <ns0:text x="455.1111" y="309.3333" text-anchor="middle" font-size="13.3333" fill="#555555">WHERE, LIMIT, SORT</ns0:text>
  <ns0:line x1="570.6667" y1="284.4444" x2="622.2222" y2="284.4444" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="625.7778" y="213.3333" width="231.1111" height="142.2222" rx="12.4444" fill="#fff9c4" stroke="#f9a825" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="741.3333" y="273.7778" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#555555">Transform</ns0:text>
  <ns0:text x="741.3333" y="309.3333" text-anchor="middle" font-size="13.3333" fill="#555555">EVAL, STATS BY</ns0:text>
  <ns0:line x1="856.8889" y1="284.4444" x2="908.4444" y2="284.4444" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="912" y="213.3333" width="195.5556" height="142.2222" rx="12.4444" fill="#e8eaf6" stroke="#7b1fa2" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="1009.7778" y="273.7778" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#7b1fa2">Result</ns0:text>
  <ns0:text x="1009.7778" y="309.3333" text-anchor="middle" font-size="13.3333" fill="#555555">Table format</ns0:text>
  <ns0:rect x="53.3333" y="408.8889" width="1031.1111" height="71.1111" rx="7.1111" fill="#f5f5f5" stroke="#999999" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="437.3333" text-anchor="middle" font-size="15.1111" fill="#333333" font-family="monospace">FROM logs-* | WHERE level == "ERROR" | STATS count=COUNT() BY service</ns0:text>
  <ns0:text x="568.8889" y="465.7778" text-anchor="middle" font-size="13.3333" fill="#888888" font-family="monospace">Pipe-separated: each stage processes output of the previous</ns0:text>
  <ns0:rect x="53.3333" y="524.4444" width="1031.1111" height="49.7778" rx="5.3333" fill="#f9f9f9" stroke="#bbdefb" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="554.6667" text-anchor="middle" font-size="15.1111" fill="#1565c0">ES|QL is designed for analytics workloads - more readable than Query DSL for data exploration</ns0:text>
</ns0:svg>
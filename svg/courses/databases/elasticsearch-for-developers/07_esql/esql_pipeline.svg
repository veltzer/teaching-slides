<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.1249" y="184.9999" width="187.4999" height="80.5557" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="161.8749" y="218.8332" text-anchor="middle" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--bg)">FROM</text>
  <text x="161.8749" y="239.7777" text-anchor="middle" font-family="monospace" font-size="13.0355" fill="var(--primary-accent)">products</text>
  <text x="161.8749" y="165.6666" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Source index</text>
  <rect x="68.1249" y="289.7222" width="187.4999" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="77.4999" y="309.0555" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">{name:A, price:50}</text>
  <text x="77.4999" y="325.1667" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">{name:B, price:120}</text>
  <text x="77.4999" y="341.2777" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">{name:C, price:80}</text>
  <text x="77.4999" y="357.3889" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">{name:D, price:200}</text>
  <text x="77.4999" y="373.4999" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">{name:E, price:30}</text>
  <line x1="257.4999" y1="225.2777" x2="300.6249" y2="225.2777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="279.0624" y="215.6111" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">|</text>
  <rect x="302.4999" y="184.9999" width="206.2501" height="80.5557" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="405.625" y="218.8332" text-anchor="middle" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">WHERE</text>
  <text x="405.625" y="239.7777" text-anchor="middle" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">price &gt; 100</text>
  <text x="405.625" y="165.6666" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Filter rows</text>
  <rect x="302.4999" y="289.7222" width="206.2501" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="311.8749" y="312.2777" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)">{name:B, price:120}</text>
  <text x="311.8749" y="330" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)">{name:D, price:200}</text>
  <text x="311.8749" y="350.9443" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">2 rows remain</text>
  <line x1="510.625" y1="225.2777" x2="553.7499" y2="225.2777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="532.1874" y="215.6111" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">|</text>
  <rect x="555.625" y="184.9999" width="225" height="80.5557" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="668.125" y="218.8332" text-anchor="middle" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">EVAL</text>
  <text x="668.125" y="239.7777" text-anchor="middle" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">tax = price * 0.2</text>
  <text x="668.125" y="165.6666" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Add computed fields</text>
  <rect x="555.625" y="289.7222" width="225" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="565" y="312.2777" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)">{B, 120, tax:24}</text>
  <text x="565" y="330" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)">{D, 200, tax:40}</text>
  <line x1="782.5" y1="225.2777" x2="825.6249" y2="225.2777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="804.0624" y="215.6111" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">|</text>
  <rect x="827.5" y="184.9999" width="225" height="80.5557" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="939.9998" y="218.8332" text-anchor="middle" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">STATS</text>
  <text x="939.9998" y="239.7777" text-anchor="middle" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">avg_price = AVG(price)</text>
  <text x="939.9998" y="165.6666" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Aggregate</text>
  <rect x="827.5" y="289.7222" width="225" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="836.8749" y="318.7223" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)">{avg_price: 160}</text>
  <line x1="1054.3749" y1="225.2777" x2="1097.5" y2="225.2777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1099.3749" y="184.9999" width="112.5" height="80.5557" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="1155.625" y="225.2777" text-anchor="middle" font-family="sans-serif" font-size="13.9043" font-weight="bold" fill="var(--bg)">Result</text>
  <text x="1155.625" y="246.2223" text-anchor="middle" font-family="monospace" font-size="11.6093" fill="var(--text-faint)">table</text>
  <rect x="68.1249" y="386.3889" width="1143.75" height="80.5557" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="408.9444" text-anchor="middle" font-family="sans-serif" font-size="13.0355" font-weight="bold" fill="var(--text)">Full query:</text>
  <text x="86.8749" y="428.2777" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">FROM products</text>
  <text x="86.8749" y="447.6111" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">| WHERE price &gt; 100</text>
  <text x="86.8749" y="466.9444" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">| EVAL tax = price * 0.2  | STATS avg_price = AVG(price)</text>
  <rect x="68.1249" y="483.0556" width="1143.75" height="33.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="504" text-anchor="middle" font-family="sans-serif" font-size="13.9043" fill="var(--primary-accent)">Each <tspan font-family="monospace">|</tspan> passes its output as input to the next command — like Unix pipes for data</text>
</svg>
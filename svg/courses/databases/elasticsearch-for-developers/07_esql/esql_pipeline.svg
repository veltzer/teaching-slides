<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="71.926543" width="196.721207" height="133.027732" rx="7.897675" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="138.360656" y="127.798036" text-anchor="middle" font-family="monospace" font-size="22.877723" font-weight="bold" fill="var(--bg)">FROM</text>
  <text x="138.360656" y="162.385275" text-anchor="middle" font-family="monospace" font-size="17.158358" fill="var(--primary-accent)">products</text>
  <text x="138.360656" y="40" text-anchor="middle" font-family="sans-serif" font-size="16.014117" fill="var(--text-muted)">Source index</text>
  <rect x="40" y="244.862413" width="196.721207" height="159.633047" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="49.836066" y="276.788956" font-family="monospace" font-size="15.28108" fill="var(--text-muted)">{name:A, price:50}</text>
  <text x="49.836066" y="303.394602" font-family="monospace" font-size="15.28108" fill="var(--text-muted)">{name:B, price:120}</text>
  <text x="49.836066" y="329.999918" font-family="monospace" font-size="15.28108" fill="var(--text-muted)">{name:C, price:80}</text>
  <text x="49.836066" y="356.605563" font-family="monospace" font-size="15.28108" fill="var(--text-muted)">{name:D, price:200}</text>
  <text x="49.836066" y="383.210878" font-family="monospace" font-size="15.28108" fill="var(--text-muted)">{name:E, price:30}</text>
  <line x1="238.688525" y1="138.440328" x2="283.934426" y2="138.440328" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="261.311475" y="122.477138" text-anchor="middle" font-family="monospace" font-size="18.301941" fill="var(--primary-accent)">|</text>
  <rect x="285.901639" y="71.926543" width="216.393548" height="133.027732" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="394.098466" y="127.798036" text-anchor="middle" font-family="monospace" font-size="22.877723" font-weight="bold" fill="var(--primary-accent)">WHERE</text>
  <text x="394.098466" y="162.385275" text-anchor="middle" font-family="monospace" font-size="16.014117" fill="var(--text-muted)">price &gt; 100</text>
  <text x="394.098466" y="40" text-anchor="middle" font-family="sans-serif" font-size="16.014117" fill="var(--text-muted)">Filter rows</text>
  <rect x="285.901639" y="244.862413" width="216.393548" height="106.421922" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="295.737705" y="282.11002" font-family="monospace" font-size="15.28108" fill="var(--primary-accent)">{name:B, price:120}</text>
  <text x="295.737705" y="311.376197" font-family="monospace" font-size="15.28108" fill="var(--primary-accent)">{name:D, price:200}</text>
  <text x="295.737705" y="345.963106" font-family="sans-serif" font-size="15.28108" fill="var(--text-faint)">2 rows remain</text>
  <line x1="504.2624" y1="138.440328" x2="549.508197" y2="138.440328" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="526.885246" y="122.477138" text-anchor="middle" font-family="monospace" font-size="18.301941" fill="var(--primary-accent)">|</text>
  <rect x="551.475515" y="71.926543" width="236.065574" height="133.027732" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="669.508302" y="127.798036" text-anchor="middle" font-family="monospace" font-size="22.877723" font-weight="bold" fill="var(--primary-accent)">EVAL</text>
  <text x="669.508302" y="162.385275" text-anchor="middle" font-family="monospace" font-size="16.014117" fill="var(--text-muted)">tax = price * 0.2</text>
  <text x="669.508302" y="40" text-anchor="middle" font-family="sans-serif" font-size="16.014117" fill="var(--text-muted)">Add computed fields</text>
  <rect x="551.475515" y="244.862413" width="236.065574" height="106.421922" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="561.31158" y="282.11002" font-family="monospace" font-size="15.28108" fill="var(--primary-accent)">{B, 120, tax:24}</text>
  <text x="561.31158" y="311.376197" font-family="monospace" font-size="15.28108" fill="var(--primary-accent)">{D, 200, tax:40}</text>
  <line x1="789.508302" y1="138.440328" x2="834.754098" y2="138.440328" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="812.131148" y="122.477138" text-anchor="middle" font-family="monospace" font-size="18.301941" fill="var(--primary-accent)">|</text>
  <rect x="836.721416" y="71.926543" width="236.065574" height="133.027732" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="954.753993" y="127.798036" text-anchor="middle" font-family="monospace" font-size="22.877723" font-weight="bold" fill="var(--primary-accent)">STATS</text>
  <text x="954.753993" y="162.385275" text-anchor="middle" font-family="monospace" font-size="16.014117" fill="var(--text-muted)">avg_price = AVG(price)</text>
  <text x="954.753993" y="40" text-anchor="middle" font-family="sans-serif" font-size="16.014117" fill="var(--text-muted)">Aggregate</text>
  <rect x="836.721416" y="244.862413" width="236.065574" height="79.816442" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="846.557377" y="292.752477" font-family="monospace" font-size="15.28108" fill="var(--primary-accent)">{avg_price: 160}</text>
  <line x1="1074.754098" y1="138.440328" x2="1120.000105" y2="138.440328" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1121.967213" y="71.926543" width="118.032787" height="133.027732" rx="7.897675" fill="var(--text)" />
  <text x="1180.983711" y="138.440328" text-anchor="middle" font-family="sans-serif" font-size="18.301941" font-weight="bold" fill="var(--bg)">Result</text>
  <text x="1180.983711" y="173.027732" text-anchor="middle" font-family="monospace" font-size="15.28108" fill="var(--text-faint)">table</text>
  <rect x="40" y="404.49546" width="1200" height="133.027732" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="441.743067" text-anchor="middle" font-family="sans-serif" font-size="17.158358" font-weight="bold" fill="var(--text)">Full query:</text>
  <text x="59.672131" y="473.66961" font-family="monospace" font-size="18.301941" fill="var(--primary-accent)">FROM products</text>
  <text x="59.672131" y="505.596319" font-family="monospace" font-size="18.301941" fill="var(--primary-accent)">| WHERE price &gt; 100</text>
  <text x="59.672131" y="537.522862" font-family="monospace" font-size="18.301941" fill="var(--primary-accent)">| EVAL tax = price * 0.2  | STATS avg_price = AVG(price)</text>
  <rect x="40" y="564.128507" width="1200" height="55.871493" rx="7.897675" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="598.715583" text-anchor="middle" font-family="sans-serif" font-size="18.301941" fill="var(--primary-accent)">Each <tspan font-family="monospace">|</tspan> passes its output as input to the next command — like Unix pipes for data</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="71.926543" width="196.721207" height="133.027732" rx="7.897675" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.360656" y="127.798036" text-anchor="middle" font-size="22.877723" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">FROM</text>
  <text x="138.360656" y="162.385275" text-anchor="middle" font-size="17.158358" fill="var(--primary-accent)" font-family="Courier New, monospace">products</text>
  <text x="138.360656" y="40" text-anchor="middle" font-size="16.014117" fill="var(--text-muted)" font-family="Arial, sans-serif">Source index</text>
  <rect x="40" y="244.862413" width="196.721207" height="159.633047" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="49.836066" y="276.788956" font-size="15.28108" fill="var(--text-muted)" font-family="Courier New, monospace">{name:A, price:50}</text>
  <text x="49.836066" y="303.394602" font-size="15.28108" fill="var(--text-muted)" font-family="Courier New, monospace">{name:B, price:120}</text>
  <text x="49.836066" y="329.999918" font-size="15.28108" fill="var(--text-muted)" font-family="Courier New, monospace">{name:C, price:80}</text>
  <text x="49.836066" y="356.605563" font-size="15.28108" fill="var(--text-muted)" font-family="Courier New, monospace">{name:D, price:200}</text>
  <text x="49.836066" y="383.210878" font-size="15.28108" fill="var(--text-muted)" font-family="Courier New, monospace">{name:E, price:30}</text>
  <line x1="238.688525" y1="138.440328" x2="283.934426" y2="138.440328" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="261.311475" y="122.477138" text-anchor="middle" font-size="18.301941" fill="var(--primary-accent)" font-family="Courier New, monospace">|</text>
  <rect x="285.901639" y="71.926543" width="216.393548" height="133.027732" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="394.098466" y="127.798036" text-anchor="middle" font-size="22.877723" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">WHERE</text>
  <text x="394.098466" y="162.385275" text-anchor="middle" font-size="16.014117" fill="var(--text-muted)" font-family="Courier New, monospace">price &gt; 100</text>
  <text x="394.098466" y="40" text-anchor="middle" font-size="16.014117" fill="var(--text-muted)" font-family="Arial, sans-serif">Filter rows</text>
  <rect x="285.901639" y="244.862413" width="216.393548" height="106.421922" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="295.737705" y="282.11002" font-size="15.28108" fill="var(--primary-accent)" font-family="Courier New, monospace">{name:B, price:120}</text>
  <text x="295.737705" y="311.376197" font-size="15.28108" fill="var(--primary-accent)" font-family="Courier New, monospace">{name:D, price:200}</text>
  <text x="295.737705" y="345.963106" font-size="15.28108" fill="var(--text-faint)" font-family="Arial, sans-serif">2 rows remain</text>
  <line x1="504.2624" y1="138.440328" x2="549.508197" y2="138.440328" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="526.885246" y="122.477138" text-anchor="middle" font-size="18.301941" fill="var(--primary-accent)" font-family="Courier New, monospace">|</text>
  <rect x="551.475515" y="71.926543" width="236.065574" height="133.027732" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="669.508302" y="127.798036" text-anchor="middle" font-size="22.877723" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">EVAL</text>
  <text x="669.508302" y="162.385275" text-anchor="middle" font-size="16.014117" fill="var(--text-muted)" font-family="Courier New, monospace">tax = price * 0.2</text>
  <text x="669.508302" y="40" text-anchor="middle" font-size="16.014117" fill="var(--text-muted)" font-family="Arial, sans-serif">Add computed fields</text>
  <rect x="551.475515" y="244.862413" width="236.065574" height="106.421922" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="561.31158" y="282.11002" font-size="15.28108" fill="var(--primary-accent)" font-family="Courier New, monospace">{B, 120, tax:24}</text>
  <text x="561.31158" y="311.376197" font-size="15.28108" fill="var(--primary-accent)" font-family="Courier New, monospace">{D, 200, tax:40}</text>
  <line x1="789.508302" y1="138.440328" x2="834.754098" y2="138.440328" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="812.131148" y="122.477138" text-anchor="middle" font-size="18.301941" fill="var(--primary-accent)" font-family="Courier New, monospace">|</text>
  <rect x="836.721416" y="71.926543" width="236.065574" height="133.027732" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="954.753993" y="127.798036" text-anchor="middle" font-size="22.877723" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">STATS</text>
  <text x="954.753993" y="162.385275" text-anchor="middle" font-size="16.014117" fill="var(--text-muted)" font-family="Courier New, monospace">avg_price = AVG(price)</text>
  <text x="954.753993" y="40" text-anchor="middle" font-size="16.014117" fill="var(--text-muted)" font-family="Arial, sans-serif">Aggregate</text>
  <rect x="836.721416" y="244.862413" width="236.065574" height="79.816442" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="846.557377" y="292.752477" font-size="15.28108" fill="var(--primary-accent)" font-family="Courier New, monospace">{avg_price: 160}</text>
  <line x1="1074.754098" y1="138.440328" x2="1120.000105" y2="138.440328" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="1121.967213" y="71.926543" width="118.032787" height="133.027732" rx="7.897675" fill="var(--text)"/>
  <text x="1180.983711" y="138.440328" text-anchor="middle" font-size="18.301941" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Result</text>
  <text x="1180.983711" y="173.027732" text-anchor="middle" font-size="15.28108" fill="var(--text-faint)" font-family="Courier New, monospace">table</text>
  <rect x="40" y="404.49546" width="1200" height="133.027732" rx="7.897675" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="441.743067" text-anchor="middle" font-size="17.158358" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Full query:</text>
  <text x="59.672131" y="473.66961" font-size="18.301941" fill="var(--primary-accent)" font-family="Courier New, monospace">FROM products</text>
  <text x="59.672131" y="505.596319" font-size="18.301941" fill="var(--primary-accent)" font-family="Courier New, monospace">| WHERE price &gt; 100</text>
  <text x="59.672131" y="537.522862" font-size="18.301941" fill="var(--primary-accent)" font-family="Courier New, monospace">| EVAL tax = price * 0.2  | STATS avg_price = AVG(price)</text>
  <rect x="40" y="564.128507" width="1200" height="55.871493" rx="7.897675" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="598.715583" text-anchor="middle" font-size="18.301941" fill="var(--primary-accent)" font-family="Arial, sans-serif">Each <tspan font-family="Courier New, monospace" fill="var(--text)">|</tspan> passes its output as input to the next command — like Unix pipes for data</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <rect x="177.9133" y="263.8785" width="169.9338" height="65.9485" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="262.8802" y="291.5768" text-anchor="middle" font-family="monospace" font-size="14.9713" font-weight="bold" fill="var(--bg)">FROM</text>
  <text x="262.8802" y="308.7234" text-anchor="middle" font-family="monospace" font-size="11.2285" fill="var(--primary-accent)">products</text>
  <text x="262.8802" y="248.0509" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Source index</text>
  <rect x="177.9133" y="349.6115" width="169.9338" height="79.1381" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="186.41" y="365.4391" font-family="monospace" font-size="10" fill="var(--text-muted)">{name:A, price:50}</text>
  <text x="186.41" y="378.6288" font-family="monospace" font-size="10" fill="var(--text-muted)">{name:B, price:120}</text>
  <text x="186.41" y="391.8184" font-family="monospace" font-size="10" fill="var(--text-muted)">{name:C, price:80}</text>
  <text x="186.41" y="405.0082" font-family="monospace" font-size="10" fill="var(--text-muted)">{name:D, price:200}</text>
  <text x="186.41" y="418.1978" font-family="monospace" font-size="10" fill="var(--text-muted)">{name:E, price:30}</text>
  <line x1="349.5465" y1="296.8527" x2="388.6313" y2="296.8527" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="369.0889" y="288.9389" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">|</text>
  <rect x="390.3306" y="263.8785" width="186.9273" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="483.7943" y="291.5768" text-anchor="middle" font-family="monospace" font-size="14.9713" font-weight="bold" fill="var(--primary-accent)">WHERE</text>
  <text x="483.7943" y="308.7234" text-anchor="middle" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">price &gt; 100</text>
  <text x="483.7943" y="248.0509" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Filter rows</text>
  <rect x="390.3306" y="349.6115" width="186.9273" height="52.7587" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="398.8273" y="368.077" font-family="monospace" font-size="10" fill="var(--primary-accent)">{name:B, price:120}</text>
  <text x="398.8273" y="382.5857" font-family="monospace" font-size="10" fill="var(--primary-accent)">{name:D, price:200}</text>
  <text x="398.8273" y="399.7322" font-family="sans-serif" font-size="10" fill="var(--text-faint)">2 rows remain</text>
  <line x1="578.9573" y1="296.8527" x2="618.042" y2="296.8527" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="598.4996" y="288.9389" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">|</text>
  <rect x="619.7414" y="263.8785" width="203.9206" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="721.7017" y="291.5768" text-anchor="middle" font-family="monospace" font-size="14.9713" font-weight="bold" fill="var(--primary-accent)">EVAL</text>
  <text x="721.7017" y="308.7234" text-anchor="middle" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">tax = price * 0.2</text>
  <text x="721.7017" y="248.0509" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Add computed fields</text>
  <rect x="619.7414" y="349.6115" width="203.9206" height="52.7587" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="628.2381" y="368.077" font-family="monospace" font-size="10" fill="var(--primary-accent)">{B, 120, tax:24}</text>
  <text x="628.2381" y="382.5857" font-family="monospace" font-size="10" fill="var(--primary-accent)">{D, 200, tax:40}</text>
  <line x1="825.3614" y1="296.8527" x2="864.4461" y2="296.8527" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="844.9037" y="288.9389" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">|</text>
  <rect x="866.1455" y="263.8785" width="203.9206" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="968.1056" y="291.5768" text-anchor="middle" font-family="monospace" font-size="14.9713" font-weight="bold" fill="var(--primary-accent)">STATS</text>
  <text x="968.1056" y="308.7234" text-anchor="middle" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">avg_price = AVG(price)</text>
  <text x="968.1056" y="248.0509" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Aggregate</text>
  <rect x="866.1455" y="349.6115" width="203.9206" height="39.569" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="874.6421" y="373.353" font-family="monospace" font-size="10" fill="var(--primary-accent)">{avg_price: 160}</text>
  <line x1="1071.7654" y1="296.8527" x2="1110.8503" y2="296.8527" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1112.5495" y="263.8785" width="101.9603" height="65.9485" rx="5.7089" fill="var(--text)" filter="url(#shadow)" />
  <text x="1163.5298" y="296.8527" text-anchor="middle" font-family="sans-serif" font-size="11.9769" font-weight="bold" fill="var(--bg)">Result</text>
  <text x="1163.5298" y="313.9994" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--text-faint)">table</text>
  <rect x="177.9133" y="428.7496" width="1036.5965" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="696.2116" y="447.2151" text-anchor="middle" font-family="sans-serif" font-size="11.2285" font-weight="bold" fill="var(--text)">Full query:</text>
  <text x="194.9067" y="463.0427" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">FROM products</text>
  <text x="194.9067" y="478.8704" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">| WHERE price &gt; 100</text>
  <text x="194.9067" y="494.698" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">| EVAL tax = price * 0.2  | STATS avg_price = AVG(price)</text>
  <rect x="177.9133" y="507.8877" width="1036.5965" height="27.6983" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="696.2116" y="525.0343" text-anchor="middle" font-family="sans-serif" font-size="11.9769" fill="var(--primary-accent)">Each <tspan font-family="monospace">|</tspan> passes its output as input to the next command — like Unix pipes for data</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Pipeline stages left to right -->
  <!-- Stage 1: FROM -->
  <rect x="30" y="180" width="200" height="100" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="130" y="222" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff">FROM</text>
  <text x="130" y="248" text-anchor="middle" font-family="monospace" font-size="15" fill="#bbdefb">products</text>
  <text x="130" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Source index</text>
  <!-- Sample data below -->
  <rect x="30" y="310" width="200" height="120" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="40" y="334" font-family="monospace" font-size="12" fill="#555555">{name:A, price:50}</text>
  <text x="40" y="354" font-family="monospace" font-size="12" fill="#555555">{name:B, price:120}</text>
  <text x="40" y="374" font-family="monospace" font-size="12" fill="#555555">{name:C, price:80}</text>
  <text x="40" y="394" font-family="monospace" font-size="12" fill="#555555">{name:D, price:200}</text>
  <text x="40" y="414" font-family="monospace" font-size="12" fill="#555555">{name:E, price:30}</text>

  <!-- Pipe -->
  <line x1="232" y1="230" x2="278" y2="230" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="255" y="218" text-anchor="middle" font-family="monospace" font-size="16" fill="#1565c0">|</text>

  <!-- Stage 2: WHERE -->
  <rect x="280" y="180" width="220" height="100" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="222" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#1565c0">WHERE</text>
  <text x="390" y="248" text-anchor="middle" font-family="monospace" font-size="14" fill="#555555">price &gt; 100</text>
  <text x="390" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Filter rows</text>
  <!-- Filtered data -->
  <rect x="280" y="310" width="220" height="80" rx="4" fill="#f2f2f2" stroke="#1565c0" stroke-width="1.5"/>
  <text x="290" y="338" font-family="monospace" font-size="12" fill="#1565c0">{name:B, price:120}</text>
  <text x="290" y="360" font-family="monospace" font-size="12" fill="#1565c0">{name:D, price:200}</text>
  <text x="290" y="386" font-family="sans-serif" font-size="12" fill="#9e9e9e">2 rows remain</text>

  <!-- Pipe -->
  <line x1="502" y1="230" x2="548" y2="230" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="525" y="218" text-anchor="middle" font-family="monospace" font-size="16" fill="#1565c0">|</text>

  <!-- Stage 3: EVAL -->
  <rect x="550" y="180" width="240" height="100" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="222" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#1565c0">EVAL</text>
  <text x="670" y="248" text-anchor="middle" font-family="monospace" font-size="14" fill="#555555">tax = price * 0.2</text>
  <text x="670" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Add computed fields</text>
  <!-- Data with new column -->
  <rect x="550" y="310" width="240" height="80" rx="4" fill="#f2f2f2" stroke="#1565c0" stroke-width="1.5"/>
  <text x="560" y="338" font-family="monospace" font-size="12" fill="#1565c0">{B, 120, tax:24}</text>
  <text x="560" y="360" font-family="monospace" font-size="12" fill="#1565c0">{D, 200, tax:40}</text>

  <!-- Pipe -->
  <line x1="792" y1="230" x2="838" y2="230" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="815" y="218" text-anchor="middle" font-family="monospace" font-size="16" fill="#1565c0">|</text>

  <!-- Stage 4: STATS -->
  <rect x="840" y="180" width="240" height="100" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="960" y="222" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#1565c0">STATS</text>
  <text x="960" y="248" text-anchor="middle" font-family="monospace" font-size="14" fill="#555555">avg_price = AVG(price)</text>
  <text x="960" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Aggregate</text>
  <!-- Aggregated result -->
  <rect x="840" y="310" width="240" height="60" rx="4" fill="#f2f2f2" stroke="#1565c0" stroke-width="1.5"/>
  <text x="850" y="346" font-family="monospace" font-size="13" fill="#1565c0">{avg_price: 160}</text>

  <!-- Arrow to result -->
  <line x1="1082" y1="230" x2="1128" y2="230" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>

  <!-- Final result -->
  <rect x="1130" y="180" width="120" height="100" rx="8" fill="#212121" filter="url(#shadow)"/>
  <text x="1190" y="230" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Result</text>
  <text x="1190" y="256" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">table</text>

  <!-- Full query -->
  <rect x="30" y="430" width="1220" height="100" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="640" y="458" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#212121">Full query:</text>
  <text x="50" y="482" font-family="monospace" font-size="16" fill="#1565c0">FROM products</text>
  <text x="50" y="506" font-family="monospace" font-size="16" fill="#1565c0">| WHERE price &gt; 100</text>
  <text x="50" y="530" font-family="monospace" font-size="16" fill="#1565c0">| EVAL tax = price * 0.2  | STATS avg_price = AVG(price)</text>

  <rect x="30" y="550" width="1220" height="42" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="576" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">Each <tspan font-family="monospace">|</tspan> passes its output as input to the next command — like Unix pipes for data</text>
</svg>

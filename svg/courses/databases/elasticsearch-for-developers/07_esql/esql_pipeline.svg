<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="160" width="177.7778" height="88.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="115.5556" y="197.3333" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="var(--bg)">FROM</text>
  <text x="115.5556" y="220.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">products</text>
  <text x="115.5556" y="138.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Source index</text>
  <rect x="26.6667" y="275.5556" width="177.7778" height="106.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="35.5556" y="296.8889" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">{name:A, price:50}</text>
  <text x="35.5556" y="314.6667" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">{name:B, price:120}</text>
  <text x="35.5556" y="332.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">{name:C, price:80}</text>
  <text x="35.5556" y="350.2222" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">{name:D, price:200}</text>
  <text x="35.5556" y="368" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">{name:E, price:30}</text>
  <line x1="206.2222" y1="204.4444" x2="247.1111" y2="204.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="226.6667" y="193.7778" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">|</text>
  <rect x="248.8889" y="160" width="195.5556" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="346.6667" y="197.3333" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">WHERE</text>
  <text x="346.6667" y="220.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">price &gt; 100</text>
  <text x="346.6667" y="138.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Filter rows</text>
  <rect x="248.8889" y="275.5556" width="195.5556" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="257.7778" y="300.4444" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">{name:B, price:120}</text>
  <text x="257.7778" y="320" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">{name:D, price:200}</text>
  <text x="257.7778" y="343.1111" font-family="sans-serif" font-size="10.6667" fill="var(--text-faint)">2 rows remain</text>
  <line x1="446.2222" y1="204.4444" x2="487.1111" y2="204.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="466.6667" y="193.7778" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">|</text>
  <rect x="488.8889" y="160" width="213.3333" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="595.5556" y="197.3333" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">EVAL</text>
  <text x="595.5556" y="220.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">tax = price * 0.2</text>
  <text x="595.5556" y="138.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Add computed fields</text>
  <rect x="488.8889" y="275.5556" width="213.3333" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="497.7778" y="300.4444" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">{B, 120, tax:24}</text>
  <text x="497.7778" y="320" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">{D, 200, tax:40}</text>
  <line x1="704" y1="204.4444" x2="744.8889" y2="204.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="724.4444" y="193.7778" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">|</text>
  <rect x="746.6667" y="160" width="213.3333" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="853.3333" y="197.3333" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">STATS</text>
  <text x="853.3333" y="220.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">avg_price = AVG(price)</text>
  <text x="853.3333" y="138.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Aggregate</text>
  <rect x="746.6667" y="275.5556" width="213.3333" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="755.5556" y="307.5556" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">{avg_price: 160}</text>
  <line x1="961.7778" y1="204.4444" x2="1002.6667" y2="204.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1004.4444" y="160" width="106.6667" height="88.8889" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="1057.7778" y="204.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)">Result</text>
  <text x="1057.7778" y="227.5556" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">table</text>
  <rect x="26.6667" y="382.2222" width="1084.4444" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="407.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">Full query:</text>
  <text x="44.4444" y="428.4444" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">FROM products</text>
  <text x="44.4444" y="449.7778" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">| WHERE price &gt; 100</text>
  <text x="44.4444" y="471.1111" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">| EVAL tax = price * 0.2  | STATS avg_price = AVG(price)</text>
  <rect x="26.6667" y="488.8889" width="1084.4444" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="512" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">Each <tspan font-family="monospace">|</tspan> passes its output as input to the next command — like Unix pipes for data</text>
</svg>
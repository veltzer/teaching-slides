<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">ES|QL vs Query DSL</text>
  <!-- Query DSL panel -->
  <rect x="80" y="90" width="520" height="440" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="340" y="160" text-anchor="middle" font-size="26" font-weight="bold" fill="#2e7d32">Query DSL</text>
  <text x="340" y="220" text-anchor="middle" font-size="19" fill="#333333">&#x2022; JSON based</text>
  <text x="340" y="268" text-anchor="middle" font-size="19" fill="#333333">&#x2022; Nested structure</text>
  <text x="340" y="316" text-anchor="middle" font-size="19" fill="#333333">&#x2022; Full control over scoring</text>
  <text x="340" y="364" text-anchor="middle" font-size="19" fill="#333333">&#x2022; Mature and battle-tested</text>
  <text x="340" y="412" text-anchor="middle" font-size="19" fill="#333333">&#x2022; Use for: search-heavy apps</text>
  <text x="340" y="460" text-anchor="middle" font-size="19" fill="#333333">&#x2022; Complex bool queries</text>
  <!-- ES|QL panel -->
  <rect x="680" y="90" width="520" height="440" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="940" y="160" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">ES|QL</text>
  <text x="940" y="220" text-anchor="middle" font-size="19" fill="#333333">&#x2022; Text / pipe-based syntax</text>
  <text x="940" y="268" text-anchor="middle" font-size="19" fill="#333333">&#x2022; SQL-like, readable</text>
  <text x="940" y="316" text-anchor="middle" font-size="19" fill="#333333">&#x2022; Analytics-focused</text>
  <text x="940" y="364" text-anchor="middle" font-size="19" fill="#333333">&#x2022; Added in ES 8.11+</text>
  <text x="940" y="412" text-anchor="middle" font-size="19" fill="#333333">&#x2022; Use for: log analysis</text>
  <text x="940" y="460" text-anchor="middle" font-size="19" fill="#333333">&#x2022; Data exploration</text>
  <!-- Bottom note -->
  <rect x="80" y="582" width="1120" height="56" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="616" text-anchor="middle" font-size="17" fill="#1565c0">Both are valid - choose based on your use case. They can be used together in the same application.</text>
</svg>

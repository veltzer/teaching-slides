<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="60" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">Search Funnel Analysis</text>

  <!-- Funnel as progressively narrower bars, full width usage -->
  <!-- Stage 1: search 100% -->
  <polygon points="40,100 1240,100 1160,240 120,240" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="155" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)">Search</text>
  <text x="640" y="200" text-anchor="middle" font-size="20" fill="var(--ok-text)">100% — 1,000,000 queries</text>

  <!-- arrow between -->
  <line x1="640" y1="245" x2="640" y2="275" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2: click 40% -->
  <polygon points="200,280 1080,280 1000,420 280,420" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="335" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--primary-text)">Click</text>
  <text x="640" y="380" text-anchor="middle" font-size="20" fill="var(--primary-text)">40% — 400,000 result clicks</text>

  <!-- arrow between -->
  <line x1="640" y1="425" x2="640" y2="455" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 3: convert 15% -->
  <polygon points="360,460 920,460 840,600 440,600" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="515" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--warn-text)">Convert</text>
  <text x="640" y="560" text-anchor="middle" font-size="20" fill="var(--warn-text)">15% — 150,000 purchases</text>

  <!-- Side annotations at edges -->
  <text x="60" y="170" font-size="14" fill="var(--text-muted)">queries</text>
  <text x="220" y="350" font-size="14" fill="var(--text-muted)">CTR = 40%</text>
  <text x="380" y="530" font-size="14" fill="var(--text-muted)">CR = 37.5% of clicks</text>
  <text x="1080" y="170" text-anchor="end" font-size="14" fill="var(--text-muted)">track each stage</text>
  <text x="1060" y="350" text-anchor="end" font-size="14" fill="var(--text-muted)">zero-result pct</text>
  <text x="900" y="530" text-anchor="end" font-size="14" fill="var(--text-muted)">revenue per query</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="70" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">Continuous Improvement Loop</text>
  <rect x="40" y="130" width="285" height="380" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="182" y="210" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--primary-text)">Measure</text>
  <text x="182" y="290" text-anchor="middle" font-size="18" fill="var(--primary-text)">Collect logs,</text>
  <text x="182" y="325" text-anchor="middle" font-size="18" fill="var(--primary-text)">metrics, traces</text>
  <rect x="345" y="130" width="285" height="380" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="487" y="210" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--warn-text)">Analyze</text>
  <text x="487" y="290" text-anchor="middle" font-size="18" fill="var(--warn-text)">Find slow queries,</text>
  <text x="487" y="325" text-anchor="middle" font-size="18" fill="var(--warn-text)">hot shards, errors</text>
  <rect x="650" y="130" width="285" height="380" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="792" y="210" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--ok-text)">Improve</text>
  <text x="792" y="290" text-anchor="middle" font-size="18" fill="var(--ok-text)">Tune mappings,</text>
  <text x="792" y="325" text-anchor="middle" font-size="18" fill="var(--ok-text)">queries, hardware</text>
  <rect x="955" y="130" width="285" height="380" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1097" y="210" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--info-text)">Deploy</text>
  <text x="1097" y="290" text-anchor="middle" font-size="18" fill="var(--info-text)">Roll out changes,</text>
  <text x="1097" y="325" text-anchor="middle" font-size="18" fill="var(--info-text)">update dashboards</text>
  <line x1="327" y1="320" x2="343" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="632" y1="320" x2="648" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="937" y1="320" x2="953" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1182 510 L 1182 555 L 182 555 L 182 510" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="545" text-anchor="middle" font-size="15" fill="var(--text-muted)">repeat: every release feeds the next measurement</text>
  <text x="640" y="605" text-anchor="middle" font-size="15" fill="var(--text-muted)">Small, frequent iterations beat big-bang optimisation projects.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.153798" font-weight="bold" fill="var(--text)">Continuous Improvement Loop</text>
  <rect x="40" y="105.046729" width="285" height="411.962617" rx="6.247242" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="191.775701" text-anchor="middle" font-size="29.153798" font-weight="bold" fill="var(--primary-text)">Measure</text>
  <text x="182" y="278.504673" text-anchor="middle" font-size="18.741727" fill="var(--primary-text)">Collect logs,</text>
  <text x="182" y="316.448598" text-anchor="middle" font-size="18.741727" fill="var(--primary-text)">metrics, traces</text>
  <rect x="345" y="105.046729" width="285" height="411.962617" rx="6.247242" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="191.775701" text-anchor="middle" font-size="29.153798" font-weight="bold" fill="var(--warn-text)">Analyze</text>
  <text x="487" y="278.504673" text-anchor="middle" font-size="18.741727" fill="var(--warn-text)">Find slow queries,</text>
  <text x="487" y="316.448598" text-anchor="middle" font-size="18.741727" fill="var(--warn-text)">hot shards, errors</text>
  <rect x="650" y="105.046729" width="285" height="411.962617" rx="6.247242" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="191.775701" text-anchor="middle" font-size="29.153798" font-weight="bold" fill="var(--ok-text)">Improve</text>
  <text x="792" y="278.504673" text-anchor="middle" font-size="18.741727" fill="var(--ok-text)">Tune mappings,</text>
  <text x="792" y="316.448598" text-anchor="middle" font-size="18.741727" fill="var(--ok-text)">queries, hardware</text>
  <rect x="955" y="105.046729" width="285" height="411.962617" rx="6.247242" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="191.775701" text-anchor="middle" font-size="29.153798" font-weight="bold" fill="var(--info-text)">Deploy</text>
  <text x="1097" y="278.504673" text-anchor="middle" font-size="18.741727" fill="var(--info-text)">Roll out changes,</text>
  <text x="1097" y="316.448598" text-anchor="middle" font-size="18.741727" fill="var(--info-text)">update dashboards</text>
  <line x1="327" y1="311.028037" x2="343" y2="311.028037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="632" y1="311.028037" x2="648" y2="311.028037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="937" y1="311.028037" x2="953" y2="311.028037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1182 517.009346 L 1182 565.794393 L 182 565.794393 L 182 517.009346" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="554.953271" text-anchor="middle" font-size="15.618106" fill="var(--text-muted)">repeat: every release feeds the next measurement</text>
  <text x="640" y="620" text-anchor="middle" font-size="15.618106" fill="var(--text-muted)">Small, frequent iterations beat big-bang optimisation projects.</text>
</svg>

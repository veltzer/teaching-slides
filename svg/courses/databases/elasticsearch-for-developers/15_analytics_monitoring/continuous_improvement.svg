<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="285" height="464.000000225263" rx="6.630074611892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="137.68421057374" text-anchor="middle" font-size="30.940350311392" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Measure</text>
  <text x="182" y="235.368421147479" text-anchor="middle" font-size="19.890224896957" fill="var(--primary-text)" font-family="Arial, sans-serif">Collect logs,</text>
  <text x="182" y="278.105262991911" text-anchor="middle" font-size="19.890224896957" fill="var(--primary-text)" font-family="Arial, sans-serif">metrics, traces</text>
  <rect x="345" y="40" width="285" height="464.000000225263" rx="6.630074611892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="137.68421057374" text-anchor="middle" font-size="30.940350311392" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Analyze</text>
  <text x="487" y="235.368421147479" text-anchor="middle" font-size="19.890224896957" fill="var(--warn-text)" font-family="Arial, sans-serif">Find slow queries,</text>
  <text x="487" y="278.105262991911" text-anchor="middle" font-size="19.890224896957" fill="var(--warn-text)" font-family="Arial, sans-serif">hot shards, errors</text>
  <rect x="650" y="40" width="285" height="464.000000225263" rx="6.630074611892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="137.68421057374" text-anchor="middle" font-size="30.940350311392" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Improve</text>
  <text x="792" y="235.368421147479" text-anchor="middle" font-size="19.890224896957" fill="var(--ok-text)" font-family="Arial, sans-serif">Tune mappings,</text>
  <text x="792" y="278.105262991911" text-anchor="middle" font-size="19.890224896957" fill="var(--ok-text)" font-family="Arial, sans-serif">queries, hardware</text>
  <rect x="955" y="40" width="285" height="464.000000225263" rx="6.630074611892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="137.68421057374" text-anchor="middle" font-size="30.940350311392" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Deploy</text>
  <text x="1097" y="235.368421147479" text-anchor="middle" font-size="19.890224896957" fill="var(--info-text)" font-family="Arial, sans-serif">Roll out changes,</text>
  <text x="1097" y="278.105262991911" text-anchor="middle" font-size="19.890224896957" fill="var(--info-text)" font-family="Arial, sans-serif">update dashboards</text>
  <line x1="327" y1="271.999999549474" x2="343" y2="271.999999549474" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="632" y1="271.999999549474" x2="648" y2="271.999999549474" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="937" y1="271.999999549474" x2="953" y2="271.999999549474" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1182 504.000000225263 L 1182 558.947368954571 L 182 558.947368954571 L 182 504.000000225263" fill="none" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="546.736842069695" text-anchor="middle" font-size="16.575187591011" fill="var(--text-muted)" font-family="Arial, sans-serif">repeat: every release feeds the next measurement</text>
  <text x="640" y="620" text-anchor="middle" font-size="16.575187591011" fill="var(--text-muted)" font-family="Arial, sans-serif">Small, frequent iterations beat big-bang optimisation projects.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Field Types Overview</text>
  <!-- Left column -->
  <rect x="100" y="80" width="420" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="310" y="130" text-anchor="middle" font-size="24" font-weight="bold" fill="#2e7d32">Text Types</text>
  <text x="310" y="168" text-anchor="middle" font-size="17" fill="#555555">text (analyzed), keyword (exact)</text>
  <rect x="100" y="210" width="420" height="110" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="310" y="260" text-anchor="middle" font-size="24" font-weight="bold" fill="#1565c0">Numeric</text>
  <text x="310" y="298" text-anchor="middle" font-size="17" fill="#555555">integer, long, float, double, scaled_float</text>
  <rect x="100" y="340" width="420" height="110" rx="10" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="310" y="390" text-anchor="middle" font-size="24" font-weight="bold" fill="#795548">Date/Time</text>
  <text x="310" y="428" text-anchor="middle" font-size="17" fill="#555555">date, date_nanos</text>
  <!-- Right column -->
  <rect x="760" y="80" width="420" height="110" rx="10" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="970" y="130" text-anchor="middle" font-size="24" font-weight="bold" fill="#7b1fa2">Boolean</text>
  <text x="970" y="168" text-anchor="middle" font-size="17" fill="#555555">true / false</text>
  <rect x="760" y="210" width="420" height="110" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="970" y="260" text-anchor="middle" font-size="24" font-weight="bold" fill="#e53935">Object / Nested</text>
  <text x="970" y="298" text-anchor="middle" font-size="17" fill="#555555">object (flattened), nested (preserved)</text>
  <rect x="760" y="340" width="420" height="110" rx="10" fill="#e0f7fa" stroke="#00838f" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="970" y="390" text-anchor="middle" font-size="24" font-weight="bold" fill="#00695c">Geo Types</text>
  <text x="970" y="428" text-anchor="middle" font-size="17" fill="#555555">geo_point, geo_shape</text>
  <!-- Note -->
  <rect x="100" y="500" width="1080" height="56" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="534" text-anchor="middle" font-size="17" fill="#1565c0">Use correct types in mappings - changing types requires reindexing. Dynamic mapping auto-detects types.</text>
</svg>

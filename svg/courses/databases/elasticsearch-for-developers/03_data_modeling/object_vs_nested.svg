<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Object vs Nested</text>
  <!-- Object column -->
  <text x="320" y="94" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">Object (Flattened)</text>
  <rect x="100" y="110" width="440" height="220" rx="12" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="320" y="196" text-anchor="middle" font-size="22" fill="#795548" font-weight="bold">user.name:</text>
  <text x="320" y="246" text-anchor="middle" font-size="22" fill="#555555" font-family="monospace">["Alice", "Bob"]</text>
  <text x="320" y="296" text-anchor="middle" font-size="16" fill="#e65100">Fields are merged - queries may cross-match!</text>
  <!-- Nested column -->
  <text x="960" y="94" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">Nested (Preserved)</text>
  <rect x="740" y="110" width="440" height="100" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="960" y="168" text-anchor="middle" font-size="22" fill="#2e7d32" font-family="monospace">{"name": "Alice"}</text>
  <rect x="740" y="230" width="440" height="100" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="960" y="288" text-anchor="middle" font-size="22" fill="#2e7d32" font-family="monospace">{"name": "Bob"}</text>
  <text x="960" y="360" text-anchor="middle" font-size="16" fill="#2e7d32">Objects stored separately - correct queries</text>
  <!-- Comparison table -->
  <rect x="80" y="400" width="1120" height="56" rx="4" fill="url(#grad-accent)"/>
  <text x="320" y="436" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Object</text>
  <text x="800" y="436" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Nested</text>
  <rect x="80" y="456" width="1120" height="52" rx="4" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="320" y="488" text-anchor="middle" font-size="17" fill="#333333">Faster, less storage</text>
  <text x="800" y="488" text-anchor="middle" font-size="17" fill="#333333">Correct per-object queries</text>
  <rect x="80" y="508" width="1120" height="52" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1"/>
  <text x="320" y="540" text-anchor="middle" font-size="17" fill="#333333">Fields merged at index time</text>
  <text x="800" y="540" text-anchor="middle" font-size="17" fill="#333333">Stored as hidden inner documents</text>
  <!-- Note -->
  <rect x="80" y="596" width="1120" height="48" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="626" text-anchor="middle" font-size="16" fill="#1565c0">Use nested when you need to query relationships within an array of objects accurately</text>
</svg>

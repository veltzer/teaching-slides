<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.591121" font-weight="bold" fill="var(--primary-accent)">Object vs Nested</text>
  <text x="297.142743" y="84.765155" text-anchor="middle" font-size="22.464419" font-weight="bold" fill="var(--warn-accent)">Object (Flattened)</text>
  <rect x="61.428571" y="100.335518" width="471.428571" height="214.094059" rx="7.05002" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="297.142743" y="184.026822" text-anchor="middle" font-size="22.464419" fill="var(--text-muted)" font-weight="bold">user.name:</text>
  <text x="297.142743" y="232.684568" text-anchor="middle" font-size="22.464419" fill="var(--text-muted)" font-family="monospace">["Alice", "Bob"]</text>
  <text x="297.142743" y="281.342194" text-anchor="middle" font-size="16.337716" fill="var(--warn-accent)">Fields are merged - queries may cross-match!</text>
  <text x="982.857029" y="84.765155" text-anchor="middle" font-size="22.464419" font-weight="bold" fill="var(--ok-accent)">Nested (Preserved)</text>
  <rect x="747.142857" y="100.335518" width="471.428571" height="97.315492" rx="7.05002" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="982.857029" y="156.778446" text-anchor="middle" font-size="22.464419" fill="var(--ok-accent)" font-family="monospace">{"name": "Alice"}</text>
  <rect x="747.142857" y="217.113964" width="471.428571" height="97.315492" rx="7.05002" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="982.857029" y="273.557012" text-anchor="middle" font-size="22.464419" fill="var(--ok-accent)" font-family="monospace">{"name": "Bob"}</text>
  <text x="982.857029" y="343.624128" text-anchor="middle" font-size="16.337716" fill="var(--ok-accent)">Objects stored separately - correct queries</text>
  <rect x="40" y="382.550397" width="1200" height="54.496632" rx="7.05002" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.142743" y="417.583955" text-anchor="middle" font-size="18.37999" font-weight="bold" fill="var(--bg)">Object</text>
  <text x="811.428571" y="417.583955" text-anchor="middle" font-size="18.37999" font-weight="bold" fill="var(--bg)">Nested</text>
  <rect x="40" y="437.046909" width="1200" height="50.604041" rx="7.05002" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="297.142743" y="468.187876" text-anchor="middle" font-size="17.358912" fill="var(--text)">Faster, less storage</text>
  <text x="811.428571" y="468.187876" text-anchor="middle" font-size="17.358912" fill="var(--text)">Correct per-object queries</text>
  <rect x="40" y="487.651071" width="1200" height="50.604041" rx="7.05002" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="297.142743" y="518.791917" text-anchor="middle" font-size="17.358912" fill="var(--text)">Fields merged at index time</text>
  <text x="811.428571" y="518.791917" text-anchor="middle" font-size="17.358912" fill="var(--text)">Stored as hidden inner documents</text>
  <rect x="40" y="573.288549" width="1200" height="46.711451" rx="7.05002" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="602.4831" text-anchor="middle" font-size="16.337716" fill="var(--primary-accent)">Use nested when you need to query relationships within an array of objects accurately</text>
</svg>
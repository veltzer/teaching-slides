  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="42.6667" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#1565c0">Object vs Nested</ns0:text>
  <ns0:text x="284.4444" y="83.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#e65100">Object (Flattened)</ns0:text>
  <ns0:rect x="88.8889" y="97.7778" width="391.1111" height="195.5556" rx="10.6667" fill="#fff9c4" stroke="#f9a825" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="284.4444" y="174.2222" text-anchor="middle" font-size="19.5556" fill="#795548" font-weight="bold">user.name:</ns0:text>
  <ns0:text x="284.4444" y="218.6667" text-anchor="middle" font-size="19.5556" fill="#555555" font-family="monospace">["Alice", "Bob"]</ns0:text>
  <ns0:text x="284.4444" y="263.1111" text-anchor="middle" font-size="14.2222" fill="#e65100">Fields are merged - queries may cross-match!</ns0:text>
  <ns0:text x="853.3333" y="83.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#2e7d32">Nested (Preserved)</ns0:text>
  <ns0:rect x="657.7778" y="97.7778" width="391.1111" height="88.8889" rx="10.6667" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="853.3333" y="149.3333" text-anchor="middle" font-size="19.5556" fill="#2e7d32" font-family="monospace">{"name": "Alice"}</ns0:text>
  <ns0:rect x="657.7778" y="204.4444" width="391.1111" height="88.8889" rx="10.6667" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="853.3333" y="256" text-anchor="middle" font-size="19.5556" fill="#2e7d32" font-family="monospace">{"name": "Bob"}</ns0:text>
  <ns0:text x="853.3333" y="320" text-anchor="middle" font-size="14.2222" fill="#2e7d32">Objects stored separately - correct queries</ns0:text>
  <ns0:rect x="71.1111" y="355.5556" width="995.5556" height="49.7778" rx="3.5556" fill="url(#grad-accent)" />
  <ns0:text x="284.4444" y="387.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Object</ns0:text>
  <ns0:text x="711.1111" y="387.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Nested</ns0:text>
  <ns0:rect x="71.1111" y="405.3333" width="995.5556" height="46.2222" rx="3.5556" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="284.4444" y="433.7778" text-anchor="middle" font-size="15.1111" fill="#333333">Faster, less storage</ns0:text>
  <ns0:text x="711.1111" y="433.7778" text-anchor="middle" font-size="15.1111" fill="#333333">Correct per-object queries</ns0:text>
  <ns0:rect x="71.1111" y="451.5556" width="995.5556" height="46.2222" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="284.4444" y="480" text-anchor="middle" font-size="15.1111" fill="#333333">Fields merged at index time</ns0:text>
  <ns0:text x="711.1111" y="480" text-anchor="middle" font-size="15.1111" fill="#333333">Stored as hidden inner documents</ns0:text>
  <ns0:rect x="71.1111" y="529.7778" width="995.5556" height="42.6667" rx="5.3333" fill="#f2f6ff" stroke="#bbdefb" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="556.4444" text-anchor="middle" font-size="14.2222" fill="#1565c0">Use nested when you need to query relationships within an array of objects accurately</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.591121" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Object vs Nested</text>
  <text x="297.142743" y="84.765155" text-anchor="middle" font-size="22.464419" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Object (Flattened)</text>
  <rect x="61.428571" y="100.335518" width="471.428571" height="214.094059" rx="7.05002" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.142743" y="184.026822" text-anchor="middle" font-size="22.464419" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">user.name:</text>
  <text x="297.142743" y="232.684568" text-anchor="middle" font-size="22.464419" fill="var(--text-muted)" font-family="Courier New, monospace">["Alice", "Bob"]</text>
  <text x="297.142743" y="281.342194" text-anchor="middle" font-size="16.337716" fill="var(--warn-accent)" font-family="Arial, sans-serif">Fields are merged - queries may cross-match!</text>
  <text x="982.857029" y="84.765155" text-anchor="middle" font-size="22.464419" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Nested (Preserved)</text>
  <rect x="747.142857" y="100.335518" width="471.428571" height="97.315492" rx="7.05002" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.857029" y="156.778446" text-anchor="middle" font-size="22.464419" fill="var(--ok-accent)" font-family="Courier New, monospace">{"name": "Alice"}</text>
  <rect x="747.142857" y="217.113964" width="471.428571" height="97.315492" rx="7.05002" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.857029" y="273.557012" text-anchor="middle" font-size="22.464419" fill="var(--ok-accent)" font-family="Courier New, monospace">{"name": "Bob"}</text>
  <text x="982.857029" y="343.624128" text-anchor="middle" font-size="16.337716" fill="var(--ok-accent)" font-family="Arial, sans-serif">Objects stored separately - correct queries</text>
  <rect x="40" y="382.550397" width="1200" height="54.496632" rx="7.05002" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.142743" y="417.583955" text-anchor="middle" font-size="18.37999" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Object</text>
  <text x="811.428571" y="417.583955" text-anchor="middle" font-size="18.37999" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Nested</text>
  <rect x="40" y="437.046909" width="1200" height="50.604041" rx="7.05002" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="297.142743" y="468.187876" text-anchor="middle" font-size="17.358912" fill="var(--text)" font-family="Arial, sans-serif">Faster, less storage</text>
  <text x="811.428571" y="468.187876" text-anchor="middle" font-size="17.358912" fill="var(--text)" font-family="Arial, sans-serif">Correct per-object queries</text>
  <rect x="40" y="487.651071" width="1200" height="50.604041" rx="7.05002" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="297.142743" y="518.791917" text-anchor="middle" font-size="17.358912" fill="var(--text)" font-family="Arial, sans-serif">Fields merged at index time</text>
  <text x="811.428571" y="518.791917" text-anchor="middle" font-size="17.358912" fill="var(--text)" font-family="Arial, sans-serif">Stored as hidden inner documents</text>
  <rect x="40" y="573.288549" width="1200" height="46.711451" rx="7.05002" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="602.4831" text-anchor="middle" font-size="16.337716" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use nested when you need to query relationships within an array of objects accurately</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="297.142743" y="40" text-anchor="middle" font-size="23.384979742259" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Object (Flattened)</text>
  <rect x="61.428571" y="56.872613254468" width="471.428571" height="232.000131120013" rx="7.338920044294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.142743" y="147.563562794571" text-anchor="middle" font-size="23.384979742259" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">user.name:</text>
  <text x="297.142743" y="200.290871084823" text-anchor="middle" font-size="23.384979742259" fill="var(--text-muted)" font-family="Courier New, monospace">["Alice", "Bob"]</text>
  <text x="297.142743" y="253.018049338697" text-anchor="middle" font-size="17.007212948387" fill="var(--warn-accent)" font-family="Arial, sans-serif">Fields are merged - queries may cross-match!</text>
  <text x="982.857029" y="40" text-anchor="middle" font-size="23.384979742259" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Nested (Preserved)</text>
  <rect x="747.142857" y="56.872613254468" width="471.428571" height="105.454616580503" rx="7.338920044294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.857029" y="118.036228713771" text-anchor="middle" font-size="23.384979742259" fill="var(--ok-accent)" font-family="Courier New, monospace">{"name": "Alice"}</text>
  <rect x="747.142857" y="183.417996673965" width="471.428571" height="105.454616580503" rx="7.338920044294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.857029" y="244.581742169645" text-anchor="middle" font-size="23.384979742259" fill="var(--ok-accent)" font-family="Courier New, monospace">{"name": "Bob"}</text>
  <text x="982.857029" y="320.509024669349" text-anchor="middle" font-size="17.007212948387" fill="var(--ok-accent)" font-family="Arial, sans-serif">Objects stored separately - correct queries</text>
  <rect x="40" y="362.690949540103" width="1200" height="59.054538125222" rx="7.338920044294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.142743" y="400.654590789955" text-anchor="middle" font-size="19.133176505162" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Object</text>
  <text x="811.428571" y="400.654590789955" text-anchor="middle" font-size="19.133176505162" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Nested</text>
  <rect x="40" y="421.745357628949" width="1200" height="54.836384540696" rx="7.338920044294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="297.142743" y="455.490845294275" text-anchor="middle" font-size="18.070256144513" fill="var(--text)" font-family="Arial, sans-serif">Faster, less storage</text>
  <text x="811.428571" y="455.490845294275" text-anchor="middle" font-size="18.070256144513" fill="var(--text)" font-family="Arial, sans-serif">Correct per-object queries</text>
  <rect x="40" y="476.581873289658" width="1200" height="54.836384540696" rx="7.338920044294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="297.142743" y="510.327229834971" text-anchor="middle" font-size="18.070256144513" fill="var(--text)" font-family="Arial, sans-serif">Fields merged at index time</text>
  <text x="811.428571" y="510.327229834971" text-anchor="middle" font-size="18.070256144513" fill="var(--text)" font-family="Arial, sans-serif">Stored as hidden inner documents</text>
  <rect x="40" y="569.381767960193" width="1200" height="50.618232039807" rx="7.338920044294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="601.018048255061" text-anchor="middle" font-size="17.007212948387" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use nested when you need to query relationships within an array of objects accurately</text>
</svg>

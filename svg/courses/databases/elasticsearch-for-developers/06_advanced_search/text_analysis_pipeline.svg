<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="81.8889" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--primary-accent)">Text Analysis Pipeline</text>
  <rect x="77.5" y="201.1111" width="225" height="128.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="190" y="262.3333" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--ok-accent)">Text</text>
  <text x="190" y="294.5556" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">"The Quick Brown Fox"</text>
  <line x1="302.5" y1="265.5556" x2="356.8749" y2="265.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="360.625" y="201.1111" width="243.75" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="482.5" y="262.3333" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--primary-accent)">Tokenizer</text>
  <text x="482.5" y="294.5556" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">Split into tokens</text>
  <text x="482.5" y="312.2777" text-anchor="middle" font-size="12.1663" fill="var(--text-faint)">"The","Quick","Brown","Fox"</text>
  <line x1="604.375" y1="265.5556" x2="658.75" y2="265.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="662.5" y="201.1111" width="243.75" height="128.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="784.375" y="262.3333" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--text-muted)">Filters</text>
  <text x="784.375" y="294.5556" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">lowercase, stop words,</text>
  <text x="784.375" y="312.2777" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">stemming, synonyms</text>
  <line x1="906.2499" y1="265.5556" x2="960.625" y2="265.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="964.3749" y="201.1111" width="243.75" height="128.8889" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1086.25" y="262.3333" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--info-accent)">Terms</text>
  <text x="1086.25" y="294.5556" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">Stored in inverted index</text>
  <text x="1086.25" y="312.2777" text-anchor="middle" font-size="12.1663" fill="var(--text-faint)">"quick","brown","fox"</text>
  <rect x="77.5" y="378.3333" width="1125" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="404.9167" text-anchor="middle" font-size="15.6425" fill="var(--primary-accent)" font-weight="bold">Analysis happens at index time AND query time</text>
  <text x="640" y="430.6944" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">Same analyzer must be used for both, or queries won't match. Use _analyze API to test.</text>
</svg>
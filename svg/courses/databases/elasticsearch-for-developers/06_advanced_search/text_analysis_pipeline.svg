<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="46.2222" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#1565c0">Text Analysis Pipeline</ns0:text>
  <ns0:rect x="35.5556" y="177.7778" width="213.3333" height="142.2222" rx="12.4444" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="142.2222" y="245.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#2e7d32">Text</ns0:text>
  <ns0:text x="142.2222" y="280.8889" text-anchor="middle" font-size="13.3333" fill="#555555">"The Quick Brown Fox"</ns0:text>
  <ns0:line x1="248.8889" y1="248.8889" x2="300.4444" y2="248.8889" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="304" y="177.7778" width="231.1111" height="142.2222" rx="12.4444" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="419.5556" y="245.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#1565c0">Tokenizer</ns0:text>
  <ns0:text x="419.5556" y="280.8889" text-anchor="middle" font-size="13.3333" fill="#555555">Split into tokens</ns0:text>
  <ns0:text x="419.5556" y="300.4444" text-anchor="middle" font-size="12.4444" fill="#888888">"The","Quick","Brown","Fox"</ns0:text>
  <ns0:line x1="535.1111" y1="248.8889" x2="586.6667" y2="248.8889" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="590.2222" y="177.7778" width="231.1111" height="142.2222" rx="12.4444" fill="#fff9c4" stroke="#f9a825" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="705.7778" y="245.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#795548">Filters</ns0:text>
  <ns0:text x="705.7778" y="280.8889" text-anchor="middle" font-size="13.3333" fill="#555555">lowercase, stop words,</ns0:text>
  <ns0:text x="705.7778" y="300.4444" text-anchor="middle" font-size="13.3333" fill="#555555">stemming, synonyms</ns0:text>
  <ns0:line x1="821.3333" y1="248.8889" x2="872.8889" y2="248.8889" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="876.4444" y="177.7778" width="231.1111" height="142.2222" rx="12.4444" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="992" y="245.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#7b1fa2">Terms</ns0:text>
  <ns0:text x="992" y="280.8889" text-anchor="middle" font-size="13.3333" fill="#555555">Stored in inverted index</ns0:text>
  <ns0:text x="992" y="300.4444" text-anchor="middle" font-size="12.4444" fill="#888888">"quick","brown","fox"</ns0:text>
  <ns0:rect x="35.5556" y="373.3333" width="1066.6667" height="71.1111" rx="7.1111" fill="#f2f6ff" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="402.6667" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">Analysis happens at index time AND query time</ns0:text>
  <ns0:text x="568.8889" y="431.1111" text-anchor="middle" font-size="14.2222" fill="#555555">Same analyzer must be used for both, or queries won't match. Use _analyze API to test.</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="637.014978" y="40" text-anchor="middle" font-size="31.779769" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Text Analysis Pipeline</text>
  <rect x="40" y="231.607154" width="238.805991" height="207.142927" rx="7.836279" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.402996" y="330" text-anchor="middle" font-size="29.509729" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Text</text>
  <text x="159.402996" y="381.785852" text-anchor="middle" font-size="17.024839" fill="var(--text-muted)" font-family="Arial, sans-serif">"The Quick Brown Fox"</text>
  <line x1="278.805991" y1="335.178697" x2="336.517333" y2="335.178697" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340.497539" y="231.607154" width="258.706491" height="207.142927" rx="7.836279" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="469.850784" y="330" text-anchor="middle" font-size="29.509729" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Tokenizer</text>
  <text x="469.850784" y="381.785852" text-anchor="middle" font-size="17.024839" fill="var(--text-muted)" font-family="Arial, sans-serif">Split into tokens</text>
  <text x="469.850784" y="410.267805" text-anchor="middle" font-size="15.889754" fill="var(--text-faint)" font-family="Arial, sans-serif">"The","Quick","Brown","Fox"</text>
  <line x1="599.20403" y1="335.178697" x2="656.915477" y2="335.178697" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660.895577" y="231.607154" width="258.706491" height="207.142927" rx="7.836279" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790.248823" y="330" text-anchor="middle" font-size="29.509729" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Filters</text>
  <text x="790.248823" y="381.785852" text-anchor="middle" font-size="17.024839" fill="var(--text-muted)" font-family="Arial, sans-serif">lowercase, stop words,</text>
  <text x="790.248823" y="410.267805" text-anchor="middle" font-size="17.024839" fill="var(--text-muted)" font-family="Arial, sans-serif">stemming, synonyms</text>
  <line x1="919.601962" y1="335.178697" x2="977.313516" y2="335.178697" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="981.293509" y="231.607154" width="258.706491" height="207.142927" rx="7.836279" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.646861" y="330" text-anchor="middle" font-size="29.509729" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Terms</text>
  <text x="1110.646861" y="381.785852" text-anchor="middle" font-size="17.024839" fill="var(--text-muted)" font-family="Arial, sans-serif">Stored in inverted index</text>
  <text x="1110.646861" y="410.267805" text-anchor="middle" font-size="15.889754" fill="var(--text-faint)" font-family="Arial, sans-serif">"quick","brown","fox"</text>
  <rect x="40" y="516.428617" width="1194.029956" height="103.571383" rx="7.836279" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="637.014978" y="559.15195" text-anchor="middle" font-size="20.429832" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Analysis happens at index time AND query time</text>
  <text x="637.014978" y="600.580407" text-anchor="middle" font-size="18.159793" fill="var(--text-muted)" font-family="Arial, sans-serif">Same analyzer must be used for both, or queries won't match. Use _analyze API to test.</text>
</svg>

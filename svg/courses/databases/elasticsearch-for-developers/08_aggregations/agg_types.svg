<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.854226236055" font-weight="bold" fill="var(--text)">Aggregation Families</text>

  <rect x="40" y="86.194690265487" width="382.758620689655" height="246.371681415929" rx="10.305080798591" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.610161597182" font-weight="bold" fill="var(--primary-text)">Bucket</text>
  <text x="60.689655172414" y="158.053097345133" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--primary-text)">Group documents into buckets</text>
  <text x="60.689655172414" y="188.849557522124" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">- terms: by field value</text>
  <text x="60.689655172414" y="214.513274336283" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">- date_histogram: by time interval</text>
  <text x="60.689655172414" y="240.176991150443" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">- range: by numeric ranges</text>
  <text x="60.689655172414" y="265.840707964602" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">- filter / filters: arbitrary</text>
  <text x="60.689655172414" y="312.035398230089" font-family="Arial, sans-serif" font-size="13.396605038168" font-style="italic" fill="var(--primary-text)">Like SQL GROUP BY</text>

  <rect x="448.620689655172" y="86.194690265487" width="382.758620689655" height="246.371681415929" rx="10.305080798591" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.610161597182" font-weight="bold" fill="var(--ok-text)">Metric</text>
  <text x="469.310344827586" y="158.053097345133" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--ok-text)">Compute a value from a set</text>
  <text x="469.310344827586" y="188.849557522124" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">- sum / avg / min / max</text>
  <text x="469.310344827586" y="214.513274336283" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">- cardinality (HLL approx)</text>
  <text x="469.310344827586" y="240.176991150443" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">- percentiles (TDigest)</text>
  <text x="469.310344827586" y="265.840707964602" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">- stats / extended_stats</text>
  <text x="469.310344827586" y="312.035398230089" font-family="Arial, sans-serif" font-size="13.396605038168" font-style="italic" fill="var(--ok-text)">Like SQL aggregate functions</text>

  <rect x="857.241379310345" y="86.194690265487" width="382.758620689655" height="246.371681415929" rx="10.305080798591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.610161597182" font-weight="bold" fill="var(--info-text)">Pipeline</text>
  <text x="877.931034482759" y="158.053097345133" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--info-text)">Operate on other agg outputs</text>
  <text x="877.931034482759" y="188.849557522124" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">- derivative</text>
  <text x="877.931034482759" y="214.513274336283" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">- moving_avg</text>
  <text x="877.931034482759" y="240.176991150443" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">- cumulative_sum</text>
  <text x="877.931034482759" y="265.840707964602" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">- bucket_script</text>
  <text x="877.931034482759" y="312.035398230089" font-family="Arial, sans-serif" font-size="13.396605038168" font-style="italic" fill="var(--info-text)">Post-process bucket results</text>

  <rect x="40" y="373.628318584071" width="1200" height="246.371681415929" rx="10.305080798591" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="409.557522123894" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--text)">Nesting bucket and metric</text>
  <text x="60.689655172414" y="445.486725663717" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">"aggs": {</text>
  <text x="102.068965517241" y="471.150442477876" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">"by_category": {</text>
  <text x="143.448275862069" y="496.814159292035" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--primary-fill)">"terms": { "field": "category.keyword" },</text>
  <text x="143.448275862069" y="522.477876106195" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">"aggs": {</text>
  <text x="184.827586206897" y="548.141592920354" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--ok-fill)">"avg_price": { "avg": { "field": "price" } }</text>
  <text x="143.448275862069" y="573.805309734513" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">}</text>
  <text x="102.068965517241" y="599.469026548673" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">}</text>
  <text x="640" y="614.867256637168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" font-style="italic" fill="var(--text-muted)">"category groups, with average price per group"</text>
</svg>

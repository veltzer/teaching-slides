<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.307565" font-weight="bold" fill="var(--primary-accent)">Aggregation Types</text>
  <rect x="40" y="76.249985" width="514.285714" height="181.250044" rx="6.9801" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="297.142743" y="144.934193" text-anchor="middle" font-size="26.285546" font-weight="bold" fill="var(--ok-accent)">Metrics</text>
  <text x="297.142743" y="184.999941" text-anchor="middle" font-size="17.186752" fill="var(--text-muted)">Calculate values from docs</text>
  <text x="297.142743" y="211.710519" text-anchor="middle" font-size="16.175685" fill="var(--text-faint)">avg, min, max, sum, count, percentiles</text>
  <rect x="725.714286" y="76.249985" width="514.285714" height="181.250044" rx="6.9801" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="982.857029" y="144.934193" text-anchor="middle" font-size="26.285546" font-weight="bold" fill="var(--primary-accent)">Buckets</text>
  <text x="982.857029" y="184.999941" text-anchor="middle" font-size="17.186752" fill="var(--text-muted)">Group documents</text>
  <text x="982.857029" y="211.710519" text-anchor="middle" font-size="16.175685" fill="var(--text-faint)">terms, range, date_histogram, filters</text>
  <rect x="382.857143" y="343.355289" width="514.285714" height="181.250044" rx="6.9801" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="412.039496" text-anchor="middle" font-size="26.285546" font-weight="bold" fill="var(--text-muted)">Pipeline</text>
  <text x="640" y="452.105244" text-anchor="middle" font-size="17.186752" fill="var(--text-muted)">Process aggregation results</text>
  <text x="640" y="478.815704" text-anchor="middle" font-size="16.175685" fill="var(--text-faint)">moving_avg, derivative, cumulative_sum</text>
  <line x1="297.142743" y1="257.50003" x2="489.999886" y2="343.355289" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow)" />
  <line x1="982.857029" y1="257.50003" x2="790" y2="343.355289" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow)" />
  <rect x="40" y="566.578963" width="1200" height="53.421037" rx="6.9801" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="599.013067" text-anchor="middle" font-size="16.175685" fill="var(--primary-accent)">Aggs can be nested: bucket aggs can contain metric aggs for per-bucket statistics</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="125.714286" y="183.971766453582" width="300" height="164.538997466728" rx="7.24726041388" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="275.714286" y="272.4113702526" text-anchor="middle" font-size="29.391024118865" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Metrics</text>
  <text x="275.714286" y="313.546215399412" text-anchor="middle" font-size="17.844568323607" fill="var(--text-muted)" font-family="Arial, sans-serif">avg, min, max, sum</text>
  <text x="275.714286" y="399.929095992151" text-anchor="middle" font-size="16.794802135734" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Cheap - O(1) per shard</text>
  <rect x="489.999886" y="122.269562236902" width="300" height="226.241200633763" rx="7.24726041388" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="225.106355486951" text-anchor="middle" font-size="29.391024118865" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Terms</text>
  <text x="640" y="266.241200633763" text-anchor="middle" font-size="17.844568323607" fill="var(--text-muted)" font-family="Arial, sans-serif">top-N buckets</text>
  <text x="640" y="399.929095992151" text-anchor="middle" font-size="16.794802135734" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Medium - scales with cardinality</text>
  <rect x="854.285714" y="40" width="321.428571" height="308.510635863589" rx="7.24726041388" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015" y="163.404280376638" text-anchor="middle" font-size="29.391024118865" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cardinality</text>
  <text x="1015" y="208.652570886363" text-anchor="middle" font-size="17.844568323607" fill="var(--text-muted)" font-family="Arial, sans-serif">unique count (HLL)</text>
  <text x="1015" y="399.929095992151" text-anchor="middle" font-size="16.794802135734" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Expensive - HyperLogLog algorithm</text>
  <line x1="104.285714" y1="482.198531221977" x2="1197.142857" y2="482.198531221977" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="523.333376368789" text-anchor="middle" font-size="18.894212593366" fill="var(--text-muted)" font-family="Arial, sans-serif">Low Cost → High Cost</text>
  <rect x="40" y="562.4113702526" width="1200" height="57.5886297474" rx="7.24726041388" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="597.375917723853" text-anchor="middle" font-size="16.794802135734" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use precision_threshold on cardinality aggs. Enable doc_values on fields used in aggs.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.687549" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Aggregation Cost (Low to High)</text>
  <rect x="125.714286" y="204.594672" width="300" height="156.756767" rx="7.073797" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="275.714286" y="288.851332" text-anchor="middle" font-size="28.687549" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Metrics</text>
  <text x="275.714286" y="328.040615" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">avg, min, max, sum</text>
  <text x="275.714286" y="410.337829" text-anchor="middle" font-size="16.392818" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Cheap - O(1) per shard</text>
  <rect x="489.999886" y="145.810808" width="300" height="215.54063" rx="7.073797" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="243.783711" text-anchor="middle" font-size="28.687549" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Terms</text>
  <text x="640" y="282.972994" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">top-N buckets</text>
  <text x="640" y="410.337829" text-anchor="middle" font-size="16.392818" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Medium - scales with cardinality</text>
  <rect x="854.285714" y="67.432364" width="321.428571" height="293.918953" rx="7.073797" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015" y="184.99997" text-anchor="middle" font-size="28.687549" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cardinality</text>
  <text x="1015" y="228.108144" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">unique count (HLL)</text>
  <text x="1015" y="410.337829" text-anchor="middle" font-size="16.392818" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Expensive - HyperLogLog algorithm</text>
  <line x1="104.285714" y1="488.716152" x2="1197.142857" y2="488.716152" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="527.905435" text-anchor="middle" font-size="18.441979" fill="var(--text-muted)" font-family="Arial, sans-serif">Low Cost → High Cost</text>
  <rect x="40" y="565.13515" width="1200" height="54.86485" rx="7.073797" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="598.445973" text-anchor="middle" font-size="16.392818" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use precision_threshold on cardinality aggs. Enable doc_values on fields used in aggs.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Event sources -->
  <rect x="40" y="40" width="240" height="426.122449162849" rx="6.527805711862" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="93.265306706581" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.287157731584" font-weight="bold" fill="var(--ok-text)">Event</text>
  <text x="160" y="134.693878215327" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.759352019722" font-weight="bold" fill="var(--ok-text)">Sources</text>
  <text x="160" y="193.877550837151" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--ok-text)">User actions</text>
  <text x="160" y="235.306122345898" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--ok-text)">DB change log</text>
  <text x="160" y="276.734693854644" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--ok-text)">API webhooks</text>
  <text x="160" y="318.16326536339" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--ok-text)">IoT telemetry</text>
  <text x="160" y="359.591836872137" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--ok-text)">File uploads</text>

  <!-- Queue -->
  <rect x="330" y="40" width="240" height="426.122449162849" rx="6.527805711862" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="93.265306706581" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.287157731584" font-weight="bold" fill="var(--primary-text)">Message</text>
  <text x="450" y="128.775510055185" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.287157731584" font-weight="bold" fill="var(--primary-text)">Queue</text>
  <text x="450" y="187.959183799459" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--primary-text)">Kafka / Pulsar</text>
  <text x="450" y="229.387755308205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--primary-text)">RabbitMQ</text>
  <text x="450" y="288.571429052478" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514279656" fill="var(--primary-text)">Buffer + replay</text>
  <text x="450" y="318.16326536339" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514279656" fill="var(--primary-text)">Decouples load</text>
  <text x="450" y="347.755101674302" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514279656" fill="var(--primary-text)">Back-pressure</text>

  <!-- Processor -->
  <rect x="620" y="40" width="240" height="426.122449162849" rx="6.527805711862" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="93.265306706581" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.287157731584" font-weight="bold" fill="var(--warn-text)">Processor</text>
  <text x="740" y="152.448979328405" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--warn-text)">Consume batch</text>
  <text x="740" y="193.877550837151" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--warn-text)">Transform docs</text>
  <text x="740" y="235.306122345898" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--warn-text)">Enrich fields</text>
  <text x="740" y="276.734693854644" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--warn-text)">Deduplicate</text>
  <text x="740" y="335.918367598917" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514279656" fill="var(--warn-text)">Async workers</text>
  <text x="740" y="365.510203909829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514279656" fill="var(--warn-text)">Retry on error</text>

  <!-- Elasticsearch -->
  <rect x="910" y="40" width="240" height="426.122449162849" rx="6.527805711862" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="93.265306706581" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.287157731584" font-weight="bold" fill="var(--info-text)">Elasticsearch</text>
  <text x="1030" y="152.448979328405" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--info-text)">Bulk API</text>
  <text x="1030" y="193.877550837151" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--info-text)">Refresh interval</text>
  <text x="1030" y="235.306122345898" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--info-text)">Near-real-time</text>
  <text x="1030" y="276.734693854644" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--info-text)">Visible &lt; 1 sec</text>
  <text x="1030" y="335.918367598917" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514279656" fill="var(--info-text)">Index aliases</text>
  <text x="1030" y="365.510203909829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514279656" fill="var(--info-text)">Versioning</text>

  <!-- Arrows -->
  <line x1="280" y1="253.061224581424" x2="328" y2="253.061224581424" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="570" y1="253.061224581424" x2="618" y2="253.061224581424" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="860" y1="253.061224581424" x2="908" y2="253.061224581424" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Bottom banner -->
  <rect x="40" y="507.551020671595" width="1200" height="112.448979328405" rx="6.527805711862" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="548.979592180341" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.759352019722" font-weight="bold" fill="var(--text)">Decoupled pipeline = resilient, scalable, fast indexing</text>
  <text x="640" y="584.489795528946" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--text-muted)">Each stage can fail, retry, or scale independently without blocking the producers</text>
  <text x="640" y="611.714285922741" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.495449163791" fill="var(--text-muted)">End-to-end latency typically 100 ms to a few seconds</text>
</svg>

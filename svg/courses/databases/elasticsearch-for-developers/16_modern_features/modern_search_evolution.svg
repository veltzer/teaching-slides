<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <rect x="40" y="40" width="285" height="234.035087719298" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="80.701754385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.165942015287" font-weight="bold" fill="var(--primary-text)">Keyword Search</text>
  <text x="182" y="121.40350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">Inverted index</text>
  <text x="182" y="151.929824561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">TF/IDF, BM25</text>
  <text x="182" y="182.456140350877" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">Exact-term match</text>
  <text x="182" y="218.070175438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">Misses synonyms</text>
  <text x="182" y="253.684210526316" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--primary-text)">Elasticsearch classic</text>

  <rect x="335" y="40" width="285" height="234.035087719298" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477" y="80.701754385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.165942015287" font-weight="bold" fill="var(--ok-text)">Vector Search</text>
  <text x="477" y="121.40350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">Dense embeddings</text>
  <text x="477" y="151.929824561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">kNN over HNSW</text>
  <text x="477" y="182.456140350877" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">Semantic similarity</text>
  <text x="477" y="218.070175438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">Paraphrase, crosslingual</text>
  <text x="477" y="253.684210526316" text-anchor="middle" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--ok-text)">dense_vector 8.0+</text>

  <rect x="630" y="40" width="285" height="234.035087719298" rx="6.052402741669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="772" y="80.701754385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.165942015287" font-weight="bold" fill="var(--warn-text)">Hybrid Search</text>
  <text x="772" y="121.40350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--warn-text)">BM25 + vector</text>
  <text x="772" y="151.929824561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--warn-text)">Rank Fusion (RRF)</text>
  <text x="772" y="182.456140350877" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--warn-text)">Best of both</text>
  <text x="772" y="218.070175438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">Rare terms + meaning</text>
  <text x="772" y="253.684210526316" text-anchor="middle" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--warn-text)">rank: rrf (8.9+)</text>

  <rect x="925" y="40" width="315" height="234.035087719298" rx="6.052402741669" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082" y="80.701754385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.165942015287" font-weight="bold" fill="var(--info-text)">RAG + LLM</text>
  <text x="1082" y="121.40350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--info-text)">Retrieve top passages</text>
  <text x="1082" y="151.929824561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--info-text)">Feed LLM context</text>
  <text x="1082" y="182.456140350877" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--info-text)">Grounded answers</text>
  <text x="1082" y="218.070175438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--info-text)">ELSER + Inference API</text>
  <text x="1082" y="253.684210526316" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--info-text)">Search AI Platform</text>

  <line x1="325" y1="157.017543859649" x2="335" y2="157.017543859649" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="157.017543859649" x2="630" y2="157.017543859649" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="915" y1="157.017543859649" x2="925" y2="157.017543859649" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="304.561403508772" width="1200" height="315.438596491228" rx="6.052402741669" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="350.350877192982" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.165942015287" font-weight="bold" fill="var(--text)">What Changed</text>
  <text x="640" y="391.052631578947" text-anchor="middle" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--text-muted)">dense_vector with HNSW kNN</text>
  <text x="640" y="426.666666666667" text-anchor="middle" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--text-muted)">text_expansion + ELSER</text>
  <text x="640" y="462.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--text-muted)">Retrievers blend strategies via RRF</text>
  <text x="640" y="497.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--text-muted)">Inference API hosts embedding models</text>
  <text x="640" y="533.508771929825" text-anchor="middle" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--text-muted)">semantic_text auto-embeds</text>
  <text x="640" y="574.21052631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text-faint)">One cluster: keyword, vector, RAG</text>
</svg>

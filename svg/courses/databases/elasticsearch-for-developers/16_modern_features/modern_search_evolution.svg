<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="285" height="232" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="82.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--primary-text)">Keyword Search</text>
  <text x="182" y="119.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--primary-text)">Inverted index</text>
  <text x="182" y="145.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--primary-text)">TF/IDF, BM25</text>
  <text x="182" y="171.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--primary-text)">Fast exact-term match</text>
  <text x="182" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--primary-text)">Misses synonyms,</text>
  <text x="182" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--primary-text)">typos and intent</text>
  <text x="182" y="256.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--primary-text)">Elasticsearch classic</text>

  <rect x="335" y="40" width="285" height="232" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477" y="82.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--ok-text)">Vector Search</text>
  <text x="477" y="119.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">Dense embeddings</text>
  <text x="477" y="145.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">kNN over HNSW graph</text>
  <text x="477" y="171.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">Semantic similarity</text>
  <text x="477" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--ok-text)">Handles paraphrase</text>
  <text x="477" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--ok-text)">and crosslingual queries</text>
  <text x="477" y="256.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--ok-text)">dense_vector since 8.0</text>

  <rect x="630" y="40" width="285" height="232" rx="6.161464" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="772" y="82.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--warn-text)">Hybrid Search</text>
  <text x="772" y="119.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--warn-text)">BM25 + vector fusion</text>
  <text x="772" y="145.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--warn-text)">Reciprocal Rank Fusion</text>
  <text x="772" y="171.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--warn-text)">Best of both signals</text>
  <text x="772" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--warn-text)">Handles rare terms</text>
  <text x="772" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--warn-text)">and fuzzy meaning</text>
  <text x="772" y="256.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--warn-text)">rank: rrf in 8.9+</text>

  <rect x="925" y="40" width="315" height="232" rx="6.161464" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082" y="82.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--info-text)">RAG and LLM</text>
  <text x="1082" y="119.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">Retrieve top passages</text>
  <text x="1082" y="145.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">Feed as context to LLM</text>
  <text x="1082" y="171.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">Grounded answers</text>
  <text x="1082" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--info-text)">ELSER sparse encoders</text>
  <text x="1082" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--info-text)">Inference API built in</text>
  <text x="1082" y="256.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--info-text)">Search AI Platform</text>

  <line x1="325" y1="156" x2="335" y2="156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="156" x2="630" y2="156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="915" y1="156" x2="925" y2="156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="303.636364" width="1200" height="316.363636" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="343.709091" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--text)">What Changed in Elasticsearch</text>
  <text x="640" y="382.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--text-muted)">dense_vector field with HNSW indexing for approximate kNN</text>
  <text x="640" y="414.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--text-muted)">text_expansion query backed by ELSER for sparse semantic retrieval</text>
  <text x="640" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--text-muted)">Retrievers and RRF blend multiple strategies in one request</text>
  <text x="640" y="477.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--text-muted)">Inference API hosts third-party embedding models out of the box</text>
  <text x="640" y="509.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--text-muted)">semantic_text mapping auto-chunks and embeds documents on ingest</text>
  <text x="640" y="546.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-faint)">Same cluster now powers keyword, vector and RAG workloads</text>
  <text x="640" y="577.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-faint)">Design for hybrid from day one to future-proof relevance</text>
</svg>

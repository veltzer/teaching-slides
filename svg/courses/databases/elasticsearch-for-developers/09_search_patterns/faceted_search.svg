<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="321.428571" height="457.89475150376" rx="7.462042163647" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="200.714171" y="105.413497261007" text-anchor="middle" font-size="21.615794001581" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Filters</text>
  <text x="72.142857" y="170.826994522015" font-size="23.777299593537" fill="var(--text-muted)" font-family="Arial, sans-serif">□ Brand A (42)</text>
  <text x="72.142857" y="225.338309532758" font-size="23.777299593537" fill="var(--text-muted)" font-family="Arial, sans-serif">□ Brand B (17)</text>
  <text x="72.142857" y="279.849624543502" font-size="23.777299593537" fill="var(--text-muted)" font-family="Arial, sans-serif">□ Brand C (8)</text>
  <text x="72.142857" y="345.263257142863" font-size="23.777299593537" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">□ Price 0-50</text>
  <text x="72.142857" y="399.774437943072" font-size="23.777299593537" fill="var(--text-muted)" font-family="Arial, sans-serif">□ Price 50-100</text>
  <text x="72.142857" y="465.18793520408" font-size="23.777299593537" fill="var(--text-muted)" font-family="Arial, sans-serif">□ Color: Red</text>
  <rect x="425.714286" y="40" width="814.285714" height="457.89475150376" rx="7.462042163647" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.857143" y="105.413497261007" text-anchor="middle" font-size="21.615794001581" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Results</text>
  <rect x="457.857143" y="138.120313560688" width="750" height="87.21799597207" rx="7.462042163647" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889"/>
  <text x="832.857143" y="190.451057008589" text-anchor="middle" font-size="19.454165218957" fill="var(--text)" font-family="Arial, sans-serif">Product 1 - $29.99 - Brand A</text>
  <rect x="457.857143" y="242.781935794843" width="750" height="87.21799597207" rx="7.462042163647" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889"/>
  <text x="832.857143" y="295.112814581098" text-anchor="middle" font-size="19.454165218957" fill="var(--text)" font-family="Arial, sans-serif">Product 2 - $49.99 - Brand A</text>
  <rect x="457.857143" y="347.443558028998" width="750" height="87.21799597207" rx="7.462042163647" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889"/>
  <text x="832.857143" y="399.774437943072" text-anchor="middle" font-size="19.454165218957" fill="var(--text)" font-family="Arial, sans-serif">Product 3 - $14.99 - Brand C</text>
  <rect x="40" y="558.94737518797" width="1200" height="61.05262481203" rx="7.462042163647" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="596.015065064448" text-anchor="middle" font-size="17.292536436332" fill="var(--primary-accent)" font-family="Arial, sans-serif">Implement with: terms agg for facets + filter context for selected filters. Post-filter for result filtering.</text>
</svg>

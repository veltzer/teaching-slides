<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.495659" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Faceted Search</text>
  <rect x="40" y="105.733365" width="321.428571" height="405.999988" rx="7.026481" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="200.714171" y="163.733329" text-anchor="middle" font-size="20.354075" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Filters</text>
  <text x="72.142857" y="221.733293" font-size="22.389413" fill="var(--text-muted)" font-family="Arial, sans-serif">□ Brand A (42)</text>
  <text x="72.142857" y="270.066656" font-size="22.389413" fill="var(--text-muted)" font-family="Arial, sans-serif">□ Brand B (17)</text>
  <text x="72.142857" y="318.400019" font-size="22.389413" fill="var(--text-muted)" font-family="Arial, sans-serif">□ Brand C (8)</text>
  <text x="72.142857" y="376.400103" font-size="22.389413" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">□ Price 0-50</text>
  <text x="72.142857" y="424.733347" font-size="22.389413" fill="var(--text-muted)" font-family="Arial, sans-serif">□ Price 50-100</text>
  <text x="72.142857" y="482.733311" font-size="22.389413" fill="var(--text-muted)" font-family="Arial, sans-serif">□ Color: Red</text>
  <rect x="425.714286" y="105.733365" width="814.285714" height="405.999988" rx="7.026481" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.857143" y="163.733329" text-anchor="middle" font-size="20.354075" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Results</text>
  <rect x="457.857143" y="192.733371" width="750" height="77.333285" rx="7.026481" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889"/>
  <text x="832.857143" y="239.133294" text-anchor="middle" font-size="18.318621" fill="var(--text)" font-family="Arial, sans-serif">Product 1 - $29.99 - Brand A</text>
  <rect x="457.857143" y="285.533337" width="750" height="77.333285" rx="7.026481" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889"/>
  <text x="832.857143" y="331.93338" text-anchor="middle" font-size="18.318621" fill="var(--text)" font-family="Arial, sans-serif">Product 2 - $49.99 - Brand A</text>
  <rect x="457.857143" y="378.333303" width="750" height="77.333285" rx="7.026481" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889"/>
  <text x="832.857143" y="424.733347" text-anchor="middle" font-size="18.318621" fill="var(--text)" font-family="Arial, sans-serif">Product 3 - $14.99 - Brand C</text>
  <rect x="40" y="565.866676" width="1200" height="54.133324" rx="7.026481" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="598.733359" text-anchor="middle" font-size="16.283167" fill="var(--primary-accent)" font-family="Arial, sans-serif">Implement with: terms agg for facets + filter context for selected filters. Post-filter for result filtering.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="568.8889" y="46.2222" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="var(--primary-accent)">Faceted Search</text>
  <rect x="71.1111" y="106.6667" width="266.6667" height="373.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="204.4444" y="160" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text)">Filters</text>
  <text x="97.7778" y="213.3333" font-size="19.5556" fill="var(--text-muted)">□ Brand A (42)</text>
  <text x="97.7778" y="257.7778" font-size="19.5556" fill="var(--text-muted)">□ Brand B (17)</text>
  <text x="97.7778" y="302.2222" font-size="19.5556" fill="var(--text-muted)">□ Brand C (8)</text>
  <text x="97.7778" y="355.5556" font-size="19.5556" fill="var(--primary-accent)" font-weight="bold">□ Price 0-50</text>
  <text x="97.7778" y="400" font-size="19.5556" fill="var(--text-muted)">□ Price 50-100</text>
  <text x="97.7778" y="453.3333" font-size="19.5556" fill="var(--text-muted)">□ Color: Red</text>
  <rect x="391.1111" y="106.6667" width="675.5556" height="373.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="728.8889" y="160" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">Results</text>
  <rect x="417.7778" y="186.6667" width="622.2222" height="71.1111" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889" />
  <text x="728.8889" y="229.3333" text-anchor="middle" font-size="16" fill="var(--text)">Product 1 - $29.99 - Brand A</text>
  <rect x="417.7778" y="272" width="622.2222" height="71.1111" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889" />
  <text x="728.8889" y="314.6667" text-anchor="middle" font-size="16" fill="var(--text)">Product 2 - $49.99 - Brand A</text>
  <rect x="417.7778" y="357.3333" width="622.2222" height="71.1111" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889" />
  <text x="728.8889" y="400" text-anchor="middle" font-size="16" fill="var(--text)">Product 3 - $14.99 - Brand C</text>
  <rect x="71.1111" y="529.7778" width="995.5556" height="49.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="560" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)">Implement with: terms agg for facets + filter context for selected filters. Post-filter for result filtering.</text>
</svg>
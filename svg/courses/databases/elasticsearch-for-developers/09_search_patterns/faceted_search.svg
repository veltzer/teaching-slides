<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.495659" font-weight="bold" fill="var(--primary-accent)">Faceted Search</text>
  <rect x="40" y="105.733365" width="321.428571" height="405.999988" rx="7.026481" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="200.714171" y="163.733329" text-anchor="middle" font-size="20.354075" font-weight="bold" fill="var(--text)">Filters</text>
  <text x="72.142857" y="221.733293" font-size="22.389413" fill="var(--text-muted)">□ Brand A (42)</text>
  <text x="72.142857" y="270.066656" font-size="22.389413" fill="var(--text-muted)">□ Brand B (17)</text>
  <text x="72.142857" y="318.400019" font-size="22.389413" fill="var(--text-muted)">□ Brand C (8)</text>
  <text x="72.142857" y="376.400103" font-size="22.389413" fill="var(--primary-accent)" font-weight="bold">□ Price 0-50</text>
  <text x="72.142857" y="424.733347" font-size="22.389413" fill="var(--text-muted)">□ Price 50-100</text>
  <text x="72.142857" y="482.733311" font-size="22.389413" fill="var(--text-muted)">□ Color: Red</text>
  <rect x="425.714286" y="105.733365" width="814.285714" height="405.999988" rx="7.026481" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="832.857143" y="163.733329" text-anchor="middle" font-size="20.354075" font-weight="bold" fill="var(--ok-accent)">Results</text>
  <rect x="457.857143" y="192.733371" width="750" height="77.333285" rx="7.026481" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889" />
  <text x="832.857143" y="239.133294" text-anchor="middle" font-size="18.318621" fill="var(--text)">Product 1 - $29.99 - Brand A</text>
  <rect x="457.857143" y="285.533337" width="750" height="77.333285" rx="7.026481" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889" />
  <text x="832.857143" y="331.93338" text-anchor="middle" font-size="18.318621" fill="var(--text)">Product 2 - $49.99 - Brand A</text>
  <rect x="457.857143" y="378.333303" width="750" height="77.333285" rx="7.026481" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889" />
  <text x="832.857143" y="424.733347" text-anchor="middle" font-size="18.318621" fill="var(--text)">Product 3 - $14.99 - Brand C</text>
  <rect x="40" y="565.866676" width="1200" height="54.133324" rx="7.026481" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="598.733359" text-anchor="middle" font-size="16.283167" fill="var(--primary-accent)">Implement with: terms agg for facets + filter context for selected filters. Post-filter for result filtering.</text>
</svg>
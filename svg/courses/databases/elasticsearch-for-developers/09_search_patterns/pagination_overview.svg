<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="372.413793" height="224.806222260322" rx="7.445068283691" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.206897" y="116.434012734087" text-anchor="middle" font-size="25.879801490159" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">from / size</text>
  <text x="226.206897" y="168.139509361095" text-anchor="middle" font-size="19.409913019143" fill="var(--text-muted)" font-family="Arial, sans-serif">Simple pagination</text>
  <text x="226.206897" y="208.604632296015" text-anchor="middle" font-size="17.253200993439" fill="var(--text-muted)" font-family="Arial, sans-serif">Max 10,000 results</text>
  <text x="226.206897" y="240.077427657108" text-anchor="middle" font-size="17.253200993439" fill="var(--text-faint)" font-family="Arial, sans-serif">Best for: first few pages</text>
  <rect x="474.482759" y="40" width="372.413793" height="224.806222260322" rx="7.445068283691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.689655" y="116.434012734087" text-anchor="middle" font-size="25.879801490159" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">search_after</text>
  <text x="660.689655" y="168.139509361095" text-anchor="middle" font-size="19.409913019143" fill="var(--text-muted)" font-family="Arial, sans-serif">Deep pagination</text>
  <text x="660.689655" y="208.604632296015" text-anchor="middle" font-size="17.253200993439" fill="var(--text-muted)" font-family="Arial, sans-serif">No result limit</text>
  <text x="660.689655" y="240.077427657108" text-anchor="middle" font-size="17.253200993439" fill="var(--text-faint)" font-family="Arial, sans-serif">Best for: infinite scroll</text>
  <rect x="908.965517" y="40" width="331.034372" height="224.806222260322" rx="7.445068283691" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.482759" y="116.434012734087" text-anchor="middle" font-size="25.879801490159" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">PIT</text>
  <text x="1074.482759" y="168.139509361095" text-anchor="middle" font-size="19.409913019143" fill="var(--text-muted)" font-family="Arial, sans-serif">Point in Time</text>
  <text x="1074.482759" y="208.604632296015" text-anchor="middle" font-size="17.253200993439" fill="var(--text-muted)" font-family="Arial, sans-serif">Consistent snapshot</text>
  <text x="1074.482759" y="240.077427657108" text-anchor="middle" font-size="17.253200993439" fill="var(--text-faint)" font-family="Arial, sans-serif">Best for: export/scroll</text>
  <rect x="40" y="330" width="1200" height="58.449637183343" rx="7.445068283691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.206897" y="368.216935917428" text-anchor="middle" font-size="18.331618907814" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">from/size</text>
  <text x="660.689655" y="368.216935917428" text-anchor="middle" font-size="18.331618907814" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">search_after</text>
  <text x="1074.482759" y="368.216935917428" text-anchor="middle" font-size="18.331618907814" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">PIT</text>
  <rect x="40" y="388.449497384888" width="1200" height="56.201451266627" rx="7.445068283691" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="226.206897" y="424.418666780965" text-anchor="middle" font-size="17.253200993439" fill="var(--text)" font-family="Arial, sans-serif">Simple, stateless</text>
  <text x="660.689655" y="424.418666780965" text-anchor="middle" font-size="17.253200993439" fill="var(--text)" font-family="Arial, sans-serif">Stateful, cursor-based</text>
  <text x="1074.482759" y="424.418666780965" text-anchor="middle" font-size="17.253200993439" fill="var(--text)" font-family="Arial, sans-serif">Consistent view</text>
  <rect x="40" y="444.651228248425" width="1200" height="56.201451266627" rx="7.445068283691" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="226.206897" y="480.620116946817" text-anchor="middle" font-size="17.253200993439" fill="var(--text)" font-family="Arial, sans-serif">Expensive at deep pages</text>
  <text x="660.689655" y="480.620116946817" text-anchor="middle" font-size="17.253200993439" fill="var(--text)" font-family="Arial, sans-serif">Efficient for all depths</text>
  <text x="1074.482759" y="480.620116946817" text-anchor="middle" font-size="17.253200993439" fill="var(--text)" font-family="Arial, sans-serif">Holds resources on ES</text>
  <rect x="40" y="557.054269479358" width="1200" height="62.945730520642" rx="7.445068283691" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="595.271345195242" text-anchor="middle" font-size="17.253200993439" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use from/size for small results, search_after + PIT for deep or large result sets</text>
</svg>

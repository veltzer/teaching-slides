<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="42.6667" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#1565c0">Pagination Strategies</ns0:text>
  <ns0:rect x="53.3333" y="88.8889" width="320" height="177.7778" rx="10.6667" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="213.3333" y="149.3333" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#2e7d32">from / size</ns0:text>
  <ns0:text x="213.3333" y="190.2222" text-anchor="middle" font-size="16" fill="#555555">Simple pagination</ns0:text>
  <ns0:text x="213.3333" y="222.2222" text-anchor="middle" font-size="14.2222" fill="#555555">Max 10,000 results</ns0:text>
  <ns0:text x="213.3333" y="247.1111" text-anchor="middle" font-size="14.2222" fill="#888888">Best for: first few pages</ns0:text>
  <ns0:rect x="426.6667" y="88.8889" width="320" height="177.7778" rx="10.6667" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="586.6667" y="149.3333" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#1565c0">search_after</ns0:text>
  <ns0:text x="586.6667" y="190.2222" text-anchor="middle" font-size="16" fill="#555555">Deep pagination</ns0:text>
  <ns0:text x="586.6667" y="222.2222" text-anchor="middle" font-size="14.2222" fill="#555555">No result limit</ns0:text>
  <ns0:text x="586.6667" y="247.1111" text-anchor="middle" font-size="14.2222" fill="#888888">Best for: infinite scroll</ns0:text>
  <ns0:rect x="800" y="88.8889" width="284.4444" height="177.7778" rx="10.6667" fill="#fff9c4" stroke="#f9a825" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="942.2222" y="149.3333" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#795548">PIT</ns0:text>
  <ns0:text x="942.2222" y="190.2222" text-anchor="middle" font-size="16" fill="#555555">Point in Time</ns0:text>
  <ns0:text x="942.2222" y="222.2222" text-anchor="middle" font-size="14.2222" fill="#555555">Consistent snapshot</ns0:text>
  <ns0:text x="942.2222" y="247.1111" text-anchor="middle" font-size="14.2222" fill="#888888">Best for: export/scroll</ns0:text>
  <ns0:rect x="53.3333" y="318.2222" width="1031.1111" height="46.2222" rx="3.5556" fill="url(#grad-accent)" />
  <ns0:text x="213.3333" y="348.4444" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="#ffffff">from/size</ns0:text>
  <ns0:text x="586.6667" y="348.4444" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="#ffffff">search_after</ns0:text>
  <ns0:text x="942.2222" y="348.4444" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="#ffffff">PIT</ns0:text>
  <ns0:rect x="53.3333" y="364.4444" width="1031.1111" height="44.4444" rx="3.5556" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="213.3333" y="392.8889" text-anchor="middle" font-size="14.2222" fill="#333333">Simple, stateless</ns0:text>
  <ns0:text x="586.6667" y="392.8889" text-anchor="middle" font-size="14.2222" fill="#333333">Stateful, cursor-based</ns0:text>
  <ns0:text x="942.2222" y="392.8889" text-anchor="middle" font-size="14.2222" fill="#333333">Consistent view</ns0:text>
  <ns0:rect x="53.3333" y="408.8889" width="1031.1111" height="44.4444" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="213.3333" y="437.3333" text-anchor="middle" font-size="14.2222" fill="#333333">Expensive at deep pages</ns0:text>
  <ns0:text x="586.6667" y="437.3333" text-anchor="middle" font-size="14.2222" fill="#333333">Efficient for all depths</ns0:text>
  <ns0:text x="942.2222" y="437.3333" text-anchor="middle" font-size="14.2222" fill="#333333">Holds resources on ES</ns0:text>
  <ns0:rect x="53.3333" y="497.7778" width="1031.1111" height="49.7778" rx="5.3333" fill="#f2f6ff" stroke="#bbdefb" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="528" text-anchor="middle" font-size="14.2222" fill="#1565c0">Use from/size for small results, search_after + PIT for deep or large result sets</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Pagination Strategies</text>
  <!-- from/size -->
  <rect x="60" y="100" width="360" height="200" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="240" y="168" text-anchor="middle" font-size="24" font-weight="bold" fill="#2e7d32">from / size</text>
  <text x="240" y="214" text-anchor="middle" font-size="18" fill="#555555">Simple pagination</text>
  <text x="240" y="250" text-anchor="middle" font-size="16" fill="#555555">Max 10,000 results</text>
  <text x="240" y="278" text-anchor="middle" font-size="16" fill="#888888">Best for: first few pages</text>
  <!-- search_after -->
  <rect x="480" y="100" width="360" height="200" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="660" y="168" text-anchor="middle" font-size="24" font-weight="bold" fill="#1565c0">search_after</text>
  <text x="660" y="214" text-anchor="middle" font-size="18" fill="#555555">Deep pagination</text>
  <text x="660" y="250" text-anchor="middle" font-size="16" fill="#555555">No result limit</text>
  <text x="660" y="278" text-anchor="middle" font-size="16" fill="#888888">Best for: infinite scroll</text>
  <!-- PIT -->
  <rect x="900" y="100" width="320" height="200" rx="12" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1060" y="168" text-anchor="middle" font-size="24" font-weight="bold" fill="#795548">PIT</text>
  <text x="1060" y="214" text-anchor="middle" font-size="18" fill="#555555">Point in Time</text>
  <text x="1060" y="250" text-anchor="middle" font-size="16" fill="#555555">Consistent snapshot</text>
  <text x="1060" y="278" text-anchor="middle" font-size="16" fill="#888888">Best for: export/scroll</text>
  <!-- Comparison table -->
  <rect x="60" y="358" width="1160" height="52" rx="4" fill="url(#grad-accent)"/>
  <text x="240" y="392" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">from/size</text>
  <text x="660" y="392" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">search_after</text>
  <text x="1060" y="392" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">PIT</text>
  <rect x="60" y="410" width="1160" height="50" rx="4" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="240" y="442" text-anchor="middle" font-size="16" fill="#333333">Simple, stateless</text>
  <text x="660" y="442" text-anchor="middle" font-size="16" fill="#333333">Stateful, cursor-based</text>
  <text x="1060" y="442" text-anchor="middle" font-size="16" fill="#333333">Consistent view</text>
  <rect x="60" y="460" width="1160" height="50" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1"/>
  <text x="240" y="492" text-anchor="middle" font-size="16" fill="#333333">Expensive at deep pages</text>
  <text x="660" y="492" text-anchor="middle" font-size="16" fill="#333333">Efficient for all depths</text>
  <text x="1060" y="492" text-anchor="middle" font-size="16" fill="#333333">Holds resources on ES</text>
  <!-- Note -->
  <rect x="60" y="560" width="1160" height="56" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="594" text-anchor="middle" font-size="16" fill="#1565c0">Use from/size for small results, search_after + PIT for deep or large result sets</text>
</svg>

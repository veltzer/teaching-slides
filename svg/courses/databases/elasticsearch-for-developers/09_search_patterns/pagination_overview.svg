<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.777972" font-weight="bold" fill="var(--primary-accent)">Pagination Strategies</text>
  <rect x="40" y="93.098612" width="372.413793" height="204.225363" rx="7.096094" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="226.206897" y="162.535142" text-anchor="middle" font-size="24.666732" font-weight="bold" fill="var(--ok-accent)">from / size</text>
  <text x="226.206897" y="209.507035" text-anchor="middle" font-size="18.500108" fill="var(--text-muted)">Simple pagination</text>
  <text x="226.206897" y="246.267603" text-anchor="middle" font-size="16.444488" fill="var(--text-muted)">Max 10,000 results</text>
  <text x="226.206897" y="274.859085" text-anchor="middle" font-size="16.444488" fill="var(--text-faint)">Best for: first few pages</text>
  <rect x="474.482759" y="93.098612" width="372.413793" height="204.225363" rx="7.096094" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="660.689655" y="162.535142" text-anchor="middle" font-size="24.666732" font-weight="bold" fill="var(--primary-accent)">search_after</text>
  <text x="660.689655" y="209.507035" text-anchor="middle" font-size="18.500108" fill="var(--text-muted)">Deep pagination</text>
  <text x="660.689655" y="246.267603" text-anchor="middle" font-size="16.444488" fill="var(--text-muted)">No result limit</text>
  <text x="660.689655" y="274.859085" text-anchor="middle" font-size="16.444488" fill="var(--text-faint)">Best for: infinite scroll</text>
  <rect x="908.965517" y="93.098612" width="331.034372" height="204.225363" rx="7.096094" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1074.482759" y="162.535142" text-anchor="middle" font-size="24.666732" font-weight="bold" fill="var(--text-muted)">PIT</text>
  <text x="1074.482759" y="209.507035" text-anchor="middle" font-size="18.500108" fill="var(--text-muted)">Point in Time</text>
  <text x="1074.482759" y="246.267603" text-anchor="middle" font-size="16.444488" fill="var(--text-muted)">Consistent snapshot</text>
  <text x="1074.482759" y="274.859085" text-anchor="middle" font-size="16.444488" fill="var(--text-faint)">Best for: export/scroll</text>
  <rect x="40" y="356.549306" width="1200" height="53.098612" rx="7.096094" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="226.206897" y="391.267507" text-anchor="middle" font-size="17.472357" font-weight="bold" fill="var(--bg)">from/size</text>
  <text x="660.689655" y="391.267507" text-anchor="middle" font-size="17.472357" font-weight="bold" fill="var(--bg)">search_after</text>
  <text x="1074.482759" y="391.267507" text-anchor="middle" font-size="17.472357" font-weight="bold" fill="var(--bg)">PIT</text>
  <rect x="40" y="409.647791" width="1200" height="51.056246" rx="7.096094" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="226.206897" y="442.324007" text-anchor="middle" font-size="16.444488" fill="var(--text)">Simple, stateless</text>
  <text x="660.689655" y="442.324007" text-anchor="middle" font-size="16.444488" fill="var(--text)">Stateful, cursor-based</text>
  <text x="1074.482759" y="442.324007" text-anchor="middle" font-size="16.444488" fill="var(--text)">Consistent view</text>
  <rect x="40" y="460.704291" width="1200" height="51.056246" rx="7.096094" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="226.206897" y="493.380252" text-anchor="middle" font-size="16.444488" fill="var(--text)">Expensive at deep pages</text>
  <text x="660.689655" y="493.380252" text-anchor="middle" font-size="16.444488" fill="var(--text)">Efficient for all depths</text>
  <text x="1074.482759" y="493.380252" text-anchor="middle" font-size="16.444488" fill="var(--text)">Holds resources on ES</text>
  <rect x="40" y="562.816909" width="1200" height="57.183091" rx="7.096094" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="597.535237" text-anchor="middle" font-size="16.444488" fill="var(--primary-accent)">Use from/size for small results, search_after + PIT for deep or large result sets</text>
</svg>
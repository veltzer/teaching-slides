  <line x1="813.5111" y1="160" x2="864.7111" y2="160" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <line x1="813.5111" y1="184" x2="853.3333" y2="184" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />

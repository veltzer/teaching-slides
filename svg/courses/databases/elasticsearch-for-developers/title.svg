  <circle cx="184.8889" cy="448" r="25.6" fill="var(--info-fill)" opacity="0.5" />
  <line x1="210.4889" y1="192" x2="384" y2="248" stroke="var(--info-border)" stroke-width="2" opacity="0.3" />
  <line x1="210.4889" y1="320" x2="384" y2="280" stroke="var(--info-border)" stroke-width="2" opacity="0.3" />
  <line x1="210.4889" y1="448" x2="384" y2="312" stroke="var(--info-border)" stroke-width="2" opacity="0.3" />
  <text x="568.8889" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" fill="var(--border)" letter-spacing="3">ELASTICSEARCH FOR DEVELOPERS</text>

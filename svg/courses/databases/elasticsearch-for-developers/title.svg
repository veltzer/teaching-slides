<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <circle cx="565" cy="286.5" r="111.2355" fill="none" stroke="var(--warn-border)" stroke-width="8.5333" opacity="0.8" />
  <line x1="650.4999" y1="370.6" x2="744.9999" y2="460.5" stroke="var(--warn-border)" stroke-width="2" opacity="0.8" stroke-linecap="round" />
  <line x1="490" y1="250.25" x2="625" y2="250.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="505" y1="279.25" x2="609.9999" y2="279.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="497.5" y1="308.25" x2="617.5" y2="308.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="512.5" y1="337.25" x2="602.5" y2="337.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" />
  <rect x="879.9999" y="156" width="90" height="108.75" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.8444" opacity="0.7" />
  <line x1="898" y1="185" x2="952" y2="185" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <line x1="898" y1="206.75" x2="939.9999" y2="206.75" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <line x1="898" y1="228.5" x2="947.4999" y2="228.5" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <rect x="985" y="185" width="90" height="108.75" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.8444" opacity="0.7" />
  <line x1="1003" y1="214" x2="1057" y2="214" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <line x1="1003" y1="235.75" x2="1045" y2="235.75" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <line x1="1003" y1="257.5" x2="1052.5" y2="257.5" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <rect x="932.5" y="315.5" width="90" height="108.75" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.8444" opacity="0.7" />
  <line x1="950.5" y1="344.5" x2="1004.5" y2="344.5" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <line x1="950.5" y1="366.25" x2="992.5" y2="366.25" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <line x1="950.5" y1="388" x2="1000" y2="388" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <circle cx="235" cy="214" r="25.028" fill="var(--info-fill)" opacity="0.5" />
  <circle cx="235" cy="330" r="25.028" fill="var(--info-fill)" opacity="0.5" />
  <circle cx="235" cy="446" r="25.028" fill="var(--info-fill)" opacity="0.5" />
  <line x1="262" y1="214" x2="445" y2="264.75" stroke="var(--info-border)" stroke-width="2" opacity="0.3" />
  <line x1="262" y1="330" x2="445" y2="293.75" stroke="var(--info-border)" stroke-width="2" opacity="0.3" />
  <line x1="262" y1="446" x2="445" y2="322.75" stroke="var(--info-border)" stroke-width="2" opacity="0.3" />
  <text x="640" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.028" fill="var(--border)" letter-spacing="3">ELASTICSEARCH FOR DEVELOPERS</text>
</svg>
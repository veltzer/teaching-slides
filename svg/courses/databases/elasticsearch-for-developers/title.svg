  <rect x="896" y="160" width="85.3333" height="120" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.8444" opacity="0.7" />
  <line x1="913.0667" y1="192" x2="964.2667" y2="192" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <line x1="913.0667" y1="216" x2="952.8889" y2="216" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <line x1="913.0667" y1="240" x2="960" y2="240" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <rect x="846.2222" y="304" width="85.3333" height="120" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.8444" opacity="0.7" />
  <line x1="863.2889" y1="336" x2="914.4889" y2="336" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <line x1="863.2889" y1="360" x2="903.1111" y2="360" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />

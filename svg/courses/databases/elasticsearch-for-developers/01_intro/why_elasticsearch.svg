  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="46.2222" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#1565c0">Why Elasticsearch?</ns0:text>
  <ns0:rect x="142.2222" y="88.8889" width="355.5556" height="195.5556" rx="10.6667" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="320" y="160" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#2e7d32">Fast Search</ns0:text>
  <ns0:text x="320" y="195.5556" text-anchor="middle" font-size="16" fill="#555555">Inverted index for sub-second</ns0:text>
  <ns0:text x="320" y="220.4444" text-anchor="middle" font-size="16" fill="#555555">full-text query responses</ns0:text>
  <ns0:rect x="640" y="88.8889" width="355.5556" height="195.5556" rx="10.6667" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="817.7778" y="160" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#1565c0">Scalable</ns0:text>
  <ns0:text x="817.7778" y="195.5556" text-anchor="middle" font-size="16" fill="#555555">Horizontal scaling with</ns0:text>
  <ns0:text x="817.7778" y="220.4444" text-anchor="middle" font-size="16" fill="#555555">sharding and replication</ns0:text>
  <ns0:rect x="142.2222" y="346.6667" width="355.5556" height="195.5556" rx="10.6667" fill="#fff9c4" stroke="#f9a825" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="320" y="417.7778" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#795548">Real-time</ns0:text>
  <ns0:text x="320" y="453.3333" text-anchor="middle" font-size="16" fill="#555555">Near real-time indexing</ns0:text>
  <ns0:text x="320" y="478.2222" text-anchor="middle" font-size="16" fill="#555555">and query capabilities</ns0:text>
  <ns0:rect x="640" y="346.6667" width="355.5556" height="195.5556" rx="10.6667" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="817.7778" y="417.7778" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#7b1fa2">Analytics</ns0:text>
  <ns0:text x="817.7778" y="453.3333" text-anchor="middle" font-size="16" fill="#555555">Powerful aggregations</ns0:text>
  <ns0:text x="817.7778" y="478.2222" text-anchor="middle" font-size="16" fill="#555555">for log and data analysis</ns0:text>

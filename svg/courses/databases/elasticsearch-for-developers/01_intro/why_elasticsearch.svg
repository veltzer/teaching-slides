<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Why Elasticsearch?</text>
  <!-- Four quadrants -->
  <rect x="160" y="100" width="400" height="220" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="360" y="180" text-anchor="middle" font-size="28" font-weight="bold" fill="#2e7d32">Fast Search</text>
  <text x="360" y="220" text-anchor="middle" font-size="18" fill="#555555">Inverted index for sub-second</text>
  <text x="360" y="248" text-anchor="middle" font-size="18" fill="#555555">full-text query responses</text>
  <rect x="720" y="100" width="400" height="220" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="920" y="180" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Scalable</text>
  <text x="920" y="220" text-anchor="middle" font-size="18" fill="#555555">Horizontal scaling with</text>
  <text x="920" y="248" text-anchor="middle" font-size="18" fill="#555555">sharding and replication</text>
  <rect x="160" y="390" width="400" height="220" rx="12" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="360" y="470" text-anchor="middle" font-size="28" font-weight="bold" fill="#795548">Real-time</text>
  <text x="360" y="510" text-anchor="middle" font-size="18" fill="#555555">Near real-time indexing</text>
  <text x="360" y="538" text-anchor="middle" font-size="18" fill="#555555">and query capabilities</text>
  <rect x="720" y="390" width="400" height="220" rx="12" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="920" y="470" text-anchor="middle" font-size="28" font-weight="bold" fill="#7b1fa2">Analytics</text>
  <text x="920" y="510" text-anchor="middle" font-size="18" fill="#555555">Powerful aggregations</text>
  <text x="920" y="538" text-anchor="middle" font-size="18" fill="#555555">for log and data analysis</text>
</svg>

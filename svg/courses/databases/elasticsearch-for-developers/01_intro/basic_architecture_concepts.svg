<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.113099297217" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Cluster: my-cluster</text>
  <rect x="40" y="69.568841423264" width="361.267605633803" height="409.411698363333" rx="7.56742578662" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.633802816901" y="124.156973824665" text-anchor="middle" font-size="19.728910952012" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Node 1 (Master)</text>
  <rect x="63.239436619718" y="149.176546449815" width="137.323943661972" height="90.980314963104" rx="7.56742578662" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="131.901408450704" y="201.490326099172" text-anchor="middle" font-size="19.728910952012" fill="var(--text-muted)" font-family="Arial, sans-serif">P0</text>
  <rect x="225.915379929577" y="149.176546449815" width="137.323943661972" height="90.980314963104" rx="7.56742578662" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="294.577464788732" y="201.490326099172" text-anchor="middle" font-size="19.728910952012" fill="var(--info-accent)" font-family="Arial, sans-serif">R1</text>
  <rect x="63.239436619718" y="269.72556324797" width="137.323943661972" height="90.980314963104" rx="7.56742578662" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="131.901408450704" y="322.039342897327" text-anchor="middle" font-size="19.728910952012" fill="var(--info-accent)" font-family="Arial, sans-serif">R2</text>
  <rect x="459.366197183099" y="69.568841423264" width="361.267605633803" height="409.411698363333" rx="7.56742578662" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="124.156973824665" text-anchor="middle" font-size="19.728910952012" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Node 2</text>
  <rect x="482.605520774648" y="149.176546449815" width="137.323943661972" height="90.980314963104" rx="7.56742578662" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="551.267605633803" y="201.490326099172" text-anchor="middle" font-size="19.728910952012" fill="var(--info-accent)" font-family="Arial, sans-serif">R0</text>
  <rect x="645.281690140845" y="149.176546449815" width="137.323943661972" height="90.980314963104" rx="7.56742578662" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="713.943661971831" y="201.490326099172" text-anchor="middle" font-size="19.728910952012" fill="var(--text-muted)" font-family="Arial, sans-serif">P1</text>
  <rect x="482.605520774648" y="269.72556324797" width="137.323943661972" height="90.980314963104" rx="7.56742578662" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="551.267605633803" y="322.039342897327" text-anchor="middle" font-size="19.728910952012" fill="var(--info-accent)" font-family="Arial, sans-serif">R2</text>
  <rect x="878.732394366197" y="69.568841423264" width="361.267605633803" height="409.411698363333" rx="7.56742578662" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.366197183099" y="124.156973824665" text-anchor="middle" font-size="19.728910952012" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Node 3</text>
  <rect x="901.971717957746" y="149.176546449815" width="137.323943661972" height="90.980314963104" rx="7.56742578662" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970.633802816901" y="201.490326099172" text-anchor="middle" font-size="19.728910952012" fill="var(--info-accent)" font-family="Arial, sans-serif">R0</text>
  <rect x="1064.647887323944" y="149.176546449815" width="137.323943661972" height="90.980314963104" rx="7.56742578662" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1133.30985915493" y="201.490326099172" text-anchor="middle" font-size="19.728910952012" fill="var(--info-accent)" font-family="Arial, sans-serif">R1</text>
  <rect x="901.971717957746" y="269.72556324797" width="137.323943661972" height="90.980314963104" rx="7.56742578662" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970.633802816901" y="322.039342897327" text-anchor="middle" font-size="19.728910952012" fill="var(--text-muted)" font-family="Arial, sans-serif">P2</text>
  <text x="238.591549295775" y="558.588246048441" text-anchor="middle" font-size="19.728910952012" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">P = Primary shard</text>
  <text x="640" y="558.588246048441" text-anchor="middle" font-size="19.728910952012" fill="var(--info-accent)" font-weight="bold" font-family="Arial, sans-serif">R = Replica shard</text>
  <text x="1041.408450704225" y="558.588246048441" text-anchor="middle" font-size="19.728910952012" fill="var(--text-muted)" font-family="Arial, sans-serif">3 shards x 2 replicas</text>
  <text x="640" y="620" text-anchor="middle" font-size="18.632895565005" fill="var(--primary-accent)" font-family="Arial, sans-serif">Index "products" distributed across nodes for scalability and fault tolerance</text>
</svg>

  <text x="921.7778" y="158.2222" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-dk)">Data Node 3</text>
  <rect x="789.3333" y="177.7778" width="115.5556" height="71.1111" rx="3.5556" fill="var(--info-indigo-lt)" stroke="var(--info-mid)" stroke-width="1.7778" />
  <text x="847.1111" y="218.6667" text-anchor="middle" font-size="16" fill="var(--info-mid)">R0</text>

  <text x="216" y="158.2222" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-dk)">Data Node 1 (Master)</text>
  <rect x="83.5556" y="177.7778" width="115.5556" height="71.1111" rx="3.5556" fill="var(--warn-pale4)" stroke="var(--warn-amber)" stroke-width="1.7778" />
  <text x="141.3333" y="218.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">P0</text>

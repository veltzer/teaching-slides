<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.624629" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="89.714286" text-anchor="middle" font-size="21.10894" font-weight="bold" fill="var(--primary-accent)">Cluster: my-cluster</text>
  <rect x="72" y="113.650971" width="342" height="331.428571" rx="6.624629" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="243" y="157.841371" text-anchor="middle" font-size="17.270961" font-weight="bold" fill="var(--ok-accent)">Data Node 1 (Master)</text>
  <rect x="94" y="178.095314" width="130" height="73.650743" rx="6.624629" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="159" y="220.444571" text-anchor="middle" font-size="17.270961" fill="var(--text-muted)">P0</text>
  <rect x="247.999893" y="178.095314" width="130" height="73.650743" rx="6.624629" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="313" y="220.444571" text-anchor="middle" font-size="17.270961" fill="var(--info-accent)">R1</text>
  <rect x="94" y="275.682629" width="130" height="73.650743" rx="6.624629" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="159" y="318.031886" text-anchor="middle" font-size="17.270961" fill="var(--info-accent)">R2</text>
  <rect x="469" y="113.650971" width="342" height="331.428571" rx="6.624629" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="157.841371" text-anchor="middle" font-size="17.270961" font-weight="bold" fill="var(--ok-accent)">Data Node 2</text>
  <rect x="490.999893" y="178.095314" width="130" height="73.650743" rx="6.624629" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="556" y="220.444571" text-anchor="middle" font-size="17.270961" fill="var(--info-accent)">R0</text>
  <rect x="645" y="178.095314" width="130" height="73.650743" rx="6.624629" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="710" y="220.444571" text-anchor="middle" font-size="17.270961" fill="var(--text-muted)">P1</text>
  <rect x="490.999893" y="275.682629" width="130" height="73.650743" rx="6.624629" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="556" y="318.031886" text-anchor="middle" font-size="17.270961" fill="var(--info-accent)">R2</text>
  <rect x="866" y="113.650971" width="342" height="331.428571" rx="6.624629" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1037" y="157.841371" text-anchor="middle" font-size="17.270961" font-weight="bold" fill="var(--ok-accent)">Data Node 3</text>
  <rect x="887.999893" y="178.095314" width="130" height="73.650743" rx="6.624629" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="953" y="220.444571" text-anchor="middle" font-size="17.270961" fill="var(--info-accent)">R0</text>
  <rect x="1042" y="178.095314" width="130" height="73.650743" rx="6.624629" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1107" y="220.444571" text-anchor="middle" font-size="17.270961" fill="var(--info-accent)">R1</text>
  <rect x="887.999893" y="275.682629" width="130" height="73.650743" rx="6.624629" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="953" y="318.031886" text-anchor="middle" font-size="17.270961" fill="var(--text-muted)">P2</text>
  <text x="260" y="509.523886" text-anchor="middle" font-size="17.270961" fill="var(--text-muted)" font-weight="bold">P = Primary shard</text>
  <text x="640" y="509.523886" text-anchor="middle" font-size="17.270961" fill="var(--info-accent)" font-weight="bold">R = Replica shard</text>
  <text x="1020" y="509.523886" text-anchor="middle" font-size="17.270961" fill="var(--text-muted)">3 shards x 2 replicas</text>
  <text x="640" y="559.238171" text-anchor="middle" font-size="16.311494" fill="var(--primary-accent)">Index "products" distributed across nodes for scalability and fault tolerance</text>
</svg>
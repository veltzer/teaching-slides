  <rect width="1137.7778" height="640" fill="var(--bg)" />
  <rect x="35.5556" y="44.4444" width="1066.6667" height="560" rx="8.8889" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2.6667" filter="url(#shadow)" />

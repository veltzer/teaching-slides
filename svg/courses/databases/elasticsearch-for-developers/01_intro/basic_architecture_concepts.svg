<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="77.5" y="80.2777" width="1125" height="507.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="123.7777" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">Cluster: my-cluster</text>
  <rect x="107.5" y="144.7223" width="320.625" height="290" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="267.8125" y="183.3889" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--ok-accent)">Data Node 1 (Master)</text>
  <rect x="128.125" y="201.1111" width="121.875" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="189.0625" y="238.1667" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">P0</text>
  <rect x="272.4999" y="201.1111" width="121.875" height="64.4444" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="333.4375" y="238.1667" text-anchor="middle" font-size="15.6425" fill="var(--info-accent)">R1</text>
  <rect x="128.125" y="286.5" width="121.875" height="64.4444" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="189.0625" y="323.5556" text-anchor="middle" font-size="15.6425" fill="var(--info-accent)">R2</text>
  <rect x="479.6875" y="144.7223" width="320.625" height="290" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="183.3889" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--ok-accent)">Data Node 2</text>
  <rect x="500.3124" y="201.1111" width="121.875" height="64.4444" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="561.25" y="238.1667" text-anchor="middle" font-size="15.6425" fill="var(--info-accent)">R0</text>
  <rect x="644.6875" y="201.1111" width="121.875" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="705.625" y="238.1667" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">P1</text>
  <rect x="500.3124" y="286.5" width="121.875" height="64.4444" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="561.25" y="323.5556" text-anchor="middle" font-size="15.6425" fill="var(--info-accent)">R2</text>
  <rect x="851.875" y="144.7223" width="320.625" height="290" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1012.1875" y="183.3889" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--ok-accent)">Data Node 3</text>
  <rect x="872.4999" y="201.1111" width="121.875" height="64.4444" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="933.4375" y="238.1667" text-anchor="middle" font-size="15.6425" fill="var(--info-accent)">R0</text>
  <rect x="1016.875" y="201.1111" width="121.875" height="64.4444" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1077.8125" y="238.1667" text-anchor="middle" font-size="15.6425" fill="var(--info-accent)">R1</text>
  <rect x="872.4999" y="286.5" width="121.875" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="933.4375" y="323.5556" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">P2</text>
  <text x="283.75" y="491.1111" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)" font-weight="bold">P = Primary shard</text>
  <text x="640" y="491.1111" text-anchor="middle" font-size="15.6425" fill="var(--info-accent)" font-weight="bold">R = Replica shard</text>
  <text x="996.25" y="491.1111" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">3 shards x 2 replicas</text>
  <text x="640" y="534.6111" text-anchor="middle" font-size="14.7735" fill="var(--primary-accent)">Index "products" distributed across nodes for scalability and fault tolerance</text>
</svg>
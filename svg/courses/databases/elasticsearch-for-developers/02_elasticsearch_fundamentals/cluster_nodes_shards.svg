  <text x="936.896551724138" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.311740225022" fill="var(--text)">shard 1 (P)</text>
  <text x="936.896551724138" y="251.649122807018" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.285761872937" fill="var(--text-muted)">primary</text>

  <rect x="1038.275862068966" y="182.456140350877" width="139.655172413793" height="81.40350877193" rx="6.155870112511" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1107.586206896552" y="212.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" font-weight="bold" fill="var(--text)">orders</text>
  <text x="1107.586206896552" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.311740225022" fill="var(--text)">shard 1 (R)</text>
  <text x="1107.586206896552" y="251.649122807018" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.285761872937" fill="var(--text-muted)">replica</text>

  <text x="1022.758620689655" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--primary-text)">capacity, isolation,</text>
  <text x="1022.758620689655" y="447.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--primary-text)">resilience</text>

  <rect x="60.689655172414" y="599.649122807018" width="1158.620689655173" height="20.350877192982" rx="4.103913408341" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="614.912280701754" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" font-weight="bold" fill="var(--text)">P=primary R=replica. Each shard pair lives on different nodes so a node loss never loses data.</text>
</svg>

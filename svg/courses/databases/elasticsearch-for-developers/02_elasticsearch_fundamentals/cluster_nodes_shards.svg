  <rect x="40" y="70.526315789474" width="1200" height="508.771929824561" rx="14.363696929192" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="81.379310344828" y="106.140350877193" font-family="Arial, sans-serif" font-size="20.519567041703" font-weight="bold" fill="var(--info-text)">Cluster: my-search-cluster</text>

  <rect x="81.379310344828" y="131.578947368421" width="351.724137931035" height="427.368421052632" rx="10.259783520852" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="257.241379310345" y="162.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.467610337533" font-weight="bold" fill="var(--primary-text)">Node A (master)</text>

  <rect x="102.068965517241" y="182.456140350877" width="139.655172413793" height="81.40350877193" rx="6.155870112511" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="171.379310344828" y="212.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" font-weight="bold" fill="var(--ok-text)">products</text>
  <text x="171.379310344828" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.311740225022" fill="var(--ok-text)">shard 0 (P)</text>
  <text x="171.379310344828" y="251.649122807018" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.285761872937" fill="var(--ok-text)">primary</text>

  <rect x="272.758620689655" y="182.456140350877" width="139.655172413793" height="81.40350877193" rx="6.155870112511" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="342.068965517241" y="212.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" font-weight="bold" fill="var(--warn-text)">products</text>
  <text x="342.068965517241" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.311740225022" fill="var(--warn-text)">shard 1 (R)</text>
  <text x="342.068965517241" y="251.649122807018" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.285761872937" fill="var(--warn-text)">replica</text>


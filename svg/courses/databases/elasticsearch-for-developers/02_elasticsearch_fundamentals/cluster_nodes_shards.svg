  <text x="640" y="340.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.285761872937" fill="var(--text-muted)">replica</text>

  <rect x="846.896551724138" y="131.578947368421" width="351.724137931035" height="427.368421052632" rx="10.259783520852" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1022.758620689655" y="162.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.467610337533" font-weight="bold" fill="var(--primary-text)">Node C (data)</text>

  <rect x="867.586206896552" y="182.456140350877" width="139.655172413793" height="81.40350877193" rx="6.155870112511" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

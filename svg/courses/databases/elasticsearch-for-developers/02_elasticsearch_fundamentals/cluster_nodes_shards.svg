  <text x="257.241379310345" y="340.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.285761872937" fill="var(--text-muted)">primary</text>

  <rect x="464.137931034483" y="131.578947368421" width="351.724137931035" height="427.368421052632" rx="10.259783520852" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="162.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.467610337533" font-weight="bold" fill="var(--primary-text)">Node B (data)</text>

  <rect x="484.827586206897" y="182.456140350877" width="139.655172413793" height="81.40350877193" rx="6.155870112511" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="554.137931034483" y="212.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" font-weight="bold" fill="var(--warn-text)">products</text>
  <text x="554.137931034483" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.311740225022" fill="var(--warn-text)">shard 0 (R)</text>
  <text x="554.137931034483" y="251.649122807018" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.285761872937" fill="var(--warn-text)">replica</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="307.232" height="429.782159878056" rx="16.558424177244" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="193.616068" y="237.50487154379" text-anchor="middle" font-size="33.742157136883" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Create</text>
  <text x="193.616068" y="286.765799293804" text-anchor="middle" font-size="20.76435853783" fill="var(--text-muted)" font-family="Arial, sans-serif">POST/PUT document</text>
  <line x1="356.360208" y1="254.891071545719" x2="472.606024" y2="254.891071545719" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="486.384" y="40" width="307.232" height="429.782159878056" rx="16.558424177244" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="640" y="237.50487154379" text-anchor="middle" font-size="33.742157136883" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Update</text>
  <text x="640" y="286.765799293804" text-anchor="middle" font-size="20.76435853783" fill="var(--text-muted)" font-family="Arial, sans-serif">PUT / _update endpoint</text>
  <line x1="802.744143" y1="254.891071545719" x2="918.989958" y2="254.891071545719" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="932.768" y="40" width="307.232" height="429.782159878056" rx="16.558424177244" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="1086.383932" y="237.50487154379" text-anchor="middle" font-size="33.742157136883" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Delete</text>
  <text x="1086.383932" y="286.765799293804" text-anchor="middle" font-size="20.76435853783" fill="var(--text-muted)" font-family="Arial, sans-serif">DELETE endpoint</text>
  <rect x="58.770922" y="538.864702616397" width="1162.458156" height="81.135297383603" rx="8.96019502408" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="588.12527085303" text-anchor="middle" font-size="22.062240941691" fill="var(--primary-accent)" font-family="Arial, sans-serif">ES documents are immutable - updates create a new version and mark old one deleted</text>
</svg>

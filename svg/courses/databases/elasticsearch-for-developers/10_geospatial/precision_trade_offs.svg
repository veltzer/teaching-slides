<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="568.8889" y="46.2222" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="var(--primary-accent)">Geohash Precision Trade-offs</text>
  <rect x="88.8889" y="106.6667" width="142.2222" height="266.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="160" y="266.6667" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">1</text>
  <text x="160" y="419.5556" text-anchor="middle" font-size="16" fill="var(--text-muted)">~5,000 km</text>
  <rect x="275.5556" y="177.7778" width="124.4444" height="195.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="337.7778" y="272" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">3</text>
  <text x="337.7778" y="419.5556" text-anchor="middle" font-size="16" fill="var(--text-muted)">~150 km</text>
  <rect x="444.4444" y="231.1111" width="106.6667" height="142.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="497.7778" y="304" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text-muted)">5</text>
  <text x="497.7778" y="419.5556" text-anchor="middle" font-size="16" fill="var(--text-muted)">~5 km</text>
  <rect x="604.4444" y="257.7778" width="88.8889" height="115.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="648.8889" y="318.2222" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text-muted)">7</text>
  <text x="648.8889" y="419.5556" text-anchor="middle" font-size="16" fill="var(--text-muted)">~150 m</text>
  <rect x="746.6667" y="275.5556" width="71.1111" height="97.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="782.2222" y="330.6667" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--bg)">9</text>
  <text x="782.2222" y="419.5556" text-anchor="middle" font-size="16" fill="var(--text-muted)">~5 m</text>
  <rect x="871.1111" y="284.4444" width="53.3333" height="88.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="897.7778" y="337.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--bg)">12</text>
  <text x="897.7778" y="419.5556" text-anchor="middle" font-size="16" fill="var(--text-muted)">~2 cm</text>
  <text x="160" y="453.3333" text-anchor="middle" font-size="12.4444" fill="var(--text-faint)">Country</text>
  <text x="337.7778" y="453.3333" text-anchor="middle" font-size="12.4444" fill="var(--text-faint)">Region</text>
  <text x="497.7778" y="453.3333" text-anchor="middle" font-size="12.4444" fill="var(--text-faint)">City</text>
  <text x="648.8889" y="453.3333" text-anchor="middle" font-size="12.4444" fill="var(--text-faint)">Street</text>
  <text x="782.2222" y="453.3333" text-anchor="middle" font-size="12.4444" fill="var(--text-faint)">Building</text>
  <text x="897.7778" y="453.3333" text-anchor="middle" font-size="12.4444" fill="var(--text-faint)">Precise</text>
  <line x1="71.1111" y1="488.8889" x2="977.7778" y2="488.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="524.4444" y="524.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Increasing Precision → More storage, slower queries</text>
  <rect x="71.1111" y="549.3333" width="995.5556" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="577.7778" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)">Choose precision based on use case. Geohash precision 5 suitable for most city-level applications.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="61.428571" y="40" width="171.428571" height="316.36371971703" rx="7.33891978536" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142857" y="229.818206436035" text-anchor="middle" font-size="21.259138574896" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">1</text>
  <text x="147.142857" y="411.200104498188" text-anchor="middle" font-size="19.133175532609" fill="var(--text-muted)" font-family="Arial, sans-serif">~5,000 km</text>
  <rect x="286.428571" y="124.363589375204" width="150" height="232.000130341826" rx="7.33891978536" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="361.428571" y="236.145435750082" text-anchor="middle" font-size="21.259138574896" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">3</text>
  <text x="361.428571" y="411.200104498188" text-anchor="middle" font-size="19.133175532609" fill="var(--text-muted)" font-family="Arial, sans-serif">~150 km</text>
  <rect x="489.999886" y="187.63628028297" width="128.571429" height="168.727307968597" rx="7.33891978536" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="554.285714" y="274.109076812561" text-anchor="middle" font-size="21.259138574896" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">5</text>
  <text x="554.285714" y="411.200104498188" text-anchor="middle" font-size="19.133175532609" fill="var(--text-muted)" font-family="Arial, sans-serif">~5 km</text>
  <rect x="682.857029" y="219.272692031403" width="107.142857" height="137.091027685627" rx="7.33891978536" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="736.428571" y="290.98182053124" text-anchor="middle" font-size="21.259138574896" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">7</text>
  <text x="736.428571" y="411.200104498188" text-anchor="middle" font-size="19.133175532609" fill="var(--text-muted)" font-family="Arial, sans-serif">~150 m</text>
  <rect x="854.285714" y="240.36371971703" width="85.714286" height="116" rx="7.33891978536" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="897.142857" y="305.745488560994" text-anchor="middle" font-size="21.259138574896" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">9</text>
  <text x="897.142857" y="411.200104498188" text-anchor="middle" font-size="19.133175532609" fill="var(--text-muted)" font-family="Arial, sans-serif">~5 m</text>
  <rect x="1004.285714" y="250.908972314373" width="64.285714" height="105.454617060831" rx="7.33891978536" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036.428571" y="314.181794687602" text-anchor="middle" font-size="21.259138574896" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">12</text>
  <text x="1036.428571" y="411.200104498188" text-anchor="middle" font-size="19.133175532609" fill="var(--text-muted)" font-family="Arial, sans-serif">~2 cm</text>
  <text x="147.142857" y="451.272692031403" text-anchor="middle" font-size="14.881250508052" fill="var(--text-faint)" font-family="Arial, sans-serif">Country</text>
  <text x="361.428571" y="451.272692031403" text-anchor="middle" font-size="14.881250508052" fill="var(--text-faint)" font-family="Arial, sans-serif">Region</text>
  <text x="554.285714" y="451.272692031403" text-anchor="middle" font-size="14.881250508052" fill="var(--text-faint)" font-family="Arial, sans-serif">City</text>
  <text x="736.428571" y="451.272692031403" text-anchor="middle" font-size="14.881250508052" fill="var(--text-faint)" font-family="Arial, sans-serif">Street</text>
  <text x="897.142857" y="451.272692031403" text-anchor="middle" font-size="14.881250508052" fill="var(--text-faint)" font-family="Arial, sans-serif">Building</text>
  <text x="1036.428571" y="451.272692031403" text-anchor="middle" font-size="14.881250508052" fill="var(--text-faint)" font-family="Arial, sans-serif">Precise</text>
  <line x1="40" y1="493.454617060831" x2="1132.857143" y2="493.454617060831" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="586.428457" y="535.63628028297" text-anchor="middle" font-size="18.070256022471" fill="var(--text-muted)" font-family="Arial, sans-serif">Increasing Precision → More storage, slower queries</text>
  <rect x="40" y="565.163615218842" width="1200" height="54.836384781158" rx="7.33891978536" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="598.909102656199" text-anchor="middle" font-size="17.007213550339" fill="var(--primary-accent)" font-family="Arial, sans-serif">Choose precision based on use case. Geohash precision 5 suitable for most city-level applications.</text>
</svg>

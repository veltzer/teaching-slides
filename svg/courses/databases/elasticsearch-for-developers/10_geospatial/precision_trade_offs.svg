<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Geohash Precision Trade-offs</text>
  <!-- Bars of decreasing size (representing grid cell size) -->
  <rect x="100" y="120" width="160" height="300" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="300" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">1</text>
  <text x="180" y="472" text-anchor="middle" font-size="18" fill="#555555">~5,000 km</text>
  <rect x="310" y="200" width="140" height="220" rx="6" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="306" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">3</text>
  <text x="380" y="472" text-anchor="middle" font-size="18" fill="#555555">~150 km</text>
  <rect x="500" y="260" width="120" height="160" rx="6" fill="#cddc39" stroke="#827717" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="342" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">5</text>
  <text x="560" y="472" text-anchor="middle" font-size="18" fill="#555555">~5 km</text>
  <rect x="680" y="290" width="100" height="130" rx="6" fill="#ffc107" stroke="#f57f17" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="358" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">7</text>
  <text x="730" y="472" text-anchor="middle" font-size="18" fill="#555555">~150 m</text>
  <rect x="840" y="310" width="80" height="110" rx="6" fill="#ff9800" stroke="#e65100" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="372" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">9</text>
  <text x="880" y="472" text-anchor="middle" font-size="18" fill="#555555">~5 m</text>
  <rect x="980" y="320" width="60" height="100" rx="6" fill="#f44336" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010" y="380" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">12</text>
  <text x="1010" y="472" text-anchor="middle" font-size="18" fill="#555555">~2 cm</text>
  <!-- Labels -->
  <text x="180" y="510" text-anchor="middle" font-size="14" fill="#888888">Country</text>
  <text x="380" y="510" text-anchor="middle" font-size="14" fill="#888888">Region</text>
  <text x="560" y="510" text-anchor="middle" font-size="14" fill="#888888">City</text>
  <text x="730" y="510" text-anchor="middle" font-size="14" fill="#888888">Street</text>
  <text x="880" y="510" text-anchor="middle" font-size="14" fill="#888888">Building</text>
  <text x="1010" y="510" text-anchor="middle" font-size="14" fill="#888888">Precise</text>
  <!-- Arrow -->
  <line x1="80" y1="550" x2="1100" y2="550" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="590" y="590" text-anchor="middle" font-size="17" fill="#555555">Increasing Precision &#x2192; More storage, slower queries</text>
  <!-- Note -->
  <rect x="80" y="618" width="1120" height="52" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="650" text-anchor="middle" font-size="16" fill="#1565c0">Choose precision based on use case. Geohash precision 5 suitable for most city-level applications.</text>
</svg>

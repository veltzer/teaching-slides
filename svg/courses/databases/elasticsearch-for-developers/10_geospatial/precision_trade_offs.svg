<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="81.8889" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--primary-accent)">Geohash Precision Trade-offs</text>
  <rect x="133.75" y="136.6667" width="150" height="241.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="208.75" y="281.6667" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">1</text>
  <text x="208.75" y="420.2223" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">~5,000 km</text>
  <rect x="330.625" y="201.1111" width="131.25" height="177.2223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="396.25" y="286.5" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">3</text>
  <text x="396.25" y="420.2223" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">~150 km</text>
  <rect x="508.7499" y="249.4444" width="112.5" height="128.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="565" y="315.5" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text-muted)">5</text>
  <text x="565" y="420.2223" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">~5 km</text>
  <rect x="677.4999" y="273.6111" width="93.75" height="104.7223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="724.375" y="328.3889" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text-muted)">7</text>
  <text x="724.375" y="420.2223" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">~150 m</text>
  <rect x="827.5" y="289.7223" width="75" height="88.6111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="865" y="339.6667" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)">9</text>
  <text x="865" y="420.2223" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">~5 m</text>
  <rect x="958.75" y="297.7777" width="56.25" height="80.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="986.875" y="346.1111" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)">12</text>
  <text x="986.875" y="420.2223" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">~2 cm</text>
  <text x="208.75" y="450.8333" text-anchor="middle" font-size="12.1663" fill="var(--text-faint)">Country</text>
  <text x="396.25" y="450.8333" text-anchor="middle" font-size="12.1663" fill="var(--text-faint)">Region</text>
  <text x="565" y="450.8333" text-anchor="middle" font-size="12.1663" fill="var(--text-faint)">City</text>
  <text x="724.375" y="450.8333" text-anchor="middle" font-size="12.1663" fill="var(--text-faint)">Street</text>
  <text x="865" y="450.8333" text-anchor="middle" font-size="12.1663" fill="var(--text-faint)">Building</text>
  <text x="986.875" y="450.8333" text-anchor="middle" font-size="12.1663" fill="var(--text-faint)">Precise</text>
  <line x1="115" y1="483.0556" x2="1071.25" y2="483.0556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="593.1249" y="515.2777" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Increasing Precision → More storage, slower queries</text>
  <rect x="115" y="537.8333" width="1050" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="563.6111" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)">Choose precision based on use case. Geohash precision 5 suitable for most city-level applications.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="81.8889" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--primary-accent)">Geo Data Types</text>
  <rect x="115" y="120.5556" width="468.7499" height="209.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="349.375" y="185" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--ok-accent)">geo_point</text>
  <text x="349.375" y="222.0556" text-anchor="middle" font-size="16.5115" fill="var(--text-muted)">Single lat/lon coordinate</text>
  <circle cx="349.375" cy="281.6667" r="17.3806" fill="var(--ok-accent)" />
  <text x="349.375" y="334.8333" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Queries: geo_distance, geo_bounding_box,</text>
  <text x="349.375" y="355.7777" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">geo_polygon</text>
  <rect x="696.25" y="120.5556" width="468.7499" height="209.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="930.6249" y="185" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--primary-accent)">geo_shape</text>
  <text x="930.6249" y="222.0556" text-anchor="middle" font-size="16.5115" fill="var(--text-muted)">GeoJSON shapes: points, lines, polygons</text>
  <polygon points="855.6249,265.5556 930.6249,241.3889 1005.625,265.5556 986.875,313.8889 874.375,313.8889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6667" />
  <text x="930.6249" y="355.7777" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Queries: geo_shape (intersects, within,</text>
  <text x="930.6249" y="375.1111" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">contains, disjoint)</text>
  <rect x="115" y="375.1111" width="1050" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="400.8889" text-anchor="middle" font-size="15.6425" fill="var(--primary-accent)" font-weight="bold">Common Use Cases</text>
  <text x="640" y="426.6667" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">geo_point: store locations, radius search, map clustering, location-based sorting</text>
  <rect x="115" y="476.6111" width="1050" height="45.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="504" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)">geo_shape: Areas &amp; lines - countries, zones, routes, geofencing</text>
</svg>
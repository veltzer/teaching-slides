<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="535.714171" height="302.811231686794" rx="7.712564712164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.857143" y="133.172642227073" text-anchor="middle" font-size="29.04384881798" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">geo_point</text>
  <text x="307.857143" y="186.747012402528" text-anchor="middle" font-size="21.224335957115" fill="var(--text-muted)" font-family="Arial, sans-serif">Single lat/lon coordinate</text>
  <rect x="286.52" y="249.537869992749" width="42.6737" height="46.786831957035" rx="14.659180937821" fill="var(--ok-accent)"/>
  <text x="307.857143" y="349.799135477616" text-anchor="middle" font-size="18.990263170094" fill="var(--text-muted)" font-family="Arial, sans-serif">Queries: geo_distance, geo_bounding_box,</text>
  <text x="307.857143" y="380.080200647495" text-anchor="middle" font-size="18.990263170094" fill="var(--text-muted)" font-family="Arial, sans-serif">geo_polygon</text>
  <rect x="704.285714" y="40" width="535.714171" height="302.811231686794" rx="7.712564712164" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="972.142743" y="133.172642227073" text-anchor="middle" font-size="29.04384881798" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">geo_shape</text>
  <text x="972.142743" y="186.747012402528" text-anchor="middle" font-size="21.224335957115" fill="var(--text-muted)" font-family="Arial, sans-serif">GeoJSON shapes: points, lines, polygons</text>
  <polygon points="886.428457,249.638589459722 972.142743,214.698775577876 1057.857143,249.638589459722 1036.428571,319.518070307737 907.857143,319.518070307737" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6667"/>
  <text x="972.142743" y="380.080200647495" text-anchor="middle" font-size="18.990263170094" fill="var(--text-muted)" font-family="Arial, sans-serif">Queries: geo_shape (intersects, within,</text>
  <text x="972.142743" y="408.032109642133" text-anchor="middle" font-size="18.990263170094" fill="var(--text-muted)" font-family="Arial, sans-serif">contains, disjoint)</text>
  <rect x="40" y="408.032109642133" width="1200" height="93.172642227073" rx="7.712564712164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="445.301224422124" text-anchor="middle" font-size="20.107300087146" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Common Use Cases</text>
  <text x="640" y="482.570338105729" text-anchor="middle" font-size="17.873098508751" fill="var(--text-muted)" font-family="Arial, sans-serif">geo_point: store locations, radius search, map clustering, location-based sorting</text>
  <rect x="40" y="554.779122044661" width="1200" height="65.220877955339" rx="7.712564712164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="594.377537722797" text-anchor="middle" font-size="17.873098508751" fill="var(--ok-accent)" font-family="Arial, sans-serif">geo_shape: Areas &amp; lines - countries, zones, routes, geofencing</text>
</svg>

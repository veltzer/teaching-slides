  <ns0:text x="538.9474" y="331.2281" text-anchor="middle" font-size="10" fill="#555555">50 MB</ns0:text>
  <ns0:rect x="78.5965" y="359.2982" width="561.4035" height="26.9474" rx="3.3684" fill="#f2f6ff" stroke="#bbdefb" stroke-width="0.5614" />
  <ns0:text x="359.2982" y="376.1404" text-anchor="middle" font-size="10" fill="#1565c0">Too small: high overhead. Too large: GC pressure, timeouts. Start with 5-15 MB and tune.</ns0:text>

  <ns0:text x="359.2982" y="29.193" text-anchor="middle" font-size="15.7193" font-weight="bold" fill="#1565c0">Batch Size vs Performance</ns0:text>
  <ns0:line x1="78.5965" y1="314.386" x2="640" y2="314.386" stroke="#333333" stroke-width="2.2456" />
  <ns0:line x1="78.5965" y1="314.386" x2="78.5965" y2="67.3684" stroke="#333333" stroke-width="2.2456" />
  <ns0:path d="M 78.5965 280.7018 Q 247.0175 134.7368 392.9825 112.2807 T 640 129.1228" stroke="#1565c0" stroke-width="3.3684" fill="none" />
  <ns0:text x="359.2982" y="348.0702" text-anchor="middle" font-size="11.2281" fill="#333333">Batch Size (MB)</ns0:text>
  <ns0:text x="33.6842" y="190.8772" text-anchor="middle" font-size="11.2281" fill="#333333" transform="rotate(-90 60 340)">Throughput</ns0:text>
  <ns0:circle cx="359.2982" cy="114.5263" r="8.9825" fill="#e53935" />
  <ns0:text x="359.2982" y="97.6842" text-anchor="middle" font-size="15.7193" font-weight="bold" fill="#e53935">5-15 MB</ns0:text>
  <ns0:text x="359.2982" y="83.0877" text-anchor="middle" font-size="10.1053" fill="#555555">Optimal range</ns0:text>
  <ns0:text x="134.7368" y="331.2281" text-anchor="middle" font-size="10" fill="#555555">1 MB</ns0:text>

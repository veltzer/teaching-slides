<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="576.2522" height="324.1418" fill="var(--bg)" rx="4.8115" />
  <text x="414.9015" y="75.2729" text-anchor="middle" font-size="12.6055" font-weight="bold" fill="var(--primary-accent)">Batch Size vs Performance</text>
  <line x1="189.8031" y1="303.9731" x2="640" y2="303.9731" stroke="var(--text)" stroke-width="1.2966" />
  <line x1="189.8031" y1="303.9731" x2="189.8031" y2="105.8863" stroke="var(--text)" stroke-width="1.2966" />
  <path d="M 189.8031 276.9612 Q 324.8621 159.9099 441.9134 141.9021 T 640 155.408" stroke="var(--primary-border)" stroke-width="2.1837" fill="none" />
  <text x="414.9015" y="330.9848" text-anchor="middle" font-size="10" fill="var(--text)">Batch Size (MB)</text>
  <text x="153.7873" y="204.9297" text-anchor="middle" font-size="10" fill="var(--text)" transform="rotate(-90 60 340)">Throughput</text>
  <circle cx="414.9015" cy="143.7029" r="7.2032" fill="var(--danger-fill)" />
  <text x="414.9015" y="130.1969" text-anchor="middle" font-size="12.6055" font-weight="bold" fill="var(--danger-accent)">5-15 MB</text>
  <text x="414.9015" y="118.4919" text-anchor="middle" font-size="10" fill="var(--text-muted)">Optimal range</text>
  <text x="234.8227" y="317.479" text-anchor="middle" font-size="10" fill="var(--text-muted)">1 MB</text>
  <text x="342.87" y="317.479" text-anchor="middle" font-size="10" fill="var(--text-muted)">5 MB</text>
  <text x="450.9173" y="317.479" text-anchor="middle" font-size="10" fill="var(--text-muted)">15 MB</text>
  <text x="558.9646" y="317.479" text-anchor="middle" font-size="10" fill="var(--text-muted)">50 MB</text>
  <rect x="189.8031" y="339.9887" width="450.197" height="21.6095" rx="4.8115" fill="var(--surface)" stroke="var(--border)" stroke-width="0.6483" />
  <text x="414.9015" y="353.4947" text-anchor="middle" font-size="10" fill="var(--primary-accent)">Too small: high overhead. Too large: GC pressure, timeouts. Start with 5-15 MB and tune.</text>
</svg>
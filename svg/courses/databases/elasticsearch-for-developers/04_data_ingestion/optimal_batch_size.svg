<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="883.3191" height="448.2072" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="894.9534" y="224.0837" text-anchor="middle" font-size="18.3521" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Batch Size vs Performance</text>
  <line x1="549.9069" y1="540.3188" x2="1239.9998" y2="540.3188" stroke="var(--text)" stroke-width="0.7666"/>
  <line x1="549.9069" y1="540.3188" x2="549.9069" y2="266.4142" stroke="var(--text)" stroke-width="0.7666"/>
  <path d="M 549.9069 502.9682 Q 756.9346 341.1155 936.359 316.2152 T 1239.9998 334.8905" stroke="var(--primary-border)" stroke-width="1.2911" fill="none"/>
  <text x="894.9534" y="577.6693" text-anchor="middle" font-size="17.8082" fill="var(--text)" font-family="Arial, sans-serif">Batch Size (MB)</text>
  <text x="494.6994" y="403.3665" text-anchor="middle" font-size="17.8082" fill="var(--text)" transform="rotate(-90 60 340)" font-family="Arial, sans-serif">Throughput</text>
  <rect x="884.466" y="308.218" width="20.9738" height="20.9738" rx="10.4869" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="894.9534" y="300.0298" text-anchor="middle" font-size="18.3521" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">5-15 MB</text>
  <text x="894.9534" y="283.8447" text-anchor="middle" font-size="17.8082" fill="var(--text-muted)" font-family="Arial, sans-serif">Optimal range</text>
  <text x="618.9161" y="558.9941" text-anchor="middle" font-size="17.8082" fill="var(--text-muted)" font-family="Arial, sans-serif">1 MB</text>
  <text x="784.5384" y="558.9941" text-anchor="middle" font-size="17.8082" fill="var(--text-muted)" font-family="Arial, sans-serif">5 MB</text>
  <text x="950.1609" y="558.9941" text-anchor="middle" font-size="17.8082" fill="var(--text-muted)" font-family="Arial, sans-serif">15 MB</text>
  <text x="1115.7831" y="558.9941" text-anchor="middle" font-size="17.8082" fill="var(--text-muted)" font-family="Arial, sans-serif">50 MB</text>
  <rect x="549.9069" y="590.1195" width="690.0931" height="29.8805" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="894.9534" y="608.7948" text-anchor="middle" font-size="17.8082" fill="var(--primary-accent)" font-family="Arial, sans-serif">Too small: high overhead. Too large: GC pressure, timeouts. Start with 5-15 MB and tune.</text>
</svg>

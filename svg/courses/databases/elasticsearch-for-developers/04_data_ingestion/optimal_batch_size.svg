<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="883.3191" height="448.2072" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="894.9534" y="224.0837" text-anchor="middle" font-size="18.3521" font-weight="bold" fill="var(--primary-accent)">Batch Size vs Performance</text>
  <line x1="549.9069" y1="540.3188" x2="1239.9998" y2="540.3188" stroke="var(--text)" stroke-width="0.7666" />
  <line x1="549.9069" y1="540.3188" x2="549.9069" y2="266.4142" stroke="var(--text)" stroke-width="0.7666" />
  <path d="M 549.9069 502.9682 Q 756.9346 341.1155 936.359 316.2152 T 1239.9998 334.8905" stroke="var(--primary-border)" stroke-width="1.2911" fill="none" />
  <text x="894.9534" y="577.6693" text-anchor="middle" font-size="17.8082" fill="var(--text)">Batch Size (MB)</text>
  <text x="494.6994" y="403.3665" text-anchor="middle" font-size="17.8082" fill="var(--text)" transform="rotate(-90 60 340)">Throughput</text>
  <circle cx="894.9534" cy="318.7053" r="10.4869" fill="var(--danger-fill)" />
  <text x="894.9534" y="300.0298" text-anchor="middle" font-size="18.3521" font-weight="bold" fill="var(--danger-accent)">5-15 MB</text>
  <text x="894.9534" y="283.8447" text-anchor="middle" font-size="17.8082" fill="var(--text-muted)">Optimal range</text>
  <text x="618.9161" y="558.9941" text-anchor="middle" font-size="17.8082" fill="var(--text-muted)">1 MB</text>
  <text x="784.5384" y="558.9941" text-anchor="middle" font-size="17.8082" fill="var(--text-muted)">5 MB</text>
  <text x="950.1609" y="558.9941" text-anchor="middle" font-size="17.8082" fill="var(--text-muted)">15 MB</text>
  <text x="1115.7831" y="558.9941" text-anchor="middle" font-size="17.8082" fill="var(--text-muted)">50 MB</text>
  <rect x="549.9069" y="590.1195" width="690.0931" height="29.8805" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="894.9534" y="608.7948" text-anchor="middle" font-size="17.8082" fill="var(--primary-accent)">Too small: high overhead. Too large: GC pressure, timeouts. Start with 5-15 MB and tune.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="31.047342" font-weight="bold" fill="var(--primary-accent)">Data Ingestion Overview</text>
  <rect x="40" y="263.442564" width="268.965517" height="190.163956" rx="7.655677" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="174.482759" y="353.77055" text-anchor="middle" font-size="26.611898" font-weight="bold" fill="var(--ok-accent)">Sources</text>
  <text x="174.482759" y="396.557436" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)">APIs, Logstash, Beats,</text>
  <text x="174.482759" y="422.704798" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)">Kafka, files</text>
  <line x1="308.965407" y1="358.524468" x2="368.965517" y2="358.524468" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="373.103448" y="263.442564" width="393.103448" height="190.163956" rx="7.655677" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="569.655062" y="353.77055" text-anchor="middle" font-size="26.611898" font-weight="bold" fill="var(--primary-accent)">Pipelines</text>
  <text x="569.655062" y="396.557436" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)">Ingest processors: parse,</text>
  <text x="569.655062" y="422.704798" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)">enrich, transform</text>
  <line x1="766.206897" y1="358.524468" x2="826.206897" y2="358.524468" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="830.344717" y="263.442564" width="362.068966" height="190.163956" rx="7.655677" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1011.37931" y="353.77055" text-anchor="middle" font-size="26.611898" font-weight="bold" fill="var(--text-muted)">Index</text>
  <text x="1011.37931" y="396.557436" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)">Documents stored,</text>
  <text x="1011.37931" y="422.704798" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)">indexed, searchable</text>
  <rect x="40" y="524.918096" width="1200" height="95.081904" rx="7.655677" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="566.516392" text-anchor="middle" font-size="21.067784" fill="var(--primary-accent)" font-weight="bold">Bulk API for high throughput</text>
  <text x="640" y="603.36077" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)">Use _bulk endpoint to batch multiple index/update/delete operations in one HTTP request</text>
</svg>
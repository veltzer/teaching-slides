<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="31.047342" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Data Ingestion Overview</text>
  <rect x="40" y="263.442564" width="268.965517" height="190.163956" rx="7.655677" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="174.482759" y="353.77055" text-anchor="middle" font-size="26.611898" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Sources</text>
  <text x="174.482759" y="396.557436" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)" font-family="Arial, sans-serif">APIs, Logstash, Beats,</text>
  <text x="174.482759" y="422.704798" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)" font-family="Arial, sans-serif">Kafka, files</text>
  <line x1="308.965407" y1="358.524468" x2="368.965517" y2="358.524468" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="373.103448" y="263.442564" width="393.103448" height="190.163956" rx="7.655677" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="569.655062" y="353.77055" text-anchor="middle" font-size="26.611898" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pipelines</text>
  <text x="569.655062" y="396.557436" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)" font-family="Arial, sans-serif">Ingest processors: parse,</text>
  <text x="569.655062" y="422.704798" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)" font-family="Arial, sans-serif">enrich, transform</text>
  <line x1="766.206897" y1="358.524468" x2="826.206897" y2="358.524468" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="830.344717" y="263.442564" width="362.068966" height="190.163956" rx="7.655677" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1011.37931" y="353.77055" text-anchor="middle" font-size="26.611898" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Index</text>
  <text x="1011.37931" y="396.557436" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)" font-family="Arial, sans-serif">Documents stored,</text>
  <text x="1011.37931" y="422.704798" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)" font-family="Arial, sans-serif">indexed, searchable</text>
  <rect x="40" y="524.918096" width="1200" height="95.081904" rx="7.655677" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="566.516392" text-anchor="middle" font-size="21.067784" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Bulk API for high throughput</text>
  <text x="640" y="603.36077" text-anchor="middle" font-size="17.741265" fill="var(--text-muted)" font-family="Arial, sans-serif">Use _bulk endpoint to batch multiple index/update/delete operations in one HTTP request</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Data Ingestion Overview</text>
  <!-- Pipeline stages -->
  <rect x="60" y="240" width="260" height="160" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="190" y="316" text-anchor="middle" font-size="24" font-weight="bold" fill="#2e7d32">Sources</text>
  <text x="190" y="352" text-anchor="middle" font-size="16" fill="#555555">APIs, Logstash, Beats,</text>
  <text x="190" y="374" text-anchor="middle" font-size="16" fill="#555555">Kafka, files</text>
  <line x1="320" y1="320" x2="378" y2="320" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="382" y="240" width="380" height="160" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="572" y="316" text-anchor="middle" font-size="24" font-weight="bold" fill="#1565c0">Pipelines</text>
  <text x="572" y="352" text-anchor="middle" font-size="16" fill="#555555">Ingest processors: parse,</text>
  <text x="572" y="374" text-anchor="middle" font-size="16" fill="#555555">enrich, transform</text>
  <line x1="762" y1="320" x2="820" y2="320" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="824" y="240" width="350" height="160" rx="12" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="999" y="316" text-anchor="middle" font-size="24" font-weight="bold" fill="#795548">Index</text>
  <text x="999" y="352" text-anchor="middle" font-size="16" fill="#555555">Documents stored,</text>
  <text x="999" y="374" text-anchor="middle" font-size="16" fill="#555555">indexed, searchable</text>
  <!-- Bulk API note -->
  <rect x="60" y="460" width="1160" height="80" rx="8" fill="#f2f6ff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="495" text-anchor="middle" font-size="19" fill="#1565c0" font-weight="bold">Bulk API for high throughput</text>
  <text x="640" y="526" text-anchor="middle" font-size="16" fill="#555555">Use _bulk endpoint to batch multiple index/update/delete operations in one HTTP request</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="81.8889" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--primary-accent)">Data Modeling Performance Impact</text>
  <rect x="115" y="120.5556" width="281.25" height="161.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="255.6249" y="183.3889" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--ok-accent)">Denormalized</text>
  <text x="255.6249" y="218.8333" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">All data in one doc</text>
  <text x="255.6249" y="244.6111" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Fastest queries</text>
  <text x="255.6249" y="270.3889" text-anchor="middle" font-size="19.1186" fill="var(--ok-accent)" font-weight="bold">★★★★★</text>
  <rect x="499.375" y="120.5556" width="281.25" height="161.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="183.3889" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--text-muted)">Parent-Child</text>
  <text x="640" y="218.8333" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Separate doc types</text>
  <text x="640" y="244.6111" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Join at query time</text>
  <text x="640" y="270.3889" text-anchor="middle" font-size="19.1186" fill="var(--text-muted)" font-weight="bold">★★★</text>
  <rect x="883.75" y="120.5556" width="281.25" height="161.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1024.3749" y="183.3889" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--danger-accent)">Nested</text>
  <text x="1024.3749" y="218.8333" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Inner documents</text>
  <text x="1024.3749" y="244.6111" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Accurate but slow</text>
  <text x="1024.3749" y="270.3889" text-anchor="middle" font-size="19.1186" fill="var(--danger-accent)" font-weight="bold">★★</text>
  <line x1="115" y1="346.1111" x2="1165" y2="346.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="378.3333" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Fast → Slow</text>
  <rect x="115" y="402.5" width="1050" height="41.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="255.6249" y="429.8889" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--bg)">Denormalized</text>
  <text x="640" y="429.8889" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--bg)">Parent-Child</text>
  <text x="1024.3749" y="429.8889" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--bg)">Nested</text>
  <rect x="115" y="444.3889" width="1050" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="255.6249" y="470.1667" text-anchor="middle" font-size="13.0354" fill="var(--text)">Large doc size</text>
  <text x="640" y="470.1667" text-anchor="middle" font-size="13.0354" fill="var(--text)">Same shard required</text>
  <text x="1024.3749" y="470.1667" text-anchor="middle" font-size="13.0354" fill="var(--text)">Hidden inner docs</text>
  <rect x="115" y="521.7223" width="1050" height="45.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="549.1111" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)">Prefer denormalization in ES. Only use nested/parent-child when data updates frequently and independently.</text>
</svg>
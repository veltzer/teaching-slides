<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.448282" font-weight="bold" fill="var(--primary-accent)">Data Modeling Performance Impact</text>
  <rect x="40" y="86.245882" width="321.428571" height="192.690995" rx="7.014799" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="200.714171" y="161.395335" text-anchor="middle" font-size="24.384141" font-weight="bold" fill="var(--ok-accent)">Denormalized</text>
  <text x="200.714171" y="203.787303" text-anchor="middle" font-size="17.272188" fill="var(--text-muted)">All data in one doc</text>
  <text x="200.714171" y="234.617891" text-anchor="middle" font-size="17.272188" fill="var(--text-muted)">Fastest queries</text>
  <text x="200.714171" y="265.448479" text-anchor="middle" font-size="22.352188" fill="var(--ok-accent)" font-weight="bold">★★★★★</text>
  <rect x="479.285714" y="86.245882" width="321.428571" height="192.690995" rx="7.014799" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="161.395335" text-anchor="middle" font-size="24.384141" font-weight="bold" fill="var(--text-muted)">Parent-Child</text>
  <text x="640" y="203.787303" text-anchor="middle" font-size="17.272188" fill="var(--text-muted)">Separate doc types</text>
  <text x="640" y="234.617891" text-anchor="middle" font-size="17.272188" fill="var(--text-muted)">Join at query time</text>
  <text x="640" y="265.448479" text-anchor="middle" font-size="22.352188" fill="var(--text-muted)" font-weight="bold">★★★</text>
  <rect x="918.571429" y="86.245882" width="321.428571" height="192.690995" rx="7.014799" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1079.2856" y="161.395335" text-anchor="middle" font-size="24.384141" font-weight="bold" fill="var(--danger-accent)">Nested</text>
  <text x="1079.2856" y="203.787303" text-anchor="middle" font-size="17.272188" fill="var(--text-muted)">Inner documents</text>
  <text x="1079.2856" y="234.617891" text-anchor="middle" font-size="17.272188" fill="var(--text-muted)">Accurate but slow</text>
  <text x="1079.2856" y="265.448479" text-anchor="middle" font-size="22.352188" fill="var(--danger-accent)" font-weight="bold">★★</text>
  <line x1="40" y1="356.013226" x2="1240" y2="356.013226" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="394.551401" text-anchor="middle" font-size="18.288164" fill="var(--text-muted)">Fast → Slow</text>
  <rect x="40" y="423.455092" width="1200" height="50.099675" rx="7.014799" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200.714171" y="456.212577" text-anchor="middle" font-size="16.256094" font-weight="bold" fill="var(--bg)">Denormalized</text>
  <text x="640" y="456.212577" text-anchor="middle" font-size="16.256094" font-weight="bold" fill="var(--bg)">Parent-Child</text>
  <text x="1079.2856" y="456.212577" text-anchor="middle" font-size="16.256094" font-weight="bold" fill="var(--bg)">Nested</text>
  <rect x="40" y="473.554768" width="1200" height="48.172659" rx="7.014799" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="200.714171" y="504.385355" text-anchor="middle" font-size="15.240117" fill="var(--text)">Large doc size</text>
  <text x="640" y="504.385355" text-anchor="middle" font-size="15.240117" fill="var(--text)">Same shard required</text>
  <text x="1079.2856" y="504.385355" text-anchor="middle" font-size="15.240117" fill="var(--text)">Hidden inner docs</text>
  <rect x="40" y="566.046531" width="1200" height="53.953469" rx="7.014799" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="598.803896" text-anchor="middle" font-size="16.256094" fill="var(--primary-accent)">Prefer denormalization in ES. Only use nested/parent-child when data updates frequently and independently.</text>
</svg>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="46.2222" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#1565c0">Data Modeling Performance Impact</ns0:text>
  <ns0:rect x="71.1111" y="88.8889" width="266.6667" height="177.7778" rx="10.6667" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="204.4444" y="158.2222" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#2e7d32">Denormalized</ns0:text>
  <ns0:text x="204.4444" y="197.3333" text-anchor="middle" font-size="15.1111" fill="#555555">All data in one doc</ns0:text>
  <ns0:text x="204.4444" y="225.7778" text-anchor="middle" font-size="15.1111" fill="#555555">Fastest queries</ns0:text>
  <ns0:text x="204.4444" y="254.2222" text-anchor="middle" font-size="19.5556" fill="#2e7d32" font-weight="bold">★★★★★</ns0:text>
  <ns0:rect x="435.5556" y="88.8889" width="266.6667" height="177.7778" rx="10.6667" fill="#fff9c4" stroke="#f9a825" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="158.2222" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#795548">Parent-Child</ns0:text>
  <ns0:text x="568.8889" y="197.3333" text-anchor="middle" font-size="15.1111" fill="#555555">Separate doc types</ns0:text>
  <ns0:text x="568.8889" y="225.7778" text-anchor="middle" font-size="15.1111" fill="#555555">Join at query time</ns0:text>
  <ns0:text x="568.8889" y="254.2222" text-anchor="middle" font-size="19.5556" fill="#795548" font-weight="bold">★★★</ns0:text>
  <ns0:rect x="800" y="88.8889" width="266.6667" height="177.7778" rx="10.6667" fill="#fce4ec" stroke="#e53935" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="933.3333" y="158.2222" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#e53935">Nested</ns0:text>
  <ns0:text x="933.3333" y="197.3333" text-anchor="middle" font-size="15.1111" fill="#555555">Inner documents</ns0:text>
  <ns0:text x="933.3333" y="225.7778" text-anchor="middle" font-size="15.1111" fill="#555555">Accurate but slow</ns0:text>
  <ns0:text x="933.3333" y="254.2222" text-anchor="middle" font-size="19.5556" fill="#e53935" font-weight="bold">★★</ns0:text>
  <ns0:line x1="71.1111" y1="337.7778" x2="1066.6667" y2="337.7778" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:text x="568.8889" y="373.3333" text-anchor="middle" font-size="16" fill="#555555">Fast → Slow</ns0:text>
  <ns0:rect x="71.1111" y="400" width="995.5556" height="46.2222" rx="3.5556" fill="url(#grad-accent)" />
  <ns0:text x="204.4444" y="430.2222" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="#ffffff">Denormalized</ns0:text>
  <ns0:text x="568.8889" y="430.2222" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="#ffffff">Parent-Child</ns0:text>
  <ns0:text x="933.3333" y="430.2222" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="#ffffff">Nested</ns0:text>
  <ns0:rect x="71.1111" y="446.2222" width="995.5556" height="44.4444" rx="3.5556" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="204.4444" y="474.6667" text-anchor="middle" font-size="13.3333" fill="#333333">Large doc size</ns0:text>
  <ns0:text x="568.8889" y="474.6667" text-anchor="middle" font-size="13.3333" fill="#333333">Same shard required</ns0:text>
  <ns0:text x="933.3333" y="474.6667" text-anchor="middle" font-size="13.3333" fill="#333333">Hidden inner docs</ns0:text>
  <ns0:rect x="71.1111" y="531.5556" width="995.5556" height="49.7778" rx="5.3333" fill="#f2f6ff" stroke="#bbdefb" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="561.7778" text-anchor="middle" font-size="14.2222" fill="#1565c0">Prefer denormalization in ES. Only use nested/parent-child when data updates frequently and independently.</ns0:text>
</ns0:svg>
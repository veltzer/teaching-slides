<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="321.428571" height="209.386257325325" rx="7.312377586862" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200.714171" y="121.660602270051" text-anchor="middle" font-size="25.418553849268" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Denormalized</text>
  <text x="200.714171" y="167.725523571511" text-anchor="middle" font-size="18.004900839963" fill="var(--text-muted)" font-family="Arial, sans-serif">All data in one doc</text>
  <text x="200.714171" y="201.227356038872" text-anchor="middle" font-size="18.004900839963" fill="var(--text-muted)" font-family="Arial, sans-serif">Fastest queries</text>
  <text x="200.714171" y="234.729188506233" text-anchor="middle" font-size="23.300402270761" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">★★★★★</text>
  <rect x="479.285714" y="40" width="321.428571" height="209.386257325325" rx="7.312377586862" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="121.660602270051" text-anchor="middle" font-size="25.418553849268" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Parent-Child</text>
  <text x="640" y="167.725523571511" text-anchor="middle" font-size="18.004900839963" fill="var(--text-muted)" font-family="Arial, sans-serif">Separate doc types</text>
  <text x="640" y="201.227356038872" text-anchor="middle" font-size="18.004900839963" fill="var(--text-muted)" font-family="Arial, sans-serif">Join at query time</text>
  <text x="640" y="234.729188506233" text-anchor="middle" font-size="23.300402270761" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">★★★</text>
  <rect x="918.571429" y="40" width="321.428571" height="209.386257325325" rx="7.312377586862" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1079.2856" y="121.660602270051" text-anchor="middle" font-size="25.418553849268" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Nested</text>
  <text x="1079.2856" y="167.725523571511" text-anchor="middle" font-size="18.004900839963" fill="var(--text-muted)" font-family="Arial, sans-serif">Inner documents</text>
  <text x="1079.2856" y="201.227356038872" text-anchor="middle" font-size="18.004900839963" fill="var(--text-muted)" font-family="Arial, sans-serif">Accurate but slow</text>
  <text x="1079.2856" y="234.729188506233" text-anchor="middle" font-size="23.300402270761" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">★★</text>
  <line x1="40" y1="333.140707009964" x2="1240" y2="333.140707009964" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="375.017932395605" text-anchor="middle" font-size="19.063976108006" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast → Slow</text>
  <rect x="40" y="406.425916361736" width="1200" height="54.44044461686" rx="7.312377586862" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200.714171" y="442.021597330327" text-anchor="middle" font-size="16.945702566179" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Denormalized</text>
  <text x="640" y="442.021597330327" text-anchor="middle" font-size="16.945702566179" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Parent-Child</text>
  <text x="1079.2856" y="442.021597330327" text-anchor="middle" font-size="16.945702566179" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Nested</text>
  <rect x="40" y="460.866362065238" width="1200" height="52.346466805152" rx="7.312377586862" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="200.714171" y="494.368193445957" text-anchor="middle" font-size="15.886626255714" fill="var(--text)" font-family="Arial, sans-serif">Large doc size</text>
  <text x="640" y="494.368193445957" text-anchor="middle" font-size="15.886626255714" fill="var(--text)" font-family="Arial, sans-serif">Same shard required</text>
  <text x="1079.2856" y="494.368193445957" text-anchor="middle" font-size="15.886626255714" fill="var(--text)" font-family="Arial, sans-serif">Hidden inner docs</text>
  <rect x="40" y="561.371858380679" width="1200" height="58.628141619321" rx="7.312377586862" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="596.96740895215" text-anchor="middle" font-size="16.945702566179" fill="var(--primary-accent)" font-family="Arial, sans-serif">Prefer denormalization in ES. Only use nested/parent-child when data updates frequently and independently.</text>
</svg>

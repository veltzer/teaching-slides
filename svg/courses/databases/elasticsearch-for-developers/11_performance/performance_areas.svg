<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.687549" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Performance Areas</text>
  <rect x="40" y="87.027066" width="385.714286" height="176.351347" rx="7.073797" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.857143" y="163.445943" text-anchor="middle" font-size="24.589227" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Query</text>
  <text x="232.857143" y="202.635104" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">Use filter context, avoid</text>
  <text x="232.857143" y="230.06759" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">wildcards, prefer keyword</text>
  <rect x="511.428571" y="87.027066" width="385.714286" height="176.351347" rx="7.073797" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="704.285714" y="163.445943" text-anchor="middle" font-size="24.589227" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Indexing</text>
  <text x="704.285714" y="202.635104" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">Bulk API, disable refresh,</text>
  <text x="704.285714" y="230.06759" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">set replicas=0 initially</text>
  <rect x="40" y="341.756736" width="385.714286" height="176.351347" rx="7.073797" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.857143" y="418.175613" text-anchor="middle" font-size="24.589227" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Data Model</text>
  <text x="232.857143" y="457.364896" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">Denormalize, correct types,</text>
  <text x="232.857143" y="484.79726" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">proper shard count</text>
  <rect x="511.428571" y="341.756736" width="385.714286" height="176.351347" rx="7.073797" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="704.285714" y="418.175613" text-anchor="middle" font-size="24.589227" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Hardware</text>
  <text x="704.285714" y="457.364896" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">SSD storage, heap size</text>
  <text x="704.285714" y="484.79726" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">=50% RAM, fast network</text>
  <rect x="946.562" y="168.927" width="286.875" height="286.875" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="1090" y="292.770345" text-anchor="middle" font-size="26.638388" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cache</text>
  <text x="1090" y="331.959385" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">Filter, shard,</text>
  <text x="1090" y="359.391871" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)" font-family="Arial, sans-serif">field data cache</text>
  <rect x="40" y="565.13515" width="1200" height="54.86485" rx="7.073797" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="598.445973" text-anchor="middle" font-size="16.392818" fill="var(--primary-accent)" font-family="Arial, sans-serif">Profile your queries with ?explain and the Profile API. Monitor with cat APIs and monitoring features.</text>
</svg>
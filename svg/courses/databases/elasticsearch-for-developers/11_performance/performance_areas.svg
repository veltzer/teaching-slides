<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.687549" font-weight="bold" fill="var(--primary-accent)">Performance Areas</text>
  <rect x="40" y="87.027066" width="385.714286" height="176.351347" rx="7.073797" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="232.857143" y="163.445943" text-anchor="middle" font-size="24.589227" font-weight="bold" fill="var(--ok-accent)">Query</text>
  <text x="232.857143" y="202.635104" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)">Use filter context, avoid</text>
  <text x="232.857143" y="230.06759" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)">wildcards, prefer keyword</text>
  <rect x="511.428571" y="87.027066" width="385.714286" height="176.351347" rx="7.073797" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="704.285714" y="163.445943" text-anchor="middle" font-size="24.589227" font-weight="bold" fill="var(--primary-accent)">Indexing</text>
  <text x="704.285714" y="202.635104" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)">Bulk API, disable refresh,</text>
  <text x="704.285714" y="230.06759" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)">set replicas=0 initially</text>
  <rect x="40" y="341.756736" width="385.714286" height="176.351347" rx="7.073797" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="232.857143" y="418.175613" text-anchor="middle" font-size="24.589227" font-weight="bold" fill="var(--text-muted)">Data Model</text>
  <text x="232.857143" y="457.364896" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)">Denormalize, correct types,</text>
  <text x="232.857143" y="484.79726" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)">proper shard count</text>
  <rect x="511.428571" y="341.756736" width="385.714286" height="176.351347" rx="7.073797" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="704.285714" y="418.175613" text-anchor="middle" font-size="24.589227" font-weight="bold" fill="var(--info-accent)">Hardware</text>
  <text x="704.285714" y="457.364896" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)">SSD storage, heap size</text>
  <text x="704.285714" y="484.79726" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)">=50% RAM, fast network</text>
  <circle cx="1090" cy="312.364804" r="143.437511" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="1090" y="292.770345" text-anchor="middle" font-size="26.638388" font-weight="bold" fill="var(--danger-accent)">Cache</text>
  <text x="1090" y="331.959385" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)">Filter, shard,</text>
  <text x="1090" y="359.391871" text-anchor="middle" font-size="17.417458" fill="var(--text-muted)">field data cache</text>
  <rect x="40" y="565.13515" width="1200" height="54.86485" rx="7.073797" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="598.445973" text-anchor="middle" font-size="16.392818" fill="var(--primary-accent)">Profile your queries with ?explain and the Profile API. Monitor with cat APIs and monitoring features.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Performance Areas</text>
  <!-- Four quadrants -->
  <rect x="80" y="100" width="360" height="180" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="260" y="178" text-anchor="middle" font-size="24" font-weight="bold" fill="#2e7d32">Query</text>
  <text x="260" y="218" text-anchor="middle" font-size="17" fill="#555555">Use filter context, avoid</text>
  <text x="260" y="246" text-anchor="middle" font-size="17" fill="#555555">wildcards, prefer keyword</text>
  <rect x="520" y="100" width="360" height="180" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="700" y="178" text-anchor="middle" font-size="24" font-weight="bold" fill="#1565c0">Indexing</text>
  <text x="700" y="218" text-anchor="middle" font-size="17" fill="#555555">Bulk API, disable refresh,</text>
  <text x="700" y="246" text-anchor="middle" font-size="17" fill="#555555">set replicas=0 initially</text>
  <rect x="80" y="360" width="360" height="180" rx="12" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="260" y="438" text-anchor="middle" font-size="24" font-weight="bold" fill="#795548">Data Model</text>
  <text x="260" y="478" text-anchor="middle" font-size="17" fill="#555555">Denormalize, correct types,</text>
  <text x="260" y="506" text-anchor="middle" font-size="17" fill="#555555">proper shard count</text>
  <rect x="520" y="360" width="360" height="180" rx="12" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="700" y="438" text-anchor="middle" font-size="24" font-weight="bold" fill="#7b1fa2">Hardware</text>
  <text x="700" y="478" text-anchor="middle" font-size="17" fill="#555555">SSD storage, heap size</text>
  <text x="700" y="506" text-anchor="middle" font-size="17" fill="#555555">=50% RAM, fast network</text>
  <!-- Cache highlight -->
  <circle cx="1060" cy="330" r="140" fill="#fce4ec" stroke="#e53935" stroke-width="3" filter="url(#shadow)"/>
  <text x="1060" y="310" text-anchor="middle" font-size="26" font-weight="bold" fill="#e53935">Cache</text>
  <text x="1060" y="350" text-anchor="middle" font-size="17" fill="#555555">Filter, shard,</text>
  <text x="1060" y="378" text-anchor="middle" font-size="17" fill="#555555">field data cache</text>
  <!-- Note -->
  <rect x="80" y="588" width="1120" height="56" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="622" text-anchor="middle" font-size="16" fill="#1565c0">Profile your queries with ?explain and the Profile API. Monitor with cat APIs and monitoring features.</text>
</svg>

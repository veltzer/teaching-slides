<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="568.8889" y="46.2222" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="var(--primary-accent)">Performance Areas</text>
  <rect x="71.1111" y="88.8889" width="320" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="231.1111" y="158.2222" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--ok-accent)">Query</text>
  <text x="231.1111" y="193.7778" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Use filter context, avoid</text>
  <text x="231.1111" y="218.6667" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">wildcards, prefer keyword</text>
  <rect x="462.2222" y="88.8889" width="320" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="622.2222" y="158.2222" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--primary-accent)">Indexing</text>
  <text x="622.2222" y="193.7778" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Bulk API, disable refresh,</text>
  <text x="622.2222" y="218.6667" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">set replicas=0 initially</text>
  <rect x="71.1111" y="320" width="320" height="160" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="231.1111" y="389.3333" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text-muted)">Data Model</text>
  <text x="231.1111" y="424.8889" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Denormalize, correct types,</text>
  <text x="231.1111" y="449.7778" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">proper shard count</text>
  <rect x="462.2222" y="320" width="320" height="160" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="622.2222" y="389.3333" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--info-accent)">Hardware</text>
  <text x="622.2222" y="424.8889" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">SSD storage, heap size</text>
  <text x="622.2222" y="449.7778" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">=50% RAM, fast network</text>
  <circle cx="942.2222" cy="293.3333" r="124.4444" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="942.2222" y="275.5556" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--danger-accent)">Cache</text>
  <text x="942.2222" y="311.1111" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Filter, shard,</text>
  <text x="942.2222" y="336" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">field data cache</text>
  <rect x="71.1111" y="522.6667" width="995.5556" height="49.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="552.8889" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)">Profile your queries with ?explain and the Profile API. Monitor with cat APIs and monitoring features.</text>
</svg>
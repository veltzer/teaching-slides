<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="46.2222" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#1565c0">Performance Areas</ns0:text>
  <ns0:rect x="71.1111" y="88.8889" width="320" height="160" rx="10.6667" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="231.1111" y="158.2222" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#2e7d32">Query</ns0:text>
  <ns0:text x="231.1111" y="193.7778" text-anchor="middle" font-size="15.1111" fill="#555555">Use filter context, avoid</ns0:text>
  <ns0:text x="231.1111" y="218.6667" text-anchor="middle" font-size="15.1111" fill="#555555">wildcards, prefer keyword</ns0:text>
  <ns0:rect x="462.2222" y="88.8889" width="320" height="160" rx="10.6667" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="622.2222" y="158.2222" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#1565c0">Indexing</ns0:text>
  <ns0:text x="622.2222" y="193.7778" text-anchor="middle" font-size="15.1111" fill="#555555">Bulk API, disable refresh,</ns0:text>
  <ns0:text x="622.2222" y="218.6667" text-anchor="middle" font-size="15.1111" fill="#555555">set replicas=0 initially</ns0:text>
  <ns0:rect x="71.1111" y="320" width="320" height="160" rx="10.6667" fill="#fff9c4" stroke="#f9a825" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="231.1111" y="389.3333" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#555555">Data Model</ns0:text>
  <ns0:text x="231.1111" y="424.8889" text-anchor="middle" font-size="15.1111" fill="#555555">Denormalize, correct types,</ns0:text>
  <ns0:text x="231.1111" y="449.7778" text-anchor="middle" font-size="15.1111" fill="#555555">proper shard count</ns0:text>
  <ns0:rect x="462.2222" y="320" width="320" height="160" rx="10.6667" fill="#e8eaf6" stroke="#7b1fa2" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="622.2222" y="389.3333" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#7b1fa2">Hardware</ns0:text>
  <ns0:text x="622.2222" y="424.8889" text-anchor="middle" font-size="15.1111" fill="#555555">SSD storage, heap size</ns0:text>
  <ns0:text x="622.2222" y="449.7778" text-anchor="middle" font-size="15.1111" fill="#555555">=50% RAM, fast network</ns0:text>
  <ns0:circle cx="942.2222" cy="293.3333" r="124.4444" fill="#fce4ec" stroke="#e53935" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="942.2222" y="275.5556" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#e53935">Cache</ns0:text>
  <ns0:text x="942.2222" y="311.1111" text-anchor="middle" font-size="15.1111" fill="#555555">Filter, shard,</ns0:text>
  <ns0:text x="942.2222" y="336" text-anchor="middle" font-size="15.1111" fill="#555555">field data cache</ns0:text>
  <ns0:rect x="71.1111" y="522.6667" width="995.5556" height="49.7778" rx="5.3333" fill="#f9f9f9" stroke="#bbdefb" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="552.8889" text-anchor="middle" font-size="14.2222" fill="#1565c0">Profile your queries with ?explain and the Profile API. Monitor with cat APIs and monitoring features.</ns0:text>
</ns0:svg>
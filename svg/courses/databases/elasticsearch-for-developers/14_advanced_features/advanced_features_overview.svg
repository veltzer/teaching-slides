<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="590" height="280" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.0" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Painless</text>
  <text x="335.0" y="140" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">scripting language</text>
  <text x="335.0" y="172" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">sandboxed, fast, typed</text>
  <text x="335.0" y="204" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">used in updates,</text>
  <text x="335.0" y="236" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">aggregations, reindex</text>
  <rect x="650" y="40" width="590" height="280" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.0" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Pipelines</text>
  <text x="945.0" y="140" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">ingest-time transforms</text>
  <text x="945.0" y="172" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">enrich, grok, rename</text>
  <text x="945.0" y="204" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">runs on ingest nodes</text>
  <text x="945.0" y="236" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">before indexing</text>
  <rect x="40" y="340" width="390" height="280" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235.0" y="390" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Percolator</text>
  <text x="235.0" y="440" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">stored queries</text>
  <text x="235.0" y="472" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">match documents</text>
  <text x="235.0" y="504" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">against saved queries</text>
  <text x="235.0" y="536" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">reverse search</text>
  <rect x="440" y="340" width="390" height="280" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.0" y="390" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Data Streams</text>
  <text x="635.0" y="440" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">append-only series</text>
  <text x="635.0" y="472" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">auto-rollover indices</text>
  <text x="635.0" y="504" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">hides index naming</text>
  <text x="635.0" y="536" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">pairs with ILM</text>
  <rect x="840" y="340" width="400" height="280" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040.0" y="390" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">ILM</text>
  <text x="1040.0" y="440" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">lifecycle management</text>
  <text x="1040.0" y="472" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">hot / warm / cold</text>
  <text x="1040.0" y="504" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">age + size policies</text>
  <text x="1040.0" y="536" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">automated tiering</text>
</svg>

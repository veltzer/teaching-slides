<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="590" height="280" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.0" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--ok-text)">Painless</text>
  <text x="335.0" y="140" text-anchor="middle" font-size="18" fill="var(--ok-text)">scripting language</text>
  <text x="335.0" y="172" text-anchor="middle" font-size="18" fill="var(--ok-text)">sandboxed, fast, typed</text>
  <text x="335.0" y="204" text-anchor="middle" font-size="18" fill="var(--ok-text)">used in updates,</text>
  <text x="335.0" y="236" text-anchor="middle" font-size="18" fill="var(--ok-text)">aggregations, reindex</text>
  <rect x="650" y="40" width="590" height="280" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.0" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--primary-text)">Pipelines</text>
  <text x="945.0" y="140" text-anchor="middle" font-size="18" fill="var(--primary-text)">ingest-time transforms</text>
  <text x="945.0" y="172" text-anchor="middle" font-size="18" fill="var(--primary-text)">enrich, grok, rename</text>
  <text x="945.0" y="204" text-anchor="middle" font-size="18" fill="var(--primary-text)">runs on ingest nodes</text>
  <text x="945.0" y="236" text-anchor="middle" font-size="18" fill="var(--primary-text)">before indexing</text>
  <rect x="40" y="340" width="390" height="280" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235.0" y="390" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--warn-text)">Percolator</text>
  <text x="235.0" y="440" text-anchor="middle" font-size="18" fill="var(--warn-text)">stored queries</text>
  <text x="235.0" y="472" text-anchor="middle" font-size="18" fill="var(--warn-text)">match documents</text>
  <text x="235.0" y="504" text-anchor="middle" font-size="18" fill="var(--warn-text)">against saved queries</text>
  <text x="235.0" y="536" text-anchor="middle" font-size="18" fill="var(--warn-text)">reverse search</text>
  <rect x="440" y="340" width="390" height="280" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.0" y="390" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--info-text)">Data Streams</text>
  <text x="635.0" y="440" text-anchor="middle" font-size="18" fill="var(--info-text)">append-only series</text>
  <text x="635.0" y="472" text-anchor="middle" font-size="18" fill="var(--info-text)">auto-rollover indices</text>
  <text x="635.0" y="504" text-anchor="middle" font-size="18" fill="var(--info-text)">hides index naming</text>
  <text x="635.0" y="536" text-anchor="middle" font-size="18" fill="var(--info-text)">pairs with ILM</text>
  <rect x="840" y="340" width="400" height="280" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040.0" y="390" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--danger-text)">ILM</text>
  <text x="1040.0" y="440" text-anchor="middle" font-size="18" fill="var(--danger-text)">lifecycle management</text>
  <text x="1040.0" y="472" text-anchor="middle" font-size="18" fill="var(--danger-text)">hot / warm / cold</text>
  <text x="1040.0" y="504" text-anchor="middle" font-size="18" fill="var(--danger-text)">age + size policies</text>
  <text x="1040.0" y="536" text-anchor="middle" font-size="18" fill="var(--danger-text)">automated tiering</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="661.428571428571" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.364960155869" font-weight="bold" fill="var(--text)">text vs keyword</text>

  <rect x="40" y="86.194690265487" width="578.571428571429" height="328.495575221239" rx="10.487485769953" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.974971539906" font-weight="bold" fill="var(--primary-text)">text type</text>

  <rect x="61.428571428571" y="142.654867256637" width="535.714285714286" height="61.592920353982" rx="6.292491461972" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="82.857142857143" y="168.318584070796" font-family="Arial, sans-serif" font-size="13.633731500939" font-weight="bold" fill="var(--text)">Input: "Apple iPhone 15 Pro"</text>
  <text x="82.857142857143" y="188.849557522124" font-family="Arial, sans-serif" font-size="13.633731500939" fill="var(--text-muted)">analyzer -&gt; [apple, iphone, 15, pro]</text>

  <text x="61.428571428571" y="240" font-family="Arial, sans-serif" font-size="14.682480077934" font-weight="bold" fill="var(--primary-text)">For: full-text search</text>
  <text x="61.428571428571" y="275" font-family="Arial, sans-serif" font-size="13.633731500939" fill="var(--primary-text)">Tokenized, lowercased, stemmed</text>
  <text x="61.428571428571" y="305" font-family="Arial, sans-serif" font-size="13.633731500939" fill="var(--primary-text)">Use match query</text>
  <text x="61.428571428571" y="345" font-family="Arial, sans-serif" font-size="13.633731500939" font-weight="bold" fill="var(--primary-text)">No sort or aggregate</text>
  <text x="61.428571428571" y="380" font-family="Arial, sans-serif" font-size="13.633731500939" font-style="italic" fill="var(--primary-text)">"phone" matches "iPhone"</text>

  <rect x="661.428571428571" y="86.194690265487" width="578.571428571429" height="328.495575221239" rx="10.487485769953" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.974971539906" font-weight="bold" fill="var(--warn-text)">keyword type</text>

  <rect x="682.857142857143" y="142.654867256637" width="535.714285714286" height="61.592920353982" rx="6.292491461972" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="704.285714285714" y="168.318584070796" font-family="Arial, sans-serif" font-size="13.633731500939" font-weight="bold" fill="var(--text)">Input: "Apple iPhone 15 Pro"</text>
  <text x="704.285714285714" y="188.849557522124" font-family="Arial, sans-serif" font-size="13.633731500939" fill="var(--text-muted)">stored as: "Apple iPhone 15 Pro"</text>

  <text x="682.857142857143" y="240" font-family="Arial, sans-serif" font-size="14.682480077934" font-weight="bold" fill="var(--warn-text)">For: exact match, sort, aggregate</text>
  <text x="682.857142857143" y="275" font-family="Arial, sans-serif" font-size="13.633731500939" fill="var(--warn-text)">Single token, byte-for-byte</text>
  <text x="682.857142857143" y="305" font-family="Arial, sans-serif" font-size="13.633731500939" fill="var(--warn-text)">Use term query</text>
  <text x="682.857142857143" y="345" font-family="Arial, sans-serif" font-size="13.633731500939" font-weight="bold" fill="var(--warn-text)">Case-sensitive</text>
  <text x="682.857142857143" y="380" font-family="Arial, sans-serif" font-size="13.633731500939" font-style="italic" fill="var(--warn-text)">For IDs, tags, enums</text>

  <rect x="40" y="445.486725663717" width="1200" height="174.513274336283" rx="10.487485769953" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="661.428571428571" y="481.41592920354" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.974971539906" font-weight="bold" fill="var(--ok-text)">Best practice: multi-field</text>
  <text x="61.428571428571" y="517.345132743363" font-family="Arial, sans-serif" font-size="14.682480077934" fill="var(--ok-text)">"name": {</text>
  <text x="104.285714285714" y="543.008849557522" font-family="Arial, sans-serif" font-size="14.682480077934" fill="var(--ok-text)">"type": "text",</text>
  <text x="104.285714285714" y="568.672566371681" font-family="Arial, sans-serif" font-size="14.682480077934" fill="var(--ok-text)">"fields": { "keyword": { "type": "keyword" } }</text>
  <text x="61.428571428571" y="594.336283185841" font-family="Arial, sans-serif" font-size="14.682480077934" fill="var(--ok-text)">}</text>
  <text x="725.714285714286" y="532.743362831858" font-family="Arial, sans-serif" font-size="14.682480077934" font-weight="bold" fill="var(--ok-text)">Search: name (analyzed)</text>
  <text x="725.714285714286" y="563.53982300885" font-family="Arial, sans-serif" font-size="14.682480077934" font-weight="bold" fill="var(--ok-text)">Sort/aggregate: name.keyword (raw)</text>
  <text x="725.714285714286" y="594.336283185841" font-family="Arial, sans-serif" font-size="13.633731500939" fill="var(--ok-text)">Best of both — extra storage cost is small</text>
</svg>

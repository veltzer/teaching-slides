<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Connection Pooling</text>
  <!-- App -->
  <rect x="60" y="180" width="260" height="360" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="190" y="368" text-anchor="middle" font-size="26" font-weight="bold" fill="#2e7d32">App</text>
  <!-- Pool connections -->
  <rect x="480" y="100" width="220" height="100" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="158" text-anchor="middle" font-size="20" fill="#1565c0" font-weight="bold">Conn 1</text>
  <rect x="480" y="240" width="220" height="100" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="298" text-anchor="middle" font-size="20" fill="#1565c0" font-weight="bold">Conn 2</text>
  <rect x="480" y="380" width="220" height="100" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="438" text-anchor="middle" font-size="20" fill="#1565c0" font-weight="bold">Conn 3</text>
  <!-- ES -->
  <rect x="960" y="180" width="260" height="360" rx="14" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1090" y="368" text-anchor="middle" font-size="26" font-weight="bold" fill="#795548">ES Node</text>
  <!-- Lines -->
  <line x1="320" y1="320" x2="479" y2="299" stroke="#555555" stroke-width="2.5"/>
  <line x1="700" y1="149" x2="960" y2="320" stroke="#555555" stroke-width="2.5"/>
  <line x1="700" y1="289" x2="960" y2="340" stroke="#555555" stroke-width="2.5"/>
  <line x1="700" y1="429" x2="960" y2="380" stroke="#555555" stroke-width="2.5"/>
  <!-- Note -->
  <rect x="60" y="596" width="1160" height="80" rx="8" fill="#f2f6ff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="628" text-anchor="middle" font-size="18" fill="#1565c0" font-weight="bold">ES Client maintains connection pool automatically</text>
  <text x="640" y="660" text-anchor="middle" font-size="16" fill="#555555">Sniffing: client discovers all nodes. Sticky sessions: route to same node for related requests.</text>
</svg>

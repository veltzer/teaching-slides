<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.456303" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Connection Pooling</text>
  <rect x="40" y="158.974362" width="268.965517" height="334.615429" rx="6.770196" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="174.482759" y="333.717924" text-anchor="middle" font-size="25.49509" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">App</text>
  <rect x="474.482759" y="84.615429" width="227.586207" height="92.948782" rx="6.770196" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.275752" y="138.525552" text-anchor="middle" font-size="19.611677" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Conn 1</text>
  <rect x="474.482759" y="214.743562" width="227.586207" height="92.948782" rx="6.770196" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.275752" y="268.653915" text-anchor="middle" font-size="19.611677" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Conn 2</text>
  <rect x="474.482759" y="344.87181" width="227.586207" height="92.948782" rx="6.770196" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.275752" y="398.782048" text-anchor="middle" font-size="19.611677" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Conn 3</text>
  <rect x="971.034372" y="158.974362" width="268.965517" height="334.615429" rx="6.770196" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.517241" y="333.717924" text-anchor="middle" font-size="25.49509" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">ES Node</text>
  <line x1="308.965407" y1="289.102495" x2="473.448276" y2="269.583338" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="702.068966" y1="130.160166" x2="971.034372" y2="289.102495" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="702.068966" y1="260.288529" x2="971.034372" y2="307.692343" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="702.068966" y1="390.416662" x2="971.034372" y2="344.87181" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="40" y="545.641067" width="1200" height="74.358933" rx="6.770196" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="575.384686" text-anchor="middle" font-size="17.650464" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">ES Client maintains connection pool automatically</text>
  <text x="640" y="605.128306" text-anchor="middle" font-size="15.689252" fill="var(--text-muted)" font-family="Arial, sans-serif">Sniffing: client discovers all nodes. Sticky sessions: route to same node for related requests.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.060699182639" font-weight="bold" fill="var(--text)">ClickHouse Cluster: Shards &amp; Replicas</text>

  <rect x="40" y="102.477558348294" width="1200" height="62.477558348294" rx="10.378821136657" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="138.922800718133" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.681878045982" font-weight="bold" fill="var(--info-text)">Distributed table (logical view across shards)</text>

  <text x="205.51724137931" y="206.606822262118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.681878045982" font-weight="bold" fill="var(--text)">Shard 1</text>
  <text x="640" y="206.606822262118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.681878045982" font-weight="bold" fill="var(--text)">Shard 2</text>
  <text x="1074.48275862069" y="206.606822262118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.681878045982" font-weight="bold" fill="var(--text)">Shard 3</text>

  <rect x="60.689655172414" y="227.432675044883" width="289.655172413793" height="83.303411131059" rx="8.303056909325" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="205.51724137931" y="263.877917414722" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.568231704985" font-weight="bold" fill="var(--primary-text)">Replica 1A</text>
  <text x="205.51724137931" y="287.827648114901" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.492467477654" fill="var(--primary-text)">tokens 0-33%</text>

  <rect x="60.689655172414" y="331.561938958707" width="289.655172413793" height="83.303411131059" rx="8.303056909325" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="205.51724137931" y="368.007181328546" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.568231704985" font-weight="bold" fill="var(--primary-text)">Replica 1B</text>
  <text x="205.51724137931" y="391.956912028725" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.492467477654" fill="var(--primary-text)">tokens 0-33%</text>

  <rect x="495.172413793103" y="227.432675044883" width="289.655172413793" height="83.303411131059" rx="8.303056909325" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="263.877917414722" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.568231704985" font-weight="bold" fill="var(--primary-text)">Replica 2A</text>
  <text x="640" y="287.827648114901" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.492467477654" fill="var(--primary-text)">tokens 33-66%</text>

  <rect x="495.172413793103" y="331.561938958707" width="289.655172413793" height="83.303411131059" rx="8.303056909325" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="368.007181328546" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.568231704985" font-weight="bold" fill="var(--primary-text)">Replica 2B</text>
  <text x="640" y="391.956912028725" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.492467477654" fill="var(--primary-text)">tokens 33-66%</text>

  <rect x="929.655172413793" y="227.432675044883" width="289.655172413793" height="83.303411131059" rx="8.303056909325" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.48275862069" y="263.877917414722" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.568231704985" font-weight="bold" fill="var(--primary-text)">Replica 3A</text>
  <text x="1074.48275862069" y="287.827648114901" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.492467477654" fill="var(--primary-text)">tokens 66-100%</text>

  <rect x="929.655172413793" y="331.561938958707" width="289.655172413793" height="83.303411131059" rx="8.303056909325" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.48275862069" y="368.007181328546" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.568231704985" font-weight="bold" fill="var(--primary-text)">Replica 3B</text>
  <text x="1074.48275862069" y="391.956912028725" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.492467477654" fill="var(--primary-text)">tokens 66-100%</text>

  <path d="M 350.344827586207 269.084380610413 L 495.172413793103 269.084380610413" fill="none" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 784.827586206897 269.084380610413 L 929.655172413793 269.084380610413" fill="none" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4 4"/>

  <path d="M 205.51724137931 310.736086175943 L 205.51724137931 331.561938958707" fill="none" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <path d="M 205.51724137931 331.561938958707 L 205.51724137931 310.736086175943" fill="none" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <path d="M 640 310.736086175943 L 640 331.561938958707" fill="none" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <path d="M 640 331.561938958707 L 640 310.736086175943" fill="none" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <path d="M 1074.48275862069 310.736086175943 L 1074.48275862069 331.561938958707" fill="none" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <path d="M 1074.48275862069 331.561938958707 L 1074.48275862069 310.736086175943" fill="none" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <rect x="40" y="446.104129263914" width="1200" height="83.303411131059" rx="10.378821136657" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="482.549371633752" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.681878045982" font-weight="bold" fill="var(--warn-text)">Coordination service (ZooKeeper or Keeper)</text>
  <text x="640" y="508.581687612208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.53034959132" fill="var(--warn-text)">Replication coordination, leader election, distributed DDL</text>

  <text x="640" y="571.059245960503" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.568231704985" font-weight="bold" fill="var(--text)">Shards expand capacity; replicas provide HA and read scaling</text>
  <text x="640" y="597.091561938959" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.492467477654" fill="var(--text-muted)">Inserts to one replica → automatic replication to siblings</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.492467477654" fill="var(--text-muted)">Reads served by any replica in the shard</text>
</svg>

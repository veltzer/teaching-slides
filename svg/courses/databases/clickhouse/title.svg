<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--code-text)">ClickHouse</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <text x="125" y="246" font-size="16" fill="var(--text-faint)">part 1</text>
  <rect x="180" y="215" width="55" height="50" fill="var(--primary-fill)"/>
  <rect x="235" y="215" width="55" height="50" fill="var(--ok-fill)"/>
  <rect x="290" y="215" width="55" height="50" fill="var(--warn-fill)"/>
  <rect x="345" y="215" width="55" height="50" fill="var(--info-fill)"/>
  <text x="125" y="326" font-size="16" fill="var(--text-faint)">part 2</text>
  <rect x="180" y="295" width="55" height="50" fill="var(--primary-fill)"/>
  <rect x="235" y="295" width="55" height="50" fill="var(--ok-fill)"/>
  <rect x="290" y="295" width="55" height="50" fill="var(--warn-fill)"/>
  <rect x="345" y="295" width="55" height="50" fill="var(--info-fill)"/>
  <text x="125" y="406" font-size="16" fill="var(--text-faint)">part 3</text>
  <rect x="180" y="375" width="55" height="50" fill="var(--primary-fill)"/>
  <rect x="235" y="375" width="55" height="50" fill="var(--ok-fill)"/>
  <rect x="290" y="375" width="55" height="50" fill="var(--warn-fill)"/>
  <rect x="345" y="375" width="55" height="50" fill="var(--info-fill)"/>
  <line x1="408" y1="240" x2="520" y2="300" stroke="var(--text-faint)" stroke-width="3"/>
  <line x1="408" y1="320" x2="512" y2="320" stroke="var(--text-faint)" stroke-width="3"/>
  <line x1="408" y1="400" x2="520" y2="340" stroke="var(--text-faint)" stroke-width="3"/>
  <circle cx="560" cy="320" r="48" fill="var(--danger-fill)"/>
  <text x="560" y="326" font-size="18" fill="var(--danger-text)">merge</text>
  <line x1="612" y1="320" x2="686" y2="320" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="684,311 700,320 684,329" fill="var(--text-faint)"/>
  <rect x="710" y="235" width="110" height="170" fill="var(--primary-fill)"/>
  <text x="765" y="326" font-size="18" fill="var(--primary-text)">time</text>
  <rect x="820" y="235" width="110" height="170" fill="var(--ok-fill)"/>
  <text x="875" y="326" font-size="18" fill="var(--ok-text)">user</text>
  <rect x="930" y="235" width="110" height="170" fill="var(--warn-fill)"/>
  <text x="985" y="326" font-size="18" fill="var(--warn-text)">event</text>
  <rect x="1040" y="235" width="110" height="170" fill="var(--info-fill)"/>
  <text x="1095" y="326" font-size="18" fill="var(--info-text)">value</text>
  <text x="930" y="438" font-size="16" fill="var(--text-faint)">one column per file, sorted by primary key</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">MergeTree engines • primary key &amp; partitions • materialized views • bulk loading • sharding &amp; replication</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

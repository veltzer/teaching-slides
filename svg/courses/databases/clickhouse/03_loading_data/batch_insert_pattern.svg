<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Batch Insert Patterns</text>

  <text x="297.142857142857" y="96.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.068401719647" font-weight="bold" fill="var(--danger-accent)">Anti-pattern</text>
  <text x="982.857142857143" y="96.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.068401719647" font-weight="bold" fill="var(--ok-accent)">Recommended</text>
  <line x1="640" y1="81.428571428571" x2="640" y2="599.285714285714" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="297.142857142857" y="153.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--text)">App writes one row at a time</text>

  <rect x="40" y="174.642857142857" width="85.714285714286" height="41.428571428571" rx="4.213680343929" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="82.857142857143" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" font-weight="bold" fill="var(--danger-text)">INSERT</text>
  <rect x="136.428571428571" y="174.642857142857" width="85.714285714286" height="41.428571428571" rx="4.213680343929" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="179.285714285714" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" font-weight="bold" fill="var(--danger-text)">INSERT</text>
  <rect x="232.857142857143" y="174.642857142857" width="85.714285714286" height="41.428571428571" rx="4.213680343929" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="275.714285714286" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" font-weight="bold" fill="var(--danger-text)">INSERT</text>
  <rect x="329.285714285714" y="174.642857142857" width="85.714285714286" height="41.428571428571" rx="4.213680343929" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="372.142857142857" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" font-weight="bold" fill="var(--danger-text)">INSERT</text>
  <rect x="425.714285714286" y="174.642857142857" width="85.714285714286" height="41.428571428571" rx="4.213680343929" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="468.571428571428" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" font-weight="bold" fill="var(--danger-text)">INSERT</text>

  <rect x="40" y="257.5" width="85.714285714286" height="41.428571428571" rx="4.213680343929" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="82.857142857143" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.587620945806" fill="var(--warn-text)">part</text>
  <rect x="136.428571428571" y="257.5" width="85.714285714286" height="41.428571428571" rx="4.213680343929" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="179.285714285714" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.587620945806" fill="var(--warn-text)">part</text>
  <rect x="232.857142857143" y="257.5" width="85.714285714286" height="41.428571428571" rx="4.213680343929" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="275.714285714286" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.587620945806" fill="var(--warn-text)">part</text>
  <rect x="329.285714285714" y="257.5" width="85.714285714286" height="41.428571428571" rx="4.213680343929" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="372.142857142857" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.587620945806" fill="var(--warn-text)">part</text>
  <rect x="425.714285714286" y="257.5" width="85.714285714286" height="41.428571428571" rx="4.213680343929" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="468.571428571428" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.587620945806" fill="var(--warn-text)">part</text>

  <text x="297.142857142857" y="350.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--danger-accent)">Compaction can't keep up</text>
  <text x="297.142857142857" y="376.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--danger-accent)">"Too many parts" error</text>
  <text x="297.142857142857" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--danger-accent)">Reads slow down</text>

  <text x="982.857142857143" y="153.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--text)">App accumulates and inserts batch</text>

  <rect x="704.285714285714" y="174.642857142857" width="342.857142857143" height="41.428571428571" rx="4.213680343929" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="875.714285714286" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" font-weight="bold" fill="var(--ok-text)">INSERT 100k rows in one call</text>

  <rect x="704.285714285714" y="257.5" width="342.857142857143" height="41.428571428571" rx="4.213680343929" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="875.714285714286" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--warn-text)">one large part</text>

  <text x="982.857142857143" y="350.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-accent)">Fewer parts to manage</text>
  <text x="982.857142857143" y="376.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-accent)">Better compression</text>
  <text x="982.857142857143" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-accent)">Predictable performance</text>

  <rect x="40" y="443.928571428571" width="1200" height="176.071428571429" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">How to batch</text>
  <text x="640" y="506.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text-muted)">Aim for ~100k+ rows per insert call</text>
  <text x="640" y="531.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text-muted)">Or use async_insert for server-side batching</text>
  <text x="640" y="557.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text-muted)">Or use Buffer engine as a memory-side queue</text>
  <text x="640" y="594.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">Streaming: Kafka engine + materialized view to merge tree</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.982753492379" font-weight="bold" fill="var(--text)">ClickHouse Insert Patterns</text>
  <rect x="40" y="80" width="557.142857142857" height="540" rx="10.350983390135" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="318.571428571429" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.772163458298" font-weight="bold" fill="var(--ok-text)">Do</text>
  <text x="61.428571428571" y="170" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--ok-text)">Big batches every second</text>
  <text x="61.428571428571" y="210" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--ok-text)">10k+ rows per insert</text>
  <text x="61.428571428571" y="250" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--ok-text)">Use a buffer table or queue</text>
  <text x="61.428571428571" y="290" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--ok-text)">Async inserts setting</text>
  <text x="61.428571428571" y="330" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--ok-text)">Insert into Distributed table</text>
  <text x="61.428571428571" y="370" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--ok-text)">Native protocol when possible</text>
  <rect x="682.857142857143" y="80" width="557.142857142857" height="540" rx="10.350983390135" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="961.428571428571" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.772163458298" font-weight="bold" fill="var(--danger-text)">Don't</text>
  <text x="704.285714285714" y="170" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--danger-text)">One INSERT per row</text>
  <text x="704.285714285714" y="210" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--danger-text)">Hundreds per second</text>
  <text x="704.285714285714" y="250" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--danger-text)">Many tiny parts</text>
  <text x="704.285714285714" y="290" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--danger-text)">Merge backlog explodes</text>
  <text x="704.285714285714" y="330" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--danger-text)">Cluster degrades</text>
  <text x="704.285714285714" y="370" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--danger-text)">Most-common new-user pitfall</text>
</svg>

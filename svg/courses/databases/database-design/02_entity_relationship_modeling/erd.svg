<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.128853838633" font-weight="bold" fill="var(--text)">ER Diagram</text>

  <rect x="60.338983050847" y="109.174311926606" width="284.745762711864" height="191.559633027523" rx="10.403162085226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.71186440678" y="146.422018348624" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.806324170452" font-weight="bold" fill="var(--primary-text)">Customer</text>
  <line x1="60.338983050847" y1="157.064220183486" x2="345.084745762712" y2="157.064220183486" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="80.677966101695" y="188.990825688073" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--primary-text)">id (PK)</text>
  <text x="80.677966101695" y="215.596330275229" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--primary-text)">name</text>
  <text x="80.677966101695" y="242.201834862385" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--primary-text)">email</text>
  <text x="80.677966101695" y="279.449541284404" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--primary-text)">created_at</text>

  <text x="462.033898305085" y="188.990825688073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" font-weight="bold" fill="var(--text)">1..1</text>
  <path d="M 345.084745762712 204.954128440367 L 578.983050847458 204.954128440367" stroke="var(--text)" stroke-width="2"/>
  <text x="462.033898305085" y="226.238532110092" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" font-weight="bold" fill="var(--text)">0..N</text>
  <text x="462.033898305085" y="252.844036697248" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--text-muted)">places</text>

  <rect x="589.152542372881" y="109.174311926606" width="284.745762711864" height="191.559633027523" rx="10.403162085226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="731.525423728814" y="146.422018348624" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.806324170452" font-weight="bold" fill="var(--ok-text)">Order</text>
  <line x1="589.152542372881" y1="157.064220183486" x2="873.898305084746" y2="157.064220183486" stroke="var(--ok-text)" stroke-width="1"/>
  <text x="609.491525423729" y="188.990825688073" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--ok-text)">id (PK)</text>
  <text x="609.491525423729" y="215.596330275229" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--ok-text)">customer_id (FK)</text>
  <text x="609.491525423729" y="242.201834862385" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--ok-text)">total</text>
  <text x="609.491525423729" y="279.449541284404" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--ok-text)">status</text>

  <text x="929.830508474576" y="188.990825688073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" font-weight="bold" fill="var(--text)">1..1</text>
  <path d="M 873.898305084746 204.954128440367 L 985.762711864407 204.954128440367" stroke="var(--text)" stroke-width="2"/>
  <text x="929.830508474576" y="226.238532110092" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" font-weight="bold" fill="var(--text)">1..N</text>

  <rect x="995.932203389831" y="109.174311926606" width="244.067796610169" height="191.559633027523" rx="10.403162085226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1117.966101694915" y="146.422018348624" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.806324170452" font-weight="bold" fill="var(--warn-text)">OrderLine</text>
  <line x1="995.932203389831" y1="157.064220183486" x2="1240" y2="157.064220183486" stroke="var(--warn-text)" stroke-width="1"/>
  <text x="1016.271186440678" y="188.990825688073" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--warn-text)">id (PK)</text>
  <text x="1016.271186440678" y="215.596330275229" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--warn-text)">order_id (FK)</text>
  <text x="1016.271186440678" y="242.201834862385" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--warn-text)">sku</text>
  <text x="1016.271186440678" y="279.449541284404" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--warn-text)">qty</text>

  <rect x="40" y="364.587155963303" width="376.271186440678" height="255.412844036697" rx="10.403162085226" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.135593220339" y="401.834862385321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.725691753407" font-weight="bold" fill="var(--info-text)">Cardinality</text>
  <text x="60.338983050847" y="439.082568807339" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--info-text)">1..1 one</text>
  <text x="60.338983050847" y="465.688073394495" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--info-text)">0..1 zero or one</text>
  <text x="60.338983050847" y="492.293577981651" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--info-text)">1..N one or more</text>
  <text x="60.338983050847" y="518.899082568807" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--info-text)">0..N any number</text>
  <text x="60.338983050847" y="572.110091743119" font-family="Arial, sans-serif" font-size="12.483794502271" font-style="italic" fill="var(--info-text)">Crow's foot notation</text>

  <rect x="441.694915254237" y="364.587155963303" width="376.271186440678" height="255.412844036697" rx="10.403162085226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.830508474576" y="401.834862385321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.725691753407" font-weight="bold" fill="var(--primary-text)">Entity types</text>
  <text x="462.033898305085" y="439.082568807339" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--primary-text)">- Strong: own PK</text>
  <text x="462.033898305085" y="465.688073394495" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--primary-text)">- Weak: needs parent</text>
  <text x="462.033898305085" y="492.293577981651" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--primary-text)">- Associative: M:N junction</text>

  <rect x="843.389830508475" y="364.587155963303" width="376.271186440678" height="255.412844036697" rx="10.403162085226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1031.525423728814" y="401.834862385321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.725691753407" font-weight="bold" fill="var(--warn-text)">Common errors</text>
  <text x="863.728813559322" y="439.082568807339" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--warn-text)">- Many-to-many in one table</text>
  <text x="863.728813559322" y="465.688073394495" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--warn-text)">- Missing FK constraints</text>
  <text x="863.728813559322" y="492.293577981651" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--warn-text)">- Storing arrays as strings</text>
  <text x="863.728813559322" y="518.899082568807" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--warn-text)">- Surrogate vs natural key</text>
</svg>

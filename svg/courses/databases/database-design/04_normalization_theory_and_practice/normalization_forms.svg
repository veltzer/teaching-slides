<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Normalization: 1NF, 2NF, 3NF</text>

  <rect x="40" y="87.889908256881" width="382.758620689655" height="532.110091743119" rx="10.49246125174" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.083414753828" font-weight="bold" fill="var(--danger-text)">Unnormalized</text>
  <text x="60.689655172414" y="162.385321100917" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--danger-text)">orders table</text>
  <text x="60.689655172414" y="194.311926605505" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--danger-text)">id | customer | items</text>
  <text x="60.689655172414" y="220.917431192661" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--danger-text)">1  | Alice    | apple,bread</text>
  <text x="60.689655172414" y="242.201834862385" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--danger-text)">2  | Alice    | milk</text>

  <text x="60.689655172414" y="295.412844036697" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--danger-text)">Problems:</text>
  <text x="60.689655172414" y="322.018348623853" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--danger-text)">- Multi-value column</text>
  <text x="60.689655172414" y="343.302752293578" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--danger-text)">- Customer name repeated</text>
  <text x="60.689655172414" y="364.587155963303" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--danger-text)">- Update one customer = update many rows</text>
  <text x="60.689655172414" y="385.871559633028" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--danger-text)">- Hard to query items</text>

  <rect x="448.620689655172" y="87.889908256881" width="382.758620689655" height="532.110091743119" rx="10.49246125174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.083414753828" font-weight="bold" fill="var(--warn-text)">After 1NF + 2NF</text>
  <text x="469.310344827586" y="162.385321100917" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--warn-text)">orders</text>
  <text x="469.310344827586" y="188.990825688073" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--warn-text)">id | customer</text>

  <text x="469.310344827586" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--warn-text)">order_items</text>
  <text x="469.310344827586" y="263.48623853211" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--warn-text)">order_id | item</text>

  <text x="469.310344827586" y="322.018348623853" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--warn-text)">1NF: atomic columns</text>
  <text x="469.310344827586" y="348.623853211009" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--warn-text)">No multi-valued cells</text>

  <text x="469.310344827586" y="391.192660550459" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--warn-text)">2NF: no partial dependency</text>
  <text x="469.310344827586" y="417.798165137615" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--warn-text)">Non-key cols depend on full key</text>

  <text x="469.310344827586" y="476.330275229358" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--warn-text)">Customer still repeated per order</text>

  <rect x="857.241379310345" y="87.889908256881" width="382.758620689655" height="532.110091743119" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.083414753828" font-weight="bold" fill="var(--ok-text)">After 3NF</text>
  <text x="877.931034482759" y="162.385321100917" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--ok-text)">customers</text>
  <text x="877.931034482759" y="188.990825688073" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--ok-text)">id | name</text>

  <text x="877.931034482759" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--ok-text)">orders</text>
  <text x="877.931034482759" y="263.48623853211" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--ok-text)">id | customer_id</text>

  <text x="877.931034482759" y="311.376146788991" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--ok-text)">order_items</text>
  <text x="877.931034482759" y="337.981651376147" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--ok-text)">order_id | item</text>

  <text x="877.931034482759" y="391.192660550459" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--ok-text)">3NF: no transitive deps</text>
  <text x="877.931034482759" y="417.798165137615" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--ok-text)">Non-key col -&gt; non-key col</text>
  <text x="877.931034482759" y="439.082568807339" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--ok-text)">means break it out</text>

  <text x="877.931034482759" y="486.97247706422" font-family="Arial, sans-serif" font-size="12.590953502088" font-weight="bold" fill="var(--ok-text)">Now: update once, propagated</text>
</svg>

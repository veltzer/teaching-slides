<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Storage Layouts</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Heap Tables</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Rows in arrival order</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Cheap appends</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Indexes are separate</text>
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">PostgreSQL default</text>
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Random row order</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Index Organized</text>
  <text x="365" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Rows live in B-tree leaves</text>
  <text x="365" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Lookup is one read</text>
  <text x="365" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">MySQL InnoDB style</text>
  <text x="365" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">PK choice matters more</text>
  <text x="365" y="310" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">Clustered key wins</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Columnar</text>
  <text x="670" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">One column per file</text>
  <text x="670" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Great compression</text>
  <text x="670" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Reads scan few columns</text>
  <text x="670" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Slow for point updates</text>
  <text x="670" y="310" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">Analytics workloads</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Partitioning</text>
  <text x="975" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Range or hash split</text>
  <text x="975" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Prune at planner</text>
  <text x="975" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Drop old partitions fast</text>
  <text x="975" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Cap per-table size</text>
  <text x="975" y="310" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">Time-series fit</text>
</svg>

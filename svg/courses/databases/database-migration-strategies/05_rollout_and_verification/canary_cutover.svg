  <path d="M 503.157894736842 153.928571428571 L 545.263157894737 153.928571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 755.789473684211 153.928571428571 L 797.894736842105 153.928571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

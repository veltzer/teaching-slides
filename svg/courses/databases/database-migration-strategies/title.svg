<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Database Migration Strategies</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <path d="M80,316 v84 a70,12 0 0 0 140,0 v-84 Z" fill="var(--primary-accent)"/>
  <ellipse cx="150" cy="316" rx="70" ry="12" fill="var(--primary-fill)"/>
  <text x="150" y="370" font-size="18" fill="var(--primary-text)">Source</text>
  <path d="M1060,316 v84 a70,12 0 0 0 140,0 v-84 Z" fill="var(--ok-fill)"/>
  <ellipse cx="1130" cy="316" rx="70" ry="12" fill="var(--ok-accent)"/>
  <text x="1130" y="370" font-size="18" fill="var(--ok-text)">Target</text>
  <line x1="228" y1="360" x2="1040" y2="360" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="1038,352 1052,360 1038,368" fill="var(--text-muted)"/>
  <circle cx="290" cy="360" r="15" fill="var(--primary-fill)"/>
  <text x="290" y="410" font-size="17" fill="var(--surface)">Expand</text>
  <circle cx="430" cy="360" r="15" fill="var(--info-fill)"/>
  <text x="430" y="410" font-size="17" fill="var(--surface)">Dual Write</text>
  <circle cx="570" cy="360" r="15" fill="var(--warn-fill)"/>
  <text x="570" y="410" font-size="17" fill="var(--surface)">Backfill</text>
  <circle cx="710" cy="360" r="15" fill="var(--ok-fill)"/>
  <text x="710" y="410" font-size="17" fill="var(--surface)">Verify</text>
  <circle cx="850" cy="360" r="15" fill="var(--danger-fill)"/>
  <text x="850" y="410" font-size="17" fill="var(--surface)">Cutover</text>
  <circle cx="990" cy="360" r="15" fill="var(--primary-accent)"/>
  <text x="990" y="410" font-size="17" fill="var(--surface)">Contract</text>
  <path d="M850,336 Q570,230 302,332" fill="none" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8 6"/>
  <polygon points="296,320 294,338 310,330" fill="var(--danger-border)"/>
  <text x="570" y="270" font-size="16" fill="var(--text-faint)">rollback plan</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">schema migrations • data migrations • engine migrations • rollout &amp; verification</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.339509388906" font-weight="bold" fill="var(--text)">Online Schema Change Phases</text>

  <rect x="40" y="106.923076923077" width="231.578947368421" height="133.846153846154" rx="10.835539067466" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.789473684211" y="145.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.336862507946" font-weight="bold" fill="var(--info-text)">1. Add column</text>
  <text x="155.789473684211" y="179.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.086200787706" fill="var(--info-text)">nullable, default null</text>
  <text x="155.789473684211" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.086200787706" fill="var(--info-text)">app keeps working</text>

  <rect x="292.631578947368" y="106.923076923077" width="231.578947368421" height="133.846153846154" rx="10.835539067466" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="408.421052631579" y="145.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.336862507946" font-weight="bold" fill="var(--warn-text)">2. Backfill</text>
  <text x="408.421052631579" y="179.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.086200787706" fill="var(--warn-text)">populate in batches</text>
  <text x="408.421052631579" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.086200787706" fill="var(--warn-text)">throttled, resumable</text>

  <rect x="545.263157894737" y="106.923076923077" width="231.578947368421" height="133.846153846154" rx="10.835539067466" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="661.052631578947" y="145.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.336862507946" font-weight="bold" fill="var(--warn-text)">3. App writes both</text>
  <text x="661.052631578947" y="179.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.086200787706" fill="var(--warn-text)">old and new column</text>
  <text x="661.052631578947" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.086200787706" fill="var(--warn-text)">verify equality</text>

  <rect x="797.894736842105" y="106.923076923077" width="231.578947368421" height="133.846153846154" rx="10.835539067466" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="913.684210526316" y="145.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.336862507946" font-weight="bold" fill="var(--primary-text)">4. Switch reads</text>
  <text x="913.684210526316" y="179.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.086200787706" fill="var(--primary-text)">app reads new only</text>
  <text x="913.684210526316" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.086200787706" fill="var(--primary-text)">old still written</text>

  <rect x="1050.526315789474" y="106.923076923077" width="189.473684210526" height="133.846153846154" rx="10.835539067466" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.263157894737" y="145.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.336862507946" font-weight="bold" fill="var(--ok-text)">5. Drop old</text>
  <text x="1145.263157894737" y="179.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.086200787706" fill="var(--ok-text)">stop writing old</text>
  <text x="1145.263157894737" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.086200787706" fill="var(--ok-text)">drop column</text>

  <path d="M 271.578947368421 173.846153846154 L 292.631578947368 173.846153846154" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 524.210526315789 173.846153846154 L 545.263157894737 173.846153846154" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 776.842105263158 173.846153846154 L 797.894736842105 173.846153846154" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1029.473684210526 173.846153846154 L 1050.526315789474 173.846153846154" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="330" width="1178.947368421052" height="223.076923076923" rx="10.835539067466" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="629.473684210526" y="363.461538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.50397032144" font-weight="bold" fill="var(--text)">Each step is reversible</text>
  <text x="61.052631578947" y="402.5" font-family="Arial, sans-serif" font-size="15.169754694453" fill="var(--text)">No locking — table stays available throughout</text>
  <text x="61.052631578947" y="435.961538461539" font-family="Arial, sans-serif" font-size="15.169754694453" fill="var(--text)">Backfill watches replication lag, throttles automatically</text>
  <text x="61.052631578947" y="469.423076923077" font-family="Arial, sans-serif" font-size="15.169754694453" fill="var(--text)">Reconciliation runs continuously</text>
  <text x="61.052631578947" y="506.230769230769" font-family="Arial, sans-serif" font-size="15.169754694453" font-weight="bold" fill="var(--ok-accent)">Tools: built-in online DDL, ghost-style migration helpers</text>
  <text x="61.052631578947" y="536.346153846154" font-family="Arial, sans-serif" font-size="14.086200787706" font-weight="bold" fill="var(--danger-accent)">Anti-pattern: ADD COLUMN with default on huge table</text>

  <text x="629.473684210526" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.169754694453" font-weight="bold" fill="var(--text)">Hours to days for big tables — plan accordingly</text>
</svg>

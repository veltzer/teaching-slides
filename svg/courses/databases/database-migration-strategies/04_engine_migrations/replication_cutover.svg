<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Engine Migration via Replication</text>

  <rect x="40" y="102.142857142857" width="257.142857142857" height="103.571428571429" rx="10.534200859823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.571428571429" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--info-text)">Source engine</text>
  <text x="168.571428571429" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">primary writes</text>
  <text x="168.571428571429" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">app reads here</text>

  <rect x="361.428571428571" y="102.142857142857" width="257.142857142857" height="103.571428571429" rx="10.534200859823" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--warn-text)">Migration tool</text>
  <text x="490" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">snapshot + CDC</text>
  <text x="490" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">schema translate</text>

  <rect x="682.857142857143" y="102.142857142857" width="257.142857142857" height="103.571428571429" rx="10.534200859823" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="811.428571428571" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--ok-text)">Target engine</text>
  <text x="811.428571428571" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">catching up</text>
  <text x="811.428571428571" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">read-only initially</text>

  <rect x="1004.285714285714" y="102.142857142857" width="235.714285714286" height="103.571428571429" rx="10.534200859823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.142857142857" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--primary-text)">Application</text>
  <text x="1122.142857142857" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">reads &amp; writes</text>
  <text x="1122.142857142857" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">flag-driven routing</text>

  <path d="M 297.142857142857 153.928571428571 L 361.428571428571 153.928571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 618.571428571429 153.928571428571 L 682.857142857143 153.928571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 168.571428571429 205.714285714286 Q 168.571428571429 247.142857142857 1122.142857142857 205.714285714286" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="278.214285714286" width="578.571428571429" height="165.714285714286" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="329.285714285714" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Phases</text>
  <text x="61.428571428571" y="340.357142857143" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">1. Snapshot full export from source</text>
  <text x="61.428571428571" y="366.25" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">2. CDC replays ongoing changes</text>
  <text x="61.428571428571" y="392.142857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">3. Shadow reads validate target</text>
  <text x="61.428571428571" y="418.035714285714" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">4. Cutover: short freeze, flip flag</text>

  <rect x="661.428571428571" y="278.214285714286" width="578.571428571429" height="165.714285714286" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.714285714286" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Watch out for</text>
  <text x="682.857142857143" y="340.357142857143" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">SQL dialect differences</text>
  <text x="682.857142857143" y="366.25" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Collation and time zone bugs</text>
  <text x="682.857142857143" y="392.142857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Missing functions in target</text>
  <text x="682.857142857143" y="418.035714285714" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--danger-accent)">Test early, test often</text>

  <rect x="40" y="475" width="1200" height="145" rx="10.534200859823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="506.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--primary-text)">Rollback plan keeps source warm</text>
  <text x="640" y="535.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--primary-text)">Reverse replication — target writes back to source</text>
  <text x="640" y="563.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--primary-text)">Time-bounded rollback window</text>
  <text x="640" y="594.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--primary-text)">Decommission only after weeks of stability</text>
</svg>

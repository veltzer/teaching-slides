  <rect x="297" y="370" width="50" height="50" rx="6" fill="var(--warn-fill)"/>
  <text x="322" y="402" font-size="18" fill="var(--warn-text)">C</text>
  <rect x="361" y="370" width="50" height="50" rx="6" fill="var(--info-fill)"/>
  <text x="386" y="402" font-size="18" fill="var(--info-text)">D</text>
  <rect x="519" y="370" width="50" height="50" rx="6" fill="var(--primary-fill)"/>
  <text x="544" y="402" font-size="18" fill="var(--primary-text)">A</text>
  <rect x="583" y="370" width="50" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--surface)" stroke-width="3"/>
  <text x="608" y="402" font-size="18" fill="var(--ok-text)">B</text>
  <rect x="647" y="370" width="50" height="50" rx="6" fill="var(--warn-fill)"/>
  <text x="672" y="402" font-size="18" fill="var(--warn-text)">C</text>
  <rect x="711" y="370" width="50" height="50" rx="6" fill="var(--info-fill)" stroke="var(--surface)" stroke-width="3"/>
  <text x="736" y="402" font-size="18" fill="var(--info-text)">D</text>
  <rect x="869" y="370" width="50" height="50" rx="6" fill="var(--primary-fill)"/>
  <text x="894" y="402" font-size="18" fill="var(--primary-text)">A</text>
  <rect x="933" y="370" width="50" height="50" rx="6" fill="var(--ok-fill)"/>
  <text x="958" y="402" font-size="18" fill="var(--ok-text)">B</text>
  <rect x="997" y="370" width="50" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--surface)" stroke-width="3"/>
  <text x="1022" y="402" font-size="18" fill="var(--warn-text)">C</text>
  <rect x="1061" y="370" width="50" height="50" rx="6" fill="var(--info-fill)"/>
  <text x="1086" y="402" font-size="18" fill="var(--info-text)">D</text>
  <line x1="430" y1="395" x2="500" y2="395" stroke="var(--text-muted)" stroke-width="3" stroke-dasharray="6,5"/>
  <text x="465" y="384" font-size="15" fill="var(--text-faint)">Raft</text>
  <line x1="780" y1="395" x2="850" y2="395" stroke="var(--text-muted)" stroke-width="3" stroke-dasharray="6,5"/>
  <text x="815" y="384" font-size="15" fill="var(--text-faint)">Raft</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">distributed SQL • schema &amp; indexes • serializable transactions • multi-region • operations</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>

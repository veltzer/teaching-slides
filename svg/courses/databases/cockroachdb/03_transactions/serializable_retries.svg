<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Serializable Isolation and Retries</text>

  <rect x="40" y="102.142857142857" width="578.571428571429" height="227.857142857143" rx="10.534200859823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.068401719647" font-weight="bold" fill="var(--info-text)">Why serializable</text>
  <text x="61.428571428571" y="179.821428571429" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--info-text)">Strongest standard SQL level</text>
  <text x="61.428571428571" y="205.714285714286" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--info-text)">No phantoms, no write skew</text>
  <text x="61.428571428571" y="231.607142857143" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--info-text)">App reasons simply</text>
  <text x="61.428571428571" y="267.857142857143" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">Cost: more conflicts → retries</text>
  <text x="61.428571428571" y="298.928571428571" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">Optimistic concurrency control</text>

  <rect x="661.428571428571" y="102.142857142857" width="578.571428571429" height="227.857142857143" rx="10.534200859823" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.068401719647" font-weight="bold" fill="var(--warn-text)">Retry handling</text>
  <text x="682.857142857143" y="179.821428571429" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--warn-text)">App catches retry error</text>
  <text x="682.857142857143" y="205.714285714286" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--warn-text)">Re-issue from start</text>
  <text x="682.857142857143" y="231.607142857143" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--warn-text)">Driver helpers wrap this</text>
  <text x="682.857142857143" y="267.857142857143" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--warn-text)">Make statements idempotent</text>
  <text x="682.857142857143" y="298.928571428571" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">Cap retries to avoid loops</text>

  <rect x="40" y="371.428571428571" width="1200" height="248.571428571429" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Reduce conflicts</text>
  <text x="61.428571428571" y="438.75" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text)">Smaller transactions hold fewer locks</text>
  <text x="61.428571428571" y="469.821428571429" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text)">SELECT FOR UPDATE pre-locks rows</text>
  <text x="61.428571428571" y="500.892857142857" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text)">Avoid hot rows — aggregate, batch, shard</text>
  <text x="61.428571428571" y="537.142857142857" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--ok-accent)">Bounded staleness reads bypass conflicts</text>
  <text x="61.428571428571" y="568.214285714286" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">AS OF SYSTEM TIME for non-transactional reads</text>
  <text x="61.428571428571" y="599.285714285714" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--danger-accent)">Anti-pattern: long-running transactions</text>
</svg>

  <rect x="1033.103448275862" y="321.869158878505" width="82.758620689655" height="65.046728971963" rx="8.472054115418" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.48275862069" y="348.971962616822" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.767087937555" font-weight="bold" fill="var(--ok-text)">N4</text>
  <text x="1074.48275862069" y="370.654205607477" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.6490744087" fill="var(--ok-text)">follower</text>

  <rect x="1136.551724137931" y="321.869158878505" width="82.758620689655" height="65.046728971963" rx="8.472054115418" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1177.931034482759" y="348.971962616822" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.767087937555" font-weight="bold" fill="var(--primary-text)">N5</text>

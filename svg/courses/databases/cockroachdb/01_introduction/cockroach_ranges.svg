  <path d="M 205.51724137931 256.822429906542 L 205.51724137931 321.869158878505" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 640 256.822429906542 L 640 321.869158878505" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 1074.48275862069 256.822429906542 L 1074.48275862069 321.869158878505" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="40" y="441.121495327103" width="1200" height="108.411214953271" rx="10.590067644273" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="473.644859813084" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.944108230837" font-weight="bold" fill="var(--text)">Each range = its own Raft consensus group</text>
  <text x="640" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.826094701982" fill="var(--text-muted)">Writes need majority ack → strong consistency, survives minority loss</text>
  <text x="640" y="527.85046728972" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.826094701982" fill="var(--text-muted)">Ranges split when too large (~512MB), rebalance automatically</text>

  <text x="640" y="592.897196261682" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.826094701982" font-weight="bold" fill="var(--text)">Leaders distributed across nodes — no single hot node by default</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.767087937555" fill="var(--text-muted)">Follower reads + bounded staleness for low-latency reads in any region</text>
</svg>

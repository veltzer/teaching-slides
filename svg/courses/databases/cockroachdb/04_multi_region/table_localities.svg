<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.982753492379" font-weight="bold" fill="var(--text)">Multi-Region Table Localities</text>

  <rect x="40" y="102.142857142857" width="393.103448275862" height="248.571428571429" rx="10.350983390135" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="236.551724137931" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631770102244" font-weight="bold" fill="var(--info-text)">Regional by row</text>
  <text x="60.689655172414" y="179.821428571429" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">Each row pinned to a region</text>
  <text x="60.689655172414" y="205.714285714286" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">user.region = "EU" → EU nodes</text>
  <text x="60.689655172414" y="231.607142857143" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">Local reads &amp; writes</text>
  <text x="60.689655172414" y="257.5" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">Cross-region rare</text>
  <text x="236.551724137931" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--ok-accent)">User-owned data</text>

  <rect x="443.448275862069" y="102.142857142857" width="393.103448275862" height="248.571428571429" rx="10.350983390135" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631770102244" font-weight="bold" fill="var(--warn-text)">Regional by table</text>
  <text x="464.137931034483" y="179.821428571429" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--warn-text)">Whole table pinned</text>
  <text x="464.137931034483" y="205.714285714286" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--warn-text)">All rows live in one region</text>
  <text x="464.137931034483" y="231.607142857143" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--warn-text)">Reads outside slower</text>
  <text x="464.137931034483" y="257.5" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--warn-text)">Simple to reason about</text>
  <text x="640" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--ok-accent)">Region-specific data</text>

  <rect x="846.896551724138" y="102.142857142857" width="393.103448275862" height="248.571428571429" rx="10.350983390135" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1043.448275862069" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631770102244" font-weight="bold" fill="var(--primary-text)">Global</text>
  <text x="867.586206896552" y="179.821428571429" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--primary-text)">Reads everywhere fast</text>
  <text x="867.586206896552" y="205.714285714286" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--primary-text)">Bounded staleness</text>
  <text x="867.586206896552" y="231.607142857143" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--primary-text)">Writes coordinate</text>
  <text x="867.586206896552" y="257.5" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--primary-text)">Higher write latency</text>
  <text x="1043.448275862069" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--ok-accent)">Reference data</text>

  <rect x="40" y="392.142857142857" width="1200" height="227.857142857143" rx="10.350983390135" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="423.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631770102244" font-weight="bold" fill="var(--text)">Picking per table</text>
  <text x="81.379310344828" y="459.464285714286" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text)">users (regional by row): each user pinned to home region</text>
  <text x="81.379310344828" y="490.535714285714" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text)">orders (regional by row): same as user</text>
  <text x="81.379310344828" y="521.607142857143" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text)">audit_logs (regional by table): pinned to compliance region</text>
  <text x="81.379310344828" y="552.678571428572" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text)">products (global): catalog read everywhere</text>
  <text x="81.379310344828" y="588.928571428572" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--ok-accent)">Mix per table — most schemas need all three</text>
</svg>

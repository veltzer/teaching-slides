<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Cassandra</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <circle cx="640" cy="335" r="105" fill="none" stroke="var(--text-muted)" stroke-width="3"/>
  <line x1="549" y1="283" x2="640" y2="230" stroke="var(--ok-fill)" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="549" y1="283" x2="731" y2="283" stroke="var(--ok-fill)" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="549" y1="283" x2="731" y2="388" stroke="var(--ok-fill)" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="640" cy="230" r="24" fill="var(--ok-fill)"/>
  <circle cx="731" cy="283" r="24" fill="var(--ok-fill)"/>
  <circle cx="731" cy="388" r="24" fill="var(--ok-fill)"/>
  <circle cx="640" cy="440" r="24" fill="var(--primary-fill)"/>
  <circle cx="549" cy="388" r="24" fill="var(--primary-fill)"/>
  <circle cx="549" cy="283" r="24" fill="var(--warn-fill)"/>
  <text x="640" y="405" font-size="15" fill="var(--text-faint)">token ring</text>
  <rect x="210" y="259" width="170" height="48" rx="8" fill="var(--info-fill)"/>
  <text x="295" y="289" font-size="18" fill="var(--info-text)">Client</text>
  <line x1="380" y1="283" x2="511" y2="283" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="-10,-7 10,0 -10,7" fill="var(--text-muted)" transform="translate(515,283)"/>
  <text x="446" y="271" font-size="15" fill="var(--text-faint)">write</text>
  <circle cx="872" cy="270" r="12" fill="var(--warn-fill)"/>
  <text x="896" y="276" font-size="18" text-anchor="start" fill="var(--surface)">coordinator</text>
  <circle cx="872" cy="320" r="12" fill="var(--ok-fill)"/>
  <text x="896" y="326" font-size="18" text-anchor="start" fill="var(--surface)">replicas (RF = 3)</text>
  <circle cx="872" cy="370" r="12" fill="var(--primary-fill)"/>
  <text x="896" y="376" font-size="18" text-anchor="start" fill="var(--surface)">other nodes</text>
  <text x="860" y="420" font-size="16" text-anchor="start" fill="var(--text-faint)">no master, every node equal</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">query-first data modeling • consistency levels • replication • compaction • repair • operations</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

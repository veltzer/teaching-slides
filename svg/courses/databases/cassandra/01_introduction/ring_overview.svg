<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.03701420285" font-weight="bold" fill="var(--text)">Cassandra Architecture Overview</text>

  <rect x="40" y="104.444444444444" width="578.571428571429" height="236.296296296296" rx="10.727505072446" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="142.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309509130404" font-weight="bold" fill="var(--info-text)">Peer-to-peer ring</text>
  <text x="61.428571428571" y="185" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--info-text)">Every node equal — no master</text>
  <text x="61.428571428571" y="211.851851851852" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--info-text)">Coordinator role chosen per request</text>
  <text x="61.428571428571" y="238.703703703704" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--info-text)">Token-based partitioning</text>
  <text x="61.428571428571" y="265.555555555556" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--info-text)">Replicas spread across racks/DCs</text>
  <text x="61.428571428571" y="292.407407407407" font-family="Arial, sans-serif" font-size="15.018507101425" font-weight="bold" fill="var(--ok-accent)">Survives node loss seamlessly</text>

  <rect x="661.428571428571" y="104.444444444444" width="578.571428571429" height="236.296296296296" rx="10.727505072446" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="142.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309509130404" font-weight="bold" fill="var(--warn-text)">Tunable consistency</text>
  <text x="682.857142857143" y="185" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--warn-text)">Per query: ONE / QUORUM / ALL</text>
  <text x="682.857142857143" y="211.851851851852" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--warn-text)">R + W &gt; N → strong reads</text>
  <text x="682.857142857143" y="238.703703703704" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--warn-text)">Eventual by default</text>
  <text x="682.857142857143" y="265.555555555556" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--warn-text)">App chooses cost vs safety</text>
  <text x="682.857142857143" y="292.407407407407" font-family="Arial, sans-serif" font-size="15.018507101425" font-weight="bold" fill="var(--ok-accent)">AP system, tunable toward CP</text>

  <rect x="40" y="383.703703703704" width="578.571428571429" height="236.296296296296" rx="10.727505072446" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="421.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309509130404" font-weight="bold" fill="var(--primary-text)">Strengths</text>
  <text x="61.428571428571" y="458.888888888889" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--primary-text)">Massive write throughput</text>
  <text x="61.428571428571" y="485.740740740741" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--primary-text)">Multi-region active-active</text>
  <text x="61.428571428571" y="512.592592592593" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--primary-text)">Linear scale by adding nodes</text>
  <text x="61.428571428571" y="539.444444444444" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--primary-text)">Always-on for tier-1 systems</text>
  <text x="61.428571428571" y="571.666666666667" font-family="Arial, sans-serif" font-size="15.018507101425" font-weight="bold" fill="var(--ok-accent)">Time-series, event data, IoT</text>

  <rect x="661.428571428571" y="383.703703703704" width="578.571428571429" height="236.296296296296" rx="10.727505072446" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="421.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309509130404" font-weight="bold" fill="var(--danger-text)">Limitations</text>
  <text x="682.857142857143" y="458.888888888889" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--danger-text)">No joins, no foreign keys</text>
  <text x="682.857142857143" y="485.740740740741" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--danger-text)">No ad-hoc queries</text>
  <text x="682.857142857143" y="512.592592592593" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--danger-text)">Query-first design required</text>
  <text x="682.857142857143" y="539.444444444444" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--danger-text)">Tombstones can hurt reads</text>
</svg>

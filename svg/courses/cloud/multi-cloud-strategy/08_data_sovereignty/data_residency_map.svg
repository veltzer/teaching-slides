<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- EU Region -->
  <rect x="40" y="40" width="360" height="440" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="360" height="55" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="40" y="80" width="360" height="15" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="220" y="76" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--bg)" text-anchor="middle">European Union</text>
  <!-- EU regulations -->
  <rect x="70" y="115" width="300" height="40" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="220" y="141" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">GDPR</text>
  <text x="220" y="180" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Strict data protection rules</text>
  <text x="220" y="202" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Right to erasure, portability</text>
  <text x="220" y="224" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">DPO required</text>
  <!-- Data icon -->
  <rect x="140" y="250" width="160" height="70" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="220" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">EU Customer Data</text>
  <text x="220" y="305" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Must stay in EU regions</text>
  <!-- Cloud regions available -->
  <text x="220" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)" text-anchor="middle">Available Regions:</text>
  <text x="220" y="380" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">AWS eu-west-1, eu-central-1</text>
  <text x="220" y="400" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Azure West Europe, North EU</text>
  <text x="220" y="420" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">GCP europe-west1, europe-west4</text>
  <text x="220" y="460" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Max fine: 4% global revenue</text>
  <!-- US Region -->
  <rect x="460" y="40" width="360" height="440" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="460" y="40" width="360" height="55" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="460" y="80" width="360" height="15" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="76" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--bg)" text-anchor="middle">United States</text>
  <rect x="490" y="115" width="140" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="560" y="141" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">HIPAA</text>
  <rect x="650" y="115" width="140" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="720" y="141" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">SOC 2</text>
  <text x="640" y="180" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Industry-specific regulations</text>
  <text x="640" y="202" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">FedRAMP for government</text>
  <text x="640" y="224" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">State-level laws (CCPA)</text>
  <rect x="560" y="250" width="160" height="70" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">US Health/Finance</text>
  <text x="640" y="305" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Sector-specific rules</text>
  <text x="640" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)" text-anchor="middle">Available Regions:</text>
  <text x="640" y="380" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">AWS us-east-1, us-west-2</text>
  <text x="640" y="400" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Azure East US, West US</text>
  <text x="640" y="420" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">GCP us-central1, us-east1</text>
  <text x="640" y="460" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">GovCloud for sensitive workloads</text>
  <!-- Asia Region -->
  <rect x="880" y="40" width="360" height="440" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="880" y="40" width="360" height="55" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="880" y="80" width="360" height="15" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1060" y="76" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--bg)" text-anchor="middle">Asia-Pacific</text>
  <rect x="910" y="115" width="300" height="40" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1060" y="141" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Various Regulations</text>
  <text x="1060" y="180" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">China: data must stay local</text>
  <text x="1060" y="202" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Japan: APPI (privacy act)</text>
  <text x="1060" y="224" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Australia: Privacy Act 1988</text>
  <rect x="980" y="250" width="160" height="70" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1060" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">APAC Data</text>
  <text x="1060" y="305" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Country-specific rules</text>
  <text x="1060" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)" text-anchor="middle">Available Regions:</text>
  <text x="1060" y="380" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">AWS ap-northeast-1, ap-southeast</text>
  <text x="1060" y="400" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Azure Japan, Southeast Asia</text>
  <text x="1060" y="420" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">GCP asia-east1, asia-northeast1</text>
  <text x="1060" y="460" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">China requires separate cloud</text>
  <!-- Blocked arrows between regions -->
  <line x1="400" y1="285" x2="460" y2="285" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="430" y="275" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-accent)" text-anchor="middle">X</text>
  <line x1="820" y1="285" x2="880" y2="285" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="850" y="275" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-accent)" text-anchor="middle">X</text>
  <!-- Bottom note -->
  <rect x="200" y="510" width="880" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="540" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)" text-anchor="middle">Data cannot freely cross regulatory boundaries</text>
  <text x="640" y="565" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)" text-anchor="middle">Multi-cloud enables compliance by using the right provider per region</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- EU Region -->
  <rect x="40" y="40" width="360" height="472.592593" rx="6.746192" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="360" height="59.074133" rx="6.746192" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="82.962963" width="360" height="16.11117" fill="url(#grad-danger)" rx="6.746192" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="78.666667" font-family="Arial, sans-serif" font-size="24.872986" font-weight="bold" fill="var(--bg)" text-anchor="middle">European Union</text>
  <!-- EU regulations -->
  <rect x="70" y="120.555615" width="300" height="42.962963" rx="6.746192" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="148.481422" font-family="Arial, sans-serif" font-size="18.654796" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">GDPR</text>
  <text x="220" y="190.37037" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)" text-anchor="middle">Strict data protection rules</text>
  <text x="220" y="214" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)" text-anchor="middle">Right to erasure, portability</text>
  <text x="220" y="237.62963" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)" text-anchor="middle">DPO required</text>
  <!-- Data icon -->
  <rect x="140" y="265.555556" width="160" height="75.185185" rx="6.746192" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="220" y="297.777778" font-family="Arial, sans-serif" font-size="14.509261" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">EU Customer Data</text>
  <text x="220" y="324.62957" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)" text-anchor="middle">Must stay in EU regions</text>
  <!-- Cloud regions available -->
  <text x="220" y="378.333393" font-family="Arial, sans-serif" font-size="14.509261" font-weight="bold" fill="var(--text)" text-anchor="middle">Available Regions:</text>
  <text x="220" y="405.185185" font-family="Arial, sans-serif" font-size="13.472933" fill="var(--text-faint)" text-anchor="middle">AWS eu-west-1, eu-central-1</text>
  <text x="220" y="426.666667" font-family="Arial, sans-serif" font-size="13.472933" fill="var(--text-faint)" text-anchor="middle">Azure West Europe, North EU</text>
  <text x="220" y="448.148148" font-family="Arial, sans-serif" font-size="13.472933" fill="var(--text-faint)" text-anchor="middle">GCP europe-west1, europe-west4</text>
  <text x="220" y="491.111111" font-family="Arial, sans-serif" font-size="13.472933" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Max fine: 4% global revenue</text>
  <!-- US Region -->
  <rect x="460" y="40" width="360" height="472.592593" rx="6.746192" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="460" y="40" width="360" height="59.074133" rx="6.746192" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="460" y="82.962963" width="360" height="16.11117" fill="url(#grad-primary)" rx="6.746192" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="78.666667" font-family="Arial, sans-serif" font-size="24.872986" font-weight="bold" fill="var(--bg)" text-anchor="middle">United States</text>
  <rect x="490" y="120.555615" width="140" height="42.962963" rx="6.746192" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="148.481422" font-family="Arial, sans-serif" font-size="16.582028" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">HIPAA</text>
  <rect x="650" y="120.555615" width="140" height="42.962963" rx="6.746192" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="148.481422" font-family="Arial, sans-serif" font-size="16.582028" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">SOC 2</text>
  <text x="640" y="190.37037" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)" text-anchor="middle">Industry-specific regulations</text>
  <text x="640" y="214" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)" text-anchor="middle">FedRAMP for government</text>
  <text x="640" y="237.62963" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)" text-anchor="middle">State-level laws (CCPA)</text>
  <rect x="560" y="265.555556" width="160" height="75.185185" rx="6.746192" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="297.777778" font-family="Arial, sans-serif" font-size="14.509261" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">US Health/Finance</text>
  <text x="640" y="324.62957" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)" text-anchor="middle">Sector-specific rules</text>
  <text x="640" y="378.333393" font-family="Arial, sans-serif" font-size="14.509261" font-weight="bold" fill="var(--text)" text-anchor="middle">Available Regions:</text>
  <text x="640" y="405.185185" font-family="Arial, sans-serif" font-size="13.472933" fill="var(--text-faint)" text-anchor="middle">AWS us-east-1, us-west-2</text>
  <text x="640" y="426.666667" font-family="Arial, sans-serif" font-size="13.472933" fill="var(--text-faint)" text-anchor="middle">Azure East US, West US</text>
  <text x="640" y="448.148148" font-family="Arial, sans-serif" font-size="13.472933" fill="var(--text-faint)" text-anchor="middle">GCP us-central1, us-east1</text>
  <text x="640" y="491.111111" font-family="Arial, sans-serif" font-size="13.472933" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">GovCloud for sensitive workloads</text>
  <!-- Asia Region -->
  <rect x="880" y="40" width="360" height="472.592593" rx="6.746192" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="880" y="40" width="360" height="59.074133" rx="6.746192" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="880" y="82.962963" width="360" height="16.11117" fill="url(#grad-warn)" rx="6.746192" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="78.666667" font-family="Arial, sans-serif" font-size="24.872986" font-weight="bold" fill="var(--bg)" text-anchor="middle">Asia-Pacific</text>
  <rect x="910" y="120.555615" width="300" height="42.962963" rx="6.746192" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="148.481422" font-family="Arial, sans-serif" font-size="16.582028" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Various Regulations</text>
  <text x="1060" y="190.37037" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)" text-anchor="middle">China: data must stay local</text>
  <text x="1060" y="214" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)" text-anchor="middle">Japan: APPI (privacy act)</text>
  <text x="1060" y="237.62963" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)" text-anchor="middle">Australia: Privacy Act 1988</text>
  <rect x="980" y="265.555556" width="160" height="75.185185" rx="6.746192" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1060" y="297.777778" font-family="Arial, sans-serif" font-size="14.509261" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">APAC Data</text>
  <text x="1060" y="324.62957" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)" text-anchor="middle">Country-specific rules</text>
  <text x="1060" y="378.333393" font-family="Arial, sans-serif" font-size="14.509261" font-weight="bold" fill="var(--text)" text-anchor="middle">Available Regions:</text>
  <text x="1060" y="405.185185" font-family="Arial, sans-serif" font-size="13.472933" fill="var(--text-faint)" text-anchor="middle">AWS ap-northeast-1, ap-southeast</text>
  <text x="1060" y="426.666667" font-family="Arial, sans-serif" font-size="13.472933" fill="var(--text-faint)" text-anchor="middle">Azure Japan, Southeast Asia</text>
  <text x="1060" y="448.148148" font-family="Arial, sans-serif" font-size="13.472933" fill="var(--text-faint)" text-anchor="middle">GCP asia-east1, asia-northeast1</text>
  <text x="1060" y="491.111111" font-family="Arial, sans-serif" font-size="13.472933" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">China requires separate cloud</text>
  <!-- Blocked arrows between regions -->
  <line x1="400" y1="303.148089" x2="460" y2="303.148089" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="430" y="292.407467" font-family="Arial, sans-serif" font-size="20.727564" fill="var(--danger-accent)" text-anchor="middle">X</text>
  <line x1="820" y1="303.148089" x2="880" y2="303.148089" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="850" y="292.407467" font-family="Arial, sans-serif" font-size="20.727564" fill="var(--danger-accent)" text-anchor="middle">X</text>
  <!-- Bottom note -->
  <rect x="200" y="544.814815" width="880" height="75.185185" rx="6.746192" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="577.037037" font-family="Arial, sans-serif" font-size="18.654796" font-weight="bold" fill="var(--text)" text-anchor="middle">Data cannot freely cross regulatory boundaries</text>
  <text x="640" y="603.88883" font-family="Arial, sans-serif" font-size="15.545588" fill="var(--text-muted)" text-anchor="middle">Multi-cloud enables compliance by using the right provider per region</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <!-- Cloud 1 (left) - primary -->
  <g opacity="0.7">
    <ellipse cx="280" cy="350" rx="120" ry="70" fill="var(--primary-fill)" opacity="0.25"/>
    <ellipse cx="240" cy="330" rx="70" ry="50" fill="var(--primary-fill)" opacity="0.3"/>
    <ellipse cx="320" cy="320" rx="65" ry="45" fill="var(--primary-fill)" opacity="0.3"/>
    <ellipse cx="280" cy="310" rx="55" ry="40" fill="var(--primary-fill)" opacity="0.35"/>
    <text x="280" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-fill)" opacity="0.8">AWS</text>
  </g>
  <!-- Cloud 2 (center) - warn -->
  <g opacity="0.7">
    <ellipse cx="640" cy="350" rx="120" ry="70" fill="var(--warn-fill)" opacity="0.25"/>
    <ellipse cx="600" cy="330" rx="70" ry="50" fill="var(--warn-fill)" opacity="0.3"/>
    <ellipse cx="680" cy="320" rx="65" ry="45" fill="var(--warn-fill)" opacity="0.3"/>
    <ellipse cx="640" cy="310" rx="55" ry="40" fill="var(--warn-fill)" opacity="0.35"/>
    <text x="640" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-fill)" opacity="0.8">Azure</text>
  </g>
  <!-- Cloud 3 (right) - ok -->
  <g opacity="0.7">
    <ellipse cx="1000" cy="350" rx="120" ry="70" fill="var(--ok-fill)" opacity="0.25"/>
    <ellipse cx="960" cy="330" rx="70" ry="50" fill="var(--ok-fill)" opacity="0.3"/>
    <ellipse cx="1040" cy="320" rx="65" ry="45" fill="var(--ok-fill)" opacity="0.3"/>
    <ellipse cx="1000" cy="310" rx="55" ry="40" fill="var(--ok-fill)" opacity="0.35"/>
    <text x="1000" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-fill)" opacity="0.8">GCP</text>
  </g>
  <!-- Connecting lines between clouds -->
  <line x1="400" y1="350" x2="520" y2="350" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" stroke-dasharray="8,4"/>
  <line x1="760" y1="350" x2="880" y2="350" stroke="var(--ok-border)" stroke-width="2" opacity="0.4" stroke-dasharray="8,4"/>
  <!-- Central orchestration node -->
  <circle cx="640" cy="500" r="30" fill="var(--info-fill)" opacity="0.3"/>
  <circle cx="640" cy="500" r="18" fill="var(--info-fill)" opacity="0.5"/>
  <text x="640" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" opacity="0.7">Orchestration</text>
  <!-- Lines from orchestration to clouds -->
  <line x1="620" y1="475" x2="320" y2="400" stroke="var(--primary-border)" stroke-width="1.5" opacity="0.3"/>
  <line x1="640" y1="470" x2="640" y2="420" stroke="var(--warn-border)" stroke-width="1.5" opacity="0.3"/>
  <line x1="660" y1="475" x2="960" y2="400" stroke="var(--ok-border)" stroke-width="1.5" opacity="0.3"/>
  <!-- Decorative dots -->
  <circle cx="150" cy="250" r="3" fill="var(--primary-fill)" opacity="0.3"/>
  <circle cx="1130" cy="270" r="4" fill="var(--ok-fill)" opacity="0.3"/>
  <circle cx="180" cy="530" r="3" fill="var(--warn-fill)" opacity="0.3"/>
  <circle cx="1100" cy="540" r="3" fill="var(--primary-fill)" opacity="0.3"/>
  <!-- Accent bar -->
  <rect x="415" y="590" width="450" height="4" rx="2" fill="var(--info-fill)" opacity="0.5"/>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Multi-Cloud Strategy</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Avoiding Vendor Lock-in</text>
</svg>

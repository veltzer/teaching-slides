<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- DNS Failover at top -->
  <rect x="400" y="20" width="480" height="70" rx="14" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="62" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">DNS Failover (Global Load Balancer)</text>
  <!-- Normal state arrow (solid to AWS) -->
  <line x1="540" y1="90" x2="250" y2="170" stroke="var(--primary)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="370" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">Normal: 100%</text>
  <!-- Failover arrow (dashed to GCP) -->
  <line x1="740" y1="90" x2="1030" y2="170" stroke="var(--danger)" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <text x="910" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger)">Failover: 100%</text>
  <!-- Primary: AWS (left) -->
  <rect x="40" y="170" width="440" height="420" rx="16" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="170" width="440" height="55" rx="16" fill="url(#grad-primary)"/>
  <rect x="40" y="211" width="440" height="14" fill="url(#grad-primary)"/>
  <text x="260" y="205" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS -- Primary</text>
  <!-- Active badge -->
  <rect x="100" y="240" width="120" height="30" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2"/>
  <text x="160" y="261" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">ACTIVE</text>
  <!-- AWS workloads -->
  <rect x="70" y="290" width="180" height="60" rx="8" fill="var(--bg)" stroke="var(--primary)" stroke-width="1"/>
  <text x="160" y="318" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">App Servers</text>
  <text x="160" y="338" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">EKS (3 replicas)</text>
  <rect x="270" y="290" width="180" height="60" rx="8" fill="var(--bg)" stroke="var(--primary)" stroke-width="1"/>
  <text x="360" y="318" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Database</text>
  <text x="360" y="338" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">RDS Multi-AZ</text>
  <rect x="70" y="370" width="380" height="50" rx="8" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="260" y="401" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-dk)" text-anchor="middle">Full production workload running</text>
  <!-- RPO/RTO -->
  <rect x="70" y="440" width="180" height="50" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="160" y="464" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">RPO: 5 min</text>
  <text x="160" y="482" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Async replication lag</text>
  <rect x="270" y="440" width="180" height="50" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="360" y="464" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">RTO: 15 min</text>
  <text x="360" y="482" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">DNS + scale up time</text>
  <!-- Failure indicator -->
  <rect x="70" y="510" width="380" height="40" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="260" y="536" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">On failure: traffic shifts to DR site</text>
  <!-- Data replication arrow between -->
  <line x1="480" y1="340" x2="800" y2="340" stroke="var(--warn)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="328" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Data Replication</text>
  <text x="640" y="365" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Async, every 5 min</text>
  <!-- DR: GCP (right) -->
  <rect x="800" y="170" width="440" height="420" rx="16" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="800" y="170" width="440" height="55" rx="16" fill="url(#grad-ok)"/>
  <rect x="800" y="211" width="440" height="14" fill="url(#grad-ok)"/>
  <text x="1020" y="205" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCP -- DR Site</text>
  <!-- Standby badge -->
  <rect x="860" y="240" width="120" height="30" rx="6" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="2"/>
  <text x="920" y="261" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">STANDBY</text>
  <!-- GCP workloads -->
  <rect x="830" y="290" width="180" height="60" rx="8" fill="var(--bg)" stroke="var(--ok)" stroke-width="1"/>
  <text x="920" y="318" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">App Servers</text>
  <text x="920" y="338" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">GKE (1 replica, warm)</text>
  <rect x="1030" y="290" width="180" height="60" rx="8" fill="var(--bg)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1120" y="318" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Database</text>
  <text x="1120" y="338" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Cloud SQL (replica)</text>
  <rect x="830" y="370" width="380" height="50" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1020" y="401" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-dk)" text-anchor="middle">Warm standby, scales up on failover</text>
  <!-- Failover actions -->
  <rect x="830" y="440" width="380" height="70" rx="8" fill="var(--bg)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1020" y="466" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">On Failover:</text>
  <text x="1020" y="488" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">1. Promote DB replica  2. Scale GKE to 3  3. DNS switch</text>
  <!-- Active after failover -->
  <rect x="830" y="525" width="380" height="40" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="1020" y="551" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Becomes ACTIVE on AWS failure</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- DNS Failover at top -->
  <rect x="400" y="40" width="480" height="71.22807" rx="6.566261" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="82.736842" font-family="Arial, sans-serif" font-size="22.192103" font-weight="bold" fill="var(--text)" text-anchor="middle">DNS Failover (Global Load Balancer)</text>
  <!-- Normal state arrow (solid to AWS) -->
  <line x1="540" y1="111.22807" x2="250" y2="192.631579" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="141.754386" font-family="Arial, sans-serif" font-size="14.122277" font-weight="bold" fill="var(--primary-accent)">Normal: 100%</text>
  <!-- Failover arrow (dashed to GCP) -->
  <line x1="740" y1="111.22807" x2="1030" y2="192.631579" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <text x="910" y="141.754386" font-family="Arial, sans-serif" font-size="14.122277" font-weight="bold" fill="var(--danger-accent)">Failover: 100%</text>
  <!-- Primary: AWS (left) -->
  <rect x="40" y="192.631579" width="440" height="427.368421" rx="6.566261" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="192.631579" width="440" height="55.964968" rx="6.566261" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="234.350933" width="440" height="14.245614" fill="var(--primary-fill)" rx="6.566261" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="228.245558" font-family="Arial, sans-serif" font-size="22.192103" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS -- Primary</text>
  <!-- Active badge -->
  <rect x="100" y="263.859649" width="120" height="30.526316" rx="6.566261" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="285.228014" font-family="Arial, sans-serif" font-size="15.130965" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">ACTIVE</text>
  <!-- AWS workloads -->
  <rect x="70" y="314.736842" width="180" height="61.052632" rx="6.566261" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="160" y="343.22807" font-family="Arial, sans-serif" font-size="14.122277" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">App Servers</text>
  <text x="160" y="363.578947" font-family="Arial, sans-serif" font-size="12.104794" fill="var(--text-faint)" text-anchor="middle">EKS (3 replicas)</text>
  <rect x="270" y="314.736842" width="180" height="61.052632" rx="6.566261" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="360" y="343.22807" font-family="Arial, sans-serif" font-size="14.122277" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Database</text>
  <text x="360" y="363.578947" font-family="Arial, sans-serif" font-size="12.104794" fill="var(--text-faint)" text-anchor="middle">RDS Multi-AZ</text>
  <rect x="70" y="396.140351" width="380" height="50.877193" rx="6.566261" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="427.684154" font-family="Arial, sans-serif" font-size="15.130965" fill="var(--primary-accent)" text-anchor="middle">Full production workload running</text>
  <!-- RPO/RTO -->
  <rect x="70" y="467.368421" width="180" height="50.877193" rx="6.566261" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="491.789474" font-family="Arial, sans-serif" font-size="14.122277" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">RPO: 5 min</text>
  <text x="160" y="510.105263" font-family="Arial, sans-serif" font-size="12.104794" fill="var(--text-faint)" text-anchor="middle">Async replication lag</text>
  <rect x="270" y="467.368421" width="180" height="50.877193" rx="6.566261" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="491.789474" font-family="Arial, sans-serif" font-size="14.122277" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">RTO: 15 min</text>
  <text x="360" y="510.105263" font-family="Arial, sans-serif" font-size="12.104794" fill="var(--text-faint)" text-anchor="middle">DNS + scale up time</text>
  <!-- Failure indicator -->
  <rect x="70" y="538.596491" width="380" height="40.701754" rx="6.566261" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="260" y="565.052632" font-family="Arial, sans-serif" font-size="15.130965" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">On failure: traffic shifts to DR site</text>
  <!-- Data replication arrow between -->
  <line x1="480" y1="365.614035" x2="800" y2="365.614035" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="353.403509" font-family="Arial, sans-serif" font-size="16.139761" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Data Replication</text>
  <text x="640" y="391.052575" font-family="Arial, sans-serif" font-size="13.11359" fill="var(--text-faint)" text-anchor="middle">Async, every 5 min</text>
  <!-- DR: GCP (right) -->
  <rect x="800" y="192.631579" width="440" height="427.368421" rx="6.566261" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="800" y="192.631579" width="440" height="55.964968" rx="6.566261" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="800" y="234.350933" width="440" height="14.245614" fill="var(--ok-fill)" rx="6.566261" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="228.245558" font-family="Arial, sans-serif" font-size="22.192103" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCP -- DR Site</text>
  <!-- Standby badge -->
  <rect x="860" y="263.859649" width="120" height="30.526316" rx="6.566261" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="285.228014" font-family="Arial, sans-serif" font-size="15.130965" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">STANDBY</text>
  <!-- GCP workloads -->
  <rect x="830" y="314.736842" width="180" height="61.052632" rx="6.566261" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="920" y="343.22807" font-family="Arial, sans-serif" font-size="14.122277" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">App Servers</text>
  <text x="920" y="363.578947" font-family="Arial, sans-serif" font-size="12.104794" fill="var(--text-faint)" text-anchor="middle">GKE (1 replica, warm)</text>
  <rect x="1030" y="314.736842" width="180" height="61.052632" rx="6.566261" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1120" y="343.22807" font-family="Arial, sans-serif" font-size="14.122277" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Database</text>
  <text x="1120" y="363.578947" font-family="Arial, sans-serif" font-size="12.104794" fill="var(--text-faint)" text-anchor="middle">Cloud SQL (replica)</text>
  <rect x="830" y="396.140351" width="380" height="50.877193" rx="6.566261" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="427.684154" font-family="Arial, sans-serif" font-size="15.130965" fill="var(--ok-accent)" text-anchor="middle">Warm standby, scales up on failover</text>
  <!-- Failover actions -->
  <rect x="830" y="467.368421" width="380" height="71.22807" rx="6.566261" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1020" y="493.824561" font-family="Arial, sans-serif" font-size="14.122277" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">On Failover:</text>
  <text x="1020" y="516.210526" font-family="Arial, sans-serif" font-size="13.11359" fill="var(--text-muted)" text-anchor="middle">1. Promote DB replica  2. Scale GKE to 3  3. DNS switch</text>
  <!-- Active after failover -->
  <rect x="830" y="553.859593" width="380" height="40.701754" rx="6.566261" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="1020" y="580.315846" font-family="Arial, sans-serif" font-size="15.130965" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Becomes ACTIVE on AWS failure</text>
</svg>
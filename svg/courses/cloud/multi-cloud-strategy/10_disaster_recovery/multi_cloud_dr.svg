<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- DNS Failover at top -->
  <rect x="415" y="58.125" width="450" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="96.1875" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--text)" text-anchor="middle">DNS Failover (Global Load Balancer)</text>
  <!-- Normal state arrow (solid to AWS) -->
  <line x1="546.25" y1="121.5625" x2="274.375" y2="194.0625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386.875" y="148.75" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Normal: 100%</text>
  <!-- Failover arrow (dashed to GCP) -->
  <line x1="733.75" y1="121.5625" x2="1005.625" y2="194.0625" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <text x="893.125" y="148.75" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">Failover: 100%</text>
  <!-- Primary: AWS (left) -->
  <rect x="77.5" y="194.0625" width="412.5" height="380.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="77.5" y="194.0625" width="412.5" height="49.8438" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="77.5" y="231.2188" width="412.5" height="12.6875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="283.75" y="225.7812" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS -- Primary</text>
  <!-- Active badge -->
  <rect x="133.75" y="257.5" width="112.5" height="27.1875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="190" y="276.5312" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">ACTIVE</text>
  <!-- AWS workloads -->
  <rect x="105.625" y="302.8125" width="168.75" height="54.375" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="190" y="328.1875" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">App Servers</text>
  <text x="190" y="346.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">EKS (3 replicas)</text>
  <rect x="293.125" y="302.8125" width="168.75" height="54.375" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="377.5" y="328.1875" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Database</text>
  <text x="377.5" y="346.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">RDS Multi-AZ</text>
  <rect x="105.625" y="375.3125" width="356.25" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="283.75" y="403.4062" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--primary-accent)" text-anchor="middle">Full production workload running</text>
  <!-- RPO/RTO -->
  <rect x="105.625" y="438.75" width="168.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="190" y="460.5" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">RPO: 5 min</text>
  <text x="190" y="476.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">Async replication lag</text>
  <rect x="293.125" y="438.75" width="168.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="377.5" y="460.5" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">RTO: 15 min</text>
  <text x="377.5" y="476.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">DNS + scale up time</text>
  <!-- Failure indicator -->
  <rect x="105.625" y="502.1875" width="356.25" height="36.25" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="283.75" y="525.75" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">On failure: traffic shifts to DR site</text>
  <!-- Data replication arrow between -->
  <line x1="490" y1="348.125" x2="790" y2="348.125" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="337.25" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Data Replication</text>
  <text x="640" y="370.7812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Async, every 5 min</text>
  <!-- DR: GCP (right) -->
  <rect x="790" y="194.0625" width="412.5" height="380.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="790" y="194.0625" width="412.5" height="49.8438" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="790" y="231.2188" width="412.5" height="12.6875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="996.25" y="225.7812" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCP -- DR Site</text>
  <!-- Standby badge -->
  <rect x="846.25" y="257.5" width="112.5" height="27.1875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="902.5" y="276.5312" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">STANDBY</text>
  <!-- GCP workloads -->
  <rect x="818.125" y="302.8125" width="168.75" height="54.375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="902.5" y="328.1875" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">App Servers</text>
  <text x="902.5" y="346.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">GKE (1 replica, warm)</text>
  <rect x="1005.625" y="302.8125" width="168.75" height="54.375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1090" y="328.1875" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Database</text>
  <text x="1090" y="346.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">Cloud SQL (replica)</text>
  <rect x="818.125" y="375.3125" width="356.25" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="996.25" y="403.4062" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--ok-accent)" text-anchor="middle">Warm standby, scales up on failover</text>
  <!-- Failover actions -->
  <rect x="818.125" y="438.75" width="356.25" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="996.25" y="462.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">On Failover:</text>
  <text x="996.25" y="482.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">1. Promote DB replica  2. Scale GKE to 3  3. DNS switch</text>
  <!-- Active after failover -->
  <rect x="818.125" y="515.7812" width="356.25" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="996.25" y="539.3438" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Becomes ACTIVE on AWS failure</text>
</svg>
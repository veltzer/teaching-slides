<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Benefits panel (left) -->
  <rect x="77.5" y="76.25" width="393.75" height="507.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="77.5" y="76.25" width="393.75" height="48.9375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="77.5" y="112.5" width="393.75" height="12.6875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="274.375" y="108.875" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--bg)" text-anchor="middle">Benefits</text>
  <circle cx="143.125" cy="175.9375" r="16.5914" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="135.625" y="181.375" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)">✓</text>
  <text x="171.25" y="181.375" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)">Flexibility and choice</text>
  <text x="171.25" y="203.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Pick the right tool for each job</text>
  <circle cx="143.125" cy="248.4375" r="16.5914" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="135.625" y="253.875" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)">✓</text>
  <text x="171.25" y="253.875" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)">Resilience</text>
  <text x="171.25" y="275.625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">No single point of failure</text>
  <circle cx="143.125" cy="320.9375" r="16.5914" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="135.625" y="326.375" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)">✓</text>
  <text x="171.25" y="326.375" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)">Best-of-breed services</text>
  <text x="171.25" y="348.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Leverage each provider's strengths</text>
  <circle cx="143.125" cy="393.4375" r="16.5914" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="135.625" y="398.875" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)">✓</text>
  <text x="171.25" y="398.875" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)">Negotiation leverage</text>
  <text x="171.25" y="420.625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Competitive pricing pressure</text>
  <circle cx="143.125" cy="465.9375" r="16.5914" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="135.625" y="471.375" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)">✓</text>
  <text x="171.25" y="471.375" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)">Compliance options</text>
  <text x="171.25" y="493.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Meet varied regulatory needs</text>
  <!-- Balance / Scale in center -->
  <polygon points="640,148.75 658.75,203.125 621.25,203.125" fill="var(--border)" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="640" y1="203.125" x2="640" y2="565.625" stroke="var(--border)" stroke-width="2"/>
  <rect x="611.875" y="556.5625" width="56.25" height="18.125" rx="6" fill="var(--border)"/>
  <line x1="508.75" y1="221.25" x2="771.25" y2="221.25" stroke="var(--text-muted)" stroke-width="2"/>
  <circle cx="508.75" cy="221.25" r="7.3739" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="771.25" cy="221.25" r="7.3739" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="275.625" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Weigh carefully</text>
  <text x="640" y="302.8125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">before committing</text>
  <!-- Risks panel (right) -->
  <rect x="808.75" y="76.25" width="393.75" height="507.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="808.75" y="76.25" width="393.75" height="48.9375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="808.75" y="112.5" width="393.75" height="12.6875" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1005.625" y="108.875" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--bg)" text-anchor="middle">Risks</text>
  <circle cx="874.375" cy="175.9375" r="16.5914" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="866.875" y="181.375" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--danger-accent)">✗</text>
  <text x="902.5" y="181.375" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)">Operational complexity</text>
  <text x="902.5" y="203.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Multiple tools, APIs, consoles</text>
  <circle cx="874.375" cy="248.4375" r="16.5914" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="866.875" y="253.875" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--danger-accent)">✗</text>
  <text x="902.5" y="253.875" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)">Skill gaps</text>
  <text x="902.5" y="275.625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Teams must learn all platforms</text>
  <circle cx="874.375" cy="320.9375" r="16.5914" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="866.875" y="326.375" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--danger-accent)">✗</text>
  <text x="902.5" y="326.375" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)">Cost overhead</text>
  <text x="902.5" y="348.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Cross-cloud data transfer fees</text>
  <circle cx="874.375" cy="393.4375" r="16.5914" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="866.875" y="398.875" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--danger-accent)">✗</text>
  <text x="902.5" y="398.875" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)">Inconsistency</text>
  <text x="902.5" y="420.625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Different security models, configs</text>
  <circle cx="874.375" cy="465.9375" r="16.5914" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="866.875" y="471.375" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--danger-accent)">✗</text>
  <text x="902.5" y="471.375" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)">Lowest common denominator</text>
  <text x="902.5" y="493.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">May miss provider-specific features</text>
</svg>
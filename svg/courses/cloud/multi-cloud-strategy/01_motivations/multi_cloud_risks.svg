<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Benefits panel (left) -->
  <rect x="40" y="40" width="420" height="580" rx="6.624629" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="420" height="55.928571" rx="6.624629" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="81.428571" width="420" height="14.5" fill="var(--ok-fill)" rx="6.624629" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="77.285714" font-family="Arial, sans-serif" font-size="24.424788" font-weight="bold" fill="var(--bg)" text-anchor="middle">Benefits</text>
  <rect x="91.6814" y="135.61" width="36.6373" height="36.6373" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="102" y="160.142857" font-family="Arial, sans-serif" font-size="16.283229" fill="var(--ok-accent)">✓</text>
  <text x="140" y="160.142857" font-family="Arial, sans-serif" font-size="18.318646" fill="var(--text)">Flexibility and choice</text>
  <text x="140" y="185" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)">Pick the right tool for each job</text>
  <rect x="91.6814" y="218.467" width="36.6373" height="36.6373" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="102" y="243" font-family="Arial, sans-serif" font-size="16.283229" fill="var(--ok-accent)">✓</text>
  <text x="140" y="243" font-family="Arial, sans-serif" font-size="18.318646" fill="var(--text)">Resilience</text>
  <text x="140" y="267.857143" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)">No single point of failure</text>
  <rect x="91.6814" y="301.324" width="36.6373" height="36.6373" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="102" y="325.857143" font-family="Arial, sans-serif" font-size="16.283229" fill="var(--ok-accent)">✓</text>
  <text x="140" y="325.857143" font-family="Arial, sans-serif" font-size="18.318646" fill="var(--text)">Best-of-breed services</text>
  <text x="140" y="350.714286" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)">Leverage each provider's strengths</text>
  <rect x="91.6814" y="384.181" width="36.6373" height="36.6373" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="102" y="408.714286" font-family="Arial, sans-serif" font-size="16.283229" fill="var(--ok-accent)">✓</text>
  <text x="140" y="408.714286" font-family="Arial, sans-serif" font-size="18.318646" fill="var(--text)">Negotiation leverage</text>
  <text x="140" y="433.571429" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)">Competitive pricing pressure</text>
  <rect x="91.6814" y="467.038" width="36.6373" height="36.6373" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="102" y="491.571429" font-family="Arial, sans-serif" font-size="16.283229" fill="var(--ok-accent)">✓</text>
  <text x="140" y="491.571429" font-family="Arial, sans-serif" font-size="18.318646" fill="var(--text)">Compliance options</text>
  <text x="140" y="516.428571" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)">Meet varied regulatory needs</text>
  <!-- Balance / Scale in center -->
  <polygon points="640,122.857143 660,185 620,185" fill="var(--border)" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="640" y1="185" x2="640" y2="599.285714" stroke="var(--border)" stroke-width="2"/>
  <rect x="610" y="588.928571" width="60" height="20.714286" rx="6.624629" fill="var(--border)"/>
  <line x1="500" y1="205.714286" x2="780" y2="205.714286" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="491.858" y="197.573" width="16.2831" height="16.2831" rx="8.14156" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="771.858" y="197.573" width="16.2831" height="16.2831" rx="8.14156" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="267.857143" font-family="Arial, sans-serif" font-size="16.283229" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Weigh carefully</text>
  <text x="640" y="298.928571" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)" text-anchor="middle">before committing</text>
  <!-- Risks panel (right) -->
  <rect x="820" y="40" width="420" height="580" rx="6.624629" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="40" width="420" height="55.928571" rx="6.624629" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="81.428571" width="420" height="14.5" fill="var(--danger-fill)" rx="6.624629" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="77.285714" font-family="Arial, sans-serif" font-size="24.424788" font-weight="bold" fill="var(--bg)" text-anchor="middle">Risks</text>
  <rect x="871.681" y="135.61" width="36.6373" height="36.6373" rx="14" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="882" y="160.142857" font-family="Arial, sans-serif" font-size="16.283229" fill="var(--danger-accent)">✗</text>
  <text x="920" y="160.142857" font-family="Arial, sans-serif" font-size="18.318646" fill="var(--text)">Operational complexity</text>
  <text x="920" y="185" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)">Multiple tools, APIs, consoles</text>
  <rect x="871.681" y="218.467" width="36.6373" height="36.6373" rx="14" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="882" y="243" font-family="Arial, sans-serif" font-size="16.283229" fill="var(--danger-accent)">✗</text>
  <text x="920" y="243" font-family="Arial, sans-serif" font-size="18.318646" fill="var(--text)">Skill gaps</text>
  <text x="920" y="267.857143" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)">Teams must learn all platforms</text>
  <rect x="871.681" y="301.324" width="36.6373" height="36.6373" rx="14" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="882" y="325.857143" font-family="Arial, sans-serif" font-size="16.283229" fill="var(--danger-accent)">✗</text>
  <text x="920" y="325.857143" font-family="Arial, sans-serif" font-size="18.318646" fill="var(--text)">Cost overhead</text>
  <text x="920" y="350.714286" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)">Cross-cloud data transfer fees</text>
  <rect x="871.681" y="384.181" width="36.6373" height="36.6373" rx="14" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="882" y="408.714286" font-family="Arial, sans-serif" font-size="16.283229" fill="var(--danger-accent)">✗</text>
  <text x="920" y="408.714286" font-family="Arial, sans-serif" font-size="18.318646" fill="var(--text)">Inconsistency</text>
  <text x="920" y="433.571429" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)">Different security models, configs</text>
  <rect x="871.681" y="467.038" width="36.6373" height="36.6373" rx="14" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="882" y="491.571429" font-family="Arial, sans-serif" font-size="16.283229" fill="var(--danger-accent)">✗</text>
  <text x="920" y="491.571429" font-family="Arial, sans-serif" font-size="18.318646" fill="var(--text)">Lowest common denominator</text>
  <text x="920" y="516.428571" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)">May miss provider-specific features</text>
</svg>
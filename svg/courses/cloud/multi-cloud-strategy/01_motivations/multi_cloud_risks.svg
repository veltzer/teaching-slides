<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Benefits panel (left) -->
  <rect x="40" y="40" width="420" height="560" rx="14" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="420" height="54" rx="14" fill="url(#grad-ok)"/>
  <rect x="40" y="80" width="420" height="14" fill="url(#grad-ok)"/>
  <text x="250" y="76" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--bg)" text-anchor="middle">Benefits</text>
  <circle cx="110" cy="150" r="18" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2"/>
  <text x="102" y="156" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-dk)">✓</text>
  <text x="140" y="156" font-family="Arial, sans-serif" font-size="18" fill="var(--text-dark)">Flexibility and choice</text>
  <text x="140" y="180" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Pick the right tool for each job</text>
  <circle cx="110" cy="230" r="18" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2"/>
  <text x="102" y="236" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-dk)">✓</text>
  <text x="140" y="236" font-family="Arial, sans-serif" font-size="18" fill="var(--text-dark)">Resilience</text>
  <text x="140" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">No single point of failure</text>
  <circle cx="110" cy="310" r="18" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2"/>
  <text x="102" y="316" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-dk)">✓</text>
  <text x="140" y="316" font-family="Arial, sans-serif" font-size="18" fill="var(--text-dark)">Best-of-breed services</text>
  <text x="140" y="340" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Leverage each provider's strengths</text>
  <circle cx="110" cy="390" r="18" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2"/>
  <text x="102" y="396" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-dk)">✓</text>
  <text x="140" y="396" font-family="Arial, sans-serif" font-size="18" fill="var(--text-dark)">Negotiation leverage</text>
  <text x="140" y="420" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Competitive pricing pressure</text>
  <circle cx="110" cy="470" r="18" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2"/>
  <text x="102" y="476" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-dk)">✓</text>
  <text x="140" y="476" font-family="Arial, sans-serif" font-size="18" fill="var(--text-dark)">Compliance options</text>
  <text x="140" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Meet varied regulatory needs</text>
  <!-- Balance / Scale in center -->
  <polygon points="640,120 660,180 620,180" fill="var(--border-strong)" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="640" y1="180" x2="640" y2="580" stroke="var(--border-strong)" stroke-width="4"/>
  <rect x="610" y="570" width="60" height="20" rx="4" fill="var(--border-strong)"/>
  <line x1="500" y1="200" x2="780" y2="200" stroke="var(--text-muted)" stroke-width="3"/>
  <circle cx="500" cy="200" r="8" fill="var(--ok)" stroke="var(--ok-dk)" stroke-width="2"/>
  <circle cx="780" cy="200" r="8" fill="var(--danger)" stroke="var(--danger-dk)" stroke-width="2"/>
  <text x="640" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Weigh carefully</text>
  <text x="640" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">before committing</text>
  <!-- Risks panel (right) -->
  <rect x="820" y="40" width="420" height="560" rx="14" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="40" width="420" height="54" rx="14" fill="url(#grad-danger)"/>
  <rect x="820" y="80" width="420" height="14" fill="url(#grad-danger)"/>
  <text x="1030" y="76" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--bg)" text-anchor="middle">Risks</text>
  <circle cx="890" cy="150" r="18" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="2"/>
  <text x="882" y="156" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-dk)">✗</text>
  <text x="920" y="156" font-family="Arial, sans-serif" font-size="18" fill="var(--text-dark)">Operational complexity</text>
  <text x="920" y="180" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Multiple tools, APIs, consoles</text>
  <circle cx="890" cy="230" r="18" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="2"/>
  <text x="882" y="236" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-dk)">✗</text>
  <text x="920" y="236" font-family="Arial, sans-serif" font-size="18" fill="var(--text-dark)">Skill gaps</text>
  <text x="920" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Teams must learn all platforms</text>
  <circle cx="890" cy="310" r="18" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="2"/>
  <text x="882" y="316" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-dk)">✗</text>
  <text x="920" y="316" font-family="Arial, sans-serif" font-size="18" fill="var(--text-dark)">Cost overhead</text>
  <text x="920" y="340" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Cross-cloud data transfer fees</text>
  <circle cx="890" cy="390" r="18" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="2"/>
  <text x="882" y="396" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-dk)">✗</text>
  <text x="920" y="396" font-family="Arial, sans-serif" font-size="18" fill="var(--text-dark)">Inconsistency</text>
  <text x="920" y="420" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Different security models, configs</text>
  <circle cx="890" cy="470" r="18" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="2"/>
  <text x="882" y="476" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-dk)">✗</text>
  <text x="920" y="476" font-family="Arial, sans-serif" font-size="18" fill="var(--text-dark)">Lowest common denominator</text>
  <text x="920" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">May miss provider-specific features</text>
</svg>
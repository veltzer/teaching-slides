<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Divider lines -->
  <line x1="640" y1="58.125" x2="640" y2="601.875" stroke="var(--border)" stroke-width="2"/>
  <line x1="77.5" y1="330" x2="1202.5" y2="330" stroke="var(--border)" stroke-width="2"/>
  <!-- Quadrant 1: Best-of-Breed (top-left) -->
  <rect x="86.875" y="67.1875" width="534.375" height="244.6875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.75" y="105.25" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--primary-accent)">Best-of-Breed</text>
  <circle cx="124.375" cy="99.8125" r="18.4349" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="116.875" y="105.25" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--primary-accent)">★</text>
  <text x="115" y="139.6875" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">Pick the best service from each provider</text>
  <text x="115" y="166.875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">• AWS for compute, GCP for ML, Azure for enterprise</text>
  <text x="115" y="189.5312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">• Optimize for capability, not vendor loyalty</text>
  <text x="115" y="212.1875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">• Requires strong integration skills</text>
  <!-- Quadrant 2: Compliance-Driven (top-right) -->
  <rect x="658.75" y="67.1875" width="534.375" height="244.6875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="705.625" y="105.25" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--danger-accent)">Compliance-Driven</text>
  <circle cx="696.25" cy="99.8125" r="18.4349" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="687.8125" y="105.25" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--danger-accent)">🛡</text>
  <text x="686.875" y="139.6875" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">Data residency and regulatory requirements</text>
  <text x="686.875" y="166.875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">• GDPR requires EU data stays in EU</text>
  <text x="686.875" y="189.5312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">• Government mandates specific providers</text>
  <text x="686.875" y="212.1875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">• Industry-specific compliance needs</text>
  <!-- Quadrant 3: Resilience (bottom-left) -->
  <rect x="86.875" y="348.125" width="534.375" height="244.6875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.75" y="386.1875" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--ok-accent)">Resilience</text>
  <circle cx="124.375" cy="380.75" r="18.4349" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="116.875" y="386.1875" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--ok-accent)">↻</text>
  <text x="115" y="420.625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">Avoid single provider failure scenarios</text>
  <text x="115" y="447.8125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">• Provider-level outage protection</text>
  <text x="115" y="470.4688" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">• Cross-cloud disaster recovery</text>
  <text x="115" y="493.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">• Business continuity assurance</text>
  <!-- Quadrant 4: Negotiation Leverage (bottom-right) -->
  <rect x="658.75" y="348.125" width="534.375" height="244.6875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="705.625" y="386.1875" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--warn-accent)">Negotiation Leverage</text>
  <circle cx="696.25" cy="380.75" r="18.4349" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="689.6875" y="386.1875" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--warn-accent)">$</text>
  <text x="686.875" y="420.625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">Pricing power and vendor competition</text>
  <text x="686.875" y="447.8125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">• Leverage competitive bids for discounts</text>
  <text x="686.875" y="470.4688" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">• Avoid committed spend lock-in</text>
  <text x="686.875" y="493.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">• Credible migration threat reduces costs</text>
</svg>
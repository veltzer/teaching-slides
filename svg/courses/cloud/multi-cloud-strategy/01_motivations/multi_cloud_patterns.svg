<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Divider lines -->
  <line x1="640" y1="40" x2="640" y2="620" stroke="var(--border)" stroke-width="2"/>
  <line x1="40" y1="330" x2="1240" y2="330" stroke="var(--border)" stroke-width="2"/>
  <!-- Quadrant 1: Best-of-Breed (top-left) -->
  <rect x="50" y="49.666667" width="570" height="261" rx="6.4" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="90.266667" font-family="Arial, sans-serif" font-size="21.630187" font-weight="bold" fill="var(--primary-accent)">Best-of-Breed</text>
  <rect x="70.3361" y="64.8028" width="39.3278" height="39.3278" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="90.266667" font-family="Arial, sans-serif" font-size="17.697493" fill="var(--primary-accent)">★</text>
  <text x="80" y="127" font-family="Arial, sans-serif" font-size="15.731093" fill="var(--text-muted)">Pick the best service from each provider</text>
  <text x="80" y="156" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text-faint)">• AWS for compute, GCP for ML, Azure for enterprise</text>
  <text x="80" y="180.166613" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text-faint)">• Optimize for capability, not vendor loyalty</text>
  <text x="80" y="204.333333" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text-faint)">• Requires strong integration skills</text>
  <!-- Quadrant 2: Compliance-Driven (top-right) -->
  <rect x="660" y="49.666667" width="570" height="261" rx="6.4" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="710" y="90.266667" font-family="Arial, sans-serif" font-size="21.630187" font-weight="bold" fill="var(--danger-accent)">Compliance-Driven</text>
  <rect x="680.336" y="64.8028" width="39.3278" height="39.3278" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="691" y="90.266667" font-family="Arial, sans-serif" font-size="17.697493" fill="var(--danger-accent)">🛡</text>
  <text x="690" y="127" font-family="Arial, sans-serif" font-size="15.731093" fill="var(--text-muted)">Data residency and regulatory requirements</text>
  <text x="690" y="156" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text-faint)">• GDPR requires EU data stays in EU</text>
  <text x="690" y="180.166613" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text-faint)">• Government mandates specific providers</text>
  <text x="690" y="204.333333" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text-faint)">• Industry-specific compliance needs</text>
  <!-- Quadrant 3: Resilience (bottom-left) -->
  <rect x="50" y="349.333333" width="570" height="261" rx="6.4" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="389.933333" font-family="Arial, sans-serif" font-size="21.630187" font-weight="bold" fill="var(--ok-accent)">Resilience</text>
  <rect x="70.3361" y="364.469" width="39.3278" height="39.3278" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="389.933333" font-family="Arial, sans-serif" font-size="17.697493" fill="var(--ok-accent)">↻</text>
  <text x="80" y="426.666667" font-family="Arial, sans-serif" font-size="15.731093" fill="var(--text-muted)">Avoid single provider failure scenarios</text>
  <text x="80" y="455.666667" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text-faint)">• Provider-level outage protection</text>
  <text x="80" y="479.833387" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text-faint)">• Cross-cloud disaster recovery</text>
  <text x="80" y="504" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text-faint)">• Business continuity assurance</text>
  <!-- Quadrant 4: Negotiation Leverage (bottom-right) -->
  <rect x="660" y="349.333333" width="570" height="261" rx="6.4" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="710" y="389.933333" font-family="Arial, sans-serif" font-size="21.630187" font-weight="bold" fill="var(--warn-accent)">Negotiation Leverage</text>
  <rect x="680.336" y="364.469" width="39.3278" height="39.3278" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="693" y="389.933333" font-family="Arial, sans-serif" font-size="17.697493" fill="var(--warn-accent)">$</text>
  <text x="690" y="426.666667" font-family="Arial, sans-serif" font-size="15.731093" fill="var(--text-muted)">Pricing power and vendor competition</text>
  <text x="690" y="455.666667" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text-faint)">• Leverage competitive bids for discounts</text>
  <text x="690" y="479.833387" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text-faint)">• Avoid committed spend lock-in</text>
  <text x="690" y="504" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text-faint)">• Credible migration threat reduces costs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Divider lines -->
  <line x1="640" y1="20" x2="640" y2="620" stroke="var(--border)" stroke-width="2"/>
  <line x1="40" y1="320" x2="1240" y2="320" stroke="var(--border)" stroke-width="2"/>
  <!-- Quadrant 1: Best-of-Breed (top-left) -->
  <rect x="50" y="30" width="570" height="270" rx="12" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="72" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-dk)">Best-of-Breed</text>
  <circle cx="90" cy="66" r="20" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="2"/>
  <text x="82" y="72" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-dk)">★</text>
  <text x="80" y="110" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Pick the best service from each provider</text>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">• AWS for compute, GCP for ML, Azure for enterprise</text>
  <text x="80" y="165" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">• Optimize for capability, not vendor loyalty</text>
  <text x="80" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">• Requires strong integration skills</text>
  <!-- Quadrant 2: Compliance-Driven (top-right) -->
  <rect x="660" y="30" width="570" height="270" rx="12" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="710" y="72" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-dk)">Compliance-Driven</text>
  <circle cx="700" cy="66" r="20" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="2"/>
  <text x="691" y="72" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-dk)">🛡</text>
  <text x="690" y="110" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Data residency and regulatory requirements</text>
  <text x="690" y="140" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">• GDPR requires EU data stays in EU</text>
  <text x="690" y="165" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">• Government mandates specific providers</text>
  <text x="690" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">• Industry-specific compliance needs</text>
  <!-- Quadrant 3: Resilience (bottom-left) -->
  <rect x="50" y="340" width="570" height="270" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="382" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-dk)">Resilience</text>
  <circle cx="90" cy="376" r="20" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2"/>
  <text x="82" y="382" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-dk)">↻</text>
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Avoid single provider failure scenarios</text>
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">• Provider-level outage protection</text>
  <text x="80" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">• Cross-cloud disaster recovery</text>
  <text x="80" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">• Business continuity assurance</text>
  <!-- Quadrant 4: Negotiation Leverage (bottom-right) -->
  <rect x="660" y="340" width="570" height="270" rx="12" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="710" y="382" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-dk)">Negotiation Leverage</text>
  <circle cx="700" cy="376" r="20" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="2"/>
  <text x="693" y="382" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-dk)">$</text>
  <text x="690" y="420" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Pricing power and vendor competition</text>
  <text x="690" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">• Leverage competitive bids for discounts</text>
  <text x="690" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">• Avoid committed spend lock-in</text>
  <text x="690" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">• Credible migration threat reduces costs</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#43a047"/><stop offset="50%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
  </defs>
  <!-- Spectrum bar -->
  <rect x="40" y="280.487805" width="1188.990826" height="56.585366" rx="8.12346" fill="url(#grad-spectrum)" filter="url(#shadow)"/>
  <!-- Arrow showing increasing lock-in -->
  <line x1="62.018349" y1="379.512195" x2="1206.972477" y2="379.512195" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="634.495413" y="414.878127" font-family="Arial, sans-serif" font-size="19.967329" fill="var(--text-muted)" text-anchor="middle">Lock-in increases →</text>
  <!-- Labels at ends -->
  <text x="40" y="266.341463" font-family="Arial, sans-serif" font-size="24.959195" font-weight="bold" fill="var(--ok-accent)" text-anchor="start">Portable</text>
  <text x="1228.990826" y="266.341463" font-family="Arial, sans-serif" font-size="24.959195" font-weight="bold" fill="var(--danger-accent)" text-anchor="end">Locked In</text>
  <!-- Item 1: Linux VMs -->
  <line x1="139.082569" y1="195.609756" x2="139.082569" y2="280.487805" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="51.009174" y="40" width="176.146789" height="141.463415" rx="8.12346" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="139.082569" y="93.756098" font-family="Arial, sans-serif" font-size="19.967329" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Linux VMs</text>
  <text x="139.082569" y="127.707317" font-family="Arial, sans-serif" font-size="16.223497" fill="var(--text-faint)" text-anchor="middle">Standard compute</text>
  <text x="139.082569" y="153.170732" font-family="Arial, sans-serif" font-size="16.223497" fill="var(--text-faint)" text-anchor="middle">Easy to migrate</text>
  <!-- Item 2: Kubernetes -->
  <line x1="381.284404" y1="195.609756" x2="381.284404" y2="280.487805" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="282.201835" y="40" width="198.165138" height="141.463415" rx="8.12346" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="381.284404" y="93.756098" font-family="Arial, sans-serif" font-size="19.967329" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Kubernetes</text>
  <text x="381.284404" y="127.707317" font-family="Arial, sans-serif" font-size="16.223497" fill="var(--text-faint)" text-anchor="middle">Mostly portable</text>
  <text x="381.284404" y="153.170732" font-family="Arial, sans-serif" font-size="16.223497" fill="var(--text-faint)" text-anchor="middle">Some cloud add-ons</text>
  <!-- Item 3: Managed DBs -->
  <line x1="634.495413" y1="351.219512" x2="634.495413" y2="478.536585" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="524.40367" y="478.536585" width="220.183486" height="141.463415" rx="8.12346" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="634.495413" y="532.292683" font-family="Arial, sans-serif" font-size="19.967329" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Managed Databases</text>
  <text x="634.495413" y="566.243902" font-family="Arial, sans-serif" font-size="16.223497" fill="var(--text-faint)" text-anchor="middle">Moderate lock-in</text>
  <text x="634.495413" y="591.707317" font-family="Arial, sans-serif" font-size="16.223497" fill="var(--text-faint)" text-anchor="middle">Data migration costly</text>
  <!-- Item 4: Serverless -->
  <line x1="887.706422" y1="351.219512" x2="887.706422" y2="478.536585" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="777.614679" y="478.536585" width="220.183486" height="141.463415" rx="8.12346" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="887.706422" y="532.292683" font-family="Arial, sans-serif" font-size="19.967329" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Serverless</text>
  <text x="887.706422" y="566.243902" font-family="Arial, sans-serif" font-size="16.223497" fill="var(--text-faint)" text-anchor="middle">High lock-in</text>
  <text x="887.706422" y="591.707317" font-family="Arial, sans-serif" font-size="16.223497" fill="var(--text-faint)" text-anchor="middle">Proprietary triggers/APIs</text>
  <!-- Item 5: Proprietary AI -->
  <line x1="1129.908257" y1="195.609756" x2="1129.908257" y2="280.487805" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="1019.816514" y="40" width="220.183486" height="141.463415" rx="8.12346" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1129.908257" y="93.756098" font-family="Arial, sans-serif" font-size="19.967329" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Proprietary AI</text>
  <text x="1129.908257" y="127.707317" font-family="Arial, sans-serif" font-size="16.223497" fill="var(--text-faint)" text-anchor="middle">Very locked in</text>
  <text x="1129.908257" y="153.170732" font-family="Arial, sans-serif" font-size="16.223497" fill="var(--text-faint)" text-anchor="middle">Custom models/APIs</text>
</svg>
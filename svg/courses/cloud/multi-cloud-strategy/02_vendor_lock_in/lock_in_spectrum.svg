<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#43a047"/><stop offset="50%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Spectrum bar -->
  <rect x="100" y="300" width="1080" height="40" rx="6" fill="url(#grad-spectrum)" filter="url(#shadow)"/>
  <!-- Arrow showing increasing lock-in -->
  <line x1="120" y1="370" x2="1160" y2="370" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="395" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)" text-anchor="middle">Lock-in increases →</text>
  <!-- Labels at ends -->
  <text x="100" y="290" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-accent)" text-anchor="start">Portable</text>
  <text x="1180" y="290" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-accent)" text-anchor="end">Locked In</text>
  <!-- Item 1: Linux VMs -->
  <line x1="190" y1="240" x2="190" y2="300" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="110" y="130" width="160" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="168" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Linux VMs</text>
  <text x="190" y="192" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Standard compute</text>
  <text x="190" y="210" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Easy to migrate</text>
  <!-- Item 2: Kubernetes -->
  <line x1="410" y1="240" x2="410" y2="300" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="320" y="130" width="180" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="168" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Kubernetes</text>
  <text x="410" y="192" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Mostly portable</text>
  <text x="410" y="210" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Some cloud add-ons</text>
  <!-- Item 3: Managed DBs -->
  <line x1="640" y1="350" x2="640" y2="440" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="540" y="440" width="200" height="100" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="478" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Managed Databases</text>
  <text x="640" y="502" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Moderate lock-in</text>
  <text x="640" y="520" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Data migration costly</text>
  <!-- Item 4: Serverless -->
  <line x1="870" y1="350" x2="870" y2="440" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="770" y="440" width="200" height="100" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="478" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Serverless</text>
  <text x="870" y="502" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">High lock-in</text>
  <text x="870" y="520" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Proprietary triggers/APIs</text>
  <!-- Item 5: Proprietary AI -->
  <line x1="1090" y1="240" x2="1090" y2="300" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="990" y="130" width="200" height="100" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="168" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Proprietary AI</text>
  <text x="1090" y="192" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Very locked in</text>
  <text x="1090" y="210" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Custom models/APIs</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Central data mass -->
  <circle cx="640" cy="330" r="110.6091" fill="url(#grad-data)" filter="url(#shadow)"/>
  <circle cx="640" cy="330" r="87.5655" fill="var(--primary-fill)" opacity="0.4"/>
  <circle cx="640" cy="330" r="64.522" fill="var(--primary-fill)" opacity="0.3"/>
  <text x="640" y="320.9375" font-family="Arial, sans-serif" font-size="25.8088" font-weight="bold" fill="var(--bg)" text-anchor="middle">DATA</text>
  <text x="640" y="348.125" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" text-anchor="middle">50 TB+</text>
  <!-- Orbit rings -->
  <ellipse cx="640" cy="330" rx="243.75" ry="181.25" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <ellipse cx="640" cy="330" rx="356.25" ry="244.6875" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <!-- Orbiting services -->
  <circle cx="415" cy="203.125" r="36.8697" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="415" y="199.5" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Compute</text>
  <text x="415" y="214" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">VMs</text>
  <circle cx="865" cy="203.125" r="36.8697" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="865" y="199.5" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Analytics</text>
  <text x="865" y="214" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">BI/ML</text>
  <circle cx="358.75" cy="438.75" r="36.8697" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="358.75" y="435.125" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">APIs</text>
  <text x="358.75" y="449.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">Services</text>
  <circle cx="921.25" cy="438.75" r="36.8697" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.25" y="435.125" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Cache</text>
  <text x="921.25" y="449.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">Redis</text>
  <circle cx="321.25" cy="311.875" r="32.261" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.25" y="308.25" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Search</text>
  <text x="321.25" y="322.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">Index</text>
  <circle cx="958.75" cy="311.875" r="32.261" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.75" y="308.25" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Stream</text>
  <text x="958.75" y="322.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">Kafka</text>
  <!-- Egress cost annotations -->
  <rect x="77.5" y="85.3125" width="262.5" height="72.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.75" y="112.5" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Egress Cost: $0.08-0.12/GB</text>
  <text x="208.75" y="135.1562" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Moving data out is expensive</text>
  <rect x="940" y="85.3125" width="262.5" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1071.25" y="112.5" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Latency Penalty</text>
  <text x="1071.25" y="135.1562" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Compute far from data = slow</text>
  <!-- Bottom annotation -->
  <rect x="415" y="547.5" width="450" height="45.3125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="576.5" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)" text-anchor="middle">Data is heavy -- services gravitate toward it</text>
</svg>
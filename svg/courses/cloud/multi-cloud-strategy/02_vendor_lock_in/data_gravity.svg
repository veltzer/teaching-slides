<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Central data mass -->
  <circle cx="640" cy="320" r="120" fill="url(#grad-data)" filter="url(#shadow)"/>
  <circle cx="640" cy="320" r="95" fill="var(--primary-fill)" opacity="0.4"/>
  <circle cx="640" cy="320" r="70" fill="var(--primary-fill)" opacity="0.3"/>
  <text x="640" y="310" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--bg)" text-anchor="middle">DATA</text>
  <text x="640" y="340" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)" text-anchor="middle">50 TB+</text>
  <!-- Orbit rings -->
  <ellipse cx="640" cy="320" rx="260" ry="200" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <ellipse cx="640" cy="320" rx="380" ry="270" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <!-- Orbiting services -->
  <circle cx="400" cy="180" r="40" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="176" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Compute</text>
  <text x="400" y="192" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">VMs</text>
  <circle cx="880" cy="180" r="40" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="176" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Analytics</text>
  <text x="880" y="192" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">BI/ML</text>
  <circle cx="340" cy="440" r="40" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="436" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">APIs</text>
  <text x="340" y="452" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Services</text>
  <circle cx="940" cy="440" r="40" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="436" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Cache</text>
  <text x="940" y="452" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Redis</text>
  <circle cx="300" cy="300" r="35" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="296" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Search</text>
  <text x="300" y="312" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Index</text>
  <circle cx="980" cy="300" r="35" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="296" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Stream</text>
  <text x="980" y="312" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Kafka</text>
  <!-- Egress cost annotations -->
  <rect x="40" y="50" width="280" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Egress Cost: $0.08-0.12/GB</text>
  <text x="180" y="105" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">Moving data out is expensive</text>
  <rect x="960" y="50" width="280" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Latency Penalty</text>
  <text x="1100" y="105" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">Compute far from data = slow</text>
  <!-- Bottom annotation -->
  <rect x="400" y="560" width="480" height="50" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="592" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)" text-anchor="middle">Data is heavy -- services gravitate toward it</text>
</svg>
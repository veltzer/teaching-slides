<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <linearGradient id="grad-data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Central data mass -->
  <circle cx="640" cy="320" r="120" fill="url(#grad-data)" filter="url(#shadow)"/>
  <circle cx="640" cy="320" r="95" fill="var(--primary-lt)" opacity="0.4"/>
  <circle cx="640" cy="320" r="70" fill="var(--primary-lt)" opacity="0.3"/>
  <text x="640" y="310" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--bg)" text-anchor="middle">DATA</text>
  <text x="640" y="340" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-pale)" text-anchor="middle">50 TB+</text>
  <!-- Orbit rings -->
  <ellipse cx="640" cy="320" rx="260" ry="200" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <ellipse cx="640" cy="320" rx="380" ry="270" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <!-- Orbiting services -->
  <circle cx="400" cy="180" r="40" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="176" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Compute</text>
  <text x="400" y="192" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">VMs</text>
  <circle cx="880" cy="180" r="40" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="176" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Analytics</text>
  <text x="880" y="192" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">BI/ML</text>
  <circle cx="340" cy="440" r="40" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="436" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">APIs</text>
  <text x="340" y="452" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Services</text>
  <circle cx="940" cy="440" r="40" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="436" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Cache</text>
  <text x="940" y="452" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Redis</text>
  <circle cx="300" cy="300" r="35" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="296" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Search</text>
  <text x="300" y="312" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Index</text>
  <circle cx="980" cy="300" r="35" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="296" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Stream</text>
  <text x="980" y="312" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Kafka</text>
  <!-- Egress cost annotations -->
  <rect x="40" y="50" width="280" height="80" rx="8" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Egress Cost: $0.08-0.12/GB</text>
  <text x="180" y="105" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">Moving data out is expensive</text>
  <rect x="960" y="50" width="280" height="80" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Latency Penalty</text>
  <text x="1100" y="105" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">Compute far from data = slow</text>
  <!-- Bottom annotation -->
  <rect x="400" y="560" width="480" height="50" rx="8" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2"/>
  <text x="640" y="592" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Data is heavy -- services gravitate toward it</text>
</svg>
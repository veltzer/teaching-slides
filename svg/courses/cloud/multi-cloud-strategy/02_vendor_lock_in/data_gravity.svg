<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- Central data mass -->
  <rect x="517.876" y="197.519" width="244.248" height="244.248" rx="14" fill="url(#grad-data)"/>
  <rect x="543.319" y="222.961" width="193.363" height="193.363" rx="14" fill="url(#grad-primary)" opacity="0.4" filter="url(#shadow)"/>
  <rect x="568.761" y="248.404" width="142.478" height="142.478" rx="14" fill="url(#grad-primary)" opacity="0.3" filter="url(#shadow)"/>
  <text x="640" y="309.285714" font-family="Arial, sans-serif" font-size="28.495622" font-weight="bold" fill="var(--bg)" text-anchor="middle">DATA</text>
  <text x="640" y="340.357143" font-family="Arial, sans-serif" font-size="16.283229" fill="var(--primary-accent)" text-anchor="middle">50 TB+</text>
  <!-- Orbit rings -->
  <ellipse cx="640" cy="319.642857" rx="260" ry="207.142857" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <ellipse cx="640" cy="319.642857" rx="380" ry="279.642857" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <!-- Orbiting services -->
  <rect x="359.292" y="133.935" width="81.416" height="81.416" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="170.5" font-family="Arial, sans-serif" font-size="12.212394" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Compute</text>
  <text x="400" y="187.071429" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-faint)" text-anchor="middle">VMs</text>
  <rect x="839.292" y="133.935" width="81.416" height="81.416" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="170.5" font-family="Arial, sans-serif" font-size="12.212394" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Analytics</text>
  <text x="880" y="187.071429" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-faint)" text-anchor="middle">BI/ML</text>
  <rect x="299.292" y="403.221" width="81.416" height="81.416" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="439.785714" font-family="Arial, sans-serif" font-size="12.212394" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">APIs</text>
  <text x="340" y="456.357143" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-faint)" text-anchor="middle">Services</text>
  <rect x="899.292" y="403.221" width="81.416" height="81.416" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="439.785714" font-family="Arial, sans-serif" font-size="12.212394" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Cache</text>
  <text x="940" y="456.357143" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-faint)" text-anchor="middle">Redis</text>
  <rect x="264.38" y="263.309" width="71.2391" height="71.2391" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="294.785714" font-family="Arial, sans-serif" font-size="11.19474" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Search</text>
  <text x="300" y="311.357143" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-faint)" text-anchor="middle">Index</text>
  <rect x="944.38" y="263.309" width="71.2391" height="71.2391" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="294.785714" font-family="Arial, sans-serif" font-size="11.19474" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Stream</text>
  <text x="980" y="311.357143" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-faint)" text-anchor="middle">Kafka</text>
  <!-- Egress cost annotations -->
  <rect x="40" y="40" width="280" height="82.857143" rx="6.624629" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="71.071429" font-family="Arial, sans-serif" font-size="16.283229" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Egress Cost: $0.08-0.12/GB</text>
  <text x="180" y="96.964229" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)" text-anchor="middle">Moving data out is expensive</text>
  <rect x="960" y="40" width="280" height="82.857143" rx="6.624629" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="71.071429" font-family="Arial, sans-serif" font-size="16.283229" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Latency Penalty</text>
  <text x="1100" y="96.964229" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--text-faint)" text-anchor="middle">Compute far from data = slow</text>
  <!-- Bottom annotation -->
  <rect x="400" y="568.214286" width="480" height="51.785714" rx="6.624629" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="601.357143" font-family="Arial, sans-serif" font-size="18.318646" font-weight="bold" fill="var(--text)" text-anchor="middle">Data is heavy -- services gravitate toward it</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- AWS Cloud (left) -->
  <rect x="40" y="40" width="480" height="580" rx="6.624629" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="81.428571" font-family="Arial, sans-serif" font-size="26.460205" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">AWS Region</text>
  <!-- AWS VPC -->
  <rect x="70" y="102.142857" width="420" height="207.142857" rx="6.624629" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="280" y="133.214286" font-family="Arial, sans-serif" font-size="18.318646" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">VPC (10.0.0.0/16)</text>
  <!-- Subnets -->
  <rect x="90" y="153.928571" width="180" height="62.142857" rx="6.624629" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="182.928571" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--primary-accent)" text-anchor="middle">Public Subnet</text>
  <text x="180" y="203.642857" font-family="Arial, sans-serif" font-size="12.212394" fill="var(--text-faint)" text-anchor="middle">10.0.1.0/24</text>
  <rect x="290" y="153.928571" width="180" height="62.142857" rx="6.624629" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="182.928571" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--primary-accent)" text-anchor="middle">Private Subnet</text>
  <text x="380" y="203.642857" font-family="Arial, sans-serif" font-size="12.212394" fill="var(--text-faint)" text-anchor="middle">10.0.2.0/24</text>
  <!-- AWS services -->
  <rect x="90" y="236.785714" width="140" height="41.428571" rx="6.624629" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="263.714286" font-family="Arial, sans-serif" font-size="13.230158" fill="var(--primary-accent)" text-anchor="middle">EC2 Instances</text>
  <rect x="250" y="236.785714" width="140" height="41.428571" rx="6.624629" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="263.714286" font-family="Arial, sans-serif" font-size="13.230158" fill="var(--primary-accent)" text-anchor="middle">RDS Database</text>
  <!-- AWS VPN Gateway -->
  <rect x="120" y="350.714286" width="200" height="62.142857" rx="6.624629" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="388" font-family="Arial, sans-serif" font-size="16.283229" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">VPN Gateway</text>
  <!-- AWS Direct Connect -->
  <rect x="120" y="443.928571" width="200" height="62.142857" rx="6.624629" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="481.214286" font-family="Arial, sans-serif" font-size="16.283229" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Direct Connect</text>
  <!-- GCP Cloud (right) -->
  <rect x="760" y="40" width="480" height="580" rx="6.624629" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="81.428571" font-family="Arial, sans-serif" font-size="26.460205" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">GCP Region</text>
  <!-- GCP VPC -->
  <rect x="790" y="102.142857" width="420" height="207.142857" rx="6.624629" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="1000" y="133.214286" font-family="Arial, sans-serif" font-size="18.318646" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">VPC (172.16.0.0/16)</text>
  <rect x="810" y="153.928571" width="180" height="62.142857" rx="6.624629" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="182.928571" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--ok-accent)" text-anchor="middle">Public Subnet</text>
  <text x="900" y="203.642857" font-family="Arial, sans-serif" font-size="12.212394" fill="var(--text-faint)" text-anchor="middle">172.16.1.0/24</text>
  <rect x="1010" y="153.928571" width="180" height="62.142857" rx="6.624629" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="182.928571" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--ok-accent)" text-anchor="middle">Private Subnet</text>
  <text x="1100" y="203.642857" font-family="Arial, sans-serif" font-size="12.212394" fill="var(--text-faint)" text-anchor="middle">172.16.2.0/24</text>
  <!-- GCP services -->
  <rect x="810" y="236.785714" width="140" height="41.428571" rx="6.624629" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="263.714286" font-family="Arial, sans-serif" font-size="13.230158" fill="var(--ok-accent)" text-anchor="middle">GCE Instances</text>
  <rect x="970" y="236.785714" width="140" height="41.428571" rx="6.624629" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="263.714286" font-family="Arial, sans-serif" font-size="13.230158" fill="var(--ok-accent)" text-anchor="middle">Cloud SQL</text>
  <!-- GCP VPN Gateway -->
  <rect x="960" y="350.714286" width="200" height="62.142857" rx="6.624629" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="388" font-family="Arial, sans-serif" font-size="16.283229" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Cloud VPN</text>
  <!-- GCP Interconnect -->
  <rect x="960" y="443.928571" width="200" height="62.142857" rx="6.624629" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="481.214286" font-family="Arial, sans-serif" font-size="16.283229" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Interconnect</text>
  <!-- VPN tunnel (dashed, warn) -->
  <line x1="320" y1="381.785714" x2="960" y2="381.785714" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="640" y="369.357143" font-family="Arial, sans-serif" font-size="16.283229" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">VPN Tunnel (IPSec)</text>
  <text x="640" y="407.678629" font-family="Arial, sans-serif" font-size="13.230158" fill="var(--text-faint)" text-anchor="middle">Latency: 5-20ms | Cost: Low | BW: ~1.25 Gbps</text>
  <!-- Cloud Interconnect (solid, primary) -->
  <line x1="320" y1="475" x2="960" y2="475" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="462.571429" font-family="Arial, sans-serif" font-size="16.283229" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Cloud Interconnect (Dedicated)</text>
  <text x="640" y="500.8928" font-family="Arial, sans-serif" font-size="13.230158" fill="var(--text-faint)" text-anchor="middle">Latency: 1-5ms | Cost: High | BW: 10-100 Gbps</text>
  <!-- Bottom note -->
  <rect x="300" y="547.5" width="680" height="51.785714" rx="6.624629" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="574.428571" font-family="Arial, sans-serif" font-size="15.265465" fill="var(--danger-accent)" text-anchor="middle">Egress fees apply in both directions -- plan data flows carefully</text>
  <text x="640" y="593.071429" font-family="Arial, sans-serif" font-size="13.230158" fill="var(--text-faint)" text-anchor="middle">Non-overlapping CIDR ranges required for routing</text>
</svg>
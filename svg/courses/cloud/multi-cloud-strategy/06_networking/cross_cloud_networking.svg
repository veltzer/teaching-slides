<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- AWS Cloud (left) -->
  <rect x="40" y="40" width="480" height="560" rx="18" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="80" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">AWS Region</text>
  <!-- AWS VPC -->
  <rect x="70" y="100" width="420" height="200" rx="12" fill="var(--bg)" stroke="var(--primary)" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="280" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">VPC (10.0.0.0/16)</text>
  <!-- Subnets -->
  <rect x="90" y="150" width="180" height="60" rx="8" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="180" y="178" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-dk)" text-anchor="middle">Public Subnet</text>
  <text x="180" y="198" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">10.0.1.0/24</text>
  <rect x="290" y="150" width="180" height="60" rx="8" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="380" y="178" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-dk)" text-anchor="middle">Private Subnet</text>
  <text x="380" y="198" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">10.0.2.0/24</text>
  <!-- AWS services -->
  <rect x="90" y="230" width="140" height="40" rx="6" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="160" y="256" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)" text-anchor="middle">EC2 Instances</text>
  <rect x="250" y="230" width="140" height="40" rx="6" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="320" y="256" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)" text-anchor="middle">RDS Database</text>
  <!-- AWS VPN Gateway -->
  <rect x="120" y="340" width="200" height="60" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
  <text x="220" y="376" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">VPN Gateway</text>
  <!-- AWS Direct Connect -->
  <rect x="120" y="430" width="200" height="60" rx="10" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="2"/>
  <text x="220" y="466" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Direct Connect</text>
  <!-- GCP Cloud (right) -->
  <rect x="760" y="40" width="480" height="560" rx="18" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="80" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">GCP Region</text>
  <!-- GCP VPC -->
  <rect x="790" y="100" width="420" height="200" rx="12" fill="var(--bg)" stroke="var(--ok)" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="1000" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">VPC (172.16.0.0/16)</text>
  <rect x="810" y="150" width="180" height="60" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1"/>
  <text x="900" y="178" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)" text-anchor="middle">Public Subnet</text>
  <text x="900" y="198" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">172.16.1.0/24</text>
  <rect x="1010" y="150" width="180" height="60" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1100" y="178" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)" text-anchor="middle">Private Subnet</text>
  <text x="1100" y="198" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">172.16.2.0/24</text>
  <!-- GCP services -->
  <rect x="810" y="230" width="140" height="40" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1"/>
  <text x="880" y="256" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-dk)" text-anchor="middle">GCE Instances</text>
  <rect x="970" y="230" width="140" height="40" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1040" y="256" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-dk)" text-anchor="middle">Cloud SQL</text>
  <!-- GCP VPN Gateway -->
  <rect x="960" y="340" width="200" height="60" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
  <text x="1060" y="376" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Cloud VPN</text>
  <!-- GCP Interconnect -->
  <rect x="960" y="430" width="200" height="60" rx="10" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2"/>
  <text x="1060" y="466" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Interconnect</text>
  <!-- VPN tunnel (dashed, warn) -->
  <line x1="320" y1="370" x2="960" y2="370" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="640" y="358" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">VPN Tunnel (IPSec)</text>
  <text x="640" y="395" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Latency: 5-20ms | Cost: Low | BW: ~1.25 Gbps</text>
  <!-- Cloud Interconnect (solid, primary) -->
  <line x1="320" y1="460" x2="960" y2="460" stroke="var(--primary)" stroke-width="3"/>
  <text x="640" y="448" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Cloud Interconnect (Dedicated)</text>
  <text x="640" y="485" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Latency: 1-5ms | Cost: High | BW: 10-100 Gbps</text>
  <!-- Bottom note -->
  <rect x="300" y="530" width="680" height="50" rx="8" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1"/>
  <text x="640" y="556" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-dk)" text-anchor="middle">Egress fees apply in both directions -- plan data flows carefully</text>
  <text x="640" y="574" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Non-overlapping CIDR ranges required for routing</text>
</svg>
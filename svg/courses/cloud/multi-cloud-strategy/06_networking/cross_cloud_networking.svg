<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- AWS Cloud (left) -->
  <rect x="77.5" y="76.25" width="450" height="507.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302.5" y="112.5" font-family="Arial, sans-serif" font-size="23.9653" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">AWS Region</text>
  <!-- AWS VPC -->
  <rect x="105.625" y="130.625" width="393.75" height="181.25" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="302.5" y="157.8125" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">VPC (10.0.0.0/16)</text>
  <!-- Subnets -->
  <rect x="124.375" y="175.9375" width="168.75" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="208.75" y="201.3125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">Public Subnet</text>
  <text x="208.75" y="219.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">10.0.1.0/24</text>
  <rect x="311.875" y="175.9375" width="168.75" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="396.25" y="201.3125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">Private Subnet</text>
  <text x="396.25" y="219.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">10.0.2.0/24</text>
  <!-- AWS services -->
  <rect x="124.375" y="248.4375" width="131.25" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="190" y="272" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">EC2 Instances</text>
  <rect x="274.375" y="248.4375" width="131.25" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="340" y="272" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">RDS Database</text>
  <!-- AWS VPN Gateway -->
  <rect x="152.5" y="348.125" width="187.5" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="246.25" y="380.75" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">VPN Gateway</text>
  <!-- AWS Direct Connect -->
  <rect x="152.5" y="429.6875" width="187.5" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="246.25" y="462.3125" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Direct Connect</text>
  <!-- GCP Cloud (right) -->
  <rect x="752.5" y="76.25" width="450" height="507.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="977.5" y="112.5" font-family="Arial, sans-serif" font-size="23.9653" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">GCP Region</text>
  <!-- GCP VPC -->
  <rect x="780.625" y="130.625" width="393.75" height="181.25" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="977.5" y="157.8125" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">VPC (172.16.0.0/16)</text>
  <rect x="799.375" y="175.9375" width="168.75" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="883.75" y="201.3125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">Public Subnet</text>
  <text x="883.75" y="219.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">172.16.1.0/24</text>
  <rect x="986.875" y="175.9375" width="168.75" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1071.25" y="201.3125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">Private Subnet</text>
  <text x="1071.25" y="219.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">172.16.2.0/24</text>
  <!-- GCP services -->
  <rect x="799.375" y="248.4375" width="131.25" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="865" y="272" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">GCE Instances</text>
  <rect x="949.375" y="248.4375" width="131.25" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1015" y="272" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">Cloud SQL</text>
  <!-- GCP VPN Gateway -->
  <rect x="940" y="348.125" width="187.5" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1033.75" y="380.75" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Cloud VPN</text>
  <!-- GCP Interconnect -->
  <rect x="940" y="429.6875" width="187.5" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="462.3125" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Interconnect</text>
  <!-- VPN tunnel (dashed, warn) -->
  <line x1="340" y1="375.3125" x2="940" y2="375.3125" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="640" y="364.4375" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">VPN Tunnel (IPSec)</text>
  <text x="640" y="397.9688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Latency: 5-20ms | Cost: Low | BW: ~1.25 Gbps</text>
  <!-- Cloud Interconnect (solid, primary) -->
  <line x1="340" y1="456.875" x2="940" y2="456.875" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="446" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Cloud Interconnect (Dedicated)</text>
  <text x="640" y="479.5312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Latency: 1-5ms | Cost: High | BW: 10-100 Gbps</text>
  <!-- Bottom note -->
  <rect x="321.25" y="520.3125" width="637.5" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="543.875" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--danger-accent)" text-anchor="middle">Egress fees apply in both directions -- plan data flows carefully</text>
  <text x="640" y="560.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Non-overlapping CIDR ranges required for routing</text>
</svg>
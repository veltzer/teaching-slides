  <rect x="321.25" y="583.75" width="637.5" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="602.7812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">DNS TTL: 60s | Health check interval: 30s | Failover time: ~90s</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Global DNS at top -->
  <rect x="412.413793" y="40" width="455.172414" height="87" rx="6.50941" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="78.666667" font-family="Arial, sans-serif" font-size="23.999976" font-weight="bold" fill="var(--text)" text-anchor="middle">Global DNS</text>
  <text x="640" y="107.666667" font-family="Arial, sans-serif" font-size="14.999958" fill="var(--text-muted)" text-anchor="middle">Route 53 / Traffic Manager / Cloud DNS</text>
  <!-- Routing policies -->
  <rect x="184.827586" y="146.333333" width="206.896552" height="33.833387" rx="6.50941" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="288.275862" y="168.56672" font-family="Arial, sans-serif" font-size="14.000004" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Latency-based</text>
  <rect x="433.103448" y="146.333333" width="206.896552" height="33.833387" rx="6.50941" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="536.551724" y="168.56672" font-family="Arial, sans-serif" font-size="14.000004" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Failover</text>
  <rect x="681.37931" y="146.333333" width="206.896552" height="33.833387" rx="6.50941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.827586" y="168.56672" font-family="Arial, sans-serif" font-size="14.000004" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Weighted</text>
  <rect x="929.655172" y="146.333333" width="206.896552" height="33.833387" rx="6.50941" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.103448" y="168.56672" font-family="Arial, sans-serif" font-size="14.000004" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Geolocation</text>
  <!-- Arrows from DNS to regions -->
  <line x1="515.862069" y1="127" x2="184.827586" y2="272" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="127" x2="640" y2="272" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="764.137931" y1="127" x2="1095.172414" y2="272" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Health check arrows (dashed, from DNS back up) -->
  <line x1="153.793103" y1="272" x2="495.172414" y2="127" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="608.965517" y1="272" x2="619.310345" y2="127" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1064.137931" y1="272" x2="784.827586" y2="127" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="368.125" y="230.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" transform="rotate(-30,350,210)">health check</text>
  <text x="619.310345" y="214" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--danger-accent)">health check</text>
  <text x="883.75" y="230.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" transform="rotate(30,900,210)">health check</text>
  <!-- AWS Region -->
  <rect x="40" y="272" width="289.655172" height="299.666667" rx="6.50941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="272" width="289.655172" height="48.333333" rx="6.50941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="306.8" width="289.655172" height="13.533333" fill="url(#grad-primary)" rx="6.50941" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586" y="303.900053" font-family="Arial, sans-serif" font-size="20.000053" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS Region</text>
  <rect x="71.034483" y="339.666667" width="227.586207" height="38.666667" rx="6.50941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586" y="364.8" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--primary-accent)" text-anchor="middle">Load Balancer (ALB)</text>
  <rect x="71.034483" y="392.833387" width="103.448276" height="58" rx="6.50941" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="122.758621" y="421.83328" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--primary-accent)" text-anchor="middle">App Server</text>
  <text x="122.758621" y="441.166613" font-family="Arial, sans-serif" font-size="11.000034" fill="var(--text-faint)" text-anchor="middle">x3</text>
  <rect x="195.172414" y="392.833387" width="103.448276" height="58" rx="6.50941" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="246.896552" y="421.83328" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--primary-accent)" text-anchor="middle">Database</text>
  <text x="246.896552" y="441.166613" font-family="Arial, sans-serif" font-size="11.000034" fill="var(--text-faint)" text-anchor="middle">RDS</text>
  <rect x="71.034483" y="465.333333" width="227.586207" height="29" rx="6.50941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586" y="484.666667" font-family="Arial, sans-serif" font-size="13.00005" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">HEALTHY</text>
  <text x="184.827586" y="533" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--text-muted)" text-anchor="middle">Primary (weight: 70%)</text>
  <!-- Azure Region -->
  <rect x="495.172414" y="272" width="289.655172" height="299.666667" rx="6.50941" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="495.172414" y="272" width="289.655172" height="48.333333" rx="6.50941" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="495.172414" y="306.8" width="289.655172" height="13.533333" fill="url(#grad-info)" rx="6.50941" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="303.900053" font-family="Arial, sans-serif" font-size="20.000053" font-weight="bold" fill="var(--bg)" text-anchor="middle">Azure Region</text>
  <rect x="526.206897" y="339.666667" width="227.586207" height="38.666667" rx="6.50941" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="364.8" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--info-accent)" text-anchor="middle">Load Balancer (ALB)</text>
  <rect x="526.206897" y="392.833387" width="103.448276" height="58" rx="6.50941" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="577.931034" y="421.83328" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--info-accent)" text-anchor="middle">App Server</text>
  <text x="577.931034" y="441.166613" font-family="Arial, sans-serif" font-size="11.000034" fill="var(--text-faint)" text-anchor="middle">x2</text>
  <rect x="650.344828" y="392.833387" width="103.448276" height="58" rx="6.50941" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="702.068966" y="421.83328" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--info-accent)" text-anchor="middle">Database</text>
  <text x="702.068966" y="441.166613" font-family="Arial, sans-serif" font-size="11.000034" fill="var(--text-faint)" text-anchor="middle">Azure SQL</text>
  <rect x="526.206897" y="465.333333" width="227.586207" height="29" rx="6.50941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="484.666667" font-family="Arial, sans-serif" font-size="13.00005" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">HEALTHY</text>
  <text x="640" y="533" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--text-muted)" text-anchor="middle">Secondary (weight: 20%)</text>
  <!-- GCP Region -->
  <rect x="950.344828" y="272" width="289.655172" height="299.666667" rx="6.50941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="950.344828" y="272" width="289.655172" height="48.333333" rx="6.50941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="950.344828" y="306.8" width="289.655172" height="13.533333" fill="url(#grad-ok)" rx="6.50941" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172414" y="303.900053" font-family="Arial, sans-serif" font-size="20.000053" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCP Region</text>
  <rect x="981.37931" y="339.666667" width="227.586207" height="38.666667" rx="6.50941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172414" y="364.8" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--ok-accent)" text-anchor="middle">Load Balancer (GLB)</text>
  <rect x="981.37931" y="392.833387" width="103.448276" height="58" rx="6.50941" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1033.103448" y="421.83328" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--ok-accent)" text-anchor="middle">App Server</text>
  <text x="1033.103448" y="441.166613" font-family="Arial, sans-serif" font-size="11.000034" fill="var(--text-faint)" text-anchor="middle">x2</text>
  <rect x="1105.517241" y="392.833387" width="103.448276" height="58" rx="6.50941" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1157.241379" y="421.83328" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--ok-accent)" text-anchor="middle">Database</text>
  <text x="1157.241379" y="441.166613" font-family="Arial, sans-serif" font-size="11.000034" fill="var(--text-faint)" text-anchor="middle">Cloud SQL</text>
  <rect x="981.37931" y="465.333333" width="227.586207" height="29" rx="6.50941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172414" y="484.666667" font-family="Arial, sans-serif" font-size="13.00005" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">HEALTHY</text>
  <text x="1095.172414" y="533" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--text-muted)" text-anchor="middle">Standby (weight: 10%)</text>
  <!-- Bottom legend -->
  <rect x="288.275862" y="591" width="703.448276" height="29" rx="6.50941" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="611.299947" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--text-muted)" text-anchor="middle">DNS TTL: 60s | Health check interval: 30s | Failover time: ~90s</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Global DNS at top -->
  <rect x="420" y="30" width="440" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="70" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)" text-anchor="middle">Global DNS</text>
  <text x="640" y="100" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)" text-anchor="middle">Route 53 / Traffic Manager / Cloud DNS</text>
  <!-- Routing policies -->
  <rect x="200" y="140" width="200" height="35" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="300" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Latency-based</text>
  <rect x="440" y="140" width="200" height="35" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="540" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Failover</text>
  <rect x="680" y="140" width="200" height="35" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Weighted</text>
  <rect x="920" y="140" width="200" height="35" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1020" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Geolocation</text>
  <!-- Arrows from DNS to regions -->
  <line x1="520" y1="120" x2="200" y2="270" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="120" x2="640" y2="270" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="120" x2="1080" y2="270" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Health check arrows (dashed, from DNS back up) -->
  <line x1="170" y1="270" x2="500" y2="120" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="610" y1="270" x2="620" y2="120" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1050" y1="270" x2="780" y2="120" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="350" y="210" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" transform="rotate(-30,350,210)">health check</text>
  <text x="620" y="210" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">health check</text>
  <text x="900" y="210" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" transform="rotate(30,900,210)">health check</text>
  <!-- AWS Region -->
  <rect x="60" y="270" width="280" height="310" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="270" width="280" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="60" y="306" width="280" height="14" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200" y="303" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS Region</text>
  <rect x="90" y="340" width="220" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200" y="366" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)" text-anchor="middle">Load Balancer (ALB)</text>
  <rect x="90" y="395" width="100" height="60" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="140" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" text-anchor="middle">App Server</text>
  <text x="140" y="445" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">x3</text>
  <rect x="210" y="395" width="100" height="60" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="260" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" text-anchor="middle">Database</text>
  <text x="260" y="445" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">RDS</text>
  <rect x="90" y="470" width="220" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="200" y="490" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">HEALTHY</text>
  <text x="200" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Primary (weight: 70%)</text>
  <!-- Azure Region -->
  <rect x="500" y="270" width="280" height="310" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="500" y="270" width="280" height="50" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="500" y="306" width="280" height="14" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="303" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Azure Region</text>
  <rect x="530" y="340" width="220" height="40" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="366" font-family="Arial, sans-serif" font-size="14" fill="var(--info-accent)" text-anchor="middle">Load Balancer (ALB)</text>
  <rect x="530" y="395" width="100" height="60" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="580" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)" text-anchor="middle">App Server</text>
  <text x="580" y="445" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">x2</text>
  <rect x="650" y="395" width="100" height="60" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="700" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)" text-anchor="middle">Database</text>
  <text x="700" y="445" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Azure SQL</text>
  <rect x="530" y="470" width="220" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="490" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">HEALTHY</text>
  <text x="640" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Secondary (weight: 20%)</text>
  <!-- GCP Region -->
  <rect x="940" y="270" width="280" height="310" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="270" width="280" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="940" y="306" width="280" height="14" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1080" y="303" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCP Region</text>
  <rect x="970" y="340" width="220" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1080" y="366" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" text-anchor="middle">Load Balancer (GLB)</text>
  <rect x="970" y="395" width="100" height="60" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1020" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle">App Server</text>
  <text x="1020" y="445" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">x2</text>
  <rect x="1090" y="395" width="100" height="60" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1140" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle">Database</text>
  <text x="1140" y="445" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Cloud SQL</text>
  <rect x="970" y="470" width="220" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1080" y="490" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">HEALTHY</text>
  <text x="1080" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Standby (weight: 10%)</text>
  <!-- Bottom legend -->
  <rect x="300" y="600" width="680" height="30" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="621" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">DNS TTL: 60s | Health check interval: 30s | Failover time: ~90s</text>
</svg>
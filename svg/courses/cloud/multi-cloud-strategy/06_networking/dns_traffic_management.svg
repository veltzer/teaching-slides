  <rect x="949.375" y="397.9688" width="93.75" height="54.375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="996.25" y="425.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">App Server</text>

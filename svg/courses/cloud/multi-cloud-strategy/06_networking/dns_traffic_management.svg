<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Global DNS at top -->
  <rect x="420" y="30" width="440" height="90" rx="16" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="70" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Global DNS</text>
  <text x="640" y="100" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)" text-anchor="middle">Route 53 / Traffic Manager / Cloud DNS</text>
  <!-- Routing policies -->
  <rect x="200" y="140" width="200" height="35" rx="6" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="300" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Latency-based</text>
  <rect x="440" y="140" width="200" height="35" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1"/>
  <text x="540" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Failover</text>
  <rect x="680" y="140" width="200" height="35" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="780" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Weighted</text>
  <rect x="920" y="140" width="200" height="35" rx="6" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1"/>
  <text x="1020" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Geolocation</text>
  <!-- Arrows from DNS to regions -->
  <line x1="520" y1="120" x2="200" y2="270" stroke="var(--primary)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="120" x2="640" y2="270" stroke="var(--info)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="120" x2="1080" y2="270" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Health check arrows (dashed, from DNS back up) -->
  <line x1="170" y1="270" x2="500" y2="120" stroke="var(--danger)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="610" y1="270" x2="620" y2="120" stroke="var(--danger)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1050" y1="270" x2="780" y2="120" stroke="var(--danger)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="350" y="210" font-family="Arial, sans-serif" font-size="12" fill="var(--danger)" transform="rotate(-30,350,210)">health check</text>
  <text x="620" y="210" font-family="Arial, sans-serif" font-size="12" fill="var(--danger)">health check</text>
  <text x="900" y="210" font-family="Arial, sans-serif" font-size="12" fill="var(--danger)" transform="rotate(30,900,210)">health check</text>
  <!-- AWS Region -->
  <rect x="60" y="270" width="280" height="310" rx="14" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="270" width="280" height="50" rx="14" fill="url(#grad-primary)"/>
  <rect x="60" y="306" width="280" height="14" fill="url(#grad-primary)"/>
  <text x="200" y="303" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS Region</text>
  <rect x="90" y="340" width="220" height="40" rx="6" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="200" y="366" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-dk)" text-anchor="middle">Load Balancer (ALB)</text>
  <rect x="90" y="395" width="100" height="60" rx="6" fill="var(--bg)" stroke="var(--primary)" stroke-width="1"/>
  <text x="140" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)" text-anchor="middle">App Server</text>
  <text x="140" y="445" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">x3</text>
  <rect x="210" y="395" width="100" height="60" rx="6" fill="var(--bg)" stroke="var(--primary)" stroke-width="1"/>
  <text x="260" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)" text-anchor="middle">Database</text>
  <text x="260" y="445" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">RDS</text>
  <rect x="90" y="470" width="220" height="30" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1"/>
  <text x="200" y="490" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">HEALTHY</text>
  <text x="200" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Primary (weight: 70%)</text>
  <!-- Azure Region -->
  <rect x="500" y="270" width="280" height="310" rx="14" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="500" y="270" width="280" height="50" rx="14" fill="url(#grad-info)"/>
  <rect x="500" y="306" width="280" height="14" fill="url(#grad-info)"/>
  <text x="640" y="303" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Azure Region</text>
  <rect x="530" y="340" width="220" height="40" rx="6" fill="var(--info-lt)" stroke="var(--info)" stroke-width="1"/>
  <text x="640" y="366" font-family="Arial, sans-serif" font-size="14" fill="var(--info-dk)" text-anchor="middle">Load Balancer (ALB)</text>
  <rect x="530" y="395" width="100" height="60" rx="6" fill="var(--bg)" stroke="var(--info)" stroke-width="1"/>
  <text x="580" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--info-dk)" text-anchor="middle">App Server</text>
  <text x="580" y="445" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">x2</text>
  <rect x="650" y="395" width="100" height="60" rx="6" fill="var(--bg)" stroke="var(--info)" stroke-width="1"/>
  <text x="700" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--info-dk)" text-anchor="middle">Database</text>
  <text x="700" y="445" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Azure SQL</text>
  <rect x="530" y="470" width="220" height="30" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1"/>
  <text x="640" y="490" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">HEALTHY</text>
  <text x="640" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Secondary (weight: 20%)</text>
  <!-- GCP Region -->
  <rect x="940" y="270" width="280" height="310" rx="14" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="270" width="280" height="50" rx="14" fill="url(#grad-ok)"/>
  <rect x="940" y="306" width="280" height="14" fill="url(#grad-ok)"/>
  <text x="1080" y="303" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCP Region</text>
  <rect x="970" y="340" width="220" height="40" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1080" y="366" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)" text-anchor="middle">Load Balancer (GLB)</text>
  <rect x="970" y="395" width="100" height="60" rx="6" fill="var(--bg)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1020" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle">App Server</text>
  <text x="1020" y="445" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">x2</text>
  <rect x="1090" y="395" width="100" height="60" rx="6" fill="var(--bg)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1140" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle">Database</text>
  <text x="1140" y="445" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Cloud SQL</text>
  <rect x="970" y="470" width="220" height="30" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1080" y="490" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">HEALTHY</text>
  <text x="1080" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Standby (weight: 10%)</text>
  <!-- Bottom legend -->
  <rect x="300" y="600" width="680" height="30" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="621" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">DNS TTL: 60s | Health check interval: 30s | Failover time: ~90s</text>
</svg>
  <rect x="949.375" y="465.9375" width="206.25" height="27.1875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1052.5" y="484.0625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">HEALTHY</text>
  <text x="1052.5" y="529.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Standby (weight: 10%)</text>

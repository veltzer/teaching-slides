  <rect x="536.875" y="397.9688" width="93.75" height="54.375" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="583.75" y="425.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" text-anchor="middle">App Server</text>
  <text x="583.75" y="443.2812" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">x2</text>
  <rect x="649.375" y="397.9688" width="93.75" height="54.375" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="696.25" y="425.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" text-anchor="middle">Database</text>
  <text x="696.25" y="443.2812" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">Azure SQL</text>
  <rect x="536.875" y="465.9375" width="206.25" height="27.1875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="484.0625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">HEALTHY</text>
  <text x="640" y="529.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Secondary (weight: 20%)</text>
  <!-- GCP Region -->
  <rect x="921.25" y="284.6875" width="262.5" height="280.9375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="921.25" y="284.6875" width="262.5" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>

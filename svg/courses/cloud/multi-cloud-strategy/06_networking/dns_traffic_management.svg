<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Global DNS at top -->
  <rect x="433.75" y="67.1875" width="412.5" height="81.5625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="103.4375" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--text)" text-anchor="middle">Global DNS</text>
  <text x="640" y="130.625" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--text-muted)" text-anchor="middle">Route 53 / Traffic Manager / Cloud DNS</text>
  <!-- Routing policies -->
  <rect x="227.5" y="166.875" width="187.5" height="31.7188" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="321.25" y="187.7188" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Latency-based</text>
  <rect x="452.5" y="166.875" width="187.5" height="31.7188" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="546.25" y="187.7188" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Failover</text>
  <rect x="677.5" y="166.875" width="187.5" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="771.25" y="187.7188" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Weighted</text>
  <rect x="902.5" y="166.875" width="187.5" height="31.7188" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="996.25" y="187.7188" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Geolocation</text>
  <!-- Arrows from DNS to regions -->
  <line x1="527.5" y1="148.75" x2="227.5" y2="284.6875" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="148.75" x2="640" y2="284.6875" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="752.5" y1="148.75" x2="1052.5" y2="284.6875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Health check arrows (dashed, from DNS back up) -->
  <line x1="199.375" y1="284.6875" x2="508.75" y2="148.75" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="611.875" y1="284.6875" x2="621.25" y2="148.75" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1024.375" y1="284.6875" x2="771.25" y2="148.75" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="368.125" y="230.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" transform="rotate(-30,350,210)">health check</text>
  <text x="621.25" y="230.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">health check</text>
  <text x="883.75" y="230.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" transform="rotate(30,900,210)">health check</text>
  <!-- AWS Region -->
  <rect x="96.25" y="284.6875" width="262.5" height="280.9375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96.25" y="284.6875" width="262.5" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="96.25" y="317.3125" width="262.5" height="12.6875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="314.5938" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS Region</text>
  <rect x="124.375" y="348.125" width="206.25" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="371.6875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">Load Balancer (ALB)</text>
  <rect x="124.375" y="397.9688" width="93.75" height="54.375" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>

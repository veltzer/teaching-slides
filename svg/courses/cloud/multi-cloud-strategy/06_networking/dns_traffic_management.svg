  <rect x="124.375" y="465.9375" width="206.25" height="27.1875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="227.5" y="484.0625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">HEALTHY</text>
  <text x="227.5" y="529.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Primary (weight: 70%)</text>
  <!-- Azure Region -->
  <rect x="508.75" y="284.6875" width="262.5" height="280.9375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Layer 4 (top): Application Workloads -->
  <rect x="190" y="67.1875" width="900" height="99.6875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="103.4375" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Application Workloads</text>
  <text x="640" y="130.625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)" text-anchor="middle">Containers, Deployments, ConfigMaps, Secrets -- fully portable</text>
  <text x="640" y="153.2812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Your microservices, APIs, workers, cron jobs</text>
  <!-- Layer 3: Platform Layer -->
  <rect x="190" y="185" width="900" height="99.6875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="221.25" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Platform Layer</text>
  <text x="283.75" y="252.9688" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Service Mesh (Istio)</text>
  <text x="527.5" y="252.9688" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Observability (Prometheus)</text>
  <text x="808.75" y="252.9688" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Security (OPA, Cert-Manager)</text>
  <text x="640" y="273.8125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Logging, monitoring, policy enforcement -- mostly portable</text>
  <!-- Portability boundary line -->
  <line x1="133.75" y1="316.4062" x2="1146.25" y2="316.4062" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="12,6"/>
  <rect x="452.5" y="302.8125" width="375" height="27.1875" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="321.8438" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">PORTABILITY BOUNDARY</text>
  <text x="96.25" y="348.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Portable above</text>
  <text x="96.25" y="364.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">Cloud-specific below</text>
  <!-- Layer 2: Managed K8s -->
  <rect x="190" y="357.1875" width="900" height="99.6875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="393.4375" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Managed Kubernetes</text>
  <rect x="246.25" y="407.0312" width="168.75" height="31.7188" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="330.625" y="427.875" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">EKS</text>
  <rect x="555.625" y="407.0312" width="168.75" height="31.7188" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="427.875" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">AKS</text>
  <rect x="865" y="407.0312" width="168.75" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="949.375" y="427.875" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">GKE</text>
  <!-- Layer 1 (bottom): Cloud Provider -->
  <rect x="190" y="475" width="900" height="117.8125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="511.25" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Cloud Provider Infrastructure</text>
  <rect x="227.5" y="529.375" width="206.25" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="330.625" y="552.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">AWS (VPC, IAM, ELB)</text>
  <text x="330.625" y="567.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">Region-specific</text>
  <rect x="536.875" y="529.375" width="206.25" height="45.3125" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="552.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--info-accent)" text-anchor="middle">Azure (VNet, AD, ALB)</text>
  <text x="640" y="567.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">Subscription-specific</text>
  <rect x="846.25" y="529.375" width="206.25" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="949.375" y="552.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">GCP (VPC, IAM, GLB)</text>
  <text x="949.375" y="567.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">Project-specific</text>
</svg>
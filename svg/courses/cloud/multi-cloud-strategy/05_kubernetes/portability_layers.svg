<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Layer 4 (top): Application Workloads -->
  <rect x="160" y="30" width="960" height="110" rx="14" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="70" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Application Workloads</text>
  <text x="640" y="100" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)" text-anchor="middle">Containers, Deployments, ConfigMaps, Secrets -- fully portable</text>
  <text x="640" y="125" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">Your microservices, APIs, workers, cron jobs</text>
  <!-- Layer 3: Platform Layer -->
  <rect x="160" y="160" width="960" height="110" rx="14" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="200" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Platform Layer</text>
  <text x="260" y="235" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Service Mesh (Istio)</text>
  <text x="520" y="235" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Observability (Prometheus)</text>
  <text x="820" y="235" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Security (OPA, Cert-Manager)</text>
  <text x="640" y="258" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">Logging, monitoring, policy enforcement -- mostly portable</text>
  <!-- Portability boundary line -->
  <line x1="100" y1="305" x2="1180" y2="305" stroke="var(--danger)" stroke-width="3" stroke-dasharray="12,6"/>
  <rect x="440" y="290" width="400" height="30" rx="6" fill="var(--bg)" stroke="var(--danger)" stroke-width="2"/>
  <text x="640" y="311" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger)" text-anchor="middle">PORTABILITY BOUNDARY</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">Portable above</text>
  <text x="60" y="358" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)">Cloud-specific below</text>
  <!-- Layer 2: Managed K8s -->
  <rect x="160" y="350" width="960" height="110" rx="14" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="390" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Managed Kubernetes</text>
  <rect x="220" y="405" width="180" height="35" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="310" y="428" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">EKS</text>
  <rect x="550" y="405" width="180" height="35" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1"/>
  <text x="640" y="428" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">AKS</text>
  <rect x="880" y="405" width="180" height="35" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="970" y="428" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">GKE</text>
  <!-- Layer 1 (bottom): Cloud Provider -->
  <rect x="160" y="480" width="960" height="130" rx="14" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="520" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Cloud Provider Infrastructure</text>
  <rect x="200" y="540" width="220" height="50" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="310" y="565" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-dk)" text-anchor="middle">AWS (VPC, IAM, ELB)</text>
  <text x="310" y="582" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Region-specific</text>
  <rect x="530" y="540" width="220" height="50" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1"/>
  <text x="640" y="565" font-family="Arial, sans-serif" font-size="14" fill="var(--info-dk)" text-anchor="middle">Azure (VNet, AD, ALB)</text>
  <text x="640" y="582" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Subscription-specific</text>
  <rect x="860" y="540" width="220" height="50" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="970" y="565" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)" text-anchor="middle">GCP (VPC, IAM, GLB)</text>
  <text x="970" y="582" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Project-specific</text>
</svg>
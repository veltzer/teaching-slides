<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-both" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <!-- Kubernetes API at top -->
  <rect x="329.655172" y="40" width="620.689655" height="79.607843" rx="7.060446" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="90.039216" font-family="Arial, sans-serif" font-size="26.031629" font-weight="bold" fill="var(--text)" text-anchor="middle">Kubernetes API (unified interface)</text>
  <!-- Arrows from API to each service -->
  <line x1="433.103448" y1="119.607843" x2="184.827586" y2="199.215686" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="119.607843" x2="640" y2="199.215686" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="846.896552" y1="119.607843" x2="1095.172414" y2="199.215686" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- EKS -->
  <rect x="40" y="199.215686" width="289.655172" height="272.941176" rx="7.060446" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="199.215686" width="289.655172" height="56.862745" rx="7.060446" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="240.156863" width="289.655172" height="15.921569" fill="var(--primary-fill)" rx="7.060446" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586" y="236.745161" font-family="Arial, sans-serif" font-size="23.862307" font-weight="bold" fill="var(--bg)" text-anchor="middle">EKS (AWS)</text>
  <text x="184.827586" y="301.568627" font-family="Arial, sans-serif" font-size="17.354459" fill="var(--text-muted)" text-anchor="middle">Managed K8s on AWS</text>
  <rect x="71.034483" y="324.313725" width="227.586207" height="39.803984" rx="7.060446" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586" y="350.470651" font-family="Arial, sans-serif" font-size="15.185137" fill="var(--primary-accent)" text-anchor="middle">Pods, Services, Ingress</text>
  <rect x="71.034483" y="375.490133" width="227.586207" height="39.803984" rx="7.060446" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586" y="401.647059" font-family="Arial, sans-serif" font-size="15.185137" fill="var(--primary-accent)" text-anchor="middle">ALB, EBS CSI Driver</text>
  <!-- AKS -->
  <rect x="495.172414" y="199.215686" width="289.655172" height="272.941176" rx="7.060446" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="495.172414" y="199.215686" width="289.655172" height="56.862745" rx="7.060446" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="495.172414" y="240.156863" width="289.655172" height="15.921569" fill="var(--info-fill)" rx="7.060446" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="236.745161" font-family="Arial, sans-serif" font-size="23.862307" font-weight="bold" fill="var(--bg)" text-anchor="middle">AKS (Azure)</text>
  <text x="640" y="301.568627" font-family="Arial, sans-serif" font-size="17.354459" fill="var(--text-muted)" text-anchor="middle">Managed K8s on Azure</text>
  <rect x="526.206897" y="324.313725" width="227.586207" height="39.803984" rx="7.060446" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="350.470651" font-family="Arial, sans-serif" font-size="15.185137" fill="var(--info-accent)" text-anchor="middle">Pods, Services, Ingress</text>
  <rect x="526.206897" y="375.490133" width="227.586207" height="39.803984" rx="7.060446" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="401.647059" font-family="Arial, sans-serif" font-size="15.185137" fill="var(--info-accent)" text-anchor="middle">Azure LB, Disk CSI</text>
  <!-- GKE -->
  <rect x="950.344828" y="199.215686" width="289.655172" height="272.941176" rx="7.060446" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="950.344828" y="199.215686" width="289.655172" height="56.862745" rx="7.060446" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="950.344828" y="240.156863" width="289.655172" height="15.921569" fill="var(--ok-fill)" rx="7.060446" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172414" y="236.745161" font-family="Arial, sans-serif" font-size="23.862307" font-weight="bold" fill="var(--bg)" text-anchor="middle">GKE (GCP)</text>
  <text x="1095.172414" y="301.568627" font-family="Arial, sans-serif" font-size="17.354459" fill="var(--text-muted)" text-anchor="middle">Managed K8s on GCP</text>
  <rect x="981.37931" y="324.313725" width="227.586207" height="39.803984" rx="7.060446" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172414" y="350.470651" font-family="Arial, sans-serif" font-size="15.185137" fill="var(--ok-accent)" text-anchor="middle">Pods, Services, Ingress</text>
  <rect x="981.37931" y="375.490133" width="227.586207" height="39.803984" rx="7.060446" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172414" y="401.647059" font-family="Arial, sans-serif" font-size="15.185137" fill="var(--ok-accent)" text-anchor="middle">GCP LB, PD CSI</text>
  <!-- Bidirectional arrows between clusters -->
  <line x1="329.655172" y1="335.686275" x2="495.172414" y2="335.686275" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="334.827586,329.999937 324.482759,335.686275 334.827586,341.372612" fill="var(--warn-fill)"/>
  <polygon points="490,329.999937 500.344828,335.686275 490,341.372612" fill="var(--warn-fill)"/>
  <line x1="784.827586" y1="335.686275" x2="950.344828" y2="335.686275" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="790,329.999937 779.655172,335.686275 790,341.372612" fill="var(--warn-fill)"/>
  <polygon points="945.172414,329.999937 955.517241,335.686275 945.172414,341.372612" fill="var(--warn-fill)"/>
  <text x="412.413793" y="324.313725" font-family="Arial, sans-serif" font-size="11.931212" fill="var(--warn-accent)" text-anchor="middle">migrate</text>
  <text x="867.586207" y="324.313725" font-family="Arial, sans-serif" font-size="11.931212" fill="var(--warn-accent)" text-anchor="middle">migrate</text>
  <!-- Common tools below -->
  <rect x="184.827586" y="529.019608" width="910.344828" height="90.980392" rx="7.060446" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="568.823592" font-family="Arial, sans-serif" font-size="19.523781" font-weight="bold" fill="var(--text)" text-anchor="middle">Common Tooling Across All Clusters</text>
  <rect x="226.206897" y="585.882353" width="124.137931" height="27.294118" rx="7.060446" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="288.275862" y="605.215749" font-family="Arial, sans-serif" font-size="15.185137" fill="var(--warn-accent)" text-anchor="middle">Helm</text>
  <rect x="381.37931" y="585.882353" width="124.137931" height="27.294118" rx="7.060446" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="443.448276" y="605.215749" font-family="Arial, sans-serif" font-size="15.185137" fill="var(--ok-accent)" text-anchor="middle">ArgoCD</text>
  <rect x="536.551724" y="585.882353" width="155.172414" height="27.294118" rx="7.060446" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="614.137931" y="605.215749" font-family="Arial, sans-serif" font-size="15.185137" fill="var(--primary-accent)" text-anchor="middle">Prometheus</text>
  <rect x="722.758621" y="585.882353" width="124.137931" height="27.294118" rx="7.060446" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.827586" y="605.215749" font-family="Arial, sans-serif" font-size="15.185137" fill="var(--info-accent)" text-anchor="middle">Grafana</text>
  <rect x="877.931034" y="585.882353" width="165.517241" height="27.294118" rx="7.060446" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960.689655" y="605.215749" font-family="Arial, sans-serif" font-size="15.185137" fill="var(--danger-accent)" text-anchor="middle">OPA / Gatekeeper</text>
</svg>
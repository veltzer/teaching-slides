<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-both" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Kubernetes API at top -->
  <rect x="340" y="30" width="600" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="74" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)" text-anchor="middle">Kubernetes API (unified interface)</text>
  <!-- Arrows from API to each service -->
  <line x1="440" y1="100" x2="200" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="100" x2="640" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="100" x2="1080" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- EKS -->
  <rect x="60" y="170" width="280" height="240" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="170" width="280" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="60" y="206" width="280" height="14" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200" y="203" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">EKS (AWS)</text>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)" text-anchor="middle">Managed K8s on AWS</text>
  <rect x="90" y="280" width="220" height="35" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200" y="303" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)" text-anchor="middle">Pods, Services, Ingress</text>
  <rect x="90" y="325" width="220" height="35" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200" y="348" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)" text-anchor="middle">ALB, EBS CSI Driver</text>
  <!-- AKS -->
  <rect x="500" y="170" width="280" height="240" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="500" y="170" width="280" height="50" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="500" y="206" width="280" height="14" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="203" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">AKS (Azure)</text>
  <text x="640" y="260" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)" text-anchor="middle">Managed K8s on Azure</text>
  <rect x="530" y="280" width="220" height="35" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="303" font-family="Arial, sans-serif" font-size="14" fill="var(--info-accent)" text-anchor="middle">Pods, Services, Ingress</text>
  <rect x="530" y="325" width="220" height="35" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="348" font-family="Arial, sans-serif" font-size="14" fill="var(--info-accent)" text-anchor="middle">Azure LB, Disk CSI</text>
  <!-- GKE -->
  <rect x="940" y="170" width="280" height="240" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="170" width="280" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="940" y="206" width="280" height="14" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1080" y="203" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">GKE (GCP)</text>
  <text x="1080" y="260" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)" text-anchor="middle">Managed K8s on GCP</text>
  <rect x="970" y="280" width="220" height="35" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1080" y="303" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" text-anchor="middle">Pods, Services, Ingress</text>
  <rect x="970" y="325" width="220" height="35" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1080" y="348" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" text-anchor="middle">GCP LB, PD CSI</text>
  <!-- Bidirectional arrows between clusters -->
  <line x1="340" y1="290" x2="500" y2="290" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="345,285 335,290 345,295" fill="var(--warn-fill)"/>
  <polygon points="495,285 505,290 495,295" fill="var(--warn-fill)"/>
  <line x1="780" y1="290" x2="940" y2="290" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="785,285 775,290 785,295" fill="var(--warn-fill)"/>
  <polygon points="935,285 945,290 935,295" fill="var(--warn-fill)"/>
  <text x="420" y="280" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)" text-anchor="middle">migrate</text>
  <text x="860" y="280" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)" text-anchor="middle">migrate</text>
  <!-- Common tools below -->
  <rect x="200" y="460" width="880" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)" text-anchor="middle">Common Tooling Across All Clusters</text>
  <rect x="240" y="510" width="120" height="24" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="300" y="527" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-accent)" text-anchor="middle">Helm</text>
  <rect x="390" y="510" width="120" height="24" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="450" y="527" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" text-anchor="middle">ArgoCD</text>
  <rect x="540" y="510" width="150" height="24" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="615" y="527" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)" text-anchor="middle">Prometheus</text>
  <rect x="720" y="510" width="120" height="24" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="780" y="527" font-family="Arial, sans-serif" font-size="14" fill="var(--info-accent)" text-anchor="middle">Grafana</text>
  <rect x="870" y="510" width="160" height="24" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="950" y="527" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)" text-anchor="middle">OPA / Gatekeeper</text>
</svg>
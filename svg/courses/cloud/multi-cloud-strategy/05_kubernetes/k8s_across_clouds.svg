<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-both" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Kubernetes API at top -->
  <rect x="358.75" y="67.1875" width="562.5" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="107.0625" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--text)" text-anchor="middle">Kubernetes API (unified interface)</text>
  <!-- Arrows from API to each service -->
  <line x1="452.5" y1="130.625" x2="227.5" y2="194.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="130.625" x2="640" y2="194.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="827.5" y1="130.625" x2="1052.5" y2="194.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- EKS -->
  <rect x="96.25" y="194.0625" width="262.5" height="217.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96.25" y="194.0625" width="262.5" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="96.25" y="226.6875" width="262.5" height="12.6875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="223.9688" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">EKS (AWS)</text>
  <text x="227.5" y="275.625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)" text-anchor="middle">Managed K8s on AWS</text>
  <rect x="124.375" y="293.75" width="206.25" height="31.7188" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="314.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">Pods, Services, Ingress</text>
  <rect x="124.375" y="334.5312" width="206.25" height="31.7188" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="355.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">ALB, EBS CSI Driver</text>
  <!-- AKS -->
  <rect x="508.75" y="194.0625" width="262.5" height="217.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="508.75" y="194.0625" width="262.5" height="45.3125" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="508.75" y="226.6875" width="262.5" height="12.6875" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="223.9688" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">AKS (Azure)</text>
  <text x="640" y="275.625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)" text-anchor="middle">Managed K8s on Azure</text>
  <rect x="536.875" y="293.75" width="206.25" height="31.7188" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="314.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--info-accent)" text-anchor="middle">Pods, Services, Ingress</text>
  <rect x="536.875" y="334.5312" width="206.25" height="31.7188" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="355.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--info-accent)" text-anchor="middle">Azure LB, Disk CSI</text>
  <!-- GKE -->
  <rect x="921.25" y="194.0625" width="262.5" height="217.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="921.25" y="194.0625" width="262.5" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="921.25" y="226.6875" width="262.5" height="12.6875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1052.5" y="223.9688" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">GKE (GCP)</text>
  <text x="1052.5" y="275.625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)" text-anchor="middle">Managed K8s on GCP</text>
  <rect x="949.375" y="293.75" width="206.25" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1052.5" y="314.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">Pods, Services, Ingress</text>
  <rect x="949.375" y="334.5312" width="206.25" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1052.5" y="355.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">GCP LB, PD CSI</text>
  <!-- Bidirectional arrows between clusters -->
  <line x1="358.75" y1="302.8125" x2="508.75" y2="302.8125" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="363.4375,298.2812 354.0625,302.8125 363.4375,307.3438" fill="var(--warn-fill)"/>
  <polygon points="504.0625,298.2812 513.4375,302.8125 504.0625,307.3438" fill="var(--warn-fill)"/>
  <line x1="771.25" y1="302.8125" x2="921.25" y2="302.8125" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="775.9375,298.2812 766.5625,302.8125 775.9375,307.3438" fill="var(--warn-fill)"/>
  <polygon points="916.5625,298.2812 925.9375,302.8125 916.5625,307.3438" fill="var(--warn-fill)"/>
  <text x="433.75" y="293.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle">migrate</text>
  <text x="846.25" y="293.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle">migrate</text>
  <!-- Common tools below -->
  <rect x="227.5" y="456.875" width="825" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="488.5938" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)" text-anchor="middle">Common Tooling Across All Clusters</text>
  <rect x="265" y="502.1875" width="112.5" height="21.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="321.25" y="517.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--warn-accent)" text-anchor="middle">Helm</text>
  <rect x="405.625" y="502.1875" width="112.5" height="21.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="461.875" y="517.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">ArgoCD</text>
  <rect x="546.25" y="502.1875" width="140.625" height="21.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="616.5625" y="517.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">Prometheus</text>
  <rect x="715" y="502.1875" width="112.5" height="21.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="771.25" y="517.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--info-accent)" text-anchor="middle">Grafana</text>
  <rect x="855.625" y="502.1875" width="150" height="21.75" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="930.625" y="517.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)" text-anchor="middle">OPA / Gatekeeper</text>
</svg>
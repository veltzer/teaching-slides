<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Axes -->
  <!-- Y-axis -->
  <line x1="180" y1="580" x2="180" y2="40" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="90" y="320" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)" text-anchor="middle" transform="rotate(-90,90,320)">Business Benefit</text>
  <text x="160" y="575" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="end">Low</text>
  <text x="160" y="60" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="end">High</text>
  <!-- X-axis -->
  <line x1="180" y1="580" x2="1220" y2="580" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="628" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)" text-anchor="middle">Multi-Cloud Complexity</text>
  <text x="200" y="610" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Low</text>
  <text x="1180" y="610" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="end">High</text>
  <!-- Quadrant dividers -->
  <line x1="700" y1="50" x2="700" y2="575" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="185" y1="310" x2="1210" y2="310" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Quadrant backgrounds -->
  <!-- Top-left: Sweet Spot (ok) -->
  <rect x="185" y="50" width="512" height="258" fill="var(--ok-fill)" opacity="0.5" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="441" y="90" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Sweet Spot</text>
  <text x="441" y="118" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-accent)" text-anchor="middle">High benefit, low complexity</text>
  <text x="441" y="142" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Best multi-cloud candidates</text>
  <!-- Top-right: Justified Complexity (warn) -->
  <rect x="703" y="50" width="512" height="258" fill="var(--warn-fill)" opacity="0.5" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="959" y="90" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Justified Complexity</text>
  <text x="959" y="118" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-accent)" text-anchor="middle">Worth the investment</text>
  <text x="959" y="142" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Requires strong platform team</text>
  <!-- Bottom-left: Single Cloud is Fine (primary) -->
  <rect x="185" y="313" width="512" height="262" fill="var(--primary-fill)" opacity="0.5" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="441" y="355" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Single Cloud is Fine</text>
  <text x="441" y="383" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-accent)" text-anchor="middle">No compelling reason to go multi</text>
  <text x="441" y="407" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Most startups and small orgs</text>
  <!-- Bottom-right: Avoid (danger) -->
  <rect x="703" y="313" width="512" height="262" fill="var(--danger-fill)" opacity="0.5" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="959" y="355" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Avoid</text>
  <text x="959" y="383" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-accent)" text-anchor="middle">Complexity without payoff</text>
  <text x="959" y="407" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Resume-driven architecture</text>
  <!-- Plot workload dots -->
  <!-- Sweet spot dots -->
  <circle cx="340" cy="180" r="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="365" y="186" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">DR failover</text>
  <circle cx="500" cy="200" r="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="525" y="206" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Data residency</text>
  <circle cx="380" cy="240" r="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="405" y="246" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Best-of-breed ML</text>
  <!-- Justified dots -->
  <circle cx="850" cy="150" r="14" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="875" y="156" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Global SaaS</text>
  <circle cx="950" cy="220" r="14" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="975" y="226" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Gov + Commercial</text>
  <!-- Single cloud dots -->
  <circle cx="320" cy="420" r="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="345" y="426" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Internal app</text>
  <circle cx="450" cy="470" r="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="475" y="476" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Startup MVP</text>
  <!-- Avoid dots -->
  <circle cx="900" cy="450" r="14" fill="var(--danger-fill)" filter="url(#shadow)"/>
  <text x="925" y="456" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Small team, all clouds</text>
  <circle cx="1050" cy="500" r="14" fill="var(--danger-fill)" filter="url(#shadow)"/>
  <text x="920" y="506" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">No clear driver</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Axes -->
  <!-- Y-axis -->
  <line x1="208.75" y1="565.625" x2="208.75" y2="76.25" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="124.375" y="330" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text)" text-anchor="middle" transform="rotate(-90,90,320)">Business Benefit</text>
  <text x="190" y="561.0938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="end">Low</text>
  <text x="190" y="94.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="end">High</text>
  <!-- X-axis -->
  <line x1="208.75" y1="565.625" x2="1183.75" y2="565.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="696.25" y="609.125" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text)" text-anchor="middle">Multi-Cloud Complexity</text>
  <text x="227.5" y="592.8125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Low</text>
  <text x="1146.25" y="592.8125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="end">High</text>
  <!-- Quadrant dividers -->
  <line x1="696.25" y1="85.3125" x2="696.25" y2="561.0938" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="213.4375" y1="320.9375" x2="1174.375" y2="320.9375" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Quadrant backgrounds -->
  <!-- Top-left: Sweet Spot (ok) -->
  <rect x="213.4375" y="85.3125" width="480" height="233.8125" fill="var(--ok-fill)" opacity="0.5" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="453.4375" y="121.5625" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Sweet Spot</text>
  <text x="453.4375" y="146.9375" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--ok-accent)" text-anchor="middle">High benefit, low complexity</text>
  <text x="453.4375" y="168.6875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Best multi-cloud candidates</text>
  <!-- Top-right: Justified Complexity (warn) -->
  <rect x="699.0625" y="85.3125" width="480" height="233.8125" fill="var(--warn-fill)" opacity="0.5" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="939.0625" y="121.5625" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Justified Complexity</text>
  <text x="939.0625" y="146.9375" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--warn-accent)" text-anchor="middle">Worth the investment</text>
  <text x="939.0625" y="168.6875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Requires strong platform team</text>
  <!-- Bottom-left: Single Cloud is Fine (primary) -->
  <rect x="213.4375" y="323.6562" width="480" height="237.4375" fill="var(--primary-fill)" opacity="0.5" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="453.4375" y="361.7188" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Single Cloud is Fine</text>
  <text x="453.4375" y="387.0938" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--primary-accent)" text-anchor="middle">No compelling reason to go multi</text>
  <text x="453.4375" y="408.8438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Most startups and small orgs</text>
  <!-- Bottom-right: Avoid (danger) -->
  <rect x="699.0625" y="323.6562" width="480" height="237.4375" fill="var(--danger-fill)" opacity="0.5" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="939.0625" y="361.7188" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Avoid</text>
  <text x="939.0625" y="387.0938" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--danger-accent)" text-anchor="middle">Complexity without payoff</text>
  <text x="939.0625" y="408.8438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Resume-driven architecture</text>
  <!-- Plot workload dots -->
  <!-- Sweet spot dots -->
  <circle cx="358.75" cy="203.125" r="12.9044" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="382.1875" y="208.5625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">DR failover</text>
  <circle cx="508.75" cy="221.25" r="12.9044" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="532.1875" y="226.6875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Data residency</text>
  <circle cx="396.25" cy="257.5" r="12.9044" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="419.6875" y="262.9375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Best-of-breed ML</text>
  <!-- Justified dots -->
  <circle cx="836.875" cy="175.9375" r="12.9044" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="860.3125" y="181.375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Global SaaS</text>
  <circle cx="930.625" cy="239.375" r="12.9044" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="954.0625" y="244.8125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Gov + Commercial</text>
  <!-- Single cloud dots -->
  <circle cx="340" cy="420.625" r="12.9044" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="363.4375" y="426.0625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Internal app</text>
  <circle cx="461.875" cy="465.9375" r="12.9044" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="485.3125" y="471.375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Startup MVP</text>
  <!-- Avoid dots -->
  <circle cx="883.75" cy="447.8125" r="12.9044" fill="var(--danger-fill)" filter="url(#shadow)"/>
  <text x="907.1875" y="453.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Small team, all clouds</text>
  <circle cx="1024.375" cy="493.125" r="12.9044" fill="var(--danger-fill)" filter="url(#shadow)"/>
  <text x="902.5" y="498.5625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">No clear driver</text>
</svg>
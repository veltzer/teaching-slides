<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Axes -->
  <!-- Y-axis -->
  <line x1="62.641509" y1="572.653061" x2="62.641509" y2="40" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="124.375" y="330" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text)" text-anchor="middle" transform="rotate(-90,90,320)">Business Benefit</text>
  <text x="40" y="567.721143" font-family="Arial, sans-serif" font-size="14.79419" fill="var(--text-faint)" text-anchor="end">Low</text>
  <text x="40" y="59.727891" font-family="Arial, sans-serif" font-size="14.79419" fill="var(--text-faint)" text-anchor="end">High</text>
  <!-- X-axis -->
  <line x1="62.641509" y1="572.653061" x2="1240" y2="572.653061" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="651.320755" y="620" font-family="Arial, sans-serif" font-size="21.134606" font-weight="bold" fill="var(--text)" text-anchor="middle">Multi-Cloud Complexity</text>
  <text x="85.283019" y="602.244898" font-family="Arial, sans-serif" font-size="14.79419" fill="var(--text-faint)">Low</text>
  <text x="1194.716981" y="602.244898" font-family="Arial, sans-serif" font-size="14.79419" fill="var(--text-faint)" text-anchor="end">High</text>
  <!-- Quadrant dividers -->
  <line x1="651.320755" y1="49.863946" x2="651.320755" y2="567.721143" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="68.301887" y1="306.326531" x2="1228.679245" y2="306.326531" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Quadrant backgrounds -->
  <!-- Top-left: Sweet Spot (ok) -->
  <rect x="68.301887" y="49.863946" width="579.622642" height="254.489796" fill="url(#grad-ok)" opacity="0.5" rx="6.878672" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="358.113208" y="89.319728" font-family="Arial, sans-serif" font-size="25.361436" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Sweet Spot</text>
  <text x="358.113208" y="116.938776" font-family="Arial, sans-serif" font-size="15.850869" fill="var(--ok-accent)" text-anchor="middle">High benefit, low complexity</text>
  <text x="358.113208" y="140.612245" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text-faint)" text-anchor="middle">Best multi-cloud candidates</text>
  <!-- Top-right: Justified Complexity (warn) -->
  <rect x="654.716981" y="49.863946" width="579.622642" height="254.489796" fill="url(#grad-warn)" opacity="0.5" rx="6.878672" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.528302" y="89.319728" font-family="Arial, sans-serif" font-size="25.361436" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Justified Complexity</text>
  <text x="944.528302" y="116.938776" font-family="Arial, sans-serif" font-size="15.850869" fill="var(--warn-accent)" text-anchor="middle">Worth the investment</text>
  <text x="944.528302" y="140.612245" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text-faint)" text-anchor="middle">Requires strong platform team</text>
  <!-- Bottom-left: Single Cloud is Fine (primary) -->
  <rect x="68.301887" y="309.28566" width="579.622642" height="258.435374" fill="url(#grad-primary)" opacity="0.5" rx="6.878672" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="358.113208" y="350.71434" font-family="Arial, sans-serif" font-size="25.361436" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Single Cloud is Fine</text>
  <text x="358.113208" y="378.333388" font-family="Arial, sans-serif" font-size="15.850869" fill="var(--primary-accent)" text-anchor="middle">No compelling reason to go multi</text>
  <text x="358.113208" y="402.006857" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text-faint)" text-anchor="middle">Most startups and small orgs</text>
  <!-- Bottom-right: Avoid (danger) -->
  <rect x="654.716981" y="309.28566" width="579.622642" height="258.435374" fill="url(#grad-danger)" opacity="0.5" rx="6.878672" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.528302" y="350.71434" font-family="Arial, sans-serif" font-size="25.361436" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Avoid</text>
  <text x="944.528302" y="378.333388" font-family="Arial, sans-serif" font-size="15.850869" fill="var(--danger-accent)" text-anchor="middle">Complexity without payoff</text>
  <text x="944.528302" y="402.006857" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text-faint)" text-anchor="middle">Resume-driven architecture</text>
  <!-- Plot workload dots -->
  <!-- Sweet spot dots -->
  <rect x="228.979" y="163.301" width="29.5884" height="29.5884" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="272.075472" y="184.013605" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text)">DR failover</text>
  <rect x="410.111" y="183.029" width="29.5884" height="29.5884" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="453.207547" y="203.741497" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text)">Data residency</text>
  <rect x="274.262" y="222.485" width="29.5884" height="29.5884" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="317.358491" y="243.197279" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text)">Best-of-breed ML</text>
  <!-- Justified dots -->
  <rect x="806.338" y="133.709" width="29.5884" height="29.5884" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="849.433962" y="154.421769" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text)">Global SaaS</text>
  <rect x="919.545" y="202.757" width="29.5884" height="29.5884" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="962.641509" y="223.469388" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text)">Gov + Commercial</text>
  <!-- Single cloud dots -->
  <rect x="206.338" y="400.036" width="29.5884" height="29.5884" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="249.433962" y="420.748299" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text)">Internal app</text>
  <rect x="353.508" y="449.355" width="29.5884" height="29.5884" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="396.603774" y="470.068027" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text)">Startup MVP</text>
  <!-- Avoid dots -->
  <rect x="862.942" y="429.628" width="29.5884" height="29.5884" rx="14" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="906.037736" y="450.340136" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text)">Small team, all clouds</text>
  <rect x="1032.75" y="478.947" width="29.5884" height="29.5884" rx="14" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="900.377358" y="499.659864" font-family="Arial, sans-serif" font-size="13.737511" fill="var(--text)">No clear driver</text>
</svg>

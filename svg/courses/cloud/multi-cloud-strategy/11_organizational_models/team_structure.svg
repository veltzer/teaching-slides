  <rect x="890" y="268.947368421053" width="100" height="35.614035087719" rx="8.069870322226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="292.350877192982" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--primary-text)">AWS</text>
  <rect x="1000" y="268.947368421053" width="100" height="35.614035087719" rx="8.069870322226" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="292.350877192982" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--info-text)">Azure</text>
  <rect x="1110" y="268.947368421053" width="100" height="35.614035087719" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="292.350877192982" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--warn-text)">GCP</text>

  <text x="890" y="396.140350877193" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">+ self-service</text>

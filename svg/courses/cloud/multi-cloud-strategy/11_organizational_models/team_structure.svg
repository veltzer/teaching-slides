<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Model 1: Centralized -->
  <rect x="68.125" y="67.1875" width="356.25" height="525.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="68.125" y="67.1875" width="356.25" height="49.8438" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="68.125" y="104.3438" width="356.25" height="12.6875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="246.25" y="99.8125" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Centralized</text>
  <!-- Central cloud team -->
  <rect x="133.75" y="130.625" width="206.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="236.875" y="157.8125" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Cloud Team</text>
  <text x="236.875" y="175.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">Manages all clouds</text>
  <!-- Arrows down to clouds -->
  <line x1="190" y1="185" x2="143.125" y2="221.25" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="236.875" y1="185" x2="236.875" y2="221.25" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="283.75" y1="185" x2="330.625" y2="221.25" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Three clouds -->
  <rect x="96.25" y="221.25" width="93.75" height="36.25" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="143.125" y="243.9062" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">AWS</text>
  <rect x="199.375" y="221.25" width="93.75" height="36.25" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="246.25" y="243.9062" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--info-accent)" text-anchor="middle">Azure</text>
  <rect x="302.5" y="221.25" width="93.75" height="36.25" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="349.375" y="243.9062" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">GCP</text>
  <!-- App teams request through cloud team -->
  <circle cx="143.125" cy="311.875" r="14.7479" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="171.25" y="317.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Team A</text>
  <circle cx="143.125" cy="348.125" r="14.7479" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="171.25" y="353.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Team B</text>
  <circle cx="143.125" cy="384.375" r="14.7479" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="171.25" y="389.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Team C</text>
  <!-- Pros/Cons -->
  <text x="96.25" y="429.6875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">+ Consistent standards</text>
  <text x="96.25" y="452.3438" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">+ Deep expertise</text>
  <text x="96.25" y="475" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">+ Cost control</text>
  <text x="96.25" y="506.7188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">- Bottleneck</text>
  <text x="96.25" y="529.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">- Slow delivery</text>
  <text x="96.25" y="552.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">- Single point of failure</text>
  <!-- Model 2: Federated -->
  <rect x="461.875" y="67.1875" width="356.25" height="525.625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="461.875" y="67.1875" width="356.25" height="49.8438" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="461.875" y="104.3438" width="356.25" height="12.6875" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="99.8125" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Federated</text>
  <!-- Teams each pick their cloud -->
  <rect x="490" y="130.625" width="140.625" height="45.3125" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="560.3125" y="150.5625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Team A</text>
  <text x="560.3125" y="166.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">Picks own cloud</text>
  <line x1="560.3125" y1="175.9375" x2="536.875" y2="221.25" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="490" y="221.25" width="93.75" height="31.7188" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="536.875" y="242.0938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">AWS</text>
  <rect x="668.125" y="130.625" width="140.625" height="45.3125" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="738.4375" y="150.5625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Team B</text>
  <text x="738.4375" y="166.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">Picks own cloud</text>
  <line x1="738.4375" y1="175.9375" x2="738.4375" y2="221.25" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="691.5625" y="221.25" width="93.75" height="31.7188" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="738.4375" y="242.0938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--info-accent)" text-anchor="middle">Azure</text>
  <rect x="583.75" y="275.625" width="140.625" height="45.3125" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="654.0625" y="295.5625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Team C</text>
  <text x="654.0625" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">Picks own cloud</text>
  <line x1="654.0625" y1="320.9375" x2="654.0625" y2="357.1875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="607.1875" y="357.1875" width="93.75" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="654.0625" y="378.0312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">GCP</text>
  <!-- Pros/Cons -->
  <text x="490" y="429.6875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">+ Team autonomy</text>
  <text x="490" y="452.3438" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">+ Fast delivery</text>
  <text x="490" y="475" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">+ Best tool per job</text>
  <text x="490" y="506.7188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">- Inconsistency</text>
  <text x="490" y="529.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">- Skill fragmentation</text>
  <text x="490" y="552.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">- Cost sprawl</text>
  <!-- Model 3: Platform -->
  <rect x="855.625" y="67.1875" width="356.25" height="525.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="855.625" y="67.1875" width="356.25" height="49.8438" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="855.625" y="104.3438" width="356.25" height="12.6875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="99.8125" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Platform</text>
  <!-- Platform team provides abstraction -->
  <rect x="921.25" y="130.625" width="225" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="153.2812" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Platform Team</text>
  <text x="1033.75" y="174.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">Builds abstraction layer</text>
  <!-- Abstraction layer -->
  <line x1="1033.75" y1="185" x2="1033.75" y2="212.1875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="893.125" y="212.1875" width="281.25" height="40.7812" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="237.5625" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Internal Developer Platform</text>
  <!-- Arrows down to clouds -->
  <line x1="968.125" y1="252.9688" x2="930.625" y2="293.75" stroke="var(--primary-border)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1033.75" y1="252.9688" x2="1033.75" y2="293.75" stroke="var(--info-border)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1099.375" y1="252.9688" x2="1136.875" y2="293.75" stroke="var(--ok-border)" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="883.75" y="293.75" width="93.75" height="27.1875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="930.625" y="311.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle">AWS</text>
  <rect x="986.875" y="293.75" width="93.75" height="27.1875" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1033.75" y="311.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" text-anchor="middle">Azure</text>
  <rect x="1090" y="293.75" width="93.75" height="27.1875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1136.875" y="311.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">GCP</text>
  <!-- Teams use platform -->
  <circle cx="940" cy="361.7188" r="12.9044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="963.4375" y="366.25" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Team A</text>
  <circle cx="940" cy="393.4375" r="12.9044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="963.4375" y="397.9688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Team B</text>
  <text x="1033.75" y="366.25" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">Self-service via</text>
  <text x="1033.75" y="382.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">platform API</text>
  <!-- Pros/Cons -->
  <text x="883.75" y="429.6875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">+ Best of both worlds</text>
  <text x="883.75" y="452.3438" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">+ Self-service + standards</text>
  <text x="883.75" y="475" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">+ Scalable governance</text>
  <text x="883.75" y="506.7188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">- High initial investment</text>
  <text x="883.75" y="529.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">- Platform team dependency</text>
  <text x="883.75" y="552.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">- Abstraction maintenance</text>
</svg>
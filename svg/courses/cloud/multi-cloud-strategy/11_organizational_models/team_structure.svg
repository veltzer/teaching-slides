<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Model 1: Centralized -->
  <rect x="30" y="30" width="380" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="30" width="380" height="55" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="30" y="71" width="380" height="14" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="220" y="66" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Centralized</text>
  <!-- Central cloud team -->
  <rect x="100" y="100" width="220" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="210" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Cloud Team</text>
  <text x="210" y="150" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Manages all clouds</text>
  <!-- Arrows down to clouds -->
  <line x1="160" y1="160" x2="110" y2="200" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210" y1="160" x2="210" y2="200" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="160" x2="310" y2="200" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Three clouds -->
  <rect x="60" y="200" width="100" height="40" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="110" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)" text-anchor="middle">AWS</text>
  <rect x="170" y="200" width="100" height="40" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="220" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--info-accent)" text-anchor="middle">Azure</text>
  <rect x="280" y="200" width="100" height="40" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="330" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)" text-anchor="middle">GCP</text>
  <!-- App teams request through cloud team -->
  <circle cx="110" cy="300" r="16" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="140" y="306" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Team A</text>
  <circle cx="110" cy="340" r="16" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="140" y="346" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Team B</text>
  <circle cx="110" cy="380" r="16" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="140" y="386" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Team C</text>
  <!-- Pros/Cons -->
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">+ Consistent standards</text>
  <text x="60" y="455" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">+ Deep expertise</text>
  <text x="60" y="480" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">+ Cost control</text>
  <text x="60" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">- Bottleneck</text>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">- Slow delivery</text>
  <text x="60" y="565" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">- Single point of failure</text>
  <!-- Model 2: Federated -->
  <rect x="450" y="30" width="380" height="580" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="450" y="30" width="380" height="55" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="450" y="71" width="380" height="14" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="66" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Federated</text>
  <!-- Teams each pick their cloud -->
  <rect x="480" y="100" width="150" height="50" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="555" y="122" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Team A</text>
  <text x="555" y="140" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Picks own cloud</text>
  <line x1="555" y1="150" x2="530" y2="200" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="480" y="200" width="100" height="35" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="530" y="223" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)" text-anchor="middle">AWS</text>
  <rect x="670" y="100" width="150" height="50" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="745" y="122" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Team B</text>
  <text x="745" y="140" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Picks own cloud</text>
  <line x1="745" y1="150" x2="745" y2="200" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="695" y="200" width="100" height="35" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="745" y="223" font-family="Arial, sans-serif" font-size="13" fill="var(--info-accent)" text-anchor="middle">Azure</text>
  <rect x="580" y="260" width="150" height="50" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="655" y="282" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Team C</text>
  <text x="655" y="300" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">Picks own cloud</text>
  <line x1="655" y1="310" x2="655" y2="350" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="605" y="350" width="100" height="35" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="655" y="373" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)" text-anchor="middle">GCP</text>
  <!-- Pros/Cons -->
  <text x="480" y="430" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">+ Team autonomy</text>
  <text x="480" y="455" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">+ Fast delivery</text>
  <text x="480" y="480" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">+ Best tool per job</text>
  <text x="480" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">- Inconsistency</text>
  <text x="480" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">- Skill fragmentation</text>
  <text x="480" y="565" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">- Cost sprawl</text>
  <!-- Model 3: Platform -->
  <rect x="870" y="30" width="380" height="580" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="870" y="30" width="380" height="55" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="870" y="71" width="380" height="14" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="66" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Platform</text>
  <!-- Platform team provides abstraction -->
  <rect x="940" y="100" width="240" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Platform Team</text>
  <text x="1060" y="148" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Builds abstraction layer</text>
  <!-- Abstraction layer -->
  <line x1="1060" y1="160" x2="1060" y2="190" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910" y="190" width="300" height="45" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="218" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Internal Developer Platform</text>
  <!-- Arrows down to clouds -->
  <line x1="990" y1="235" x2="950" y2="280" stroke="var(--primary-border)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1060" y1="235" x2="1060" y2="280" stroke="var(--info-border)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1130" y1="235" x2="1170" y2="280" stroke="var(--ok-border)" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="900" y="280" width="100" height="30" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="950" y="300" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" text-anchor="middle">AWS</text>
  <rect x="1010" y="280" width="100" height="30" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1060" y="300" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)" text-anchor="middle">Azure</text>
  <rect x="1120" y="280" width="100" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1170" y="300" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle">GCP</text>
  <!-- Teams use platform -->
  <circle cx="960" cy="355" r="14" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="985" y="360" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Team A</text>
  <circle cx="960" cy="390" r="14" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="985" y="395" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Team B</text>
  <text x="1060" y="360" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Self-service via</text>
  <text x="1060" y="378" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">platform API</text>
  <!-- Pros/Cons -->
  <text x="900" y="430" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">+ Best of both worlds</text>
  <text x="900" y="455" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">+ Self-service + standards</text>
  <text x="900" y="480" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">+ Scalable governance</text>
  <text x="900" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">- High initial investment</text>
  <text x="900" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">- Platform team dependency</text>
  <text x="900" y="565" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">- Abstraction maintenance</text>
</svg>
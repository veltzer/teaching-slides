<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Users on the left -->
  <rect x="40" y="200" width="200" height="240" rx="14" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Users</text>
  <!-- User icons (simple circles + bodies) -->
  <circle cx="100" cy="290" r="16" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="2"/>
  <text x="130" y="296" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Developer</text>
  <circle cx="100" cy="340" r="16" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2"/>
  <text x="130" y="346" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">DevOps</text>
  <circle cx="100" cy="390" r="16" fill="var(--info-lt)" stroke="var(--info)" stroke-width="2"/>
  <text x="130" y="396" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Admin</text>
  <!-- SSO Arrow -->
  <line x1="240" y1="320" x2="390" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">SSO</text>
  <!-- Central IdP -->
  <circle cx="540" cy="320" r="100" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="540" cy="320" r="75" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="540" y="305" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Identity</text>
  <text x="540" y="330" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Provider</text>
  <text x="540" y="355" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">(Okta, Azure AD)</text>
  <!-- SAML/OIDC labels on connections -->
  <!-- Arrow to AWS IAM -->
  <line x1="640" y1="270" x2="850" y2="120" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)" transform="rotate(-30,760,175)">SAML 2.0</text>
  <!-- Arrow to Azure AD -->
  <line x1="640" y1="320" x2="850" y2="320" stroke="var(--info)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="745" y="310" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">OIDC</text>
  <!-- Arrow to GCP IAM -->
  <line x1="640" y1="370" x2="850" y2="520" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="470" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)" transform="rotate(30,760,470)">OIDC</text>
  <!-- AWS IAM -->
  <rect x="850" y="60" width="350" height="120" rx="14" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025" y="100" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">AWS IAM</text>
  <text x="1025" y="130" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Roles, Policies, STS</text>
  <text x="1025" y="155" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Assume role via federation</text>
  <!-- Azure AD -->
  <rect x="850" y="260" width="350" height="120" rx="14" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Azure AD / Entra ID</text>
  <text x="1025" y="330" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Service Principals, RBAC</text>
  <text x="1025" y="355" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">App registrations, managed identity</text>
  <!-- GCP IAM -->
  <rect x="850" y="460" width="350" height="120" rx="14" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025" y="500" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">GCP IAM</text>
  <text x="1025" y="530" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Service Accounts, Roles</text>
  <text x="1025" y="555" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Workload identity federation</text>
  <!-- Bottom note -->
  <rect x="320" y="600" width="640" height="30" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="621" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)" text-anchor="middle">Authenticate once, access all clouds -- zero standing credentials</text>
</svg>
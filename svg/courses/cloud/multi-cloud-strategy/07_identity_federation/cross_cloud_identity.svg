<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Users on the left -->
  <rect x="77.5" y="221.25" width="187.5" height="217.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="171.25" y="257.5" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text)" text-anchor="middle">Users</text>
  <!-- User icons (simple circles + bodies) -->
  <circle cx="133.75" cy="302.8125" r="14.7479" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="161.875" y="308.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Developer</text>
  <circle cx="133.75" cy="348.125" r="14.7479" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="161.875" y="353.5625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">DevOps</text>
  <circle cx="133.75" cy="393.4375" r="14.7479" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="161.875" y="398.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Admin</text>
  <!-- SSO Arrow -->
  <line x1="265" y1="330" x2="405.625" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335.3125" y="320.9375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">SSO</text>
  <!-- Central IdP -->
  <circle cx="546.25" cy="330" r="92.1743" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="546.25" cy="330" r="69.1307" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="546.25" y="316.4062" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Identity</text>
  <text x="546.25" y="339.0625" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Provider</text>
  <text x="546.25" y="361.7188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">(Okta, Azure AD)</text>
  <!-- SAML/OIDC labels on connections -->
  <!-- Arrow to AWS IAM -->
  <line x1="640" y1="284.6875" x2="836.875" y2="148.75" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752.5" y="198.5938" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" transform="rotate(-30,760,175)">SAML 2.0</text>
  <!-- Arrow to Azure AD -->
  <line x1="640" y1="330" x2="836.875" y2="330" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="738.4375" y="320.9375" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">OIDC</text>
  <!-- Arrow to GCP IAM -->
  <line x1="640" y1="375.3125" x2="836.875" y2="511.25" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752.5" y="465.9375" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)" transform="rotate(30,760,470)">OIDC</text>
  <!-- AWS IAM -->
  <rect x="836.875" y="94.375" width="328.125" height="108.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000.9375" y="130.625" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">AWS IAM</text>
  <text x="1000.9375" y="157.8125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Roles, Policies, STS</text>
  <text x="1000.9375" y="180.4688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Assume role via federation</text>
  <!-- Azure AD -->
  <rect x="836.875" y="275.625" width="328.125" height="108.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000.9375" y="311.875" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Azure AD / Entra ID</text>
  <text x="1000.9375" y="339.0625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Service Principals, RBAC</text>
  <text x="1000.9375" y="361.7188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">App registrations, managed identity</text>
  <!-- GCP IAM -->
  <rect x="836.875" y="456.875" width="328.125" height="108.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000.9375" y="493.125" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">GCP IAM</text>
  <text x="1000.9375" y="520.3125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Service Accounts, Roles</text>
  <text x="1000.9375" y="542.9688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Workload identity federation</text>
  <!-- Bottom note -->
  <rect x="340" y="583.75" width="600" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="602.7812" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--text-muted)" text-anchor="middle">Authenticate once, access all clouds -- zero standing credentials</text>
</svg>
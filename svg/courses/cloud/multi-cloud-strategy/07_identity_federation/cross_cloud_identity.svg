<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Users on the left -->
  <rect x="40" y="182.45614" width="206.896552" height="244.210526" rx="6.678513" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="143.448276" y="223.157895" font-family="Arial, sans-serif" font-size="20.519621" font-weight="bold" fill="var(--text)" text-anchor="middle">Users</text>
  <!-- User icons (simple circles + bodies) -->
  <circle cx="102.068966" cy="274.035088" r="16.415675" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="133.103448" y="280.140351" font-family="Arial, sans-serif" font-size="13.33777" fill="var(--text-muted)">Developer</text>
  <circle cx="102.068966" cy="324.912281" r="16.415675" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="133.103448" y="331.017544" font-family="Arial, sans-serif" font-size="13.33777" fill="var(--text-muted)">DevOps</text>
  <circle cx="102.068966" cy="375.789474" r="16.415675" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="133.103448" y="381.894737" font-family="Arial, sans-serif" font-size="13.33777" fill="var(--text-muted)">Admin</text>
  <!-- SSO Arrow -->
  <line x1="246.896552" y1="304.561404" x2="402.068966" y2="304.561404" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="324.482759" y="294.385965" font-family="Arial, sans-serif" font-size="14.363701" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">SSO</text>
  <!-- Central IdP -->
  <circle cx="557.241379" cy="304.561404" r="102.597882" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="557.241379" cy="304.561404" r="76.948384" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="557.241379" y="289.298189" font-family="Arial, sans-serif" font-size="22.571483" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Identity</text>
  <text x="557.241379" y="314.736842" font-family="Arial, sans-serif" font-size="22.571483" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Provider</text>
  <text x="557.241379" y="340.175495" font-family="Arial, sans-serif" font-size="14.363701" fill="var(--text-faint)" text-anchor="middle">(Okta, Azure AD)</text>
  <!-- SAML/OIDC labels on connections -->
  <!-- Arrow to AWS IAM -->
  <line x1="660.689655" y1="253.684211" x2="877.931034" y2="101.052632" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752.5" y="198.5938" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" transform="rotate(-30,760,175)">SAML 2.0</text>
  <!-- Arrow to Azure AD -->
  <line x1="660.689655" y1="304.561404" x2="877.931034" y2="304.561404" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="769.310345" y="294.385965" font-family="Arial, sans-serif" font-size="13.33777" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">OIDC</text>
  <!-- Arrow to GCP IAM -->
  <line x1="660.689655" y1="355.438596" x2="877.931034" y2="508.070175" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752.5" y="465.9375" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)" transform="rotate(30,760,470)">OIDC</text>
  <!-- AWS IAM -->
  <rect x="877.931034" y="40" width="362.068966" height="122.105263" rx="6.678513" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.965517" y="80.701754" font-family="Arial, sans-serif" font-size="22.571483" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">AWS IAM</text>
  <text x="1058.965517" y="111.22807" font-family="Arial, sans-serif" font-size="14.363701" fill="var(--text-muted)" text-anchor="middle">Roles, Policies, STS</text>
  <text x="1058.965517" y="136.666723" font-family="Arial, sans-serif" font-size="13.33777" fill="var(--text-faint)" text-anchor="middle">Assume role via federation</text>
  <!-- Azure AD -->
  <rect x="877.931034" y="243.508772" width="362.068966" height="122.105263" rx="6.678513" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.965517" y="284.210526" font-family="Arial, sans-serif" font-size="22.571483" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Azure AD / Entra ID</text>
  <text x="1058.965517" y="314.736842" font-family="Arial, sans-serif" font-size="14.363701" fill="var(--text-muted)" text-anchor="middle">Service Principals, RBAC</text>
  <text x="1058.965517" y="340.175495" font-family="Arial, sans-serif" font-size="13.33777" fill="var(--text-faint)" text-anchor="middle">App registrations, managed identity</text>
  <!-- GCP IAM -->
  <rect x="877.931034" y="447.017544" width="362.068966" height="122.105263" rx="6.678513" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.965517" y="487.719298" font-family="Arial, sans-serif" font-size="22.571483" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">GCP IAM</text>
  <text x="1058.965517" y="518.245614" font-family="Arial, sans-serif" font-size="14.363701" fill="var(--text-muted)" text-anchor="middle">Service Accounts, Roles</text>
  <text x="1058.965517" y="543.684267" font-family="Arial, sans-serif" font-size="13.33777" fill="var(--text-faint)" text-anchor="middle">Workload identity federation</text>
  <!-- Bottom note -->
  <rect x="329.655172" y="589.473684" width="662.068966" height="30.526316" rx="6.678513" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="660.689655" y="610.842049" font-family="Arial, sans-serif" font-size="15.389632" fill="var(--text-muted)" text-anchor="middle">Authenticate once, access all clouds -- zero standing credentials</text>
</svg>
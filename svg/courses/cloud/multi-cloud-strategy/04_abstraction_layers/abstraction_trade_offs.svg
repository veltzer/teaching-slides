<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-vertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="50%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Vertical spectrum bar on left -->
  <rect x="96.25" y="76.25" width="28.125" height="516.5625" rx="6" fill="url(#grad-vertical)"/>
  <!-- Labels on spectrum -->
  <text x="143.125" y="94.375" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">Maximum Abstraction</text>
  <text x="143.125" y="112.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)">Simple but limited</text>
  <text x="143.125" y="583.75" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)">Provider-Native</text>
  <text x="143.125" y="601.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)">Powerful but locked in</text>
  <!-- Trade-off arrow on right -->
  <line x1="1146.25" y1="94.375" x2="1146.25" y2="583.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1165" y="330" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle" transform="rotate(90,1200,320)">Lock-in increases</text>
  <line x1="1108.75" y1="583.75" x2="1108.75" y2="94.375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1090" y="330" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle" transform="rotate(-90,1120,320)">Portability increases</text>
  <!-- Item 1: Crossplane (upper) -->
  <line x1="124.375" y1="157.8125" x2="321.25" y2="157.8125" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="321.25" y="121.5625" width="318.75" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480.625" y="153.2812" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Crossplane</text>
  <text x="480.625" y="175.9375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">K8s-native, declarative, highly abstract</text>
  <!-- Item 2: Terraform (middle-upper) -->
  <line x1="124.375" y1="275.625" x2="321.25" y2="275.625" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="321.25" y="239.375" width="318.75" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480.625" y="271.0938" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Terraform</text>
  <text x="480.625" y="293.75" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Multi-cloud IaC, provider plugins</text>
  <!-- Item 3: Pulumi (middle) -->
  <line x1="124.375" y1="384.375" x2="677.5" y2="384.375" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="677.5" y="348.125" width="318.75" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="836.875" y="379.8438" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Pulumi</text>
  <text x="836.875" y="402.5" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Real programming languages, flexible</text>
  <!-- Item 4: Cloud-native SDKs (bottom) -->
  <line x1="124.375" y1="511.25" x2="321.25" y2="511.25" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="321.25" y="475" width="318.75" height="72.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480.625" y="506.7188" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Cloud-Native SDKs</text>
  <text x="480.625" y="529.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Full power, provider-specific APIs</text>
  <!-- Annotations -->
  <rect x="696.25" y="130.625" width="337.5" height="54.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="865" y="157.8125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Lowest common denominator features</text>
  <text x="865" y="174.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">May miss provider-unique capabilities</text>
  <rect x="696.25" y="479.5312" width="337.5" height="54.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="865" y="506.7188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Access all features, but migration is hard</text>
  <text x="865" y="523.0312" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">Rewrite needed to switch providers</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-vertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="50%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Vertical spectrum bar on left -->
  <rect x="60" y="40" width="30" height="570" rx="6" fill="url(#grad-vertical)"/>
  <!-- Labels on spectrum -->
  <text x="110" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Maximum Abstraction</text>
  <text x="110" y="80" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Simple but limited</text>
  <text x="110" y="600" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)">Provider-Native</text>
  <text x="110" y="620" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Powerful but locked in</text>
  <!-- Trade-off arrow on right -->
  <line x1="1180" y1="60" x2="1180" y2="600" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1200" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle" transform="rotate(90,1200,320)">Lock-in increases</text>
  <line x1="1140" y1="600" x2="1140" y2="60" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1120" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle" transform="rotate(-90,1120,320)">Portability increases</text>
  <!-- Item 1: Crossplane (upper) -->
  <line x1="90" y1="130" x2="300" y2="130" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="300" y="90" width="340" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="125" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Crossplane</text>
  <text x="470" y="150" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">K8s-native, declarative, highly abstract</text>
  <!-- Item 2: Terraform (middle-upper) -->
  <line x1="90" y1="260" x2="300" y2="260" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="300" y="220" width="340" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="255" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Terraform</text>
  <text x="470" y="280" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">Multi-cloud IaC, provider plugins</text>
  <!-- Item 3: Pulumi (middle) -->
  <line x1="90" y1="380" x2="680" y2="380" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="680" y="340" width="340" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="375" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Pulumi</text>
  <text x="850" y="400" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">Real programming languages, flexible</text>
  <!-- Item 4: Cloud-native SDKs (bottom) -->
  <line x1="90" y1="520" x2="300" y2="520" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="300" y="480" width="340" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="515" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Cloud-Native SDKs</text>
  <text x="470" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">Full power, provider-specific APIs</text>
  <!-- Annotations -->
  <rect x="700" y="100" width="360" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="880" y="130" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Lowest common denominator features</text>
  <text x="880" y="148" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">May miss provider-unique capabilities</text>
  <rect x="700" y="485" width="360" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="880" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Access all features, but migration is hard</text>
  <text x="880" y="533" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Rewrite needed to switch providers</text>
</svg>
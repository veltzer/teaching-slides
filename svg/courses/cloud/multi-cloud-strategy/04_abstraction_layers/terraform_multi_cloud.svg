<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Modules on top -->
  <rect x="358.75" y="67.1875" width="562.5" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="105.25" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text)" text-anchor="middle">Terraform Modules (reusable components)</text>
  <!-- Arrow from modules to terraform -->
  <line x1="640" y1="130.625" x2="640" y2="194.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Terraform center -->
  <rect x="471.25" y="194.0625" width="337.5" height="108.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="239.375" font-family="Arial, sans-serif" font-size="25.8088" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Terraform</text>
  <text x="640" y="266.5625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)" text-anchor="middle">Infrastructure as Code</text>
  <text x="640" y="289.2188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">HCL Configuration</text>
  <!-- Arrow to AWS -->
  <line x1="527.5" y1="302.8125" x2="227.5" y2="393.4375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="358.75" y="339.0625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">AWS Provider</text>
  <!-- Arrow to Azure -->
  <line x1="640" y1="302.8125" x2="640" y2="393.4375" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="715" y="357.1875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--info-accent)">Azure Provider</text>
  <!-- Arrow to GCP -->
  <line x1="752.5" y1="302.8125" x2="1052.5" y2="393.4375" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="921.25" y="339.0625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">GCP Provider</text>
  <!-- AWS cloud -->
  <rect x="96.25" y="393.4375" width="262.5" height="163.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.5" y="429.6875" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">AWS</text>
  <text x="227.5" y="456.875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">EC2, S3, RDS</text>
  <text x="227.5" y="479.5312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Lambda, VPC</text>
  <rect x="133.75" y="502.1875" width="187.5" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="525.75" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">us-east-1, eu-west-1</text>
  <!-- Azure cloud -->
  <rect x="508.75" y="393.4375" width="262.5" height="163.125" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="429.6875" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Azure</text>
  <text x="640" y="456.875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">VMs, Blob, SQL</text>
  <text x="640" y="479.5312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Functions, VNet</text>
  <rect x="546.25" y="502.1875" width="187.5" height="36.25" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="525.75" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--info-accent)" text-anchor="middle">eastus, westeurope</text>
  <!-- GCP cloud -->
  <rect x="921.25" y="393.4375" width="262.5" height="163.125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.5" y="429.6875" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">GCP</text>
  <text x="1052.5" y="456.875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">GCE, GCS, Cloud SQL</text>
  <text x="1052.5" y="479.5312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Cloud Functions, VPC</text>
  <rect x="958.75" y="502.1875" width="187.5" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1052.5" y="525.75" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">us-central1, europe</text>
  <!-- State file below -->
  <rect x="471.25" y="574.6875" width="337.5" height="36.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="598.25" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">terraform.tfstate (remote backend)</text>
</svg>
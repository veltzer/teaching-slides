<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Modules on top -->
  <rect x="329.655172" y="40" width="620.689655" height="67.666667" rx="6.50941" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="80.6" font-family="Arial, sans-serif" font-size="20.000053" font-weight="bold" fill="var(--text)" text-anchor="middle">Terraform Modules (reusable components)</text>
  <!-- Arrow from modules to terraform -->
  <line x1="640" y1="107.666667" x2="640" y2="175.333333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Terraform center -->
  <rect x="453.793103" y="175.333333" width="372.413793" height="116" rx="6.50941" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="223.666667" font-family="Arial, sans-serif" font-size="28.000009" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Terraform</text>
  <text x="640" y="252.666667" font-family="Arial, sans-serif" font-size="16.00002" fill="var(--text-muted)" text-anchor="middle">Infrastructure as Code</text>
  <text x="640" y="276.833387" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--text-faint)" text-anchor="middle">HCL Configuration</text>
  <!-- Arrow to AWS -->
  <line x1="515.862069" y1="291.333333" x2="184.827586" y2="388" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="329.655172" y="330" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--primary-accent)" text-anchor="middle">AWS Provider</text>
  <!-- Arrow to Azure -->
  <line x1="640" y1="291.333333" x2="640" y2="388" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="722.758621" y="349.333333" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--info-accent)">Azure Provider</text>
  <!-- Arrow to GCP -->
  <line x1="764.137931" y1="291.333333" x2="1095.172414" y2="388" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="950.344828" y="330" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--ok-accent)" text-anchor="middle">GCP Provider</text>
  <!-- AWS cloud -->
  <rect x="40" y="388" width="289.655172" height="174" rx="6.50941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586" y="426.666667" font-family="Arial, sans-serif" font-size="23.999976" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">AWS</text>
  <text x="184.827586" y="455.666667" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--text-faint)" text-anchor="middle">EC2, S3, RDS</text>
  <text x="184.827586" y="479.83328" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--text-faint)" text-anchor="middle">Lambda, VPC</text>
  <rect x="81.37931" y="504" width="206.896552" height="38.666667" rx="6.50941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586" y="529.133333" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--primary-accent)" text-anchor="middle">us-east-1, eu-west-1</text>
  <!-- Azure cloud -->
  <rect x="495.172414" y="388" width="289.655172" height="174" rx="6.50941" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="426.666667" font-family="Arial, sans-serif" font-size="23.999976" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Azure</text>
  <text x="640" y="455.666667" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--text-faint)" text-anchor="middle">VMs, Blob, SQL</text>
  <text x="640" y="479.83328" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--text-faint)" text-anchor="middle">Functions, VNet</text>
  <rect x="536.551724" y="504" width="206.896552" height="38.666667" rx="6.50941" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="529.133333" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--info-accent)" text-anchor="middle">eastus, westeurope</text>
  <!-- GCP cloud -->
  <rect x="950.344828" y="388" width="289.655172" height="174" rx="6.50941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172414" y="426.666667" font-family="Arial, sans-serif" font-size="23.999976" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">GCP</text>
  <text x="1095.172414" y="455.666667" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--text-faint)" text-anchor="middle">GCE, GCS, Cloud SQL</text>
  <text x="1095.172414" y="479.83328" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--text-faint)" text-anchor="middle">Cloud Functions, VPC</text>
  <rect x="991.724138" y="504" width="206.896552" height="38.666667" rx="6.50941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172414" y="529.133333" font-family="Arial, sans-serif" font-size="14.000004" fill="var(--ok-accent)" text-anchor="middle">us-central1, europe</text>
  <!-- State file below -->
  <rect x="453.793103" y="581.333333" width="372.413793" height="38.666667" rx="6.50941" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="606.466667" font-family="Arial, sans-serif" font-size="16.00002" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">terraform.tfstate (remote backend)</text>
</svg>

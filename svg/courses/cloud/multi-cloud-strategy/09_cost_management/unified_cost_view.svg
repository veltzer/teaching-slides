<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Left: Three cost streams -->
  <!-- AWS Bill -->
  <rect x="40" y="60" width="280" height="140" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="60" width="280" height="45" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="93" width="280" height="12" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="92" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS Bill</text>
  <text x="180" y="135" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)" text-anchor="middle">$45,000/month</text>
  <text x="180" y="160" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">CUR, Cost Explorer</text>
  <text x="180" y="180" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">12 accounts, 3 regions</text>
  <!-- Azure Bill -->
  <rect x="40" y="240" width="280" height="140" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="240" width="280" height="45" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="40" y="273" width="280" height="12" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="180" y="272" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Azure Bill</text>
  <text x="180" y="315" font-family="Arial, sans-serif" font-size="16" fill="var(--info-accent)" text-anchor="middle">$28,000/month</text>
  <text x="180" y="340" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Cost Management API</text>
  <text x="180" y="360" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">5 subscriptions, 2 regions</text>
  <!-- GCP Bill -->
  <rect x="40" y="420" width="280" height="140" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="420" width="280" height="45" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="40" y="453" width="280" height="12" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="180" y="452" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCP Bill</text>
  <text x="180" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-accent)" text-anchor="middle">$17,000/month</text>
  <text x="180" y="520" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">BigQuery Billing Export</text>
  <text x="180" y="540" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">3 projects, 2 regions</text>
  <!-- Arrows flowing into center -->
  <line x1="320" y1="130" x2="450" y2="280" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="310" x2="450" y2="310" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="490" x2="450" y2="340" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Unified Cost Platform (center) -->
  <rect x="450" y="210" width="380" height="200" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="260" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)" text-anchor="middle">Unified Cost Platform</text>
  <text x="640" y="295" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)" text-anchor="middle">CloudHealth / Apptio / Kubecost</text>
  <rect x="490" y="320" width="300" height="35" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="344" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Total: $90,000/month</text>
  <text x="640" y="390" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">Normalize, tag, allocate, optimize</text>
  <!-- Arrows out to outputs -->
  <line x1="830" y1="260" x2="930" y2="130" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="310" x2="930" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="360" x2="930" y2="490" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Output 1: Combined Dashboards -->
  <rect x="930" y="60" width="310" height="140" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Combined Dashboards</text>
  <text x="1085" y="130" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Spend by cloud, service, team</text>
  <text x="1085" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Trend analysis, forecasting</text>
  <text x="1085" y="180" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">Executive and team views</text>
  <!-- Output 2: Per-team Reports -->
  <rect x="930" y="240" width="310" height="140" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085" y="280" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Per-Team Reports</text>
  <text x="1085" y="310" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Chargeback / showback</text>
  <text x="1085" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Budget tracking per team</text>
  <text x="1085" y="360" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">Tag-based allocation</text>
  <!-- Output 3: Anomaly Alerts -->
  <rect x="930" y="420" width="310" height="140" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085" y="460" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Anomaly Alerts</text>
  <text x="1085" y="490" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Unusual spend detection</text>
  <text x="1085" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle">Budget threshold alerts</text>
  <text x="1085" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)" text-anchor="middle">RI/savings plan recommendations</text>
</svg>
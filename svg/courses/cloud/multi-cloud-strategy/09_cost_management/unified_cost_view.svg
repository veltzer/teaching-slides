<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Left: Three cost streams -->
  <!-- AWS Bill -->
  <rect x="40" y="40" width="280" height="162.4" rx="7.010849" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="280" height="52.199936" rx="7.010849" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="78.279936" width="280" height="13.92" fill="url(#grad-primary)" rx="7.010849" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="77.12" font-family="Arial, sans-serif" font-size="21.540716" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS Bill</text>
  <text x="180" y="127.000064" font-family="Arial, sans-serif" font-size="17.232549" fill="var(--primary-accent)" text-anchor="middle">$45,000/month</text>
  <text x="180" y="156" font-family="Arial, sans-serif" font-size="14.001483" fill="var(--text-faint)" text-anchor="middle">CUR, Cost Explorer</text>
  <text x="180" y="179.2" font-family="Arial, sans-serif" font-size="14.001483" fill="var(--text-faint)" text-anchor="middle">12 accounts, 3 regions</text>
  <!-- Azure Bill -->
  <rect x="40" y="248.8" width="280" height="162.4" rx="7.010849" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="248.8" width="280" height="52.199936" rx="7.010849" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="287.079936" width="280" height="13.92" fill="url(#grad-info)" rx="7.010849" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="285.92" font-family="Arial, sans-serif" font-size="21.540716" font-weight="bold" fill="var(--bg)" text-anchor="middle">Azure Bill</text>
  <text x="180" y="335.800064" font-family="Arial, sans-serif" font-size="17.232549" fill="var(--info-accent)" text-anchor="middle">$28,000/month</text>
  <text x="180" y="364.8" font-family="Arial, sans-serif" font-size="14.001483" fill="var(--text-faint)" text-anchor="middle">Cost Management API</text>
  <text x="180" y="388" font-family="Arial, sans-serif" font-size="14.001483" fill="var(--text-faint)" text-anchor="middle">5 subscriptions, 2 regions</text>
  <!-- GCP Bill -->
  <rect x="40" y="457.6" width="280" height="162.4" rx="7.010849" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="457.6" width="280" height="52.199936" rx="7.010849" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="495.879936" width="280" height="13.92" fill="url(#grad-ok)" rx="7.010849" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="494.72" font-family="Arial, sans-serif" font-size="21.540716" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCP Bill</text>
  <text x="180" y="544.600064" font-family="Arial, sans-serif" font-size="17.232549" fill="var(--ok-accent)" text-anchor="middle">$17,000/month</text>
  <text x="180" y="573.6" font-family="Arial, sans-serif" font-size="14.001483" fill="var(--text-faint)" text-anchor="middle">BigQuery Billing Export</text>
  <text x="180" y="596.8" font-family="Arial, sans-serif" font-size="14.001483" fill="var(--text-faint)" text-anchor="middle">3 projects, 2 regions</text>
  <!-- Arrows flowing into center -->
  <line x1="320" y1="121.2" x2="450" y2="295.2" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="330" x2="450" y2="330" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="538.8" x2="450" y2="364.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Unified Cost Platform (center) -->
  <rect x="450" y="214" width="380" height="232" rx="7.010849" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="272" font-family="Arial, sans-serif" font-size="23.694682" font-weight="bold" fill="var(--text)" text-anchor="middle">Unified Cost Platform</text>
  <text x="640" y="312.600064" font-family="Arial, sans-serif" font-size="16.155449" fill="var(--text-muted)" text-anchor="middle">CloudHealth / Apptio / Kubecost</text>
  <rect x="490" y="341.6" width="300" height="40.600064" rx="7.010849" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="369.44" font-family="Arial, sans-serif" font-size="17.232549" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Total: $90,000/month</text>
  <text x="640" y="422.8" font-family="Arial, sans-serif" font-size="15.078466" fill="var(--text-faint)" text-anchor="middle">Normalize, tag, allocate, optimize</text>
  <!-- Arrows out to outputs -->
  <line x1="830" y1="272" x2="930" y2="121.2" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="330" x2="930" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="388" x2="930" y2="538.8" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Output 1: Combined Dashboards -->
  <rect x="930" y="40" width="310" height="162.4" rx="7.010849" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085" y="86.4" font-family="Arial, sans-serif" font-size="21.540716" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Combined Dashboards</text>
  <text x="1085" y="121.2" font-family="Arial, sans-serif" font-size="15.078466" fill="var(--text-muted)" text-anchor="middle">Spend by cloud, service, team</text>
  <text x="1085" y="150.200064" font-family="Arial, sans-serif" font-size="15.078466" fill="var(--text-muted)" text-anchor="middle">Trend analysis, forecasting</text>
  <text x="1085" y="179.2" font-family="Arial, sans-serif" font-size="15.078466" fill="var(--text-faint)" text-anchor="middle">Executive and team views</text>
  <!-- Output 2: Per-team Reports -->
  <rect x="930" y="248.8" width="310" height="162.4" rx="7.010849" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085" y="295.2" font-family="Arial, sans-serif" font-size="21.540716" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Per-Team Reports</text>
  <text x="1085" y="330" font-family="Arial, sans-serif" font-size="15.078466" fill="var(--text-muted)" text-anchor="middle">Chargeback / showback</text>
  <text x="1085" y="359.000064" font-family="Arial, sans-serif" font-size="15.078466" fill="var(--text-muted)" text-anchor="middle">Budget tracking per team</text>
  <text x="1085" y="388" font-family="Arial, sans-serif" font-size="15.078466" fill="var(--text-faint)" text-anchor="middle">Tag-based allocation</text>
  <!-- Output 3: Anomaly Alerts -->
  <rect x="930" y="457.6" width="310" height="162.4" rx="7.010849" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085" y="504" font-family="Arial, sans-serif" font-size="21.540716" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Anomaly Alerts</text>
  <text x="1085" y="538.8" font-family="Arial, sans-serif" font-size="15.078466" fill="var(--text-muted)" text-anchor="middle">Unusual spend detection</text>
  <text x="1085" y="567.800064" font-family="Arial, sans-serif" font-size="15.078466" fill="var(--text-muted)" text-anchor="middle">Budget threshold alerts</text>
  <text x="1085" y="596.8" font-family="Arial, sans-serif" font-size="15.078466" fill="var(--text-faint)" text-anchor="middle">RI/savings plan recommendations</text>
</svg>
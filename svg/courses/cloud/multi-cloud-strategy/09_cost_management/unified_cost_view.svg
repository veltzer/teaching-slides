<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Left: Three cost streams -->
  <!-- AWS Bill -->
  <rect x="77.5" y="94.375" width="262.5" height="126.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="77.5" y="94.375" width="262.5" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="77.5" y="124.2812" width="262.5" height="10.875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="208.75" y="123.375" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS Bill</text>
  <text x="208.75" y="162.3438" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" text-anchor="middle">$45,000/month</text>
  <text x="208.75" y="185" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">CUR, Cost Explorer</text>
  <text x="208.75" y="203.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">12 accounts, 3 regions</text>
  <!-- Azure Bill -->
  <rect x="77.5" y="257.5" width="262.5" height="126.875" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="77.5" y="257.5" width="262.5" height="40.7812" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="77.5" y="287.4062" width="262.5" height="10.875" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="208.75" y="286.5" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">Azure Bill</text>
  <text x="208.75" y="325.4688" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--info-accent)" text-anchor="middle">$28,000/month</text>
  <text x="208.75" y="348.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Cost Management API</text>
  <text x="208.75" y="366.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">5 subscriptions, 2 regions</text>
  <!-- GCP Bill -->
  <rect x="77.5" y="420.625" width="262.5" height="126.875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="77.5" y="420.625" width="262.5" height="40.7812" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="77.5" y="450.5312" width="262.5" height="10.875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="208.75" y="449.625" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCP Bill</text>
  <text x="208.75" y="488.5938" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle">$17,000/month</text>
  <text x="208.75" y="511.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">BigQuery Billing Export</text>
  <text x="208.75" y="529.375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">3 projects, 2 regions</text>
  <!-- Arrows flowing into center -->
  <line x1="340" y1="157.8125" x2="461.875" y2="293.75" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="320.9375" x2="461.875" y2="320.9375" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="484.0625" x2="461.875" y2="348.125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Unified Cost Platform (center) -->
  <rect x="461.875" y="230.3125" width="356.25" height="181.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="275.625" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--text)" text-anchor="middle">Unified Cost Platform</text>
  <text x="640" y="307.3438" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--text-muted)" text-anchor="middle">CloudHealth / Apptio / Kubecost</text>
  <rect x="499.375" y="330" width="281.25" height="31.7188" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="351.75" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Total: $90,000/month</text>
  <text x="640" y="393.4375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Normalize, tag, allocate, optimize</text>
  <!-- Arrows out to outputs -->
  <line x1="818.125" y1="275.625" x2="911.875" y2="157.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="818.125" y1="320.9375" x2="911.875" y2="320.9375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="818.125" y1="366.25" x2="911.875" y2="484.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Output 1: Combined Dashboards -->
  <rect x="911.875" y="94.375" width="290.625" height="126.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.1875" y="130.625" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Combined Dashboards</text>
  <text x="1057.1875" y="157.8125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Spend by cloud, service, team</text>
  <text x="1057.1875" y="180.4688" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Trend analysis, forecasting</text>
  <text x="1057.1875" y="203.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Executive and team views</text>
  <!-- Output 2: Per-team Reports -->
  <rect x="911.875" y="257.5" width="290.625" height="126.875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.1875" y="293.75" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Per-Team Reports</text>
  <text x="1057.1875" y="320.9375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Chargeback / showback</text>
  <text x="1057.1875" y="343.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Budget tracking per team</text>
  <text x="1057.1875" y="366.25" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Tag-based allocation</text>
  <!-- Output 3: Anomaly Alerts -->
  <rect x="911.875" y="420.625" width="290.625" height="126.875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.1875" y="456.875" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Anomaly Alerts</text>
  <text x="1057.1875" y="484.0625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Unusual spend detection</text>
  <text x="1057.1875" y="506.7188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Budget threshold alerts</text>
  <text x="1057.1875" y="529.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">RI/savings plan recommendations</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Headers -->
  <rect x="60" y="40" width="200" height="70" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2"/>
  <text x="160" y="84" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Storage Type</text>
  <rect x="280" y="40" width="290" height="70" rx="10" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="425" y="84" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS</text>
  <rect x="590" y="40" width="290" height="70" rx="10" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="735" y="84" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Azure</text>
  <rect x="900" y="40" width="290" height="70" rx="10" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="1045" y="84" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCP</text>
  <!-- Row 1: Object -->
  <rect x="60" y="130" width="200" height="100" rx="8" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="160" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Object</text>
  <rect x="280" y="130" width="290" height="100" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="425" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">S3</text>
  <rect x="590" y="130" width="290" height="100" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1"/>
  <text x="735" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Blob Storage</text>
  <rect x="900" y="130" width="290" height="100" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1045" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Cloud Storage</text>
  <!-- Row 2: Block -->
  <rect x="60" y="250" width="200" height="100" rx="8" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="160" y="305" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Block</text>
  <rect x="280" y="250" width="290" height="100" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="425" y="305" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">EBS</text>
  <rect x="590" y="250" width="290" height="100" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1"/>
  <text x="735" y="305" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Managed Disks</text>
  <rect x="900" y="250" width="290" height="100" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1045" y="305" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Persistent Disk</text>
  <!-- Row 3: File -->
  <rect x="60" y="370" width="200" height="100" rx="8" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="160" y="425" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">File</text>
  <rect x="280" y="370" width="290" height="100" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="425" y="425" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">EFS</text>
  <rect x="590" y="370" width="290" height="100" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1"/>
  <text x="735" y="425" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Azure Files</text>
  <rect x="900" y="370" width="290" height="100" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1045" y="425" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Filestore</text>
  <!-- Row 4: Archive -->
  <rect x="60" y="490" width="200" height="100" rx="8" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="160" y="545" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Archive</text>
  <rect x="280" y="490" width="290" height="100" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="425" y="545" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Glacier</text>
  <rect x="590" y="490" width="290" height="100" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1"/>
  <text x="735" y="540" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Archive</text>
  <text x="735" y="565" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Storage</text>
  <rect x="900" y="490" width="290" height="100" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="1045" y="545" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Coldline</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Headers -->
  <rect x="40" y="40" width="212.389381" height="73.818182" rx="6.888516" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="146.19469" y="86.4" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--text)" text-anchor="middle">Storage Type</text>
  <rect x="273.628319" y="40" width="307.964602" height="73.818182" rx="6.888516" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="427.610619" y="86.4" font-family="Arial, sans-serif" font-size="23.281231" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS</text>
  <rect x="602.831858" y="40" width="307.964602" height="73.818182" rx="6.888516" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.814159" y="86.4" font-family="Arial, sans-serif" font-size="23.281231" font-weight="bold" fill="var(--bg)" text-anchor="middle">Azure</text>
  <rect x="932.035398" y="40" width="307.964602" height="73.818182" rx="6.888516" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.017699" y="86.4" font-family="Arial, sans-serif" font-size="23.281231" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCP</text>
  <!-- Row 1: Object -->
  <rect x="40" y="134.909091" width="212.389381" height="105.454545" rx="6.888516" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="146.19469" y="192.909033" font-family="Arial, sans-serif" font-size="19.048353" font-weight="bold" fill="var(--text)" text-anchor="middle">Object</text>
  <rect x="273.628319" y="134.909091" width="307.964602" height="105.454545" rx="6.888516" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="427.610619" y="192.909033" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">S3</text>
  <rect x="602.831858" y="134.909091" width="307.964602" height="105.454545" rx="6.888516" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.814159" y="192.909033" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Blob Storage</text>
  <rect x="932.035398" y="134.909091" width="307.964602" height="105.454545" rx="6.888516" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.017699" y="192.909033" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Cloud Storage</text>
  <!-- Row 2: Block -->
  <rect x="40" y="261.454545" width="212.389381" height="105.454545" rx="6.888516" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="146.19469" y="319.454487" font-family="Arial, sans-serif" font-size="19.048353" font-weight="bold" fill="var(--text)" text-anchor="middle">Block</text>
  <rect x="273.628319" y="261.454545" width="307.964602" height="105.454545" rx="6.888516" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="427.610619" y="319.454487" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">EBS</text>
  <rect x="602.831858" y="261.454545" width="307.964602" height="105.454545" rx="6.888516" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.814159" y="319.454487" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Managed Disks</text>
  <rect x="932.035398" y="261.454545" width="307.964602" height="105.454545" rx="6.888516" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.017699" y="319.454487" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Persistent Disk</text>
  <!-- Row 3: File -->
  <rect x="40" y="388" width="212.389381" height="105.454545" rx="6.888516" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="146.19469" y="445.999942" font-family="Arial, sans-serif" font-size="19.048353" font-weight="bold" fill="var(--text)" text-anchor="middle">File</text>
  <rect x="273.628319" y="388" width="307.964602" height="105.454545" rx="6.888516" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="427.610619" y="445.999942" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">EFS</text>
  <rect x="602.831858" y="388" width="307.964602" height="105.454545" rx="6.888516" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.814159" y="445.999942" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Azure Files</text>
  <rect x="932.035398" y="388" width="307.964602" height="105.454545" rx="6.888516" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.017699" y="445.999942" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Filestore</text>
  <!-- Row 4: Archive -->
  <rect x="40" y="514.545455" width="212.389381" height="105.454545" rx="6.888516" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="146.19469" y="572.545396" font-family="Arial, sans-serif" font-size="19.048353" font-weight="bold" fill="var(--text)" text-anchor="middle">Archive</text>
  <rect x="273.628319" y="514.545455" width="307.964602" height="105.454545" rx="6.888516" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="427.610619" y="572.545396" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Glacier</text>
  <rect x="602.831858" y="514.545455" width="307.964602" height="105.454545" rx="6.888516" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.814159" y="567.272727" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Archive</text>
  <text x="756.814159" y="593.636305" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Storage</text>
  <rect x="932.035398" y="514.545455" width="307.964602" height="105.454545" rx="6.888516" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.017699" y="572.545396" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Coldline</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Headers -->
  <rect x="40" y="40" width="212.389381" height="73.818182" rx="6.888516" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="146.19469" y="86.4" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--text)" text-anchor="middle">Database Type</text>
  <rect x="273.628319" y="40" width="307.964602" height="73.818182" rx="6.888516" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="427.610619" y="86.4" font-family="Arial, sans-serif" font-size="23.281231" font-weight="bold" fill="var(--bg)" text-anchor="middle">AWS</text>
  <rect x="602.831858" y="40" width="307.964602" height="73.818182" rx="6.888516" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="756.814159" y="86.4" font-family="Arial, sans-serif" font-size="23.281231" font-weight="bold" fill="var(--bg)" text-anchor="middle">Azure</text>
  <rect x="932.035398" y="40" width="307.964602" height="73.818182" rx="6.888516" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1086.017699" y="86.4" font-family="Arial, sans-serif" font-size="23.281231" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCP</text>
  <!-- Row 1: Relational -->
  <rect x="40" y="134.909091" width="212.389381" height="105.454545" rx="6.888516" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="146.19469" y="192.909033" font-family="Arial, sans-serif" font-size="19.048353" font-weight="bold" fill="var(--text)" text-anchor="middle">Relational</text>
  <rect x="273.628319" y="134.909091" width="307.964602" height="105.454545" rx="6.888516" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="427.610619" y="185.527273" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">RDS / Aurora</text>
  <rect x="602.831858" y="134.909091" width="307.964602" height="105.454545" rx="6.888516" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.814159" y="192.909033" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Azure SQL</text>
  <rect x="932.035398" y="134.909091" width="307.964602" height="105.454545" rx="6.888516" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.017699" y="192.909033" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Cloud SQL</text>
  <!-- Row 2: NoSQL -->
  <rect x="40" y="261.454545" width="212.389381" height="105.454545" rx="6.888516" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="146.19469" y="319.454487" font-family="Arial, sans-serif" font-size="19.048353" font-weight="bold" fill="var(--text)" text-anchor="middle">NoSQL</text>
  <rect x="273.628319" y="261.454545" width="307.964602" height="105.454545" rx="6.888516" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="427.610619" y="319.454487" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">DynamoDB</text>
  <rect x="602.831858" y="261.454545" width="307.964602" height="105.454545" rx="6.888516" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.814159" y="319.454487" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Cosmos DB</text>
  <rect x="932.035398" y="261.454545" width="307.964602" height="105.454545" rx="6.888516" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.017699" y="319.454487" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Firestore</text>
  <!-- Row 3: Cache -->
  <rect x="40" y="388" width="212.389381" height="105.454545" rx="6.888516" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="146.19469" y="445.999942" font-family="Arial, sans-serif" font-size="19.048353" font-weight="bold" fill="var(--text)" text-anchor="middle">Cache</text>
  <rect x="273.628319" y="388" width="307.964602" height="105.454545" rx="6.888516" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="427.610619" y="445.999942" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">ElastiCache</text>
  <rect x="602.831858" y="388" width="307.964602" height="105.454545" rx="6.888516" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.814159" y="445.999942" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Azure Cache</text>
  <rect x="932.035398" y="388" width="307.964602" height="105.454545" rx="6.888516" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.017699" y="445.999942" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Memorystore</text>
  <!-- Row 4: Warehouse -->
  <rect x="40" y="514.545455" width="212.389381" height="105.454545" rx="6.888516" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="146.19469" y="572.545396" font-family="Arial, sans-serif" font-size="19.048353" font-weight="bold" fill="var(--text)" text-anchor="middle">Warehouse</text>
  <rect x="273.628319" y="514.545455" width="307.964602" height="105.454545" rx="6.888516" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="427.610619" y="572.545396" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Redshift</text>
  <rect x="602.831858" y="514.545455" width="307.964602" height="105.454545" rx="6.888516" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.814159" y="572.545396" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Synapse</text>
  <rect x="932.035398" y="514.545455" width="307.964602" height="105.454545" rx="6.888516" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.017699" y="572.545396" font-family="Arial, sans-serif" font-size="21.16485" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">BigQuery</text>
</svg>
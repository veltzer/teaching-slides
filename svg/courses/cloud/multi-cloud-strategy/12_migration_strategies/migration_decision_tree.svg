<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Start: Assess Workload -->
  <rect x="480" y="30" width="320" height="60" rx="30" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="68" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Assess Workload</text>
  <!-- Arrow down -->
  <line x1="640" y1="90" x2="640" y2="140" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Decision 1: Cloud-specific dependencies? -->
  <polygon points="640,140 840,220 640,300 440,220" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
  <text x="640" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Cloud-specific</text>
  <text x="640" y="232" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">dependencies?</text>
  <!-- High -> Stay -->
  <line x1="840" y1="220" x2="1020" y2="220" stroke="var(--danger)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920" y="210" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger)">High</text>
  <rect x="1020" y="185" width="220" height="70" rx="12" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="218" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Stay</text>
  <text x="1130" y="242" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Keep on current cloud</text>
  <!-- Low -> next decision -->
  <line x1="640" y1="300" x2="640" y2="350" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="665" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok)">Low</text>
  <!-- Decision 2: Performance sensitive? -->
  <polygon points="640,350 840,430 640,510 440,430" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2"/>
  <text x="640" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Performance</text>
  <text x="640" y="442" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">sensitive?</text>
  <!-- Yes -> Replatform -->
  <line x1="840" y1="430" x2="1020" y2="430" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920" y="420" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn)">Yes</text>
  <rect x="1020" y="395" width="220" height="70" rx="12" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="428" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Replatform</text>
  <text x="1130" y="452" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Adapt to target platform</text>
  <!-- No -> next decision -->
  <line x1="440" y1="430" x2="320" y2="430" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="420" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok)">No</text>
  <!-- Decision 3: Standard workload? -->
  <polygon points="200,350 320,430 200,510 80,430" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2"/>
  <text x="200" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Standard</text>
  <text x="200" y="442" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">workload?</text>
  <!-- Yes -> Rehost -->
  <line x1="200" y1="350" x2="200" y2="300" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok)">Yes</text>
  <rect x="90" y="230" width="220" height="70" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="263" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Rehost</text>
  <text x="200" y="287" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Lift and shift (easiest)</text>
  <!-- No -> Refactor -->
  <line x1="200" y1="510" x2="200" y2="555" stroke="var(--info)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="540" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info)">No</text>
  <rect x="90" y="555" width="220" height="70" rx="12" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="588" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Refactor</text>
  <text x="200" y="612" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Re-architect for portability</text>
  <!-- Legend -->
  <rect x="800" y="530" width="440" height="90" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1020" y="555" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Outcomes:</text>
  <rect x="820" y="565" width="14" height="14" rx="3" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1"/>
  <text x="845" y="577" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Stay</text>
  <rect x="900" y="565" width="14" height="14" rx="3" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="925" y="577" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Rehost</text>
  <rect x="990" y="565" width="14" height="14" rx="3" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="1015" y="577" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Replatform</text>
  <rect x="1100" y="565" width="14" height="14" rx="3" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1"/>
  <text x="1125" y="577" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Refactor</text>
  <text x="1020" y="605" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Cost and effort increase left to right</text>
</svg>
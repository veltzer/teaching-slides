<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Start: Assess Workload -->
  <rect x="480" y="30" width="320" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="68" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Assess Workload</text>
  <!-- Arrow down -->
  <line x1="640" y1="90" x2="640" y2="140" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Decision 1: Cloud-specific dependencies? -->
  <polygon points="640,140 840,220 640,300 440,220" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Cloud-specific</text>
  <text x="640" y="232" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">dependencies?</text>
  <!-- High -> Stay -->
  <line x1="840" y1="220" x2="1020" y2="220" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920" y="210" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-accent)">High</text>
  <rect x="1020" y="185" width="220" height="70" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="218" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Stay</text>
  <text x="1130" y="242" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Keep on current cloud</text>
  <!-- Low -> next decision -->
  <line x1="640" y1="300" x2="640" y2="350" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="665" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Low</text>
  <!-- Decision 2: Performance sensitive? -->
  <polygon points="640,350 840,430 640,510 440,430" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Performance</text>
  <text x="640" y="442" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">sensitive?</text>
  <!-- Yes -> Replatform -->
  <line x1="840" y1="430" x2="1020" y2="430" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920" y="420" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-accent)">Yes</text>
  <rect x="1020" y="395" width="220" height="70" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="428" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Replatform</text>
  <text x="1130" y="452" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Adapt to target platform</text>
  <!-- No -> next decision -->
  <line x1="440" y1="430" x2="320" y2="430" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="420" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">No</text>
  <!-- Decision 3: Standard workload? -->
  <polygon points="200,350 320,430 200,510 80,430" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="200" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Standard</text>
  <text x="200" y="442" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">workload?</text>
  <!-- Yes -> Rehost -->
  <line x1="200" y1="350" x2="200" y2="300" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Yes</text>
  <rect x="90" y="230" width="220" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="263" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Rehost</text>
  <text x="200" y="287" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Lift and shift (easiest)</text>
  <!-- No -> Refactor -->
  <line x1="200" y1="510" x2="200" y2="555" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="540" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-accent)">No</text>
  <rect x="90" y="555" width="220" height="70" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="588" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Refactor</text>
  <text x="200" y="612" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Re-architect for portability</text>
  <!-- Legend -->
  <rect x="800" y="530" width="440" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1020" y="555" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)" text-anchor="middle">Outcomes:</text>
  <rect x="820" y="565" width="14" height="14" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="845" y="577" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Stay</text>
  <rect x="900" y="565" width="14" height="14" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="925" y="577" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Rehost</text>
  <rect x="990" y="565" width="14" height="14" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1015" y="577" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Replatform</text>
  <rect x="1100" y="565" width="14" height="14" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1125" y="577" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Refactor</text>
  <text x="1020" y="605" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">Cost and effort increase left to right</text>
</svg>
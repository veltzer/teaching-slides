<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Start: Assess Workload -->
  <rect x="490" y="67.1875" width="300" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="101.625" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Assess Workload</text>
  <!-- Arrow down -->
  <line x1="640" y1="121.5625" x2="640" y2="166.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Decision 1: Cloud-specific dependencies? -->
  <polygon points="640,166.875 827.5,239.375 640,311.875 452.5,239.375" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="230.3125" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Cloud-specific</text>
  <text x="640" y="250.25" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">dependencies?</text>
  <!-- High -> Stay -->
  <line x1="827.5" y1="239.375" x2="996.25" y2="239.375" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="902.5" y="230.3125" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--danger-accent)">High</text>
  <rect x="996.25" y="207.6562" width="206.25" height="63.4375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1099.375" y="237.5625" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Stay</text>
  <text x="1099.375" y="259.3125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Keep on current cloud</text>
  <!-- Low -> next decision -->
  <line x1="640" y1="311.875" x2="640" y2="357.1875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="663.4375" y="339.0625" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--ok-accent)">Low</text>
  <!-- Decision 2: Performance sensitive? -->
  <polygon points="640,357.1875 827.5,429.6875 640,502.1875 452.5,429.6875" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="420.625" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Performance</text>
  <text x="640" y="440.5625" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">sensitive?</text>
  <!-- Yes -> Replatform -->
  <line x1="827.5" y1="429.6875" x2="996.25" y2="429.6875" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="902.5" y="420.625" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)">Yes</text>
  <rect x="996.25" y="397.9688" width="206.25" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1099.375" y="427.875" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Replatform</text>
  <text x="1099.375" y="449.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Adapt to target platform</text>
  <!-- No -> next decision -->
  <line x1="452.5" y1="429.6875" x2="340" y2="429.6875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="396.25" y="420.625" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--ok-accent)">No</text>
  <!-- Decision 3: Standard workload? -->
  <polygon points="227.5,357.1875 340,429.6875 227.5,502.1875 115,429.6875" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="227.5" y="420.625" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Standard</text>
  <text x="227.5" y="440.5625" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">workload?</text>
  <!-- Yes -> Rehost -->
  <line x1="227.5" y1="357.1875" x2="227.5" y2="311.875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="246.25" y="339.0625" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--ok-accent)">Yes</text>
  <rect x="124.375" y="248.4375" width="206.25" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.5" y="278.3438" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Rehost</text>
  <text x="227.5" y="300.0938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Lift and shift (easiest)</text>
  <!-- No -> Refactor -->
  <line x1="227.5" y1="502.1875" x2="227.5" y2="542.9688" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="246.25" y="529.375" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--info-accent)">No</text>
  <rect x="124.375" y="542.9688" width="206.25" height="63.4375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.5" y="572.875" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Refactor</text>
  <text x="227.5" y="594.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Re-architect for portability</text>
  <!-- Legend -->
  <rect x="790" y="520.3125" width="412.5" height="81.5625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="996.25" y="542.9688" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)" text-anchor="middle">Outcomes:</text>
  <rect x="808.75" y="552.0312" width="13.125" height="12.6875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="832.1875" y="562.9062" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Stay</text>
  <rect x="883.75" y="552.0312" width="13.125" height="12.6875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="907.1875" y="562.9062" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Rehost</text>
  <rect x="968.125" y="552.0312" width="13.125" height="12.6875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="991.5625" y="562.9062" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Replatform</text>
  <rect x="1071.25" y="552.0312" width="13.125" height="12.6875" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1094.6875" y="562.9062" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Refactor</text>
  <text x="996.25" y="588.2812" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">Cost and effort increase left to right</text>
</svg>
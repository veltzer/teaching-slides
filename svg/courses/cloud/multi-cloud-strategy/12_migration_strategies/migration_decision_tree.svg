<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Start: Assess Workload -->
  <rect x="453.793103" y="40" width="331.034483" height="58.48739" rx="6.536703" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.310345" y="77.042013" font-family="Arial, sans-serif" font-size="20.08391" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Assess Workload</text>
  <!-- Arrow down -->
  <line x1="619.310345" y1="98.48739" x2="619.310345" y2="147.226881" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Decision 1: Cloud-specific dependencies? -->
  <polygon points="619.310345,147.226881 826.206897,225.210067 619.310345,303.193253 412.413793,225.210067" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="619.310345" y="215.462169" font-family="Arial, sans-serif" font-size="16.067106" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Cloud-specific</text>
  <text x="619.310345" y="236.907545" font-family="Arial, sans-serif" font-size="16.067106" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">dependencies?</text>
  <!-- High -> Stay -->
  <line x1="826.206897" y1="225.210067" x2="1012.413793" y2="225.210067" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="908.965517" y="215.462169" font-family="Arial, sans-serif" font-size="15.062851" font-weight="bold" fill="var(--danger-accent)">High</text>
  <rect x="1012.413793" y="191.092369" width="227.586207" height="68.235288" rx="6.536703" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.206897" y="223.260487" font-family="Arial, sans-serif" font-size="18.075508" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Stay</text>
  <text x="1126.206897" y="246.655443" font-family="Arial, sans-serif" font-size="13.054558" fill="var(--text-faint)" text-anchor="middle">Keep on current cloud</text>
  <!-- Low -> next decision -->
  <line x1="619.310345" y1="303.193253" x2="619.310345" y2="351.932744" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="645.172414" y="332.436948" font-family="Arial, sans-serif" font-size="15.062851" font-weight="bold" fill="var(--ok-accent)">Low</text>
  <!-- Decision 2: Performance sensitive? -->
  <polygon points="619.310345,351.932744 826.206897,429.91593 619.310345,507.899116 412.413793,429.91593" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="619.310345" y="420.168032" font-family="Arial, sans-serif" font-size="16.067106" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Performance</text>
  <text x="619.310345" y="441.613408" font-family="Arial, sans-serif" font-size="16.067106" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">sensitive?</text>
  <!-- Yes -> Replatform -->
  <line x1="826.206897" y1="429.91593" x2="1012.413793" y2="429.91593" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="908.965517" y="420.168032" font-family="Arial, sans-serif" font-size="15.062851" font-weight="bold" fill="var(--warn-accent)">Yes</text>
  <rect x="1012.413793" y="395.79834" width="227.586207" height="68.235288" rx="6.536703" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.206897" y="427.966351" font-family="Arial, sans-serif" font-size="18.075508" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Replatform</text>
  <text x="1126.206897" y="451.361306" font-family="Arial, sans-serif" font-size="13.054558" fill="var(--text-faint)" text-anchor="middle">Adapt to target platform</text>
  <!-- No -> next decision -->
  <line x1="412.413793" y1="429.91593" x2="288.275862" y2="429.91593" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350.344828" y="420.168032" font-family="Arial, sans-serif" font-size="15.062851" font-weight="bold" fill="var(--ok-accent)">No</text>
  <!-- Decision 3: Standard workload? -->
  <polygon points="164.137931,351.932744 288.275862,429.91593 164.137931,507.899116 40,429.91593" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="164.137931" y="420.168032" font-family="Arial, sans-serif" font-size="16.067106" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Standard</text>
  <text x="164.137931" y="441.613408" font-family="Arial, sans-serif" font-size="16.067106" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">workload?</text>
  <!-- Yes -> Rehost -->
  <line x1="164.137931" y1="351.932744" x2="164.137931" y2="303.193253" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="184.827586" y="332.436948" font-family="Arial, sans-serif" font-size="15.062851" font-weight="bold" fill="var(--ok-accent)">Yes</text>
  <rect x="50.344828" y="234.957965" width="227.586207" height="68.235288" rx="6.536703" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.137931" y="267.126083" font-family="Arial, sans-serif" font-size="18.075508" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Rehost</text>
  <text x="164.137931" y="290.521039" font-family="Arial, sans-serif" font-size="13.054558" fill="var(--text-faint)" text-anchor="middle">Lift and shift (easiest)</text>
  <!-- No -> Refactor -->
  <line x1="164.137931" y1="507.899116" x2="164.137931" y2="551.764712" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="184.827586" y="537.142811" font-family="Arial, sans-serif" font-size="15.062851" font-weight="bold" fill="var(--info-accent)">No</text>
  <rect x="50.344828" y="551.764712" width="227.586207" height="68.235288" rx="6.536703" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.137931" y="583.932723" font-family="Arial, sans-serif" font-size="18.075508" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Refactor</text>
  <text x="164.137931" y="607.327678" font-family="Arial, sans-serif" font-size="13.054558" fill="var(--text-faint)" text-anchor="middle">Re-architect for portability</text>
  <!-- Legend -->
  <rect x="784.827586" y="527.394913" width="455.172414" height="87.731084" rx="6.536703" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1012.413793" y="551.764712" font-family="Arial, sans-serif" font-size="14.058704" font-weight="bold" fill="var(--text)" text-anchor="middle">Outcomes:</text>
  <rect x="805.517241" y="561.512503" width="14.482759" height="13.647058" rx="6.536703" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="831.37931" y="573.209981" font-family="Arial, sans-serif" font-size="12.050302" fill="var(--text-muted)">Stay</text>
  <rect x="888.275862" y="561.512503" width="14.482759" height="13.647058" rx="6.536703" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="914.137931" y="573.209981" font-family="Arial, sans-serif" font-size="12.050302" fill="var(--text-muted)">Rehost</text>
  <rect x="981.37931" y="561.512503" width="14.482759" height="13.647058" rx="6.536703" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1007.241379" y="573.209981" font-family="Arial, sans-serif" font-size="12.050302" fill="var(--text-muted)">Replatform</text>
  <rect x="1095.172414" y="561.512503" width="14.482759" height="13.647058" rx="6.536703" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.034483" y="573.209981" font-family="Arial, sans-serif" font-size="12.050302" fill="var(--text-muted)">Refactor</text>
  <text x="1012.413793" y="600.504096" font-family="Arial, sans-serif" font-size="12.050302" fill="var(--text-faint)" text-anchor="middle">Cost and effort increase left to right</text>
</svg>
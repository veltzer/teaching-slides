<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Step 1: Budget Set -->
  <rect x="40" y="177.525824" width="186.885246" height="143.505138" rx="7.059849" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.442623" y="231.340184" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.352991" font-weight="bold" fill="var(--primary-accent)">Budget Set</text>
  <text x="133.442623" y="261.237154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-muted)">$10,000/month</text>
  <text x="133.442623" y="285.154677" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-muted)">Per account/service</text>

  <!-- Arrow -->
  <line x1="226.885246" y1="249.278393" x2="274.098361" y2="249.278393" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Usage Tracked (meter) -->
  <rect x="283.934426" y="177.525824" width="186.885246" height="143.505138" rx="7.059849" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="377.377049" y="225.36087" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.352991" font-weight="bold" fill="var(--text)">Usage Tracked</text>
  <!-- Simple meter icon -->
  <rect x="338.032787" y="246.88664" width="78.688525" height="19.134018" rx="7.059849" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="340" y="249.278393" width="51.147541" height="14.350514" rx="7.059849" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="377.377049" y="291.134124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-muted)">65% consumed</text>

  <!-- Arrow -->
  <line x1="470.819672" y1="249.278393" x2="518.032787" y2="249.278393" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Threshold Crossed -->
  <rect x="527.868852" y="177.525824" width="186.885246" height="143.505138" rx="7.059849" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="621.311475" y="225.36087" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.352991" font-weight="bold" fill="var(--warn-accent)">Threshold</text>
  <text x="621.311475" y="251.670145" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.352991" font-weight="bold" fill="var(--warn-accent)">Crossed</text>
  <text x="621.311475" y="282.762925" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-muted)">80% / 100% / 120%</text>

  <!-- Arrow -->
  <line x1="714.754098" y1="249.278393" x2="761.967213" y2="249.278393" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Alert Sent -->
  <rect x="771.803279" y="177.525824" width="167.213115" height="143.505138" rx="7.059849" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="855.409836" y="234.927879" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.352991" font-weight="bold" fill="var(--danger-accent)">Alert Sent</text>
  <text x="855.409836" y="267.216601" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-muted)">Email / SNS Topic</text>
  <text x="855.409836" y="291.134124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-muted)">Slack / PagerDuty</text>

  <!-- Arrow branching to three actions -->
  <line x1="939.016393" y1="225.36087" x2="1003.934426" y2="105.773254" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="939.016393" y1="249.278393" x2="1003.934426" y2="249.278393" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="939.016393" y1="273.195916" x2="1003.934426" y2="392.783531" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action 1: SNS Notification -->
  <rect x="1013.770492" y="40" width="226.229508" height="119.587615" rx="7.059849" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.885246" y="81.855731" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.268363" font-weight="bold" fill="var(--ok-accent)">SNS Notification</text>
  <text x="1126.885246" y="111.752569" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-muted)">Notify stakeholders</text>
  <text x="1126.885246" y="135.670092" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-muted)">Email, SMS, Webhook</text>

  <!-- Action 2: Lambda Automation -->
  <rect x="1013.770492" y="195.464032" width="226.229508" height="119.587615" rx="7.059849" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.885246" y="237.319631" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.268363" font-weight="bold" fill="var(--ok-accent)">Lambda Automation</text>
  <text x="1126.885246" y="267.216601" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-muted)">Stop non-critical instances</text>
  <text x="1126.885246" y="291.134124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-muted)">Scale down resources</text>

  <!-- Action 3: IAM Restrict -->
  <rect x="1013.770492" y="344.948485" width="226.229508" height="119.587615" rx="7.059849" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.885246" y="386.804216" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.268363" font-weight="bold" fill="var(--ok-accent)">IAM Restriction</text>
  <text x="1126.885246" y="416.701054" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-muted)">Apply deny policies</text>
  <text x="1126.885246" y="440.618577" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-muted)">Block new provisioning</text>

  <!-- Threshold levels shown below -->
  <rect x="108.852459" y="452.577339" width="737.704918" height="167.422661" rx="7.059849" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="477.704918" y="488.453623" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.268363" font-weight="bold" fill="var(--text)">Common Threshold Configuration</text>

  <!-- 50% -->
  <rect x="138.360656" y="512.371146" width="137.704918" height="41.855731" rx="7.059849" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="207.213115" y="539.876364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.099342" font-weight="bold" fill="var(--primary-accent)">50% - Info</text>

  <!-- 80% -->
  <rect x="295.737705" y="512.371146" width="137.704918" height="41.855731" rx="7.059849" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="364.590164" y="539.876364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.099342" font-weight="bold" fill="var(--warn-accent)">80% - Warning</text>

  <!-- 100% -->
  <rect x="453.114754" y="512.371146" width="137.704918" height="41.855731" rx="7.059849" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="521.967213" y="539.876364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.099342" font-weight="bold" fill="var(--danger-accent)">100% - Critical</text>

  <!-- 120% -->
  <rect x="610.491803" y="512.371146" width="137.704918" height="41.855731" rx="7.059849" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="679.344262" y="539.876364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.099342" font-weight="bold" fill="var(--danger-accent)">120% - Action</text>

  <text x="477.704918" y="593.690725" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.014714" fill="var(--text-faint)">Configure multiple thresholds for escalating responses</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Step 1: Budget Set -->
  <rect x="30" y="200" width="190" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Budget Set</text>
  <text x="125" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">$10,000/month</text>
  <text x="125" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Per account/service</text>

  <!-- Arrow -->
  <line x1="220" y1="260" x2="268" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Usage Tracked (meter) -->
  <rect x="278" y="200" width="190" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="373" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Usage Tracked</text>
  <!-- Simple meter icon -->
  <rect x="333" y="258" width="80" height="16" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="335" y="260" width="52" height="12" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="373" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">65% consumed</text>

  <!-- Arrow -->
  <line x1="468" y1="260" x2="516" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Threshold Crossed -->
  <rect x="526" y="200" width="190" height="120" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="621" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)">Threshold</text>
  <text x="621" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)">Crossed</text>
  <text x="621" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">80% / 100% / 120%</text>

  <!-- Arrow -->
  <line x1="716" y1="260" x2="764" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Alert Sent -->
  <rect x="774" y="200" width="170" height="120" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="859" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)">Alert Sent</text>
  <text x="859" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Email / SNS Topic</text>
  <text x="859" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Slack / PagerDuty</text>

  <!-- Arrow branching to three actions -->
  <line x1="944" y1="240" x2="1010" y2="140" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="944" y1="260" x2="1010" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="944" y1="280" x2="1010" y2="380" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action 1: SNS Notification -->
  <rect x="1020" y="85" width="230" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">SNS Notification</text>
  <text x="1135" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Notify stakeholders</text>
  <text x="1135" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Email, SMS, Webhook</text>

  <!-- Action 2: Lambda Automation -->
  <rect x="1020" y="215" width="230" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Lambda Automation</text>
  <text x="1135" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Stop non-critical instances</text>
  <text x="1135" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Scale down resources</text>

  <!-- Action 3: IAM Restrict -->
  <rect x="1020" y="340" width="230" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">IAM Restriction</text>
  <text x="1135" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Apply deny policies</text>
  <text x="1135" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Block new provisioning</text>

  <!-- Threshold levels shown below -->
  <rect x="100" y="430" width="750" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="475" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Common Threshold Configuration</text>

  <!-- 50% -->
  <rect x="130" y="480" width="140" height="35" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">50% - Info</text>

  <!-- 80% -->
  <rect x="290" y="480" width="140" height="35" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="360" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">80% - Warning</text>

  <!-- 100% -->
  <rect x="450" y="480" width="140" height="35" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="520" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)">100% - Critical</text>

  <!-- 120% -->
  <rect x="610" y="480" width="140" height="35" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="680" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)">120% - Action</text>

  <text x="475" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Configure multiple thresholds for escalating responses</text>
</svg>
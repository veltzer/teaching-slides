<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Four phases arranged in a cycle (clockwise from top) -->
  <!-- Forecast (top) -->
  <rect x="490" y="40" width="300" height="140" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">1. Forecast</text>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Project growth from history</text>
  <text x="640" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Engage application teams</text>
  <text x="640" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">12-18 months ahead</text>

  <!-- Procure (right) -->
  <rect x="940" y="280" width="300" height="140" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">2. Procure</text>
  <text x="1090" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Negotiate vendor pricing</text>
  <text x="1090" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Lead time 8-16 weeks</text>
  <text x="1090" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Volume discounts</text>

  <!-- Deploy (bottom) -->
  <rect x="490" y="480" width="300" height="140" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">3. Deploy</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Rack and provision</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Tag for allocation</text>
  <text x="640" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Bring online safely</text>

  <!-- Monitor (left) -->
  <rect x="40" y="280" width="300" height="140" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">4. Monitor</text>
  <text x="190" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Track utilization trends</text>
  <text x="190" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Spot under-loaded gear</text>
  <text x="190" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Feed back to forecast</text>

  <!-- Center label -->
  <rect x="510" y="280" width="260" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Capacity</text>
  <text x="640" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Planning</text>
  <text x="640" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Quarterly review</text>
  <text x="640" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Continuous loop</text>

  <!-- Curved arrows connecting phases clockwise -->
  <path d="M 790 110 Q 1000 150 1010 280" fill="none" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1090 420 Q 1050 540 790 540" fill="none" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 490 540 Q 230 540 200 420" fill="none" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 200 280 Q 230 150 490 110" fill="none" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>

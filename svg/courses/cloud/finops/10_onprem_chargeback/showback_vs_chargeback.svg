<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Showback panel -->
  <rect x="40" y="40" width="580" height="80" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--info-text)">Showback</text>
  <text x="330" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Inform without billing</text>

  <rect x="40" y="140" width="580" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="165" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Money flow</text>
  <text x="60" y="188" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">No internal billing</text>

  <rect x="40" y="210" width="580" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="235" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Goal</text>
  <text x="60" y="258" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Build cost awareness</text>

  <rect x="40" y="280" width="580" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="305" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Accountability</text>
  <text x="60" y="328" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Soft, social pressure</text>

  <rect x="40" y="350" width="580" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="375" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Setup effort</text>
  <text x="60" y="398" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Light, reports only</text>

  <rect x="40" y="420" width="580" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="445" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Best for</text>
  <text x="60" y="468" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Starting FinOps practice</text>

  <!-- Chargeback panel -->
  <rect x="660" y="40" width="580" height="80" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--ok-text)">Chargeback</text>
  <text x="950" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Bill teams for usage</text>

  <rect x="660" y="140" width="580" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="680" y="165" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Money flow</text>
  <text x="680" y="188" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Real internal transfers</text>

  <rect x="660" y="210" width="580" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="680" y="235" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Goal</text>
  <text x="680" y="258" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Drive accountability</text>

  <rect x="660" y="280" width="580" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="680" y="305" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Accountability</text>
  <text x="680" y="328" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Hard, hits budgets</text>

  <rect x="660" y="350" width="580" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="680" y="375" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Setup effort</text>
  <text x="680" y="398" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Heavy, finance integration</text>

  <rect x="660" y="420" width="580" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="680" y="445" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Best for</text>
  <text x="680" y="468" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Mature cost-center orgs</text>

  <!-- Bottom takeaway -->
  <rect x="40" y="510" width="1200" height="110" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Start with showback, graduate to chargeback</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Both need accurate metering and trusted data</text>
  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Same principles apply to cloud and on-prem</text>
</svg>

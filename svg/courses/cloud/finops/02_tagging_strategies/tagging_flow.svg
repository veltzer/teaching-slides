<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Step 1: Resource Created -->
  <rect x="40" y="180" width="220" height="200" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">Resource Created</text>
  <line x1="60" y1="235" x2="240" y2="235" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="70" y="262" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">team: platform</text>
  <text x="70" y="284" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">project: api-v2</text>
  <text x="70" y="306" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">env: production</text>
  <text x="70" y="328" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">cost-center: CC-1042</text>
  <text x="70" y="350" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">owner: jane@co.com</text>

  <!-- Arrow 1 -->
  <line x1="260" y1="280" x2="320" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Billing Data -->
  <rect x="330" y="210" width="200" height="140" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-accent)">Billing Data</text>
  <line x1="350" y1="268" x2="510" y2="268" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="430" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Usage + Cost records</text>
  <text x="430" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Tag metadata attached</text>

  <!-- Arrow 2 -->
  <line x1="530" y1="280" x2="590" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Cost Explorer -->
  <rect x="600" y="210" width="200" height="140" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-accent)">Cost Explorer</text>
  <line x1="620" y1="268" x2="780" y2="268" stroke="var(--info-border)" stroke-width="1"/>
  <text x="700" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Filter &amp; group by tags</text>
  <text x="700" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Analyze trends</text>

  <!-- Arrow 3 -->
  <line x1="800" y1="280" x2="860" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Reports -->
  <rect x="870" y="120" width="370" height="340" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-accent)">Reports &amp; Dashboards</text>
  <line x1="890" y1="173" x2="1220" y2="173" stroke="var(--ok-border)" stroke-width="1"/>

  <!-- By Team sub-box -->
  <rect x="895" y="190" width="160" height="70" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="975" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">By Team</text>
  <text x="975" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Platform: $12,400</text>

  <!-- By Project sub-box -->
  <rect x="1075" y="190" width="160" height="70" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1155" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">By Project</text>
  <text x="1155" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">API-v2: $8,200</text>

  <!-- By Environment sub-box -->
  <rect x="895" y="275" width="160" height="70" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="975" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">By Environment</text>
  <text x="975" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Production: $9,800</text>

  <!-- By Cost Center sub-box -->
  <rect x="1075" y="275" width="160" height="70" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1155" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">By Cost Center</text>
  <text x="1155" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">CC-1042: $6,500</text>

  <!-- Chargeback/Showback label -->
  <rect x="930" y="370" width="250" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1055" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">Chargeback / Showback</text>

  <!-- Bottom annotation -->
  <text x="640" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-faint)">Tags flow through the billing pipeline, enabling cost attribution and accountability</text>
</svg>
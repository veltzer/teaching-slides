<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9,2 L1,5 L9,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Central FinOps Team -->
  <circle cx="640" cy="310" r="110" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="640" cy="310" r="85" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-accent)">FinOps</text>
  <text x="640" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-accent)">Team</text>
  <text x="640" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Central Hub</text>

  <!-- Engineering Teams (top-left) -->
  <circle cx="260" cy="130" r="85" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="260" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Engineering</text>
  <text x="260" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Teams</text>
  <text x="260" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Rightsizing, tagging</text>
  <text x="260" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">resource ownership</text>

  <!-- Bidirectional arrow to center -->
  <line x1="330" y1="190" x2="560" y2="265" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <!-- Label on connection -->
  <rect x="370" y="205" width="130" height="28" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="435" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">Cost awareness</text>

  <!-- Finance (top-right) -->
  <circle cx="1020" cy="130" r="85" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1020" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)">Finance</text>
  <text x="1020" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Budgets, forecasting</text>
  <text x="1020" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">chargeback models</text>

  <!-- Bidirectional arrow to center -->
  <line x1="950" y1="190" x2="720" y2="265" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <rect x="770" y="205" width="120" height="28" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="830" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">Cost reports</text>

  <!-- Leadership (bottom-right) -->
  <circle cx="1020" cy="490" r="85" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1020" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-accent)">Leadership</text>
  <text x="1020" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Strategy, KPIs</text>
  <text x="1020" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">executive dashboards</text>

  <!-- Bidirectional arrow to center -->
  <line x1="950" y1="430" x2="720" y2="355" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <rect x="770" y="375" width="120" height="28" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="830" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--info-accent)">KPI updates</text>

  <!-- Procurement (bottom-left) -->
  <circle cx="260" cy="490" r="85" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="260" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)">Procurement</text>
  <text x="260" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Vendor negotiations</text>
  <text x="260" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">contracts, commitments</text>

  <!-- Bidirectional arrow to center -->
  <line x1="330" y1="430" x2="560" y2="355" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <rect x="370" y="375" width="130" height="28" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="435" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)">Rate optimization</text>

  <!-- Central responsibilities list -->
  <rect x="440" y="460" width="400" height="150" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">FinOps Team Responsibilities</text>
  <text x="460" y="512" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Establish FinOps culture and best practices</text>
  <text x="460" y="532" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Define tagging standards and policies</text>
  <text x="460" y="552" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Build cost visibility and reporting</text>
  <text x="460" y="572" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Drive optimization initiatives</text>
  <text x="460" y="592" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Facilitate cross-team collaboration</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9,2 L1,5 L9,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Central FinOps Team -->
  <circle cx="640" cy="320.9375" r="101.3917" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="640" cy="320.9375" r="78.3481" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--primary-accent)">FinOps</text>
  <text x="640" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--primary-accent)">Team</text>
  <text x="640" y="352.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Central Hub</text>

  <!-- Engineering Teams (top-left) -->
  <circle cx="283.75" cy="157.8125" r="78.3481" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="283.75" y="144.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">Engineering</text>
  <text x="283.75" y="165.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">Teams</text>
  <text x="283.75" y="189.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Rightsizing, tagging</text>
  <text x="283.75" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">resource ownership</text>

  <!-- Bidirectional arrow to center -->
  <line x1="349.375" y1="212.1875" x2="565" y2="280.1562" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <!-- Label on connection -->
  <rect x="386.875" y="225.7812" width="121.875" height="25.375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="447.8125" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">Cost awareness</text>

  <!-- Finance (top-right) -->
  <circle cx="996.25" cy="157.8125" r="78.3481" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="996.25" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)">Finance</text>
  <text x="996.25" y="175.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Budgets, forecasting</text>
  <text x="996.25" y="189.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">chargeback models</text>

  <!-- Bidirectional arrow to center -->
  <line x1="930.625" y1="212.1875" x2="715" y2="280.1562" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <rect x="761.875" y="225.7812" width="112.5" height="25.375" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="818.125" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">Cost reports</text>

  <!-- Leadership (bottom-right) -->
  <circle cx="996.25" cy="484.0625" r="78.3481" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="996.25" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--info-accent)">Leadership</text>
  <text x="996.25" y="502.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Strategy, KPIs</text>
  <text x="996.25" y="515.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">executive dashboards</text>

  <!-- Bidirectional arrow to center -->
  <line x1="930.625" y1="429.6875" x2="715" y2="361.7188" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <rect x="761.875" y="379.8438" width="112.5" height="25.375" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="818.125" y="397.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--info-accent)">KPI updates</text>

  <!-- Procurement (bottom-left) -->
  <circle cx="283.75" cy="484.0625" r="78.3481" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="283.75" y="473.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)">Procurement</text>
  <text x="283.75" y="500.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Vendor negotiations</text>
  <text x="283.75" y="513.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">contracts, commitments</text>

  <!-- Bidirectional arrow to center -->
  <line x1="349.375" y1="429.6875" x2="565" y2="361.7188" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <rect x="386.875" y="379.8438" width="121.875" height="25.375" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="447.8125" y="397.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--danger-accent)">Rate optimization</text>

  <!-- Central responsibilities list -->
  <rect x="452.5" y="456.875" width="375" height="135.9375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="482.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">FinOps Team Responsibilities</text>
  <text x="471.25" y="504" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Establish FinOps culture and best practices</text>
  <text x="471.25" y="522.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Define tagging standards and policies</text>
  <text x="471.25" y="540.25" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Build cost visibility and reporting</text>
  <text x="471.25" y="558.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Drive optimization initiatives</text>
  <text x="471.25" y="576.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Facilitate cross-team collaboration</text>
</svg>
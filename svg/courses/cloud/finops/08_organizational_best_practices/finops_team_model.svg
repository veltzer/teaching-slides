<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9,2 L1,5 L9,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Central FinOps Team -->
  <circle cx="640" cy="318.69777" r="126.715432" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="640" cy="318.69777" r="97.916431" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="303.632713" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.039227" font-weight="bold" fill="var(--primary-accent)">FinOps</text>
  <text x="640" y="328.741178" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.039227" font-weight="bold" fill="var(--primary-accent)">Team</text>
  <text x="640" y="353.849641" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.823486" fill="var(--text-muted)">Central Hub</text>

  <!-- Engineering Teams (top-left) -->
  <circle cx="137.916431" cy="137.916431" r="97.916431" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="137.916431" y="122.851377" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.431356" font-weight="bold" fill="var(--ok-accent)">Engineering</text>
  <text x="137.916431" y="145.951158" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.431356" font-weight="bold" fill="var(--ok-accent)">Teams</text>
  <text x="137.916431" y="173.068304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.671581" fill="var(--text-muted)">Rightsizing, tagging</text>
  <text x="137.916431" y="188.133468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.671581" fill="var(--text-muted)">resource ownership</text>

  <!-- Bidirectional arrow to center -->
  <line x1="230.405509" y1="198.176877" x2="534.298196" y2="273.50238" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <!-- Label on connection -->
  <rect x="283.25641" y="213.241932" width="171.765432" height="28.12154" rx="7.498568" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="369.139126" y="232.324465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.671581" fill="var(--ok-accent)">Cost awareness</text>

  <!-- Finance (top-right) -->
  <circle cx="1142.083569" cy="137.916431" r="97.916431" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1142.083569" y="127.873024" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.431356" font-weight="bold" fill="var(--warn-accent)">Finance</text>
  <text x="1142.083569" y="158.003247" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.671581" fill="var(--text-muted)">Budgets, forecasting</text>
  <text x="1142.083569" y="173.068304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.671581" fill="var(--text-muted)">chargeback models</text>

  <!-- Bidirectional arrow to center -->
  <line x1="1049.594491" y1="198.176877" x2="745.701804" y2="273.50238" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <rect x="811.765432" y="213.241932" width="158.552706" height="28.12154" rx="7.498568" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="891.041785" y="232.324465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.671581" fill="var(--warn-accent)">Cost reports</text>

  <!-- Leadership (bottom-right) -->
  <circle cx="1142.083569" cy="499.479107" r="97.916431" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1142.083569" y="489.4357" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.431356" font-weight="bold" fill="var(--info-accent)">Leadership</text>
  <text x="1142.083569" y="519.565923" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.671581" fill="var(--text-muted)">Strategy, KPIs</text>
  <text x="1142.083569" y="534.630979" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.671581" fill="var(--text-muted)">executive dashboards</text>

  <!-- Bidirectional arrow to center -->
  <line x1="1049.594491" y1="439.218663" x2="745.701804" y2="363.89316" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <rect x="811.765432" y="383.979975" width="158.552706" height="28.12154" rx="7.498568" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="891.041785" y="403.062394" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.671581" fill="var(--info-accent)">KPI updates</text>

  <!-- Procurement (bottom-left) -->
  <circle cx="137.916431" cy="499.479107" r="97.916431" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="137.916431" y="487.427019" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.431356" font-weight="bold" fill="var(--danger-accent)">Procurement</text>
  <text x="137.916431" y="517.557241" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.671581" fill="var(--text-muted)">Vendor negotiations</text>
  <text x="137.916431" y="532.62241" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.671581" fill="var(--text-muted)">contracts, commitments</text>

  <!-- Bidirectional arrow to center -->
  <line x1="230.405509" y1="439.218663" x2="534.298196" y2="363.89316" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <rect x="283.25641" y="383.979975" width="171.765432" height="28.12154" rx="7.498568" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="369.139126" y="403.062394" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.671581" fill="var(--danger-accent)">Rate optimization</text>

  <!-- Central responsibilities list -->
  <rect x="375.745491" y="469.348886" width="528.509019" height="150.651114" rx="7.498568" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="497.470426" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.127421" font-weight="bold" fill="var(--primary-accent)">FinOps Team Responsibilities</text>
  <text x="402.170943" y="521.574605" font-family="Arial, sans-serif" font-size="13.823486" fill="var(--text-muted)">Establish FinOps culture and best practices</text>
  <text x="402.170943" y="541.661421" font-family="Arial, sans-serif" font-size="13.823486" fill="var(--text-muted)">Define tagging standards and policies</text>
  <text x="402.170943" y="561.748236" font-family="Arial, sans-serif" font-size="13.823486" fill="var(--text-muted)">Build cost visibility and reporting</text>
  <text x="402.170943" y="581.835052" font-family="Arial, sans-serif" font-size="13.823486" fill="var(--text-muted)">Drive optimization initiatives</text>
  <text x="402.170943" y="601.921865" font-family="Arial, sans-serif" font-size="13.823486" fill="var(--text-muted)">Facilitate cross-team collaboration</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Inform (top) -->
  <rect x="502.5" y="40" width="275" height="193.333333333333" rx="17.205861404378" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.953742608131" font-weight="bold" fill="var(--primary-text)">Inform</text>
  <text x="640" y="154.791666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.663841605004" fill="var(--primary-text)">Visibility &amp; Allocation</text>
  <text x="640" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.205861404378" fill="var(--primary-text)">Understand cloud spend</text>
  <text x="640" y="215.208333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.976871304065" font-style="italic" fill="var(--primary-text)">Showback, Tagging, Dashboards</text>

  <!-- Optimize (bottom-left) -->
  <rect x="40" y="378.333333333333" width="275" height="193.333333333333" rx="17.205861404378" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.5" y="450.833333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.953742608131" font-weight="bold" fill="var(--ok-text)">Optimize</text>
  <text x="177.5" y="493.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.663841605004" fill="var(--ok-text)">Rates &amp; Usage</text>
  <text x="177.5" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.205861404378" fill="var(--ok-text)">Reduce waste &amp; cost</text>
  <text x="177.5" y="553.541666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.976871304065" font-style="italic" fill="var(--ok-text)">Rightsizing, RIs, Savings Plans</text>

  <!-- Operate (bottom-right) -->
  <rect x="965" y="378.333333333333" width="275" height="193.333333333333" rx="17.205861404378" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.5" y="450.833333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.953742608131" font-weight="bold" fill="var(--warn-text)">Operate</text>
  <text x="1102.5" y="493.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.663841605004" fill="var(--warn-text)">Governance &amp; Control</text>
  <text x="1102.5" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.205861404378" fill="var(--warn-text)">Continuous process</text>
  <text x="1102.5" y="553.541666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.976871304065" font-style="italic" fill="var(--warn-text)">Budgets, Alerts, Policies</text>

  <!-- Arrows: Inform -> Optimize -> Operate -> Inform -->
  <path d="M 515 221.25 Q 340 305.833333333333 315 378.333333333333" fill="none" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="377.5" y="287.708333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.663841605004" font-weight="bold" fill="var(--text)">Data-driven</text>

  <path d="M 315 487.083333333333 Q 640 620 965 487.083333333333" fill="none" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="601.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.663841605004" font-weight="bold" fill="var(--text)">Implement changes</text>

  <path d="M 965 378.333333333333 Q 940 305.833333333333 765 221.25" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="902.5" y="287.708333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.663841605004" font-weight="bold" fill="var(--text)">Feedback loop</text>

  <!-- Center label -->
  <text x="640" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.03778220688" font-weight="bold" fill="var(--text)">FinOps</text>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.579802006254" fill="var(--text-muted)">Lifecycle</text>
</svg>

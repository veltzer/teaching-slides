<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="952.5581" height="476.2791" fill="var(--bg)" rx="6" />
  <circle cx="476.2791" cy="104.186" r="70.6977" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.2326" filter="url(#shadow)" />
  <text x="476.2791" y="96.7442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.3721" font-weight="bold" fill="var(--primary-accent)">Inform</text>
  <text x="476.2791" y="115.3488" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Visibility &amp; Allocation</text>
  <text x="476.2791" y="128.7442" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Understand cloud spend</text>
  <circle cx="282.7907" cy="327.4419" r="70.6977" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.2326" filter="url(#shadow)" />
  <text x="282.7907" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.3721" font-weight="bold" fill="var(--ok-accent)">Optimize</text>
  <text x="282.7907" y="338.6047" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Rates &amp; Usage</text>
  <text x="282.7907" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Reduce waste &amp; cost</text>
  <circle cx="669.7674" cy="327.4419" r="70.6977" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2326" filter="url(#shadow)" />
  <text x="669.7674" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.3721" font-weight="bold" fill="var(--warn-accent)">Operate</text>
  <text x="669.7674" y="338.6047" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Governance &amp; Control</text>
  <text x="669.7674" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Continuous process</text>
  <path d="M 416.7442 156.2791 Q 327.4419 208.3721 312.5581 256.7442" fill="none" stroke="var(--primary-border)" stroke-width="2.2326" marker-end="url(#arrow)" />
  <text x="342.3256" y="197.2093" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Data-driven</text>
  <path d="M 353.4884 346.0465 Q 476.2791 394.4186 599.0698 346.0465" fill="none" stroke="var(--ok-border)" stroke-width="2.2326" marker-end="url(#arrow)" />
  <text x="476.2791" y="386.9767" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Implement changes</text>
  <path d="M 640 256.7442 Q 625.1163 208.3721 535.814 156.2791" fill="none" stroke="var(--warn-border)" stroke-width="2.2326" marker-end="url(#arrow)" />
  <text x="610.2326" y="197.2093" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Feedback loop</text>
  <text x="476.2791" y="286.5116" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3953" font-weight="bold" fill="var(--text)">FinOps</text>
  <text x="476.2791" y="303.6279" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.4186" fill="var(--text-muted)">Lifecycle</text>
  <text x="141.3953" y="133.9535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">Showback / Chargeback</text>
  <text x="141.3953" y="147.3488" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">Tagging, Dashboards</text>
  <text x="141.3953" y="379.5349" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Rightsizing, RIs</text>
  <text x="141.3953" y="392.9302" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Savings Plans, Spot</text>
  <text x="811.1628" y="379.5349" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)">Budgets, Alerts</text>
  <text x="811.1628" y="392.9302" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)">Policies, Automation</text>
</svg>
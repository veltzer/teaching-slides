  <text x="524.4386" y="188.9954" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Visibility &amp; Allocation</text>
  <text x="524.4386" y="198.4504" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Understand cloud spend</text>
  <circle cx="387.8661" cy="338.7" r="49.9015" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1833" filter="url(#shadow)" />
  <text x="387.8661" y="333.4472" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5561" font-weight="bold" fill="var(--ok-accent)">Optimize</text>
  <text x="387.8661" y="346.5792" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Rates &amp; Usage</text>
  <text x="387.8661" y="356.0341" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Reduce waste &amp; cost</text>
  <circle cx="661.0112" cy="338.7" r="49.9015" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1833" filter="url(#shadow)" />
  <text x="661.0112" y="333.4472" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5561" font-weight="bold" fill="var(--warn-accent)">Operate</text>
  <text x="661.0112" y="346.5792" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Governance &amp; Control</text>
  <text x="661.0112" y="356.0341" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Continuous process</text>
  <path d="M 482.4163 217.8857 Q 419.3829 254.6553 408.8772 288.7984" fill="none" stroke="var(--primary-border)" stroke-width="1.1833" marker-end="url(#arrow)" />
  <text x="429.8884" y="246.776" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Data-driven</text>
  <path d="M 437.7676 351.8319 Q 524.4386 385.975 611.1097 351.8319" fill="none" stroke="var(--ok-border)" stroke-width="1.1833" marker-end="url(#arrow)" />
  <text x="524.4386" y="380.7222" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Implement changes</text>
  <path d="M 640 288.7984 Q 629.4944 254.6553 566.461 217.8857" fill="none" stroke="var(--warn-border)" stroke-width="1.1833" marker-end="url(#arrow)" />
  <text x="618.9888" y="246.776" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Feedback loop</text>
  <text x="524.4386" y="309.8095" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--text)">FinOps</text>
  <text x="524.4386" y="321.891" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Lifecycle</text>
  <text x="288.063" y="202.1274" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">Showback / Chargeback</text>
  <text x="288.063" y="211.5824" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">Tagging, Dashboards</text>
  <text x="288.063" y="375.4695" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Rightsizing, RIs</text>
  <text x="288.063" y="384.9244" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Savings Plans, Spot</text>
  <text x="760.8142" y="375.4695" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)">Budgets, Alerts</text>
  <text x="760.8142" y="384.9244" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)">Policies, Automation</text>
</svg>
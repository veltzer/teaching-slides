<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
  </defs>
  <rect width="952.5581" height="476.2791" fill="var(--bg)" rx="0" />
  <circle cx="476.2791" cy="104.186" r="70.6977" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2.2326" filter="url(#shadow)" />
  <text x="476.2791" y="96.7442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.3721" font-weight="bold" fill="var(--primary-dk)">Inform</text>
  <text x="476.2791" y="115.3488" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.6744" fill="var(--text-muted)">Visibility &amp; Allocation</text>
  <text x="476.2791" y="128.7442" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.9302" fill="var(--text-faint)">Understand cloud spend</text>
  <circle cx="282.7907" cy="327.4419" r="70.6977" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.2326" filter="url(#shadow)" />
  <text x="282.7907" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.3721" font-weight="bold" fill="var(--ok-dk)">Optimize</text>
  <text x="282.7907" y="338.6047" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.6744" fill="var(--text-muted)">Rates &amp; Usage</text>
  <text x="282.7907" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.9302" fill="var(--text-faint)">Reduce waste &amp; cost</text>
  <circle cx="669.7674" cy="327.4419" r="70.6977" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2.2326" filter="url(#shadow)" />
  <text x="669.7674" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.3721" font-weight="bold" fill="var(--warn-dk)">Operate</text>
  <text x="669.7674" y="338.6047" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.6744" fill="var(--text-muted)">Governance &amp; Control</text>
  <text x="669.7674" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.9302" fill="var(--text-faint)">Continuous process</text>
  <path d="M 416.7442 156.2791 Q 327.4419 208.3721 312.5581 256.7442" fill="none" stroke="var(--primary)" stroke-width="2.2326" marker-end="url(#arrow)" />
  <text x="342.3256" y="197.2093" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.9302" fill="var(--text-muted)">Data-driven</text>
  <path d="M 353.4884 346.0465 Q 476.2791 394.4186 599.0698 346.0465" fill="none" stroke="var(--ok)" stroke-width="2.2326" marker-end="url(#arrow)" />
  <text x="476.2791" y="386.9767" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.9302" fill="var(--text-muted)">Implement changes</text>
  <path d="M 640 256.7442 Q 625.1163 208.3721 535.814 156.2791" fill="none" stroke="var(--warn)" stroke-width="2.2326" marker-end="url(#arrow)" />
  <text x="610.2326" y="197.2093" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.9302" fill="var(--text-muted)">Feedback loop</text>
  <text x="476.2791" y="286.5116" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3953" font-weight="bold" fill="var(--text-dark)">FinOps</text>
  <text x="476.2791" y="303.6279" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.4186" fill="var(--text-muted)">Lifecycle</text>
  <text x="141.3953" y="133.9535" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.9302" fill="var(--primary)">Showback / Chargeback</text>
  <text x="141.3953" y="147.3488" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.9302" fill="var(--primary)">Tagging, Dashboards</text>
  <text x="141.3953" y="379.5349" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.9302" fill="var(--ok)">Rightsizing, RIs</text>
  <text x="141.3953" y="392.9302" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.9302" fill="var(--ok)">Savings Plans, Spot</text>
  <text x="811.1628" y="379.5349" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.9302" fill="var(--warn)">Budgets, Alerts</text>
  <text x="811.1628" y="392.9302" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.9302" fill="var(--warn)">Policies, Automation</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="999.9999" height="500" fill="var(--bg)" rx="6.2988" />
  <circle cx="640.0001" cy="189.3749" r="74.2188" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.2326" filter="url(#shadow)" />
  <text x="640.0001" y="181.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1875" font-weight="bold" fill="var(--primary-accent)">Inform</text>
  <text x="640.0001" y="201.0937" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--text-muted)">Visibility &amp; Allocation</text>
  <text x="640.0001" y="215.1563" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--text-faint)">Understand cloud spend</text>
  <circle cx="436.875" cy="423.75" r="74.2188" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.2326" filter="url(#shadow)" />
  <text x="436.875" y="415.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1875" font-weight="bold" fill="var(--ok-accent)">Optimize</text>
  <text x="436.875" y="435.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--text-muted)">Rates &amp; Usage</text>
  <text x="436.875" y="449.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--text-faint)">Reduce waste &amp; cost</text>
  <circle cx="843.125" cy="423.75" r="74.2188" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2326" filter="url(#shadow)" />
  <text x="843.125" y="415.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1875" font-weight="bold" fill="var(--warn-accent)">Operate</text>
  <text x="843.125" y="435.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--text-muted)">Governance &amp; Control</text>
  <text x="843.125" y="449.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--text-faint)">Continuous process</text>
  <path d="M 577.5 244.0625 Q 483.7501 298.75 468.125 349.5312" fill="none" stroke="var(--primary-border)" stroke-width="2.2326" marker-end="url(#arrow)" />
  <text x="499.375" y="287.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--text-muted)">Data-driven</text>
  <path d="M 511.0938 443.2812 Q 640.0001 494.0625 768.9063 443.2812" fill="none" stroke="var(--ok-border)" stroke-width="2.2326" marker-end="url(#arrow)" />
  <text x="640.0001" y="486.2499" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--text-muted)">Implement changes</text>
  <path d="M 811.875 349.5312 Q 796.25 298.75 702.5001 244.0625" fill="none" stroke="var(--warn-border)" stroke-width="2.2326" marker-end="url(#arrow)" />
  <text x="780.6251" y="287.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--text-muted)">Feedback loop</text>
  <text x="640.0001" y="380.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0624" font-weight="bold" fill="var(--text)">FinOps</text>
  <text x="640.0001" y="398.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--text-muted)">Lifecycle</text>
  <text x="288.4375" y="220.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--primary-accent)">Showback / Chargeback</text>
  <text x="288.4375" y="234.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--primary-accent)">Tagging, Dashboards</text>
  <text x="288.4375" y="478.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--ok-accent)">Rightsizing, RIs</text>
  <text x="288.4375" y="492.4999" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--ok-accent)">Savings Plans, Spot</text>
  <text x="991.5625" y="478.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--warn-accent)">Budgets, Alerts</text>
  <text x="991.5625" y="492.4999" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.498" fill="var(--warn-accent)">Policies, Automation</text>
</svg>
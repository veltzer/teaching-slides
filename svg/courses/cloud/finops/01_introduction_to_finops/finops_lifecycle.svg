<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect width="1060.4804" height="501.7572" fill="var(--bg)" rx="6" x="40" y="40"/>
  <circle cx="867.1748" cy="310.3215" r="76.5644" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.1833" filter="url(#shadow)" />
  <text x="867.1748" y="302.4817" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7306" font-weight="bold" fill="var(--primary-accent)">Inform</text>
  <text x="867.1748" y="322.0816" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--text-muted)">Visibility &amp; Allocation</text>
  <text x="867.1748" y="336.1935" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--text-faint)">Understand cloud spend</text>
  <circle cx="651.7648" cy="545.5204" r="76.5644" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1833" filter="url(#shadow)" />
  <text x="651.7648" y="537.6805" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7306" font-weight="bold" fill="var(--ok-accent)">Optimize</text>
  <text x="651.7648" y="557.2804" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--text-muted)">Rates &amp; Usage</text>
  <text x="651.7648" y="571.3921" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--text-faint)">Reduce waste &amp; cost</text>
  <circle cx="1082.585" cy="545.5204" r="76.5644" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1833" filter="url(#shadow)" />
  <text x="1082.585" y="537.6805" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7306" font-weight="bold" fill="var(--warn-accent)">Operate</text>
  <text x="1082.585" y="557.2804" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--text-muted)">Governance &amp; Control</text>
  <text x="1082.585" y="571.3921" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--text-faint)">Continuous process</text>
  <path d="M 800.8948 365.2013 Q 701.4749 420.0811 684.9047 471.0407" fill="none" stroke="var(--primary-border)" stroke-width="1.1833" marker-end="url(#arrow)" />
  <text x="718.0448" y="408.321" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--text-muted)">Data-driven</text>
  <path d="M 730.4723 565.1202 Q 867.1748 616.0799 1003.8774 565.1202" fill="none" stroke="var(--ok-border)" stroke-width="1.1833" marker-end="url(#arrow)" />
  <text x="867.1748" y="608.2399" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--text-muted)">Implement changes</text>
  <path d="M 1049.4449 471.0407 Q 1032.8748 420.0811 933.4549 365.2013" fill="none" stroke="var(--warn-border)" stroke-width="1.1833" marker-end="url(#arrow)" />
  <text x="1016.3048" y="408.321" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--text-muted)">Feedback loop</text>
  <text x="867.1748" y="502.4005" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" font-weight="bold" fill="var(--text)">FinOps</text>
  <text x="867.1748" y="520.4325" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--text-muted)">Lifecycle</text>
  <text x="494.3496" y="341.6815" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--primary-accent)">Showback / Chargeback</text>
  <text x="494.3496" y="355.7934" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--primary-accent)">Tagging, Dashboards</text>
  <text x="494.3496" y="600.4001" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--ok-accent)">Rightsizing, RIs</text>
  <text x="494.3496" y="614.5118" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--ok-accent)">Savings Plans, Spot</text>
  <text x="1240" y="600.4001" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--warn-accent)">Budgets, Alerts</text>
  <text x="1240" y="614.5118" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3431" fill="var(--warn-accent)">Policies, Automation</text>
</svg>
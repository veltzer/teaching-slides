<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>

  <!-- Inform circle (top) -->
  <circle cx="640" cy="140" r="95" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-dk)">Inform</text>
  <text x="640" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Visibility &amp; Allocation</text>
  <text x="640" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Understand cloud spend</text>

  <!-- Optimize circle (bottom-left) -->
  <circle cx="380" cy="440" r="95" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="3" filter="url(#shadow)"/>
  <text x="380" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-dk)">Optimize</text>
  <text x="380" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Rates &amp; Usage</text>
  <text x="380" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Reduce waste &amp; cost</text>

  <!-- Operate circle (bottom-right) -->
  <circle cx="900" cy="440" r="95" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="3" filter="url(#shadow)"/>
  <text x="900" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-dk)">Operate</text>
  <text x="900" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Governance &amp; Control</text>
  <text x="900" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Continuous process</text>

  <!-- Arrow: Inform -> Optimize (top to bottom-left) -->
  <path d="M560,210 Q440,280 420,345" fill="none" stroke="var(--primary)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="460" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Data-driven</text>

  <!-- Arrow: Optimize -> Operate (bottom-left to bottom-right) -->
  <path d="M475,465 Q640,530 805,465" fill="none" stroke="var(--ok)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Implement changes</text>

  <!-- Arrow: Operate -> Inform (bottom-right to top) -->
  <path d="M860,345 Q840,280 720,210" fill="none" stroke="var(--warn)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="820" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Feedback loop</text>

  <!-- Center label -->
  <text x="640" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)">FinOps</text>
  <text x="640" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Lifecycle</text>

  <!-- Descriptive annotations -->
  <text x="190" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary)">Showback / Chargeback</text>
  <text x="190" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary)">Tagging, Dashboards</text>

  <text x="190" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok)">Rightsizing, RIs</text>
  <text x="190" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok)">Savings Plans, Spot</text>

  <text x="1090" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn)">Budgets, Alerts</text>
  <text x="1090" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn)">Policies, Automation</text>
</svg>
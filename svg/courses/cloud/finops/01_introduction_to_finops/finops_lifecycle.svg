  <text x="504.5112" y="158.5219" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Visibility &amp; Allocation</text>
  <text x="504.5112" y="169.6074" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Understand cloud spend</text>
  <circle cx="344.388" cy="334.0416" r="58.5066" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.76" filter="url(#shadow)" />
  <text x="344.388" y="327.883" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5489" font-weight="bold" fill="var(--ok-accent)">Optimize</text>
  <text x="344.388" y="343.2795" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Rates &amp; Usage</text>
  <text x="344.388" y="354.3649" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Reduce waste &amp; cost</text>
  <circle cx="664.6343" cy="334.0416" r="58.5066" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.76" filter="url(#shadow)" />
  <text x="664.6343" y="327.883" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5489" font-weight="bold" fill="var(--warn-accent)">Operate</text>
  <text x="664.6343" y="343.2795" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Governance &amp; Control</text>
  <text x="664.6343" y="354.3649" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Continuous process</text>
  <path d="M 455.2425 192.3941 Q 381.3396 235.5042 369.0223 275.535" fill="none" stroke="var(--primary-border)" stroke-width="1.76" marker-end="url(#arrow)" />
  <text x="393.6567" y="226.2663" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Data-driven</text>
  <path d="M 402.8946 349.438 Q 504.5112 389.4688 606.1278 349.438" fill="none" stroke="var(--ok-border)" stroke-width="1.76" marker-end="url(#arrow)" />
  <text x="504.5112" y="383.3102" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Implement changes</text>
  <path d="M 640 275.535 Q 627.6828 235.5042 553.7799 192.3941" fill="none" stroke="var(--warn-border)" stroke-width="1.76" marker-end="url(#arrow)" />
  <text x="615.3657" y="226.2663" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Feedback loop</text>
  <text x="504.5112" y="300.1693" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0854" font-weight="bold" fill="var(--text)">FinOps</text>
  <text x="504.5112" y="314.3341" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Lifecycle</text>
  <text x="227.3749" y="173.9184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">Showback / Chargeback</text>
  <text x="227.3749" y="185.0038" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">Tagging, Dashboards</text>
  <text x="227.3749" y="377.1517" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Rightsizing, RIs</text>
  <text x="227.3749" y="388.237" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Savings Plans, Spot</text>
  <text x="781.6474" y="377.1517" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)">Budgets, Alerts</text>
  <text x="781.6474" y="388.237" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)">Policies, Automation</text>
</svg>
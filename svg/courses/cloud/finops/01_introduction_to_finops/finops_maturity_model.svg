<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Maturity bars (growing upward) -->
  <rect x="171.25" y="384.375" width="93.75" height="108.75" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="499.375" y="311.875" width="93.75" height="181.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="827.5" y="221.25" width="93.75" height="271.875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>

  <!-- Arrows between stages -->
  <line x1="396.25" y1="348.125" x2="461.875" y2="348.125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="724.375" y1="348.125" x2="790" y2="348.125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 1: Crawl -->
  <rect x="96.25" y="67.1875" width="318.75" height="280.9375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="255.625" y="98.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9653" font-weight="bold" fill="var(--danger-accent)">Crawl</text>
  <line x1="115" y1="110.6875" x2="396.25" y2="110.6875" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="124.375" y="135.1562" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Reactive cost management</text>
  <text x="124.375" y="159.625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Basic tagging in place</text>
  <text x="124.375" y="184.0938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Monthly cost reviews</text>
  <text x="124.375" y="208.5625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Limited visibility</text>
  <text x="124.375" y="233.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Spreadsheet-based tracking</text>
  <text x="124.375" y="264.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)">Typical: 0-6 months</text>

  <!-- Stage 2: Walk -->
  <rect x="433.75" y="67.1875" width="318.75" height="280.9375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="593.125" y="98.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9653" font-weight="bold" fill="var(--warn-accent)">Walk</text>
  <line x1="452.5" y1="110.6875" x2="733.75" y2="110.6875" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="461.875" y="135.1562" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Proactive optimization</text>
  <text x="461.875" y="159.625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Consistent tagging policy</text>
  <text x="461.875" y="184.0938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Weekly cost reviews</text>
  <text x="461.875" y="208.5625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Automated alerts</text>
  <text x="461.875" y="233.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Commitment-based savings</text>
  <text x="461.875" y="264.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)">Typical: 6-18 months</text>

  <!-- Stage 3: Run -->
  <rect x="771.25" y="67.1875" width="318.75" height="280.9375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.625" y="98.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9653" font-weight="bold" fill="var(--ok-accent)">Run</text>
  <line x1="790" y1="110.6875" x2="1071.25" y2="110.6875" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="799.375" y="135.1562" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Continuous optimization</text>
  <text x="799.375" y="159.625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Full automation &amp; governance</text>
  <text x="799.375" y="184.0938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Real-time cost awareness</text>
  <text x="799.375" y="208.5625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Engineering-driven culture</text>
  <text x="799.375" y="233.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Predictive cost modeling</text>
  <text x="799.375" y="264.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)">Typical: 18+ months</text>

  <!-- Bottom axis line -->
  <line x1="133.75" y1="520.3125" x2="977.5" y2="520.3125" stroke="var(--border)" stroke-width="2"/>
  <text x="555.625" y="556.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">Maturity Progression</text>

  <!-- Bar labels -->
  <text x="218.125" y="511.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--danger-accent)">Low</text>
  <text x="546.25" y="511.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Medium</text>
  <text x="874.375" y="511.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">High</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Maturity bars (growing upward) -->
  <rect x="130.566038" y="415.925926" width="113.207547" height="128.888889" rx="7.177884" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="526.792453" y="330" width="113.207547" height="214.814815" rx="7.177884" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="923.018868" y="222.592593" width="113.207547" height="322.222222" rx="7.177884" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Arrows between stages -->
  <line x1="402.264151" y1="372.962963" x2="481.509434" y2="372.962963" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="798.490566" y1="372.962963" x2="877.735849" y2="372.962963" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 1: Crawl -->
  <rect x="40" y="40" width="384.90566" height="332.962963" rx="7.177884" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.45283" y="77.592533" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.670022" font-weight="bold" fill="var(--danger-accent)">Crawl</text>
  <line x1="62.641509" y1="91.555556" x2="402.264151" y2="91.555556" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="73.962264" y="120.555496" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Reactive cost management</text>
  <text x="73.962264" y="149.555556" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Basic tagging in place</text>
  <text x="73.962264" y="178.555615" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Monthly cost reviews</text>
  <text x="73.962264" y="207.555556" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Limited visibility</text>
  <text x="73.962264" y="236.555496" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Spreadsheet-based tracking</text>
  <text x="73.962264" y="274.148148" font-family="Arial, sans-serif" font-size="14.335071" fill="var(--text-faint)">Typical: 0-6 months</text>

  <!-- Stage 2: Walk -->
  <rect x="447.54717" y="40" width="384.90566" height="332.962963" rx="7.177884" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.592533" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.670022" font-weight="bold" fill="var(--warn-accent)">Walk</text>
  <line x1="470.188679" y1="91.555556" x2="809.811321" y2="91.555556" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="481.509434" y="120.555496" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Proactive optimization</text>
  <text x="481.509434" y="149.555556" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Consistent tagging policy</text>
  <text x="481.509434" y="178.555615" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Weekly cost reviews</text>
  <text x="481.509434" y="207.555556" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Automated alerts</text>
  <text x="481.509434" y="236.555496" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Commitment-based savings</text>
  <text x="481.509434" y="274.148148" font-family="Arial, sans-serif" font-size="14.335071" fill="var(--text-faint)">Typical: 6-18 months</text>

  <!-- Stage 3: Run -->
  <rect x="855.09434" y="40" width="384.90566" height="332.962963" rx="7.177884" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.54717" y="77.592533" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.670022" font-weight="bold" fill="var(--ok-accent)">Run</text>
  <line x1="877.735849" y1="91.555556" x2="1217.358491" y2="91.555556" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="889.056604" y="120.555496" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Continuous optimization</text>
  <text x="889.056604" y="149.555556" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Full automation &amp; governance</text>
  <text x="889.056604" y="178.555615" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Real-time cost awareness</text>
  <text x="889.056604" y="207.555556" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Engineering-driven culture</text>
  <text x="889.056604" y="236.555496" font-family="Arial, sans-serif" font-size="15.437713" fill="var(--text)">Predictive cost modeling</text>
  <text x="889.056604" y="274.148148" font-family="Arial, sans-serif" font-size="14.335071" fill="var(--text-faint)">Typical: 18+ months</text>

  <!-- Bottom axis line -->
  <line x1="85.283019" y1="577.037037" x2="1104.150943" y2="577.037037" stroke="var(--border)" stroke-width="2"/>
  <text x="594.716981" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.643118" fill="var(--text-muted)">Maturity Progression</text>

  <!-- Bar labels -->
  <text x="187.169811" y="566.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.335071" font-weight="bold" fill="var(--danger-accent)">Low</text>
  <text x="583.396226" y="566.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.335071" font-weight="bold" fill="var(--warn-accent)">Medium</text>
  <text x="979.622642" y="566.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.335071" font-weight="bold" fill="var(--ok-accent)">High</text>
</svg>
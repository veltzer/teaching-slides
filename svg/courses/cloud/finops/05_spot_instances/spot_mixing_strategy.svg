<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Load Balancer at top -->
  <rect x="425.714286" y="40" width="428.571429" height="60" rx="6.737879" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="76.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631808" font-weight="bold" fill="var(--info-accent)">Application Load Balancer</text>

  <!-- Arrow from LB down -->
  <line x1="640" y1="100" x2="640" y2="140" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Auto Scaling Group box -->
  <rect x="40" y="150" width="1200" height="370" rx="6.737879" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="640" y="184.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631808" font-weight="bold" fill="var(--text)">Auto Scaling Group (Mixed Instances Policy)</text>

  <!-- On-Demand section (30%) -->
  <rect x="72.142857" y="204.999945" width="332.142857" height="290" rx="6.737879" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="238.214286" y="235.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561595" font-weight="bold" fill="var(--primary-accent)">On-Demand (30%)</text>
  <text x="238.214286" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--text-muted)">Baseline capacity - always available</text>

  <!-- On-Demand instances -->
  <rect x="98.928571" y="275.000055" width="123.214286" height="70" rx="6.737879" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="160" y="303.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" font-weight="bold" fill="var(--primary-accent)">m5.xlarge</text>
  <text x="160" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" fill="var(--text-faint)">On-Demand</text>

  <rect x="243.571429" y="275.000055" width="123.214286" height="70" rx="6.737879" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="304.642857" y="303.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" font-weight="bold" fill="var(--primary-accent)">m5.xlarge</text>
  <text x="304.642857" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" fill="var(--text-faint)">On-Demand</text>

  <rect x="163.214286" y="360" width="123.214286" height="70" rx="6.737879" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="224.285714" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" font-weight="bold" fill="var(--primary-accent)">m5.xlarge</text>
  <text x="224.285714" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" fill="var(--text-faint)">On-Demand</text>

  <text x="238.214286" y="464.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456331" font-weight="bold" fill="var(--primary-accent)">$0.192/hr each</text>

  <!-- Spot section (70%) -->
  <rect x="447.142857" y="204.999945" width="760.714286" height="290" rx="6.737879" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="827.5" y="235.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561595" font-weight="bold" fill="var(--ok-accent)">Spot Instances (70%)</text>
  <text x="827.5" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--text-muted)">Elastic capacity - diversified across pools</text>

  <!-- Spot instances (7 boxes) -->
  <rect x="468.571429" y="275.000055" width="107.142857" height="70" rx="6.737879" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="522.142857" y="303.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" font-weight="bold" fill="var(--ok-accent)">m5.xlarge</text>
  <text x="522.142857" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.229799" fill="var(--ok-accent)">Spot</text>

  <rect x="591.785714" y="275.000055" width="107.142857" height="70" rx="6.737879" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="645.357143" y="303.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" font-weight="bold" fill="var(--ok-accent)">m5a.xlarge</text>
  <text x="645.357143" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.229799" fill="var(--ok-accent)">Spot</text>

  <rect x="715" y="275.000055" width="107.142857" height="70" rx="6.737879" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="768.571429" y="303.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" font-weight="bold" fill="var(--ok-accent)">m4.xlarge</text>
  <text x="768.571429" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.229799" fill="var(--ok-accent)">Spot</text>

  <rect x="838.214286" y="275.000055" width="107.142857" height="70" rx="6.737879" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="891.785714" y="303.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" font-weight="bold" fill="var(--ok-accent)">r5.xlarge</text>
  <text x="891.785714" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.229799" fill="var(--ok-accent)">Spot</text>

  <rect x="961.428571" y="275.000055" width="107.142857" height="70" rx="6.737879" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="1015" y="303.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" font-weight="bold" fill="var(--ok-accent)">c5.xlarge</text>
  <text x="1015" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.229799" fill="var(--ok-accent)">Spot</text>

  <rect x="532.857143" y="360" width="107.142857" height="70" rx="6.737879" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="586.428571" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" font-weight="bold" fill="var(--ok-accent)">m5.2xlarge</text>
  <text x="586.428571" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.229799" fill="var(--ok-accent)">Spot</text>

  <rect x="656.071429" y="360" width="107.142857" height="70" rx="6.737879" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="709.642857" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" font-weight="bold" fill="var(--ok-accent)">m5a.2xlarge</text>
  <text x="709.642857" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.229799" fill="var(--ok-accent)">Spot</text>

  <text x="827.5" y="464.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456331" font-weight="bold" fill="var(--ok-accent)">~$0.058/hr each (avg)</text>

  <!-- Interruption Handler -->
  <rect x="918.571429" y="375.000055" width="225" height="60" rx="6.737879" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1031.071429" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456331" font-weight="bold" fill="var(--warn-accent)">Interruption Handler</text>
  <text x="1031.071429" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" fill="var(--text-muted)">Graceful drain + replace</text>

  <!-- Savings annotation -->
  <rect x="372.142857" y="550" width="535.714286" height="70" rx="6.737879" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.702021" font-weight="bold" fill="var(--ok-accent)">Up to 70% Savings</text>
  <text x="640" y="604.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491381" fill="var(--text-muted)">vs. 100% On-Demand pricing with maintained availability</text>
</svg>
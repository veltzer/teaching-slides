<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Load Balancer at top -->
  <rect x="452.5" y="58.125" width="375" height="54.375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="91.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--info-accent)">Application Load Balancer</text>

  <!-- Arrow from LB down -->
  <line x1="640" y1="112.5" x2="640" y2="148.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Auto Scaling Group box -->
  <rect x="115" y="157.8125" width="1050" height="335.3125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="640" y="189.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)">Auto Scaling Group (Mixed Instances Policy)</text>

  <!-- On-Demand section (30%) -->
  <rect x="143.125" y="207.6562" width="290.625" height="262.8125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="288.4375" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)">On-Demand (30%)</text>
  <text x="288.4375" y="255.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Baseline capacity - always available</text>

  <!-- On-Demand instances -->
  <rect x="166.5625" y="271.0938" width="107.8125" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="296.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">m5.xlarge</text>
  <text x="220" y="316.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">On-Demand</text>

  <rect x="293.125" y="271.0938" width="107.8125" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="346.5625" y="296.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">m5.xlarge</text>
  <text x="346.5625" y="316.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">On-Demand</text>

  <rect x="222.8125" y="348.125" width="107.8125" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="276.25" y="373.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">m5.xlarge</text>
  <text x="276.25" y="393.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">On-Demand</text>

  <text x="288.4375" y="443.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">$0.192/hr each</text>

  <!-- Spot section (70%) -->
  <rect x="471.25" y="207.6562" width="665.625" height="262.8125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="804.0625" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">Spot Instances (70%)</text>
  <text x="804.0625" y="255.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Elastic capacity - diversified across pools</text>

  <!-- Spot instances (7 boxes) -->
  <rect x="490" y="271.0938" width="93.75" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="536.875" y="296.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--ok-accent)">m5.xlarge</text>
  <text x="536.875" y="316.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Spot</text>

  <rect x="597.8125" y="271.0938" width="93.75" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="644.6875" y="296.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--ok-accent)">m5a.xlarge</text>
  <text x="644.6875" y="316.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Spot</text>

  <rect x="705.625" y="271.0938" width="93.75" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="752.5" y="296.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--ok-accent)">m4.xlarge</text>
  <text x="752.5" y="316.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Spot</text>

  <rect x="813.4375" y="271.0938" width="93.75" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="860.3125" y="296.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--ok-accent)">r5.xlarge</text>
  <text x="860.3125" y="316.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Spot</text>

  <rect x="921.25" y="271.0938" width="93.75" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="968.125" y="296.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--ok-accent)">c5.xlarge</text>
  <text x="968.125" y="316.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Spot</text>

  <rect x="546.25" y="348.125" width="93.75" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="593.125" y="373.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--ok-accent)">m5.2xlarge</text>
  <text x="593.125" y="393.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Spot</text>

  <rect x="654.0625" y="348.125" width="93.75" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700.9375" y="373.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--ok-accent)">m5a.2xlarge</text>
  <text x="700.9375" y="393.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Spot</text>

  <text x="804.0625" y="443.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">~$0.058/hr each (avg)</text>

  <!-- Interruption Handler -->
  <rect x="883.75" y="361.7188" width="196.875" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.1875" y="384.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Interruption Handler</text>
  <text x="982.1875" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Graceful drain + replace</text>

  <!-- Savings annotation -->
  <rect x="405.625" y="520.3125" width="468.75" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--ok-accent)">Up to 70% Savings</text>
  <text x="640" y="570.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">vs. 100% On-Demand pricing with maintained availability</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>

  <!-- Load Balancer at top -->
  <rect x="440" y="20" width="400" height="60" rx="10" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="640" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-dk)">Application Load Balancer</text>

  <!-- Arrow from LB down -->
  <line x1="640" y1="80" x2="640" y2="120" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Auto Scaling Group box -->
  <rect x="80" y="130" width="1120" height="370" rx="14" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="640" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)">Auto Scaling Group (Mixed Instances Policy)</text>

  <!-- On-Demand section (30%) -->
  <rect x="110" y="185" width="310" height="290" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
  <text x="265" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)">On-Demand (30%)</text>
  <text x="265" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Baseline capacity - always available</text>

  <!-- On-Demand instances -->
  <rect x="135" y="255" width="115" height="70" rx="8" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="192" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">m5.xlarge</text>
  <text x="192" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">On-Demand</text>

  <rect x="270" y="255" width="115" height="70" rx="8" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="327" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">m5.xlarge</text>
  <text x="327" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">On-Demand</text>

  <rect x="195" y="340" width="115" height="70" rx="8" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="252" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">m5.xlarge</text>
  <text x="252" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">On-Demand</text>

  <text x="265" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary)">$0.192/hr each</text>

  <!-- Spot section (70%) -->
  <rect x="460" y="185" width="710" height="290" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2"/>
  <text x="815" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)">Spot Instances (70%)</text>
  <text x="815" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Elastic capacity - diversified across pools</text>

  <!-- Spot instances (7 boxes) -->
  <rect x="480" y="255" width="100" height="70" rx="8" fill="var(--bg)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="530" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-dk)">m5.xlarge</text>
  <text x="530" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok)">Spot</text>

  <rect x="595" y="255" width="100" height="70" rx="8" fill="var(--bg)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="645" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-dk)">m5a.xlarge</text>
  <text x="645" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok)">Spot</text>

  <rect x="710" y="255" width="100" height="70" rx="8" fill="var(--bg)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-dk)">m4.xlarge</text>
  <text x="760" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok)">Spot</text>

  <rect x="825" y="255" width="100" height="70" rx="8" fill="var(--bg)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="875" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-dk)">r5.xlarge</text>
  <text x="875" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok)">Spot</text>

  <rect x="940" y="255" width="100" height="70" rx="8" fill="var(--bg)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="990" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-dk)">c5.xlarge</text>
  <text x="990" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok)">Spot</text>

  <rect x="540" y="340" width="100" height="70" rx="8" fill="var(--bg)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-dk)">m5.2xlarge</text>
  <text x="590" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok)">Spot</text>

  <rect x="655" y="340" width="100" height="70" rx="8" fill="var(--bg)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="705" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-dk)">m5a.2xlarge</text>
  <text x="705" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok)">Spot</text>

  <text x="815" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok)">~$0.058/hr each (avg)</text>

  <!-- Interruption Handler -->
  <rect x="900" y="355" width="210" height="60" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1005" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">Interruption Handler</text>
  <text x="1005" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Graceful drain + replace</text>

  <!-- Savings annotation -->
  <rect x="390" y="530" width="500" height="70" rx="12" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-dk)">Up to 70% Savings</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">vs. 100% On-Demand pricing with maintained availability</text>
</svg>
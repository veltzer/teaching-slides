<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579135622711" font-weight="bold" fill="var(--text)">Comparing On-Prem vs Cloud TCO</text>

  <!-- Header row -->
  <rect x="40" y="76.576576576577" width="400" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="240" y="116.288288288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--text)">Cost Component</text>

  <rect x="450" y="76.576576576577" width="380" height="62.702702702703" rx="6.133646682164" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="116.288288288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--primary-text)">On-Prem</text>

  <rect x="840" y="76.576576576577" width="400" height="62.702702702703" rx="6.133646682164" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="116.288288288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--info-text)">Cloud</text>

  <!-- Row 1: Compute -->
  <rect x="40" y="149.72972972973" width="400" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="188.396396396396" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--text)">Compute</text>
  <rect x="450" y="149.72972972973" width="380" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="470" y="188.396396396396" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Server purchase + depreciation</text>
  <rect x="840" y="149.72972972973" width="400" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860" y="188.396396396396" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Per-hour usage, RIs, Savings Plans</text>

  <!-- Row 2: Storage -->
  <rect x="40" y="222.882882882883" width="400" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="261.54954954955" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--text)">Storage</text>
  <rect x="450" y="222.882882882883" width="380" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="470" y="261.54954954955" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Array purchase, capacity tiers</text>
  <rect x="840" y="222.882882882883" width="400" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860" y="261.54954954955" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Per-GB-month, tier transitions</text>

  <!-- Row 3: Network -->
  <rect x="40" y="296.036036036036" width="400" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="334.702702702703" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--text)">Network</text>
  <rect x="450" y="296.036036036036" width="380" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="470" y="334.702702702703" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Switches, cabling, ISP</text>
  <rect x="840" y="296.036036036036" width="400" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860" y="334.702702702703" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Egress fees, NAT, transit</text>

  <!-- Row 4: Power -->
  <rect x="40" y="369.189189189189" width="400" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="407.855855855856" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--text)">Power+Cooling</text>
  <rect x="450" y="369.189189189189" width="380" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="470" y="407.855855855856" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Direct cost, varies by PUE</text>
  <rect x="840" y="369.189189189189" width="400" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860" y="407.855855855856" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Bundled into compute price</text>

  <!-- Row 5: Personnel -->
  <rect x="40" y="442.342342342342" width="400" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="481.009009009009" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--text)">Personnel</text>
  <rect x="450" y="442.342342342342" width="380" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="470" y="481.009009009009" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Datacenter ops, hardware staff</text>
  <rect x="840" y="442.342342342342" width="400" height="62.702702702703" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860" y="481.009009009009" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Cloud engineers, FinOps team</text>

  <!-- Bottom row: unit cost -->
  <rect x="40" y="536.396396396396" width="400" height="83.603603603604" rx="6.133646682164" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="572.972972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--warn-text)">Unit cost</text>
  <text x="240" y="599.099099099099" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">$/vCPU-hour, $/GB-month</text>

  <rect x="450" y="536.396396396396" width="380" height="83.603603603604" rx="6.133646682164" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="572.972972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--warn-text)">TCO ÷ effective capacity</text>
  <text x="640" y="599.099099099099" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Lower at high utilization</text>

  <rect x="840" y="536.396396396396" width="400" height="83.603603603604" rx="6.133646682164" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="572.972972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--warn-text)">List rate × commitment factor</text>
  <text x="1040" y="599.099099099099" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Lower at variable demand</text>
</svg>

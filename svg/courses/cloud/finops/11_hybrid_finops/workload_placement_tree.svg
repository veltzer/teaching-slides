<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Root question -->
  <rect x="490" y="40" width="300" height="82.857142857143" rx="6.106202935189" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--primary-text)">New Workload</text>
  <text x="640" y="102.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">Where does it run?</text>

  <!-- Q1: Compliance constraint? -->
  <rect x="490" y="164.285714285714" width="300" height="82.857142857143" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--warn-text)">Compliance constraint?</text>
  <text x="640" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">Data sovereignty, GDPR</text>

  <!-- Q1 Yes -> on-prem -->
  <rect x="40" y="288.571428571429" width="280" height="82.857142857143" rx="6.106202935189" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--danger-text)">On-Prem</text>
  <text x="180" y="350.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--danger-text)">Required by regulation</text>

  <!-- Q2: Bursty demand? -->
  <rect x="490" y="288.571428571429" width="300" height="82.857142857143" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--warn-text)">Bursty / variable load?</text>
  <text x="640" y="350.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">Spikes 5x or more</text>

  <!-- Q2 Yes -> cloud -->
  <rect x="960" y="288.571428571429" width="280" height="82.857142857143" rx="6.106202935189" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--info-text)">Cloud</text>
  <text x="1100" y="350.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">Elastic, auto-scaling</text>

  <!-- Q3: Steady high utilization? -->
  <rect x="490" y="412.857142857143" width="300" height="82.857142857143" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="449.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--warn-text)">Steady, high utilization?</text>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">24/7, predictable</text>

  <!-- Q3 Yes -> on-prem (or reserved) -->
  <rect x="40" y="537.142857142857" width="280" height="82.857142857143" rx="6.106202935189" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="573.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--danger-text)">On-Prem or RIs</text>
  <text x="180" y="599.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--danger-text)">Cheaper at scale</text>

  <!-- Q3 No -> cloud default -->
  <rect x="960" y="537.142857142857" width="280" height="82.857142857143" rx="6.106202935189" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="573.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--info-text)">Cloud default</text>
  <text x="1100" y="599.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">Faster, more flexible</text>

  <!-- Connectors with Yes/No labels -->
  <line x1="640" y1="122.857142857143" x2="640" y2="164.285714285714" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="490" y1="205.714285714286" x2="320" y2="288.571428571429" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="247.142857142857" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--text)">Yes</text>
  <line x1="640" y1="247.142857142857" x2="640" y2="288.571428571429" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="273.035714285714" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--text)">No</text>

  <line x1="790" y1="330" x2="960" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="319.642857142857" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--text)">Yes</text>
  <line x1="640" y1="371.428571428571" x2="640" y2="412.857142857143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="397.321428571429" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--text)">No</text>

  <line x1="490" y1="454.285714285714" x2="320" y2="537.142857142857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="495.714285714286" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--text)">Yes</text>
  <line x1="790" y1="454.285714285714" x2="960" y2="537.142857142857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="495.714285714286" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--text)">No</text>
</svg>

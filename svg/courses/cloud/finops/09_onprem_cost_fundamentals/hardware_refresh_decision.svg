<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Top: starting question -->
  <rect x="440" y="40" width="400" height="90.782608695652" rx="6.026030490983" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="80.347826086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.104121963933" font-weight="bold" fill="var(--primary-text)">Hardware aging?</text>
  <text x="640" y="110.608695652174" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076227458" fill="var(--primary-text)">Refresh decision triggers</text>

  <!-- Five trigger boxes -->
  <rect x="40" y="181.217391304348" width="220" height="141.217391304348" rx="6.026030490983" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="221.565217391304" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073753057786" font-weight="bold" fill="var(--warn-text)">Support Ending</text>
  <text x="150" y="261.913043478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">Vendor EOL</text>
  <text x="150" y="287.130434782609" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">Costly extensions</text>

  <rect x="290" y="181.217391304348" width="220" height="141.217391304348" rx="6.026030490983" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="221.565217391304" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073753057786" font-weight="bold" fill="var(--warn-text)">Power Hungry</text>
  <text x="400" y="261.913043478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">New gen efficient</text>
  <text x="400" y="287.130434782609" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">Lower draw</text>

  <rect x="540" y="181.217391304348" width="220" height="141.217391304348" rx="6.026030490983" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="221.565217391304" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073753057786" font-weight="bold" fill="var(--warn-text)">Perf Limit</text>
  <text x="650" y="261.913043478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">Workload outgrew</text>
  <text x="650" y="287.130434782609" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">capacity</text>

  <rect x="790" y="181.217391304348" width="220" height="141.217391304348" rx="6.026030490983" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="221.565217391304" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073753057786" font-weight="bold" fill="var(--warn-text)">Maintenance</text>
  <text x="900" y="261.913043478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">Repairs exceed</text>
  <text x="900" y="287.130434782609" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">replacement</text>

  <rect x="1040" y="181.217391304348" width="200" height="141.217391304348" rx="6.026030490983" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="221.565217391304" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073753057786" font-weight="bold" fill="var(--warn-text)">Failure Rate</text>
  <text x="1140" y="261.913043478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">Disks failing</text>
  <text x="1140" y="287.130434782609" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">often</text>

  <line x1="540" y1="130.782608695652" x2="150" y2="181.217391304348" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="580" y1="130.782608695652" x2="400" y2="181.217391304348" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="640" y1="130.782608695652" x2="650" y2="181.217391304348" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="700" y1="130.782608695652" x2="900" y2="181.217391304348" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="740" y1="130.782608695652" x2="1140" y2="181.217391304348" stroke="var(--text-muted)" stroke-width="1.5"/>

  <!-- Decision label -->
  <text x="640" y="367.826086956522" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768303278" font-weight="bold" fill="var(--text)">If 2+ triggers fire: action required</text>

  <!-- Three outcome boxes -->
  <rect x="40" y="403.130434782609" width="380" height="181.565217391304" rx="6.026030490983" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="448.521739130435" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445133606" font-weight="bold" fill="var(--ok-text)">Refresh in place</text>
  <text x="230" y="493.913043478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076227458" fill="var(--ok-text)">Replace, same workload</text>
  <text x="230" y="524.173913043478" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076227458" fill="var(--ok-text)">Plan 12-18mo ahead</text>
  <text x="230" y="554.434782608696" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076227458" fill="var(--ok-text)">Negotiate trade-ins</text>

  <rect x="450" y="403.130434782609" width="380" height="181.565217391304" rx="6.026030490983" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="448.521739130435" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445133606" font-weight="bold" fill="var(--info-text)">Move to cloud</text>
  <text x="640" y="493.913043478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076227458" fill="var(--info-text)">Skip the refresh</text>
  <text x="640" y="524.173913043478" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076227458" fill="var(--info-text)">CapEx becomes OpEx</text>
  <text x="640" y="554.434782608696" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076227458" fill="var(--info-text)">Compare full TCO</text>

  <rect x="860" y="403.130434782609" width="380" height="181.565217391304" rx="6.026030490983" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="448.521739130435" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445133606" font-weight="bold" fill="var(--danger-text)">Decommission</text>
  <text x="1050" y="493.913043478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076227458" fill="var(--danger-text)">Workload retired</text>
  <text x="1050" y="524.173913043478" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076227458" fill="var(--danger-text)">Reclaim rack/power</text>
  <text x="1050" y="554.434782608696" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076227458" fill="var(--danger-text)">Disposal cost</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076227458" font-style="italic" fill="var(--text-muted)">Cycles: servers 4-5y, storage 5-7y, network 7-10y</text>
</svg>

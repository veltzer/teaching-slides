  <line x1="152.5" y1="225.7812" x2="1146.25" y2="225.7812" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="152.5" y1="262.0312" x2="1146.25" y2="262.0312" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="152.5" y1="298.2812" x2="1146.25" y2="298.2812" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>


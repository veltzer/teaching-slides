  <rect x="865" y="542.9688" width="112.5" height="27.1875" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="921.25" y="538.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--primary-accent)">$10.8k</text>

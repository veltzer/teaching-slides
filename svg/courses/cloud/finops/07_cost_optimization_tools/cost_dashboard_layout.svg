  <line x1="227.5" y1="434.2188" x2="227.5" y2="570.1562" stroke="var(--border)" stroke-width="1"/>
  <line x1="227.5" y1="570.1562" x2="1146.25" y2="570.1562" stroke="var(--border)" stroke-width="1"/>

  <!-- Bars -->
  <rect x="265" y="443.2812" width="112.5" height="126.875" rx="6" fill="var(--primary-fill)" opacity="0.85" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="321.25" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--primary-accent)">$48.2k</text>
  <text x="321.25" y="583.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Platform</text>

  <rect x="415" y="470.4688" width="112.5" height="99.6875" rx="6" fill="var(--primary-fill)" opacity="0.7" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="471.25" y="465.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--primary-accent)">$38.1k</text>
  <text x="471.25" y="583.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Backend</text>

  <rect x="565" y="497.6562" width="112.5" height="72.5" rx="6" fill="var(--primary-fill)" opacity="0.55" stroke="var(--primary-border)" stroke-width="2"/>

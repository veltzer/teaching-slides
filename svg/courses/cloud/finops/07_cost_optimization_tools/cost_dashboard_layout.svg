  <text x="197.5" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Jan</text>
  <text x="362.5" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Mar</text>
  <text x="527.5" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">May</text>
  <text x="692.5" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Jul</text>

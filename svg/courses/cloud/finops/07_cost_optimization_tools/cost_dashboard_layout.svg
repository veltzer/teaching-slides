  <text x="621.25" y="583.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Data</text>

  <rect x="715" y="515.7812" width="112.5" height="54.375" rx="6" fill="var(--primary-fill)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2"/>

  <rect x="450" y="54.999945" width="380" height="310" rx="6.50941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="450" y="54.999945" width="380" height="50" rx="6.50941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="450" y="86.999945" width="380" height="18" fill="url(#grad-ok)" rx="6.50941" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.000053" font-weight="bold" fill="var(--bg)">Azure</text>


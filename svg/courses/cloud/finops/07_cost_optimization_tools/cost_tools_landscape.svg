<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Section label -->
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.00002" font-weight="bold" fill="var(--text-faint)">Native Cloud Provider Tools</text>

  <!-- Column 1: AWS Tools -->
  <rect x="40" y="54.999945" width="380" height="310" rx="6.50941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="54.999945" width="380" height="50" rx="6.50941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="86.999945" width="380" height="18" fill="url(#grad-primary)" rx="6.50941" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.000053" font-weight="bold" fill="var(--bg)">AWS</text>

  <rect x="65" y="120" width="330" height="55.000055" rx="6.50941" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="230" y="142.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.999958" font-weight="bold" fill="var(--primary-accent)">Cost Explorer</text>
  <text x="230" y="162.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--text-muted)">Visualize and analyze costs</text>

  <rect x="65" y="186.999945" width="330" height="55.000055" rx="6.50941" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="230" y="209.99989" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.999958" font-weight="bold" fill="var(--primary-accent)">Compute Optimizer</text>
  <text x="230" y="229.99989" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--text-muted)">ML-based rightsizing recommendations</text>

  <rect x="65" y="253.99989" width="330" height="55.000055" rx="6.50941" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="230" y="276.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.999958" font-weight="bold" fill="var(--primary-accent)">Cost &amp; Usage Report (CUR)</text>
  <text x="230" y="296.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--text-muted)">Detailed line-item billing data</text>

  <text x="230" y="344.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--primary-accent)">+ Trusted Advisor, Budgets</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Section label -->
  <text x="640" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-faint)">Native Cloud Provider Tools</text>

  <!-- Column 1: AWS Tools -->
  <rect x="40" y="50" width="380" height="310" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="50" width="380" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="82" width="380" height="18" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="230" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">AWS</text>

  <rect x="65" y="115" width="330" height="55" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="230" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Cost Explorer</text>
  <text x="230" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Visualize and analyze costs</text>

  <rect x="65" y="182" width="330" height="55" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="230" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Compute Optimizer</text>
  <text x="230" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">ML-based rightsizing recommendations</text>

  <rect x="65" y="249" width="330" height="55" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="230" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Cost &amp; Usage Report (CUR)</text>
  <text x="230" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Detailed line-item billing data</text>

  <text x="230" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">+ Trusted Advisor, Budgets</text>

  <!-- Column 2: Azure Tools -->
  <rect x="450" y="50" width="380" height="310" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="450" y="50" width="380" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="450" y="82" width="380" height="18" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">Azure</text>

  <rect x="475" y="115" width="330" height="55" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="640" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Cost Management</text>
  <text x="640" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Monitor, allocate, optimize costs</text>

  <rect x="475" y="182" width="330" height="55" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="640" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Azure Advisor</text>
  <text x="640" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Personalized best practices</text>

  <rect x="475" y="249" width="330" height="55" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="640" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Reservations + Savings Plans</text>
  <text x="640" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Commitment recommendations</text>

  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">+ Power BI integration</text>

  <!-- Column 3: GCP Tools -->
  <rect x="860" y="50" width="380" height="310" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860" y="50" width="380" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="860" y="82" width="380" height="18" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1050" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">GCP</text>

  <rect x="885" y="115" width="330" height="55" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="1050" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-accent)">Cloud Billing</text>
  <text x="1050" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Billing reports and exports</text>

  <rect x="885" y="182" width="330" height="55" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="1050" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-accent)">Recommender</text>
  <text x="1050" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">ML-driven optimization advice</text>

  <rect x="885" y="249" width="330" height="55" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="1050" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-accent)">BigQuery Billing Export</text>
  <text x="1050" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Detailed billing in BigQuery</text>

  <text x="1050" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)">+ Active Assist, Budgets API</text>

  <!-- Third-party row -->
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-faint)">Third-Party / Multi-Cloud Tools</text>

  <rect x="40" y="415" width="1200" height="200" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Tool 1 -->
  <rect x="75" y="445" width="220" height="80" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="185" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-accent)">CloudHealth</text>
  <text x="185" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Multi-cloud cost management</text>

  <!-- Tool 2 -->
  <rect x="325" y="445" width="220" height="80" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="435" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-accent)">Spot.io (NetApp)</text>
  <text x="435" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Spot automation &amp; optimization</text>

  <!-- Tool 3 -->
  <rect x="575" y="445" width="220" height="80" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="685" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-accent)">Kubecost</text>
  <text x="685" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Kubernetes cost monitoring</text>

  <!-- Tool 4 -->
  <rect x="825" y="445" width="220" height="80" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="935" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-accent)">Apptio Cloudability</text>
  <text x="935" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Enterprise FinOps platform</text>

  <!-- Tool 5 -->
  <rect x="1075" y="445" width="140" height="80" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="1145" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-accent)">Infracost</text>
  <text x="1145" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">IaC cost estimates</text>

  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-accent)">Multi-cloud visibility | Automated optimization | Kubernetes-native | Shift-left cost awareness</text>
</svg>
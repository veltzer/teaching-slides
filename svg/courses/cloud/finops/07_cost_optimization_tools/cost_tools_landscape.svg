  <text x="435" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">spot automation</text>

  <rect x="575" y="438.75" width="220" height="82.857142857143" rx="6.106202935189" fill="var(--surface)" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="685" y="469.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--info-accent)">Kubecost</text>
  <text x="685" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">K8s costs</text>

  <rect x="825" y="438.75" width="220" height="82.857142857143" rx="6.106202935189" fill="var(--surface)" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="935" y="469.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--info-accent)">Cloudability</text>
  <text x="935" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">FinOps platform</text>

  <rect x="1075" y="438.75" width="140" height="82.857142857143" rx="6.106202935189" fill="var(--surface)" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="1145" y="469.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--info-accent)">Infracost</text>
  <text x="1145" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">IaC estimates</text>

  <text x="640" y="578.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--info-text)">visibility | automation | k8s-native | shift-left</text>
</svg>

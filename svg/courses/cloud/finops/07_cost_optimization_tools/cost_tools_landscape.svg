  <rect x="860" y="86.999945" width="380" height="18" fill="url(#grad-warn)" rx="6.50941" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.000053" font-weight="bold" fill="var(--bg)">GCP</text>

  <rect x="885" y="120" width="330" height="55.000055" rx="6.50941" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="1050" y="142.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.999958" font-weight="bold" fill="var(--warn-accent)">Cloud Billing</text>
  <text x="1050" y="162.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--text-muted)">Billing reports and exports</text>

  <rect x="885" y="186.999945" width="330" height="55.000055" rx="6.50941" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="1050" y="209.99989" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.999958" font-weight="bold" fill="var(--warn-accent)">Recommender</text>
  <text x="1050" y="229.99989" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--text-muted)">ML-driven optimization advice</text>

  <rect x="885" y="253.99989" width="330" height="55.000055" rx="6.50941" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="1050" y="276.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.999958" font-weight="bold" fill="var(--warn-accent)">BigQuery Billing Export</text>
  <text x="1050" y="296.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--text-muted)">Detailed billing in BigQuery</text>

  <text x="1050" y="344.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--warn-accent)">+ Active Assist, Budgets API</text>

  <!-- Third-party row -->
  <text x="640" y="404.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.00002" font-weight="bold" fill="var(--text-faint)">Third-Party / Multi-Cloud Tools</text>

  <rect x="40" y="420" width="1200" height="200" rx="6.50941" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Tool 1 -->
  <rect x="75" y="449.99989" width="220" height="80" rx="6.50941" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="185" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.999958" font-weight="bold" fill="var(--info-accent)">CloudHealth</text>
  <text x="185" y="502.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--text-muted)">Multi-cloud cost management</text>

  <!-- Tool 2 -->
  <rect x="325" y="449.99989" width="220" height="80" rx="6.50941" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="435" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.999958" font-weight="bold" fill="var(--info-accent)">Spot.io (NetApp)</text>
  <text x="435" y="502.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--text-muted)">Spot automation &amp; optimization</text>

  <!-- Tool 3 -->
  <rect x="575" y="449.99989" width="220" height="80" rx="6.50941" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1.5"/>

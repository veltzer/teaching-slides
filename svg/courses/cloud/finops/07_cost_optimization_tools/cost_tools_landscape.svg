  <rect x="475" y="186.999945" width="330" height="55.000055" rx="6.50941" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="640" y="209.99989" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.999958" font-weight="bold" fill="var(--ok-accent)">Azure Advisor</text>
  <text x="640" y="229.99989" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--text-muted)">Personalized best practices</text>

  <rect x="475" y="253.99989" width="330" height="55.000055" rx="6.50941" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="640" y="276.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.999958" font-weight="bold" fill="var(--ok-accent)">Reservations + Savings Plans</text>
  <text x="640" y="296.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--text-muted)">Commitment recommendations</text>

  <text x="640" y="344.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" fill="var(--ok-accent)">+ Power BI integration</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Horizontal stacked bar -->
  <text x="640" y="85.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text)">Typical Cloud Fleet Utilization</text>

  <!-- Stacked bar: total width 1000, x starts at 140 -->
  <!-- Over-provisioned: 35% = 350px -->
  <rect x="171.25" y="112.5" width="328.125" height="90.625" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="335.3125" y="153.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--danger-accent)">Over-provisioned</text>
  <text x="335.3125" y="178.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--danger-accent)">35%</text>

  <!-- Idle: 10% = 100px -->
  <rect x="499.375" y="112.5" width="93.75" height="90.625" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="546.25" y="153.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)">Idle</text>
  <text x="546.25" y="175.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--warn-accent)">10%</text>

  <!-- Right-sized: 55% = 550px -->
  <rect x="593.125" y="112.5" width="515.625" height="90.625" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="850.9375" y="153.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--ok-accent)">Right-sized</text>
  <text x="850.9375" y="178.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--ok-accent)">55%</text>

  <!-- Savings annotation with bracket -->
  <line x1="171.25" y1="221.25" x2="171.25" y2="248.4375" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="593.125" y1="221.25" x2="593.125" y2="248.4375" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="171.25" y1="248.4375" x2="593.125" y2="248.4375" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="382.1875" y1="248.4375" x2="382.1875" y2="271.0938" stroke="var(--danger-border)" stroke-width="2"/>

  <rect x="265" y="273.8125" width="234.375" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="382.1875" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--danger-accent)">Savings Opportunity</text>

  <!-- Detail boxes below -->
  <!-- Over-provisioned detail -->
  <rect x="96.25" y="348.125" width="328.125" height="163.125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260.3125" y="379.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)">Over-provisioned Resources</text>
  <text x="119.6875" y="407.0312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">CPU utilization &lt; 20%</text>
  <text x="119.6875" y="427.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Memory used &lt; 30%</text>
  <text x="119.6875" y="448.7188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Can downsize 1-2 instance sizes</text>
  <text x="119.6875" y="475" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--danger-accent)">Potential: 20-40% savings</text>

  <!-- Idle detail -->
  <rect x="452.5" y="348.125" width="328.125" height="163.125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="616.5625" y="379.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)">Idle Resources</text>
  <text x="475.9375" y="407.0312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Zero or near-zero usage</text>
  <text x="475.9375" y="427.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Orphaned volumes / IPs</text>
  <text x="475.9375" y="448.7188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Forgotten dev/test instances</text>
  <text x="475.9375" y="475" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)">Potential: 100% savings</text>

  <!-- Right-sized detail -->
  <rect x="808.75" y="348.125" width="375" height="163.125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="996.25" y="379.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">Right-sized Resources</text>
  <text x="832.1875" y="407.0312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Appropriate instance types</text>
  <text x="832.1875" y="427.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Good utilization (40-80% CPU)</text>
  <text x="832.1875" y="448.7188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Regularly reviewed</text>
  <text x="832.1875" y="475" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--ok-accent)">Target: maintain this state</text>

  <!-- Bottom summary -->
  <rect x="358.75" y="542.9688" width="562.5" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="571.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--primary-accent)">Average organization saves 20-35% through rightsizing</text>
</svg>
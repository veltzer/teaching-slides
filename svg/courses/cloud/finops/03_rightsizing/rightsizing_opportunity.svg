<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Horizontal stacked bar -->
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795063" font-weight="bold" fill="var(--text)">Typical Cloud Fleet Utilization</text>

  <!-- Stacked bar: total width 1000, x starts at 140 -->
  <!-- Over-provisioned: 35% = 350px -->
  <rect x="122.758621" y="71.351348" width="362.068966" height="104.504494" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.768162" filter="url(#shadow)"/>
  <text x="303.793103" y="118.378313" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795063" font-weight="bold" fill="var(--danger-accent)">Over-provisioned</text>
  <text x="303.793103" y="147.639571" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715546" fill="var(--danger-accent)">35%</text>

  <!-- Idle: 10% = 100px -->
  <rect x="484.827586" y="71.351348" width="103.448276" height="104.504494" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.768162" filter="url(#shadow)"/>
  <text x="536.551724" y="118.378313" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636028" font-weight="bold" fill="var(--warn-accent)">Idle</text>
  <text x="536.551724" y="144.504494" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636028" fill="var(--warn-accent)">10%</text>

  <!-- Right-sized: 55% = 550px -->
  <rect x="588.275862" y="71.351348" width="568.965517" height="104.504494" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.768162" filter="url(#shadow)"/>
  <text x="872.758621" y="118.378313" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795063" font-weight="bold" fill="var(--ok-accent)">Right-sized</text>
  <text x="872.758621" y="147.639571" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715546" fill="var(--ok-accent)">55%</text>

  <!-- Savings annotation with bracket -->
  <line x1="122.758621" y1="196.756741" x2="122.758621" y2="228.108089" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="588.275862" y1="196.756741" x2="588.275862" y2="228.108089" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="122.758621" y1="228.108089" x2="588.275862" y2="228.108089" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="355.517241" y1="228.108089" x2="355.517241" y2="254.234271" stroke="var(--danger-border)" stroke-width="2"/>

  <rect x="226.206897" y="257.369348" width="258.62069" height="52.252247" rx="6.768162" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="355.517241" y="288.720696" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715546" font-weight="bold" fill="var(--danger-accent)">Savings Opportunity</text>

  <!-- Detail boxes below -->
  <!-- Over-provisioned detail -->
  <rect x="40" y="343.063033" width="362.068966" height="188.108089" rx="6.768162" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.034483" y="379.639664" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636028" font-weight="bold" fill="var(--danger-accent)">Over-provisioned Resources</text>
  <text x="65.862069" y="410.990896" font-family="Arial, sans-serif" font-size="13.516808" fill="var(--text-muted)">CPU utilization &lt; 20%</text>
  <text x="65.862069" y="435.026988" font-family="Arial, sans-serif" font-size="13.516808" fill="var(--text-muted)">Memory used &lt; 30%</text>
  <text x="65.862069" y="459.063079" font-family="Arial, sans-serif" font-size="13.516808" fill="var(--text-muted)">Can downsize 1-2 instance sizes</text>
  <text x="65.862069" y="489.369325" font-family="Arial, sans-serif" font-size="15.596213" font-weight="bold" fill="var(--danger-accent)">Potential: 20-40% savings</text>

  <!-- Idle detail -->
  <rect x="433.103448" y="343.063033" width="362.068966" height="188.108089" rx="6.768162" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="614.137931" y="379.639664" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636028" font-weight="bold" fill="var(--warn-accent)">Idle Resources</text>
  <text x="458.965517" y="410.990896" font-family="Arial, sans-serif" font-size="13.516808" fill="var(--text-muted)">Zero or near-zero usage</text>
  <text x="458.965517" y="435.026988" font-family="Arial, sans-serif" font-size="13.516808" fill="var(--text-muted)">Orphaned volumes / IPs</text>
  <text x="458.965517" y="459.063079" font-family="Arial, sans-serif" font-size="13.516808" fill="var(--text-muted)">Forgotten dev/test instances</text>
  <text x="458.965517" y="489.369325" font-family="Arial, sans-serif" font-size="15.596213" font-weight="bold" fill="var(--warn-accent)">Potential: 100% savings</text>

  <!-- Right-sized detail -->
  <rect x="826.206897" y="343.063033" width="413.793103" height="188.108089" rx="6.768162" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.103448" y="379.639664" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636028" font-weight="bold" fill="var(--ok-accent)">Right-sized Resources</text>
  <text x="852.068966" y="410.990896" font-family="Arial, sans-serif" font-size="13.516808" fill="var(--text-muted)">Appropriate instance types</text>
  <text x="852.068966" y="435.026988" font-family="Arial, sans-serif" font-size="13.516808" fill="var(--text-muted)">Good utilization (40-80% CPU)</text>
  <text x="852.068966" y="459.063079" font-family="Arial, sans-serif" font-size="13.516808" fill="var(--text-muted)">Regularly reviewed</text>
  <text x="852.068966" y="489.369325" font-family="Arial, sans-serif" font-size="15.596213" font-weight="bold" fill="var(--ok-accent)">Target: maintain this state</text>

  <!-- Bottom summary -->
  <rect x="329.655172" y="567.747753" width="620.689655" height="52.252247" rx="6.768162" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="600.144088" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.675731" font-weight="bold" fill="var(--primary-accent)">Average organization saves 20-35% through rightsizing</text>
</svg>
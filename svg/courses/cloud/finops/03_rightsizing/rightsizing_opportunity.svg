<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Horizontal stacked bar -->

  <!-- Stacked bar: total width 1000, x starts at 140 -->
  <!-- Over-provisioned: 35% = 350px -->
  <rect x="122.758621" y="40" width="362.068966" height="110.476178696599" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.958851739028" filter="url(#shadow)"/>
  <text x="303.793103" y="89.714219839184" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.380953990277" font-weight="bold" fill="var(--danger-accent)">Over-provisioned</text>
  <text x="303.793103" y="120.647549535946" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.242847589782" fill="var(--danger-accent)">35%</text>

  <!-- Idle: 10% = 100px -->
  <rect x="484.827586" y="40" width="103.448276" height="110.476178696599" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.958851739028" filter="url(#shadow)"/>
  <text x="536.551724" y="89.714219839184" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.104740161112" font-weight="bold" fill="var(--warn-accent)">Idle</text>
  <text x="536.551724" y="117.333325299048" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.104740161112" fill="var(--warn-accent)">10%</text>

  <!-- Right-sized: 55% = 550px -->
  <rect x="588.275862" y="40" width="568.965517" height="110.476178696599" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.958851739028" filter="url(#shadow)"/>
  <text x="872.758621" y="89.714219839184" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.380953990277" font-weight="bold" fill="var(--ok-accent)">Right-sized</text>
  <text x="872.758621" y="120.647549535946" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.242847589782" fill="var(--ok-accent)">55%</text>

  <!-- Savings annotation with bracket -->
  <line x1="122.758621" y1="172.571414647347" x2="122.758621" y2="205.714268044898" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="588.275862" y1="172.571414647347" x2="588.275862" y2="205.714268044898" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="122.758621" y1="205.714268044898" x2="588.275862" y2="205.714268044898" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="355.517241" y1="205.714268044898" x2="355.517241" y2="233.333374561904" stroke="var(--danger-border)" stroke-width="2"/>

  <rect x="226.206897" y="236.647598798803" width="258.62069" height="55.238089348299" rx="6.958851739028" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="355.517241" y="269.790452196354" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.242847589782" font-weight="bold" fill="var(--danger-accent)">Savings Opportunity</text>

  <!-- Detail boxes below -->
  <!-- Over-provisioned detail -->
  <rect x="40" y="327.238065245442" width="362.068966" height="198.857121442449" rx="6.958851739028" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.034483" y="365.904789209251" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.104740161112" font-weight="bold" fill="var(--danger-accent)">Over-provisioned Resources</text>
  <text x="65.862069" y="399.047519978232" font-family="Arial, sans-serif" font-size="13.897637624056" fill="var(--text-muted)">CPU utilization &lt; 20%</text>
  <text x="65.862069" y="424.457102794449" font-family="Arial, sans-serif" font-size="13.897637624056" fill="var(--text-muted)">Memory used &lt; 30%</text>
  <text x="65.862069" y="449.866684553524" font-family="Arial, sans-serif" font-size="13.897637624056" fill="var(--text-muted)">Can downsize 1-2 instance sizes</text>
  <text x="65.862069" y="481.904715843538" font-family="Arial, sans-serif" font-size="16.035628869004" font-weight="bold" fill="var(--danger-accent)">Potential: 20-40% savings</text>

  <!-- Idle detail -->
  <rect x="433.103448" y="327.238065245442" width="362.068966" height="198.857121442449" rx="6.958851739028" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="614.137931" y="365.904789209251" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.104740161112" font-weight="bold" fill="var(--warn-accent)">Idle Resources</text>
  <text x="458.965517" y="399.047519978232" font-family="Arial, sans-serif" font-size="13.897637624056" fill="var(--text-muted)">Zero or near-zero usage</text>
  <text x="458.965517" y="424.457102794449" font-family="Arial, sans-serif" font-size="13.897637624056" fill="var(--text-muted)">Orphaned volumes / IPs</text>
  <text x="458.965517" y="449.866684553524" font-family="Arial, sans-serif" font-size="13.897637624056" fill="var(--text-muted)">Forgotten dev/test instances</text>
  <text x="458.965517" y="481.904715843538" font-family="Arial, sans-serif" font-size="16.035628869004" font-weight="bold" fill="var(--warn-accent)">Potential: 100% savings</text>

  <!-- Right-sized detail -->
  <rect x="826.206897" y="327.238065245442" width="413.793103" height="198.857121442449" rx="6.958851739028" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.103448" y="365.904789209251" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.104740161112" font-weight="bold" fill="var(--ok-accent)">Right-sized Resources</text>
  <text x="852.068966" y="399.047519978232" font-family="Arial, sans-serif" font-size="13.897637624056" fill="var(--text-muted)">Appropriate instance types</text>
  <text x="852.068966" y="424.457102794449" font-family="Arial, sans-serif" font-size="13.897637624056" fill="var(--text-muted)">Good utilization (40-80% CPU)</text>
  <text x="852.068966" y="449.866684553524" font-family="Arial, sans-serif" font-size="13.897637624056" fill="var(--text-muted)">Regularly reviewed</text>
  <text x="852.068966" y="481.904715843538" font-family="Arial, sans-serif" font-size="16.035628869004" font-weight="bold" fill="var(--ok-accent)">Target: maintain this state</text>

  <!-- Bottom summary -->
  <rect x="329.655172" y="564.761910651701" width="620.689655" height="55.238089348299" rx="6.958851739028" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="599.009464585361" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.173736297674" font-weight="bold" fill="var(--primary-accent)">Average organization saves 20-35% through rightsizing</text>
</svg>

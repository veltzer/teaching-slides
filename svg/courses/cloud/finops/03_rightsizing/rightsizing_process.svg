  <text x="997" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--ok-text)">5. Apply</text>
  <text x="997" y="153.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--ok-text)">Resize</text>
  <line x1="1075" y1="131.461538461538" x2="1113" y2="131.461538461538" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1115" y="95.769230769231" width="125" height="72.5" rx="8.448941672459" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1177" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--ok-text)">6. Monitor</text>

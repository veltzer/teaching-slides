  <line x1="343.4937" y1="54.0084" x2="364.0169" y2="54.0084" stroke="var(--text-muted)" stroke-width="1.3502" marker-end="url(#arrow)" />
  <rect x="369.4177" y="32.4051" width="91.8143" height="43.2068" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />

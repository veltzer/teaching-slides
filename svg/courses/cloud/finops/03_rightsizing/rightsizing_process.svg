  <text x="472" y="330" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Review with team</text>
  <text x="472" y="357.884615384615" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Burst patterns</text>
  <text x="472" y="385.769230769231" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Dependencies</text>
  <text x="472" y="424.807692307692" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--warn-accent)">Gate</text>
  <text x="472" y="452.692307692308" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Owner approval</text>

  <rect x="670" y="263.076923076923" width="195" height="223.076923076923" rx="8.448941672459" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="767" y="296.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--warn-accent)">Test</text>

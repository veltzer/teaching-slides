  <text x="892" y="424.807692307692" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--ok-accent)">Output</text>
  <text x="892" y="452.692307692308" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Savings realized</text>

  <rect x="1090" y="263.076923076923" width="150" height="223.076923076923" rx="8.448941672459" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1165" y="296.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--ok-accent)">Monitor</text>
  <text x="1102" y="330" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Performance</text>
  <text x="1102" y="357.884615384615" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Alerts on drift</text>
  <text x="1102" y="385.769230769231" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Monthly review</text>
  <text x="1102" y="424.807692307692" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--ok-accent)">Continuous</text>

  <rect x="340" y="553.076923076923" width="600" height="66.923076923077" rx="8.448941672459" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="595.461538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--primary-text)">Review rightsizing every 30-60 days</text>

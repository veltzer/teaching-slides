  <text x="130" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--primary-text)">1. Collect</text>
  <text x="130" y="153.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--primary-text)">CPU, memory, I/O</text>
  <line x1="220" y1="131.461538461538" x2="258" y2="131.461538461538" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="95.769230769231" width="180" height="72.5" rx="8.448941672459" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--primary-text)">2. Identify</text>
  <text x="350" y="153.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--primary-text)">Find candidates</text>
  <line x1="440" y1="131.461538461538" x2="478" y2="131.461538461538" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="95.769230769231" width="180" height="72.5" rx="8.448941672459" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--warn-text)">3. Validate</text>
  <text x="570" y="153.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--warn-text)">Owner approval</text>
  <line x1="660" y1="131.461538461538" x2="698" y2="131.461538461538" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="95.769230769231" width="180" height="72.5" rx="8.448941672459" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--warn-text)">4. Test</text>
  <text x="790" y="153.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--warn-text)">Staging first</text>
  <line x1="880" y1="131.461538461538" x2="918" y2="131.461538461538" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>


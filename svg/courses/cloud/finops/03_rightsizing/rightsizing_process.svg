  <text x="533.0633" y="51.308" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">5. Apply</text>
  <text x="533.0633" y="63.73" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Resize instances</text>
  <line x1="578.9705" y1="54.0084" x2="599.4937" y2="54.0084" stroke="var(--text-muted)" stroke-width="1.3502" marker-end="url(#arrow)" />

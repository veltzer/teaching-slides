<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>

  <!-- Step 1: Collect Data -->
  <rect x="30" y="60" width="170" height="80" rx="12" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="115" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">1. Collect Data</text>
  <text x="115" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">CPU, Memory, I/O</text>

  <!-- Arrow -->
  <line x1="200" y1="100" x2="238" y2="100" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Identify -->
  <rect x="248" y="60" width="170" height="80" rx="12" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="333" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">2. Identify</text>
  <text x="333" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Find candidates</text>

  <!-- Arrow -->
  <line x1="418" y1="100" x2="456" y2="100" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Validate -->
  <rect x="466" y="60" width="170" height="80" rx="12" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="551" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)">3. Validate</text>
  <text x="551" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Check with owners</text>

  <!-- Arrow -->
  <line x1="636" y1="100" x2="674" y2="100" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Test -->
  <rect x="684" y="60" width="170" height="80" rx="12" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="769" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)">4. Test</text>
  <text x="769" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Staging first</text>

  <!-- Arrow -->
  <line x1="854" y1="100" x2="892" y2="100" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Apply -->
  <rect x="902" y="60" width="170" height="80" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="987" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">5. Apply</text>
  <text x="987" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Resize instances</text>

  <!-- Arrow -->
  <line x1="1072" y1="100" x2="1110" y2="100" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 6: Monitor -->
  <rect x="1120" y="60" width="130" height="80" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1185" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">6. Monitor</text>
  <text x="1185" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Ongoing</text>

  <!-- Feedback loop arrow from Monitor back to Collect -->
  <path d="M1185,140 L1185,180 Q1185,200 1165,200 L115,200 Q95,200 95,180 L95,145" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="640" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Continuous cycle - repeat regularly</text>

  <!-- Detail cards for each step -->
  <!-- Step 1 detail -->
  <rect x="30" y="260" width="190" height="200" rx="8" fill="var(--surface)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="125" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Collect Data</text>
  <text x="45" y="312" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">CloudWatch metrics</text>
  <text x="45" y="332" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">14-30 day window</text>
  <text x="45" y="352" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">CPU, memory, network</text>
  <text x="45" y="372" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Disk I/O patterns</text>
  <text x="45" y="392" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Peak vs average usage</text>
  <text x="45" y="420" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--primary)">Tool: Compute Optimizer</text>

  <!-- Step 2 detail -->
  <rect x="240" y="260" width="190" height="200" rx="8" fill="var(--surface)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="335" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Identify</text>
  <text x="255" y="312" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">CPU &lt; 20% avg</text>
  <text x="255" y="332" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Memory &lt; 30% avg</text>
  <text x="255" y="352" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Rank by savings</text>
  <text x="255" y="372" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Flag idle resources</text>
  <text x="255" y="392" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Suggest target size</text>
  <text x="255" y="420" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--primary)">Output: Candidate list</text>

  <!-- Step 3 detail -->
  <rect x="450" y="260" width="190" height="200" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="545" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">Validate</text>
  <text x="465" y="312" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Review with app team</text>
  <text x="465" y="332" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Check burst patterns</text>
  <text x="465" y="352" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Seasonal workloads?</text>
  <text x="465" y="372" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Dependencies check</text>
  <text x="465" y="392" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Risk assessment</text>
  <text x="465" y="420" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--warn)">Gate: Owner approval</text>

  <!-- Step 4 detail -->
  <rect x="660" y="260" width="190" height="200" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="755" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">Test</text>
  <text x="675" y="312" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Apply in non-prod first</text>
  <text x="675" y="332" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Load test new size</text>
  <text x="675" y="352" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Monitor for 48-72h</text>
  <text x="675" y="372" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Compare performance</text>
  <text x="675" y="392" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Rollback plan ready</text>
  <text x="675" y="420" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--warn)">Gate: Test passes</text>

  <!-- Step 5 detail -->
  <rect x="870" y="260" width="190" height="200" rx="8" fill="var(--surface)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="965" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Apply</text>
  <text x="885" y="312" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Schedule downtime</text>
  <text x="885" y="332" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Resize in production</text>
  <text x="885" y="352" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Use automation (IaC)</text>
  <text x="885" y="372" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Update documentation</text>
  <text x="885" y="392" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Track actual savings</text>
  <text x="885" y="420" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok)">Output: Savings realized</text>

  <!-- Step 6 detail -->
  <rect x="1080" y="260" width="170" height="200" rx="8" fill="var(--surface)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="1165" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Monitor</text>
  <text x="1095" y="312" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Track performance</text>
  <text x="1095" y="332" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Validate savings</text>
  <text x="1095" y="352" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Set alerts for drift</text>
  <text x="1095" y="372" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Monthly review</text>
  <text x="1095" y="392" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Report to leadership</text>
  <text x="1095" y="420" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok)">Continuous process</text>

  <!-- Bottom summary -->
  <rect x="340" y="500" width="600" height="45" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="640" y="529" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-dk)">Best Practice: Run rightsizing reviews every 30-60 days</text>
</svg>
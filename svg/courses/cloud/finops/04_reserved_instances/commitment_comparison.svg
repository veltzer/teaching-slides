<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="380" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Reserved Instances</text>

  <text x="70" y="130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Flexibility</text>
  <text x="70" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Low - locked type / region</text>

  <text x="70" y="210" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Discount</text>
  <text x="70" y="240" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Up to 72%</text>

  <text x="70" y="290" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Commitment</text>
  <text x="70" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">1 or 3 year</text>
  <text x="70" y="345" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Upfront options</text>

  <text x="70" y="395" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Best For</text>
  <text x="70" y="425" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Steady workloads</text>
  <text x="70" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Predictable demand</text>

  <text x="70" y="510" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Risk</text>
  <rect x="70" y="525" width="120" height="30" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">Medium</text>

  <rect x="450" y="40" width="380" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Savings Plans</text>

  <text x="480" y="130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">Flexibility</text>
  <text x="480" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">High - across families</text>

  <text x="480" y="210" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">Discount</text>
  <text x="480" y="240" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Up to 66%</text>

  <text x="480" y="290" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">Commitment</text>
  <text x="480" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">1 or 3 year</text>
  <text x="480" y="345" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">$/hour pledge</text>

  <text x="480" y="395" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">Best For</text>
  <text x="480" y="425" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Dynamic workloads</text>
  <text x="480" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Multi-region</text>

  <text x="480" y="510" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">Risk</text>
  <rect x="480" y="525" width="120" height="30" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Low</text>

  <rect x="860" y="40" width="380" height="580" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Spot Instances</text>

  <text x="890" y="130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-text)">Flexibility</text>
  <text x="890" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Very High; no commit</text>

  <text x="890" y="210" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-text)">Discount</text>
  <text x="890" y="240" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Up to 90% off</text>

  <text x="890" y="290" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-text)">Commitment</text>
  <text x="890" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">None; market price</text>
  <text x="890" y="345" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">2-min interruption</text>

  <text x="890" y="395" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-text)">Best For</text>
  <text x="890" y="425" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Fault-tolerant jobs</text>
  <text x="890" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Batch, CI/CD</text>

  <text x="890" y="510" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-text)">Risk</text>
  <rect x="890" y="525" width="120" height="30" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-text)">High</text>
</svg>

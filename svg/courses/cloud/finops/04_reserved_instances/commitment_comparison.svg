<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Column 1: Reserved Instances -->
  <rect x="77.5" y="67.1875" width="356.25" height="525.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="77.5" y="67.1875" width="356.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="77.5" y="103.4375" width="356.25" height="18.125" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="255.625" y="101.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)">Reserved Instances</text>

  <text x="105.625" y="153.2812" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Flexibility</text>
  <text x="105.625" y="174.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Low - locked to instance type,</text>
  <text x="105.625" y="192.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">region, and OS</text>

  <line x1="105.625" y1="207.6562" x2="405.625" y2="207.6562" stroke="var(--primary-border)" stroke-width="1"/>

  <text x="105.625" y="230.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Discount Range</text>
  <text x="105.625" y="251.1562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Up to 72% (3-year, all upfront)</text>

  <line x1="105.625" y1="266.5625" x2="405.625" y2="266.5625" stroke="var(--primary-border)" stroke-width="1"/>

  <text x="105.625" y="289.2188" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Commitment</text>
  <text x="105.625" y="310.0625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">1 or 3 year term</text>
  <text x="105.625" y="328.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">No / Partial / All upfront</text>

  <line x1="105.625" y1="343.5938" x2="405.625" y2="343.5938" stroke="var(--primary-border)" stroke-width="1"/>

  <text x="105.625" y="366.25" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Best For</text>
  <text x="105.625" y="387.0938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Steady-state workloads</text>
  <text x="105.625" y="405.2188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Known instance types</text>
  <text x="105.625" y="423.3438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Predictable demand</text>

  <line x1="105.625" y1="438.75" x2="405.625" y2="438.75" stroke="var(--primary-border)" stroke-width="1"/>

  <text x="105.625" y="461.4062" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Risk Level</text>
  <rect x="105.625" y="473.1875" width="112.5" height="21.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="161.875" y="489.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Medium</text>

  <!-- Column 2: Savings Plans -->
  <rect x="461.875" y="67.1875" width="356.25" height="525.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="461.875" y="67.1875" width="356.25" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="461.875" y="103.4375" width="356.25" height="18.125" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="101.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)">Savings Plans</text>

  <text x="490" y="153.2812" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Flexibility</text>
  <text x="490" y="174.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">High - applies across instance</text>
  <text x="490" y="192.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">families, sizes, OS, regions</text>

  <line x1="490" y1="207.6562" x2="790" y2="207.6562" stroke="var(--ok-border)" stroke-width="1"/>

  <text x="490" y="230.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Discount Range</text>
  <text x="490" y="251.1562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Up to 66% (Compute SP)</text>

  <line x1="490" y1="266.5625" x2="790" y2="266.5625" stroke="var(--ok-border)" stroke-width="1"/>

  <text x="490" y="289.2188" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Commitment</text>
  <text x="490" y="310.0625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">1 or 3 year term</text>
  <text x="490" y="328.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">$/hour commitment</text>

  <line x1="490" y1="343.5938" x2="790" y2="343.5938" stroke="var(--ok-border)" stroke-width="1"/>

  <text x="490" y="366.25" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Best For</text>
  <text x="490" y="387.0938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Dynamic workloads</text>
  <text x="490" y="405.2188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Changing instance types</text>
  <text x="490" y="423.3438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Multi-region deployments</text>

  <line x1="490" y1="438.75" x2="790" y2="438.75" stroke="var(--ok-border)" stroke-width="1"/>

  <text x="490" y="461.4062" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Risk Level</text>
  <rect x="490" y="473.1875" width="112.5" height="21.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="546.25" y="489.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Low</text>

  <!-- Column 3: Spot Instances -->
  <rect x="846.25" y="67.1875" width="356.25" height="525.625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="846.25" y="67.1875" width="356.25" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="846.25" y="103.4375" width="356.25" height="18.125" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1024.375" y="101.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)">Spot Instances</text>

  <text x="874.375" y="153.2812" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Flexibility</text>
  <text x="874.375" y="174.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Very High - any instance, any</text>
  <text x="874.375" y="192.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">time, no commitment</text>

  <line x1="874.375" y1="207.6562" x2="1174.375" y2="207.6562" stroke="var(--warn-border)" stroke-width="1"/>

  <text x="874.375" y="230.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Discount Range</text>
  <text x="874.375" y="251.1562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Up to 90% off On-Demand</text>

  <line x1="874.375" y1="266.5625" x2="1174.375" y2="266.5625" stroke="var(--warn-border)" stroke-width="1"/>

  <text x="874.375" y="289.2188" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Commitment</text>
  <text x="874.375" y="310.0625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">None - pay market price</text>
  <text x="874.375" y="328.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Can be interrupted (2-min notice)</text>

  <line x1="874.375" y1="343.5938" x2="1174.375" y2="343.5938" stroke="var(--warn-border)" stroke-width="1"/>

  <text x="874.375" y="366.25" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Best For</text>
  <text x="874.375" y="387.0938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Fault-tolerant workloads</text>
  <text x="874.375" y="405.2188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Batch processing, CI/CD</text>
  <text x="874.375" y="423.3438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Stateless applications</text>

  <line x1="874.375" y1="438.75" x2="1174.375" y2="438.75" stroke="var(--warn-border)" stroke-width="1"/>

  <text x="874.375" y="461.4062" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Risk Level</text>
  <rect x="874.375" y="473.1875" width="112.5" height="21.75" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="930.625" y="489.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--danger-accent)">High</text>
</svg>
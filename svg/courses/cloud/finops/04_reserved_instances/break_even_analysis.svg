<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Chart area -->
  <!-- Y-axis -->
  <line x1="171.25" y1="76.25" x2="171.25" y2="493.125" stroke="var(--border)" stroke-width="2"/>
  <!-- X-axis -->
  <line x1="171.25" y1="493.125" x2="1146.25" y2="493.125" stroke="var(--border)" stroke-width="2"/>

  <!-- Y-axis label -->
  <text x="68.125" y="284.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)" transform="rotate(-90, 30, 270)">Cumulative Cost ($)</text>

  <!-- X-axis label -->
  <text x="658.75" y="533.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Months</text>

  <!-- Y-axis tick marks and labels -->
  <line x1="163.75" y1="493.125" x2="171.25" y2="493.125" stroke="var(--border)" stroke-width="1.5"/>
  <text x="157.1875" y="497.6562" text-anchor="end" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">$0</text>

  <line x1="163.75" y1="388.9062" x2="171.25" y2="388.9062" stroke="var(--border)" stroke-width="1.5"/>
  <text x="157.1875" y="393.4375" text-anchor="end" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">$5k</text>

  <line x1="163.75" y1="284.6875" x2="171.25" y2="284.6875" stroke="var(--border)" stroke-width="1.5"/>
  <text x="157.1875" y="289.2188" text-anchor="end" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">$10k</text>

  <line x1="163.75" y1="180.4688" x2="171.25" y2="180.4688" stroke="var(--border)" stroke-width="1.5"/>
  <text x="157.1875" y="185" text-anchor="end" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">$15k</text>

  <line x1="163.75" y1="112.5" x2="171.25" y2="112.5" stroke="var(--border)" stroke-width="1.5"/>
  <text x="157.1875" y="117.0312" text-anchor="end" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">$18k</text>

  <!-- X-axis tick marks -->
  <line x1="251.875" y1="493.125" x2="251.875" y2="500.375" stroke="var(--border)" stroke-width="1.5"/>
  <text x="251.875" y="515.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">2</text>

  <line x1="415" y1="493.125" x2="415" y2="500.375" stroke="var(--border)" stroke-width="1.5"/>
  <text x="415" y="515.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">6</text>

  <line x1="577.1875" y1="493.125" x2="577.1875" y2="500.375" stroke="var(--border)" stroke-width="1.5"/>
  <text x="577.1875" y="515.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">10</text>

  <line x1="658.75" y1="493.125" x2="658.75" y2="500.375" stroke="var(--border)" stroke-width="1.5"/>
  <text x="658.75" y="515.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">12</text>

  <line x1="820.9375" y1="493.125" x2="820.9375" y2="500.375" stroke="var(--border)" stroke-width="1.5"/>
  <text x="820.9375" y="515.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">16</text>

  <line x1="983.125" y1="493.125" x2="983.125" y2="500.375" stroke="var(--border)" stroke-width="1.5"/>
  <text x="983.125" y="515.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">20</text>

  <line x1="1064.6875" y1="493.125" x2="1064.6875" y2="500.375" stroke="var(--border)" stroke-width="1.5"/>
  <text x="1064.6875" y="515.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">22</text>

  <!-- Grid lines (light) -->
  <line x1="171.25" y1="388.9062" x2="1146.25" y2="388.9062" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="171.25" y1="284.6875" x2="1146.25" y2="284.6875" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="171.25" y1="180.4688" x2="1146.25" y2="180.4688" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- On-Demand line (danger - straight line from origin, steep slope) -->
  <!-- $750/month, over 24 months = $18,000. Y range: 500 to 80 = 420px for $18k -->
  <line x1="171.25" y1="493.125" x2="1146.25" y2="112.5" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1071.25" y="98.9062" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--danger-accent)">On-Demand</text>
  <text x="1071.25" y="115.2188" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">$750/mo</text>

  <!-- Reserved line (ok - starts with upfront, then lower slope) -->
  <!-- $3000 upfront + $350/month. Month 0: $3000, Month 24: $3000 + 24*350 = $11,400 -->
  <!-- $3000 = 70px up from baseline = y430; $11400 at month 24 = y233 -->
  <polyline points="171.25,493.125 171.25,429.6875 1146.25,187.7188" fill="none" stroke="var(--ok-border)" stroke-width="3.5"/>
  <text x="1071.25" y="175.9375" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--ok-accent)">Reserved (1yr)</text>
  <text x="1071.25" y="192.25" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">$3k up + $350/mo</text>

  <!-- Break-even point (where lines cross) -->
  <!-- On-Demand: 750*m. Reserved: 3000 + 350*m. Equal when 750m = 3000+350m -> 400m = 3000 -> m = 7.5 -->
  <!-- Month 7.5: x = 140 + 7.5 * (1040/24) = 140 + 325 = 465 -->
  <!-- Cost at 7.5 months: 750*7.5 = 5625 -> y = 500 - (5625/18000)*420 = 500 - 131 = 369 -->
  <circle cx="475.9375" cy="374.4062" r="7.3739" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>

  <!-- Break-even annotation -->
  <line x1="475.9375" y1="367.1562" x2="475.9375" y2="275.625" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="382.1875" y="246.625" width="187.5" height="31.7188" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="475.9375" y="267.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Break-even: ~7.5 months</text>

  <!-- Savings area annotation -->
  <rect x="696.25" y="262.0312" width="206.25" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="799.375" y="284.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Savings Zone</text>
  <text x="799.375" y="303.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)">~37% savings over 2 years</text>

  <!-- Legend -->
  <rect x="208.75" y="554.75" width="225" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="227.5" y1="576.5" x2="265" y2="576.5" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="274.375" y="581.0312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">On-Demand</text>
  <line x1="349.375" y1="576.5" x2="386.875" y2="576.5" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="396.25" y="581.0312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Reserved</text>
</svg>
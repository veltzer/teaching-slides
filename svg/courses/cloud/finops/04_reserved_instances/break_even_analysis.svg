<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Chart area -->
  <!-- Y-axis -->
  <line x1="140" y1="40" x2="140" y2="500" stroke="var(--border)" stroke-width="2"/>
  <!-- X-axis -->
  <line x1="140" y1="500" x2="1180" y2="500" stroke="var(--border)" stroke-width="2"/>

  <!-- Y-axis label -->
  <text x="30" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)" transform="rotate(-90, 30, 270)">Cumulative Cost ($)</text>

  <!-- X-axis label -->
  <text x="660" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Months</text>

  <!-- Y-axis tick marks and labels -->
  <line x1="132" y1="500" x2="140" y2="500" stroke="var(--border)" stroke-width="1.5"/>
  <text x="125" y="505" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">$0</text>

  <line x1="132" y1="385" x2="140" y2="385" stroke="var(--border)" stroke-width="1.5"/>
  <text x="125" y="390" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">$5k</text>

  <line x1="132" y1="270" x2="140" y2="270" stroke="var(--border)" stroke-width="1.5"/>
  <text x="125" y="275" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">$10k</text>

  <line x1="132" y1="155" x2="140" y2="155" stroke="var(--border)" stroke-width="1.5"/>
  <text x="125" y="160" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">$15k</text>

  <line x1="132" y1="80" x2="140" y2="80" stroke="var(--border)" stroke-width="1.5"/>
  <text x="125" y="85" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">$18k</text>

  <!-- X-axis tick marks -->
  <line x1="226" y1="500" x2="226" y2="508" stroke="var(--border)" stroke-width="1.5"/>
  <text x="226" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">2</text>

  <line x1="400" y1="500" x2="400" y2="508" stroke="var(--border)" stroke-width="1.5"/>
  <text x="400" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">6</text>

  <line x1="573" y1="500" x2="573" y2="508" stroke="var(--border)" stroke-width="1.5"/>
  <text x="573" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">10</text>

  <line x1="660" y1="500" x2="660" y2="508" stroke="var(--border)" stroke-width="1.5"/>
  <text x="660" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">12</text>

  <line x1="833" y1="500" x2="833" y2="508" stroke="var(--border)" stroke-width="1.5"/>
  <text x="833" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">16</text>

  <line x1="1006" y1="500" x2="1006" y2="508" stroke="var(--border)" stroke-width="1.5"/>
  <text x="1006" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">20</text>

  <line x1="1093" y1="500" x2="1093" y2="508" stroke="var(--border)" stroke-width="1.5"/>
  <text x="1093" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">22</text>

  <!-- Grid lines (light) -->
  <line x1="140" y1="385" x2="1180" y2="385" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="140" y1="270" x2="1180" y2="270" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="140" y1="155" x2="1180" y2="155" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- On-Demand line (danger - straight line from origin, steep slope) -->
  <!-- $750/month, over 24 months = $18,000. Y range: 500 to 80 = 420px for $18k -->
  <line x1="140" y1="500" x2="1180" y2="80" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1100" y="65" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-accent)">On-Demand</text>
  <text x="1100" y="83" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">$750/mo</text>

  <!-- Reserved line (ok - starts with upfront, then lower slope) -->
  <!-- $3000 upfront + $350/month. Month 0: $3000, Month 24: $3000 + 24*350 = $11,400 -->
  <!-- $3000 = 70px up from baseline = y430; $11400 at month 24 = y233 -->
  <polyline points="140,500 140,430 1180,163" fill="none" stroke="var(--ok-border)" stroke-width="3.5"/>
  <text x="1100" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Reserved (1yr)</text>
  <text x="1100" y="168" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">$3k up + $350/mo</text>

  <!-- Break-even point (where lines cross) -->
  <!-- On-Demand: 750*m. Reserved: 3000 + 350*m. Equal when 750m = 3000+350m -> 400m = 3000 -> m = 7.5 -->
  <!-- Month 7.5: x = 140 + 7.5 * (1040/24) = 140 + 325 = 465 -->
  <!-- Cost at 7.5 months: 750*7.5 = 5625 -> y = 500 - (5625/18000)*420 = 500 - 131 = 369 -->
  <circle cx="465" cy="369" r="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>

  <!-- Break-even annotation -->
  <line x1="465" y1="361" x2="465" y2="260" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="365" y="228" width="200" height="35" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="465" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">Break-even: ~7.5 months</text>

  <!-- Savings area annotation -->
  <rect x="700" y="245" width="220" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="810" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">Savings Zone</text>
  <text x="810" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)">~37% savings over 2 years</text>

  <!-- Legend -->
  <rect x="180" y="568" width="240" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="200" y1="592" x2="240" y2="592" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="250" y="597" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">On-Demand</text>
  <line x1="330" y1="592" x2="370" y2="592" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="380" y="597" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Reserved</text>
</svg>
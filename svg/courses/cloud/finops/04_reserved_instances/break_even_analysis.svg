<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Chart area -->
  <!-- Y-axis -->
  <line x1="57.061611" y1="40" x2="57.061611" y2="503.194444" stroke="var(--border)" stroke-width="2"/>
  <!-- X-axis -->
  <line x1="57.061611" y1="503.194444" x2="1240" y2="503.194444" stroke="var(--border)" stroke-width="2"/>

  <!-- Y-axis label -->
  <text x="68.125" y="284.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)" transform="rotate(-90, 30, 270)">Cumulative Cost ($)</text>

  <!-- X-axis label -->
  <text x="648.530806" y="548.506889" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.123309" font-weight="bold" fill="var(--text)">Months</text>

  <!-- Y-axis tick marks and labels -->
  <line x1="47.962085" y1="503.194444" x2="57.061611" y2="503.194444" stroke="var(--border)" stroke-width="1.5"/>
  <text x="40" y="508.229111" text-anchor="end" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--text-faint)">$0</text>

  <line x1="47.962085" y1="387.395778" x2="57.061611" y2="387.395778" stroke="var(--border)" stroke-width="1.5"/>
  <text x="40" y="392.430556" text-anchor="end" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--text-faint)">$5k</text>

  <line x1="47.962085" y1="271.597222" x2="57.061611" y2="271.597222" stroke="var(--border)" stroke-width="1.5"/>
  <text x="40" y="276.632" text-anchor="end" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--text-faint)">$10k</text>

  <line x1="47.962085" y1="155.798667" x2="57.061611" y2="155.798667" stroke="var(--border)" stroke-width="1.5"/>
  <text x="40" y="160.833333" text-anchor="end" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--text-faint)">$15k</text>

  <line x1="47.962085" y1="80.277778" x2="57.061611" y2="80.277778" stroke="var(--border)" stroke-width="1.5"/>
  <text x="40" y="85.312444" text-anchor="end" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--text-faint)">$18k</text>

  <!-- X-axis tick marks -->
  <line x1="154.881517" y1="503.194444" x2="154.881517" y2="511.25" stroke="var(--border)" stroke-width="1.5"/>
  <text x="154.881517" y="528.368" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--text-faint)">2</text>

  <line x1="352.796209" y1="503.194444" x2="352.796209" y2="511.25" stroke="var(--border)" stroke-width="1.5"/>
  <text x="352.796209" y="528.368" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--text-faint)">6</text>

  <line x1="549.57346" y1="503.194444" x2="549.57346" y2="511.25" stroke="var(--border)" stroke-width="1.5"/>
  <text x="549.57346" y="528.368" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--text-faint)">10</text>

  <line x1="648.530806" y1="503.194444" x2="648.530806" y2="511.25" stroke="var(--border)" stroke-width="1.5"/>
  <text x="648.530806" y="528.368" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--text-faint)">12</text>

  <line x1="845.308057" y1="503.194444" x2="845.308057" y2="511.25" stroke="var(--border)" stroke-width="1.5"/>
  <text x="845.308057" y="528.368" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--text-faint)">16</text>

  <line x1="1042.085308" y1="503.194444" x2="1042.085308" y2="511.25" stroke="var(--border)" stroke-width="1.5"/>
  <text x="1042.085308" y="528.368" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--text-faint)">20</text>

  <line x1="1141.042654" y1="503.194444" x2="1141.042654" y2="511.25" stroke="var(--border)" stroke-width="1.5"/>
  <text x="1141.042654" y="528.368" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--text-faint)">22</text>

  <!-- Grid lines (light) -->
  <line x1="57.061611" y1="387.395778" x2="1240" y2="387.395778" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="57.061611" y1="271.597222" x2="1240" y2="271.597222" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="57.061611" y1="155.798667" x2="1240" y2="155.798667" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- On-Demand line (danger - straight line from origin, steep slope) -->
  <!-- $750/month, over 24 months = $18,000. Y range: 500 to 80 = 420px for $18k -->
  <line x1="57.061611" y1="503.194444" x2="1240" y2="80.277778" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1149.004739" y="65.173556" font-family="Arial, sans-serif" font-size="16.053037" font-weight="bold" fill="var(--danger-accent)">On-Demand</text>
  <text x="1149.004739" y="83.298667" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--danger-accent)">$750/mo</text>

  <!-- Reserved line (ok - starts with upfront, then lower slope) -->
  <!-- $3000 upfront + $350/month. Month 0: $3000, Month 24: $3000 + 24*350 = $11,400 -->
  <!-- $3000 = 70px up from baseline = y430; $11400 at month 24 = y233 -->
  <polyline points="57.061611,503.194444 57.061611,432.708333 1240,163.854222" fill="none" stroke="var(--ok-border)" stroke-width="3.5"/>
  <text x="1149.004739" y="150.763889" font-family="Arial, sans-serif" font-size="16.053037" font-weight="bold" fill="var(--ok-accent)">Reserved (1yr)</text>
  <text x="1149.004739" y="168.888889" font-family="Arial, sans-serif" font-size="12.842452" fill="var(--ok-accent)">$3k up + $350/mo</text>

  <!-- Break-even point (where lines cross) -->
  <!-- On-Demand: 750*m. Reserved: 3000 + 350*m. Equal when 750m = 3000+350m -> 400m = 3000 -> m = 7.5 -->
  <!-- Month 7.5: x = 140 + 7.5 * (1040/24) = 140 + 325 = 465 -->
  <!-- Cost at 7.5 months: 750*7.5 = 5625 -> y = 500 - (5625/18000)*420 = 500 - 131 = 369 -->
  <circle cx="426.729858" cy="371.284667" r="8.561596" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>

  <!-- Break-even annotation -->
  <line x1="426.729858" y1="363.229111" x2="426.729858" y2="261.527778" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="312.985782" y="229.305556" width="227.488152" height="35.243111" rx="6.966406" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="426.729858" y="252.465333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.982881" font-weight="bold" fill="var(--warn-accent)">Break-even: ~7.5 months</text>

  <!-- Savings area annotation -->
  <rect x="694.028436" y="246.423556" width="250.236967" height="60.416667" rx="6.966406" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="819.146919" y="271.597222" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.982881" font-weight="bold" fill="var(--ok-accent)">Savings Zone</text>
  <text x="819.146919" y="292.743111" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912725" fill="var(--ok-accent)">~37% savings over 2 years</text>

  <!-- Legend -->
  <rect x="102.559242" y="571.666667" width="272.985782" height="48.333333" rx="6.966406" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="125.308057" y1="595.833333" x2="170.805687" y2="595.833333" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="182.180095" y="600.868" font-family="Arial, sans-serif" font-size="13.912725" fill="var(--text)">On-Demand</text>
  <line x1="273.175355" y1="595.833333" x2="318.672986" y2="595.833333" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="330.047393" y="600.868" font-family="Arial, sans-serif" font-size="13.912725" fill="var(--text)">Reserved</text>
</svg>
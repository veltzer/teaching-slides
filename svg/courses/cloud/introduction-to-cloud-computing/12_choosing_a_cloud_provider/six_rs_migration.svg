<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Row 1 -->
  <!-- Box 1: Rehost -->
  <g filter="url(#shadow)">
    <rect x="96.25" y="76.25" width="328.125" height="217.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="96.25" y="76.25" width="328.125" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="96.25" y="103.4375" width="328.125" height="18.125" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="260.3125" y="106.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--bg)">Rehost</text>
    <text x="260.3125" y="153.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text)">"Lift and Shift"</text>
    <text x="260.3125" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Move as-is to cloud VMs.</text>
    <text x="260.3125" y="207.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">No code changes.</text>
    <text x="260.3125" y="230.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Fastest migration path.</text>
    <rect x="115" y="255.6875" width="75" height="23.5625" rx="6" fill="var(--primary-fill)" opacity="0.2" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="152.5" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Low Effort</text>
  </g>

  <!-- Box 2: Replatform -->
  <g filter="url(#shadow)">
    <rect x="452.5" y="76.25" width="328.125" height="217.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="452.5" y="76.25" width="328.125" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="452.5" y="103.4375" width="328.125" height="18.125" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="616.5625" y="106.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--primary-accent)">Replatform</text>
    <text x="616.5625" y="153.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text)">"Lift, Tinker, and Shift"</text>
    <text x="616.5625" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Minor optimizations for cloud.</text>
    <text x="616.5625" y="207.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">E.g., use managed DB</text>
    <text x="616.5625" y="230.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">instead of self-hosted.</text>
    <rect x="471.25" y="255.6875" width="103.125" height="23.5625" rx="6" fill="var(--primary-fill)" opacity="0.15" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="522.8125" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Low-Med Effort</text>
  </g>

  <!-- Box 3: Repurchase -->
  <g filter="url(#shadow)">
    <rect x="808.75" y="76.25" width="328.125" height="217.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="808.75" y="76.25" width="328.125" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="808.75" y="103.4375" width="328.125" height="18.125" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="972.8125" y="106.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--bg)">Repurchase</text>
    <text x="972.8125" y="153.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text)">"Drop and Shop"</text>
    <text x="972.8125" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Switch to a SaaS product.</text>
    <text x="972.8125" y="207.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">E.g., CRM to Salesforce,</text>
    <text x="972.8125" y="230.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">email to O365.</text>
    <rect x="827.5" y="255.6875" width="103.125" height="23.5625" rx="6" fill="var(--ok-fill)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="879.0625" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Medium Effort</text>
  </g>

  <!-- Row 2 -->
  <!-- Box 4: Refactor -->
  <g filter="url(#shadow)">
    <rect x="96.25" y="339.0625" width="328.125" height="217.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="96.25" y="339.0625" width="328.125" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="96.25" y="366.25" width="328.125" height="18.125" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="260.3125" y="368.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--bg)">Refactor</text>
    <text x="260.3125" y="416.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text)">"Re-architect"</text>
    <text x="260.3125" y="447.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Redesign for cloud-native.</text>
    <text x="260.3125" y="470.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Microservices, serverless.</text>
    <text x="260.3125" y="493.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Maximum cloud benefits.</text>
    <rect x="115" y="518.5" width="93.75" height="23.5625" rx="6" fill="var(--warn-fill)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="161.875" y="534.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">High Effort</text>
  </g>

  <!-- Box 5: Retain -->
  <g filter="url(#shadow)">
    <rect x="452.5" y="339.0625" width="328.125" height="217.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <rect x="452.5" y="339.0625" width="328.125" height="45.3125" rx="6" fill="var(--surface)"/>
    <rect x="452.5" y="366.25" width="328.125" height="18.125" fill="var(--surface)" rx="6"/>
    <text x="616.5625" y="368.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--text)">Retain</text>
    <text x="616.5625" y="416.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text)">"Keep As-Is"</text>
    <text x="616.5625" y="447.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Not ready to migrate yet.</text>
    <text x="616.5625" y="470.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Compliance, legacy deps,</text>
    <text x="616.5625" y="493.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">or recent investment.</text>
    <rect x="471.25" y="518.5" width="75" height="23.5625" rx="6" fill="var(--surface)"/>
    <text x="508.75" y="534.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--text-muted)">No Effort</text>
  </g>

  <!-- Box 6: Retire -->
  <g filter="url(#shadow)">
    <rect x="808.75" y="339.0625" width="328.125" height="217.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
    <rect x="808.75" y="339.0625" width="328.125" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
    <rect x="808.75" y="366.25" width="328.125" height="18.125" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
    <text x="972.8125" y="368.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--danger-accent)">Retire</text>
    <text x="972.8125" y="416.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text)">"Decommission"</text>
    <text x="972.8125" y="447.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Turn off unused apps.</text>
    <text x="972.8125" y="470.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Reduce portfolio before</text>
    <text x="972.8125" y="493.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">migrating the rest.</text>
    <rect x="827.5" y="518.5" width="75" height="23.5625" rx="6" fill="var(--danger-fill)" opacity="0.5" stroke="var(--danger-border)" stroke-width="2"/>
    <text x="865" y="534.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--danger-accent)">No Effort</text>
  </g>

  <!-- Effort arrow along bottom -->
  <line x1="152.5" y1="592.8125" x2="1071.25" y2="592.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="611.875" y="609.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--text-muted)">Increasing transformation effort and cloud optimization</text>
</svg>
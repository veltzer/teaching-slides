<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="40" y="40" width="386.440677966102" height="250.810810810811" rx="8.24721110845" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="92.252252252252" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.803436102462" font-weight="bold" fill="var(--primary-text)">Rehost</text>
  <text x="233.220338983051" y="139.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.525323605456" fill="var(--primary-text)">"Lift and Shift"</text>
  <text x="233.220338983051" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">Move as-is to VMs</text>
  <text x="233.220338983051" y="215.567567567568" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">No code changes</text>
  <text x="233.220338983051" y="264.684684684685" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.401718051231" font-weight="bold" fill="var(--primary-text)">Low effort</text>

  <rect x="446.779661016949" y="40" width="386.440677966102" height="250.810810810811" rx="8.24721110845" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="92.252252252252" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.803436102462" font-weight="bold" fill="var(--info-text)">Replatform</text>
  <text x="640" y="139.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.525323605456" fill="var(--info-text)">"Lift, Tinker, Shift"</text>
  <text x="640" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--info-text)">Use managed DB</text>
  <text x="640" y="215.567567567568" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--info-text)">Minor tweaks</text>
  <text x="640" y="264.684684684685" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.401718051231" font-weight="bold" fill="var(--info-text)">Low-med effort</text>

  <rect x="853.559322033898" y="40" width="386.440677966102" height="250.810810810811" rx="8.24721110845" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.779661016949" y="92.252252252252" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.803436102462" font-weight="bold" fill="var(--ok-text)">Repurchase</text>
  <text x="1046.779661016949" y="139.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.525323605456" fill="var(--ok-text)">"Drop and Shop"</text>
  <text x="1046.779661016949" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">Switch to SaaS</text>
  <text x="1046.779661016949" y="215.567567567568" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">CRM, email</text>
  <text x="1046.779661016949" y="264.684684684685" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.401718051231" font-weight="bold" fill="var(--ok-text)">Medium effort</text>

  <!-- Row 2 -->
  <rect x="40" y="332.612612612613" width="386.440677966102" height="250.810810810811" rx="8.24721110845" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="384.864864864865" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.803436102462" font-weight="bold" fill="var(--warn-text)">Refactor</text>
  <text x="233.220338983051" y="431.891891891892" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.525323605456" fill="var(--warn-text)">"Re-architect"</text>
  <text x="233.220338983051" y="478.918918918919" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--warn-text)">Cloud-native redesign</text>
  <text x="233.220338983051" y="508.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--warn-text)">Microservices</text>
  <text x="233.220338983051" y="557.297297297297" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.401718051231" font-weight="bold" fill="var(--warn-text)">High effort</text>

  <rect x="446.779661016949" y="332.612612612613" width="386.440677966102" height="250.810810810811" rx="8.24721110845" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="384.864864864865" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.803436102462" font-weight="bold" fill="var(--text)">Retain</text>
  <text x="640" y="431.891891891892" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.525323605456" fill="var(--text)">"Keep As-Is"</text>
  <text x="640" y="478.918918918919" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--text-muted)">Not ready</text>
  <text x="640" y="508.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--text-muted)">Compliance / legacy</text>
  <text x="640" y="557.297297297297" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.401718051231" font-weight="bold" fill="var(--text-muted)">No effort</text>

  <rect x="853.559322033898" y="332.612612612613" width="386.440677966102" height="250.810810810811" rx="8.24721110845" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.779661016949" y="384.864864864865" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.803436102462" font-weight="bold" fill="var(--danger-text)">Retire</text>
  <text x="1046.779661016949" y="431.891891891892" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.525323605456" fill="var(--danger-text)">"Decommission"</text>
  <text x="1046.779661016949" y="478.918918918919" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--danger-text)">Turn off unused</text>
  <text x="1046.779661016949" y="508.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--danger-text)">Reduce portfolio</text>
  <text x="1046.779661016949" y="557.297297297297" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.401718051231" font-weight="bold" fill="var(--danger-text)">No effort</text>

  <line x1="90.847457627119" y1="620" x2="1189.152542372881" y2="620" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Row 1 -->
  <!-- Box 1: Rehost -->
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="378.378378" height="236.734694" rx="6.721962" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="40" width="378.378378" height="49.319728" rx="6.721962" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="69.591837" width="378.378378" height="19.727891" fill="var(--primary-fill)" rx="6.721962" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="229.189189" y="72.550966" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.783651" font-weight="bold" fill="var(--bg)">Rehost</text>
    <text x="229.189189" y="123.843483" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.522471" fill="var(--text)">"Lift and Shift"</text>
    <text x="229.189189" y="158.367347" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">Move as-is to cloud VMs.</text>
    <text x="229.189189" y="183.027156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">No code changes.</text>
    <text x="229.189189" y="207.687075" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">Fastest migration path.</text>
    <rect x="61.621622" y="235.306122" width="86.486486" height="25.646259" rx="6.721962" fill="var(--primary-fill)" opacity="0.2" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="104.864865" y="253.061224" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.391825" font-weight="bold" fill="var(--primary-accent)">Low Effort</text>
  </g>

  <!-- Box 2: Replatform -->
  <g filter="url(#shadow)">
    <rect x="450.810811" y="40" width="378.378378" height="236.734694" rx="6.721962" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="450.810811" y="40" width="378.378378" height="49.319728" rx="6.721962" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="450.810811" y="69.591837" width="378.378378" height="19.727891" fill="var(--primary-fill)" rx="6.721962" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="640" y="72.550966" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.783651" font-weight="bold" fill="var(--primary-accent)">Replatform</text>
    <text x="640" y="123.843483" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.522471" fill="var(--text)">"Lift, Tinker, and Shift"</text>
    <text x="640" y="158.367347" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">Minor optimizations for cloud.</text>
    <text x="640" y="183.027156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">E.g., use managed DB</text>
    <text x="640" y="207.687075" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">instead of self-hosted.</text>
    <rect x="472.432432" y="235.306122" width="118.918919" height="25.646259" rx="6.721962" fill="var(--primary-fill)" opacity="0.15" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="531.891892" y="253.061224" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.391825" font-weight="bold" fill="var(--primary-accent)">Low-Med Effort</text>
  </g>

  <!-- Box 3: Repurchase -->
  <g filter="url(#shadow)">
    <rect x="861.621622" y="40" width="378.378378" height="236.734694" rx="6.721962" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="861.621622" y="40" width="378.378378" height="49.319728" rx="6.721962" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="861.621622" y="69.591837" width="378.378378" height="19.727891" fill="var(--ok-fill)" rx="6.721962" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="1050.810811" y="72.550966" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.783651" font-weight="bold" fill="var(--bg)">Repurchase</text>
    <text x="1050.810811" y="123.843483" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.522471" fill="var(--text)">"Drop and Shop"</text>
    <text x="1050.810811" y="158.367347" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">Switch to a SaaS product.</text>
    <text x="1050.810811" y="183.027156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">E.g., CRM to Salesforce,</text>
    <text x="1050.810811" y="207.687075" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">email to O365.</text>
    <rect x="883.243243" y="235.306122" width="118.918919" height="25.646259" rx="6.721962" fill="var(--ok-fill)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="942.702703" y="253.061224" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.391825" font-weight="bold" fill="var(--ok-accent)">Medium Effort</text>
  </g>

  <!-- Row 2 -->
  <!-- Box 4: Refactor -->
  <g filter="url(#shadow)">
    <rect x="40" y="326.054422" width="378.378378" height="236.734694" rx="6.721962" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="326.054422" width="378.378378" height="49.319728" rx="6.721962" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="355.646259" width="378.378378" height="19.727891" fill="var(--warn-fill)" rx="6.721962" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="229.189189" y="358.605497" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.783651" font-weight="bold" fill="var(--bg)">Refactor</text>
    <text x="229.189189" y="409.898014" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.522471" fill="var(--text)">"Re-architect"</text>
    <text x="229.189189" y="444.421769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">Redesign for cloud-native.</text>
    <text x="229.189189" y="469.081687" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">Microservices, serverless.</text>
    <text x="229.189189" y="493.741497" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">Maximum cloud benefits.</text>
    <rect x="61.621622" y="521.360544" width="108.108108" height="25.646259" rx="6.721962" fill="var(--warn-fill)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="115.675676" y="539.115646" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.391825" font-weight="bold" fill="var(--warn-accent)">High Effort</text>
  </g>

  <!-- Box 5: Retain -->
  <g filter="url(#shadow)">
    <rect x="450.810811" y="326.054422" width="378.378378" height="236.734694" rx="6.721962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <rect x="450.810811" y="326.054422" width="378.378378" height="49.319728" rx="6.721962" fill="var(--surface)"/>
    <rect x="450.810811" y="355.646259" width="378.378378" height="19.727891" fill="var(--surface)" rx="6.721962"/>
    <text x="640" y="358.605497" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.783651" font-weight="bold" fill="var(--text)">Retain</text>
    <text x="640" y="409.898014" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.522471" fill="var(--text)">"Keep As-Is"</text>
    <text x="640" y="444.421769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">Not ready to migrate yet.</text>
    <text x="640" y="469.081687" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">Compliance, legacy deps,</text>
    <text x="640" y="493.741497" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">or recent investment.</text>
    <rect x="472.432432" y="521.360544" width="86.486486" height="25.646259" rx="6.721962" fill="var(--surface)"/>
    <text x="515.675676" y="539.115646" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.391825" font-weight="bold" fill="var(--text-muted)">No Effort</text>
  </g>

  <!-- Box 6: Retire -->
  <g filter="url(#shadow)">
    <rect x="861.621622" y="326.054422" width="378.378378" height="236.734694" rx="6.721962" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="861.621622" y="326.054422" width="378.378378" height="49.319728" rx="6.721962" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="861.621622" y="355.646259" width="378.378378" height="19.727891" fill="var(--danger-fill)" rx="6.721962" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="1050.810811" y="358.605497" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.783651" font-weight="bold" fill="var(--danger-accent)">Retire</text>
    <text x="1050.810811" y="409.898014" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.522471" fill="var(--text)">"Decommission"</text>
    <text x="1050.810811" y="444.421769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">Turn off unused apps.</text>
    <text x="1050.810811" y="469.081687" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">Reduce portfolio before</text>
    <text x="1050.810811" y="493.741497" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.457148" fill="var(--text-muted)">migrating the rest.</text>
    <rect x="883.243243" y="521.360544" width="86.486486" height="25.646259" rx="6.721962" fill="var(--danger-fill)" opacity="0.5" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="926.486486" y="539.115646" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.391825" font-weight="bold" fill="var(--danger-accent)">No Effort</text>
  </g>

  <!-- Effort arrow along bottom -->
  <line x1="104.864865" y1="602.244898" x2="1164.324324" y2="602.244898" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="634.594595" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.489754" fill="var(--text-muted)">Increasing transformation effort and cloud optimization</text>
</svg>
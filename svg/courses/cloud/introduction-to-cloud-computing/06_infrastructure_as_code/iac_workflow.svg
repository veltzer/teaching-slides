<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Pipeline track -->
  <rect x="77.5" y="221.25" rx="6" width="1125" height="181.25" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <!-- Step 1: Write Code -->
  <rect x="96.25" y="248.4375" rx="6" width="150" height="126.875" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96.25" y="248.4375" rx="6" width="150" height="31.7188" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="171.25" y="269.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">1. Write Code</text>
  <text x="171.25" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Terraform /</text>
  <text x="171.25" y="319.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">CloudFormation</text>
  <text x="171.25" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Version controlled</text>

  <!-- Arrow 1->2 -->
  <line x1="246.25" y1="311.875" x2="283.75" y2="311.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: PR Review -->
  <rect x="291.25" y="248.4375" rx="6" width="150" height="126.875" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="291.25" y="248.4375" rx="6" width="150" height="31.7188" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="366.25" y="269.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">2. PR Review</text>
  <text x="366.25" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Peer review</text>
  <text x="366.25" y="319.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">of changes</text>
  <text x="366.25" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Collaboration</text>

  <!-- Arrow 2->3 -->
  <line x1="441.25" y1="311.875" x2="478.75" y2="311.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: CI Plan -->
  <rect x="486.25" y="248.4375" rx="6" width="150" height="126.875" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="486.25" y="248.4375" rx="6" width="150" height="31.7188" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="561.25" y="269.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">3. CI Plan</text>
  <text x="561.25" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Automated</text>
  <text x="561.25" y="319.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">plan output</text>
  <text x="561.25" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Preview changes</text>

  <!-- Arrow 3->4 -->
  <line x1="636.25" y1="311.875" x2="673.75" y2="311.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Approve -->
  <rect x="681.25" y="248.4375" rx="6" width="150" height="126.875" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="681.25" y="248.4375" rx="6" width="150" height="31.7188" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="756.25" y="269.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">4. Approve</text>
  <text x="756.25" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Manual gate</text>
  <text x="756.25" y="319.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">approval</text>
  <text x="756.25" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Safety check</text>

  <!-- Arrow 4->5 -->
  <line x1="831.25" y1="311.875" x2="868.75" y2="311.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Apply -->
  <rect x="876.25" y="248.4375" rx="6" width="150" height="126.875" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="876.25" y="248.4375" rx="6" width="150" height="31.7188" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="951.25" y="269.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">5. Apply</text>
  <text x="951.25" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Execute</text>
  <text x="951.25" y="319.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">changes</text>
  <text x="951.25" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Provision infra</text>

  <!-- Arrow 5->6 -->
  <line x1="1026.25" y1="311.875" x2="1063.75" y2="311.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Infrastructure -->
  <rect x="1071.25" y="248.4375" rx="6" width="112.5" height="126.875" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1127.5" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Live</text>
  <text x="1127.5" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Infra</text>

  <!-- Top labels -->
  <text x="640" y="85.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Infrastructure as Code Pipeline</text>

  <!-- Phase labels above pipeline -->
  <rect x="96.25" y="185" rx="6" width="343.125" height="25.375" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="267.8125" y="202.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Development Phase</text>

  <rect x="486.25" y="185" rx="6" width="343.125" height="25.375" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="657.8125" y="202.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Validation Phase</text>

  <rect x="876.25" y="185" rx="6" width="307.5" height="25.375" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1030" y="202.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Deployment Phase</text>

  <!-- Bottom: Key benefits -->
  <rect x="152.5" y="447.8125" rx="6" width="206.25" height="54.375" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="255.625" y="473.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Reproducible</text>
  <text x="255.625" y="491.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Same code = same infra</text>

  <rect x="405.625" y="447.8125" rx="6" width="206.25" height="54.375" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="508.75" y="473.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Auditable</text>
  <text x="508.75" y="491.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Full change history</text>

  <rect x="658.75" y="447.8125" rx="6" width="206.25" height="54.375" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="761.875" y="473.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Scalable</text>
  <text x="761.875" y="491.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Manage 1000s of resources</text>

  <rect x="911.875" y="447.8125" rx="6" width="206.25" height="54.375" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1015" y="473.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--info-accent)">Rollback</text>
  <text x="1015" y="491.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Revert to any version</text>

  <!-- Tools listed -->
  <text x="640" y="556.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)">Tools: Terraform | Pulumi | AWS CloudFormation | Azure Bicep | Google Deployment Manager</text>
</svg>
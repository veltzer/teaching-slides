<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Pipeline track -->
  <rect x="40" y="200" rx="20" ry="20" width="1200" height="200" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>

  <!-- Step 1: Write Code -->
  <rect x="60" y="230" rx="10" ry="10" width="160" height="140" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="230" rx="10" ry="10" width="160" height="35" fill="url(#grad-primary)"/>
  <text x="140" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">1. Write Code</text>
  <text x="140" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Terraform /</text>
  <text x="140" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">CloudFormation</text>
  <text x="140" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Version controlled</text>

  <!-- Arrow 1->2 -->
  <line x1="220" y1="300" x2="260" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: PR Review -->
  <rect x="268" y="230" rx="10" ry="10" width="160" height="140" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="268" y="230" rx="10" ry="10" width="160" height="35" fill="url(#grad-warn)"/>
  <text x="348" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">2. PR Review</text>
  <text x="348" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Peer review</text>
  <text x="348" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">of changes</text>
  <text x="348" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Collaboration</text>

  <!-- Arrow 2->3 -->
  <line x1="428" y1="300" x2="468" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: CI Plan -->
  <rect x="476" y="230" rx="10" ry="10" width="160" height="140" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="476" y="230" rx="10" ry="10" width="160" height="35" fill="url(#grad-info)"/>
  <text x="556" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">3. CI Plan</text>
  <text x="556" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Automated</text>
  <text x="556" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">plan output</text>
  <text x="556" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Preview changes</text>

  <!-- Arrow 3->4 -->
  <line x1="636" y1="300" x2="676" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Approve -->
  <rect x="684" y="230" rx="10" ry="10" width="160" height="140" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="684" y="230" rx="10" ry="10" width="160" height="35" fill="url(#grad-ok)"/>
  <text x="764" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">4. Approve</text>
  <text x="764" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Manual gate</text>
  <text x="764" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">approval</text>
  <text x="764" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Safety check</text>

  <!-- Arrow 4->5 -->
  <line x1="844" y1="300" x2="884" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Apply -->
  <rect x="892" y="230" rx="10" ry="10" width="160" height="140" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="892" y="230" rx="10" ry="10" width="160" height="35" fill="url(#grad-ok)"/>
  <text x="972" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">5. Apply</text>
  <text x="972" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Execute</text>
  <text x="972" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">changes</text>
  <text x="972" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Provision infra</text>

  <!-- Arrow 5->6 -->
  <line x1="1052" y1="300" x2="1092" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Infrastructure -->
  <rect x="1100" y="230" rx="10" ry="10" width="120" height="140" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">Live</text>
  <text x="1160" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">Infra</text>

  <!-- Top labels -->
  <text x="640" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Infrastructure as Code Pipeline</text>

  <!-- Phase labels above pipeline -->
  <rect x="60" y="160" rx="4" ry="4" width="366" height="28" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="243" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Development Phase</text>

  <rect x="476" y="160" rx="4" ry="4" width="366" height="28" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="659" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Validation Phase</text>

  <rect x="892" y="160" rx="4" ry="4" width="328" height="28" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="1056" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Deployment Phase</text>

  <!-- Bottom: Key benefits -->
  <rect x="120" y="450" rx="8" ry="8" width="220" height="60" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="230" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Reproducible</text>
  <text x="230" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Same code = same infra</text>

  <rect x="390" y="450" rx="8" ry="8" width="220" height="60" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="500" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Auditable</text>
  <text x="500" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Full change history</text>

  <rect x="660" y="450" rx="8" ry="8" width="220" height="60" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="770" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">Scalable</text>
  <text x="770" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Manage 1000s of resources</text>

  <rect x="930" y="450" rx="8" ry="8" width="220" height="60" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.5"/>
  <text x="1040" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-dk)">Rollback</text>
  <text x="1040" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Revert to any version</text>

  <!-- Tools listed -->
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Tools: Terraform | Pulumi | AWS CloudFormation | Azure Bicep | Google Deployment Manager</text>
</svg>
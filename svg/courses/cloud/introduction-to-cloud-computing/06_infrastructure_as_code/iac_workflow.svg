<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Pipeline track -->
  <rect x="40" y="207.307692" rx="6.874703" width="1200" height="223.076923" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <!-- Step 1: Write Code -->
  <rect x="60" y="240.769231" rx="6.874703" width="160" height="156.153846" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="240.769231" rx="6.874703" width="160" height="39.038523" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="266.423015" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--bg)">1. Write Code</text>
  <text x="140" y="307.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">Terraform /</text>
  <text x="140" y="327.769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">CloudFormation</text>
  <text x="140" y="352.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.617331" fill="var(--text-faint)">Version controlled</text>

  <!-- Arrow 1->2 -->
  <line x1="220" y1="318.846154" x2="260" y2="318.846154" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: PR Review -->
  <rect x="268" y="240.769231" rx="6.874703" width="160" height="156.153846" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="268" y="240.769231" rx="6.874703" width="160" height="39.038523" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="348" y="266.423015" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--bg)">2. PR Review</text>
  <text x="348" y="307.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">Peer review</text>
  <text x="348" y="327.769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">of changes</text>
  <text x="348" y="352.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.617331" fill="var(--text-faint)">Collaboration</text>

  <!-- Arrow 2->3 -->
  <line x1="428" y1="318.846154" x2="468" y2="318.846154" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: CI Plan -->
  <rect x="476" y="240.769231" rx="6.874703" width="160" height="156.153846" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="476" y="240.769231" rx="6.874703" width="160" height="39.038523" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="556" y="266.423015" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--bg)">3. CI Plan</text>
  <text x="556" y="307.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">Automated</text>
  <text x="556" y="327.769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">plan output</text>
  <text x="556" y="352.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.617331" fill="var(--text-faint)">Preview changes</text>

  <!-- Arrow 3->4 -->
  <line x1="636" y1="318.846154" x2="676" y2="318.846154" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Approve -->
  <rect x="684" y="240.769231" rx="6.874703" width="160" height="156.153846" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="684" y="240.769231" rx="6.874703" width="160" height="39.038523" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764" y="266.423015" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--bg)">4. Approve</text>
  <text x="764" y="307.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">Manual gate</text>
  <text x="764" y="327.769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">approval</text>
  <text x="764" y="352.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.617331" fill="var(--text-faint)">Safety check</text>

  <!-- Arrow 4->5 -->
  <line x1="844" y1="318.846154" x2="884" y2="318.846154" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Apply -->
  <rect x="892" y="240.769231" rx="6.874703" width="160" height="156.153846" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="892" y="240.769231" rx="6.874703" width="160" height="39.038523" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="972" y="266.423015" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--bg)">5. Apply</text>
  <text x="972" y="307.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">Execute</text>
  <text x="972" y="327.769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">changes</text>
  <text x="972" y="352.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.617331" fill="var(--text-faint)">Provision infra</text>

  <!-- Arrow 5->6 -->
  <line x1="1052" y1="318.846154" x2="1092" y2="318.846154" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Infrastructure -->
  <rect x="1100" y="240.769231" rx="6.874703" width="120" height="156.153846" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="307.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785652" font-weight="bold" fill="var(--primary-accent)">Live</text>
  <text x="1160" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785652" font-weight="bold" fill="var(--primary-accent)">Infra</text>

  <!-- Top labels -->
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785652" fill="var(--text-muted)">Infrastructure as Code Pipeline</text>

  <!-- Phase labels above pipeline -->
  <rect x="60" y="162.692308" rx="6.874703" width="366" height="31.230769" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="243" y="183.884677" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-faint)">Development Phase</text>

  <rect x="476" y="162.692308" rx="6.874703" width="366" height="31.230769" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="659" y="183.884677" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-faint)">Validation Phase</text>

  <rect x="892" y="162.692308" rx="6.874703" width="328" height="31.230769" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1056" y="183.884677" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-faint)">Deployment Phase</text>

  <!-- Bottom: Key benefits -->
  <rect x="120" y="486.153846" rx="6.874703" width="220" height="66.923077" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="517.384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--primary-accent)">Reproducible</text>
  <text x="230" y="539.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">Same code = same infra</text>

  <rect x="390" y="486.153846" rx="6.874703" width="220" height="66.923077" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="517.384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--ok-accent)">Auditable</text>
  <text x="500" y="539.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">Full change history</text>

  <rect x="660" y="486.153846" rx="6.874703" width="220" height="66.923077" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="517.384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--warn-accent)">Scalable</text>
  <text x="770" y="539.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">Manage 1000s of resources</text>

  <rect x="930" y="486.153846" rx="6.874703" width="220" height="66.923077" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="517.384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--info-accent)">Rollback</text>
  <text x="1040" y="539.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">Revert to any version</text>

  <!-- Tools listed -->
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" fill="var(--text-faint)">Tools: Terraform | Pulumi | AWS CloudFormation | Azure Bicep | Google Deployment Manager</text>
</svg>
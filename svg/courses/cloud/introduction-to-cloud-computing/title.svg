<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <!-- Distributed network: connection lines -->
  <g opacity="0.25">
    <!-- Central hub connections -->
    <line x1="640" y1="370" x2="380" y2="280" stroke="var(--primary-fill)" stroke-width="2"/>
    <line x1="640" y1="370" x2="900" y2="280" stroke="var(--primary-fill)" stroke-width="2"/>
    <line x1="640" y1="370" x2="440" y2="480" stroke="var(--primary-fill)" stroke-width="2"/>
    <line x1="640" y1="370" x2="840" y2="480" stroke="var(--primary-fill)" stroke-width="2"/>
    <line x1="640" y1="370" x2="640" y2="230" stroke="var(--primary-fill)" stroke-width="2"/>
    <line x1="640" y1="370" x2="250" y2="400" stroke="var(--primary-fill)" stroke-width="2"/>
    <line x1="640" y1="370" x2="1030" y2="400" stroke="var(--primary-fill)" stroke-width="2"/>
    <!-- Outer connections -->
    <line x1="380" y1="280" x2="250" y2="400" stroke="var(--primary-border)" stroke-width="1.5"/>
    <line x1="900" y1="280" x2="1030" y2="400" stroke="var(--primary-border)" stroke-width="1.5"/>
    <line x1="380" y1="280" x2="440" y2="480" stroke="var(--primary-border)" stroke-width="1.5"/>
    <line x1="900" y1="280" x2="840" y2="480" stroke="var(--primary-border)" stroke-width="1.5"/>
    <line x1="640" y1="230" x2="380" y2="280" stroke="var(--primary-border)" stroke-width="1.5"/>
    <line x1="640" y1="230" x2="900" y2="280" stroke="var(--primary-border)" stroke-width="1.5"/>
    <line x1="440" y1="480" x2="840" y2="480" stroke="var(--primary-border)" stroke-width="1.5"/>
    <line x1="250" y1="400" x2="440" y2="480" stroke="var(--primary-border)" stroke-width="1.5"/>
    <line x1="1030" y1="400" x2="840" y2="480" stroke="var(--primary-border)" stroke-width="1.5"/>
    <!-- Secondary connections -->
    <line x1="180" y1="300" x2="380" y2="280" stroke="var(--info-fill)" stroke-width="1"/>
    <line x1="180" y1="300" x2="250" y2="400" stroke="var(--info-fill)" stroke-width="1"/>
    <line x1="1100" y1="310" x2="900" y2="280" stroke="var(--info-fill)" stroke-width="1"/>
    <line x1="1100" y1="310" x2="1030" y2="400" stroke="var(--info-fill)" stroke-width="1"/>
    <line x1="340" y1="550" x2="440" y2="480" stroke="var(--ok-fill)" stroke-width="1"/>
    <line x1="940" y1="550" x2="840" y2="480" stroke="var(--ok-fill)" stroke-width="1"/>
  </g>

  <!-- Central hub node -->
  <circle cx="640" cy="370" r="22" fill="var(--primary-accent)" opacity="0.7"/>
  <circle cx="640" cy="370" r="14" fill="var(--primary-fill)" opacity="0.8"/>

  <!-- Primary ring nodes -->
  <circle cx="380" cy="280" r="16" fill="var(--primary-accent)" opacity="0.5"/>
  <circle cx="380" cy="280" r="10" fill="var(--primary-fill)" opacity="0.6"/>

  <circle cx="900" cy="280" r="16" fill="var(--primary-accent)" opacity="0.5"/>
  <circle cx="900" cy="280" r="10" fill="var(--primary-fill)" opacity="0.6"/>

  <circle cx="640" cy="230" r="14" fill="var(--primary-accent)" opacity="0.5"/>
  <circle cx="640" cy="230" r="9" fill="var(--primary-fill)" opacity="0.6"/>

  <circle cx="250" cy="400" r="14" fill="var(--primary-accent)" opacity="0.45"/>
  <circle cx="250" cy="400" r="9" fill="var(--primary-fill)" opacity="0.55"/>

  <circle cx="1030" cy="400" r="14" fill="var(--primary-accent)" opacity="0.45"/>
  <circle cx="1030" cy="400" r="9" fill="var(--primary-fill)" opacity="0.55"/>

  <circle cx="440" cy="480" r="15" fill="var(--primary-accent)" opacity="0.5"/>
  <circle cx="440" cy="480" r="10" fill="var(--primary-fill)" opacity="0.6"/>

  <circle cx="840" cy="480" r="15" fill="var(--primary-accent)" opacity="0.5"/>
  <circle cx="840" cy="480" r="10" fill="var(--primary-fill)" opacity="0.6"/>

  <!-- Secondary outer nodes -->
  <circle cx="180" cy="300" r="8" fill="var(--info-fill)" opacity="0.35"/>
  <circle cx="1100" cy="310" r="8" fill="var(--info-fill)" opacity="0.35"/>
  <circle cx="340" cy="550" r="7" fill="var(--ok-fill)" opacity="0.3"/>
  <circle cx="940" cy="550" r="7" fill="var(--ok-fill)" opacity="0.3"/>

  <!-- Tiny decorative dots -->
  <circle cx="140" cy="250" r="3" fill="var(--primary-fill)" opacity="0.2"/>
  <circle cx="210" cy="500" r="3" fill="var(--primary-fill)" opacity="0.2"/>
  <circle cx="1140" cy="260" r="3" fill="var(--primary-fill)" opacity="0.2"/>
  <circle cx="1070" cy="510" r="3" fill="var(--primary-fill)" opacity="0.2"/>
  <circle cx="500" cy="550" r="2.5" fill="var(--info-fill)" opacity="0.2"/>
  <circle cx="780" cy="550" r="2.5" fill="var(--info-fill)" opacity="0.2"/>
  <circle cx="300" cy="230" r="2.5" fill="var(--ok-fill)" opacity="0.2"/>
  <circle cx="980" cy="230" r="2.5" fill="var(--ok-fill)" opacity="0.2"/>

  <!-- Accent bar -->
  <rect x="415" y="580" width="450" height="4" rx="2" fill="var(--primary-fill)" opacity="0.5"/>

  <!-- Title text -->
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Introduction To Cloud Computing</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">The Foundation of Modern Infrastructure</text>
</svg>

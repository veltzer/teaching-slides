<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Horizontal bar chart -->
  <!-- Y axis -->
  <line x1="302.5" y1="94.375" x2="302.5" y2="511.25" stroke="var(--border)" stroke-width="2"/>
  <!-- X axis -->
  <line x1="302.5" y1="511.25" x2="1165" y2="511.25" stroke="var(--border)" stroke-width="2"/>

  <!-- Grid lines -->
  <line x1="475" y1="94.375" x2="475" y2="511.25" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="475" y="533.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">10%</text>
  <line x1="647.5" y1="94.375" x2="647.5" y2="511.25" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="647.5" y="533.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">20%</text>
  <line x1="820" y1="94.375" x2="820" y2="511.25" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="820" y="533.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">30%</text>
  <line x1="992.5" y1="94.375" x2="992.5" y2="511.25" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="992.5" y="533.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">40%</text>

  <!-- Bar 1: AWS 31% -->
  <text x="293.125" y="157.8125" text-anchor="end" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--text)">AWS</text>
  <rect x="304.375" y="126.0938" width="535.3125" height="58.9062" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="855.625" y="163.25" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--primary-accent)">31%</text>

  <!-- Bar 2: Azure 25% -->
  <text x="293.125" y="262.0312" text-anchor="end" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--text)">Azure</text>
  <rect x="304.375" y="230.3125" width="431.25" height="58.9062" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="750.625" y="267.4688" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--info-accent)">25%</text>

  <!-- Bar 3: GCP 11% -->
  <text x="293.125" y="366.25" text-anchor="end" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--text)">GCP</text>
  <rect x="304.375" y="334.5312" width="190.3125" height="58.9062" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="508.75" y="371.6875" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--ok-accent)">11%</text>

  <!-- Bar 4: Others 33% -->
  <text x="293.125" y="470.4688" text-anchor="end" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--text)">Others</text>
  <rect x="304.375" y="438.75" width="570" height="58.9062" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="889.375" y="475.9062" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--text-muted)">33%</text>

  <!-- Source note -->
  <text x="640" y="583.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Global Cloud Infrastructure Market Share (approximate, 2024)</text>
</svg>
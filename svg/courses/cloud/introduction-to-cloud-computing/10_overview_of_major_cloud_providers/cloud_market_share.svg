<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>

  <!-- Horizontal bar chart -->
  <!-- Y axis -->
  <line x1="280" y1="60" x2="280" y2="520" stroke="var(--border-strong)" stroke-width="2"/>
  <!-- X axis -->
  <line x1="280" y1="520" x2="1200" y2="520" stroke="var(--border-strong)" stroke-width="2"/>

  <!-- Grid lines -->
  <line x1="464" y1="60" x2="464" y2="520" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="464" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">10%</text>
  <line x1="648" y1="60" x2="648" y2="520" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="648" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">20%</text>
  <line x1="832" y1="60" x2="832" y2="520" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="832" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">30%</text>
  <line x1="1016" y1="60" x2="1016" y2="520" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1016" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">40%</text>

  <!-- Bar 1: AWS 31% -->
  <text x="270" y="130" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text-dark)">AWS</text>
  <rect x="282" y="95" width="571" height="65" rx="8" fill="var(--primary)" filter="url(#shadow)"/>
  <text x="870" y="136" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-dk)">31%</text>

  <!-- Bar 2: Azure 25% -->
  <text x="270" y="245" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text-dark)">Azure</text>
  <rect x="282" y="210" width="460" height="65" rx="8" fill="var(--info)" filter="url(#shadow)"/>
  <text x="758" y="251" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-dk)">25%</text>

  <!-- Bar 3: GCP 11% -->
  <text x="270" y="360" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text-dark)">GCP</text>
  <rect x="282" y="325" width="203" height="65" rx="8" fill="var(--ok)" filter="url(#shadow)"/>
  <text x="500" y="366" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-dk)">11%</text>

  <!-- Bar 4: Others 33% -->
  <text x="270" y="475" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text-dark)">Others</text>
  <rect x="282" y="440" width="608" height="65" rx="8" fill="var(--surface-alt)" stroke="var(--border-strong)" stroke-width="1" filter="url(#shadow)"/>
  <text x="906" y="481" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text-muted)">33%</text>

  <!-- Source note -->
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Global Cloud Infrastructure Market Share (approximate, 2024)</text>
</svg>
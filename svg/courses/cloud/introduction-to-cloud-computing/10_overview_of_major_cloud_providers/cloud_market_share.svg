<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Horizontal bar chart -->
  <!-- Y axis -->
  <line x1="280" y1="60" x2="280" y2="520" stroke="var(--border)" stroke-width="2"/>
  <!-- X axis -->
  <line x1="280" y1="520" x2="1200" y2="520" stroke="var(--border)" stroke-width="2"/>

  <!-- Grid lines -->
  <line x1="464" y1="60" x2="464" y2="520" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="464" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">10%</text>
  <line x1="648" y1="60" x2="648" y2="520" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="648" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">20%</text>
  <line x1="832" y1="60" x2="832" y2="520" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="832" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">30%</text>
  <line x1="1016" y1="60" x2="1016" y2="520" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1016" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">40%</text>

  <!-- Bar 1: AWS 31% -->
  <text x="270" y="130" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">AWS</text>
  <rect x="282" y="95" width="571" height="65" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="870" y="136" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-accent)">31%</text>

  <!-- Bar 2: Azure 25% -->
  <text x="270" y="245" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Azure</text>
  <rect x="282" y="210" width="460" height="65" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="758" y="251" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-accent)">25%</text>

  <!-- Bar 3: GCP 11% -->
  <text x="270" y="360" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">GCP</text>
  <rect x="282" y="325" width="203" height="65" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="500" y="366" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-accent)">11%</text>

  <!-- Bar 4: Others 33% -->
  <text x="270" y="475" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Others</text>
  <rect x="282" y="440" width="608" height="65" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="906" y="481" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text-muted)">33%</text>

  <!-- Source note -->
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Global Cloud Infrastructure Market Share (approximate, 2024)</text>
</svg>
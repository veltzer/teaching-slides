<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>

  <!-- Table structure -->
  <!-- Column widths: Category=200, AWS=280, Azure=280, GCP=280 -->
  <!-- Starting x=60 -->

  <!-- Header Row -->
  <rect x="60" y="30" width="200" height="60" rx="8" fill="var(--surface-alt)" stroke="var(--border-strong)" stroke-width="2"/>
  <text x="160" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text-dark)">Service</text>

  <rect x="270" y="30" width="280" height="60" rx="8" fill="var(--primary)" filter="url(#shadow)"/>
  <text x="410" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)">AWS</text>

  <rect x="560" y="30" width="280" height="60" rx="8" fill="var(--info)" filter="url(#shadow)"/>
  <text x="700" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)">Azure</text>

  <rect x="850" y="30" width="280" height="60" rx="8" fill="var(--ok)" filter="url(#shadow)"/>
  <text x="990" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)">GCP</text>

  <!-- Row 1: Compute -->
  <rect x="60" y="105" width="200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="160" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)">Compute</text>

  <rect x="270" y="105" width="280" height="80" rx="6" fill="var(--primary-pale)" stroke="var(--primary-lt)" stroke-width="1.5"/>
  <text x="410" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)">EC2</text>

  <rect x="560" y="105" width="280" height="80" rx="6" fill="var(--info-pale)" stroke="var(--info-lt)" stroke-width="1.5"/>
  <text x="700" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-dk)">Virtual Machines</text>

  <rect x="850" y="105" width="280" height="80" rx="6" fill="var(--ok-pale)" stroke="var(--ok-lt)" stroke-width="1.5"/>
  <text x="990" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-dk)">Compute Engine</text>

  <!-- Row 2: Object Storage -->
  <rect x="60" y="200" width="200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="160" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)">Object</text>
  <text x="160" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)">Storage</text>

  <rect x="270" y="200" width="280" height="80" rx="6" fill="var(--primary-pale)" stroke="var(--primary-lt)" stroke-width="1.5"/>
  <text x="410" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)">S3</text>

  <rect x="560" y="200" width="280" height="80" rx="6" fill="var(--info-pale)" stroke="var(--info-lt)" stroke-width="1.5"/>
  <text x="700" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-dk)">Blob Storage</text>

  <rect x="850" y="200" width="280" height="80" rx="6" fill="var(--ok-pale)" stroke="var(--ok-lt)" stroke-width="1.5"/>
  <text x="990" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-dk)">Cloud Storage</text>

  <!-- Row 3: Serverless -->
  <rect x="60" y="295" width="200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="160" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)">Serverless</text>

  <rect x="270" y="295" width="280" height="80" rx="6" fill="var(--primary-pale)" stroke="var(--primary-lt)" stroke-width="1.5"/>
  <text x="410" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)">Lambda</text>

  <rect x="560" y="295" width="280" height="80" rx="6" fill="var(--info-pale)" stroke="var(--info-lt)" stroke-width="1.5"/>
  <text x="700" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-dk)">Functions</text>

  <rect x="850" y="295" width="280" height="80" rx="6" fill="var(--ok-pale)" stroke="var(--ok-lt)" stroke-width="1.5"/>
  <text x="990" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-dk)">Cloud Functions</text>

  <!-- Row 4: Containers -->
  <rect x="60" y="390" width="200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="160" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)">Containers</text>

  <rect x="270" y="390" width="280" height="80" rx="6" fill="var(--primary-pale)" stroke="var(--primary-lt)" stroke-width="1.5"/>
  <text x="410" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)">EKS</text>

  <rect x="560" y="390" width="280" height="80" rx="6" fill="var(--info-pale)" stroke="var(--info-lt)" stroke-width="1.5"/>
  <text x="700" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-dk)">AKS</text>

  <rect x="850" y="390" width="280" height="80" rx="6" fill="var(--ok-pale)" stroke="var(--ok-lt)" stroke-width="1.5"/>
  <text x="990" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-dk)">GKE</text>

  <!-- Row 5: NoSQL -->
  <rect x="60" y="485" width="200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="160" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)">NoSQL DB</text>

  <rect x="270" y="485" width="280" height="80" rx="6" fill="var(--primary-pale)" stroke="var(--primary-lt)" stroke-width="1.5"/>
  <text x="410" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)">DynamoDB</text>

  <rect x="560" y="485" width="280" height="80" rx="6" fill="var(--info-pale)" stroke="var(--info-lt)" stroke-width="1.5"/>
  <text x="700" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-dk)">Cosmos DB</text>

  <rect x="850" y="485" width="280" height="80" rx="6" fill="var(--ok-pale)" stroke="var(--ok-lt)" stroke-width="1.5"/>
  <text x="990" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-dk)">Firestore</text>

  <!-- Note -->
  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Same concepts, different names -- multi-cloud fluency is key</text>
</svg>
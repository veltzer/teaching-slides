<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Table structure -->
  <!-- Column widths: Category=200, AWS=280, Azure=280, GCP=280 -->
  <!-- Starting x=60 -->

  <!-- Header Row -->
  <rect x="40" y="40" width="224.299065" height="60" rx="6.893509" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.149533" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--text)">Service</text>

  <rect x="275.514019" y="40" width="314.018692" height="60" rx="6.893509" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="432.523364" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.298107" font-weight="bold" fill="var(--bg)">AWS</text>

  <rect x="600.747664" y="40" width="314.018692" height="60" rx="6.893509" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="757.757009" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.298107" font-weight="bold" fill="var(--bg)">Azure</text>

  <rect x="925.981308" y="40" width="314.018692" height="60" rx="6.893509" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1082.990654" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.298107" font-weight="bold" fill="var(--bg)">GCP</text>

  <!-- Row 1: Compute -->
  <rect x="40" y="114.999945" width="224.299065" height="80" rx="6.893509" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.149533" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.06216" font-weight="bold" fill="var(--text)">Compute</text>

  <rect x="275.514019" y="114.999945" width="314.018692" height="80" rx="6.893509" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="432.523364" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--primary-accent)">EC2</text>

  <rect x="600.747664" y="114.999945" width="314.018692" height="80" rx="6.893509" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="757.757009" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--info-accent)">Virtual Machines</text>

  <rect x="925.981308" y="114.999945" width="314.018692" height="80" rx="6.893509" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1082.990654" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--ok-accent)">Compute Engine</text>

  <!-- Row 2: Object Storage -->
  <rect x="40" y="210" width="224.299065" height="80" rx="6.893509" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.149533" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.06216" font-weight="bold" fill="var(--text)">Object</text>
  <text x="152.149533" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.06216" font-weight="bold" fill="var(--text)">Storage</text>

  <rect x="275.514019" y="210" width="314.018692" height="80" rx="6.893509" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="432.523364" y="257.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--primary-accent)">S3</text>

  <rect x="600.747664" y="210" width="314.018692" height="80" rx="6.893509" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="757.757009" y="257.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--info-accent)">Blob Storage</text>

  <rect x="925.981308" y="210" width="314.018692" height="80" rx="6.893509" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1082.990654" y="257.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--ok-accent)">Cloud Storage</text>

  <!-- Row 3: Serverless -->
  <rect x="40" y="305.000055" width="224.299065" height="80" rx="6.893509" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.149533" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.06216" font-weight="bold" fill="var(--text)">Serverless</text>

  <rect x="275.514019" y="305.000055" width="314.018692" height="80" rx="6.893509" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="432.523364" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--primary-accent)">Lambda</text>

  <rect x="600.747664" y="305.000055" width="314.018692" height="80" rx="6.893509" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="757.757009" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--info-accent)">Functions</text>

  <rect x="925.981308" y="305.000055" width="314.018692" height="80" rx="6.893509" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1082.990654" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--ok-accent)">Cloud Functions</text>

  <!-- Row 4: Containers -->
  <rect x="40" y="400" width="224.299065" height="80" rx="6.893509" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.149533" y="446.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.06216" font-weight="bold" fill="var(--text)">Containers</text>

  <rect x="275.514019" y="400" width="314.018692" height="80" rx="6.893509" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="432.523364" y="446.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--primary-accent)">EKS</text>

  <rect x="600.747664" y="400" width="314.018692" height="80" rx="6.893509" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="757.757009" y="446.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--info-accent)">AKS</text>

  <rect x="925.981308" y="400" width="314.018692" height="80" rx="6.893509" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1082.990654" y="446.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--ok-accent)">GKE</text>

  <!-- Row 5: NoSQL -->
  <rect x="40" y="494.999945" width="224.299065" height="80" rx="6.893509" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.149533" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.06216" font-weight="bold" fill="var(--text)">NoSQL DB</text>

  <rect x="275.514019" y="494.999945" width="314.018692" height="80" rx="6.893509" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="432.523364" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--primary-accent)">DynamoDB</text>

  <rect x="600.747664" y="494.999945" width="314.018692" height="80" rx="6.893509" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="757.757009" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--info-accent)">Cosmos DB</text>

  <rect x="925.981308" y="494.999945" width="314.018692" height="80" rx="6.893509" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1082.990654" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--ok-accent)">Firestore</text>

  <!-- Note -->
  <text x="690.46729" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.826099" fill="var(--text-faint)">Same concepts, different names -- multi-cloud fluency is key</text>
</svg>
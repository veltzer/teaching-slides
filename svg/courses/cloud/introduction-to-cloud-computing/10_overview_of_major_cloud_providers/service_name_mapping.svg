<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Table structure -->
  <!-- Column widths: Category=200, AWS=280, Azure=280, GCP=280 -->
  <!-- Starting x=60 -->

  <!-- Header Row -->
  <rect x="40" y="40" width="224.299065" height="60" rx="6.893509" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.149533" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--text)">Service</text>

  <rect x="275.514019" y="40" width="314.018692" height="60" rx="6.893509" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="432.523364" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.298107" font-weight="bold" fill="var(--bg)">AWS</text>

  <rect x="600.747664" y="40" width="314.018692" height="60" rx="6.893509" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="757.757009" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.298107" font-weight="bold" fill="var(--bg)">Azure</text>

  <rect x="925.981308" y="40" width="314.018692" height="60" rx="6.893509" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.990654" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.298107" font-weight="bold" fill="var(--bg)">GCP</text>

  <!-- Row 1: Compute -->
  <rect x="40" y="114.999945" width="224.299065" height="80" rx="6.893509" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.149533" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.06216" font-weight="bold" fill="var(--text)">Compute</text>

  <rect x="275.514019" y="114.999945" width="314.018692" height="80" rx="6.893509" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="432.523364" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--primary-accent)">EC2</text>

  <rect x="600.747664" y="114.999945" width="314.018692" height="80" rx="6.893509" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="757.757009" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--info-accent)">Virtual Machines</text>

  <rect x="925.981308" y="114.999945" width="314.018692" height="80" rx="6.893509" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.990654" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--ok-accent)">Compute Engine</text>

  <!-- Row 2: Object Storage -->
  <rect x="40" y="210" width="224.299065" height="80" rx="6.893509" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.149533" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.06216" font-weight="bold" fill="var(--text)">Object</text>
  <text x="152.149533" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.06216" font-weight="bold" fill="var(--text)">Storage</text>

  <rect x="275.514019" y="210" width="314.018692" height="80" rx="6.893509" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="432.523364" y="257.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--primary-accent)">S3</text>

  <rect x="600.747664" y="210" width="314.018692" height="80" rx="6.893509" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="757.757009" y="257.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--info-accent)">Blob Storage</text>

  <rect x="925.981308" y="210" width="314.018692" height="80" rx="6.893509" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.990654" y="257.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--ok-accent)">Cloud Storage</text>

  <!-- Row 3: Serverless -->
  <rect x="40" y="305.000055" width="224.299065" height="80" rx="6.893509" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.149533" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.06216" font-weight="bold" fill="var(--text)">Serverless</text>

  <rect x="275.514019" y="305.000055" width="314.018692" height="80" rx="6.893509" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="432.523364" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--primary-accent)">Lambda</text>

  <rect x="600.747664" y="305.000055" width="314.018692" height="80" rx="6.893509" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="757.757009" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--info-accent)">Functions</text>

  <rect x="925.981308" y="305.000055" width="314.018692" height="80" rx="6.893509" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.990654" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--ok-accent)">Cloud Functions</text>

  <!-- Row 4: Containers -->
  <rect x="40" y="400" width="224.299065" height="80" rx="6.893509" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.149533" y="446.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.06216" font-weight="bold" fill="var(--text)">Containers</text>

  <rect x="275.514019" y="400" width="314.018692" height="80" rx="6.893509" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="432.523364" y="446.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--primary-accent)">EKS</text>

  <rect x="600.747664" y="400" width="314.018692" height="80" rx="6.893509" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="757.757009" y="446.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--info-accent)">AKS</text>

  <rect x="925.981308" y="400" width="314.018692" height="80" rx="6.893509" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.990654" y="446.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--ok-accent)">GKE</text>

  <!-- Row 5: NoSQL -->
  <rect x="40" y="494.999945" width="224.299065" height="80" rx="6.893509" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.149533" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.06216" font-weight="bold" fill="var(--text)">NoSQL DB</text>

  <rect x="275.514019" y="494.999945" width="314.018692" height="80" rx="6.893509" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="432.523364" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--primary-accent)">DynamoDB</text>

  <rect x="600.747664" y="494.999945" width="314.018692" height="80" rx="6.893509" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="757.757009" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--info-accent)">Cosmos DB</text>

  <rect x="925.981308" y="494.999945" width="314.018692" height="80" rx="6.893509" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.990654" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.180191" font-weight="bold" fill="var(--ok-accent)">Firestore</text>

  <!-- Note -->
  <text x="690.46729" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.826099" fill="var(--text-faint)">Same concepts, different names -- multi-cloud fluency is key</text>
</svg>

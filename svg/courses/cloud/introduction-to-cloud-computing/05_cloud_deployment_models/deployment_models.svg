<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Dividers -->
  <line x1="640" y1="40" x2="640" y2="620" stroke="var(--border)" stroke-width="1.5"/>
  <line x1="40" y1="330" x2="1240" y2="330" stroke="var(--border)" stroke-width="1.5"/>

  <!-- Quadrant 1: Public Cloud (top-left) -->
  <rect x="50" y="44.83328" rx="6.4" width="580" height="275.499947" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="78.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.663893" font-weight="bold" fill="var(--primary-accent)">Public Cloud</text>
  <line x1="120" y1="90.266667" x2="560" y2="90.266667" stroke="var(--primary-border)" stroke-width="1.5"/>
  <rect x="94.1008" y="119.167" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="118" y="129.899947" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Shared infrastructure, multi-tenant</text>
  <rect x="94.1008" y="157.834" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="118" y="168.566613" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Pay-per-use pricing model</text>
  <rect x="94.1008" y="196.501" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="118" y="207.23328" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Virtually unlimited scalability</text>
  <rect x="94.1008" y="235.167" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="118" y="245.899947" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">No hardware management needed</text>
  <text x="340" y="289.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--text-faint)">Examples: AWS, Azure, GCP</text>

  <!-- Quadrant 2: Private Cloud (top-right) -->
  <rect x="650" y="44.83328" rx="6.4" width="580" height="275.499947" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="78.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.663893" font-weight="bold" fill="var(--danger-accent)">Private Cloud</text>
  <line x1="720" y1="90.266667" x2="1160" y2="90.266667" stroke="var(--danger-border)" stroke-width="1.5"/>
  <rect x="694.101" y="119.167" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="718" y="129.899947" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Dedicated single-tenant infrastructure</text>
  <rect x="694.101" y="157.834" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="718" y="168.566613" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Full control over security and compliance</text>
  <rect x="694.101" y="196.501" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="718" y="207.23328" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">On-premises or hosted privately</text>
  <rect x="694.101" y="235.167" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="718" y="245.899947" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Higher cost, predictable performance</text>
  <text x="940" y="289.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--text-faint)">Examples: OpenStack, VMware vSphere</text>

  <!-- Quadrant 3: Hybrid Cloud (bottom-left) -->
  <rect x="50" y="339.666667" rx="6.4" width="580" height="275.499947" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="373.499947" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.663893" font-weight="bold" fill="var(--warn-accent)">Hybrid Cloud</text>
  <line x1="120" y1="385.099947" x2="560" y2="385.099947" stroke="var(--warn-border)" stroke-width="1.5"/>
  <rect x="94.1008" y="414.001" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="118" y="424.733333" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Mix of public and private cloud</text>
  <rect x="94.1008" y="452.667" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="118" y="463.4" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Workload portability between environments</text>
  <rect x="94.1008" y="491.334" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="118" y="502.066667" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Sensitive data stays on-premises</text>
  <rect x="94.1008" y="530.001" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="118" y="540.733333" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Burst to cloud for peak demand</text>
  <text x="340" y="584.233387" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--text-faint)">Examples: Azure Arc, AWS Outposts</text>

  <!-- Quadrant 4: Multi-Cloud (bottom-right) -->
  <rect x="650" y="339.666667" rx="6.4" width="580" height="275.499947" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="373.499947" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.663893" font-weight="bold" fill="var(--info-accent)">Multi-Cloud</text>
  <line x1="720" y1="385.099947" x2="1160" y2="385.099947" stroke="var(--info-border)" stroke-width="1.5"/>
  <rect x="694.101" y="414.001" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="718" y="424.733333" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Multiple public cloud providers</text>
  <rect x="694.101" y="452.667" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="718" y="463.4" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Avoid vendor lock-in</text>
  <rect x="694.101" y="491.334" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="718" y="502.066667" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Best-of-breed service selection</text>
  <rect x="694.101" y="530.001" width="11.7984" height="11.7984" rx="5.8992" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="718" y="540.733333" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Geographic and compliance flexibility</text>
  <text x="940" y="584.233387" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--text-faint)">Examples: AWS + Azure + GCP</text>
</svg>

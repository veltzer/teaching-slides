<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- On-Premises Data Center (left) -->
  <rect x="77.5" y="76.25" rx="6" width="450" height="507.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="77.5" y="76.25" rx="6" width="450" height="45.3125" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="302.5" y="105.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)">On-Premises Data Center</text>

  <!-- On-prem: Legacy Apps -->
  <rect x="115" y="144.2188" rx="6" width="168.75" height="63.4375" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="199.375" y="174.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--danger-accent)">Legacy</text>
  <text x="199.375" y="192.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--danger-accent)">Applications</text>

  <!-- On-prem: Sensitive Data -->
  <rect x="321.25" y="144.2188" rx="6" width="168.75" height="63.4375" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="405.625" y="174.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Sensitive Data</text>
  <text x="405.625" y="192.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Storage</text>

  <!-- On-prem: Database -->
  <rect x="115" y="230.3125" rx="6" width="168.75" height="63.4375" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="199.375" y="260.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--info-accent)">Primary</text>
  <text x="199.375" y="278.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--info-accent)">Database</text>

  <!-- On-prem: Internal Services -->
  <rect x="321.25" y="230.3125" rx="6" width="168.75" height="63.4375" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="405.625" y="260.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Internal</text>
  <text x="405.625" y="278.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Services</text>

  <!-- On-prem: Network/Firewall -->
  <rect x="115" y="320.9375" rx="6" width="375" height="45.3125" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="302.5" y="349.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text-muted)">Firewall / Network Security</text>

  <!-- Labels -->
  <text x="302.5" y="411.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Compliance-sensitive workloads</text>
  <text x="302.5" y="429.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Low-latency requirements</text>
  <text x="302.5" y="447.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Legacy system dependencies</text>

  <!-- Public Cloud (right) -->
  <rect x="752.5" y="76.25" rx="6" width="450" height="507.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="752.5" y="76.25" rx="6" width="450" height="45.3125" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="977.5" y="105.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Public Cloud</text>

  <!-- Cloud: Web Frontend -->
  <rect x="790" y="144.2188" rx="6" width="168.75" height="63.4375" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="874.375" y="174.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Web Frontend</text>
  <text x="874.375" y="192.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">(Auto-scaled)</text>

  <!-- Cloud: API Services -->
  <rect x="996.25" y="144.2188" rx="6" width="168.75" height="63.4375" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080.625" y="174.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">API</text>
  <text x="1080.625" y="192.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Services</text>

  <!-- Cloud: Analytics -->
  <rect x="790" y="230.3125" rx="6" width="168.75" height="63.4375" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="874.375" y="260.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Big Data</text>
  <text x="874.375" y="278.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Analytics</text>

  <!-- Cloud: DR/Backup -->
  <rect x="996.25" y="230.3125" rx="6" width="168.75" height="63.4375" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080.625" y="260.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--info-accent)">Disaster</text>
  <text x="1080.625" y="278.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--info-accent)">Recovery</text>

  <!-- Cloud: CDN -->
  <rect x="790" y="320.9375" rx="6" width="375" height="45.3125" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="977.5" y="349.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">CDN / Global Edge Network</text>

  <!-- Labels -->
  <text x="977.5" y="411.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Elastic, burst workloads</text>
  <text x="977.5" y="429.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Global distribution</text>
  <text x="977.5" y="447.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Managed services</text>

  <!-- Connection: VPN / Direct Connect -->
  <rect x="546.25" y="194.0625" rx="6" width="187.5" height="72.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">VPN / Direct</text>
  <text x="640" y="239.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Connect</text>
  <text x="640" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Encrypted tunnel</text>

  <!-- Arrows: On-prem to VPN -->
  <line x1="527.5" y1="230.3125" x2="546.25" y2="230.3125" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Arrows: VPN to Cloud -->
  <line x1="733.75" y1="230.3125" x2="752.5" y2="230.3125" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Data sync arrows -->
  <line x1="527.5" y1="266.5625" x2="546.25" y2="266.5625" stroke="var(--info-border)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="733.75" y1="266.5625" x2="752.5" y2="266.5625" stroke="var(--info-border)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom label -->
  <text x="640" y="529.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Unified Management Plane</text>
  <rect x="415" y="538.4375" rx="6" width="450" height="36.25" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Monitoring | Identity | Policy | Orchestration</text>
</svg>
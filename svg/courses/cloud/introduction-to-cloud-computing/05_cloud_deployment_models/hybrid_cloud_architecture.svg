<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- On-Premises Data Center (left) -->
  <rect x="40" y="40" rx="6" width="480" height="560" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="40" y="40" rx="6" width="480" height="50" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="280" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">On-Premises Data Center</text>

  <!-- On-prem: Legacy Apps -->
  <rect x="80" y="115" rx="6" width="180" height="70" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)">Legacy</text>
  <text x="170" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)">Applications</text>

  <!-- On-prem: Sensitive Data -->
  <rect x="300" y="115" rx="6" width="180" height="70" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">Sensitive Data</text>
  <text x="390" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">Storage</text>

  <!-- On-prem: Database -->
  <rect x="80" y="210" rx="6" width="180" height="70" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-accent)">Primary</text>
  <text x="170" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-accent)">Database</text>

  <!-- On-prem: Internal Services -->
  <rect x="300" y="210" rx="6" width="180" height="70" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Internal</text>
  <text x="390" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Services</text>

  <!-- On-prem: Network/Firewall -->
  <rect x="80" y="310" rx="6" width="400" height="50" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="280" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)">Firewall / Network Security</text>

  <!-- Labels -->
  <text x="280" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Compliance-sensitive workloads</text>
  <text x="280" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Low-latency requirements</text>
  <text x="280" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Legacy system dependencies</text>

  <!-- Public Cloud (right) -->
  <rect x="760" y="40" rx="6" width="480" height="560" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="760" y="40" rx="6" width="480" height="50" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1000" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">Public Cloud</text>

  <!-- Cloud: Web Frontend -->
  <rect x="800" y="115" rx="6" width="180" height="70" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Web Frontend</text>
  <text x="890" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">(Auto-scaled)</text>

  <!-- Cloud: API Services -->
  <rect x="1020" y="115" rx="6" width="180" height="70" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">API</text>
  <text x="1110" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Services</text>

  <!-- Cloud: Analytics -->
  <rect x="800" y="210" rx="6" width="180" height="70" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">Big Data</text>
  <text x="890" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">Analytics</text>

  <!-- Cloud: DR/Backup -->
  <rect x="1020" y="210" rx="6" width="180" height="70" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-accent)">Disaster</text>
  <text x="1110" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-accent)">Recovery</text>

  <!-- Cloud: CDN -->
  <rect x="800" y="310" rx="6" width="400" height="50" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1000" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">CDN / Global Edge Network</text>

  <!-- Labels -->
  <text x="1000" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Elastic, burst workloads</text>
  <text x="1000" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Global distribution</text>
  <text x="1000" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Managed services</text>

  <!-- Connection: VPN / Direct Connect -->
  <rect x="540" y="170" rx="6" width="200" height="80" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">VPN / Direct</text>
  <text x="640" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">Connect</text>
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Encrypted tunnel</text>

  <!-- Arrows: On-prem to VPN -->
  <line x1="520" y1="210" x2="540" y2="210" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Arrows: VPN to Cloud -->
  <line x1="740" y1="210" x2="760" y2="210" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Data sync arrows -->
  <line x1="520" y1="250" x2="540" y2="250" stroke="var(--info-border)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="250" x2="760" y2="250" stroke="var(--info-border)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom label -->
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Unified Management Plane</text>
  <rect x="400" y="550" rx="6" width="480" height="40" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Monitoring | Identity | Policy | Orchestration</text>
</svg>
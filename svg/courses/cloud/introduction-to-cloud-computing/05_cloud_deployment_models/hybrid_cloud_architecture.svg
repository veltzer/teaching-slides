<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- On-Premises Data Center (left) -->
  <rect x="40" y="40" rx="6.624629" width="480" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="40" rx="6.624629" width="480" height="51.785714" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="280" y="73.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318646" font-weight="bold" fill="var(--text)">On-Premises Data Center</text>

  <!-- On-prem: Legacy Apps -->
  <rect x="80" y="117.678629" rx="6.624629" width="180" height="72.5" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="151.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--danger-accent)">Legacy</text>
  <text x="170" y="172.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--danger-accent)">Applications</text>

  <!-- On-prem: Sensitive Data -->
  <rect x="300" y="117.678629" rx="6.624629" width="180" height="72.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="151.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--warn-accent)">Sensitive Data</text>
  <text x="390" y="172.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--warn-accent)">Storage</text>

  <!-- On-prem: Database -->
  <rect x="80" y="216.071429" rx="6.624629" width="180" height="72.5" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="250.250057" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--info-accent)">Primary</text>
  <text x="170" y="270.964343" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--info-accent)">Database</text>

  <!-- On-prem: Internal Services -->
  <rect x="300" y="216.071429" rx="6.624629" width="180" height="72.5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="250.250057" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--ok-accent)">Internal</text>
  <text x="390" y="270.964343" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--ok-accent)">Services</text>

  <!-- On-prem: Network/Firewall -->
  <rect x="80" y="319.642857" rx="6.624629" width="400" height="51.785714" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="280" y="351.749943" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247811" font-weight="bold" fill="var(--text-muted)">Firewall / Network Security</text>

  <!-- Labels -->
  <text x="280" y="423.214286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212394" fill="var(--text-faint)">Compliance-sensitive workloads</text>
  <text x="280" y="443.928571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212394" fill="var(--text-faint)">Low-latency requirements</text>
  <text x="280" y="464.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212394" fill="var(--text-faint)">Legacy system dependencies</text>

  <!-- Public Cloud (right) -->
  <rect x="760" y="40" rx="6.624629" width="480" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="760" y="40" rx="6.624629" width="480" height="51.785714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="73.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318646" font-weight="bold" fill="var(--primary-accent)">Public Cloud</text>

  <!-- Cloud: Web Frontend -->
  <rect x="800" y="117.678629" rx="6.624629" width="180" height="72.5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="151.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--ok-accent)">Web Frontend</text>
  <text x="890" y="172.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--ok-accent)">(Auto-scaled)</text>

  <!-- Cloud: API Services -->
  <rect x="1020" y="117.678629" rx="6.624629" width="180" height="72.5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="151.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--ok-accent)">API</text>
  <text x="1110" y="172.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--ok-accent)">Services</text>

  <!-- Cloud: Analytics -->
  <rect x="800" y="216.071429" rx="6.624629" width="180" height="72.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="250.250057" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--warn-accent)">Big Data</text>
  <text x="890" y="270.964343" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--warn-accent)">Analytics</text>

  <!-- Cloud: DR/Backup -->
  <rect x="1020" y="216.071429" rx="6.624629" width="180" height="72.5" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="250.250057" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--info-accent)">Disaster</text>
  <text x="1110" y="270.964343" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--info-accent)">Recovery</text>

  <!-- Cloud: CDN -->
  <rect x="800" y="319.642857" rx="6.624629" width="400" height="51.785714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="351.749943" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247811" font-weight="bold" fill="var(--primary-accent)">CDN / Global Edge Network</text>

  <!-- Labels -->
  <text x="1000" y="423.214286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212394" fill="var(--text-faint)">Elastic, burst workloads</text>
  <text x="1000" y="443.928571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212394" fill="var(--text-faint)">Global distribution</text>
  <text x="1000" y="464.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212394" fill="var(--text-faint)">Managed services</text>

  <!-- Connection: VPN / Direct Connect -->
  <rect x="540" y="174.642857" rx="6.624629" width="200" height="82.857143" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="205.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--warn-accent)">VPN / Direct</text>
  <text x="640" y="226.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" font-weight="bold" fill="var(--warn-accent)">Connect</text>
  <text x="640" y="247.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-faint)">Encrypted tunnel</text>

  <!-- Arrows: On-prem to VPN -->
  <line x1="520" y1="216.071429" x2="540" y2="216.071429" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Arrows: VPN to Cloud -->
  <line x1="740" y1="216.071429" x2="760" y2="216.071429" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Data sync arrows -->
  <line x1="520" y1="257.5" x2="540" y2="257.5" stroke="var(--info-border)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="257.5" x2="760" y2="257.5" stroke="var(--info-border)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom label -->
  <text x="640" y="557.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247811" font-weight="bold" fill="var(--text)">Unified Management Plane</text>
  <rect x="400" y="568.214286" rx="6.624629" width="480" height="41.428571" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="595.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230158" fill="var(--text-muted)">Monitoring | Identity | Policy | Orchestration</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- On-Premises Data Center (left) -->
  <rect x="40" y="40" rx="12" ry="12" width="480" height="560" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" rx="12" ry="12" width="480" height="50" fill="var(--surface-alt)" stroke="var(--border-strong)" stroke-width="2"/>
  <text x="280" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)">On-Premises Data Center</text>

  <!-- On-prem: Legacy Apps -->
  <rect x="80" y="115" rx="6" ry="6" width="180" height="70" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-dk)">Legacy</text>
  <text x="170" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-dk)">Applications</text>

  <!-- On-prem: Sensitive Data -->
  <rect x="300" y="115" rx="6" ry="6" width="180" height="70" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">Sensitive Data</text>
  <text x="390" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">Storage</text>

  <!-- On-prem: Database -->
  <rect x="80" y="210" rx="6" ry="6" width="180" height="70" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-dk)">Primary</text>
  <text x="170" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-dk)">Database</text>

  <!-- On-prem: Internal Services -->
  <rect x="300" y="210" rx="6" ry="6" width="180" height="70" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Internal</text>
  <text x="390" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Services</text>

  <!-- On-prem: Network/Firewall -->
  <rect x="80" y="310" rx="6" ry="6" width="400" height="50" fill="var(--surface-alt)" stroke="var(--border-strong)" stroke-width="1.5"/>
  <text x="280" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)">Firewall / Network Security</text>

  <!-- Labels -->
  <text x="280" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Compliance-sensitive workloads</text>
  <text x="280" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Low-latency requirements</text>
  <text x="280" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Legacy system dependencies</text>

  <!-- Public Cloud (right) -->
  <rect x="760" y="40" rx="12" ry="12" width="480" height="560" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="760" y="40" rx="12" ry="12" width="480" height="50" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="2"/>
  <text x="1000" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Public Cloud</text>

  <!-- Cloud: Web Frontend -->
  <rect x="800" y="115" rx="6" ry="6" width="180" height="70" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="890" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Web Frontend</text>
  <text x="890" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">(Auto-scaled)</text>

  <!-- Cloud: API Services -->
  <rect x="1020" y="115" rx="6" ry="6" width="180" height="70" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1110" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">API</text>
  <text x="1110" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Services</text>

  <!-- Cloud: Analytics -->
  <rect x="800" y="210" rx="6" ry="6" width="180" height="70" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="890" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">Big Data</text>
  <text x="890" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">Analytics</text>

  <!-- Cloud: DR/Backup -->
  <rect x="1020" y="210" rx="6" ry="6" width="180" height="70" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1110" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-dk)">Disaster</text>
  <text x="1110" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-dk)">Recovery</text>

  <!-- Cloud: CDN -->
  <rect x="800" y="310" rx="6" ry="6" width="400" height="50" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="1000" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">CDN / Global Edge Network</text>

  <!-- Labels -->
  <text x="1000" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Elastic, burst workloads</text>
  <text x="1000" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Global distribution</text>
  <text x="1000" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Managed services</text>

  <!-- Connection: VPN / Direct Connect -->
  <rect x="540" y="170" rx="8" ry="8" width="200" height="80" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">VPN / Direct</text>
  <text x="640" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">Connect</text>
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Encrypted tunnel</text>

  <!-- Arrows: On-prem to VPN -->
  <line x1="520" y1="210" x2="540" y2="210" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Arrows: VPN to Cloud -->
  <line x1="740" y1="210" x2="760" y2="210" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Data sync arrows -->
  <line x1="520" y1="250" x2="540" y2="250" stroke="var(--info)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="250" x2="760" y2="250" stroke="var(--info)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom label -->
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Unified Management Plane</text>
  <rect x="400" y="550" rx="6" ry="6" width="480" height="40" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="640" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Monitoring | Identity | Policy | Orchestration</text>
</svg>
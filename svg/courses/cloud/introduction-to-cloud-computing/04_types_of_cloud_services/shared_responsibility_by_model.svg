<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Grid dimensions -->
  <!-- Row labels: x=40..230, Column headers: x starts at 240 -->
  <!-- Each column: 240px wide, 4 columns = 960, start at 240 -->

  <!-- Column headers -->
  <rect x="240" y="20" rx="6" ry="6" width="230" height="45" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="355" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">IaaS</text>

  <rect x="490" y="20" rx="6" ry="6" width="230" height="45" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="605" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">PaaS</text>

  <rect x="740" y="20" rx="6" ry="6" width="230" height="45" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="855" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">SaaS</text>

  <rect x="990" y="20" rx="6" ry="6" width="230" height="45" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="1105" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">FaaS</text>

  <!-- Row labels and grid cells -->
  <!-- Row height: 70px, 7 rows starting at y=80 -->

  <!-- Row 1: Data -->
  <rect x="40" y="80" rx="4" ry="4" width="180" height="60" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Data</text>

  <rect x="240" y="80" rx="4" ry="4" width="230" height="60" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="355" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Customer</text>
  <rect x="490" y="80" rx="4" ry="4" width="230" height="60" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="605" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Customer</text>
  <rect x="740" y="80" rx="4" ry="4" width="230" height="60" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="855" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Customer</text>
  <rect x="990" y="80" rx="4" ry="4" width="230" height="60" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="1105" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Customer</text>

  <!-- Row 2: Application -->
  <rect x="40" y="150" rx="4" ry="4" width="180" height="60" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Application</text>

  <rect x="240" y="150" rx="4" ry="4" width="230" height="60" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="355" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Customer</text>
  <rect x="490" y="150" rx="4" ry="4" width="230" height="60" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="605" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Customer</text>
  <rect x="740" y="150" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="855" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="990" y="150" rx="4" ry="4" width="230" height="60" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="1105" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Customer</text>

  <!-- Row 3: Runtime -->
  <rect x="40" y="220" rx="4" ry="4" width="180" height="60" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Runtime</text>

  <rect x="240" y="220" rx="4" ry="4" width="230" height="60" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="355" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Customer</text>
  <rect x="490" y="220" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="605" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="740" y="220" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="855" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="990" y="220" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="1105" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>

  <!-- Row 4: OS -->
  <rect x="40" y="290" rx="4" ry="4" width="180" height="60" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">OS</text>

  <rect x="240" y="290" rx="4" ry="4" width="230" height="60" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="355" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Customer</text>
  <rect x="490" y="290" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="605" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="740" y="290" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="855" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="990" y="290" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="1105" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>

  <!-- Row 5: Virtualization -->
  <rect x="40" y="360" rx="4" ry="4" width="180" height="60" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Virtualization</text>

  <rect x="240" y="360" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="355" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="490" y="360" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="605" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="740" y="360" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="855" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="990" y="360" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="1105" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>

  <!-- Row 6: Network -->
  <rect x="40" y="430" rx="4" ry="4" width="180" height="60" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Network</text>

  <rect x="240" y="430" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="355" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="490" y="430" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="605" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="740" y="430" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="855" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="990" y="430" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="1105" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>

  <!-- Row 7: Hardware -->
  <rect x="40" y="500" rx="4" ry="4" width="180" height="60" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Hardware</text>

  <rect x="240" y="500" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="355" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="490" y="500" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="605" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="740" y="500" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="855" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>
  <rect x="990" y="500" rx="4" ry="4" width="230" height="60" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="1105" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Provider</text>

  <!-- Legend -->
  <rect x="380" y="585" rx="4" ry="4" width="20" height="20" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="410" y="601" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Customer Responsibility</text>
  <rect x="620" y="585" rx="4" ry="4" width="20" height="20" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="650" y="601" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Provider Responsibility</text>
</svg>
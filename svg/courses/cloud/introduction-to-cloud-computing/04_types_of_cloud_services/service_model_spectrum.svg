<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Column headers -->
  <rect x="80" y="20" rx="8" ry="8" width="260" height="45" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="210" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">On-Premises</text>

  <rect x="370" y="20" rx="8" ry="8" width="260" height="45" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="500" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">IaaS</text>

  <rect x="660" y="20" rx="8" ry="8" width="260" height="45" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="790" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">PaaS</text>

  <rect x="950" y="20" rx="8" ry="8" width="260" height="45" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="1080" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">SaaS</text>

  <!-- Layer definitions: y positions for 7 layers -->
  <!-- Layer 1: Application (top) y=80 -->
  <!-- Layer 2: Data y=150 -->
  <!-- Layer 3: Runtime y=220 -->
  <!-- Layer 4: Middleware y=290 -->
  <!-- Layer 5: OS y=360 -->
  <!-- Layer 6: Virtualization y=430 -->
  <!-- Layer 7: Hardware y=500 -->

  <!-- Row labels on left side -->
  <text x="40" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 112)">App</text>
  <text x="40" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 182)">Data</text>
  <text x="40" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 252)">Runtime</text>
  <text x="40" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 322)">Middleware</text>
  <text x="40" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 392)">OS</text>
  <text x="40" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 462)">Virt.</text>
  <text x="40" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 532)">H/W</text>

  <!-- On-Premises: ALL customer managed (warn) -->
  <rect x="80" y="85" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="210" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Application</text>
  <rect x="80" y="155" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="210" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Data</text>
  <rect x="80" y="225" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="210" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Runtime</text>
  <rect x="80" y="295" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="210" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Middleware</text>
  <rect x="80" y="365" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="210" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">OS</text>
  <rect x="80" y="435" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="210" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Virtualization</text>
  <rect x="80" y="505" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="210" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Hardware</text>

  <!-- IaaS: Top 4 customer, bottom 3 provider -->
  <rect x="370" y="85" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="500" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Application</text>
  <rect x="370" y="155" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="500" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Data</text>
  <rect x="370" y="225" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="500" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Runtime</text>
  <rect x="370" y="295" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="500" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Middleware</text>
  <rect x="370" y="365" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="500" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">OS</text>
  <rect x="370" y="435" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="500" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Virtualization</text>
  <rect x="370" y="505" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="500" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Hardware</text>

  <!-- PaaS: Top 2 customer, bottom 5 provider -->
  <rect x="660" y="85" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="790" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Application</text>
  <rect x="660" y="155" rx="4" ry="4" width="260" height="55" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="790" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Data</text>
  <rect x="660" y="225" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="790" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Runtime</text>
  <rect x="660" y="295" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="790" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Middleware</text>
  <rect x="660" y="365" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="790" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">OS</text>
  <rect x="660" y="435" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="790" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Virtualization</text>
  <rect x="660" y="505" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="790" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Hardware</text>

  <!-- SaaS: ALL provider managed -->
  <rect x="950" y="85" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="1080" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Application</text>
  <rect x="950" y="155" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="1080" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Data</text>
  <rect x="950" y="225" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="1080" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Runtime</text>
  <rect x="950" y="295" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="1080" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Middleware</text>
  <rect x="950" y="365" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="1080" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">OS</text>
  <rect x="950" y="435" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="1080" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Virtualization</text>
  <rect x="950" y="505" rx="4" ry="4" width="260" height="55" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="1080" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Hardware</text>

  <!-- Legend -->
  <rect x="380" y="585" rx="4" ry="4" width="20" height="20" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1"/>
  <text x="410" y="601" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Customer Managed</text>
  <rect x="580" y="585" rx="4" ry="4" width="20" height="20" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <text x="610" y="601" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Provider Managed</text>

  <!-- Arrow showing increasing provider management -->
  <line x1="130" y1="620" x2="1150" y2="620" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Increasing Provider Management</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Column headers -->
  <rect x="80" y="20" rx="6" width="260" height="45" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="210" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">On-Premises</text>

  <rect x="370" y="20" rx="6" width="260" height="45" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="500" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">IaaS</text>

  <rect x="660" y="20" rx="6" width="260" height="45" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="790" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">PaaS</text>

  <rect x="950" y="20" rx="6" width="260" height="45" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1080" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">SaaS</text>

  <!-- Layer definitions: y positions for 7 layers -->
  <!-- Layer 1: Application (top) y=80 -->
  <!-- Layer 2: Data y=150 -->
  <!-- Layer 3: Runtime y=220 -->
  <!-- Layer 4: Middleware y=290 -->
  <!-- Layer 5: OS y=360 -->
  <!-- Layer 6: Virtualization y=430 -->
  <!-- Layer 7: Hardware y=500 -->

  <!-- Row labels on left side -->
  <text x="40" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 112)">App</text>
  <text x="40" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 182)">Data</text>
  <text x="40" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 252)">Runtime</text>
  <text x="40" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 322)">Middleware</text>
  <text x="40" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 392)">OS</text>
  <text x="40" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 462)">Virt.</text>
  <text x="40" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" transform="rotate(-90, 40, 532)">H/W</text>

  <!-- On-Premises: ALL customer managed (warn) -->
  <rect x="80" y="85" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="210" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Application</text>
  <rect x="80" y="155" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="210" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Data</text>
  <rect x="80" y="225" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="210" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Runtime</text>
  <rect x="80" y="295" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="210" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Middleware</text>
  <rect x="80" y="365" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="210" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">OS</text>
  <rect x="80" y="435" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="210" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Virtualization</text>
  <rect x="80" y="505" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="210" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Hardware</text>

  <!-- IaaS: Top 4 customer, bottom 3 provider -->
  <rect x="370" y="85" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="500" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Application</text>
  <rect x="370" y="155" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="500" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Data</text>
  <rect x="370" y="225" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="500" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Runtime</text>
  <rect x="370" y="295" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="500" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Middleware</text>
  <rect x="370" y="365" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="500" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">OS</text>
  <rect x="370" y="435" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="500" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Virtualization</text>
  <rect x="370" y="505" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="500" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Hardware</text>

  <!-- PaaS: Top 2 customer, bottom 5 provider -->
  <rect x="660" y="85" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="790" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Application</text>
  <rect x="660" y="155" rx="6" width="260" height="55" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="790" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Data</text>
  <rect x="660" y="225" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="790" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Runtime</text>
  <rect x="660" y="295" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="790" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Middleware</text>
  <rect x="660" y="365" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="790" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">OS</text>
  <rect x="660" y="435" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="790" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Virtualization</text>
  <rect x="660" y="505" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="790" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Hardware</text>

  <!-- SaaS: ALL provider managed -->
  <rect x="950" y="85" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1080" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Application</text>
  <rect x="950" y="155" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1080" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Data</text>
  <rect x="950" y="225" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1080" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Runtime</text>
  <rect x="950" y="295" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1080" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Middleware</text>
  <rect x="950" y="365" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1080" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">OS</text>
  <rect x="950" y="435" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1080" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Virtualization</text>
  <rect x="950" y="505" rx="6" width="260" height="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1080" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Hardware</text>

  <!-- Legend -->
  <rect x="380" y="585" rx="6" width="20" height="20" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="410" y="601" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Customer Managed</text>
  <rect x="580" y="585" rx="6" width="20" height="20" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="610" y="601" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Provider Managed</text>

  <!-- Arrow showing increasing provider management -->
  <line x1="130" y1="620" x2="1150" y2="620" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Increasing Provider Management</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Legend -->
  <rect x="77.5" y="58.125" width="22.5" height="21.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="107.5" y="74.4375" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text)">Cloud Provider Manages</text>
  <rect x="283.75" y="58.125" width="22.5" height="21.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="313.75" y="74.4375" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text)">Customer Manages</text>

  <!-- Row labels on the left -->
  <text x="161.875" y="162.3438" text-anchor="end" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text-muted)">Data</text>
  <text x="161.875" y="234.8438" text-anchor="end" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text-muted)">Application</text>
  <text x="161.875" y="307.3438" text-anchor="end" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text-muted)">Runtime</text>
  <text x="161.875" y="379.8438" text-anchor="end" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text-muted)">OS</text>
  <text x="161.875" y="452.3438" text-anchor="end" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text-muted)">Network</text>
  <text x="161.875" y="524.8438" text-anchor="end" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text-muted)">Hardware</text>

  <!-- IaaS Column -->
  <g transform="translate(180, 60)">
    <text x="190" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.8088" font-weight="bold" fill="var(--text)">IaaS</text>
    <!-- Data - customer -->
    <rect x="49.375" y="80.7812" width="281.25" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="190" y="114.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--warn-accent)">Data</text>
    <!-- Application - customer -->
    <rect x="49.375" y="153.2812" width="281.25" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="190" y="186.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--warn-accent)">Application</text>
    <!-- Runtime - customer -->
    <rect x="49.375" y="225.7812" width="281.25" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="190" y="259.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--warn-accent)">Runtime</text>
    <!-- OS - customer -->
    <rect x="49.375" y="298.2812" width="281.25" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="190" y="331.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--warn-accent)">OS</text>
    <!-- Network - provider -->
    <rect x="49.375" y="370.7812" width="281.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="190" y="404.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Network</text>
    <!-- Hardware - provider -->
    <rect x="49.375" y="443.2812" width="281.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="190" y="476.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Hardware</text>
  </g>

  <!-- PaaS Column -->
  <g transform="translate(520, 60)">
    <text x="190" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.8088" font-weight="bold" fill="var(--text)">PaaS</text>
    <!-- Data - customer -->
    <rect x="49.375" y="80.7812" width="281.25" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="190" y="114.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--warn-accent)">Data</text>
    <!-- Application - customer -->
    <rect x="49.375" y="153.2812" width="281.25" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="190" y="186.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--warn-accent)">Application</text>
    <!-- Runtime - provider -->
    <rect x="49.375" y="225.7812" width="281.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="190" y="259.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Runtime</text>
    <!-- OS - provider -->
    <rect x="49.375" y="298.2812" width="281.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="190" y="331.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">OS</text>
    <!-- Network - provider -->
    <rect x="49.375" y="370.7812" width="281.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="190" y="404.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Network</text>
    <!-- Hardware - provider -->
    <rect x="49.375" y="443.2812" width="281.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="190" y="476.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Hardware</text>
  </g>

  <!-- SaaS Column -->
  <g transform="translate(860, 60)">
    <text x="190" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.8088" font-weight="bold" fill="var(--text)">SaaS</text>
    <!-- Data - customer -->
    <rect x="49.375" y="80.7812" width="281.25" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="190" y="114.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--warn-accent)">Data</text>
    <!-- Application - provider -->
    <rect x="49.375" y="153.2812" width="281.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="190" y="186.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Application</text>
    <!-- Runtime - provider -->
    <rect x="49.375" y="225.7812" width="281.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="190" y="259.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Runtime</text>
    <!-- OS - provider -->
    <rect x="49.375" y="298.2812" width="281.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="190" y="331.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">OS</text>
    <!-- Network - provider -->
    <rect x="49.375" y="370.7812" width="281.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="190" y="404.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Network</text>
    <!-- Hardware - provider -->
    <rect x="49.375" y="443.2812" width="281.25" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="190" y="476.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Hardware</text>
  </g>

  <!-- Arrow showing provider responsibility grows -->
  <line x1="368.125" y1="583.75" x2="1071.25" y2="583.75" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="719.6875" y="606.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)">Provider responsibility increases</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>

  <!-- Legend -->
  <rect x="40" y="20" width="24" height="24" rx="4" fill="var(--primary)"/>
  <text x="72" y="38" font-family="Arial, sans-serif" font-size="16" fill="var(--text-dark)">Cloud Provider Manages</text>
  <rect x="260" y="20" width="24" height="24" rx="4" fill="var(--warn)"/>
  <text x="292" y="38" font-family="Arial, sans-serif" font-size="16" fill="var(--text-dark)">Customer Manages</text>

  <!-- Row labels on the left -->
  <text x="130" y="135" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Data</text>
  <text x="130" y="215" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Application</text>
  <text x="130" y="295" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Runtime</text>
  <text x="130" y="375" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">OS</text>
  <text x="130" y="455" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Network</text>
  <text x="130" y="535" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Hardware</text>

  <!-- IaaS Column -->
  <g transform="translate(180, 60)">
    <text x="160" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text-dark)">IaaS</text>
    <!-- Data - customer -->
    <rect x="10" y="45" width="300" height="60" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
    <text x="160" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-dk)">Data</text>
    <!-- Application - customer -->
    <rect x="10" y="125" width="300" height="60" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
    <text x="160" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-dk)">Application</text>
    <!-- Runtime - customer -->
    <rect x="10" y="205" width="300" height="60" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
    <text x="160" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-dk)">Runtime</text>
    <!-- OS - customer -->
    <rect x="10" y="285" width="300" height="60" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
    <text x="160" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-dk)">OS</text>
    <!-- Network - provider -->
    <rect x="10" y="365" width="300" height="60" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
    <text x="160" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Network</text>
    <!-- Hardware - provider -->
    <rect x="10" y="445" width="300" height="60" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
    <text x="160" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Hardware</text>
  </g>

  <!-- PaaS Column -->
  <g transform="translate(520, 60)">
    <text x="160" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text-dark)">PaaS</text>
    <!-- Data - customer -->
    <rect x="10" y="45" width="300" height="60" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
    <text x="160" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-dk)">Data</text>
    <!-- Application - customer -->
    <rect x="10" y="125" width="300" height="60" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
    <text x="160" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-dk)">Application</text>
    <!-- Runtime - provider -->
    <rect x="10" y="205" width="300" height="60" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
    <text x="160" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Runtime</text>
    <!-- OS - provider -->
    <rect x="10" y="285" width="300" height="60" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
    <text x="160" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">OS</text>
    <!-- Network - provider -->
    <rect x="10" y="365" width="300" height="60" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
    <text x="160" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Network</text>
    <!-- Hardware - provider -->
    <rect x="10" y="445" width="300" height="60" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
    <text x="160" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Hardware</text>
  </g>

  <!-- SaaS Column -->
  <g transform="translate(860, 60)">
    <text x="160" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text-dark)">SaaS</text>
    <!-- Data - customer -->
    <rect x="10" y="45" width="300" height="60" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
    <text x="160" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-dk)">Data</text>
    <!-- Application - provider -->
    <rect x="10" y="125" width="300" height="60" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
    <text x="160" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Application</text>
    <!-- Runtime - provider -->
    <rect x="10" y="205" width="300" height="60" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
    <text x="160" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Runtime</text>
    <!-- OS - provider -->
    <rect x="10" y="285" width="300" height="60" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
    <text x="160" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">OS</text>
    <!-- Network - provider -->
    <rect x="10" y="365" width="300" height="60" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
    <text x="160" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Network</text>
    <!-- Hardware - provider -->
    <rect x="10" y="445" width="300" height="60" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
    <text x="160" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Hardware</text>
  </g>

  <!-- Arrow showing provider responsibility grows -->
  <line x1="350" y1="600" x2="1100" y2="600" stroke="var(--primary)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="725" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-dk)">Provider responsibility increases</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Customer label -->
  <text x="133.75" y="85.3125" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--warn-accent)">CUSTOMER Responsibility</text>

  <!-- Customer layers (top half) -->
  <g filter="url(#shadow)">
    <rect x="227.5" y="98.9062" width="825" height="49.8438" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="640" y="130.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--warn-accent)">Data Classification &amp; Encryption</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="227.5" y="157.8125" width="825" height="49.8438" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="640" y="189.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--warn-accent)">Identity &amp; Access Management (IAM)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="227.5" y="216.7188" width="825" height="49.8438" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="640" y="248.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--warn-accent)">Applications &amp; Middleware</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="227.5" y="275.625" width="825" height="49.8438" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="640" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--warn-accent)">Operating System &amp; Network Config</text>
  </g>

  <!-- Responsibility Boundary -->
  <line x1="171.25" y1="348.125" x2="1108.75" y2="348.125" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="16,8"/>
  <rect x="452.5" y="331.8125" width="375" height="32.625" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="354.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--danger-accent)">Responsibility Boundary</text>

  <!-- Provider layers (bottom half) -->
  <g filter="url(#shadow)">
    <rect x="227.5" y="379.8438" width="825" height="49.8438" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="640" y="411.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--primary-accent)">Managed Services &amp; APIs</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="227.5" y="438.75" width="825" height="49.8438" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="640" y="470.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--primary-accent)">Hypervisor &amp; Virtualization</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="227.5" y="497.6562" width="825" height="49.8438" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="640" y="529.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--primary-accent)">Network Infrastructure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="227.5" y="556.5625" width="825" height="49.8438" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="640" y="588.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--primary-accent)">Physical Security &amp; Hardware</text>
  </g>

  <!-- Provider label -->
  <text x="133.75" y="588.2812" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--primary-accent)">PROVIDER</text>
  <text x="133.75" y="606.4062" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--primary-accent)">Responsibility</text>
</svg>
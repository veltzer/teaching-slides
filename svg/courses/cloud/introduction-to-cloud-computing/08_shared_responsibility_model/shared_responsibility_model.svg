<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Customer label -->
  <text x="40" y="40" font-family="Arial, sans-serif" font-size="25.891954" font-weight="bold" fill="var(--warn-accent)">CUSTOMER Responsibility</text>

  <!-- Customer layers (top half) -->
  <g filter="url(#shadow)">
    <rect x="155.384615" y="55.130378" width="1015.384615" height="55.478311" rx="7.022562" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="90.434778" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--warn-accent)">Data Classification &amp; Encryption</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="155.384615" y="120.695644" width="1015.384615" height="55.478311" rx="7.022562" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="155.999933" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--warn-accent)">Identity &amp; Access Management (IAM)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="155.384615" y="186.260911" width="1015.384615" height="55.478311" rx="7.022562" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="221.5652" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--warn-accent)">Applications &amp; Middleware</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="155.384615" y="251.826067" width="1015.384615" height="55.478311" rx="7.022562" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="287.130467" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--warn-accent)">Operating System &amp; Network Config</text>
  </g>

  <!-- Responsibility Boundary -->
  <line x1="86.153846" y1="332.521711" x2="1240" y2="332.521711" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="16,8"/>
  <rect x="432.307692" y="314.365191" width="461.538462" height="36.31304" rx="7.022562" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="663.076923" y="339.582636" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.419024" font-weight="bold" fill="var(--danger-accent)">Responsibility Boundary</text>

  <!-- Provider layers (bottom half) -->
  <g filter="url(#shadow)">
    <rect x="155.384615" y="367.826111" width="1015.384615" height="55.478311" rx="7.022562" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="403.1304" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--primary-accent)">Managed Services &amp; APIs</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="155.384615" y="433.391267" width="1015.384615" height="55.478311" rx="7.022562" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="468.695667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--primary-accent)">Hypervisor &amp; Virtualization</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="155.384615" y="498.956422" width="1015.384615" height="55.478311" rx="7.022562" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="534.260822" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--primary-accent)">Network Infrastructure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="155.384615" y="564.521689" width="1015.384615" height="55.478311" rx="7.022562" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="599.825978" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--primary-accent)">Physical Security &amp; Hardware</text>
  </g>

  <!-- Provider label -->
  <text x="40" y="599.825978" font-family="Arial, sans-serif" font-size="25.891954" font-weight="bold" fill="var(--primary-accent)">PROVIDER</text>
  <text x="40" y="619.999889" font-family="Arial, sans-serif" font-size="19.419024" fill="var(--primary-accent)">Responsibility</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Customer label -->
  <text x="40" y="40" font-family="Arial, sans-serif" font-size="25.891954" font-weight="bold" fill="var(--warn-accent)">CUSTOMER Responsibility</text>

  <!-- Customer layers (top half) -->
  <g filter="url(#shadow)">
    <rect x="155.384615" y="55.130378" width="1015.384615" height="55.478311" rx="7.022562" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="90.434778" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--warn-accent)">Data Classification &amp; Encryption</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="155.384615" y="120.695644" width="1015.384615" height="55.478311" rx="7.022562" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="155.999933" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--warn-accent)">Identity &amp; Access Management (IAM)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="155.384615" y="186.260911" width="1015.384615" height="55.478311" rx="7.022562" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="221.5652" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--warn-accent)">Applications &amp; Middleware</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="155.384615" y="251.826067" width="1015.384615" height="55.478311" rx="7.022562" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="287.130467" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--warn-accent)">Operating System &amp; Network Config</text>
  </g>

  <!-- Responsibility Boundary -->
  <line x1="86.153846" y1="332.521711" x2="1240" y2="332.521711" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="16,8"/>
  <rect x="432.307692" y="314.365191" width="461.538462" height="36.31304" rx="7.022562" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="663.076923" y="339.582636" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.419024" font-weight="bold" fill="var(--danger-accent)">Responsibility Boundary</text>

  <!-- Provider layers (bottom half) -->
  <g filter="url(#shadow)">
    <rect x="155.384615" y="367.826111" width="1015.384615" height="55.478311" rx="7.022562" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="403.1304" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--primary-accent)">Managed Services &amp; APIs</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="155.384615" y="433.391267" width="1015.384615" height="55.478311" rx="7.022562" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="468.695667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--primary-accent)">Hypervisor &amp; Virtualization</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="155.384615" y="498.956422" width="1015.384615" height="55.478311" rx="7.022562" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="534.260822" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--primary-accent)">Network Infrastructure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="155.384615" y="564.521689" width="1015.384615" height="55.478311" rx="7.022562" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="663.076923" y="599.825978" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.734271" font-weight="bold" fill="var(--primary-accent)">Physical Security &amp; Hardware</text>
  </g>

  <!-- Provider label -->
  <text x="40" y="599.825978" font-family="Arial, sans-serif" font-size="25.891954" font-weight="bold" fill="var(--primary-accent)">PROVIDER</text>
  <text x="40" y="619.999889" font-family="Arial, sans-serif" font-size="19.419024" fill="var(--primary-accent)">Responsibility</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="953.1659" height="449.186" fill="var(--bg)" rx="6" x="40" y="40"/>
  <line x1="808.0968" y1="212.9254" x2="808.0968" y2="620" stroke="var(--border)" stroke-width="0.6351" stroke-dasharray="2.5401 1.9051"/>
  <text x="569.8053" y="226.9624" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6882" font-weight="bold" fill="var(--primary-accent)">Encryption at Rest</text>
  <rect x="420.8731" y="262.0549" width="297.8643" height="196.5188" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="458.1062" y="290.1291" width="223.3981" height="42.1109" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="569.8053" y="316.7997" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text-muted)">Encrypted Database</text>
  <rect x="458.1062" y="346.2774" width="223.3981" height="42.1109" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="569.8053" y="372.9477" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text-muted)">Encrypted Object Storage</text>
  <rect x="458.1062" y="402.4257" width="223.3981" height="42.1109" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="569.8053" y="429.096" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text-muted)">Encrypted Block Volume</text>
  <rect x="544.502" y="468.364" width="50.6058" height="50.6058" rx="14" fill="url(#grad-primary)" opacity="0.15" stroke="var(--primary-border)" stroke-width="0.6351" filter="url(#shadow)"/>
  <rect x="554.9121" y="490.1571" width="29.7866" height="19.6519" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 560.8692 490.1571 L 560.8692 483.1387 C 560.8692 474.7163 578.7412 474.7163 578.7412 483.1387 L 578.7412 490.1571" fill="none" stroke="var(--primary-border)" stroke-width="1.2701" stroke-linecap="round"/>
  <rect x="566.913" y="495.688" width="5.7836" height="5.7836" rx="2.8918" fill="var(--bg)"/>
  <text x="569.8053" y="535.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" font-weight="bold" fill="var(--primary-accent)">AES-256 Encryption</text>
  <text x="569.8053" y="556.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text-muted)">Data encrypted on disk</text>
  <text x="569.8053" y="574.3795" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text-muted)">Managed keys (KMS)</text>
  <text x="569.8053" y="591.9257" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text-muted)">Transparent to applications</text>
  <text x="1046.3883" y="226.9624" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6882" font-weight="bold" fill="var(--ok-accent)">Encryption in Transit</text>
  <rect x="852.7764" y="283.1106" width="104.2526" height="70.1854" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="904.9028" y="314.6939" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" font-weight="bold" fill="var(--ok-accent)">Client</text>
  <text x="904.9028" y="332.2403" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text-muted)">Browser/App</text>
  <rect x="1135.7474" y="283.1106" width="104.2526" height="70.1854" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1187.8739" y="314.6939" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" font-weight="bold" fill="var(--ok-accent)">Server</text>
  <text x="1187.8739" y="332.2403" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text-muted)">Cloud Service</text>
  <rect x="949.5823" y="293.6383" width="193.6119" height="49.1297" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="3.1751 1.5876"/>
  <line x1="968.1988" y1="311.1848" x2="1120.8543" y2="311.1848" stroke="var(--ok-border)" stroke-width="0.6351" marker-end="url(#arrow)"/>
  <line x1="1120.8543" y1="325.2217" x2="968.1988" y2="325.2217" stroke="var(--ok-border)" stroke-width="0.6351" marker-end="url(#arrow)"/>
  <rect x="1031.93" y="303.745" width="28.9174" height="28.9174" rx="14" fill="url(#grad-ok)" opacity="0.2" filter="url(#shadow)"/>
  <rect x="1038.197" y="315.3959" width="16.3826" height="11.2297" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 1041.1757 315.3959 L 1041.1757 311.1848 C 1041.1757 306.2717 1051.6009 306.2717 1051.6009 311.1848 L 1051.6009 315.3959" fill="none" stroke="var(--ok-border)" stroke-width="0.9526" stroke-linecap="round"/>
  <text x="1046.3883" y="374.3515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" font-weight="bold" fill="var(--ok-accent)">TLS/SSL Encrypted Tunnel</text>
  <rect x="860.2231" y="409.4442" width="372.3305" height="126.3334" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890.0095" y="441.0276" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text)">Plaintext</text>
  <line x1="939.157" y1="436.8164" x2="968.9434" y2="436.8164" stroke="var(--text-muted)" stroke-width="0.4763" marker-end="url(#arrow)"/>
  <rect x="971.9221" y="426.9903" width="59.5729" height="21.0555" rx="6" fill="url(#grad-ok)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1001.7087" y="441.0276" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--ok-accent)">Encrypt</text>
  <line x1="1034.4737" y1="436.8164" x2="1064.2603" y2="436.8164" stroke="var(--text-muted)" stroke-width="0.4763" marker-end="url(#arrow)"/>
  <text x="1068.7281" y="441.0276" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text)">Ciphertext</text>
  <line x1="1129.7904" y1="436.8164" x2="1159.5768" y2="436.8164" stroke="var(--text-muted)" stroke-width="0.4763" marker-end="url(#arrow)"/>
  <rect x="1162.5553" y="426.9903" width="59.5729" height="21.0555" rx="6" fill="url(#grad-ok)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1192.3417" y="441.0276" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--ok-accent)">Decrypt</text>
  <text x="1046.3883" y="479.6294" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text-muted)">TLS 1.3 / mTLS for service-to-service</text>
  <text x="1046.3883" y="497.1757" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text-muted)">HTTPS for web traffic</text>
  <text x="1046.3883" y="514.722" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" fill="var(--text-muted)">VPN for private connectivity</text>
  <text x="569.8053" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" font-weight="bold" fill="var(--primary-accent)">Protects stored data</text>
  <text x="1046.3883" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3452" font-weight="bold" fill="var(--ok-accent)">Protects data in motion</text>
</svg>

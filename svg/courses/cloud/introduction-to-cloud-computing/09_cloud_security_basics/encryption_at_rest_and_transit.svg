  <text x="761.1169" y="132.3681" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Cloud Service</text>
  <rect x="549.3278" y="95.9669" width="172.0786" height="46.3289" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.6184 3.3092" />
  <line x1="565.8738" y1="112.5129" x2="701.5512" y2="112.5129" stroke="var(--ok-border)" stroke-width="1.3237" marker-end="url(#arrow)" />
  <line x1="701.5512" y1="125.7497" x2="565.8738" y2="125.7497" stroke="var(--ok-border)" stroke-width="1.3237" marker-end="url(#arrow)" />

  <text x="211.789" y="117.8077" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5895" fill="var(--text-muted)">Encrypted Database</text>
  <rect x="112.5129" y="145.605" width="198.5522" height="39.7104" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="211.789" y="170.7549" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5895" fill="var(--text-muted)">Encrypted Object Storage</text>
  <rect x="112.5129" y="198.5522" width="198.5522" height="39.7104" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="211.789" y="223.7022" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5895" fill="var(--text-muted)">Encrypted Block Volume</text>
  <circle cx="211.789" cy="284.5915" r="23.1644" fill="var(--primary-fill)" opacity="0.15" stroke="var(--primary-border)" stroke-width="1.3237" />
  <rect x="198.5522" y="281.2823" width="26.4736" height="18.5315" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <path d="M 203.8469 281.2823 L 203.8469 274.6639 C 203.8469 266.7218 219.7311 266.7218 219.7311 274.6639 L 219.7311 281.2823" fill="none" stroke="var(--primary-border)" stroke-width="2.6474" stroke-linecap="round" />
  <circle cx="211.789" cy="289.2244" r="2.6474" fill="var(--bg)" />
  <text x="211.789" y="324.302" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9131" font-weight="bold" fill="var(--primary-accent)">AES-256 Encryption</text>
  <text x="211.789" y="344.1572" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Data encrypted on disk</text>
  <text x="211.789" y="360.7032" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Managed keys (KMS)</text>
  <text x="211.789" y="377.2492" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Transparent to applications</text>
  <text x="635.3671" y="33.092" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8552" font-weight="bold" fill="var(--ok-accent)">Encryption in Transit</text>
  <rect x="463.2885" y="86.0393" width="92.6577" height="66.1841" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="509.6174" y="115.8221" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5895" font-weight="bold" fill="var(--ok-accent)">Client</text>
  <text x="509.6174" y="132.3681" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Browser/App</text>
  <rect x="714.788" y="86.0393" width="92.6577" height="66.1841" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />

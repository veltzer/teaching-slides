<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1000" height="500" fill="var(--bg)" rx="7.0825" />
  <line x1="640" y1="103.4375" x2="640" y2="556.5625" stroke="var(--border)" stroke-width="1.3237" stroke-dasharray="5.2947 3.971" />
  <text x="389.9999" y="119.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4375" font-weight="bold" fill="var(--primary-accent)">Encryption at Rest</text>
  <rect x="233.75" y="158.125" width="312.5" height="218.75" rx="7.0825" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="272.8125" y="189.375" width="234.375" height="46.8749" rx="7.0825" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.9999" y="219.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5001" fill="var(--text-muted)">Encrypted Database</text>
  <rect x="272.8125" y="251.875" width="234.375" height="46.8749" rx="7.0825" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.9999" y="281.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5001" fill="var(--text-muted)">Encrypted Object Storage</text>
  <rect x="272.8125" y="314.375" width="234.375" height="46.8749" rx="7.0825" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.9999" y="344.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5001" fill="var(--text-muted)">Encrypted Block Volume</text>
  <circle cx="389.9999" cy="415.9375" r="27.3437" fill="var(--primary-fill)" opacity="0.15" stroke="var(--primary-border)" stroke-width="1.3237" />
  <rect x="374.375" y="412.0312" width="31.25" height="21.875" rx="7.0825" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <path d="M 380.6249 412.0312 L 380.6249 404.2187 C 380.6249 394.8437 399.375 394.8437 399.375 404.2187 L 399.375 412.0312" fill="none" stroke="var(--primary-border)" stroke-width="2.6474" stroke-linecap="round" />
  <circle cx="389.9999" cy="421.4062" r="3.125" fill="var(--bg)" />
  <text x="389.9999" y="462.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0625" font-weight="bold" fill="var(--primary-accent)">AES-256 Encryption</text>
  <text x="389.9999" y="486.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8042" fill="var(--text-muted)">Data encrypted on disk</text>
  <text x="389.9999" y="505.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8042" fill="var(--text-muted)">Managed keys (KMS)</text>
  <text x="389.9999" y="525.3124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8042" fill="var(--text-muted)">Transparent to applications</text>
  <text x="889.9999" y="119.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4375" font-weight="bold" fill="var(--ok-accent)">Encryption in Transit</text>
  <rect x="686.8749" y="181.5625" width="109.375" height="78.125" rx="7.0825" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="741.5625" y="216.7187" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5001" font-weight="bold" fill="var(--ok-accent)">Client</text>
  <text x="741.5625" y="236.2499" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8042" fill="var(--text-muted)">Browser/App</text>
  <rect x="983.7499" y="181.5625" width="109.375" height="78.125" rx="7.0825" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1038.4375" y="216.7187" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5001" font-weight="bold" fill="var(--ok-accent)">Server</text>
  <text x="1038.4375" y="236.2499" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8042" fill="var(--text-muted)">Cloud Service</text>
  <rect x="788.4374" y="193.2812" width="203.125" height="54.6876" rx="7.0825" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.6184 3.3092" />
  <line x1="807.9687" y1="212.8125" x2="968.125" y2="212.8125" stroke="var(--ok-border)" stroke-width="1.3237" marker-end="url(#arrow)" />
  <line x1="968.125" y1="228.4374" x2="807.9687" y2="228.4374" stroke="var(--ok-border)" stroke-width="1.3237" marker-end="url(#arrow)" />
  <circle cx="889.9999" cy="220.625" r="15.625" fill="var(--ok-fill)" opacity="0.2" />
  <rect x="881.4062" y="217.5" width="17.1875" height="12.5001" rx="7.0825" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <path d="M 884.5312 217.5 L 884.5312 212.8125 C 884.5312 207.3437 895.4687 207.3437 895.4687 212.8125 L 895.4687 217.5" fill="none" stroke="var(--ok-border)" stroke-width="1.9855" stroke-linecap="round" />
  <text x="889.9999" y="283.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0625" font-weight="bold" fill="var(--ok-accent)">TLS/SSL Encrypted Tunnel</text>
  <rect x="694.6874" y="322.1875" width="390.625" height="140.625" rx="7.0825" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="725.9375" y="357.3438" font-family="Arial, sans-serif" font-size="11.8042" fill="var(--text)">Plaintext</text>
  <line x1="777.4999" y1="352.6562" x2="808.75" y2="352.6562" stroke="var(--text-muted)" stroke-width="0.9928" marker-end="url(#arrow)" />
  <rect x="811.8749" y="341.7187" width="62.5" height="23.4375" rx="7.0825" fill="var(--ok-fill)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" />
  <text x="843.125" y="357.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8042" fill="var(--ok-accent)">Encrypt</text>
  <line x1="877.5" y1="352.6562" x2="908.75" y2="352.6562" stroke="var(--text-muted)" stroke-width="0.9928" marker-end="url(#arrow)" />
  <text x="913.4374" y="357.3438" font-family="Arial, sans-serif" font-size="11.8042" fill="var(--text)">Ciphertext</text>
  <line x1="977.5" y1="352.6562" x2="1008.7499" y2="352.6562" stroke="var(--text-muted)" stroke-width="0.9928" marker-end="url(#arrow)" />
  <rect x="1011.875" y="341.7187" width="62.5" height="23.4375" rx="7.0825" fill="var(--ok-fill)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1043.1249" y="357.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8042" fill="var(--ok-accent)">Decrypt</text>
  <text x="889.9999" y="400.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8042" fill="var(--text-muted)">TLS 1.3 / mTLS for service-to-service</text>
  <text x="889.9999" y="419.8437" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8042" fill="var(--text-muted)">HTTPS for web traffic</text>
  <text x="889.9999" y="439.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8042" fill="var(--text-muted)">VPN for private connectivity</text>
  <text x="389.9999" y="556.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5001" font-weight="bold" fill="var(--primary-accent)">Protects stored data</text>
  <text x="889.9999" y="556.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5001" font-weight="bold" fill="var(--ok-accent)">Protects data in motion</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>

  <!-- Divider line -->
  <line x1="640" y1="30" x2="640" y2="610" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- LEFT SIDE: Encryption at Rest -->
  <text x="320" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--primary-dk)">Encryption at Rest</text>

  <!-- Storage box -->
  <rect x="120" y="100" width="400" height="280" rx="16" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Disk representation -->
  <rect x="170" y="140" width="300" height="60" rx="8" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.5"/>
  <text x="320" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Encrypted Database</text>

  <rect x="170" y="220" width="300" height="60" rx="8" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.5"/>
  <text x="320" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Encrypted Object Storage</text>

  <rect x="170" y="300" width="300" height="60" rx="8" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.5"/>
  <text x="320" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Encrypted Block Volume</text>

  <!-- Lock icon on storage -->
  <circle cx="320" cy="430" r="35" fill="var(--primary)" opacity="0.15" stroke="var(--primary)" stroke-width="2"/>
  <!-- Lock body -->
  <rect x="300" y="425" width="40" height="28" rx="4" fill="var(--primary)"/>
  <!-- Lock shackle -->
  <path d="M308,425 L308,415 C308,403 332,403 332,415 L332,425" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="320" cy="437" r="4" fill="var(--bg)"/>

  <text x="320" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">AES-256 Encryption</text>
  <text x="320" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Data encrypted on disk</text>
  <text x="320" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Managed keys (KMS)</text>
  <text x="320" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Transparent to applications</text>

  <!-- RIGHT SIDE: Encryption in Transit -->
  <text x="960" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--ok-dk)">Encryption in Transit</text>

  <!-- Source endpoint -->
  <rect x="700" y="130" width="140" height="100" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)">Client</text>
  <text x="770" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Browser/App</text>

  <!-- Destination endpoint -->
  <rect x="1080" y="130" width="140" height="100" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)">Server</text>
  <text x="1150" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Cloud Service</text>

  <!-- Encrypted tunnel -->
  <rect x="830" y="145" width="260" height="70" rx="35" fill="none" stroke="var(--ok)" stroke-width="3" stroke-dasharray="10,5"/>
  <!-- Arrow inside tunnel -->
  <line x1="855" y1="170" x2="1060" y2="170" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1060" y1="190" x2="855" y2="190" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TLS Lock in center of tunnel -->
  <circle cx="960" cy="180" r="20" fill="var(--ok)" opacity="0.2"/>
  <rect x="949" y="176" width="22" height="16" rx="3" fill="var(--ok)"/>
  <path d="M953,176 L953,170 C953,163 967,163 967,170 L967,176" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linecap="round"/>

  <text x="960" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-dk)">TLS/SSL Encrypted Tunnel</text>

  <!-- Data flow illustration -->
  <rect x="710" y="310" width="500" height="180" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Plaintext -> Encrypt -> Ciphertext -> Decrypt -> Plaintext -->
  <text x="750" y="355" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Plaintext</text>
  <line x1="816" y1="349" x2="856" y2="349" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="860" y="335" width="80" height="30" rx="6" fill="var(--ok)" opacity="0.2" stroke="var(--ok)" stroke-width="1"/>
  <text x="900" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">Encrypt</text>
  <line x1="944" y1="349" x2="984" y2="349" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="990" y="355" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Ciphertext</text>
  <line x1="1072" y1="349" x2="1112" y2="349" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1116" y="335" width="80" height="30" rx="6" fill="var(--ok)" opacity="0.2" stroke="var(--ok)" stroke-width="1"/>
  <text x="1156" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">Decrypt</text>

  <text x="960" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">TLS 1.3 / mTLS for service-to-service</text>
  <text x="960" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">HTTPS for web traffic</text>
  <text x="960" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">VPN for private connectivity</text>

  <!-- Bottom comparison -->
  <text x="320" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary)">Protects stored data</text>
  <text x="960" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok)">Protects data in motion</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="538.57136084184" rx="6.106166620958" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="76.250019754463" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.3186025065" font-weight="bold" fill="var(--danger-text)">Perimeter — network edge</text>

  <rect x="140" y="102.142906058671" width="1000" height="445.35715978954" rx="6.106166620958" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="138.392925813135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.3186025065" font-weight="bold" fill="var(--warn-text)">Network — VPC / firewall / NSG</text>

  <rect x="240" y="164.285706760204" width="800" height="352.142853380102" rx="6.106166620958" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="200.535726514668" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.3186025065" font-weight="bold" fill="var(--primary-text)">Host — hardened OS + patched kernel</text>

  <rect x="340" y="226.428612818876" width="600" height="258.928546970664" rx="6.106166620958" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="262.678632573339" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.3186025065" font-weight="bold" fill="var(--info-text)">Application — authn / authz / input validation</text>

  <rect x="440" y="288.571413520409" width="400" height="165.714240561227" rx="6.106166620958" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="324.821433274872" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.3186025065" font-weight="bold" fill="var(--ok-text)">Data</text>
  <text x="640" y="355.892833625639" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247756330111" fill="var(--ok-text)">encryption at rest</text>
  <text x="640" y="381.785719929847" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247756330111" fill="var(--ok-text)">encryption in transit (TLS)</text>
  <text x="640" y="407.678606234054" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247756330111" fill="var(--ok-text)">least-privilege access policies</text>
  <text x="640" y="433.571387181124" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247756330111" fill="var(--ok-text)">immutable audit logs</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247756330111" fill="var(--text-muted)">Each layer is an independent barrier. A breach of one does not compromise the others.</text>
</svg>

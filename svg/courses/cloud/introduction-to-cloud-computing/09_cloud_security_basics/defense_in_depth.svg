<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Concentric rings - outermost to innermost -->
  <!-- Ring 5: Physical (outermost) -->
  <ellipse cx="480" cy="320" rx="380" ry="280" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.5"/>
  <text x="480" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-accent)">Physical Security</text>

  <!-- Ring 4: Network -->
  <ellipse cx="480" cy="320" rx="300" ry="220" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.5"/>
  <text x="480" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-accent)">Network Security</text>

  <!-- Ring 3: Infrastructure -->
  <ellipse cx="480" cy="320" rx="220" ry="160" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.5"/>
  <text x="480" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-accent)">Infrastructure</text>

  <!-- Ring 2: Application -->
  <ellipse cx="480" cy="320" rx="140" ry="100" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.5"/>
  <text x="480" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-accent)">Application</text>

  <!-- Ring 1: Data (innermost) -->
  <ellipse cx="480" cy="320" rx="65" ry="45" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3"/>
  <text x="480" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-accent)">Data</text>

  <!-- Right side: labels with descriptions -->
  <g transform="translate(900, 60)">
    <!-- Physical -->
    <rect x="0" y="0" width="320" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Physical Security</text>
    <text x="160" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Guards, locks, CCTV, biometrics</text>
    <line x1="0" y1="35" x2="-40" y2="35" stroke="var(--primary-border)" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Network -->
    <rect x="0" y="90" width="320" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Network Security</text>
    <text x="160" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Firewalls, VPNs, DDoS protection</text>

    <!-- Infrastructure -->
    <rect x="0" y="180" width="320" height="70" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)">Infrastructure</text>
    <text x="160" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">OS hardening, patching, IAM</text>

    <!-- Application -->
    <rect x="0" y="270" width="320" height="70" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-accent)">Application</text>
    <text x="160" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Input validation, auth, WAF</text>

    <!-- Data -->
    <rect x="0" y="360" width="320" height="70" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)">Data</text>
    <text x="160" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Encryption, classification, DLP</text>
  </g>

  <!-- Arrow from outer to inner -->
  <text x="480" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Each layer adds protection -- attacker must breach all layers</text>
</svg>
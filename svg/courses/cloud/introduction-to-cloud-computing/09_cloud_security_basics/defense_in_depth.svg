<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7957" font-weight="bold" fill="var(--text)">Defense in Depth</text>

  <rect x="40" y="69.4915" width="1200" height="511.1864" rx="5.9489" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="103.8983" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8468" font-weight="bold" fill="var(--danger-text)">Perimeter — network edge</text>

  <rect x="140" y="128.4746" width="1000" height="422.7119" rx="5.9489" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="162.8814" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8468" font-weight="bold" fill="var(--warn-text)">Network — VPC / firewall / NSG</text>

  <rect x="240" y="187.4576" width="800" height="334.2373" rx="5.9489" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="221.8644" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8468" font-weight="bold" fill="var(--primary-text)">Host — hardened OS + patched kernel</text>

  <rect x="340" y="246.4407" width="600" height="245.7627" rx="5.9489" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="280.8475" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8468" font-weight="bold" fill="var(--info-text)">Application — authn / authz / input validation</text>

  <rect x="440" y="305.4237" width="400" height="157.2881" rx="5.9489" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="339.8305" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8468" font-weight="bold" fill="var(--ok-text)">Data</text>
  <text x="640" y="369.322" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8808" fill="var(--ok-text)">encryption at rest</text>
  <text x="640" y="393.8983" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8808" fill="var(--ok-text)">encryption in transit (TLS)</text>
  <text x="640" y="418.4746" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8808" fill="var(--ok-text)">least-privilege access policies</text>
  <text x="640" y="443.0508" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8808" fill="var(--ok-text)">immutable audit logs</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8808" fill="var(--text-muted)">Each layer is an independent barrier. A breach of one does not compromise the others.</text>
</svg>

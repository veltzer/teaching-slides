<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.736087274791" font-weight="bold" fill="var(--text)">Cloud CI/CD Stages</text>
  <rect x="40" y="102.142857142857" width="223.728813559322" height="517.857142857143" rx="10.262888312425" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.864406779661" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--info-text)">Source</text>
  <text x="60.338983050847" y="185" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">Git push</text>
  <text x="60.338983050847" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">Pull request</text>
  <text x="60.338983050847" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">Trigger pipeline</text>
  <path d="M 268.813559322034 361.071428571429 L 309.491525423729 361.071428571429" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="314.576271186441" y="102.142857142857" width="223.728813559322" height="517.857142857143" rx="10.262888312425" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="426.440677966102" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--primary-text)">Build</text>
  <text x="334.915254237288" y="185" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--primary-text)">Compile, package</text>
  <text x="334.915254237288" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--primary-text)">Container image</text>
  <text x="334.915254237288" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--primary-text)">Cache deps</text>
  <path d="M 543.389830508475 361.071428571429 L 584.067796610169 361.071428571429" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="589.152542372881" y="102.142857142857" width="223.728813559322" height="517.857142857143" rx="10.262888312425" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="701.016949152542" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--warn-text)">Test</text>
  <text x="609.491525423729" y="185" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--warn-text)">Unit, integration</text>
  <text x="609.491525423729" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--warn-text)">Security scan</text>
  <text x="609.491525423729" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--warn-text)">Lint and types</text>
  <path d="M 817.966101694915 361.071428571429 L 858.64406779661 361.071428571429" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="863.728813559322" y="102.142857142857" width="223.728813559322" height="517.857142857143" rx="10.262888312425" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="975.593220338983" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--ok-text)">Stage</text>
  <text x="884.067796610169" y="185" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--ok-text)">Deploy to staging</text>
  <text x="884.067796610169" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--ok-text)">Smoke tests</text>
  <text x="884.067796610169" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--ok-text)">Manual approval</text>
  <path d="M 1092.542372881356 361.071428571429 L 1133.220338983051 361.071428571429" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1138.305084745763" y="102.142857142857" width="101.694915254237" height="517.857142857143" rx="10.262888312425" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1189.152542372881" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--info-text)">Prod</text>
  <text x="1148.474576271186" y="185" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">Canary</text>
  <text x="1148.474576271186" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">Roll out</text>
  <text x="1148.474576271186" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">Monitor</text>
</svg>

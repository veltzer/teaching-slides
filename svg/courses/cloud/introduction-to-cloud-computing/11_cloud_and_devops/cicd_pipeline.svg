<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>

  <!-- Pipeline stages as chevrons -->
  <!-- Stage 1: Code Commit (primary) -->
  <g filter="url(#shadow)">
    <polygon points="40,160 170,160 200,230 170,300 40,300" fill="var(--primary)" stroke="var(--primary-dk)" stroke-width="1.5"/>
    <text x="112" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Code</text>
    <text x="112" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Commit</text>
  </g>

  <!-- Connector arrow -->
  <line x1="202" y1="230" x2="228" y2="230" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Build (warn) -->
  <g filter="url(#shadow)">
    <polygon points="230,160 360,160 390,230 360,300 230,300 260,230" fill="var(--warn)" stroke="var(--warn-dk)" stroke-width="1.5"/>
    <text x="312" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Build</text>
  </g>

  <line x1="392" y1="230" x2="418" y2="230" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Test (info) -->
  <g filter="url(#shadow)">
    <polygon points="420,160 550,160 580,230 550,300 420,300 450,230" fill="var(--info)" stroke="var(--info-dk)" stroke-width="1.5"/>
    <text x="502" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Test</text>
  </g>

  <line x1="582" y1="230" x2="608" y2="230" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Stage (ok) -->
  <g filter="url(#shadow)">
    <polygon points="610,160 740,160 770,230 740,300 610,300 640,230" fill="var(--ok)" stroke="var(--ok-dk)" stroke-width="1.5"/>
    <text x="692" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Stage</text>
  </g>

  <line x1="772" y1="230" x2="798" y2="230" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5: Approve (warn) -->
  <g filter="url(#shadow)">
    <polygon points="800,160 930,160 960,230 930,300 800,300 830,230" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="2"/>
    <text x="882" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-dk)">Approve</text>
  </g>

  <line x1="962" y1="230" x2="988" y2="230" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 6: Production (ok-dk) -->
  <g filter="url(#shadow)">
    <polygon points="990,160 1120,160 1150,230 1120,300 990,300 1020,230" fill="var(--ok-dk)" stroke="var(--ok-dk)" stroke-width="1.5"/>
    <text x="1072" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Production</text>
    <text x="1072" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Deploy</text>
  </g>

  <!-- Labels: CI and CD -->
  <rect x="40" y="100" width="540" height="36" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="310" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Continuous Integration (CI)</text>

  <rect x="610" y="100" width="540" height="36" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="880" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-dk)">Continuous Delivery / Deployment (CD)</text>

  <!-- Cloud managed services below -->
  <text x="640" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text-dark)">Cloud-Managed CI/CD Services</text>

  <!-- Service boxes -->
  <g filter="url(#shadow)">
    <rect x="80" y="400" width="300" height="90" rx="12" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
    <text x="230" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">AWS CodePipeline</text>
    <text x="230" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">CodeBuild, CodeDeploy</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="400" width="300" height="90" rx="12" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2"/>
    <text x="580" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-dk)">Azure DevOps</text>
    <text x="580" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Pipelines, Repos, Artifacts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="400" width="300" height="90" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2"/>
    <text x="930" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-dk)">Cloud Build</text>
    <text x="930" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Google Cloud Deploy</text>
  </g>

  <!-- Connecting lines from pipeline to services -->
  <line x1="230" y1="302" x2="230" y2="398" stroke="var(--border-strong)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="580" y1="302" x2="580" y2="398" stroke="var(--border-strong)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="930" y1="302" x2="930" y2="398" stroke="var(--border-strong)" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Third-party options -->
  <text x="640" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Also: GitHub Actions, GitLab CI, Jenkins, CircleCI -- works across all clouds</text>
</svg>
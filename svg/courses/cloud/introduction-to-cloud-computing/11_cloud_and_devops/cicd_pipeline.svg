<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Pipeline stages as chevrons -->
  <!-- Stage 1: Code Commit (primary) -->
  <g filter="url(#shadow)">
    <polygon points="40,118.202257 180.540541,118.202257 212.972973,209.438223 180.540541,300.67419 40,300.67419" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.5"/>
    <text x="117.837838" y="202.921297" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618481" font-weight="bold" fill="var(--bg)">Code</text>
    <text x="117.837838" y="232.8989" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618481" font-weight="bold" fill="var(--bg)">Commit</text>
  </g>

  <!-- Connector arrow -->
  <line x1="215.135135" y1="209.438223" x2="243.243243" y2="209.438223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Build (warn) -->
  <g filter="url(#shadow)">
    <polygon points="245.405405,118.202257 385.945946,118.202257 418.378378,209.438223 385.945946,300.67419 245.405405,300.67419 277.837838,209.438223" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
    <text x="334.054054" y="218.561748" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.992568" font-weight="bold" fill="var(--bg)">Build</text>
  </g>

  <line x1="420.540541" y1="209.438223" x2="448.648649" y2="209.438223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Test (info) -->
  <g filter="url(#shadow)">
    <polygon points="450.810811,118.202257 591.351351,118.202257 623.783784,209.438223 591.351351,300.67419 450.810811,300.67419 483.243243,209.438223" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="1.5"/>
    <text x="539.459459" y="218.561748" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.992568" font-weight="bold" fill="var(--bg)">Test</text>
  </g>

  <line x1="625.945946" y1="209.438223" x2="654.054054" y2="209.438223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Stage (ok) -->
  <g filter="url(#shadow)">
    <polygon points="656.216216,118.202257 796.756757,118.202257 829.189189,209.438223 796.756757,300.67419 656.216216,300.67419 688.648649,209.438223" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
    <text x="744.864865" y="218.561748" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.992568" font-weight="bold" fill="var(--bg)">Stage</text>
  </g>

  <line x1="831.351351" y1="209.438223" x2="859.459459" y2="209.438223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5: Approve (warn) -->
  <g filter="url(#shadow)">
    <polygon points="861.621622,118.202257 1002.162162,118.202257 1034.594595,209.438223 1002.162162,300.67419 861.621622,300.67419 894.054054,209.438223" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="950.27027" y="218.561748" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.992568" font-weight="bold" fill="var(--warn-accent)">Approve</text>
  </g>

  <line x1="1036.756757" y1="209.438223" x2="1064.864865" y2="209.438223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 6: Production (ok-dk) -->
  <g filter="url(#shadow)">
    <polygon points="1067.027027,118.202257 1207.567568,118.202257 1240,209.438223 1207.567568,300.67419 1067.027027,300.67419 1099.459459,209.438223" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="1.5"/>
    <text x="1155.675676" y="202.921297" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618481" font-weight="bold" fill="var(--bg)">Production</text>
    <text x="1155.675676" y="232.8989" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618481" font-weight="bold" fill="var(--bg)">Deploy</text>
  </g>

  <!-- Labels: CI and CD -->
  <rect x="40" y="40" width="583.783784" height="46.921354" rx="7.72689" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.891892" y="71.280903" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.366655" font-weight="bold" fill="var(--primary-accent)">Continuous Integration (CI)</text>

  <rect x="656.216216" y="40" width="583.783784" height="46.921354" rx="7.72689" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.108108" y="71.280903" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.366655" font-weight="bold" fill="var(--ok-accent)">Continuous Delivery / Deployment (CD)</text>

  <!-- Cloud managed services below -->
  <text x="688.648649" y="391.910156" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.740742" font-weight="bold" fill="var(--text)">Cloud-Managed CI/CD Services</text>

  <!-- Service boxes -->
  <g filter="url(#shadow)">
    <rect x="83.243243" y="431.011284" width="324.324324" height="117.303385" rx="7.72689" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="245.405405" y="483.146122" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.366655" font-weight="bold" fill="var(--primary-accent)">AWS CodePipeline</text>
    <text x="245.405405" y="522.247251" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618481" fill="var(--text-muted)">CodeBuild, CodeDeploy</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="461.621622" y="431.011284" width="324.324324" height="117.303385" rx="7.72689" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="623.783784" y="483.146122" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.366655" font-weight="bold" fill="var(--info-accent)">Azure DevOps</text>
    <text x="623.783784" y="522.247251" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618481" fill="var(--text-muted)">Pipelines, Repos, Artifacts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="840" y="431.011284" width="324.324324" height="117.303385" rx="7.72689" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="1002.162162" y="483.146122" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.366655" font-weight="bold" fill="var(--ok-accent)">Cloud Build</text>
    <text x="1002.162162" y="522.247251" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618481" fill="var(--text-muted)">Google Cloud Deploy</text>
  </g>

  <!-- Connecting lines from pipeline to services -->
  <line x1="245.405405" y1="303.280932" x2="245.405405" y2="428.404543" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="623.783784" y1="303.280932" x2="623.783784" y2="428.404543" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="1002.162162" y1="303.280932" x2="1002.162162" y2="428.404543" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Third-party options -->
  <text x="688.648649" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.992568" fill="var(--text-muted)">Also: GitHub Actions, GitLab CI, Jenkins, CircleCI -- works across all clouds</text>
</svg>
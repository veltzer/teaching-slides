<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Pipeline stages as chevrons -->
  <!-- Stage 1: Code Commit (primary) -->
  <g filter="url(#shadow)">
    <polygon points="77.5,185 199.375,185 227.5,248.4375 199.375,311.875 77.5,311.875" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.5"/>
    <text x="145" y="243.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Code</text>
    <text x="145" y="264.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Commit</text>
  </g>

  <!-- Connector arrow -->
  <line x1="229.375" y1="248.4375" x2="253.75" y2="248.4375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Build (warn) -->
  <g filter="url(#shadow)">
    <polygon points="255.625,185 377.5,185 405.625,248.4375 377.5,311.875 255.625,311.875 283.75,248.4375" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
    <text x="332.5" y="254.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)">Build</text>
  </g>

  <line x1="407.5" y1="248.4375" x2="431.875" y2="248.4375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Test (info) -->
  <g filter="url(#shadow)">
    <polygon points="433.75,185 555.625,185 583.75,248.4375 555.625,311.875 433.75,311.875 461.875,248.4375" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="1.5"/>
    <text x="510.625" y="254.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)">Test</text>
  </g>

  <line x1="585.625" y1="248.4375" x2="610" y2="248.4375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Stage (ok) -->
  <g filter="url(#shadow)">
    <polygon points="611.875,185 733.75,185 761.875,248.4375 733.75,311.875 611.875,311.875 640,248.4375" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
    <text x="688.75" y="254.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)">Stage</text>
  </g>

  <line x1="763.75" y1="248.4375" x2="788.125" y2="248.4375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5: Approve (warn) -->
  <g filter="url(#shadow)">
    <polygon points="790,185 911.875,185 940,248.4375 911.875,311.875 790,311.875 818.125,248.4375" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="866.875" y="254.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)">Approve</text>
  </g>

  <line x1="941.875" y1="248.4375" x2="966.25" y2="248.4375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 6: Production (ok-dk) -->
  <g filter="url(#shadow)">
    <polygon points="968.125,185 1090,185 1118.125,248.4375 1090,311.875 968.125,311.875 996.25,248.4375" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="1.5"/>
    <text x="1045" y="243.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Production</text>
    <text x="1045" y="264.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Deploy</text>
  </g>

  <!-- Labels: CI and CD -->
  <rect x="77.5" y="130.625" width="506.25" height="32.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="330.625" y="152.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Continuous Integration (CI)</text>

  <rect x="611.875" y="130.625" width="506.25" height="32.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="865" y="152.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--ok-accent)">Continuous Delivery / Deployment (CD)</text>

  <!-- Cloud managed services below -->
  <text x="640" y="375.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text)">Cloud-Managed CI/CD Services</text>

  <!-- Service boxes -->
  <g filter="url(#shadow)">
    <rect x="115" y="402.5" width="281.25" height="81.5625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="255.625" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">AWS CodePipeline</text>
    <text x="255.625" y="465.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">CodeBuild, CodeDeploy</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="443.125" y="402.5" width="281.25" height="81.5625" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
    <text x="583.75" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--info-accent)">Azure DevOps</text>
    <text x="583.75" y="465.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Pipelines, Repos, Artifacts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="771.25" y="402.5" width="281.25" height="81.5625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="911.875" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--ok-accent)">Cloud Build</text>
    <text x="911.875" y="465.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Google Cloud Deploy</text>
  </g>

  <!-- Connecting lines from pipeline to services -->
  <line x1="255.625" y1="313.6875" x2="255.625" y2="400.6875" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="583.75" y1="313.6875" x2="583.75" y2="400.6875" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="911.875" y1="313.6875" x2="911.875" y2="400.6875" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Third-party options -->
  <text x="640" y="533.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">Also: GitHub Actions, GitLab CI, Jenkins, CircleCI -- works across all clouds</text>
</svg>
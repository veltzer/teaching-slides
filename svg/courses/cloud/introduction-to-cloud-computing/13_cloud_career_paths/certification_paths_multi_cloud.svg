<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Level labels on left -->
  <text x="60" y="115" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Professional</text>
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">(Expert)</text>

  <text x="60" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Associate</text>
  <text x="60" y="305" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">(Intermediate)</text>

  <text x="60" y="455" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Foundational</text>
  <text x="60" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">(Entry)</text>

  <!-- AWS Ladder (primary) -->
  <g transform="translate(200, 0)">
    <!-- Header -->
    <rect x="0" y="20" width="300" height="45" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--bg)">AWS</text>

    <!-- Professional -->
    <rect x="10" y="80" width="280" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Solutions Architect</text>
    <text x="150" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Professional</text>

    <!-- Arrow up -->
    <line x1="150" y1="180" x2="150" y2="230" stroke="var(--primary-border)" stroke-width="2"/>
    <polygon points="142,228 150,180 158,228" fill="var(--primary-fill)"/>

    <!-- Associate -->
    <rect x="10" y="245" width="280" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Solutions Architect</text>
    <text x="150" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Associate</text>

    <!-- Arrow up -->
    <line x1="150" y1="345" x2="150" y2="395" stroke="var(--primary-border)" stroke-width="2"/>
    <polygon points="142,393 150,345 158,393" fill="var(--primary-fill)"/>

    <!-- Foundational -->
    <rect x="10" y="415" width="280" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Cloud Practitioner</text>
    <text x="150" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Foundational</text>
  </g>

  <!-- Azure Ladder (info) -->
  <g transform="translate(540, 0)">
    <!-- Header -->
    <rect x="0" y="20" width="300" height="45" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--bg)">Azure</text>

    <!-- Professional -->
    <rect x="10" y="80" width="280" height="80" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-accent)">Azure Solutions</text>
    <text x="150" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Architect Expert</text>

    <!-- Arrow up -->
    <line x1="150" y1="180" x2="150" y2="230" stroke="var(--info-border)" stroke-width="2"/>
    <polygon points="142,228 150,180 158,228" fill="var(--info-fill)"/>

    <!-- Associate -->
    <rect x="10" y="245" width="280" height="80" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-accent)">Azure Administrator</text>
    <text x="150" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Associate (AZ-104)</text>

    <!-- Arrow up -->
    <line x1="150" y1="345" x2="150" y2="395" stroke="var(--info-border)" stroke-width="2"/>
    <polygon points="142,393 150,345 158,393" fill="var(--info-fill)"/>

    <!-- Foundational -->
    <rect x="10" y="415" width="280" height="80" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-accent)">Azure Fundamentals</text>
    <text x="150" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">AZ-900</text>
  </g>

  <!-- GCP Ladder (ok) -->
  <g transform="translate(880, 0)">
    <!-- Header -->
    <rect x="0" y="20" width="300" height="45" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--bg)">GCP</text>

    <!-- Professional -->
    <rect x="10" y="80" width="280" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Professional Cloud</text>
    <text x="150" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Architect</text>

    <!-- Arrow up -->
    <line x1="150" y1="180" x2="150" y2="230" stroke="var(--ok-border)" stroke-width="2"/>
    <polygon points="142,228 150,180 158,228" fill="var(--ok-fill)"/>

    <!-- Associate -->
    <rect x="10" y="245" width="280" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Associate Cloud</text>
    <text x="150" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Engineer</text>

    <!-- Arrow up -->
    <line x1="150" y1="345" x2="150" y2="395" stroke="var(--ok-border)" stroke-width="2"/>
    <polygon points="142,393 150,345 158,393" fill="var(--ok-fill)"/>

    <!-- Foundational -->
    <rect x="10" y="415" width="280" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Cloud Digital</text>
    <text x="150" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Leader</text>
  </g>

  <!-- Connecting dashed lines between equivalent levels -->
  <!-- Foundational connections -->
  <line x1="490" y1="455" x2="550" y2="455" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="830" y1="455" x2="890" y2="455" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Associate connections -->
  <line x1="490" y1="285" x2="550" y2="285" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="830" y1="285" x2="890" y2="285" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Professional connections -->
  <line x1="490" y1="120" x2="550" y2="120" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="830" y1="120" x2="890" y2="120" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Bottom note -->
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Equivalent certification levels across providers -- start foundational, progress upward</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Each provider also offers specialty certifications (Security, Data, ML, Networking)</text>
</svg>
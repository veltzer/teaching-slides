<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>

  <!-- Level labels on left -->
  <text x="60" y="115" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)">Professional</text>
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">(Expert)</text>

  <text x="60" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)">Associate</text>
  <text x="60" y="305" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">(Intermediate)</text>

  <text x="60" y="455" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-dark)">Foundational</text>
  <text x="60" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">(Entry)</text>

  <!-- AWS Ladder (primary) -->
  <g transform="translate(200, 0)">
    <!-- Header -->
    <rect x="0" y="20" width="300" height="45" rx="10" fill="var(--primary)" filter="url(#shadow)"/>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--bg)">AWS</text>

    <!-- Professional -->
    <rect x="10" y="80" width="280" height="80" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)">Solutions Architect</text>
    <text x="150" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Professional</text>

    <!-- Arrow up -->
    <line x1="150" y1="180" x2="150" y2="230" stroke="var(--primary)" stroke-width="3"/>
    <polygon points="142,228 150,180 158,228" fill="var(--primary)"/>

    <!-- Associate -->
    <rect x="10" y="245" width="280" height="80" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)">Solutions Architect</text>
    <text x="150" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Associate</text>

    <!-- Arrow up -->
    <line x1="150" y1="345" x2="150" y2="395" stroke="var(--primary)" stroke-width="3"/>
    <polygon points="142,393 150,345 158,393" fill="var(--primary)"/>

    <!-- Foundational -->
    <rect x="10" y="415" width="280" height="80" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)">Cloud Practitioner</text>
    <text x="150" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Foundational</text>
  </g>

  <!-- Azure Ladder (info) -->
  <g transform="translate(540, 0)">
    <!-- Header -->
    <rect x="0" y="20" width="300" height="45" rx="10" fill="var(--info)" filter="url(#shadow)"/>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--bg)">Azure</text>

    <!-- Professional -->
    <rect x="10" y="80" width="280" height="80" rx="10" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-dk)">Azure Solutions</text>
    <text x="150" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Architect Expert</text>

    <!-- Arrow up -->
    <line x1="150" y1="180" x2="150" y2="230" stroke="var(--info)" stroke-width="3"/>
    <polygon points="142,228 150,180 158,228" fill="var(--info)"/>

    <!-- Associate -->
    <rect x="10" y="245" width="280" height="80" rx="10" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-dk)">Azure Administrator</text>
    <text x="150" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Associate (AZ-104)</text>

    <!-- Arrow up -->
    <line x1="150" y1="345" x2="150" y2="395" stroke="var(--info)" stroke-width="3"/>
    <polygon points="142,393 150,345 158,393" fill="var(--info)"/>

    <!-- Foundational -->
    <rect x="10" y="415" width="280" height="80" rx="10" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-dk)">Azure Fundamentals</text>
    <text x="150" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">AZ-900</text>
  </g>

  <!-- GCP Ladder (ok) -->
  <g transform="translate(880, 0)">
    <!-- Header -->
    <rect x="0" y="20" width="300" height="45" rx="10" fill="var(--ok)" filter="url(#shadow)"/>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--bg)">GCP</text>

    <!-- Professional -->
    <rect x="10" y="80" width="280" height="80" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)">Professional Cloud</text>
    <text x="150" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Architect</text>

    <!-- Arrow up -->
    <line x1="150" y1="180" x2="150" y2="230" stroke="var(--ok)" stroke-width="3"/>
    <polygon points="142,228 150,180 158,228" fill="var(--ok)"/>

    <!-- Associate -->
    <rect x="10" y="245" width="280" height="80" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)">Associate Cloud</text>
    <text x="150" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Engineer</text>

    <!-- Arrow up -->
    <line x1="150" y1="345" x2="150" y2="395" stroke="var(--ok)" stroke-width="3"/>
    <polygon points="142,393 150,345 158,393" fill="var(--ok)"/>

    <!-- Foundational -->
    <rect x="10" y="415" width="280" height="80" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)">Cloud Digital</text>
    <text x="150" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Leader</text>
  </g>

  <!-- Connecting dashed lines between equivalent levels -->
  <!-- Foundational connections -->
  <line x1="490" y1="455" x2="550" y2="455" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="830" y1="455" x2="890" y2="455" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Associate connections -->
  <line x1="490" y1="285" x2="550" y2="285" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="830" y1="285" x2="890" y2="285" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Professional connections -->
  <line x1="490" y1="120" x2="550" y2="120" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="830" y1="120" x2="890" y2="120" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Bottom note -->
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Equivalent certification levels across providers -- start foundational, progress upward</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Each provider also offers specialty certifications (Security, Data, ML, Networking)</text>
</svg>
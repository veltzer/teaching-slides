<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Level labels on left -->
  <text x="40" y="136.666723" font-family="Arial, sans-serif" font-size="20.966176669307" font-weight="bold" fill="var(--text)">Professional</text>
  <text x="40" y="157.0176" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-faint)">(Expert)</text>

  <text x="40" y="309.649067" font-family="Arial, sans-serif" font-size="20.966176669307" font-weight="bold" fill="var(--text)">Associate</text>
  <text x="40" y="329.999944" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-faint)">(Intermediate)</text>

  <text x="40" y="482.631635" font-family="Arial, sans-serif" font-size="20.966176669307" font-weight="bold" fill="var(--text)">Foundational</text>
  <text x="40" y="502.982512" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-faint)">(Entry)</text>

  <!-- AWS Ladder (primary) -->
  <g transform="translate(200, 0)">
    <!-- Header -->
    <rect x="-39.999998249989" y="40" width="399.999998249973" height="45.789418" rx="7.582064663301" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160.000000374996" y="70.526316" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.954820558828" font-weight="bold" fill="var(--bg)">AWS</text>

    <!-- Professional -->
    <rect x="-26.666664541652" y="101.052632" width="373.333331833312" height="81.403509" rx="7.582064663301" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160.000000374996" y="133.614035" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.636589706013" font-weight="bold" fill="var(--primary-accent)">Solutions Architect</text>
    <text x="160.000000374996" y="160.070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-muted)">Professional</text>

    <!-- Arrow up -->
    <line x1="160.000000374996" y1="202.807018" x2="160.000000374996" y2="253.684211" stroke="var(--primary-border)" stroke-width="2"/>
    <polygon points="149.333334608338,251.649123 160.000000374996,202.807018 170.666668141669,251.649123" fill="var(--primary-fill)"/>

    <!-- Associate -->
    <rect x="-26.666664541652" y="268.947312" width="373.333331833312" height="81.403509" rx="7.582064663301" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160.000000374996" y="301.508716" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.636589706013" font-weight="bold" fill="var(--primary-accent)">Solutions Architect</text>
    <text x="160.000000374996" y="327.964968" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-muted)">Associate</text>

    <!-- Arrow up -->
    <line x1="160.000000374996" y1="370.701698" x2="160.000000374996" y2="421.579004" stroke="var(--primary-border)" stroke-width="2"/>
    <polygon points="149.333334608338,419.543804 160.000000374996,370.701698 170.666668141669,419.543804" fill="var(--primary-fill)"/>

    <!-- Foundational -->
    <rect x="-26.666664541652" y="441.929881" width="373.333331833312" height="81.403509" rx="7.582064663301" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160.000000374996" y="477.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.636589706013" font-weight="bold" fill="var(--primary-accent)">Cloud Practitioner</text>
    <text x="160.000000374996" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-muted)">Foundational</text>
  </g>

  <!-- Azure Ladder (info) -->
  <g transform="translate(540, 0)">
    <!-- Header -->
    <rect x="-39.999998249989" y="40" width="399.999998249973" height="45.789418" rx="7.582064663301" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160.000000374996" y="70.526316" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.954820558828" font-weight="bold" fill="var(--bg)">Azure</text>

    <!-- Professional -->
    <rect x="-26.666664541652" y="101.052632" width="373.333331833312" height="81.403509" rx="7.582064663301" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160.000000374996" y="133.614035" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.636589706013" font-weight="bold" fill="var(--info-accent)">Azure Solutions</text>
    <text x="160.000000374996" y="160.070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-muted)">Architect Expert</text>

    <!-- Arrow up -->
    <line x1="160.000000374996" y1="202.807018" x2="160.000000374996" y2="253.684211" stroke="var(--info-border)" stroke-width="2"/>
    <polygon points="149.333334608338,251.649123 160.000000374996,202.807018 170.666668141669,251.649123" fill="var(--info-fill)"/>

    <!-- Associate -->
    <rect x="-26.666664541652" y="268.947312" width="373.333331833312" height="81.403509" rx="7.582064663301" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160.000000374996" y="301.508716" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.636589706013" font-weight="bold" fill="var(--info-accent)">Azure Administrator</text>
    <text x="160.000000374996" y="327.964968" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-muted)">Associate (AZ-104)</text>

    <!-- Arrow up -->
    <line x1="160.000000374996" y1="370.701698" x2="160.000000374996" y2="421.579004" stroke="var(--info-border)" stroke-width="2"/>
    <polygon points="149.333334608338,419.543804 160.000000374996,370.701698 170.666668141669,419.543804" fill="var(--info-fill)"/>

    <!-- Foundational -->
    <rect x="-26.666664541652" y="441.929881" width="373.333331833312" height="81.403509" rx="7.582064663301" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160.000000374996" y="477.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.636589706013" font-weight="bold" fill="var(--info-accent)">Azure Fundamentals</text>
    <text x="160.000000374996" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-muted)">AZ-900</text>
  </g>

  <!-- GCP Ladder (ok) -->
  <g transform="translate(880, 0)">
    <!-- Header -->
    <rect x="-39.999998249989" y="40" width="399.999998249973" height="45.789418" rx="7.582064663301" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160.000000374996" y="70.526316" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.954820558828" font-weight="bold" fill="var(--bg)">GCP</text>

    <!-- Professional -->
    <rect x="-26.666664541652" y="101.052632" width="373.333331833312" height="81.403509" rx="7.582064663301" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160.000000374996" y="133.614035" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.636589706013" font-weight="bold" fill="var(--ok-accent)">Professional Cloud</text>
    <text x="160.000000374996" y="160.070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-muted)">Architect</text>

    <!-- Arrow up -->
    <line x1="160.000000374996" y1="202.807018" x2="160.000000374996" y2="253.684211" stroke="var(--ok-border)" stroke-width="2"/>
    <polygon points="149.333334608338,251.649123 160.000000374996,202.807018 170.666668141669,251.649123" fill="var(--ok-fill)"/>

    <!-- Associate -->
    <rect x="-26.666664541652" y="268.947312" width="373.333331833312" height="81.403509" rx="7.582064663301" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160.000000374996" y="301.508716" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.636589706013" font-weight="bold" fill="var(--ok-accent)">Associate Cloud</text>
    <text x="160.000000374996" y="327.964968" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-muted)">Engineer</text>

    <!-- Arrow up -->
    <line x1="160.000000374996" y1="370.701698" x2="160.000000374996" y2="421.579004" stroke="var(--ok-border)" stroke-width="2"/>
    <polygon points="149.333334608338,419.543804 160.000000374996,370.701698 170.666668141669,419.543804" fill="var(--ok-fill)"/>

    <!-- Foundational -->
    <rect x="-26.666664541652" y="441.929881" width="373.333331833312" height="81.403509" rx="7.582064663301" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="160.000000374996" y="477.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.636589706013" font-weight="bold" fill="var(--ok-accent)">Cloud Digital</text>
    <text x="160.000000374996" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-muted)">Leader</text>
  </g>

  <!-- Connecting dashed lines between equivalent levels -->
  <!-- Foundational connections -->
  <line x1="613.333331458303" y1="482.631635" x2="693.333330708293" y2="482.631635" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="1066.666664541617" y1="482.631635" x2="1146.666661791596" y2="482.631635" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Associate connections -->
  <line x1="613.333331458303" y1="309.649067" x2="693.333330708293" y2="309.649067" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="1066.666664541617" y1="309.649067" x2="1146.666661791596" y2="309.649067" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Professional connections -->
  <line x1="613.333331458303" y1="141.754386" x2="693.333330708293" y2="141.754386" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="1066.666664541617" y1="141.754386" x2="1146.666661791596" y2="141.754386" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Bottom note -->
  <text x="813.333334083309" y="589.473684" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.636589706013" fill="var(--text-muted)">Equivalent certification levels across providers -- start foundational, progress upward</text>
  <text x="813.333334083309" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.307001742716" fill="var(--text-faint)">Each provider also offers specialty certifications (Security, Data, ML, Networking)</text>
</svg>

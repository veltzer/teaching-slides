<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Timeline main line -->
  <line x1="60" y1="320" x2="1220" y2="320" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Event 1: 1960s Mainframes (above) -->
  <circle cx="120" cy="320" r="10" fill="var(--primary-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="120" y1="310" x2="120" y2="190" stroke="var(--primary-border)" stroke-width="1.5"/>
  <rect x="50" y="130" rx="6" width="140" height="60" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">1960s</text>
  <text x="120" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Mainframes</text>

  <!-- Event 2: 1990s Client-Server (below) -->
  <circle cx="300" cy="320" r="10" fill="var(--ok-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="300" y1="330" x2="300" y2="430" stroke="var(--ok-border)" stroke-width="1.5"/>
  <rect x="220" y="430" rx="6" width="160" height="60" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">1990s</text>
  <text x="300" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Client-Server</text>

  <!-- Event 3: 2000s Virtualization (above) -->
  <circle cx="480" cy="320" r="10" fill="var(--warn-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="480" y1="310" x2="480" y2="190" stroke="var(--warn-border)" stroke-width="1.5"/>
  <rect x="400" y="130" rx="6" width="160" height="60" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">2000s</text>
  <text x="480" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Virtualization</text>

  <!-- Event 4: 2006 AWS S3/EC2 (below) -->
  <circle cx="660" cy="320" r="10" fill="var(--danger-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="660" y1="330" x2="660" y2="430" stroke="var(--danger-border)" stroke-width="1.5"/>
  <rect x="575" y="430" rx="6" width="170" height="60" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)">2006</text>
  <text x="660" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">AWS S3 / EC2</text>

  <!-- Event 5: 2013 Docker (above) -->
  <circle cx="840" cy="320" r="10" fill="var(--info-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="840" y1="310" x2="840" y2="190" stroke="var(--info-border)" stroke-width="1.5"/>
  <rect x="770" y="130" rx="6" width="140" height="60" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-accent)">2013</text>
  <text x="840" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Docker</text>

  <!-- Event 6: 2014 Lambda (below) -->
  <circle cx="1000" cy="320" r="10" fill="var(--primary-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="1000" y1="330" x2="1000" y2="430" stroke="var(--primary-border)" stroke-width="1.5"/>
  <rect x="920" y="430" rx="6" width="160" height="60" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">2014</text>
  <text x="1000" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">AWS Lambda</text>

  <!-- Event 7: 2020s AI/Multi-cloud (above) -->
  <circle cx="1160" cy="320" r="10" fill="var(--ok-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="1160" y1="310" x2="1160" y2="190" stroke="var(--ok-border)" stroke-width="1.5"/>
  <rect x="1070" y="120" rx="6" width="180" height="70" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">2020s</text>
  <text x="1160" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">AI / Multi-cloud</text>

  <!-- Footer -->
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Evolution of Cloud Computing</text>
</svg>
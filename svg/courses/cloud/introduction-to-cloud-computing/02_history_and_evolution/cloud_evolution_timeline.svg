<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Timeline main line -->
  <line x1="96.25" y1="330" x2="1183.75" y2="330" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Event 1: 1960s Mainframes (above) -->
  <circle cx="152.5" cy="330" r="9.2174" fill="var(--primary-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="152.5" y1="320.9375" x2="152.5" y2="212.1875" stroke="var(--primary-border)" stroke-width="1.5"/>
  <rect x="86.875" y="157.8125" rx="6" width="131.25" height="54.375" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.5" y="180.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">1960s</text>
  <text x="152.5" y="198.5938" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Mainframes</text>

  <!-- Event 2: 1990s Client-Server (below) -->
  <circle cx="321.25" cy="330" r="9.2174" fill="var(--ok-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="321.25" y1="339.0625" x2="321.25" y2="429.6875" stroke="var(--ok-border)" stroke-width="1.5"/>
  <rect x="246.25" y="429.6875" rx="6" width="150" height="54.375" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.25" y="452.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">1990s</text>
  <text x="321.25" y="470.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Client-Server</text>

  <!-- Event 3: 2000s Virtualization (above) -->
  <circle cx="490" cy="330" r="9.2174" fill="var(--warn-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="490" y1="320.9375" x2="490" y2="212.1875" stroke="var(--warn-border)" stroke-width="1.5"/>
  <rect x="415" y="157.8125" rx="6" width="150" height="54.375" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="180.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">2000s</text>
  <text x="490" y="198.5938" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Virtualization</text>

  <!-- Event 4: 2006 AWS S3/EC2 (below) -->
  <circle cx="658.75" cy="330" r="9.2174" fill="var(--danger-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="658.75" y1="339.0625" x2="658.75" y2="429.6875" stroke="var(--danger-border)" stroke-width="1.5"/>
  <rect x="579.0625" y="429.6875" rx="6" width="159.375" height="54.375" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="658.75" y="452.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">2006</text>
  <text x="658.75" y="470.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">AWS S3 / EC2</text>

  <!-- Event 5: 2013 Docker (above) -->
  <circle cx="827.5" cy="330" r="9.2174" fill="var(--info-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="827.5" y1="320.9375" x2="827.5" y2="212.1875" stroke="var(--info-border)" stroke-width="1.5"/>
  <rect x="761.875" y="157.8125" rx="6" width="131.25" height="54.375" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="827.5" y="180.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--info-accent)">2013</text>
  <text x="827.5" y="198.5938" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Docker</text>

  <!-- Event 6: 2014 Lambda (below) -->
  <circle cx="977.5" cy="330" r="9.2174" fill="var(--primary-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="977.5" y1="339.0625" x2="977.5" y2="429.6875" stroke="var(--primary-border)" stroke-width="1.5"/>
  <rect x="902.5" y="429.6875" rx="6" width="150" height="54.375" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="977.5" y="452.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">2014</text>
  <text x="977.5" y="470.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">AWS Lambda</text>

  <!-- Event 7: 2020s AI/Multi-cloud (above) -->
  <circle cx="1127.5" cy="330" r="9.2174" fill="var(--ok-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="1127.5" y1="320.9375" x2="1127.5" y2="212.1875" stroke="var(--ok-border)" stroke-width="1.5"/>
  <rect x="1043.125" y="148.75" rx="6" width="168.75" height="63.4375" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1127.5" y="174.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">2020s</text>
  <text x="1127.5" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">AI / Multi-cloud</text>

  <!-- Footer -->
  <text x="640" y="583.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Evolution of Cloud Computing</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Timeline main line -->
  <line x1="50" y1="281.666667" x2="1210" y2="281.666667" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Event 1: 1960s Mainframes (above) -->
  <rect x="99.0076" y="270.674" width="21.9848" height="21.9848" rx="10.9924" fill="url(#grad-primary)" stroke="var(--bg)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="110" y1="269.583333" x2="110" y2="124.583333" stroke="var(--primary-border)" stroke-width="1.5"/>
  <rect x="40" y="52.083333" rx="7.155418" width="140" height="72.5" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="82.291733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--primary-accent)">1960s</text>
  <text x="110" y="106.4584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">Mainframes</text>

  <!-- Event 2: 1990s Client-Server (below) -->
  <rect x="279.008" y="270.674" width="21.9848" height="21.9848" rx="10.9924" fill="url(#grad-ok)" stroke="var(--bg)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="290" y1="293.75" x2="290" y2="414.583333" stroke="var(--ok-border)" stroke-width="1.5"/>
  <rect x="210" y="414.583333" rx="7.155418" width="160" height="72.5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="444.791733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--ok-accent)">1990s</text>
  <text x="290" y="468.9584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">Client-Server</text>

  <!-- Event 3: 2000s Virtualization (above) -->
  <rect x="459.008" y="270.674" width="21.9848" height="21.9848" rx="10.9924" fill="url(#grad-warn)" stroke="var(--bg)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="470" y1="269.583333" x2="470" y2="124.583333" stroke="var(--warn-border)" stroke-width="1.5"/>
  <rect x="390" y="52.083333" rx="7.155418" width="160" height="72.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="82.291733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--warn-accent)">2000s</text>
  <text x="470" y="106.4584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">Virtualization</text>

  <!-- Event 4: 2006 AWS S3/EC2 (below) -->
  <rect x="639.008" y="270.674" width="21.9848" height="21.9848" rx="10.9924" fill="url(#grad-danger)" stroke="var(--bg)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="650" y1="293.75" x2="650" y2="414.583333" stroke="var(--danger-border)" stroke-width="1.5"/>
  <rect x="565" y="414.583333" rx="7.155418" width="170" height="72.5" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="444.791733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--danger-accent)">2006</text>
  <text x="650" y="468.9584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">AWS S3 / EC2</text>

  <!-- Event 5: 2013 Docker (above) -->
  <rect x="819.008" y="270.674" width="21.9848" height="21.9848" rx="10.9924" fill="url(#grad-info)" stroke="var(--bg)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="830" y1="269.583333" x2="830" y2="124.583333" stroke="var(--info-border)" stroke-width="1.5"/>
  <rect x="760" y="52.083333" rx="7.155418" width="140" height="72.5" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="830" y="82.291733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--info-accent)">2013</text>
  <text x="830" y="106.4584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">Docker</text>

  <!-- Event 6: 2014 Lambda (below) -->
  <rect x="979.008" y="270.674" width="21.9848" height="21.9848" rx="10.9924" fill="url(#grad-primary)" stroke="var(--bg)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="990" y1="293.75" x2="990" y2="414.583333" stroke="var(--primary-border)" stroke-width="1.5"/>
  <rect x="910" y="414.583333" rx="7.155418" width="160" height="72.5" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="444.791733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--primary-accent)">2014</text>
  <text x="990" y="468.9584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">AWS Lambda</text>

  <!-- Event 7: 2020s AI/Multi-cloud (above) -->
  <rect x="1139.01" y="270.674" width="21.9848" height="21.9848" rx="10.9924" fill="url(#grad-ok)" stroke="var(--bg)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="1150" y1="269.583333" x2="1150" y2="124.583333" stroke="var(--ok-border)" stroke-width="1.5"/>
  <rect x="1060" y="40" rx="7.155418" width="180" height="84.583333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="73.833333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--ok-accent)">2020s</text>
  <text x="1150" y="100.416667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">AI / Multi-cloud</text>

  <!-- Footer -->
  <text x="630" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" fill="var(--text-muted)">Evolution of Cloud Computing</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Timeline main line -->
  <line x1="60" y1="320" x2="1220" y2="320" stroke="var(--border-strong)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Event 1: 1960s Mainframes (above) -->
  <circle cx="120" cy="320" r="10" fill="var(--primary)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="120" y1="310" x2="120" y2="190" stroke="var(--primary)" stroke-width="1.5"/>
  <rect x="50" y="130" rx="8" ry="8" width="140" height="60" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">1960s</text>
  <text x="120" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Mainframes</text>

  <!-- Event 2: 1990s Client-Server (below) -->
  <circle cx="300" cy="320" r="10" fill="var(--ok)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="300" y1="330" x2="300" y2="430" stroke="var(--ok)" stroke-width="1.5"/>
  <rect x="220" y="430" rx="8" ry="8" width="160" height="60" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">1990s</text>
  <text x="300" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Client-Server</text>

  <!-- Event 3: 2000s Virtualization (above) -->
  <circle cx="480" cy="320" r="10" fill="var(--warn)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="480" y1="310" x2="480" y2="190" stroke="var(--warn)" stroke-width="1.5"/>
  <rect x="400" y="130" rx="8" ry="8" width="160" height="60" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)">2000s</text>
  <text x="480" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Virtualization</text>

  <!-- Event 4: 2006 AWS S3/EC2 (below) -->
  <circle cx="660" cy="320" r="10" fill="var(--danger)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="660" y1="330" x2="660" y2="430" stroke="var(--danger)" stroke-width="1.5"/>
  <rect x="575" y="430" rx="8" ry="8" width="170" height="60" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-dk)">2006</text>
  <text x="660" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">AWS S3 / EC2</text>

  <!-- Event 5: 2013 Docker (above) -->
  <circle cx="840" cy="320" r="10" fill="var(--info)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="840" y1="310" x2="840" y2="190" stroke="var(--info)" stroke-width="1.5"/>
  <rect x="770" y="130" rx="8" ry="8" width="140" height="60" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-dk)">2013</text>
  <text x="840" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Docker</text>

  <!-- Event 6: 2014 Lambda (below) -->
  <circle cx="1000" cy="320" r="10" fill="var(--primary)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="1000" y1="330" x2="1000" y2="430" stroke="var(--primary)" stroke-width="1.5"/>
  <rect x="920" y="430" rx="8" ry="8" width="160" height="60" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1000" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">2014</text>
  <text x="1000" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">AWS Lambda</text>

  <!-- Event 7: 2020s AI/Multi-cloud (above) -->
  <circle cx="1160" cy="320" r="10" fill="var(--ok)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="1160" y1="310" x2="1160" y2="190" stroke="var(--ok)" stroke-width="1.5"/>
  <rect x="1070" y="120" rx="8" ry="8" width="180" height="70" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1160" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">2020s</text>
  <text x="1160" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">AI / Multi-cloud</text>

  <!-- Footer -->
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Evolution of Cloud Computing</text>
</svg>
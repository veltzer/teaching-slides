<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Timeline main line -->
  <line x1="50" y1="281.666667" x2="1210" y2="281.666667" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Event 1: 1960s Mainframes (above) -->
  <circle cx="110" cy="281.666667" r="10.992391" fill="var(--primary-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="110" y1="269.583333" x2="110" y2="124.583333" stroke="var(--primary-border)" stroke-width="1.5"/>
  <rect x="40" y="52.083333" rx="7.155418" width="140" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="82.291733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--primary-accent)">1960s</text>
  <text x="110" y="106.4584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">Mainframes</text>

  <!-- Event 2: 1990s Client-Server (below) -->
  <circle cx="290" cy="281.666667" r="10.992391" fill="var(--ok-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="290" y1="293.75" x2="290" y2="414.583333" stroke="var(--ok-border)" stroke-width="1.5"/>
  <rect x="210" y="414.583333" rx="7.155418" width="160" height="72.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="444.791733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--ok-accent)">1990s</text>
  <text x="290" y="468.9584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">Client-Server</text>

  <!-- Event 3: 2000s Virtualization (above) -->
  <circle cx="470" cy="281.666667" r="10.992391" fill="var(--warn-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="470" y1="269.583333" x2="470" y2="124.583333" stroke="var(--warn-border)" stroke-width="1.5"/>
  <rect x="390" y="52.083333" rx="7.155418" width="160" height="72.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="82.291733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--warn-accent)">2000s</text>
  <text x="470" y="106.4584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">Virtualization</text>

  <!-- Event 4: 2006 AWS S3/EC2 (below) -->
  <circle cx="650" cy="281.666667" r="10.992391" fill="var(--danger-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="650" y1="293.75" x2="650" y2="414.583333" stroke="var(--danger-border)" stroke-width="1.5"/>
  <rect x="565" y="414.583333" rx="7.155418" width="170" height="72.5" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="444.791733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--danger-accent)">2006</text>
  <text x="650" y="468.9584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">AWS S3 / EC2</text>

  <!-- Event 5: 2013 Docker (above) -->
  <circle cx="830" cy="281.666667" r="10.992391" fill="var(--info-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="830" y1="269.583333" x2="830" y2="124.583333" stroke="var(--info-border)" stroke-width="1.5"/>
  <rect x="760" y="52.083333" rx="7.155418" width="140" height="72.5" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="830" y="82.291733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--info-accent)">2013</text>
  <text x="830" y="106.4584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">Docker</text>

  <!-- Event 6: 2014 Lambda (below) -->
  <circle cx="990" cy="281.666667" r="10.992391" fill="var(--primary-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="990" y1="293.75" x2="990" y2="414.583333" stroke="var(--primary-border)" stroke-width="1.5"/>
  <rect x="910" y="414.583333" rx="7.155418" width="160" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="444.791733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--primary-accent)">2014</text>
  <text x="990" y="468.9584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">AWS Lambda</text>

  <!-- Event 7: 2020s AI/Multi-cloud (above) -->
  <circle cx="1150" cy="281.666667" r="10.992391" fill="var(--ok-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="1150" y1="269.583333" x2="1150" y2="124.583333" stroke="var(--ok-border)" stroke-width="1.5"/>
  <rect x="1060" y="40" rx="7.155418" width="180" height="84.583333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="73.833333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" font-weight="bold" fill="var(--ok-accent)">2020s</text>
  <text x="1150" y="100.416667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.190893" fill="var(--text-muted)">AI / Multi-cloud</text>

  <!-- Footer -->
  <text x="630" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389395" fill="var(--text-muted)">Evolution of Cloud Computing</text>
</svg>
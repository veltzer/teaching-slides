<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Central circle -->
  <circle cx="640" cy="330" r="82.9568" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="322.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)">Cloud</text>
  <text x="640" y="342.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)">Computing</text>

  <!-- Characteristic 1: On-demand Self-service (top) -->
  <line x1="640" y1="248.4375" x2="640" y2="157.8125" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="640" cy="121.5625" r="50.6958" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="114.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">On-demand</text>
  <text x="640" y="130.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Self-service</text>

  <!-- Characteristic 2: Broad Network Access (top-right) -->
  <line x1="720.625" y1="277.4375" x2="865" y2="166.875" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="902.5" cy="144.2188" r="50.6958" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="902.5" y="136.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Broad Network</text>
  <text x="902.5" y="153.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Access</text>

  <!-- Characteristic 3: Resource Pooling (bottom-right) -->
  <line x1="720.625" y1="382.5625" x2="865" y2="465.9375" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="902.5" cy="493.125" r="50.6958" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="902.5" y="485.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Resource</text>
  <text x="902.5" y="502.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Pooling</text>

  <!-- Characteristic 4: Rapid Elasticity (bottom-left) -->
  <line x1="559.375" y1="382.5625" x2="415" y2="465.9375" stroke="var(--danger-border)" stroke-width="2"/>
  <circle cx="377.5" cy="493.125" r="50.6958" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="377.5" y="485.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--danger-accent)">Rapid</text>
  <text x="377.5" y="502.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--danger-accent)">Elasticity</text>

  <!-- Characteristic 5: Measured Service (top-left) -->
  <line x1="559.375" y1="277.4375" x2="415" y2="166.875" stroke="var(--info-border)" stroke-width="2"/>
  <circle cx="377.5" cy="144.2188" r="50.6958" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="377.5" y="136.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)">Measured</text>
  <text x="377.5" y="153.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)">Service</text>

  <!-- Descriptive labels -->
  <text x="640" y="592.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">NIST SP 800-145 — Five Essential Characteristics of Cloud Computing</text>
</svg>
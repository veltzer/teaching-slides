<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Central circle -->
  <rect x="481.076226" y="235.772" width="317.847548" height="184.368" rx="18.382082" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="319.899396" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.517877" font-weight="bold" fill="var(--bg)">Cloud</text>
  <text x="640" y="342.054474" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.517877" font-weight="bold" fill="var(--bg)">Computing</text>

  <!-- Characteristic 1: On-demand Self-service (top) -->
  <line x1="640" y1="237.321377" x2="640" y2="136.616476" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="542.879341" y="40" width="194.239594" height="112.669" rx="18.382082" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="88.278124" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--primary-accent)">On-demand</text>
  <text x="640" y="106.405006" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--primary-accent)">Self-service</text>

  <!-- Characteristic 2: Broad Network Access (top-right) -->
  <line x1="794.456303" y1="269.546945" x2="1071.040846" y2="146.686966" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="1045.760406" y="65.1763" width="194.239594" height="112.669" rx="18.382082" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1142.880986" y="113.454405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--ok-accent)">Broad Network</text>
  <text x="1142.880986" y="131.581176" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--ok-accent)">Access</text>

  <!-- Characteristic 3: Resource Pooling (bottom-right) -->
  <line x1="794.456303" y1="386.36463" x2="1071.040846" y2="479.013139" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="1045.760406" y="452.89" width="194.239594" height="112.669" rx="18.382082" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1142.880986" y="501.168217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--warn-accent)">Resource</text>
  <text x="1142.880986" y="519.295099" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--warn-accent)">Pooling</text>

  <!-- Characteristic 4: Rapid Elasticity (bottom-left) -->
  <line x1="485.543697" y1="386.36463" x2="208.959154" y2="479.013139" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="40" y="452.89" width="194.239594" height="112.669" rx="18.382082" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.119014" y="501.168217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--danger-accent)">Rapid</text>
  <text x="137.119014" y="519.295099" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--danger-accent)">Elasticity</text>

  <!-- Characteristic 5: Measured Service (top-left) -->
  <line x1="485.543697" y1="269.546945" x2="208.959154" y2="146.686966" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="40" y="65.1763" width="194.239594" height="112.669" rx="18.382082" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.119014" y="113.454405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--info-accent)">Measured</text>
  <text x="137.119014" y="131.581176" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--info-accent)">Service</text>

  <!-- Descriptive labels -->
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.828124" fill="var(--text-muted)">NIST SP 800-145 — Five Essential Characteristics of Cloud Computing</text>
</svg>

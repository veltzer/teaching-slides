<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Central circle -->
  <rect x="481.076226" y="235.772" width="317.847548" height="184.368" rx="18.382082" fill="url(#grad-primary)"/>
  <text x="640" y="319.899396" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.517877" font-weight="bold" fill="var(--bg)">Cloud</text>
  <text x="640" y="342.054474" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.517877" font-weight="bold" fill="var(--bg)">Computing</text>

  <!-- Characteristic 1: On-demand Self-service (top) -->
  <line x1="640" y1="237.321377" x2="640" y2="136.616476" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="542.879341" y="40" width="194.239594" height="112.669" rx="18.382082" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="88.278124" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--primary-accent)">On-demand</text>
  <text x="640" y="106.405006" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--primary-accent)">Self-service</text>

  <!-- Characteristic 2: Broad Network Access (top-right) -->
  <line x1="794.456303" y1="269.546945" x2="1071.040846" y2="146.686966" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="1045.760406" y="65.1763" width="194.239594" height="112.669" rx="18.382082" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1142.880986" y="113.454405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--ok-accent)">Broad Network</text>
  <text x="1142.880986" y="131.581176" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--ok-accent)">Access</text>

  <!-- Characteristic 3: Resource Pooling (bottom-right) -->
  <line x1="794.456303" y1="386.36463" x2="1071.040846" y2="479.013139" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="1045.760406" y="452.89" width="194.239594" height="112.669" rx="18.382082" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1142.880986" y="501.168217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--warn-accent)">Resource</text>
  <text x="1142.880986" y="519.295099" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--warn-accent)">Pooling</text>

  <!-- Characteristic 4: Rapid Elasticity (bottom-left) -->
  <line x1="485.543697" y1="386.36463" x2="208.959154" y2="479.013139" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="40" y="452.89" width="194.239594" height="112.669" rx="18.382082" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.119014" y="501.168217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--danger-accent)">Rapid</text>
  <text x="137.119014" y="519.295099" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--danger-accent)">Elasticity</text>

  <!-- Characteristic 5: Measured Service (top-left) -->
  <line x1="485.543697" y1="269.546945" x2="208.959154" y2="146.686966" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="40" y="65.1763" width="194.239594" height="112.669" rx="18.382082" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.119014" y="113.454405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--info-accent)">Measured</text>
  <text x="137.119014" y="131.581176" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.138372" font-weight="bold" fill="var(--info-accent)">Service</text>

  <!-- Descriptive labels -->
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.828124" fill="var(--text-muted)">NIST SP 800-145 — Five Essential Characteristics of Cloud Computing</text>
</svg>
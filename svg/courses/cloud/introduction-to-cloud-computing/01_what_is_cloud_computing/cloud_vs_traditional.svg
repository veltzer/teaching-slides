<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Divider -->
  <line x1="640" y1="30" x2="640" y2="610" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- VS badge -->
  <circle cx="640" cy="40" r="22" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2"/>
  <text x="640" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)">VS</text>

  <!-- Left: Traditional IT -->
  <rect x="40" y="20" rx="8" ry="8" width="560" height="60" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2"/>
  <text x="320" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-dk)">Traditional IT</text>

  <!-- Right: Cloud Computing -->
  <rect x="680" y="20" rx="8" ry="8" width="560" height="60" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2"/>
  <text x="960" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-dk)">Cloud Computing</text>

  <!-- Row labels and comparison bars -->
  <!-- Row 1: Cost Model -->
  <text x="320" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Cost Model</text>
  <rect x="120" y="135" rx="6" ry="6" width="400" height="40" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="320" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)">CapEx — Large upfront investment</text>

  <text x="960" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Cost Model</text>
  <rect x="760" y="135" rx="6" ry="6" width="400" height="40" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="960" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)">OpEx — Pay as you go</text>

  <!-- Row 2: Provisioning -->
  <text x="320" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Provisioning Time</text>
  <rect x="120" y="225" rx="6" ry="6" width="400" height="40" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="320" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)">Weeks to Months</text>

  <text x="960" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Provisioning Time</text>
  <rect x="760" y="225" rx="6" ry="6" width="400" height="40" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="960" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)">Minutes to Hours</text>

  <!-- Row 3: Capacity -->
  <text x="320" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Capacity</text>
  <rect x="120" y="315" rx="6" ry="6" width="400" height="40" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="320" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)">Fixed — Plan for peak demand</text>

  <text x="960" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Capacity</text>
  <rect x="760" y="315" rx="6" ry="6" width="400" height="40" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="960" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)">Elastic — Scale on demand</text>

  <!-- Row 4: Maintenance -->
  <text x="320" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Maintenance</text>
  <rect x="120" y="405" rx="6" ry="6" width="400" height="40" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="320" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)">In-house team required</text>

  <text x="960" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Maintenance</text>
  <rect x="760" y="405" rx="6" ry="6" width="400" height="40" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="960" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)">Provider-managed infrastructure</text>

  <!-- Row 5: Geographic Reach -->
  <text x="320" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Geographic Reach</text>
  <rect x="120" y="495" rx="6" ry="6" width="400" height="40" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="320" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)">Limited to owned data centers</text>

  <text x="960" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Geographic Reach</text>
  <rect x="760" y="495" rx="6" ry="6" width="400" height="40" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="960" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)">Global regions available instantly</text>

  <!-- Row 6: Innovation -->
  <text x="320" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Innovation Speed</text>
  <rect x="120" y="575" rx="6" ry="6" width="400" height="40" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="320" y="601" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)">Slow — Hardware refresh cycles</text>

  <text x="960" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Innovation Speed</text>
  <rect x="760" y="575" rx="6" ry="6" width="400" height="40" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="960" y="601" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)">Fast — New services continuously</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Divider -->
  <line x1="640" y1="67.1875" x2="640" y2="592.8125" stroke="var(--border)" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- VS badge -->
  <circle cx="640" cy="76.25" r="20.2783" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="81.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text-muted)">VS</text>

  <!-- Left: Traditional IT -->
  <rect x="77.5" y="58.125" rx="6" width="525" height="54.375" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="340" y="91.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--danger-accent)">Traditional IT</text>

  <!-- Right: Cloud Computing -->
  <rect x="677.5" y="58.125" rx="6" width="525" height="54.375" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="91.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--ok-accent)">Cloud Computing</text>

  <!-- Row labels and comparison bars -->
  <!-- Row 1: Cost Model -->
  <text x="340" y="153.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Cost Model</text>
  <rect x="152.5" y="162.3438" rx="6" width="375" height="36.25" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="340" y="185.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">CapEx — Large upfront investment</text>

  <text x="940" y="153.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Cost Model</text>
  <rect x="752.5" y="162.3438" rx="6" width="375" height="36.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="185.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">OpEx — Pay as you go</text>

  <!-- Row 2: Provisioning -->
  <text x="340" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Provisioning Time</text>
  <rect x="152.5" y="243.9062" rx="6" width="375" height="36.25" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="340" y="267.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">Weeks to Months</text>

  <text x="940" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Provisioning Time</text>
  <rect x="752.5" y="243.9062" rx="6" width="375" height="36.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="267.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">Minutes to Hours</text>

  <!-- Row 3: Capacity -->
  <text x="340" y="316.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Capacity</text>
  <rect x="152.5" y="325.4688" rx="6" width="375" height="36.25" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="340" y="349.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">Fixed — Plan for peak demand</text>

  <text x="940" y="316.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Capacity</text>
  <rect x="752.5" y="325.4688" rx="6" width="375" height="36.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="349.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">Elastic — Scale on demand</text>

  <!-- Row 4: Maintenance -->
  <text x="340" y="397.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Maintenance</text>
  <rect x="152.5" y="407.0312" rx="6" width="375" height="36.25" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="340" y="430.5938" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">In-house team required</text>

  <text x="940" y="397.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Maintenance</text>
  <rect x="752.5" y="407.0312" rx="6" width="375" height="36.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="430.5938" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">Provider-managed infrastructure</text>

  <!-- Row 5: Geographic Reach -->
  <text x="340" y="479.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Geographic Reach</text>
  <rect x="152.5" y="488.5938" rx="6" width="375" height="36.25" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="340" y="512.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">Limited to owned data centers</text>

  <text x="940" y="479.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Geographic Reach</text>
  <rect x="752.5" y="488.5938" rx="6" width="375" height="36.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="512.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">Global regions available instantly</text>

  <!-- Row 6: Innovation -->
  <text x="340" y="552.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Innovation Speed</text>
  <rect x="152.5" y="561.0938" rx="6" width="375" height="36.25" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="340" y="584.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">Slow — Hardware refresh cycles</text>

  <text x="940" y="552.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Innovation Speed</text>
  <rect x="752.5" y="561.0938" rx="6" width="375" height="36.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="584.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">Fast — New services continuously</text>
</svg>
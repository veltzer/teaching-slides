<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Divider -->
  <line x1="640" y1="51.968606" x2="640" y2="615.144978" stroke="var(--border)" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- VS badge -->
  <rect x="618.321" y="40" width="43.3571" height="43.3571" rx="14" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="67.504507" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text-muted)">VS</text>

  <!-- Left: Traditional IT -->
  <rect x="40" y="42.258669" rx="6.414308" width="560" height="58.259625" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="78.185385" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.678544" font-weight="bold" fill="var(--danger-accent)">Traditional IT</text>

  <!-- Right: Cloud Computing -->
  <rect x="680" y="42.258669" rx="6.414308" width="560" height="58.259625" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="78.185385" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.678544" font-weight="bold" fill="var(--ok-accent)">Cloud Computing</text>

  <!-- Row labels and comparison bars -->
  <!-- Row 1: Cost Model -->
  <text x="320" y="144.21296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text)">Cost Model</text>
  <rect x="120" y="153.923004" rx="6.414308" width="400" height="38.839751" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="179.168734" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" fill="var(--danger-accent)">CapEx — Large upfront investment</text>

  <text x="960" y="144.21296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text)">Cost Model</text>
  <rect x="760" y="153.923004" rx="6.414308" width="400" height="38.839751" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="179.168734" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" fill="var(--ok-accent)">OpEx — Pay as you go</text>

  <!-- Row 2: Provisioning -->
  <text x="320" y="231.602503" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text)">Provisioning Time</text>
  <rect x="120" y="241.312334" rx="6.414308" width="400" height="38.839751" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="266.558277" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" fill="var(--danger-accent)">Weeks to Months</text>

  <text x="960" y="231.602503" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text)">Provisioning Time</text>
  <rect x="760" y="241.312334" rx="6.414308" width="400" height="38.839751" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="266.558277" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" fill="var(--ok-accent)">Minutes to Hours</text>

  <!-- Row 3: Capacity -->
  <text x="320" y="318.991833" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text)">Capacity</text>
  <rect x="120" y="328.701878" rx="6.414308" width="400" height="38.839751" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="353.947608" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" fill="var(--danger-accent)">Fixed — Plan for peak demand</text>

  <text x="960" y="318.991833" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text)">Capacity</text>
  <rect x="760" y="328.701878" rx="6.414308" width="400" height="38.839751" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="353.947608" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" fill="var(--ok-accent)">Elastic — Scale on demand</text>

  <!-- Row 4: Maintenance -->
  <text x="320" y="406.381377" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text)">Maintenance</text>
  <rect x="120" y="416.091206" rx="6.414308" width="400" height="38.839751" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="441.337151" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" fill="var(--danger-accent)">In-house team required</text>

  <text x="960" y="406.381377" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text)">Maintenance</text>
  <rect x="760" y="416.091206" rx="6.414308" width="400" height="38.839751" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="441.337151" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" fill="var(--ok-accent)">Provider-managed infrastructure</text>

  <!-- Row 5: Geographic Reach -->
  <text x="320" y="493.770707" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text)">Geographic Reach</text>
  <rect x="120" y="503.48075" rx="6.414308" width="400" height="38.839751" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="528.72648" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" fill="var(--danger-accent)">Limited to owned data centers</text>

  <text x="960" y="493.770707" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text)">Geographic Reach</text>
  <rect x="760" y="503.48075" rx="6.414308" width="400" height="38.839751" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="528.72648" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" fill="var(--ok-accent)">Global regions available instantly</text>

  <!-- Row 6: Innovation -->
  <text x="320" y="571.450206" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text)">Innovation Speed</text>
  <rect x="120" y="581.160249" rx="6.414308" width="400" height="38.839751" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="606.40598" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" fill="var(--danger-accent)">Slow — Hardware refresh cycles</text>

  <text x="960" y="571.450206" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" font-weight="bold" fill="var(--text)">Innovation Speed</text>
  <rect x="760" y="581.160249" rx="6.414308" width="400" height="38.839751" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="606.40598" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.795467" fill="var(--ok-accent)">Fast — New services continuously</text>
</svg>

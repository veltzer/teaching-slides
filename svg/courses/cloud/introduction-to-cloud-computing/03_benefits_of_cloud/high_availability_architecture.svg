<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Load Balancer at top -->
  <rect x="490" y="20" rx="6" width="300" height="50" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Global Load Balancer</text>

  <!-- Lines from LB to AZs -->
  <line x1="560" y1="70" x2="320" y2="120" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="720" y1="70" x2="960" y2="120" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- AZ 1 -->
  <rect x="60" y="120" rx="6" width="520" height="420" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="320" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Availability Zone A</text>

  <!-- AZ1 Web tier -->
  <rect x="100" y="170" rx="6" width="200" height="45" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Web Server 1</text>

  <rect x="340" y="170" rx="6" width="200" height="45" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Web Server 2</text>

  <!-- AZ1 App tier -->
  <rect x="100" y="240" rx="6" width="200" height="45" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">App Server 1</text>

  <rect x="340" y="240" rx="6" width="200" height="45" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">App Server 2</text>

  <!-- AZ1 DB -->
  <rect x="180" y="310" rx="6" width="280" height="50" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-accent)">Database Primary</text>

  <!-- AZ1 SLA -->
  <rect x="200" y="390" rx="6" width="240" height="36" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="320" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">Single AZ: 99.9% SLA</text>

  <!-- AZ 2 -->
  <rect x="700" y="120" rx="6" width="520" height="420" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="960" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Availability Zone B</text>

  <!-- AZ2 Web tier -->
  <rect x="740" y="170" rx="6" width="200" height="45" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Web Server 3</text>

  <rect x="980" y="170" rx="6" width="200" height="45" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Web Server 4</text>

  <!-- AZ2 App tier -->
  <rect x="740" y="240" rx="6" width="200" height="45" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">App Server 3</text>

  <rect x="980" y="240" rx="6" width="200" height="45" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">App Server 4</text>

  <!-- AZ2 DB -->
  <rect x="820" y="310" rx="6" width="280" height="50" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-accent)">Database Replica</text>

  <!-- AZ2 SLA -->
  <rect x="840" y="390" rx="6" width="240" height="36" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="960" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">Single AZ: 99.9% SLA</text>

  <!-- Failover arrows between AZs -->
  <line x1="580" y1="335" x2="700" y2="335" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="640" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)">Replication</text>

  <!-- Combined SLA -->
  <rect x="430" y="560" rx="6" width="420" height="50" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-accent)">Multi-AZ Combined: 99.99% SLA</text>

  <!-- Arrows from AZs to combined -->
  <line x1="320" y1="540" x2="520" y2="570" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="960" y1="540" x2="760" y2="570" stroke="var(--ok-border)" stroke-width="1.5"/>
</svg>
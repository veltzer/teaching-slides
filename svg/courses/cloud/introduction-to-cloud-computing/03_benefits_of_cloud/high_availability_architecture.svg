<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Load Balancer at top -->
  <rect x="490" y="20" rx="8" ry="8" width="300" height="50" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Global Load Balancer</text>

  <!-- Lines from LB to AZs -->
  <line x1="560" y1="70" x2="320" y2="120" stroke="var(--primary)" stroke-width="2"/>
  <line x1="720" y1="70" x2="960" y2="120" stroke="var(--primary)" stroke-width="2"/>

  <!-- AZ 1 -->
  <rect x="60" y="120" rx="10" ry="10" width="520" height="420" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
  <text x="320" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)">Availability Zone A</text>

  <!-- AZ1 Web tier -->
  <rect x="100" y="170" rx="6" ry="6" width="200" height="45" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Web Server 1</text>

  <rect x="340" y="170" rx="6" ry="6" width="200" height="45" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Web Server 2</text>

  <!-- AZ1 App tier -->
  <rect x="100" y="240" rx="6" ry="6" width="200" height="45" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">App Server 1</text>

  <rect x="340" y="240" rx="6" ry="6" width="200" height="45" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">App Server 2</text>

  <!-- AZ1 DB -->
  <rect x="180" y="310" rx="6" ry="6" width="280" height="50" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-dk)">Database Primary</text>

  <!-- AZ1 SLA -->
  <rect x="200" y="390" rx="12" ry="12" width="240" height="36" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="320" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">Single AZ: 99.9% SLA</text>

  <!-- AZ 2 -->
  <rect x="700" y="120" rx="10" ry="10" width="520" height="420" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
  <text x="960" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)">Availability Zone B</text>

  <!-- AZ2 Web tier -->
  <rect x="740" y="170" rx="6" ry="6" width="200" height="45" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Web Server 3</text>

  <rect x="980" y="170" rx="6" ry="6" width="200" height="45" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1080" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Web Server 4</text>

  <!-- AZ2 App tier -->
  <rect x="740" y="240" rx="6" ry="6" width="200" height="45" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">App Server 3</text>

  <rect x="980" y="240" rx="6" ry="6" width="200" height="45" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1080" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">App Server 4</text>

  <!-- AZ2 DB -->
  <rect x="820" y="310" rx="6" ry="6" width="280" height="50" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="960" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-dk)">Database Replica</text>

  <!-- AZ2 SLA -->
  <rect x="840" y="390" rx="12" ry="12" width="240" height="36" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="960" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">Single AZ: 99.9% SLA</text>

  <!-- Failover arrows between AZs -->
  <line x1="580" y1="335" x2="700" y2="335" stroke="var(--danger)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="640" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--danger)">Replication</text>

  <!-- Combined SLA -->
  <rect x="430" y="560" rx="12" ry="12" width="420" height="50" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-dk)">Multi-AZ Combined: 99.99% SLA</text>

  <!-- Arrows from AZs to combined -->
  <line x1="320" y1="540" x2="520" y2="570" stroke="var(--ok)" stroke-width="1.5"/>
  <line x1="960" y1="540" x2="760" y2="570" stroke="var(--ok)" stroke-width="1.5"/>
</svg>
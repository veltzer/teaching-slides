<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Divider -->
  <line x1="640" y1="67.1875" x2="640" y2="592.8125" stroke="var(--border)" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Left Panel: Scale Up (Vertical) -->
  <rect x="96.25" y="67.1875" rx="6" width="506.25" height="45.3125" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="349.375" y="96.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--primary-accent)">Scale Up (Vertical Scaling)</text>

  <!-- Small server before -->
  <rect x="171.25" y="357.1875" rx="6" width="93.75" height="108.75" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.125" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">2 CPU</text>
  <text x="218.125" y="420.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">4 GB</text>
  <text x="218.125" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">RAM</text>
  <text x="218.125" y="493.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Before</text>

  <!-- Arrow -->
  <line x1="293.125" y1="402.5" x2="368.125" y2="402.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330.625" y="388.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--primary-accent)">+</text>

  <!-- Large server after -->
  <rect x="386.875" y="293.75" rx="6" width="140.625" height="172.1875" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="457.1875" y="357.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">16 CPU</text>
  <text x="457.1875" y="379.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">64 GB</text>
  <text x="457.1875" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">RAM</text>
  <text x="457.1875" y="493.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">After</text>

  <!-- Up arrow -->
  <line x1="330.625" y1="293.75" x2="330.625" y2="185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330.625" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">More Power</text>

  <!-- Characteristics -->
  <text x="349.375" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Bigger machine, same count</text>
  <text x="349.375" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Hardware limits apply</text>

  <!-- Right Panel: Scale Out (Horizontal) -->
  <rect x="677.5" y="67.1875" rx="6" width="506.25" height="45.3125" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="930.625" y="96.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--ok-accent)">Scale Out (Horizontal Scaling)</text>

  <!-- Load Balancer -->
  <rect x="874.375" y="139.6875" rx="6" width="112.5" height="40.7812" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.625" y="165.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Load Balancer</text>

  <!-- Lines from LB to servers -->
  <line x1="902.5" y1="180.4688" x2="761.875" y2="257.5" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="930.625" y1="180.4688" x2="874.375" y2="257.5" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="930.625" y1="180.4688" x2="986.875" y2="257.5" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="958.75" y1="180.4688" x2="1099.375" y2="257.5" stroke="var(--ok-border)" stroke-width="1.5"/>

  <!-- Server 1 -->
  <rect x="715" y="257.5" rx="6" width="93.75" height="72.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="761.875" y="289.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">Server 1</text>
  <text x="761.875" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">2 CPU / 4 GB</text>

  <!-- Server 2 -->
  <rect x="827.5" y="257.5" rx="6" width="93.75" height="72.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="874.375" y="289.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">Server 2</text>
  <text x="874.375" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">2 CPU / 4 GB</text>

  <!-- Server 3 -->
  <rect x="940" y="257.5" rx="6" width="93.75" height="72.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="986.875" y="289.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">Server 3</text>
  <text x="986.875" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">2 CPU / 4 GB</text>

  <!-- Server 4 (new, dashed) -->
  <rect x="1052.5" y="257.5" rx="6" width="93.75" height="72.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5,3" filter="url(#shadow)"/>
  <text x="1099.375" y="289.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">Server N</text>
  <text x="1099.375" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">2 CPU / 4 GB</text>

  <!-- Right arrow showing growth -->
  <line x1="771.25" y1="375.3125" x2="1099.375" y2="375.3125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="930.625" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">More Instances</text>

  <!-- Characteristics -->
  <text x="930.625" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Add more machines, same size</text>
  <text x="930.625" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Virtually unlimited scaling</text>
</svg>
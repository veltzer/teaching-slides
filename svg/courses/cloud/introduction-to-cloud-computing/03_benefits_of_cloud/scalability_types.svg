<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Divider -->
  <line x1="640" y1="30" x2="640" y2="610" stroke="var(--border)" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Left Panel: Scale Up (Vertical) -->
  <rect x="60" y="30" rx="6" width="540" height="50" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="330" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-accent)">Scale Up (Vertical Scaling)</text>

  <!-- Small server before -->
  <rect x="140" y="350" rx="6" width="100" height="120" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">2 CPU</text>
  <text x="190" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">4 GB</text>
  <text x="190" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">RAM</text>
  <text x="190" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Before</text>

  <!-- Arrow -->
  <line x1="270" y1="400" x2="350" y2="400" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-accent)">+</text>

  <!-- Large server after -->
  <rect x="370" y="280" rx="6" width="150" height="190" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="445" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">16 CPU</text>
  <text x="445" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">64 GB</text>
  <text x="445" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">RAM</text>
  <text x="445" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">After</text>

  <!-- Up arrow -->
  <line x1="310" y1="280" x2="310" y2="160" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">More Power</text>

  <!-- Characteristics -->
  <text x="330" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Bigger machine, same count</text>
  <text x="330" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Hardware limits apply</text>

  <!-- Right Panel: Scale Out (Horizontal) -->
  <rect x="680" y="30" rx="6" width="540" height="50" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="950" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-accent)">Scale Out (Horizontal Scaling)</text>

  <!-- Load Balancer -->
  <rect x="890" y="110" rx="6" width="120" height="45" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-accent)">Load Balancer</text>

  <!-- Lines from LB to servers -->
  <line x1="920" y1="155" x2="770" y2="240" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="950" y1="155" x2="890" y2="240" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="950" y1="155" x2="1010" y2="240" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="980" y1="155" x2="1130" y2="240" stroke="var(--ok-border)" stroke-width="1.5"/>

  <!-- Server 1 -->
  <rect x="720" y="240" rx="6" width="100" height="80" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">Server 1</text>
  <text x="770" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">2 CPU / 4 GB</text>

  <!-- Server 2 -->
  <rect x="840" y="240" rx="6" width="100" height="80" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">Server 2</text>
  <text x="890" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">2 CPU / 4 GB</text>

  <!-- Server 3 -->
  <rect x="960" y="240" rx="6" width="100" height="80" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">Server 3</text>
  <text x="1010" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">2 CPU / 4 GB</text>

  <!-- Server 4 (new, dashed) -->
  <rect x="1080" y="240" rx="6" width="100" height="80" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5,3" filter="url(#shadow)"/>
  <text x="1130" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">Server N</text>
  <text x="1130" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">2 CPU / 4 GB</text>

  <!-- Right arrow showing growth -->
  <line x1="780" y1="370" x2="1130" y2="370" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="950" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">More Instances</text>

  <!-- Characteristics -->
  <text x="950" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Add more machines, same size</text>
  <text x="950" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Virtually unlimited scaling</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Divider -->
  <line x1="640" y1="30" x2="640" y2="610" stroke="var(--border)" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Left Panel: Scale Up (Vertical) -->
  <rect x="60" y="30" rx="10" ry="10" width="540" height="50" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
  <text x="330" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)">Scale Up (Vertical Scaling)</text>

  <!-- Small server before -->
  <rect x="140" y="350" rx="6" ry="6" width="100" height="120" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">2 CPU</text>
  <text x="190" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">4 GB</text>
  <text x="190" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">RAM</text>
  <text x="190" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Before</text>

  <!-- Arrow -->
  <line x1="270" y1="400" x2="350" y2="400" stroke="var(--primary)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="310" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary)">+</text>

  <!-- Large server after -->
  <rect x="370" y="280" rx="6" ry="6" width="150" height="190" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="3" filter="url(#shadow)"/>
  <text x="445" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">16 CPU</text>
  <text x="445" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">64 GB</text>
  <text x="445" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">RAM</text>
  <text x="445" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">After</text>

  <!-- Up arrow -->
  <line x1="310" y1="280" x2="310" y2="160" stroke="var(--primary)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="310" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">More Power</text>

  <!-- Characteristics -->
  <text x="330" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Bigger machine, same count</text>
  <text x="330" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Hardware limits apply</text>

  <!-- Right Panel: Scale Out (Horizontal) -->
  <rect x="680" y="30" rx="10" ry="10" width="540" height="50" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2"/>
  <text x="950" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-dk)">Scale Out (Horizontal Scaling)</text>

  <!-- Load Balancer -->
  <rect x="890" y="110" rx="8" ry="8" width="120" height="45" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-dk)">Load Balancer</text>

  <!-- Lines from LB to servers -->
  <line x1="920" y1="155" x2="770" y2="240" stroke="var(--ok)" stroke-width="1.5"/>
  <line x1="950" y1="155" x2="890" y2="240" stroke="var(--ok)" stroke-width="1.5"/>
  <line x1="950" y1="155" x2="1010" y2="240" stroke="var(--ok)" stroke-width="1.5"/>
  <line x1="980" y1="155" x2="1130" y2="240" stroke="var(--ok)" stroke-width="1.5"/>

  <!-- Server 1 -->
  <rect x="720" y="240" rx="6" ry="6" width="100" height="80" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)">Server 1</text>
  <text x="770" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)">2 CPU / 4 GB</text>

  <!-- Server 2 -->
  <rect x="840" y="240" rx="6" ry="6" width="100" height="80" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)">Server 2</text>
  <text x="890" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)">2 CPU / 4 GB</text>

  <!-- Server 3 -->
  <rect x="960" y="240" rx="6" ry="6" width="100" height="80" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)">Server 3</text>
  <text x="1010" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)">2 CPU / 4 GB</text>

  <!-- Server 4 (new, dashed) -->
  <rect x="1080" y="240" rx="6" ry="6" width="100" height="80" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5,3" filter="url(#shadow)"/>
  <text x="1130" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)">Server N</text>
  <text x="1130" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)">2 CPU / 4 GB</text>

  <!-- Right arrow showing growth -->
  <line x1="780" y1="370" x2="1130" y2="370" stroke="var(--ok)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="950" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">More Instances</text>

  <!-- Characteristics -->
  <text x="950" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Add more machines, same size</text>
  <text x="950" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Virtually unlimited scaling</text>
</svg>
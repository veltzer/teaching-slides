<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>

  <!-- Column 1: Compute (primary) -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="250" height="520" rx="16" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Clock icon -->
    <circle cx="125" cy="100" r="50" fill="var(--primary)" opacity="0.15" stroke="var(--primary)" stroke-width="2"/>
    <circle cx="125" cy="100" r="4" fill="var(--primary)"/>
    <line x1="125" y1="100" x2="125" y2="70" stroke="var(--primary)" stroke-width="3" stroke-linecap="round"/>
    <line x1="125" y1="100" x2="145" y2="110" stroke="var(--primary)" stroke-width="3" stroke-linecap="round"/>
    <!-- 12, 3, 6, 9 ticks -->
    <line x1="125" y1="55" x2="125" y2="60" stroke="var(--primary)" stroke-width="2"/>
    <line x1="170" y1="100" x2="165" y2="100" stroke="var(--primary)" stroke-width="2"/>
    <line x1="125" y1="145" x2="125" y2="140" stroke="var(--primary)" stroke-width="2"/>
    <line x1="80" y1="100" x2="85" y2="100" stroke="var(--primary)" stroke-width="2"/>
    <text x="125" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--primary-dk)">Compute</text>
    <rect x="30" y="240" width="190" height="60" rx="10" fill="var(--primary)" opacity="0.12"/>
    <text x="125" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--text-dark)">Per-Second</text>
    <text x="125" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">VMs, containers,</text>
    <text x="125" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">serverless functions</text>
    <text x="125" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">billed by CPU time</text>
    <text x="125" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Pay only while running</text>
  </g>

  <!-- Column 2: Storage (ok) -->
  <g transform="translate(370, 60)">
    <rect x="0" y="0" width="250" height="520" rx="16" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Disk icon -->
    <rect x="75" y="55" width="100" height="80" rx="10" fill="var(--ok)" opacity="0.15" stroke="var(--ok)" stroke-width="2"/>
    <line x1="85" y1="80" x2="165" y2="80" stroke="var(--ok)" stroke-width="2"/>
    <circle cx="150" cy="115" r="6" fill="none" stroke="var(--ok)" stroke-width="2"/>
    <rect x="90" y="108" width="30" height="14" rx="3" fill="var(--ok)" opacity="0.3"/>
    <text x="125" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--ok-dk)">Storage</text>
    <rect x="30" y="240" width="190" height="60" rx="10" fill="var(--ok)" opacity="0.12"/>
    <text x="125" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--text-dark)">Per-GB / Month</text>
    <text x="125" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Object, block, file</text>
    <text x="125" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">storage charged by</text>
    <text x="125" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">volume stored</text>
    <text x="125" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Tiered pricing by class</text>
  </g>

  <!-- Column 3: Data Transfer (warn) -->
  <g transform="translate(660, 60)">
    <rect x="0" y="0" width="250" height="520" rx="16" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Arrow icon (outbound) -->
    <circle cx="125" cy="100" r="50" fill="var(--warn)" opacity="0.15" stroke="var(--warn)" stroke-width="2"/>
    <line x1="95" y1="100" x2="155" y2="100" stroke="var(--warn)" stroke-width="4" stroke-linecap="round"/>
    <polyline points="140,85 158,100 140,115" fill="none" stroke="var(--warn)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="125" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--warn-dk)">Data Transfer</text>
    <rect x="30" y="240" width="190" height="60" rx="10" fill="var(--warn)" opacity="0.12"/>
    <text x="125" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--text-dark)">Per-GB Out</text>
    <text x="125" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Egress traffic billed,</text>
    <text x="125" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">ingress usually free.</text>
    <text x="125" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Cross-region costs</text>
    <text x="125" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Often the hidden cost</text>
  </g>

  <!-- Column 4: Requests (info) -->
  <g transform="translate(950, 60)">
    <rect x="0" y="0" width="250" height="520" rx="16" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
    <!-- API icon -->
    <rect x="80" y="60" width="90" height="75" rx="8" fill="var(--info)" opacity="0.15" stroke="var(--info)" stroke-width="2"/>
    <text x="125" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info)">API</text>
    <line x1="95" y1="105" x2="155" y2="105" stroke="var(--info)" stroke-width="1.5"/>
    <text x="125" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info)">{ }</text>
    <text x="125" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--info-dk)">Requests</text>
    <rect x="30" y="240" width="190" height="60" rx="10" fill="var(--info)" opacity="0.12"/>
    <text x="125" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--text-dark)">Per-Call</text>
    <text x="125" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">API calls, read/write</text>
    <text x="125" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">operations, messages</text>
    <text x="125" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">billed per request</text>
    <text x="125" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Often includes free tier</text>
  </g>
</svg>
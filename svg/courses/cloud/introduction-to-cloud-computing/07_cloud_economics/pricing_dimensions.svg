<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Column 1: Compute (primary) -->
  <g transform="translate(80, 60)">
    <rect x="40" y="40" width="234.375" height="471.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Clock icon -->
    <circle cx="157.1875" cy="130.625" r="46.0871" fill="var(--primary-fill)" opacity="0.15" stroke="var(--primary-border)" stroke-width="2"/>
    <circle cx="157.1875" cy="130.625" r="3.687" fill="var(--primary-fill)"/>
    <line x1="157.1875" y1="130.625" x2="157.1875" y2="103.4375" stroke="var(--primary-border)" stroke-width="2" stroke-linecap="round"/>
    <line x1="157.1875" y1="130.625" x2="175.9375" y2="139.6875" stroke="var(--primary-border)" stroke-width="2" stroke-linecap="round"/>
    <!-- 12, 3, 6, 9 ticks -->
    <line x1="157.1875" y1="89.8438" x2="157.1875" y2="94.375" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="199.375" y1="130.625" x2="194.6875" y2="130.625" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="157.1875" y1="171.4062" x2="157.1875" y2="166.875" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="115" y1="130.625" x2="119.6875" y2="130.625" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="157.1875" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.8088" font-weight="bold" fill="var(--primary-accent)">Compute</text>
    <rect x="68.125" y="257.5" width="178.125" height="54.375" rx="6" fill="var(--primary-fill)" opacity="0.12" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="157.1875" y="291.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--text)">Per-Second</text>
    <text x="157.1875" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">VMs, containers,</text>
    <text x="157.1875" y="388.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">serverless functions</text>
    <text x="157.1875" y="411.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">billed by CPU time</text>
    <text x="157.1875" y="465.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Pay only while running</text>
  </g>

  <!-- Column 2: Storage (ok) -->
  <g transform="translate(370, 60)">
    <rect x="40" y="40" width="234.375" height="471.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Disk icon -->
    <rect x="110.3125" y="89.8438" width="93.75" height="72.5" rx="6" fill="var(--ok-fill)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2"/>
    <line x1="119.6875" y1="112.5" x2="194.6875" y2="112.5" stroke="var(--ok-border)" stroke-width="2"/>
    <circle cx="180.625" cy="144.2188" r="5.5305" fill="none" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="124.375" y="137.875" width="28.125" height="12.6875" rx="6" fill="var(--ok-fill)" opacity="0.3" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="157.1875" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.8088" font-weight="bold" fill="var(--ok-accent)">Storage</text>
    <rect x="68.125" y="257.5" width="178.125" height="54.375" rx="6" fill="var(--ok-fill)" opacity="0.12" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="157.1875" y="291.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--text)">Per-GB / Month</text>
    <text x="157.1875" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">Object, block, file</text>
    <text x="157.1875" y="388.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">storage charged by</text>
    <text x="157.1875" y="411.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">volume stored</text>
    <text x="157.1875" y="465.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Tiered pricing by class</text>
  </g>

  <!-- Column 3: Data Transfer (warn) -->
  <g transform="translate(660, 60)">
    <rect x="40" y="40" width="234.375" height="471.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Arrow icon (outbound) -->
    <circle cx="157.1875" cy="130.625" r="46.0871" fill="var(--warn-fill)" opacity="0.15" stroke="var(--warn-border)" stroke-width="2"/>
    <line x1="129.0625" y1="130.625" x2="185.3125" y2="130.625" stroke="var(--warn-border)" stroke-width="2" stroke-linecap="round"/>
    <polyline points="171.25,117.0312 188.125,130.625 171.25,144.2188" fill="none" stroke="var(--warn-border)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="157.1875" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.8088" font-weight="bold" fill="var(--warn-accent)">Data Transfer</text>
    <rect x="68.125" y="257.5" width="178.125" height="54.375" rx="6" fill="var(--warn-fill)" opacity="0.12" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="157.1875" y="291.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--text)">Per-GB Out</text>
    <text x="157.1875" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">Egress traffic billed,</text>
    <text x="157.1875" y="388.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">ingress usually free.</text>
    <text x="157.1875" y="411.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">Cross-region costs</text>
    <text x="157.1875" y="465.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Often the hidden cost</text>
  </g>

  <!-- Column 4: Requests (info) -->
  <g transform="translate(950, 60)">
    <rect x="40" y="40" width="234.375" height="471.25" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <!-- API icon -->
    <rect x="115" y="94.375" width="84.375" height="67.9688" rx="6" fill="var(--info-fill)" opacity="0.15" stroke="var(--info-border)" stroke-width="2"/>
    <text x="157.1875" y="124.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--info-accent)">API</text>
    <line x1="129.0625" y1="135.1562" x2="185.3125" y2="135.1562" stroke="var(--info-border)" stroke-width="1.5"/>
    <text x="157.1875" y="153.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">{ }</text>
    <text x="157.1875" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.8088" font-weight="bold" fill="var(--info-accent)">Requests</text>
    <rect x="68.125" y="257.5" width="178.125" height="54.375" rx="6" fill="var(--info-fill)" opacity="0.12" stroke="var(--info-border)" stroke-width="2"/>
    <text x="157.1875" y="291.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--text)">Per-Call</text>
    <text x="157.1875" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">API calls, read/write</text>
    <text x="157.1875" y="388.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">operations, messages</text>
    <text x="157.1875" y="411.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)">billed per request</text>
    <text x="157.1875" y="465.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">Often includes free tier</text>
  </g>
</svg>
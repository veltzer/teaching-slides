<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Column 1: Compute (primary) -->
  <g transform="translate(80, 60)">
    <rect x="-40.005505" y="-20" width="329.94013" height="580" rx="7.897719" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Clock icon -->
    <rect x="64.268395" y="30.907" width="121.392494" height="121.263" rx="14.007474" fill="var(--primary-fill)" opacity="0.15" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="120.109163" y="86.6879" width="9.711479" height="9.70112" rx="4.85315" fill="var(--primary-fill)" filter="url(#shadow)"/>
    <line x1="124.964559" y1="91.538462" x2="124.964559" y2="58.076923" stroke="var(--primary-border)" stroke-width="2" stroke-linecap="round"/>
    <line x1="124.964559" y1="91.538462" x2="151.35977" y2="102.692308" stroke="var(--primary-border)" stroke-width="2" stroke-linecap="round"/>
    <!-- 12, 3, 6, 9 ticks -->
    <line x1="124.964559" y1="41.346216" x2="124.964559" y2="46.923077" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="184.353785" y1="91.538462" x2="177.754985" y2="91.538462" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="124.964559" y1="141.730708" x2="124.964559" y2="136.153846" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="65.575335" y1="91.538462" x2="72.17414" y2="91.538462" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="124.964559" y="203.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.971759" font-weight="bold" fill="var(--primary-accent)">Compute</text>
    <rect x="-0.41269" y="247.692308" width="250.754497" height="66.923077" rx="7.897719" fill="var(--primary-fill)" opacity="0.12" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="124.964559" y="290.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.265599" fill="var(--text)">Per-Second</text>
    <text x="124.964559" y="381.538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.412453" fill="var(--text-muted)">VMs, containers,</text>
    <text x="124.964559" y="409.423016" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.412453" fill="var(--text-muted)">serverless functions</text>
    <text x="124.964559" y="437.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.412453" fill="var(--text-muted)">billed by CPU time</text>
    <text x="124.964559" y="504.230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.985881" fill="var(--text-faint)">Pay only while running</text>
  </g>

  <!-- Column 2: Storage (ok) -->
  <g transform="translate(370, 60)">
    <rect x="-40.005505" y="-20" width="329.94013" height="580" rx="7.897719" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Disk icon -->
    <rect x="58.976535" y="41.346216" width="131.97605" height="89.230769" rx="7.897719" fill="var(--ok-fill)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <line x1="72.17414" y1="69.230769" x2="177.754985" y2="69.230769" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="150.674771" y="100.993" width="14.567239" height="14.5517" rx="7.279713" fill="none" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="78.772944" y="100.461539" width="39.592817" height="15.615385" rx="7.897719" fill="var(--ok-fill)" opacity="0.3" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="124.964559" y="203.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.971759" font-weight="bold" fill="var(--ok-accent)">Storage</text>
    <rect x="-0.41269" y="247.692308" width="250.754497" height="66.923077" rx="7.897719" fill="var(--ok-fill)" opacity="0.12" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="124.964559" y="290.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.265599" fill="var(--text)">Per-GB / Month</text>
    <text x="124.964559" y="381.538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.412453" fill="var(--text-muted)">Object, block, file</text>
    <text x="124.964559" y="409.423016" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.412453" fill="var(--text-muted)">storage charged by</text>
    <text x="124.964559" y="437.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.412453" fill="var(--text-muted)">volume stored</text>
    <text x="124.964559" y="504.230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.985881" fill="var(--text-faint)">Tiered pricing by class</text>
  </g>

  <!-- Column 3: Data Transfer (warn) -->
  <g transform="translate(660, 60)">
    <rect x="-40.005505" y="-20" width="329.94013" height="580" rx="7.897719" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Arrow icon (outbound) -->
    <rect x="64.268395" y="30.907" width="121.392494" height="121.263" rx="14.007474" fill="var(--warn-fill)" opacity="0.15" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <line x1="85.371748" y1="91.538462" x2="164.557377" y2="91.538462" stroke="var(--warn-border)" stroke-width="2" stroke-linecap="round"/>
    <polyline points="144.760968,74.807631 168.516659,91.538462 144.760968,108.269292" fill="none" stroke="var(--warn-border)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124.964559" y="203.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.971759" font-weight="bold" fill="var(--warn-accent)">Data Transfer</text>
    <rect x="-0.41269" y="247.692308" width="250.754497" height="66.923077" rx="7.897719" fill="var(--warn-fill)" opacity="0.12" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="124.964559" y="290.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.265599" fill="var(--text)">Per-GB Out</text>
    <text x="124.964559" y="381.538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.412453" fill="var(--text-muted)">Egress traffic billed,</text>
    <text x="124.964559" y="409.423016" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.412453" fill="var(--text-muted)">ingress usually free.</text>
    <text x="124.964559" y="437.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.412453" fill="var(--text-muted)">Cross-region costs</text>
    <text x="124.964559" y="504.230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.985881" fill="var(--text-faint)">Often the hidden cost</text>
  </g>

  <!-- Column 4: Requests (info) -->
  <g transform="translate(950, 60)">
    <rect x="-40.005505" y="-20" width="329.94013" height="580" rx="7.897719" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <!-- API icon -->
    <rect x="65.575335" y="46.923077" width="118.778449" height="83.653908" rx="7.897719" fill="var(--info-fill)" opacity="0.15" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="124.964559" y="83.730708" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.985881" font-weight="bold" fill="var(--info-accent)">API</text>
    <line x1="85.371748" y1="97.115323" x2="164.557377" y2="97.115323" stroke="var(--info-border)" stroke-width="1.5"/>
    <text x="124.964559" y="119.423016" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.559311" fill="var(--info-accent)">{ }</text>
    <text x="124.964559" y="203.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.971759" font-weight="bold" fill="var(--info-accent)">Requests</text>
    <rect x="-0.41269" y="247.692308" width="250.754497" height="66.923077" rx="7.897719" fill="var(--info-fill)" opacity="0.12" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="124.964559" y="290.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.265599" fill="var(--text)">Per-Call</text>
    <text x="124.964559" y="381.538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.412453" fill="var(--text-muted)">API calls, read/write</text>
    <text x="124.964559" y="409.423016" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.412453" fill="var(--text-muted)">operations, messages</text>
    <text x="124.964559" y="437.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.412453" fill="var(--text-muted)">billed per request</text>
    <text x="124.964559" y="504.230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.985881" fill="var(--text-faint)">Often includes free tier</text>
  </g>
</svg>
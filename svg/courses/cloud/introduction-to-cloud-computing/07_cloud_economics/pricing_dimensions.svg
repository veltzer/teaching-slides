<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Column 1: Compute (primary) -->
  <g transform="translate(80, 60)">
    <rect x="-40.000000000003" y="-20" width="329.999999999964" height="580" rx="7.898435068552" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Clock icon -->
    <rect x="64.292822273873" y="30.907" width="121.41452345664" height="121.263" rx="14.008744577035" fill="url(#grad-primary)" opacity="0.15" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="120.143723029728" y="86.6879" width="9.713241958644" height="9.70112" rx="4.853589950149" fill="url(#grad-primary)" filter="url(#shadow)"/>
    <line x1="125.000001000011" y1="91.538462" x2="125.000001000011" y2="58.076923" stroke="var(--primary-border)" stroke-width="2" stroke-linecap="round"/>
    <line x1="125.000001000011" y1="91.538462" x2="151.399999679971" y2="102.692308" stroke="var(--primary-border)" stroke-width="2" stroke-linecap="round"/>
    <!-- 12, 3, 6, 9 ticks -->
    <line x1="125.000001000011" y1="41.346216" x2="125.000001000011" y2="46.923077" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="184.400004280089" y1="91.538462" x2="177.800005360119" y2="91.538462" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="125.000001000011" y1="141.730708" x2="125.000001000011" y2="136.153846" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="65.599999719982" y1="91.538462" x2="72.200001640036" y2="91.538462" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="125.000001000011" y="203.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.974840647215" font-weight="bold" fill="var(--primary-accent)">Compute</text>
    <rect x="-0.400000480017" y="247.692308" width="250.799997959913" height="66.923077" rx="7.898435068552" fill="url(#grad-primary)" opacity="0.12" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="125.000001000011" y="290.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.267799748755" fill="var(--text)">Per-Second</text>
    <text x="125.000001000011" y="381.538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.414214798669" fill="var(--text-muted)">VMs, containers,</text>
    <text x="125.000001000011" y="409.423016" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.414214798669" fill="var(--text-muted)">serverless functions</text>
    <text x="125.000001000011" y="437.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.414214798669" fill="var(--text-muted)">billed by CPU time</text>
    <text x="125.000001000011" y="504.230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.987422823636" fill="var(--text-faint)">Pay only while running</text>
  </g>

  <!-- Column 2: Storage (ok) -->
  <g transform="translate(370, 60)">
    <rect x="-40.000000000003" y="-20" width="329.999999999964" height="580" rx="7.898435068552" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Disk icon -->
    <rect x="59.000001800037" y="41.346216" width="131.999998399944" height="89.230769" rx="7.898435068552" fill="url(#grad-ok)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <line x1="72.200001640036" y1="69.230769" x2="177.800005360119" y2="69.230769" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="150.714876625943" y="100.993" width="14.569882938488" height="14.5517" rx="7.280372925058" fill="none" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="78.800003560082" y="100.461539" width="39.600001520034" height="15.615385" rx="7.898435068552" fill="url(#grad-ok)" opacity="0.3" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="125.000001000011" y="203.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.974840647215" font-weight="bold" fill="var(--ok-accent)">Storage</text>
    <rect x="-0.400000480017" y="247.692308" width="250.799997959913" height="66.923077" rx="7.898435068552" fill="url(#grad-ok)" opacity="0.12" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="125.000001000011" y="290.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.267799748755" fill="var(--text)">Per-GB / Month</text>
    <text x="125.000001000011" y="381.538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.414214798669" fill="var(--text-muted)">Object, block, file</text>
    <text x="125.000001000011" y="409.423016" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.414214798669" fill="var(--text-muted)">storage charged by</text>
    <text x="125.000001000011" y="437.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.414214798669" fill="var(--text-muted)">volume stored</text>
    <text x="125.000001000011" y="504.230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.987422823636" fill="var(--text-faint)">Tiered pricing by class</text>
  </g>

  <!-- Column 3: Data Transfer (warn) -->
  <g transform="translate(660, 60)">
    <rect x="-40.000000000003" y="-20" width="329.999999999964" height="580" rx="7.898435068552" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Arrow icon (outbound) -->
    <rect x="64.292822273873" y="30.907" width="121.41452345664" height="121.263" rx="14.008744577035" fill="url(#grad-warn)" opacity="0.15" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <line x1="85.400004480107" y1="91.538462" x2="164.600001520021" y2="91.538462" stroke="var(--warn-border)" stroke-width="2" stroke-linecap="round"/>
    <polyline points="144.800000759995,74.807631 168.560002872051,91.538462 144.800000759995,108.269292" fill="none" stroke="var(--warn-border)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="125.000001000011" y="203.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.974840647215" font-weight="bold" fill="var(--warn-accent)">Data Transfer</text>
    <rect x="-0.400000480017" y="247.692308" width="250.799997959913" height="66.923077" rx="7.898435068552" fill="url(#grad-warn)" opacity="0.12" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="125.000001000011" y="290.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.267799748755" fill="var(--text)">Per-GB Out</text>
    <text x="125.000001000011" y="381.538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.414214798669" fill="var(--text-muted)">Egress traffic billed,</text>
    <text x="125.000001000011" y="409.423016" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.414214798669" fill="var(--text-muted)">ingress usually free.</text>
    <text x="125.000001000011" y="437.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.414214798669" fill="var(--text-muted)">Cross-region costs</text>
    <text x="125.000001000011" y="504.230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.987422823636" fill="var(--text-faint)">Often the hidden cost</text>
  </g>

  <!-- Column 4: Requests (info) -->
  <g transform="translate(950, 60)">
    <rect x="-40.000000000003" y="-20" width="329.999999999964" height="580" rx="7.898435068552" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <!-- API icon -->
    <rect x="65.599999719982" y="46.923077" width="118.800002560051" height="83.653908" rx="7.898435068552" fill="url(#grad-info)" opacity="0.15" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="125.000001000011" y="83.730708" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.987422823636" font-weight="bold" fill="var(--info-accent)">API</text>
    <line x1="85.400004480107" y1="97.115323" x2="164.600001520021" y2="97.115323" stroke="var(--info-border)" stroke-width="1.5"/>
    <text x="125.000001000011" y="119.423016" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.560630848611" fill="var(--info-accent)">{ }</text>
    <text x="125.000001000011" y="203.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.974840647215" font-weight="bold" fill="var(--info-accent)">Requests</text>
    <rect x="-0.400000480017" y="247.692308" width="250.799997959913" height="66.923077" rx="7.898435068552" fill="url(#grad-info)" opacity="0.12" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="125.000001000011" y="290.076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.267799748755" fill="var(--text)">Per-Call</text>
    <text x="125.000001000011" y="381.538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.414214798669" fill="var(--text-muted)">API calls, read/write</text>
    <text x="125.000001000011" y="409.423016" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.414214798669" fill="var(--text-muted)">operations, messages</text>
    <text x="125.000001000011" y="437.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.414214798669" fill="var(--text-muted)">billed per request</text>
    <text x="125.000001000011" y="504.230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.987422823636" fill="var(--text-faint)">Often includes free tier</text>
  </g>
</svg>

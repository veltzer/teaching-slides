<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Grid background -->
  <g opacity="0.3">
    <line x1="208.75" y1="130.625" x2="208.75" y2="511.25" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="377.5" y1="130.625" x2="377.5" y2="511.25" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="546.25" y1="130.625" x2="546.25" y2="511.25" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="715" y1="130.625" x2="715" y2="511.25" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="883.75" y1="130.625" x2="883.75" y2="511.25" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="1052.5" y1="130.625" x2="1052.5" y2="511.25" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="133.75" y1="203.125" x2="1127.5" y2="203.125" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="133.75" y1="275.625" x2="1127.5" y2="275.625" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="133.75" y1="348.125" x2="1127.5" y2="348.125" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="133.75" y1="420.625" x2="1127.5" y2="420.625" stroke="var(--border)" stroke-width="0.5"/>
  </g>

  <!-- Axes -->
  <line x1="133.75" y1="511.25" x2="1146.25" y2="511.25" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="133.75" y1="511.25" x2="133.75" y2="112.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Axis labels -->
  <text x="640" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Time</text>
  <text x="91.5625" y="311.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)" transform="rotate(-90, 55, 300)">Cumulative Cost</text>

  <!-- Time labels -->
  <text x="208.75" y="533.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Year 1</text>
  <text x="377.5" y="533.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Year 2</text>
  <text x="546.25" y="533.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Year 3</text>
  <text x="715" y="533.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Year 4</text>
  <text x="883.75" y="533.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Year 5</text>
  <text x="1052.5" y="533.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Year 6</text>

  <!-- CapEx curve (danger): large upfront step, then gradual maintenance -->
  <!-- Big upfront jump, then moderate linear increase -->
  <polyline points="133.75,511.25 152.5,511.25 161.875,203.125 208.75,212.1875 377.5,239.375 546.25,275.625 715,311.875 883.75,348.125 1052.5,384.375 1127.5,402.5"
    fill="none" stroke="var(--danger-border)" stroke-width="3"/>
  <!-- Fill area under CapEx -->
  <polygon points="133.75,511.25 152.5,511.25 161.875,203.125 208.75,212.1875 377.5,239.375 546.25,275.625 715,311.875 883.75,348.125 1052.5,384.375 1127.5,402.5 1127.5,511.25"
    fill="var(--danger-fill)" opacity="0.3"/>

  <!-- CapEx label on curve -->
  <text x="321.25" y="194.0625" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)">CapEx (Traditional)</text>
  <text x="321.25" y="214" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">Large upfront + maintenance</text>

  <!-- CapEx step annotation -->
  <line x1="161.875" y1="203.125" x2="161.875" y2="511.25" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="178.75" y="366.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--danger-accent)">Hardware</text>
  <text x="178.75" y="379.8438" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--danger-accent)">purchase</text>

  <!-- OpEx curve (ok): starts at 0, gradual increase following usage -->
  <polyline points="133.75,511.25 208.75,475 377.5,411.5625 546.25,348.125 715,293.75 883.75,248.4375 1052.5,212.1875 1127.5,194.0625"
    fill="none" stroke="var(--ok-border)" stroke-width="3"/>
  <!-- Fill area under OpEx -->
  <polygon points="133.75,511.25 208.75,475 377.5,411.5625 546.25,348.125 715,293.75 883.75,248.4375 1052.5,212.1875 1127.5,194.0625 1127.5,511.25"
    fill="var(--ok-fill)" opacity="0.3"/>

  <!-- OpEx label -->
  <text x="883.75" y="180.4688" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">OpEx (Cloud)</text>
  <text x="883.75" y="200.4062" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Pay as you go, scales with usage</text>

  <!-- Crossover point annotation -->
  <circle cx="630.625" cy="302.8125" r="7.3739" fill="var(--warn-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="630.625" y1="310.0625" x2="630.625" y2="375.3125" stroke="var(--warn-border)" stroke-width="1.5"/>
  <rect x="546.25" y="377.125" rx="6" width="168.75" height="45.3125" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.625" y="396.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Break-even Point</text>
  <text x="630.625" y="413.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">~3 years typically</text>

  <!-- Key insight boxes at bottom -->
  <rect x="133.75" y="565.625" rx="6" width="318.75" height="36.25" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="293.125" y="588.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--danger-accent)">CapEx: Lower long-term for stable workloads</text>

  <rect x="490" y="565.625" rx="6" width="318.75" height="36.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="649.375" y="588.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)">OpEx: Lower short-term, flexible scaling</text>

  <rect x="846.25" y="565.625" rx="6" width="318.75" height="36.25" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1005.625" y="588.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--warn-accent)">Hybrid: Best of both approaches</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Grid background -->
  <g opacity="0.3">
    <line x1="180" y1="100" x2="180" y2="520" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="360" y1="100" x2="360" y2="520" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="540" y1="100" x2="540" y2="520" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="720" y1="100" x2="720" y2="520" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="900" y1="100" x2="900" y2="520" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="1080" y1="100" x2="1080" y2="520" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="100" y1="180" x2="1160" y2="180" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="100" y1="260" x2="1160" y2="260" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="100" y1="340" x2="1160" y2="340" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="100" y1="420" x2="1160" y2="420" stroke="var(--border)" stroke-width="0.5"/>
  </g>

  <!-- Axes -->
  <line x1="100" y1="520" x2="1180" y2="520" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="100" y1="520" x2="100" y2="80" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Axis labels -->
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Time</text>
  <text x="55" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)" transform="rotate(-90, 55, 300)">Cumulative Cost</text>

  <!-- Time labels -->
  <text x="180" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Year 1</text>
  <text x="360" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Year 2</text>
  <text x="540" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Year 3</text>
  <text x="720" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Year 4</text>
  <text x="900" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Year 5</text>
  <text x="1080" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Year 6</text>

  <!-- CapEx curve (danger): large upfront step, then gradual maintenance -->
  <!-- Big upfront jump, then moderate linear increase -->
  <polyline points="100,520 120,520 130,180 180,190 360,220 540,260 720,300 900,340 1080,380 1160,400"
    fill="none" stroke="var(--danger-border)" stroke-width="3"/>
  <!-- Fill area under CapEx -->
  <polygon points="100,520 120,520 130,180 180,190 360,220 540,260 720,300 900,340 1080,380 1160,400 1160,520"
    fill="var(--danger-fill)" opacity="0.3"/>

  <!-- CapEx label on curve -->
  <text x="300" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)">CapEx (Traditional)</text>
  <text x="300" y="192" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">Large upfront + maintenance</text>

  <!-- CapEx step annotation -->
  <line x1="130" y1="180" x2="130" y2="520" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="148" y="360" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)">Hardware</text>
  <text x="148" y="375" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)">purchase</text>

  <!-- OpEx curve (ok): starts at 0, gradual increase following usage -->
  <polyline points="100,520 180,480 360,410 540,340 720,280 900,230 1080,190 1160,170"
    fill="none" stroke="var(--ok-border)" stroke-width="3"/>
  <!-- Fill area under OpEx -->
  <polygon points="100,520 180,480 360,410 540,340 720,280 900,230 1080,190 1160,170 1160,520"
    fill="var(--ok-fill)" opacity="0.3"/>

  <!-- OpEx label -->
  <text x="900" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">OpEx (Cloud)</text>
  <text x="900" y="177" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Pay as you go, scales with usage</text>

  <!-- Crossover point annotation -->
  <circle cx="630" cy="290" r="8" fill="var(--warn-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="630" y1="298" x2="630" y2="370" stroke="var(--warn-border)" stroke-width="1.5"/>
  <rect x="540" y="372" rx="6" width="180" height="50" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">Break-even Point</text>
  <text x="630" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">~3 years typically</text>

  <!-- Key insight boxes at bottom -->
  <rect x="100" y="580" rx="6" width="340" height="40" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="270" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-accent)">CapEx: Lower long-term for stable workloads</text>

  <rect x="480" y="580" rx="6" width="340" height="40" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="650" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)">OpEx: Lower short-term, flexible scaling</text>

  <rect x="860" y="580" rx="6" width="340" height="40" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1030" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Hybrid: Best of both approaches</text>
</svg>
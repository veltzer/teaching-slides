<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Grid background -->
  <g opacity="0.3">
    <line x1="127.272727" y1="61.481481" x2="127.272727" y2="512.592593" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="323.636364" y1="61.481481" x2="323.636364" y2="512.592593" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="520" y1="61.481481" x2="520" y2="512.592593" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="716.363636" y1="61.481481" x2="716.363636" y2="512.592593" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="912.727273" y1="61.481481" x2="912.727273" y2="512.592593" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="1109.090909" y1="61.481481" x2="1109.090909" y2="512.592593" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="40" y1="147.407407" x2="1196.363636" y2="147.407407" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="40" y1="233.333333" x2="1196.363636" y2="233.333333" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="40" y1="319.259259" x2="1196.363636" y2="319.259259" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="40" y1="405.185185" x2="1196.363636" y2="405.185185" stroke="var(--border)" stroke-width="0.5"/>
  </g>

  <!-- Axes -->
  <line x1="40" y1="512.592593" x2="1218.181818" y2="512.592593" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="40" y1="512.592593" x2="40" y2="40" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Axis labels -->
  <text x="629.090909" y="555.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.319364" font-weight="bold" fill="var(--text)">Time</text>
  <text x="91.5625" y="311.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)" transform="rotate(-90, 55, 300)">Cumulative Cost</text>

  <!-- Time labels -->
  <text x="127.272727" y="539.444385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.989493" fill="var(--text-muted)">Year 1</text>
  <text x="323.636364" y="539.444385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.989493" fill="var(--text-muted)">Year 2</text>
  <text x="520" y="539.444385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.989493" fill="var(--text-muted)">Year 3</text>
  <text x="716.363636" y="539.444385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.989493" fill="var(--text-muted)">Year 4</text>
  <text x="912.727273" y="539.444385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.989493" fill="var(--text-muted)">Year 5</text>
  <text x="1109.090909" y="539.444385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.989493" fill="var(--text-muted)">Year 6</text>

  <!-- CapEx curve (danger): large upfront step, then gradual maintenance -->
  <!-- Big upfront jump, then moderate linear increase -->
  <polyline points="40,512.592593 61.818182,512.592593 72.727273,147.407407 127.272727,158.148148 323.636364,190.37037 520,233.333333 716.363636,276.296296 912.727273,319.259259 1109.090909,362.222222 1196.363636,383.703704"
    fill="none" stroke="var(--danger-border)" stroke-width="3"/>
  <!-- Fill area under CapEx -->
  <polygon points="40,512.592593 61.818182,512.592593 72.727273,147.407407 127.272727,158.148148 323.636364,190.37037 520,233.333333 716.363636,276.296296 912.727273,319.259259 1109.090909,362.222222 1196.363636,383.703704 1196.363636,512.592593"
    fill="var(--danger-fill)" opacity="0.3"/>

  <!-- CapEx label on curve -->
  <text x="258.181818" y="136.666667" font-family="Arial, sans-serif" font-size="17.319364" font-weight="bold" fill="var(--danger-accent)">CapEx (Traditional)</text>
  <text x="258.181818" y="160.296296" font-family="Arial, sans-serif" font-size="12.989493" fill="var(--danger-accent)">Large upfront + maintenance</text>

  <!-- CapEx step annotation -->
  <line x1="72.727273" y1="147.407407" x2="72.727273" y2="512.592593" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="92.363636" y="340.740741" font-family="Arial, sans-serif" font-size="11.907085" fill="var(--danger-accent)">Hardware</text>
  <text x="92.363636" y="356.851911" font-family="Arial, sans-serif" font-size="11.907085" fill="var(--danger-accent)">purchase</text>

  <!-- OpEx curve (ok): starts at 0, gradual increase following usage -->
  <polyline points="40,512.592593 127.272727,469.62963 323.636364,394.444444 520,319.259259 716.363636,254.814815 912.727273,201.111111 1109.090909,158.148148 1196.363636,136.666667"
    fill="none" stroke="var(--ok-border)" stroke-width="3"/>
  <!-- Fill area under OpEx -->
  <polygon points="40,512.592593 127.272727,469.62963 323.636364,394.444444 520,319.259259 716.363636,254.814815 912.727273,201.111111 1109.090909,158.148148 1196.363636,136.666667 1196.363636,512.592593"
    fill="var(--ok-fill)" opacity="0.3"/>

  <!-- OpEx label -->
  <text x="912.727273" y="120.555615" font-family="Arial, sans-serif" font-size="17.319364" font-weight="bold" fill="var(--ok-accent)">OpEx (Cloud)</text>
  <text x="912.727273" y="144.185126" font-family="Arial, sans-serif" font-size="12.989493" fill="var(--ok-accent)">Pay as you go, scales with usage</text>

  <!-- Crossover point annotation -->
  <rect x="609.522" y="256.896" width="17.3192" height="17.3192" rx="8.65962" fill="var(--warn-fill)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="618.181818" y1="274.148148" x2="618.181818" y2="351.481481" stroke="var(--warn-border)" stroke-width="1.5"/>
  <rect x="520" y="353.62963" rx="7.046168" width="196.363636" height="53.703704" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="618.181818" y="376.185126" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.07202" font-weight="bold" fill="var(--warn-accent)">Break-even Point</text>
  <text x="618.181818" y="396.592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.907085" fill="var(--warn-accent)">~3 years typically</text>

  <!-- Key insight boxes at bottom -->
  <rect x="40" y="577.037037" rx="7.046168" width="370.909091" height="42.962963" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="225.454545" y="603.88883" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.07202" fill="var(--danger-accent)">CapEx: Lower long-term for stable workloads</text>

  <rect x="454.545455" y="577.037037" rx="7.046168" width="370.909091" height="42.962963" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="603.88883" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.07202" fill="var(--ok-accent)">OpEx: Lower short-term, flexible scaling</text>

  <rect x="869.090909" y="577.037037" rx="7.046168" width="370.909091" height="42.962963" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1054.545455" y="603.88883" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.07202" fill="var(--warn-accent)">Hybrid: Best of both approaches</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Grid background -->
  <g opacity="0.3">
    <line x1="180" y1="100" x2="180" y2="520" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="360" y1="100" x2="360" y2="520" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="540" y1="100" x2="540" y2="520" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="720" y1="100" x2="720" y2="520" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="900" y1="100" x2="900" y2="520" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="1080" y1="100" x2="1080" y2="520" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="100" y1="180" x2="1160" y2="180" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="100" y1="260" x2="1160" y2="260" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="100" y1="340" x2="1160" y2="340" stroke="var(--border)" stroke-width="0.5"/>
    <line x1="100" y1="420" x2="1160" y2="420" stroke="var(--border)" stroke-width="0.5"/>
  </g>

  <!-- Axes -->
  <line x1="100" y1="520" x2="1180" y2="520" stroke="var(--text-dark)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="100" y1="520" x2="100" y2="80" stroke="var(--text-dark)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Axis labels -->
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Time</text>
  <text x="55" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)" transform="rotate(-90, 55, 300)">Cumulative Cost</text>

  <!-- Time labels -->
  <text x="180" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Year 1</text>
  <text x="360" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Year 2</text>
  <text x="540" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Year 3</text>
  <text x="720" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Year 4</text>
  <text x="900" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Year 5</text>
  <text x="1080" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Year 6</text>

  <!-- CapEx curve (danger): large upfront step, then gradual maintenance -->
  <!-- Big upfront jump, then moderate linear increase -->
  <polyline points="100,520 120,520 130,180 180,190 360,220 540,260 720,300 900,340 1080,380 1160,400"
    fill="none" stroke="var(--danger)" stroke-width="3"/>
  <!-- Fill area under CapEx -->
  <polygon points="100,520 120,520 130,180 180,190 360,220 540,260 720,300 900,340 1080,380 1160,400 1160,520"
    fill="var(--danger-lt)" opacity="0.3"/>

  <!-- CapEx label on curve -->
  <text x="300" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-dk)">CapEx (Traditional)</text>
  <text x="300" y="192" font-family="Arial, sans-serif" font-size="12" fill="var(--danger)">Large upfront + maintenance</text>

  <!-- CapEx step annotation -->
  <line x1="130" y1="180" x2="130" y2="520" stroke="var(--danger)" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="148" y="360" font-family="Arial, sans-serif" font-size="11" fill="var(--danger)">Hardware</text>
  <text x="148" y="375" font-family="Arial, sans-serif" font-size="11" fill="var(--danger)">purchase</text>

  <!-- OpEx curve (ok): starts at 0, gradual increase following usage -->
  <polyline points="100,520 180,480 360,410 540,340 720,280 900,230 1080,190 1160,170"
    fill="none" stroke="var(--ok)" stroke-width="3"/>
  <!-- Fill area under OpEx -->
  <polygon points="100,520 180,480 360,410 540,340 720,280 900,230 1080,190 1160,170 1160,520"
    fill="var(--ok-lt)" opacity="0.3"/>

  <!-- OpEx label -->
  <text x="900" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)">OpEx (Cloud)</text>
  <text x="900" y="177" font-family="Arial, sans-serif" font-size="12" fill="var(--ok)">Pay as you go, scales with usage</text>

  <!-- Crossover point annotation -->
  <circle cx="630" cy="290" r="8" fill="var(--warn)" stroke="var(--bg)" stroke-width="2"/>
  <line x1="630" y1="298" x2="630" y2="370" stroke="var(--warn)" stroke-width="1.5"/>
  <rect x="540" y="372" rx="6" ry="6" width="180" height="50" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="630" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">Break-even Point</text>
  <text x="630" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn)">~3 years typically</text>

  <!-- Key insight boxes at bottom -->
  <rect x="100" y="580" rx="8" ry="8" width="340" height="40" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="270" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-dk)">CapEx: Lower long-term for stable workloads</text>

  <rect x="480" y="580" rx="8" ry="8" width="340" height="40" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="650" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-dk)">OpEx: Lower short-term, flexible scaling</text>

  <rect x="860" y="580" rx="8" ry="8" width="340" height="40" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="1030" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">Hybrid: Best of both approaches</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <!-- AWS cloud shape -->
  <g transform="translate(0,60)">
    <!-- Central cloud -->
    <ellipse cx="640" cy="280" rx="170" ry="85" fill="var(--warn-fill)" opacity="0.15"/>
    <ellipse cx="540" cy="280" rx="110" ry="70" fill="var(--warn-fill)" opacity="0.15"/>
    <ellipse cx="740" cy="280" rx="110" ry="70" fill="var(--warn-fill)" opacity="0.15"/>
    <ellipse cx="590" cy="240" rx="100" ry="60" fill="var(--warn-fill)" opacity="0.15"/>
    <ellipse cx="700" cy="240" rx="100" ry="60" fill="var(--warn-fill)" opacity="0.15"/>
    <!-- Cloud outline highlight -->
    <ellipse cx="640" cy="280" rx="170" ry="85" fill="none" stroke="var(--warn-border)" stroke-width="1.5" opacity="0.3"/>
    <!-- AWS arrow/smile shape inside cloud -->
    <path d="M580,275 Q640,310 700,275" fill="none" stroke="var(--warn-fill)" stroke-width="3" opacity="0.7"/>
    <polygon points="695,268 705,278 690,278" fill="var(--warn-fill)" opacity="0.7"/>
    <!-- Service boxes -->
    <!-- EC2 box -->
    <rect x="280" y="420" width="100" height="60" rx="6" fill="var(--warn-accent)" opacity="0.6"/>
    <text x="330" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-text)" opacity="0.9">EC2</text>
    <text x="330" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-text)" opacity="0.7">Compute</text>
    <!-- S3 box -->
    <rect x="440" y="420" width="100" height="60" rx="6" fill="var(--ok-accent)" opacity="0.6"/>
    <text x="490" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-text)" opacity="0.9">S3</text>
    <text x="490" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-text)" opacity="0.7">Storage</text>
    <!-- Lambda box -->
    <rect x="680" y="420" width="100" height="60" rx="6" fill="var(--primary-accent)" opacity="0.6"/>
    <text x="730" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-text)" opacity="0.9">Lambda</text>
    <text x="730" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-text)" opacity="0.7">Serverless</text>
    <!-- RDS box -->
    <rect x="840" y="420" width="100" height="60" rx="6" fill="var(--info-accent)" opacity="0.6"/>
    <text x="890" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--info-text)" opacity="0.9">RDS</text>
    <text x="890" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--info-text)" opacity="0.7">Database</text>
    <!-- Connection lines from cloud to boxes -->
    <line x1="330" y1="420" x2="560" y2="345" stroke="var(--warn-border)" stroke-width="1.5" opacity="0.3"/>
    <line x1="490" y1="420" x2="600" y2="345" stroke="var(--ok-border)" stroke-width="1.5" opacity="0.3"/>
    <line x1="730" y1="420" x2="680" y2="345" stroke="var(--primary-border)" stroke-width="1.5" opacity="0.3"/>
    <line x1="890" y1="420" x2="720" y2="345" stroke="var(--info-border)" stroke-width="1.5" opacity="0.3"/>
    <!-- Decorative dots -->
    <circle cx="180" cy="200" r="4" fill="var(--warn-fill)" opacity="0.3"/>
    <circle cx="250" cy="250" r="3" fill="var(--primary-accent)" opacity="0.4"/>
    <circle cx="1100" cy="210" r="4" fill="var(--warn-fill)" opacity="0.3"/>
    <circle cx="1030" cy="260" r="3" fill="var(--primary-accent)" opacity="0.4"/>
    <circle cx="210" cy="500" r="3" fill="var(--warn-fill)" opacity="0.3"/>
    <circle cx="1070" cy="510" r="3" fill="var(--warn-fill)" opacity="0.3"/>
    <!-- Bottom accent bar -->
    <rect x="415" y="520" width="450" height="4" rx="2" fill="var(--warn-fill)" opacity="0.6"/>
  </g>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Introduction To AWS</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Amazon Web Services Essentials</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Customer Responsibility (top half) -->
  <rect x="81.37931" y="40" width="1117.241379" height="265.423729" rx="6.564342" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448276" y="74.406834" font-family="Arial, sans-serif" font-size="18.151938" font-weight="bold" fill="var(--warn-accent)">CUSTOMER RESPONSIBILITY</text>
  <text x="1136.551724" y="74.406834" text-anchor="end" font-family="Arial, sans-serif" font-size="14.11815" fill="var(--text-muted)">"Security IN the Cloud"</text>

  <!-- Customer layers (top to bottom) -->
  <rect x="143.448276" y="89.152542" width="227.586207" height="49.152542" rx="6.564342" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="257.241379" y="118.644068" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">Customer Data</text>

  <rect x="412.413793" y="89.152542" width="227.586207" height="49.152542" rx="6.564342" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="526.206897" y="118.644068" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">Applications</text>

  <rect x="681.37931" y="89.152542" width="227.586207" height="49.152542" rx="6.564342" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="795.172414" y="118.644068" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">IAM</text>

  <rect x="950.344828" y="89.152542" width="186.206897" height="49.152542" rx="6.564342" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1043.448276" y="118.644068" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">Encryption</text>

  <rect x="143.448276" y="157.966102" width="496.551724" height="49.152542" rx="6.564342" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="391.724138" y="187.457627" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">Operating System, Network, Firewall Configuration</text>

  <rect x="681.37931" y="157.966102" width="455.172414" height="49.152542" rx="6.564342" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="908.965517" y="187.457627" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">Client-side &amp; Server-side Encryption</text>

  <rect x="143.448276" y="226.779661" width="993.103448" height="49.152542" rx="6.564342" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="256.271186" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">Network Traffic Protection (VPC, Security Groups, NACLs)</text>

  <!-- Shared Responsibility Line -->
  <line x1="40" y1="325.084746" x2="1240" y2="325.084746" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="12,6"/>
  <rect x="433.103448" y="311.322034" width="413.793103" height="27.525424" rx="6.564342" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="330.983051" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.135044" font-weight="bold" fill="var(--danger-accent)">SHARED RESPONSIBILITY LINE</text>

  <!-- AWS Responsibility (bottom half) -->
  <rect x="81.37931" y="354.576271" width="1117.241379" height="265.423729" rx="6.564342" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448276" y="388.983105" font-family="Arial, sans-serif" font-size="18.151938" font-weight="bold" fill="var(--primary-accent)">AWS RESPONSIBILITY</text>
  <text x="1136.551724" y="388.983105" text-anchor="end" font-family="Arial, sans-serif" font-size="14.11815" fill="var(--text-muted)">"Security OF the Cloud"</text>

  <!-- AWS layers (top to bottom) -->
  <rect x="143.448276" y="408.644122" width="496.551724" height="49.152542" rx="6.564342" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="391.724138" y="438.135539" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">Managed Services (RDS, Lambda, S3, etc.)</text>

  <rect x="681.37931" y="408.644122" width="455.172414" height="49.152542" rx="6.564342" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="908.965517" y="438.135539" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">Software (Compute, Storage, DB, Network)</text>

  <rect x="143.448276" y="477.457573" width="993.103448" height="49.152542" rx="6.564342" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="506.949207" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">Hardware / AWS Global Infrastructure (Regions, AZs, Edge Locations)</text>

  <rect x="143.448276" y="546.271241" width="320.689655" height="49.152542" rx="6.564342" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="303.793103" y="575.762658" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">Physical Security</text>

  <rect x="505.517241" y="546.271241" width="320.689655" height="49.152542" rx="6.564342" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="665.862069" y="575.762658" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">Networking</text>

  <rect x="867.586207" y="546.271241" width="268.965517" height="49.152542" rx="6.564342" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1002.068966" y="575.762658" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.126542" font-weight="bold" fill="var(--text)">Hypervisor</text>
</svg>
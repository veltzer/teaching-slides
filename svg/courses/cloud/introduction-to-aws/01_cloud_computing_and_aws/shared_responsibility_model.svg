<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="0" fill="var(--bg)"/>

  <!-- Customer Responsibility (top half) -->
  <rect x="100" y="20" width="1080" height="270" rx="12" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="55" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-dk)">CUSTOMER RESPONSIBILITY</text>
  <text x="1120" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">"Security IN the Cloud"</text>

  <!-- Customer layers (top to bottom) -->
  <rect x="160" y="70" width="220" height="50" rx="8" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <text x="270" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Customer Data</text>

  <rect x="420" y="70" width="220" height="50" rx="8" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <text x="530" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Applications</text>

  <rect x="680" y="70" width="220" height="50" rx="8" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <text x="790" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">IAM</text>

  <rect x="940" y="70" width="180" height="50" rx="8" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <text x="1030" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Encryption</text>

  <rect x="160" y="140" width="480" height="50" rx="8" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <text x="400" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Operating System, Network, Firewall Configuration</text>

  <rect x="680" y="140" width="440" height="50" rx="8" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <text x="900" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Client-side &amp; Server-side Encryption</text>

  <rect x="160" y="210" width="960" height="50" rx="8" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Network Traffic Protection (VPC, Security Groups, NACLs)</text>

  <!-- Shared Responsibility Line -->
  <line x1="60" y1="310" x2="1220" y2="310" stroke="var(--danger)" stroke-width="4" stroke-dasharray="12,6"/>
  <rect x="440" y="296" width="400" height="28" rx="6" fill="var(--bg)" stroke="var(--danger)" stroke-width="2"/>
  <text x="640" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger)">SHARED RESPONSIBILITY LINE</text>

  <!-- AWS Responsibility (bottom half) -->
  <rect x="100" y="340" width="1080" height="270" rx="12" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="375" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">AWS RESPONSIBILITY</text>
  <text x="1120" y="375" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">"Security OF the Cloud"</text>

  <!-- AWS layers (top to bottom) -->
  <rect x="160" y="395" width="480" height="50" rx="8" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="1.5"/>
  <text x="400" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Managed Services (RDS, Lambda, S3, etc.)</text>

  <rect x="680" y="395" width="440" height="50" rx="8" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="1.5"/>
  <text x="900" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Software (Compute, Storage, DB, Network)</text>

  <rect x="160" y="465" width="960" height="50" rx="8" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="1.5"/>
  <text x="640" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Hardware / AWS Global Infrastructure (Regions, AZs, Edge Locations)</text>

  <rect x="160" y="535" width="310" height="50" rx="8" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="1.5"/>
  <text x="315" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Physical Security</text>

  <rect x="510" y="535" width="310" height="50" rx="8" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="1.5"/>
  <text x="665" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Networking</text>

  <rect x="860" y="535" width="260" height="50" rx="8" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="1.5"/>
  <text x="990" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Hypervisor</text>
</svg>
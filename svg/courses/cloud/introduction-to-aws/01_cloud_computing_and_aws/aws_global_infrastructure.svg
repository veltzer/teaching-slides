  <circle cx="560.3125" cy="366.25" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="621.25" cy="352.6562" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="696.25" cy="357.1875" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="752.5" cy="348.125" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="640" y="411.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">Edge Locations</text>


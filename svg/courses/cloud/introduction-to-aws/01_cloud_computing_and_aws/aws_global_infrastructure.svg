<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="0" fill="var(--bg)"/>

  <!-- Region 1: us-east-1 -->
  <rect x="40" y="40" width="370" height="400" rx="16" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)">us-east-1</text>
  <text x="225" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">N. Virginia</text>
  <!-- AZs -->
  <circle cx="120" cy="200" r="50" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="120" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">AZ-1a</text>
  <text x="120" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">us-east-1a</text>
  <circle cx="225" cy="200" r="50" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="225" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">AZ-1b</text>
  <text x="225" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">us-east-1b</text>
  <circle cx="330" cy="200" r="50" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="330" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">AZ-1c</text>
  <text x="330" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">us-east-1c</text>
  <!-- Edge Locations for Region 1 -->
  <circle cx="80" cy="340" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="130" cy="360" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="180" cy="340" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="270" cy="350" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="340" cy="340" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <text x="225" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)">Edge Locations</text>

  <!-- Region 2: eu-west-1 -->
  <rect x="455" y="40" width="370" height="400" rx="16" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)">eu-west-1</text>
  <text x="640" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Ireland</text>
  <!-- AZs -->
  <circle cx="535" cy="200" r="50" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="535" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">AZ-2a</text>
  <text x="535" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">eu-west-1a</text>
  <circle cx="640" cy="200" r="50" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="640" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">AZ-2b</text>
  <text x="640" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">eu-west-1b</text>
  <circle cx="745" cy="200" r="50" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="745" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">AZ-2c</text>
  <text x="745" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">eu-west-1c</text>
  <!-- Edge Locations for Region 2 -->
  <circle cx="495" cy="340" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="555" cy="360" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="620" cy="345" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="700" cy="350" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="760" cy="340" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <text x="640" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)">Edge Locations</text>

  <!-- Region 3: ap-southeast-1 -->
  <rect x="870" y="40" width="370" height="400" rx="16" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)">ap-southeast-1</text>
  <text x="1055" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Singapore</text>
  <!-- AZs -->
  <circle cx="950" cy="200" r="50" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="950" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">AZ-3a</text>
  <text x="950" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">ap-se-1a</text>
  <circle cx="1055" cy="200" r="50" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="1055" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">AZ-3b</text>
  <text x="1055" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">ap-se-1b</text>
  <circle cx="1160" cy="200" r="50" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="1160" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">AZ-3c</text>
  <text x="1160" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">ap-se-1c</text>
  <!-- Edge Locations for Region 3 -->
  <circle cx="910" cy="340" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="970" cy="360" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="1040" cy="345" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="1110" cy="350" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <circle cx="1170" cy="340" r="12" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <text x="1055" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)">Edge Locations</text>

  <!-- Legend -->
  <rect x="340" y="480" width="600" height="130" rx="12" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Legend</text>
  <rect x="400" y="530" width="30" height="20" rx="4" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.5"/>
  <text x="445" y="546" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Region</text>
  <circle cx="570" cy="540" r="14" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="598" y="546" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Availability Zone</text>
  <circle cx="770" cy="540" r="10" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <text x="793" y="546" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Edge Location</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Each Region has multiple isolated AZs connected via low-latency links</text>
</svg>
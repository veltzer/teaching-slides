  <text x="349.375" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">us-east-1c</text>
  <!-- Edge Locations for Region 1 -->
  <circle cx="115" cy="348.125" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="161.875" cy="366.25" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="208.75" cy="348.125" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="293.125" cy="357.1875" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="358.75" cy="348.125" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>

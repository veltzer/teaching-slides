  <text x="640" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">AZ-2b</text>
  <text x="640" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">eu-west-1b</text>

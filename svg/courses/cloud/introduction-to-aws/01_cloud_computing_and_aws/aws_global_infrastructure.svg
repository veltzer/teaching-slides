  <text x="930.625" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">ap-se-1a</text>
  <circle cx="1029.0625" cy="221.25" r="46.0871" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1029.0625" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">AZ-3b</text>
  <text x="1029.0625" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">ap-se-1b</text>
  <circle cx="1127.5" cy="221.25" r="46.0871" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1127.5" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">AZ-3c</text>
  <text x="1127.5" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">ap-se-1c</text>
  <!-- Edge Locations for Region 3 -->
  <circle cx="893.125" cy="348.125" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="949.375" cy="366.25" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="1015" cy="352.6562" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <circle cx="1080.625" cy="357.1875" r="11.0609" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5"/>

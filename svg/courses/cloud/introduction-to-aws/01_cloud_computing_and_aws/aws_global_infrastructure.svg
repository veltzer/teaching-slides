  <text x="152.5" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">us-east-1a</text>
  <circle cx="250.9375" cy="221.25" r="46.0871" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="250.9375" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">AZ-1b</text>

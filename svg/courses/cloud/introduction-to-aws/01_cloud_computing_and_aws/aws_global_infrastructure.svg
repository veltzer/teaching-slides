  <text x="1029.0625" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--primary-accent)">ap-southeast-1</text>
  <text x="1029.0625" y="135.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Singapore</text>

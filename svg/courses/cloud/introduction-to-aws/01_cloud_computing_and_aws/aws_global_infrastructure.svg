  <text x="250.9375" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--primary-accent)">us-east-1</text>
  <text x="250.9375" y="135.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">N. Virginia</text>

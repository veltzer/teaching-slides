  <text x="769.999916" y="171.466832" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.573331" font-weight="bold" fill="var(--bg)">Minutes</text>
  <text x="720.000014" y="194.666716" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--text-muted)">API call, instant provisioning, global reach</text>
  <rect x="699.999904" y="223.666706" width="500.000196" height="96.666631" rx="6.399999" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720.000014" y="250.733149" font-family="Arial, sans-serif" font-size="20.573331" font-weight="bold" fill="var(--text)">Cost Model: OpEx</text>
  <text x="720.000014" y="273.933247" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--text-muted)">Pay-as-you-go pricing</text>
  <text x="720.000014" y="293.26668" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--text-muted)">No upfront commitment</text>
  <text x="720.000014" y="312.5999" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--text-muted)">Scale costs with actual usage</text>
  <rect x="699.999904" y="339.666556" width="500.000196" height="135.333284" rx="6.399999" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720.000014" y="366.73332" font-family="Arial, sans-serif" font-size="20.573331" font-weight="bold" fill="var(--text)">Elastic Capacity</text>
  <path d="M 740.000124 426.666631 Q 799.999922 407.333198 860.000039 436.333081 Q 919.999943 465.333284 980.000167 421.833246 Q 1040.000071 388.000085 1100.000188 445.999851 L 1160.000092 431.500123" fill="none" stroke="var(--ok-border)" stroke-width="0.6194"/>
  <path d="M 740.000124 426.666631 Q 799.999922 407.333198 860.000039 436.333081 Q 919.999943 465.333284 980.000167 421.833246 Q 1040.000071 388.000085 1100.000188 445.999851 L 1160.000092 431.500123" fill="none" stroke="var(--text)" stroke-width="0.5161" stroke-dasharray="1.2386 0.8258"/>
  <text x="1060.000181" y="463.399951" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--text-muted)">Actual Demand</text>
  <text x="740.000124" y="463.399951" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--ok-accent)">Capacity matches demand</text>
  <text x="740.000124" y="397.666642" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--ok-accent)">Auto-scaled Capacity</text>
  <rect x="699.999904" y="494.333273" width="500.000196" height="106.333508" rx="6.399999" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720.000014" y="521.400036" font-family="Arial, sans-serif" font-size="20.573331" font-weight="bold" fill="var(--text)">Auto Scaling</text>
  <text x="720.000014" y="544.599814" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--text-muted)">Automatic scale up and down</text>

  <rect x="699.999904" y="107.666642" width="500.000196" height="96.666631" rx="6.399999" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720.000014" y="134.733298" font-family="Arial, sans-serif" font-size="20.573331" font-weight="bold" fill="var(--text)">Provisioning Time</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="0" fill="var(--bg)"/>

  <!-- Left Column: Traditional IT -->
  <rect x="40" y="20" width="580" height="600" rx="16" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-dk)">Traditional IT</text>

  <!-- Provisioning Time -->
  <rect x="80" y="90" width="500" height="100" rx="10" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="100" y="118" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Provisioning Time</text>
  <rect x="100" y="135" width="440" height="30" rx="6" fill="var(--danger)"/>
  <text x="320" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Weeks to Months</text>
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Hardware procurement, setup, configuration...</text>

  <!-- Cost Model -->
  <rect x="80" y="210" width="500" height="100" rx="10" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="100" y="238" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Cost Model: CapEx</text>
  <text x="100" y="262" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Large upfront investment</text>
  <text x="100" y="282" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Depreciation over 3-5 years</text>
  <text x="100" y="302" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Must predict future needs</text>

  <!-- Capacity -->
  <rect x="80" y="330" width="500" height="140" rx="10" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="100" y="358" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Fixed Capacity</text>
  <!-- Fixed capacity bar chart -->
  <rect x="120" y="375" width="420" height="30" rx="4" fill="var(--danger)" opacity="0.7"/>
  <text x="330" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Provisioned Capacity (constant)</text>
  <!-- Demand line (wavy, sometimes above, sometimes below) -->
  <path d="M120,420 Q180,400 240,430 Q300,460 360,415 Q420,380 480,440 L540,425" fill="none" stroke="var(--text-dark)" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="440" y="458" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Actual Demand</text>
  <text x="120" y="458" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)">Waste or shortage</text>

  <!-- Scaling -->
  <rect x="80" y="490" width="500" height="110" rx="10" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="100" y="518" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Scaling Challenges</text>
  <text x="100" y="542" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Manual scaling only</text>
  <text x="100" y="562" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Risk of over/under provisioning</text>
  <text x="100" y="582" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Hardware lifecycle management</text>

  <!-- VS divider -->
  <circle cx="640" cy="310" r="30" fill="var(--text)"/>
  <text x="640" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">VS</text>

  <!-- Right Column: Cloud -->
  <rect x="660" y="20" width="580" height="600" rx="16" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-dk)">Cloud (AWS)</text>

  <!-- Provisioning Time -->
  <rect x="700" y="90" width="500" height="100" rx="10" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="720" y="118" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Provisioning Time</text>
  <rect x="720" y="135" width="100" height="30" rx="6" fill="var(--ok)"/>
  <text x="770" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Minutes</text>
  <text x="720" y="180" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">API call, instant provisioning, global reach</text>

  <!-- Cost Model -->
  <rect x="700" y="210" width="500" height="100" rx="10" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="720" y="238" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Cost Model: OpEx</text>
  <text x="720" y="262" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Pay-as-you-go pricing</text>
  <text x="720" y="282" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">No upfront commitment</text>
  <text x="720" y="302" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Scale costs with actual usage</text>

  <!-- Capacity -->
  <rect x="700" y="330" width="500" height="140" rx="10" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="720" y="358" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Elastic Capacity</text>
  <!-- Elastic capacity curve matching demand -->
  <path d="M740,420 Q800,400 860,430 Q920,460 980,415 Q1040,380 1100,440 L1160,425" fill="none" stroke="var(--ok)" stroke-width="3"/>
  <!-- Demand line (same shape) -->
  <path d="M740,420 Q800,400 860,430 Q920,460 980,415 Q1040,380 1100,440 L1160,425" fill="none" stroke="var(--text-dark)" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="1060" y="458" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Actual Demand</text>
  <text x="740" y="458" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">Capacity matches demand</text>
  <text x="740" y="390" font-family="Arial, sans-serif" font-size="12" fill="var(--ok)">Auto-scaled Capacity</text>

  <!-- Scaling -->
  <rect x="700" y="490" width="500" height="110" rx="10" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="720" y="518" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Auto Scaling</text>
  <text x="720" y="542" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Automatic scale up and down</text>
  <text x="720" y="562" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">200+ services at your fingertips</text>
  <text x="720" y="582" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Global deployment in minutes</text>
</svg>
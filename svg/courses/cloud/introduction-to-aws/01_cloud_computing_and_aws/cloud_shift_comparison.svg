  <text x="439.999858" y="463.399951" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--text-muted)">Actual Demand</text>
  <text x="119.999908" y="463.399951" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--danger-accent)">Waste or shortage</text>
  <rect x="79.999794" y="494.333273" width="500.000196" height="106.333508" rx="6.399999" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="99.999691" y="521.400036" font-family="Arial, sans-serif" font-size="20.573331" font-weight="bold" fill="var(--text)">Scaling Challenges</text>
  <text x="99.999691" y="544.599814" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--text-muted)">Manual scaling only</text>
  <text x="99.999691" y="563.933247" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--text-muted)">Risk of over/under provisioning</text>
  <text x="99.999691" y="583.266467" font-family="Arial, sans-serif" font-size="20.573331" fill="var(--text-muted)">Hardware lifecycle management</text>
  <rect x="610.504" y="290.838" width="58.9914" height="58.9914" rx="14" fill="var(--text)"/>

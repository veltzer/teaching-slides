<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="151.127" width="52.7977" height="52.7977" rx="14" fill="var(--text)"/>
  <text x="66.398861" y="184.70108" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.19943" font-weight="bold" fill="var(--bg)">Start</text>
  <text x="66.398861" y="234.927879" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.299333" fill="var(--text-muted)">Launch</text>
  <line x1="90.680265" y1="177.525824" x2="157.454122" y2="177.525824" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <rect x="167.571374" y="141.649539" width="161.876019" height="71.752569" rx="7.160048" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="248.509382" y="184.70108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.699184" font-weight="bold" fill="var(--warn-accent)">Pending</text>
  <line x1="329.447392" y1="177.525824" x2="410.385402" y2="177.525824" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <rect x="420.502653" y="129.690777" width="202.345024" height="95.670092" rx="7.160048" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="521.675165" y="184.70108" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.99913" font-weight="bold" fill="var(--bg)">Running</text>
  <line x1="471.088909" y1="225.36087" x2="369.916398" y2="392.783531" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <text x="390.150901" y="309.0722" font-family="Arial, sans-serif" font-size="13.19943" fill="var(--text-muted)">Stop</text>
  <line x1="572.261422" y1="225.36087" x2="693.668437" y2="392.783531" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <text x="653.199431" y="309.0722" font-family="Arial, sans-serif" font-size="13.19943" fill="var(--text-muted)">Terminate</text>
  <rect x="268.743885" y="404.742293" width="182.110521" height="71.752569" rx="7.160048" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="359.799146" y="447.793834" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.699184" font-weight="bold" fill="var(--warn-accent)">Stopping</text>
  <line x1="359.799146" y1="476.49473" x2="359.799146" y2="536.288537" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <rect x="268.743885" y="548.247431" width="182.110521" height="71.752569" rx="7.160048" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="359.799146" y="591.29884" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.699184" font-weight="bold" fill="var(--text-muted)">Stopped</text>
  <path d="M 268.743885 572.164954 Q 127.102369 572.164954 127.102369 297.113439 Q 127.102369 177.525824 167.571374 177.525824" fill="none" stroke="var(--ok-border)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <text x="96.750615" y="380.824769" font-family="Arial, sans-serif" font-size="13.19943" fill="var(--ok-accent)">Start</text>
  <line x1="450.854407" y1="584.123715" x2="643.08218" y2="584.123715" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <text x="546.968293" y="572.164954" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.19943" fill="var(--text-muted)">Terminate</text>
  <rect x="653.199431" y="404.742293" width="202.345024" height="71.752569" rx="7.160048" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="754.371836" y="447.793834" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.59928" font-weight="bold" fill="var(--warn-accent)">Shutting Down</text>
  <line x1="754.371836" y1="476.49473" x2="754.371836" y2="536.288537" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <rect x="653.199431" y="548.247431" width="202.345024" height="71.752569" rx="7.160048" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="754.371836" y="591.29884" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.699184" font-weight="bold" fill="var(--bg)">Terminated</text>
  <rect x="926.365213" y="105.773254" width="313.634787" height="310.9278" rx="7.160048" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1083.182607" y="147.628986" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.59928" font-weight="bold" fill="var(--text)">State Legend</text>
  <rect x="956.716967" y="171.546509" width="24.281403" height="19.134018" rx="7.160048" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.162413" y="188.288775" font-family="Arial, sans-serif" font-size="15.399355" fill="var(--text)">Running (billing active)</text>
  <rect x="956.716967" y="207.422793" width="24.281403" height="19.134018" rx="7.160048" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.162413" y="224.164928" font-family="Arial, sans-serif" font-size="15.399355" fill="var(--text)">Transitioning</text>
  <rect x="956.716967" y="243.299078" width="24.281403" height="19.134018" rx="7.160048" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="995.162413" y="260.041212" font-family="Arial, sans-serif" font-size="15.399355" fill="var(--text)">Stopped (no billing)</text>
  <rect x="956.716967" y="279.175231" width="24.281403" height="19.134018" rx="7.160048" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.162413" y="295.917497" font-family="Arial, sans-serif" font-size="15.399355" fill="var(--text)">Terminated (deleted)</text>
  <text x="1083.182607" y="344.948485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.19943" fill="var(--text-muted)">EBS-backed instances can</text>
  <text x="1083.182607" y="366.474124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.19943" fill="var(--text-muted)">be stopped and restarted.</text>
  <text x="1083.182607" y="388.000026" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.19943" fill="var(--text-muted)">Termination is permanent.</text>
  <path d="M 521.675165 129.690777 Q 521.675165 57.938208 592.495923 57.938208 Q 663.316683 57.938208 663.316683 129.690777" fill="none" stroke="var(--primary-border)" stroke-width="1.9104" marker-end="url(#arrow-primary)" />
  <text x="592.495923" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.299333" fill="var(--primary-accent)">Reboot</text>
</svg>
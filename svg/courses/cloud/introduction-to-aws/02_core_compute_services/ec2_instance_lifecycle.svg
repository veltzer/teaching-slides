<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--bg)" />
  <circle cx="115" cy="221.25" r="22.1218" fill="var(--text)" />
  <text x="115" y="226.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">Start</text>
  <text x="115" y="264.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9826" fill="var(--text-muted)">Launch</text>
  <line x1="137.5" y1="221.25" x2="199.375" y2="221.25" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <rect x="208.75" y="194.0625" width="150" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="283.75" y="226.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--warn-accent)">Pending</text>
  <line x1="358.75" y1="221.25" x2="433.75" y2="221.25" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <rect x="443.125" y="185" width="187.5" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="536.875" y="226.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)">Running</text>
  <line x1="490" y1="257.5" x2="396.25" y2="384.375" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <text x="415" y="320.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Stop</text>
  <line x1="583.75" y1="257.5" x2="696.25" y2="384.375" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <text x="658.75" y="320.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Terminate</text>
  <rect x="302.5" y="393.4375" width="168.75" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="386.875" y="426.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--warn-accent)">Stopping</text>
  <line x1="386.875" y1="447.8124" x2="386.875" y2="493.1249" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <rect x="302.5" y="502.1875" width="168.75" height="54.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="386.875" y="534.8124" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--text-muted)">Stopped</text>
  <path d="M 302.5 520.3125 Q 171.25 520.3125 171.25 311.875 Q 171.25 221.25 208.75 221.25" fill="none" stroke="var(--ok-border)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <text x="143.125" y="375.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Start</text>
  <line x1="471.25" y1="529.375" x2="649.375" y2="529.375" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <text x="560.3125" y="520.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Terminate</text>
  <rect x="658.75" y="393.4375" width="187.5" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="752.4999" y="426.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)">Shutting Down</text>
  <line x1="752.4999" y1="447.8124" x2="752.4999" y2="493.1249" stroke="var(--text-muted)" stroke-width="1.9104" marker-end="url(#arrow)" />
  <rect x="658.75" y="502.1875" width="187.5" height="54.375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="752.4999" y="534.8124" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)">Terminated</text>
  <rect x="911.875" y="166.875" width="290.625" height="235.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1057.1875" y="198.5938" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">State Legend</text>
  <rect x="940" y="216.7188" width="22.5" height="14.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="975.6249" y="229.4063" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Running (billing active)</text>
  <rect x="940" y="243.9063" width="22.5" height="14.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="975.6249" y="256.5937" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Transitioning</text>
  <rect x="940" y="271.0938" width="22.5" height="14.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="975.6249" y="283.7812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Stopped (no billing)</text>
  <rect x="940" y="298.2812" width="22.5" height="14.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="975.6249" y="310.9687" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Terminated (deleted)</text>
  <text x="1057.1875" y="348.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">EBS-backed instances can</text>
  <text x="1057.1875" y="364.4374" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">be stopped and restarted.</text>
  <text x="1057.1875" y="380.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Termination is permanent.</text>
  <path d="M 536.875 185 Q 536.875 130.625 602.5 130.625 Q 668.125 130.625 668.125 185" fill="none" stroke="var(--primary-border)" stroke-width="1.9104" marker-end="url(#arrow-primary)" />
  <text x="602.5" y="117.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9826" fill="var(--primary-accent)">Reboot</text>
</svg>
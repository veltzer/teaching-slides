<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--bg)"/>

  <!-- Chart area -->
  <rect x="77.5" y="58.125" width="1125" height="543.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <!-- Y-axis labels and bars -->
  <!-- Bar 1: On-Demand -->
  <text x="274.375" y="118.8438" text-anchor="end" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">On-Demand</text>
  <text x="274.375" y="136.9688" text-anchor="end" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Pay by hour/second, no commitment</text>
  <rect x="293.125" y="105.25" width="656.25" height="39.875" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="911.875" y="130.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">100% (baseline)</text>
  <text x="968.125" y="130.625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">$$$$</text>

  <!-- Bar 2: Reserved Instances -->
  <text x="274.375" y="209.4688" text-anchor="end" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Reserved</text>
  <text x="274.375" y="227.5938" text-anchor="end" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">1-3 year commitment</text>
  <rect x="293.125" y="195.875" width="459.375" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="715" y="221.25" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">28-72% savings</text>
  <rect x="752.5" y="195.875" width="196.875" height="39.875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="850.9375" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">saved</text>

  <!-- Bar 3: Savings Plans -->
  <text x="274.375" y="300.0938" text-anchor="end" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Savings Plans</text>
  <text x="274.375" y="318.2188" text-anchor="end" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Flexible, $/hr commitment</text>
  <rect x="293.125" y="286.5" width="412.5" height="39.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="668.125" y="311.875" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">34-66% savings</text>
  <rect x="705.625" y="286.5" width="243.75" height="39.875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="827.5" y="311.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">saved</text>

  <!-- Bar 4: Spot Instances -->
  <text x="274.375" y="390.7188" text-anchor="end" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Spot</text>
  <text x="274.375" y="408.8438" text-anchor="end" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Spare capacity, can be interrupted</text>
  <rect x="293.125" y="377.125" width="65.625" height="39.875" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="377.5" y="402.5" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Up to 90% savings</text>
  <rect x="358.75" y="377.125" width="590.625" height="39.875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="654.0625" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">saved</text>

  <!-- Bar 5: Dedicated Hosts -->
  <text x="274.375" y="481.3438" text-anchor="end" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Dedicated Hosts</text>
  <text x="274.375" y="499.4688" text-anchor="end" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Physical server, compliance needs</text>
  <rect x="293.125" y="467.75" width="703.125" height="39.875" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="916.5625" y="493.125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Most expensive</text>
  <text x="958.75" y="493.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--warn-accent)">$$$$$</text>

  <!-- Cost axis -->
  <line x1="293.125" y1="529.375" x2="949.375" y2="529.375" stroke="var(--border)" stroke-width="2"/>
  <text x="293.125" y="552.0312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">$0</text>
  <text x="621.25" y="552.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Relative Cost per Hour</text>
  <text x="949.375" y="552.0312" text-anchor="end" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">$$$</text>

  <!-- Recommendation note -->
  <rect x="293.125" y="565.625" width="656.25" height="27.1875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="621.25" y="583.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)">Tip: Combine pricing models for optimal cost. Use Reserved for baseline, Spot for burst, On-Demand for unpredictable.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="0" fill="var(--bg)"/>

  <!-- Chart area -->
  <rect x="40" y="20" width="1200" height="600" rx="12" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <!-- Y-axis labels and bars -->
  <!-- Bar 1: On-Demand -->
  <text x="250" y="87" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">On-Demand</text>
  <text x="250" y="107" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Pay by hour/second, no commitment</text>
  <rect x="270" y="72" width="700" height="44" rx="8" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="930" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">100% (baseline)</text>
  <text x="990" y="100" font-family="Arial, sans-serif" font-size="14" fill="var(--danger)">$$$$</text>

  <!-- Bar 2: Reserved Instances -->
  <text x="250" y="187" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Reserved</text>
  <text x="250" y="207" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">1-3 year commitment</text>
  <rect x="270" y="172" width="490" height="44" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="720" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">28-72% savings</text>
  <rect x="760" y="172" width="210" height="44" rx="8" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="865" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)">saved</text>

  <!-- Bar 3: Savings Plans -->
  <text x="250" y="287" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Savings Plans</text>
  <text x="250" y="307" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Flexible, $/hr commitment</text>
  <rect x="270" y="272" width="440" height="44" rx="8" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">34-66% savings</text>
  <rect x="710" y="272" width="260" height="44" rx="8" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="840" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)">saved</text>

  <!-- Bar 4: Spot Instances -->
  <text x="250" y="387" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Spot</text>
  <text x="250" y="407" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Spare capacity, can be interrupted</text>
  <rect x="270" y="372" width="70" height="44" rx="8" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="360" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">Up to 90% savings</text>
  <rect x="340" y="372" width="630" height="44" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="655" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">saved</text>

  <!-- Bar 5: Dedicated Hosts -->
  <text x="250" y="487" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">Dedicated Hosts</text>
  <text x="250" y="507" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Physical server, compliance needs</text>
  <rect x="270" y="472" width="750" height="44" rx="8" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="935" y="500" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)">Most expensive</text>
  <text x="980" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--warn)">$$$$$</text>

  <!-- Cost axis -->
  <line x1="270" y1="540" x2="970" y2="540" stroke="var(--border-strong)" stroke-width="2"/>
  <text x="270" y="565" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">$0</text>
  <text x="620" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Relative Cost per Hour</text>
  <text x="970" y="565" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">$$$</text>

  <!-- Recommendation note -->
  <rect x="270" y="580" width="700" height="30" rx="6" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1"/>
  <text x="620" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">Tip: Combine pricing models for optimal cost. Use Reserved for baseline, Spot for burst, On-Demand for unpredictable.</text>
</svg>
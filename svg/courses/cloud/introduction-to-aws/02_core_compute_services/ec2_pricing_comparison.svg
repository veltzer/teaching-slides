<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Chart area -->
  <rect x="40" y="40" width="1200" height="580" rx="6.4" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <!-- Y-axis labels and bars -->
  <!-- Bar 1: On-Demand -->
  <text x="250" y="104.76672" text-anchor="end" font-family="Arial, sans-serif" font-size="15.731093" font-weight="bold" fill="var(--text)">On-Demand</text>
  <text x="250" y="124.100053" text-anchor="end" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--text-muted)">Pay by hour/second, no commitment</text>
  <rect x="270" y="90.266667" width="700" height="42.533333" rx="6.4" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="930" y="117.333333" font-family="Arial, sans-serif" font-size="13.764693" font-weight="bold" fill="var(--bg)">100% (baseline)</text>
  <text x="990" y="117.333333" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--danger-accent)">$$$$</text>

  <!-- Bar 2: Reserved Instances -->
  <text x="250" y="201.433387" text-anchor="end" font-family="Arial, sans-serif" font-size="15.731093" font-weight="bold" fill="var(--text)">Reserved</text>
  <text x="250" y="220.76672" text-anchor="end" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--text-muted)">1-3 year commitment</text>
  <rect x="270" y="186.933333" width="490" height="42.533333" rx="6.4" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="720" y="214" font-family="Arial, sans-serif" font-size="13.764693" font-weight="bold" fill="var(--bg)">28-72% savings</text>
  <rect x="760" y="186.933333" width="210" height="42.533333" rx="6.4" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5,3" opacity="0.5" filter="url(#shadow)"/>
  <text x="865" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--danger-accent)">saved</text>

  <!-- Bar 3: Savings Plans -->
  <text x="250" y="298.100053" text-anchor="end" font-family="Arial, sans-serif" font-size="15.731093" font-weight="bold" fill="var(--text)">Savings Plans</text>
  <text x="250" y="317.433387" text-anchor="end" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--text-muted)">Flexible, $/hr commitment</text>
  <rect x="270" y="283.6" width="440" height="42.533333" rx="6.4" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="310.666667" font-family="Arial, sans-serif" font-size="13.764693" font-weight="bold" fill="var(--primary-accent)">34-66% savings</text>
  <rect x="710" y="283.6" width="260" height="42.533333" rx="6.4" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5,3" opacity="0.5" filter="url(#shadow)"/>
  <text x="840" y="310.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--danger-accent)">saved</text>

  <!-- Bar 4: Spot Instances -->
  <text x="250" y="394.76672" text-anchor="end" font-family="Arial, sans-serif" font-size="15.731093" font-weight="bold" fill="var(--text)">Spot</text>
  <text x="250" y="414.100053" text-anchor="end" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--text-muted)">Spare capacity, can be interrupted</text>
  <rect x="270" y="380.266667" width="70" height="42.533333" rx="6.4" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="360" y="407.333333" font-family="Arial, sans-serif" font-size="13.764693" font-weight="bold" fill="var(--ok-accent)">Up to 90% savings</text>
  <rect x="340" y="380.266667" width="630" height="42.533333" rx="6.4" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5,3" opacity="0.5" filter="url(#shadow)"/>
  <text x="655" y="407.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--ok-accent)">saved</text>

  <!-- Bar 5: Dedicated Hosts -->
  <text x="250" y="491.433387" text-anchor="end" font-family="Arial, sans-serif" font-size="15.731093" font-weight="bold" fill="var(--text)">Dedicated Hosts</text>
  <text x="250" y="510.76672" text-anchor="end" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--text-muted)">Physical server, compliance needs</text>
  <rect x="270" y="476.933333" width="750" height="42.533333" rx="6.4" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="935" y="504" font-family="Arial, sans-serif" font-size="13.764693" font-weight="bold" fill="var(--warn-accent)">Most expensive</text>
  <text x="980" y="504" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--warn-accent)">$$$$$</text>

  <!-- Cost axis -->
  <line x1="270" y1="542.666667" x2="970" y2="542.666667" stroke="var(--border)" stroke-width="2"/>
  <text x="270" y="566.83328" font-family="Arial, sans-serif" font-size="12.781547" fill="var(--text-muted)">$0</text>
  <text x="620" y="566.83328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.764693" font-weight="bold" fill="var(--text)">Relative Cost per Hour</text>
  <text x="970" y="566.83328" text-anchor="end" font-family="Arial, sans-serif" font-size="12.781547" fill="var(--text-muted)">$$$</text>

  <!-- Recommendation note -->
  <rect x="270" y="581.333333" width="700" height="29" rx="6.4" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="600.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.781547" fill="var(--primary-accent)">Tip: Combine pricing models for optimal cost. Use Reserved for baseline, Spot for burst, On-Demand for unpredictable.</text>
</svg>
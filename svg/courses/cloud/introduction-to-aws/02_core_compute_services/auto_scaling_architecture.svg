<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Users -->
  <rect x="40" y="210" width="113.207547" height="100" rx="6.925949" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="96.603774" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.791739" fill="var(--text-muted)">&#128100;</text>
  <text x="96.603774" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831928" font-weight="bold" fill="var(--text)">Users</text>

  <!-- Arrow: Users -> ALB -->
  <line x1="153.207547" y1="260" x2="232.45283" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="192.830189" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.70393" fill="var(--text-muted)">HTTPS</text>

  <!-- Application Load Balancer -->
  <rect x="243.773585" y="200" width="203.773585" height="120" rx="6.925949" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="345.660377" y="245.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.959811" font-weight="bold" fill="var(--bg)">Application</text>
  <text x="345.660377" y="265.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.959811" font-weight="bold" fill="var(--bg)">Load Balancer</text>
  <text x="345.660377" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.767872" fill="var(--primary-accent)">(ALB)</text>

  <!-- Arrows: ALB -> AZ1 instances -->
  <line x1="447.54717" y1="240" x2="560.754717" y2="170" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="447.54717" y1="280" x2="560.754717" y2="380" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <!-- Auto Scaling Group box -->
  <rect x="538.113208" y="40" width="701.886792" height="580" rx="6.925949" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2.5" stroke-dasharray="10,5"/>
  <text x="889.056604" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.151865" font-weight="bold" fill="var(--warn-accent)">Auto Scaling Group</text>

  <!-- AZ 1 -->
  <rect x="572.075472" y="94.999945" width="305.660377" height="230" rx="6.925949" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="724.90566" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.959811" font-weight="bold" fill="var(--text-muted)">Availability Zone 1</text>

  <!-- EC2 instances in AZ1 -->
  <rect x="600.377358" y="140" width="113.207547" height="70" rx="6.925949" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.981132" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831928" font-weight="bold" fill="var(--ok-accent)">EC2</text>
  <text x="656.981132" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.70393" fill="var(--text-muted)">Instance 1</text>

  <rect x="736.226415" y="140" width="113.207547" height="70" rx="6.925949" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.830189" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831928" font-weight="bold" fill="var(--ok-accent)">EC2</text>
  <text x="792.830189" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.70393" fill="var(--text-muted)">Instance 2</text>

  <!-- Scaling indicator in AZ1 -->
  <rect x="600.377358" y="230" width="249.056604" height="70" rx="6.925949" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5,3" filter="url(#shadow)"/>
  <text x="724.90566" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.767872" fill="var(--warn-accent)">EC2 (scales up)</text>
  <text x="724.90566" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.70393" fill="var(--text-muted)">Added when demand increases</text>

  <!-- AZ 2 -->
  <rect x="572.075472" y="350" width="305.660377" height="230" rx="6.925949" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="724.90566" y="377.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.959811" font-weight="bold" fill="var(--text-muted)">Availability Zone 2</text>

  <!-- EC2 instances in AZ2 -->
  <rect x="600.377358" y="394.999945" width="113.207547" height="70" rx="6.925949" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.981132" y="425.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831928" font-weight="bold" fill="var(--ok-accent)">EC2</text>
  <text x="656.981132" y="445.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.70393" fill="var(--text-muted)">Instance 3</text>

  <rect x="736.226415" y="394.999945" width="113.207547" height="70" rx="6.925949" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.830189" y="425.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831928" font-weight="bold" fill="var(--ok-accent)">EC2</text>
  <text x="792.830189" y="445.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.70393" fill="var(--text-muted)">Instance 4</text>

  <!-- Scaling indicator in AZ2 -->
  <rect x="600.377358" y="485.000055" width="249.056604" height="70" rx="6.925949" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5,3" filter="url(#shadow)"/>
  <text x="724.90566" y="514.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.767872" fill="var(--warn-accent)">EC2 (scales up)</text>
  <text x="724.90566" y="534.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.70393" fill="var(--text-muted)">Added when demand increases</text>

  <!-- CloudWatch -->
  <rect x="945.660377" y="150" width="249.056604" height="120" rx="6.925949" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.188679" y="194.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--info-accent)">CloudWatch</text>
  <text x="1070.188679" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831928" fill="var(--text-muted)">CPU &gt; 70%: Scale Out</text>
  <text x="1070.188679" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831928" fill="var(--text-muted)">CPU &lt; 30%: Scale In</text>

  <!-- Arrow: CloudWatch -> ASG -->
  <line x1="1070.188679" y1="270" x2="1070.188679" y2="340" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1092.830189" y="310" font-family="Arial, sans-serif" font-size="11.70393" fill="var(--info-accent)">Alarm</text>

  <!-- Scaling Policy box -->
  <rect x="945.660377" y="350" width="249.056604" height="90" rx="6.925949" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.188679" y="385.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.959811" font-weight="bold" fill="var(--warn-accent)">Scaling Policy</text>
  <text x="1070.188679" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.767872" fill="var(--text-muted)">Min: 2 | Desired: 4 | Max: 8</text>

  <!-- Arrow: Scaling Policy -> AZ instances -->
  <line x1="945.660377" y1="420" x2="877.735849" y2="440" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Health check note -->
  <rect x="945.660377" y="480" width="249.056604" height="80" rx="6.925949" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.188679" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.89587" font-weight="bold" fill="var(--ok-accent)">Health Checks</text>
  <text x="1070.188679" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.767872" fill="var(--text-muted)">EC2 + ELB health checks</text>
  <text x="1070.188679" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.767872" fill="var(--text-muted)">Replace unhealthy instances</text>
</svg>
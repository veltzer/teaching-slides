<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--bg)"/>

  <!-- Users -->
  <rect x="68.125" y="221.25" width="93.75" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="115" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.8088" fill="var(--text-muted)">&#128100;</text>
  <text x="115" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Users</text>

  <!-- Arrow: Users -> ALB -->
  <line x1="161.875" y1="266.5625" x2="227.5" y2="266.5625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="194.6875" y="255.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">HTTPS</text>

  <!-- Application Load Balancer -->
  <rect x="236.875" y="212.1875" width="168.75" height="108.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.25" y="252.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)">Application</text>
  <text x="321.25" y="271.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)">Load Balancer</text>
  <text x="321.25" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">(ALB)</text>

  <!-- Arrows: ALB -> AZ1 instances -->
  <line x1="405.625" y1="248.4375" x2="499.375" y2="185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="405.625" y1="284.6875" x2="499.375" y2="375.3125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <!-- Auto Scaling Group box -->
  <rect x="480.625" y="67.1875" width="581.25" height="525.625" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2.5" stroke-dasharray="10,5"/>
  <text x="771.25" y="96.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--warn-accent)">Auto Scaling Group</text>

  <!-- AZ 1 -->
  <rect x="508.75" y="117.0312" width="253.125" height="208.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="635.3125" y="141.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text-muted)">Availability Zone 1</text>

  <!-- EC2 instances in AZ1 -->
  <rect x="532.1875" y="157.8125" width="93.75" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="579.0625" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">EC2</text>
  <text x="579.0625" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Instance 1</text>

  <rect x="644.6875" y="157.8125" width="93.75" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="691.5625" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">EC2</text>
  <text x="691.5625" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Instance 2</text>

  <!-- Scaling indicator in AZ1 -->
  <rect x="532.1875" y="239.375" width="206.25" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="635.3125" y="266.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">EC2 (scales up)</text>
  <text x="635.3125" y="284.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Added when demand increases</text>

  <!-- AZ 2 -->
  <rect x="508.75" y="348.125" width="253.125" height="208.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="635.3125" y="372.5938" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text-muted)">Availability Zone 2</text>

  <!-- EC2 instances in AZ2 -->
  <rect x="532.1875" y="388.9062" width="93.75" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="579.0625" y="416.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">EC2</text>
  <text x="579.0625" y="434.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Instance 3</text>

  <rect x="644.6875" y="388.9062" width="93.75" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="691.5625" y="416.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">EC2</text>
  <text x="691.5625" y="434.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Instance 4</text>

  <!-- Scaling indicator in AZ2 -->
  <rect x="532.1875" y="470.4688" width="206.25" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="635.3125" y="497.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">EC2 (scales up)</text>
  <text x="635.3125" y="515.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Added when demand increases</text>

  <!-- CloudWatch -->
  <rect x="818.125" y="166.875" width="206.25" height="108.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.25" y="207.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--info-accent)">CloudWatch</text>
  <text x="921.25" y="230.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">CPU &gt; 70%: Scale Out</text>
  <text x="921.25" y="248.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">CPU &lt; 30%: Scale In</text>

  <!-- Arrow: CloudWatch -> ASG -->
  <line x1="921.25" y1="275.625" x2="921.25" y2="339.0625" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="940" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--info-accent)">Alarm</text>

  <!-- Scaling Policy box -->
  <rect x="818.125" y="348.125" width="206.25" height="81.5625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.25" y="379.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)">Scaling Policy</text>
  <text x="921.25" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Min: 2 | Desired: 4 | Max: 8</text>

  <!-- Arrow: Scaling Policy -> AZ instances -->
  <line x1="818.125" y1="411.5625" x2="761.875" y2="429.6875" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Health check note -->
  <rect x="818.125" y="465.9375" width="206.25" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="921.25" y="493.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Health Checks</text>
  <text x="921.25" y="513.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">EC2 + ELB health checks</text>
  <text x="921.25" y="529.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Replace unhealthy instances</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Level labels -->
  <text x="40" y="587.169811" font-family="Arial, sans-serif" font-size="13.459957" fill="var(--text-muted)" font-weight="bold">FOUNDATIONAL</text>
  <text x="40" y="395.660438" font-family="Arial, sans-serif" font-size="13.459957" fill="var(--text-muted)" font-weight="bold">ASSOCIATE</text>
  <text x="40" y="198.679306" font-family="Arial, sans-serif" font-size="13.459957" fill="var(--text-muted)" font-weight="bold">PROFESSIONAL</text>
  <text x="40" y="67.358551" font-family="Arial, sans-serif" font-size="13.459957" fill="var(--text-muted)" font-weight="bold">SPECIALTY</text>
  <!-- Guide lines -->
  <line x1="172.244898" y1="510.566038" x2="1240" y2="510.566038" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="172.244898" y1="313.584906" x2="1240" y2="313.584906" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="172.244898" y1="127.54717" x2="1240" y2="127.54717" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Foundational -->
  <rect x="436.734694" y="543.396226" width="391.836735" height="76.603774" rx="6.739695" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632.653061" y="589.358491" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.566058" font-weight="bold" fill="var(--bg)">Cloud Practitioner</text>
  <text x="632.653061" y="609.056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.389186" fill="var(--primary-accent)">CLF-C02</text>
  <!-- Arrows up -->
  <line x1="534.693878" y1="543.396226" x2="328.979592" y2="472.264091" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="632.653061" y1="543.396226" x2="632.653061" y2="472.264091" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730.612245" y1="543.396226" x2="936.326531" y2="472.264091" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Associate -->
  <rect x="182.040816" y="379.245283" width="284.081633" height="87.54717" rx="6.739695" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="324.081633" y="419.735789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.495287" font-weight="bold" fill="var(--bg)">Solutions Architect</text>
  <text x="324.081633" y="442.716981" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.424515" fill="var(--ok-accent)">Associate — SAA-C03</text>
  <rect x="495.510204" y="379.245283" width="284.081633" height="87.54717" rx="6.739695" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="637.55102" y="419.735789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.495287" font-weight="bold" fill="var(--bg)">Developer</text>
  <text x="637.55102" y="442.716981" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.424515" fill="var(--ok-accent)">Associate — DVA-C02</text>
  <rect x="808.979592" y="379.245283" width="284.081633" height="87.54717" rx="6.739695" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="951.020408" y="419.735789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.495287" font-weight="bold" fill="var(--bg)">SysOps Administrator</text>
  <text x="951.020408" y="442.716981" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.424515" fill="var(--ok-accent)">Associate — SOA-C02</text>
  <!-- Arrows up -->
  <line x1="324.081633" y1="379.245283" x2="426.938776" y2="269.811321" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="637.55102" y1="379.245283" x2="637.55102" y2="269.811321" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="951.020408" y1="379.245283" x2="848.163265" y2="269.811321" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Professional -->
  <rect x="260.408163" y="176.792513" width="333.061224" height="87.54717" rx="6.739695" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="426.938776" y="217.283019" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.495287" font-weight="bold" fill="var(--bg)">Solutions Architect</text>
  <text x="426.938776" y="240.264091" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.424515" fill="var(--warn-accent)">Professional — SAP-C02</text>
  <rect x="652.244898" y="176.792513" width="333.061224" height="87.54717" rx="6.739695" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="818.77551" y="217.283019" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.495287" font-weight="bold" fill="var(--bg)">DevOps Engineer</text>
  <text x="818.77551" y="240.264091" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.424515" fill="var(--warn-accent)">Professional — DOP-C02</text>
  <!-- Specialty -->
  <rect x="211.428571" y="40" width="195.918367" height="54.716981" rx="6.739695" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="309.387755" y="73.924468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.424515" font-weight="bold" fill="var(--bg)">Security</text>
  <rect x="426.938776" y="40" width="195.918367" height="54.716981" rx="6.739695" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="524.897959" y="73.924468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.424515" font-weight="bold" fill="var(--bg)">Networking</text>
  <rect x="642.44898" y="40" width="195.918367" height="54.716981" rx="6.739695" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740.408163" y="73.924468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.424515" font-weight="bold" fill="var(--bg)">Database</text>
  <rect x="857.959184" y="40" width="195.918367" height="54.716981" rx="6.739695" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955.918367" y="73.924468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.424515" font-weight="bold" fill="var(--bg)">ML Specialty</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--bg)" rx="6"/>
  <!-- Level labels -->
  <text x="63.4375" y="520.3125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" font-weight="bold">FOUNDATIONAL</text>
  <text x="63.4375" y="361.7188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" font-weight="bold">ASSOCIATE</text>
  <text x="63.4375" y="198.5938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" font-weight="bold">PROFESSIONAL</text>
  <text x="63.4375" y="89.8438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" font-weight="bold">SPECIALTY</text>
  <!-- Guide lines -->
  <line x1="190" y1="456.875" x2="1211.875" y2="456.875" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="190" y1="293.75" x2="1211.875" y2="293.75" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="190" y1="139.6875" x2="1211.875" y2="139.6875" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Foundational -->
  <rect x="443.125" y="484.0625" width="375" height="63.4375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="630.625" y="522.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)">Cloud Practitioner</text>
  <text x="630.625" y="538.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)">CLF-C02</text>
  <!-- Arrows up -->
  <line x1="536.875" y1="484.0625" x2="340" y2="425.1562" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630.625" y1="484.0625" x2="630.625" y2="425.1562" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="724.375" y1="484.0625" x2="921.25" y2="425.1562" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Associate -->
  <rect x="199.375" y="348.125" width="271.875" height="72.5" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="335.3125" y="381.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Solutions Architect</text>
  <text x="335.3125" y="400.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Associate — SAA-C03</text>
  <rect x="499.375" y="348.125" width="271.875" height="72.5" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="635.3125" y="381.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Developer</text>
  <text x="635.3125" y="400.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Associate — DVA-C02</text>
  <rect x="799.375" y="348.125" width="271.875" height="72.5" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="935.3125" y="381.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">SysOps Administrator</text>
  <text x="935.3125" y="400.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Associate — SOA-C02</text>
  <!-- Arrows up -->
  <line x1="335.3125" y1="348.125" x2="433.75" y2="257.5" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="635.3125" y1="348.125" x2="635.3125" y2="257.5" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="935.3125" y1="348.125" x2="836.875" y2="257.5" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Professional -->
  <rect x="274.375" y="180.4688" width="318.75" height="72.5" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="433.75" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Solutions Architect</text>
  <text x="433.75" y="233.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">Professional — SAP-C02</text>
  <rect x="649.375" y="180.4688" width="318.75" height="72.5" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="808.75" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">DevOps Engineer</text>
  <text x="808.75" y="233.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">Professional — DOP-C02</text>
  <!-- Specialty -->
  <rect x="227.5" y="67.1875" width="187.5" height="45.3125" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="321.25" y="95.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">Security</text>
  <rect x="433.75" y="67.1875" width="187.5" height="45.3125" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="527.5" y="95.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">Networking</text>
  <rect x="640" y="67.1875" width="187.5" height="45.3125" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="733.75" y="95.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">Database</text>
  <rect x="846.25" y="67.1875" width="187.5" height="45.3125" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="940" y="95.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">ML Specialty</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --border: #e0e0e0;
        --text: #212121; --text-dark: #333333; --text-muted: #555555;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="640" fill="var(--bg)"/>
  <!-- Level labels -->
  <text x="25" y="530" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" font-weight="bold">FOUNDATIONAL</text>
  <text x="25" y="355" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" font-weight="bold">ASSOCIATE</text>
  <text x="25" y="175" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" font-weight="bold">PROFESSIONAL</text>
  <text x="25" y="55" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" font-weight="bold">SPECIALTY</text>
  <!-- Guide lines -->
  <line x1="160" y1="460" x2="1250" y2="460" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="160" y1="280" x2="1250" y2="280" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="160" y1="110" x2="1250" y2="110" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Foundational -->
  <rect x="430" y="490" width="400" height="70" rx="10" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="630" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Cloud Practitioner</text>
  <text x="630" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-lt)">CLF-C02</text>
  <!-- Arrows up -->
  <line x1="530" y1="490" x2="320" y2="425" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="490" x2="630" y2="425" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="490" x2="940" y2="425" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Associate -->
  <rect x="170" y="340" width="290" height="80" rx="10" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="315" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Solutions Architect</text>
  <text x="315" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-lt)">Associate — SAA-C03</text>
  <rect x="490" y="340" width="290" height="80" rx="10" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="635" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Developer</text>
  <text x="635" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-lt)">Associate — DVA-C02</text>
  <rect x="810" y="340" width="290" height="80" rx="10" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="955" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">SysOps Administrator</text>
  <text x="955" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-lt)">Associate — SOA-C02</text>
  <!-- Arrows up -->
  <line x1="315" y1="340" x2="420" y2="240" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="635" y1="340" x2="635" y2="240" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="955" y1="340" x2="850" y2="240" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Professional -->
  <rect x="250" y="155" width="340" height="80" rx="10" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="420" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Solutions Architect</text>
  <text x="420" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-lt)">Professional — SAP-C02</text>
  <rect x="650" y="155" width="340" height="80" rx="10" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="820" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">DevOps Engineer</text>
  <text x="820" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-lt)">Professional — DOP-C02</text>
  <!-- Specialty -->
  <rect x="200" y="30" width="200" height="50" rx="8" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="300" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)">Security</text>
  <rect x="420" y="30" width="200" height="50" rx="8" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="520" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)">Networking</text>
  <rect x="640" y="30" width="200" height="50" rx="8" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="740" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)">Database</text>
  <rect x="860" y="30" width="200" height="50" rx="8" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="960" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)">ML Specialty</text>
</svg>

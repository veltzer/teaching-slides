<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--bg)" rx="6"/>
  <!-- Pillar 1 -->
  <rect x="68.125" y="67.1875" width="178.125" height="525.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="68.125" y="67.1875" width="178.125" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="68.125" y="101.625" width="178.125" height="10.875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="157.1875" y="97.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Operational Exc.</text>
  <text x="157.1875" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Run &amp; monitor</text>
  <text x="157.1875" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">systems</text>
  <text x="157.1875" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Automate changes</text>
  <text x="157.1875" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Learn from events</text>
  <!-- Pillar 2 -->
  <rect x="260.3125" y="67.1875" width="178.125" height="525.625" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="260.3125" y="67.1875" width="178.125" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="260.3125" y="101.625" width="178.125" height="10.875" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="349.375" y="97.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Security</text>
  <text x="349.375" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Protect data</text>
  <text x="349.375" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">&amp; systems</text>
  <text x="349.375" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Identity foundation</text>
  <text x="349.375" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Defense in depth</text>
  <!-- Pillar 3 -->
  <rect x="452.5" y="67.1875" width="178.125" height="525.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="452.5" y="67.1875" width="178.125" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="452.5" y="101.625" width="178.125" height="10.875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="541.5625" y="97.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Reliability</text>
  <text x="541.5625" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Recover from</text>
  <text x="541.5625" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">failures</text>
  <text x="541.5625" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Scale horizontally</text>
  <text x="541.5625" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Test recovery</text>
  <!-- Pillar 4 -->
  <rect x="644.6875" y="67.1875" width="178.125" height="525.625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="644.6875" y="67.1875" width="178.125" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="644.6875" y="101.625" width="178.125" height="10.875" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="733.75" y="97.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Performance</text>
  <text x="733.75" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Use resources</text>
  <text x="733.75" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">efficiently</text>
  <text x="733.75" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Right resource types</text>
  <text x="733.75" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Monitor metrics</text>
  <!-- Pillar 5 -->
  <rect x="836.875" y="67.1875" width="178.125" height="525.625" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="836.875" y="67.1875" width="178.125" height="45.3125" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="836.875" y="101.625" width="178.125" height="10.875" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="925.9375" y="97.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Cost Optimization</text>
  <text x="925.9375" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Avoid unnecessary</text>
  <text x="925.9375" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">costs</text>
  <text x="925.9375" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Right pricing model</text>
  <text x="925.9375" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Match supply/demand</text>
  <!-- Pillar 6 -->
  <rect x="1029.0625" y="67.1875" width="178.125" height="525.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1029.0625" y="67.1875" width="178.125" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="1029.0625" y="101.625" width="178.125" height="10.875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1118.125" y="97.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Sustainability</text>
  <text x="1118.125" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Minimize env.</text>
  <text x="1118.125" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">impact</text>
  <text x="1118.125" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Maximize utilization</text>
  <text x="1118.125" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Efficient tech</text>
</svg>

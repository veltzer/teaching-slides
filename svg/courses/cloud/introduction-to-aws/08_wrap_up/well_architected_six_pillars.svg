<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="640" fill="var(--bg)"/>
  <!-- Pillar 1 -->
  <rect x="30" y="30" width="190" height="580" rx="12" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="30" width="190" height="50" rx="12" fill="url(#grad-primary)"/>
  <rect x="30" y="68" width="190" height="12" fill="url(#grad-primary)"/>
  <text x="125" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Operational Exc.</text>
  <text x="125" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Run &amp; monitor</text>
  <text x="125" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">systems</text>
  <text x="125" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Automate changes</text>
  <text x="125" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Learn from events</text>
  <!-- Pillar 2 -->
  <rect x="235" y="30" width="190" height="580" rx="12" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="235" y="30" width="190" height="50" rx="12" fill="url(#grad-danger)"/>
  <rect x="235" y="68" width="190" height="12" fill="url(#grad-danger)"/>
  <text x="330" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Security</text>
  <text x="330" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Protect data</text>
  <text x="330" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&amp; systems</text>
  <text x="330" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Identity foundation</text>
  <text x="330" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Defense in depth</text>
  <!-- Pillar 3 -->
  <rect x="440" y="30" width="190" height="580" rx="12" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="440" y="30" width="190" height="50" rx="12" fill="url(#grad-ok)"/>
  <rect x="440" y="68" width="190" height="12" fill="url(#grad-ok)"/>
  <text x="535" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Reliability</text>
  <text x="535" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Recover from</text>
  <text x="535" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">failures</text>
  <text x="535" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Scale horizontally</text>
  <text x="535" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Test recovery</text>
  <!-- Pillar 4 -->
  <rect x="645" y="30" width="190" height="580" rx="12" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="645" y="30" width="190" height="50" rx="12" fill="url(#grad-warn)"/>
  <rect x="645" y="68" width="190" height="12" fill="url(#grad-warn)"/>
  <text x="740" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Performance</text>
  <text x="740" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Use resources</text>
  <text x="740" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">efficiently</text>
  <text x="740" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Right resource types</text>
  <text x="740" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Monitor metrics</text>
  <!-- Pillar 5 -->
  <rect x="850" y="30" width="190" height="580" rx="12" fill="var(--info-pale)" stroke="var(--info-dk)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="850" y="30" width="190" height="50" rx="12" fill="url(#grad-info)"/>
  <rect x="850" y="68" width="190" height="12" fill="url(#grad-info)"/>
  <text x="945" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Cost Optimization</text>
  <text x="945" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Avoid unnecessary</text>
  <text x="945" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">costs</text>
  <text x="945" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Right pricing model</text>
  <text x="945" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Match supply/demand</text>
  <!-- Pillar 6 -->
  <rect x="1055" y="30" width="190" height="580" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1055" y="30" width="190" height="50" rx="12" fill="var(--ok)"/>
  <rect x="1055" y="68" width="190" height="12" fill="var(--ok)"/>
  <text x="1150" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Sustainability</text>
  <text x="1150" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Minimize env.</text>
  <text x="1150" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">impact</text>
  <text x="1150" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Maximize utilization</text>
  <text x="1150" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Efficient tech</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Pillar 1 -->
  <rect x="40" y="40" width="187.654321" height="580" rx="6.469103" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="187.654321" height="50" rx="6.469103" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="78" width="187.654321" height="12" fill="url(#grad-primary)" rx="6.469103" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.82716" y="73.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.919554" font-weight="bold" fill="var(--bg)">Operational Exc.</text>
  <text x="133.82716" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.925684" fill="var(--text-muted)">Run &amp; monitor</text>
  <text x="133.82716" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.925684" fill="var(--text-muted)">systems</text>
  <text x="133.82716" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.931922" fill="var(--text-faint)">Automate changes</text>
  <text x="133.82716" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.931922" fill="var(--text-faint)">Learn from events</text>
  <!-- Pillar 2 -->
  <rect x="242.469136" y="40" width="187.654321" height="580" rx="6.469103" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="242.469136" y="40" width="187.654321" height="50" rx="6.469103" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="242.469136" y="78" width="187.654321" height="12" fill="url(#grad-danger)" rx="6.469103" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="336.296296" y="73.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.913316" font-weight="bold" fill="var(--bg)">Security</text>
  <text x="336.296296" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.925684" fill="var(--text-muted)">Protect data</text>
  <text x="336.296296" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.925684" fill="var(--text-muted)">&amp; systems</text>
  <text x="336.296296" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.931922" fill="var(--text-faint)">Identity foundation</text>
  <text x="336.296296" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.931922" fill="var(--text-faint)">Defense in depth</text>
  <!-- Pillar 3 -->
  <rect x="444.938272" y="40" width="187.654321" height="580" rx="6.469103" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="444.938272" y="40" width="187.654321" height="50" rx="6.469103" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="444.938272" y="78" width="187.654321" height="12" fill="url(#grad-ok)" rx="6.469103" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="538.765432" y="73.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.913316" font-weight="bold" fill="var(--bg)">Reliability</text>
  <text x="538.765432" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.925684" fill="var(--text-muted)">Recover from</text>
  <text x="538.765432" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.925684" fill="var(--text-muted)">failures</text>
  <text x="538.765432" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.931922" fill="var(--text-faint)">Scale horizontally</text>
  <text x="538.765432" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.931922" fill="var(--text-faint)">Test recovery</text>
  <!-- Pillar 4 -->
  <rect x="647.407407" y="40" width="187.654321" height="580" rx="6.469103" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="647.407407" y="40" width="187.654321" height="50" rx="6.469103" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="647.407407" y="78" width="187.654321" height="12" fill="url(#grad-warn)" rx="6.469103" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="741.234568" y="73.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.913316" font-weight="bold" fill="var(--bg)">Performance</text>
  <text x="741.234568" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.925684" fill="var(--text-muted)">Use resources</text>
  <text x="741.234568" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.925684" fill="var(--text-muted)">efficiently</text>
  <text x="741.234568" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.931922" fill="var(--text-faint)">Right resource types</text>
  <text x="741.234568" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.931922" fill="var(--text-faint)">Monitor metrics</text>
  <!-- Pillar 5 -->
  <rect x="849.876543" y="40" width="187.654321" height="580" rx="6.469103" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="849.876543" y="40" width="187.654321" height="50" rx="6.469103" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="849.876543" y="78" width="187.654321" height="12" fill="url(#grad-info)" rx="6.469103" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="943.703704" y="73.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.919554" font-weight="bold" fill="var(--bg)">Cost Optimization</text>
  <text x="943.703704" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.925684" fill="var(--text-muted)">Avoid unnecessary</text>
  <text x="943.703704" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.925684" fill="var(--text-muted)">costs</text>
  <text x="943.703704" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.931922" fill="var(--text-faint)">Right pricing model</text>
  <text x="943.703704" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.931922" fill="var(--text-faint)">Match supply/demand</text>
  <!-- Pillar 6 -->
  <rect x="1052.345679" y="40" width="187.654321" height="580" rx="6.469103" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1052.345679" y="40" width="187.654321" height="50" rx="6.469103" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1052.345679" y="78" width="187.654321" height="12" fill="url(#grad-ok)" rx="6.469103" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1146.17284" y="73.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.919554" font-weight="bold" fill="var(--bg)">Sustainability</text>
  <text x="1146.17284" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.925684" fill="var(--text-muted)">Minimize env.</text>
  <text x="1146.17284" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.925684" fill="var(--text-muted)">impact</text>
  <text x="1146.17284" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.931922" fill="var(--text-faint)">Maximize utilization</text>
  <text x="1146.17284" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.931922" fill="var(--text-faint)">Efficient tech</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Step 1: Metric Source -->
  <rect x="40" y="172.280702" width="233.628319" height="203.508772" rx="6.766585" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.814159" y="202.807018" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.592581" font-weight="bold" fill="var(--primary-accent)">Metric Source</text>

  <!-- CPU graph mini visualization -->
  <rect x="61.238938" y="218.070119" width="191.150442" height="81.403509" rx="6.766585" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="71.858407" y="238.420996" font-family="Arial, sans-serif" font-size="11.277642" fill="var(--text-muted)">CPU %</text>
  <polyline points="71.858407,284.210526 98.40708,274.035088 124.955752,279.122751 151.504425,253.684211 172.743363,233.333333 193.982301,228.24567 220.530973,223.157895 236.460177,221.122807" fill="none" stroke="var(--primary-border)" stroke-width="2"/>
  <!-- Threshold line -->
  <line x1="61.238938" y1="248.596547" x2="252.389381" y2="248.596547" stroke="var(--danger-border)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="209.911504" y="243.508772" font-family="Arial, sans-serif" font-size="11.277642" fill="var(--danger-accent)">80%</text>

  <text x="156.814159" y="319.824505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--text-muted)">EC2, RDS, Lambda</text>
  <text x="156.814159" y="340.175382" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--text-muted)">Custom metrics</text>

  <!-- Arrow to threshold check -->
  <line x1="273.628319" y1="274.035088" x2="347.964602" y2="274.035088" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 2: Threshold Evaluation -->
  <rect x="358.584071" y="202.807018" width="212.389381" height="142.45614" rx="6.766585" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.778761" y="233.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--warn-accent)">Threshold</text>
  <text x="464.778761" y="253.684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--warn-accent)">Evaluation</text>

  <text x="464.778761" y="284.210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--text-muted)">CPU &gt; 80% for</text>
  <text x="464.778761" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--text-muted)">5 min (3 of 3</text>
  <text x="464.778761" y="324.912281" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--text-muted)">datapoints)</text>

  <!-- Arrow to alarm state -->
  <line x1="570.973451" y1="274.035088" x2="645.309735" y2="274.035088" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 3: Alarm States -->
  <rect x="655.929204" y="151.929825" width="212.389381" height="244.210526" rx="6.766585" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="762.123894" y="182.45614" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--text)">Alarm States</text>

  <rect x="682.477876" y="197.719242" width="159.292035" height="36.631579" rx="6.766585" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="762.123894" y="221.122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.513661" font-weight="bold" fill="var(--bg)">OK</text>

  <rect x="682.477876" y="245.54386" width="159.292035" height="36.631579" rx="6.766585" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="762.123894" y="268.947425" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.513661" font-weight="bold" fill="var(--bg)">ALARM</text>

  <rect x="682.477876" y="293.368477" width="159.292035" height="36.631579" rx="6.766585" fill="var(--text-muted)"/>
  <text x="762.123894" y="316.77193" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.513661" font-weight="bold" fill="var(--bg)">INSUFFICIENT DATA</text>

  <text x="762.123894" y="360.52626" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--text-muted)">State transitions</text>
  <text x="762.123894" y="380.877137" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--text-muted)">trigger actions</text>

  <!-- Arrow from ALARM to actions -->
  <line x1="868.318584" y1="263.859649" x2="942.654867" y2="263.859649" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="905.486726" y="253.684211" font-family="Arial, sans-serif" font-size="11.434627" font-weight="bold" fill="var(--danger-accent)">ALARM</text>

  <!-- Step 4: Actions -->
  <text x="1123.185841" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.632154" font-weight="bold" fill="var(--text)">Actions</text>

  <!-- Action 1: SNS Notification -->
  <line x1="953.274336" y1="263.859649" x2="1006.371681" y2="111.22807" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="1006.371681" y="60.350877" width="233.628319" height="91.578947" rx="6.766585" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1123.185841" y="90.877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--bg)">SNS Notification</text>
  <text x="1123.185841" y="111.22807" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--ok-accent)">Email, SMS, HTTP</text>
  <text x="1123.185841" y="131.578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--ok-accent)">Lambda trigger</text>

  <!-- Action 2: Auto Scaling -->
  <line x1="953.274336" y1="263.859649" x2="1006.371681" y2="263.859649" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="1006.371681" y="212.982456" width="233.628319" height="91.578947" rx="6.766585" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1123.185841" y="245.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--bg)">Auto Scaling</text>
  <text x="1123.185841" y="265.894737" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--primary-accent)">Scale out/in instances</text>
  <text x="1123.185841" y="286.245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--primary-accent)">Dynamic scaling</text>

  <!-- Action 3: EC2 Actions -->
  <line x1="953.274336" y1="263.859649" x2="1006.371681" y2="416.491228" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="1006.371681" y="365.614035" width="233.628319" height="91.578947" rx="6.766585" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1123.185841" y="398.175439" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--bg)">EC2 Actions</text>
  <text x="1123.185841" y="418.526316" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--warn-accent)">Stop, Terminate, Reboot</text>
  <text x="1123.185841" y="438.877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--warn-accent)">Recover instance</text>

  <!-- Example scenarios -->
  <rect x="40" y="447.017544" width="849.557522" height="172.982456" rx="6.766585" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="464.778761" y="477.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.592581" font-weight="bold" fill="var(--text)">Common Alarm Patterns</text>

  <rect x="61.238938" y="492.807074" width="254.867257" height="50.877193" rx="6.766585" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="188.672566" y="514.175439" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" font-weight="bold" fill="var(--primary-accent)">CPU &gt; 80% for 5 min</text>
  <text x="188.672566" y="533.508828" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.434627" fill="var(--text-muted)">Scale out + notify</text>

  <rect x="337.345133" y="492.807074" width="254.867257" height="50.877193" rx="6.766585" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.778761" y="514.175439" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" font-weight="bold" fill="var(--danger-accent)">Status Check Failed</text>
  <text x="464.778761" y="533.508828" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.434627" fill="var(--text-muted)">Recover instance</text>

  <rect x="613.451327" y="492.807074" width="254.867257" height="50.877193" rx="6.766585" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740.884956" y="514.175439" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" font-weight="bold" fill="var(--warn-accent)">Billing &gt; $100</text>
  <text x="740.884956" y="533.508828" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.434627" fill="var(--text-muted)">Budget alert notification</text>

  <rect x="61.238938" y="553.859705" width="254.867257" height="50.877193" rx="6.766585" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="188.672566" y="575.22807" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" font-weight="bold" fill="var(--ok-accent)">Healthy Hosts &lt; 2</text>
  <text x="188.672566" y="594.56146" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.434627" fill="var(--text-muted)">ALB target group alert</text>

  <rect x="337.345133" y="553.859705" width="254.867257" height="50.877193" rx="6.766585" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.778761" y="575.22807" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" font-weight="bold" fill="var(--info-accent)">Error Rate &gt; 5%</text>
  <text x="464.778761" y="594.56146" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.434627" fill="var(--text-muted)">Application health alert</text>

  <rect x="613.451327" y="553.859705" width="254.867257" height="50.877193" rx="6.766585" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740.884956" y="575.22807" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" font-weight="bold" fill="var(--primary-accent)">Disk Usage &gt; 90%</text>
  <text x="740.884956" y="594.56146" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.434627" fill="var(--text-muted)">Storage capacity warning</text>
</svg>

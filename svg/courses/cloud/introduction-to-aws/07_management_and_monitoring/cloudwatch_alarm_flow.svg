<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)"/>

  <!-- Step 1: Metric Source -->
  <rect x="77.5" y="203.125" width="206.25" height="181.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.625" y="230.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--primary-accent)">Metric Source</text>

  <!-- CPU graph mini visualization -->
  <rect x="96.25" y="243.9062" width="168.75" height="72.5" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="105.625" y="262.0312" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">CPU %</text>
  <polyline points="105.625,302.8125 129.0625,293.75 152.5,298.2812 175.9375,275.625 194.6875,257.5 213.4375,252.9688 236.875,248.4375 250.9375,246.625" fill="none" stroke="var(--primary-border)" stroke-width="2"/>
  <!-- Threshold line -->
  <line x1="96.25" y1="271.0938" x2="265" y2="271.0938" stroke="var(--danger-border)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="227.5" y="266.5625" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)">80%</text>

  <text x="180.625" y="334.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">EC2, RDS, Lambda</text>
  <text x="180.625" y="352.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Custom metrics</text>

  <!-- Arrow to threshold check -->
  <line x1="283.75" y1="293.75" x2="349.375" y2="293.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Threshold Evaluation -->
  <rect x="358.75" y="230.3125" width="187.5" height="126.875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="452.5" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Threshold</text>
  <text x="452.5" y="275.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Evaluation</text>

  <text x="452.5" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">CPU > 80% for</text>
  <text x="452.5" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">5 min (3 of 3</text>
  <text x="452.5" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">datapoints)</text>

  <!-- Arrow to alarm state -->
  <line x1="546.25" y1="293.75" x2="611.875" y2="293.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Alarm States -->
  <rect x="621.25" y="185" width="187.5" height="217.5" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="715" y="212.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Alarm States</text>

  <rect x="644.6875" y="225.7812" width="140.625" height="32.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="715" y="246.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">OK</text>

  <rect x="644.6875" y="268.375" width="140.625" height="32.625" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="715" y="289.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">ALARM</text>

  <rect x="644.6875" y="310.9688" width="140.625" height="32.625" rx="6" fill="var(--text-muted)"/>
  <text x="715" y="331.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">INSUFFICIENT DATA</text>

  <text x="715" y="370.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">State transitions</text>
  <text x="715" y="388.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">trigger actions</text>

  <!-- Arrow from ALARM to actions -->
  <line x1="808.75" y1="284.6875" x2="874.375" y2="284.6875" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="841.5625" y="275.625" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--danger-accent)">ALARM</text>

  <!-- Step 4: Actions -->
  <text x="1033.75" y="85.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Actions</text>

  <!-- Action 1: SNS Notification -->
  <line x1="883.75" y1="284.6875" x2="930.625" y2="148.75" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="930.625" y="103.4375" width="206.25" height="81.5625" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="130.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">SNS Notification</text>
  <text x="1033.75" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Email, SMS, HTTP</text>
  <text x="1033.75" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Lambda trigger</text>

  <!-- Action 2: Auto Scaling -->
  <line x1="883.75" y1="284.6875" x2="930.625" y2="284.6875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="930.625" y="239.375" width="206.25" height="81.5625" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1033.75" y="268.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Auto Scaling</text>
  <text x="1033.75" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">Scale out/in instances</text>
  <text x="1033.75" y="304.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">Dynamic scaling policies</text>

  <!-- Action 3: EC2 Actions -->
  <line x1="883.75" y1="284.6875" x2="930.625" y2="420.625" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="930.625" y="375.3125" width="206.25" height="81.5625" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1033.75" y="404.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">EC2 Actions</text>
  <text x="1033.75" y="422.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">Stop, Terminate, Reboot</text>
  <text x="1033.75" y="440.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">Recover instance</text>

  <!-- Example scenarios -->
  <rect x="77.5" y="447.8125" width="750" height="154.0625" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="452.5" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text)">Common Alarm Patterns</text>

  <rect x="96.25" y="488.5938" width="225" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="208.75" y="507.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">CPU > 80% for 5 min</text>
  <text x="208.75" y="524.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Scale out + notify</text>

  <rect x="340" y="488.5938" width="225" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="452.5" y="507.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--danger-accent)">Status Check Failed</text>
  <text x="452.5" y="524.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Recover instance</text>

  <rect x="583.75" y="488.5938" width="225" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="696.25" y="507.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Billing > $100</text>
  <text x="696.25" y="524.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Budget alert notification</text>

  <rect x="96.25" y="542.9688" width="225" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="208.75" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Healthy Hosts &lt; 2</text>
  <text x="208.75" y="579.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">ALB target group alert</text>

  <rect x="340" y="542.9688" width="225" height="45.3125" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="452.5" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)">Error Rate > 5%</text>
  <text x="452.5" y="579.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Application health alert</text>

  <rect x="583.75" y="542.9688" width="225" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="696.25" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Disk Usage > 90%</text>
  <text x="696.25" y="579.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Storage capacity warning</text>
</svg>

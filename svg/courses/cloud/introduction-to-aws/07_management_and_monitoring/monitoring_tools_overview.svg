<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Central hub: CloudWatch -->
  <rect x="527.757" y="235.161" width="179.673" height="179.673" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="617.593361" y="314.992136" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.967362" font-weight="bold" fill="var(--bg)">Amazon</text>
  <text x="617.593361" y="340.005298" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.967362" font-weight="bold" fill="var(--bg)">CloudWatch</text>
  <text x="617.593361" y="365.018349" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.978204" fill="var(--primary-accent)">Metrics, Logs, Alarms</text>

  <!-- Spoke 1: CloudTrail (top-left) -->
  <line x1="547.883817" y1="259.963357" x2="348.713693" y2="134.897772" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="224.081" y="40" width="129.764" height="129.764" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="288.962656" y="94.876801" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.97459" font-weight="bold" fill="var(--bg)">CloudTrail</text>
  <text x="288.962656" y="116.888334" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" fill="var(--ok-accent)">API Audit Logs</text>
  <!-- Description -->
  <rect x="99.751037" y="179.921418" width="219.087137" height="55.028889" rx="6.497594" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.294606" y="199.931903" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" fill="var(--ok-accent)">Who did what, when, where</text>
  <text x="209.294606" y="219.942387" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" fill="var(--text-muted)">Governance and compliance</text>

  <!-- Spoke 2: Config (top-right) -->
  <line x1="687.302905" y1="259.963357" x2="886.473029" y2="134.897772" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="881.342" y="40" width="129.764" height="129.764" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="946.224066" y="94.876801" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.97459" font-weight="bold" fill="var(--bg)">AWS Config</text>
  <text x="946.224066" y="116.888334" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" fill="var(--warn-accent)">Resource Tracking</text>
  <!-- Description -->
  <rect x="836.680498" y="179.921418" width="219.087137" height="55.028889" rx="6.497594" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="946.224066" y="199.931903" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" fill="var(--warn-accent)">Configuration change history</text>
  <text x="946.224066" y="219.942387" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" fill="var(--text-muted)">Compliance rules evaluation</text>

  <!-- Spoke 3: Trusted Advisor (right) -->
  <line x1="707.219917" y1="324.997379" x2="936.26556" y2="324.997379" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="951.052" y="260.115" width="129.764" height="129.764" rx="14" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="1015.93361" y="314.992136" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.976451" font-weight="bold" fill="var(--bg)">Trusted</text>
  <text x="1015.93361" y="335.002621" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.976451" font-weight="bold" fill="var(--bg)">Advisor</text>
  <!-- Description -->
  <rect x="1090.622407" y="294.981651" width="149.377593" height="60.031455" rx="6.497594" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1165.311203" y="316.993185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" fill="var(--info-accent)">Best practice checks</text>
  <text x="1165.311203" y="337.00367" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" fill="var(--text-muted)">Cost, security, perf</text>

  <!-- Spoke 4: Systems Manager (bottom-right) -->
  <line x1="687.302905" y1="390.031399" x2="886.473029" y2="515.096986" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="881.342" y="490.236" width="129.764" height="129.764" rx="14" fill="var(--primary-accent)"/>
  <text x="946.224066" y="545.112714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.976451" font-weight="bold" fill="var(--bg)">Systems</text>
  <text x="946.224066" y="565.123199" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.976451" font-weight="bold" fill="var(--bg)">Manager</text>
  <!-- Description -->
  <rect x="836.680498" y="490.083826" width="219.087137" height="40.02097" rx="6.497594" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="946.224066" y="515.096986" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" fill="var(--primary-accent)">Operational management</text>

  <!-- Spoke 5: Health Dashboard (bottom-left) -->
  <line x1="547.883817" y1="390.031399" x2="348.713693" y2="515.096986" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="224.081" y="490.236" width="129.764" height="129.764" rx="14" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="288.962656" y="545.112714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.976451" font-weight="bold" fill="var(--bg)">Health</text>
  <text x="288.962656" y="565.123199" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.976451" font-weight="bold" fill="var(--bg)">Dashboard</text>
  <!-- Description -->
  <rect x="99.751037" y="490.083826" width="219.087137" height="40.02097" rx="6.497594" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.294606" y="515.096986" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" fill="var(--danger-accent)">Service health and events</text>

  <!-- Spoke 6: X-Ray (left) -->
  <line x1="527.966805" y1="324.997379" x2="298.921162" y2="324.997379" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="154.371" y="260.115" width="129.764" height="129.764" rx="14" fill="var(--text-muted)"/>
  <text x="219.253112" y="314.992136" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.97459" font-weight="bold" fill="var(--bg)">AWS</text>
  <text x="219.253112" y="335.002621" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.97459" font-weight="bold" fill="var(--bg)">X-Ray</text>
  <!-- Description -->
  <rect x="40" y="294.981651" width="114.522822" height="60.031455" rx="6.497594" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="96.763485" y="316.993185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" fill="var(--text)">Distributed</text>
  <text x="96.763485" y="337.00367" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" fill="var(--text)">tracing</text>

  <!-- CloudWatch sub-features around center -->
  <rect x="508.049793" y="425.049804" width="99.585062" height="28.014679" rx="6.497594" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="557.842324" y="444.059819" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" font-weight="bold" fill="var(--primary-accent)">Metrics</text>

  <rect x="627.551867" y="425.049804" width="99.585062" height="28.014679" rx="6.497594" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.344398" y="444.059819" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" font-weight="bold" fill="var(--primary-accent)">Logs</text>

  <rect x="508.049793" y="465.070775" width="99.585062" height="28.014679" rx="6.497594" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="557.842324" y="484.08079" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" font-weight="bold" fill="var(--primary-accent)">Alarms</text>

  <rect x="627.551867" y="465.070775" width="99.585062" height="28.014679" rx="6.497594" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.344398" y="484.08079" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" font-weight="bold" fill="var(--primary-accent)">Dashboards</text>

  <rect x="508.049793" y="505.091744" width="99.585062" height="28.014679" rx="6.497594" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="557.842324" y="524.10176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" font-weight="bold" fill="var(--primary-accent)">Events</text>

  <rect x="627.551867" y="505.091744" width="99.585062" height="28.014679" rx="6.497594" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.344398" y="524.10176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.980067" font-weight="bold" fill="var(--primary-accent)">Insights</text>
</svg>

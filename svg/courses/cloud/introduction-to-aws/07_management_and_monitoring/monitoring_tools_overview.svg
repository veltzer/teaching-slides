<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)"/>

  <!-- Central hub: CloudWatch -->
  <circle cx="640" cy="311.875" r="82.9568" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)">Amazon</text>
  <text x="640" y="325.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)">CloudWatch</text>
  <text x="640" y="348.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">Metrics, Logs, Alarms</text>

  <!-- Spoke 1: CloudTrail (top-left) -->
  <line x1="574.375" y1="252.9688" x2="386.875" y2="139.6875" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="330.625" cy="112.5" r="59.9133" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="330.625" y="103.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">CloudTrail</text>
  <text x="330.625" y="123.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">API Audit Logs</text>
  <!-- Description -->
  <rect x="152.5" y="180.4688" width="206.25" height="49.8438" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="255.625" y="198.5938" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">Who did what, when, where</text>
  <text x="255.625" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Governance and compliance</text>

  <!-- Spoke 2: Config (top-right) -->
  <line x1="705.625" y1="252.9688" x2="893.125" y2="139.6875" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="949.375" cy="112.5" r="59.9133" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="949.375" y="103.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">AWS Config</text>
  <text x="949.375" y="123.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">Resource Tracking</text>
  <!-- Description -->
  <rect x="846.25" y="180.4688" width="206.25" height="49.8438" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="949.375" y="198.5938" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">Configuration change history</text>
  <text x="949.375" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Compliance rules evaluation</text>

  <!-- Spoke 3: Trusted Advisor (right) -->
  <line x1="724.375" y1="311.875" x2="940" y2="311.875" stroke="var(--info-border)" stroke-width="2"/>
  <circle cx="1015" cy="311.875" r="59.9133" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="1015" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Trusted</text>
  <text x="1015" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Advisor</text>
  <!-- Description -->
  <rect x="1085.3125" y="284.6875" width="140.625" height="54.375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1155.625" y="304.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--info-accent)">Best practice checks</text>
  <text x="1155.625" y="322.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Cost, security, perf</text>

  <!-- Spoke 4: Systems Manager (bottom-right) -->
  <line x1="705.625" y1="370.7812" x2="893.125" y2="484.0625" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="949.375" cy="520.3125" r="59.9133" fill="var(--primary-accent)" filter="url(#shadow)"/>
  <text x="949.375" y="511.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Systems</text>
  <text x="949.375" y="529.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Manager</text>
  <!-- Description -->
  <rect x="846.25" y="461.4062" width="206.25" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="949.375" y="484.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)">Operational management</text>

  <!-- Spoke 5: Health Dashboard (bottom-left) -->
  <line x1="574.375" y1="370.7812" x2="386.875" y2="484.0625" stroke="var(--danger-border)" stroke-width="2"/>
  <circle cx="330.625" cy="520.3125" r="59.9133" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="330.625" y="511.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Health</text>
  <text x="330.625" y="529.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Dashboard</text>
  <!-- Description -->
  <rect x="152.5" y="461.4062" width="206.25" height="36.25" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="255.625" y="484.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--danger-accent)">Service health and events</text>

  <!-- Spoke 6: X-Ray (left) -->
  <line x1="555.625" y1="311.875" x2="340" y2="311.875" stroke="var(--text-muted)" stroke-width="2"/>
  <circle cx="265" cy="311.875" r="59.9133" fill="var(--text-muted)" filter="url(#shadow)"/>
  <text x="265" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">AWS</text>
  <text x="265" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">X-Ray</text>
  <!-- Description -->
  <rect x="96.25" y="284.6875" width="107.8125" height="54.375" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="149.6875" y="304.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text)">Distributed</text>
  <text x="149.6875" y="322.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text)">tracing</text>

  <!-- CloudWatch sub-features around center -->
  <rect x="536.875" y="402.5" width="93.75" height="25.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="583.75" y="419.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--primary-accent)">Metrics</text>

  <rect x="649.375" y="402.5" width="93.75" height="25.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="696.25" y="419.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--primary-accent)">Logs</text>

  <rect x="536.875" y="438.75" width="93.75" height="25.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="583.75" y="455.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--primary-accent)">Alarms</text>

  <rect x="649.375" y="438.75" width="93.75" height="25.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="696.25" y="455.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--primary-accent)">Dashboards</text>

  <rect x="536.875" y="475" width="93.75" height="25.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="583.75" y="492.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--primary-accent)">Events</text>

  <rect x="649.375" y="475" width="93.75" height="25.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="696.25" y="492.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--primary-accent)">Insights</text>
</svg>

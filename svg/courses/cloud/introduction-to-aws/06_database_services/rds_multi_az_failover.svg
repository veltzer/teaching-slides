<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- DNS Endpoint at top -->
  <rect x="433.103448" y="40" width="413.793103" height="52.72733" rx="6.482456" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="63.966891" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.937847" font-weight="bold" fill="var(--bg)">RDS DNS Endpoint</text>
  <text x="640" y="83.140447" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.950299" fill="var(--info-accent)">mydb.abc123.us-east-1.rds.amazonaws.com</text>

  <!-- Application -->
  <rect x="474.482759" y="107.107338" width="331.034483" height="38.347111" rx="6.482456" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="131.074336" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.942034" fill="var(--text)">Application connects via DNS endpoint</text>

  <!-- Arrow from DNS to AZ-1 primary (normal state) -->
  <line x1="536.551724" y1="145.454449" x2="308.965517" y2="217.355335" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="386.551724" y="179.008224" font-family="Arial, sans-serif" font-size="11.950299" font-weight="bold" fill="var(--primary-accent)">Active</text>

  <!-- AZ-1 -->
  <rect x="40" y="217.355335" width="517.241379" height="268.429777" rx="6.482456" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="298.62069" y="244.198313" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.933768" font-weight="bold" fill="var(--primary-accent)">Availability Zone 1</text>

  <!-- Primary DB -->
  <rect x="122.758621" y="265.289224" width="351.724138" height="95.867777" rx="6.482456" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="298.62069" y="303.636335" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.925503" font-weight="bold" fill="var(--bg)">Primary DB Instance</text>
  <text x="298.62069" y="330.479312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.94622" fill="var(--primary-accent)">Read + Write operations</text>

  <!-- EBS volume -->
  <rect x="164.137931" y="380.330557" width="268.965517" height="43.140447" rx="6.482456" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="298.62069" y="407.173534" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.94622" fill="var(--primary-accent)">EBS Volume (Primary)</text>

  <!-- Failover dashed arrow -->
  <line x1="743.448276" y1="145.454449" x2="929.655172" y2="217.355335" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="888.275862" y="179.008224" font-family="Arial, sans-serif" font-size="11.950299" font-weight="bold" fill="var(--danger-accent)">Failover</text>

  <!-- AZ-2 -->
  <rect x="722.758621" y="217.355335" width="517.241379" height="268.429777" rx="6.482456" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="981.37931" y="244.198313" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.933768" font-weight="bold" fill="var(--text-muted)">Availability Zone 2</text>

  <!-- Standby DB -->
  <rect x="805.517241" y="265.289224" width="351.724138" height="95.867777" rx="6.482456" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="981.37931" y="303.636335" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.925503" font-weight="bold" fill="var(--text-muted)">Standby DB Instance</text>
  <text x="981.37931" y="330.479312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.94622" fill="var(--text-muted)">No read/write (hot standby)</text>

  <!-- EBS volume standby -->
  <rect x="846.896552" y="380.330557" width="268.965517" height="43.140447" rx="6.482456" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="981.37931" y="407.173534" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.94622" fill="var(--text-muted)">EBS Volume (Standby)</text>

  <!-- Synchronous replication arrow -->
  <line x1="474.482759" y1="313.223113" x2="805.517241" y2="313.223113" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="557.241379" y="289.256221" width="206.896552" height="23.008267" rx="6.482456" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="660.689655" y="305.55369" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.950299" font-weight="bold" fill="var(--warn-accent)">Synchronous Replication</text>

  <!-- After failover section -->
  <rect x="40" y="504.958667" width="1200" height="115.041333" rx="6.482456" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="533.719" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.933768" font-weight="bold" fill="var(--ok-accent)">After Failover (Automatic)</text>

  <rect x="81.37931" y="548.099114" width="206.896552" height="47.933889" rx="6.482456" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="184.827586" y="567.27267" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.950299" font-weight="bold" fill="var(--danger-accent)">Old Primary (AZ-1)</text>
  <text x="184.827586" y="584.528975" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.954486" fill="var(--danger-accent)">Failed / Demoted</text>

  <line x1="288.275862" y1="572.066111" x2="453.793103" y2="572.066111" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="371.034483" y="562.479334" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.954486" fill="var(--danger-accent)">DNS update</text>

  <rect x="453.793103" y="548.099114" width="206.896552" height="47.933889" rx="6.482456" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="557.241379" y="570.148756" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.94622" font-weight="bold" fill="var(--bg)">DNS Endpoint</text>
  <text x="557.241379" y="586.446225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.954486" fill="var(--info-accent)">Points to new primary</text>

  <line x1="660.689655" y1="572.066111" x2="826.206897" y2="572.066111" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="743.448276" y="562.479334" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.954486" font-weight="bold" fill="var(--ok-accent)">Now active</text>

  <rect x="826.206897" y="548.099114" width="206.896552" height="47.933889" rx="6.482456" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="929.655172" y="567.27267" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.950299" font-weight="bold" fill="var(--bg)">New Primary (AZ-2)</text>
  <text x="929.655172" y="584.528975" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.954486" fill="var(--ok-accent)">Promoted automatically</text>

  <!-- Failover time -->
  <rect x="1074.482759" y="548.099114" width="144.827586" height="47.933889" rx="6.482456" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="1146.896552" y="567.27267" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.950299" font-weight="bold" fill="var(--warn-accent)">Failover time:</text>
  <text x="1146.896552" y="586.446225" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.942034" font-weight="bold" fill="var(--warn-accent)">60-120 sec</text>
</svg>

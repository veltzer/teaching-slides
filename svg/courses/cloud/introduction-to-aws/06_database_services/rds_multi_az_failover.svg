<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)"/>

  <!-- DNS Endpoint at top -->
  <rect x="452.5" y="53.5938" width="375" height="49.8438" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)">RDS DNS Endpoint</text>
  <text x="640" y="94.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">mydb.abc123.us-east-1.rds.amazonaws.com</text>

  <!-- Application -->
  <rect x="490" y="117.0312" width="300" height="36.25" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="139.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Application connects via DNS endpoint</text>

  <!-- Arrow from DNS to AZ-1 primary (normal state) -->
  <line x1="546.25" y1="153.2812" x2="340" y2="221.25" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="410.3125" y="185" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Active</text>

  <!-- AZ-1 -->
  <rect x="96.25" y="221.25" width="468.75" height="253.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="330.625" y="246.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)">Availability Zone 1</text>

  <!-- Primary DB -->
  <rect x="171.25" y="266.5625" width="318.75" height="90.625" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="330.625" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)">Primary DB Instance</text>
  <text x="330.625" y="328.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)">Read + Write operations</text>

  <!-- EBS volume -->
  <rect x="208.75" y="375.3125" width="243.75" height="40.7812" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="330.625" y="400.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)">EBS Volume (Primary)</text>

  <!-- Failover dashed arrow -->
  <line x1="733.75" y1="153.2812" x2="902.5" y2="221.25" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="865" y="185" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--danger-accent)">Failover</text>

  <!-- AZ-2 -->
  <rect x="715" y="221.25" width="468.75" height="253.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="949.375" y="246.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text-muted)">Availability Zone 2</text>

  <!-- Standby DB -->
  <rect x="790" y="266.5625" width="318.75" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="949.375" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text-muted)">Standby DB Instance</text>
  <text x="949.375" y="328.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">No read/write (hot standby)</text>

  <!-- EBS volume standby -->
  <rect x="827.5" y="375.3125" width="243.75" height="40.7812" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="949.375" y="400.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">EBS Volume (Standby)</text>

  <!-- Synchronous replication arrow -->
  <line x1="490" y1="311.875" x2="790" y2="311.875" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="565" y="289.2188" width="187.5" height="21.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="658.75" y="304.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Synchronous Replication</text>

  <!-- After failover section -->
  <rect x="96.25" y="493.125" width="1087.5" height="108.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="520.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">After Failover (Automatic)</text>

  <rect x="133.75" y="533.9062" width="187.5" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="227.5" y="552.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--danger-accent)">Old Primary (AZ-1)</text>
  <text x="227.5" y="568.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--danger-accent)">Failed / Demoted</text>

  <line x1="321.25" y1="556.5625" x2="471.25" y2="556.5625" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="396.25" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--danger-accent)">DNS update</text>

  <rect x="471.25" y="533.9062" width="187.5" height="45.3125" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="565" y="554.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">DNS Endpoint</text>
  <text x="565" y="570.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--info-accent)">Points to new primary</text>

  <line x1="658.75" y1="556.5625" x2="808.75" y2="556.5625" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="733.75" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--ok-accent)">Now active</text>

  <rect x="808.75" y="533.9062" width="187.5" height="45.3125" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="902.5" y="552.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">New Primary (AZ-2)</text>
  <text x="902.5" y="568.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">Promoted automatically</text>

  <!-- Failover time -->
  <rect x="1033.75" y="533.9062" width="131.25" height="45.3125" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="1099.375" y="552.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Failover time:</text>
  <text x="1099.375" y="570.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">60-120 sec</text>
</svg>

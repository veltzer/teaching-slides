<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Relational -->
  <rect x="40" y="40" width="277" height="580" rx="8.291003602745" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179" y="88.333333333334" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--primary-text)">Relational</text>
  <text x="179" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--primary-text)">SQL queries</text>
  <text x="179" y="174.25925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--primary-text)">Structured schema</text>
  <text x="179" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--primary-text)">ACID transactions</text>
  <text x="179" y="249.444444444445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--primary-text)">JOINs</text>
  <text x="179" y="308.518518518518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--primary-text)">RDS, Aurora</text>
  <text x="179" y="383.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--primary-text)">ERP / CRM</text>
  <text x="179" y="415.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--primary-text)">Finance</text>
  <text x="179" y="448.148148148149" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--primary-text)">Orders</text>
  <text x="179" y="480.370370370371" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--primary-text)">Reporting</text>

  <!-- Key-Value -->
  <rect x="347" y="40" width="277" height="580" rx="8.291003602745" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="486" y="88.333333333334" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--ok-text)">Key-Value</text>
  <text x="486" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--ok-text)">Simple lookups</text>
  <text x="486" y="174.25925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--ok-text)">Flexible schema</text>
  <text x="486" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--ok-text)">ms latency</text>
  <text x="486" y="249.444444444445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--ok-text)">Massive scale</text>
  <text x="486" y="308.518518518518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--ok-text)">DynamoDB</text>
  <text x="486" y="383.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--ok-text)">Sessions</text>
  <text x="486" y="415.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--ok-text)">Carts</text>
  <text x="486" y="448.148148148149" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--ok-text)">IoT ingest</text>
  <text x="486" y="480.370370370371" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--ok-text)">Leaderboards</text>

  <!-- Document -->
  <rect x="655" y="40" width="277" height="580" rx="8.291003602745" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794" y="88.333333333334" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--warn-text)">Document</text>
  <text x="794" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--warn-text)">JSON / BSON</text>
  <text x="794" y="174.25925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--warn-text)">Nested data</text>
  <text x="794" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--warn-text)">Rich queries</text>
  <text x="794" y="249.444444444445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--warn-text)">Schema-less</text>
  <text x="794" y="308.518518518518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--warn-text)">DocumentDB</text>
  <text x="794" y="383.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">CMS</text>
  <text x="794" y="415.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">Profiles</text>
  <text x="794" y="448.148148148149" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">Catalogs</text>
  <text x="794" y="480.370370370371" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">Mobile backends</text>

  <!-- Graph -->
  <rect x="963" y="40" width="277" height="580" rx="8.291003602745" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1101" y="88.333333333334" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--info-text)">Graph</text>
  <text x="1101" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--info-text)">Nodes + edges</text>
  <text x="1101" y="174.25925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--info-text)">Relationships</text>
  <text x="1101" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--info-text)">Pattern match</text>
  <text x="1101" y="249.444444444445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--info-text)">Traversal</text>
  <text x="1101" y="308.518518518518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--info-text)">Neptune</text>
  <text x="1101" y="383.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--info-text)">Social</text>
  <text x="1101" y="415.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--info-text)">Fraud</text>
  <text x="1101" y="448.148148148149" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--info-text)">Recommend</text>
  <text x="1101" y="480.370370370371" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--info-text)">Knowledge</text>
</svg>

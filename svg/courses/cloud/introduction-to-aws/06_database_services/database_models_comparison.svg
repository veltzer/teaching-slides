  <text x="105.625" y="393.4375" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Use Cases:</text>
  <text x="105.625" y="416.0938" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">&#x2022; ERP / CRM systems</text>

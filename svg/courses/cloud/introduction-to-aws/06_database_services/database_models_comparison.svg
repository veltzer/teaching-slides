  <line x1="143.125" y1="148.75" x2="274.375" y2="148.75" stroke="var(--primary-border)" stroke-width="1.5"/>
  <line x1="143.125" y1="171.4062" x2="274.375" y2="171.4062" stroke="var(--primary-border)" stroke-width="1"/>
  <line x1="143.125" y1="194.0625" x2="274.375" y2="194.0625" stroke="var(--primary-border)" stroke-width="1"/>

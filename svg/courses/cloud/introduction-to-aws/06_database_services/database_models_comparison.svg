<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="6" fill="var(--surface)"/>

  <!-- Column 1: Relational -->
  <rect x="40" y="20" width="280" height="600" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="20" width="280" height="55" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="55" width="280" height="20" fill="var(--primary-accent)" rx="6"/>
  <text x="180" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)">Relational</text>

  <!-- Table icon -->
  <rect x="110" y="95" width="140" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="110" y1="120" x2="250" y2="120" stroke="var(--primary-border)" stroke-width="1.5"/>
  <line x1="110" y1="145" x2="250" y2="145" stroke="var(--primary-border)" stroke-width="1"/>
  <line x1="110" y1="170" x2="250" y2="170" stroke="var(--primary-border)" stroke-width="1"/>
  <line x1="180" y1="95" x2="180" y2="195" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="145" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">ID</text>
  <text x="215" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">Name</text>
  <text x="145" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">1</text>
  <text x="215" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Alice</text>
  <text x="145" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">2</text>
  <text x="215" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Bob</text>

  <text x="180" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">SQL Queries</text>
  <text x="180" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Structured schemas</text>
  <text x="180" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">ACID transactions</text>
  <text x="180" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">JOINs across tables</text>

  <rect x="60" y="320" width="240" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">AWS: RDS, Aurora</text>

  <text x="70" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Use Cases:</text>
  <text x="70" y="415" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; ERP / CRM systems</text>
  <text x="70" y="435" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; Financial transactions</text>
  <text x="70" y="455" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; E-commerce orders</text>
  <text x="70" y="475" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; Complex reporting</text>

  <!-- Column 2: Key-Value -->
  <rect x="350" y="20" width="280" height="600" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="350" y="20" width="280" height="55" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="350" y="55" width="280" height="20" fill="var(--ok-accent)" rx="6"/>
  <text x="490" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)">Key-Value</text>

  <!-- KV icon -->
  <rect x="400" y="95" width="180" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="440" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-accent)">user:1</text>
  <text x="540" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">{data...}</text>

  <rect x="400" y="130" width="180" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="440" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-accent)">sess:a</text>
  <text x="540" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">{data...}</text>

  <rect x="400" y="165" width="180" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="440" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-accent)">cart:5</text>
  <text x="540" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">{data...}</text>

  <text x="490" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">Simple Lookups</text>
  <text x="490" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Flexible schema</text>
  <text x="490" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Millisecond latency</text>
  <text x="490" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Massive scale</text>

  <rect x="370" y="320" width="240" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="490" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">AWS: DynamoDB</text>

  <text x="380" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Use Cases:</text>
  <text x="380" y="415" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; Session management</text>
  <text x="380" y="435" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; Shopping carts</text>
  <text x="380" y="455" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; IoT data ingestion</text>
  <text x="380" y="475" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; Gaming leaderboards</text>

  <!-- Column 3: Document -->
  <rect x="660" y="20" width="280" height="600" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="20" width="280" height="55" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="660" y="55" width="280" height="20" fill="var(--warn-accent)" rx="6"/>
  <text x="800" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)">Document</text>

  <!-- JSON doc icon -->
  <rect x="720" y="95" width="160" height="100" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="740" y="115" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">{</text>
  <text x="755" y="133" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">"name": "Alice",</text>
  <text x="755" y="151" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">"age": 30,</text>
  <text x="755" y="169" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">"roles": [...]</text>
  <text x="740" y="187" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">}</text>

  <text x="800" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">JSON/BSON Docs</text>
  <text x="800" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Nested structures</text>
  <text x="800" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Rich query language</text>
  <text x="800" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Schema-less flexibility</text>

  <rect x="680" y="320" width="240" height="40" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="800" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">AWS: DocumentDB</text>

  <text x="690" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Use Cases:</text>
  <text x="690" y="415" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; Content management</text>
  <text x="690" y="435" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; User profiles</text>
  <text x="690" y="455" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; Catalogs</text>
  <text x="690" y="475" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; Mobile app backends</text>

  <!-- Column 4: Graph -->
  <rect x="970" y="20" width="280" height="600" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="970" y="20" width="280" height="55" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="970" y="55" width="280" height="20" fill="var(--info-accent)" rx="6"/>
  <text x="1110" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)">Graph</text>

  <!-- Graph icon -->
  <circle cx="1060" cy="120" r="15" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <circle cx="1160" cy="120" r="15" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <circle cx="1110" cy="170" r="15" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="1075" y1="120" x2="1145" y2="120" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="1065" y1="133" x2="1098" y2="158" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="1155" y1="133" x2="1122" y2="158" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1060" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--info-accent)">A</text>
  <text x="1160" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--info-accent)">B</text>
  <text x="1110" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--info-accent)">C</text>

  <text x="1110" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-accent)">Nodes + Edges</text>
  <text x="1110" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Relationship queries</text>
  <text x="1110" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Pattern matching</text>
  <text x="1110" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Traversal algorithms</text>

  <rect x="990" y="320" width="240" height="40" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1110" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-accent)">AWS: Neptune</text>

  <text x="1000" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Use Cases:</text>
  <text x="1000" y="415" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; Social networks</text>
  <text x="1000" y="435" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; Fraud detection</text>
  <text x="1000" y="455" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; Recommendation engines</text>
  <text x="1000" y="475" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">&#x2022; Knowledge graphs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-storage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)"/>

  <!-- Application layer -->
  <rect x="452.5" y="53.5938" width="375" height="45.3125" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="81.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text)">Application (Cluster Endpoint)</text>

  <!-- Writer/Reader Endpoint labels -->
  <line x1="546.25" y1="98.9062" x2="546.25" y2="130.625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="499.375" y="123.375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)">Writer</text>
  <line x1="733.75" y1="98.9062" x2="733.75" y2="130.625" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="747.8125" y="123.375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">Reader</text>

  <!-- Compute layer -->
  <rect x="96.25" y="130.625" width="1087.5" height="126.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="124.375" y="153.2812" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Compute Layer (Instances)</text>

  <!-- Primary Writer -->
  <rect x="133.75" y="166.875" width="187.5" height="72.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="195.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)">Primary Writer</text>
  <text x="227.5" y="219.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">Read/Write</text>

  <!-- Read Replicas -->
  <rect x="396.25" y="166.875" width="168.75" height="72.5" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="480.625" y="195.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Read Replica 1</text>
  <text x="480.625" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Read Only</text>

  <rect x="621.25" y="166.875" width="168.75" height="72.5" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="705.625" y="195.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Read Replica 2</text>
  <text x="705.625" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Read Only</text>

  <rect x="846.25" y="166.875" width="168.75" height="72.5" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="930.625" y="195.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Read Replica 3</text>
  <text x="930.625" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Read Only</text>

  <!-- Up to 15 note -->
  <text x="1061.875" y="207.6562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Up to</text>
  <text x="1061.875" y="223.0625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">15 replicas</text>

  <!-- Arrows from compute to storage -->
  <line x1="227.5" y1="239.375" x2="227.5" y2="302.8125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="480.625" y1="239.375" x2="480.625" y2="302.8125" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="705.625" y1="239.375" x2="705.625" y2="302.8125" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="930.625" y1="239.375" x2="930.625" y2="302.8125" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="640" y="282.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Shared storage - no replication between instances</text>

  <!-- Shared Storage Layer -->
  <rect x="96.25" y="302.8125" width="1087.5" height="181.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="124.375" y="330" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Distributed Storage Layer (Auto-scaling, 128 TB max)</text>

  <!-- 3 AZ boxes inside storage -->
  <rect x="133.75" y="348.125" width="318.75" height="117.8125" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="293.125" y="370.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">AZ 1</text>
  <!-- 2 copies -->
  <rect x="161.875" y="384.375" width="112.5" height="36.25" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="218.125" y="407.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">Copy 1</text>
  <rect x="302.5" y="384.375" width="112.5" height="36.25" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="358.75" y="407.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">Copy 2</text>

  <rect x="480.625" y="348.125" width="318.75" height="117.8125" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="640" y="370.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">AZ 2</text>
  <rect x="508.75" y="384.375" width="112.5" height="36.25" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="565" y="407.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">Copy 3</text>
  <rect x="649.375" y="384.375" width="112.5" height="36.25" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="705.625" y="407.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">Copy 4</text>

  <rect x="827.5" y="348.125" width="318.75" height="117.8125" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="986.875" y="370.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">AZ 3</text>
  <rect x="855.625" y="384.375" width="112.5" height="36.25" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="911.875" y="407.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">Copy 5</text>
  <rect x="996.25" y="384.375" width="112.5" height="36.25" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1052.5" y="407.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">Copy 6</text>

  <!-- 6 copies note -->
  <text x="640" y="500.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">6 copies of data across 3 AZs - tolerates loss of 2 copies for writes, 3 for reads</text>

  <!-- Continuous backup to S3 -->
  <rect x="96.25" y="529.375" width="1087.5" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="227.5" y="558.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Continuous Backup to S3</text>
  <text x="227.5" y="581.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Automatic, incremental</text>

  <rect x="508.75" y="538.4375" width="168.75" height="45.3125" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="593.125" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Amazon S3</text>

  <!-- Backtrack note -->
  <rect x="743.125" y="538.4375" width="187.5" height="45.3125" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="836.875" y="558.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Backtrack</text>
  <text x="836.875" y="574.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Point-in-time restore</text>

  <!-- Clone note -->
  <rect x="968.125" y="538.4375" width="187.5" height="45.3125" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1061.875" y="558.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Fast Clone</text>
  <text x="1061.875" y="574.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Copy-on-write cloning</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="6" fill="var(--surface)"/>

  <!-- Step 1: API Request -->
  <rect x="80" y="250" width="180" height="80" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="170" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">API Request</text>
  <text x="170" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">s3:GetObject</text>

  <!-- Arrow to first diamond -->
  <line x1="260" y1="290" x2="340" y2="290" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision Diamond 1: Explicit Deny -->
  <polygon points="460,210 570,290 460,370 350,290" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.5"/>
  <text x="460" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Explicit</text>
  <text x="460" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Deny?</text>

  <!-- Yes from Diamond 1 -> DENIED -->
  <line x1="460" y1="370" x2="460" y2="460" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)">YES</text>

  <rect x="370" y="470" width="180" height="70" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="460" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)">DENIED</text>
  <text x="460" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">Explicit Deny</text>

  <!-- No from Diamond 1 -> Diamond 2 -->
  <line x1="570" y1="290" x2="650" y2="290" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">NO</text>

  <!-- Decision Diamond 2: SCP Deny -->
  <polygon points="770,210 880,290 770,370 660,290" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.5"/>
  <text x="770" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">SCP</text>
  <text x="770" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">Allow?</text>

  <!-- No from Diamond 2 -> DENIED -->
  <line x1="770" y1="370" x2="770" y2="460" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="790" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)">NO</text>

  <rect x="680" y="470" width="180" height="70" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="770" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)">DENIED</text>
  <text x="770" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">SCP Deny</text>

  <!-- Yes from Diamond 2 -> Diamond 3 -->
  <line x1="880" y1="290" x2="950" y2="290" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="915" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">YES</text>

  <!-- Decision Diamond 3: Any Allow -->
  <polygon points="1070,210 1180,290 1070,370 960,290" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.5"/>
  <text x="1070" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Any</text>
  <text x="1070" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Allow?</text>

  <!-- Yes from Diamond 3 -> ALLOWED -->
  <line x1="1070" y1="210" x2="1070" y2="130" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1090" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">YES</text>

  <rect x="980" y="50" width="180" height="70" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1070" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)">ALLOWED</text>
  <text x="1070" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Access Granted</text>

  <!-- No from Diamond 3 -> Implicit Deny -->
  <line x1="1070" y1="370" x2="1070" y2="460" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1090" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)">NO</text>

  <rect x="980" y="470" width="180" height="70" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1070" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)">DENIED</text>
  <text x="1070" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">Implicit Deny</text>

  <!-- Key principle note -->
  <rect x="80" y="560" width="500" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="330" y="587" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)">Key: Explicit Deny always wins over any Allow</text>
  <text x="330" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Default is implicit deny - must be explicitly allowed</text>

  <!-- Policy sources note -->
  <rect x="650" y="560" width="560" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="930" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Policies evaluated: Identity + Resource + SCP + Session + Permissions Boundary</text>
  <text x="930" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">All applicable policies are merged and evaluated together</text>
</svg>

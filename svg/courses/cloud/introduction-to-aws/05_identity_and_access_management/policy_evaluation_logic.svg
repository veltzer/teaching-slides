<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)"/>

  <!-- Step 1: API Request -->
  <rect x="115" y="266.5625" width="168.75" height="72.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="199.375" y="298.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)">API Request</text>
  <text x="199.375" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">s3:GetObject</text>

  <!-- Arrow to first diamond -->
  <line x1="283.75" y1="302.8125" x2="358.75" y2="302.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision Diamond 1: Explicit Deny -->
  <polygon points="471.25,230.3125 574.375,302.8125 471.25,375.3125 368.125,302.8125" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.5"/>
  <text x="471.25" y="289.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Explicit</text>
  <text x="471.25" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Deny?</text>

  <!-- Yes from Diamond 1 -> DENIED -->
  <line x1="471.25" y1="375.3125" x2="471.25" y2="456.875" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="420.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">YES</text>

  <rect x="386.875" y="465.9375" width="168.75" height="63.4375" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="471.25" y="497.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)">DENIED</text>
  <text x="471.25" y="515.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">Explicit Deny</text>

  <!-- No from Diamond 1 -> Diamond 2 -->
  <line x1="574.375" y1="302.8125" x2="649.375" y2="302.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="611.875" y="291.9375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">NO</text>

  <!-- Decision Diamond 2: SCP Deny -->
  <polygon points="761.875,230.3125 865,302.8125 761.875,375.3125 658.75,302.8125" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.5"/>
  <text x="761.875" y="289.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">SCP</text>
  <text x="761.875" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Allow?</text>

  <!-- No from Diamond 2 -> DENIED -->
  <line x1="761.875" y1="375.3125" x2="761.875" y2="456.875" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="780.625" y="420.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">NO</text>

  <rect x="677.5" y="465.9375" width="168.75" height="63.4375" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="761.875" y="497.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)">DENIED</text>
  <text x="761.875" y="515.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">SCP Deny</text>

  <!-- Yes from Diamond 2 -> Diamond 3 -->
  <line x1="865" y1="302.8125" x2="930.625" y2="302.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="897.8125" y="291.9375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">YES</text>

  <!-- Decision Diamond 3: Any Allow -->
  <polygon points="1043.125,230.3125 1146.25,302.8125 1043.125,375.3125 940,302.8125" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.5"/>
  <text x="1043.125" y="289.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Any</text>
  <text x="1043.125" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Allow?</text>

  <!-- Yes from Diamond 3 -> ALLOWED -->
  <line x1="1043.125" y1="230.3125" x2="1043.125" y2="157.8125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1061.875" y="198.5938" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">YES</text>

  <rect x="958.75" y="85.3125" width="168.75" height="63.4375" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1043.125" y="117.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)">ALLOWED</text>
  <text x="1043.125" y="135.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Access Granted</text>

  <!-- No from Diamond 3 -> Implicit Deny -->
  <line x1="1043.125" y1="375.3125" x2="1043.125" y2="456.875" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1061.875" y="420.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">NO</text>

  <rect x="958.75" y="465.9375" width="168.75" height="63.4375" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1043.125" y="497.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)">DENIED</text>
  <text x="1043.125" y="515.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">Implicit Deny</text>

  <!-- Key principle note -->
  <rect x="115" y="547.5" width="468.75" height="54.375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="349.375" y="571.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">Key: Explicit Deny always wins over any Allow</text>
  <text x="349.375" y="590.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Default is implicit deny - must be explicitly allowed</text>

  <!-- Policy sources note -->
  <rect x="649.375" y="547.5" width="525" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="911.875" y="567.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Policies evaluated: Identity + Resource + SCP + Session + Permissions Boundary</text>
  <text x="911.875" y="585.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">All applicable policies are merged and evaluated together</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Step 1: API Request -->
  <rect x="40" y="243.508772" width="191.150442" height="81.403509" rx="6.766585" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135.575221" y="279.122751" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.592581" font-weight="bold" fill="var(--bg)">API Request</text>
  <text x="135.575221" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--primary-accent)">s3:GetObject</text>

  <!-- Arrow to first diamond -->
  <line x1="231.150442" y1="284.210526" x2="316.106195" y2="284.210526" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision Diamond 1: Explicit Deny -->
  <polygon points="443.539823,202.807018 560.353982,284.210526 443.539823,365.614035 326.725664,284.210526" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.5"/>
  <text x="443.539823" y="268.947425" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.513661" font-weight="bold" fill="var(--primary-accent)">Explicit</text>
  <text x="443.539823" y="289.298302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.513661" font-weight="bold" fill="var(--primary-accent)">Deny?</text>

  <!-- Yes from Diamond 1 -> DENIED -->
  <line x1="443.539823" y1="365.614035" x2="443.539823" y2="457.192982" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="464.778761" y="416.491228" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--danger-accent)">YES</text>

  <rect x="347.964602" y="467.368421" width="191.150442" height="71.22807" rx="6.766585" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="443.539823" y="502.9824" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.711188" font-weight="bold" fill="var(--bg)">DENIED</text>
  <text x="443.539823" y="523.333277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--danger-accent)">Explicit Deny</text>

  <!-- No from Diamond 1 -> Diamond 2 -->
  <line x1="560.353982" y1="284.210526" x2="645.309735" y2="284.210526" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="602.831858" y="272" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--ok-accent)">NO</text>

  <!-- Decision Diamond 2: SCP Deny -->
  <polygon points="772.743363,202.807018 889.557522,284.210526 772.743363,365.614035 655.929204,284.210526" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.5"/>
  <text x="772.743363" y="268.947425" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.513661" font-weight="bold" fill="var(--warn-accent)">SCP</text>
  <text x="772.743363" y="289.298302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.513661" font-weight="bold" fill="var(--warn-accent)">Allow?</text>

  <!-- No from Diamond 2 -> DENIED -->
  <line x1="772.743363" y1="365.614035" x2="772.743363" y2="457.192982" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="793.982301" y="416.491228" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--danger-accent)">NO</text>

  <rect x="677.168142" y="467.368421" width="191.150442" height="71.22807" rx="6.766585" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="772.743363" y="502.9824" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.711188" font-weight="bold" fill="var(--bg)">DENIED</text>
  <text x="772.743363" y="523.333277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--danger-accent)">SCP Deny</text>

  <!-- Yes from Diamond 2 -> Diamond 3 -->
  <line x1="889.557522" y1="284.210526" x2="963.893805" y2="284.210526" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="926.725664" y="272" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--ok-accent)">YES</text>

  <!-- Decision Diamond 3: Any Allow -->
  <polygon points="1091.327434,202.807018 1208.141593,284.210526 1091.327434,365.614035 974.513274,284.210526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.5"/>
  <text x="1091.327434" y="268.947425" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.513661" font-weight="bold" fill="var(--ok-accent)">Any</text>
  <text x="1091.327434" y="289.298302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.513661" font-weight="bold" fill="var(--ok-accent)">Allow?</text>

  <!-- Yes from Diamond 3 -> ALLOWED -->
  <line x1="1091.327434" y1="202.807018" x2="1091.327434" y2="121.403509" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1112.566372" y="167.193039" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--ok-accent)">YES</text>

  <rect x="995.752212" y="40" width="191.150442" height="71.22807" rx="6.766585" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1091.327434" y="75.613979" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.711188" font-weight="bold" fill="var(--bg)">ALLOWED</text>
  <text x="1091.327434" y="95.964856" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--ok-accent)">Access Granted</text>

  <!-- No from Diamond 3 -> Implicit Deny -->
  <line x1="1091.327434" y1="365.614035" x2="1091.327434" y2="457.192982" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1112.566372" y="416.491228" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--danger-accent)">NO</text>

  <rect x="995.752212" y="467.368421" width="191.150442" height="71.22807" rx="6.766585" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1091.327434" y="502.9824" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.711188" font-weight="bold" fill="var(--bg)">DENIED</text>
  <text x="1091.327434" y="523.333277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--danger-accent)">Implicit Deny</text>

  <!-- Key principle note -->
  <rect x="40" y="558.947368" width="530.973451" height="61.052632" rx="6.766585" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="305.486726" y="586.421109" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.553121" font-weight="bold" fill="var(--danger-accent)">Key: Explicit Deny always wins over any Allow</text>
  <text x="305.486726" y="606.771986" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--text-muted)">Default is implicit deny - must be explicitly allowed</text>

  <!-- Policy sources note -->
  <rect x="645.309735" y="558.947368" width="594.690265" height="61.052632" rx="6.766585" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="942.654867" y="581.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.513661" font-weight="bold" fill="var(--primary-accent)">Policies evaluated: Identity + Resource + SCP + Session + Permissions Boundary</text>
  <text x="942.654867" y="601.684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.474088" fill="var(--text-muted)">All applicable policies are merged and evaluated together</text>
</svg>

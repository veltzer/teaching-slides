  <text x="86.551724" y="176.173956" font-family="Arial, sans-serif" font-size="22.473131" fill="var(--bg)">&#x1F464;</text>
  <text x="117.586207" y="176.173956" font-family="Arial, sans-serif" font-size="14.301113" font-weight="bold" fill="var(--bg)">Bob (Dev)</text>

  <rect x="40" y="221.5652" width="206.896552" height="60.521733" rx="6.649413" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="86.551724" y="256.8696" font-family="Arial, sans-serif" font-size="22.473131" fill="var(--bg)">&#x1F464;</text>
  <text x="117.586207" y="256.8696" font-family="Arial, sans-serif" font-size="14.301113" font-weight="bold" fill="var(--bg)">Carol (Ops)</text>


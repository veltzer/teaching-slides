<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="6" fill="var(--surface)"/>

  <!-- Users (left) -->
  <text x="160" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">Users</text>

  <rect x="60" y="65" width="200" height="60" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="105" y="100" font-family="Arial, sans-serif" font-size="22" fill="var(--bg)">&#x1F464;</text>
  <text x="135" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Alice (Admin)</text>

  <rect x="60" y="145" width="200" height="60" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="105" y="180" font-family="Arial, sans-serif" font-size="22" fill="var(--bg)">&#x1F464;</text>
  <text x="135" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Bob (Dev)</text>

  <rect x="60" y="225" width="200" height="60" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="105" y="260" font-family="Arial, sans-serif" font-size="22" fill="var(--bg)">&#x1F464;</text>
  <text x="135" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Carol (Ops)</text>

  <!-- Groups (center-left) -->
  <text x="500" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-accent)">Groups</text>

  <rect x="400" y="65" width="200" height="60" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="445" y="100" font-family="Arial, sans-serif" font-size="22" fill="var(--bg)">&#x1F4C1;</text>
  <text x="475" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Admins</text>

  <rect x="400" y="145" width="200" height="60" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="445" y="180" font-family="Arial, sans-serif" font-size="22" fill="var(--bg)">&#x1F4C1;</text>
  <text x="475" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Developers</text>

  <rect x="400" y="225" width="200" height="60" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="445" y="260" font-family="Arial, sans-serif" font-size="22" fill="var(--bg)">&#x1F4C1;</text>
  <text x="475" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Operations</text>

  <!-- User to Group arrows -->
  <line x1="260" y1="95" x2="400" y2="95" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="260" y1="175" x2="400" y2="175" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="260" y1="255" x2="400" y2="255" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="330" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">member of</text>
  <text x="330" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">member of</text>
  <text x="330" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">member of</text>

  <!-- Policies (center-right) -->
  <text x="860" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-accent)">Policies</text>

  <rect x="760" y="65" width="200" height="60" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="805" y="100" font-family="Arial, sans-serif" font-size="22" fill="var(--bg)">&#x1F4C4;</text>
  <text x="835" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">AdminAccess</text>

  <rect x="760" y="145" width="200" height="60" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="805" y="180" font-family="Arial, sans-serif" font-size="22" fill="var(--bg)">&#x1F4C4;</text>
  <text x="835" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">S3ReadOnly</text>

  <rect x="760" y="225" width="200" height="60" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="805" y="260" font-family="Arial, sans-serif" font-size="22" fill="var(--bg)">&#x1F4C4;</text>
  <text x="835" y="260" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">EC2FullAccess</text>

  <!-- Group to Policy arrows -->
  <line x1="600" y1="95" x2="760" y2="95" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="600" y1="175" x2="760" y2="175" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="600" y1="255" x2="760" y2="255" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="680" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">attached</text>
  <text x="680" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">attached</text>
  <text x="680" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">attached</text>

  <!-- AWS Resources (far right) -->
  <text x="1120" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">AWS Resources</text>

  <rect x="1040" y="65" width="180" height="50" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1130" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">S3, EC2, RDS...</text>

  <!-- Policy to Resource arrows -->
  <line x1="960" y1="95" x2="1040" y2="90" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="175" x2="1040" y2="90" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1010" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">grants access</text>

  <!-- Roles section (bottom) -->
  <rect x="60" y="360" width="1160" height="260" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-accent)">IAM Roles (Temporary Credentials)</text>

  <!-- Role entities -->
  <rect x="100" y="420" width="220" height="70" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="210" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">EC2 Instance Role</text>
  <text x="210" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)">Service-linked</text>

  <rect x="380" y="420" width="220" height="70" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="490" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Lambda Exec Role</text>
  <text x="490" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)">Service-linked</text>

  <rect x="660" y="420" width="220" height="70" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="770" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Cross-Account Role</text>
  <text x="770" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)">Trust relationship</text>

  <rect x="940" y="420" width="220" height="70" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1050" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">Federation Role</text>
  <text x="1050" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)">External IdP</text>

  <!-- Trust policy note -->
  <rect x="200" y="520" width="340" height="70" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="370" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-accent)">Trust Policy</text>
  <text x="370" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Defines WHO can assume the role</text>

  <rect x="620" y="520" width="340" height="70" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="790" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">Permissions Policy</text>
  <text x="790" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Defines WHAT the role can do</text>

  <!-- Arrows from roles to policies -->
  <line x1="310" y1="490" x2="350" y2="520" stroke="var(--info-border)" stroke-width="1.5" marker-end="url(#arrow-info)"/>
  <line x1="490" y1="490" x2="400" y2="520" stroke="var(--info-border)" stroke-width="1.5" marker-end="url(#arrow-info)"/>
  <line x1="770" y1="490" x2="770" y2="520" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
  <line x1="1050" y1="490" x2="840" y2="520" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
</svg>

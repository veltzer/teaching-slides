  <text x="438.275862" y="176.173956" font-family="Arial, sans-serif" font-size="22.473131" fill="var(--bg)">&#x1F4C1;</text>
  <text x="469.310345" y="176.173956" font-family="Arial, sans-serif" font-size="14.301113" font-weight="bold" fill="var(--bg)">Developers</text>

  <rect x="391.724138" y="221.5652" width="206.896552" height="60.521733" rx="6.649413" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="438.275862" y="256.8696" font-family="Arial, sans-serif" font-size="22.473131" fill="var(--bg)">&#x1F4C1;</text>
  <text x="469.310345" y="256.8696" font-family="Arial, sans-serif" font-size="14.301113" font-weight="bold" fill="var(--bg)">Operations</text>


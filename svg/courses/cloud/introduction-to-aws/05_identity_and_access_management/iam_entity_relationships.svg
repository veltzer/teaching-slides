  <line x1="246.896552" y1="90.434889" x2="391.724138" y2="90.434889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="246.896552" y1="171.130534" x2="391.724138" y2="171.130534" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="246.896552" y1="251.826178" x2="391.724138" y2="251.826178" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="319.310345" y="80.347822" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.236621" fill="var(--ok-accent)">member of</text>
  <text x="319.310345" y="161.043467" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.236621" fill="var(--ok-accent)">member of</text>

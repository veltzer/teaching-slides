<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)"/>

  <!-- Users (left) -->
  <text x="190" y="80.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Users</text>

  <rect x="96.25" y="98.9062" width="187.5" height="54.375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="138.4375" y="130.625" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--bg)">&#x1F464;</text>
  <text x="166.5625" y="130.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Alice (Admin)</text>

  <rect x="96.25" y="171.4062" width="187.5" height="54.375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="138.4375" y="203.125" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--bg)">&#x1F464;</text>
  <text x="166.5625" y="203.125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Bob (Dev)</text>

  <rect x="96.25" y="243.9062" width="187.5" height="54.375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="138.4375" y="275.625" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--bg)">&#x1F464;</text>
  <text x="166.5625" y="275.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Carol (Ops)</text>

  <!-- Groups (center-left) -->
  <text x="508.75" y="80.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--ok-accent)">Groups</text>

  <rect x="415" y="98.9062" width="187.5" height="54.375" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="457.1875" y="130.625" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--bg)">&#x1F4C1;</text>
  <text x="485.3125" y="130.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Admins</text>

  <rect x="415" y="171.4062" width="187.5" height="54.375" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="457.1875" y="203.125" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--bg)">&#x1F4C1;</text>
  <text x="485.3125" y="203.125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Developers</text>

  <rect x="415" y="243.9062" width="187.5" height="54.375" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="457.1875" y="275.625" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--bg)">&#x1F4C1;</text>
  <text x="485.3125" y="275.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Operations</text>

  <!-- User to Group arrows -->
  <line x1="283.75" y1="126.0938" x2="415" y2="126.0938" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="283.75" y1="198.5938" x2="415" y2="198.5938" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="283.75" y1="271.0938" x2="415" y2="271.0938" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="349.375" y="117.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">member of</text>
  <text x="349.375" y="189.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">member of</text>
  <text x="349.375" y="262.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">member of</text>

  <!-- Policies (center-right) -->
  <text x="846.25" y="80.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--warn-accent)">Policies</text>

  <rect x="752.5" y="98.9062" width="187.5" height="54.375" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="794.6875" y="130.625" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--bg)">&#x1F4C4;</text>
  <text x="822.8125" y="130.625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">AdminAccess</text>

  <rect x="752.5" y="171.4062" width="187.5" height="54.375" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="794.6875" y="203.125" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--bg)">&#x1F4C4;</text>
  <text x="822.8125" y="203.125" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">S3ReadOnly</text>

  <rect x="752.5" y="243.9062" width="187.5" height="54.375" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="794.6875" y="275.625" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--bg)">&#x1F4C4;</text>
  <text x="822.8125" y="275.625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">EC2FullAccess</text>

  <!-- Group to Policy arrows -->
  <line x1="602.5" y1="126.0938" x2="752.5" y2="126.0938" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="602.5" y1="198.5938" x2="752.5" y2="198.5938" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="602.5" y1="271.0938" x2="752.5" y2="271.0938" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="677.5" y="117.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">attached</text>
  <text x="677.5" y="189.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">attached</text>
  <text x="677.5" y="262.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">attached</text>

  <!-- AWS Resources (far right) -->
  <text x="1090" y="80.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)">AWS Resources</text>

  <rect x="1015" y="98.9062" width="168.75" height="45.3125" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1099.375" y="126.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">S3, EC2, RDS...</text>

  <!-- Policy to Resource arrows -->
  <line x1="940" y1="126.0938" x2="1015" y2="121.5625" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="940" y1="198.5938" x2="1015" y2="121.5625" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="986.875" y="144.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">grants access</text>

  <!-- Roles section (bottom) -->
  <rect x="96.25" y="366.25" width="1087.5" height="235.625" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="397.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--info-accent)">IAM Roles (Temporary Credentials)</text>

  <!-- Role entities -->
  <rect x="133.75" y="420.625" width="206.25" height="63.4375" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="236.875" y="449.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">EC2 Instance Role</text>
  <text x="236.875" y="467.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">Service-linked</text>

  <rect x="396.25" y="420.625" width="206.25" height="63.4375" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="499.375" y="449.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Lambda Exec Role</text>
  <text x="499.375" y="467.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">Service-linked</text>

  <rect x="658.75" y="420.625" width="206.25" height="63.4375" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="761.875" y="449.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Cross-Account Role</text>
  <text x="761.875" y="467.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">Trust relationship</text>

  <rect x="921.25" y="420.625" width="206.25" height="63.4375" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1024.375" y="449.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">Federation Role</text>
  <text x="1024.375" y="467.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">External IdP</text>

  <!-- Trust policy note -->
  <rect x="227.5" y="511.25" width="318.75" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="386.875" y="536.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--info-accent)">Trust Policy</text>
  <text x="386.875" y="556.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Defines WHO can assume the role</text>

  <rect x="621.25" y="511.25" width="318.75" height="63.4375" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="780.625" y="536.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Permissions Policy</text>
  <text x="780.625" y="556.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Defines WHAT the role can do</text>

  <!-- Arrows from roles to policies -->
  <line x1="330.625" y1="484.0625" x2="368.125" y2="511.25" stroke="var(--info-border)" stroke-width="1.5" marker-end="url(#arrow-info)"/>
  <line x1="499.375" y1="484.0625" x2="415" y2="511.25" stroke="var(--info-border)" stroke-width="1.5" marker-end="url(#arrow-info)"/>
  <line x1="761.875" y1="484.0625" x2="761.875" y2="511.25" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
  <line x1="1024.375" y1="484.0625" x2="827.5" y2="511.25" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
</svg>

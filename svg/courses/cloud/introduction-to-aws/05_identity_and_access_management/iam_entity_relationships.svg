  <text x="86.551724" y="176.173956" font-family="Arial, sans-serif" font-size="22.473131" fill="var(--bg)">👤</text>
  <text x="117.586207" y="176.173956" font-family="Arial, sans-serif" font-size="14.301113" font-weight="bold" fill="var(--bg)">Bob (Dev)</text>


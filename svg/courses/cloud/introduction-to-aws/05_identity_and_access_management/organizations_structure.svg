  <rect x="60.689655" y="397.666667" width="372.413793" height="222.333333" rx="6.50941" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="246.896552" y="426.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.999958" font-weight="bold" fill="var(--text)">SCP Benefits</text>

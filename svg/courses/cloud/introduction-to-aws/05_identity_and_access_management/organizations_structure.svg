  <text x="381.37931" y="322.266667" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" font-weight="bold" fill="var(--warn-accent)">Dev Team A</text>
  <text x="381.37931" y="339.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.849016" fill="var(--text-muted)">223456789012</text>

  <rect x="453.793103" y="301" width="124.137931" height="48.333333" rx="6.50941" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>

  <text x="1043.125" y="420.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text)">Best Practices</text>
  <text x="921.25" y="447.8125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Separate prod and non-prod</text>
  <text x="921.25" y="470.4688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Dedicated security account</text>
  <text x="921.25" y="493.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Shared services for tooling</text>
  <text x="921.25" y="515.7812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Apply least-privilege SCPs</text>
  <text x="921.25" y="538.4375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Use AWS Control Tower</text>
</svg>

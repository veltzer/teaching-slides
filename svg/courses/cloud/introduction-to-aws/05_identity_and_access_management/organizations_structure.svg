  <line x1="671.034483" y1="262.333333" x2="671.034483" y2="301" stroke="var(--danger-border)" stroke-width="1.5"/>
  <line x1="774.482759" y1="262.333333" x2="774.482759" y2="301" stroke="var(--danger-border)" stroke-width="1.5"/>

  <rect x="608.965517" y="301" width="124.137931" height="48.333333" rx="6.50941" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="671.034483" y="322.266667" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" font-weight="bold" fill="var(--danger-accent)">Log Archive</text>
  <text x="671.034483" y="339.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.849016" fill="var(--text-muted)">323456789012</text>

  <rect x="743.448276" y="301" width="124.137931" height="48.333333" rx="6.50941" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.517241" y="322.266667" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" font-weight="bold" fill="var(--danger-accent)">Audit</text>
  <text x="805.517241" y="339.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.849016" fill="var(--text-muted)">323456789013</text>


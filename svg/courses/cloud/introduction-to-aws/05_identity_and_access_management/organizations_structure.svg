  <text x="1095.172414" y="322.266667" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.999988" font-weight="bold" fill="var(--info-accent)">CI/CD</text>
  <text x="1095.172414" y="339.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.849016" fill="var(--text-muted)">423456789013</text>

  <!-- Benefits section -->
  <rect x="60.689655" y="397.666667" width="372.413793" height="222.333333" rx="6.50941" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="246.896552" y="426.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.999958" font-weight="bold" fill="var(--text)">SCP Benefits</text>

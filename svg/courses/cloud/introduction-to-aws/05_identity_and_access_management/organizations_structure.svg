  <rect x="536.875" y="144.2188" width="75" height="21.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="574.375" y="159.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--warn-accent)">SCP</text>

  <!-- OU: Production -->
  <rect x="115" y="185" width="187.5" height="54.375" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="208.75" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)">Production OU</text>

  <!-- SCP on Production -->
  <rect x="152.5" y="243.9062" width="112.5" height="19.9375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="208.75" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">Restrict Regions SCP</text>

  <!-- Production accounts -->
  <line x1="152.5" y1="266.5625" x2="152.5" y2="302.8125" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="265" y1="266.5625" x2="265" y2="302.8125" stroke="var(--ok-border)" stroke-width="1.5"/>

  <rect x="96.25" y="302.8125" width="112.5" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.5" y="322.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Prod App</text>
  <text x="152.5" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">123456789012</text>

  <rect x="218.125" y="302.8125" width="112.5" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="274.375" y="322.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Prod Data</text>
  <text x="274.375" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">123456789013</text>

  <!-- OU: Development -->
  <rect x="358.75" y="185" width="187.5" height="54.375" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="452.5" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)">Development OU</text>

  <!-- SCP on Development -->
  <rect x="386.875" y="243.9062" width="131.25" height="19.9375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="452.5" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">Cost Control SCP</text>

  <!-- Dev accounts -->
  <line x1="405.625" y1="266.5625" x2="405.625" y2="302.8125" stroke="var(--warn-border)" stroke-width="1.5"/>
  <line x1="499.375" y1="266.5625" x2="499.375" y2="302.8125" stroke="var(--warn-border)" stroke-width="1.5"/>

  <rect x="349.375" y="302.8125" width="112.5" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="405.625" y="322.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Dev Team A</text>
  <text x="405.625" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">223456789012</text>

  <rect x="471.25" y="302.8125" width="112.5" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="527.5" y="322.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Dev Team B</text>
  <text x="527.5" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">223456789013</text>

  <!-- OU: Security -->
  <rect x="621.25" y="185" width="187.5" height="54.375" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="715" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)">Security OU</text>

  <!-- SCP on Security -->
  <rect x="658.75" y="243.9062" width="112.5" height="19.9375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="715" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">Full Access SCP</text>

  <!-- Security accounts -->
  <line x1="668.125" y1="266.5625" x2="668.125" y2="302.8125" stroke="var(--danger-border)" stroke-width="1.5"/>
  <line x1="761.875" y1="266.5625" x2="761.875" y2="302.8125" stroke="var(--danger-border)" stroke-width="1.5"/>

  <rect x="611.875" y="302.8125" width="112.5" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="668.125" y="322.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--danger-accent)">Log Archive</text>
  <text x="668.125" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">323456789012</text>

  <rect x="733.75" y="302.8125" width="112.5" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="322.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--danger-accent)">Audit</text>
  <text x="790" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">323456789013</text>

  <!-- OU: Shared Services -->
  <rect x="883.75" y="185" width="187.5" height="54.375" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="977.5" y="216.7188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)">Shared Services OU</text>

  <!-- SCP on Shared -->
  <rect x="911.875" y="243.9062" width="131.25" height="19.9375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="977.5" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">Network Restrict SCP</text>

  <!-- Shared accounts -->
  <line x1="930.625" y1="266.5625" x2="930.625" y2="302.8125" stroke="var(--info-border)" stroke-width="1.5"/>
  <line x1="1024.375" y1="266.5625" x2="1024.375" y2="302.8125" stroke="var(--info-border)" stroke-width="1.5"/>

  <rect x="874.375" y="302.8125" width="112.5" height="45.3125" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.625" y="322.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)">Networking</text>
  <text x="930.625" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">423456789012</text>

  <rect x="996.25" y="302.8125" width="112.5" height="45.3125" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.5" y="322.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)">CI/CD</text>
  <text x="1052.5" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">423456789013</text>

  <!-- Benefits section -->
  <rect x="115" y="393.4375" width="337.5" height="208.4375" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="283.75" y="420.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text)">SCP Benefits</text>
  <text x="133.75" y="447.8125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Centralized policy management</text>
  <text x="133.75" y="470.4688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Preventive guardrails across accounts</text>
  <text x="133.75" y="493.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Inherited down the OU hierarchy</text>
  <text x="133.75" y="515.7812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Cannot grant permissions, only restrict</text>
  <text x="133.75" y="538.4375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Do not apply to management account</text>

  <!-- Consolidated billing note -->
  <rect x="508.75" y="393.4375" width="337.5" height="208.4375" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="677.5" y="420.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text)">Consolidated Billing</text>
  <text x="527.5" y="447.8125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Single payment method</text>
  <text x="527.5" y="470.4688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Volume discounts aggregated</text>
  <text x="527.5" y="493.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Reserved Instance sharing</text>
  <text x="527.5" y="515.7812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Cost allocation tags</text>
  <text x="527.5" y="538.4375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; Per-account cost tracking</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="8" fill="var(--surface)"/>

  <!-- Root Account -->
  <rect x="510" y="20" width="260" height="70" rx="12" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Management Account</text>
  <text x="640" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-pale)">Organization Root</text>

  <!-- Lines from root to OUs -->
  <line x1="640" y1="90" x2="640" y2="130" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="180" y1="130" x2="1100" y2="130" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="180" y1="130" x2="180" y2="160" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="440" y1="130" x2="440" y2="160" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="720" y1="130" x2="720" y2="160" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1000" y1="130" x2="1000" y2="160" stroke="var(--text-muted)" stroke-width="2"/>

  <!-- SCP label -->
  <rect x="530" y="115" width="80" height="24" rx="4" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="570" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--warn-dk)">SCP</text>

  <!-- OU: Production -->
  <rect x="80" y="160" width="200" height="60" rx="10" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="180" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">Production OU</text>

  <!-- SCP on Production -->
  <rect x="120" y="225" width="120" height="22" rx="4" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="180" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-dk)">Restrict Regions SCP</text>

  <!-- Production accounts -->
  <line x1="120" y1="250" x2="120" y2="290" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <line x1="240" y1="250" x2="240" y2="290" stroke="var(--ok-dk)" stroke-width="1.5"/>

  <rect x="60" y="290" width="120" height="50" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">Prod App</text>
  <text x="120" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">123456789012</text>

  <rect x="190" y="290" width="120" height="50" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">Prod Data</text>
  <text x="250" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">123456789013</text>

  <!-- OU: Development -->
  <rect x="340" y="160" width="200" height="60" rx="10" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="440" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">Development OU</text>

  <!-- SCP on Development -->
  <rect x="370" y="225" width="140" height="22" rx="4" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="440" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-dk)">Cost Control SCP</text>

  <!-- Dev accounts -->
  <line x1="390" y1="250" x2="390" y2="290" stroke="var(--warn-dk)" stroke-width="1.5"/>
  <line x1="490" y1="250" x2="490" y2="290" stroke="var(--warn-dk)" stroke-width="1.5"/>

  <rect x="330" y="290" width="120" height="50" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-dk)">Dev Team A</text>
  <text x="390" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">223456789012</text>

  <rect x="460" y="290" width="120" height="50" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="520" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-dk)">Dev Team B</text>
  <text x="520" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">223456789013</text>

  <!-- OU: Security -->
  <rect x="620" y="160" width="200" height="60" rx="10" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="720" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">Security OU</text>

  <!-- SCP on Security -->
  <rect x="660" y="225" width="120" height="22" rx="4" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="720" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-dk)">Full Access SCP</text>

  <!-- Security accounts -->
  <line x1="670" y1="250" x2="670" y2="290" stroke="var(--danger-dk)" stroke-width="1.5"/>
  <line x1="770" y1="250" x2="770" y2="290" stroke="var(--danger-dk)" stroke-width="1.5"/>

  <rect x="610" y="290" width="120" height="50" rx="8" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--danger-dk)">Log Archive</text>
  <text x="670" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">323456789012</text>

  <rect x="740" y="290" width="120" height="50" rx="8" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--danger-dk)">Audit</text>
  <text x="800" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">323456789013</text>

  <!-- OU: Shared Services -->
  <rect x="900" y="160" width="200" height="60" rx="10" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="1000" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">Shared Services OU</text>

  <!-- SCP on Shared -->
  <rect x="930" y="225" width="140" height="22" rx="4" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="1000" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-dk)">Network Restrict SCP</text>

  <!-- Shared accounts -->
  <line x1="950" y1="250" x2="950" y2="290" stroke="var(--info-dk)" stroke-width="1.5"/>
  <line x1="1050" y1="250" x2="1050" y2="290" stroke="var(--info-dk)" stroke-width="1.5"/>

  <rect x="890" y="290" width="120" height="50" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="950" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-dk)">Networking</text>
  <text x="950" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">423456789012</text>

  <rect x="1020" y="290" width="120" height="50" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1080" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-dk)">CI/CD</text>
  <text x="1080" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">423456789013</text>

  <!-- Benefits section -->
  <rect x="80" y="390" width="360" height="230" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="260" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">SCP Benefits</text>
  <text x="100" y="450" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Centralized policy management</text>
  <text x="100" y="475" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Preventive guardrails across accounts</text>
  <text x="100" y="500" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Inherited down the OU hierarchy</text>
  <text x="100" y="525" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Cannot grant permissions, only restrict</text>
  <text x="100" y="550" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Do not apply to management account</text>

  <!-- Consolidated billing note -->
  <rect x="500" y="390" width="360" height="230" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="680" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Consolidated Billing</text>
  <text x="520" y="450" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Single payment method</text>
  <text x="520" y="475" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Volume discounts aggregated</text>
  <text x="520" y="500" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Reserved Instance sharing</text>
  <text x="520" y="525" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Cost allocation tags</text>
  <text x="520" y="550" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Per-account cost tracking</text>

  <!-- Best practices -->
  <rect x="920" y="390" width="300" height="230" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="1070" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Best Practices</text>
  <text x="940" y="450" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Separate prod and non-prod</text>
  <text x="940" y="475" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Dedicated security account</text>
  <text x="940" y="500" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Shared services for tooling</text>
  <text x="940" y="525" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Apply least-privilege SCPs</text>
  <text x="940" y="550" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; Use AWS Control Tower</text>
</svg>

  <text x="515.862069" y="479.833387" font-family="Arial, sans-serif" font-size="13.00005" fill="var(--text-muted)">&#x2022; Volume discounts aggregated</text>
  <text x="515.862069" y="504" font-family="Arial, sans-serif" font-size="13.00005" fill="var(--text-muted)">&#x2022; Reserved Instance sharing</text>
  <text x="515.862069" y="528.166613" font-family="Arial, sans-serif" font-size="13.00005" fill="var(--text-muted)">&#x2022; Cost allocation tags</text>
  <text x="515.862069" y="552.333333" font-family="Arial, sans-serif" font-size="13.00005" fill="var(--text-muted)">&#x2022; Per-account cost tracking</text>


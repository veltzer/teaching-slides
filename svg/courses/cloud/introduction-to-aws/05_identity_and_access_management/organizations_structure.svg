  <line x1="164.137931" y1="146.333333" x2="164.137931" y2="175.333333" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="433.103448" y1="146.333333" x2="433.103448" y2="175.333333" stroke="var(--text-muted)" stroke-width="2"/>

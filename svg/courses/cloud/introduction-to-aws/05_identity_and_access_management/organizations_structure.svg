  <text x="81.37931" y="479.833387" font-family="Arial, sans-serif" font-size="13.00005" fill="var(--text-muted)">&#x2022; Preventive guardrails across accounts</text>
  <text x="81.37931" y="504" font-family="Arial, sans-serif" font-size="13.00005" fill="var(--text-muted)">&#x2022; Inherited down the OU hierarchy</text>
  <text x="81.37931" y="528.166613" font-family="Arial, sans-serif" font-size="13.00005" fill="var(--text-muted)">&#x2022; Cannot grant permissions, only restrict</text>
  <text x="81.37931" y="552.333333" font-family="Arial, sans-serif" font-size="13.00005" fill="var(--text-muted)">&#x2022; Do not apply to management account</text>


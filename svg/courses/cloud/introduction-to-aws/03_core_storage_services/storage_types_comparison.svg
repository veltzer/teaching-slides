  <line x1="684.628099" y1="339.666667" x2="902.809917" y2="339.666667" stroke="var(--warn-border)" stroke-width="1.5"/>

  <text x="793.719008" y="368.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.707696" font-weight="bold" fill="var(--text)">Use Cases</text>
  <text x="793.719008" y="392.83328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" fill="var(--text-muted)">Shared content</text>
  <text x="793.719008" y="412.166613" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" fill="var(--text-muted)">CMS, web serving</text>

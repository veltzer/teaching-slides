<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--bg)"/>

  <!-- Column 1: Object Storage (S3) -->
  <rect x="77.5" y="58.125" width="262.5" height="543.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <!-- Bucket icon -->
  <ellipse cx="208.75" cy="112.5" rx="46.875" ry="18.125" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <path d="M 161.875 112.5 L 161.875 166.875 Q 208.75 194.0625 255.625 166.875 L 255.625 112.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <ellipse cx="208.75" cy="166.875" rx="46.875" ry="18.125" fill="none" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="208.75" y="144.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">S3</text>

  <text x="208.75" y="212.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--primary-accent)">Object Storage</text>
  <text x="208.75" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--text)">Amazon S3</text>

  <line x1="105.625" y1="252.9688" x2="311.875" y2="252.9688" stroke="var(--primary-border)" stroke-width="1.5"/>

  <text x="208.75" y="280.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Access Pattern</text>
  <text x="208.75" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">HTTP/HTTPS API</text>
  <text x="208.75" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Key-value pairs</text>

  <line x1="105.625" y1="339.0625" x2="311.875" y2="339.0625" stroke="var(--primary-border)" stroke-width="1.5"/>

  <text x="208.75" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Use Cases</text>
  <text x="208.75" y="388.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Static websites</text>
  <text x="208.75" y="407.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Data lakes</text>
  <text x="208.75" y="425.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Backups, media</text>

  <line x1="105.625" y1="443.2812" x2="311.875" y2="443.2812" stroke="var(--primary-border)" stroke-width="1.5"/>

  <text x="208.75" y="470.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Cost</text>
  <rect x="143.125" y="484.0625" width="131.25" height="21.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="208.75" y="499.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">$0.023/GB</text>
  <text x="208.75" y="529.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Virtually unlimited</text>
  <text x="208.75" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">11 nines durability</text>

  <!-- Column 2: Block Storage (EBS) -->
  <rect x="368.125" y="58.125" width="262.5" height="543.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <!-- Disk icon -->
  <rect x="175.9375" y="89.8438" width="65.625" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" transform="translate(325,0)"/>
  <rect x="185.3125" y="98.9062" width="46.875" height="9.0625" rx="6" fill="var(--ok-fill)" transform="translate(325,0)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="185.3125" y="114.3125" width="46.875" height="9.0625" rx="6" fill="var(--ok-fill)" transform="translate(325,0)" stroke="var(--ok-border)" stroke-width="2"/>

  <text x="499.375" y="212.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--ok-accent)">Block Storage</text>
  <text x="499.375" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--text)">Amazon EBS</text>

  <line x1="396.25" y1="252.9688" x2="602.5" y2="252.9688" stroke="var(--ok-border)" stroke-width="1.5"/>

  <text x="499.375" y="280.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Access Pattern</text>
  <text x="499.375" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Mounted as volume</text>
  <text x="499.375" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Block-level I/O</text>

  <line x1="396.25" y1="339.0625" x2="602.5" y2="339.0625" stroke="var(--ok-border)" stroke-width="1.5"/>

  <text x="499.375" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Use Cases</text>
  <text x="499.375" y="388.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Boot volumes</text>
  <text x="499.375" y="407.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Databases</text>
  <text x="499.375" y="425.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Transaction logs</text>

  <line x1="396.25" y1="443.2812" x2="602.5" y2="443.2812" stroke="var(--ok-border)" stroke-width="1.5"/>

  <text x="499.375" y="470.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Cost</text>
  <rect x="424.375" y="484.0625" width="150" height="21.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="499.375" y="499.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">$0.08/GB (gp3)</text>
  <text x="499.375" y="529.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Single AZ attached</text>
  <text x="499.375" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Snapshot for backup</text>

  <!-- Column 3: File Storage (EFS) -->
  <rect x="658.75" y="58.125" width="262.5" height="543.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <!-- Shared folder icon -->
  <rect x="171.25" y="89.8438" width="75" height="49.8438" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" transform="translate(640,0)"/>
  <rect x="171.25" y="85.3125" width="37.5" height="13.5938" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" transform="translate(640,0)"/>

  <text x="790" y="212.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--warn-accent)">File Storage</text>
  <text x="790" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--text)">Amazon EFS</text>

  <line x1="686.875" y1="252.9688" x2="893.125" y2="252.9688" stroke="var(--warn-border)" stroke-width="1.5"/>

  <text x="790" y="280.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Access Pattern</text>
  <text x="790" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">NFS protocol</text>
  <text x="790" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Shared file system</text>

  <line x1="686.875" y1="339.0625" x2="893.125" y2="339.0625" stroke="var(--warn-border)" stroke-width="1.5"/>

  <text x="790" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Use Cases</text>
  <text x="790" y="388.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Shared content</text>
  <text x="790" y="407.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">CMS, web serving</text>
  <text x="790" y="425.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Dev environments</text>

  <line x1="686.875" y1="443.2812" x2="893.125" y2="443.2812" stroke="var(--warn-border)" stroke-width="1.5"/>

  <text x="790" y="470.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Cost</text>
  <rect x="715" y="484.0625" width="150" height="21.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="790" y="499.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">$0.30/GB</text>
  <text x="790" y="529.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Multi-AZ by default</text>
  <text x="790" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Auto-scaling capacity</text>

  <!-- Column 4: Archive (Glacier) -->
  <rect x="949.375" y="58.125" width="262.5" height="543.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <!-- Snowflake/archive icon -->

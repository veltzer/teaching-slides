  <line x1="684.628099" y1="450.83328" x2="902.809917" y2="450.83328" stroke="var(--warn-border)" stroke-width="1.5"/>

  <text x="793.719008" y="479.833387" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.707696" font-weight="bold" fill="var(--text)">Cost</text>
  <rect x="714.380165" y="494.333333" width="158.677686" height="23.2" rx="6.373499" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="793.719008" y="510.76672" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" font-weight="bold" fill="var(--bg)">$0.30/GB</text>
  <text x="793.719008" y="542.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.749439" fill="var(--text-muted)">Multi-AZ by default</text>
  <text x="793.719008" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.749439" fill="var(--text-muted)">Auto-scaling capacity</text>


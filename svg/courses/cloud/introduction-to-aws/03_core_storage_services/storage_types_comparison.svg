  <line x1="1057.1875" y1="112.5" x2="1104.0625" y2="112.5" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="1061.875" y1="94.375" x2="1099.375" y2="130.625" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="1099.375" y1="94.375" x2="1061.875" y2="130.625" stroke="var(--info-border)" stroke-width="2"/>
  <circle cx="1080.625" cy="112.5" r="7.3739" fill="var(--info-fill)"/>

  <text x="1080.625" y="212.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--info-accent)">Archive</text>
  <text x="1080.625" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--text)">S3 Glacier</text>

  <line x1="977.5" y1="252.9688" x2="1183.75" y2="252.9688" stroke="var(--info-border)" stroke-width="1.5"/>

  <text x="1080.625" y="280.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Access Pattern</text>
  <text x="1080.625" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Retrieval requests</text>
  <text x="1080.625" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Minutes to hours</text>

  <line x1="977.5" y1="339.0625" x2="1183.75" y2="339.0625" stroke="var(--info-border)" stroke-width="1.5"/>

  <text x="1080.625" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Use Cases</text>
  <text x="1080.625" y="388.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Compliance archives</text>
  <text x="1080.625" y="407.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Long-term backups</text>
  <text x="1080.625" y="425.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Regulatory data</text>


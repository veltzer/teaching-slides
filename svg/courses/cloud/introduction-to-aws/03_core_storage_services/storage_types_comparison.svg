  <line x1="377.190083" y1="450.83328" x2="595.371901" y2="450.83328" stroke="var(--ok-border)" stroke-width="1.5"/>

  <text x="486.280992" y="479.833387" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.707696" font-weight="bold" fill="var(--text)">Cost</text>
  <rect x="406.942149" y="494.333333" width="158.677686" height="23.2" rx="6.373499" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="486.280992" y="510.76672" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" font-weight="bold" fill="var(--bg)">$0.08/GB (gp3)</text>
  <text x="486.280992" y="542.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.749439" fill="var(--text-muted)">Single AZ attached</text>
  <text x="486.280992" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.749439" fill="var(--text-muted)">Snapshot for backup</text>

  <!-- Column 3: File Storage (EFS) -->
  <rect x="654.876033" y="40" width="277.68595" height="580" rx="6.373499" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <!-- Shared folder icon -->
  <rect x="139.173554" y="73.833387" width="79.338843" height="53.16672" rx="6.373499" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" transform="translate(640,0)" filter="url(#shadow)"/>
  <rect x="139.173554" y="69" width="39.669421" height="14.500053" rx="6.373499" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" transform="translate(640,0)" filter="url(#shadow)"/>

  <text x="793.719008" y="204.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.582469" font-weight="bold" fill="var(--warn-accent)">File Storage</text>
  <text x="793.719008" y="228.500053" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.686772" fill="var(--text)">Amazon EFS</text>

  <line x1="684.628099" y1="247.833387" x2="902.809917" y2="247.833387" stroke="var(--warn-border)" stroke-width="1.5"/>


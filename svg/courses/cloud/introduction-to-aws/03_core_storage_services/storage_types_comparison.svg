<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Column 1: Object Storage (S3) -->
  <rect x="40" y="40" width="277.68595" height="580" rx="6.373499" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <!-- Bucket icon -->
  <ellipse cx="178.842975" cy="98" rx="49.586777" ry="19.333333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <path d="M 129.256198 98 L 129.256198 156 Q 178.842975 185 228.429752 156 L 228.429752 98" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <ellipse cx="178.842975" cy="156" rx="49.586777" ry="19.333333" fill="none" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="178.842975" y="131.833387" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.707696" font-weight="bold" fill="var(--primary-accent)">S3</text>

  <text x="178.842975" y="204.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.582469" font-weight="bold" fill="var(--primary-accent)">Object Storage</text>
  <text x="178.842975" y="228.500053" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.686772" fill="var(--text)">Amazon S3</text>

  <line x1="69.752066" y1="247.833387" x2="287.933884" y2="247.833387" stroke="var(--primary-border)" stroke-width="1.5"/>

  <text x="178.842975" y="276.83328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.707696" font-weight="bold" fill="var(--text)">Access Pattern</text>
  <text x="178.842975" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" fill="var(--text-muted)">HTTP/HTTPS API</text>
  <text x="178.842975" y="320.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" fill="var(--text-muted)">Key-value pairs</text>

  <line x1="69.752066" y1="339.666667" x2="287.933884" y2="339.666667" stroke="var(--primary-border)" stroke-width="1.5"/>

  <text x="178.842975" y="368.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.707696" font-weight="bold" fill="var(--text)">Use Cases</text>
  <text x="178.842975" y="392.83328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" fill="var(--text-muted)">Static websites</text>
  <text x="178.842975" y="412.166613" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" fill="var(--text-muted)">Data lakes</text>
  <text x="178.842975" y="431.499947" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" fill="var(--text-muted)">Backups, media</text>

  <line x1="69.752066" y1="450.83328" x2="287.933884" y2="450.83328" stroke="var(--primary-border)" stroke-width="1.5"/>

  <text x="178.842975" y="479.833387" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.707696" font-weight="bold" fill="var(--text)">Cost</text>
  <rect x="109.421488" y="494.333333" width="138.842975" height="23.2" rx="6.373499" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.842975" y="510.76672" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" font-weight="bold" fill="var(--bg)">$0.023/GB</text>
  <text x="178.842975" y="542.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.749439" fill="var(--text-muted)">Virtually unlimited</text>
  <text x="178.842975" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.749439" fill="var(--text-muted)">11 nines durability</text>

  <!-- Column 2: Block Storage (EBS) -->
  <rect x="347.438017" y="40" width="277.68595" height="580" rx="6.373499" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <!-- Disk icon -->
  <rect x="144.132231" y="73.833387" width="69.421488" height="48.333333" rx="6.373499" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" transform="translate(325,0)" filter="url(#shadow)"/>
  <rect x="154.049587" y="83.499947" width="49.586777" height="9.666667" rx="6.373499" fill="var(--ok-fill)" transform="translate(325,0)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="154.049587" y="99.933333" width="49.586777" height="9.666667" rx="6.373499" fill="var(--ok-fill)" transform="translate(325,0)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

  <text x="486.280992" y="204.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.582469" font-weight="bold" fill="var(--ok-accent)">Block Storage</text>
  <text x="486.280992" y="228.500053" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.686772" fill="var(--text)">Amazon EBS</text>

  <line x1="377.190083" y1="247.833387" x2="595.371901" y2="247.833387" stroke="var(--ok-border)" stroke-width="1.5"/>

  <text x="486.280992" y="276.83328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.707696" font-weight="bold" fill="var(--text)">Access Pattern</text>
  <text x="486.280992" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" fill="var(--text-muted)">Mounted as volume</text>
  <text x="486.280992" y="320.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" fill="var(--text-muted)">Block-level I/O</text>

  <line x1="377.190083" y1="339.666667" x2="595.371901" y2="339.666667" stroke="var(--ok-border)" stroke-width="1.5"/>

  <text x="486.280992" y="368.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.707696" font-weight="bold" fill="var(--text)">Use Cases</text>
  <text x="486.280992" y="392.83328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" fill="var(--text-muted)">Boot volumes</text>
  <text x="486.280992" y="412.166613" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.728621" fill="var(--text-muted)">Databases</text>

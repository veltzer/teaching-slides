<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Start: Choose EBS Type (diamond) -->
  <polygon points="624.070796,40 772.743363,97.049191 624.070796,154.098381 475.39823,97.049191" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="624.070796" y="92.295144" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.072683" font-weight="bold" fill="var(--bg)">Choose EBS</text>
  <text x="624.070796" y="111.311541" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.072683" font-weight="bold" fill="var(--bg)">Volume Type</text>

  <!-- Arrow down to first decision -->
  <line x1="624.070796" y1="154.098381" x2="624.070796" y2="192.131175" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Decision 1: High IOPS needed? -->
  <polygon points="624.070796,201.639374 804.60177,268.196763 624.070796,334.754152 443.539823,268.196763" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="624.070796" y="260.590204" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--primary-accent)">High IOPS</text>
  <text x="624.070796" y="279.606601" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--primary-accent)">needed?</text>

  <!-- Yes branch: right to io2 -->
  <line x1="804.60177" y1="268.196763" x2="921.415929" y2="268.196763" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="857.699115" y="256.786924" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--ok-accent)">Yes</text>

  <!-- io2 Block Express leaf -->
  <rect x="932.035398" y="225.409922" width="297.345133" height="85.573786" rx="6.540969" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080.707965" y="253.934412" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.087307" font-weight="bold" fill="var(--ok-accent)">io2 Block Express</text>
  <text x="1080.707965" y="275.803321" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.063079" fill="var(--text)">Up to 256K IOPS</text>
  <text x="1080.707965" y="294.819718" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.058168" fill="var(--text-muted)">Databases, SAP HANA, I/O-intensive</text>

  <!-- No branch: down to decision 2 -->
  <line x1="624.070796" y1="334.754152" x2="624.070796" y2="372.786945" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="361.377107" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--danger-accent)">No</text>

  <!-- Decision 2: Sequential throughput? -->
  <polygon points="624.070796,382.295144 804.60177,448.852533 624.070796,515.409922 443.539823,448.852533" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="624.070796" y="441.245974" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--primary-accent)">Sequential</text>
  <text x="624.070796" y="460.262371" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--primary-accent)">throughput?</text>

  <!-- Yes branch: right to st1 -->
  <line x1="804.60177" y1="448.852533" x2="921.415929" y2="448.852533" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="857.699115" y="437.442695" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--ok-accent)">Yes</text>

  <!-- st1 leaf -->
  <rect x="932.035398" y="406.065588" width="297.345133" height="85.573786" rx="6.540969" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080.707965" y="434.590288" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.087307" font-weight="bold" fill="var(--warn-accent)">st1 (Throughput)</text>
  <text x="1080.707965" y="456.459092" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.063079" fill="var(--text)">500 MB/s throughput</text>
  <text x="1080.707965" y="475.475489" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.058168" fill="var(--text-muted)">Big data, log processing, streaming</text>

  <!-- No branch: left to decision 3 -->
  <line x1="443.539823" y1="448.852533" x2="316.106195" y2="448.852533" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385.132743" y="437.442695" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--danger-accent)">No</text>

  <!-- Decision 3: Frequent access? -->
  <polygon points="188.672566,382.295144 316.106195,448.852533 188.672566,515.409922 61.238938,448.852533" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="188.672566" y="441.245974" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--primary-accent)">Frequent</text>
  <text x="188.672566" y="460.262371" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--primary-accent)">access?</text>

  <!-- Yes branch: up-left to gp3 -->
  <line x1="188.672566" y1="382.295144" x2="188.672566" y2="344.26235" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="207.787611" y="368.032794" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--ok-accent)">Yes</text>

  <!-- gp3 leaf -->
  <rect x="40" y="249.180366" width="297.345133" height="85.573786" rx="6.540969" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="188.672566" y="277.704961" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.087307" font-weight="bold" fill="var(--ok-accent)">gp3 (General Purpose)</text>
  <text x="188.672566" y="299.573765" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.063079" fill="var(--text)">3,000 baseline IOPS</text>
  <text x="188.672566" y="318.590162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.058168" fill="var(--text-muted)">Boot volumes, dev/test, most workloads</text>

  <!-- No branch: down to sc1 -->
  <line x1="188.672566" y1="515.409922" x2="188.672566" y2="548.688669" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="207.787611" y="536.327959" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--danger-accent)">No</text>

  <!-- sc1 leaf -->
  <rect x="40" y="558.196763" width="297.345133" height="61.803237" rx="6.540969" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="188.672566" y="583.868951" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.087307" font-weight="bold" fill="var(--info-accent)">sc1 (Cold HDD)</text>
  <text x="188.672566" y="605.73786" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.058168" fill="var(--text-muted)">Lowest cost, infrequent access, archival</text>

  <!-- Price comparison panel -->
  <rect x="740.884956" y="534.426319" width="499.115044" height="76.065588" rx="6.540969" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="990.442478" y="558.196763" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.067881" font-weight="bold" fill="var(--text)">Price per GB/month (us-east-1)</text>
  <text x="804.60177" y="591.47551" font-family="Arial, sans-serif" font-size="12.058168" fill="var(--ok-accent)">io2: $0.125</text>
  <text x="921.415929" y="591.47551" font-family="Arial, sans-serif" font-size="12.058168" fill="var(--ok-accent)">gp3: $0.08</text>
  <text x="1027.610619" y="591.47551" font-family="Arial, sans-serif" font-size="12.058168" fill="var(--warn-accent)">st1: $0.045</text>
  <text x="1144.424779" y="591.47551" font-family="Arial, sans-serif" font-size="12.058168" fill="var(--info-accent)">sc1: $0.015</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="0" fill="var(--bg)"/>

  <!-- Start: Choose EBS Type (diamond) -->
  <polygon points="640,20 780,80 640,140 500,80" fill="url(#grad-primary)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">Choose EBS</text>
  <text x="640" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">Volume Type</text>

  <!-- Arrow down to first decision -->
  <line x1="640" y1="140" x2="640" y2="180" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1: High IOPS needed? -->
  <polygon points="640,190 810,260 640,330 470,260" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">High IOPS</text>
  <text x="640" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">needed?</text>

  <!-- Yes branch: right to io2 -->
  <line x1="810" y1="260" x2="920" y2="260" stroke="var(--ok)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="860" y="248" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok)">Yes</text>

  <!-- io2 Block Express leaf -->
  <rect x="930" y="215" width="280" height="90" rx="14" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-dk)">io2 Block Express</text>
  <text x="1070" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Up to 256K IOPS</text>
  <text x="1070" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Databases, SAP HANA, I/O-intensive</text>

  <!-- No branch: down to decision 2 -->
  <line x1="640" y1="330" x2="640" y2="370" stroke="var(--danger)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="655" y="358" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger)">No</text>

  <!-- Decision 2: Sequential throughput? -->
  <polygon points="640,380 810,450 640,520 470,450" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">Sequential</text>
  <text x="640" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">throughput?</text>

  <!-- Yes branch: right to st1 -->
  <line x1="810" y1="450" x2="920" y2="450" stroke="var(--ok)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="860" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok)">Yes</text>

  <!-- st1 leaf -->
  <rect x="930" y="405" width="280" height="90" rx="14" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-dk)">st1 (Throughput)</text>
  <text x="1070" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">500 MB/s throughput</text>
  <text x="1070" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Big data, log processing, streaming</text>

  <!-- No branch: left to decision 3 -->
  <line x1="470" y1="450" x2="350" y2="450" stroke="var(--danger)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="415" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger)">No</text>

  <!-- Decision 3: Frequent access? -->
  <polygon points="230,380 350,450 230,520 110,450" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">Frequent</text>
  <text x="230" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">access?</text>

  <!-- Yes branch: up-left to gp3 -->
  <line x1="230" y1="380" x2="230" y2="340" stroke="var(--ok)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="248" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok)">Yes</text>

  <!-- gp3 leaf -->
  <rect x="90" y="240" width="280" height="90" rx="14" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-dk)">gp3 (General Purpose)</text>
  <text x="230" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">3,000 baseline IOPS</text>
  <text x="230" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Boot volumes, dev/test, most workloads</text>

  <!-- No branch: down to sc1 -->
  <line x1="230" y1="520" x2="230" y2="555" stroke="var(--danger)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="248" y="542" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger)">No</text>

  <!-- sc1 leaf -->
  <rect x="90" y="565" width="280" height="65" rx="14" fill="var(--info-pale)" stroke="var(--info-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-dk)">sc1 (Cold HDD)</text>
  <text x="230" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Lowest cost, infrequent access, archival</text>

  <!-- Price comparison panel -->
  <rect x="750" y="540" width="470" height="80" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="985" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Price per GB/month (us-east-1)</text>
  <text x="810" y="600" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">io2: $0.125</text>
  <text x="920" y="600" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">gp3: $0.08</text>
  <text x="1020" y="600" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)">st1: $0.045</text>
  <text x="1130" y="600" font-family="Arial, sans-serif" font-size="12" fill="var(--info-dk)">sc1: $0.015</text>
</svg>
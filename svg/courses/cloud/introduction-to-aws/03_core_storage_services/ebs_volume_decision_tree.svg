<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--bg)"/>

  <!-- Start: Choose EBS Type (diamond) -->
  <polygon points="640,58.125 771.25,112.5 640,166.875 508.75,112.5" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="107.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)">Choose EBS</text>
  <text x="640" y="126.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)">Volume Type</text>

  <!-- Arrow down to first decision -->
  <line x1="640" y1="166.875" x2="640" y2="203.125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1: High IOPS needed? -->
  <polygon points="640,212.1875 799.375,275.625 640,339.0625 480.625,275.625" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="268.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">High IOPS</text>
  <text x="640" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">needed?</text>

  <!-- Yes branch: right to io2 -->
  <line x1="799.375" y1="275.625" x2="902.5" y2="275.625" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="846.25" y="264.75" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Yes</text>

  <!-- io2 Block Express leaf -->
  <rect x="911.875" y="234.8438" width="262.5" height="81.5625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.125" y="262.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--ok-accent)">io2 Block Express</text>
  <text x="1043.125" y="282.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Up to 256K IOPS</text>
  <text x="1043.125" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Databases, SAP HANA, I/O-intensive</text>

  <!-- No branch: down to decision 2 -->
  <line x1="640" y1="339.0625" x2="640" y2="375.3125" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="654.0625" y="364.4375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">No</text>

  <!-- Decision 2: Sequential throughput? -->
  <polygon points="640,384.375 799.375,447.8125 640,511.25 480.625,447.8125" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="440.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Sequential</text>
  <text x="640" y="458.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">throughput?</text>

  <!-- Yes branch: right to st1 -->
  <line x1="799.375" y1="447.8125" x2="902.5" y2="447.8125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="846.25" y="436.9375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Yes</text>

  <!-- st1 leaf -->
  <rect x="911.875" y="407.0312" width="262.5" height="81.5625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.125" y="434.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--warn-accent)">st1 (Throughput)</text>
  <text x="1043.125" y="455.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">500 MB/s throughput</text>
  <text x="1043.125" y="473.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Big data, log processing, streaming</text>

  <!-- No branch: left to decision 3 -->
  <line x1="480.625" y1="447.8125" x2="368.125" y2="447.8125" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="429.0625" y="436.9375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">No</text>

  <!-- Decision 3: Frequent access? -->
  <polygon points="255.625,384.375 368.125,447.8125 255.625,511.25 143.125,447.8125" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="255.625" y="440.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Frequent</text>
  <text x="255.625" y="458.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">access?</text>

  <!-- Yes branch: up-left to gp3 -->
  <line x1="255.625" y1="384.375" x2="255.625" y2="348.125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="272.5" y="370.7812" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Yes</text>

  <!-- gp3 leaf -->
  <rect x="124.375" y="257.5" width="262.5" height="81.5625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="255.625" y="284.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--ok-accent)">gp3 (General Purpose)</text>
  <text x="255.625" y="305.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">3,000 baseline IOPS</text>
  <text x="255.625" y="323.6562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Boot volumes, dev/test, most workloads</text>

  <!-- No branch: down to sc1 -->
  <line x1="255.625" y1="511.25" x2="255.625" y2="542.9688" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="272.5" y="531.1875" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">No</text>

  <!-- sc1 leaf -->
  <rect x="124.375" y="552.0312" width="262.5" height="58.9062" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="255.625" y="576.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--info-accent)">sc1 (Cold HDD)</text>
  <text x="255.625" y="597.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Lowest cost, infrequent access, archival</text>

  <!-- Price comparison panel -->
  <rect x="743.125" y="529.375" width="440.625" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="963.4375" y="552.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Price per GB/month (us-east-1)</text>
  <text x="799.375" y="583.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">io2: $0.125</text>
  <text x="902.5" y="583.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">gp3: $0.08</text>
  <text x="996.25" y="583.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">st1: $0.045</text>
  <text x="1099.375" y="583.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">sc1: $0.015</text>
</svg>
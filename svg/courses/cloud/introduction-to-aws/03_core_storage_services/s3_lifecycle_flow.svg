<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <linearGradient id="grad-cost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1565c0"/><stop offset="50%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="0" fill="var(--bg)"/>

  <!-- Cost gradient bar at bottom -->
  <rect x="60" y="530" width="1160" height="30" rx="8" fill="url(#grad-cost)" opacity="0.3"/>
  <text x="60" y="585" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">Higher Cost</text>
  <text x="1220" y="585" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">Lower Cost</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Cost per GB decreases as data moves right</text>

  <!-- Stage 1: S3 Standard -->
  <rect x="40" y="80" width="200" height="160" rx="14" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="140" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--primary-dk)">S3 Standard</text>
  <line x1="65" y1="135" x2="215" y2="135" stroke="var(--primary-lt)" stroke-width="1.5"/>
  <text x="140" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Frequent access</text>
  <text x="140" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Low latency</text>
  <text x="140" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">$0.023/GB</text>
  <text x="140" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Day 0</text>

  <!-- Arrow 1 -->
  <line x1="240" y1="160" x2="290" y2="160" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="245" y="130" width="80" height="24" rx="6" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1"/>
  <text x="285" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-muted)">30 days</text>

  <!-- Stage 2: S3 IA -->
  <rect x="300" y="80" width="200" height="160" rx="14" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary)">S3 Standard-IA</text>
  <line x1="325" y1="130" x2="475" y2="130" stroke="var(--primary-lt)" stroke-width="1.5"/>
  <text x="400" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Infrequent access</text>
  <text x="400" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Retrieval fee</text>
  <text x="400" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary)">$0.0125/GB</text>
  <text x="400" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Day 30</text>

  <!-- Arrow 2 -->
  <line x1="500" y1="160" x2="550" y2="160" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="505" y="130" width="80" height="24" rx="6" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1"/>
  <text x="545" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-muted)">90 days</text>

  <!-- Stage 3: Glacier -->
  <rect x="560" y="80" width="200" height="160" rx="14" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--ok-dk)">Glacier</text>
  <line x1="585" y1="135" x2="735" y2="135" stroke="var(--ok-lt)" stroke-width="1.5"/>
  <text x="660" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Archive storage</text>
  <text x="660" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Min to hours retrieval</text>
  <text x="660" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">$0.004/GB</text>
  <text x="660" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Day 120</text>

  <!-- Arrow 3 -->
  <line x1="760" y1="160" x2="810" y2="160" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="763" y="130" width="84" height="24" rx="6" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1"/>
  <text x="805" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-muted)">365 days</text>

  <!-- Stage 4: Deep Archive -->
  <rect x="820" y="80" width="200" height="160" rx="14" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="920" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-dk)">Glacier Deep</text>
  <text x="920" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-dk)">Archive</text>
  <line x1="845" y1="148" x2="995" y2="148" stroke="var(--ok-lt)" stroke-width="1.5"/>
  <text x="920" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Coldest storage</text>
  <text x="920" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">12-48 hour retrieval</text>
  <text x="920" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">$0.00099/GB</text>
  <text x="920" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Day 485+</text>

  <!-- Arrow 4 (optional delete) -->
  <line x1="1020" y1="160" x2="1070" y2="160" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="1045" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">optional</text>

  <!-- Stage 5: Delete -->
  <rect x="1080" y="100" width="160" height="120" rx="14" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-dk)">Delete</text>
  <text x="1160" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Expiration rule</text>
  <text x="1160" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">removes object</text>

  <!-- Timeline bar -->
  <rect x="60" y="310" width="1160" height="50" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="640" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-dark)">S3 Lifecycle Policy Timeline</text>

  <!-- Savings summary -->
  <rect x="60" y="390" width="1160" height="110" rx="12" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="640" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)">Cost Savings Summary</text>
  <text x="200" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Standard: $0.023</text>
  <text x="430" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">IA: 46% savings</text>
  <text x="660" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Glacier: 83% savings</text>
  <text x="940" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Deep Archive: 96% savings</text>
  <text x="640" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Lifecycle policies automate transitions -- set once, save continuously</text>
</svg>
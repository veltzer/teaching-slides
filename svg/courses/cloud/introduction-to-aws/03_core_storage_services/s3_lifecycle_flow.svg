<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-cost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1565c0"/><stop offset="50%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="6" fill="var(--bg)"/>

  <!-- Cost gradient bar at bottom -->
  <rect x="60" y="530" width="1160" height="30" rx="6" fill="url(#grad-cost)" opacity="0.3"/>
  <text x="60" y="585" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">Higher Cost</text>
  <text x="1220" y="585" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">Lower Cost</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Cost per GB decreases as data moves right</text>

  <!-- Stage 1: S3 Standard -->
  <rect x="40" y="80" width="200" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--primary-accent)">S3 Standard</text>
  <line x1="65" y1="135" x2="215" y2="135" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="140" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Frequent access</text>
  <text x="140" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Low latency</text>
  <text x="140" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">$0.023/GB</text>
  <text x="140" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Day 0</text>

  <!-- Arrow 1 -->
  <line x1="240" y1="160" x2="290" y2="160" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="245" y="130" width="80" height="24" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="285" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-muted)">30 days</text>

  <!-- Stage 2: S3 IA -->
  <rect x="300" y="80" width="200" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">S3 Standard-IA</text>
  <line x1="325" y1="130" x2="475" y2="130" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="400" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Infrequent access</text>
  <text x="400" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Retrieval fee</text>
  <text x="400" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">$0.0125/GB</text>
  <text x="400" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Day 30</text>

  <!-- Arrow 2 -->
  <line x1="500" y1="160" x2="550" y2="160" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="505" y="130" width="80" height="24" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="545" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-muted)">90 days</text>

  <!-- Stage 3: Glacier -->
  <rect x="560" y="80" width="200" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--ok-accent)">Glacier</text>
  <line x1="585" y1="135" x2="735" y2="135" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="660" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Archive storage</text>
  <text x="660" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Min to hours retrieval</text>
  <text x="660" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">$0.004/GB</text>
  <text x="660" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Day 120</text>

  <!-- Arrow 3 -->
  <line x1="760" y1="160" x2="810" y2="160" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="763" y="130" width="84" height="24" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="805" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-muted)">365 days</text>

  <!-- Stage 4: Deep Archive -->
  <rect x="820" y="80" width="200" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Glacier Deep</text>
  <text x="920" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Archive</text>
  <line x1="845" y1="148" x2="995" y2="148" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="920" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Coldest storage</text>
  <text x="920" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">12-48 hour retrieval</text>
  <text x="920" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">$0.00099/GB</text>
  <text x="920" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Day 485+</text>

  <!-- Arrow 4 (optional delete) -->
  <line x1="1020" y1="160" x2="1070" y2="160" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="1045" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">optional</text>

  <!-- Stage 5: Delete -->
  <rect x="1080" y="100" width="160" height="120" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-accent)">Delete</text>
  <text x="1160" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Expiration rule</text>
  <text x="1160" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">removes object</text>

  <!-- Timeline bar -->
  <rect x="60" y="310" width="1160" height="50" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">S3 Lifecycle Policy Timeline</text>

  <!-- Savings summary -->
  <rect x="60" y="390" width="1160" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Cost Savings Summary</text>
  <text x="200" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Standard: $0.023</text>
  <text x="430" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">IA: 46% savings</text>
  <text x="660" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Glacier: 83% savings</text>
  <text x="940" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Deep Archive: 96% savings</text>
  <text x="640" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Lifecycle policies automate transitions -- set once, save continuously</text>
</svg>
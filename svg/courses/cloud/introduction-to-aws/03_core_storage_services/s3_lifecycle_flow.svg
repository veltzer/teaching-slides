<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Cost gradient bar at bottom -->
  <rect x="60" y="556.83174" width="1160" height="34.455449" rx="6.976056" fill="url(#grad-cost)" opacity="0.3"/>
  <text x="60" y="620" font-family="Arial, sans-serif" font-size="15.003635" font-weight="bold" fill="var(--primary-accent)">Higher Cost</text>
  <text x="1220" y="620" text-anchor="end" font-family="Arial, sans-serif" font-size="15.003635" font-weight="bold" fill="var(--ok-accent)">Lower Cost</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.931997" fill="var(--text-muted)">Cost per GB decreases as data moves right</text>

  <!-- Stage 1: S3 Standard -->
  <rect x="40" y="40" width="200" height="183.762396" rx="6.976056" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="85.940599" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.218667" font-weight="bold" fill="var(--primary-accent)">S3 Standard</text>
  <line x1="65" y1="103.168387" x2="215" y2="103.168387" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="140" y="131.881198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.931997" fill="var(--text)">Frequent access</text>
  <text x="140" y="154.851498" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.931997" fill="var(--text)">Low latency</text>
  <text x="140" y="183.564309" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003635" font-weight="bold" fill="var(--primary-accent)">$0.023/GB</text>
  <text x="140" y="206.534608" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.860242" fill="var(--text-muted)">Day 0</text>

  <!-- Arrow 1 -->
  <line x1="240" y1="131.881198" x2="290" y2="131.881198" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="245" y="97.425749" width="80" height="27.564359" rx="6.976056" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="285" y="116.950567" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.860242" font-weight="bold" fill="var(--text-muted)">30 days</text>

  <!-- Stage 2: S3 IA -->
  <rect x="300" y="40" width="200" height="183.762396" rx="6.976056" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="80.198088" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.147028" font-weight="bold" fill="var(--primary-accent)">S3 Standard-IA</text>
  <line x1="325" y1="97.425749" x2="475" y2="97.425749" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="400" y="126.138687" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.931997" fill="var(--text)">Infrequent access</text>
  <text x="400" y="149.108986" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.931997" fill="var(--text)">Retrieval fee</text>
  <text x="400" y="177.821797" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003635" font-weight="bold" fill="var(--primary-accent)">$0.0125/GB</text>
  <text x="400" y="206.534608" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.860242" fill="var(--text-muted)">Day 30</text>

  <!-- Arrow 2 -->
  <line x1="500" y1="131.881198" x2="550" y2="131.881198" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="505" y="97.425749" width="80" height="27.564359" rx="6.976056" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="545" y="116.950567" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.860242" font-weight="bold" fill="var(--text-muted)">90 days</text>

  <!-- Stage 3: Glacier -->
  <rect x="560" y="40" width="200" height="183.762396" rx="6.976056" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="85.940599" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.218667" font-weight="bold" fill="var(--ok-accent)">Glacier</text>
  <line x1="585" y1="103.168387" x2="735" y2="103.168387" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="660" y="131.881198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.931997" fill="var(--text)">Archive storage</text>
  <text x="660" y="154.851498" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.931997" fill="var(--text)">Min to hours retrieval</text>
  <text x="660" y="183.564309" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003635" font-weight="bold" fill="var(--ok-accent)">$0.004/GB</text>
  <text x="660" y="206.534608" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.860242" fill="var(--text-muted)">Day 120</text>

  <!-- Arrow 3 -->
  <line x1="760" y1="131.881198" x2="810" y2="131.881198" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="763" y="97.425749" width="84" height="27.564359" rx="6.976056" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="805" y="116.950567" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.860242" font-weight="bold" fill="var(--text-muted)">365 days</text>

  <!-- Stage 4: Deep Archive -->
  <rect x="820" y="40" width="200" height="183.762396" rx="6.976056" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="80.198088" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.075274" font-weight="bold" fill="var(--ok-accent)">Glacier Deep</text>
  <text x="920" y="103.168387" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.075274" font-weight="bold" fill="var(--ok-accent)">Archive</text>
  <line x1="845" y1="118.099018" x2="995" y2="118.099018" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="920" y="143.366348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.931997" fill="var(--text)">Coldest storage</text>
  <text x="920" y="166.336647" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.931997" fill="var(--text)">12-48 hour retrieval</text>
  <text x="920" y="195.049585" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003635" font-weight="bold" fill="var(--ok-accent)">$0.00099/GB</text>
  <text x="920" y="215.722728" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.860242" fill="var(--text-muted)">Day 485+</text>

  <!-- Arrow 4 (optional delete) -->
  <line x1="1020" y1="131.881198" x2="1070" y2="131.881198" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="1045" y="114.65341" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.788604" fill="var(--text-muted)">optional</text>

  <!-- Stage 5: Delete -->
  <rect x="1080" y="62.9703" width="160" height="137.821797" rx="6.976056" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="120.396048" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.290422" font-weight="bold" fill="var(--danger-accent)">Delete</text>
  <text x="1160" y="149.108986" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.931997" fill="var(--text-muted)">Expiration rule</text>
  <text x="1160" y="177.821797" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.931997" fill="var(--text-muted)">removes object</text>

  <!-- Timeline bar -->
  <rect x="60" y="304.158445" width="1160" height="57.425749" rx="6.976056" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="340.910924" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.147028" font-weight="bold" fill="var(--text)">S3 Lifecycle Policy Timeline</text>

  <!-- Savings summary -->
  <rect x="60" y="396.039643" width="1160" height="126.336647" rx="6.976056" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="430.495092" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.147028" font-weight="bold" fill="var(--ok-accent)">Cost Savings Summary</text>
  <text x="200" y="470.69318" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003635" fill="var(--text)">Standard: $0.023</text>
  <text x="430" y="470.69318" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003635" fill="var(--text)">IA: 46% savings</text>
  <text x="660" y="470.69318" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003635" fill="var(--text)">Glacier: 83% savings</text>
  <text x="940" y="470.69318" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003635" fill="var(--text)">Deep Archive: 96% savings</text>
  <text x="640" y="505.148502" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.931997" fill="var(--text-muted)">Lifecycle policies automate transitions -- set once, save continuously</text>
</svg>

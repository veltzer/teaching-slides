<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="6" fill="var(--surface)"/>

  <!-- Left Panel: Security Groups -->
  <rect x="40" y="20" width="580" height="600" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="20" width="580" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="50" width="580" height="20" fill="var(--primary-accent)" rx="6"/>
  <text x="330" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">Security Groups</text>

  <!-- SG: Instance-level illustration -->
  <text x="80" y="110" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Instance-Level Firewall</text>

  <!-- Subnet box -->
  <rect x="80" y="130" width="500" height="200" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Subnet</text>

  <!-- Instance with SG -->
  <rect x="180" y="170" width="140" height="60" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">EC2 Instance</text>
  <rect x="165" y="155" width="170" height="90" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="250" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">Security Group</text>

  <!-- Second instance with SG -->
  <rect x="400" y="170" width="140" height="60" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="470" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">EC2 Instance</text>
  <rect x="385" y="155" width="170" height="90" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="470" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">Security Group</text>

  <!-- Properties -->
  <rect x="80" y="350" width="500" height="52" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <circle cx="110" cy="376" r="12" fill="url(#grad-ok)"/>
  <text x="108" y="381" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">&#x2713;</text>
  <text x="135" y="381" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Stateful - return traffic automatically allowed</text>

  <rect x="80" y="415" width="500" height="52" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <circle cx="110" cy="441" r="12" fill="url(#grad-ok)"/>
  <text x="108" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">&#x2713;</text>
  <text x="135" y="446" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Allow rules only (implicit deny all)</text>

  <rect x="80" y="480" width="500" height="52" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <circle cx="110" cy="506" r="12" fill="url(#grad-ok)"/>
  <text x="108" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">&#x2713;</text>
  <text x="135" y="511" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">All rules evaluated before decision</text>

  <!-- Traffic flow arrows (SG) -->
  <line x1="80" y1="545" x2="250" y2="545" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Inbound allowed</text>
  <line x1="250" y1="590" x2="80" y2="590" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Return auto-allowed</text>

  <!-- Right Panel: NACLs -->
  <rect x="660" y="20" width="580" height="600" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="20" width="580" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="660" y="50" width="580" height="20" fill="var(--warn-accent)" rx="6"/>
  <text x="950" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">Network ACLs</text>

  <!-- NACL: Subnet-level illustration -->
  <text x="700" y="110" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-accent)">Subnet-Level Firewall</text>

  <!-- Subnet with NACL boundary -->
  <rect x="700" y="130" width="500" height="200" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="720" y="155" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)">NACL Boundary</text>
  <text x="720" y="175" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Subnet</text>

  <!-- Instances inside -->
  <rect x="750" y="190" width="120" height="50" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="810" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Instance A</text>

  <rect x="920" y="190" width="120" height="50" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="980" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Instance B</text>

  <!-- Properties -->
  <rect x="700" y="350" width="500" height="52" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <circle cx="730" cy="376" r="12" fill="url(#grad-danger)"/>
  <text x="728" y="381" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">!</text>
  <text x="755" y="381" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Stateless - return traffic must be explicitly allowed</text>

  <rect x="700" y="415" width="500" height="52" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <circle cx="730" cy="441" r="12" fill="url(#grad-danger)"/>
  <text x="728" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">!</text>
  <text x="755" y="446" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Allow AND Deny rules supported</text>

  <rect x="700" y="480" width="500" height="52" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <circle cx="730" cy="506" r="12" fill="url(#grad-danger)"/>
  <text x="728" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">!</text>
  <text x="755" y="511" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Rules processed in number order (first match wins)</text>

  <!-- Traffic flow arrows (NACL) -->
  <line x1="700" y1="545" x2="870" y2="545" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)">Inbound evaluated</text>
  <line x1="870" y1="590" x2="700" y2="590" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">Outbound separately evaluated</text>
</svg>

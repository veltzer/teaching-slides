<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Left Panel: Security Groups -->
  <rect x="40" y="40" width="580" height="580" rx="6.4" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="580" height="48.333333" rx="6.4" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="69" width="580" height="19.333333" fill="var(--primary-accent)" rx="6.4"/>
  <text x="330" y="70.933333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.663893" font-weight="bold" fill="var(--bg)">Security Groups</text>

  <!-- SG: Instance-level illustration -->
  <text x="80" y="127" font-family="Arial, sans-serif" font-size="14.74784" font-weight="bold" fill="var(--primary-accent)">Instance-Level Firewall</text>

  <!-- Subnet box -->
  <rect x="80" y="146.333333" width="500" height="193.333333" rx="6.4" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="100" y="170.500053" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--text-muted)">Subnet</text>

  <!-- Instance with SG -->
  <rect x="180" y="185" width="140" height="58" rx="6.4" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="218.83328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.781547" font-weight="bold" fill="var(--bg)">EC2 Instance</text>
  <rect x="165" y="170.500053" width="170" height="87" rx="6.4" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="250" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.815147" fill="var(--primary-accent)">Security Group</text>

  <!-- Second instance with SG -->
  <rect x="400" y="185" width="140" height="58" rx="6.4" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="218.83328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.781547" font-weight="bold" fill="var(--bg)">EC2 Instance</text>
  <rect x="385" y="170.500053" width="170" height="87" rx="6.4" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="470" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.815147" fill="var(--primary-accent)">Security Group</text>

  <!-- Properties -->
  <rect x="80" y="359" width="500" height="50.266667" rx="6.4" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <rect x="98.2017" y="372.335" width="23.5966" height="23.5966" rx="11.7983" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="108" y="388.966613" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.764693" font-weight="bold" fill="var(--bg)">✓</text>
  <text x="135" y="388.966613" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Stateful - return traffic automatically allowed</text>

  <rect x="80" y="421.833387" width="500" height="50.266667" rx="6.4" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <rect x="98.2017" y="435.168" width="23.5966" height="23.5966" rx="11.7983" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="108" y="451.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.764693" font-weight="bold" fill="var(--bg)">✓</text>
  <text x="135" y="451.8" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Allow rules only (implicit deny all)</text>

  <rect x="80" y="484.666667" width="500" height="50.266667" rx="6.4" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <rect x="98.2017" y="498.002" width="23.5966" height="23.5966" rx="11.7983" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="108" y="514.633387" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.764693" font-weight="bold" fill="var(--bg)">✓</text>
  <text x="135" y="514.633387" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">All rules evaluated before decision</text>

  <!-- Traffic flow arrows (SG) -->
  <line x1="80" y1="547.499947" x2="250" y2="547.499947" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="571.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--ok-accent)">Inbound allowed</text>
  <line x1="250" y1="591" x2="80" y2="591" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="615.16672" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--ok-accent)">Return auto-allowed</text>

  <!-- Right Panel: NACLs -->
  <rect x="660" y="40" width="580" height="580" rx="6.4" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="40" width="580" height="48.333333" rx="6.4" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="69" width="580" height="19.333333" fill="var(--warn-accent)" rx="6.4"/>
  <text x="950" y="70.933333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.663893" font-weight="bold" fill="var(--bg)">Network ACLs</text>

  <!-- NACL: Subnet-level illustration -->
  <text x="700" y="127" font-family="Arial, sans-serif" font-size="14.74784" font-weight="bold" fill="var(--warn-accent)">Subnet-Level Firewall</text>

  <!-- Subnet with NACL boundary -->
  <rect x="700" y="146.333333" width="500" height="193.333333" rx="6.4" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="720" y="170.500053" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--warn-accent)">NACL Boundary</text>
  <text x="720" y="189.833387" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--text-muted)">Subnet</text>

  <!-- Instances inside -->
  <rect x="750" y="204.333333" width="120" height="48.333333" rx="6.4" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="810" y="233.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.781547" font-weight="bold" fill="var(--bg)">Instance A</text>

  <rect x="920" y="204.333333" width="120" height="48.333333" rx="6.4" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="233.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.781547" font-weight="bold" fill="var(--bg)">Instance B</text>

  <!-- Properties -->
  <rect x="700" y="359" width="500" height="50.266667" rx="6.4" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <rect x="718.202" y="372.335" width="23.5966" height="23.5966" rx="11.7983" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="728" y="388.966613" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.764693" font-weight="bold" fill="var(--bg)">!</text>
  <text x="755" y="388.966613" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Stateless - return traffic must be explicitly allowed</text>

  <rect x="700" y="421.833387" width="500" height="50.266667" rx="6.4" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <rect x="718.202" y="435.168" width="23.5966" height="23.5966" rx="11.7983" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="728" y="451.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.764693" font-weight="bold" fill="var(--bg)">!</text>
  <text x="755" y="451.8" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Allow AND Deny rules supported</text>

  <rect x="700" y="484.666667" width="500" height="50.266667" rx="6.4" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <rect x="718.202" y="498.002" width="23.5966" height="23.5966" rx="11.7983" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="728" y="514.633387" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.764693" font-weight="bold" fill="var(--bg)">!</text>
  <text x="755" y="514.633387" font-family="Arial, sans-serif" font-size="13.764693" fill="var(--text)">Rules processed in number order (first match wins)</text>

  <!-- Traffic flow arrows (NACL) -->
  <line x1="700" y1="547.499947" x2="870" y2="547.499947" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="571.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--warn-accent)">Inbound evaluated</text>
  <line x1="870" y1="591" x2="700" y2="591" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="615.16672" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.798293" fill="var(--danger-accent)">Outbound separately evaluated</text>
</svg>

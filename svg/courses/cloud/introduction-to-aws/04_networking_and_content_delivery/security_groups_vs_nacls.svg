<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)"/>

  <!-- Left Panel: Security Groups -->
  <rect x="77.5" y="58.125" width="543.75" height="543.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="77.5" y="58.125" width="543.75" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="77.5" y="85.3125" width="543.75" height="18.125" fill="var(--primary-accent)" rx="6"/>
  <text x="349.375" y="87.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)">Security Groups</text>

  <!-- SG: Instance-level illustration -->
  <text x="115" y="139.6875" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--primary-accent)">Instance-Level Firewall</text>

  <!-- Subnet box -->
  <rect x="115" y="157.8125" width="468.75" height="181.25" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="133.75" y="180.4688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Subnet</text>

  <!-- Instance with SG -->
  <rect x="208.75" y="194.0625" width="131.25" height="54.375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="274.375" y="225.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">EC2 Instance</text>
  <rect x="194.6875" y="180.4688" width="159.375" height="81.5625" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="274.375" y="275.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)">Security Group</text>

  <!-- Second instance with SG -->
  <rect x="415" y="194.0625" width="131.25" height="54.375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="480.625" y="225.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">EC2 Instance</text>
  <rect x="400.9375" y="180.4688" width="159.375" height="81.5625" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="480.625" y="275.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)">Security Group</text>

  <!-- Properties -->
  <rect x="115" y="357.1875" width="468.75" height="47.125" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <circle cx="143.125" cy="380.75" r="11.0609" fill="url(#grad-ok)"/>
  <text x="141.25" y="385.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">&#x2713;</text>
  <text x="166.5625" y="385.2812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Stateful - return traffic automatically allowed</text>

  <rect x="115" y="416.0938" width="468.75" height="47.125" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <circle cx="143.125" cy="439.6562" r="11.0609" fill="url(#grad-ok)"/>
  <text x="141.25" y="444.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">&#x2713;</text>
  <text x="166.5625" y="444.1875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Allow rules only (implicit deny all)</text>

  <rect x="115" y="475" width="468.75" height="47.125" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <circle cx="143.125" cy="498.5625" r="11.0609" fill="url(#grad-ok)"/>
  <text x="141.25" y="503.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">&#x2713;</text>
  <text x="166.5625" y="503.0938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">All rules evaluated before decision</text>

  <!-- Traffic flow arrows (SG) -->
  <line x1="115" y1="533.9062" x2="274.375" y2="533.9062" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="194.6875" y="556.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Inbound allowed</text>
  <line x1="274.375" y1="574.6875" x2="115" y2="574.6875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="194.6875" y="597.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Return auto-allowed</text>

  <!-- Right Panel: NACLs -->
  <rect x="658.75" y="58.125" width="543.75" height="543.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="658.75" y="58.125" width="543.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="658.75" y="85.3125" width="543.75" height="18.125" fill="var(--warn-accent)" rx="6"/>
  <text x="930.625" y="87.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)">Network ACLs</text>

  <!-- NACL: Subnet-level illustration -->
  <text x="696.25" y="139.6875" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)">Subnet-Level Firewall</text>

  <!-- Subnet with NACL boundary -->
  <rect x="696.25" y="157.8125" width="468.75" height="181.25" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="715" y="180.4688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">NACL Boundary</text>
  <text x="715" y="198.5938" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Subnet</text>

  <!-- Instances inside -->
  <rect x="743.125" y="212.1875" width="112.5" height="45.3125" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="799.375" y="239.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Instance A</text>

  <rect x="902.5" y="212.1875" width="112.5" height="45.3125" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="958.75" y="239.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Instance B</text>

  <!-- Properties -->
  <rect x="696.25" y="357.1875" width="468.75" height="47.125" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <circle cx="724.375" cy="380.75" r="11.0609" fill="url(#grad-danger)"/>
  <text x="722.5" y="385.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">!</text>
  <text x="747.8125" y="385.2812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Stateless - return traffic must be explicitly allowed</text>

  <rect x="696.25" y="416.0938" width="468.75" height="47.125" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <circle cx="724.375" cy="439.6562" r="11.0609" fill="url(#grad-danger)"/>
  <text x="722.5" y="444.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">!</text>
  <text x="747.8125" y="444.1875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Allow AND Deny rules supported</text>

  <rect x="696.25" y="475" width="468.75" height="47.125" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <circle cx="724.375" cy="498.5625" r="11.0609" fill="url(#grad-danger)"/>
  <text x="722.5" y="503.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">!</text>
  <text x="747.8125" y="503.0938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Rules processed in number order (first match wins)</text>

  <!-- Traffic flow arrows (NACL) -->
  <line x1="696.25" y1="533.9062" x2="855.625" y2="533.9062" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="775.9375" y="556.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">Inbound evaluated</text>
  <line x1="855.625" y1="574.6875" x2="696.25" y2="574.6875" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="775.9375" y="597.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">Outbound separately evaluated</text>
</svg>

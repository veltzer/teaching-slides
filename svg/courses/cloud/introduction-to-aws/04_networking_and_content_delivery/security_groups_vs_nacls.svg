<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="8" fill="var(--surface)"/>

  <!-- Left Panel: Security Groups -->
  <rect x="40" y="20" width="580" height="600" rx="12" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="20" width="580" height="50" rx="12" fill="url(#grad-primary)"/>
  <rect x="40" y="50" width="580" height="20" fill="var(--primary-dk)"/>
  <text x="330" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">Security Groups</text>

  <!-- SG: Instance-level illustration -->
  <text x="80" y="110" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-dk)">Instance-Level Firewall</text>

  <!-- Subnet box -->
  <rect x="80" y="130" width="500" height="200" rx="8" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Subnet</text>

  <!-- Instance with SG -->
  <rect x="180" y="170" width="140" height="60" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="250" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">EC2 Instance</text>
  <rect x="165" y="155" width="170" height="90" rx="10" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="250" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-dk)">Security Group</text>

  <!-- Second instance with SG -->
  <rect x="400" y="170" width="140" height="60" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="470" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">EC2 Instance</text>
  <rect x="385" y="155" width="170" height="90" rx="10" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="470" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-dk)">Security Group</text>

  <!-- Properties -->
  <rect x="80" y="350" width="500" height="52" rx="6" fill="var(--bg)" stroke="var(--primary)" stroke-width="1"/>
  <circle cx="110" cy="376" r="12" fill="url(#grad-ok)"/>
  <text x="108" y="381" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">&#x2713;</text>
  <text x="135" y="381" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Stateful - return traffic automatically allowed</text>

  <rect x="80" y="415" width="500" height="52" rx="6" fill="var(--bg)" stroke="var(--primary)" stroke-width="1"/>
  <circle cx="110" cy="441" r="12" fill="url(#grad-ok)"/>
  <text x="108" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">&#x2713;</text>
  <text x="135" y="446" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Allow rules only (implicit deny all)</text>

  <rect x="80" y="480" width="500" height="52" rx="6" fill="var(--bg)" stroke="var(--primary)" stroke-width="1"/>
  <circle cx="110" cy="506" r="12" fill="url(#grad-ok)"/>
  <text x="108" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">&#x2713;</text>
  <text x="135" y="511" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">All rules evaluated before decision</text>

  <!-- Traffic flow arrows (SG) -->
  <line x1="80" y1="545" x2="250" y2="545" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok)">Inbound allowed</text>
  <line x1="250" y1="590" x2="80" y2="590" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok)">Return auto-allowed</text>

  <!-- Right Panel: NACLs -->
  <rect x="660" y="20" width="580" height="600" rx="12" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="20" width="580" height="50" rx="12" fill="url(#grad-warn)"/>
  <rect x="660" y="50" width="580" height="20" fill="var(--warn-dk)"/>
  <text x="950" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">Network ACLs</text>

  <!-- NACL: Subnet-level illustration -->
  <text x="700" y="110" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-dk)">Subnet-Level Firewall</text>

  <!-- Subnet with NACL boundary -->
  <rect x="700" y="130" width="500" height="200" rx="8" fill="var(--bg)" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="720" y="155" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)">NACL Boundary</text>
  <text x="720" y="175" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Subnet</text>

  <!-- Instances inside -->
  <rect x="750" y="190" width="120" height="50" rx="6" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="810" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Instance A</text>

  <rect x="920" y="190" width="120" height="50" rx="6" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="980" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Instance B</text>

  <!-- Properties -->
  <rect x="700" y="350" width="500" height="52" rx="6" fill="var(--bg)" stroke="var(--warn)" stroke-width="1"/>
  <circle cx="730" cy="376" r="12" fill="url(#grad-danger)"/>
  <text x="728" y="381" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">!</text>
  <text x="755" y="381" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Stateless - return traffic must be explicitly allowed</text>

  <rect x="700" y="415" width="500" height="52" rx="6" fill="var(--bg)" stroke="var(--warn)" stroke-width="1"/>
  <circle cx="730" cy="441" r="12" fill="url(#grad-danger)"/>
  <text x="728" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">!</text>
  <text x="755" y="446" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Allow AND Deny rules supported</text>

  <rect x="700" y="480" width="500" height="52" rx="6" fill="var(--bg)" stroke="var(--warn)" stroke-width="1"/>
  <circle cx="730" cy="506" r="12" fill="url(#grad-danger)"/>
  <text x="728" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">!</text>
  <text x="755" y="511" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">Rules processed in number order (first match wins)</text>

  <!-- Traffic flow arrows (NACL) -->
  <line x1="700" y1="545" x2="870" y2="545" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)">Inbound evaluated</text>
  <line x1="870" y1="590" x2="700" y2="590" stroke="var(--danger)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)">Outbound separately evaluated</text>
</svg>

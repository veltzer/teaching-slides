<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="8" fill="var(--surface)"/>

  <!-- Internet Gateway -->
  <rect x="540" y="10" width="200" height="44" rx="8" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="640" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Internet Gateway</text>

  <!-- Arrow from IGW down -->
  <line x1="640" y1="54" x2="640" y2="80" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VPC boundary -->
  <rect x="60" y="80" width="1160" height="540" rx="12" fill="none" stroke="var(--primary-dk)" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">VPC 10.0.0.0/16</text>

  <!-- AZ-1 Column -->
  <rect x="90" y="120" width="540" height="485" rx="8" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="360" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Availability Zone 1</text>

  <!-- AZ-1 Public Subnet -->
  <rect x="110" y="160" width="500" height="190" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="130" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Public Subnet 10.0.1.0/24</text>
  <rect x="140" y="195" width="100" height="36" rx="4" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1"/>
  <text x="190" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">RT: Public</text>

  <!-- ALB in AZ-1 -->
  <rect x="160" y="250" width="120" height="50" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="220" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">ALB</text>

  <!-- NAT GW in AZ-1 -->
  <rect x="360" y="250" width="120" height="50" rx="8" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="420" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">NAT GW</text>

  <!-- AZ-1 Private Subnet -->
  <rect x="110" y="370" width="500" height="220" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.5"/>
  <text x="130" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-dk)">Private Subnet 10.0.2.0/24</text>
  <rect x="140" y="405" width="110" height="36" rx="4" fill="var(--info-pale)" stroke="var(--info-dk)" stroke-width="1"/>
  <text x="195" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-dk)">RT: Private</text>

  <!-- App Server AZ-1 -->
  <rect x="160" y="460" width="120" height="50" rx="8" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="220" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">App Server</text>

  <!-- DB AZ-1 -->
  <rect x="360" y="460" width="120" height="50" rx="8" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="420" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Database</text>

  <!-- Arrow ALB to App -->
  <line x1="220" y1="300" x2="220" y2="460" stroke="var(--primary-dk)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <!-- Arrow NAT GW up to IGW path -->
  <line x1="420" y1="250" x2="420" y2="160" stroke="var(--warn-dk)" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- AZ-2 Column -->
  <rect x="650" y="120" width="540" height="485" rx="8" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="920" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)">Availability Zone 2</text>

  <!-- AZ-2 Public Subnet -->
  <rect x="670" y="160" width="500" height="190" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="690" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Public Subnet 10.0.3.0/24</text>
  <rect x="700" y="195" width="100" height="36" rx="4" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1"/>
  <text x="750" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">RT: Public</text>

  <!-- ALB in AZ-2 -->
  <rect x="720" y="250" width="120" height="50" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="780" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">ALB</text>

  <!-- NAT GW in AZ-2 -->
  <rect x="920" y="250" width="120" height="50" rx="8" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="980" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">NAT GW</text>

  <!-- AZ-2 Private Subnet -->
  <rect x="670" y="370" width="500" height="220" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.5"/>
  <text x="690" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-dk)">Private Subnet 10.0.4.0/24</text>
  <rect x="700" y="405" width="110" height="36" rx="4" fill="var(--info-pale)" stroke="var(--info-dk)" stroke-width="1"/>
  <text x="755" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-dk)">RT: Private</text>

  <!-- App Server AZ-2 -->
  <rect x="720" y="460" width="120" height="50" rx="8" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="780" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">App Server</text>

  <!-- DB AZ-2 -->
  <rect x="920" y="460" width="120" height="50" rx="8" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="980" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Database</text>

  <!-- Arrow ALB to App AZ-2 -->
  <line x1="780" y1="300" x2="780" y2="460" stroke="var(--primary-dk)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <!-- Arrow NAT GW up AZ-2 -->
  <line x1="980" y1="250" x2="980" y2="160" stroke="var(--warn-dk)" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Replication arrow between DBs -->
  <line x1="480" y1="485" x2="720" y2="485" stroke="var(--danger-dk)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="600" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-dk)">Replication</text>
</svg>

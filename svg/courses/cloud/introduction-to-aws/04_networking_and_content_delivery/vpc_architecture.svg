<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)"/>

  <!-- Internet Gateway -->
  <rect x="546.25" y="49.0625" width="187.5" height="39.875" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="74.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)">Internet Gateway</text>

  <!-- Arrow from IGW down -->
  <line x1="640" y1="88.9375" x2="640" y2="112.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VPC boundary -->
  <rect x="96.25" y="112.5" width="1087.5" height="489.375" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="115" y="135.1562" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">VPC 10.0.0.0/16</text>

  <!-- AZ-1 Column -->
  <rect x="124.375" y="148.75" width="506.25" height="439.5312" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="377.5" y="171.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text)">Availability Zone 1</text>

  <!-- AZ-1 Public Subnet -->
  <rect x="143.125" y="185" width="468.75" height="172.1875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="161.875" y="207.6562" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Public Subnet 10.0.1.0/24</text>
  <rect x="171.25" y="216.7188" width="93.75" height="32.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="218.125" y="237.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">RT: Public</text>

  <!-- ALB in AZ-1 -->
  <rect x="190" y="266.5625" width="112.5" height="45.3125" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="246.25" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">ALB</text>

  <!-- NAT GW in AZ-1 -->
  <rect x="377.5" y="266.5625" width="112.5" height="45.3125" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="433.75" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">NAT GW</text>

  <!-- AZ-1 Private Subnet -->
  <rect x="143.125" y="375.3125" width="468.75" height="199.375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="161.875" y="397.9688" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--info-accent)">Private Subnet 10.0.2.0/24</text>
  <rect x="171.25" y="407.0312" width="103.125" height="32.625" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="222.8125" y="427.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">RT: Private</text>

  <!-- App Server AZ-1 -->
  <rect x="190" y="456.875" width="112.5" height="45.3125" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="246.25" y="484.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">App Server</text>

  <!-- DB AZ-1 -->
  <rect x="377.5" y="456.875" width="112.5" height="45.3125" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="433.75" y="484.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Database</text>

  <!-- Arrow ALB to App -->
  <line x1="246.25" y1="311.875" x2="246.25" y2="456.875" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <!-- Arrow NAT GW up to IGW path -->
  <line x1="433.75" y1="266.5625" x2="433.75" y2="185" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- AZ-2 Column -->
  <rect x="649.375" y="148.75" width="506.25" height="439.5312" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="902.5" y="171.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text)">Availability Zone 2</text>

  <!-- AZ-2 Public Subnet -->
  <rect x="668.125" y="185" width="468.75" height="172.1875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="686.875" y="207.6562" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Public Subnet 10.0.3.0/24</text>
  <rect x="696.25" y="216.7188" width="93.75" height="32.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="743.125" y="237.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">RT: Public</text>

  <!-- ALB in AZ-2 -->
  <rect x="715" y="266.5625" width="112.5" height="45.3125" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="771.25" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">ALB</text>

  <!-- NAT GW in AZ-2 -->
  <rect x="902.5" y="266.5625" width="112.5" height="45.3125" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="958.75" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">NAT GW</text>

  <!-- AZ-2 Private Subnet -->
  <rect x="668.125" y="375.3125" width="468.75" height="199.375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="686.875" y="397.9688" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--info-accent)">Private Subnet 10.0.4.0/24</text>
  <rect x="696.25" y="407.0312" width="103.125" height="32.625" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="747.8125" y="427.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">RT: Private</text>

  <!-- App Server AZ-2 -->
  <rect x="715" y="456.875" width="112.5" height="45.3125" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="771.25" y="484.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">App Server</text>

  <!-- DB AZ-2 -->
  <rect x="902.5" y="456.875" width="112.5" height="45.3125" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="958.75" y="484.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Database</text>

  <!-- Arrow ALB to App AZ-2 -->
  <line x1="771.25" y1="311.875" x2="771.25" y2="456.875" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <!-- Arrow NAT GW up AZ-2 -->
  <line x1="958.75" y1="266.5625" x2="958.75" y2="185" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Replication arrow between DBs -->
  <line x1="490" y1="479.5312" x2="715" y2="479.5312" stroke="var(--danger-border)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="602.5" y="473.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--danger-accent)">Replication</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <!-- Internet Gateway -->
  <rect x="536.551724" y="40" width="206.896552" height="41.836066" rx="6.455833" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="66.622951" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.868331" font-weight="bold" fill="var(--bg)">Internet Gateway</text>

  <!-- Arrow from IGW down -->
  <line x1="640" y1="81.836066" x2="640" y2="106.557377" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VPC boundary -->
  <rect x="40" y="106.557377" width="1200" height="513.442623" rx="6.455833" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="60.689655" y="130.327816" font-family="Arial, sans-serif" font-size="13.884776" font-weight="bold" fill="var(--primary-accent)">VPC 10.0.0.0/16</text>

  <!-- AZ-1 Column -->
  <rect x="71.034483" y="144.590164" width="558.62069" height="461.147489" rx="6.455833" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="350.344828" y="168.360603" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8765" font-weight="bold" fill="var(--text)">Availability Zone 1</text>

  <!-- AZ-1 Public Subnet -->
  <rect x="91.724138" y="182.622951" width="517.241379" height="180.655738" rx="6.455833" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="112.413793" y="206.39339" font-family="Arial, sans-serif" font-size="12.893052" font-weight="bold" fill="var(--primary-accent)">Public Subnet 10.0.1.0/24</text>
  <rect x="122.758621" y="215.901692" width="103.448276" height="34.229508" rx="6.455833" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="174.482759" y="237.770492" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--primary-accent)">RT: Public</text>

  <!-- ALB in AZ-1 -->
  <rect x="143.448276" y="268.196721" width="124.137931" height="47.540984" rx="6.455833" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="205.517241" y="296.721311" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.893052" font-weight="bold" fill="var(--bg)">ALB</text>

  <!-- NAT GW in AZ-1 -->
  <rect x="350.344828" y="268.196721" width="124.137931" height="47.540984" rx="6.455833" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="412.413793" y="296.721311" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.893052" font-weight="bold" fill="var(--bg)">NAT GW</text>

  <!-- AZ-1 Private Subnet -->
  <rect x="91.724138" y="382.295082" width="517.241379" height="209.180328" rx="6.455833" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="112.413793" y="406.065626" font-family="Arial, sans-serif" font-size="12.893052" font-weight="bold" fill="var(--info-accent)">Private Subnet 10.0.2.0/24</text>
  <rect x="122.758621" y="415.573718" width="113.793103" height="34.229508" rx="6.455833" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="179.655172" y="437.442623" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--info-accent)">RT: Private</text>

  <!-- App Server AZ-1 -->
  <rect x="143.448276" y="467.868852" width="124.137931" height="47.540984" rx="6.455833" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="205.517241" y="496.393443" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.893052" font-weight="bold" fill="var(--bg)">App Server</text>

  <!-- DB AZ-1 -->
  <rect x="350.344828" y="467.868852" width="124.137931" height="47.540984" rx="6.455833" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="412.413793" y="496.393443" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.893052" font-weight="bold" fill="var(--bg)">Database</text>

  <!-- Arrow ALB to App -->
  <line x1="205.517241" y1="315.737705" x2="205.517241" y2="467.868852" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <!-- Arrow NAT GW up to IGW path -->
  <line x1="412.413793" y1="268.196721" x2="412.413793" y2="182.622951" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- AZ-2 Column -->
  <rect x="650.344828" y="144.590164" width="558.62069" height="461.147489" rx="6.455833" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="929.655172" y="168.360603" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8765" font-weight="bold" fill="var(--text)">Availability Zone 2</text>

  <!-- AZ-2 Public Subnet -->
  <rect x="671.034483" y="182.622951" width="517.241379" height="180.655738" rx="6.455833" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="691.724138" y="206.39339" font-family="Arial, sans-serif" font-size="12.893052" font-weight="bold" fill="var(--primary-accent)">Public Subnet 10.0.3.0/24</text>
  <rect x="702.068966" y="215.901692" width="103.448276" height="34.229508" rx="6.455833" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="753.793103" y="237.770492" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--primary-accent)">RT: Public</text>

  <!-- ALB in AZ-2 -->
  <rect x="722.758621" y="268.196721" width="124.137931" height="47.540984" rx="6.455833" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="784.827586" y="296.721311" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.893052" font-weight="bold" fill="var(--bg)">ALB</text>

  <!-- NAT GW in AZ-2 -->
  <rect x="929.655172" y="268.196721" width="124.137931" height="47.540984" rx="6.455833" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="991.724138" y="296.721311" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.893052" font-weight="bold" fill="var(--bg)">NAT GW</text>

  <!-- AZ-2 Private Subnet -->
  <rect x="671.034483" y="382.295082" width="517.241379" height="209.180328" rx="6.455833" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="691.724138" y="406.065626" font-family="Arial, sans-serif" font-size="12.893052" font-weight="bold" fill="var(--info-accent)">Private Subnet 10.0.4.0/24</text>
  <rect x="702.068966" y="415.573718" width="113.793103" height="34.229508" rx="6.455833" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="758.965517" y="437.442623" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--info-accent)">RT: Private</text>

  <!-- App Server AZ-2 -->
  <rect x="722.758621" y="467.868852" width="124.137931" height="47.540984" rx="6.455833" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="784.827586" y="496.393443" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.893052" font-weight="bold" fill="var(--bg)">App Server</text>

  <!-- DB AZ-2 -->
  <rect x="929.655172" y="467.868852" width="124.137931" height="47.540984" rx="6.455833" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="991.724138" y="496.393443" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.893052" font-weight="bold" fill="var(--bg)">Database</text>

  <!-- Arrow ALB to App AZ-2 -->
  <line x1="784.827586" y1="315.737705" x2="784.827586" y2="467.868852" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <!-- Arrow NAT GW up AZ-2 -->
  <line x1="991.724138" y1="268.196721" x2="991.724138" y2="182.622951" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Replication arrow between DBs -->
  <line x1="474.482759" y1="491.639292" x2="722.758621" y2="491.639292" stroke="var(--danger-border)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="598.62069" y="484.983607" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.909498" fill="var(--danger-accent)">Replication</text>
</svg>

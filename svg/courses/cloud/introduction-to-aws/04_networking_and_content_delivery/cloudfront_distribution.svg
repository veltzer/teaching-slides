<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" rx="6" fill="var(--surface)"/>

  <!-- Origins (right side) -->
  <rect x="1020" y="100" width="200" height="80" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1120" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">S3 Bucket</text>
  <text x="1120" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">Static Assets</text>

  <rect x="1020" y="220" width="200" height="80" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1120" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)">ALB / EC2</text>
  <text x="1120" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)">Dynamic Content</text>

  <text x="1120" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Origins</text>

  <!-- CloudFront Edge Locations (middle) -->
  <rect x="440" y="50" width="360" height="540" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="620" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">CloudFront Edge Locations</text>

  <!-- Edge location dots -->
  <circle cx="520" cy="140" r="22" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="520" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)">US-E</text>

  <circle cx="680" cy="140" r="22" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="680" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)">US-W</text>

  <circle cx="520" cy="230" r="22" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="520" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)">EU</text>

  <circle cx="680" cy="230" r="22" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="680" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)">APAC</text>

  <circle cx="600" cy="320" r="22" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="600" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)">SA</text>

  <!-- Cache Hit path (green, short) -->
  <rect x="470" y="380" width="300" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="620" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Cache HIT</text>
  <text x="620" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Response from edge (low latency)</text>

  <!-- Cache Miss path (orange, long) -->
  <rect x="470" y="480" width="300" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="620" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-accent)">Cache MISS</text>
  <text x="620" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Fetch from origin, cache, respond</text>

  <!-- Cache miss arrow to origin -->
  <line x1="770" y1="520" x2="1020" y2="260" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow-warn)"/>
  <text x="920" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)">Fetch from origin</text>

  <!-- Origin to edge arrow (cache fill) -->
  <line x1="1020" y1="180" x2="720" y2="180" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-primary)"/>
  <text x="870" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">Content delivery</text>

  <!-- End Users (left side) -->
  <text x="170" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">End Users</text>

  <!-- User icons as simple shapes -->
  <circle cx="120" cy="160" r="20" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="120" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--bg)">&#x263A;</text>
  <text x="120" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Americas</text>

  <circle cx="240" cy="160" r="20" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="240" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--bg)">&#x263A;</text>
  <text x="240" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Europe</text>

  <circle cx="120" cy="280" r="20" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="120" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--bg)">&#x263A;</text>
  <text x="120" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Asia</text>

  <circle cx="240" cy="280" r="20" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="240" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--bg)">&#x263A;</text>
  <text x="240" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Global</text>

  <!-- User to edge arrows -->
  <line x1="260" y1="160" x2="440" y2="160" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="260" y1="280" x2="440" y2="280" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="140" y1="160" x2="440" y2="200" stroke="var(--ok-border)" stroke-width="1.5" marker-end="url(#arrow-ok)"/>
  <line x1="140" y1="280" x2="440" y2="300" stroke="var(--ok-border)" stroke-width="1.5" marker-end="url(#arrow-ok)"/>

  <!-- Cache hit arrow back to users -->
  <line x1="470" y1="420" x2="280" y2="420" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="375" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Fast response</text>

  <!-- Legend -->
  <rect x="60" y="480" width="300" height="130" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="80" y="505" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Legend</text>
  <line x1="80" y1="525" x2="130" y2="525" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="140" y="530" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Cache Hit (fast, local edge)</text>
  <line x1="80" y1="555" x2="130" y2="555" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="140" y="560" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Cache Miss (fetch from origin)</text>
  <line x1="80" y1="585" x2="130" y2="585" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="140" y="590" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Content delivery to edge</text>
</svg>

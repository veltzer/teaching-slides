<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Background -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)"/>

  <!-- Origins (right side) -->
  <rect x="996.25" y="130.625" width="187.5" height="72.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1090" y="162.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">S3 Bucket</text>
  <text x="1090" y="180.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">Static Assets</text>

  <rect x="996.25" y="239.375" width="187.5" height="72.5" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1090" y="271.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)">ALB / EC2</text>
  <text x="1090" y="289.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">Dynamic Content</text>

  <text x="1090" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)">Origins</text>

  <!-- CloudFront Edge Locations (middle) -->
  <rect x="452.5" y="85.3125" width="337.5" height="489.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="621.25" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)">CloudFront Edge Locations</text>

  <!-- Edge location dots -->
  <circle cx="527.5" cy="166.875" r="20.2783" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="527.5" y="171.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--bg)">US-E</text>

  <circle cx="677.5" cy="166.875" r="20.2783" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="677.5" y="171.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--bg)">US-W</text>

  <circle cx="527.5" cy="248.4375" r="20.2783" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="527.5" y="252.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--bg)">EU</text>

  <circle cx="677.5" cy="248.4375" r="20.2783" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="677.5" y="252.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--bg)">APAC</text>

  <circle cx="602.5" cy="330" r="20.2783" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="602.5" y="334.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--bg)">SA</text>

  <!-- Cache Hit path (green, short) -->
  <rect x="480.625" y="384.375" width="281.25" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="621.25" y="411.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--ok-accent)">Cache HIT</text>
  <text x="621.25" y="434.2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Response from edge (low latency)</text>

  <!-- Cache Miss path (orange, long) -->
  <rect x="480.625" y="475" width="281.25" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="621.25" y="502.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)">Cache MISS</text>
  <text x="621.25" y="524.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Fetch from origin, cache, respond</text>

  <!-- Cache miss arrow to origin -->
  <line x1="761.875" y1="511.25" x2="996.25" y2="275.625" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow-warn)"/>
  <text x="902.5" y="375.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">Fetch from origin</text>

  <!-- Origin to edge arrow (cache fill) -->
  <line x1="996.25" y1="203.125" x2="715" y2="203.125" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-primary)"/>
  <text x="855.625" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">Content delivery</text>

  <!-- End Users (left side) -->
  <text x="199.375" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)">End Users</text>

  <!-- User icons as simple shapes -->
  <circle cx="152.5" cy="185" r="18.4349" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="152.5" y="189.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--bg)">&#x263A;</text>
  <text x="152.5" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Americas</text>

  <circle cx="265" cy="185" r="18.4349" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="265" y="189.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--bg)">&#x263A;</text>
  <text x="265" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Europe</text>

  <circle cx="152.5" cy="293.75" r="18.4349" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="152.5" y="298.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--bg)">&#x263A;</text>
  <text x="152.5" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Asia</text>

  <circle cx="265" cy="293.75" r="18.4349" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="265" y="298.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--bg)">&#x263A;</text>
  <text x="265" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Global</text>

  <!-- User to edge arrows -->
  <line x1="283.75" y1="185" x2="452.5" y2="185" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="283.75" y1="293.75" x2="452.5" y2="293.75" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="171.25" y1="185" x2="452.5" y2="221.25" stroke="var(--ok-border)" stroke-width="1.5" marker-end="url(#arrow-ok)"/>
  <line x1="171.25" y1="293.75" x2="452.5" y2="311.875" stroke="var(--ok-border)" stroke-width="1.5" marker-end="url(#arrow-ok)"/>

  <!-- Cache hit arrow back to users -->
  <line x1="480.625" y1="420.625" x2="302.5" y2="420.625" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="391.5625" y="443.2812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Fast response</text>

  <!-- Legend -->
  <rect x="96.25" y="475" width="281.25" height="117.8125" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="115" y="497.6562" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Legend</text>
  <line x1="115" y1="515.7812" x2="161.875" y2="515.7812" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="171.25" y="520.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Cache Hit (fast, local edge)</text>
  <line x1="115" y1="542.9688" x2="161.875" y2="542.9688" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="171.25" y="547.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Cache Miss (fetch from origin)</text>
  <line x1="115" y1="570.1562" x2="161.875" y2="570.1562" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="171.25" y="574.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Content delivery to edge</text>
</svg>

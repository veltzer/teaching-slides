<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Origins (right side) -->
  <rect x="1033.103448" y="91.785714" width="206.896552" height="82.857143" rx="6.737879" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.551724" y="128.035771" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491381" font-weight="bold" fill="var(--bg)">S3 Bucket</text>
  <text x="1136.551724" y="148.750057" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--primary-accent)">Static Assets</text>

  <rect x="1033.103448" y="216.071429" width="206.896552" height="82.857143" rx="6.737879" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.551724" y="252.321486" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491381" font-weight="bold" fill="var(--bg)">ALB / EC2</text>
  <text x="1136.551724" y="273.035771" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--info-accent)">Dynamic Content</text>

  <text x="1136.551724" y="71.071429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631808" font-weight="bold" fill="var(--text)">Origins</text>

  <!-- CloudFront Edge Locations (middle) -->
  <rect x="433.103448" y="40" width="372.413793" height="559.285714" rx="6.737879" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.310345" y="71.071429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561595" font-weight="bold" fill="var(--primary-accent)">CloudFront Edge Locations</text>

  <!-- Edge location dots -->
  <rect x="493.09" y="110.442" width="45.5442" height="45.5442" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="515.862069" y="138.3928" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" font-weight="bold" fill="var(--bg)">US-E</text>

  <rect x="658.607" y="110.442" width="45.5442" height="45.5442" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="681.37931" y="138.3928" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" font-weight="bold" fill="var(--bg)">US-W</text>

  <rect x="493.09" y="203.656" width="45.5442" height="45.5442" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="515.862069" y="231.6072" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" font-weight="bold" fill="var(--bg)">EU</text>

  <rect x="658.607" y="203.656" width="45.5442" height="45.5442" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="681.37931" y="231.6072" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" font-weight="bold" fill="var(--bg)">APAC</text>

  <rect x="575.849" y="296.871" width="45.5442" height="45.5442" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="598.62069" y="324.821371" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386117" font-weight="bold" fill="var(--bg)">SA</text>

  <!-- Cache Hit path (green, short) -->
  <rect x="464.137931" y="381.785714" width="310.344828" height="82.857143" rx="6.737879" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.310345" y="412.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.526432" font-weight="bold" fill="var(--ok-accent)">Cache HIT</text>
  <text x="619.310345" y="438.750057" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456331" fill="var(--text)">Response from edge (low latency)</text>

  <!-- Cache Miss path (orange, long) -->
  <rect x="464.137931" y="485.357143" width="310.344828" height="82.857143" rx="6.737879" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.310345" y="516.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.526432" font-weight="bold" fill="var(--warn-accent)">Cache MISS</text>
  <text x="619.310345" y="542.321486" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456331" fill="var(--text)">Fetch from origin, cache, respond</text>

  <!-- Cache miss arrow to origin -->
  <line x1="774.482759" y1="526.785714" x2="1033.103448" y2="257.5" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow-warn)"/>
  <text x="929.655172" y="371.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--warn-accent)">Fetch from origin</text>

  <!-- Origin to edge arrow (cache fill) -->
  <line x1="1033.103448" y1="174.642857" x2="722.758621" y2="174.642857" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-primary)"/>
  <text x="877.931034" y="164.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--primary-accent)">Content delivery</text>

  <!-- End Users (left side) -->
  <text x="153.793103" y="71.071429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631808" font-weight="bold" fill="var(--text)">End Users</text>

  <!-- User icons as simple shapes -->
  <rect x="81.3669" y="133.227" width="41.404" height="41.404" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="102.068966" y="159.107086" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561595" fill="var(--bg)">☺</text>
  <text x="102.068966" y="195.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--text)">Americas</text>

  <rect x="205.505" y="133.227" width="41.404" height="41.404" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="226.206897" y="159.107086" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561595" fill="var(--bg)">☺</text>
  <text x="226.206897" y="195.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--text)">Europe</text>

  <rect x="81.3669" y="257.512" width="41.404" height="41.404" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="102.068966" y="283.3928" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561595" fill="var(--bg)">☺</text>
  <text x="102.068966" y="319.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--text)">Asia</text>

  <rect x="205.505" y="257.512" width="41.404" height="41.404" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="226.206897" y="283.3928" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561595" fill="var(--bg)">☺</text>
  <text x="226.206897" y="319.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--text)">Global</text>

  <!-- User to edge arrows -->
  <line x1="246.896552" y1="153.928571" x2="433.103448" y2="153.928571" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="246.896552" y1="278.214286" x2="433.103448" y2="278.214286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="122.758621" y1="153.928571" x2="433.103448" y2="195.357143" stroke="var(--ok-border)" stroke-width="1.5" marker-end="url(#arrow-ok)"/>
  <line x1="122.758621" y1="278.214286" x2="433.103448" y2="298.928571" stroke="var(--ok-border)" stroke-width="1.5" marker-end="url(#arrow-ok)"/>

  <!-- Cache hit arrow back to users -->
  <line x1="464.137931" y1="423.214286" x2="267.586207" y2="423.214286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="365.862069" y="449.107086" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456331" font-weight="bold" fill="var(--ok-accent)">Fast response</text>

  <!-- Legend -->
  <rect x="40" y="485.357143" width="310.344828" height="134.642857" rx="6.737879" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="60.689655" y="511.249943" font-family="Arial, sans-serif" font-size="13.456331" font-weight="bold" fill="var(--text)">Legend</text>
  <line x1="60.689655" y1="531.964229" x2="112.413793" y2="531.964229" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="122.758621" y="537.142857" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--text)">Cache Hit (fast, local edge)</text>
  <line x1="60.689655" y1="563.035771" x2="112.413793" y2="563.035771" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="122.758621" y="568.214286" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--text)">Cache Miss (fetch from origin)</text>
  <line x1="60.689655" y1="594.107086" x2="112.413793" y2="594.107086" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="122.758621" y="599.285714" font-family="Arial, sans-serif" font-size="12.421168" fill="var(--text)">Content delivery to edge</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold" fill="var(--text)">Azure SQL Deployment Options</text>
  <rect x="20.5005" y="103.7838" width="369.009" height="276.7568" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="205.005" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">SQL Database</text>
  <text x="205.005" y="228.3243" text-anchor="middle" font-size="20.5005">Fully managed</text>
  <text x="205.005" y="276.7568" text-anchor="middle" font-size="20.5005">Serverless option</text>
  <text x="205.005" y="325.1892" text-anchor="middle" font-size="20.5005">Elastic pools</text>
  <text x="205.005" y="366.7027" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Best for: New apps</text>
  <rect x="430.5105" y="103.7838" width="369.009" height="276.7568" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">Managed Instance</text>
  <text x="615.015" y="228.3243" text-anchor="middle" font-size="20.5005">Near 100% SQL compat</text>
  <text x="615.015" y="276.7568" text-anchor="middle" font-size="20.5005">VNet integration</text>
  <text x="615.015" y="325.1892" text-anchor="middle" font-size="20.5005">Cross-DB queries</text>
  <text x="615.015" y="366.7027" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Best for: Migration</text>
  <rect x="840.5206" y="103.7838" width="369.009" height="276.7568" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1025.0251" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">SQL on VM</text>
  <text x="1025.0251" y="228.3243" text-anchor="middle" font-size="20.5005">Full SQL Server</text>
  <text x="1025.0251" y="276.7568" text-anchor="middle" font-size="20.5005">OS-level access</text>
  <text x="1025.0251" y="325.1892" text-anchor="middle" font-size="20.5005">Custom config</text>
  <text x="1025.0251" y="366.7027" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Best for: Legacy apps</text>
  <rect x="123.003" y="449.7297" width="984.024" height="190.2703" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="512" text-anchor="middle" font-size="20.5005" font-weight="bold">Purchasing Models</text>
  <text x="410.01" y="570.8108" text-anchor="middle" font-size="20.5005">vCore: Flexible compute/storage</text>
  <text x="881.5215" y="570.8108" text-anchor="middle" font-size="20.5005">DTU: Bundled resources</text>
  <text x="615.015" y="622.7027" text-anchor="middle" font-size="20.5005">Serverless: Auto-pause, pay per second</text>
</svg>
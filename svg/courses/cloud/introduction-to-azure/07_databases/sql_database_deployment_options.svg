<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="372.4138" height="299.354908220598" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="226.2069" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">SQL Database</text>
  <text x="226.2069" y="174.709622505728" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">Fully managed</text>
  <text x="226.2069" y="227.096871508837" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">Serverless option</text>
  <text x="226.2069" y="279.483905028093" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">Elastic pools</text>
  <text x="226.2069" y="324.387076616027" text-anchor="middle" font-size="21.41919549816" fill="var(--text-muted)" font-family="Arial, sans-serif">Best for: New apps</text>
  <rect x="453.7931" y="40" width="372.4138" height="299.354908220598" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="639.9999" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Managed Instance</text>
  <text x="639.9999" y="174.709622505728" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--info-text)">Near 100% SQL compat</text>
  <text x="639.9999" y="227.096871508837" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--info-text)">VNet integration</text>
  <text x="639.9999" y="279.483905028093" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--info-text)">Cross-DB queries</text>
  <text x="639.9999" y="324.387076616027" text-anchor="middle" font-size="21.41919549816" fill="var(--text-muted)" font-family="Arial, sans-serif">Best for: Migration</text>
  <rect x="867.5862" y="40" width="372.4138" height="299.354908220598" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="1053.7931" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">SQL on VM</text>
  <text x="1053.7931" y="174.709622505728" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">Full SQL Server</text>
  <text x="1053.7931" y="227.096871508837" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">OS-level access</text>
  <text x="1053.7931" y="279.483905028093" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">Custom config</text>
  <text x="1053.7931" y="324.387076616027" text-anchor="middle" font-size="21.41919549816" fill="var(--text-muted)" font-family="Arial, sans-serif">Best for: Legacy apps</text>
  <rect x="143.4483" y="414.193527533821" width="993.1034" height="205.806472466179" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="639.9999" y="481.548392657648" text-anchor="middle" font-size="21.41919549816" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Purchasing Models</text>
  <text x="433.1034" y="545.161272944851" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">vCore: Flexible compute/storage</text>
  <text x="908.9654" y="545.161272944851" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">DTU: Bundled resources</text>
  <text x="639.9999" y="601.290291300731" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">Serverless: Auto-pause, pay per second</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="247.6923" y="40" width="346.1539" height="146.835462105433" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.223678888399" filter="url(#shadow)"/>
  <text x="420.7692" y="131.772029322219" text-anchor="middle" font-size="24.645975854022" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Primary Region</text>
  <rect x="709.2308" y="40" width="346.1539" height="146.835462105433" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.223678888399" filter="url(#shadow)"/>
  <text x="882.3078" y="131.772029322219" text-anchor="middle" font-size="24.645975854022" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Secondary Region</text>
  <line x1="593.8462" y1="113.417731052716" x2="709.2308" y2="113.417731052716" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="651.5386" y="95.063325188273" text-anchor="middle" font-size="22.405347726217" font-family="Arial, sans-serif" fill="var(--text)">Geo-repl</text>
  <rect x="132.3079" y="241.898679698764" width="230.7692" height="128.480948646047" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.223678888399" filter="url(#shadow)"/>
  <text x="247.6923" y="322.658151578269" text-anchor="middle" font-size="22.405347726217" font-family="Arial, sans-serif" fill="var(--info-text)">Read/Write</text>
  <rect x="409.2308" y="241.898679698764" width="230.7692" height="128.480948646047" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.223678888399" filter="url(#shadow)"/>
  <text x="524.6154" y="322.658151578269" text-anchor="middle" font-size="22.405347726217" font-family="Arial, sans-serif" fill="var(--info-text)">Zone Replica</text>
  <rect x="709.2308" y="241.898679698764" width="230.7692" height="128.480948646047" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.223678888399" filter="url(#shadow)"/>
  <text x="824.6155" y="322.658151578269" text-anchor="middle" font-size="22.405347726217" font-family="Arial, sans-serif" fill="var(--warn-text)">Read Replica</text>
  <rect x="986.1539" y="241.898679698764" width="230.7692" height="128.480948646047" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.223678888399" filter="url(#shadow)"/>
  <text x="1101.5386" y="322.658151578269" text-anchor="middle" font-size="22.405347726217" font-family="Arial, sans-serif" fill="var(--warn-text)">Zone Replica</text>
  <line x1="363.077" y1="307.974669924691" x2="409.2308" y2="307.974669924691" stroke="var(--text)" stroke-width="2" stroke-dasharray="8.0693 8.0693"/>
  <line x1="940.0001" y1="307.974669924691" x2="986.1539" y2="307.974669924691" stroke="var(--text)" stroke-width="2" stroke-dasharray="8.0693 8.0693"/>
  <rect x="40" y="443.797359397528" width="576.923" height="176.202640602472" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.223678888399" filter="url(#shadow)"/>
  <text x="328.4616" y="509.873349623455" text-anchor="middle" font-size="22.405347726217" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Auto-failover Group</text>
  <text x="328.4616" y="572.278523233458" text-anchor="middle" font-size="22.405347726217" font-family="Arial, sans-serif" fill="var(--danger-text)">Automatic failover if primary down</text>
  <rect x="663.077" y="443.797359397528" width="576.923" height="176.202640602472" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.223678888399" filter="url(#shadow)"/>
  <text x="951.5385" y="509.873349623455" text-anchor="middle" font-size="22.405347726217" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">SLA Guarantees</text>
  <text x="951.5385" y="572.278523233458" text-anchor="middle" font-size="22.405347726217" font-family="Arial, sans-serif" fill="var(--primary-text)">99.995% with zone redundancy</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

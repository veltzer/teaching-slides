<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="24.6154" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cosmos DB - Multiple API Support</text>
  <rect x="391.7242" y="74.3195" width="496.5518" height="120.1184" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="149.8225" text-anchor="middle" font-size="22.5641" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Cosmos DB Engine</text>
  <line x1="433.1035" y1="194.4379" x2="174.4828" y2="252.7811" stroke="var(--text)" stroke-width="2" />
  <line x1="557.2415" y1="194.4379" x2="453.7931" y2="252.7811" stroke="var(--text)" stroke-width="2" />
  <line x1="640.0001" y1="194.4379" x2="722.7587" y2="252.7811" stroke="var(--text)" stroke-width="2" />
  <line x1="722.7587" y1="194.4379" x2="981.3793" y2="252.7811" stroke="var(--text)" stroke-width="2" />
  <rect x="40" y="252.7811" width="268.9655" height="154.4379" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="174.4828" y="314.5562" text-anchor="middle" font-size="20.5128" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">NoSQL API</text>
  <text x="174.4828" y="372.8994" text-anchor="middle" font-size="20.5128" font-family="Arial, sans-serif" fill="var(--primary-text)">JSON documents</text>
  <rect x="340.0001" y="252.7811" width="227.5862" height="154.4379" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="453.7931" y="314.5562" text-anchor="middle" font-size="20.5128" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">MongoDB</text>
  <text x="453.7931" y="372.8994" text-anchor="middle" font-size="20.5128" font-family="Arial, sans-serif" fill="var(--ok-text)">Wire protocol</text>
  <rect x="598.6207" y="252.7811" width="248.2758" height="154.4379" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="722.7587" y="314.5562" text-anchor="middle" font-size="20.5128" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Cassandra</text>
  <text x="722.7587" y="372.8994" text-anchor="middle" font-size="20.5128" font-family="Arial, sans-serif" fill="var(--warn-text)">Wide column</text>
  <rect x="877.9311" y="252.7811" width="206.8965" height="154.4379" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="981.3793" y="314.5562" text-anchor="middle" font-size="20.5128" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Gremlin</text>
  <text x="981.3793" y="372.8994" text-anchor="middle" font-size="20.5128" font-family="Arial, sans-serif" fill="var(--danger-text)">Graph DB</text>
  <rect x="1095.1724" y="252.7811" width="144.8276" height="154.4379" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1167.5863" y="314.5562" text-anchor="middle" font-size="20.5128" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Table</text>
  <text x="1167.5863" y="372.8994" text-anchor="middle" font-size="20.5128" font-family="Arial, sans-serif" fill="var(--primary-text)">Key-value</text>
  <rect x="143.4484" y="475.858" width="993.1035" height="144.142" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="534.2012" text-anchor="middle" font-size="20.5128" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Global Distribution: Multi-region writes with single-digit ms latency</text>
  <text x="640.0001" y="589.1125" text-anchor="middle" font-size="20.5128" font-family="Arial, sans-serif" fill="var(--ok-text)">5 consistency levels: Strong | Bounded | Session | Prefix | Eventual</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="608.4373" y="61.6043" text-anchor="middle" font-size="24.3375" font-weight="bold" fill="var(--text)">Cosmos DB - Multiple API Support</text>
  <rect x="365.0624" y="95.8289" width="486.7499" height="119.7861" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="608.4373" y="171.123" text-anchor="middle" font-size="22.3094" font-weight="bold">Cosmos DB Engine</text>
  <line x1="405.6249" y1="215.615" x2="152.1093" y2="273.7968" stroke="var(--text)" stroke-width="2" />
  <line x1="527.3124" y1="215.615" x2="425.9061" y2="273.7968" stroke="var(--text)" stroke-width="2" />
  <line x1="608.4373" y1="215.615" x2="689.5623" y2="273.7968" stroke="var(--text)" stroke-width="2" />
  <line x1="689.5623" y1="215.615" x2="943.0778" y2="273.7968" stroke="var(--text)" stroke-width="2" />
  <rect x="20.2812" y="273.7968" width="263.6561" height="154.0107" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="152.1093" y="335.4011" text-anchor="middle" font-size="20.2812" font-weight="bold">NoSQL API</text>
  <text x="152.1093" y="393.5829" text-anchor="middle" font-size="20.2812">JSON documents</text>
  <rect x="314.3593" y="273.7968" width="223.0937" height="154.0107" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="425.9061" y="335.4011" text-anchor="middle" font-size="20.2812" font-weight="bold">MongoDB</text>
  <text x="425.9061" y="393.5829" text-anchor="middle" font-size="20.2812">Wire protocol</text>
  <rect x="567.8748" y="273.7968" width="243.3749" height="154.0107" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="689.5623" y="335.4011" text-anchor="middle" font-size="20.2812" font-weight="bold">Cassandra</text>
  <text x="689.5623" y="393.5829" text-anchor="middle" font-size="20.2812">Wide column</text>
  <rect x="841.6716" y="273.7968" width="202.8124" height="154.0107" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="943.0778" y="335.4011" text-anchor="middle" font-size="20.2812" font-weight="bold">Gremlin</text>
  <text x="943.0778" y="393.5829" text-anchor="middle" font-size="20.2812">Graph DB</text>
  <rect x="1054.6246" y="273.7968" width="141.9687" height="154.0107" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1125.609" y="335.4011" text-anchor="middle" font-size="20.2812" font-weight="bold">Table</text>
  <text x="1125.609" y="393.5829" text-anchor="middle" font-size="20.2812">Key-value</text>
  <rect x="121.6875" y="496.2567" width="973.4997" height="143.7433" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="608.4373" y="554.4385" text-anchor="middle" font-size="20.2812" font-weight="bold">Global Distribution: Multi-region writes with single-digit ms latency</text>
  <text x="608.4373" y="609.1979" text-anchor="middle" font-size="20.2812">5 consistency levels: Strong | Bounded | Session | Prefix | Eventual</text>
</svg>
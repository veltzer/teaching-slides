<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="24.6154" font-weight="bold" fill="var(--text)">Cosmos DB - Multiple API Support</text>
  <rect x="391.7242" y="74.3195" width="496.5518" height="120.1184" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="149.8225" text-anchor="middle" font-size="22.5641" font-weight="bold">Cosmos DB Engine</text>
  <line x1="433.1035" y1="194.4379" x2="174.4828" y2="252.7811" stroke="var(--text)" stroke-width="2" />
  <line x1="557.2415" y1="194.4379" x2="453.7931" y2="252.7811" stroke="var(--text)" stroke-width="2" />
  <line x1="640.0001" y1="194.4379" x2="722.7587" y2="252.7811" stroke="var(--text)" stroke-width="2" />
  <line x1="722.7587" y1="194.4379" x2="981.3793" y2="252.7811" stroke="var(--text)" stroke-width="2" />
  <rect x="40" y="252.7811" width="268.9655" height="154.4379" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="174.4828" y="314.5562" text-anchor="middle" font-size="20.5128" font-weight="bold">NoSQL API</text>
  <text x="174.4828" y="372.8994" text-anchor="middle" font-size="20.5128">JSON documents</text>
  <rect x="340.0001" y="252.7811" width="227.5862" height="154.4379" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="453.7931" y="314.5562" text-anchor="middle" font-size="20.5128" font-weight="bold">MongoDB</text>
  <text x="453.7931" y="372.8994" text-anchor="middle" font-size="20.5128">Wire protocol</text>
  <rect x="598.6207" y="252.7811" width="248.2758" height="154.4379" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="722.7587" y="314.5562" text-anchor="middle" font-size="20.5128" font-weight="bold">Cassandra</text>
  <text x="722.7587" y="372.8994" text-anchor="middle" font-size="20.5128">Wide column</text>
  <rect x="877.9311" y="252.7811" width="206.8965" height="154.4379" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="981.3793" y="314.5562" text-anchor="middle" font-size="20.5128" font-weight="bold">Gremlin</text>
  <text x="981.3793" y="372.8994" text-anchor="middle" font-size="20.5128">Graph DB</text>
  <rect x="1095.1724" y="252.7811" width="144.8276" height="154.4379" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1167.5863" y="314.5562" text-anchor="middle" font-size="20.5128" font-weight="bold">Table</text>
  <text x="1167.5863" y="372.8994" text-anchor="middle" font-size="20.5128">Key-value</text>
  <rect x="143.4484" y="475.858" width="993.1035" height="144.142" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="534.2012" text-anchor="middle" font-size="20.5128" font-weight="bold">Global Distribution: Multi-region writes with single-digit ms latency</text>
  <text x="640.0001" y="589.1125" text-anchor="middle" font-size="20.5128">5 consistency levels: Strong | Bounded | Session | Prefix | Eventual</text>
</svg>
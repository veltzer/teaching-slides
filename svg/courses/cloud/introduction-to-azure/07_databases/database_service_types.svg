<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="351.7241" height="261.93549082206" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="215.8621" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Relational</text>
  <text x="215.8621" y="174.709622505728" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">Azure SQL Database</text>
  <text x="215.8621" y="227.096871508837" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">MySQL, PostgreSQL</text>
  <text x="215.8621" y="275.741920191469" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">SQL Managed Instance</text>
  <rect x="453.7931" y="40" width="351.7241" height="261.93549082206" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="629.6551" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">NoSQL</text>
  <text x="629.6551" y="174.709622505728" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--info-text)">Cosmos DB</text>
  <text x="629.6551" y="227.096871508837" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--info-text)">Table Storage</text>
  <text x="629.6551" y="275.741920191469" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--info-text)">Multi-model, global</text>
  <rect x="867.5862" y="40" width="372.4138" height="261.93549082206" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="1053.7931" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Caching / Other</text>
  <text x="1053.7931" y="174.709622505728" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">Azure Cache (Redis)</text>
  <text x="1053.7931" y="227.096871508837" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">Azure Synapse</text>
  <text x="1053.7931" y="275.741920191469" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">Data Explorer</text>
  <rect x="143.4483" y="376.774217877209" width="993.1034" height="243.225782122791" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="639.9999" y="451.612837190432" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">All Azure DB Services Include</text>
  <text x="639.9999" y="518.967702314259" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">Automated backups | High availability | Encryption at rest</text>
  <text x="639.9999" y="578.838705506764" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">Geo-replication | Monitoring | Auto-patching | Scaling</text>
</svg>

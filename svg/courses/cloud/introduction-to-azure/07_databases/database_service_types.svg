<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.7623" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Azure Database Services</text>
  <rect x="40" y="81.6766" width="351.7241" height="243.1138" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="215.8621" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Relational</text>
  <text x="215.8621" y="206.7065" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--primary-text)">Azure SQL Database</text>
  <text x="215.8621" y="255.3294" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--primary-text)">MySQL, PostgreSQL</text>
  <text x="215.8621" y="300.479" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--primary-text)">SQL Managed Instance</text>
  <rect x="453.7931" y="81.6766" width="351.7241" height="243.1138" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.6551" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">NoSQL</text>
  <text x="629.6551" y="206.7065" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--info-text)">Cosmos DB</text>
  <text x="629.6551" y="255.3294" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--info-text)">Table Storage</text>
  <text x="629.6551" y="300.479" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--info-text)">Multi-model, global</text>
  <rect x="867.5862" y="81.6766" width="372.4138" height="243.1138" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1053.7931" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Caching / Other</text>
  <text x="1053.7931" y="206.7065" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--ok-text)">Azure Cache (Redis)</text>
  <text x="1053.7931" y="255.3294" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--ok-text)">Azure Synapse</text>
  <text x="1053.7931" y="300.479" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--ok-text)">Data Explorer</text>
  <rect x="143.4483" y="394.2515" width="993.1034" height="225.7485" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="463.7125" text-anchor="middle" font-size="22.6989" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">All Azure DB Services Include</text>
  <text x="639.9999" y="526.2275" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--warn-text)">Automated backups | High availability | Encryption at rest</text>
  <text x="639.9999" y="581.7964" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--warn-text)">Geo-replication | Monitoring | Auto-patching | Scaling</text>
</svg>

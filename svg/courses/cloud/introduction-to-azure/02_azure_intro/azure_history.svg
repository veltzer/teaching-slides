<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.888605" font-weight="bold" fill="var(--primary-accent)">Azure Evolution Timeline</text>

  <!-- Timeline backbone -->
  <rect x="40" y="330" width="1200" height="10.545455" rx="5.314767" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

  <!-- 2008 -->
  <rect x="102.329" y="311.888" width="46.77" height="46.77" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="40" y="113.818182" width="171.428571" height="158.181818" rx="6.377721" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.714286" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.014512" font-weight="bold" fill="var(--info-text)">2008</text>
  <text x="125.714286" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.25907" font-weight="bold" fill="var(--info-text)">Announced</text>
  <text x="125.714286" y="229.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.944302" fill="var(--info-text)">Project "Red Dog"</text>
  <text x="125.714286" y="253.018182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.944302" fill="var(--info-text)">at PDC</text>
  <line x1="125.714286" y1="272" x2="125.714286" y2="312.072727" stroke="var(--info-border)" stroke-width="2"/>

  <!-- 2010 -->
  <rect x="325.186" y="311.888" width="46.77" height="46.77" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="262.857143" y="398.545455" width="171.428571" height="158.181818" rx="6.377721" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="348.571429" y1="358.472727" x2="348.571429" y2="398.545455" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="348.571429" y="440.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.014512" font-weight="bold" fill="var(--primary-text)">2010</text>
  <text x="348.571429" y="482.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.25907" font-weight="bold" fill="var(--primary-text)">GA Launch</text>
  <text x="348.571429" y="514.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.944302" fill="var(--primary-text)">Windows Azure</text>
  <text x="348.571429" y="537.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.944302" fill="var(--primary-text)">goes live</text>

  <!-- 2014 -->
  <rect x="548.044" y="311.888" width="46.77" height="46.77" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="485.714286" y="113.818182" width="171.428571" height="158.181818" rx="6.377721" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="571.428571" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.014512" font-weight="bold" fill="var(--ok-text)">2014</text>
  <text x="571.428571" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.25907" font-weight="bold" fill="var(--ok-text)">Renamed</text>
  <text x="571.428571" y="229.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.944302" fill="var(--ok-text)">Microsoft Azure,</text>
  <text x="571.428571" y="253.018182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.944302" fill="var(--ok-text)">Linux support</text>
  <line x1="571.428571" y1="272" x2="571.428571" y2="312.072727" stroke="var(--ok-border)" stroke-width="2"/>

  <!-- 2017 -->
  <rect x="830.901" y="311.888" width="46.77" height="46.77" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="768.571429" y="398.545455" width="171.428571" height="158.181818" rx="6.377721" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="854.285714" y1="358.472727" x2="854.285714" y2="398.545455" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="854.285714" y="440.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.014512" font-weight="bold" fill="var(--warn-text)">2017</text>
  <text x="854.285714" y="482.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.25907" font-weight="bold" fill="var(--warn-text)">Global Scale</text>
  <text x="854.285714" y="514.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.944302" fill="var(--warn-text)">60+ regions,</text>
  <text x="854.285714" y="537.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.944302" fill="var(--warn-text)">200+ services</text>

  <!-- 2023 -->
  <rect x="1113.76" y="311.888" width="46.77" height="46.77" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1051.428571" y="113.818182" width="171.428571" height="158.181818" rx="6.377721" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1137.142857" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.014512" font-weight="bold" fill="var(--danger-text)">2023</text>
  <text x="1137.142857" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.25907" font-weight="bold" fill="var(--danger-text)">AI Era</text>
  <text x="1137.142857" y="229.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.944302" fill="var(--danger-text)">OpenAI Service,</text>
  <text x="1137.142857" y="253.018182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.944302" fill="var(--danger-text)">Copilot launch</text>
  <line x1="1137.142857" y1="272" x2="1137.142857" y2="312.072727" stroke="var(--danger-border)" stroke-width="2"/>

  <!-- Bottom banner -->
  <rect x="40" y="588.363636" width="1200" height="31.636364" rx="6.377721" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="610.509091" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.070209" fill="var(--text-muted)">From PaaS experiment to second-largest global cloud platform</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="632.0988" cy="355.5556" rx="589.9588" ry="189.6296" fill="none" stroke="var(--text-faint)" stroke-width="2.107" stroke-dasharray="8.428 8.428" />
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="23.177" fill="var(--text-muted)">60+ Azure Regions Worldwide</text>
  <rect x="63.2099" y="142.2222" width="231.7696" height="195.5556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="179.0946" y="213.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Americas</text>
  <text x="179.0946" y="266.6667" text-anchor="middle" font-size="21.0699">East US, West US</text>
  <text x="179.0946" y="312.8889" text-anchor="middle" font-size="21.0699">Brazil, Canada</text>
  <rect x="358.1893" y="195.5556" width="231.7696" height="195.5556" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="474.0741" y="266.6667" text-anchor="middle" font-size="23.177" font-weight="bold">Europe</text>
  <text x="474.0741" y="320" text-anchor="middle" font-size="21.0699">West Europe, UK</text>
  <text x="474.0741" y="366.2222" text-anchor="middle" font-size="21.0699">France, Germany</text>
  <rect x="674.2387" y="195.5556" width="231.7696" height="195.5556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="790.1235" y="266.6667" text-anchor="middle" font-size="23.177" font-weight="bold">Asia Pacific</text>
  <text x="790.1235" y="320" text-anchor="middle" font-size="21.0699">Japan, Australia</text>
  <text x="790.1235" y="366.2222" text-anchor="middle" font-size="21.0699">India, Korea</text>
  <rect x="969.2181" y="142.2222" width="231.7696" height="195.5556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1085.1029" y="213.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Middle East</text>
  <text x="1085.1029" y="266.6667" text-anchor="middle" font-size="21.0699">UAE, Qatar</text>
  <text x="1085.1029" y="312.8889" text-anchor="middle" font-size="21.0699">South Africa</text>
  <rect x="358.1893" y="462.2222" width="547.819" height="177.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="533.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Availability Zones per Region</text>
  <text x="632.0988" y="597.3333" text-anchor="middle" font-size="21.0699">3+ independent data centers with isolated power, cooling, networking</text>
</svg>
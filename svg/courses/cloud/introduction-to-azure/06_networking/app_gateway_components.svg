  <text x="119.7661" y="218.9474" text-anchor="middle" font-size="19.961">HTTPS</text>
  <line x1="219.5712" y1="185.2632" x2="279.4542" y2="185.2632" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_05_networking)" />
  <rect x="279.4542" y="84.2105" width="259.4931" height="202.1053" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="409.2007" y="151.5789" text-anchor="middle" font-size="19.961" font-weight="bold">Frontend</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0001" y="40" text-anchor="middle" font-size="24.3998" font-weight="bold" fill="var(--text)">Application Gateway Components</text>
  <rect x="40" y="80.4651" width="206.8965" height="168.6047" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="143.4483" y="147.907" text-anchor="middle" font-size="20.3331" font-weight="bold">Client</text>
  <text x="143.4483" y="198.4884" text-anchor="middle" font-size="20.3331">HTTPS</text>
  <line x1="246.8966" y1="164.7675" x2="308.9656" y2="164.7675" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_05_networking)" />
  <rect x="308.9656" y="63.6046" width="268.9655" height="202.3256" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="443.4482" y="131.0464" text-anchor="middle" font-size="20.3331" font-weight="bold">Frontend</text>
  <text x="443.4482" y="174.8837" text-anchor="middle" font-size="20.3331">Public/Private IP</text>
  <text x="443.4482" y="222.093" text-anchor="middle" font-size="20.3331">SSL Termination</text>
  <line x1="577.9311" y1="164.7675" x2="640.0001" y2="164.7675" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_05_networking)" />
  <rect x="640.0001" y="63.6046" width="268.9655" height="202.3256" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="774.4828" y="131.0464" text-anchor="middle" font-size="20.3331" font-weight="bold">Routing Rules</text>
  <text x="774.4828" y="174.8837" text-anchor="middle" font-size="20.3331">URL-based</text>
  <text x="774.4828" y="222.093" text-anchor="middle" font-size="20.3331">Path-based</text>
  <line x1="908.9656" y1="164.7675" x2="971.0345" y2="131.0464" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrowd2_05_networking)" />
  <line x1="908.9656" y1="164.7675" x2="971.0345" y2="232.2093" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrowd2_05_networking)" />
  <rect x="971.0345" y="63.6046" width="268.9655" height="101.1628" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1105.5173" y="131.0464" text-anchor="middle" font-size="20.3331">Backend Pool A</text>
  <rect x="971.0345" y="181.6279" width="268.9655" height="101.1628" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1105.5173" y="249.0698" text-anchor="middle" font-size="20.3331">Backend Pool B</text>
  <rect x="226.2069" y="333.3721" width="827.5862" height="134.8837" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="640.0001" y="390.6977" text-anchor="middle" font-size="20.3331" font-weight="bold">Web Application Firewall (WAF)</text>
  <text x="640.0001" y="441.2791" text-anchor="middle" font-size="20.3331">OWASP rules | Bot protection | Custom rules | Geo-filtering</text>
  <rect x="226.2069" y="501.9768" width="827.5862" height="118.0232" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="640.0001" y="559.3023" text-anchor="middle" font-size="20.3331" font-weight="bold">Health Probes: Monitor backend availability and auto-failover</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_05_networking" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
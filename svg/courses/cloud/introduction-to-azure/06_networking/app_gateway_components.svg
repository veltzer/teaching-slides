  <text x="409.2007" y="242.5263" text-anchor="middle" font-size="19.961">SSL Termination</text>
  <line x1="538.9474" y1="185.2632" x2="598.8304" y2="185.2632" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_05_networking)" />
  <rect x="598.8304" y="84.2105" width="259.4931" height="202.1053" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />

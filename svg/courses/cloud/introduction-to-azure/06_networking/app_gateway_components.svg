<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="57.575792323229" width="206.8965" height="175.757610505047" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.125950479435" filter="url(#shadow)"/>
  <text x="143.4483" y="127.878857373731" text-anchor="middle" font-size="20.759927282233" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Client</text>
  <text x="143.4483" y="180.606130101004" text-anchor="middle" font-size="20.759927282233" font-family="Arial, sans-serif" fill="var(--primary-text)">HTTPS</text>
  <line x1="246.8966" y1="145.45464969696" x2="308.9656" y2="145.45464969696" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="308.9656" y="40" width="268.9655" height="210.909090909091" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.125950479435" filter="url(#shadow)"/>
  <text x="443.4482" y="110.302960808087" text-anchor="middle" font-size="20.759927282233" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Frontend</text>
  <text x="443.4482" y="156.000020848483" text-anchor="middle" font-size="20.759927282233" font-family="Arial, sans-serif" fill="var(--warn-text)">Public/Private IP</text>
  <text x="443.4482" y="205.21213511111" text-anchor="middle" font-size="20.759927282233" font-family="Arial, sans-serif" fill="var(--warn-text)">SSL Termination</text>
  <line x1="577.9311" y1="145.45464969696" x2="640.0001" y2="145.45464969696" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="640.0001" y="40" width="268.9655" height="210.909090909091" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.125950479435" filter="url(#shadow)"/>
  <text x="774.4828" y="110.302960808087" text-anchor="middle" font-size="20.759927282233" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Routing Rules</text>
  <text x="774.4828" y="156.000020848483" text-anchor="middle" font-size="20.759927282233" font-family="Arial, sans-serif" fill="var(--info-text)">URL-based</text>
  <text x="774.4828" y="205.21213511111" text-anchor="middle" font-size="20.759927282233" font-family="Arial, sans-serif" fill="var(--info-text)">Path-based</text>
  <line x1="908.9656" y1="145.45464969696" x2="971.0345" y2="110.302960808087" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrow)"/>
  <line x1="908.9656" y1="145.45464969696" x2="971.0345" y2="215.757610505047" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrow)"/>
  <rect x="971.0345" y="40" width="268.9655" height="105.454545454545" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.125950479435" filter="url(#shadow)"/>
  <text x="1105.5173" y="110.302960808087" text-anchor="middle" font-size="20.759927282233" font-family="Arial, sans-serif" fill="var(--ok-text)">Backend Pool A</text>
  <rect x="971.0345" y="163.030337777775" width="268.9655" height="105.454545454545" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.125950479435" filter="url(#shadow)"/>
  <text x="1105.5173" y="233.333402828276" text-anchor="middle" font-size="20.759927282233" font-family="Arial, sans-serif" fill="var(--ok-text)">Backend Pool B</text>
  <rect x="226.2069" y="321.212155959593" width="827.5862" height="140.606025858589" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.125950479435" filter="url(#shadow)"/>
  <text x="640.0001" y="380.969745616157" text-anchor="middle" font-size="20.759927282233" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Web Application Firewall (WAF)</text>
  <text x="640.0001" y="433.69701834343" text-anchor="middle" font-size="20.759927282233" font-family="Arial, sans-serif" fill="var(--danger-text)">OWASP rules | Bot protection | Custom rules | Geo-filtering</text>
  <rect x="226.2069" y="496.96976646464" width="827.5862" height="123.03023353536" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.125950479435" filter="url(#shadow)"/>
  <text x="640.0001" y="556.72725187879" text-anchor="middle" font-size="20.759927282233" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Health Probes: Monitor backend availability and auto-failover</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

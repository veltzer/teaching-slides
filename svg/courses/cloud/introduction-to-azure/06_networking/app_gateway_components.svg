<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.8304" y="60.6316" text-anchor="middle" font-size="23.9532" font-weight="bold" fill="var(--text)">Application Gateway Components</text>

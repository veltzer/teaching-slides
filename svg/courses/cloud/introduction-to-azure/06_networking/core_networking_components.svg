<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="64" text-anchor="middle" font-size="25.284" font-weight="bold" fill="var(--text)">Core Azure Networking Components</text>
  <rect x="21.0699" y="106.6667" width="273.9094" height="231.1111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="158.0247" y="177.7778" text-anchor="middle" font-size="23.177" font-weight="bold">VNet</text>
  <text x="158.0247" y="231.1111" text-anchor="middle" font-size="21.0699">Network isolation</text>
  <text x="158.0247" y="284.4444" text-anchor="middle" font-size="21.0699">Address spaces</text>
  <rect x="337.1193" y="106.6667" width="273.9094" height="231.1111" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="474.0741" y="177.7778" text-anchor="middle" font-size="23.177" font-weight="bold">Subnets</text>
  <text x="474.0741" y="231.1111" text-anchor="middle" font-size="21.0699">Segmentation</text>
  <text x="474.0741" y="284.4444" text-anchor="middle" font-size="21.0699">IP ranges</text>
  <rect x="653.1687" y="106.6667" width="273.9094" height="231.1111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="790.1235" y="177.7778" text-anchor="middle" font-size="23.177" font-weight="bold">NSG</text>
  <text x="790.1235" y="231.1111" text-anchor="middle" font-size="21.0699">Security rules</text>
  <text x="790.1235" y="284.4444" text-anchor="middle" font-size="21.0699">Allow/Deny traffic</text>
  <rect x="969.2181" y="106.6667" width="273.9094" height="231.1111" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1106.1728" y="177.7778" text-anchor="middle" font-size="23.177" font-weight="bold">Load Balancer</text>
  <text x="1106.1728" y="231.1111" text-anchor="middle" font-size="21.0699">L4 distribution</text>
  <text x="1106.1728" y="284.4444" text-anchor="middle" font-size="21.0699">Health probes</text>
  <rect x="21.0699" y="408.8889" width="273.9094" height="231.1111" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="158.0247" y="480" text-anchor="middle" font-size="23.177" font-weight="bold">App Gateway</text>
  <text x="158.0247" y="533.3333" text-anchor="middle" font-size="21.0699">L7 routing</text>
  <text x="158.0247" y="586.6667" text-anchor="middle" font-size="21.0699">WAF, SSL</text>
  <rect x="337.1193" y="408.8889" width="273.9094" height="231.1111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="474.0741" y="480" text-anchor="middle" font-size="23.177" font-weight="bold">VPN Gateway</text>
  <text x="474.0741" y="533.3333" text-anchor="middle" font-size="21.0699">Encrypted tunnel</text>
  <text x="474.0741" y="586.6667" text-anchor="middle" font-size="21.0699">Hybrid connect</text>
  <rect x="653.1687" y="408.8889" width="273.9094" height="231.1111" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="790.1235" y="480" text-anchor="middle" font-size="23.177" font-weight="bold">Azure DNS</text>
  <text x="790.1235" y="533.3333" text-anchor="middle" font-size="21.0699">Name resolution</text>
  <text x="790.1235" y="586.6667" text-anchor="middle" font-size="21.0699">Custom domains</text>
  <rect x="969.2181" y="408.8889" width="273.9094" height="231.1111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1106.1728" y="480" text-anchor="middle" font-size="23.177" font-weight="bold">Azure Firewall</text>
  <text x="1106.1728" y="533.3333" text-anchor="middle" font-size="21.0699">Managed FW</text>
  <text x="1106.1728" y="586.6667" text-anchor="middle" font-size="21.0699">Threat intel</text>
</svg>
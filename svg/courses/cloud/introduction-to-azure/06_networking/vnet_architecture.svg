<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="592.5926" y="50" text-anchor="middle" font-size="23.7037" font-weight="bold" fill="var(--text)">VNet with Subnets and NSGs</text>
  <rect x="39.5062" y="73.3333" width="1106.1729" height="566.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="592.5926" y="133.3333" text-anchor="middle" font-size="21.7284" font-weight="bold">VNet: 10.0.0.0/16</text>
  <rect x="69.1358" y="166.6667" width="316.0494" height="216.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="227.1605" y="226.6667" text-anchor="middle" font-size="19.7531" font-weight="bold">Web Subnet</text>
  <text x="227.1605" y="273.3333" text-anchor="middle" font-size="19.7531">10.0.1.0/24</text>
  <rect x="98.7655" y="310" width="98.7655" height="60" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="148.1481" y="350" text-anchor="middle" font-size="19.7531">VM1</text>
  <rect x="217.284" y="310" width="98.7655" height="60" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="266.6667" y="350" text-anchor="middle" font-size="19.7531">VM2</text>
  <rect x="434.5679" y="166.6667" width="316.0494" height="216.6667" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="592.5926" y="226.6667" text-anchor="middle" font-size="19.7531" font-weight="bold">App Subnet</text>
  <text x="592.5926" y="273.3333" text-anchor="middle" font-size="19.7531">10.0.2.0/24</text>
  <rect x="474.0741" y="310" width="108.6419" height="60" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="527.4074" y="350" text-anchor="middle" font-size="19.7531">AppSvc</text>
  <rect x="602.4692" y="310" width="108.6419" height="60" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="655.8025" y="350" text-anchor="middle" font-size="19.7531">API</text>
  <rect x="800" y="166.6667" width="316.0494" height="216.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="958.0247" y="226.6667" text-anchor="middle" font-size="19.7531" font-weight="bold">DB Subnet</text>
  <text x="958.0247" y="273.3333" text-anchor="middle" font-size="19.7531">10.0.3.0/24</text>
  <rect x="859.2593" y="310" width="98.7655" height="60" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="908.6419" y="350" text-anchor="middle" font-size="19.7531">SQL</text>
  <rect x="977.7778" y="310" width="108.6419" height="60" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1031.1111" y="350" text-anchor="middle" font-size="19.7531">Redis</text>
  <rect x="69.1358" y="433.3333" width="316.0494" height="83.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="227.1605" y="490" text-anchor="middle" font-size="19.7531">NSG: Allow 80,443</text>
  <rect x="434.5679" y="433.3333" width="316.0494" height="83.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="592.5926" y="490" text-anchor="middle" font-size="19.7531">NSG: Allow from Web</text>
  <rect x="800" y="433.3333" width="316.0494" height="83.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="958.0247" y="490" text-anchor="middle" font-size="19.7531">NSG: Allow from App</text>
  <text x="592.5926" y="600" text-anchor="middle" font-size="19.7531" fill="var(--text-muted)">Traffic flows: Internet -&gt; Web -&gt; App -&gt; DB (controlled by NSGs)</text>
</svg>
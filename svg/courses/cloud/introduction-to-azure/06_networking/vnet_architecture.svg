<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.934295157655" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">VNet: 10.0.0.0/16</text>
  <rect x="40" y="81.428616581629" width="362.264133001067" height="269.285754923465" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.934736166513" filter="url(#shadow)"/>
  <text x="221.132119330726" y="155.999974714288" text-anchor="middle" font-size="23.576600439976" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Web Subnet</text>
  <text x="221.132119330726" y="213.999962071432" text-anchor="middle" font-size="23.576600439976" font-family="Arial, sans-serif" fill="var(--ok-text)">10.0.1.0/24</text>
  <rect x="73.962417657541" y="259.5713897398" width="113.2076009968" height="74.571484561219" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.934736166513" filter="url(#shadow)"/>
  <text x="130.566059665363" y="309.285754923467" text-anchor="middle" font-size="23.576600439976" font-family="Arial, sans-serif" fill="var(--warn-text)">VM1</text>
  <rect x="209.811454325393" y="259.5713897398" width="113.2076009968" height="74.571484561219" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.934736166513" filter="url(#shadow)"/>
  <text x="266.4152019936" y="309.285754923467" text-anchor="middle" font-size="23.576600439976" font-family="Arial, sans-serif" fill="var(--warn-text)">VM2</text>
  <rect x="458.867986329659" y="81.428616581629" width="362.264133001067" height="269.285754923465" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.934736166513" filter="url(#shadow)"/>
  <text x="640" y="155.999974714288" text-anchor="middle" font-size="23.576600439976" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">App Subnet</text>
  <text x="640" y="213.999962071432" text-anchor="middle" font-size="23.576600439976" font-family="Arial, sans-serif" fill="var(--info-text)">10.0.2.0/24</text>
  <rect x="504.150963332148" y="259.5713897398" width="124.528266002133" height="74.571484561219" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.934736166513" filter="url(#shadow)"/>
  <text x="565.282998134566" y="309.285754923467" text-anchor="middle" font-size="23.576600439976" font-family="Arial, sans-serif" fill="var(--warn-text)">AppSvc</text>
  <rect x="651.320876326104" y="259.5713897398" width="124.528266002133" height="74.571484561219" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.934736166513" filter="url(#shadow)"/>
  <text x="712.452911128522" y="309.285754923467" text-anchor="middle" font-size="23.576600439976" font-family="Arial, sans-serif" fill="var(--warn-text)">API</text>
  <rect x="877.735866998933" y="81.428616581629" width="362.264133001067" height="269.285754923465" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.934736166513" filter="url(#shadow)"/>
  <text x="1058.86798632966" y="155.999974714288" text-anchor="middle" font-size="23.576600439976" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">DB Subnet</text>
  <text x="1058.86798632966" y="213.999962071432" text-anchor="middle" font-size="23.576600439976" font-family="Arial, sans-serif" fill="var(--danger-text)">10.0.3.0/24</text>
  <rect x="945.660490993245" y="259.5713897398" width="113.2076009968" height="74.571484561219" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.934736166513" filter="url(#shadow)"/>
  <text x="1002.264133001067" y="309.285754923467" text-anchor="middle" font-size="23.576600439976" font-family="Arial, sans-serif" fill="var(--warn-text)">SQL</text>
  <rect x="1081.509527661097" y="259.5713897398" width="124.528266002133" height="74.571484561219" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.934736166513" filter="url(#shadow)"/>
  <text x="1142.641562463514" y="309.285754923467" text-anchor="middle" font-size="23.576600439976" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis</text>
  <rect x="40" y="412.857043520417" width="362.264133001067" height="103.571415025511" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.934736166513" filter="url(#shadow)"/>
  <text x="221.132119330726" y="483.285716994897" text-anchor="middle" font-size="23.576600439976" font-family="Arial, sans-serif" fill="var(--warn-text)">NSG: Allow 80,443</text>
  <rect x="458.867986329659" y="412.857043520417" width="362.264133001067" height="103.571415025511" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.934736166513" filter="url(#shadow)"/>
  <text x="640" y="483.285716994897" text-anchor="middle" font-size="23.576600439976" font-family="Arial, sans-serif" fill="var(--warn-text)">NSG: Allow from Web</text>
  <rect x="877.735866998933" y="412.857043520417" width="362.264133001067" height="103.571415025511" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.934736166513" filter="url(#shadow)"/>
  <text x="1058.86798632966" y="483.285716994897" text-anchor="middle" font-size="23.576600439976" font-family="Arial, sans-serif" fill="var(--warn-text)">NSG: Allow from App</text>
  <text x="640" y="620" text-anchor="middle" font-size="23.576600439976" fill="var(--text-muted)" font-family="Arial, sans-serif">Traffic flows: Internet -&gt; Web -&gt; App -&gt; DB (controlled by NSGs)</text>
</svg>

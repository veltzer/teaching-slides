<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="639.9999" y="101.411810027677" text-anchor="middle" font-size="22.895909959294" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">VNet: 10.0.0.0/16</text>
  <rect x="72.1428" y="135.529493833902" width="342.8571" height="221.764736505187" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="243.5714" y="196.941199743942" text-anchor="middle" font-size="20.814435770799" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Web Subnet</text>
  <text x="243.5714" y="244.705894602075" text-anchor="middle" font-size="20.814435770799" font-family="Arial, sans-serif" fill="var(--ok-text)">10.0.1.0/24</text>
  <rect x="104.2858" y="282.235305141868" width="107.1429" height="61.411810027677" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="157.8571" y="323.176546532865" text-anchor="middle" font-size="20.814435770799" font-family="Arial, sans-serif" fill="var(--warn-text)">VM1</text>
  <rect x="232.8572" y="282.235305141868" width="107.1429" height="61.411810027677" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="286.4286" y="323.176546532865" text-anchor="middle" font-size="20.814435770799" font-family="Arial, sans-serif" fill="var(--warn-text)">VM2</text>
  <rect x="468.5714" y="135.529493833902" width="342.8571" height="221.764736505187" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="639.9999" y="196.941199743942" text-anchor="middle" font-size="20.814435770799" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">App Subnet</text>
  <text x="639.9999" y="244.705894602075" text-anchor="middle" font-size="20.814435770799" font-family="Arial, sans-serif" fill="var(--info-text)">10.0.2.0/24</text>
  <rect x="511.4285" y="282.235305141868" width="117.8571" height="61.411810027677" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="569.2856" y="323.176546532865" text-anchor="middle" font-size="20.814435770799" font-family="Arial, sans-serif" fill="var(--warn-text)">AppSvc</text>
  <rect x="650.7143" y="282.235305141868" width="117.8571" height="61.411810027677" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="708.5714" y="323.176546532865" text-anchor="middle" font-size="20.814435770799" font-family="Arial, sans-serif" fill="var(--warn-text)">API</text>
  <rect x="864.9999" y="135.529493833902" width="342.8571" height="221.764736505187" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="1036.4285" y="196.941199743942" text-anchor="middle" font-size="20.814435770799" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">DB Subnet</text>
  <text x="1036.4285" y="244.705894602075" text-anchor="middle" font-size="20.814435770799" font-family="Arial, sans-serif" fill="var(--danger-text)">10.0.3.0/24</text>
  <rect x="929.2857" y="282.235305141868" width="107.1429" height="61.411810027677" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="982.857" y="323.176546532865" text-anchor="middle" font-size="20.814435770799" font-family="Arial, sans-serif" fill="var(--warn-text)">SQL</text>
  <rect x="1057.8571" y="282.235305141868" width="117.8571" height="61.411810027677" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="1115.7142" y="323.176546532865" text-anchor="middle" font-size="20.814435770799" font-family="Arial, sans-serif" fill="var(--warn-text)">Redis</text>
  <rect x="72.1428" y="408.470547813153" width="342.8571" height="85.294105397925" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="243.5714" y="466.470631107262" text-anchor="middle" font-size="20.814435770799" font-family="Arial, sans-serif" fill="var(--warn-text)">NSG: Allow 80,443</text>
  <rect x="468.5714" y="408.470547813153" width="342.8571" height="85.294105397925" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="639.9999" y="466.470631107262" text-anchor="middle" font-size="20.814435770799" font-family="Arial, sans-serif" fill="var(--warn-text)">NSG: Allow from Web</text>
  <rect x="864.9999" y="408.470547813153" width="342.8571" height="85.294105397925" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.122283019251" filter="url(#shadow)"/>
  <text x="1036.4285" y="466.470631107262" text-anchor="middle" font-size="20.814435770799" font-family="Arial, sans-serif" fill="var(--warn-text)">NSG: Allow from App</text>
  <text x="639.9999" y="579.05886272664" text-anchor="middle" font-size="20.814435770799" fill="var(--text-muted)" font-family="Arial, sans-serif">Traffic flows: Internet -&gt; Web -&gt; App -&gt; DB (controlled by NSGs)</text>
</svg>

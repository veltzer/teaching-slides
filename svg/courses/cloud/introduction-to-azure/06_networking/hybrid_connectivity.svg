<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="58.709708699269" width="310.3448" height="261.93549082206" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="195.1724" y="133.548435754418" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">On-Premises</text>
  <text x="195.1724" y="189.677454110299" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">Data Center</text>
  <text x="195.1724" y="245.806472466179" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">VPN Device</text>
  <text x="195.1724" y="294.451628890737" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">Local network</text>
  <rect x="908.9655" y="58.709708699269" width="331.0345" height="261.93549082206" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="1074.4828" y="133.548435754418" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Azure VNet</text>
  <text x="1074.4828" y="189.677454110299" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">Cloud resources</text>
  <text x="1074.4828" y="245.806472466179" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">VPN Gateway</text>
  <text x="1074.4828" y="294.451628890737" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">VMs, Services</text>
  <rect x="412.4138" y="40" width="434.4828" height="130.96774541103" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="629.6551" y="122.322588986472" text-anchor="middle" font-size="21.41919549816" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Site-to-Site VPN (IPsec)</text>
  <line x1="350.3448" y1="107.354865123827" x2="412.4138" y2="107.354865123827" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="846.8966" y1="107.354865123827" x2="908.9655" y2="107.354865123827" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="412.4138" y="208.387162809568" width="434.4828" height="130.96774541103" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="629.6551" y="290.709751796039" text-anchor="middle" font-size="21.41919549816" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">ExpressRoute (Private)</text>
  <line x1="350.3448" y1="275.741920191469" x2="412.4138" y2="275.741920191469" stroke="var(--text)" stroke-width="2"/>
  <line x1="846.8966" y1="275.741920191469" x2="908.9655" y2="275.741920191469" stroke="var(--text)" stroke-width="2"/>
  <rect x="143.4483" y="414.193527533821" width="455.1724" height="205.806472466179" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="371.0345" y="481.548392657648" text-anchor="middle" font-size="21.41919549816" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">VPN: Encrypted over internet</text>
  <text x="371.0345" y="537.677411013528" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--danger-text)">Up to 10 Gbps</text>
  <text x="371.0345" y="593.806429369409" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--danger-text)">Lower cost, quick setup</text>
  <rect x="681.3793" y="414.193527533821" width="475.8621" height="205.806472466179" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="919.3104" y="481.548392657648" text-anchor="middle" font-size="21.41919549816" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">ExpressRoute: Dedicated link</text>
  <text x="919.3104" y="537.677411013528" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">Up to 100 Gbps</text>
  <text x="919.3104" y="593.806429369409" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">Higher reliability, lower latency</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

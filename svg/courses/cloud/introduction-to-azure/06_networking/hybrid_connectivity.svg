<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="24.7623" font-weight="bold" fill="var(--text)">Hybrid Connectivity Options</text>
  <rect x="40" y="99.0419" width="310.3448" height="243.1138" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="195.1724" y="168.503" text-anchor="middle" font-size="22.6989" font-weight="bold">On-Premises</text>
  <text x="195.1724" y="220.5988" text-anchor="middle" font-size="20.6353">Data Center</text>
  <text x="195.1724" y="272.6946" text-anchor="middle" font-size="20.6353">VPN Device</text>
  <text x="195.1724" y="317.8443" text-anchor="middle" font-size="20.6353">Local network</text>
  <rect x="908.9655" y="99.0419" width="331.0345" height="243.1138" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1074.4828" y="168.503" text-anchor="middle" font-size="22.6989" font-weight="bold">Azure VNet</text>
  <text x="1074.4828" y="220.5988" text-anchor="middle" font-size="20.6353">Cloud resources</text>
  <text x="1074.4828" y="272.6946" text-anchor="middle" font-size="20.6353">VPN Gateway</text>
  <text x="1074.4828" y="317.8443" text-anchor="middle" font-size="20.6353">VMs, Services</text>
  <rect x="412.4138" y="81.6766" width="434.4828" height="121.5569" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.6551" y="158.0838" text-anchor="middle" font-size="20.6353" font-weight="bold">Site-to-Site VPN (IPsec)</text>
  <line x1="350.3448" y1="144.1916" x2="412.4138" y2="144.1916" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_05_networking)" />
  <line x1="846.8966" y1="144.1916" x2="908.9655" y2="144.1916" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_05_networking)" />
  <rect x="412.4138" y="237.9641" width="434.4828" height="121.5569" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.6551" y="314.3713" text-anchor="middle" font-size="20.6353" font-weight="bold">ExpressRoute (Private)</text>
  <line x1="350.3448" y1="300.479" x2="412.4138" y2="300.479" stroke="var(--text)" stroke-width="2" />
  <line x1="846.8966" y1="300.479" x2="908.9655" y2="300.479" stroke="var(--text)" stroke-width="2" />
  <rect x="143.4483" y="428.982" width="455.1724" height="191.018" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="371.0345" y="491.497" text-anchor="middle" font-size="20.6353" font-weight="bold">VPN: Encrypted over internet</text>
  <text x="371.0345" y="543.5928" text-anchor="middle" font-size="20.6353">Up to 10 Gbps</text>
  <text x="371.0345" y="595.6886" text-anchor="middle" font-size="20.6353">Lower cost, quick setup</text>
  <rect x="681.3793" y="428.982" width="475.8621" height="191.018" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="919.3104" y="491.497" text-anchor="middle" font-size="20.6353" font-weight="bold">ExpressRoute: Dedicated link</text>
  <text x="919.3104" y="543.5928" text-anchor="middle" font-size="20.6353">Up to 100 Gbps</text>
  <text x="919.3104" y="595.6886" text-anchor="middle" font-size="20.6353">Higher reliability, lower latency</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd3_05_networking" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
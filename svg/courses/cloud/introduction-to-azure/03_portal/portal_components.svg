  <text x="700.1709" y="459.4872" text-anchor="middle" font-size="21.3941" font-weight="bold">Resource Blade - Detail View</text>
  <text x="700.1709" y="518.5641" text-anchor="middle" font-size="19.4492">Overview | Activity Log | Access Control | Tags | Settings | Monitoring</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="91.5789" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="151.8644" y="101.0526" text-anchor="middle" font-size="19.1814" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Search</text>
  <text x="436.6102" y="101.0526" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--primary-text)">Cloud Shell</text>
  <text x="741.695" y="101.0526" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--primary-text)">Notifications</text>
  <text x="1046.7797" y="101.0526" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--primary-text)">Settings / Profile</text>
  <rect x="40" y="131.5789" width="244.0678" height="488.4211" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="162.0339" y="192.6315" text-anchor="middle" font-size="19.1814" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Sidebar</text>
  <text x="162.0339" y="244.5263" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--info-text)">Dashboard</text>
  <text x="162.0339" y="290.3158" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--info-text)">All Services</text>
  <text x="162.0339" y="336.1052" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--info-text)">Resource Groups</text>
  <text x="162.0339" y="381.8947" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--info-text)">Subscriptions</text>
  <text x="162.0339" y="427.6842" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--info-text)">Cost Mgmt</text>
  <text x="162.0339" y="473.4736" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--info-text)">Monitor</text>
  <rect x="294.2373" y="146.8421" width="935.5931" height="213.6842" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="762.0338" y="201.7895" text-anchor="middle" font-size="21.0995" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Dashboard - Customizable Tiles</text>
  <rect x="314.5763" y="223.1578" width="203.3898" height="106.8421" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="416.2711" y="290.3158" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--warn-text)">Metrics</text>
  <rect x="538.305" y="223.1578" width="203.3898" height="106.8421" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="290.3158" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--warn-text)">Resources</text>
  <rect x="762.0338" y="223.1578" width="203.3898" height="106.8421" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="863.7288" y="290.3158" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--warn-text)">Health</text>
  <rect x="985.7627" y="223.1578" width="223.7289" height="106.8421" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1097.6271" y="290.3158" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--warn-text)">Cost Summary</text>
  <rect x="294.2373" y="391.0527" width="935.5931" height="213.6842" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="762.0338" y="452.1053" text-anchor="middle" font-size="21.0995" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Resource Blade - Detail View</text>
  <text x="762.0338" y="507.0526" text-anchor="middle" font-size="19.1814" font-family="Arial, sans-serif" fill="var(--danger-text)">Overview | Activity Log | Access Control | Tags | Settings | Monitoring</text>
</svg>

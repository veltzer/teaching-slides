<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="91.5789" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="151.8644" y="101.0526" text-anchor="middle" font-size="19.1814" font-weight="bold">Search</text>
  <text x="436.6102" y="101.0526" text-anchor="middle" font-size="19.1814">Cloud Shell</text>
  <text x="741.695" y="101.0526" text-anchor="middle" font-size="19.1814">Notifications</text>
  <text x="1046.7797" y="101.0526" text-anchor="middle" font-size="19.1814">Settings / Profile</text>
  <rect x="40" y="131.5789" width="244.0678" height="488.4211" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="162.0339" y="192.6315" text-anchor="middle" font-size="19.1814" font-weight="bold">Sidebar</text>
  <text x="162.0339" y="244.5263" text-anchor="middle" font-size="19.1814">Dashboard</text>
  <text x="162.0339" y="290.3158" text-anchor="middle" font-size="19.1814">All Services</text>
  <text x="162.0339" y="336.1052" text-anchor="middle" font-size="19.1814">Resource Groups</text>
  <text x="162.0339" y="381.8947" text-anchor="middle" font-size="19.1814">Subscriptions</text>
  <text x="162.0339" y="427.6842" text-anchor="middle" font-size="19.1814">Cost Mgmt</text>
  <text x="162.0339" y="473.4736" text-anchor="middle" font-size="19.1814">Monitor</text>
  <rect x="294.2373" y="146.8421" width="935.5931" height="213.6842" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="762.0338" y="201.7895" text-anchor="middle" font-size="21.0995" font-weight="bold">Dashboard - Customizable Tiles</text>
  <rect x="314.5763" y="223.1578" width="203.3898" height="106.8421" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="416.2711" y="290.3158" text-anchor="middle" font-size="19.1814">Metrics</text>
  <rect x="538.305" y="223.1578" width="203.3898" height="106.8421" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="290.3158" text-anchor="middle" font-size="19.1814">Resources</text>
  <rect x="762.0338" y="223.1578" width="203.3898" height="106.8421" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="863.7288" y="290.3158" text-anchor="middle" font-size="19.1814">Health</text>
  <rect x="985.7627" y="223.1578" width="223.7289" height="106.8421" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1097.6271" y="290.3158" text-anchor="middle" font-size="19.1814">Cost Summary</text>
  <rect x="294.2373" y="391.0527" width="935.5931" height="213.6842" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="762.0338" y="452.1053" text-anchor="middle" font-size="21.0995" font-weight="bold">Resource Blade - Detail View</text>
  <text x="762.0338" y="507.0526" text-anchor="middle" font-size="19.1814">Overview | Activity Log | Access Control | Tags | Settings | Monitoring</text>
</svg>
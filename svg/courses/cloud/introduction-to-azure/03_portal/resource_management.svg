  <rect x="39.9221" y="218.9474" width="299.4152" height="185.2632" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="189.6297" y="286.3158" text-anchor="middle" font-size="21.9571" font-weight="bold">Create</text>
  <text x="189.6297" y="336.8421" text-anchor="middle" font-size="19.961">+ Add Resource</text>
  <text x="189.6297" y="380.6316" text-anchor="middle" font-size="19.961">Choose type/region</text>
  <rect x="449.1228" y="218.9474" width="299.4152" height="185.2632" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="286.3158" text-anchor="middle" font-size="21.9571" font-weight="bold">Configure</text>
  <text x="598.8304" y="336.8421" text-anchor="middle" font-size="19.961">Tags, Policies</text>
  <text x="598.8304" y="380.6316" text-anchor="middle" font-size="19.961">Access Control</text>
  <rect x="858.3236" y="218.9474" width="299.4152" height="185.2632" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1008.0312" y="286.3158" text-anchor="middle" font-size="21.9571" font-weight="bold">Monitor</text>
  <text x="1008.0312" y="336.8421" text-anchor="middle" font-size="19.961">Activity Log</text>
  <text x="1008.0312" y="380.6316" text-anchor="middle" font-size="19.961">Cost Analysis</text>
  <rect x="159.6881" y="471.5789" width="878.2846" height="168.4211" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="538.9474" text-anchor="middle" font-size="21.9571" font-weight="bold">Resources in Group</text>
  <text x="598.8304" y="599.5789" text-anchor="middle" font-size="19.961">VM-1 | Storage-1 | SQL-DB-1 | AppService-1 | VNet-1</text>
</svg>
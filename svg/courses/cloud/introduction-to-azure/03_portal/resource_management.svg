  <rect x="40" y="228.1081" width="321.4286" height="172.4325" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="200.7143" y="290.8108" text-anchor="middle" font-size="21.948" font-weight="bold">Create</text>
  <text x="200.7143" y="337.8378" text-anchor="middle" font-size="19.9527">+ Add Resource</text>
  <text x="200.7143" y="378.5946" text-anchor="middle" font-size="19.9527">Choose type/region</text>
  <rect x="479.2857" y="228.1081" width="321.4286" height="172.4325" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="290.8108" text-anchor="middle" font-size="21.948" font-weight="bold">Configure</text>
  <text x="639.9999" y="337.8378" text-anchor="middle" font-size="19.9527">Tags, Policies</text>
  <text x="639.9999" y="378.5946" text-anchor="middle" font-size="19.9527">Access Control</text>
  <rect x="918.5714" y="228.1081" width="321.4286" height="172.4325" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2857" y="290.8108" text-anchor="middle" font-size="21.948" font-weight="bold">Monitor</text>
  <text x="1079.2857" y="337.8378" text-anchor="middle" font-size="19.9527">Activity Log</text>
  <text x="1079.2857" y="378.5946" text-anchor="middle" font-size="19.9527">Cost Analysis</text>
  <rect x="168.5713" y="463.2432" width="942.8572" height="156.7568" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="525.946" text-anchor="middle" font-size="21.948" font-weight="bold">Resources in Group</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="472" y="40" width="336" height="144.999973125001" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="640" y="130.625077265623" text-anchor="middle" font-size="24.976421140043" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">App Service</text>
  <line x1="472" y1="112.500040312499" x2="256" y2="275.625050390624" stroke="var(--text)" stroke-width="1.9961"/>
  <line x1="640" y1="184.999973125001" x2="640" y2="257.5000134375" stroke="var(--text)" stroke-width="1.9961"/>
  <line x1="808" y1="112.500040312499" x2="1024" y2="275.625050390624" stroke="var(--text)" stroke-width="1.9961"/>
  <rect x="40" y="257.5000134375" width="288.0001" height="144.999973125001" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="184" y="348.124983203126" text-anchor="middle" font-size="24.976421140043" font-family="Arial, sans-serif" fill="var(--info-text)">SQL Database</text>
  <rect x="472" y="257.5000134375" width="336" height="144.999973125001" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="640" y="348.124983203126" text-anchor="middle" font-size="24.976421140043" font-family="Arial, sans-serif" fill="var(--ok-text)">Blob Storage</text>
  <rect x="928.0001" y="257.5000134375" width="311.9999" height="144.999973125001" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="1084.0001" y="348.124983203126" text-anchor="middle" font-size="24.976421140043" font-family="Arial, sans-serif" fill="var(--warn-text)">Key Vault</text>
  <rect x="280" y="475.000026874999" width="336" height="144.999973125001" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="448" y="565.624996640625" text-anchor="middle" font-size="24.976421140043" font-family="Arial, sans-serif" fill="var(--danger-text)">VNet / Subnet</text>
  <rect x="735.9999" y="475.000026874999" width="336" height="144.999973125001" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="904.0001" y="565.624996640625" text-anchor="middle" font-size="24.976421140043" font-family="Arial, sans-serif" fill="var(--danger-text)">NSG Rules</text>
  <line x1="184" y1="402.4999865625" x2="351.9999" y2="475.000026874999" stroke="var(--text-faint)" stroke-width="1.9961" stroke-dasharray="7.9844 7.9844"/>
  <line x1="640" y1="402.4999865625" x2="520" y2="475.000026874999" stroke="var(--text-faint)" stroke-width="1.9961" stroke-dasharray="7.9844 7.9844"/>
  <line x1="1084.0001" y1="402.4999865625" x2="976" y2="475.000026874999" stroke="var(--text-faint)" stroke-width="1.9961" stroke-dasharray="7.9844 7.9844"/>
</svg>

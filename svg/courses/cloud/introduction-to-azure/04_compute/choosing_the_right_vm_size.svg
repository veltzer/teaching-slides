<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="650.5263" y="40" text-anchor="middle" font-size="24.9786" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">VM Size Categories Decision Guide</text>
  <rect x="40" y="81.6766" width="357.8947" height="173.6527" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="218.9474" y="151.1377" text-anchor="middle" font-size="22.8971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">B/D-series</text>
  <text x="218.9474" y="203.2335" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--primary-text)">General Purpose</text>
  <text x="218.9474" y="248.3832" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--primary-text)">Web servers, dev/test</text>
  <rect x="461.0526" y="81.6766" width="357.8947" height="173.6527" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="151.1377" text-anchor="middle" font-size="22.8971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">F-series</text>
  <text x="639.9999" y="203.2335" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--info-text)">Compute Optimized</text>
  <text x="639.9999" y="248.3832" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--info-text)">Batch, gaming, analytics</text>
  <rect x="882.1053" y="81.6766" width="357.8947" height="173.6527" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1061.0526" y="151.1377" text-anchor="middle" font-size="22.8971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">E/M-series</text>
  <text x="1061.0526" y="203.2335" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--ok-text)">Memory Optimized</text>
  <text x="1061.0526" y="248.3832" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--ok-text)">Databases, caching</text>
  <rect x="40" y="324.7904" width="357.8947" height="173.6527" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="218.9474" y="394.2515" text-anchor="middle" font-size="22.8971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">L-series</text>
  <text x="218.9474" y="446.3473" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--warn-text)">Storage Optimized</text>
  <text x="218.9474" y="491.497" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--warn-text)">Big data, SQL, NoSQL</text>
  <rect x="461.0526" y="324.7904" width="357.8947" height="173.6527" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="394.2515" text-anchor="middle" font-size="22.8971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">N-series</text>
  <text x="639.9999" y="446.3473" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--danger-text)">GPU Enabled</text>
  <text x="639.9999" y="491.497" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--danger-text)">ML, rendering, HPC</text>
  <rect x="882.1053" y="324.7904" width="357.8947" height="173.6527" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1061.0526" y="394.2515" text-anchor="middle" font-size="22.8971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">H-series</text>
  <text x="1061.0526" y="446.3473" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--primary-text)">High Performance</text>
  <text x="1061.0526" y="491.497" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--primary-text)">Simulations, modeling</text>
  <text x="650.5263" y="620" text-anchor="middle" font-size="20.8155" fill="var(--text-muted)" font-family="Arial, sans-serif">Tip: Start small, monitor, then right-size based on actual usage</text>
</svg>

  <rect x="40" y="239.375045664064" width="288.8889" height="163.125084804691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.129845148014" filter="url(#shadow)"/>
  <text x="184.4445" y="311.874967382811" text-anchor="middle" font-size="24.033590364076" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">VM Instance 1</text>
  <text x="184.4445" y="366.249960859373" text-anchor="middle" font-size="21.848709225152" font-family="Arial, sans-serif" fill="var(--primary-text)">Running</text>
  <rect x="495.5555" y="239.375045664064" width="288.8889" height="163.125084804691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.129845148014" filter="url(#shadow)"/>
  <text x="639.9999" y="311.874967382811" text-anchor="middle" font-size="24.033590364076" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">VM Instance 2</text>
  <text x="639.9999" y="366.249960859373" text-anchor="middle" font-size="21.848709225152" font-family="Arial, sans-serif" fill="var(--primary-text)">Running</text>
  <rect x="951.1111" y="239.375045664064" width="288.8889" height="163.125084804691" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.129845148014" filter="url(#shadow)"/>
  <text x="1095.5554" y="311.874967382811" text-anchor="middle" font-size="24.033590364076" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">VM Instance N</text>
  <text x="1095.5554" y="366.249960859373" text-anchor="middle" font-size="21.848709225152" font-family="Arial, sans-serif" fill="var(--ok-text)">Auto-scaled</text>
  <rect x="195.5555" y="474.999947812498" width="400" height="145.000052187502" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.129845148014" filter="url(#shadow)"/>
  <text x="395.5555" y="536.624933460935" text-anchor="middle" font-size="21.848709225152" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Scaling Rules</text>
  <text x="395.5555" y="590.999926937497" text-anchor="middle" font-size="21.848709225152" font-family="Arial, sans-serif" fill="var(--info-text)">CPU &gt; 75% = scale out</text>
  <rect x="684.4444" y="474.999947812498" width="400" height="145.000052187502" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.129845148014" filter="url(#shadow)"/>
  <text x="884.4445" y="536.624933460935" text-anchor="middle" font-size="21.848709225152" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Health Probes</text>

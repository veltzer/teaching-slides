<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.6631" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">VM Scale Set Architecture</text>
  <rect x="417.7777" y="64.3114" width="444.4444" height="121.5569" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="140.7185" text-anchor="middle" font-size="23.5245" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Load Balancer</text>
  <line x1="484.4444" y1="185.8683" x2="195.5555" y2="255.3294" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="639.9999" y1="185.8683" x2="639.9999" y2="255.3294" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="795.5555" y1="185.8683" x2="1084.4445" y2="255.3294" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="255.3294" width="288.8889" height="156.2875" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="184.4445" y="324.7904" text-anchor="middle" font-size="23.5245" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">VM Instance 1</text>
  <text x="184.4445" y="376.8862" text-anchor="middle" font-size="21.3859" font-family="Arial, sans-serif" fill="var(--primary-text)">Running</text>
  <rect x="495.5555" y="255.3294" width="288.8889" height="156.2875" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="324.7904" text-anchor="middle" font-size="23.5245" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">VM Instance 2</text>
  <text x="639.9999" y="376.8862" text-anchor="middle" font-size="21.3859" font-family="Arial, sans-serif" fill="var(--primary-text)">Running</text>
  <rect x="951.1111" y="255.3294" width="288.8889" height="156.2875" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1095.5554" y="324.7904" text-anchor="middle" font-size="23.5245" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">VM Instance N</text>
  <text x="1095.5554" y="376.8862" text-anchor="middle" font-size="21.3859" font-family="Arial, sans-serif" fill="var(--ok-text)">Auto-scaled</text>
  <rect x="195.5555" y="481.0778" width="400" height="138.9222" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="395.5555" y="540.1197" text-anchor="middle" font-size="21.3859" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Scaling Rules</text>
  <text x="395.5555" y="592.2155" text-anchor="middle" font-size="21.3859" font-family="Arial, sans-serif" fill="var(--info-text)">CPU &gt; 75% = scale out</text>
  <rect x="684.4444" y="481.0778" width="400" height="138.9222" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="884.4445" y="540.1197" text-anchor="middle" font-size="21.3859" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Health Probes</text>
  <text x="884.4445" y="592.2155" text-anchor="middle" font-size="21.3859" font-family="Arial, sans-serif" fill="var(--danger-text)">Auto-replace unhealthy</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
    </defs>
  <ns0:text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold" fill="#333">Azure Container Services Overview</ns0:text>
  <ns0:rect x="20.5005" y="103.7838" width="369.009" height="259.4595" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="205.005" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">Container Instances</ns0:text>
  <ns0:text x="205.005" y="228.3243" text-anchor="middle" font-size="20.5005">Simplest option</ns0:text>
  <ns0:text x="205.005" y="276.7568" text-anchor="middle" font-size="20.5005">Single container/group</ns0:text>
  <ns0:text x="205.005" y="325.1892" text-anchor="middle" font-size="20.5005">Per-second billing</ns0:text>
  <ns0:rect x="430.5105" y="103.7838" width="369.009" height="259.4595" fill="#f3e5f5" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">AKS (Kubernetes)</ns0:text>
  <ns0:text x="615.015" y="228.3243" text-anchor="middle" font-size="20.5005">Full orchestration</ns0:text>
  <ns0:text x="615.015" y="276.7568" text-anchor="middle" font-size="20.5005">Auto-scaling, self-heal</ns0:text>
  <ns0:text x="615.015" y="325.1892" text-anchor="middle" font-size="20.5005">Microservices</ns0:text>
  <ns0:rect x="840.5206" y="103.7838" width="369.009" height="259.4595" fill="#e8f5e9" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="1025.0251" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">App Service</ns0:text>
  <ns0:text x="1025.0251" y="228.3243" text-anchor="middle" font-size="20.5005">Container support</ns0:text>
  <ns0:text x="1025.0251" y="276.7568" text-anchor="middle" font-size="20.5005">PaaS simplicity</ns0:text>
  <ns0:text x="1025.0251" y="325.1892" text-anchor="middle" font-size="20.5005">CI/CD built-in</ns0:text>
  <ns0:rect x="164.004" y="432.4324" width="902.0221" height="207.5676" fill="#fff3e0" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="615.015" y="501.6216" text-anchor="middle" font-size="22.5506" font-weight="bold">Azure Container Registry (ACR)</ns0:text>
  <ns0:text x="615.015" y="560.4324" text-anchor="middle" font-size="20.5005">Private Docker registry for all container services</ns0:text>
  <ns0:text x="615.015" y="612.3243" text-anchor="middle" font-size="20.5005">Geo-replication | Vulnerability scanning | Build tasks</ns0:text>
</ns0:svg>
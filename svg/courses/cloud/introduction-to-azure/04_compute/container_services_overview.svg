<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="372.4138" height="280.645199521329" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="226.2069" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Container Instances</text>
  <text x="226.2069" y="174.709622505728" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">Simplest option</text>
  <text x="226.2069" y="227.096871508837" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">Single container/group</text>
  <text x="226.2069" y="279.483905028093" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">Per-second billing</text>
  <rect x="453.7931" y="40" width="372.4138" height="280.645199521329" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="639.9999" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">AKS (Kubernetes)</text>
  <text x="639.9999" y="174.709622505728" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--info-text)">Full orchestration</text>
  <text x="639.9999" y="227.096871508837" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--info-text)">Auto-scaling, self-heal</text>
  <text x="639.9999" y="279.483905028093" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--info-text)">Microservices</text>
  <rect x="867.5862" y="40" width="372.4138" height="280.645199521329" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="1053.7931" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">App Service</text>
  <text x="1053.7931" y="174.709622505728" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">Container support</text>
  <text x="1053.7931" y="227.096871508837" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">PaaS simplicity</text>
  <text x="1053.7931" y="279.483905028093" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">CI/CD built-in</text>
  <rect x="184.8276" y="395.483818834552" width="910.3449" height="224.516181165448" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="639.9999" y="470.322545889701" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Azure Container Registry (ACR)</text>
  <text x="639.9999" y="533.935426176904" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">Private Docker registry for all container services</text>
  <text x="639.9999" y="590.064444532785" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">Geo-replication | Vulnerability scanning | Build tasks</text>
</svg>

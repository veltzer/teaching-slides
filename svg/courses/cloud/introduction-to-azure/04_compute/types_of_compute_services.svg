  <ns0:text x="153.7538" y="363.2432" text-anchor="middle" font-size="20.5005">Full OS control</ns0:text>
  <ns0:text x="153.7538" y="408.2162" text-anchor="middle" font-size="20.5005">Custom software</ns0:text>

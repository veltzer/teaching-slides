  <ns0:text x="727.7677" y="408.2162" text-anchor="middle" font-size="20.5005">Orchestration</ns0:text>
  <ns0:rect x="891.7718" y="190.2703" width="307.5075" height="242.1622" fill="#fff3e0" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="1045.5255" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">Azure Functions</ns0:text>
  <ns0:text x="1045.5255" y="311.3514" text-anchor="middle" font-size="20.5005">Serverless</ns0:text>
  <ns0:text x="1045.5255" y="363.2432" text-anchor="middle" font-size="20.5005">Event-driven</ns0:text>
  <ns0:text x="1045.5255" y="408.2162" text-anchor="middle" font-size="20.5005">Pay-per-execution</ns0:text>
  <ns0:rect x="205.005" y="501.6216" width="820.02" height="138.3784" fill="#ffebee" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="615.015" y="563.8919" text-anchor="middle" font-size="20.5005">Also: Container Instances (ACI) | Azure Batch | VM Scale Sets</ns0:text>
  <ns0:text x="615.015" y="615.7838" text-anchor="middle" font-size="20.5005">Choose based on control needs, scaling requirements, and cost</ns0:text>

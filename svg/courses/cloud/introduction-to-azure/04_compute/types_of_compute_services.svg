  <ns0:text x="440.7608" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">App Service</ns0:text>
  <ns0:text x="440.7608" y="311.3514" text-anchor="middle" font-size="20.5005">PaaS</ns0:text>
  <ns0:text x="440.7608" y="363.2432" text-anchor="middle" font-size="20.5005">Web apps, APIs</ns0:text>
  <ns0:text x="440.7608" y="408.2162" text-anchor="middle" font-size="20.5005">Managed runtime</ns0:text>

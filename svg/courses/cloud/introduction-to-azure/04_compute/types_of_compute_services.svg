<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold" fill="var(--text)">Azure Compute Services Spectrum</text>
  <text x="123.003" y="155.6757" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">More Control</text>
  <text x="1107.027" y="155.6757" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Less Control</text>
  <line x1="225.5055" y1="138.3784" x2="984.024" y2="138.3784" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrowd0_03_compute)" />
  <rect x="30.7508" y="190.2703" width="246.006" height="242.1622" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="153.7538" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">VMs</text>
  <text x="153.7538" y="311.3514" text-anchor="middle" font-size="20.5005">IaaS</text>
  <text x="153.7538" y="363.2432" text-anchor="middle" font-size="20.5005">Full OS control</text>
  <text x="153.7538" y="408.2162" text-anchor="middle" font-size="20.5005">Custom software</text>
  <rect x="317.7578" y="190.2703" width="246.006" height="242.1622" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="440.7608" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">App Service</text>
  <text x="440.7608" y="311.3514" text-anchor="middle" font-size="20.5005">PaaS</text>
  <text x="440.7608" y="363.2432" text-anchor="middle" font-size="20.5005">Web apps, APIs</text>
  <text x="440.7608" y="408.2162" text-anchor="middle" font-size="20.5005">Managed runtime</text>
  <rect x="604.7647" y="190.2703" width="246.006" height="242.1622" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="727.7677" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">AKS</text>
  <text x="727.7677" y="311.3514" text-anchor="middle" font-size="20.5005">Containers</text>
  <text x="727.7677" y="363.2432" text-anchor="middle" font-size="20.5005">Kubernetes</text>
  <text x="727.7677" y="408.2162" text-anchor="middle" font-size="20.5005">Orchestration</text>
  <rect x="891.7718" y="190.2703" width="307.5075" height="242.1622" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1045.5255" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">Azure Functions</text>
  <text x="1045.5255" y="311.3514" text-anchor="middle" font-size="20.5005">Serverless</text>
  <text x="1045.5255" y="363.2432" text-anchor="middle" font-size="20.5005">Event-driven</text>
  <text x="1045.5255" y="408.2162" text-anchor="middle" font-size="20.5005">Pay-per-execution</text>
  <rect x="205.005" y="501.6216" width="820.02" height="138.3784" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="563.8919" text-anchor="middle" font-size="20.5005">Also: Container Instances (ACI) | Azure Batch | VM Scale Sets</text>
  <text x="615.015" y="615.7838" text-anchor="middle" font-size="20.5005">Choose based on control needs, scaling requirements, and cost</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd0_03_compute" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
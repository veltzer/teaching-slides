<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.9786" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Azure Compute Services Spectrum</text>
  <text x="134.7368" y="133.7725" text-anchor="middle" font-size="20.8155" fill="var(--text-muted)" font-family="Arial, sans-serif">More Control</text>
  <text x="1145.2631" y="133.7725" text-anchor="middle" font-size="20.8155" fill="var(--text-muted)" font-family="Arial, sans-serif">Less Control</text>
  <line x1="239.9999" y1="116.4072" x2="1018.9473" y2="116.4072" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="168.503" width="252.6316" height="243.1138" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="166.3158" y="237.9641" text-anchor="middle" font-size="22.8971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">VMs</text>
  <text x="166.3158" y="290.0599" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--primary-text)">IaaS</text>
  <text x="166.3158" y="342.1556" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--primary-text)">Full OS control</text>
  <text x="166.3158" y="387.3054" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--primary-text)">Custom software</text>
  <rect x="334.7368" y="168.503" width="252.6316" height="243.1138" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="461.0526" y="237.9641" text-anchor="middle" font-size="22.8971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">App Service</text>
  <text x="461.0526" y="290.0599" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--info-text)">PaaS</text>
  <text x="461.0526" y="342.1556" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--info-text)">Web apps, APIs</text>
  <text x="461.0526" y="387.3054" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--info-text)">Managed runtime</text>
  <rect x="629.4736" y="168.503" width="252.6316" height="243.1138" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="755.7894" y="237.9641" text-anchor="middle" font-size="22.8971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">AKS</text>
  <text x="755.7894" y="290.0599" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--ok-text)">Containers</text>
  <text x="755.7894" y="342.1556" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--ok-text)">Kubernetes</text>
  <text x="755.7894" y="387.3054" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--ok-text)">Orchestration</text>
  <rect x="924.2105" y="168.503" width="315.7895" height="243.1138" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1082.1052" y="237.9641" text-anchor="middle" font-size="22.8971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Azure Functions</text>
  <text x="1082.1052" y="290.0599" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--warn-text)">Serverless</text>
  <text x="1082.1052" y="342.1556" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--warn-text)">Event-driven</text>
  <text x="1082.1052" y="387.3054" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--warn-text)">Pay-per-execution</text>
  <rect x="218.9473" y="481.0778" width="842.1053" height="138.9222" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="543.5928" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--danger-text)">Also: Container Instances (ACI) | Azure Batch | VM Scale Sets</text>
  <text x="639.9999" y="595.6886" text-anchor="middle" font-size="20.8155" font-family="Arial, sans-serif" fill="var(--danger-text)">Choose based on control needs, scaling requirements, and cost</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.9786" font-weight="bold" fill="var(--text)">Azure Compute Services Spectrum</text>
  <text x="134.7368" y="133.7725" text-anchor="middle" font-size="20.8155" fill="var(--text-muted)">More Control</text>
  <text x="1145.2631" y="133.7725" text-anchor="middle" font-size="20.8155" fill="var(--text-muted)">Less Control</text>
  <line x1="239.9999" y1="116.4072" x2="1018.9473" y2="116.4072" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrowd0_03_compute)" />
  <rect x="40" y="168.503" width="252.6316" height="243.1138" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="166.3158" y="237.9641" text-anchor="middle" font-size="22.8971" font-weight="bold">VMs</text>
  <text x="166.3158" y="290.0599" text-anchor="middle" font-size="20.8155">IaaS</text>
  <text x="166.3158" y="342.1556" text-anchor="middle" font-size="20.8155">Full OS control</text>
  <text x="166.3158" y="387.3054" text-anchor="middle" font-size="20.8155">Custom software</text>
  <rect x="334.7368" y="168.503" width="252.6316" height="243.1138" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="461.0526" y="237.9641" text-anchor="middle" font-size="22.8971" font-weight="bold">App Service</text>
  <text x="461.0526" y="290.0599" text-anchor="middle" font-size="20.8155">PaaS</text>
  <text x="461.0526" y="342.1556" text-anchor="middle" font-size="20.8155">Web apps, APIs</text>
  <text x="461.0526" y="387.3054" text-anchor="middle" font-size="20.8155">Managed runtime</text>
  <rect x="629.4736" y="168.503" width="252.6316" height="243.1138" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="755.7894" y="237.9641" text-anchor="middle" font-size="22.8971" font-weight="bold">AKS</text>
  <text x="755.7894" y="290.0599" text-anchor="middle" font-size="20.8155">Containers</text>
  <text x="755.7894" y="342.1556" text-anchor="middle" font-size="20.8155">Kubernetes</text>
  <text x="755.7894" y="387.3054" text-anchor="middle" font-size="20.8155">Orchestration</text>
  <rect x="924.2105" y="168.503" width="315.7895" height="243.1138" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1082.1052" y="237.9641" text-anchor="middle" font-size="22.8971" font-weight="bold">Azure Functions</text>
  <text x="1082.1052" y="290.0599" text-anchor="middle" font-size="20.8155">Serverless</text>
  <text x="1082.1052" y="342.1556" text-anchor="middle" font-size="20.8155">Event-driven</text>
  <text x="1082.1052" y="387.3054" text-anchor="middle" font-size="20.8155">Pay-per-execution</text>
  <rect x="218.9473" y="481.0778" width="842.1053" height="138.9222" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="639.9999" y="543.5928" text-anchor="middle" font-size="20.8155">Also: Container Instances (ACI) | Azure Batch | VM Scale Sets</text>
  <text x="639.9999" y="595.6886" text-anchor="middle" font-size="20.8155">Choose based on control needs, scaling requirements, and cost</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd0_03_compute" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
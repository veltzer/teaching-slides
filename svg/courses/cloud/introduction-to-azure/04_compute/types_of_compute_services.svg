  <text x="1107.027" y="155.6757" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Less Control</text>
  <line x1="225.5055" y1="138.3784" x2="984.024" y2="138.3784" stroke="var(--text-faintest)" stroke-width="2.05" marker-end="url(#arrowd0_03_compute)" />
  <rect x="30.7508" y="190.2703" width="246.006" height="242.1622" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="153.7538" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">VMs</text>
  <text x="153.7538" y="311.3514" text-anchor="middle" font-size="20.5005">IaaS</text>
  <text x="153.7538" y="363.2432" text-anchor="middle" font-size="20.5005">Full OS control</text>
  <text x="153.7538" y="408.2162" text-anchor="middle" font-size="20.5005">Custom software</text>
  <rect x="317.7578" y="190.2703" width="246.006" height="242.1622" fill="var(--info-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="440.7608" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">App Service</text>
  <text x="440.7608" y="311.3514" text-anchor="middle" font-size="20.5005">PaaS</text>
  <text x="440.7608" y="363.2432" text-anchor="middle" font-size="20.5005">Web apps, APIs</text>
  <text x="440.7608" y="408.2162" text-anchor="middle" font-size="20.5005">Managed runtime</text>
  <rect x="604.7647" y="190.2703" width="246.006" height="242.1622" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="727.7677" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">AKS</text>
  <text x="727.7677" y="311.3514" text-anchor="middle" font-size="20.5005">Containers</text>
  <text x="727.7677" y="363.2432" text-anchor="middle" font-size="20.5005">Kubernetes</text>
  <text x="727.7677" y="408.2162" text-anchor="middle" font-size="20.5005">Orchestration</text>
  <rect x="891.7718" y="190.2703" width="307.5075" height="242.1622" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="1045.5255" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">Azure Functions</text>
  <text x="1045.5255" y="311.3514" text-anchor="middle" font-size="20.5005">Serverless</text>
  <text x="1045.5255" y="363.2432" text-anchor="middle" font-size="20.5005">Event-driven</text>
  <text x="1045.5255" y="408.2162" text-anchor="middle" font-size="20.5005">Pay-per-execution</text>
  <rect x="205.005" y="501.6216" width="820.02" height="138.3784" fill="var(--danger-pale)" stroke="var(--text-dark)" stroke-width="2.05" rx="10.2503" />
  <text x="615.015" y="563.8919" text-anchor="middle" font-size="20.5005">Also: Container Instances (ACI) | Azure Batch | VM Scale Sets</text>
  <text x="615.015" y="615.7838" text-anchor="middle" font-size="20.5005">Choose based on control needs, scaling requirements, and cost</text>

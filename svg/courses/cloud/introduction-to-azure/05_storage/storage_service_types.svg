<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="24.7623" font-weight="bold" fill="var(--text)">Azure Storage Service Types</text>
  <rect x="40" y="81.6766" width="279.3104" height="277.8444" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="178.6208" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold">Blob Storage</text>
  <text x="178.6208" y="206.7065" text-anchor="middle" font-size="20.6353">Unstructured data</text>
  <text x="178.6208" y="255.3294" text-anchor="middle" font-size="20.6353">Images, videos</text>
  <text x="178.6208" y="303.9521" text-anchor="middle" font-size="20.6353">Backups, logs</text>
  <rect x="340.0001" y="81.6766" width="279.3104" height="277.8444" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="478.6207" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold">File Storage</text>
  <text x="478.6207" y="206.7065" text-anchor="middle" font-size="20.6353">SMB file shares</text>
  <text x="478.6207" y="255.3294" text-anchor="middle" font-size="20.6353">Lift-and-shift</text>
  <text x="478.6207" y="303.9521" text-anchor="middle" font-size="20.6353">Hybrid scenarios</text>
  <rect x="640.0001" y="81.6766" width="279.3104" height="277.8444" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="778.6207" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold">Table Storage</text>
  <text x="778.6207" y="206.7065" text-anchor="middle" font-size="20.6353">NoSQL key-value</text>
  <text x="778.6207" y="255.3294" text-anchor="middle" font-size="20.6353">Structured data</text>
  <text x="778.6207" y="303.9521" text-anchor="middle" font-size="20.6353">Schema-less</text>
  <rect x="940" y="81.6766" width="300" height="277.8444" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1088.9656" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold">Queue Storage</text>
  <text x="1088.9656" y="206.7065" text-anchor="middle" font-size="20.6353">Message queuing</text>
  <text x="1088.9656" y="255.3294" text-anchor="middle" font-size="20.6353">Async processing</text>
  <text x="1088.9656" y="303.9521" text-anchor="middle" font-size="20.6353">App decoupling</text>
  <rect x="226.2069" y="428.982" width="827.5863" height="191.018" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="498.4431" text-anchor="middle" font-size="22.6989" font-weight="bold">Storage Account (Unique namespace)</text>
  <text x="640.0001" y="557.485" text-anchor="middle" font-size="20.6353">All services share: encryption, redundancy, access keys, firewalls</text>
  <text x="640.0001" y="602.6347" text-anchor="middle" font-size="20.6353">Endpoint: https://&lt;account&gt;.blob|file|table|queue.core.windows.net</text>
</svg>
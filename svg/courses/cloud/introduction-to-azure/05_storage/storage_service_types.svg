<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Azure Storage Service Types</text>
  <rect x="21.3333" y="108" width="288" height="288" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="164.2667" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">Blob Storage</text>
  <text x="164.2667" y="237.6" text-anchor="middle" font-size="21.3333">Unstructured data</text>
  <text x="164.2667" y="288" text-anchor="middle" font-size="21.3333">Images, videos</text>
  <text x="164.2667" y="338.4" text-anchor="middle" font-size="21.3333">Backups, logs</text>
  <rect x="330.6667" y="108" width="288" height="288" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="473.6" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">File Storage</text>
  <text x="473.6" y="237.6" text-anchor="middle" font-size="21.3333">SMB file shares</text>
  <text x="473.6" y="288" text-anchor="middle" font-size="21.3333">Lift-and-shift</text>
  <text x="473.6" y="338.4" text-anchor="middle" font-size="21.3333">Hybrid scenarios</text>
  <rect x="640" y="108" width="288" height="288" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="782.9333" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">Table Storage</text>
  <text x="782.9333" y="237.6" text-anchor="middle" font-size="21.3333">NoSQL key-value</text>
  <text x="782.9333" y="288" text-anchor="middle" font-size="21.3333">Structured data</text>
  <text x="782.9333" y="338.4" text-anchor="middle" font-size="21.3333">Schema-less</text>
  <rect x="949.3333" y="108" width="309.3333" height="288" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1102.9333" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">Queue Storage</text>
  <text x="1102.9333" y="237.6" text-anchor="middle" font-size="21.3333">Message queuing</text>
  <text x="1102.9333" y="288" text-anchor="middle" font-size="21.3333">Async processing</text>
  <text x="1102.9333" y="338.4" text-anchor="middle" font-size="21.3333">App decoupling</text>
  <rect x="213.3333" y="468" width="853.3333" height="198" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="540" text-anchor="middle" font-size="23.4667" font-weight="bold">Storage Account (Unique namespace)</text>
  <text x="640" y="601.2" text-anchor="middle" font-size="21.3333">All services share: encryption, redundancy, access keys, firewalls</text>
  <text x="640" y="648" text-anchor="middle" font-size="21.3333">Endpoint: https://&lt;account&gt;.blob|file|table|queue.core.windows.net</text>
</svg>
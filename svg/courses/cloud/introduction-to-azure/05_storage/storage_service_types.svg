<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="24.7623" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Azure Storage Service Types</text>
  <rect x="40" y="81.6766" width="279.3104" height="277.8444" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="178.6208" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Blob Storage</text>
  <text x="178.6208" y="206.7065" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--primary-text)">Unstructured data</text>
  <text x="178.6208" y="255.3294" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--primary-text)">Images, videos</text>
  <text x="178.6208" y="303.9521" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--primary-text)">Backups, logs</text>
  <rect x="340.0001" y="81.6766" width="279.3104" height="277.8444" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="478.6207" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">File Storage</text>
  <text x="478.6207" y="206.7065" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--info-text)">SMB file shares</text>
  <text x="478.6207" y="255.3294" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--info-text)">Lift-and-shift</text>
  <text x="478.6207" y="303.9521" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--info-text)">Hybrid scenarios</text>
  <rect x="640.0001" y="81.6766" width="279.3104" height="277.8444" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="778.6207" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Table Storage</text>
  <text x="778.6207" y="206.7065" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--ok-text)">NoSQL key-value</text>
  <text x="778.6207" y="255.3294" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--ok-text)">Structured data</text>
  <text x="778.6207" y="303.9521" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--ok-text)">Schema-less</text>
  <rect x="940" y="81.6766" width="300" height="277.8444" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1088.9656" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Queue Storage</text>
  <text x="1088.9656" y="206.7065" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--warn-text)">Message queuing</text>
  <text x="1088.9656" y="255.3294" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--warn-text)">Async processing</text>
  <text x="1088.9656" y="303.9521" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--warn-text)">App decoupling</text>
  <rect x="226.2069" y="428.982" width="827.5863" height="191.018" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="498.4431" text-anchor="middle" font-size="22.6989" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Storage Account (Unique namespace)</text>
  <text x="640.0001" y="557.485" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--danger-text)">All services share: encryption, redundancy, access keys, firewalls</text>
  <text x="640.0001" y="602.6347" text-anchor="middle" font-size="20.6353" font-family="Arial, sans-serif" fill="var(--danger-text)">Endpoint: https://&lt;account&gt;.blob|file|table|queue.core.windows.net</text>
</svg>
    </defs>
  <ns0:text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold" fill="#333">Azure Storage Service Types</ns0:text>
  <ns0:rect x="20.5005" y="103.7838" width="276.7568" height="276.7568" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="157.8539" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">Blob Storage</ns0:text>
  <ns0:text x="157.8539" y="228.3243" text-anchor="middle" font-size="20.5005">Unstructured data</ns0:text>
  <ns0:text x="157.8539" y="276.7568" text-anchor="middle" font-size="20.5005">Images, videos</ns0:text>
  <ns0:text x="157.8539" y="325.1892" text-anchor="middle" font-size="20.5005">Backups, logs</ns0:text>
  <ns0:rect x="317.7578" y="103.7838" width="276.7568" height="276.7568" fill="#f3e5f5" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="455.1111" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">File Storage</ns0:text>
  <ns0:text x="455.1111" y="228.3243" text-anchor="middle" font-size="20.5005">SMB file shares</ns0:text>
  <ns0:text x="455.1111" y="276.7568" text-anchor="middle" font-size="20.5005">Lift-and-shift</ns0:text>
  <ns0:text x="455.1111" y="325.1892" text-anchor="middle" font-size="20.5005">Hybrid scenarios</ns0:text>
  <ns0:rect x="615.015" y="103.7838" width="276.7568" height="276.7568" fill="#e8f5e9" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="752.3683" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">Table Storage</ns0:text>
  <ns0:text x="752.3683" y="228.3243" text-anchor="middle" font-size="20.5005">NoSQL key-value</ns0:text>
  <ns0:text x="752.3683" y="276.7568" text-anchor="middle" font-size="20.5005">Structured data</ns0:text>
  <ns0:text x="752.3683" y="325.1892" text-anchor="middle" font-size="20.5005">Schema-less</ns0:text>
  <ns0:rect x="912.2722" y="103.7838" width="297.2572" height="276.7568" fill="#fff3e0" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="1059.8758" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">Queue Storage</ns0:text>
  <ns0:text x="1059.8758" y="228.3243" text-anchor="middle" font-size="20.5005">Message queuing</ns0:text>
  <ns0:text x="1059.8758" y="276.7568" text-anchor="middle" font-size="20.5005">Async processing</ns0:text>
  <ns0:text x="1059.8758" y="325.1892" text-anchor="middle" font-size="20.5005">App decoupling</ns0:text>
  <ns0:rect x="205.005" y="449.7297" width="820.02" height="190.2703" fill="#ffebee" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="615.015" y="518.9189" text-anchor="middle" font-size="22.5506" font-weight="bold">Storage Account (Unique namespace)</ns0:text>
  <ns0:text x="615.015" y="577.7297" text-anchor="middle" font-size="20.5005">All services share: encryption, redundancy, access keys, firewalls</ns0:text>
  <ns0:text x="615.015" y="622.7027" text-anchor="middle" font-size="20.5005">Endpoint: https://&lt;account&gt;.blob|file|table|queue.core.windows.net</ns0:text>
</ns0:svg>
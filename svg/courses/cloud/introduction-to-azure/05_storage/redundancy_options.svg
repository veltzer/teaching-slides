<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="268.9655" height="261.93549082206" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="174.4828" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">LRS</text>
  <text x="174.4828" y="170.96774541103" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">3 copies in</text>
  <text x="174.4828" y="219.612901835588" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">1 data center</text>
  <text x="174.4828" y="275.741920191469" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--primary-text)">99.999999999%</text>
  <rect x="340" y="40" width="268.9655" height="261.93549082206" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="474.4827" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">ZRS</text>
  <text x="474.4827" y="170.96774541103" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--info-text)">3 copies across</text>
  <text x="474.4827" y="219.612901835588" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--info-text)">3 avail. zones</text>
  <text x="474.4827" y="275.741920191469" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--info-text)">99.9999999999%</text>
  <rect x="660.6896" y="40" width="268.9655" height="261.93549082206" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="795.1724" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">GRS</text>
  <text x="795.1724" y="170.96774541103" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">6 copies across</text>
  <text x="795.1724" y="219.612901835588" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">2 regions</text>
  <text x="795.1724" y="275.741920191469" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--ok-text)">99.99999999999999%</text>
  <rect x="960.6896" y="40" width="279.3104" height="261.93549082206" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="1099.3103" y="114.838727055149" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">GZRS</text>
  <text x="1099.3103" y="170.96774541103" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">ZRS + GRS</text>
  <text x="1099.3103" y="219.612901835588" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">Best durability</text>
  <text x="1099.3103" y="275.741920191469" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--warn-text)">Highest redundancy</text>
  <line x1="308.9655" y1="170.96774541103" x2="340" y2="170.96774541103" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="608.9655" y1="170.96774541103" x2="660.6896" y2="170.96774541103" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="929.6552" y1="170.96774541103" x2="960.6896" y2="170.96774541103" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="143.4483" y="376.774217877209" width="993.1034" height="243.225782122791" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="639.9999" y="451.612837190432" text-anchor="middle" font-size="23.561187707142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Cost vs. Durability Tradeoff</text>
  <text x="639.9999" y="518.967702314259" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--danger-text)">LRS (lowest cost) -----&gt; GZRS (highest cost, best protection)</text>
  <text x="639.9999" y="582.580690343388" text-anchor="middle" font-size="21.41919549816" font-family="Arial, sans-serif" fill="var(--danger-text)">RA-GRS/RA-GZRS: Add read access from secondary region</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Storage Redundancy Options</text>
  <rect x="21.3333" y="108" width="277.3333" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="160" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">LRS</text>
  <text x="160" y="234" text-anchor="middle" font-size="21.3333">3 copies in</text>
  <text x="160" y="280.8" text-anchor="middle" font-size="21.3333">1 data center</text>
  <text x="160" y="334.8" text-anchor="middle" font-size="21.3333">99.999999999%</text>
  <rect x="330.6667" y="108" width="277.3333" height="252" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="469.3333" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">ZRS</text>
  <text x="469.3333" y="234" text-anchor="middle" font-size="21.3333">3 copies across</text>
  <text x="469.3333" y="280.8" text-anchor="middle" font-size="21.3333">3 avail. zones</text>
  <text x="469.3333" y="334.8" text-anchor="middle" font-size="21.3333">99.9999999999%</text>
  <rect x="661.3333" y="108" width="277.3333" height="252" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="800" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">GRS</text>
  <text x="800" y="234" text-anchor="middle" font-size="21.3333">6 copies across</text>
  <text x="800" y="280.8" text-anchor="middle" font-size="21.3333">2 regions</text>
  <text x="800" y="334.8" text-anchor="middle" font-size="21.3333">99.99999999999999%</text>
  <rect x="970.6667" y="108" width="288" height="252" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1113.6" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">GZRS</text>
  <text x="1113.6" y="234" text-anchor="middle" font-size="21.3333">ZRS + GRS</text>
  <text x="1113.6" y="280.8" text-anchor="middle" font-size="21.3333">Best durability</text>
  <text x="1113.6" y="334.8" text-anchor="middle" font-size="21.3333">Highest redundancy</text>
  <line x1="298.6667" y1="234" x2="330.6667" y2="234" stroke="#333" stroke-width="2.1333" marker-end="url(#arrowd1_04_storage)" />
  <line x1="608" y1="234" x2="661.3333" y2="234" stroke="#333" stroke-width="2.1333" marker-end="url(#arrowd1_04_storage)" />
  <line x1="938.6667" y1="234" x2="970.6667" y2="234" stroke="#333" stroke-width="2.1333" marker-end="url(#arrowd1_04_storage)" />
  <rect x="128" y="432" width="1024" height="234" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="504" text-anchor="middle" font-size="23.4667" font-weight="bold">Cost vs. Durability Tradeoff</text>
  <text x="640" y="568.8" text-anchor="middle" font-size="21.3333">LRS (lowest cost) -----&gt; GZRS (highest cost, best protection)</text>
  <text x="640" y="630" text-anchor="middle" font-size="21.3333">RA-GRS/RA-GZRS: Add read access from secondary region</text>
  <defs>
    <marker id="arrowd1_04_storage" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
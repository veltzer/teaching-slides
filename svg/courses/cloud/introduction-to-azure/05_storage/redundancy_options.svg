  <!-- palette: resources/palette_diagram.yaml -->
  <text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold" fill="var(--text-dark)">Storage Redundancy Options</text>
  <rect x="20.5005" y="103.7838" width="266.5065" height="242.1622" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="153.7538" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">LRS</text>
  <text x="153.7538" y="224.8649" text-anchor="middle" font-size="20.5005">3 copies in</text>
  <text x="153.7538" y="269.8378" text-anchor="middle" font-size="20.5005">1 data center</text>
  <text x="153.7538" y="321.7297" text-anchor="middle" font-size="20.5005">99.999999999%</text>
  <rect x="317.7578" y="103.7838" width="266.5065" height="242.1622" fill="var(--info-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="451.011" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">ZRS</text>
  <text x="451.011" y="224.8649" text-anchor="middle" font-size="20.5005">3 copies across</text>
  <text x="451.011" y="269.8378" text-anchor="middle" font-size="20.5005">3 avail. zones</text>
  <text x="451.011" y="321.7297" text-anchor="middle" font-size="20.5005">99.9999999999%</text>
  <rect x="635.5155" y="103.7838" width="266.5065" height="242.1622" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="768.7688" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">GRS</text>
  <text x="768.7688" y="224.8649" text-anchor="middle" font-size="20.5005">6 copies across</text>
  <text x="768.7688" y="269.8378" text-anchor="middle" font-size="20.5005">2 regions</text>
  <text x="768.7688" y="321.7297" text-anchor="middle" font-size="20.5005">99.99999999999999%</text>
  <rect x="932.7728" y="103.7838" width="276.7568" height="242.1622" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="1070.1261" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">GZRS</text>
  <text x="1070.1261" y="224.8649" text-anchor="middle" font-size="20.5005">ZRS + GRS</text>
  <text x="1070.1261" y="269.8378" text-anchor="middle" font-size="20.5005">Best durability</text>
  <text x="1070.1261" y="321.7297" text-anchor="middle" font-size="20.5005">Highest redundancy</text>
  <line x1="287.007" y1="224.8649" x2="317.7578" y2="224.8649" stroke="var(--text-dark)" stroke-width="2.05" marker-end="url(#arrowd1_04_storage)" />
  <line x1="584.2643" y1="224.8649" x2="635.5155" y2="224.8649" stroke="var(--text-dark)" stroke-width="2.05" marker-end="url(#arrowd1_04_storage)" />
  <line x1="902.0221" y1="224.8649" x2="932.7728" y2="224.8649" stroke="var(--text-dark)" stroke-width="2.05" marker-end="url(#arrowd1_04_storage)" />
  <rect x="123.003" y="415.1351" width="984.024" height="224.8649" fill="var(--danger-pale)" stroke="var(--text-dark)" stroke-width="2.05" rx="10.2503" />
  <text x="615.015" y="484.3243" text-anchor="middle" font-size="22.5506" font-weight="bold">Cost vs. Durability Tradeoff</text>
  <text x="615.015" y="546.5946" text-anchor="middle" font-size="20.5005">LRS (lowest cost) -----&gt; GZRS (highest cost, best protection)</text>
  <text x="615.015" y="605.4054" text-anchor="middle" font-size="20.5005">RA-GRS/RA-GZRS: Add read access from secondary region</text>

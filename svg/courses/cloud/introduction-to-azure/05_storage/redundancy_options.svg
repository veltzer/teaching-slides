<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold" fill="#333">Storage Redundancy Options</ns0:text>
  <ns0:rect x="20.5005" y="103.7838" width="266.5065" height="242.1622" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="153.7538" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">LRS</ns0:text>
  <ns0:text x="153.7538" y="224.8649" text-anchor="middle" font-size="20.5005">3 copies in</ns0:text>
  <ns0:text x="153.7538" y="269.8378" text-anchor="middle" font-size="20.5005">1 data center</ns0:text>
  <ns0:text x="153.7538" y="321.7297" text-anchor="middle" font-size="20.5005">99.999999999%</ns0:text>
  <ns0:rect x="317.7578" y="103.7838" width="266.5065" height="242.1622" fill="#f3e5f5" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="451.011" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">ZRS</ns0:text>
  <ns0:text x="451.011" y="224.8649" text-anchor="middle" font-size="20.5005">3 copies across</ns0:text>
  <ns0:text x="451.011" y="269.8378" text-anchor="middle" font-size="20.5005">3 avail. zones</ns0:text>
  <ns0:text x="451.011" y="321.7297" text-anchor="middle" font-size="20.5005">99.9999999999%</ns0:text>
  <ns0:rect x="635.5155" y="103.7838" width="266.5065" height="242.1622" fill="#e8f5e9" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="768.7688" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">GRS</ns0:text>
  <ns0:text x="768.7688" y="224.8649" text-anchor="middle" font-size="20.5005">6 copies across</ns0:text>
  <ns0:text x="768.7688" y="269.8378" text-anchor="middle" font-size="20.5005">2 regions</ns0:text>
  <ns0:text x="768.7688" y="321.7297" text-anchor="middle" font-size="20.5005">99.99999999999999%</ns0:text>
  <ns0:rect x="932.7728" y="103.7838" width="276.7568" height="242.1622" fill="#fff3e0" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="1070.1261" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">GZRS</ns0:text>
  <ns0:text x="1070.1261" y="224.8649" text-anchor="middle" font-size="20.5005">ZRS + GRS</ns0:text>
  <ns0:text x="1070.1261" y="269.8378" text-anchor="middle" font-size="20.5005">Best durability</ns0:text>
  <ns0:text x="1070.1261" y="321.7297" text-anchor="middle" font-size="20.5005">Highest redundancy</ns0:text>
  <ns0:line x1="287.007" y1="224.8649" x2="317.7578" y2="224.8649" stroke="#333" stroke-width="2.05" marker-end="url(#arrowd1_04_storage)" />
  <ns0:line x1="584.2643" y1="224.8649" x2="635.5155" y2="224.8649" stroke="#333" stroke-width="2.05" marker-end="url(#arrowd1_04_storage)" />
  <ns0:line x1="902.0221" y1="224.8649" x2="932.7728" y2="224.8649" stroke="#333" stroke-width="2.05" marker-end="url(#arrowd1_04_storage)" />
  <ns0:rect x="123.003" y="415.1351" width="984.024" height="224.8649" fill="#ffebee" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="615.015" y="484.3243" text-anchor="middle" font-size="22.5506" font-weight="bold">Cost vs. Durability Tradeoff</ns0:text>
  <ns0:text x="615.015" y="546.5946" text-anchor="middle" font-size="20.5005">LRS (lowest cost) -----&gt; GZRS (highest cost, best protection)</ns0:text>
  <ns0:text x="615.015" y="605.4054" text-anchor="middle" font-size="20.5005">RA-GRS/RA-GZRS: Add read access from secondary region</ns0:text>
  <ns0:defs>

    <!-- Gradients -->

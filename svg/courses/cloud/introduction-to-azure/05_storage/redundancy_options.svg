<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold" fill="var(--text)">Storage Redundancy Options</text>
  <rect x="20.5005" y="103.7838" width="266.5065" height="242.1622" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="153.7538" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">LRS</text>
  <text x="153.7538" y="224.8649" text-anchor="middle" font-size="20.5005">3 copies in</text>
  <text x="153.7538" y="269.8378" text-anchor="middle" font-size="20.5005">1 data center</text>
  <text x="153.7538" y="321.7297" text-anchor="middle" font-size="20.5005">99.999999999%</text>
  <rect x="317.7578" y="103.7838" width="266.5065" height="242.1622" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="451.011" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">ZRS</text>
  <text x="451.011" y="224.8649" text-anchor="middle" font-size="20.5005">3 copies across</text>
  <text x="451.011" y="269.8378" text-anchor="middle" font-size="20.5005">3 avail. zones</text>
  <text x="451.011" y="321.7297" text-anchor="middle" font-size="20.5005">99.9999999999%</text>
  <rect x="635.5155" y="103.7838" width="266.5065" height="242.1622" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="768.7688" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">GRS</text>
  <text x="768.7688" y="224.8649" text-anchor="middle" font-size="20.5005">6 copies across</text>
  <text x="768.7688" y="269.8378" text-anchor="middle" font-size="20.5005">2 regions</text>
  <text x="768.7688" y="321.7297" text-anchor="middle" font-size="20.5005">99.99999999999999%</text>
  <rect x="932.7728" y="103.7838" width="276.7568" height="242.1622" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1070.1261" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold">GZRS</text>
  <text x="1070.1261" y="224.8649" text-anchor="middle" font-size="20.5005">ZRS + GRS</text>
  <text x="1070.1261" y="269.8378" text-anchor="middle" font-size="20.5005">Best durability</text>
  <text x="1070.1261" y="321.7297" text-anchor="middle" font-size="20.5005">Highest redundancy</text>
  <line x1="287.007" y1="224.8649" x2="317.7578" y2="224.8649" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_04_storage)" />
  <line x1="584.2643" y1="224.8649" x2="635.5155" y2="224.8649" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_04_storage)" />
  <line x1="902.0221" y1="224.8649" x2="932.7728" y2="224.8649" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_04_storage)" />
  <rect x="123.003" y="415.1351" width="984.024" height="224.8649" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="484.3243" text-anchor="middle" font-size="22.5506" font-weight="bold">Cost vs. Durability Tradeoff</text>
  <text x="615.015" y="546.5946" text-anchor="middle" font-size="20.5005">LRS (lowest cost) -----&gt; GZRS (highest cost, best protection)</text>
  <text x="615.015" y="605.4054" text-anchor="middle" font-size="20.5005">RA-GRS/RA-GZRS: Add read access from secondary region</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_04_storage" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.7623" font-weight="bold" fill="var(--text)">Storage Redundancy Options</text>
  <rect x="40" y="81.6766" width="268.9655" height="243.1138" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="174.4828" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold">LRS</text>
  <text x="174.4828" y="203.2335" text-anchor="middle" font-size="20.6353">3 copies in</text>
  <text x="174.4828" y="248.3832" text-anchor="middle" font-size="20.6353">1 data center</text>
  <text x="174.4828" y="300.479" text-anchor="middle" font-size="20.6353">99.999999999%</text>
  <rect x="340" y="81.6766" width="268.9655" height="243.1138" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="474.4827" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold">ZRS</text>
  <text x="474.4827" y="203.2335" text-anchor="middle" font-size="20.6353">3 copies across</text>
  <text x="474.4827" y="248.3832" text-anchor="middle" font-size="20.6353">3 avail. zones</text>
  <text x="474.4827" y="300.479" text-anchor="middle" font-size="20.6353">99.9999999999%</text>
  <rect x="660.6896" y="81.6766" width="268.9655" height="243.1138" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="795.1724" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold">GRS</text>
  <text x="795.1724" y="203.2335" text-anchor="middle" font-size="20.6353">6 copies across</text>
  <text x="795.1724" y="248.3832" text-anchor="middle" font-size="20.6353">2 regions</text>
  <text x="795.1724" y="300.479" text-anchor="middle" font-size="20.6353">99.99999999999999%</text>
  <rect x="960.6896" y="81.6766" width="279.3104" height="243.1138" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1099.3103" y="151.1377" text-anchor="middle" font-size="22.6989" font-weight="bold">GZRS</text>
  <text x="1099.3103" y="203.2335" text-anchor="middle" font-size="20.6353">ZRS + GRS</text>
  <text x="1099.3103" y="248.3832" text-anchor="middle" font-size="20.6353">Best durability</text>
  <text x="1099.3103" y="300.479" text-anchor="middle" font-size="20.6353">Highest redundancy</text>
  <line x1="308.9655" y1="203.2335" x2="340" y2="203.2335" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_04_storage)" />
  <line x1="608.9655" y1="203.2335" x2="660.6896" y2="203.2335" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_04_storage)" />
  <line x1="929.6552" y1="203.2335" x2="960.6896" y2="203.2335" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_04_storage)" />
  <rect x="143.4483" y="394.2515" width="993.1034" height="225.7485" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="463.7125" text-anchor="middle" font-size="22.6989" font-weight="bold">Cost vs. Durability Tradeoff</text>
  <text x="639.9999" y="526.2275" text-anchor="middle" font-size="20.6353">LRS (lowest cost) -----&gt; GZRS (highest cost, best protection)</text>
  <text x="639.9999" y="585.2695" text-anchor="middle" font-size="20.6353">RA-GRS/RA-GZRS: Add read access from secondary region</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_04_storage" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
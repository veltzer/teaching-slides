<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000108695652" y="40" text-anchor="middle" font-size="25.867269057039" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Network Security: Firewalls, VNet rules, Private Endpoints</text>
  <rect x="40" y="78.955138115377" width="1200" height="541.044861884623" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.148649495978" filter="url(#shadow)"/>
  <text x="640.000108695652" y="156.86554494317" text-anchor="middle" font-size="25.867269057039" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Authentication: Shared Key, SAS Tokens, Azure AD</text>
  <rect x="92.173913043478" y="195.820813655587" width="1095.652065217391" height="367.910537424834" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.148649495978" filter="url(#shadow)"/>
  <text x="640.000108695652" y="273.73122048338" text-anchor="middle" font-size="25.867269057039" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Authorization: RBAC, ACLs, Stored Access Policies</text>
  <rect x="144.348043478261" y="308.358111494746" width="991.304347826087" height="207.761215471156" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.148649495978" filter="url(#shadow)"/>
  <text x="640.000108695652" y="386.268518322539" text-anchor="middle" font-size="25.867269057039" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Data Protection</text>
  <text x="640.000108695652" y="455.522300345272" text-anchor="middle" font-size="25.867269057039" font-family="Arial, sans-serif" fill="var(--primary-text)">Encryption at rest (SSE) | Encryption in transit (HTTPS/TLS)</text>
  <text x="640.000108695652" y="511.790949264852" text-anchor="middle" font-size="25.867269057039" font-family="Arial, sans-serif" fill="var(--primary-text)">Soft delete | Versioning | Immutable storage</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_07_security" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="634.6903" y="40" text-anchor="middle" font-size="27.7678" font-weight="bold" fill="var(--text)">Network Security Layers</text>
  <rect x="40" y="148.75" width="169.9115" height="145" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="124.9557" y="239.375" text-anchor="middle" font-size="23.4959" font-weight="bold">Internet</text>
  <rect x="273.6282" y="112.5" width="201.7699" height="199.375" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="373.4513" y="192.25" text-anchor="middle" font-size="23.4959" font-weight="bold">DDoS</text>
  <text x="373.4513" y="257.5" text-anchor="middle" font-size="21.3598">Protection</text>
  <rect x="539.115" y="112.5" width="201.7699" height="199.375" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="638.9381" y="192.25" text-anchor="middle" font-size="23.4959" font-weight="bold">WAF</text>
  <text x="638.9381" y="257.5" text-anchor="middle" font-size="21.3598">App Gateway</text>
  <rect x="804.6018" y="112.5" width="201.7699" height="199.375" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="904.4247" y="192.25" text-anchor="middle" font-size="23.4959" font-weight="bold">NSG</text>
  <text x="904.4247" y="257.5" text-anchor="middle" font-size="21.3598">Subnet Rules</text>
  <rect x="1070.0885" y="148.75" width="169.9115" height="145" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1155.0443" y="239.375" text-anchor="middle" font-size="23.4959" font-weight="bold">App</text>
  <rect x="422.3008" y="438.75" width="233.6284" height="181.25" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="539.115" y="518.5" text-anchor="middle" font-size="23.4959" font-weight="bold">Azure Firewall</text>
  <text x="539.115" y="576.5" text-anchor="middle" font-size="21.3598">L3-L7 Filtering</text>
  <rect x="740.885" y="438.75" width="233.6284" height="181.25" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="857.699" y="518.5" text-anchor="middle" font-size="23.4959" font-weight="bold">Private</text>
  <text x="857.699" y="576.5" text-anchor="middle" font-size="21.3598">Endpoints</text>
  <line x1="209.9114" y1="221.25" x2="269.3805" y2="210.375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_security)" />
  <line x1="475.3982" y1="210.375" x2="534.8671" y2="210.375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_security)" />
  <line x1="740.885" y1="210.375" x2="800.3539" y2="210.375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_security)" />
  <line x1="1006.3716" y1="221.25" x2="1065.8408" y2="221.25" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_security)" />
  <line x1="638.9381" y1="311.875" x2="581.5929" y2="431.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_security)" />
  <line x1="904.4247" y1="311.875" x2="878.938" y2="431.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_security)" />
</svg>
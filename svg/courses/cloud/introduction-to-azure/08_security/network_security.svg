<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="634.6903" y="40" text-anchor="middle" font-size="27.7678" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Network Security Layers</text>
  <rect x="40" y="148.75" width="169.9115" height="145" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="124.9557" y="239.375" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Internet</text>
  <rect x="273.6282" y="112.5" width="201.7699" height="199.375" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="373.4513" y="192.25" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">DDoS</text>
  <text x="373.4513" y="257.5" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--warn-text)">Protection</text>
  <rect x="539.115" y="112.5" width="201.7699" height="199.375" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="638.9381" y="192.25" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">WAF</text>
  <text x="638.9381" y="257.5" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--info-text)">App Gateway</text>
  <rect x="804.6018" y="112.5" width="201.7699" height="199.375" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="904.4247" y="192.25" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">NSG</text>
  <text x="904.4247" y="257.5" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--primary-text)">Subnet Rules</text>
  <rect x="1070.0885" y="148.75" width="169.9115" height="145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1155.0443" y="239.375" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">App</text>
  <rect x="422.3008" y="438.75" width="233.6284" height="181.25" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="539.115" y="518.5" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Azure Firewall</text>
  <text x="539.115" y="576.5" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--warn-text)">L3-L7 Filtering</text>
  <rect x="740.885" y="438.75" width="233.6284" height="181.25" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="857.699" y="518.5" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Private</text>
  <text x="857.699" y="576.5" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--primary-text)">Endpoints</text>
  <line x1="209.9114" y1="221.25" x2="269.3805" y2="210.375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="475.3982" y1="210.375" x2="534.8671" y2="210.375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="740.885" y1="210.375" x2="800.3539" y2="210.375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1006.3716" y1="221.25" x2="1065.8408" y2="221.25" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="638.9381" y1="311.875" x2="581.5929" y2="431.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="904.4247" y1="311.875" x2="878.938" y2="431.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
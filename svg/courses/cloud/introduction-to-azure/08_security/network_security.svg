  <rect x="1064.0329" y="177.7778" width="168.5597" height="142.2222" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="4.214" rx="10.535" />
  <text x="1148.3128" y="266.6667" text-anchor="middle" font-size="23.177" font-weight="bold">App</text>
  <rect x="421.3992" y="462.2222" width="231.7696" height="177.7778" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="4.214" rx="10.535" />

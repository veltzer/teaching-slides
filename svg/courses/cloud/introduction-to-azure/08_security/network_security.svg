<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_07_security" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="var(--text)">Network Security Layers</text>
  <rect x="42.14" y="177.7778" width="168.5597" height="142.2222" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="126.4198" y="266.6667" text-anchor="middle" font-size="23.177" font-weight="bold">Internet</text>
  <rect x="273.9094" y="142.2222" width="200.1646" height="195.5556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="372.9383" y="220.4444" text-anchor="middle" font-size="23.177" font-weight="bold">DDoS</text>
  <text x="372.9383" y="284.4444" text-anchor="middle" font-size="21.0699">Protection</text>
  <rect x="537.284" y="142.2222" width="200.1646" height="195.5556" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="636.3128" y="220.4444" text-anchor="middle" font-size="23.177" font-weight="bold">WAF</text>
  <text x="636.3128" y="284.4444" text-anchor="middle" font-size="21.0699">App Gateway</text>
  <rect x="800.6585" y="142.2222" width="200.1646" height="195.5556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="899.6872" y="220.4444" text-anchor="middle" font-size="23.177" font-weight="bold">NSG</text>
  <text x="899.6872" y="284.4444" text-anchor="middle" font-size="21.0699">Subnet Rules</text>
  <rect x="1064.0329" y="177.7778" width="168.5597" height="142.2222" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1148.3128" y="266.6667" text-anchor="middle" font-size="23.177" font-weight="bold">App</text>
  <rect x="421.3992" y="462.2222" width="231.7696" height="177.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="537.284" y="540.4444" text-anchor="middle" font-size="23.177" font-weight="bold">Azure Firewall</text>
  <text x="537.284" y="597.3333" text-anchor="middle" font-size="21.0699">L3-L7 Filtering</text>
  <rect x="737.4486" y="462.2222" width="231.7696" height="177.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="853.3333" y="540.4444" text-anchor="middle" font-size="23.177" font-weight="bold">Private</text>
  <text x="853.3333" y="597.3333" text-anchor="middle" font-size="21.0699">Endpoints</text>
  <line x1="210.6996" y1="248.8889" x2="269.6955" y2="238.2222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_security)" />
  <line x1="474.0741" y1="238.2222" x2="533.0699" y2="238.2222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_security)" />
  <line x1="737.4486" y1="238.2222" x2="796.4444" y2="238.2222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_security)" />
  <line x1="1000.823" y1="248.8889" x2="1059.819" y2="248.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_security)" />
  <line x1="636.3128" y1="337.7778" x2="579.4239" y2="455.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_security)" />
  <line x1="899.6872" y1="337.7778" x2="874.4033" y2="455.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_security)" />
</svg>
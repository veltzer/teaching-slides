  <text x="300" y="72" text-anchor="middle" font-size="10">Secrets &amp; Keys</text>
  <!-- Defender for Cloud -->
  <rect x="460" y="30" width="120" height="55" fill="#e8f5e9" stroke="#333" stroke-width="2" rx="5"/>

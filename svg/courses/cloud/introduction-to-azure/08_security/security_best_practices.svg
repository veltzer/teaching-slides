  <ns0:text x="632.0988" y="330.6667" text-anchor="middle" font-size="21.0699">Redundant controls</ns0:text>
  <ns0:rect x="863.8683" y="142.2222" width="358.1893" height="231.1111" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1042.963" y="220.4444" text-anchor="middle" font-size="25.284" font-weight="bold">Shared Model</ns0:text>
  <ns0:text x="1042.963" y="277.3333" text-anchor="middle" font-size="21.0699">Cloud provider duties</ns0:text>
  <ns0:text x="1042.963" y="330.6667" text-anchor="middle" font-size="21.0699">Customer duties</ns0:text>
  <ns0:rect x="147.4897" y="462.2222" width="294.9795" height="177.7778" fill="#fff3e0" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="294.9795" y="540.4444" text-anchor="middle" font-size="23.177" font-weight="bold">Encrypt Data</ns0:text>
  <ns0:text x="294.9795" y="597.3333" text-anchor="middle" font-size="21.0699">At rest &amp; in transit</ns0:text>
  <ns0:rect x="505.679" y="462.2222" width="294.9795" height="177.7778" fill="#ffebee" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="653.1687" y="540.4444" text-anchor="middle" font-size="23.177" font-weight="bold">Monitor &amp; Audit</ns0:text>

    </defs>
  <ns0:text x="632.0988" y="71.1111" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="#333">Security Best Practices Framework</ns0:text>
  <ns0:rect x="42.14" y="142.2222" width="358.1893" height="231.1111" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="221.2346" y="220.4444" text-anchor="middle" font-size="25.284" font-weight="bold">Zero Trust</ns0:text>
  <ns0:text x="221.2346" y="277.3333" text-anchor="middle" font-size="21.0699">Verify explicitly</ns0:text>
  <ns0:text x="221.2346" y="330.6667" text-anchor="middle" font-size="21.0699">Least privilege access</ns0:text>

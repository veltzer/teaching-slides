<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="214" width="207.6923" height="193.3334" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="143.8461" y="299.0667" text-anchor="middle" font-size="25.2947" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">User</text>
  <text x="143.8461" y="360.9333" text-anchor="middle" font-size="22.995" font-family="Arial, sans-serif" fill="var(--primary-text)">Sign-in</text>
  <rect x="339.9999" y="214" width="207.6923" height="193.3334" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="443.8461" y="299.0667" text-anchor="middle" font-size="25.2947" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">MFA</text>
  <text x="443.8461" y="360.9333" text-anchor="middle" font-size="22.995" font-family="Arial, sans-serif" fill="var(--warn-text)">Verify</text>
  <rect x="639.9999" y="214" width="253.8462" height="193.3334" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="766.9231" y="283.6" text-anchor="middle" font-size="25.2947" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Conditional</text>
  <text x="766.9231" y="349.3333" text-anchor="middle" font-size="22.995" font-family="Arial, sans-serif" fill="var(--info-text)">Access Policy</text>
  <rect x="986.1538" y="214" width="253.8462" height="193.3334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1113.0769" y="283.6" text-anchor="middle" font-size="25.2947" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Identity</text>
  <text x="1113.0769" y="349.3333" text-anchor="middle" font-size="22.995" font-family="Arial, sans-serif" fill="var(--ok-text)">Protection</text>
  <line x1="247.6923" y1="310.6667" x2="335.3846" y2="310.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="547.6922" y1="310.6667" x2="635.3846" y2="310.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="893.8461" y1="310.6667" x2="981.5385" y2="310.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="686.1538" y="40" text-anchor="middle" font-size="29.8936" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Identity Protection Flow</text>
  <text x="686.1538" y="620" text-anchor="middle" font-size="22.995" fill="var(--text-muted)" font-family="Arial, sans-serif">Risk detection → Policy evaluation → Adaptive response</text>
</svg>

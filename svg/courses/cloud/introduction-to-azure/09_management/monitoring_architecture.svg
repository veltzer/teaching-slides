<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="645.3098" y="40" text-anchor="middle" font-size="27.7678" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Monitoring Data Flow</text>
  <rect x="40" y="130.625" width="233.6284" height="199.375" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="156.8142" y="210.375" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Data Sources</text>
  <text x="156.8142" y="268.375" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--primary-text)">VMs, Apps, DBs</text>
  <rect x="347.9646" y="130.625" width="233.6284" height="199.375" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="464.7788" y="210.375" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Diagnostics</text>
  <text x="464.7788" y="268.375" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--warn-text)">Collection Rules</text>
  <rect x="655.9293" y="130.625" width="233.6284" height="199.375" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="772.7434" y="192.25" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Log Analytics</text>
  <text x="772.7434" y="250.25" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--info-text)">KQL Queries</text>
  <text x="772.7434" y="301" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--info-text)">Workspace</text>
  <rect x="963.8939" y="94.375" width="276.1061" height="126.875" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1101.947" y="177.75" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Alerts</text>
  <rect x="963.8939" y="257.5" width="276.1061" height="126.875" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1101.947" y="340.875" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Dashboards</text>
  <rect x="347.9646" y="438.75" width="276.1061" height="181.25" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="486.0178" y="511.25" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">App Insights</text>
  <text x="486.0178" y="576.5" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--ok-text)">APM Telemetry</text>
  <rect x="815.2214" y="438.75" width="276.1061" height="181.25" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="953.2744" y="511.25" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Action Groups</text>
  <text x="953.2744" y="576.5" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--warn-text)">Email / SMS / Webhook</text>
  <line x1="273.6284" y1="228.5" x2="343.7169" y2="228.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="581.593" y1="228.5" x2="651.6815" y2="228.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="889.5576" y1="185" x2="959.6461" y2="156" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="889.5576" y1="257.5" x2="959.6461" y2="301" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="624.0709" y1="493.125" x2="772.7434" y2="330.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1101.947" y1="221.25" x2="1016.9912" y2="431.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_08_management" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="var(--text)">Monitoring Data Flow</text>
  <rect x="31.6049" y="160" width="231.7696" height="195.5556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="147.4897" y="238.2222" text-anchor="middle" font-size="23.177" font-weight="bold">Data Sources</text>
  <text x="147.4897" y="295.1111" text-anchor="middle" font-size="21.0699">VMs, Apps, DBs</text>
  <rect x="337.1193" y="160" width="231.7696" height="195.5556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="453.0041" y="238.2222" text-anchor="middle" font-size="23.177" font-weight="bold">Diagnostics</text>
  <text x="453.0041" y="295.1111" text-anchor="middle" font-size="21.0699">Collection Rules</text>
  <rect x="642.6338" y="160" width="231.7696" height="195.5556" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="758.5185" y="220.4444" text-anchor="middle" font-size="23.177" font-weight="bold">Log Analytics</text>
  <text x="758.5185" y="277.3333" text-anchor="middle" font-size="21.0699">KQL Queries</text>
  <text x="758.5185" y="327.1111" text-anchor="middle" font-size="21.0699">Workspace</text>
  <rect x="948.1481" y="124.4444" width="273.9094" height="124.4444" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1085.1029" y="206.2222" text-anchor="middle" font-size="23.177" font-weight="bold">Alerts</text>
  <rect x="948.1481" y="284.4444" width="273.9094" height="124.4444" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1085.1029" y="366.2222" text-anchor="middle" font-size="23.177" font-weight="bold">Dashboards</text>
  <rect x="337.1193" y="462.2222" width="273.9094" height="177.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="474.0741" y="533.3333" text-anchor="middle" font-size="23.177" font-weight="bold">App Insights</text>
  <text x="474.0741" y="597.3333" text-anchor="middle" font-size="21.0699">APM Telemetry</text>
  <rect x="800.6585" y="462.2222" width="273.9094" height="177.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="937.6131" y="533.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Action Groups</text>
  <text x="937.6131" y="597.3333" text-anchor="middle" font-size="21.0699">Email / SMS / Webhook</text>
  <line x1="263.3745" y1="256" x2="332.9054" y2="256" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_management)" />
  <line x1="568.8889" y1="256" x2="638.4198" y2="256" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_management)" />
  <line x1="874.4033" y1="213.3333" x2="943.9341" y2="184.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_management)" />
  <line x1="874.4033" y1="284.4444" x2="943.9341" y2="327.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_management)" />
  <line x1="611.0288" y1="515.5556" x2="758.5185" y2="355.5556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_management)" />
  <line x1="1085.1029" y1="248.8889" x2="1000.823" y2="455.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_management)" />
</svg>
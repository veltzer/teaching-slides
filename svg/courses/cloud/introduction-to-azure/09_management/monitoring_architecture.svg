  <rect x="948.1481" y="284.4444" width="273.9094" height="124.4444" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="4.214" rx="10.535" />
  <text x="1085.1029" y="366.2222" text-anchor="middle" font-size="23.177" font-weight="bold">Dashboards</text>

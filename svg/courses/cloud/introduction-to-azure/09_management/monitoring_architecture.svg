<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_08_management" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="645.3098" y="40" text-anchor="middle" font-size="27.7678" font-weight="bold" fill="var(--text)">Monitoring Data Flow</text>
  <rect x="40" y="130.625" width="233.6284" height="199.375" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="156.8142" y="210.375" text-anchor="middle" font-size="23.4959" font-weight="bold">Data Sources</text>
  <text x="156.8142" y="268.375" text-anchor="middle" font-size="21.3598">VMs, Apps, DBs</text>
  <rect x="347.9646" y="130.625" width="233.6284" height="199.375" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="464.7788" y="210.375" text-anchor="middle" font-size="23.4959" font-weight="bold">Diagnostics</text>
  <text x="464.7788" y="268.375" text-anchor="middle" font-size="21.3598">Collection Rules</text>
  <rect x="655.9293" y="130.625" width="233.6284" height="199.375" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="772.7434" y="192.25" text-anchor="middle" font-size="23.4959" font-weight="bold">Log Analytics</text>
  <text x="772.7434" y="250.25" text-anchor="middle" font-size="21.3598">KQL Queries</text>
  <text x="772.7434" y="301" text-anchor="middle" font-size="21.3598">Workspace</text>
  <rect x="963.8939" y="94.375" width="276.1061" height="126.875" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1101.947" y="177.75" text-anchor="middle" font-size="23.4959" font-weight="bold">Alerts</text>
  <rect x="963.8939" y="257.5" width="276.1061" height="126.875" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1101.947" y="340.875" text-anchor="middle" font-size="23.4959" font-weight="bold">Dashboards</text>
  <rect x="347.9646" y="438.75" width="276.1061" height="181.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="486.0178" y="511.25" text-anchor="middle" font-size="23.4959" font-weight="bold">App Insights</text>
  <text x="486.0178" y="576.5" text-anchor="middle" font-size="21.3598">APM Telemetry</text>
  <rect x="815.2214" y="438.75" width="276.1061" height="181.25" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="953.2744" y="511.25" text-anchor="middle" font-size="23.4959" font-weight="bold">Action Groups</text>
  <text x="953.2744" y="576.5" text-anchor="middle" font-size="21.3598">Email / SMS / Webhook</text>
  <line x1="273.6284" y1="228.5" x2="343.7169" y2="228.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_management)" />
  <line x1="581.593" y1="228.5" x2="651.6815" y2="228.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_management)" />
  <line x1="889.5576" y1="185" x2="959.6461" y2="156" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_management)" />
  <line x1="889.5576" y1="257.5" x2="959.6461" y2="301" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_management)" />
  <line x1="624.0709" y1="493.125" x2="772.7434" y2="330.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_management)" />
  <line x1="1101.947" y1="221.25" x2="1016.9912" y2="431.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_management)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Top row: 4 uniform-size pipeline stages, evenly spaced -->
  <!-- Each box: width=260, height=160. Row centerline y=230. -->
  <!-- Centers at x=170, 440, 710, 980 (spacing 270, start 40..300) -->

  <rect x="40" y="40" width="283.636363636364" height="201.739130434783" rx="11.728145936789" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.818181818182" y="121.95652173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.493179435652" font-weight="bold" fill="var(--primary-text)">Author</text>
  <text x="181.818181818182" y="178.695652173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.456291873579" fill="var(--primary-text)">write the</text>
  <text x="181.818181818182" y="210.217391304347" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.456291873579" fill="var(--primary-text)">template</text>

  <rect x="345.454545454545" y="40" width="283.636363636364" height="201.739130434783" rx="11.728145936789" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.272727272727" y="121.95652173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.493179435652" font-weight="bold" fill="var(--info-text)">ARM / Bicep</text>
  <text x="487.272727272727" y="178.695652173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.456291873579" fill="var(--info-text)">JSON or DSL</text>
  <text x="487.272727272727" y="210.217391304347" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.456291873579" fill="var(--info-text)">declarative</text>

  <rect x="650.909090909091" y="40" width="283.636363636364" height="201.739130434783" rx="11.728145936789" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.727272727273" y="121.95652173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.493179435652" font-weight="bold" fill="var(--warn-text)">Validate</text>
  <text x="792.727272727273" y="178.695652173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.456291873579" fill="var(--warn-text)">what-if check</text>
  <text x="792.727272727273" y="210.217391304347" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.456291873579" fill="var(--warn-text)">dry run</text>

  <rect x="956.363636363636" y="40" width="283.636363636364" height="201.739130434783" rx="11.728145936789" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.181818181818" y="121.95652173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.493179435652" font-weight="bold" fill="var(--ok-text)">Deploy</text>
  <text x="1098.181818181818" y="178.695652173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.456291873579" fill="var(--ok-text)">Resource</text>
  <text x="1098.181818181818" y="210.217391304347" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.456291873579" fill="var(--ok-text)">Manager</text>

  <!-- Arrows between top-row boxes (straight horizontal at y=230) -->
  <line x1="329.090909090909" y1="140.869565217391" x2="340" y2="140.869565217391" stroke="var(--text)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="634.545454545455" y1="140.869565217391" x2="645.454545454545" y2="140.869565217391" stroke="var(--text)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="940" y1="140.869565217391" x2="950.909090909091" y2="140.869565217391" stroke="var(--text)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arrow down from Deploy to Azure Resources -->
  <line x1="1098.181818181818" y1="248.04347826087" x2="1098.181818181818" y2="393.043478260869" stroke="var(--text)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1098.181818181818" y1="393.043478260869" x2="694.545454545455" y2="393.043478260869" stroke="var(--text)" stroke-width="2.5"/>
  <line x1="694.545454545455" y1="393.043478260869" x2="694.545454545455" y2="430.869565217391" stroke="var(--text)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Azure Resources target -->
  <rect x="149.090909090909" y="443.478260869565" width="1090.909090909091" height="176.521739130435" rx="11.728145936789" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="694.545454545455" y="506.521739130435" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.83880862301" font-weight="bold" fill="var(--primary-text)">Azure Resources</text>
  <text x="694.545454545455" y="563.260869565218" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.801921060936" fill="var(--primary-text)">VMs  ·  Storage  ·  Networks  ·  Databases</text>
  <text x="694.545454545455" y="601.086956521739" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.11066268622" font-style="italic" fill="var(--primary-text)">provisioned from the template</text>
</svg>

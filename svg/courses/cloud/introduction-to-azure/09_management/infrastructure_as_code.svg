<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd3_08_management" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="var(--text)">Infrastructure as Code Pipeline</text>
  <rect x="42.14" y="177.7778" width="210.6996" height="177.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="147.4897" y="256" text-anchor="middle" font-size="23.177" font-weight="bold">Author</text>
  <text x="147.4897" y="312.8889" text-anchor="middle" font-size="21.0699">Write template</text>
  <rect x="316.0494" y="142.2222" width="231.7696" height="231.1111" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="431.9341" y="213.3333" text-anchor="middle" font-size="23.177" font-weight="bold">ARM / Bicep</text>
  <text x="431.9341" y="270.2222" text-anchor="middle" font-size="21.0699">JSON or DSL</text>
  <text x="431.9341" y="327.1111" text-anchor="middle" font-size="21.0699">Declarative</text>
  <rect x="611.0288" y="177.7778" width="210.6996" height="177.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="716.3786" y="256" text-anchor="middle" font-size="23.177" font-weight="bold">Validate</text>
  <text x="716.3786" y="312.8889" text-anchor="middle" font-size="21.0699">What-if check</text>
  <rect x="884.9383" y="177.7778" width="210.6996" height="177.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="990.2881" y="256" text-anchor="middle" font-size="23.177" font-weight="bold">Deploy</text>
  <text x="990.2881" y="312.8889" text-anchor="middle" font-size="21.0699">Resource Mgr</text>
  <rect x="421.3992" y="480" width="421.3992" height="160" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="558.2222" text-anchor="middle" font-size="23.177" font-weight="bold">Azure Resources</text>
  <text x="632.0988" y="611.5556" text-anchor="middle" font-size="21.0699">VMs, Storage, Networks, DBs</text>
  <line x1="252.8395" y1="266.6667" x2="311.8354" y2="256" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_08_management)" />
  <line x1="547.819" y1="256" x2="606.8148" y2="266.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_08_management)" />
  <line x1="821.7284" y1="266.6667" x2="880.7242" y2="266.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_08_management)" />
  <line x1="990.2881" y1="355.5556" x2="800.6585" y2="472.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_08_management)" />
</svg>
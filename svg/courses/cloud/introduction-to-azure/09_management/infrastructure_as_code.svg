<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd3_08_management" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="712" y="40" text-anchor="middle" font-size="29.5176" font-weight="bold" fill="var(--text)">Infrastructure as Code Pipeline</text>
  <rect x="40" y="148.75" width="240" height="181.25" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="159.9999" y="228.5" text-anchor="middle" font-size="24.9765" font-weight="bold">Author</text>
  <text x="159.9999" y="286.5" text-anchor="middle" font-size="22.7058">Write template</text>
  <rect x="351.9999" y="112.5" width="264.0001" height="235.625" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="483.9999" y="185" text-anchor="middle" font-size="24.9765" font-weight="bold">ARM / Bicep</text>
  <text x="483.9999" y="243" text-anchor="middle" font-size="22.7058">JSON or DSL</text>
  <text x="483.9999" y="301" text-anchor="middle" font-size="22.7058">Declarative</text>
  <rect x="687.9999" y="148.75" width="240" height="181.25" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="807.9999" y="228.5" text-anchor="middle" font-size="24.9765" font-weight="bold">Validate</text>
  <text x="807.9999" y="286.5" text-anchor="middle" font-size="22.7058">What-if check</text>
  <rect x="1000" y="148.75" width="240" height="181.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1120" y="228.5" text-anchor="middle" font-size="24.9765" font-weight="bold">Deploy</text>
  <text x="1120" y="286.5" text-anchor="middle" font-size="22.7058">Resource Mgr</text>
  <rect x="471.9999" y="456.875" width="480" height="163.125" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="712" y="536.625" text-anchor="middle" font-size="24.9765" font-weight="bold">Azure Resources</text>
  <text x="712" y="591" text-anchor="middle" font-size="22.7058">VMs, Storage, Networks, DBs</text>
  <line x1="279.9999" y1="239.375" x2="347.1999" y2="228.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_08_management)" />
  <line x1="616" y1="228.5" x2="683.1999" y2="239.375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_08_management)" />
  <line x1="927.9999" y1="239.375" x2="995.1999" y2="239.375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_08_management)" />
  <line x1="1120" y1="330.0001" x2="904" y2="449.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_08_management)" />
</svg>
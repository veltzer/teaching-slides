<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="634.6903" y="40" text-anchor="middle" font-size="27.7678" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Azure Management Pillars</text>
  <rect x="40" y="112.5" width="276.1061" height="217.5" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="178.053" y="203.125" text-anchor="middle" font-size="25.6319" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Azure Monitor</text>
  <text x="178.053" y="264.7501" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--primary-text)">Metrics &amp; Logs</text>
  <rect x="369.2034" y="112.5" width="276.1061" height="217.5" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="507.2566" y="203.125" text-anchor="middle" font-size="25.6319" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Azure Policy</text>
  <text x="507.2566" y="264.7501" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--info-text)">Governance</text>
  <rect x="698.407" y="112.5" width="276.1061" height="217.5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="836.4602" y="185" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Cost</text>
  <text x="836.4602" y="243" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Management</text>
  <text x="836.4602" y="301" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--ok-text)">Budgets</text>
  <rect x="1027.6106" y="112.5" width="212.3894" height="217.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1133.8053" y="203.125" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Advisor</text>
  <text x="1133.8053" y="264.7501" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--warn-text)">Best Practices</text>
  <rect x="209.9114" y="438.75" width="276.1061" height="181.25" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="347.9645" y="518.5" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Resource Tags</text>
  <text x="347.9645" y="576.5" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--danger-text)">Organization</text>
  <rect x="783.3627" y="438.75" width="276.1061" height="181.25" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="921.4159" y="518.5" text-anchor="middle" font-size="23.4959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Automation</text>
  <text x="921.4159" y="576.5" text-anchor="middle" font-size="21.3598" font-family="Arial, sans-serif" fill="var(--primary-text)">Runbooks</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_08_management" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="var(--text)">Cost Management Workflow</text>
  <rect x="42.14" y="177.7778" width="252.8395" height="195.5556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="168.5597" y="256" text-anchor="middle" font-size="23.177" font-weight="bold">Usage Meters</text>
  <text x="168.5597" y="320" text-anchor="middle" font-size="21.0699">Resource consumption</text>
  <rect x="368.7242" y="177.7778" width="252.8395" height="195.5556" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="495.144" y="256" text-anchor="middle" font-size="23.177" font-weight="bold">Cost Analysis</text>
  <text x="495.144" y="320" text-anchor="middle" font-size="21.0699">Breakdown &amp; trends</text>
  <rect x="695.3086" y="177.7778" width="252.8395" height="195.5556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="821.7284" y="256" text-anchor="middle" font-size="23.177" font-weight="bold">Budgets</text>
  <text x="821.7284" y="320" text-anchor="middle" font-size="21.0699">Thresholds &amp; alerts</text>
  <rect x="1021.893" y="177.7778" width="210.6996" height="195.5556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1127.2428" y="256" text-anchor="middle" font-size="23.177" font-weight="bold">Optimize</text>
  <text x="1127.2428" y="320" text-anchor="middle" font-size="21.0699">Right-size</text>
  <rect x="126.4198" y="480" width="273.9094" height="160" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="263.3745" y="551.1111" text-anchor="middle" font-size="23.177" font-weight="bold">Reserved Instances</text>
  <text x="263.3745" y="604.4444" text-anchor="middle" font-size="21.0699">1-3 year savings</text>
  <rect x="484.6091" y="480" width="273.9094" height="160" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="621.5638" y="551.1111" text-anchor="middle" font-size="23.177" font-weight="bold">Hybrid Benefit</text>
  <text x="621.5638" y="604.4444" text-anchor="middle" font-size="21.0699">Existing licenses</text>
  <rect x="842.7983" y="480" width="273.9094" height="160" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="979.7531" y="551.1111" text-anchor="middle" font-size="23.177" font-weight="bold">Spot VMs</text>
  <text x="979.7531" y="604.4444" text-anchor="middle" font-size="21.0699">Unused capacity</text>
  <line x1="294.9795" y1="273.7778" x2="364.5103" y2="273.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_08_management)" />
  <line x1="621.5638" y1="273.7778" x2="691.0946" y2="273.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_08_management)" />
  <line x1="948.1481" y1="273.7778" x2="1017.679" y2="273.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_08_management)" />
</svg>
  <text x="979.7531" y="604.4444" text-anchor="middle" font-size="21.0699">Unused capacity</text>
  <line x1="294.9795" y1="273.7778" x2="364.5103" y2="273.7778" stroke="var(--text-dark)" stroke-width="3.1605" marker-end="url(#arrowd2_08_management)" />
  <line x1="621.5638" y1="273.7778" x2="691.0946" y2="273.7778" stroke="var(--text-dark)" stroke-width="3.1605" marker-end="url(#arrowd2_08_management)" />
  <line x1="948.1481" y1="273.7778" x2="1017.679" y2="273.7778" stroke="var(--text-dark)" stroke-width="3.1605" marker-end="url(#arrowd2_08_management)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_08_management" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="634.6903" y="40" text-anchor="middle" font-size="27.7678" font-weight="bold" fill="var(--text)">Cost Management Workflow</text>
  <rect x="40" y="148.75" width="254.8673" height="199.375" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="167.4336" y="228.5" text-anchor="middle" font-size="23.4959" font-weight="bold">Usage Meters</text>
  <text x="167.4336" y="293.75" text-anchor="middle" font-size="21.3598">Resource consumption</text>
  <rect x="369.2034" y="148.75" width="254.8673" height="199.375" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="496.6371" y="228.5" text-anchor="middle" font-size="23.4959" font-weight="bold">Cost Analysis</text>
  <text x="496.6371" y="293.75" text-anchor="middle" font-size="21.3598">Breakdown &amp; trends</text>
  <rect x="698.407" y="148.75" width="254.8673" height="199.375" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="825.8407" y="228.5" text-anchor="middle" font-size="23.4959" font-weight="bold">Budgets</text>
  <text x="825.8407" y="293.75" text-anchor="middle" font-size="21.3598">Thresholds &amp; alerts</text>
  <rect x="1027.6106" y="148.75" width="212.3894" height="199.375" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1133.8053" y="228.5" text-anchor="middle" font-size="23.4959" font-weight="bold">Optimize</text>
  <text x="1133.8053" y="293.75" text-anchor="middle" font-size="21.3598">Right-size</text>
  <rect x="124.9557" y="456.875" width="276.1061" height="163.125" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="263.0088" y="529.375" text-anchor="middle" font-size="23.4959" font-weight="bold">Reserved Instances</text>
  <text x="263.0088" y="583.75" text-anchor="middle" font-size="21.3598">1-3 year savings</text>
  <rect x="486.0177" y="456.875" width="276.1061" height="163.125" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="624.0708" y="529.375" text-anchor="middle" font-size="23.4959" font-weight="bold">Hybrid Benefit</text>
  <text x="624.0708" y="583.75" text-anchor="middle" font-size="21.3598">Existing licenses</text>
  <rect x="847.0796" y="456.875" width="276.1061" height="163.125" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="985.1327" y="529.375" text-anchor="middle" font-size="23.4959" font-weight="bold">Spot VMs</text>
  <text x="985.1327" y="583.75" text-anchor="middle" font-size="21.3598">Unused capacity</text>
  <line x1="294.8673" y1="246.625" x2="364.9557" y2="246.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_08_management)" />
  <line x1="624.0708" y1="246.625" x2="694.1592" y2="246.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_08_management)" />
  <line x1="953.2743" y1="246.625" x2="1023.3628" y2="246.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_08_management)" />
</svg>
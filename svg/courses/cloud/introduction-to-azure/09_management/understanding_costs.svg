  <rect x="695.3086" y="177.7778" width="252.8395" height="195.5556" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="4.214" rx="10.535" />
  <text x="821.7284" y="256" text-anchor="middle" font-size="23.177" font-weight="bold">Budgets</text>

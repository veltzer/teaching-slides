<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_09_next_steps" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="72" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="var(--text)">Azure Certification Progression</text>
  <rect x="42.6667" y="144" width="256" height="216" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="170.6667" y="223.2" text-anchor="middle" font-size="25.6" font-weight="bold">AZ-900</text>
  <text x="170.6667" y="280.8" text-anchor="middle" font-size="21.3333">Fundamentals</text>
  <text x="170.6667" y="331.2" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Beginner</text>
  <rect x="384" y="144" width="256" height="216" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="512" y="223.2" text-anchor="middle" font-size="25.6" font-weight="bold">AZ-104</text>
  <text x="512" y="280.8" text-anchor="middle" font-size="21.3333">Administrator</text>
  <text x="512" y="331.2" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Intermediate</text>
  <rect x="725.3333" y="144" width="256" height="216" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="853.3333" y="223.2" text-anchor="middle" font-size="25.6" font-weight="bold">AZ-204</text>
  <text x="853.3333" y="280.8" text-anchor="middle" font-size="21.3333">Developer</text>
  <text x="853.3333" y="331.2" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Intermediate</text>
  <rect x="1024" y="144" width="224" height="216" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1134.9333" y="223.2" text-anchor="middle" font-size="25.6" font-weight="bold">AZ-305</text>
  <text x="1134.9333" y="280.8" text-anchor="middle" font-size="21.3333">Architect</text>
  <text x="1134.9333" y="331.2" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Expert</text>
  <rect x="170.6667" y="468" width="277.3333" height="162" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="309.3333" y="540" text-anchor="middle" font-size="23.4667" font-weight="bold">AZ-500</text>
  <text x="309.3333" y="597.6" text-anchor="middle" font-size="21.3333">Security Engineer</text>
  <rect x="512" y="468" width="277.3333" height="162" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="650.6667" y="540" text-anchor="middle" font-size="23.4667" font-weight="bold">AZ-400</text>
  <text x="650.6667" y="597.6" text-anchor="middle" font-size="21.3333">DevOps Engineer</text>
  <rect x="853.3333" y="468" width="277.3333" height="162" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="992" y="540" text-anchor="middle" font-size="23.4667" font-weight="bold">DP-203</text>
  <text x="992" y="597.6" text-anchor="middle" font-size="21.3333">Data Engineer</text>
  <line x1="298.6667" y1="252" x2="379.7333" y2="252" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_09_next_steps)" />
  <line x1="640" y1="252" x2="721.0667" y2="252" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_09_next_steps)" />
  <line x1="981.3333" y1="252" x2="1019.7333" y2="252" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_09_next_steps)" />
</svg>
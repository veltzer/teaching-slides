<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="634.6902" y="40" text-anchor="middle" font-size="28.2121" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Azure Certification Progression</text>
  <rect x="40" y="114.8387" width="254.8673" height="224.5161" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="167.4336" y="197.1613" text-anchor="middle" font-size="26.042" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">AZ-900</text>
  <text x="167.4336" y="257.0323" text-anchor="middle" font-size="21.7016" font-family="Arial, sans-serif" fill="var(--primary-text)">Fundamentals</text>
  <text x="167.4336" y="309.4194" text-anchor="middle" font-size="21.7016" fill="var(--text-muted)" font-family="Arial, sans-serif">Beginner</text>
  <rect x="379.823" y="114.8387" width="254.8673" height="224.5161" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="507.2566" y="197.1613" text-anchor="middle" font-size="26.042" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">AZ-104</text>
  <text x="507.2566" y="257.0323" text-anchor="middle" font-size="21.7016" font-family="Arial, sans-serif" fill="var(--info-text)">Administrator</text>
  <text x="507.2566" y="309.4194" text-anchor="middle" font-size="21.7016" fill="var(--text-muted)" font-family="Arial, sans-serif">Intermediate</text>
  <rect x="719.646" y="114.8387" width="254.8673" height="224.5161" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="847.0796" y="197.1613" text-anchor="middle" font-size="26.042" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">AZ-204</text>
  <text x="847.0796" y="257.0323" text-anchor="middle" font-size="21.7016" font-family="Arial, sans-serif" fill="var(--warn-text)">Developer</text>
  <text x="847.0796" y="309.4194" text-anchor="middle" font-size="21.7016" fill="var(--text-muted)" font-family="Arial, sans-serif">Intermediate</text>
  <rect x="1016.9911" y="114.8387" width="223.0089" height="224.5161" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1127.4336" y="197.1613" text-anchor="middle" font-size="26.042" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">AZ-305</text>
  <text x="1127.4336" y="257.0323" text-anchor="middle" font-size="21.7016" font-family="Arial, sans-serif" fill="var(--ok-text)">Architect</text>
  <text x="1127.4336" y="309.4194" text-anchor="middle" font-size="21.7016" fill="var(--text-muted)" font-family="Arial, sans-serif">Expert</text>
  <rect x="167.4336" y="451.6129" width="276.1062" height="168.3871" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="305.4867" y="526.4516" text-anchor="middle" font-size="23.8718" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">AZ-500</text>
  <text x="305.4867" y="586.3226" text-anchor="middle" font-size="21.7016" font-family="Arial, sans-serif" fill="var(--danger-text)">Security Engineer</text>
  <rect x="507.2566" y="451.6129" width="276.1062" height="168.3871" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="645.3098" y="526.4516" text-anchor="middle" font-size="23.8718" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">AZ-400</text>
  <text x="645.3098" y="586.3226" text-anchor="middle" font-size="21.7016" font-family="Arial, sans-serif" fill="var(--warn-text)">DevOps Engineer</text>
  <rect x="847.0796" y="451.6129" width="276.1062" height="168.3871" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="985.1327" y="526.4516" text-anchor="middle" font-size="23.8718" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">DP-203</text>
  <text x="985.1327" y="586.3226" text-anchor="middle" font-size="21.7016" font-family="Arial, sans-serif" fill="var(--info-text)">Data Engineer</text>
  <line x1="294.8673" y1="227.0968" x2="375.5752" y2="227.0968" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="634.6902" y1="227.0968" x2="715.3982" y2="227.0968" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="974.5132" y1="227.0968" x2="1012.7433" y2="227.0968" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
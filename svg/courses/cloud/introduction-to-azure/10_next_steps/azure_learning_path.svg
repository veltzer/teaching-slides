<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.4033" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Azure Learning Journey</text>
  <rect x="40" y="148.75" width="311.1112" height="217.5" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="195.5555" y="228.5" text-anchor="middle" font-size="26.2185" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">1. Learn</text>
  <text x="195.5555" y="293.75" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--primary-text)">Microsoft Learn</text>
  <text x="195.5555" y="340.875" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--primary-text)">Documentation</text>
  <rect x="484.4445" y="148.75" width="311.1112" height="217.5" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="228.5" text-anchor="middle" font-size="26.2185" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">2. Practice</text>
  <text x="640" y="293.75" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--info-text)">Free account labs</text>
  <text x="640" y="340.875" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--info-text)">Sandbox exercises</text>
  <rect x="928.8888" y="148.75" width="311.1112" height="217.5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1084.4445" y="228.5" text-anchor="middle" font-size="26.2185" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">3. Certify</text>
  <text x="1084.4445" y="293.75" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--ok-text)">AZ-900 and beyond</text>
  <text x="1084.4445" y="340.875" text-anchor="middle" font-size="21.8487" font-family="Arial, sans-serif" fill="var(--ok-text)">Prove your skills</text>
  <rect x="195.5555" y="475" width="888.8888" height="145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="565.625" text-anchor="middle" font-size="26.2185" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Community: Azure Friday / Tech Forums / User Groups</text>
  <line x1="351.1111" y1="257.5" x2="480" y2="257.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="795.5554" y1="257.5" x2="924.4445" y2="257.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

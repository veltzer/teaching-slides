<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.4737" y="40" text-anchor="middle" font-size="28.0881" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Azure Architecture Center Resources</text>
  <rect x="40" y="114.8387" width="357.8948" height="243.2258" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="218.9474" y="197.1613" text-anchor="middle" font-size="25.9275" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Reference</text>
  <text x="218.9474" y="257.0323" text-anchor="middle" font-size="25.9275" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Architectures</text>
  <text x="218.9474" y="320.6452" text-anchor="middle" font-size="21.6062" font-family="Arial, sans-serif" fill="var(--primary-text)">Proven solutions</text>
  <rect x="450.5263" y="114.8387" width="357.8948" height="243.2258" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.4737" y="197.1613" text-anchor="middle" font-size="25.9275" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Best Practices</text>
  <text x="629.4737" y="264.5161" text-anchor="middle" font-size="21.6062" font-family="Arial, sans-serif" fill="var(--info-text)">Well-Architected</text>
  <text x="629.4737" y="320.6452" text-anchor="middle" font-size="21.6062" font-family="Arial, sans-serif" fill="var(--info-text)">Framework</text>
  <rect x="861.0527" y="114.8387" width="357.8948" height="243.2258" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1040" y="197.1613" text-anchor="middle" font-size="25.9275" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Design Patterns</text>
  <text x="1040" y="264.5161" text-anchor="middle" font-size="21.6062" font-family="Arial, sans-serif" fill="var(--ok-text)">Cloud-native</text>
  <text x="1040" y="320.6452" text-anchor="middle" font-size="21.6062" font-family="Arial, sans-serif" fill="var(--ok-text)">patterns catalog</text>
  <rect x="61.0526" y="451.6129" width="210.5263" height="168.3871" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="166.3158" y="518.9677" text-anchor="middle" font-size="21.6062" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Reliability</text>
  <text x="166.3158" y="582.5806" text-anchor="middle" font-size="21.6062" font-family="Arial, sans-serif" fill="var(--warn-text)">Resiliency</text>
  <rect x="303.1579" y="451.6129" width="210.5263" height="168.3871" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="408.4211" y="518.9677" text-anchor="middle" font-size="21.6062" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Security</text>
  <text x="408.4211" y="582.5806" text-anchor="middle" font-size="21.6062" font-family="Arial, sans-serif" fill="var(--danger-text)">Zero Trust</text>
  <rect x="545.2632" y="451.6129" width="210.5263" height="168.3871" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="650.5263" y="518.9677" text-anchor="middle" font-size="21.6062" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Cost</text>
  <text x="650.5263" y="582.5806" text-anchor="middle" font-size="21.6062" font-family="Arial, sans-serif" fill="var(--primary-text)">Optimization</text>
  <rect x="787.3684" y="451.6129" width="210.5263" height="168.3871" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="892.6316" y="518.9677" text-anchor="middle" font-size="21.6062" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Operations</text>
  <text x="892.6316" y="582.5806" text-anchor="middle" font-size="21.6062" font-family="Arial, sans-serif" fill="var(--info-text)">Excellence</text>
  <rect x="1029.4737" y="451.6129" width="210.5263" height="168.3871" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1134.7369" y="518.9677" text-anchor="middle" font-size="21.6062" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Performance</text>
  <text x="1134.7369" y="582.5806" text-anchor="middle" font-size="21.6062" font-family="Arial, sans-serif" fill="var(--ok-text)">Efficiency</text>
  <text x="629.4737" y="406.7097" text-anchor="middle" font-size="21.6062" fill="var(--text-muted)" font-family="Arial, sans-serif">Well-Architected 5 Pillars</text>
</svg>

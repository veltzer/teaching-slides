  <polygon points="640,214 700,286.5 640,359 580,286.5" fill="var(--bg)" opacity="0.95"/>
  <polygon points="640,228.5 685,286.5 640,344.5 595,286.5" fill="var(--primary-accent)"/>
  <rect x="339.9999" y="431.5" width="60" height="87" rx="6" fill="var(--primary-accent)" opacity="0.6"/>
  <rect x="355" y="446" width="30" height="5.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="355" y="460.5" width="30" height="5.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="355" y="475" width="30" height="5.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="505" y="431.5" width="60" height="87" rx="6" fill="var(--primary-accent)" opacity="0.6"/>
  <rect x="520" y="446" width="30" height="5.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="520" y="460.5" width="30" height="5.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="520" y="475" width="30" height="5.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="715" y="431.5" width="60" height="87" rx="6" fill="var(--primary-accent)" opacity="0.6"/>
  <rect x="730" y="446" width="30" height="5.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="730" y="460.5" width="30" height="5.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="730" y="475" width="30" height="5.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="879.9999" y="431.5" width="60" height="87" rx="6" fill="var(--primary-accent)" opacity="0.6"/>
  <rect x="895" y="446" width="30" height="5.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="895" y="460.5" width="30" height="5.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="895" y="475" width="30" height="5.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="370" y1="431.5" x2="565" y2="359" stroke="var(--primary-border)" stroke-width="2" opacity="0.4"/>
  <line x1="535" y1="431.5" x2="609.9999" y2="359" stroke="var(--primary-border)" stroke-width="2" opacity="0.4"/>
  <line x1="744.9999" y1="431.5" x2="670" y2="359" stroke="var(--primary-border)" stroke-width="2" opacity="0.4"/>
  <line x1="910" y1="431.5" x2="715" y2="359" stroke="var(--primary-border)" stroke-width="2" opacity="0.4"/>
  <circle cx="190" cy="156" r="4.1714" fill="var(--primary-fill)" opacity="0.3"/>
  <circle cx="265" cy="214" r="2.7808" fill="var(--primary-accent)" opacity="0.4"/>
  <circle cx="1090" cy="170.5" r="4.1714" fill="var(--primary-fill)" opacity="0.3"/>
  <circle cx="1014.9999" cy="228.5" r="2.7808" fill="var(--primary-accent)" opacity="0.4"/>
  <circle cx="220" cy="547.5" r="2.7808" fill="var(--primary-fill)" opacity="0.3"/>
  <circle cx="1060" cy="562" r="2.7808" fill="var(--primary-fill)" opacity="0.3"/>
  <rect x="415" y="576.5" width="450" height="4.35" rx="6" fill="url(#azureBlue)" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
    <linearGradient id="azureBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4"/>
      <stop offset="100%" style="stop-color:#00bcf2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Cloud shapes -->
  <ellipse cx="400" cy="180" rx="120" ry="70" fill="url(#azureBlue)" opacity="0.9"/>
  <ellipse cx="330" cy="180" rx="80" ry="60" fill="url(#azureBlue)" opacity="0.9"/>
  <ellipse cx="480" cy="180" rx="80" ry="60" fill="url(#azureBlue)" opacity="0.9"/>
  <ellipse cx="360" cy="150" rx="70" ry="50" fill="url(#azureBlue)" opacity="0.9"/>
  <ellipse cx="440" cy="150" rx="70" ry="50" fill="url(#azureBlue)" opacity="0.9"/>
  <!-- Azure diamond logo -->
  <polygon points="400,120 440,170 400,220 360,170" fill="#fff" opacity="0.95"/>
  <polygon points="400,130 430,170 400,210 370,170" fill="#0078d4"/>
  <!-- Server racks below cloud -->
  <rect x="200" y="270" width="40" height="60" rx="3" fill="#0078d4" opacity="0.6"/>
  <rect x="210" y="280" width="20" height="4" rx="1" fill="#00bcf2"/>
  <rect x="210" y="290" width="20" height="4" rx="1" fill="#00bcf2"/>
  <rect x="210" y="300" width="20" height="4" rx="1" fill="#00bcf2"/>
  <rect x="310" y="270" width="40" height="60" rx="3" fill="#0078d4" opacity="0.6"/>
  <rect x="320" y="280" width="20" height="4" rx="1" fill="#00bcf2"/>
  <rect x="320" y="290" width="20" height="4" rx="1" fill="#00bcf2"/>
  <rect x="320" y="300" width="20" height="4" rx="1" fill="#00bcf2"/>
  <rect x="450" y="270" width="40" height="60" rx="3" fill="#0078d4" opacity="0.6"/>
  <rect x="460" y="280" width="20" height="4" rx="1" fill="#00bcf2"/>
  <rect x="460" y="290" width="20" height="4" rx="1" fill="#00bcf2"/>
  <rect x="460" y="300" width="20" height="4" rx="1" fill="#00bcf2"/>
  <rect x="560" y="270" width="40" height="60" rx="3" fill="#0078d4" opacity="0.6"/>
  <rect x="570" y="280" width="20" height="4" rx="1" fill="#00bcf2"/>
  <rect x="570" y="290" width="20" height="4" rx="1" fill="#00bcf2"/>
  <rect x="570" y="300" width="20" height="4" rx="1" fill="#00bcf2"/>
  <!-- Connection lines -->
  <line x1="220" y1="270" x2="350" y2="220" stroke="#00bcf2" stroke-width="1.5" opacity="0.4"/>
  <line x1="330" y1="270" x2="380" y2="220" stroke="#00bcf2" stroke-width="1.5" opacity="0.4"/>
  <line x1="470" y1="270" x2="420" y2="220" stroke="#00bcf2" stroke-width="1.5" opacity="0.4"/>
  <line x1="580" y1="270" x2="450" y2="220" stroke="#00bcf2" stroke-width="1.5" opacity="0.4"/>
  <!-- Decorative dots -->
  <circle cx="100" cy="80" r="3" fill="#00bcf2" opacity="0.3"/>
  <circle cx="150" cy="120" r="2" fill="#0078d4" opacity="0.4"/>
  <circle cx="700" cy="90" r="3" fill="#00bcf2" opacity="0.3"/>
  <circle cx="650" cy="130" r="2" fill="#0078d4" opacity="0.4"/>
  <circle cx="120" cy="350" r="2" fill="#00bcf2" opacity="0.3"/>
  <circle cx="680" cy="360" r="2" fill="#00bcf2" opacity="0.3"/>
  <!-- Bottom accent line -->
  <rect x="250" y="370" width="300" height="3" rx="1.5" fill="url(#azureBlue)" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="186.6372" width="254.8673" height="286.7257" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="167.4336" y="294.1593" text-anchor="middle" font-size="23.3629" font-weight="bold">Mainframes</text>
  <text x="167.4336" y="347.9204" text-anchor="middle" font-size="21.2389">1960s-1970s</text>

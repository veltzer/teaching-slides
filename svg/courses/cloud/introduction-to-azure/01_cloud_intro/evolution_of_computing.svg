<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="285" height="580" rx="6.218253" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="115.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.018513" font-weight="bold" fill="var(--primary-text)">Mainframes</text>
  <text x="182" y="168.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" fill="var(--primary-text)">1960s - 1970s</text>
  <text x="182" y="254.814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--primary-text)">Centralized</text>
  <text x="182" y="297.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--primary-text)">Terminals share</text>
  <text x="182" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--primary-text)">one big machine</text>
  <text x="182" y="405.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--primary-text)">Batch jobs</text>
  <text x="182" y="469.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--primary-text)">Expensive, rare</text>
  <text x="182" y="544.814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--primary-text)">IBM System/360</text>

  <rect x="345" y="40" width="285" height="580" rx="6.218253" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="115.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.018513" font-weight="bold" fill="var(--info-text)">Client-Server</text>
  <text x="487" y="168.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" fill="var(--info-text)">1980s - 1990s</text>
  <text x="487" y="254.814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--info-text)">Distributed</text>
  <text x="487" y="297.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--info-text)">PCs + servers</text>
  <text x="487" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--info-text)">over LAN</text>
  <text x="487" y="405.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--info-text)">App-per-box</text>
  <text x="487" y="469.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--info-text)">Low utilization</text>
  <text x="487" y="544.814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--info-text)">Rack sprawl</text>

  <rect x="650" y="40" width="285" height="580" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="115.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.018513" font-weight="bold" fill="var(--ok-text)">Virtualization</text>
  <text x="792" y="168.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" fill="var(--ok-text)">2000s</text>
  <text x="792" y="254.814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--ok-text)">Abstracted</text>
  <text x="792" y="297.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--ok-text)">VMs per host</text>
  <text x="792" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--ok-text)">hypervisor</text>
  <text x="792" y="405.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--ok-text)">Consolidation</text>
  <text x="792" y="469.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--ok-text)">VMware, Xen, KVM</text>
  <text x="792" y="544.814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--ok-text)">Capex-heavy</text>

  <rect x="955" y="40" width="285" height="580" rx="6.218253" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="115.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.018513" font-weight="bold" fill="var(--warn-text)">Cloud</text>
  <text x="1097" y="168.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" fill="var(--warn-text)">2010s - today</text>
  <text x="1097" y="254.814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--warn-text)">On-demand</text>
  <text x="1097" y="297.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--warn-text)">Pay per use</text>
  <text x="1097" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--warn-text)">elastic scale</text>
  <text x="1097" y="405.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--warn-text)">Managed services</text>
  <text x="1097" y="469.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--warn-text)">Azure, AWS, GCP</text>
  <text x="1097" y="544.814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--warn-text)">Global regions</text>

  <line x1="325" y1="330" x2="343" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="330" x2="648" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="935" y1="330" x2="953" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

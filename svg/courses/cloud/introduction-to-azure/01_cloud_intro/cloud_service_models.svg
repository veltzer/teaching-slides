<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="372.4138" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="226.207" y="119.75" text-anchor="middle" font-size="25.2983" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">IaaS</text>
  <text x="226.207" y="177.75" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--primary-text)">You manage:</text>
  <text x="226.207" y="232.1251" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--primary-text)">Apps, Data, Runtime</text>
  <text x="226.207" y="286.5" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--primary-text)">OS, Middleware</text>
  <rect x="81.3794" y="330.0001" width="289.6552" height="108.75" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="226.207" y="402.5" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--warn-text)">Provider: VMs, Network</text>
  <rect x="81.3794" y="467.75" width="289.6552" height="108.75" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="226.207" y="540.25" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--danger-text)">Provider: Storage, HW</text>
  <rect x="453.7931" y="40" width="372.4138" height="580" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="119.75" text-anchor="middle" font-size="25.2983" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">PaaS</text>
  <text x="640" y="177.75" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--info-text)">You manage:</text>
  <text x="640" y="232.1251" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--info-text)">Apps, Data</text>
  <rect x="495.1725" y="264.7501" width="289.6552" height="108.75" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="337.25" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--warn-text)">Provider: Runtime, OS</text>
  <rect x="495.1725" y="402.5" width="289.6552" height="108.75" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="475" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--danger-text)">Provider: Middleware</text>
  <rect x="495.1725" y="511.25" width="289.6552" height="79.75" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="565.625" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--danger-text)">Provider: Infra</text>
  <rect x="867.5862" y="40" width="372.4138" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1053.7931" y="119.75" text-anchor="middle" font-size="25.2983" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">SaaS</text>
  <text x="1053.7931" y="177.75" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--ok-text)">You manage:</text>
  <text x="1053.7931" y="232.1251" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--ok-text)">Configuration only</text>
  <rect x="908.9655" y="264.7501" width="289.6552" height="326.25" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1053.7931" y="366.25" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--danger-text)">Provider manages</text>
  <text x="1053.7931" y="420.625" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--danger-text)">everything:</text>
  <text x="1053.7931" y="475" text-anchor="middle" font-size="21.0818" font-family="Arial, sans-serif" fill="var(--danger-text)">Apps to Hardware</text>
</svg>

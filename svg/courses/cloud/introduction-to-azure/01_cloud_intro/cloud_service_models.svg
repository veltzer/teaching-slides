<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="372.4138" height="580" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="226.207" y="119.75" text-anchor="middle" font-size="25.2983" font-weight="bold">IaaS</text>
  <text x="226.207" y="177.75" text-anchor="middle" font-size="21.0818">You manage:</text>
  <text x="226.207" y="232.1251" text-anchor="middle" font-size="21.0818">Apps, Data, Runtime</text>
  <text x="226.207" y="286.5" text-anchor="middle" font-size="21.0818">OS, Middleware</text>
  <rect x="81.3794" y="330.0001" width="289.6552" height="108.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="226.207" y="402.5" text-anchor="middle" font-size="21.0818">Provider: VMs, Network</text>
  <rect x="81.3794" y="467.75" width="289.6552" height="108.75" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="226.207" y="540.25" text-anchor="middle" font-size="21.0818">Provider: Storage, HW</text>
  <rect x="453.7931" y="40" width="372.4138" height="580" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="640" y="119.75" text-anchor="middle" font-size="25.2983" font-weight="bold">PaaS</text>
  <text x="640" y="177.75" text-anchor="middle" font-size="21.0818">You manage:</text>
  <text x="640" y="232.1251" text-anchor="middle" font-size="21.0818">Apps, Data</text>
  <rect x="495.1725" y="264.7501" width="289.6552" height="108.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="640" y="337.25" text-anchor="middle" font-size="21.0818">Provider: Runtime, OS</text>
  <rect x="495.1725" y="402.5" width="289.6552" height="108.75" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="640" y="475" text-anchor="middle" font-size="21.0818">Provider: Middleware</text>
  <rect x="495.1725" y="511.25" width="289.6552" height="79.75" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="640" y="565.625" text-anchor="middle" font-size="21.0818">Provider: Infra</text>
  <rect x="867.5862" y="40" width="372.4138" height="580" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1053.7931" y="119.75" text-anchor="middle" font-size="25.2983" font-weight="bold">SaaS</text>
  <text x="1053.7931" y="177.75" text-anchor="middle" font-size="21.0818">You manage:</text>
  <text x="1053.7931" y="232.1251" text-anchor="middle" font-size="21.0818">Configuration only</text>
  <rect x="908.9655" y="264.7501" width="289.6552" height="326.25" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1053.7931" y="366.25" text-anchor="middle" font-size="21.0818">Provider manages</text>
  <text x="1053.7931" y="420.625" text-anchor="middle" font-size="21.0818">everything:</text>
  <text x="1053.7931" y="475" text-anchor="middle" font-size="21.0818">Apps to Hardware</text>
</svg>
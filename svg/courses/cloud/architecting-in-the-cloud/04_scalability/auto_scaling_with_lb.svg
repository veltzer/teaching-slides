  <text x="56.6667" y="186.6667" font-family="Arial, sans-serif" font-size="7.3333" fill="var(--text-muted)" text-anchor="middle">Traffic</text>
  <line x1="93.3333" y1="180" x2="140" y2="180" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />

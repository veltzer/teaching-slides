  <path d="M 640 183.3333 L 613.3333 183.3333 L 613.3333 266.6667 L 608 266.6667" fill="none" stroke="var(--danger)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="620" y="233.3333" font-family="Arial, sans-serif" font-size="7.3333" fill="var(--danger-dk)" font-weight="bold" transform="rotate(-90,930,350)">Scale Out!</text>
  <rect x="286.6667" y="253.3333" width="320" height="66.6667" rx="5.3333" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1" />
  <text x="446.6667" y="273.3333" font-family="Arial, sans-serif" font-size="8.6667" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">Scaling Policy</text>

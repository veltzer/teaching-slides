  <rect x="653.3333" y="93.3333" width="124.6667" height="20" rx="2.6667" fill="var(--warn)" opacity="0.7" />
  <text x="733.3333" y="106.6667" font-family="Arial, sans-serif" font-size="7.3333" fill="var(--text-dark)" text-anchor="middle">78% (threshold: 70%)</text>

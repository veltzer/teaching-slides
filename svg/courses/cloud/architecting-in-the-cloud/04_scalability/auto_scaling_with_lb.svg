  <text x="446.6667" y="305.3333" font-family="Arial, sans-serif" font-size="8" fill="var(--text-muted)" text-anchor="middle">Scale In: Remove 1 instance when CPU &lt; 30%</text>
  <text x="446.6667" y="316.6667" font-family="Arial, sans-serif" font-size="6.6667" fill="var(--text-faint)" text-anchor="middle">Cooldown: 300 seconds between actions</text>
  <rect x="286.6667" y="340" width="320" height="40" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1" />
  <text x="446.6667" y="356.6667" font-family="Arial, sans-serif" font-size="8" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Flow: CloudWatch Metric → Alarm → ASG Policy → Launch/Terminate → ALB registers</text>
  <text x="446.6667" y="370" font-family="Arial, sans-serif" font-size="7.3333" fill="var(--text-muted)" text-anchor="middle">New instances automatically registered with ALB target group</text>

  <text x="640" y="464.033628" font-family="Arial, sans-serif" font-size="10.623229" fill="var(--ok-accent)" text-anchor="middle">S3 Cross-Region Replication</text>

  <!-- Bottom summary -->
  <rect x="207.213115" y="542.016814" width="865.57377" height="68.235288" rx="6.373938" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="566.386506" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)" text-anchor="middle" font-weight="bold">Active-Active: Both regions serve traffic simultaneously</text>
  <text x="640" y="588.806726" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text-muted)" text-anchor="middle">Route 53 health checks enable automatic failover if one region goes down (RPO/RTO near zero)</text>
</svg>

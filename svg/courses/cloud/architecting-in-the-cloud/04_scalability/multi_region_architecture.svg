  <rect x="325.245902" y="288.571459" width="236.065574" height="136.470576" rx="6.373938" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="443.278689" y="312.941151" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text)" text-anchor="middle" font-weight="bold">Database</text>

  <rect x="344.918033" y="327.563052" width="88.52459" height="43.865488" rx="6.373938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="389.180328" y="347.058849" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Primary</text>
  <text x="389.180328" y="364.605066" font-family="Arial, sans-serif" font-size="10.623229" fill="var(--text-muted)" text-anchor="middle">RDS</text>

  <rect x="453.114754" y="327.563052" width="88.52459" height="43.865488" rx="6.373938" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="497.377049" y="347.058849" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--text-muted)" text-anchor="middle">Read</text>
  <text x="497.377049" y="364.605066" font-family="Arial, sans-serif" font-size="10.623229" fill="var(--text-muted)" text-anchor="middle">Replica</text>

  <!-- Cache R1 -->
  <rect x="325.245902" y="444.537831" width="236.065574" height="48.739491" rx="6.373938" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="443.278689" y="473.781526" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">ElastiCache (Redis)</text>

  <!-- S3 R1 -->
  <rect x="89.180328" y="444.537831" width="152.459016" height="48.739491" rx="6.373938" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.918033" y="473.781526" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">S3 Bucket</text>

  <!-- Region 2: eu-west-1 -->
  <rect x="679.344262" y="171.59668" width="550.819672" height="448.40332" rx="6.373938" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="954.754098" y="200.840375" font-family="Arial, sans-serif" font-size="15.667032" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Region: eu-west-1 (Ireland)</text>

  <!-- ALB R2 -->
  <rect x="1033.442623" y="220.336172" width="157.377049" height="48.739491" rx="6.373938" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112.131148" y="249.579866" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">ALB</text>

  <!-- Web tier R2 -->
  <rect x="1033.442623" y="288.571459" width="68.852459" height="48.739491" rx="6.373938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1067.868852" y="317.815154" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--primary-accent)" text-anchor="middle">EC2</text>
  <rect x="1117.04918" y="288.571459" width="68.852459" height="48.739491" rx="6.373938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.47541" y="317.815154" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--primary-accent)" text-anchor="middle">EC2</text>

  <line x1="1082.622951" y1="269.075663" x2="1067.868852" y2="286.62188" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1141.639344" y1="269.075663" x2="1151.47541" y2="286.62188" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App tier R2 -->
  <rect x="1033.442623" y="356.806747" width="68.852459" height="48.739491" rx="6.373938" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1067.868852" y="386.050442" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--warn-accent)" text-anchor="middle">App</text>
  <rect x="1117.04918" y="356.806747" width="68.852459" height="48.739491" rx="6.373938" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.47541" y="386.050442" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--warn-accent)" text-anchor="middle">App</text>

  <!-- DB R2 -->
  <rect x="718.688525" y="288.571459" width="236.065574" height="136.470576" rx="6.373938" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="836.721311" y="312.941151" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text)" text-anchor="middle" font-weight="bold">Database</text>

  <rect x="738.360656" y="327.563052" width="88.52459" height="43.865488" rx="6.373938" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="782.622951" y="347.058849" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Primary</text>
  <text x="782.622951" y="364.605066" font-family="Arial, sans-serif" font-size="10.623229" fill="var(--text-muted)" text-anchor="middle">RDS</text>

  <rect x="846.557377" y="327.563052" width="88.52459" height="43.865488" rx="6.373938" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="890.819672" y="347.058849" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--text-muted)" text-anchor="middle">Read</text>
  <text x="890.819672" y="364.605066" font-family="Arial, sans-serif" font-size="10.623229" fill="var(--text-muted)" text-anchor="middle">Replica</text>

  <!-- Cache R2 -->
  <rect x="718.688525" y="444.537831" width="236.065574" height="48.739491" rx="6.373938" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="836.721311" y="473.781526" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">ElastiCache (Redis)</text>

  <!-- S3 R2 -->
  <rect x="1033.442623" y="444.537831" width="152.459016" height="48.739491" rx="6.373938" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Users top left -->
  <rect x="40" y="44.874003" width="108.196721" height="58.48739" rx="6.373938" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="94.098361" y="69.243802" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)" text-anchor="middle" font-weight="bold">US Users</text>
  <text x="94.098361" y="88.739599" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--text-muted)" text-anchor="middle">West Coast</text>

  <!-- Users top right -->
  <rect x="1131.803279" y="44.874003" width="108.196721" height="58.48739" rx="6.373938" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1185.901639" y="69.243802" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)" text-anchor="middle" font-weight="bold">EU Users</text>
  <text x="1185.901639" y="88.739599" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--text-muted)" text-anchor="middle">Europe</text>

  <!-- Route 53 -->
  <rect x="453.114754" y="40" width="373.770492" height="68.235288" rx="6.373938" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="69.243802" font-family="Arial, sans-serif" font-size="16.646175" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Route 53 (DNS)</text>
  <text x="640" y="91.663915" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text-muted)" text-anchor="middle">Latency-based / Geolocation routing</text>

  <!-- Arrows from users to Route53 -->
  <line x1="148.196721" y1="74.117698" x2="451.147541" y2="74.117698" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1131.803279" y1="74.117698" x2="828.852459" y2="74.117698" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow Route53 -> Region 1 -->
  <line x1="541.639344" y1="108.235395" x2="325.245902" y2="171.59668" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow Route53 -> Region 2 -->
  <line x1="738.360656" y1="108.235395" x2="954.754098" y2="171.59668" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Region 1: us-west-2 -->
  <rect x="49.836066" y="171.59668" width="550.819672" height="448.40332" rx="6.373938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.245902" y="200.840375" font-family="Arial, sans-serif" font-size="15.667032" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Region: us-west-2 (Oregon)</text>

  <!-- ALB R1 -->
  <rect x="89.180328" y="220.336172" width="157.377049" height="48.739491" rx="6.373938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.868852" y="249.579866" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">ALB</text>

  <!-- Web tier R1 -->
  <rect x="89.180328" y="288.571459" width="68.852459" height="48.739491" rx="6.373938" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="123.606557" y="317.815154" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--ok-accent)" text-anchor="middle">EC2</text>
  <rect x="172.786885" y="288.571459" width="68.852459" height="48.739491" rx="6.373938" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="207.213115" y="317.815154" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <!-- ALB to EC2 arrows -->
  <line x1="138.360656" y1="269.075663" x2="123.606557" y2="286.62188" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="197.377049" y1="269.075663" x2="207.213115" y2="286.62188" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App tier R1 -->
  <rect x="89.180328" y="356.806747" width="68.852459" height="48.739491" rx="6.373938" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="123.606557" y="386.050442" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--warn-accent)" text-anchor="middle">App</text>

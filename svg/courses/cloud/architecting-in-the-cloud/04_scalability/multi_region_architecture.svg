<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Users top left -->
  <rect x="30" y="30" width="110" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="55" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" text-anchor="middle" font-weight="bold">US Users</text>
  <text x="85" y="75" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">West Coast</text>

  <!-- Users top right -->
  <rect x="1140" y="30" width="110" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1195" y="55" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" text-anchor="middle" font-weight="bold">EU Users</text>
  <text x="1195" y="75" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Europe</text>

  <!-- Route 53 -->
  <rect x="450" y="25" width="380" height="70" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="55" font-family="Arial, sans-serif" font-size="17" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Route 53 (DNS)</text>
  <text x="640" y="78" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">Latency-based / Geolocation routing</text>

  <!-- Arrows from users to Route53 -->
  <line x1="140" y1="60" x2="448" y2="60" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1140" y1="60" x2="832" y2="60" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow Route53 -> Region 1 -->
  <line x1="540" y1="95" x2="320" y2="160" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow Route53 -> Region 2 -->
  <line x1="740" y1="95" x2="960" y2="160" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Region 1: us-west-2 -->
  <rect x="40" y="160" width="560" height="460" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="320" y="190" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Region: us-west-2 (Oregon)</text>

  <!-- ALB R1 -->
  <rect x="80" y="210" width="160" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="240" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">ALB</text>

  <!-- Web tier R1 -->
  <rect x="80" y="280" width="70" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="115" y="310" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">EC2</text>
  <rect x="165" y="280" width="70" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="200" y="310" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <!-- ALB to EC2 arrows -->
  <line x1="130" y1="260" x2="115" y2="278" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="260" x2="200" y2="278" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App tier R1 -->
  <rect x="80" y="350" width="70" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="115" y="380" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)" text-anchor="middle">App</text>
  <rect x="165" y="350" width="70" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)" text-anchor="middle">App</text>

  <!-- DB R1 -->
  <rect x="320" y="280" width="240" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="440" y="305" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle" font-weight="bold">Database</text>

  <rect x="340" y="320" width="90" height="45" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="385" y="340" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Primary</text>
  <text x="385" y="358" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">RDS</text>

  <rect x="450" y="320" width="90" height="45" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="495" y="340" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Read</text>
  <text x="495" y="358" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Replica</text>

  <!-- Cache R1 -->
  <rect x="320" y="440" width="240" height="50" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="440" y="470" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">ElastiCache (Redis)</text>

  <!-- S3 R1 -->
  <rect x="80" y="440" width="155" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="157" y="470" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">S3 Bucket</text>

  <!-- Region 2: eu-west-1 -->
  <rect x="680" y="160" width="560" height="460" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="960" y="190" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Region: eu-west-1 (Ireland)</text>

  <!-- ALB R2 -->
  <rect x="1040" y="210" width="160" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="240" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">ALB</text>

  <!-- Web tier R2 -->
  <rect x="1040" y="280" width="70" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1075" y="310" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)" text-anchor="middle">EC2</text>
  <rect x="1125" y="280" width="70" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1160" y="310" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)" text-anchor="middle">EC2</text>

  <line x1="1090" y1="260" x2="1075" y2="278" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1150" y1="260" x2="1160" y2="278" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App tier R2 -->
  <rect x="1040" y="350" width="70" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1075" y="380" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)" text-anchor="middle">App</text>
  <rect x="1125" y="350" width="70" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1160" y="380" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)" text-anchor="middle">App</text>

  <!-- DB R2 -->
  <rect x="720" y="280" width="240" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="840" y="305" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle" font-weight="bold">Database</text>

  <rect x="740" y="320" width="90" height="45" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="785" y="340" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Primary</text>
  <text x="785" y="358" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">RDS</text>

  <rect x="850" y="320" width="90" height="45" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="895" y="340" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Read</text>
  <text x="895" y="358" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Replica</text>

  <!-- Cache R2 -->
  <rect x="720" y="440" width="240" height="50" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="840" y="470" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">ElastiCache (Redis)</text>

  <!-- S3 R2 -->
  <rect x="1040" y="440" width="155" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1117" y="470" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">S3 Bucket</text>

  <!-- Cross-region replication arrows -->
  <line x1="560" y1="345" x2="738" y2="345" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <line x1="738" y1="360" x2="560" y2="360" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <text x="649" y="385" font-family="Arial, sans-serif" font-size="11" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Cross-Region</text>
  <text x="649" y="400" font-family="Arial, sans-serif" font-size="11" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Replication</text>

  <!-- S3 CRR -->
  <line x1="235" y1="465" x2="1038" y2="465" stroke="var(--ok-border)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="640" y="460" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">S3 Cross-Region Replication</text>

  <!-- Bottom summary -->
  <rect x="200" y="540" width="880" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="565" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" text-anchor="middle" font-weight="bold">Active-Active: Both regions serve traffic simultaneously</text>
  <text x="640" y="588" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">Route 53 health checks enable automatic failover if one region goes down (RPO/RTO near zero)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Users top left -->
  <rect x="68.125" y="67.1875" width="103.125" height="54.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="119.6875" y="89.8438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle" font-weight="bold">US Users</text>
  <text x="119.6875" y="107.9688" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">West Coast</text>

  <!-- Users top right -->
  <rect x="1108.75" y="67.1875" width="103.125" height="54.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1160.3125" y="89.8438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle" font-weight="bold">EU Users</text>
  <text x="1160.3125" y="107.9688" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Europe</text>

  <!-- Route 53 -->
  <rect x="461.875" y="62.6562" width="356.25" height="63.4375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="89.8438" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Route 53 (DNS)</text>
  <text x="640" y="110.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Latency-based / Geolocation routing</text>

  <!-- Arrows from users to Route53 -->
  <line x1="171.25" y1="94.375" x2="460" y2="94.375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1108.75" y1="94.375" x2="820" y2="94.375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow Route53 -> Region 1 -->
  <line x1="546.25" y1="126.0938" x2="340" y2="185" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow Route53 -> Region 2 -->
  <line x1="733.75" y1="126.0938" x2="940" y2="185" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Region 1: us-west-2 -->
  <rect x="77.5" y="185" width="525" height="416.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="340" y="212.1875" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Region: us-west-2 (Oregon)</text>

  <!-- ALB R1 -->
  <rect x="115" y="230.3125" width="150" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="257.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">ALB</text>

  <!-- Web tier R1 -->
  <rect x="115" y="293.75" width="65.625" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="147.8125" y="320.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">EC2</text>
  <rect x="194.6875" y="293.75" width="65.625" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="227.5" y="320.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <!-- ALB to EC2 arrows -->
  <line x1="161.875" y1="275.625" x2="147.8125" y2="291.9375" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="218.125" y1="275.625" x2="227.5" y2="291.9375" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App tier R1 -->
  <rect x="115" y="357.1875" width="65.625" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="147.8125" y="384.375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle">App</text>
  <rect x="194.6875" y="357.1875" width="65.625" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="227.5" y="384.375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle">App</text>

  <!-- DB R1 -->
  <rect x="340" y="293.75" width="225" height="126.875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="452.5" y="316.4062" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle" font-weight="bold">Database</text>

  <rect x="358.75" y="330" width="84.375" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="400.9375" y="348.125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Primary</text>
  <text x="400.9375" y="364.4375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">RDS</text>

  <rect x="461.875" y="330" width="84.375" height="40.7812" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="504.0625" y="348.125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Read</text>
  <text x="504.0625" y="364.4375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Replica</text>

  <!-- Cache R1 -->
  <rect x="340" y="438.75" width="225" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="452.5" y="465.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">ElastiCache (Redis)</text>

  <!-- S3 R1 -->
  <rect x="115" y="438.75" width="145.3125" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="187.1875" y="465.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">S3 Bucket</text>

  <!-- Region 2: eu-west-1 -->
  <rect x="677.5" y="185" width="525" height="416.875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="212.1875" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Region: eu-west-1 (Ireland)</text>

  <!-- ALB R2 -->
  <rect x="1015" y="230.3125" width="150" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="257.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">ALB</text>

  <!-- Web tier R2 -->
  <rect x="1015" y="293.75" width="65.625" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1047.8125" y="320.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle">EC2</text>
  <rect x="1094.6875" y="293.75" width="65.625" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1127.5" y="320.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle">EC2</text>

  <line x1="1061.875" y1="275.625" x2="1047.8125" y2="291.9375" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1118.125" y1="275.625" x2="1127.5" y2="291.9375" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App tier R2 -->
  <rect x="1015" y="357.1875" width="65.625" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1047.8125" y="384.375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle">App</text>
  <rect x="1094.6875" y="357.1875" width="65.625" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1127.5" y="384.375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle">App</text>

  <!-- DB R2 -->
  <rect x="715" y="293.75" width="225" height="126.875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="827.5" y="316.4062" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle" font-weight="bold">Database</text>

  <rect x="733.75" y="330" width="84.375" height="40.7812" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="775.9375" y="348.125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Primary</text>
  <text x="775.9375" y="364.4375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">RDS</text>

  <rect x="836.875" y="330" width="84.375" height="40.7812" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="879.0625" y="348.125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Read</text>
  <text x="879.0625" y="364.4375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Replica</text>

  <!-- Cache R2 -->
  <rect x="715" y="438.75" width="225" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="827.5" y="465.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">ElastiCache (Redis)</text>

  <!-- S3 R2 -->
  <rect x="1015" y="438.75" width="145.3125" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1087.1875" y="465.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">S3 Bucket</text>

  <!-- Cross-region replication arrows -->
  <line x1="565" y1="352.6562" x2="731.875" y2="352.6562" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <line x1="731.875" y1="366.25" x2="565" y2="366.25" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <text x="648.4375" y="388.9062" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Cross-Region</text>
  <text x="648.4375" y="402.5" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Replication</text>

  <!-- S3 CRR -->
  <line x1="260.3125" y1="461.4062" x2="1013.125" y2="461.4062" stroke="var(--ok-border)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="640" y="456.875" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">S3 Cross-Region Replication</text>

  <!-- Bottom summary -->
  <rect x="227.5" y="529.375" width="825" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="552.0312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle" font-weight="bold">Active-Active: Both regions serve traffic simultaneously</text>
  <text x="640" y="572.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Route 53 health checks enable automatic failover if one region goes down (RPO/RTO near zero)</text>
</svg>
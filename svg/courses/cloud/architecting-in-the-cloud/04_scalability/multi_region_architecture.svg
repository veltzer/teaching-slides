  <!-- Cross-region replication arrows -->
  <line x1="561.311475" y1="351.932744" x2="736.393443" y2="351.932744" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <line x1="736.393443" y1="366.554645" x2="561.311475" y2="366.554645" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <text x="648.852459" y="390.924337" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Cross-Region</text>
  <text x="648.852459" y="405.546238" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Replication</text>


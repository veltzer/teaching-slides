<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Left Panel: Scale Up (Vertical) -->
  <rect x="30" y="30" width="590" height="590" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="325" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Vertical Scaling (Scale Up)</text>

  <!-- Small box -->
  <rect x="100" y="180" width="120" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="230" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">t3.medium</text>
  <text x="160" y="250" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">2 vCPU</text>
  <text x="160" y="268" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">4 GB</text>

  <!-- Arrow up -->
  <line x1="280" y1="240" x2="340" y2="240" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="228" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">↑</text>

  <!-- Big box -->
  <rect x="360" y="130" width="200" height="220" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">m5.4xlarge</text>
  <text x="460" y="245" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" text-anchor="middle">16 vCPU</text>
  <text x="460" y="268" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" text-anchor="middle">64 GB</text>

  <!-- Pros/Cons -->
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Advantages:</text>
  <text x="60" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Simple: no code changes needed</text>
  <text x="60" y="448" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Good for: databases, legacy apps</text>
  <text x="60" y="471" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- No distributed complexity</text>

  <text x="60" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)" font-weight="bold">Limitations:</text>
  <text x="60" y="535" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Hardware ceiling (finite max size)</text>
  <text x="60" y="558" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Single point of failure</text>
  <text x="60" y="581" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Downtime during resize (often)</text>

  <!-- Right Panel: Scale Out (Horizontal) -->
  <rect x="660" y="30" width="590" height="590" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="955" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Horizontal Scaling (Scale Out)</text>

  <!-- Load Balancer -->
  <rect x="700" y="120" width="160" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="150" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Load Balancer</text>

  <!-- Single box -->
  <rect x="700" y="210" width="80" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="255" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <!-- Arrow right -->
  <line x1="830" y1="250" x2="890" y2="250" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="240" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">→</text>

  <!-- Multiple boxes -->
  <rect x="910" y="120" width="80" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="165" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="1010" y="120" width="80" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="165" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="1110" y="120" width="80" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="165" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="910" y="220" width="80" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="265" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="1010" y="220" width="80" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="265" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="1110" y="220" width="80" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="265" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <!-- Pros/Cons -->
  <text x="690" y="400" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Advantages:</text>
  <text x="690" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Virtually unlimited scale</text>
  <text x="690" y="448" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- High availability (no SPOF)</text>
  <text x="690" y="471" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Cost-efficient (use small instances)</text>

  <text x="690" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)" font-weight="bold">Challenges:</text>
  <text x="690" y="535" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- App must be stateless</text>
  <text x="690" y="558" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Distributed systems complexity</text>
  <text x="690" y="581" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Needs load balancer + session mgmt</text>

  <!-- VS divider -->
  <circle cx="640" cy="300" r="28" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="307" font-family="Arial, sans-serif" font-size="16" fill="var(--text)" text-anchor="middle" font-weight="bold">VS</text>
</svg>
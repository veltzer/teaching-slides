<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Left Panel: Scale Up (Vertical) -->
  <rect x="68.125" y="67.1875" width="553.125" height="534.6875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="344.6875" y="98.9062" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Vertical Scaling (Scale Up)</text>

  <!-- Small box -->
  <rect x="133.75" y="203.125" width="112.5" height="108.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="248.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">t3.medium</text>
  <text x="190" y="266.5625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">2 vCPU</text>
  <text x="190" y="282.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">4 GB</text>

  <!-- Arrow up -->
  <line x1="302.5" y1="257.5" x2="358.75" y2="257.5" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330.625" y="246.625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">↑</text>

  <!-- Big box -->
  <rect x="377.5" y="157.8125" width="187.5" height="199.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="471.25" y="239.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">m5.4xlarge</text>
  <text x="471.25" y="262.0312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle">16 vCPU</text>
  <text x="471.25" y="282.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle">64 GB</text>

  <!-- Pros/Cons -->
  <text x="96.25" y="402.5" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Advantages:</text>
  <text x="96.25" y="425.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Simple: no code changes needed</text>
  <text x="96.25" y="446" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Good for: databases, legacy apps</text>
  <text x="96.25" y="466.8438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- No distributed complexity</text>

  <text x="96.25" y="502.1875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)" font-weight="bold">Limitations:</text>
  <text x="96.25" y="524.8438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Hardware ceiling (finite max size)</text>
  <text x="96.25" y="545.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Single point of failure</text>
  <text x="96.25" y="566.5312" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Downtime during resize (often)</text>

  <!-- Right Panel: Scale Out (Horizontal) -->
  <rect x="658.75" y="67.1875" width="553.125" height="534.6875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="935.3125" y="98.9062" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Horizontal Scaling (Scale Out)</text>

  <!-- Load Balancer -->
  <rect x="696.25" y="148.75" width="150" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="771.25" y="175.9375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Load Balancer</text>

  <!-- Single box -->
  <rect x="696.25" y="230.3125" width="75" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="733.75" y="271.0938" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <!-- Arrow right -->
  <line x1="818.125" y1="266.5625" x2="874.375" y2="266.5625" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="846.25" y="257.5" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">→</text>

  <!-- Multiple boxes -->
  <rect x="893.125" y="148.75" width="75" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.625" y="189.5312" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="986.875" y="148.75" width="75" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1024.375" y="189.5312" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="1080.625" y="148.75" width="75" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.125" y="189.5312" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="893.125" y="239.375" width="75" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.625" y="280.1562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="986.875" y="239.375" width="75" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1024.375" y="280.1562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="1080.625" y="239.375" width="75" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.125" y="280.1562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <!-- Pros/Cons -->
  <text x="686.875" y="402.5" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Advantages:</text>
  <text x="686.875" y="425.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Virtually unlimited scale</text>
  <text x="686.875" y="446" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- High availability (no SPOF)</text>
  <text x="686.875" y="466.8438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Cost-efficient (use small instances)</text>

  <text x="686.875" y="502.1875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)" font-weight="bold">Challenges:</text>
  <text x="686.875" y="524.8438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- App must be stateless</text>
  <text x="686.875" y="545.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Distributed systems complexity</text>
  <text x="686.875" y="566.5312" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Needs load balancer + session mgmt</text>

  <!-- VS divider -->
  <circle cx="640" cy="311.875" r="25.8088" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="318.2188" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text)" text-anchor="middle" font-weight="bold">VS</text>
</svg>
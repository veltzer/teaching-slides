<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Left Panel: Scale Up (Vertical) -->
  <rect x="40" y="40" width="580.327869" height="580" rx="6.400889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="330.163934" y="74.406725" font-family="Arial, sans-serif" font-size="21.633191" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Vertical Scaling (Scale Up)</text>

  <!-- Small box -->
  <rect x="108.852459" y="187.457627" width="118.032787" height="117.966102" rx="6.400889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.868852" y="236.610169" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">t3.medium</text>
  <text x="167.868852" y="256.271186" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)" text-anchor="middle">2 vCPU</text>
  <text x="167.868852" y="273.966102" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)" text-anchor="middle">4 GB</text>

  <!-- Arrow up -->
  <line x1="285.901639" y1="246.440678" x2="344.918033" y2="246.440678" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315.409836" y="234.644068" font-family="Arial, sans-serif" font-size="15.733279" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">↑</text>

  <!-- Big box -->
  <rect x="364.590164" y="138.305085" width="196.721311" height="216.271186" rx="6.400889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="462.95082" y="226.779661" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">m5.4xlarge</text>
  <text x="462.95082" y="251.355878" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)" text-anchor="middle">16 vCPU</text>
  <text x="462.95082" y="273.966102" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)" text-anchor="middle">64 GB</text>

  <!-- Pros/Cons -->
  <text x="69.508197" y="403.728814" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--ok-accent)" font-weight="bold">Advantages:</text>
  <text x="69.508197" y="428.305031" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">- Simple: no code changes needed</text>
  <text x="69.508197" y="450.915254" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">- Good for: databases, legacy apps</text>
  <text x="69.508197" y="473.525478" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">- No distributed complexity</text>

  <text x="69.508197" y="511.864407" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--danger-accent)" font-weight="bold">Limitations:</text>
  <text x="69.508197" y="536.440732" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">- Hardware ceiling (finite max size)</text>
  <text x="69.508197" y="559.050847" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">- Single point of failure</text>
  <text x="69.508197" y="581.660963" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">- Downtime during resize (often)</text>

  <!-- Right Panel: Scale Out (Horizontal) -->
  <rect x="659.672131" y="40" width="580.327869" height="580" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="949.836066" y="74.406725" font-family="Arial, sans-serif" font-size="21.633191" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Horizontal Scaling (Scale Out)</text>

  <!-- Load Balancer -->
  <rect x="699.016393" y="128.474576" width="157.377049" height="49.152542" rx="6.400889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="777.704918" y="157.966102" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Load Balancer</text>

  <!-- Single box -->
  <rect x="699.016393" y="216.949153" width="78.688525" height="78.644068" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="738.360656" y="261.186495" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <!-- Arrow right -->
  <line x1="826.885246" y1="256.271186" x2="885.901639" y2="256.271186" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="856.393443" y="246.440678" font-family="Arial, sans-serif" font-size="15.733279" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">→</text>

  <!-- Multiple boxes -->
  <rect x="905.57377" y="128.474576" width="78.688525" height="78.644068" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.918033" y="172.71181" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="1003.934426" y="128.474576" width="78.688525" height="78.644068" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.278689" y="172.71181" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="1102.295082" y="128.474576" width="78.688525" height="78.644068" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1141.639344" y="172.71181" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="905.57377" y="226.779661" width="78.688525" height="78.644068" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.918033" y="271.016895" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="1003.934426" y="226.779661" width="78.688525" height="78.644068" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.278689" y="271.016895" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <rect x="1102.295082" y="226.779661" width="78.688525" height="78.644068" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1141.639344" y="271.016895" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--ok-accent)" text-anchor="middle">EC2</text>

  <!-- Pros/Cons -->
  <text x="689.180328" y="403.728814" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--ok-accent)" font-weight="bold">Advantages:</text>
  <text x="689.180328" y="428.305031" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">- Virtually unlimited scale</text>
  <text x="689.180328" y="450.915254" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">- High availability (no SPOF)</text>
  <text x="689.180328" y="473.525478" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">- Cost-efficient (use small instances)</text>

  <text x="689.180328" y="511.864407" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--danger-accent)" font-weight="bold">Challenges:</text>
  <text x="689.180328" y="536.440732" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">- App must be stateless</text>
  <text x="689.180328" y="559.050847" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">- Distributed systems complexity</text>
  <text x="689.180328" y="581.660963" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">- Needs load balancer + session mgmt</text>

  <!-- VS divider -->
  <rect x="612.467" y="277.891" width="55.0664" height="55.0664" rx="14" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="312.305139" font-family="Arial, sans-serif" font-size="15.733279" fill="var(--text)" text-anchor="middle" font-weight="bold">VS</text>
</svg>
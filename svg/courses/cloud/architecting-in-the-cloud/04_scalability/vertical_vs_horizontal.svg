<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Left Panel: Scale Up (Vertical) -->
  <rect x="30" y="30" width="590" height="590" rx="12" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
  <text x="325" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Vertical Scaling (Scale Up)</text>

  <!-- Small box -->
  <rect x="100" y="180" width="120" height="120" rx="10" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="230" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">t3.medium</text>
  <text x="160" y="250" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">2 vCPU</text>
  <text x="160" y="268" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">4 GB</text>

  <!-- Arrow up -->
  <line x1="280" y1="240" x2="340" y2="240" stroke="var(--warn)" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="310" y="228" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">↑</text>

  <!-- Big box -->
  <rect x="360" y="130" width="200" height="220" rx="10" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="3" filter="url(#shadow)"/>
  <text x="460" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">m5.4xlarge</text>
  <text x="460" y="245" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)" text-anchor="middle">16 vCPU</text>
  <text x="460" y="268" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)" text-anchor="middle">64 GB</text>

  <!-- Pros/Cons -->
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)" font-weight="bold">Advantages:</text>
  <text x="60" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Simple: no code changes needed</text>
  <text x="60" y="448" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Good for: databases, legacy apps</text>
  <text x="60" y="471" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- No distributed complexity</text>

  <text x="60" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)" font-weight="bold">Limitations:</text>
  <text x="60" y="535" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Hardware ceiling (finite max size)</text>
  <text x="60" y="558" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Single point of failure</text>
  <text x="60" y="581" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Downtime during resize (often)</text>

  <!-- Right Panel: Scale Out (Horizontal) -->
  <rect x="660" y="30" width="590" height="590" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2"/>
  <text x="955" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Horizontal Scaling (Scale Out)</text>

  <!-- Load Balancer -->
  <rect x="700" y="120" width="160" height="50" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="150" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Load Balancer</text>

  <!-- Single box -->
  <rect x="700" y="210" width="80" height="80" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="255" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle">EC2</text>

  <!-- Arrow right -->
  <line x1="830" y1="250" x2="890" y2="250" stroke="var(--ok)" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="860" y="240" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">→</text>

  <!-- Multiple boxes -->
  <rect x="910" y="120" width="80" height="80" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="165" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle">EC2</text>

  <rect x="1010" y="120" width="80" height="80" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="165" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle">EC2</text>

  <rect x="1110" y="120" width="80" height="80" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="165" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle">EC2</text>

  <rect x="910" y="220" width="80" height="80" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="265" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle">EC2</text>

  <rect x="1010" y="220" width="80" height="80" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="265" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle">EC2</text>

  <rect x="1110" y="220" width="80" height="80" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="265" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle">EC2</text>

  <!-- Pros/Cons -->
  <text x="690" y="400" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)" font-weight="bold">Advantages:</text>
  <text x="690" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Virtually unlimited scale</text>
  <text x="690" y="448" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- High availability (no SPOF)</text>
  <text x="690" y="471" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Cost-efficient (use small instances)</text>

  <text x="690" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)" font-weight="bold">Challenges:</text>
  <text x="690" y="535" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- App must be stateless</text>
  <text x="690" y="558" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Distributed systems complexity</text>
  <text x="690" y="581" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Needs load balancer + session mgmt</text>

  <!-- VS divider -->
  <circle cx="640" cy="300" r="28" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2"/>
  <text x="640" y="307" font-family="Arial, sans-serif" font-size="16" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">VS</text>
</svg>
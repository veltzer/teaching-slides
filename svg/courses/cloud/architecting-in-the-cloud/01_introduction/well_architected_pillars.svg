<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Foundation bar -->
  <rect x="40" y="568.214286" width="1200" height="51.785714" rx="6.624629" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="601.357143" font-family="Arial, sans-serif" font-size="18.318646" fill="var(--text)" text-anchor="middle" font-weight="bold">AWS Well-Architected Framework</text>

  <!-- Pillar 1: Operational Excellence (primary) -->
  <rect x="55" y="71.071429" width="175" height="486.785714" rx="6.624629" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="71.071429" width="175" height="56.964343" rx="6.624629" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="102.142857" width="175" height="25.8928" fill="url(#grad-primary)" rx="6.624629" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142" y="107.321486" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--bg)" text-anchor="middle" font-weight="bold">Operational</text>
  <text x="142" y="122.857143" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--bg)" text-anchor="middle" font-weight="bold">Excellence</text>
  <text x="142" y="164.285714" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-muted)" text-anchor="middle">Run &amp; monitor</text>
  <text x="142" y="180.857143" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-muted)" text-anchor="middle">systems</text>
  <text x="142" y="216.071429" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--primary-accent)" text-anchor="middle">● IaC</text>
  <text x="142" y="236.785714" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--primary-accent)" text-anchor="middle">● Observability</text>
  <text x="142" y="257.5" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--primary-accent)" text-anchor="middle">● CI/CD</text>
  <text x="142" y="278.214286" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--primary-accent)" text-anchor="middle">● Runbooks</text>

  <!-- Pillar 2: Security (danger) -->
  <rect x="250" y="71.071429" width="175" height="486.785714" rx="6.624629" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="250" y="71.071429" width="175" height="56.964343" rx="6.624629" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="250" y="102.142857" width="175" height="25.8928" fill="url(#grad-danger)" rx="6.624629" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="337" y="107.321486" font-family="Arial, sans-serif" font-size="15.265465" fill="var(--bg)" text-anchor="middle" font-weight="bold">Security</text>
  <text x="337" y="164.285714" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-muted)" text-anchor="middle">Protect data &amp;</text>
  <text x="337" y="180.857143" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-muted)" text-anchor="middle">systems</text>
  <text x="337" y="216.071429" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--danger-accent)" text-anchor="middle">● IAM</text>
  <text x="337" y="236.785714" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--danger-accent)" text-anchor="middle">● Encryption</text>
  <text x="337" y="257.5" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--danger-accent)" text-anchor="middle">● Network security</text>
  <text x="337" y="278.214286" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--danger-accent)" text-anchor="middle">● Least privilege</text>

  <!-- Pillar 3: Reliability (ok) -->
  <rect x="445" y="71.071429" width="175" height="486.785714" rx="6.624629" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="71.071429" width="175" height="56.964343" rx="6.624629" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="102.142857" width="175" height="25.8928" fill="url(#grad-ok)" rx="6.624629" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="532" y="107.321486" font-family="Arial, sans-serif" font-size="15.265465" fill="var(--bg)" text-anchor="middle" font-weight="bold">Reliability</text>
  <text x="532" y="164.285714" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-muted)" text-anchor="middle">Recover from</text>
  <text x="532" y="180.857143" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-muted)" text-anchor="middle">failures</text>
  <text x="532" y="216.071429" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--ok-accent)" text-anchor="middle">● Multi-AZ</text>
  <text x="532" y="236.785714" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--ok-accent)" text-anchor="middle">● Auto recovery</text>
  <text x="532" y="257.5" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--ok-accent)" text-anchor="middle">● Backups</text>
  <text x="532" y="278.214286" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--ok-accent)" text-anchor="middle">● Chaos testing</text>

  <!-- Pillar 4: Performance Efficiency (warn) -->
  <rect x="640" y="71.071429" width="175" height="486.785714" rx="6.624629" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="71.071429" width="175" height="56.964343" rx="6.624629" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="102.142857" width="175" height="25.8928" fill="url(#grad-warn)" rx="6.624629" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="727" y="107.321486" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--bg)" text-anchor="middle" font-weight="bold">Performance</text>
  <text x="727" y="122.857143" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--bg)" text-anchor="middle" font-weight="bold">Efficiency</text>
  <text x="727" y="164.285714" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-muted)" text-anchor="middle">Use resources</text>
  <text x="727" y="180.857143" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-muted)" text-anchor="middle">efficiently</text>
  <text x="727" y="216.071429" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--warn-accent)" text-anchor="middle">● Right-sizing</text>
  <text x="727" y="236.785714" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--warn-accent)" text-anchor="middle">● Caching</text>
  <text x="727" y="257.5" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--warn-accent)" text-anchor="middle">● Serverless</text>
  <text x="727" y="278.214286" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--warn-accent)" text-anchor="middle">● CDN</text>

  <!-- Pillar 5: Cost Optimization (info) -->
  <rect x="835" y="71.071429" width="175" height="486.785714" rx="6.624629" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="835" y="71.071429" width="175" height="56.964343" rx="6.624629" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="835" y="102.142857" width="175" height="25.8928" fill="url(#grad-info)" rx="6.624629" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="922" y="107.321486" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--bg)" text-anchor="middle" font-weight="bold">Cost</text>
  <text x="922" y="122.857143" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--bg)" text-anchor="middle" font-weight="bold">Optimization</text>
  <text x="922" y="164.285714" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-muted)" text-anchor="middle">Avoid unnecessary</text>
  <text x="922" y="180.857143" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-muted)" text-anchor="middle">costs</text>
  <text x="922" y="216.071429" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--info-accent)" text-anchor="middle">● Reserved instances</text>
  <text x="922" y="236.785714" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--info-accent)" text-anchor="middle">● Spot instances</text>
  <text x="922" y="257.5" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--info-accent)" text-anchor="middle">● Auto scaling</text>
  <text x="922" y="278.214286" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--info-accent)" text-anchor="middle">● Cost Explorer</text>

  <!-- Pillar 6: Sustainability (ok secondary shade) -->
  <rect x="1030" y="71.071429" width="175" height="486.785714" rx="6.624629" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1030" y="71.071429" width="175" height="56.964343" rx="6.624629" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1030" y="102.142857" width="175" height="25.8928" fill="url(#grad-ok)" rx="6.624629" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1117" y="107.321486" font-family="Arial, sans-serif" font-size="14.247811" fill="var(--bg)" text-anchor="middle" font-weight="bold">Sustainability</text>
  <text x="1117" y="164.285714" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-muted)" text-anchor="middle">Minimize</text>
  <text x="1117" y="180.857143" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--text-muted)" text-anchor="middle">environmental impact</text>
  <text x="1117" y="216.071429" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--ok-accent)" text-anchor="middle">● Region selection</text>
  <text x="1117" y="236.785714" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--ok-accent)" text-anchor="middle">● Efficient code</text>
  <text x="1117" y="257.5" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--ok-accent)" text-anchor="middle">● Right-sizing</text>
  <text x="1117" y="278.214286" font-family="Arial, sans-serif" font-size="11.19474" fill="var(--ok-accent)" text-anchor="middle">● Managed services</text>

  <!-- Top label -->
  <text x="640" y="40" font-family="Arial, sans-serif" font-size="20.354063" fill="var(--text-faint)" text-anchor="middle">Six Pillars</text>
</svg>
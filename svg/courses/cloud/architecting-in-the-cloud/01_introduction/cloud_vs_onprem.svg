  <text x="571.8127" y="571.5504" font-family="Arial, sans-serif" font-size="17.313" fill="var(--text-muted)" text-anchor="middle">Time</text>
  <line x1="402.93" y1="329.3023" x2="740.6952" y2="329.3023" stroke="var(--danger-border)" stroke-width="0.6024" stroke-dasharray="1.6063 0.8031"/>
  <text x="744.3667" y="325.8417" font-family="Arial, sans-serif" font-size="17.313" fill="var(--danger-accent)">Peak Capacity</text>
  <path d="M 402.93 481.5725 C 446.9863 467.7297 476.3573 433.1229 505.7283 398.516 C 535.0991 363.9092 549.7844 315.4595 579.1552 301.6169 C 608.5262 315.4595 623.2117 363.9092 652.5824 433.1229 C 667.2681 467.7297 696.6389 488.4939 726.0095 474.6511" fill="none" stroke="var(--primary-border)" stroke-width="0.6024"/>
  <text x="729.6812" y="471.1905" font-family="Arial, sans-serif" font-size="17.313" fill="var(--primary-accent)">Demand</text>
  <path d="M 402.93 329.3023 L 402.93 481.5725 C 446.9863 467.7297 476.3573 433.1229 505.7283 398.516 C 535.0991 363.9092 549.7844 329.3023 549.7844 329.3023 Z" fill="var(--danger-fill)" opacity="0.4"/>
  <text x="461.6718" y="391.5946" font-family="Arial, sans-serif" font-size="17.313" fill="var(--danger-accent)" text-anchor="middle">Wasted</text>
  <text x="461.6718" y="404.053" font-family="Arial, sans-serif" font-size="17.313" fill="var(--danger-accent)" text-anchor="middle">capacity</text>
  <path d="M 549.7844 329.3023 C 549.7844 329.3023 549.7844 315.4595 579.1552 301.6169 C 608.5262 315.4595 608.5262 329.3023 608.5262 329.3023 Z" fill="var(--warn-fill)" opacity="0.5"/>
  <text x="579.1552" y="298.1561" font-family="Arial, sans-serif" font-size="17.313" fill="var(--warn-accent)" text-anchor="middle">Unmet demand!</text>
  <rect x="814.1223" y="211.639" width="425.8777" height="408.361" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1027.0612" y="235.8639" font-family="Arial, sans-serif" font-size="17.313" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Cloud (Elastic Scaling)</text>
  <line x1="858.1788" y1="273.9313" x2="858.1788" y2="550.7863" stroke="var(--text-muted)" stroke-width="0.4016"/>
  <line x1="858.1788" y1="550.7863" x2="1195.9437" y2="550.7863" stroke="var(--text-muted)" stroke-width="0.4016"/>
  <text x="828.8078" y="412.3588" font-family="Arial, sans-serif" font-size="17.313" fill="var(--text-muted)" text-anchor="middle" transform="rotate(-90,680,320)">Capacity / Demand</text>
  <text x="1027.0612" y="571.5504" font-family="Arial, sans-serif" font-size="17.313" fill="var(--text-muted)" text-anchor="middle">Time</text>
  <path d="M 858.1788 481.5725 C 902.235 467.7297 931.606 433.1229 960.9768 398.516 C 990.3476 363.9092 1005.0331 315.4595 1034.4041 301.6169 C 1063.7749 315.4595 1078.4601 363.9092 1107.8312 433.1229 C 1122.5165 467.7297 1151.8875 488.4939 1181.2584 474.6511" fill="none" stroke="var(--primary-border)" stroke-width="0.6024"/>
  <text x="1184.9296" y="471.1905" font-family="Arial, sans-serif" font-size="17.313" fill="var(--primary-accent)">Demand</text>
  <path d="M 858.1788 474.6511 C 902.235 460.8083 931.606 426.2015 960.9768 391.5946 C 990.3476 356.9878 1005.0331 308.5381 1034.4041 294.6955 C 1063.7749 308.5381 1078.4601 356.9878 1107.8312 426.2015 C 1122.5165 460.8083 1151.8875 481.5725 1181.2584 467.7297" fill="none" stroke="var(--ok-border)" stroke-width="0.6024" stroke-dasharray="1.6063 0.8031"/>
  <text x="1184.9296" y="464.2689" font-family="Arial, sans-serif" font-size="17.313" fill="var(--ok-accent)">Capacity</text>
  <path d="M 858.1788 474.6511 C 902.235 460.8083 931.606 426.2015 960.9768 391.5946 C 990.3476 356.9878 1005.0331 308.5381 1034.4041 294.6955 C 1063.7749 308.5381 1078.4601 356.9878 1107.8312 426.2015 C 1122.5165 460.8083 1151.8875 481.5725 1181.2584 467.7297 L 1181.2584 474.6511 C 1151.8875 488.4939 1122.5165 467.7297 1107.8312 433.1229 C 1078.4601 363.9092 1063.7749 315.4595 1034.4041 301.6169 C 1005.0331 315.4595 990.3476 363.9092 960.9768 398.516 C 931.606 433.1229 902.235 467.7297 858.1788 481.5725 Z" fill="var(--ok-fill)" opacity="0.4"/>
  <text x="1027.0612" y="384.6734" font-family="Arial, sans-serif" font-size="17.313" fill="var(--ok-accent)" text-anchor="middle">Minimal waste</text>
  <text x="1027.0612" y="599.2358" font-family="Arial, sans-serif" font-size="17.313" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Pay only for what you use</text>
  <text x="571.8127" y="599.2358" font-family="Arial, sans-serif" font-size="17.313" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Pay for peak, waste the rest</text>
</svg>

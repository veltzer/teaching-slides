  <text x="280.6249" y="306.5625" font-family="Arial, sans-serif" font-size="14.1602" fill="var(--danger-accent)" text-anchor="middle">Wasted</text>
  <text x="280.6249" y="320.625" font-family="Arial, sans-serif" font-size="14.1602" fill="var(--danger-accent)" text-anchor="middle">capacity</text>

  <text x="99.3103" y="160" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">Wasted</text>
  <text x="99.3103" y="169.931" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">capacity</text>

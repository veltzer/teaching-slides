<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Main timeline -->
  <line x1="40" y1="267.45098" x2="1240" y2="267.45098" stroke="var(--border)" stroke-width="2"/>
  <!-- Last Backup marker -->
  <line x1="168.571429" y1="221.960784" x2="168.571429" y2="312.941176" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="168.571429" y="210.588235" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453921" font-weight="bold" fill="var(--ok-accent)">Last Backup</text>
  <!-- Disaster marker -->
  <line x1="640" y1="176.470588" x2="640" y2="358.431373" stroke="var(--danger-border)" stroke-width="2"/>
  <polygon points="618.571429,153.72549 661.428571,153.72549 640,176.470588" fill="var(--danger-fill)"/>
  <text x="640" y="142.352941" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.077081" font-weight="bold" fill="var(--danger-accent)">DISASTER</text>
  <!-- Recovery complete marker -->
  <line x1="1068.571429" y1="221.960784" x2="1068.571429" y2="312.941176" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1068.571429" y="210.588235" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453921" font-weight="bold" fill="var(--ok-accent)">Recovery Complete</text>
  <!-- RPO window -->
  <rect x="168.571429" y="40" width="471.428571" height="79.607843" rx="7.185419" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="404.285714" y="74.117647" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.869361" font-weight="bold" fill="var(--warn-accent)">RPO - Recovery Point Objective</text>
  <text x="404.285714" y="102.549082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453921" fill="var(--text-muted)">Maximum acceptable data loss</text>
  <!-- RPO bracket -->
  <line x1="168.571429" y1="125.29418" x2="168.571429" y2="136.666604" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="168.571429" y1="136.666604" x2="640" y2="136.666604" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="640" y1="125.29418" x2="640" y2="136.666604" stroke="var(--warn-border)" stroke-width="2"/>
  <!-- RTO window -->
  <rect x="640" y="381.176471" width="428.571429" height="79.607843" rx="7.185419" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.285714" y="415.294118" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.869361" font-weight="bold" fill="var(--primary-accent)">RTO - Recovery Time Objective</text>
  <text x="854.285714" y="443.725553" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453921" fill="var(--text-muted)">Maximum acceptable downtime</text>
  <!-- RTO bracket -->
  <line x1="640" y1="364.117584" x2="640" y2="375.490259" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="375.490259" x2="1068.571429" y2="375.490259" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="1068.571429" y1="364.117584" x2="1068.571429" y2="375.490259" stroke="var(--primary-border)" stroke-width="2"/>
  <!-- Time annotations -->
  <text x="40" y="301.568627" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.246201" fill="var(--text-faint)">Time →</text>
  <!-- Data loss zone -->
  <rect x="168.571429" y="269.72549" width="471.428571" height="22.745098" fill="url(#grad-warn)" opacity="0.2" rx="7.185419" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="404.285714" y="324.313725" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.246201" fill="var(--warn-accent)">Data at risk of loss</text>
  <!-- Downtime zone -->
  <rect x="640" y="242.431373" width="428.571429" height="22.745098" fill="url(#grad-primary)" opacity="0.2" rx="7.185419" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.285714" y="341.372486" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.246201" fill="var(--primary-accent)">Service unavailable</text>
  <!-- Legend -->
  <rect x="40" y="529.019608" width="535.714286" height="90.980392" rx="7.185419" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="61.428571" y="563.137255" font-family="Arial, sans-serif" font-size="15.453921" font-weight="bold" fill="var(--text)">Key:</text>
  <text x="61.428571" y="597.254902" font-family="Arial, sans-serif" font-size="14.350121" fill="var(--warn-accent)">RPO = How much data can you afford to lose?</text>
  <text x="61.428571" y="620" font-family="Arial, sans-serif" font-size="14.350121" fill="var(--primary-accent)">RTO = How long can you be down?</text>
</svg>

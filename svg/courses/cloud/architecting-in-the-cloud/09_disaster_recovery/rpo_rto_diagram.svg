<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Main timeline -->
  <line x1="80" y1="300" x2="1200" y2="300" stroke="var(--border-strong)" stroke-width="3"/>
  <!-- Last Backup marker -->
  <line x1="200" y1="260" x2="200" y2="340" stroke="var(--ok)" stroke-width="3"/>
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok)">Last Backup</text>
  <!-- Disaster marker -->
  <line x1="640" y1="220" x2="640" y2="380" stroke="var(--danger)" stroke-width="4"/>
  <polygon points="620,200 660,200 640,220" fill="var(--danger)"/>
  <text x="640" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger)">DISASTER</text>
  <!-- Recovery complete marker -->
  <line x1="1040" y1="260" x2="1040" y2="340" stroke="var(--ok)" stroke-width="3"/>
  <text x="1040" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok)">Recovery Complete</text>
  <!-- RPO window -->
  <rect x="200" y="100" width="440" height="70" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-dk)">RPO - Recovery Point Objective</text>
  <text x="420" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Maximum acceptable data loss</text>
  <!-- RPO bracket -->
  <line x1="200" y1="175" x2="200" y2="185" stroke="var(--warn)" stroke-width="2"/>
  <line x1="200" y1="185" x2="640" y2="185" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="640" y1="175" x2="640" y2="185" stroke="var(--warn)" stroke-width="2"/>
  <!-- RTO window -->
  <rect x="640" y="400" width="400" height="70" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">RTO - Recovery Time Objective</text>
  <text x="840" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Maximum acceptable downtime</text>
  <!-- RTO bracket -->
  <line x1="640" y1="385" x2="640" y2="395" stroke="var(--primary)" stroke-width="2"/>
  <line x1="640" y1="395" x2="1040" y2="395" stroke="var(--primary)" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="1040" y1="385" x2="1040" y2="395" stroke="var(--primary)" stroke-width="2"/>
  <!-- Time annotations -->
  <text x="80" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Time →</text>
  <!-- Data loss zone -->
  <rect x="200" y="302" width="440" height="20" fill="var(--warn)" opacity="0.2"/>
  <text x="420" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)">Data at risk of loss</text>
  <!-- Downtime zone -->
  <rect x="640" y="278" width="400" height="20" fill="var(--primary)" opacity="0.2"/>
  <text x="840" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">Service unavailable</text>
  <!-- Legend -->
  <rect x="80" y="530" width="500" height="80" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="100" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Key:</text>
  <text x="100" y="590" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">RPO = How much data can you afford to lose?</text>
  <text x="100" y="610" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">RTO = How long can you be down?</text>
</svg>
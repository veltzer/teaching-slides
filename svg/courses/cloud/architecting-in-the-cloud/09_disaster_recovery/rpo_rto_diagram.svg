<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Main timeline -->
  <line x1="80" y1="300" x2="1200" y2="300" stroke="var(--border)" stroke-width="2"/>
  <!-- Last Backup marker -->
  <line x1="200" y1="260" x2="200" y2="340" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">Last Backup</text>
  <!-- Disaster marker -->
  <line x1="640" y1="220" x2="640" y2="380" stroke="var(--danger-border)" stroke-width="2"/>
  <polygon points="620,200 660,200 640,220" fill="var(--danger-fill)"/>
  <text x="640" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-accent)">DISASTER</text>
  <!-- Recovery complete marker -->
  <line x1="1040" y1="260" x2="1040" y2="340" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1040" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">Recovery Complete</text>
  <!-- RPO window -->
  <rect x="200" y="100" width="440" height="70" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-accent)">RPO - Recovery Point Objective</text>
  <text x="420" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Maximum acceptable data loss</text>
  <!-- RPO bracket -->
  <line x1="200" y1="175" x2="200" y2="185" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="200" y1="185" x2="640" y2="185" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="640" y1="175" x2="640" y2="185" stroke="var(--warn-border)" stroke-width="2"/>
  <!-- RTO window -->
  <rect x="640" y="400" width="400" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">RTO - Recovery Time Objective</text>
  <text x="840" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Maximum acceptable downtime</text>
  <!-- RTO bracket -->
  <line x1="640" y1="385" x2="640" y2="395" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="395" x2="1040" y2="395" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="1040" y1="385" x2="1040" y2="395" stroke="var(--primary-border)" stroke-width="2"/>
  <!-- Time annotations -->
  <text x="80" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Time →</text>
  <!-- Data loss zone -->
  <rect x="200" y="302" width="440" height="20" fill="var(--warn-fill)" opacity="0.2" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="420" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)">Data at risk of loss</text>
  <!-- Downtime zone -->
  <rect x="640" y="278" width="400" height="20" fill="var(--primary-fill)" opacity="0.2" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="840" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">Service unavailable</text>
  <!-- Legend -->
  <rect x="80" y="530" width="500" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="100" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Key:</text>
  <text x="100" y="590" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">RPO = How much data can you afford to lose?</text>
  <text x="100" y="610" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">RTO = How long can you be down?</text>
</svg>
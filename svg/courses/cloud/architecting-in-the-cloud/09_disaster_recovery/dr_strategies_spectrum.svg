<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Column 1: Backup/Restore -->
  <rect x="40" y="75.218213" width="276.106195" height="418.216275" rx="7.037229" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="178.053097" y="119.240978" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.45958" font-weight="bold" fill="var(--text)">Backup &amp; Restore</text>
  <text x="178.053097" y="185.275127" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--text-muted)">Periodic backups</text>
  <text x="178.053097" y="207.28651" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--text-muted)">Restore on demand</text>
  <text x="178.053097" y="273.320659" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.297391" font-weight="bold" fill="var(--danger-accent)">RTO: Hours</text>
  <text x="178.053097" y="306.337733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--text-muted)">RPO: Hours</text>
  <text x="178.053097" y="372.371882" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--ok-accent)">$ Lowest Cost</text>
  <rect x="103.716814" y="416.394648" width="148.672566" height="33.017074" rx="7.037229" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="103.716814" y="416.394648" width="37.168142" height="33.017074" rx="7.037229" fill="url(#grad-ok)" opacity="0.6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <!-- Column 2: Pilot Light -->
  <rect x="347.964602" y="75.218213" width="276.106195" height="418.216275" rx="7.037229" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="486.017699" y="119.240978" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.45958" font-weight="bold" fill="var(--text)">Pilot Light</text>
  <text x="486.017699" y="185.275127" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--text-muted)">Core services</text>
  <text x="486.017699" y="207.28651" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--text-muted)">always running</text>
  <text x="486.017699" y="273.320659" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.297391" font-weight="bold" fill="var(--warn-accent)">RTO: 10s of min</text>
  <text x="486.017699" y="306.337733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--text-muted)">RPO: Minutes</text>
  <text x="486.017699" y="372.371882" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--warn-accent)">$$ Moderate</text>
  <rect x="411.681416" y="416.394648" width="148.672566" height="33.017074" rx="7.037229" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="411.681416" y="416.394648" width="74.336283" height="33.017074" rx="7.037229" fill="url(#grad-warn)" opacity="0.6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <!-- Column 3: Warm Standby -->
  <rect x="655.929204" y="75.218213" width="276.106195" height="418.216275" rx="7.037229" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="793.982301" y="119.240978" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.45958" font-weight="bold" fill="var(--text)">Warm Standby</text>
  <text x="793.982301" y="185.275127" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--text-muted)">Scaled-down replica</text>
  <text x="793.982301" y="207.28651" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--text-muted)">of full environment</text>
  <text x="793.982301" y="273.320659" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.297391" font-weight="bold" fill="var(--primary-accent)">RTO: Minutes</text>
  <text x="793.982301" y="306.337733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--text-muted)">RPO: Seconds</text>
  <text x="793.982301" y="372.371882" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--warn-accent)">$$$ High</text>
  <rect x="719.646018" y="416.394648" width="148.672566" height="33.017074" rx="7.037229" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="719.646018" y="416.394648" width="111.504425" height="33.017074" rx="7.037229" fill="var(--warn-accent)" opacity="0.6"/>
  <!-- Column 4: Active-Active -->
  <rect x="963.893805" y="75.218213" width="276.106195" height="418.216275" rx="7.037229" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1101.946903" y="119.240978" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.45958" font-weight="bold" fill="var(--text)">Active-Active</text>
  <text x="1101.946903" y="185.275127" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--text-muted)">Full capacity in</text>
  <text x="1101.946903" y="207.28651" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--text-muted)">multiple regions</text>
  <text x="1101.946903" y="273.320659" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.297391" font-weight="bold" fill="var(--ok-accent)">RTO: Near Zero</text>
  <text x="1101.946903" y="306.337733" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--text-muted)">RPO: Near Zero</text>
  <text x="1101.946903" y="372.371882" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.135203" fill="var(--danger-accent)">$$$$ Highest</text>
  <rect x="1027.610619" y="416.394648" width="148.672566" height="33.017074" rx="7.037229" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="1027.610619" y="416.394648" width="148.672566" height="33.017074" rx="7.037229" fill="url(#grad-danger)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <!-- Bottom arrow: Cost increasing -->
  <line x1="103.716814" y1="581.480019" x2="1176.283186" y2="581.480019" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655.929204" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.297391" font-weight="bold" fill="var(--danger-accent)">Cost Increasing →</text>
  <!-- Top arrow: RTO decreasing -->
  <line x1="1176.283186" y1="47.704045" x2="103.716814" y2="47.704045" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655.929204" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.297391" font-weight="bold" fill="var(--ok-accent)">← RTO Decreasing</text>
</svg>

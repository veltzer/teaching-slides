<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Column 1: Backup/Restore -->
  <rect x="96.25" y="112.5" width="243.75" height="344.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="218.125" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)">Backup &amp; Restore</text>
  <text x="218.125" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Periodic backups</text>
  <text x="218.125" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Restore on demand</text>
  <text x="218.125" y="275.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)">RTO: Hours</text>
  <text x="218.125" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">RPO: Hours</text>
  <text x="218.125" y="357.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">$ Lowest Cost</text>
  <rect x="152.5" y="393.4375" width="131.25" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="152.5" y="393.4375" width="32.8125" height="27.1875" rx="6" fill="var(--ok-fill)" opacity="0.6" stroke="var(--ok-border)" stroke-width="2"/>
  <!-- Column 2: Pilot Light -->
  <rect x="368.125" y="112.5" width="243.75" height="344.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)">Pilot Light</text>
  <text x="490" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Core services</text>
  <text x="490" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">always running</text>
  <text x="490" y="275.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)">RTO: 10s of min</text>
  <text x="490" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">RPO: Minutes</text>
  <text x="490" y="357.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--warn-accent)">$$ Moderate</text>
  <rect x="424.375" y="393.4375" width="131.25" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="424.375" y="393.4375" width="65.625" height="27.1875" rx="6" fill="var(--warn-fill)" opacity="0.6" stroke="var(--warn-border)" stroke-width="2"/>
  <!-- Column 3: Warm Standby -->
  <rect x="640" y="112.5" width="243.75" height="344.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="761.875" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)">Warm Standby</text>
  <text x="761.875" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Scaled-down replica</text>
  <text x="761.875" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">of full environment</text>
  <text x="761.875" y="275.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)">RTO: Minutes</text>
  <text x="761.875" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">RPO: Seconds</text>
  <text x="761.875" y="357.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--warn-accent)">$$$ High</text>
  <rect x="696.25" y="393.4375" width="131.25" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="696.25" y="393.4375" width="98.4375" height="27.1875" rx="6" fill="var(--warn-accent)" opacity="0.6"/>
  <!-- Column 4: Active-Active -->
  <rect x="911.875" y="112.5" width="243.75" height="344.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.75" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)">Active-Active</text>
  <text x="1033.75" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Full capacity in</text>
  <text x="1033.75" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">multiple regions</text>
  <text x="1033.75" y="275.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">RTO: Near Zero</text>
  <text x="1033.75" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">RPO: Near Zero</text>
  <text x="1033.75" y="357.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">$$$$ Highest</text>
  <rect x="968.125" y="393.4375" width="131.25" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="968.125" y="393.4375" width="131.25" height="27.1875" rx="6" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2"/>
  <!-- Bottom arrow: Cost increasing -->
  <line x1="152.5" y1="529.375" x2="1099.375" y2="529.375" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="561.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)">Cost Increasing →</text>
  <!-- Top arrow: RTO decreasing -->
  <line x1="1099.375" y1="89.8438" x2="152.5" y2="89.8438" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="83.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">← RTO Decreasing</text>
</svg>
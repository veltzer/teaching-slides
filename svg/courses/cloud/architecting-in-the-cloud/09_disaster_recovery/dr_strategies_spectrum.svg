<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Column 1: Backup/Restore -->
  <rect x="60" y="80" width="260" height="380" rx="12" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Backup &amp; Restore</text>
  <text x="190" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Periodic backups</text>
  <text x="190" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Restore on demand</text>
  <text x="190" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger)">RTO: Hours</text>
  <text x="190" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">RPO: Hours</text>
  <text x="190" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok)">$ Lowest Cost</text>
  <rect x="120" y="390" width="140" height="30" rx="4" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <rect x="120" y="390" width="35" height="30" rx="4" fill="var(--ok)" opacity="0.6"/>
  <!-- Column 2: Pilot Light -->
  <rect x="350" y="80" width="260" height="380" rx="12" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Pilot Light</text>
  <text x="480" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Core services</text>
  <text x="480" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">always running</text>
  <text x="480" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn)">RTO: 10s of min</text>
  <text x="480" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">RPO: Minutes</text>
  <text x="480" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn)">$$ Moderate</text>
  <rect x="410" y="390" width="140" height="30" rx="4" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <rect x="410" y="390" width="70" height="30" rx="4" fill="var(--warn)" opacity="0.6"/>
  <!-- Column 3: Warm Standby -->
  <rect x="640" y="80" width="260" height="380" rx="12" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Warm Standby</text>
  <text x="770" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Scaled-down replica</text>
  <text x="770" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">of full environment</text>
  <text x="770" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary)">RTO: Minutes</text>
  <text x="770" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">RPO: Seconds</text>
  <text x="770" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-dk)">$$$ High</text>
  <rect x="700" y="390" width="140" height="30" rx="4" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <rect x="700" y="390" width="105" height="30" rx="4" fill="var(--warn-dk)" opacity="0.6"/>
  <!-- Column 4: Active-Active -->
  <rect x="930" y="80" width="260" height="380" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Active-Active</text>
  <text x="1060" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Full capacity in</text>
  <text x="1060" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">multiple regions</text>
  <text x="1060" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)">RTO: Near Zero</text>
  <text x="1060" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">RPO: Near Zero</text>
  <text x="1060" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger)">$$$$ Highest</text>
  <rect x="990" y="390" width="140" height="30" rx="4" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <rect x="990" y="390" width="140" height="30" rx="4" fill="var(--danger)" opacity="0.6"/>
  <!-- Bottom arrow: Cost increasing -->
  <line x1="120" y1="540" x2="1130" y2="540" stroke="var(--danger)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger)">Cost Increasing →</text>
  <!-- Top arrow: RTO decreasing -->
  <line x1="1130" y1="55" x2="120" y2="55" stroke="var(--ok)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok)">← RTO Decreasing</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- State labels -->
  <text x="266.415094" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279863" font-weight="bold" fill="var(--ok-accent)">Normal State</text>
  <text x="990.943396" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279863" font-weight="bold" fill="var(--danger-accent)">Failover State</text>
  <!-- Divider -->
  <line x1="628.679245" y1="50" x2="628.679245" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- === LEFT: Normal State === -->
  <!-- Route 53 -->
  <rect x="141.886792" y="70" width="249.056604" height="55.000055" rx="6.925949" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="266.415094" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--text)">Route 53 (DNS)</text>
  <!-- Health Check -->
  <rect x="164.528302" y="170" width="203.773585" height="40" rx="6.925949" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="266.415094" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831928" fill="var(--ok-accent)">Health Check: PASS</text>
  <line x1="266.415094" y1="124.999945" x2="266.415094" y2="168" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Primary Region - healthy -->
  <rect x="40" y="260" width="226.415094" height="130" rx="6.925949" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.207547" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--text)">Primary Region</text>
  <text x="153.207547" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.89587" fill="var(--ok-accent)">HEALTHY</text>
  <text x="153.207547" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.919737" fill="var(--ok-accent)">&#10004;</text>
  <line x1="266.415094" y1="210" x2="198.490566" y2="258" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DR Region - standby -->
  <rect x="289.056604" y="260" width="226.415094" height="130" rx="6.925949" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="402.264151" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--text)">DR Region</text>
  <text x="402.264151" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.89587" fill="var(--text-faint)">STANDBY</text>
  <text x="402.264151" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.535743" fill="var(--text-faint)">&#9679;</text>
  <!-- Traffic arrow - normal -->
  <line x1="266.415094" y1="124.999945" x2="153.207547" y2="258" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <text x="62.641509" y="220" font-family="Arial, sans-serif" font-size="12.767872" font-weight="bold" fill="var(--primary-accent)">Traffic</text>
  <!-- === RIGHT: Failover State === -->
  <!-- Route 53 -->
  <rect x="866.415094" y="70" width="249.056604" height="55.000055" rx="6.925949" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990.943396" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--text)">Route 53 (DNS)</text>
  <!-- Health Check -->
  <rect x="889.056604" y="170" width="203.773585" height="40" rx="6.925949" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="990.943396" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831928" fill="var(--danger-accent)">Health Check: FAIL</text>
  <line x1="990.943396" y1="124.999945" x2="990.943396" y2="168" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Primary Region - failed -->
  <rect x="764.528302" y="260" width="226.415094" height="130" rx="6.925949" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="877.735849" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--text)">Primary Region</text>
  <text x="877.735849" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.89587" fill="var(--danger-accent)">FAILED</text>
  <text x="877.735849" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.919737" fill="var(--danger-accent)">&#10008;</text>
  <line x1="990.943396" y1="210" x2="923.018868" y2="258" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DR Region - active -->
  <rect x="1013.584906" y="260" width="226.415094" height="130" rx="6.925949" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.792453" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--text)">DR Region</text>
  <text x="1126.792453" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.89587" fill="var(--ok-accent)">ACTIVE</text>
  <text x="1126.792453" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.919737" fill="var(--ok-accent)">&#10004;</text>
  <!-- Traffic arrow - failover -->
  <line x1="990.943396" y1="124.999945" x2="1126.792453" y2="258" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <text x="1149.433962" y="220" font-family="Arial, sans-serif" font-size="12.767872" font-weight="bold" fill="var(--primary-accent)">Traffic</text>
  <!-- Failover arrow between states -->
  <rect x="492.830189" y="480" width="271.698113" height="50" rx="6.925949" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="628.679245" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.959811" font-weight="bold" fill="var(--warn-accent)">Automatic Failover</text>
  <line x1="447.54717" y1="504.999945" x2="495.09434" y2="504.999945" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="764.528302" y1="504.999945" x2="812.075472" y2="504.999945" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
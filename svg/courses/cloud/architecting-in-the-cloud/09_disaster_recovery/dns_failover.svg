<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- State labels -->
  <text x="320" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok)">Normal State</text>
  <text x="960" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger)">Failover State</text>
  <!-- Divider -->
  <line x1="640" y1="50" x2="640" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- === LEFT: Normal State === -->
  <!-- Route 53 -->
  <rect x="210" y="70" width="220" height="55" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Route 53 (DNS)</text>
  <!-- Health Check -->
  <rect x="230" y="170" width="180" height="40" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2"/>
  <text x="320" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-dk)">Health Check: PASS</text>
  <line x1="320" y1="125" x2="320" y2="168" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Primary Region - healthy -->
  <rect x="120" y="260" width="200" height="130" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="3" filter="url(#shadow)"/>
  <text x="220" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Primary Region</text>
  <text x="220" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)">HEALTHY</text>
  <text x="220" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="var(--ok)">&#10004;</text>
  <line x1="320" y1="210" x2="260" y2="258" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DR Region - standby -->
  <rect x="340" y="260" width="200" height="130" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">DR Region</text>
  <text x="440" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">STANDBY</text>
  <text x="440" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="var(--text-faint)">&#9679;</text>
  <!-- Traffic arrow - normal -->
  <line x1="320" y1="125" x2="220" y2="258" stroke="var(--primary)" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <text x="140" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary)">Traffic</text>
  <!-- === RIGHT: Failover State === -->
  <!-- Route 53 -->
  <rect x="850" y="70" width="220" height="55" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Route 53 (DNS)</text>
  <!-- Health Check -->
  <rect x="870" y="170" width="180" height="40" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2"/>
  <text x="960" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-dk)">Health Check: FAIL</text>
  <line x1="960" y1="125" x2="960" y2="168" stroke="var(--danger)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Primary Region - failed -->
  <rect x="760" y="260" width="200" height="130" rx="10" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="3" filter="url(#shadow)"/>
  <text x="860" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Primary Region</text>
  <text x="860" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)">FAILED</text>
  <text x="860" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="var(--danger)">&#10008;</text>
  <line x1="960" y1="210" x2="900" y2="258" stroke="var(--danger)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DR Region - active -->
  <rect x="980" y="260" width="200" height="130" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="3" filter="url(#shadow)"/>
  <text x="1080" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">DR Region</text>
  <text x="1080" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)">ACTIVE</text>
  <text x="1080" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="var(--ok)">&#10004;</text>
  <!-- Traffic arrow - failover -->
  <line x1="960" y1="125" x2="1080" y2="258" stroke="var(--primary)" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <text x="1100" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary)">Traffic</text>
  <!-- Failover arrow between states -->
  <rect x="520" y="480" width="240" height="50" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-dk)">Automatic Failover</text>
  <line x1="480" y1="505" x2="522" y2="505" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="505" x2="802" y2="505" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
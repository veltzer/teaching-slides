<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- State labels -->
  <text x="340" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--ok-accent)">Normal State</text>
  <text x="940" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--danger-accent)">Failover State</text>
  <!-- Divider -->
  <line x1="640" y1="85.3125" x2="640" y2="601.875" stroke="var(--border)" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- === LEFT: Normal State === -->
  <!-- Route 53 -->
  <rect x="236.875" y="103.4375" width="206.25" height="49.8438" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="134.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Route 53 (DNS)</text>
  <!-- Health Check -->
  <rect x="255.625" y="194.0625" width="168.75" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="340" y="217.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)">Health Check: PASS</text>
  <line x1="340" y1="153.2812" x2="340" y2="192.25" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Primary Region - healthy -->
  <rect x="152.5" y="275.625" width="187.5" height="117.8125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="246.25" y="311.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Primary Region</text>
  <text x="246.25" y="334.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">HEALTHY</text>
  <text x="246.25" y="375.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.6523" fill="var(--ok-accent)">&#10004;</text>
  <line x1="340" y1="230.3125" x2="283.75" y2="273.8125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DR Region - standby -->
  <rect x="358.75" y="275.625" width="187.5" height="117.8125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="452.5" y="311.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">DR Region</text>
  <text x="452.5" y="334.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">STANDBY</text>
  <text x="452.5" y="375.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" fill="var(--text-faint)">&#9679;</text>
  <!-- Traffic arrow - normal -->
  <line x1="340" y1="153.2812" x2="246.25" y2="273.8125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <text x="171.25" y="239.375" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Traffic</text>
  <!-- === RIGHT: Failover State === -->
  <!-- Route 53 -->
  <rect x="836.875" y="103.4375" width="206.25" height="49.8438" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="134.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Route 53 (DNS)</text>
  <!-- Health Check -->
  <rect x="855.625" y="194.0625" width="168.75" height="36.25" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="940" y="217.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--danger-accent)">Health Check: FAIL</text>
  <line x1="940" y1="153.2812" x2="940" y2="192.25" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Primary Region - failed -->
  <rect x="752.5" y="275.625" width="187.5" height="117.8125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="846.25" y="311.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Primary Region</text>
  <text x="846.25" y="334.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">FAILED</text>
  <text x="846.25" y="375.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.6523" fill="var(--danger-accent)">&#10008;</text>
  <line x1="940" y1="230.3125" x2="883.75" y2="273.8125" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DR Region - active -->
  <rect x="958.75" y="275.625" width="187.5" height="117.8125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.5" y="311.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">DR Region</text>
  <text x="1052.5" y="334.5312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">ACTIVE</text>
  <text x="1052.5" y="375.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.6523" fill="var(--ok-accent)">&#10004;</text>
  <!-- Traffic arrow - failover -->
  <line x1="940" y1="153.2812" x2="1052.5" y2="273.8125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <text x="1071.25" y="239.375" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Traffic</text>
  <!-- Failover arrow between states -->
  <rect x="527.5" y="475" width="225" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)">Automatic Failover</text>
  <line x1="490" y1="497.6562" x2="529.375" y2="497.6562" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="752.5" y1="497.6562" x2="791.875" y2="497.6562" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- State labels -->
  <text x="266.415094" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279863" font-weight="bold" fill="var(--ok-accent)">Normal State</text>
  <text x="990.943396" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279863" font-weight="bold" fill="var(--danger-accent)">Failover State</text>
  <!-- Divider -->
  <line x1="628.679245" y1="50" x2="628.679245" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- === LEFT: Normal State === -->
  <!-- Route 53 -->
  <rect x="141.886792" y="70" width="249.056604" height="55.000055" rx="6.925949" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="266.415094" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--text)">Route 53 (DNS)</text>
  <!-- Health Check -->
  <rect x="164.528302" y="170" width="203.773585" height="40" rx="6.925949" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="266.415094" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831928" fill="var(--ok-accent)">Health Check: PASS</text>
  <line x1="266.415094" y1="124.999945" x2="266.415094" y2="168" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Primary Region - healthy -->
  <rect x="40" y="260" width="226.415094" height="130" rx="6.925949" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.207547" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--text)">Primary Region</text>
  <text x="153.207547" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.89587" fill="var(--ok-accent)">HEALTHY</text>
  <text x="153.207547" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.919737" fill="var(--ok-accent)">✔</text>
  <line x1="266.415094" y1="210" x2="198.490566" y2="258" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DR Region - standby -->
  <rect x="289.056604" y="260" width="226.415094" height="130" rx="6.925949" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="402.264151" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--text)">DR Region</text>
  <text x="402.264151" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.89587" fill="var(--text-faint)">STANDBY</text>
  <text x="402.264151" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.535743" fill="var(--text-faint)">●</text>
  <!-- Traffic arrow - normal -->
  <line x1="266.415094" y1="124.999945" x2="153.207547" y2="258" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <text x="62.641509" y="220" font-family="Arial, sans-serif" font-size="12.767872" font-weight="bold" fill="var(--primary-accent)">Traffic</text>
  <!-- === RIGHT: Failover State === -->
  <!-- Route 53 -->
  <rect x="866.415094" y="70" width="249.056604" height="55.000055" rx="6.925949" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990.943396" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--text)">Route 53 (DNS)</text>
  <!-- Health Check -->
  <rect x="889.056604" y="170" width="203.773585" height="40" rx="6.925949" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990.943396" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831928" fill="var(--danger-accent)">Health Check: FAIL</text>
  <line x1="990.943396" y1="124.999945" x2="990.943396" y2="168" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Primary Region - failed -->
  <rect x="764.528302" y="260" width="226.415094" height="130" rx="6.925949" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="877.735849" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--text)">Primary Region</text>
  <text x="877.735849" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.89587" fill="var(--danger-accent)">FAILED</text>
  <text x="877.735849" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.919737" fill="var(--danger-accent)">✘</text>
  <line x1="990.943396" y1="210" x2="923.018868" y2="258" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DR Region - active -->
  <rect x="1013.584906" y="260" width="226.415094" height="130" rx="6.925949" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.792453" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023867" font-weight="bold" fill="var(--text)">DR Region</text>
  <text x="1126.792453" y="324.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.89587" fill="var(--ok-accent)">ACTIVE</text>
  <text x="1126.792453" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.919737" fill="var(--ok-accent)">✔</text>
  <!-- Traffic arrow - failover -->
  <line x1="990.943396" y1="124.999945" x2="1126.792453" y2="258" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <text x="1149.433962" y="220" font-family="Arial, sans-serif" font-size="12.767872" font-weight="bold" fill="var(--primary-accent)">Traffic</text>
  <!-- Failover arrow between states -->
  <rect x="492.830189" y="480" width="271.698113" height="50" rx="6.925949" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="628.679245" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.959811" font-weight="bold" fill="var(--warn-accent)">Automatic Failover</text>
  <line x1="447.54717" y1="504.999945" x2="495.09434" y2="504.999945" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="764.528302" y1="504.999945" x2="812.075472" y2="504.999945" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

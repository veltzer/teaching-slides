<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Left Panel: Perimeter Security -->
  <rect x="30" y="30" width="590" height="590" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="325" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Perimeter Security</text>
  <text x="325" y="88" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">"Castle and Moat" Model</text>

  <!-- Moat -->
  <ellipse cx="325" cy="370" rx="250" ry="180" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" opacity="0.3"/>
  <text x="325" y="565" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" text-anchor="middle">Firewall / Moat</text>

  <!-- Castle wall -->
  <rect x="140" y="200" width="370" height="300" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="325" y="225" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle" font-weight="bold">Internal Network - "Trusted Zone"</text>

  <!-- Internal resources (no locks) -->
  <rect x="160" y="250" width="100" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="210" y="280" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)" text-anchor="middle">Server A</text>

  <rect x="280" y="250" width="100" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="330" y="280" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)" text-anchor="middle">Server B</text>

  <rect x="400" y="250" width="100" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="450" y="280" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)" text-anchor="middle">Database</text>

  <!-- Free movement arrows inside -->
  <line x1="260" y1="275" x2="278" y2="275" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="275" x2="398" y2="275" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="325" y="330" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Free lateral movement!</text>

  <!-- Attacker inside -->
  <rect x="220" y="370" width="210" height="55" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="325" y="393" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Once inside the perimeter,</text>
  <text x="325" y="412" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">attacker moves freely</text>

  <!-- Single gate -->
  <rect x="290" y="475" width="70" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="325" y="496" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Gate</text>

  <!-- Right Panel: Zero Trust -->
  <rect x="660" y="30" width="590" height="590" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="955" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Zero Trust</text>
  <text x="955" y="88" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">"Never Trust, Always Verify"</text>

  <!-- Resources with locks/shields -->
  <rect x="700" y="130" width="140" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Server A</text>
  <circle cx="825" cy="143" r="12" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="825" y="148" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">✓</text>

  <rect x="890" y="130" width="140" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Server B</text>
  <circle cx="1015" cy="143" r="12" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="1015" y="148" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">✓</text>

  <rect x="1080" y="130" width="140" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Database</text>
  <circle cx="1205" cy="143" r="12" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="1205" y="148" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">✓</text>

  <!-- Verification points -->
  <rect x="720" y="240" width="200" height="55" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="820" y="262" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Identity Verification</text>
  <text x="820" y="280" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">MFA + SSO for every request</text>

  <rect x="960" y="240" width="200" height="55" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="262" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Device Trust</text>
  <text x="1060" y="280" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Managed device check</text>

  <rect x="720" y="320" width="200" height="55" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="820" y="342" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Least Privilege</text>
  <text x="820" y="360" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Minimal access per role</text>

  <rect x="960" y="320" width="200" height="55" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="342" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Micro-Segmentation</text>
  <text x="1060" y="360" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Segment every workload</text>

  <rect x="720" y="400" width="200" height="55" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="820" y="422" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Continuous Monitoring</text>
  <text x="820" y="440" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Log and audit everything</text>

  <rect x="960" y="400" width="200" height="55" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="422" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Encryption</text>
  <text x="1060" y="440" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Data at rest &amp; in transit</text>

  <!-- Summary -->
  <rect x="720" y="490" width="440" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="520" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Every request is authenticated, authorized,</text>
  <text x="940" y="542" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">and encrypted regardless of source</text>
  <text x="940" y="570" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">Breach of one resource does not compromise others</text>
</svg>
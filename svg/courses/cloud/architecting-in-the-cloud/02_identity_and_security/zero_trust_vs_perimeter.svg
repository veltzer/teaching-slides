<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Left Panel: Perimeter Security -->
  <rect x="30" y="30" width="590" height="590" rx="12" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2"/>
  <text x="325" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Perimeter Security</text>
  <text x="325" y="88" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">"Castle and Moat" Model</text>

  <!-- Moat -->
  <ellipse cx="325" cy="370" rx="250" ry="180" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="2" opacity="0.3"/>
  <text x="325" y="565" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)" text-anchor="middle">Firewall / Moat</text>

  <!-- Castle wall -->
  <rect x="140" y="200" width="370" height="300" rx="8" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="3"/>
  <text x="325" y="225" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" text-anchor="middle" font-weight="bold">Internal Network - "Trusted Zone"</text>

  <!-- Internal resources (no locks) -->
  <rect x="160" y="250" width="100" height="50" rx="6" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="210" y="280" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)" text-anchor="middle">Server A</text>

  <rect x="280" y="250" width="100" height="50" rx="6" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="330" y="280" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)" text-anchor="middle">Server B</text>

  <rect x="400" y="250" width="100" height="50" rx="6" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="450" y="280" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)" text-anchor="middle">Database</text>

  <!-- Free movement arrows inside -->
  <line x1="260" y1="275" x2="278" y2="275" stroke="var(--danger)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="275" x2="398" y2="275" stroke="var(--danger)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="325" y="330" font-family="Arial, sans-serif" font-size="12" fill="var(--danger)" text-anchor="middle" font-weight="bold">Free lateral movement!</text>

  <!-- Attacker inside -->
  <rect x="220" y="370" width="210" height="55" rx="6" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="325" y="393" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)" text-anchor="middle" font-weight="bold">Once inside the perimeter,</text>
  <text x="325" y="412" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)" text-anchor="middle" font-weight="bold">attacker moves freely</text>

  <!-- Single gate -->
  <rect x="290" y="475" width="70" height="30" rx="4" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2"/>
  <text x="325" y="496" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Gate</text>

  <!-- Right Panel: Zero Trust -->
  <rect x="660" y="30" width="590" height="590" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2"/>
  <text x="955" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Zero Trust</text>
  <text x="955" y="88" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">"Never Trust, Always Verify"</text>

  <!-- Resources with locks/shields -->
  <rect x="700" y="130" width="140" height="70" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Server A</text>
  <circle cx="825" cy="143" r="12" fill="var(--ok)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="825" y="148" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">✓</text>

  <rect x="890" y="130" width="140" height="70" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Server B</text>
  <circle cx="1015" cy="143" r="12" fill="var(--ok)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="1015" y="148" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">✓</text>

  <rect x="1080" y="130" width="140" height="70" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Database</text>
  <circle cx="1205" cy="143" r="12" fill="var(--ok)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="1205" y="148" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">✓</text>

  <!-- Verification points -->
  <rect x="720" y="240" width="200" height="55" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="820" y="262" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Identity Verification</text>
  <text x="820" y="280" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">MFA + SSO for every request</text>

  <rect x="960" y="240" width="200" height="55" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="1060" y="262" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Device Trust</text>
  <text x="1060" y="280" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Managed device check</text>

  <rect x="720" y="320" width="200" height="55" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="820" y="342" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Least Privilege</text>
  <text x="820" y="360" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Minimal access per role</text>

  <rect x="960" y="320" width="200" height="55" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="1060" y="342" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Micro-Segmentation</text>
  <text x="1060" y="360" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Segment every workload</text>

  <rect x="720" y="400" width="200" height="55" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="820" y="422" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Continuous Monitoring</text>
  <text x="820" y="440" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Log and audit everything</text>

  <rect x="960" y="400" width="200" height="55" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="1060" y="422" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Encryption</text>
  <text x="1060" y="440" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Data at rest &amp; in transit</text>

  <!-- Summary -->
  <rect x="720" y="490" width="440" height="100" rx="8" fill="var(--surface)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="940" y="520" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Every request is authenticated, authorized,</text>
  <text x="940" y="542" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">and encrypted regardless of source</text>
  <text x="940" y="570" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">Breach of one resource does not compromise others</text>
</svg>
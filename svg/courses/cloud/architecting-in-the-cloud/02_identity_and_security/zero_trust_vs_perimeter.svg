<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Left Panel: Perimeter Security -->
  <rect x="68.125" y="67.1875" width="553.125" height="534.6875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="344.6875" y="98.9062" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Perimeter Security</text>
  <text x="344.6875" y="119.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">"Castle and Moat" Model</text>

  <!-- Moat -->
  <ellipse cx="344.6875" cy="375.3125" rx="234.375" ry="163.125" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" opacity="0.3"/>
  <text x="344.6875" y="552.0312" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle">Firewall / Moat</text>

  <!-- Castle wall -->
  <rect x="171.25" y="221.25" width="346.875" height="271.875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="344.6875" y="243.9062" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle" font-weight="bold">Internal Network - "Trusted Zone"</text>

  <!-- Internal resources (no locks) -->
  <rect x="190" y="266.5625" width="93.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="236.875" y="293.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)" text-anchor="middle">Server A</text>

  <rect x="302.5" y="266.5625" width="93.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="349.375" y="293.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)" text-anchor="middle">Server B</text>

  <rect x="415" y="266.5625" width="93.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="461.875" y="293.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)" text-anchor="middle">Database</text>

  <!-- Free movement arrows inside -->
  <line x1="283.75" y1="289.2188" x2="300.625" y2="289.2188" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="396.25" y1="289.2188" x2="413.125" y2="289.2188" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="344.6875" y="339.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Free lateral movement!</text>

  <!-- Attacker inside -->
  <rect x="246.25" y="375.3125" width="196.875" height="49.8438" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="344.6875" y="396.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Once inside the perimeter,</text>
  <text x="344.6875" y="413.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">attacker moves freely</text>

  <!-- Single gate -->
  <rect x="311.875" y="470.4688" width="65.625" height="27.1875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="344.6875" y="489.5" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Gate</text>

  <!-- Right Panel: Zero Trust -->
  <rect x="658.75" y="67.1875" width="553.125" height="534.6875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="935.3125" y="98.9062" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Zero Trust</text>
  <text x="935.3125" y="119.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">"Never Trust, Always Verify"</text>

  <!-- Resources with locks/shields -->
  <rect x="696.25" y="157.8125" width="131.25" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="761.875" y="185" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Server A</text>
  <circle cx="813.4375" cy="169.5938" r="11.0609" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="813.4375" y="174.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--bg)" text-anchor="middle">✓</text>

  <rect x="874.375" y="157.8125" width="131.25" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="185" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Server B</text>
  <circle cx="991.5625" cy="169.5938" r="11.0609" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="991.5625" y="174.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--bg)" text-anchor="middle">✓</text>

  <rect x="1052.5" y="157.8125" width="131.25" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.125" y="185" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Database</text>
  <circle cx="1169.6875" cy="169.5938" r="11.0609" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="1169.6875" y="174.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--bg)" text-anchor="middle">✓</text>

  <!-- Verification points -->
  <rect x="715" y="257.5" width="187.5" height="49.8438" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="808.75" y="277.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Identity Verification</text>
  <text x="808.75" y="293.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">MFA + SSO for every request</text>

  <rect x="940" y="257.5" width="187.5" height="49.8438" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="277.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Device Trust</text>
  <text x="1033.75" y="293.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Managed device check</text>

  <rect x="715" y="330" width="187.5" height="49.8438" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="808.75" y="349.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Least Privilege</text>
  <text x="808.75" y="366.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Minimal access per role</text>

  <rect x="940" y="330" width="187.5" height="49.8438" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="349.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Micro-Segmentation</text>
  <text x="1033.75" y="366.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Segment every workload</text>

  <rect x="715" y="402.5" width="187.5" height="49.8438" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="808.75" y="422.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Continuous Monitoring</text>
  <text x="808.75" y="438.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Log and audit everything</text>

  <rect x="940" y="402.5" width="187.5" height="49.8438" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="422.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Encryption</text>
  <text x="1033.75" y="438.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Data at rest &amp; in transit</text>

  <!-- Summary -->
  <rect x="715" y="484.0625" width="412.5" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="921.25" y="511.25" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Every request is authenticated, authorized,</text>
  <text x="921.25" y="531.1875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">and encrypted regardless of source</text>
  <text x="921.25" y="556.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Breach of one resource does not compromise others</text>
</svg>
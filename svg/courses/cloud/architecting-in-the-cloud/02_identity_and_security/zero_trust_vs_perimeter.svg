<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Left Panel: Perimeter Security -->
  <rect x="40" y="40" width="580.327869" height="580" rx="6.400889" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.163934" y="74.406725" font-family="Arial, sans-serif" font-size="21.633191" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Perimeter Security</text>
  <text x="330.163934" y="97.016949" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text-muted)" text-anchor="middle">"Castle and Moat" Model</text>

  <!-- Moat -->
  <ellipse cx="330.163934" cy="374.237288" rx="245.901639" ry="176.949153" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" opacity="0.3"/>
  <text x="330.163934" y="565.932149" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--primary-accent)" text-anchor="middle">Firewall / Moat</text>

  <!-- Castle wall -->
  <rect x="148.196721" y="207.118644" width="363.934426" height="294.915254" rx="6.400889" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330.163934" y="231.694861" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--text-muted)" text-anchor="middle" font-weight="bold">Internal Network - "Trusted Zone"</text>

  <!-- Internal resources (no locks) -->
  <rect x="167.868852" y="256.271186" width="98.360656" height="49.152542" rx="6.400889" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="217.04918" y="285.762712" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--warn-accent)" text-anchor="middle">Server A</text>

  <rect x="285.901639" y="256.271186" width="98.360656" height="49.152542" rx="6.400889" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.081967" y="285.762712" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--warn-accent)" text-anchor="middle">Server B</text>

  <rect x="403.934426" y="256.271186" width="98.360656" height="49.152542" rx="6.400889" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="453.114754" y="285.762712" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--warn-accent)" text-anchor="middle">Database</text>

  <!-- Free movement arrows inside -->
  <line x1="266.229508" y1="280.847512" x2="283.934426" y2="280.847512" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="384.262295" y1="280.847512" x2="401.967213" y2="280.847512" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="330.163934" y="334.915254" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Free lateral movement!</text>

  <!-- Attacker inside -->
  <rect x="226.885246" y="374.237288" width="206.557377" height="54.067851" rx="6.400889" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5,3" filter="url(#shadow)"/>
  <text x="330.163934" y="396.847403" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Once inside the perimeter,</text>
  <text x="330.163934" y="415.525424" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">attacker moves freely</text>

  <!-- Single gate -->
  <rect x="295.737705" y="477.457681" width="68.852459" height="29.491525" rx="6.400889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.163934" y="498.101695" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Gate</text>

  <!-- Right Panel: Zero Trust -->
  <rect x="659.672131" y="40" width="580.327869" height="580" rx="6.400889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.836066" y="74.406725" font-family="Arial, sans-serif" font-size="21.633191" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Zero Trust</text>
  <text x="949.836066" y="97.016949" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text-muted)" text-anchor="middle">"Never Trust, Always Verify"</text>

  <!-- Resources with locks/shields -->
  <rect x="699.016393" y="138.305085" width="137.704918" height="68.813559" rx="6.400889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="767.868852" y="167.79661" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Server A</text>
  <rect x="810.167" y="139.285" width="23.5999" height="23.5999" rx="11.7999" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="821.967213" y="156" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--bg)" text-anchor="middle">✓</text>

  <rect x="885.901639" y="138.305085" width="137.704918" height="68.813559" rx="6.400889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="954.754098" y="167.79661" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Server B</text>
  <rect x="997.053" y="139.285" width="23.5999" height="23.5999" rx="11.7999" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1008.852459" y="156" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--bg)" text-anchor="middle">✓</text>

  <rect x="1072.786885" y="138.305085" width="137.704918" height="68.813559" rx="6.400889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1141.639344" y="167.79661" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Database</text>
  <rect x="1183.94" y="139.285" width="23.5999" height="23.5999" rx="11.7999" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1195.737705" y="156" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--bg)" text-anchor="middle">✓</text>

  <!-- Verification points -->
  <rect x="718.688525" y="246.440678" width="196.721311" height="54.067851" rx="6.400889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="817.04918" y="268.067797" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Identity Verification</text>
  <text x="817.04918" y="285.762712" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)" text-anchor="middle">MFA + SSO for every request</text>

  <rect x="954.754098" y="246.440678" width="196.721311" height="54.067851" rx="6.400889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.114754" y="268.067797" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Device Trust</text>
  <text x="1053.114754" y="285.762712" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)" text-anchor="middle">Managed device check</text>

  <rect x="718.688525" y="325.084746" width="196.721311" height="54.067851" rx="6.400889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="817.04918" y="346.711864" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Least Privilege</text>
  <text x="817.04918" y="364.40678" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)" text-anchor="middle">Minimal access per role</text>

  <rect x="954.754098" y="325.084746" width="196.721311" height="54.067851" rx="6.400889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.114754" y="346.711864" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Micro-Segmentation</text>
  <text x="1053.114754" y="364.40678" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)" text-anchor="middle">Segment every workload</text>

  <rect x="718.688525" y="403.728814" width="196.721311" height="54.067851" rx="6.400889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="817.04918" y="425.355932" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Continuous Monitoring</text>
  <text x="817.04918" y="443.050847" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)" text-anchor="middle">Log and audit everything</text>

  <rect x="954.754098" y="403.728814" width="196.721311" height="54.067851" rx="6.400889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.114754" y="425.355932" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Encryption</text>
  <text x="1053.114754" y="443.050847" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)" text-anchor="middle">Data at rest &amp; in transit</text>

  <!-- Summary -->
  <rect x="718.688525" y="492.20339" width="432.786885" height="98.305085" rx="6.400889" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="935.081967" y="521.694915" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Every request is authenticated, authorized,</text>
  <text x="935.081967" y="543.322034" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">and encrypted regardless of source</text>
  <text x="935.081967" y="570.847458" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)" text-anchor="middle">Breach of one resource does not compromise others</text>
</svg>
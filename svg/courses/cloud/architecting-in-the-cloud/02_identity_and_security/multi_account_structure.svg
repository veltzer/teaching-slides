<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Root Account -->
  <rect x="536.875" y="67.1875" width="206.25" height="54.375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="100.7188" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--bg)" text-anchor="middle" font-weight="bold">Root Account</text>

  <!-- Lines from Root to OUs -->
  <line x1="583.75" y1="121.5625" x2="204.0625" y2="185" stroke="var(--border)" stroke-width="2"/>
  <line x1="611.875" y1="121.5625" x2="475.9375" y2="185" stroke="var(--border)" stroke-width="2"/>
  <line x1="668.125" y1="121.5625" x2="804.0625" y2="185" stroke="var(--border)" stroke-width="2"/>
  <line x1="696.25" y1="121.5625" x2="1075.9375" y2="185" stroke="var(--border)" stroke-width="2"/>

  <!-- OU: Security -->
  <rect x="105.625" y="185" width="196.875" height="54.375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.0625" y="216.7188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">OU: Security</text>
  <!-- SCP badge -->
  <rect x="260.3125" y="180.4688" width="46.875" height="18.125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="283.75" y="193.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle" font-weight="bold">SCP</text>

  <!-- Security accounts -->
  <line x1="152.5" y1="239.375" x2="152.5" y2="293.75" stroke="var(--border)" stroke-width="1.5"/>
  <line x1="255.625" y1="239.375" x2="255.625" y2="293.75" stroke="var(--border)" stroke-width="1.5"/>

  <rect x="91.5625" y="293.75" width="121.875" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="152.5" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Log Archive</text>
  <text x="152.5" y="328.1875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">CloudTrail, Config</text>

  <rect x="194.6875" y="293.75" width="121.875" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="255.625" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Security Tooling</text>
  <text x="255.625" y="328.1875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">GuardDuty, Hub</text>

  <!-- OU: Shared Services -->
  <rect x="377.5" y="185" width="196.875" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="475.9375" y="216.7188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">OU: Shared Services</text>
  <rect x="532.1875" y="180.4688" width="46.875" height="18.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="555.625" y="193.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle" font-weight="bold">SCP</text>

  <!-- Shared accounts -->
  <line x1="424.375" y1="239.375" x2="424.375" y2="293.75" stroke="var(--border)" stroke-width="1.5"/>
  <line x1="527.5" y1="239.375" x2="527.5" y2="293.75" stroke="var(--border)" stroke-width="1.5"/>

  <rect x="363.4375" y="293.75" width="121.875" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="424.375" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Networking</text>
  <text x="424.375" y="328.1875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Transit GW, DNS</text>

  <rect x="466.5625" y="293.75" width="121.875" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="527.5" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">CI/CD</text>
  <text x="527.5" y="328.1875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Pipelines, Artifacts</text>

  <!-- OU: Production -->
  <rect x="705.625" y="185" width="196.875" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="804.0625" y="216.7188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">OU: Production</text>
  <rect x="860.3125" y="180.4688" width="46.875" height="18.125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="883.75" y="193.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle" font-weight="bold">SCP</text>

  <!-- Production accounts -->
  <line x1="752.5" y1="239.375" x2="752.5" y2="293.75" stroke="var(--border)" stroke-width="1.5"/>
  <line x1="855.625" y1="239.375" x2="855.625" y2="293.75" stroke="var(--border)" stroke-width="1.5"/>

  <rect x="691.5625" y="293.75" width="121.875" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="752.5" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Prod - App A</text>
  <text x="752.5" y="328.1875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Workload isolated</text>

  <rect x="794.6875" y="293.75" width="121.875" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="855.625" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Prod - App B</text>
  <text x="855.625" y="328.1875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Workload isolated</text>

  <!-- OU: Development -->
  <rect x="977.5" y="185" width="196.875" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.9375" y="216.7188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">OU: Development</text>
  <rect x="1132.1875" y="180.4688" width="46.875" height="18.125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1155.625" y="193.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle" font-weight="bold">SCP</text>

  <!-- Dev accounts -->
  <line x1="1024.375" y1="239.375" x2="1024.375" y2="293.75" stroke="var(--border)" stroke-width="1.5"/>
  <line x1="1127.5" y1="239.375" x2="1127.5" y2="293.75" stroke="var(--border)" stroke-width="1.5"/>

  <rect x="963.4375" y="293.75" width="121.875" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1024.375" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Dev - Team 1</text>
  <text x="1024.375" y="328.1875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Sandbox</text>

  <rect x="1066.5625" y="293.75" width="121.875" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1127.5" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Dev - Team 2</text>
  <text x="1127.5" y="328.1875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Sandbox</text>

  <!-- Legend box -->
  <rect x="77.5" y="402.5" width="1125" height="199.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="434.2188" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text)" text-anchor="middle" font-weight="bold">Key Concepts</text>

  <rect x="115" y="456.875" width="46.875" height="19.9375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="138.4375" y="471.375" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle" font-weight="bold">SCP</text>
  <text x="175.9375" y="471.375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Service Control Policies - guardrails applied at OU level, inherited by all child accounts</text>

  <text x="115" y="502.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">● Each account is a hard security boundary (blast radius isolation)</text>
  <text x="115" y="524.8438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">● AWS Organizations manages all accounts centrally from the Root</text>
  <text x="115" y="547.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">● Separate environments (dev/prod) prevent accidental production impact</text>
  <text x="115" y="570.1562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">● Consolidated billing across all accounts with cost allocation tags</text>
</svg>
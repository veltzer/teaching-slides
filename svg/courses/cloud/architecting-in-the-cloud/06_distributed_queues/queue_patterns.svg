  <rect x="364.2324" y="260.0886" width="72.9807" height="34.607" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400.723" y="280.8528" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Producer</text>
  <line x1="437.213" y1="277.392" x2="466.4053" y2="277.392" stroke="var(--text-muted)" stroke-width="0.4042" marker-end="url(#arrow)" />
  <rect x="470.0542" y="256.6278" width="124.067" height="41.5283" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="532.088" y="273.9313" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">SQS Queue</text>
  <text x="532.088" y="287.7741" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)" text-anchor="middle">FIFO or Standard</text>
  <line x1="532.088" y1="298.1561" x2="532.088" y2="329.3023" stroke="var(--text-muted)" stroke-width="0.3031" />
  <line x1="532.088" y1="329.3023" x2="408.0208" y2="329.3023" stroke="var(--text-muted)" stroke-width="0.3031" />
  <line x1="532.088" y1="329.3023" x2="532.088" y2="329.3023" stroke="var(--text-muted)" stroke-width="0.3031" />
  <line x1="532.088" y1="329.3023" x2="575.876" y2="329.3023" stroke="var(--text-muted)" stroke-width="0.3031" />
  <line x1="408.0208" y1="329.3023" x2="408.0208" y2="350.0665" stroke="var(--text-muted)" stroke-width="0.3031" marker-end="url(#arrow)" />
  <line x1="488.2994" y1="329.3023" x2="488.2994" y2="350.0665" stroke="var(--text-muted)" stroke-width="0.3031" marker-end="url(#arrow)" />
  <line x1="575.876" y1="329.3023" x2="575.876" y2="350.0665" stroke="var(--text-muted)" stroke-width="0.3031" marker-end="url(#arrow)" />
  <rect x="364.2324" y="353.5271" width="80.2788" height="34.607" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="404.3717" y="374.2913" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Consumer 1</text>
  <rect x="448.1603" y="353.5271" width="80.2788" height="34.607" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="488.2994" y="374.2913" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Consumer 2</text>
  <rect x="532.088" y="353.5271" width="80.2788" height="34.607" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="572.2271" y="374.2913" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Consumer 3</text>
  <text x="481.0014" y="412.3589" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)" text-anchor="middle">Each message processed by exactly</text>
  <text x="481.0014" y="424.8173" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)" text-anchor="middle">one consumer (load distribution)</text>
  <rect x="641.5587" y="204.7175" width="291.9225" height="415.2825" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.5199" y="226.8661" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Fan-Out (SNS + SQS)</text>
  <text x="787.5199" y="240.7088" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)" text-anchor="middle">1 message to N subscribers</text>

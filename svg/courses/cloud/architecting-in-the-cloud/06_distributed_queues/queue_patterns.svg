  <text x="124.1379" y="284.1379" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Work Queue Use Cases</text>
  <text x="33.1034" y="297.931" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">- Background job processing</text>
  <text x="33.1034" y="307.8621" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">- Image/video encoding</text>
  <text x="33.1034" y="317.7931" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">- Order processing pipeline</text>
  <rect x="251.0345" y="270.3448" width="204.1379" height="60.6897" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="353.1034" y="284.1379" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Fan-Out Use Cases</text>
  <text x="262.069" y="297.931" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">- Notify multiple services of event</text>
  <text x="262.069" y="307.8621" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">- Parallel processing pipelines</text>
  <text x="262.069" y="317.7931" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">- Decoupled microservices</text>
  <rect x="480" y="270.3448" width="204.1379" height="60.6897" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="582.069" y="284.1379" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">DLQ Use Cases</text>
  <text x="491.0345" y="297.931" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">- Poison message handling</text>

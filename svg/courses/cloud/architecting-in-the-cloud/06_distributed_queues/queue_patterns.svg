  <line x1="1050.2503" y1="377.7519" x2="1050.2503" y2="398.5159" stroke="var(--danger-border)" stroke-width="0.5052" marker-end="url(#arrow)" />
  <rect x="991.8657" y="401.9768" width="116.7691" height="38.0675" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>

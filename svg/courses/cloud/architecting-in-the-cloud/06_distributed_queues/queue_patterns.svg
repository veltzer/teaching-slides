  <text x="121.3793" y="39.7241" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">1 producer, N competing consumers</text>
  <rect x="33.1034" y="55.1724" width="55.1724" height="27.5862" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="60.6897" y="71.7241" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Producer</text>
  <line x1="88.2759" y1="68.9655" x2="110.3448" y2="68.9655" stroke="var(--text-muted)" stroke-width="1.1034" marker-end="url(#arrow)" />
  <rect x="113.1034" y="52.4138" width="93.7931" height="33.1034" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="160" y="66.2069" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">SQS Queue</text>
  <text x="160" y="77.2414" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">FIFO or Standard</text>

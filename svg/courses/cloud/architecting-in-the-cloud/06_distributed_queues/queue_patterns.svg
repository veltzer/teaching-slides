  <rect x="349.6364" y="530.022" width="270.0284" height="76.1352" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="484.6503" y="547.3257" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Work Queue Use Cases</text>
  <text x="364.2324" y="564.629" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)">- Background job processing</text>
  <text x="364.2324" y="577.0874" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)">- Image/video encoding</text>
  <text x="364.2324" y="589.5458" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)">- Order processing pipeline</text>
  <rect x="652.5058" y="530.022" width="270.0284" height="76.1352" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="787.5199" y="547.3257" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Fan-Out Use Cases</text>
  <text x="667.1021" y="564.629" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)">- Notify multiple services of event</text>
  <text x="667.1021" y="577.0874" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)">- Parallel processing pipelines</text>
  <text x="667.1021" y="589.5458" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)">- Decoupled microservices</text>
  <rect x="955.3753" y="530.022" width="270.0284" height="76.1352" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />

  <rect x="322.7586" y="140.6897" width="60.6897" height="24.8276" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="353.1034" y="155.5862" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">SQS - Search</text>
  <rect x="386.2069" y="140.6897" width="60.6897" height="24.8276" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="416.5517" y="155.5862" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">SQS - Analytics</text>
  <text x="353.1034" y="187.5862" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Same message delivered to all</text>
  <text x="353.1034" y="197.5172" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">subscribers independently</text>

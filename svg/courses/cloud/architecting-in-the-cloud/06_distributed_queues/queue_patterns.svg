  <text x="235" y="75.614035087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--primary-text)">Work Queue</text>
  <text x="235" y="101.052631578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">N competing consumers</text>
  <rect x="80" y="131.578947368421" width="90" height="40.701754385965" rx="6.052402741669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--warn-text)">Producer</text>
  <line x1="170" y1="151.929824561404" x2="210" y2="151.929824561404" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="215" y="131.578947368421" width="140" height="40.701754385965" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--primary-text)">SQS Queue</text>
  <line x1="285" y1="172.280701754386" x2="285" y2="212.982456140351" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="218.070175438596" width="90" height="35.614035087719" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="241.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--ok-text)">Consumer 1</text>
  <rect x="185" y="218.070175438596" width="100" height="35.614035087719" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="241.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--ok-text)">Consumer 2</text>
  <rect x="300" y="218.070175438596" width="100" height="35.614035087719" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="241.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--ok-text)">Consumer 3</text>
  <text x="235" y="289.298245614035" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">Each message to one consumer</text>

  <rect x="445" y="40" width="390" height="274.736842105263" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.614035087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--ok-text)">Fan-Out</text>
  <text x="640" y="101.052631578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">SNS to N subscribers</text>
  <rect x="595" y="121.40350877193" width="90" height="35.614035087719" rx="6.052402741669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="143.789473684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--warn-text)">Producer</text>
  <line x1="640" y1="157.017543859649" x2="640" y2="177.368421052632" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="590" y="182.456140350877" width="100" height="35.614035087719" rx="6.052402741669" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="205.859649122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--info-text)">SNS Topic</text>
  <line x1="600" y1="218.070175438596" x2="540" y2="243.508771929825" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

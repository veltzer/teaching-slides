  <rect x="475" y="248.59649122807" width="95" height="35.614035087719" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="522" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-weight="bold" fill="var(--primary-text)">Email</text>
  <rect x="590" y="248.59649122807" width="100" height="35.614035087719" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-weight="bold" fill="var(--primary-text)">Search</text>
  <rect x="710" y="248.59649122807" width="95" height="35.614035087719" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="757" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-weight="bold" fill="var(--primary-text)">Analytics</text>
  <text x="640" y="304.561403508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">Same message to all subs</text>

  <rect x="850" y="40" width="390" height="274.736842105263" rx="6.052402741669" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="75.614035087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--danger-text)">Dead Letter Queue</text>
  <text x="1045" y="101.052631578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">Failed-message handling</text>
  <rect x="975" y="121.40350877193" width="140" height="40.701754385965" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="146.842105263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--primary-text)">Main Queue</text>
  <line x1="1045" y1="162.105263157895" x2="1045" y2="187.543859649123" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="975" y="192.631578947368" width="140" height="35.614035087719" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="216.035087719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--ok-text)">Consumer</text>
  <text x="1045" y="248.59649122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-weight="bold" fill="var(--danger-text)">After 3 fails</text>
  <line x1="1045" y1="253.684210526316" x2="1045" y2="268.947368421053" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="975" y="274.035087719298" width="140" height="35.614035087719" rx="6.052402741669" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="296.421052631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--danger-text)">DLQ</text>

  <rect x="40" y="345.263157894737" width="390" height="274.736842105263" rx="6.052402741669" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="235" y="375.789473684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--primary-accent)">Work Queue Uses</text>

  <rect x="663.4528" y="367.3699" width="80.2788" height="31.1462" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="703.5923" y="386.0577" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">SQS - Email</text>
  <rect x="747.3806" y="367.3699" width="80.2788" height="31.1462" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.5199" y="386.0577" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">SQS - Search</text>
  <rect x="831.3083" y="367.3699" width="80.2788" height="31.1462" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="871.4476" y="386.0577" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">SQS - Analytics</text>
  <text x="787.5199" y="426.2014" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)" text-anchor="middle">Same message delivered to all</text>
  <text x="787.5199" y="438.66" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)" text-anchor="middle">subscribers independently</text>
  <rect x="948.0775" y="204.7175" width="291.9225" height="415.2825" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.0387" y="226.8661" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Dead Letter Queue</text>
  <text x="1094.0387" y="240.7088" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--text-muted)" text-anchor="middle">Handling failed messages</text>
  <rect x="991.8657" y="260.0886" width="116.7691" height="38.0675" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Panel 1: Work Queue -->
  <rect x="20" y="20" width="400" height="600" rx="12" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
  <text x="220" y="52" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Work Queue</text>
  <text x="220" y="72" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">1 producer, N competing consumers</text>

  <!-- Producer -->
  <rect x="60" y="100" width="100" height="50" rx="8" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="130" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">Producer</text>

  <!-- Arrow to queue -->
  <line x1="160" y1="125" x2="200" y2="125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Queue -->
  <rect x="205" y="95" width="170" height="60" rx="6" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="2"/>
  <text x="290" y="120" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">SQS Queue</text>
  <text x="290" y="140" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">FIFO or Standard</text>

  <!-- Consumers -->
  <line x1="290" y1="155" x2="290" y2="200" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="290" y1="200" x2="120" y2="200" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="290" y1="200" x2="290" y2="200" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="290" y1="200" x2="350" y2="200" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="120" y1="200" x2="120" y2="230" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="200" x2="230" y2="230" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="200" x2="350" y2="230" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="235" width="110" height="50" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="115" y="265" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Consumer 1</text>

  <rect x="175" y="235" width="110" height="50" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="230" y="265" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Consumer 2</text>

  <rect x="290" y="235" width="110" height="50" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="345" y="265" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Consumer 3</text>

  <text x="220" y="320" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Each message processed by exactly</text>
  <text x="220" y="338" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">one consumer (load distribution)</text>

  <!-- Panel 2: Fan-Out -->
  <rect x="440" y="20" width="400" height="600" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2"/>
  <text x="640" y="52" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Fan-Out (SNS + SQS)</text>
  <text x="640" y="72" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">1 message to N subscribers</text>

  <!-- Producer -->
  <rect x="580" y="90" width="120" height="45" rx="8" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="118" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">Producer</text>

  <!-- Arrow to SNS -->
  <line x1="640" y1="135" x2="640" y2="155" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SNS Topic -->
  <rect x="575" y="160" width="130" height="50" rx="8" fill="var(--info-lt)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="185" font-family="Arial, sans-serif" font-size="13" fill="var(--info-dk)" text-anchor="middle" font-weight="bold">SNS Topic</text>
  <text x="640" y="202" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Pub/Sub</text>

  <!-- Fan-out arrows -->
  <line x1="590" y1="210" x2="520" y2="250" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="210" x2="640" y2="250" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="210" x2="760" y2="250" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SQS queues -->
  <rect x="470" y="255" width="110" height="45" rx="6" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="525" y="282" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">SQS - Email</text>

  <rect x="585" y="255" width="110" height="45" rx="6" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="640" y="282" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">SQS - Search</text>

  <rect x="700" y="255" width="110" height="45" rx="6" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="755" y="282" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">SQS - Analytics</text>

  <text x="640" y="340" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Same message delivered to all</text>
  <text x="640" y="358" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">subscribers independently</text>

  <!-- Panel 3: Dead Letter Queue -->
  <rect x="860" y="20" width="400" height="600" rx="12" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2"/>
  <text x="1060" y="52" font-family="Arial, sans-serif" font-size="17" fill="var(--danger-dk)" text-anchor="middle" font-weight="bold">Dead Letter Queue</text>
  <text x="1060" y="72" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Handling failed messages</text>

  <!-- Main Queue -->
  <rect x="920" y="100" width="160" height="55" rx="8" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="125" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Main Queue</text>
  <text x="1000" y="145" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">maxReceiveCount=3</text>

  <!-- Consumer tries -->
  <line x1="1000" y1="155" x2="1000" y2="180" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="920" y="185" width="160" height="45" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="1000" y="212" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Consumer</text>

  <!-- Retry loop -->
  <path d="M1080,207 L1120,207 L1120,127 L1082,127" fill="none" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1150" y="165" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-dk)" text-anchor="middle">Retry 1</text>

  <path d="M1120,207 L1160,207 L1160,127 L1122,127" fill="none" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1190" y="165" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-dk)" text-anchor="middle">Retry 2</text>

  <!-- After N retries -->
  <text x="1000" y="260" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-dk)" text-anchor="middle" font-weight="bold">After 3 failed attempts...</text>

  <line x1="1000" y1="270" x2="1000" y2="300" stroke="var(--danger)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- DLQ -->
  <rect x="920" y="305" width="160" height="55" rx="8" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1000" y="330" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-dk)" text-anchor="middle" font-weight="bold">Dead Letter</text>
  <text x="1000" y="350" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-dk)" text-anchor="middle" font-weight="bold">Queue (DLQ)</text>

  <text x="1060" y="390" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Messages held for</text>
  <text x="1060" y="408" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">inspection &amp; debugging</text>

  <!-- Bottom summary boxes -->
  <rect x="40" y="490" width="370" height="110" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="225" y="515" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Work Queue Use Cases</text>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Background job processing</text>
  <text x="60" y="558" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Image/video encoding</text>
  <text x="60" y="576" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Order processing pipeline</text>

  <rect x="455" y="490" width="370" height="110" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="640" y="515" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Fan-Out Use Cases</text>
  <text x="475" y="540" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Notify multiple services of event</text>
  <text x="475" y="558" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Parallel processing pipelines</text>
  <text x="475" y="576" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Decoupled microservices</text>

  <rect x="870" y="490" width="370" height="110" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="1055" y="515" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)" text-anchor="middle" font-weight="bold">DLQ Use Cases</text>
  <text x="890" y="540" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Poison message handling</text>
  <text x="890" y="558" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Debugging failed processing</text>
  <text x="890" y="576" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- CloudWatch alarms on DLQ depth</text>
</svg>
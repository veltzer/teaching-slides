  <text x="186.8749" y="501.875" font-family="Arial, sans-serif" font-size="14.1602" fill="var(--text-muted)">- Background job processing</text>
  <text x="186.8749" y="515.9376" font-family="Arial, sans-serif" font-size="14.1602" fill="var(--text-muted)">- Image/video encoding</text>

  <line x1="160" y1="110.3448" x2="66.2069" y2="110.3448" stroke="var(--text-muted)" stroke-width="0.8276" />
  <line x1="160" y1="110.3448" x2="160" y2="110.3448" stroke="var(--text-muted)" stroke-width="0.8276" />
  <line x1="160" y1="110.3448" x2="193.1034" y2="110.3448" stroke="var(--text-muted)" stroke-width="0.8276" />
  <line x1="66.2069" y1="110.3448" x2="66.2069" y2="126.8966" stroke="var(--text-muted)" stroke-width="0.8276" marker-end="url(#arrow)" />
  <line x1="126.8966" y1="110.3448" x2="126.8966" y2="126.8966" stroke="var(--text-muted)" stroke-width="0.8276" marker-end="url(#arrow)" />
  <line x1="193.1034" y1="110.3448" x2="193.1034" y2="126.8966" stroke="var(--text-muted)" stroke-width="0.8276" marker-end="url(#arrow)" />
  <rect x="33.1034" y="129.6552" width="60.6897" height="27.5862" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="63.4483" y="146.2069" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Consumer 1</text>
  <rect x="96.5517" y="129.6552" width="60.6897" height="27.5862" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="126.8966" y="146.2069" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Consumer 2</text>
  <rect x="160" y="129.6552" width="60.6897" height="27.5862" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="190.3448" y="146.2069" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Consumer 3</text>
  <text x="121.3793" y="176.5517" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Each message processed by exactly</text>
  <text x="121.3793" y="186.4828" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">one consumer (load distribution)</text>
  <rect x="242.7586" y="11.0345" width="220.6897" height="331.0345" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="353.1034" y="28.6897" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Fan-Out (SNS + SQS)</text>
  <text x="353.1034" y="39.7241" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">1 message to N subscribers</text>

  <text x="551.7241" y="143.4483" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">After 3 failed attempts...</text>
  <line x1="551.7241" y1="148.9655" x2="551.7241" y2="165.5172" stroke="var(--danger-border)" stroke-width="1.3793" marker-end="url(#arrow)" />

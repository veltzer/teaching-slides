  <text x="584.8276" y="28.6897" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Dead Letter Queue</text>
  <text x="584.8276" y="39.7241" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Handling failed messages</text>
  <rect x="507.5862" y="55.1724" width="88.2759" height="30.3448" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />

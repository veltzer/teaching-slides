  <text x="60" y="436.842105263158" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text-muted)">Video encoding</text>
  <text x="60" y="462.280701754386" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text-muted)">Order pipelines</text>

  <rect x="445" y="345.263157894737" width="390" height="274.736842105263" rx="6.052402741669" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="375.789473684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--ok-accent)">Fan-Out Uses</text>
  <text x="465" y="411.40350877193" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text-muted)">Notify services</text>
  <text x="465" y="436.842105263158" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text-muted)">Parallel pipelines</text>
  <text x="465" y="462.280701754386" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text-muted)">Decoupled services</text>

  <rect x="850" y="345.263157894737" width="390" height="274.736842105263" rx="6.052402741669" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1045" y="375.789473684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--danger-accent)">DLQ Uses</text>
  <text x="870" y="411.40350877193" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text-muted)">Poison messages</text>
  <text x="870" y="436.842105263158" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text-muted)">Debug failures</text>
  <text x="870" y="462.280701754386" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text-muted)">Alarms on depth</text>

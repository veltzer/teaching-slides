  <path d="M 1108.6348 334.1472 L 1137.8271 334.1472 L 1137.8271 278.7762 L 1110.0943 278.7762" fill="none" stroke="var(--warn-border)" stroke-width="0.4042" marker-end="url(#arrow)" />
  <text x="1159.7212" y="305.0775" font-family="Arial, sans-serif" font-size="17.1492" fill="var(--warn-accent)" text-anchor="middle">Retry 1</text>
  <path d="M 1137.8271 334.1472 L 1167.0193 334.1472 L 1167.0193 278.7762 L 1139.2866 278.7762" fill="none" stroke="var(--warn-border)" stroke-width="0.4042" marker-end="url(#arrow)" />

  <text x="551.7241" y="193.1034" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Queue (DLQ)</text>
  <text x="584.8276" y="215.1724" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Messages held for</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Left Panel: Queue (SQS) -->
  <rect x="20" y="20" width="600" height="600" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="320" y="55" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Queue (SQS)</text>
  <text x="320" y="78" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">Consume and delete model</text>

  <!-- Producer -->
  <rect x="50" y="110" width="100" height="45" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="138" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Producer</text>

  <line x1="150" y1="132" x2="195" y2="132" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Queue visual - messages in line -->
  <rect x="200" y="105" width="280" height="55" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <!-- Messages -->
  <rect x="210" y="115" width="40" height="35" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="137" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">M1</text>
  <rect x="260" y="115" width="40" height="35" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="280" y="137" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">M2</text>
  <rect x="310" y="115" width="40" height="35" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="137" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">M3</text>
  <rect x="360" y="115" width="40" height="35" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="380" y="137" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">M4</text>
  <rect x="410" y="115" width="40" height="35" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="430" y="137" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">M5</text>

  <!-- Ghost messages (deleted) -->
  <text x="230" y="175" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">deleted</text>
  <text x="280" y="175" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">deleted</text>
  <text x="330" y="175" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">deleted</text>

  <!-- Single consumer -->
  <line x1="480" y1="132" x2="520" y2="132" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="525" y="110" width="80" height="45" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="565" y="138" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Consumer</text>

  <!-- Properties -->
  <rect x="50" y="210" width="540" height="200" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="240" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Queue Characteristics</text>

  <text x="70" y="270" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Delivery: Each message to one consumer</text>
  <text x="70" y="295" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Retention: Deleted after processing</text>
  <text x="70" y="320" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Replay: Not possible (message gone)</text>
  <text x="70" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Ordering: Best effort (FIFO optional)</text>
  <text x="70" y="370" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Consumers: Competing (one wins)</text>
  <text x="70" y="395" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Service: Amazon SQS</text>

  <!-- Use cases -->
  <rect x="50" y="430" width="540" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="320" y="455" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Best For</text>
  <text x="70" y="478" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Task distribution, decoupling, background jobs</text>
  <text x="70" y="498" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Simple producer-consumer with at-least-once delivery</text>

  <!-- VS divider -->
  <circle cx="640" cy="300" r="28" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="307" font-family="Arial, sans-serif" font-size="16" fill="var(--text)" text-anchor="middle" font-weight="bold">VS</text>

  <!-- Right Panel: Stream (Kinesis) -->
  <rect x="660" y="20" width="600" height="600" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="960" y="55" font-family="Arial, sans-serif" font-size="22" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Stream (Kinesis)</text>
  <text x="960" y="78" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">Append-only log model</text>

  <!-- Producer -->
  <rect x="690" y="110" width="100" height="45" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="138" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Producer</text>

  <line x1="790" y1="132" x2="830" y2="132" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stream visual - log with all messages retained -->
  <rect x="835" y="105" width="350" height="55" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="845" y="115" width="40" height="35" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="865" y="137" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">M1</text>
  <rect x="895" y="115" width="40" height="35" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="915" y="137" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">M2</text>
  <rect x="945" y="115" width="40" height="35" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="965" y="137" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">M3</text>
  <rect x="995" y="115" width="40" height="35" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1015" y="137" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">M4</text>
  <rect x="1045" y="115" width="40" height="35" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1065" y="137" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">M5</text>
  <text x="1150" y="137" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">retained!</text>

  <!-- Multiple consumer groups -->
  <line x1="1010" y1="160" x2="1010" y2="175" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="1010" y1="175" x2="900" y2="175" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="1010" y1="175" x2="1120" y2="175" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="900" y1="175" x2="900" y2="185" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1120" y1="175" x2="1120" y2="185" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="840" y="190" width="120" height="30" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="900" y="210" font-family="Arial, sans-serif" font-size="10" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Consumer Group A</text>

  <rect x="1060" y="190" width="120" height="30" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1120" y="210" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Consumer Group B</text>

  <!-- Properties -->
  <rect x="690" y="240" width="540" height="200" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="960" y="270" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Stream Characteristics</text>

  <text x="710" y="300" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Delivery: Each message to all consumer groups</text>
  <text x="710" y="325" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Retention: Messages retained (1-365 days)</text>
  <text x="710" y="350" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Replay: Full replay from any point in time</text>
  <text x="710" y="375" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Ordering: Strict per shard/partition</text>
  <text x="710" y="400" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Consumers: Independent groups, own offset</text>
  <text x="710" y="425" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Service: Amazon Kinesis / Apache Kafka (MSK)</text>

  <!-- Use cases -->
  <rect x="690" y="460" width="540" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="960" y="485" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Best For</text>
  <text x="710" y="508" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Event sourcing, real-time analytics, clickstream</text>
  <text x="710" y="528" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Multiple consumers need same data, replay required</text>

  <!-- Bottom comparison summary -->
  <rect x="50" y="560" width="540" height="45" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="320" y="588" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">SQS: Simpler, serverless, pay-per-message</text>

  <rect x="690" y="560" width="540" height="45" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="960" y="588" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Kinesis: More powerful, replay, multi-consumer</text>
</svg>
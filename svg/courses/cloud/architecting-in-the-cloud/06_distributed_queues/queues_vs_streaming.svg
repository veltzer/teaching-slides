<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="580" height="580" rx="8.069870322226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="75.614035087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--primary-text)">Queue (SQS)</text>
  <text x="330" y="101.052631578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--primary-text)">consume and delete</text>

  <rect x="70" y="131.578947368421" width="100" height="40.701754385965" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-weight="bold" fill="var(--warn-text)">Producer</text>
  <line x1="170" y1="151.929824561404" x2="210" y2="151.929824561404" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="215" y="131.578947368421" width="270" height="40.701754385965" rx="8.069870322226" fill="var(--surface)" stroke="var(--border)"/>
  <text x="350" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text)">M1  M2  M3  M4</text>
  <line x1="485" y1="151.929824561404" x2="525" y2="151.929824561404" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="530" y="131.578947368421" width="80" height="40.701754385965" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-weight="bold" fill="var(--ok-text)">Consumer</text>

  <rect x="70" y="212.982456140351" width="520" height="223.859649122807" rx="8.069870322226" fill="var(--surface)" stroke="var(--border)"/>
  <text x="330" y="243.508771929825" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--text)">Characteristics</text>
  <text x="90" y="279.122807017544" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">one consumer per message</text>
  <text x="90" y="309.649122807018" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">deleted after processing</text>
  <text x="90" y="340.175438596491" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">no replay</text>
  <text x="90" y="370.701754385965" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">best effort order</text>
  <text x="90" y="401.228070175439" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">competing consumers</text>

  <rect x="70" y="457.19298245614" width="520" height="142.456140350877" rx="8.069870322226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="487.719298245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--primary-text)">Best For</text>
  <text x="90" y="523.333333333333" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">task distribution</text>
  <text x="90" y="553.859649122807" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">decoupling, background jobs</text>
  <text x="90" y="584.385964912281" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">at-least-once delivery</text>

  <rect x="660" y="40" width="580" height="580" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="75.614035087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--ok-text)">Stream (Kinesis)</text>
  <text x="950" y="101.052631578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--ok-text)">append-only log</text>

  <rect x="690" y="131.578947368421" width="100" height="40.701754385965" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-weight="bold" fill="var(--warn-text)">Producer</text>
  <line x1="790" y1="151.929824561404" x2="825" y2="151.929824561404" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="830" y="131.578947368421" width="340" height="40.701754385965" rx="8.069870322226" fill="var(--surface)" stroke="var(--border)"/>
  <text x="1000" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text)">M1  M2  M3  M4  M5 (retained)</text>

  <rect x="700" y="192.631578947368" width="200" height="40.701754385965" rx="8.069870322226" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="218.070175438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-weight="bold" fill="var(--info-text)">Consumer Group A</text>
  <rect x="1000" y="192.631578947368" width="200" height="40.701754385965" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="218.070175438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-weight="bold" fill="var(--warn-text)">Consumer Group B</text>

  <rect x="690" y="263.859649122807" width="520" height="183.157894736842" rx="8.069870322226" fill="var(--surface)" stroke="var(--border)"/>
  <text x="950" y="294.385964912281" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--text)">Characteristics</text>
  <text x="710" y="330" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">delivered to all groups</text>
  <text x="710" y="360.526315789474" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">retained 1-365 days</text>
  <text x="710" y="391.052631578947" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">replay from any point</text>
  <text x="710" y="421.578947368421" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">strict shard order</text>

  <rect x="690" y="467.368421052632" width="520" height="132.280701754386" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="497.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--ok-text)">Best For</text>
  <text x="710" y="533.508771929825" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">event sourcing</text>
  <text x="710" y="564.035087719298" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">real-time analytics</text>
  <text x="710" y="589.473684210526" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">multi-consumer replay</text>
</svg>

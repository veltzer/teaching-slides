<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Left Panel: Queue (SQS) -->
  <rect x="58.75" y="58.125" width="562.5" height="543.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="340" y="89.8438" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Queue (SQS)</text>
  <text x="340" y="110.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Consume and delete model</text>

  <!-- Producer -->
  <rect x="86.875" y="139.6875" width="93.75" height="40.7812" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.75" y="165.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Producer</text>

  <line x1="180.625" y1="159.625" x2="222.8125" y2="159.625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Queue visual - messages in line -->
  <rect x="227.5" y="135.1562" width="262.5" height="49.8438" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <!-- Messages -->
  <rect x="236.875" y="144.2188" width="37.5" height="31.7188" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="255.625" y="164.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">M1</text>
  <rect x="283.75" y="144.2188" width="37.5" height="31.7188" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="302.5" y="164.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">M2</text>
  <rect x="330.625" y="144.2188" width="37.5" height="31.7188" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="349.375" y="164.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">M3</text>
  <rect x="377.5" y="144.2188" width="37.5" height="31.7188" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="396.25" y="164.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">M4</text>
  <rect x="424.375" y="144.2188" width="37.5" height="31.7188" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="443.125" y="164.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">M5</text>

  <!-- Ghost messages (deleted) -->
  <text x="255.625" y="198.5938" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">deleted</text>
  <text x="302.5" y="198.5938" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">deleted</text>
  <text x="349.375" y="198.5938" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">deleted</text>

  <!-- Single consumer -->
  <line x1="490" y1="159.625" x2="527.5" y2="159.625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="532.1875" y="139.6875" width="75" height="40.7812" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="569.6875" y="165.0625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Consumer</text>

  <!-- Properties -->
  <rect x="86.875" y="230.3125" width="506.25" height="181.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="340" y="257.5" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Queue Characteristics</text>

  <text x="105.625" y="284.6875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Delivery: Each message to one consumer</text>
  <text x="105.625" y="307.3438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Retention: Deleted after processing</text>
  <text x="105.625" y="330" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Replay: Not possible (message gone)</text>
  <text x="105.625" y="352.6562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Ordering: Best effort (FIFO optional)</text>
  <text x="105.625" y="375.3125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Consumers: Competing (one wins)</text>
  <text x="105.625" y="397.9688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Service: Amazon SQS</text>

  <!-- Use cases -->
  <rect x="86.875" y="429.6875" width="506.25" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="340" y="452.3438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Best For</text>
  <text x="105.625" y="473.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Task distribution, decoupling, background jobs</text>
  <text x="105.625" y="491.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Simple producer-consumer with at-least-once delivery</text>

  <!-- VS divider -->
  <circle cx="640" cy="311.875" r="25.8088" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="318.2188" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text)" text-anchor="middle" font-weight="bold">VS</text>

  <!-- Right Panel: Stream (Kinesis) -->
  <rect x="658.75" y="58.125" width="562.5" height="543.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="89.8438" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Stream (Kinesis)</text>
  <text x="940" y="110.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Append-only log model</text>

  <!-- Producer -->
  <rect x="686.875" y="139.6875" width="93.75" height="40.7812" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="733.75" y="165.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Producer</text>

  <line x1="780.625" y1="159.625" x2="818.125" y2="159.625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stream visual - log with all messages retained -->
  <rect x="822.8125" y="135.1562" width="328.125" height="49.8438" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="832.1875" y="144.2188" width="37.5" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="850.9375" y="164.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">M1</text>
  <rect x="879.0625" y="144.2188" width="37.5" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="897.8125" y="164.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">M2</text>
  <rect x="925.9375" y="144.2188" width="37.5" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="944.6875" y="164.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">M3</text>
  <rect x="972.8125" y="144.2188" width="37.5" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="991.5625" y="164.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">M4</text>
  <rect x="1019.6875" y="144.2188" width="37.5" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1038.4375" y="164.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">M5</text>
  <text x="1118.125" y="164.1562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">retained!</text>

  <!-- Multiple consumer groups -->
  <line x1="986.875" y1="185" x2="986.875" y2="198.5938" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="986.875" y1="198.5938" x2="883.75" y2="198.5938" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="986.875" y1="198.5938" x2="1090" y2="198.5938" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="883.75" y1="198.5938" x2="883.75" y2="207.6562" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1090" y1="198.5938" x2="1090" y2="207.6562" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="827.5" y="212.1875" width="112.5" height="27.1875" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="883.75" y="230.3125" font-family="Arial, sans-serif" font-size="10" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Consumer Group A</text>

  <rect x="1033.75" y="212.1875" width="112.5" height="27.1875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1090" y="230.3125" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Consumer Group B</text>

  <!-- Properties -->
  <rect x="686.875" y="257.5" width="506.25" height="181.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="284.6875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Stream Characteristics</text>

  <text x="705.625" y="311.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Delivery: Each message to all consumer groups</text>
  <text x="705.625" y="334.5312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Retention: Messages retained (1-365 days)</text>
  <text x="705.625" y="357.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Replay: Full replay from any point in time</text>
  <text x="705.625" y="379.8438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Ordering: Strict per shard/partition</text>
  <text x="705.625" y="402.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Consumers: Independent groups, own offset</text>
  <text x="705.625" y="425.1562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Service: Amazon Kinesis / Apache Kafka (MSK)</text>

  <!-- Use cases -->
  <rect x="686.875" y="456.875" width="506.25" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="479.5312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Best For</text>
  <text x="705.625" y="500.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Event sourcing, real-time analytics, clickstream</text>
  <text x="705.625" y="518.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Multiple consumers need same data, replay required</text>

  <!-- Bottom comparison summary -->
  <rect x="86.875" y="547.5" width="506.25" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="340" y="572.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">SQS: Simpler, serverless, pay-per-message</text>

  <rect x="686.875" y="547.5" width="506.25" height="40.7812" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="572.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Kinesis: More powerful, replay, multi-consumer</text>
</svg>
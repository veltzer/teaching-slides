<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Scenario 1: Happy Path (top) -->
  <rect x="40" y="40" width="1200" height="251.333333" rx="6.347324" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="69" font-family="Arial, sans-serif" font-size="16.576672" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Scenario 1: Success - Message Deleted Before Timeout</text>

  <!-- Time axis 1 -->
  <line x1="89.180328" y1="233.333333" x2="1190.819672" y2="233.333333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1200.655738" y="252.666667" font-family="Arial, sans-serif" font-size="10.726132" fill="var(--text-faint)">Time</text>

  <!-- Time markers -->
  <line x1="158.032787" y1="228.500053" x2="158.032787" y2="238.166613" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="158.032787" y="257.499947" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--text-faint)" text-anchor="middle">t=0</text>

  <line x1="403.934426" y1="228.500053" x2="403.934426" y2="238.166613" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="403.934426" y="257.499947" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--text-faint)" text-anchor="middle">t=5s</text>

  <line x1="699.016393" y1="228.500053" x2="699.016393" y2="238.166613" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="699.016393" y="257.499947" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--text-faint)" text-anchor="middle">t=15s</text>

  <line x1="994.098361" y1="228.500053" x2="994.098361" y2="238.166613" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="994.098361" y="257.499947" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--text-faint)" text-anchor="middle">t=30s</text>

  <!-- Message in queue -->
  <rect x="89.180328" y="98" width="68.852459" height="33.833387" rx="6.347324" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="123.606557" y="119.266667" font-family="Arial, sans-serif" font-size="10.726132" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Msg</text>
  <text x="123.606557" y="83.499947" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--text-muted)" text-anchor="middle">In queue</text>

  <!-- ReceiveMessage -->
  <rect x="158.032787" y="98" width="88.52459" height="33.833387" rx="6.347324" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.295082" y="119.266667" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Receive</text>
  <text x="202.295082" y="83.499947" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--warn-accent)" text-anchor="middle">Consumer polls</text>

  <!-- Invisible period -->
  <rect x="256.393443" y="98" width="442.622951" height="33.833387" rx="6.347324" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.704918" y="119.266667" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Message Invisible (Visibility Timeout = 30s)</text>

  <!-- Processing -->
  <rect x="256.393443" y="146.333333" width="295.081967" height="33.833387" rx="6.347324" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="403.934426" y="167.6" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Consumer Processing...</text>

  <!-- Delete -->
  <rect x="561.311475" y="146.333333" width="98.360656" height="33.833387" rx="6.347324" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610.491803" y="167.6" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--bg)" text-anchor="middle" font-weight="bold">Delete!</text>

  <text x="748.196721" y="165.666667" font-family="Arial, sans-serif" font-size="12.676347" fill="var(--ok-accent)" font-weight="bold">Done - message removed from queue</text>

  <!-- Scenario 2: Timeout (bottom) -->
  <rect x="40" y="310.666667" width="1200" height="309.333333" rx="6.347324" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="339.666667" font-family="Arial, sans-serif" font-size="16.576672" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Scenario 2: Failure - Timeout Expires Before Delete</text>

  <!-- Time axis 2 -->
  <line x1="89.180328" y1="513.666667" x2="1190.819672" y2="513.666667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1200.655738" y="533" font-family="Arial, sans-serif" font-size="10.726132" fill="var(--text-faint)">Time</text>

  <!-- Time markers -->
  <line x1="158.032787" y1="508.83328" x2="158.032787" y2="518.500053" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="158.032787" y="537.833387" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--text-faint)" text-anchor="middle">t=0</text>

  <line x1="403.934426" y1="508.83328" x2="403.934426" y2="518.500053" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="403.934426" y="537.833387" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--text-faint)" text-anchor="middle">t=5s</text>

  <line x1="748.196721" y1="508.83328" x2="748.196721" y2="518.500053" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="748.196721" y="537.833387" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--text-faint)" text-anchor="middle">t=30s</text>

  <line x1="1043.278689" y1="508.83328" x2="1043.278689" y2="518.500053" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="1043.278689" y="537.833387" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--text-faint)" text-anchor="middle">t=35s</text>

  <!-- Message in queue -->
  <rect x="89.180328" y="368.666667" width="68.852459" height="33.833387" rx="6.347324" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="123.606557" y="389.933333" font-family="Arial, sans-serif" font-size="10.726132" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Msg</text>

  <!-- ReceiveMessage -->
  <rect x="158.032787" y="368.666667" width="88.52459" height="33.833387" rx="6.347324" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.295082" y="389.933333" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Receive</text>

  <!-- Invisible period with timeout -->
  <rect x="256.393443" y="368.666667" width="491.803279" height="33.833387" rx="6.347324" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="502.295082" y="389.933333" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Message Invisible (Visibility Timeout = 30s)</text>

  <!-- Processing (consumer slow/crashed) -->
  <rect x="256.393443" y="417" width="491.803279" height="33.833387" rx="6.347324" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="502.295082" y="438.266667" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Consumer Processing... (crashed or slow)</text>

  <!-- Timeout expires! -->
  <line x1="748.196721" y1="368.666667" x2="748.196721" y2="349.333333" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="748.196721" y="345.466667" font-family="Arial, sans-serif" font-size="12.676347" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Timeout Expires!</text>

  <!-- Message reappears -->
  <rect x="758.032787" y="368.666667" width="177.04918" height="33.833387" rx="6.347324" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="846.557377" y="389.933333" font-family="Arial, sans-serif" font-size="10.726132" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Message Reappears!</text>

  <!-- Another consumer picks up -->
  <rect x="954.754098" y="368.666667" width="98.360656" height="33.833387" rx="6.347324" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.934426" y="389.933333" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Consumer B</text>
  <text x="1003.934426" y="417" font-family="Arial, sans-serif" font-size="10.578874" fill="var(--ok-accent)" text-anchor="middle">picks up msg</text>

  <!-- Warning -->
  <rect x="748.196721" y="460.500053" width="452.459016" height="38.666667" rx="6.347324" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="974.42623" y="484.666667" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Risk: Duplicate processing if Consumer A eventually succeeds!</text>

  <!-- Best Practices -->
  <rect x="49.836066" y="562" width="1180.327869" height="48.333333" rx="6.347324" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="586.166613" font-family="Arial, sans-serif" font-size="12.676347" fill="var(--text)" text-anchor="middle" font-weight="bold">Best Practices: Set timeout &gt; processing time | Make consumers idempotent | Use heartbeat to extend timeout | Set up DLQ for retries</text>
  <text x="640" y="603.56672" font-family="Arial, sans-serif" font-size="10.726132" fill="var(--text-muted)" text-anchor="middle">Default: 30 seconds | Range: 0 seconds to 12 hours</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Scenario 1: Happy Path (top) -->
  <rect x="68.125" y="58.125" width="1143.75" height="235.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="85.3125" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Scenario 1: Success - Message Deleted Before Timeout</text>

  <!-- Time axis 1 -->
  <line x1="115" y1="239.375" x2="1165" y2="239.375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1174.375" y="257.5" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Time</text>

  <!-- Time markers -->
  <line x1="180.625" y1="234.8438" x2="180.625" y2="243.9062" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="180.625" y="262.0312" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">t=0</text>

  <line x1="415" y1="234.8438" x2="415" y2="243.9062" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="415" y="262.0312" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">t=5s</text>

  <line x1="696.25" y1="234.8438" x2="696.25" y2="243.9062" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="696.25" y="262.0312" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">t=15s</text>

  <line x1="977.5" y1="234.8438" x2="977.5" y2="243.9062" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="977.5" y="262.0312" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">t=30s</text>

  <!-- Message in queue -->
  <rect x="115" y="112.5" width="65.625" height="31.7188" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="147.8125" y="132.4375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Msg</text>
  <text x="147.8125" y="98.9062" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">In queue</text>

  <!-- ReceiveMessage -->
  <rect x="180.625" y="112.5" width="84.375" height="31.7188" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="222.8125" y="132.4375" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Receive</text>
  <text x="222.8125" y="98.9062" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">Consumer polls</text>

  <!-- Invisible period -->
  <rect x="274.375" y="112.5" width="421.875" height="31.7188" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="485.3125" y="132.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Message Invisible (Visibility Timeout = 30s)</text>

  <!-- Processing -->
  <rect x="274.375" y="157.8125" width="281.25" height="31.7188" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="415" y="177.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Consumer Processing...</text>

  <!-- Delete -->
  <rect x="565" y="157.8125" width="93.75" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="611.875" y="177.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--bg)" text-anchor="middle" font-weight="bold">Delete!</text>

  <text x="743.125" y="175.9375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" font-weight="bold">Done - message removed from queue</text>

  <!-- Scenario 2: Timeout (bottom) -->
  <rect x="68.125" y="311.875" width="1143.75" height="290" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="339.0625" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Scenario 2: Failure - Timeout Expires Before Delete</text>

  <!-- Time axis 2 -->
  <line x1="115" y1="502.1875" x2="1165" y2="502.1875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1174.375" y="520.3125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Time</text>

  <!-- Time markers -->
  <line x1="180.625" y1="497.6562" x2="180.625" y2="506.7188" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="180.625" y="524.8438" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">t=0</text>

  <line x1="415" y1="497.6562" x2="415" y2="506.7188" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="415" y="524.8438" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">t=5s</text>

  <line x1="743.125" y1="497.6562" x2="743.125" y2="506.7188" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="743.125" y="524.8438" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">t=30s</text>

  <line x1="1024.375" y1="497.6562" x2="1024.375" y2="506.7188" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="1024.375" y="524.8438" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">t=35s</text>

  <!-- Message in queue -->
  <rect x="115" y="366.25" width="65.625" height="31.7188" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="147.8125" y="386.1875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Msg</text>

  <!-- ReceiveMessage -->
  <rect x="180.625" y="366.25" width="84.375" height="31.7188" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="222.8125" y="386.1875" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Receive</text>

  <!-- Invisible period with timeout -->
  <rect x="274.375" y="366.25" width="468.75" height="31.7188" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="508.75" y="386.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Message Invisible (Visibility Timeout = 30s)</text>

  <!-- Processing (consumer slow/crashed) -->
  <rect x="274.375" y="411.5625" width="468.75" height="31.7188" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="508.75" y="431.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Consumer Processing... (crashed or slow)</text>

  <!-- Timeout expires! -->
  <line x1="743.125" y1="366.25" x2="743.125" y2="348.125" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="743.125" y="344.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Timeout Expires!</text>

  <!-- Message reappears -->
  <rect x="752.5" y="366.25" width="168.75" height="31.7188" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="836.875" y="386.1875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Message Reappears!</text>

  <!-- Another consumer picks up -->
  <rect x="940" y="366.25" width="93.75" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="986.875" y="386.1875" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Consumer B</text>
  <text x="986.875" y="411.5625" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">picks up msg</text>

  <!-- Warning -->
  <rect x="743.125" y="452.3438" width="431.25" height="36.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="958.75" y="475" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Risk: Duplicate processing if Consumer A eventually succeeds!</text>

  <!-- Best Practices -->
  <rect x="77.5" y="547.5" width="1125" height="45.3125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="570.1562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle" font-weight="bold">Best Practices: Set timeout &gt; processing time | Make consumers idempotent | Use heartbeat to extend timeout | Set up DLQ for retries</text>
  <text x="640" y="586.4688" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Default: 30 seconds | Range: 0 seconds to 12 hours</text>
</svg>
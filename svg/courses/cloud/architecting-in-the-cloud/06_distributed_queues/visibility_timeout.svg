<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="256.538461538462" rx="8.44894167246" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="79.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--ok-text)">Success: Delete Before Timeout</text>

  <rect x="80" y="106.923076923077" width="100" height="44.615384615384" rx="6.336706254345" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="134.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--primary-text)">Receive</text>

  <rect x="200" y="106.923076923077" width="480" height="44.615384615384" rx="6.336706254345" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="134.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--info-text)">Invisible (timeout 30s)</text>

  <rect x="200" y="173.846153846153" width="380" height="44.615384615384" rx="6.336706254345" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="201.730769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--primary-text)">Processing...</text>

  <rect x="600" y="173.846153846153" width="120" height="44.615384615384" rx="6.336706254345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="201.730769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--ok-text)">Delete!</text>

  <text x="900" y="201.730769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--ok-text)">Message removed</text>

  <line x1="80" y1="257.5" x2="1200" y2="257.5" stroke="var(--ok-text)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <text x="80" y="279.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" fill="var(--ok-text)">t=0</text>
  <text x="680" y="279.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" fill="var(--ok-text)">t=15s</text>

  <rect x="40" y="330" width="1200" height="290" rx="8.44894167246" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="369.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--danger-text)">Failure: Timeout Expires</text>

  <rect x="80" y="396.923076923077" width="100" height="44.615384615384" rx="6.336706254345" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="424.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--primary-text)">Receive</text>

  <rect x="200" y="396.923076923077" width="480" height="44.615384615384" rx="6.336706254345" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="424.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--info-text)">Invisible (timeout 30s)</text>

  <rect x="200" y="452.692307692308" width="480" height="44.615384615384" rx="6.336706254345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="480.576923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--warn-text)">Consumer A crashed</text>

  <rect x="700" y="396.923076923077" width="220" height="44.615384615384" rx="6.336706254345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="810" y="424.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--warn-text)">Message reappears</text>

  <rect x="940" y="396.923076923077" width="260" height="44.615384615384" rx="6.336706254345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="424.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--ok-text)">Consumer B picks up</text>

  <text x="640" y="536.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--danger-text)">Risk: duplicate processing</text>
  <text x="640" y="575.384615384616" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--danger-text)">Fix: idempotent handlers + heartbeat</text>
  <text x="640" y="603.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--danger-text)">Default 30s; range 0 - 12h</text>
</svg>

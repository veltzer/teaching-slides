<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Center: Cloud Region -->
  <rect x="539.957" y="204.518" width="200.086" height="200.086" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="294.385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.006921" font-weight="bold" fill="var(--primary-accent)">Cloud Region</text>
  <text x="640" y="319.824618" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.005164" fill="var(--text-muted)">Heavy Processing</text>
  <text x="640" y="340.175495" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.005164" fill="var(--text-muted)">ML Training, Analytics</text>
  <!-- Middle Ring: Edge Locations -->
  <!-- Edge Top -->
  <rect x="561.311475" y="80.701754" width="157.377049" height="61.052632" rx="6.512217" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="109.192982" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.005658" font-weight="bold" fill="var(--ok-accent)">Edge Location</text>
  <text x="640" y="129.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--text-muted)">CDN, Lambda@Edge</text>
  <line x1="640" y1="141.754386" x2="640" y2="200.77193" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="659.672131" y="177.368477" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--ok-accent)">~20ms</text>
  <!-- Edge Left -->
  <rect x="207.213115" y="223.157895" width="157.377049" height="61.052632" rx="6.512217" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.901639" y="251.649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.005658" font-weight="bold" fill="var(--ok-accent)">Edge Location</text>
  <text x="285.901639" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--text-muted)">Caching, WAF</text>
  <line x1="364.590164" y1="263.859649" x2="539.672131" y2="284.210526" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="443.278689" y="263.859649" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--ok-accent)">~20ms</text>
  <!-- Edge Right -->
  <rect x="915.409836" y="223.157895" width="157.377049" height="61.052632" rx="6.512217" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="994.098361" y="251.649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.005658" font-weight="bold" fill="var(--ok-accent)">Edge Location</text>
  <text x="994.098361" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--text-muted)">IoT Processing</text>
  <line x1="915.409836" y1="263.859649" x2="740.327869" y2="284.210526" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="817.04918" y="263.859649" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--ok-accent)">~20ms</text>
  <!-- Edge Bottom -->
  <rect x="561.311475" y="467.368421" width="157.377049" height="61.052632" rx="6.512217" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="495.859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.005658" font-weight="bold" fill="var(--ok-accent)">Edge Location</text>
  <text x="640" y="516.210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--text-muted)">Real-time Filter</text>
  <line x1="640" y1="467.368421" x2="640" y2="408.350877" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="659.672131" y="441.929881" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--ok-accent)">~20ms</text>
  <!-- Outer Ring: End Users/Devices -->
  <!-- User Top Left -->
  <rect x="89.180328" y="40" width="137.704918" height="50.877193" rx="6.512217" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="158.032787" y="72.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.005164" font-weight="bold" fill="var(--warn-accent)">Mobile Users</text>
  <line x1="226.885246" y1="70.526316" x2="561.311475" y2="101.052632" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="354.754098" y="72.561404" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--warn-accent)">~5ms</text>

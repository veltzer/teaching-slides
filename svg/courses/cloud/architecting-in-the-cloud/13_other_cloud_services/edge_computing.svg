<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Center: Cloud Region -->
  <circle cx="640" cy="311.875" r="92.1743" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="302.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)">Cloud Region</text>
  <text x="640" y="325.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Heavy Processing</text>
  <text x="640" y="343.5938" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">ML Training, Analytics</text>
  <!-- Middle Ring: Edge Locations -->
  <!-- Edge Top -->
  <rect x="565" y="112.5" width="150" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="137.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Edge Location</text>
  <text x="640" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">CDN, Lambda@Edge</text>
  <line x1="640" y1="166.875" x2="640" y2="219.4375" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="658.75" y="198.5938" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">~20ms</text>
  <!-- Edge Left -->
  <rect x="227.5" y="239.375" width="150" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302.5" y="264.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Edge Location</text>
  <text x="302.5" y="282.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Caching, WAF</text>
  <line x1="377.5" y1="275.625" x2="544.375" y2="293.75" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="452.5" y="275.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">~20ms</text>
  <!-- Edge Right -->
  <rect x="902.5" y="239.375" width="150" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="977.5" y="264.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Edge Location</text>
  <text x="977.5" y="282.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">IoT Processing</text>
  <line x1="902.5" y1="275.625" x2="735.625" y2="293.75" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="808.75" y="275.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">~20ms</text>
  <!-- Edge Bottom -->
  <rect x="565" y="456.875" width="150" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="482.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Edge Location</text>
  <text x="640" y="500.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Real-time Filter</text>
  <line x1="640" y1="456.875" x2="640" y2="404.3125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="658.75" y="434.2188" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">~20ms</text>
  <!-- Outer Ring: End Users/Devices -->
  <!-- User Top Left -->
  <rect x="115" y="76.25" width="131.25" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="180.625" y="105.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Mobile Users</text>
  <line x1="246.25" y1="103.4375" x2="565" y2="130.625" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="368.125" y="105.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">~5ms</text>
  <!-- User Top Right -->
  <rect x="1033.75" y="76.25" width="131.25" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1099.375" y="105.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Web Clients</text>
  <line x1="1033.75" y1="103.4375" x2="715" y2="130.625" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="902.5" y="105.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">~5ms</text>
  <!-- User Left -->
  <rect x="68.125" y="348.125" width="131.25" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="133.75" y="377.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">IoT Devices</text>
  <line x1="199.375" y1="366.25" x2="227.5" y2="284.6875" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="190" y="320.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">~5ms</text>
  <!-- User Right -->
  <rect x="1080.625" y="348.125" width="131.25" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1146.25" y="377.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Sensors</text>
  <line x1="1080.625" y1="366.25" x2="1052.5" y2="284.6875" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="1080.625" y="320.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">~5ms</text>
  <!-- User Bottom -->
  <rect x="377.5" y="547.5" width="131.25" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="443.125" y="576.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Vehicles</text>
  <line x1="443.125" y1="547.5" x2="583.75" y2="502.1875" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="771.25" y="547.5" width="131.25" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="836.875" y="576.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Cameras</text>
  <line x1="836.875" y1="547.5" x2="696.25" y2="502.1875" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <!-- Legend -->
  <rect x="77.5" y="465.9375" width="140.625" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <circle cx="100.9375" cy="488.5938" r="7.3739" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="119.6875" y="493.125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text)">Cloud (100ms+)</text>
  <circle cx="100.9375" cy="511.25" r="7.3739" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="119.6875" y="515.7812" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text)">Edge (~20ms)</text>
  <circle cx="100.9375" cy="529.375" r="7.3739" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="119.6875" y="533.9062" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text)">Device (~5ms)</text>
</svg>
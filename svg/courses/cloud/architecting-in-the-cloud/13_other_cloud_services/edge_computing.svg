  <rect x="1053.114754" y="40" width="137.704918" height="50.877193" rx="6.512217" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.967213" y="72.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.005164" font-weight="bold" fill="var(--warn-accent)">Web Clients</text>
  <line x1="1053.114754" y1="70.526316" x2="718.688525" y2="101.052632" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="915.409836" y="72.561404" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--warn-accent)">~5ms</text>
  <!-- User Left -->
  <rect x="40" y="345.263158" width="137.704918" height="50.877193" rx="6.512217" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="108.852459" y="377.824561" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.005164" font-weight="bold" fill="var(--warn-accent)">IoT Devices</text>
  <line x1="177.704918" y1="365.614035" x2="207.213115" y2="274.035088" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="167.868852" y="314.736842" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--warn-accent)">~5ms</text>
  <!-- User Right -->
  <rect x="1102.295082" y="345.263158" width="137.704918" height="50.877193" rx="6.512217" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1171.147541" y="377.824561" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.005164" font-weight="bold" fill="var(--warn-accent)">Sensors</text>
  <line x1="1102.295082" y1="365.614035" x2="1072.786885" y2="274.035088" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="1102.295082" y="314.736842" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--warn-accent)">~5ms</text>
  <!-- User Bottom -->
  <rect x="364.590164" y="569.122807" width="137.704918" height="50.877193" rx="6.512217" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="433.442623" y="601.684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.005164" font-weight="bold" fill="var(--warn-accent)">Vehicles</text>
  <line x1="433.442623" y1="569.122807" x2="580.983607" y2="518.245614" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="777.704918" y="569.122807" width="137.704918" height="50.877193" rx="6.512217" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="846.557377" y="601.684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.005164" font-weight="bold" fill="var(--warn-accent)">Cameras</text>
  <line x1="846.557377" y1="569.122807" x2="699.016393" y2="518.245614" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <!-- Legend -->
  <rect x="49.836066" y="477.54386" width="147.540984" height="81.403509" rx="6.512217" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="66.4228" y="494.979" width="16.0068" height="16.0068" rx="8.00341" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="94.098361" y="508.070175" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--text)">Cloud (100ms+)</text>
  <rect x="66.4228" y="520.418" width="16.0068" height="16.0068" rx="8.00341" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="94.098361" y="533.508716" font-family="Arial, sans-serif" font-size="11.004779" fill="var(--text)">Edge (~20ms)</text>

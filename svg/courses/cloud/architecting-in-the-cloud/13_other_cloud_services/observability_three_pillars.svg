<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Pillar 1: Metrics -->
  <rect x="40" y="40" width="364.285714" height="393.571429" rx="6.857143" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.142857" y="86.607086" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.282057" font-weight="bold" fill="var(--primary-accent)">Metrics</text>
  <line x1="82.857143" y1="102.142857" x2="361.428571" y2="102.142857" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="222.142857" y="143.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747886" fill="var(--text)">Time-series data</text>
  <text x="222.142857" y="174.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747886" fill="var(--text)">Counters &amp; Gauges</text>
  <text x="222.142857" y="205.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747886" fill="var(--text)">Histograms</text>
  <!-- Metrics mini chart -->
  <rect x="93.571429" y="236.785714" width="257.142857" height="82.857143" rx="6.857143" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <polyline points="109.642857,298.928571 141.785714,278.214286 173.928571,288.571429 206.071429,257.5 238.214286,267.857143 270.357143,247.142857 302.5,262.678629 334.642857,252.321371" fill="none" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="222.142857" y="350.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641029" fill="var(--text-muted)">CloudWatch Metrics</text>
  <text x="222.142857" y="371.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641029" fill="var(--text-muted)">Prometheus, Datadog</text>
  <text x="222.142857" y="412.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.694514" font-weight="bold" fill="var(--primary-accent)">What is happening?</text>
  <!-- Pillar 2: Logs -->
  <rect x="457.857143" y="40" width="364.285714" height="393.571429" rx="6.857143" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="86.607086" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.282057" font-weight="bold" fill="var(--warn-accent)">Logs</text>
  <line x1="500.714286" y1="102.142857" x2="779.285714" y2="102.142857" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="640" y="143.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747886" fill="var(--text)">Structured events</text>
  <text x="640" y="174.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747886" fill="var(--text)">Text records</text>
  <text x="640" y="205.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747886" fill="var(--text)">Error traces</text>
  <!-- Logs mini display -->
  <rect x="511.428571" y="236.785714" width="257.142857" height="82.857143" rx="6.857143" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="527.5" y="260.607086" font-family="monospace" font-size="11.428571" fill="var(--ok-accent)">INFO  request started</text>
  <text x="527.5" y="276.142857" font-family="monospace" font-size="11.428571" fill="var(--warn-accent)">WARN  high latency</text>
  <text x="527.5" y="291.678629" font-family="monospace" font-size="11.428571" fill="var(--danger-accent)">ERROR timeout 500</text>
  <text x="527.5" y="307.214286" font-family="monospace" font-size="11.428571" fill="var(--ok-accent)">INFO  request done</text>
  <text x="640" y="350.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641029" fill="var(--text-muted)">CloudWatch Logs</text>
  <text x="640" y="371.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641029" fill="var(--text-muted)">ELK Stack, Splunk</text>
  <text x="640" y="412.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.694514" font-weight="bold" fill="var(--warn-accent)">Why did it happen?</text>
  <!-- Pillar 3: Traces -->
  <rect x="875.714286" y="40" width="364.285714" height="393.571429" rx="6.857143" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.857143" y="86.607086" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.282057" font-weight="bold" fill="var(--ok-accent)">Traces</text>
  <line x1="918.571429" y1="102.142857" x2="1197.142857" y2="102.142857" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1057.857143" y="143.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747886" fill="var(--text)">Request path</text>
  <text x="1057.857143" y="174.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747886" fill="var(--text)">Through services</text>
  <text x="1057.857143" y="205.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747886" fill="var(--text)">Latency breakdown</text>
  <!-- Traces mini waterfall -->
  <rect x="929.285714" y="236.785714" width="257.142857" height="82.857143" rx="6.857143" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="940" y="249.214286" width="192.857143" height="12.428571" rx="6.857143" fill="var(--primary-fill)" opacity="0.7" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.357143" y="258.535771" font-family="Arial, sans-serif" font-size="11.428571" fill="var(--bg)">API Gateway 200ms</text>
  <rect x="961.428571" y="265.785714" width="128.571429" height="12.428571" rx="6.857143" fill="var(--ok-fill)" opacity="0.7" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="966.785714" y="275.1072" font-family="Arial, sans-serif" font-size="11.428571" fill="var(--bg)">Lambda 100ms</text>
  <rect x="982.857143" y="282.357143" width="85.714286" height="12.428571" rx="6.857143" fill="var(--warn-fill)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="988.214286" y="291.678629" font-family="Arial, sans-serif" font-size="11.428571" fill="var(--bg)">DB 50ms</text>
  <rect x="1004.285714" y="298.928571" width="42.857143" height="12.428571" rx="6.857143" fill="var(--info-fill)" opacity="0.7" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1009.642857" y="308.250057" font-family="Arial, sans-serif" font-size="11.428571" fill="var(--bg)">S3</text>
  <text x="1057.857143" y="350.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641029" fill="var(--text-muted)">X-Ray, Jaeger</text>
  <text x="1057.857143" y="371.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641029" fill="var(--text-muted)">Zipkin, OpenTelemetry</text>
  <text x="1057.857143" y="412.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.694514" font-weight="bold" fill="var(--ok-accent)">Where did it happen?</text>
  <!-- Convergence: Dashboards & Alerts -->
  <line x1="222.142857" y1="433.571429" x2="436.428571" y2="547.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="433.571429" x2="640" y2="535.071429" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1057.857143" y1="433.571429" x2="843.571429" y2="547.5" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="382.857143" y="547.5" width="514.285714" height="72.5" rx="6.857143" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="583.749943" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.068457" font-weight="bold" fill="var(--info-accent)">Dashboards &amp; Alerts</text>
  <text x="640" y="609.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.694514" fill="var(--text-muted)">Unified observability platform</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Pillar 1: Metrics -->
  <rect x="80" y="40" width="340" height="380" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-accent)">Metrics</text>
  <line x1="120" y1="100" x2="380" y2="100" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="250" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Time-series data</text>
  <text x="250" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Counters &amp; Gauges</text>
  <text x="250" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Histograms</text>
  <!-- Metrics mini chart -->
  <rect x="130" y="230" width="240" height="80" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <polyline points="145,290 175,270 205,280 235,250 265,260 295,240 325,255 355,245" fill="none" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">CloudWatch Metrics</text>
  <text x="250" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Prometheus, Datadog</text>
  <text x="250" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">What is happening?</text>
  <!-- Pillar 2: Logs -->
  <rect x="470" y="40" width="340" height="380" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-accent)">Logs</text>
  <line x1="510" y1="100" x2="770" y2="100" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="640" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Structured events</text>
  <text x="640" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Text records</text>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Error traces</text>
  <!-- Logs mini display -->
  <rect x="520" y="230" width="240" height="80" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="535" y="253" font-family="monospace" font-size="10" fill="var(--ok-accent)">INFO  request started</text>
  <text x="535" y="268" font-family="monospace" font-size="10" fill="var(--warn-accent)">WARN  high latency</text>
  <text x="535" y="283" font-family="monospace" font-size="10" fill="var(--danger-accent)">ERROR timeout 500</text>
  <text x="535" y="298" font-family="monospace" font-size="10" fill="var(--ok-accent)">INFO  request done</text>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">CloudWatch Logs</text>
  <text x="640" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">ELK Stack, Splunk</text>
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">Why did it happen?</text>
  <!-- Pillar 3: Traces -->
  <rect x="860" y="40" width="340" height="380" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-accent)">Traces</text>
  <line x1="900" y1="100" x2="1160" y2="100" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1030" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Request path</text>
  <text x="1030" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Through services</text>
  <text x="1030" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Latency breakdown</text>
  <!-- Traces mini waterfall -->
  <rect x="910" y="230" width="240" height="80" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="920" y="242" width="180" height="12" rx="6" fill="var(--primary-fill)" opacity="0.7" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="925" y="251" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)">API Gateway 200ms</text>
  <rect x="940" y="258" width="120" height="12" rx="6" fill="var(--ok-fill)" opacity="0.7" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="945" y="267" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)">Lambda 100ms</text>
  <rect x="960" y="274" width="80" height="12" rx="6" fill="var(--warn-fill)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="965" y="283" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)">DB 50ms</text>
  <rect x="980" y="290" width="40" height="12" rx="6" fill="var(--info-fill)" opacity="0.7" stroke="var(--info-border)" stroke-width="2"/>
  <text x="985" y="299" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)">S3</text>
  <text x="1030" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">X-Ray, Jaeger</text>
  <text x="1030" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Zipkin, OpenTelemetry</text>
  <text x="1030" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Where did it happen?</text>
  <!-- Convergence: Dashboards & Alerts -->
  <line x1="250" y1="420" x2="450" y2="530" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="420" x2="640" y2="518" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1030" y1="420" x2="830" y2="530" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="400" y="530" width="480" height="70" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-accent)">Dashboards &amp; Alerts</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Unified observability platform</text>
</svg>
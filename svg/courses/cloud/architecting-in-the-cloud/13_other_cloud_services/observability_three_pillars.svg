<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Pillar 1: Metrics -->
  <rect x="115" y="76.25" width="318.75" height="344.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="274.375" y="117.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--primary-accent)">Metrics</text>
  <line x1="152.5" y1="130.625" x2="396.25" y2="130.625" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="274.375" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Time-series data</text>
  <text x="274.375" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Counters &amp; Gauges</text>
  <text x="274.375" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Histograms</text>
  <!-- Metrics mini chart -->
  <rect x="161.875" y="248.4375" width="225" height="72.5" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <polyline points="175.9375,302.8125 204.0625,284.6875 232.1875,293.75 260.3125,266.5625 288.4375,275.625 316.5625,257.5 344.6875,271.0938 372.8125,262.0312" fill="none" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="274.375" y="348.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">CloudWatch Metrics</text>
  <text x="274.375" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Prometheus, Datadog</text>
  <text x="274.375" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">What is happening?</text>
  <!-- Pillar 2: Logs -->
  <rect x="480.625" y="76.25" width="318.75" height="344.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="117.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--warn-accent)">Logs</text>
  <line x1="518.125" y1="130.625" x2="761.875" y2="130.625" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="640" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Structured events</text>
  <text x="640" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Text records</text>
  <text x="640" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Error traces</text>
  <!-- Logs mini display -->
  <rect x="527.5" y="248.4375" width="225" height="72.5" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="541.5625" y="269.2812" font-family="monospace" font-size="10" fill="var(--ok-accent)">INFO  request started</text>
  <text x="541.5625" y="282.875" font-family="monospace" font-size="10" fill="var(--warn-accent)">WARN  high latency</text>
  <text x="541.5625" y="296.4688" font-family="monospace" font-size="10" fill="var(--danger-accent)">ERROR timeout 500</text>
  <text x="541.5625" y="310.0625" font-family="monospace" font-size="10" fill="var(--ok-accent)">INFO  request done</text>
  <text x="640" y="348.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">CloudWatch Logs</text>
  <text x="640" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">ELK Stack, Splunk</text>
  <text x="640" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Why did it happen?</text>
  <!-- Pillar 3: Traces -->
  <rect x="846.25" y="76.25" width="318.75" height="344.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1005.625" y="117.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--ok-accent)">Traces</text>
  <line x1="883.75" y1="130.625" x2="1127.5" y2="130.625" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1005.625" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Request path</text>
  <text x="1005.625" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Through services</text>
  <text x="1005.625" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">Latency breakdown</text>
  <!-- Traces mini waterfall -->
  <rect x="893.125" y="248.4375" width="225" height="72.5" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="902.5" y="259.3125" width="168.75" height="10.875" rx="6" fill="var(--primary-fill)" opacity="0.7" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="907.1875" y="267.4688" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)">API Gateway 200ms</text>
  <rect x="921.25" y="273.8125" width="112.5" height="10.875" rx="6" fill="var(--ok-fill)" opacity="0.7" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="925.9375" y="281.9688" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)">Lambda 100ms</text>
  <rect x="940" y="288.3125" width="75" height="10.875" rx="6" fill="var(--warn-fill)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="944.6875" y="296.4688" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)">DB 50ms</text>
  <rect x="958.75" y="302.8125" width="37.5" height="10.875" rx="6" fill="var(--info-fill)" opacity="0.7" stroke="var(--info-border)" stroke-width="2"/>
  <text x="963.4375" y="310.9688" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)">S3</text>
  <text x="1005.625" y="348.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">X-Ray, Jaeger</text>
  <text x="1005.625" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Zipkin, OpenTelemetry</text>
  <text x="1005.625" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Where did it happen?</text>
  <!-- Convergence: Dashboards & Alerts -->
  <line x1="274.375" y1="420.625" x2="461.875" y2="520.3125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="420.625" x2="640" y2="509.4375" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1005.625" y1="420.625" x2="818.125" y2="520.3125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="415" y="520.3125" width="450" height="63.4375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="552.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--info-accent)">Dashboards &amp; Alerts</text>
  <text x="640" y="574.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Unified observability platform</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Panel 1: Silo Model -->
  <rect x="40" y="40" width="373.109244" height="481.509434" rx="6.83809" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.554622" y="83.773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.110806" font-weight="bold" fill="var(--danger-accent)">Silo Model</text>
  <text x="226.554622" y="111.132015" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--text-muted)">Separate resources per tenant</text>
  <!-- Tenant A resources -->
  <rect x="70.252101" y="138.490566" width="141.176471" height="186.037736" rx="6.83809" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="140.840336" y="165.849117" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" font-weight="bold" fill="var(--danger-accent)">Tenant A</text>
  <rect x="85.378151" y="176.792392" width="110.92437" height="27.35843" rx="6.83809" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.840336" y="196.490626" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">Compute</text>
  <rect x="85.378151" y="215.09434" width="110.92437" height="27.35843" rx="6.83809" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.840336" y="234.792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">Database</text>
  <rect x="85.378151" y="253.396287" width="110.92437" height="27.35843" rx="6.83809" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.840336" y="273.094279" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">Storage</text>
  <!-- Tenant B resources -->
  <rect x="231.596639" y="138.490566" width="141.176471" height="186.037736" rx="6.83809" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="302.184874" y="165.849117" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" font-weight="bold" fill="var(--danger-accent)">Tenant B</text>
  <rect x="246.722689" y="176.792392" width="110.92437" height="27.35843" rx="6.83809" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302.184874" y="196.490626" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">Compute</text>
  <rect x="246.722689" y="215.09434" width="110.92437" height="27.35843" rx="6.83809" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302.184874" y="234.792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">Database</text>
  <rect x="246.722689" y="253.396287" width="110.92437" height="27.35843" rx="6.83809" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302.184874" y="273.094279" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">Storage</text>
  <!-- Trade-offs -->
  <text x="226.554622" y="373.773525" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--ok-accent)">+ Maximum isolation</text>
  <text x="226.554622" y="401.132075" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--ok-accent)">+ Easy compliance</text>
  <text x="226.554622" y="433.962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--danger-accent)">- Highest cost</text>
  <text x="226.554622" y="461.320694" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--danger-accent)">- Complex management</text>
  <text x="226.554622" y="499.622642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--danger-accent)">- Poor resource utilization</text>
  <!-- Panel 2: Pool Model -->
  <rect x="453.445378" y="40" width="373.109244" height="481.509434" rx="6.83809" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.110806" font-weight="bold" fill="var(--ok-accent)">Pool Model</text>
  <text x="640" y="111.132015" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--text-muted)">Shared resources, logical isolation</text>
  <!-- Shared resources with tenant labels -->
  <rect x="483.697479" y="138.490566" width="312.605042" height="186.037736" rx="6.83809" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="640" y="165.849117" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" font-weight="bold" fill="var(--ok-accent)">Shared Infrastructure</text>
  <rect x="498.823529" y="176.792392" width="282.352941" height="27.35843" rx="6.83809" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="196.490626" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">Shared Compute (A + B + C)</text>
  <rect x="498.823529" y="215.09434" width="282.352941" height="27.35843" rx="6.83809" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="234.792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">Shared Database (tenant_id column)</text>
  <rect x="498.823529" y="253.396287" width="282.352941" height="27.35843" rx="6.83809" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="273.094279" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">Shared Storage (prefix-based)</text>
  <!-- Trade-offs -->
  <text x="640" y="373.773525" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--ok-accent)">+ Most cost efficient</text>
  <text x="640" y="401.132075" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--ok-accent)">+ Simple management</text>
  <text x="640" y="433.962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--danger-accent)">- Noisy neighbor risk</text>
  <text x="640" y="461.320694" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--danger-accent)">- Cross-tenant data risk</text>
  <text x="640" y="499.622642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--danger-accent)">- Complex data isolation</text>
  <!-- Panel 3: Bridge Model -->
  <rect x="866.890756" y="40" width="373.109244" height="481.509434" rx="6.83809" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.445378" y="83.773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.110806" font-weight="bold" fill="var(--warn-accent)">Bridge Model</text>
  <text x="1053.445378" y="111.132015" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--text-muted)">Mix of silo and pool</text>
  <!-- Shared compute, separate DB -->
  <rect x="897.142857" y="138.490566" width="312.605042" height="186.037736" rx="6.83809" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="1053.445378" y="165.849117" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" font-weight="bold" fill="var(--warn-accent)">Hybrid Approach</text>
  <rect x="912.268908" y="176.792392" width="282.352941" height="27.35843" rx="6.83809" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.445378" y="196.490626" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">Shared Compute (pooled)</text>
  <rect x="912.268908" y="215.09434" width="131.092437" height="27.35843" rx="6.83809" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="977.815126" y="234.792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">DB: Tenant A</text>
  <rect x="1063.529412" y="215.09434" width="131.092437" height="27.35843" rx="6.83809" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1129.07563" y="234.792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">DB: Tenant B</text>
  <rect x="912.268908" y="253.396287" width="282.352941" height="27.35843" rx="6.83809" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.445378" y="273.094279" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.396817" fill="var(--text)">Shared Storage (isolated buckets)</text>
  <!-- Trade-offs -->
  <text x="1053.445378" y="373.773525" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--ok-accent)">+ Balanced cost</text>
  <text x="1053.445378" y="401.132075" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--ok-accent)">+ Good data isolation</text>
  <text x="1053.445378" y="433.962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--ok-accent)">+ Flexible per-tier</text>
  <text x="1053.445378" y="466.792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--danger-accent)">- More complex arch</text>
  <text x="1053.445378" y="499.622642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.656463" fill="var(--danger-accent)">- Tier management</text>
  <!-- Bottom spectrum -->
  <rect x="100.504202" y="565.283019" width="1089.07563" height="54.716981" rx="6.83809" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="226.554622" y="600.301887" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.706908" font-weight="bold" fill="var(--danger-accent)">High Isolation</text>
  <text x="645.042017" y="600.301887" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.706908" font-weight="bold" fill="var(--text-muted)">←  Trade-off Spectrum  →</text>
  <text x="1053.445378" y="600.301887" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.706908" font-weight="bold" fill="var(--ok-accent)">High Efficiency</text>
</svg>
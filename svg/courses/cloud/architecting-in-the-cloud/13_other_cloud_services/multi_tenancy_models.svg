<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.945761708923" font-weight="bold" fill="var(--text)">Multi-Tenancy Models</text>

  <rect x="40" y="61.481481481481" width="390" height="510.185185185185" rx="10.363754503432" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="99.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80025990755" font-weight="bold" fill="var(--danger-text)">Silo</text>
  <text x="235" y="129.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">Separate per tenant</text>
  <rect x="70" y="152.777777777778" width="150" height="182.592592592593" rx="6.218252702059" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="145" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--text)">Tenant A</text>
  <text x="145" y="215.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text)">Compute</text>
  <text x="145" y="247.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text)">Database</text>
  <text x="145" y="279.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text)">Storage</text>
  <rect x="250" y="152.777777777778" width="150" height="182.592592592593" rx="6.218252702059" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="325" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--text)">Tenant B</text>
  <text x="325" y="215.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text)">Compute</text>
  <text x="325" y="247.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text)">Database</text>
  <text x="325" y="279.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text)">Storage</text>
  <text x="235" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">+ Max isolation</text>
  <text x="235" y="423.444444444445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">+ Easy compliance</text>
  <text x="235" y="458.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">- Highest cost</text>
  <text x="235" y="487.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">- Complex mgmt</text>
  <text x="235" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">- Poor utilization</text>

  <rect x="445" y="61.481481481481" width="390" height="510.185185185185" rx="10.363754503432" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="99.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80025990755" font-weight="bold" fill="var(--ok-text)">Pool</text>
  <text x="640" y="129.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">Shared, logical split</text>
  <rect x="475" y="152.777777777778" width="330" height="182.592592592593" rx="6.218252702059" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="640" y="190.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--text)">Shared stack</text>
  <text x="640" y="225.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text)">Compute pool</text>
  <text x="640" y="258.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text)">DB tenant_id column</text>
  <text x="640" y="290.259259259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text)">Prefix storage</text>
  <text x="640" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">+ Lowest cost</text>
  <text x="640" y="423.444444444445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">+ Simple ops</text>
  <text x="640" y="458.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">- Noisy neighbor</text>
  <text x="640" y="487.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">- Data leak risk</text>
  <text x="640" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">- Harder isolation</text>

  <rect x="850" y="61.481481481481" width="390" height="510.185185185185" rx="10.363754503432" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="99.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80025990755" font-weight="bold" fill="var(--warn-text)">Bridge</text>
  <text x="1045" y="129.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Mixed per tier</text>
  <rect x="880" y="152.777777777778" width="330" height="182.592592592593" rx="6.218252702059" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="1045" y="190.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--text)">Hybrid</text>
  <text x="1045" y="225.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text)">Compute pool</text>
  <text x="1045" y="258.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text)">DB per tenant</text>
  <text x="1045" y="290.259259259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text)">Isolated buckets</text>
  <text x="1045" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">+ Balanced cost</text>
  <text x="1045" y="423.444444444445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">+ Data isolated</text>
  <text x="1045" y="458.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">+ Flexible</text>
  <text x="1045" y="487.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">- More complex</text>

  <text x="235" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--danger-accent)">Isolation</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--text-muted)">← trade-off →</text>
  <text x="1045" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--ok-accent)">Efficiency</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Pipeline flow line -->
  <line x1="69.508197" y1="145.454545" x2="1230.163934" y2="145.454545" stroke="var(--border)" stroke-width="2" stroke-dasharray="10,5"/>
  <!-- Stage 1: Code Repo -->
  <rect x="40" y="40" width="137.704918" height="105.454545" rx="7.412078" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="108.852459" y="86.136436" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.941403" font-weight="bold" fill="var(--primary-accent)">Code Repo</text>
  <text x="108.852459" y="112.500073" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.525423" fill="var(--text-muted)">Git Push</text>
  <line x1="177.704918" y1="92.727273" x2="207.213115" y2="92.727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="108.852459" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.525423" fill="var(--text-faint)">CodeCommit</text>
  <text x="108.852459" y="217.954618" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.525423" fill="var(--text-faint)">GitHub</text>
  <!-- Stage 2: Build -->
  <rect x="217.04918" y="40" width="137.704918" height="105.454545" rx="7.412078" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.901639" y="86.136436" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.941403" font-weight="bold" fill="var(--warn-accent)">Build</text>
  <text x="285.901639" y="112.500073" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.525423" fill="var(--text-muted)">Compile, Package</text>
  <line x1="354.754098" y1="92.727273" x2="384.262295" y2="92.727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285.901639" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.525423" fill="var(--text-faint)">CodeBuild</text>
  <!-- Stage 3: Unit Tests -->
  <rect x="394.098361" y="40" width="137.704918" height="105.454545" rx="7.412078" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="462.95082" y="86.136436" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.941403" font-weight="bold" fill="var(--info-accent)">Unit Tests</text>
  <text x="462.95082" y="112.500073" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.525423" fill="var(--text-muted)">Automated</text>
  <line x1="531.803279" y1="92.727273" x2="561.311475" y2="92.727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462.95082" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.525423" fill="var(--text-faint)">CodeBuild</text>
  <!-- Stage 4: Stage Deploy -->
  <rect x="571.147541" y="40" width="137.704918" height="105.454545" rx="7.412078" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="79.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.802784" font-weight="bold" fill="var(--ok-accent)">Stage</text>
  <text x="640" y="105.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.802784" font-weight="bold" fill="var(--ok-accent)">Deploy</text>
  <line x1="708.852459" y1="92.727273" x2="738.360656" y2="92.727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.525423" fill="var(--text-faint)">CodeDeploy</text>
  <!-- Stage 5: Integration Tests -->
  <rect x="748.196721" y="40" width="137.704918" height="105.454545" rx="7.412078" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="817.04918" y="79.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.802784" font-weight="bold" fill="var(--info-accent)">Integration</text>
  <text x="817.04918" y="105.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.802784" font-weight="bold" fill="var(--info-accent)">Tests</text>
  <line x1="885.901639" y1="92.727273" x2="915.409836" y2="92.727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="817.04918" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.525423" fill="var(--text-faint)">CodeBuild</text>
  <!-- Stage 6: Approval Gate -->
  <rect x="925.245902" y="40" width="137.704918" height="105.454545" rx="7.412078" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="994.098361" y="79.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.802784" font-weight="bold" fill="var(--warn-accent)">Approval</text>
  <text x="994.098361" y="105.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.802784" font-weight="bold" fill="var(--warn-accent)">Gate</text>
  <line x1="1062.95082" y1="92.727273" x2="1092.459016" y2="92.727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="994.098361" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.525423" fill="var(--text-faint)">Manual/Auto</text>
  <!-- Stage 7: Prod Deploy -->
  <rect x="1102.295082" y="40" width="137.704918" height="105.454545" rx="7.412078" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1171.147541" y="79.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.802784" font-weight="bold" fill="var(--ok-accent)">Production</text>
  <text x="1171.147541" y="105.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.802784" font-weight="bold" fill="var(--ok-accent)">Deploy</text>
  <text x="1171.147541" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.525423" fill="var(--text-faint)">CodeDeploy</text>
  <!-- Orchestrator bar -->
  <rect x="40" y="290.454545" width="1200" height="65.909091" rx="7.412078" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="332.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.218764" font-weight="bold" fill="var(--primary-accent)">AWS CodePipeline - Orchestration Layer</text>
  <!-- Deployment strategies -->
  <rect x="108.852459" y="422.272727" width="245.901639" height="131.818182" rx="7.412078" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.803279" y="461.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.941403" font-weight="bold" fill="var(--ok-accent)">Blue/Green</text>
  <text x="231.803279" y="494.772655" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.664042" fill="var(--text-muted)">Zero downtime swap</text>
  <text x="231.803279" y="521.136291" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.664042" fill="var(--text-muted)">between environments</text>
  <rect x="403.934426" y="422.272727" width="245.901639" height="131.818182" rx="7.412078" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="526.885246" y="461.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.941403" font-weight="bold" fill="var(--warn-accent)">Canary</text>
  <text x="526.885246" y="494.772655" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.664042" fill="var(--text-muted)">Gradual rollout</text>
  <text x="526.885246" y="521.136291" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.664042" fill="var(--text-muted)">10% -&gt; 50% -&gt; 100%</text>
  <rect x="699.016393" y="422.272727" width="245.901639" height="131.818182" rx="7.412078" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="821.967213" y="461.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.941403" font-weight="bold" fill="var(--primary-accent)">Rolling</text>
  <text x="821.967213" y="494.772655" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.664042" fill="var(--text-muted)">Update instances</text>
  <text x="821.967213" y="521.136291" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.664042" fill="var(--text-muted)">in batches</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.941403" font-weight="bold" fill="var(--text-muted)">Deployment Strategies</text>
</svg>

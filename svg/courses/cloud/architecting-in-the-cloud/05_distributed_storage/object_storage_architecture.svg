<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Client -->
  <rect x="68.125" y="239.375" width="131.25" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="133.75" y="271.0938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)" text-anchor="middle" font-weight="bold">Client</text>
  <text x="133.75" y="289.2188" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">SDK / CLI</text>
  <text x="133.75" y="307.3438" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">PUT/GET by key</text>

  <!-- Arrow Client -> API -->
  <line x1="199.375" y1="284.6875" x2="265" y2="284.6875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="232.1875" y="275.625" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">HTTPS</text>

  <!-- HTTP API Layer -->
  <rect x="269.6875" y="203.125" width="168.75" height="163.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="354.0625" y="234.8438" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">HTTP API</text>
  <text x="354.0625" y="257.5" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">REST / S3 API</text>
  <rect x="288.4375" y="271.0938" width="131.25" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="354.0625" y="289.2188" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">PUT bucket/key → object</text>
  <rect x="288.4375" y="307.3438" width="131.25" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="354.0625" y="325.4688" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">GET bucket/key → data</text>

  <!-- Arrow API -> Routing -->
  <line x1="438.4375" y1="284.6875" x2="499.375" y2="284.6875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468.4375" y="275.625" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">Route</text>

  <!-- Routing / Partitioning Layer -->
  <rect x="504.0625" y="216.7188" width="150" height="135.9375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="579.0625" y="243.9062" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Partition</text>
  <text x="579.0625" y="262.0312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Router</text>
  <text x="579.0625" y="289.2188" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Hash(key) → node</text>
  <text x="579.0625" y="307.3438" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Consistent hashing</text>
  <text x="579.0625" y="325.4688" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">for distribution</text>

  <!-- Arrows to AZs -->
  <line x1="654.0625" y1="257.5" x2="724.375" y2="148.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="654.0625" y1="284.6875" x2="724.375" y2="311.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="654.0625" y1="320.9375" x2="724.375" y2="475" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AZ 1 -->
  <rect x="729.0625" y="76.25" width="478.125" height="135.9375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="968.125" y="98.9062" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Availability Zone 1</text>

  <rect x="752.5" y="112.5" width="84.375" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="794.6875" y="135.1562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Node 1</text>
  <text x="794.6875" y="153.2812" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Partition A</text>
  <text x="794.6875" y="166.875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Partition D</text>

  <rect x="855.625" y="112.5" width="84.375" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="897.8125" y="135.1562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Node 2</text>
  <text x="897.8125" y="153.2812" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Partition B</text>
  <text x="897.8125" y="166.875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Partition E</text>

  <rect x="958.75" y="112.5" width="84.375" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1000.9375" y="135.1562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Node 3</text>
  <text x="1000.9375" y="153.2812" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Partition C</text>
  <text x="1000.9375" y="166.875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Partition F</text>

  <!-- AZ 2 -->
  <rect x="729.0625" y="239.375" width="478.125" height="135.9375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="968.125" y="262.0312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Availability Zone 2 (Replica)</text>

  <rect x="752.5" y="275.625" width="84.375" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="794.6875" y="298.2812" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Node 4</text>
  <text x="794.6875" y="320.9375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">A, D copy</text>

  <rect x="855.625" y="275.625" width="84.375" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="897.8125" y="298.2812" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Node 5</text>
  <text x="897.8125" y="320.9375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">B, E copy</text>

  <rect x="958.75" y="275.625" width="84.375" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1000.9375" y="298.2812" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Node 6</text>
  <text x="1000.9375" y="320.9375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">C, F copy</text>

  <!-- AZ 3 -->
  <rect x="729.0625" y="402.5" width="478.125" height="135.9375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="968.125" y="425.1562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Availability Zone 3 (Replica)</text>

  <rect x="752.5" y="438.75" width="84.375" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="794.6875" y="461.4062" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Node 7</text>
  <text x="794.6875" y="484.0625" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">A, D copy</text>

  <rect x="855.625" y="438.75" width="84.375" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="897.8125" y="461.4062" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Node 8</text>
  <text x="897.8125" y="484.0625" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">B, E copy</text>

  <rect x="958.75" y="438.75" width="84.375" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1000.9375" y="461.4062" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Node 9</text>
  <text x="1000.9375" y="484.0625" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">C, F copy</text>

  <!-- Replication arrows between AZs -->
  <line x1="1071.25" y1="212.1875" x2="1071.25" y2="237.5625" stroke="var(--info-border)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="1071.25" y1="375.3125" x2="1071.25" y2="400.6875" stroke="var(--info-border)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="1127.5" y="225.7812" font-family="Arial, sans-serif" font-size="10" fill="var(--info-accent)">Replicate</text>
  <text x="1127.5" y="388.9062" font-family="Arial, sans-serif" font-size="10" fill="var(--info-accent)">Replicate</text>

  <!-- Bottom: Key properties -->
  <rect x="77.5" y="556.5625" width="1125" height="49.8438" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="579.2188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle" font-weight="bold">S3: 11 nines durability (99.999999999%) | 3 AZ replication | Key-value access (bucket + key) | Unlimited scale</text>
  <text x="640" y="597.3438" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Objects stored as flat namespace, no hierarchy. Prefix-based partitioning for performance.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="50" y="55.535714285714" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--danger-accent)">Expensive</text>
  <text x="50" y="76.25" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">Fast / Frequent</text>

  <line x1="40" y1="91.785714285714" x2="40" y2="588.928571428571" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="50" y="583.75" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--ok-accent)">Cheapest</text>
  <text x="50" y="604.464285714286" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">Slow / Rare</text>

  <rect x="150" y="40" width="1090" height="119.107142857143" rx="6.106202935189" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="81.428571428571" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--primary-text)">HOT - S3 Standard</text>
  <text x="390" y="110.428571428571" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">Frequent access</text>
  <text x="390" y="138.392857142857" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--primary-text)">ms access | 3 AZ</text>
  <rect x="850" y="60.714285714286" width="180" height="39.357142857143" rx="6.106202935189" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="940" y="86.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--primary-accent)">$0.023 / GB</text>

  <line x1="640" y1="162.214285714286" x2="640" y2="179.821428571429" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="176.714285714286" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--text-faint)">after 30 days</text>

  <rect x="210" y="185" width="970" height="119.107142857143" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="226.428571428571" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--warn-text)">WARM - S3 IA</text>
  <text x="430" y="255.428571428571" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-text)">Rapid but rare</text>
  <text x="430" y="283.392857142857" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--warn-text)">Retrieval fee</text>
  <rect x="860" y="205.714285714286" width="180" height="39.357142857143" rx="6.106202935189" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="950" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--warn-accent)">$0.0125 / GB</text>

  <line x1="640" y1="307.214285714286" x2="640" y2="324.821428571429" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="321.714285714286" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--text-faint)">after 90 days</text>

  <rect x="270" y="330" width="850" height="119.107142857143" rx="6.106202935189" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="371.428571428571" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--info-text)">COLD - Glacier Instant</text>
  <text x="470" y="400.428571428572" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">Instant retrieval</text>
  <text x="470" y="428.392857142857" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--info-text)">Higher fee</text>
  <rect x="860" y="350.714285714286" width="180" height="39.357142857143" rx="6.106202935189" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="950" y="376.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--info-accent)">$0.004 / GB</text>

  <line x1="640" y1="452.214285714286" x2="640" y2="469.821428571429" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="466.714285714286" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--text-faint)">after 365 days</text>

  <rect x="330" y="475" width="730" height="119.107142857143" rx="6.106202935189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="516.428571428571" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--ok-text)">DEEP ARCHIVE</text>
  <text x="520" y="545.428571428571" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--ok-text)">Long-term retention</text>
  <text x="520" y="573.392857142857" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--ok-text)">12+ hour retrieval</text>
  <rect x="860" y="495.714285714286" width="180" height="39.357142857143" rx="6.106202935189" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="950" y="521.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--ok-accent)">$0.00099 / GB</text>

  <text x="1100" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" font-weight="bold" fill="var(--ok-accent)">~96% cheaper</text>
</svg>

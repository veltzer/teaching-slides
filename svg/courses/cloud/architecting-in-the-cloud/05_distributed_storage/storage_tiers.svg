<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Left side labels -->
  <text x="96.25" y="85.3125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)" font-weight="bold">Expensive</text>
  <text x="96.25" y="101.625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Fast access</text>
  <text x="96.25" y="117.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Frequent use</text>

  <!-- Arrow down left side -->
  <line x1="86.875" y1="130.625" x2="86.875" y2="583.75" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="96.25" y="574.6875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Cheapest</text>
  <text x="96.25" y="591" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Slow retrieval</text>
  <text x="96.25" y="607.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Rare access</text>

  <!-- Tier 1: Hot (S3 Standard) - widest -->
  <rect x="190" y="67.1875" width="1012.5" height="108.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="415" y="103.4375" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--primary-accent)" font-weight="bold">HOT - S3 Standard</text>
  <text x="415" y="126.0938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Frequently accessed data</text>
  <text x="415" y="146.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Millisecond access | 3 AZ replication</text>

  <rect x="836.875" y="85.3125" width="168.75" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="921.25" y="108.875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">$0.023 / GB</text>

  <text x="836.875" y="146.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Use: Active websites, apps, analytics</text>

  <!-- Transition arrow -->
  <line x1="640" y1="175.9375" x2="640" y2="194.0625" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="696.25" y="189.5312" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Lifecycle policy (30 days)</text>

  <!-- Tier 2: Warm (S3 IA) -->
  <rect x="246.25" y="198.5938" width="900" height="108.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="452.5" y="234.8438" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--warn-accent)" font-weight="bold">WARM - S3 Infrequent Access</text>
  <text x="452.5" y="257.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Less frequent, but rapid access needed</text>
  <text x="452.5" y="278.3438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Millisecond access | Retrieval fee applies</text>

  <rect x="855.625" y="216.7188" width="168.75" height="36.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="940" y="240.2812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">$0.0125 / GB</text>

  <text x="855.625" y="278.3438" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Use: Backups, older logs, DR copies</text>

  <!-- Transition arrow -->
  <line x1="640" y1="307.3438" x2="640" y2="325.4688" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="696.25" y="320.9375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Lifecycle policy (90 days)</text>

  <!-- Tier 3: Cold (Glacier Instant) -->
  <rect x="302.5" y="330" width="787.5" height="108.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="366.25" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--info-accent)" font-weight="bold">COLD - Glacier Instant</text>
  <text x="490" y="388.9062" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Rarely accessed, instant retrieval</text>
  <text x="490" y="409.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Millisecond access | Higher retrieval fee</text>

  <rect x="855.625" y="348.125" width="168.75" height="36.25" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="940" y="371.6875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">$0.004 / GB</text>

  <text x="855.625" y="409.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Use: Compliance, quarterly reports</text>

  <!-- Transition arrow -->
  <line x1="640" y1="438.75" x2="640" y2="456.875" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="696.25" y="452.3438" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Lifecycle policy (365 days)</text>

  <!-- Tier 4: Deep Archive -->
  <rect x="358.75" y="461.4062" width="675" height="108.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="536.875" y="497.6562" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--ok-accent)" font-weight="bold">DEEP ARCHIVE - Glacier</text>
  <text x="536.875" y="520.3125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Long-term retention, bulk retrieval</text>
  <text x="536.875" y="541.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Hours to retrieve | 12+ hour wait</text>

  <rect x="855.625" y="479.5312" width="168.75" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="503.0938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">$0.00099 / GB</text>

  <text x="855.625" y="541.1562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Use: 7-year regulatory archives</text>

  <!-- Right side: cost savings -->
  <text x="1071.25" y="601.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">~96% cheaper</text>
  <text x="1071.25" y="618.1875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">vs Standard</text>
</svg>
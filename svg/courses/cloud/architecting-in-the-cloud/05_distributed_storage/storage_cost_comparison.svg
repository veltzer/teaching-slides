<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Chart area -->
  <text x="640" y="40" font-family="Arial, sans-serif" font-size="18" fill="var(--text)" text-anchor="middle" font-weight="bold">Storage Cost per GB/month (USD)</text>

  <!-- Y axis -->
  <line x1="280" y1="70" x2="280" y2="540" stroke="var(--border)" stroke-width="2"/>

  <!-- X axis -->
  <line x1="280" y1="540" x2="1240" y2="540" stroke="var(--border)" stroke-width="2"/>

  <!-- Scale: max = $0.30 (EFS), chart width = 940px. Factor = 940/0.30 = 3133 px per $ -->

  <!-- Bar 1: EFS - $0.30 -->
  <rect x="300" y="80" width="940" height="70" rx="6" fill="var(--danger-fill)" opacity="0.85" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="310" y="105" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)" font-weight="bold">EFS (Elastic File System)</text>
  <text x="310" y="125" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)">Shared POSIX filesystem | NFS protocol</text>
  <text x="1200" y="120" font-family="Arial, sans-serif" font-size="16" fill="var(--bg)" text-anchor="end" font-weight="bold">$0.30</text>

  <!-- Bar 2: EBS gp3 - $0.08 -->
  <rect x="300" y="170" width="250" height="70" rx="6" fill="var(--warn-fill)" opacity="0.85" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="310" y="195" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)" font-weight="bold">EBS gp3</text>
  <text x="310" y="215" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)">Block storage | 3K IOPS base</text>
  <text x="560" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-accent)" font-weight="bold">$0.08</text>

  <!-- Bar 3: S3 Standard - $0.023 -->
  <rect x="300" y="260" width="72" height="70" rx="6" fill="var(--primary-fill)" opacity="0.85" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="385" y="285" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)" font-weight="bold">S3 Standard</text>
  <text x="385" y="305" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Object storage | 3 AZ | Millisecond access</text>
  <text x="385" y="325" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)" font-weight="bold">$0.023</text>

  <!-- Bar 4: S3 IA - $0.0125 -->
  <rect x="300" y="350" width="39" height="70" rx="6" fill="var(--info-fill)" opacity="0.85" stroke="var(--info-border)" stroke-width="2"/>
  <text x="355" y="375" font-family="Arial, sans-serif" font-size="14" fill="var(--info-accent)" font-weight="bold">S3 Infrequent Access</text>
  <text x="355" y="395" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Object storage | Retrieval fee | 30-day min</text>
  <text x="355" y="415" font-family="Arial, sans-serif" font-size="16" fill="var(--info-accent)" font-weight="bold">$0.0125</text>

  <!-- Bar 5: Glacier - $0.004 -->
  <rect x="300" y="440" width="13" height="70" rx="6" fill="var(--ok-fill)" opacity="0.85" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="330" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">S3 Glacier Instant Retrieval</text>
  <text x="330" y="485" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Archive | 90-day min | Millisecond retrieval</text>
  <text x="330" y="505" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-accent)" font-weight="bold">$0.004</text>

  <!-- Grid lines -->
  <line x1="613" y1="70" x2="613" y2="540" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="613" y="560" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">$0.10</text>

  <line x1="927" y1="70" x2="927" y2="540" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="927" y="560" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">$0.20</text>

  <line x1="1240" y1="70" x2="1240" y2="540" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1240" y="560" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">$0.30</text>

  <text x="300" y="560" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">$0.00</text>

  <!-- Key insight -->
  <rect x="40" y="580" width="1200" height="45" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="605" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" text-anchor="middle" font-weight="bold">Key insight: EFS is 13x more expensive than S3 Standard, but provides shared POSIX filesystem access</text>
  <text x="640" y="620" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Choose the cheapest storage that meets your access pattern requirements</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Chart area -->
  <text x="640" y="40" font-family="Arial, sans-serif" font-size="18" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">Storage Cost per GB/month (USD)</text>

  <!-- Y axis -->
  <line x1="280" y1="70" x2="280" y2="540" stroke="var(--border-strong)" stroke-width="2"/>

  <!-- X axis -->
  <line x1="280" y1="540" x2="1240" y2="540" stroke="var(--border-strong)" stroke-width="2"/>

  <!-- Scale: max = $0.30 (EFS), chart width = 940px. Factor = 940/0.30 = 3133 px per $ -->

  <!-- Bar 1: EFS - $0.30 -->
  <rect x="300" y="80" width="940" height="70" rx="6" fill="var(--danger)" opacity="0.85"/>
  <text x="310" y="105" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)" font-weight="bold">EFS (Elastic File System)</text>
  <text x="310" y="125" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)">Shared POSIX filesystem | NFS protocol</text>
  <text x="1200" y="120" font-family="Arial, sans-serif" font-size="16" fill="var(--bg)" text-anchor="end" font-weight="bold">$0.30</text>

  <!-- Bar 2: EBS gp3 - $0.08 -->
  <rect x="300" y="170" width="250" height="70" rx="6" fill="var(--warn)" opacity="0.85"/>
  <text x="310" y="195" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)" font-weight="bold">EBS gp3</text>
  <text x="310" y="215" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)">Block storage | 3K IOPS base</text>
  <text x="560" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-dk)" font-weight="bold">$0.08</text>

  <!-- Bar 3: S3 Standard - $0.023 -->
  <rect x="300" y="260" width="72" height="70" rx="6" fill="var(--primary)" opacity="0.85"/>
  <text x="385" y="285" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-dk)" font-weight="bold">S3 Standard</text>
  <text x="385" y="305" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Object storage | 3 AZ | Millisecond access</text>
  <text x="385" y="325" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-dk)" font-weight="bold">$0.023</text>

  <!-- Bar 4: S3 IA - $0.0125 -->
  <rect x="300" y="350" width="39" height="70" rx="6" fill="var(--info)" opacity="0.85"/>
  <text x="355" y="375" font-family="Arial, sans-serif" font-size="14" fill="var(--info-dk)" font-weight="bold">S3 Infrequent Access</text>
  <text x="355" y="395" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Object storage | Retrieval fee | 30-day min</text>
  <text x="355" y="415" font-family="Arial, sans-serif" font-size="16" fill="var(--info-dk)" font-weight="bold">$0.0125</text>

  <!-- Bar 5: Glacier - $0.004 -->
  <rect x="300" y="440" width="13" height="70" rx="3" fill="var(--ok)" opacity="0.85"/>
  <text x="330" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)" font-weight="bold">S3 Glacier Instant Retrieval</text>
  <text x="330" y="485" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Archive | 90-day min | Millisecond retrieval</text>
  <text x="330" y="505" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-dk)" font-weight="bold">$0.004</text>

  <!-- Grid lines -->
  <line x1="613" y1="70" x2="613" y2="540" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="613" y="560" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">$0.10</text>

  <line x1="927" y1="70" x2="927" y2="540" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="927" y="560" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">$0.20</text>

  <line x1="1240" y1="70" x2="1240" y2="540" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1240" y="560" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">$0.30</text>

  <text x="300" y="560" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">$0.00</text>

  <!-- Key insight -->
  <rect x="40" y="580" width="1200" height="45" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="640" y="605" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">Key insight: EFS is 13x more expensive than S3 Standard, but provides shared POSIX filesystem access</text>
  <text x="640" y="620" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Choose the cheapest storage that meets your access pattern requirements</text>
</svg>
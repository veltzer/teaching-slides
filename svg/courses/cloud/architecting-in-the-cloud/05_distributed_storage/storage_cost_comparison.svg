<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Chart area -->
  <text x="640" y="76.25" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)" text-anchor="middle" font-weight="bold">Storage Cost per GB/month (USD)</text>

  <!-- Y axis -->
  <line x1="302.5" y1="103.4375" x2="302.5" y2="529.375" stroke="var(--border)" stroke-width="2"/>

  <!-- X axis -->
  <line x1="302.5" y1="529.375" x2="1202.5" y2="529.375" stroke="var(--border)" stroke-width="2"/>

  <!-- Scale: max = $0.30 (EFS), chart width = 940px. Factor = 940/0.30 = 3133 px per $ -->

  <!-- Bar 1: EFS - $0.30 -->
  <rect x="321.25" y="112.5" width="881.25" height="63.4375" rx="6" fill="var(--danger-fill)" opacity="0.85" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="330.625" y="135.1562" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--bg)" font-weight="bold">EFS (Elastic File System)</text>
  <text x="330.625" y="153.2812" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--bg)">Shared POSIX filesystem | NFS protocol</text>
  <text x="1165" y="148.75" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--bg)" text-anchor="end" font-weight="bold">$0.30</text>

  <!-- Bar 2: EBS gp3 - $0.08 -->
  <rect x="321.25" y="194.0625" width="234.375" height="63.4375" rx="6" fill="var(--warn-fill)" opacity="0.85" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="330.625" y="216.7188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--bg)" font-weight="bold">EBS gp3</text>
  <text x="330.625" y="234.8438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--bg)">Block storage | 3K IOPS base</text>
  <text x="565" y="230.3125" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--warn-accent)" font-weight="bold">$0.08</text>

  <!-- Bar 3: S3 Standard - $0.023 -->
  <rect x="321.25" y="275.625" width="67.5" height="63.4375" rx="6" fill="var(--primary-fill)" opacity="0.85" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="400.9375" y="298.2812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" font-weight="bold">S3 Standard</text>
  <text x="400.9375" y="316.4062" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Object storage | 3 AZ | Millisecond access</text>
  <text x="400.9375" y="334.5312" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" font-weight="bold">$0.023</text>

  <!-- Bar 4: S3 IA - $0.0125 -->
  <rect x="321.25" y="357.1875" width="36.5625" height="63.4375" rx="6" fill="var(--info-fill)" opacity="0.85" stroke="var(--info-border)" stroke-width="2"/>
  <text x="372.8125" y="379.8438" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--info-accent)" font-weight="bold">S3 Infrequent Access</text>
  <text x="372.8125" y="397.9688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Object storage | Retrieval fee | 30-day min</text>
  <text x="372.8125" y="416.0938" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--info-accent)" font-weight="bold">$0.0125</text>

  <!-- Bar 5: Glacier - $0.004 -->
  <rect x="321.25" y="438.75" width="12.1875" height="63.4375" rx="6" fill="var(--ok-fill)" opacity="0.85" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="349.375" y="461.4062" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">S3 Glacier Instant Retrieval</text>
  <text x="349.375" y="479.5312" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Archive | 90-day min | Millisecond retrieval</text>
  <text x="349.375" y="497.6562" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)" font-weight="bold">$0.004</text>

  <!-- Grid lines -->
  <line x1="614.6875" y1="103.4375" x2="614.6875" y2="529.375" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="614.6875" y="547.5" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">$0.10</text>

  <line x1="909.0625" y1="103.4375" x2="909.0625" y2="529.375" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="909.0625" y="547.5" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">$0.20</text>

  <line x1="1202.5" y1="103.4375" x2="1202.5" y2="529.375" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1202.5" y="547.5" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">$0.30</text>

  <text x="321.25" y="547.5" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">$0.00</text>

  <!-- Key insight -->
  <rect x="77.5" y="565.625" width="1125" height="40.7812" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="588.2812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle" font-weight="bold">Key insight: EFS is 13x more expensive than S3 Standard, but provides shared POSIX filesystem access</text>
  <text x="640" y="601.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Choose the cheapest storage that meets your access pattern requirements</text>
</svg>
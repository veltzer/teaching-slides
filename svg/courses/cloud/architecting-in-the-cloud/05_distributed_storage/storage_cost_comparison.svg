<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Chart area -->
  <text x="640" y="40" font-family="Arial, sans-serif" font-size="17.922949" fill="var(--text)" text-anchor="middle" font-weight="bold">Storage Cost per GB/month (USD)</text>

  <!-- Y axis -->
  <line x1="280" y1="69.743593" x2="280" y2="535.726542" stroke="var(--border)" stroke-width="2"/>

  <!-- X axis -->
  <line x1="280" y1="535.726542" x2="1240" y2="535.726542" stroke="var(--border)" stroke-width="2"/>

  <!-- Scale: max = $0.30 (EFS), chart width = 940px. Factor = 940/0.30 = 3133 px per $ -->

  <!-- Bar 1: EFS - $0.30 -->
  <rect x="300" y="79.658123" width="940" height="69.401716" rx="6.481532" fill="url(#grad-danger)" opacity="0.85" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="104.444396" font-family="Arial, sans-serif" font-size="13.940047" fill="var(--bg)" font-weight="bold">EFS (Elastic File System)</text>
  <text x="310" y="124.273458" font-family="Arial, sans-serif" font-size="11.948597" fill="var(--bg)">Shared POSIX filesystem | NFS protocol</text>
  <text x="1200" y="119.316247" font-family="Arial, sans-serif" font-size="15.931498" fill="var(--bg)" text-anchor="end" font-weight="bold">$0.30</text>

  <!-- Bar 2: EBS gp3 - $0.08 -->
  <rect x="300" y="168.888901" width="250" height="69.401716" rx="6.481532" fill="url(#grad-warn)" opacity="0.85" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="193.675283" font-family="Arial, sans-serif" font-size="13.940047" fill="var(--bg)" font-weight="bold">EBS gp3</text>
  <text x="310" y="213.504345" font-family="Arial, sans-serif" font-size="11.948597" fill="var(--bg)">Block storage | 3K IOPS base</text>
  <text x="560" y="208.547024" font-family="Arial, sans-serif" font-size="15.931498" fill="var(--warn-accent)" font-weight="bold">$0.08</text>

  <!-- Bar 3: S3 Standard - $0.023 -->
  <rect x="300" y="258.119679" width="72" height="69.401716" rx="6.481532" fill="url(#grad-primary)" opacity="0.85" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385" y="282.905951" font-family="Arial, sans-serif" font-size="13.940047" fill="var(--primary-accent)" font-weight="bold">S3 Standard</text>
  <text x="385" y="302.735013" font-family="Arial, sans-serif" font-size="11.948597" fill="var(--text-muted)">Object storage | 3 AZ | Millisecond access</text>
  <text x="385" y="322.564075" font-family="Arial, sans-serif" font-size="15.931498" fill="var(--primary-accent)" font-weight="bold">$0.023</text>

  <!-- Bar 4: S3 IA - $0.0125 -->
  <rect x="300" y="347.350456" width="39" height="69.401716" rx="6.481532" fill="url(#grad-info)" opacity="0.85" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="355" y="372.136838" font-family="Arial, sans-serif" font-size="13.940047" fill="var(--info-accent)" font-weight="bold">S3 Infrequent Access</text>
  <text x="355" y="391.9659" font-family="Arial, sans-serif" font-size="11.948597" fill="var(--text-muted)">Object storage | Retrieval fee | 30-day min</text>
  <text x="355" y="411.794962" font-family="Arial, sans-serif" font-size="15.931498" fill="var(--info-accent)" font-weight="bold">$0.0125</text>

  <!-- Bar 5: Glacier - $0.004 -->
  <rect x="300" y="436.581234" width="13" height="69.401716" rx="6.481532" fill="url(#grad-ok)" opacity="0.85" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="461.367506" font-family="Arial, sans-serif" font-size="13.940047" fill="var(--ok-accent)" font-weight="bold">S3 Glacier Instant Retrieval</text>
  <text x="330" y="481.196568" font-family="Arial, sans-serif" font-size="11.948597" fill="var(--text-muted)">Archive | 90-day min | Millisecond retrieval</text>
  <text x="330" y="501.02563" font-family="Arial, sans-serif" font-size="15.931498" fill="var(--ok-accent)" font-weight="bold">$0.004</text>

  <!-- Grid lines -->
  <line x1="613" y1="69.743593" x2="613" y2="535.726542" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="613" y="555.555604" font-family="Arial, sans-serif" font-size="10.952925" fill="var(--text-faint)" text-anchor="middle">$0.10</text>

  <line x1="927" y1="69.743593" x2="927" y2="535.726542" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="927" y="555.555604" font-family="Arial, sans-serif" font-size="10.952925" fill="var(--text-faint)" text-anchor="middle">$0.20</text>

  <line x1="1240" y1="69.743593" x2="1240" y2="535.726542" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1240" y="555.555604" font-family="Arial, sans-serif" font-size="10.952925" fill="var(--text-faint)" text-anchor="middle">$0.30</text>

  <text x="300" y="555.555604" font-family="Arial, sans-serif" font-size="10.952925" fill="var(--text-faint)" text-anchor="middle">$0.00</text>

  <!-- Key insight -->
  <rect x="40" y="575.384666" width="1200" height="44.615334" rx="6.481532" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="600.170938" font-family="Arial, sans-serif" font-size="12.944376" fill="var(--text)" text-anchor="middle" font-weight="bold">Key insight: EFS is 13x more expensive than S3 Standard, but provides shared POSIX filesystem access</text>
  <text x="640" y="615.042789" font-family="Arial, sans-serif" font-size="10.952925" fill="var(--text-muted)" text-anchor="middle">Choose the cheapest storage that meets your access pattern requirements</text>
</svg>

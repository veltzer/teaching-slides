<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Root Decision: Data Model? -->
  <polygon points="640,67.1875 752.5,112.5 640,157.8125 527.5,112.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="108.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Data Model?</text>
  <text x="640" y="125.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">What type?</text>
  <!-- Branch: Relational -->
  <line x1="527.5" y1="112.5" x2="321.25" y2="212.1875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="396.25" y="157.8125" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Relational</text>
  <!-- Decision: Complex queries? -->
  <polygon points="321.25,212.1875 415,252.9688 321.25,293.75 227.5,252.9688" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="321.25" y="250.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Complex</text>
  <text x="321.25" y="264.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">queries?</text>
  <!-- Yes -> Aurora/RDS -->
  <line x1="227.5" y1="252.9688" x2="143.125" y2="339.0625" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="161.875" y="293.75" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Yes</text>
  <rect x="77.5" y="339.0625" width="150" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.5" y="364.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--ok-accent)">Aurora / RDS</text>
  <text x="152.5" y="382.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">SQL, joins, ACID</text>
  <!-- No -> Redshift -->
  <line x1="321.25" y1="293.75" x2="321.25" y2="337.25" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="316.4062" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Analytics</text>
  <rect x="246.25" y="339.0625" width="150" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.25" y="364.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)">Redshift</text>
  <text x="321.25" y="382.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Data warehouse</text>
  <!-- Branch: Key-Value -->
  <line x1="640" y1="157.8125" x2="640" y2="239.375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="658.75" y="198.5938" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Key-Value / Document</text>
  <rect x="555.625" y="239.375" width="168.75" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="264.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--primary-accent)">DynamoDB</text>
  <text x="640" y="282.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">NoSQL, any scale</text>
  <!-- Branch: Graph -->
  <line x1="752.5" y1="112.5" x2="940" y2="157.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="865" y="126.0938" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Graph?</text>
  <!-- Decision: Need graph? -->
  <polygon points="940,157.8125 1033.75,198.5938 940,239.375 846.25,198.5938" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="940" y="195.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Need</text>
  <text x="940" y="210.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">graph?</text>
  <!-- Yes -> Neptune -->
  <line x1="940" y1="239.375" x2="940" y2="337.25" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="958.75" y="284.6875" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)">Yes</text>
  <rect x="865" y="339.0625" width="150" height="54.375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="364.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--info-accent)">Neptune</text>
  <text x="940" y="382.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Graph relationships</text>
  <!-- Branch: Time series -->
  <line x1="1033.75" y1="198.5938" x2="1127.5" y2="239.375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1099.375" y="216.7188" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--danger-accent)">Time series?</text>
  <rect x="1052.5" y="239.375" width="150" height="54.375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1127.5" y="264.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--danger-accent)">Timestream</text>
  <text x="1127.5" y="282.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">IoT, metrics</text>
  <!-- Legend -->
  <rect x="115" y="475" width="187.5" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <polygon points="133.75,484.0625 148.75,488.5938 133.75,493.125 118.75,488.5938" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="171.25" y="493.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">= Decision point</text>
  <rect x="115" y="511.25" width="187.5" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="118.75" y="518.5" width="26.25" height="12.6875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="171.25" y="529.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">= Service choice</text>
</svg>
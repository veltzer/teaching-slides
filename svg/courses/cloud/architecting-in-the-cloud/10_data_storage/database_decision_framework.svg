<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Root Decision: Data Model? -->
  <polygon points="640,40 760,95.769231 640,151.538462 520,95.769231" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="91.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785652" font-weight="bold" fill="var(--text)">Data Model?</text>
  <text x="640" y="111.384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">What type?</text>
  <!-- Branch: Relational -->
  <line x1="520" y1="95.769231" x2="300" y2="218.461538" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="151.538462" font-family="Arial, sans-serif" font-size="12.6734" font-weight="bold" fill="var(--primary-accent)">Relational</text>
  <!-- Decision: Complex queries? -->
  <polygon points="300,218.461538 400,268.653908 300,318.846154 200,268.653908" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="300" y="265.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--text)">Complex</text>
  <text x="300" y="283.153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--text)">queries?</text>
  <!-- Yes -> Aurora/RDS -->
  <line x1="200" y1="268.653908" x2="110" y2="374.615385" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="318.846154" font-family="Arial, sans-serif" font-size="12.6734" font-weight="bold" fill="var(--ok-accent)">Yes</text>
  <rect x="40" y="374.615385" width="160" height="66.923077" rx="6.874703" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="405.846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841721" font-weight="bold" fill="var(--ok-accent)">Aurora / RDS</text>
  <text x="120" y="428.153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.617331" fill="var(--text-muted)">SQL, joins, ACID</text>
  <!-- No -> Redshift -->
  <line x1="300" y1="318.846154" x2="300" y2="372.384615" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="346.730708" font-family="Arial, sans-serif" font-size="12.6734" font-weight="bold" fill="var(--warn-accent)">Analytics</text>
  <rect x="220" y="374.615385" width="160" height="66.923077" rx="6.874703" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="405.846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841721" font-weight="bold" fill="var(--warn-accent)">Redshift</text>
  <text x="300" y="428.153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.617331" fill="var(--text-muted)">Data warehouse</text>
  <!-- Branch: Key-Value -->
  <line x1="640" y1="151.538462" x2="640" y2="251.923077" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="201.730831" font-family="Arial, sans-serif" font-size="12.6734" font-weight="bold" fill="var(--primary-accent)">Key-Value / Document</text>
  <rect x="550" y="251.923077" width="180" height="66.923077" rx="6.874703" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="283.153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841721" font-weight="bold" fill="var(--primary-accent)">DynamoDB</text>
  <text x="640" y="305.461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.617331" fill="var(--text-muted)">NoSQL, any scale</text>
  <!-- Branch: Graph -->
  <line x1="760" y1="95.769231" x2="960" y2="151.538462" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="880" y="112.500062" font-family="Arial, sans-serif" font-size="12.6734" font-weight="bold" fill="var(--primary-accent)">Graph?</text>
  <!-- Decision: Need graph? -->
  <polygon points="960,151.538462 1060,201.730831 960,251.923077 860,201.730831" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="960" y="198.384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--text)">Need</text>
  <text x="960" y="216.230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729584" font-weight="bold" fill="var(--text)">graph?</text>
  <!-- Yes -> Neptune -->
  <line x1="960" y1="251.923077" x2="960" y2="372.384615" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="980" y="307.692308" font-family="Arial, sans-serif" font-size="12.6734" font-weight="bold" fill="var(--info-accent)">Yes</text>
  <rect x="880" y="374.615385" width="160" height="66.923077" rx="6.874703" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="405.846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841721" font-weight="bold" fill="var(--info-accent)">Neptune</text>
  <text x="960" y="428.153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.617331" fill="var(--text-muted)">Graph relationships</text>
  <!-- Branch: Time series -->
  <line x1="1060" y1="201.730831" x2="1160" y2="251.923077" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1130" y="224.038523" font-family="Arial, sans-serif" font-size="12.6734" font-weight="bold" fill="var(--danger-accent)">Time series?</text>
  <rect x="1080" y="251.923077" width="160" height="66.923077" rx="6.874703" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="283.153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841721" font-weight="bold" fill="var(--danger-accent)">Timestream</text>
  <text x="1160" y="305.461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.617331" fill="var(--text-muted)">IoT, metrics</text>
  <!-- Legend -->
  <rect x="80" y="541.923077" width="200" height="33.461538" rx="6.874703" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <polygon points="100,553.076923 116,558.653908 100,564.230769 84,558.653908" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="140" y="564.230769" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">= Decision point</text>
  <rect x="80" y="586.538462" width="200" height="33.461538" rx="6.874703" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="84" y="595.461538" width="28" height="15.615385" rx="6.874703" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="608.846154" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">= Service choice</text>
</svg>
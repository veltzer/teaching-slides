<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Root Decision: Data Model? -->
  <polygon points="640,30 760,80 640,130 520,80" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Data Model?</text>
  <text x="640" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">What type?</text>
  <!-- Branch: Relational -->
  <line x1="520" y1="80" x2="300" y2="190" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary)">Relational</text>
  <!-- Decision: Complex queries? -->
  <polygon points="300,190 400,235 300,280 200,235" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
  <text x="300" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Complex</text>
  <text x="300" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">queries?</text>
  <!-- Yes -> Aurora/RDS -->
  <line x1="200" y1="235" x2="110" y2="330" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="280" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok)">Yes</text>
  <rect x="40" y="330" width="160" height="60" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-dk)">Aurora / RDS</text>
  <text x="120" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">SQL, joins, ACID</text>
  <!-- No -> Redshift -->
  <line x1="300" y1="280" x2="300" y2="328" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn)">Analytics</text>
  <rect x="220" y="330" width="160" height="60" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-dk)">Redshift</text>
  <text x="300" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Data warehouse</text>
  <!-- Branch: Key-Value -->
  <line x1="640" y1="130" x2="640" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary)">Key-Value / Document</text>
  <rect x="550" y="220" width="180" height="60" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-dk)">DynamoDB</text>
  <text x="640" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">NoSQL, any scale</text>
  <!-- Branch: Graph -->
  <line x1="760" y1="80" x2="960" y2="130" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="880" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary)">Graph?</text>
  <!-- Decision: Need graph? -->
  <polygon points="960,130 1060,175 960,220 860,175" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2"/>
  <text x="960" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Need</text>
  <text x="960" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">graph?</text>
  <!-- Yes -> Neptune -->
  <line x1="960" y1="220" x2="960" y2="328" stroke="var(--info)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="980" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info)">Yes</text>
  <rect x="880" y="330" width="160" height="60" rx="10" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-dk)">Neptune</text>
  <text x="960" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Graph relationships</text>
  <!-- Branch: Time series -->
  <line x1="1060" y1="175" x2="1160" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1130" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--danger)">Time series?</text>
  <rect x="1080" y="220" width="160" height="60" rx="10" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-dk)">Timestream</text>
  <text x="1160" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">IoT, metrics</text>
  <!-- Legend -->
  <rect x="80" y="480" width="200" height="30" rx="4" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <polygon points="100,490 116,495 100,500 84,495" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="140" y="500" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">= Decision point</text>
  <rect x="80" y="520" width="200" height="30" rx="4" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="84" y="528" width="28" height="14" rx="4" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="140" y="540" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">= Service choice</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Primary Writer -->
  <rect x="180" y="40" width="180" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="270" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Primary Writer</text>
  <text x="270" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">Read/Write</text>
  <!-- Read Replicas -->
  <rect x="480" y="40" width="160" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Read Replica 1</text>
  <text x="560" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Read Only</text>
  <rect x="680" y="40" width="160" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Read Replica 2</text>
  <text x="760" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Read Only</text>
  <rect x="880" y="40" width="160" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Read Replica 3</text>
  <text x="960" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Read Only</text>
  <!-- Arrows from instances to storage -->
  <line x1="270" y1="110" x2="270" y2="210" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="110" x2="460" y2="210" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="110" x2="640" y2="210" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="110" x2="820" y2="210" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Shared Storage Layer -->
  <rect x="80" y="220" width="920" height="240" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)">Shared Distributed Storage Layer</text>
  <!-- AZ 1 -->
  <rect x="110" y="270" width="260" height="170" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="240" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)">AZ 1</text>
  <rect x="130" y="310" width="100" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="180" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Copy 1</text>
  <rect x="250" y="310" width="100" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="300" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Copy 2</text>
  <!-- AZ 2 -->
  <rect x="400" y="270" width="260" height="170" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="530" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)">AZ 2</text>
  <rect x="420" y="310" width="100" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="470" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Copy 3</text>
  <rect x="540" y="310" width="100" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="590" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Copy 4</text>
  <!-- AZ 3 -->
  <rect x="690" y="270" width="280" height="170" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="830" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)">AZ 3</text>
  <rect x="710" y="310" width="100" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="760" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Copy 5</text>
  <rect x="840" y="310" width="100" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="890" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Copy 6</text>
  <!-- Replication text -->
  <text x="540" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">6 copies across 3 AZs - Quorum writes (4/6), Quorum reads (3/6)</text>
  <!-- Continuous backup to S3 -->
  <rect x="1060" y="290" width="160" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Amazon S3</text>
  <text x="1140" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Backup</text>
  <line x1="1000" y1="340" x2="1058" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1030" y="365" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">Continuous</text>
  <text x="1030" y="380" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">Backup</text>
  <!-- Summary -->
  <text x="540" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Aurora separates compute from storage for independent scaling</text>
</svg>
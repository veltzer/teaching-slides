<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Primary Writer -->
  <rect x="208.75" y="76.25" width="168.75" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="293.125" y="105.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Primary Writer</text>
  <text x="293.125" y="123.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">Read/Write</text>
  <!-- Read Replicas -->
  <rect x="490" y="76.25" width="150" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="565" y="105.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Read Replica 1</text>
  <text x="565" y="121.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Read Only</text>
  <rect x="677.5" y="76.25" width="150" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="752.5" y="105.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Read Replica 2</text>
  <text x="752.5" y="121.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Read Only</text>
  <rect x="865" y="76.25" width="150" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="105.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Read Replica 3</text>
  <text x="940" y="121.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Read Only</text>
  <!-- Arrows from instances to storage -->
  <line x1="293.125" y1="139.6875" x2="293.125" y2="230.3125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="565" y1="139.6875" x2="471.25" y2="230.3125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="752.5" y1="139.6875" x2="640" y2="230.3125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="139.6875" x2="808.75" y2="230.3125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Shared Storage Layer -->
  <rect x="115" y="239.375" width="862.5" height="217.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="546.25" y="266.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)">Shared Distributed Storage Layer</text>
  <!-- AZ 1 -->
  <rect x="143.125" y="284.6875" width="243.75" height="154.0625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="265" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text-muted)">AZ 1</text>
  <rect x="161.875" y="320.9375" width="93.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="208.75" y="348.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Copy 1</text>
  <rect x="274.375" y="320.9375" width="93.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="321.25" y="348.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Copy 2</text>
  <!-- AZ 2 -->
  <rect x="415" y="284.6875" width="243.75" height="154.0625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="536.875" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text-muted)">AZ 2</text>
  <rect x="433.75" y="320.9375" width="93.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="480.625" y="348.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Copy 3</text>
  <rect x="546.25" y="320.9375" width="93.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="593.125" y="348.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Copy 4</text>
  <!-- AZ 3 -->
  <rect x="686.875" y="284.6875" width="262.5" height="154.0625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="818.125" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text-muted)">AZ 3</text>
  <rect x="705.625" y="320.9375" width="93.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="752.5" y="348.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Copy 5</text>
  <rect x="827.5" y="320.9375" width="93.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="874.375" y="348.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Copy 6</text>
  <!-- Replication text -->
  <text x="546.25" y="420.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">6 copies across 3 AZs - Quorum writes (4/6), Quorum reads (3/6)</text>
  <!-- Continuous backup to S3 -->
  <rect x="1033.75" y="302.8125" width="150" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.75" y="331.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Amazon S3</text>
  <text x="1108.75" y="349.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Backup</text>
  <line x1="977.5" y1="348.125" x2="1031.875" y2="339.0625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1005.625" y="370.7812" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)">Continuous</text>
  <text x="1005.625" y="384.375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)">Backup</text>
  <!-- Summary -->
  <text x="546.25" y="520.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Aurora separates compute from storage for independent scaling</text>
</svg>
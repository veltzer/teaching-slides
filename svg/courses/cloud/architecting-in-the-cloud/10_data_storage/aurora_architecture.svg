<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Primary Writer -->
  <rect x="145.263158" y="40" width="189.473684" height="82.857143" rx="7.266006" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="77.877551" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.627241" font-weight="bold" fill="var(--text)">Primary Writer</text>
  <text x="240" y="101.55102" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.394761" fill="var(--primary-accent)">Read/Write</text>
  <!-- Read Replicas -->
  <rect x="461.052632" y="40" width="168.421053" height="82.857143" rx="7.266006" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="545.263158" y="77.877551" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.511062" font-weight="bold" fill="var(--text)">Read Replica 1</text>
  <text x="545.263158" y="99.183673" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.394761" fill="var(--ok-accent)">Read Only</text>
  <rect x="671.578947" y="40" width="168.421053" height="82.857143" rx="7.266006" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.789474" y="77.877551" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.511062" font-weight="bold" fill="var(--text)">Read Replica 2</text>
  <text x="755.789474" y="99.183673" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.394761" fill="var(--ok-accent)">Read Only</text>
  <rect x="882.105263" y="40" width="168.421053" height="82.857143" rx="7.266006" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="966.315789" y="77.877551" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.511062" font-weight="bold" fill="var(--text)">Read Replica 3</text>
  <text x="966.315789" y="99.183673" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.394761" fill="var(--ok-accent)">Read Only</text>
  <!-- Arrows from instances to storage -->
  <line x1="240" y1="122.857143" x2="240" y2="241.22449" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="545.263158" y1="122.857143" x2="440" y2="241.22449" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="755.789474" y1="122.857143" x2="629.473684" y2="241.22449" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="966.315789" y1="122.857143" x2="818.947368" y2="241.22449" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Shared Storage Layer -->
  <rect x="40" y="253.061224" width="968.421053" height="284.081633" rx="7.266006" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="524.210526" y="288.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.859722" font-weight="bold" fill="var(--warn-accent)">Shared Distributed Storage Layer</text>
  <!-- AZ 1 -->
  <rect x="71.578947" y="312.244898" width="273.684211" height="201.22449" rx="7.266006" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.421053" y="341.8368" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.627241" font-weight="bold" fill="var(--text-muted)">AZ 1</text>
  <rect x="92.631579" y="359.591837" width="105.263158" height="59.183673" rx="7.266006" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.263158" y="395.102041" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.394761" fill="var(--text)">Copy 1</text>
  <rect x="218.947368" y="359.591837" width="105.263158" height="59.183673" rx="7.266006" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="271.578947" y="395.102041" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.394761" fill="var(--text)">Copy 2</text>
  <!-- AZ 2 -->
  <rect x="376.842105" y="312.244898" width="273.684211" height="201.22449" rx="7.266006" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="513.684211" y="341.8368" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.627241" font-weight="bold" fill="var(--text-muted)">AZ 2</text>
  <rect x="397.894737" y="359.591837" width="105.263158" height="59.183673" rx="7.266006" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450.526316" y="395.102041" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.394761" fill="var(--text)">Copy 3</text>
  <rect x="524.210526" y="359.591837" width="105.263158" height="59.183673" rx="7.266006" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="576.842105" y="395.102041" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.394761" fill="var(--text)">Copy 4</text>
  <!-- AZ 3 -->
  <rect x="682.105263" y="312.244898" width="294.736842" height="201.22449" rx="7.266006" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="829.473684" y="341.8368" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.627241" font-weight="bold" fill="var(--text-muted)">AZ 3</text>
  <rect x="703.157895" y="359.591837" width="105.263158" height="59.183673" rx="7.266006" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.789474" y="395.102041" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.394761" fill="var(--text)">Copy 5</text>
  <rect x="840" y="359.591837" width="105.263158" height="59.183673" rx="7.266006" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="892.631579" y="395.102041" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.394761" fill="var(--text)">Copy 6</text>
  <!-- Replication text -->
  <text x="524.210526" y="489.795918" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.511062" fill="var(--text-muted)">6 copies across 3 AZs - Quorum writes (4/6), Quorum reads (3/6)</text>
  <!-- Continuous backup to S3 -->
  <rect x="1071.578947" y="335.918367" width="168.421053" height="82.857143" rx="7.266006" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1155.789474" y="373.795918" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.627241" font-weight="bold" fill="var(--text)">Amazon S3</text>
  <text x="1155.789474" y="397.469388" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.394761" fill="var(--text-muted)">Backup</text>
  <line x1="1008.421053" y1="395.102041" x2="1069.473684" y2="383.265306" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1040" y="424.693812" font-family="Arial, sans-serif" font-size="12.278581" fill="var(--primary-accent)">Continuous</text>
  <text x="1040" y="442.44898" font-family="Arial, sans-serif" font-size="12.278581" fill="var(--primary-accent)">Backup</text>
  <!-- Summary -->
  <text x="524.210526" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.627241" fill="var(--text-muted)">Aurora separates compute from storage for independent scaling</text>
</svg>

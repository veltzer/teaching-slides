<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Application -->
  <rect x="490" y="30" width="300" height="70" rx="12" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Application</text>
  <!-- RDS Proxy -->
  <rect x="440" y="180" width="400" height="70" rx="12" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)">RDS Proxy</text>
  <text x="640" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Connection pooling + Read/Write routing</text>
  <!-- Arrow from App to Proxy -->
  <line x1="640" y1="100" x2="640" y2="178" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Primary DB -->
  <rect x="200" y="360" width="220" height="90" rx="12" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="3" filter="url(#shadow)"/>
  <text x="310" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Primary DB</text>
  <text x="310" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger)">Writer</text>
  <text x="310" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Read + Write</text>
  <!-- Write arrow -->
  <line x1="540" y1="250" x2="370" y2="358" stroke="var(--danger)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="420" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger)">WRITE</text>
  <!-- Read Replica 1 -->
  <rect x="680" y="330" width="200" height="80" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Read Replica 1</text>
  <text x="780" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok)">Read Only</text>
  <!-- Read Replica 2 -->
  <rect x="680" y="440" width="200" height="80" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Read Replica 2</text>
  <text x="780" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok)">Read Only</text>
  <!-- Read arrows -->
  <line x1="740" y1="250" x2="780" y2="328" stroke="var(--ok)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="760" y1="250" x2="780" y2="438" stroke="var(--ok)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="830" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok)">READ</text>
  <!-- Async replication arrows -->
  <line x1="420" y1="390" x2="678" y2="370" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <line x1="420" y1="420" x2="678" y2="470" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="540" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-dk)">Async</text>
  <text x="540" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-dk)">Replication</text>
  <!-- Legend -->
  <rect x="80" y="560" width="400" height="60" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="100" y1="585" x2="140" y2="585" stroke="var(--danger)" stroke-width="3"/>
  <text x="155" y="590" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Write traffic</text>
  <line x1="240" y1="585" x2="280" y2="585" stroke="var(--ok)" stroke-width="3"/>
  <text x="295" y="590" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Read traffic</text>
  <line x1="370" y1="585" x2="410" y2="585" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="425" y="590" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Replication</text>
</svg>
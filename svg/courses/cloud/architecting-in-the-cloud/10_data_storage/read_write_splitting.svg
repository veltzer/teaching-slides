<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Application -->
  <rect x="490" y="30" width="300" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Application</text>
  <!-- RDS Proxy -->
  <rect x="440" y="180" width="400" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">RDS Proxy</text>
  <text x="640" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Connection pooling + Read/Write routing</text>
  <!-- Arrow from App to Proxy -->
  <line x1="640" y1="100" x2="640" y2="178" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Primary DB -->
  <rect x="200" y="360" width="220" height="90" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Primary DB</text>
  <text x="310" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">Writer</text>
  <text x="310" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Read + Write</text>
  <!-- Write arrow -->
  <line x1="540" y1="250" x2="370" y2="358" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)">WRITE</text>
  <!-- Read Replica 1 -->
  <rect x="680" y="330" width="200" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Read Replica 1</text>
  <text x="780" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Read Only</text>
  <!-- Read Replica 2 -->
  <rect x="680" y="440" width="200" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Read Replica 2</text>
  <text x="780" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Read Only</text>
  <!-- Read arrows -->
  <line x1="740" y1="250" x2="780" y2="328" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="250" x2="780" y2="438" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">READ</text>
  <!-- Async replication arrows -->
  <line x1="420" y1="390" x2="678" y2="370" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <line x1="420" y1="420" x2="678" y2="470" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="540" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">Async</text>
  <text x="540" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">Replication</text>
  <!-- Legend -->
  <rect x="80" y="560" width="400" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="100" y1="585" x2="140" y2="585" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="155" y="590" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Write traffic</text>
  <line x1="240" y1="585" x2="280" y2="585" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="295" y="590" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Read traffic</text>
  <line x1="370" y1="585" x2="410" y2="585" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="425" y="590" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Replication</text>
</svg>
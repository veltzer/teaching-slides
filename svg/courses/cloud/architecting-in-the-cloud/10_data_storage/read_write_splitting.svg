<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Application -->
  <rect x="499.375" y="67.1875" width="281.25" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="105.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)">Application</text>
  <!-- RDS Proxy -->
  <rect x="452.5" y="203.125" width="375" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="234.8438" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)">RDS Proxy</text>
  <text x="640" y="254.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Connection pooling + Read/Write routing</text>
  <!-- Arrow from App to Proxy -->
  <line x1="640" y1="130.625" x2="640" y2="201.3125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Primary DB -->
  <rect x="227.5" y="366.25" width="206.25" height="81.5625" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.625" y="400.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Primary DB</text>
  <text x="330.625" y="420.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)">Writer</text>
  <text x="330.625" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Read + Write</text>
  <!-- Write arrow -->
  <line x1="546.25" y1="266.5625" x2="386.875" y2="364.4375" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="433.75" y="302.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">WRITE</text>
  <!-- Read Replica 1 -->
  <rect x="677.5" y="339.0625" width="187.5" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="771.25" y="373.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text)">Read Replica 1</text>
  <text x="771.25" y="393.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Read Only</text>
  <!-- Read Replica 2 -->
  <rect x="677.5" y="438.75" width="187.5" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="771.25" y="473.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text)">Read Replica 2</text>
  <text x="771.25" y="493.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Read Only</text>
  <!-- Read arrows -->
  <line x1="733.75" y1="266.5625" x2="771.25" y2="337.25" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="752.5" y1="266.5625" x2="771.25" y2="436.9375" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818.125" y="302.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">READ</text>
  <!-- Async replication arrows -->
  <line x1="433.75" y1="393.4375" x2="675.625" y2="375.3125" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <line x1="433.75" y1="420.625" x2="675.625" y2="465.9375" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="546.25" y="388.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">Async</text>
  <text x="546.25" y="400.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">Replication</text>
  <!-- Legend -->
  <rect x="115" y="547.5" width="375" height="54.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="133.75" y1="570.1562" x2="171.25" y2="570.1562" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="185.3125" y="574.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Write traffic</text>
  <line x1="265" y1="570.1562" x2="302.5" y2="570.1562" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="316.5625" y="574.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Read traffic</text>
  <line x1="386.875" y1="570.1562" x2="424.375" y2="570.1562" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="438.4375" y="574.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Replication</text>
</svg>
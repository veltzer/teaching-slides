<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Application -->
  <rect x="655" y="40" width="450" height="68.813559" rx="7.904515" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="880" y="81.288136" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.857828" font-weight="bold" fill="var(--text)">Application</text>
  <!-- RDS Proxy -->
  <rect x="580" y="187.457627" width="600" height="68.813559" rx="7.904515" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="221.864461" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.429166" font-weight="bold" fill="var(--primary-accent)">RDS Proxy</text>
  <text x="880" y="243.491471" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.571841" fill="var(--text-muted)">Connection pooling + Read/Write routing</text>
  <!-- Arrow from App to Proxy -->
  <line x1="880" y1="108.813559" x2="880" y2="185.491525" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Primary DB -->
  <rect x="220" y="364.40678" width="330" height="88.474576" rx="7.904515" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385" y="401.762712" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.429166" font-weight="bold" fill="var(--text)">Primary DB</text>
  <text x="385" y="423.389831" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.000504" fill="var(--danger-accent)">Writer</text>
  <text x="385" y="443.050847" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.571841" fill="var(--text-muted)">Read + Write</text>
  <!-- Write arrow -->
  <line x1="730" y1="256.271186" x2="475" y2="362.440678" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="295.59322" font-family="Arial, sans-serif" font-size="17.000504" font-weight="bold" fill="var(--danger-accent)">WRITE</text>
  <!-- Read Replica 1 -->
  <rect x="940" y="334.915254" width="300" height="78.644068" rx="7.904515" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="372.271186" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.214769" font-weight="bold" fill="var(--text)">Read Replica 1</text>
  <text x="1090" y="393.898305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.571841" fill="var(--ok-accent)">Read Only</text>
  <!-- Read Replica 2 -->
  <rect x="940" y="443.050847" width="300" height="78.644068" rx="7.904515" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="480.40678" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.214769" font-weight="bold" fill="var(--text)">Read Replica 2</text>
  <text x="1090" y="502.033898" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.571841" fill="var(--ok-accent)">Read Only</text>
  <!-- Read arrows -->
  <line x1="1030" y1="256.271186" x2="1090" y2="332.949153" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1060" y1="256.271186" x2="1090" y2="441.084746" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1165" y="295.59322" font-family="Arial, sans-serif" font-size="17.000504" font-weight="bold" fill="var(--ok-accent)">READ</text>
  <!-- Async replication arrows -->
  <line x1="550" y1="393.898305" x2="937" y2="374.237288" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <line x1="550" y1="423.389831" x2="937" y2="472.542373" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="730" y="388.982997" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.357576" fill="var(--warn-accent)">Async</text>
  <text x="730" y="401.762712" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.357576" fill="var(--warn-accent)">Replication</text>
  <!-- Legend -->
  <rect x="40" y="561.016949" width="600" height="58.983051" rx="7.904515" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="70" y1="585.593166" x2="130" y2="585.593166" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="152.5" y="590.508475" font-family="Arial, sans-serif" font-size="14.571841" fill="var(--text)">Write traffic</text>
  <line x1="280" y1="585.593166" x2="340" y2="585.593166" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="362.5" y="590.508475" font-family="Arial, sans-serif" font-size="14.571841" fill="var(--text)">Read traffic</text>
  <line x1="475" y1="585.593166" x2="535" y2="585.593166" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="557.5" y="590.508475" font-family="Arial, sans-serif" font-size="14.571841" fill="var(--text)">Replication</text>
</svg>

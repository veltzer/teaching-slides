  <text x="376.842105263158" y="113.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.803821232545" font-weight="bold" fill="var(--ok-text)">Install + Harden</text>
  <line x1="471.578947368421" y1="108.545454545455" x2="513.684210526316" y2="108.545454545455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="524.210526315789" y="71.636363636364" width="189.473684210526" height="73.818181818182" rx="6.321528493018" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

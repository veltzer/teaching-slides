  <text x="134.736842105263" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2533086012" font-weight="bold" fill="var(--ok-text)">Build Pipeline</text>
  <line x1="229.473684210526" y1="79.038461538462" x2="271.578947368421" y2="79.038461538462" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="282.105263157895" y="40" width="189.473684210526" height="78.076923076923" rx="6.50132344048" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="376.842105263158" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2533086012" font-weight="bold" fill="var(--ok-text)">Install + Harden</text>
  <line x1="471.578947368421" y1="79.038461538462" x2="513.684210526316" y2="79.038461538462" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="524.210526315789" y="40" width="189.473684210526" height="78.076923076923" rx="6.50132344048" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="618.947368421053" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2533086012" font-weight="bold" fill="var(--ok-text)">Golden AMI</text>
  <line x1="713.684210526316" y1="79.038461538462" x2="755.789473684211" y2="79.038461538462" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="766.315789473684" y="40" width="189.473684210526" height="78.076923076923" rx="6.50132344048" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="861.052631578947" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2533086012" font-weight="bold" fill="var(--primary-text)">Launch</text>
  <line x1="955.789473684211" y1="79.038461538462" x2="997.894736842105" y2="79.038461538462" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1008.421052631579" y="40" width="189.473684210526" height="78.076923076923" rx="6.50132344048" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1103.157894736842" y="79.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.336862507947" font-weight="bold" fill="var(--ok-text)">READY</text>
  <text x="1103.157894736842" y="104.692307692307" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.086200787707" fill="var(--ok-text)">1-2 min</text>

  <rect x="40" y="151.538461538461" width="1157.894736842105" height="55.769230769231" rx="6.50132344048" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="618.947368421053" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.169754694453" fill="var(--text-muted)">fast, consistent, immutable — but rebuild for every change</text>

  <text x="650.526315789474" y="263.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.838185948427" font-weight="bold" fill="var(--warn-accent)">Bootstrap (User Data Script)</text>

  <rect x="40" y="285.384615384616" width="157.894736842105" height="78.076923076923" rx="6.50132344048" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="118.947368421053" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.169754694453" font-weight="bold" fill="var(--text)">Generic AMI</text>
  <line x1="197.894736842105" y1="324.423076923077" x2="234.736842105263" y2="324.423076923077" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="240" y="285.384615384616" width="157.894736842105" height="78.076923076923" rx="6.50132344048" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="318.947368421053" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.169754694453" font-weight="bold" fill="var(--primary-text)">Launch</text>
  <line x1="397.894736842105" y1="324.423076923077" x2="434.736842105263" y2="324.423076923077" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="440" y="285.384615384616" width="157.894736842105" height="78.076923076923" rx="6.50132344048" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="518.947368421053" y="324.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.169754694453" font-weight="bold" fill="var(--warn-text)">yum install</text>
  <text x="518.947368421053" y="346.73076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.00264688096" fill="var(--warn-text)">~3 min</text>
  <line x1="597.894736842105" y1="324.423076923077" x2="634.736842105263" y2="324.423076923077" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="640" y="285.384615384616" width="157.894736842105" height="78.076923076923" rx="6.50132344048" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="718.947368421053" y="324.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.169754694453" font-weight="bold" fill="var(--warn-text)">Pull Code</text>
  <text x="718.947368421053" y="346.73076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.00264688096" fill="var(--warn-text)">~4 min</text>
  <line x1="797.894736842105" y1="324.423076923077" x2="834.736842105263" y2="324.423076923077" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="840" y="285.384615384616" width="157.894736842105" height="78.076923076923" rx="6.50132344048" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="918.947368421053" y="324.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.169754694453" font-weight="bold" fill="var(--warn-text)">Configure</text>
  <text x="918.947368421053" y="346.73076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.00264688096" fill="var(--warn-text)">~2 min</text>
  <line x1="997.894736842105" y1="324.423076923077" x2="1034.736842105263" y2="324.423076923077" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1040" y="285.384615384616" width="157.894736842105" height="78.076923076923" rx="6.50132344048" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.947368421052" y="324.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.169754694453" font-weight="bold" fill="var(--warn-text)">READY</text>
  <text x="1118.947368421052" y="346.73076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.00264688096" fill="var(--warn-text)">10+ min</text>

  <rect x="40" y="385.769230769231" width="589.473684210526" height="234.230769230769" rx="6.50132344048" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334.736842105263" y="430.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.50397032144" font-weight="bold" fill="var(--ok-text)">Golden pros / cons</text>
  <text x="334.736842105263" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2533086012" fill="var(--ok-text)">+ fast boot, tested image</text>
  <text x="334.736842105263" y="508.461538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2533086012" fill="var(--ok-text)">+ immutable</text>
  <text x="334.736842105263" y="558.653846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2533086012" fill="var(--ok-text)">- rebuild per change</text>
  <text x="334.736842105263" y="592.115384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2533086012" fill="var(--ok-text)">- image sprawl</text>

  <rect x="650.526315789474" y="385.769230769231" width="589.473684210526" height="234.230769230769" rx="6.50132344048" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.263157894737" y="430.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.50397032144" font-weight="bold" fill="var(--warn-text)">Bootstrap pros / cons</text>
  <text x="945.263157894737" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2533086012" fill="var(--warn-text)">+ latest code</text>
  <text x="945.263157894737" y="508.461538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2533086012" fill="var(--warn-text)">+ no image management</text>
  <text x="945.263157894737" y="558.653846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2533086012" fill="var(--warn-text)">- slow, fragile</text>
  <text x="945.263157894737" y="592.115384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2533086012" fill="var(--warn-text)">- bad for auto-scaling</text>
</svg>

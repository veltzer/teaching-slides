  <text x="334.736842105263" y="593.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.803821232545" fill="var(--ok-text)">- image sprawl</text>

  <rect x="650.526315789474" y="398.545454545455" width="589.473684210526" height="221.454545454545" rx="6.321528493018" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.263157894737" y="440.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.964585479054" font-weight="bold" fill="var(--warn-text)">Bootstrap pros / cons</text>
  <text x="945.263157894737" y="482.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.803821232545" fill="var(--warn-text)">+ latest code</text>
  <text x="945.263157894737" y="514.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.803821232545" fill="var(--warn-text)">+ no image management</text>
  <text x="945.263157894737" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.803821232545" fill="var(--warn-text)">- slow, fragile</text>
  <text x="945.263157894737" y="593.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.803821232545" fill="var(--warn-text)">- bad for auto-scaling</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Top Swim Lane: Golden Image -->
  <rect x="68.125" y="67.1875" width="1143.75" height="244.6875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="115" y="94.375" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--ok-accent)" font-weight="bold">Golden Image (Pre-baked AMI)</text>

  <!-- Build phase -->
  <rect x="96.25" y="112.5" width="150" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="171.25" y="137.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle" font-weight="bold">Build Pipeline</text>
  <text x="171.25" y="154.1875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Packer / EC2 Builder</text>
  <text x="171.25" y="168.6875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">(done ahead of time)</text>

  <line x1="246.25" y1="144.2188" x2="293.125" y2="144.2188" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Install everything -->
  <rect x="297.8125" y="112.5" width="168.75" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="382.1875" y="135.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Install OS + Deps</text>
  <text x="382.1875" y="151.4688" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">+ App code + configs</text>
  <text x="382.1875" y="166.875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">+ security hardening</text>

  <line x1="466.5625" y1="144.2188" x2="513.4375" y2="144.2188" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Create AMI -->
  <rect x="518.125" y="112.5" width="140.625" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.4375" y="137.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--bg)" text-anchor="middle" font-weight="bold">Golden AMI</text>
  <text x="588.4375" y="154.1875" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">ami-0abc1234</text>
  <text x="588.4375" y="168.6875" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">Ready to launch!</text>

  <line x1="658.75" y1="144.2188" x2="715" y2="144.2188" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Launch -->
  <rect x="719.6875" y="112.5" width="131.25" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785.3125" y="137.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Launch Instance</text>
  <text x="785.3125" y="156" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">From golden AMI</text>

  <line x1="850.9375" y1="144.2188" x2="897.8125" y2="144.2188" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ready -->
  <rect x="902.5" y="112.5" width="131.25" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="968.125" y="137.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--bg)" text-anchor="middle" font-weight="bold">READY!</text>
  <text x="968.125" y="156" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--bg)" text-anchor="middle">~1-2 minutes</text>

  <!-- Timeline bar -->
  <rect x="719.6875" y="194.0625" width="314.0625" height="27.1875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="876.25" y="212.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Launch time: ~1-2 min (boot only)</text>

  <!-- Pros -->
  <text x="96.25" y="243.9062" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" font-weight="bold">Pros:</text>
  <text x="96.25" y="262.0312" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Fast startup, consistent, tested, immutable infrastructure</text>
  <text x="96.25" y="280.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" font-weight="bold">Cons:</text>
  <text x="96.25" y="298.2812" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Rebuild AMI for every change, image sprawl, larger image size</text>

  <!-- Bottom Swim Lane: Bootstrap -->
  <rect x="68.125" y="339.0625" width="1143.75" height="253.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="115" y="366.25" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--warn-accent)" font-weight="bold">Bootstrap (User Data Script)</text>

  <!-- Generic AMI -->
  <rect x="96.25" y="384.375" width="140.625" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="166.5625" y="409.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle" font-weight="bold">Generic AMI</text>
  <text x="166.5625" y="427.875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Base OS only</text>
  <text x="166.5625" y="440.5625" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">(Amazon Linux 2)</text>

  <line x1="236.875" y1="416.0938" x2="283.75" y2="416.0938" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Launch -->
  <rect x="288.4375" y="384.375" width="121.875" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="349.375" y="409.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Launch</text>
  <text x="349.375" y="427.875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">With user-data</text>
  <text x="349.375" y="440.5625" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">script attached</text>

  <line x1="410.3125" y1="416.0938" x2="457.1875" y2="416.0938" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Install deps -->
  <rect x="461.875" y="384.375" width="121.875" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="522.8125" y="407.0312" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">yum install</text>
  <text x="522.8125" y="423.3438" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">System packages</text>
  <text x="522.8125" y="438.75" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">~3 min</text>

  <line x1="583.75" y1="416.0938" x2="630.625" y2="416.0938" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pull code -->
  <rect x="635.3125" y="384.375" width="121.875" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="696.25" y="407.0312" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Pull Code</text>
  <text x="696.25" y="423.3438" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">git clone + build</text>
  <text x="696.25" y="438.75" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">~4 min</text>

  <line x1="757.1875" y1="416.0938" x2="804.0625" y2="416.0938" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Configure -->
  <rect x="808.75" y="384.375" width="121.875" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="869.6875" y="407.0312" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Configure</text>
  <text x="869.6875" y="423.3438" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Env vars, certs</text>
  <text x="869.6875" y="438.75" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">~2 min</text>

  <line x1="930.625" y1="416.0938" x2="977.5" y2="416.0938" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ready -->
  <rect x="982.1875" y="384.375" width="131.25" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.8125" y="409.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--bg)" text-anchor="middle" font-weight="bold">READY</text>
  <text x="1047.8125" y="427.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--bg)" text-anchor="middle">~10+ minutes</text>

  <!-- Timeline bar -->
  <rect x="288.4375" y="465.9375" width="825" height="27.1875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="700.9375" y="484.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Launch time: ~10-15 min (boot + install + config)</text>

  <!-- Pros/Cons -->
  <text x="96.25" y="515.7812" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" font-weight="bold">Pros:</text>
  <text x="96.25" y="533.9062" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Always latest code, no image management, simple to update</text>
  <text x="96.25" y="552.0312" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" font-weight="bold">Cons:</text>
  <text x="96.25" y="570.1562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Slow startup, fragile (external deps may fail), inconsistent builds, bad for auto-scaling</text>
</svg>
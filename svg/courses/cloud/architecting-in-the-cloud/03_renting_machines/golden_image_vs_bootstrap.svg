  <text x="518.947368421053" y="340.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.750233150375" font-weight="bold" fill="var(--warn-text)">yum install</text>
  <text x="518.947368421053" y="361.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.643056986036" fill="var(--warn-text)">~3 min</text>
  <line x1="597.894736842105" y1="340.545454545455" x2="634.736842105263" y2="340.545454545455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>


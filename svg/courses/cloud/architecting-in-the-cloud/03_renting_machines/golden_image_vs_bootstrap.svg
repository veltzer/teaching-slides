<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Top Swim Lane: Golden Image -->
  <rect x="30" y="30" width="1220" height="270" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2"/>
  <text x="80" y="60" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-dk)" font-weight="bold">Golden Image (Pre-baked AMI)</text>

  <!-- Build phase -->
  <rect x="60" y="80" width="160" height="70" rx="8" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="108" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">Build Pipeline</text>
  <text x="140" y="126" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Packer / EC2 Builder</text>
  <text x="140" y="142" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">(done ahead of time)</text>

  <line x1="220" y1="115" x2="270" y2="115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Install everything -->
  <rect x="275" y="80" width="180" height="70" rx="8" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="365" y="105" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Install OS + Deps</text>
  <text x="365" y="123" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">+ App code + configs</text>
  <text x="365" y="140" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">+ security hardening</text>

  <line x1="455" y1="115" x2="505" y2="115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Create AMI -->
  <rect x="510" y="80" width="150" height="70" rx="8" fill="var(--ok)" stroke="var(--ok-dk)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="585" y="108" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)" text-anchor="middle" font-weight="bold">Golden AMI</text>
  <text x="585" y="126" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">ami-0abc1234</text>
  <text x="585" y="142" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">Ready to launch!</text>

  <line x1="660" y1="115" x2="720" y2="115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Launch -->
  <rect x="725" y="80" width="140" height="70" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="795" y="108" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Launch Instance</text>
  <text x="795" y="128" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">From golden AMI</text>

  <line x1="865" y1="115" x2="915" y2="115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ready -->
  <rect x="920" y="80" width="140" height="70" rx="8" fill="var(--ok)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="108" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)" text-anchor="middle" font-weight="bold">READY!</text>
  <text x="990" y="128" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">~1-2 minutes</text>

  <!-- Timeline bar -->
  <rect x="725" y="170" width="335" height="30" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="892" y="190" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Launch time: ~1-2 min (boot only)</text>

  <!-- Pros -->
  <text x="60" y="225" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" font-weight="bold">Pros:</text>
  <text x="60" y="245" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Fast startup, consistent, tested, immutable infrastructure</text>
  <text x="60" y="265" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)" font-weight="bold">Cons:</text>
  <text x="60" y="285" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Rebuild AMI for every change, image sprawl, larger image size</text>

  <!-- Bottom Swim Lane: Bootstrap -->
  <rect x="30" y="330" width="1220" height="280" rx="12" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-dk)" font-weight="bold">Bootstrap (User Data Script)</text>

  <!-- Generic AMI -->
  <rect x="60" y="380" width="150" height="70" rx="8" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="408" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">Generic AMI</text>
  <text x="135" y="428" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Base OS only</text>
  <text x="135" y="442" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">(Amazon Linux 2)</text>

  <line x1="210" y1="415" x2="260" y2="415" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Launch -->
  <rect x="265" y="380" width="130" height="70" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="408" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Launch</text>
  <text x="330" y="428" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">With user-data</text>
  <text x="330" y="442" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">script attached</text>

  <line x1="395" y1="415" x2="445" y2="415" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Install deps -->
  <rect x="450" y="380" width="130" height="70" rx="8" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="515" y="405" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">yum install</text>
  <text x="515" y="423" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">System packages</text>
  <text x="515" y="440" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">~3 min</text>

  <line x1="580" y1="415" x2="630" y2="415" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pull code -->
  <rect x="635" y="380" width="130" height="70" rx="8" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="405" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">Pull Code</text>
  <text x="700" y="423" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">git clone + build</text>
  <text x="700" y="440" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">~4 min</text>

  <line x1="765" y1="415" x2="815" y2="415" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Configure -->
  <rect x="820" y="380" width="130" height="70" rx="8" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="885" y="405" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">Configure</text>
  <text x="885" y="423" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Env vars, certs</text>
  <text x="885" y="440" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">~2 min</text>

  <line x1="950" y1="415" x2="1000" y2="415" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ready -->
  <rect x="1005" y="380" width="140" height="70" rx="8" fill="var(--warn)" stroke="var(--warn-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075" y="408" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)" text-anchor="middle" font-weight="bold">READY</text>
  <text x="1075" y="428" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">~10+ minutes</text>

  <!-- Timeline bar -->
  <rect x="265" y="470" width="880" height="30" rx="6" fill="var(--warn-lt)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="705" y="490" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">Launch time: ~10-15 min (boot + install + config)</text>

  <!-- Pros/Cons -->
  <text x="60" y="525" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)" font-weight="bold">Pros:</text>
  <text x="60" y="545" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Always latest code, no image management, simple to update</text>
  <text x="60" y="565" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)" font-weight="bold">Cons:</text>
  <text x="60" y="585" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Slow startup, fragile (external deps may fail), inconsistent builds, bad for auto-scaling</text>
</svg>
  <line x1="713.684210526316" y1="108.545454545455" x2="755.789473684211" y2="108.545454545455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="766.315789473684" y="71.636363636364" width="189.473684210526" height="73.818181818182" rx="6.321528493018" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="861.052631578947" y="113.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.803821232545" font-weight="bold" fill="var(--primary-text)">Launch</text>
  <line x1="955.789473684211" y1="108.545454545455" x2="997.894736842105" y2="108.545454545455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1008.421052631579" y="71.636363636364" width="189.473684210526" height="73.818181818182" rx="6.321528493018" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1103.157894736842" y="108.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.857409314715" font-weight="bold" fill="var(--ok-text)">READY</text>
  <text x="1103.157894736842" y="132.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.696645068206" fill="var(--ok-text)">1-2 min</text>

  <rect x="40" y="177.090909090909" width="1157.894736842105" height="52.727272727273" rx="6.321528493018" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="618.947368421053" y="208.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.750233150375" fill="var(--text-muted)">fast, consistent, immutable — but rebuild for every change</text>

  <text x="650.526315789474" y="282.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.178937807733" font-weight="bold" fill="var(--warn-accent)">Bootstrap (User Data Script)</text>

  <rect x="40" y="303.636363636364" width="157.894736842105" height="73.818181818182" rx="6.321528493018" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

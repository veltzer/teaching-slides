<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Top Swim Lane: Golden Image -->
  <rect x="40" y="40" width="1200" height="270" rx="6.455833" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="89.180328" y="70" font-family="Arial, sans-serif" font-size="17.851886" fill="var(--ok-accent)" font-weight="bold">Golden Image (Pre-baked AMI)</text>

  <!-- Build phase -->
  <rect x="69.508197" y="90" width="157.377049" height="70" rx="6.455833" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="148.196721" y="118" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--text)" text-anchor="middle" font-weight="bold">Build Pipeline</text>
  <text x="148.196721" y="136" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">Packer / EC2 Builder</text>
  <text x="148.196721" y="152" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">(done ahead of time)</text>

  <line x1="226.885246" y1="125.000055" x2="276.065574" y2="125.000055" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Install everything -->
  <rect x="280.983607" y="90" width="177.04918" height="70" rx="6.455833" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="369.508197" y="114.999945" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Install OS + Deps</text>
  <text x="369.508197" y="133.000055" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">+ App code + configs</text>
  <text x="369.508197" y="150" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">+ security hardening</text>

  <line x1="458.032787" y1="125.000055" x2="507.213115" y2="125.000055" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Create AMI -->
  <rect x="512.131148" y="90" width="147.540984" height="70" rx="6.455833" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="585.901639" y="118" font-family="Arial, sans-serif" font-size="12.893052" fill="var(--bg)" text-anchor="middle" font-weight="bold">Golden AMI</text>
  <text x="585.901639" y="136" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--bg)" text-anchor="middle">ami-0abc1234</text>
  <text x="585.901639" y="152" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--bg)" text-anchor="middle">Ready to launch!</text>

  <line x1="659.672131" y1="125.000055" x2="718.688525" y2="125.000055" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Launch -->
  <rect x="723.606557" y="90" width="137.704918" height="70" rx="6.455833" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.459016" y="118" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Launch Instance</text>
  <text x="792.459016" y="138" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">From golden AMI</text>

  <line x1="861.311475" y1="125.000055" x2="910.491803" y2="125.000055" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ready -->
  <rect x="915.409836" y="90" width="137.704918" height="70" rx="6.455833" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="984.262295" y="118" font-family="Arial, sans-serif" font-size="12.893052" fill="var(--bg)" text-anchor="middle" font-weight="bold">READY!</text>
  <text x="984.262295" y="138" font-family="Arial, sans-serif" font-size="10.909498" fill="var(--bg)" text-anchor="middle">~1-2 minutes</text>

  <!-- Timeline bar -->
  <rect x="723.606557" y="180" width="329.508197" height="30" rx="6.455833" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="887.868852" y="200" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Launch time: ~1-2 min (boot only)</text>

  <!-- Pros -->
  <text x="69.508197" y="234.999945" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--ok-accent)" font-weight="bold">Pros:</text>
  <text x="69.508197" y="254.999945" font-family="Arial, sans-serif" font-size="10.909498" fill="var(--text-muted)">Fast startup, consistent, tested, immutable infrastructure</text>
  <text x="69.508197" y="274.999945" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--danger-accent)" font-weight="bold">Cons:</text>
  <text x="69.508197" y="294.999945" font-family="Arial, sans-serif" font-size="10.909498" fill="var(--text-muted)">Rebuild AMI for every change, image sprawl, larger image size</text>

  <!-- Bottom Swim Lane: Bootstrap -->
  <rect x="40" y="340" width="1200" height="280" rx="6.455833" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="89.180328" y="370" font-family="Arial, sans-serif" font-size="17.851886" fill="var(--warn-accent)" font-weight="bold">Bootstrap (User Data Script)</text>

  <!-- Generic AMI -->
  <rect x="69.508197" y="390" width="147.540984" height="70" rx="6.455833" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="143.278689" y="418" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--text)" text-anchor="middle" font-weight="bold">Generic AMI</text>
  <text x="143.278689" y="438" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">Base OS only</text>
  <text x="143.278689" y="452" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">(Amazon Linux 2)</text>

  <line x1="217.04918" y1="425.000055" x2="266.229508" y2="425.000055" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Launch -->
  <rect x="271.147541" y="390" width="127.868852" height="70" rx="6.455833" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.081967" y="418" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Launch</text>
  <text x="335.081967" y="438" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">With user-data</text>
  <text x="335.081967" y="452" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">script attached</text>

  <line x1="399.016393" y1="425.000055" x2="448.196721" y2="425.000055" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Install deps -->
  <rect x="453.114754" y="390" width="127.868852" height="70" rx="6.455833" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="517.04918" y="414.999945" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">yum install</text>
  <text x="517.04918" y="433.000055" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">System packages</text>
  <text x="517.04918" y="450" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">~3 min</text>

  <line x1="580.983607" y1="425.000055" x2="630.163934" y2="425.000055" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pull code -->
  <rect x="635.081967" y="390" width="127.868852" height="70" rx="6.455833" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="699.016393" y="414.999945" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Pull Code</text>
  <text x="699.016393" y="433.000055" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">git clone + build</text>
  <text x="699.016393" y="450" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">~4 min</text>

  <line x1="762.95082" y1="425.000055" x2="812.131148" y2="425.000055" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Configure -->
  <rect x="817.04918" y="390" width="127.868852" height="70" rx="6.455833" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880.983607" y="414.999945" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Configure</text>
  <text x="880.983607" y="433.000055" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">Env vars, certs</text>
  <text x="880.983607" y="450" font-family="Arial, sans-serif" font-size="10.759722" fill="var(--text-muted)" text-anchor="middle">~2 min</text>

  <line x1="944.918033" y1="425.000055" x2="994.098361" y2="425.000055" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ready -->
  <rect x="999.016393" y="390" width="137.704918" height="70" rx="6.455833" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1067.868852" y="418" font-family="Arial, sans-serif" font-size="12.893052" fill="var(--bg)" text-anchor="middle" font-weight="bold">READY</text>
  <text x="1067.868852" y="438" font-family="Arial, sans-serif" font-size="10.909498" fill="var(--bg)" text-anchor="middle">~10+ minutes</text>

  <!-- Timeline bar -->
  <rect x="271.147541" y="480" width="865.57377" height="30" rx="6.455833" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="703.934426" y="500" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Launch time: ~10-15 min (boot + install + config)</text>

  <!-- Pros/Cons -->
  <text x="69.508197" y="534.999945" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--ok-accent)" font-weight="bold">Pros:</text>
  <text x="69.508197" y="554.999945" font-family="Arial, sans-serif" font-size="10.909498" fill="var(--text-muted)">Always latest code, no image management, simple to update</text>
  <text x="69.508197" y="574.999945" font-family="Arial, sans-serif" font-size="11.901221" fill="var(--danger-accent)" font-weight="bold">Cons:</text>
  <text x="69.508197" y="594.999945" font-family="Arial, sans-serif" font-size="10.909498" fill="var(--text-muted)">Slow startup, fragile (external deps may fail), inconsistent builds, bad for auto-scaling</text>
</svg>
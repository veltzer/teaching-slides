  <text x="918.947368421053" y="340.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.750233150375" font-weight="bold" fill="var(--warn-text)">Configure</text>
  <text x="918.947368421053" y="361.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.643056986036" fill="var(--warn-text)">~2 min</text>
  <line x1="997.894736842105" y1="340.545454545455" x2="1034.736842105263" y2="340.545454545455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1040" y="303.636363636364" width="157.894736842105" height="73.818181818182" rx="6.321528493018" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.947368421052" y="340.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.750233150375" font-weight="bold" fill="var(--warn-text)">READY</text>
  <text x="1118.947368421052" y="361.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.643056986036" fill="var(--warn-text)">10+ min</text>

  <rect x="40" y="398.545454545455" width="589.473684210526" height="221.454545454545" rx="6.321528493018" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334.736842105263" y="440.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.964585479054" font-weight="bold" fill="var(--ok-text)">Golden pros / cons</text>
  <text x="334.736842105263" y="482.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.803821232545" fill="var(--ok-text)">+ fast boot, tested image</text>
  <text x="334.736842105263" y="514.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.803821232545" fill="var(--ok-text)">+ immutable</text>

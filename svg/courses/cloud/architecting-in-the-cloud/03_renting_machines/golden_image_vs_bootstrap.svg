  <text x="134.736842105263" y="113.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.803821232545" font-weight="bold" fill="var(--ok-text)">Build Pipeline</text>
  <line x1="229.473684210526" y1="108.545454545455" x2="271.578947368421" y2="108.545454545455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>


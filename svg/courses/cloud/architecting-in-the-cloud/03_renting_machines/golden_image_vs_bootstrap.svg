  <text x="718.947368421053" y="361.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.643056986036" fill="var(--warn-text)">~4 min</text>
  <line x1="797.894736842105" y1="340.545454545455" x2="834.736842105263" y2="340.545454545455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>


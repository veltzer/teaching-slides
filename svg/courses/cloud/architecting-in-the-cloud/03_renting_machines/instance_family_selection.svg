<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Column 1: General Purpose -->
  <rect x="68.125" y="67.1875" width="213.75" height="534.6875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="68.125" y="67.1875" width="213.75" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="68.125" y="98.9062" width="213.75" height="22.6562" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="175" y="94.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--bg)" text-anchor="middle" font-weight="bold">General Purpose</text>
  <text x="175" y="110.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--bg)" text-anchor="middle">Balanced CPU/RAM</text>

  <!-- Icon area -->
  <rect x="96.25" y="139.6875" width="157.5" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="175" y="159.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">CPU : RAM = 1:4</text>
  <text x="175" y="175.9375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Balanced ratio</text>

  <text x="86.875" y="212.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="86.875" y="230.3125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Web servers</text>
  <text x="86.875" y="246.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- App servers</text>
  <text x="86.875" y="262.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Small DBs</text>
  <text x="86.875" y="279.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Dev/test</text>

  <text x="86.875" y="311.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="86.875" y="330" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" font-weight="bold">M5, M6i, M7g</text>
  <text x="86.875" y="348.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" font-weight="bold">T3, T4g</text>
  <text x="86.875" y="366.25" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">(T = burstable)</text>

  <!-- Column 2: Compute Optimized -->
  <rect x="300.625" y="67.1875" width="213.75" height="534.6875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="300.625" y="67.1875" width="213.75" height="54.375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="300.625" y="98.9062" width="213.75" height="22.6562" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="407.5" y="94.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--bg)" text-anchor="middle" font-weight="bold">Compute Optimized</text>
  <text x="407.5" y="110.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--bg)" text-anchor="middle">High CPU performance</text>

  <rect x="328.75" y="139.6875" width="157.5" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="407.5" y="159.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">CPU : RAM = 1:2</text>
  <text x="407.5" y="175.9375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">CPU-heavy ratio</text>

  <text x="319.375" y="212.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="319.375" y="230.3125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Batch processing</text>
  <text x="319.375" y="246.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- HPC</text>
  <text x="319.375" y="262.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Gaming servers</text>
  <text x="319.375" y="279.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Video encoding</text>

  <text x="319.375" y="311.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="319.375" y="330" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" font-weight="bold">C5, C6i, C7g</text>
  <text x="319.375" y="348.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" font-weight="bold">C6gn (network)</text>

  <!-- Column 3: Memory Optimized -->
  <rect x="533.125" y="67.1875" width="213.75" height="534.6875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="533.125" y="67.1875" width="213.75" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="533.125" y="98.9062" width="213.75" height="22.6562" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="94.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--bg)" text-anchor="middle" font-weight="bold">Memory Optimized</text>
  <text x="640" y="110.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--bg)" text-anchor="middle">High RAM capacity</text>

  <rect x="561.25" y="139.6875" width="157.5" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="159.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">CPU : RAM = 1:8+</text>
  <text x="640" y="175.9375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">RAM-heavy ratio</text>

  <text x="551.875" y="212.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="551.875" y="230.3125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- In-memory DBs</text>
  <text x="551.875" y="246.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Redis / Memcached</text>
  <text x="551.875" y="262.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Real-time analytics</text>
  <text x="551.875" y="279.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- SAP HANA</text>

  <text x="551.875" y="311.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="551.875" y="330" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" font-weight="bold">R5, R6i, R7g</text>
  <text x="551.875" y="348.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" font-weight="bold">X2idn (up to 4TB)</text>

  <!-- Column 4: Storage Optimized -->
  <rect x="765.625" y="67.1875" width="213.75" height="534.6875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="765.625" y="67.1875" width="213.75" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="765.625" y="98.9062" width="213.75" height="22.6562" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="872.5" y="94.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--bg)" text-anchor="middle" font-weight="bold">Storage Optimized</text>
  <text x="872.5" y="110.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--bg)" text-anchor="middle">High disk throughput</text>

  <rect x="793.75" y="139.6875" width="157.5" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="872.5" y="159.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">High IOPS / seq IO</text>
  <text x="872.5" y="175.9375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">NVMe local storage</text>

  <text x="784.375" y="212.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="784.375" y="230.3125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Data warehouses</text>
  <text x="784.375" y="246.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Distributed FS</text>
  <text x="784.375" y="262.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Log processing</text>
  <text x="784.375" y="279.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Elasticsearch</text>

  <text x="784.375" y="311.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="784.375" y="330" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)" font-weight="bold">I3, I4i</text>
  <text x="784.375" y="348.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)" font-weight="bold">D2, D3, H1</text>

  <!-- Column 5: Accelerated -->
  <rect x="998.125" y="67.1875" width="213.75" height="534.6875" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="998.125" y="67.1875" width="213.75" height="54.375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="998.125" y="98.9062" width="213.75" height="22.6562" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1105" y="94.375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--bg)" text-anchor="middle" font-weight="bold">Accelerated</text>
  <text x="1105" y="110.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--bg)" text-anchor="middle">GPU / FPGA / Inferentia</text>

  <rect x="1026.25" y="139.6875" width="157.5" height="45.3125" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1105" y="159.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Hardware accelerators</text>
  <text x="1105" y="175.9375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">GPU / custom silicon</text>

  <text x="1016.875" y="212.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="1016.875" y="230.3125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- ML training</text>
  <text x="1016.875" y="246.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- ML inference</text>
  <text x="1016.875" y="262.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Graphics rendering</text>
  <text x="1016.875" y="279.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">- Video transcoding</text>

  <text x="1016.875" y="311.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="1016.875" y="330" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" font-weight="bold">P4d, P5 (GPU)</text>
  <text x="1016.875" y="348.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" font-weight="bold">Inf2 (Inferentia)</text>
  <text x="1016.875" y="366.25" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" font-weight="bold">Trn1 (Trainium)</text>
</svg>
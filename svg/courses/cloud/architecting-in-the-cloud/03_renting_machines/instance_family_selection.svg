<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- 5 columns -->
  <rect x="40" y="40" width="233.898305084746" height="580" rx="8.21031064994" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.949152542373" y="81.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.446910131123" font-weight="bold" fill="var(--primary-text)">General</text>
  <text x="156.949152542373" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" fill="var(--primary-text)">CPU:RAM 1:4</text>
  <text x="156.949152542373" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--primary-text)">Uses:</text>
  <text x="156.949152542373" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--primary-text)">Web, apps</text>
  <text x="156.949152542373" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--primary-text)">Small DBs</text>
  <text x="156.949152542373" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--primary-text)">Dev / test</text>
  <text x="156.949152542373" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--primary-text)">Families:</text>
  <text x="156.949152542373" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--primary-text)">M5, M6i, M7g</text>
  <text x="156.949152542373" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--primary-text)">T3, T4g</text>

  <rect x="289.152542372881" y="40" width="233.898305084746" height="580" rx="8.21031064994" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="406.101694915254" y="81.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.446910131123" font-weight="bold" fill="var(--danger-text)">Compute</text>
  <text x="406.101694915254" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" fill="var(--danger-text)">CPU:RAM 1:2</text>
  <text x="406.101694915254" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--danger-text)">Uses:</text>
  <text x="406.101694915254" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--danger-text)">Batch, HPC</text>
  <text x="406.101694915254" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--danger-text)">Gaming</text>
  <text x="406.101694915254" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--danger-text)">Video encode</text>
  <text x="406.101694915254" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--danger-text)">Families:</text>
  <text x="406.101694915254" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--danger-text)">C5, C6i, C7g</text>
  <text x="406.101694915254" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--danger-text)">C6gn</text>

  <rect x="538.305084745763" y="40" width="233.898305084746" height="580" rx="8.21031064994" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655.254237288136" y="81.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.446910131123" font-weight="bold" fill="var(--ok-text)">Memory</text>
  <text x="655.254237288136" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" fill="var(--ok-text)">CPU:RAM 1:8+</text>
  <text x="655.254237288136" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--ok-text)">Uses:</text>
  <text x="655.254237288136" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--ok-text)">In-mem DBs</text>
  <text x="655.254237288136" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--ok-text)">Redis</text>
  <text x="655.254237288136" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--ok-text)">SAP HANA</text>
  <text x="655.254237288136" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--ok-text)">Families:</text>
  <text x="655.254237288136" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--ok-text)">R5, R6i, R7g</text>
  <text x="655.254237288136" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--ok-text)">X2idn</text>

  <rect x="787.457627118644" y="40" width="233.898305084746" height="580" rx="8.21031064994" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="904.406779661017" y="81.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.446910131123" font-weight="bold" fill="var(--warn-text)">Storage</text>
  <text x="904.406779661017" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" fill="var(--warn-text)">High IOPS / NVMe</text>
  <text x="904.406779661017" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--warn-text)">Uses:</text>
  <text x="904.406779661017" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--warn-text)">Warehouses</text>
  <text x="904.406779661017" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--warn-text)">Logs</text>
  <text x="904.406779661017" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--warn-text)">Elasticsearch</text>
  <text x="904.406779661017" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--warn-text)">Families:</text>
  <text x="904.406779661017" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--warn-text)">I3, I4i</text>
  <text x="904.406779661017" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--warn-text)">D2, D3, H1</text>

  <rect x="1036.610169491525" y="40" width="203.389830508475" height="580" rx="8.21031064994" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1138.305084745763" y="81.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.446910131123" font-weight="bold" fill="var(--info-text)">Accelerated</text>
  <text x="1138.305084745763" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">GPU / FPGA</text>
  <text x="1138.305084745763" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--info-text)">Uses:</text>
  <text x="1138.305084745763" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">ML train</text>
  <text x="1138.305084745763" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">Inference</text>
  <text x="1138.305084745763" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">Render</text>
  <text x="1138.305084745763" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--info-text)">Families:</text>
  <text x="1138.305084745763" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--info-text)">P4d, P5</text>
  <text x="1138.305084745763" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--info-text)">Inf2, Trn1</text>
</svg>

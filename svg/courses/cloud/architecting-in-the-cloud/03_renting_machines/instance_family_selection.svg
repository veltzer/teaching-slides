  <rect x="557.377049" y="118.644068" width="165.245902" height="49.152542" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="140.271186" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">CPU : RAM = 1:8+</text>

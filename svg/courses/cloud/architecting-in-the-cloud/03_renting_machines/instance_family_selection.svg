<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Column 1: General Purpose -->
  <rect x="40" y="40" width="224.262295" height="580" rx="6.400889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="224.262295" height="58.983051" rx="6.400889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="74.406725" width="224.262295" height="24.576217" fill="var(--primary-fill)" rx="6.400889" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.131148" y="69.491525" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--bg)" text-anchor="middle" font-weight="bold">General Purpose</text>
  <text x="152.131148" y="87.186441" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--bg)" text-anchor="middle">Balanced CPU/RAM</text>

  <!-- Icon area -->
  <rect x="69.508197" y="118.644068" width="165.245902" height="49.152542" rx="6.400889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.131148" y="140.271186" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">CPU : RAM = 1:4</text>
  <text x="152.131148" y="157.966102" font-family="Arial, sans-serif" font-size="10.668148" fill="var(--text-muted)" text-anchor="middle">Balanced ratio</text>

  <text x="59.672131" y="197.288136" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="59.672131" y="216.949153" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Web servers</text>
  <text x="59.672131" y="234.644068" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- App servers</text>
  <text x="59.672131" y="252.338983" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Small DBs</text>
  <text x="59.672131" y="270.033898" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Dev/test</text>

  <text x="59.672131" y="305.423729" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="59.672131" y="325.084746" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--primary-accent)" font-weight="bold">M5, M6i, M7g</text>
  <text x="59.672131" y="344.745763" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--primary-accent)" font-weight="bold">T3, T4g</text>
  <text x="59.672131" y="364.40678" font-family="Arial, sans-serif" font-size="10.668148" fill="var(--text-faint)">(T = burstable)</text>

  <!-- Column 2: Compute Optimized -->
  <rect x="283.934426" y="40" width="224.262295" height="580" rx="6.400889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="283.934426" y="40" width="224.262295" height="58.983051" rx="6.400889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="283.934426" y="74.406725" width="224.262295" height="24.576217" fill="var(--danger-fill)" rx="6.400889" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="396.065574" y="69.491525" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--bg)" text-anchor="middle" font-weight="bold">Compute Optimized</text>
  <text x="396.065574" y="87.186441" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--bg)" text-anchor="middle">High CPU performance</text>

  <rect x="313.442623" y="118.644068" width="165.245902" height="49.152542" rx="6.400889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="396.065574" y="140.271186" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">CPU : RAM = 1:2</text>
  <text x="396.065574" y="157.966102" font-family="Arial, sans-serif" font-size="10.668148" fill="var(--text-muted)" text-anchor="middle">CPU-heavy ratio</text>

  <text x="303.606557" y="197.288136" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="303.606557" y="216.949153" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Batch processing</text>
  <text x="303.606557" y="234.644068" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- HPC</text>

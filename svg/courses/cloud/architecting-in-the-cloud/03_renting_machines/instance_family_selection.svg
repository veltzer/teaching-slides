  <text x="547.540984" y="197.288136" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="547.540984" y="216.949153" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- In-memory DBs</text>
  <text x="547.540984" y="234.644068" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Redis / Memcached</text>
  <text x="547.540984" y="252.338983" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Real-time analytics</text>
  <text x="547.540984" y="270.033898" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- SAP HANA</text>

  <text x="547.540984" y="305.423729" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="547.540984" y="325.084746" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--ok-accent)" font-weight="bold">R5, R6i, R7g</text>
  <text x="547.540984" y="344.745763" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--ok-accent)" font-weight="bold">X2idn (up to 4TB)</text>

  <!-- Column 4: Storage Optimized -->
  <rect x="771.803279" y="40" width="224.262295" height="580" rx="6.400889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="771.803279" y="40" width="224.262295" height="58.983051" rx="6.400889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="771.803279" y="74.406725" width="224.262295" height="24.576217" fill="var(--warn-fill)" rx="6.400889" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.934426" y="69.491525" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--bg)" text-anchor="middle" font-weight="bold">Storage Optimized</text>
  <text x="883.934426" y="87.186441" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--bg)" text-anchor="middle">High disk throughput</text>

  <rect x="801.311475" y="118.644068" width="165.245902" height="49.152542" rx="6.400889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.934426" y="140.271186" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">High IOPS / seq IO</text>

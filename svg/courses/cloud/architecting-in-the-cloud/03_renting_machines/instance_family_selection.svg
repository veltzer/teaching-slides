<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Column 1: General Purpose -->
  <rect x="30" y="30" width="228" height="590" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="30" width="228" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="30" y="65" width="228" height="25" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="144" y="60" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)" text-anchor="middle" font-weight="bold">General Purpose</text>
  <text x="144" y="78" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">Balanced CPU/RAM</text>

  <!-- Icon area -->
  <rect x="60" y="110" width="168" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="144" y="132" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">CPU : RAM = 1:4</text>
  <text x="144" y="150" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Balanced ratio</text>

  <text x="50" y="190" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="50" y="210" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Web servers</text>
  <text x="50" y="228" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- App servers</text>
  <text x="50" y="246" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Small DBs</text>
  <text x="50" y="264" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Dev/test</text>

  <text x="50" y="300" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" font-weight="bold">M5, M6i, M7g</text>
  <text x="50" y="340" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)" font-weight="bold">T3, T4g</text>
  <text x="50" y="360" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">(T = burstable)</text>

  <!-- Column 2: Compute Optimized -->
  <rect x="278" y="30" width="228" height="590" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="278" y="30" width="228" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="278" y="65" width="228" height="25" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="392" y="60" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)" text-anchor="middle" font-weight="bold">Compute Optimized</text>
  <text x="392" y="78" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">High CPU performance</text>

  <rect x="308" y="110" width="168" height="50" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="392" y="132" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">CPU : RAM = 1:2</text>
  <text x="392" y="150" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">CPU-heavy ratio</text>

  <text x="298" y="190" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="298" y="210" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Batch processing</text>
  <text x="298" y="228" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- HPC</text>
  <text x="298" y="246" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Gaming servers</text>
  <text x="298" y="264" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Video encoding</text>

  <text x="298" y="300" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="298" y="320" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" font-weight="bold">C5, C6i, C7g</text>
  <text x="298" y="340" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" font-weight="bold">C6gn (network)</text>

  <!-- Column 3: Memory Optimized -->
  <rect x="526" y="30" width="228" height="590" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="526" y="30" width="228" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="526" y="65" width="228" height="25" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="60" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)" text-anchor="middle" font-weight="bold">Memory Optimized</text>
  <text x="640" y="78" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">High RAM capacity</text>

  <rect x="556" y="110" width="168" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="132" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">CPU : RAM = 1:8+</text>
  <text x="640" y="150" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">RAM-heavy ratio</text>

  <text x="546" y="190" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="546" y="210" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- In-memory DBs</text>
  <text x="546" y="228" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Redis / Memcached</text>
  <text x="546" y="246" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Real-time analytics</text>
  <text x="546" y="264" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- SAP HANA</text>

  <text x="546" y="300" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="546" y="320" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" font-weight="bold">R5, R6i, R7g</text>
  <text x="546" y="340" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)" font-weight="bold">X2idn (up to 4TB)</text>

  <!-- Column 4: Storage Optimized -->
  <rect x="774" y="30" width="228" height="590" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="774" y="30" width="228" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="774" y="65" width="228" height="25" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="888" y="60" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)" text-anchor="middle" font-weight="bold">Storage Optimized</text>
  <text x="888" y="78" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">High disk throughput</text>

  <rect x="804" y="110" width="168" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="888" y="132" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">High IOPS / seq IO</text>
  <text x="888" y="150" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">NVMe local storage</text>

  <text x="794" y="190" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="794" y="210" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Data warehouses</text>
  <text x="794" y="228" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Distributed FS</text>
  <text x="794" y="246" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Log processing</text>
  <text x="794" y="264" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Elasticsearch</text>

  <text x="794" y="300" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="794" y="320" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)" font-weight="bold">I3, I4i</text>
  <text x="794" y="340" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)" font-weight="bold">D2, D3, H1</text>

  <!-- Column 5: Accelerated -->
  <rect x="1022" y="30" width="228" height="590" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1022" y="30" width="228" height="60" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="1022" y="65" width="228" height="25" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1136" y="60" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)" text-anchor="middle" font-weight="bold">Accelerated</text>
  <text x="1136" y="78" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">GPU / FPGA / Inferentia</text>

  <rect x="1052" y="110" width="168" height="50" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1136" y="132" font-family="Arial, sans-serif" font-size="11" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Hardware accelerators</text>
  <text x="1136" y="150" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">GPU / custom silicon</text>

  <text x="1042" y="190" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="1042" y="210" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- ML training</text>
  <text x="1042" y="228" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- ML inference</text>
  <text x="1042" y="246" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Graphics rendering</text>
  <text x="1042" y="264" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">- Video transcoding</text>

  <text x="1042" y="300" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="1042" y="320" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)" font-weight="bold">P4d, P5 (GPU)</text>
  <text x="1042" y="340" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)" font-weight="bold">Inf2 (Inferentia)</text>
  <text x="1042" y="360" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)" font-weight="bold">Trn1 (Trainium)</text>
</svg>
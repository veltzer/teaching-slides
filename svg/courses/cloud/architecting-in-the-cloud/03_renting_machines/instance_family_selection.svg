<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Column 1: General Purpose -->
  <rect x="40" y="40" width="224.262295" height="580" rx="6.400889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="224.262295" height="58.983051" rx="6.400889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="74.406725" width="224.262295" height="24.576217" fill="url(#grad-primary)" rx="6.400889" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.131148" y="69.491525" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--bg)" text-anchor="middle" font-weight="bold">General Purpose</text>
  <text x="152.131148" y="87.186441" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--bg)" text-anchor="middle">Balanced CPU/RAM</text>

  <!-- Icon area -->
  <rect x="69.508197" y="118.644068" width="165.245902" height="49.152542" rx="6.400889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.131148" y="140.271186" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">CPU : RAM = 1:4</text>
  <text x="152.131148" y="157.966102" font-family="Arial, sans-serif" font-size="10.668148" fill="var(--text-muted)" text-anchor="middle">Balanced ratio</text>

  <text x="59.672131" y="197.288136" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="59.672131" y="216.949153" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Web servers</text>
  <text x="59.672131" y="234.644068" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- App servers</text>
  <text x="59.672131" y="252.338983" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Small DBs</text>
  <text x="59.672131" y="270.033898" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Dev/test</text>

  <text x="59.672131" y="305.423729" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="59.672131" y="325.084746" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--primary-accent)" font-weight="bold">M5, M6i, M7g</text>
  <text x="59.672131" y="344.745763" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--primary-accent)" font-weight="bold">T3, T4g</text>
  <text x="59.672131" y="364.40678" font-family="Arial, sans-serif" font-size="10.668148" fill="var(--text-faint)">(T = burstable)</text>

  <!-- Column 2: Compute Optimized -->
  <rect x="283.934426" y="40" width="224.262295" height="580" rx="6.400889" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="283.934426" y="40" width="224.262295" height="58.983051" rx="6.400889" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="283.934426" y="74.406725" width="224.262295" height="24.576217" fill="url(#grad-danger)" rx="6.400889" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="396.065574" y="69.491525" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--bg)" text-anchor="middle" font-weight="bold">Compute Optimized</text>
  <text x="396.065574" y="87.186441" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--bg)" text-anchor="middle">High CPU performance</text>

  <rect x="313.442623" y="118.644068" width="165.245902" height="49.152542" rx="6.400889" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="396.065574" y="140.271186" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">CPU : RAM = 1:2</text>
  <text x="396.065574" y="157.966102" font-family="Arial, sans-serif" font-size="10.668148" fill="var(--text-muted)" text-anchor="middle">CPU-heavy ratio</text>

  <text x="303.606557" y="197.288136" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="303.606557" y="216.949153" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Batch processing</text>
  <text x="303.606557" y="234.644068" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- HPC</text>
  <text x="303.606557" y="252.338983" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Gaming servers</text>
  <text x="303.606557" y="270.033898" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Video encoding</text>

  <text x="303.606557" y="305.423729" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="303.606557" y="325.084746" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--danger-accent)" font-weight="bold">C5, C6i, C7g</text>
  <text x="303.606557" y="344.745763" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--danger-accent)" font-weight="bold">C6gn (network)</text>

  <!-- Column 3: Memory Optimized -->
  <rect x="527.868852" y="40" width="224.262295" height="580" rx="6.400889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="527.868852" y="40" width="224.262295" height="58.983051" rx="6.400889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="527.868852" y="74.406725" width="224.262295" height="24.576217" fill="url(#grad-ok)" rx="6.400889" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="69.491525" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--bg)" text-anchor="middle" font-weight="bold">Memory Optimized</text>
  <text x="640" y="87.186441" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--bg)" text-anchor="middle">High RAM capacity</text>

  <rect x="557.377049" y="118.644068" width="165.245902" height="49.152542" rx="6.400889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="140.271186" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">CPU : RAM = 1:8+</text>
  <text x="640" y="157.966102" font-family="Arial, sans-serif" font-size="10.668148" fill="var(--text-muted)" text-anchor="middle">RAM-heavy ratio</text>

  <text x="547.540984" y="197.288136" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="547.540984" y="216.949153" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- In-memory DBs</text>
  <text x="547.540984" y="234.644068" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Redis / Memcached</text>
  <text x="547.540984" y="252.338983" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Real-time analytics</text>
  <text x="547.540984" y="270.033898" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- SAP HANA</text>

  <text x="547.540984" y="305.423729" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="547.540984" y="325.084746" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--ok-accent)" font-weight="bold">R5, R6i, R7g</text>
  <text x="547.540984" y="344.745763" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--ok-accent)" font-weight="bold">X2idn (up to 4TB)</text>

  <!-- Column 4: Storage Optimized -->
  <rect x="771.803279" y="40" width="224.262295" height="580" rx="6.400889" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="771.803279" y="40" width="224.262295" height="58.983051" rx="6.400889" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="771.803279" y="74.406725" width="224.262295" height="24.576217" fill="url(#grad-warn)" rx="6.400889" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.934426" y="69.491525" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--bg)" text-anchor="middle" font-weight="bold">Storage Optimized</text>
  <text x="883.934426" y="87.186441" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--bg)" text-anchor="middle">High disk throughput</text>

  <rect x="801.311475" y="118.644068" width="165.245902" height="49.152542" rx="6.400889" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.934426" y="140.271186" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">High IOPS / seq IO</text>
  <text x="883.934426" y="157.966102" font-family="Arial, sans-serif" font-size="10.668148" fill="var(--text-muted)" text-anchor="middle">NVMe local storage</text>

  <text x="791.47541" y="197.288136" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="791.47541" y="216.949153" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Data warehouses</text>
  <text x="791.47541" y="234.644068" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Distributed FS</text>
  <text x="791.47541" y="252.338983" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Log processing</text>
  <text x="791.47541" y="270.033898" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Elasticsearch</text>

  <text x="791.47541" y="305.423729" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="791.47541" y="325.084746" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--warn-accent)" font-weight="bold">I3, I4i</text>
  <text x="791.47541" y="344.745763" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--warn-accent)" font-weight="bold">D2, D3, H1</text>

  <!-- Column 5: Accelerated -->
  <rect x="1015.737705" y="40" width="224.262295" height="580" rx="6.400889" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1015.737705" y="40" width="224.262295" height="58.983051" rx="6.400889" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1015.737705" y="74.406725" width="224.262295" height="24.576217" fill="url(#grad-info)" rx="6.400889" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1127.868852" y="69.491525" font-family="Arial, sans-serif" font-size="13.766605" fill="var(--bg)" text-anchor="middle" font-weight="bold">Accelerated</text>
  <text x="1127.868852" y="87.186441" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--bg)" text-anchor="middle">GPU / FPGA / Inferentia</text>

  <rect x="1045.245902" y="118.644068" width="165.245902" height="49.152542" rx="6.400889" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1127.868852" y="140.271186" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Hardware accelerators</text>
  <text x="1127.868852" y="157.966102" font-family="Arial, sans-serif" font-size="10.668148" fill="var(--text-muted)" text-anchor="middle">GPU / custom silicon</text>

  <text x="1035.409836" y="197.288136" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Workloads:</text>
  <text x="1035.409836" y="216.949153" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- ML training</text>
  <text x="1035.409836" y="234.644068" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- ML inference</text>
  <text x="1035.409836" y="252.338983" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Graphics rendering</text>
  <text x="1035.409836" y="270.033898" font-family="Arial, sans-serif" font-size="10.816649" fill="var(--text-muted)">- Video transcoding</text>

  <text x="1035.409836" y="305.423729" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text)" font-weight="bold">Families:</text>
  <text x="1035.409836" y="325.084746" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--info-accent)" font-weight="bold">P4d, P5 (GPU)</text>
  <text x="1035.409836" y="344.745763" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--info-accent)" font-weight="bold">Inf2 (Inferentia)</text>
  <text x="1035.409836" y="364.40678" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--info-accent)" font-weight="bold">Trn1 (Trainium)</text>

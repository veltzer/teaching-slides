<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Start: Choose Compute -->
  <rect x="490" y="30" width="300" height="60" rx="30" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="67" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)" text-anchor="middle" font-weight="bold">Choose Compute</text>

  <!-- Arrow down to Q1 -->
  <line x1="640" y1="90" x2="640" y2="130" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q1: Can be serverless? -->
  <polygon points="640,130 820,200 640,270 460,200" fill="var(--surface)" stroke="var(--primary)" stroke-width="2"/>
  <text x="640" y="193" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">Can it be</text>
  <text x="640" y="211" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">serverless?</text>

  <!-- Yes -> Lambda -->
  <line x1="820" y1="200" x2="930" y2="200" stroke="var(--ok)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="870" y="192" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)" font-weight="bold">Yes</text>

  <rect x="935" y="165" width="220" height="70" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1045" y="195" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Lambda</text>
  <text x="1045" y="218" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Event-driven, pay-per-invoke</text>

  <!-- No -> Q2 -->
  <line x1="640" y1="270" x2="640" y2="310" stroke="var(--danger)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="655" y="296" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)" font-weight="bold">No</text>

  <!-- Q2: Needs containers? -->
  <polygon points="640,310 820,380 640,450 460,380" fill="var(--surface)" stroke="var(--warn)" stroke-width="2"/>
  <text x="640" y="373" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">Needs</text>
  <text x="640" y="391" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">containers?</text>

  <!-- Yes -> EKS/ECS -->
  <line x1="820" y1="380" x2="930" y2="380" stroke="var(--ok)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="870" y="372" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)" font-weight="bold">Yes</text>

  <rect x="935" y="345" width="220" height="70" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1045" y="375" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">EKS / ECS</text>
  <text x="1045" y="398" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Container orchestration</text>

  <!-- No -> Q3 -->
  <line x1="640" y1="450" x2="640" y2="480" stroke="var(--danger)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="655" y="471" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)" font-weight="bold">No</text>

  <!-- Q3: Needs PaaS? -->
  <polygon points="640,480 800,540 640,600 480,540" fill="var(--surface)" stroke="var(--info)" stroke-width="2"/>
  <text x="640" y="535" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">Want managed</text>
  <text x="640" y="553" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">PaaS?</text>

  <!-- Yes -> Beanstalk -->
  <line x1="800" y1="540" x2="930" y2="540" stroke="var(--ok)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="860" y="532" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-dk)" font-weight="bold">Yes</text>

  <rect x="935" y="505" width="220" height="70" rx="10" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1045" y="535" font-family="Arial, sans-serif" font-size="16" fill="var(--info-dk)" text-anchor="middle" font-weight="bold">Elastic Beanstalk</text>
  <text x="1045" y="558" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Managed platform</text>

  <!-- No -> EC2 -->
  <line x1="480" y1="540" x2="350" y2="540" stroke="var(--danger)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="420" y="532" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-dk)" font-weight="bold">No</text>

  <rect x="120" y="505" width="230" height="70" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="235" y="535" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">EC2</text>
  <text x="235" y="558" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Full control, any workload</text>

  <!-- Side annotations -->
  <rect x="40" y="50" width="200" height="80" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="140" y="75" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)" text-anchor="middle" font-weight="bold">Decision Criteria</text>
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Start serverless-first,</text>
  <text x="50" y="110" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">add complexity only as needed</text>

  <!-- Fargate note -->
  <rect x="935" y="425" width="220" height="25" rx="4" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1045" y="442" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">+ Fargate for serverless containers</text>

  <!-- Lambda note -->
  <rect x="935" y="240" width="220" height="25" rx="4" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1045" y="257" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">15 min max, 10 GB RAM limit</text>

  <!-- Management spectrum arrow -->
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle" transform="rotate(-90,80,400)">Less management ← → More control</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Start: Choose Compute -->
  <rect x="524.304933" y="40" width="322.869955" height="61.052632" rx="6.811949" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.73991" y="77.649179" font-family="Arial, sans-serif" font-size="18.836627" fill="var(--bg)" text-anchor="middle" font-weight="bold">Choose Compute</text>

  <!-- Arrow down to Q1 -->
  <line x1="685.73991" y1="101.052632" x2="685.73991" y2="141.754386" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q1: Can be serverless? -->
  <polygon points="685.73991,141.754386 879.461883,212.982456 685.73991,284.210526 492.017937,212.982456" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="685.73991" y="205.859593" font-family="Arial, sans-serif" font-size="13.604256" fill="var(--text)" text-anchor="middle" font-weight="bold">Can it be</text>
  <text x="685.73991" y="224.175495" font-family="Arial, sans-serif" font-size="13.604256" fill="var(--text)" text-anchor="middle" font-weight="bold">serverless?</text>

  <!-- Yes -> Lambda -->
  <line x1="879.461883" y1="212.982456" x2="997.847534" y2="212.982456" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="933.273543" y="204.842105" font-family="Arial, sans-serif" font-size="14.650685" fill="var(--ok-accent)" font-weight="bold">Yes</text>

  <rect x="1003.2287" y="177.368365" width="236.7713" height="71.22807" rx="6.811949" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.61435" y="207.894793" font-family="Arial, sans-serif" font-size="16.743656" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Lambda</text>
  <text x="1121.61435" y="231.298246" font-family="Arial, sans-serif" font-size="11.511285" fill="var(--text-muted)" text-anchor="middle">Event-driven, pay-per-invoke</text>

  <!-- No -> Q2 -->
  <line x1="685.73991" y1="284.210526" x2="685.73991" y2="324.912281" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="701.883408" y="310.666667" font-family="Arial, sans-serif" font-size="14.650685" fill="var(--danger-accent)" font-weight="bold">No</text>

  <!-- Q2: Needs containers? -->
  <polygon points="685.73991,324.912281 879.461883,396.140351 685.73991,467.368421 492.017937,396.140351" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="685.73991" y="389.017488" font-family="Arial, sans-serif" font-size="13.604256" fill="var(--text)" text-anchor="middle" font-weight="bold">Needs</text>
  <text x="685.73991" y="407.333389" font-family="Arial, sans-serif" font-size="13.604256" fill="var(--text)" text-anchor="middle" font-weight="bold">containers?</text>

  <!-- Yes -> EKS/ECS -->
  <line x1="879.461883" y1="396.140351" x2="997.847534" y2="396.140351" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="933.273543" y="388" font-family="Arial, sans-serif" font-size="14.650685" fill="var(--ok-accent)" font-weight="bold">Yes</text>

  <rect x="1003.2287" y="360.52626" width="236.7713" height="71.22807" rx="6.811949" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.61435" y="391.052688" font-family="Arial, sans-serif" font-size="16.743656" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">EKS / ECS</text>
  <text x="1121.61435" y="414.45614" font-family="Arial, sans-serif" font-size="11.511285" fill="var(--text-muted)" text-anchor="middle">Container orchestration</text>

  <!-- No -> Q3 -->
  <line x1="685.73991" y1="467.368421" x2="685.73991" y2="497.894737" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="701.883408" y="488.736898" font-family="Arial, sans-serif" font-size="14.650685" fill="var(--danger-accent)" font-weight="bold">No</text>

  <!-- Q3: Needs PaaS? -->
  <polygon points="685.73991,497.894737 857.93722,558.947368 685.73991,620 513.542601,558.947368" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="685.73991" y="553.859705" font-family="Arial, sans-serif" font-size="13.604256" fill="var(--text)" text-anchor="middle" font-weight="bold">Want managed</text>
  <text x="685.73991" y="572.175382" font-family="Arial, sans-serif" font-size="13.604256" fill="var(--text)" text-anchor="middle" font-weight="bold">PaaS?</text>

  <!-- Yes -> Beanstalk -->
  <line x1="857.93722" y1="558.947368" x2="997.847534" y2="558.947368" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="922.511211" y="550.807018" font-family="Arial, sans-serif" font-size="14.650685" fill="var(--ok-accent)" font-weight="bold">Yes</text>

  <rect x="1003.2287" y="523.333277" width="236.7713" height="71.22807" rx="6.811949" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.61435" y="553.859705" font-family="Arial, sans-serif" font-size="16.743656" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Elastic Beanstalk</text>
  <text x="1121.61435" y="577.263158" font-family="Arial, sans-serif" font-size="11.511285" fill="var(--text-muted)" text-anchor="middle">Managed platform</text>

  <!-- No -> EC2 -->
  <line x1="513.542601" y1="558.947368" x2="373.632287" y2="558.947368" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="448.96861" y="550.807018" font-family="Arial, sans-serif" font-size="14.650685" fill="var(--danger-accent)" font-weight="bold">No</text>

  <rect x="126.098655" y="523.333277" width="247.533632" height="71.22807" rx="6.811949" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="249.865471" y="553.859705" font-family="Arial, sans-serif" font-size="16.743656" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">EC2</text>
  <text x="249.865471" y="577.263158" font-family="Arial, sans-serif" font-size="11.511285" fill="var(--text-muted)" text-anchor="middle">Full control, any workload</text>

  <!-- Side annotations -->
  <rect x="40" y="60.350877" width="215.246637" height="81.403509" rx="6.811949" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="147.623318" y="85.78953" font-family="Arial, sans-serif" font-size="12.557714" fill="var(--text)" text-anchor="middle" font-weight="bold">Decision Criteria</text>
  <text x="50.762332" y="106.140407" font-family="Arial, sans-serif" font-size="11.353248" fill="var(--text-muted)">Start serverless-first,</text>
  <text x="50.762332" y="121.403509" font-family="Arial, sans-serif" font-size="11.353248" fill="var(--text-muted)">add complexity only as needed</text>

  <!-- Fargate note -->
  <rect x="1003.2287" y="441.929768" width="236.7713" height="25.43854" rx="6.811949" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1121.61435" y="459.22807" font-family="Arial, sans-serif" font-size="11.353248" fill="var(--text-faint)" text-anchor="middle">+ Fargate for serverless containers</text>

  <!-- Lambda note -->
  <rect x="1003.2287" y="253.684211" width="236.7713" height="25.43854" rx="6.811949" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1121.61435" y="270.9824" font-family="Arial, sans-serif" font-size="11.353248" fill="var(--text-faint)" text-anchor="middle">15 min max, 10 GB RAM limit</text>

  <!-- Management spectrum arrow -->
  <text x="115" y="320.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle" transform="rotate(-90,80,400)">Less management ← → More control</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Start: Choose Compute -->
  <rect x="490" y="30" width="300" height="60" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="67" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)" text-anchor="middle" font-weight="bold">Choose Compute</text>

  <!-- Arrow down to Q1 -->
  <line x1="640" y1="90" x2="640" y2="130" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q1: Can be serverless? -->
  <polygon points="640,130 820,200 640,270 460,200" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="193" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" text-anchor="middle" font-weight="bold">Can it be</text>
  <text x="640" y="211" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" text-anchor="middle" font-weight="bold">serverless?</text>

  <!-- Yes -> Lambda -->
  <line x1="820" y1="200" x2="930" y2="200" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="192" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Yes</text>

  <rect x="935" y="165" width="220" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="195" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Lambda</text>
  <text x="1045" y="218" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Event-driven, pay-per-invoke</text>

  <!-- No -> Q2 -->
  <line x1="640" y1="270" x2="640" y2="310" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="296" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)" font-weight="bold">No</text>

  <!-- Q2: Needs containers? -->
  <polygon points="640,310 820,380 640,450 460,380" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="373" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" text-anchor="middle" font-weight="bold">Needs</text>
  <text x="640" y="391" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" text-anchor="middle" font-weight="bold">containers?</text>

  <!-- Yes -> EKS/ECS -->
  <line x1="820" y1="380" x2="930" y2="380" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="372" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Yes</text>

  <rect x="935" y="345" width="220" height="70" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="375" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">EKS / ECS</text>
  <text x="1045" y="398" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Container orchestration</text>

  <!-- No -> Q3 -->
  <line x1="640" y1="450" x2="640" y2="480" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="471" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)" font-weight="bold">No</text>

  <!-- Q3: Needs PaaS? -->
  <polygon points="640,480 800,540 640,600 480,540" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="535" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" text-anchor="middle" font-weight="bold">Want managed</text>
  <text x="640" y="553" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" text-anchor="middle" font-weight="bold">PaaS?</text>

  <!-- Yes -> Beanstalk -->
  <line x1="800" y1="540" x2="930" y2="540" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="532" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Yes</text>

  <rect x="935" y="505" width="220" height="70" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="535" font-family="Arial, sans-serif" font-size="16" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Elastic Beanstalk</text>
  <text x="1045" y="558" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Managed platform</text>

  <!-- No -> EC2 -->
  <line x1="480" y1="540" x2="350" y2="540" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="532" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)" font-weight="bold">No</text>

  <rect x="120" y="505" width="230" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="535" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">EC2</text>
  <text x="235" y="558" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Full control, any workload</text>

  <!-- Side annotations -->
  <rect x="40" y="50" width="200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="140" y="75" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle" font-weight="bold">Decision Criteria</text>
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Start serverless-first,</text>
  <text x="50" y="110" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">add complexity only as needed</text>

  <!-- Fargate note -->
  <rect x="935" y="425" width="220" height="25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1045" y="442" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">+ Fargate for serverless containers</text>

  <!-- Lambda note -->
  <rect x="935" y="240" width="220" height="25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1045" y="257" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">15 min max, 10 GB RAM limit</text>

  <!-- Management spectrum arrow -->
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle" transform="rotate(-90,80,400)">Less management ← → More control</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Start: Choose Compute -->
  <rect x="499.375" y="67.1875" width="281.25" height="54.375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="100.7188" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--bg)" text-anchor="middle" font-weight="bold">Choose Compute</text>

  <!-- Arrow down to Q1 -->
  <line x1="640" y1="121.5625" x2="640" y2="157.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q1: Can be serverless? -->
  <polygon points="640,157.8125 808.75,221.25 640,284.6875 471.25,221.25" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="214.9062" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle" font-weight="bold">Can it be</text>
  <text x="640" y="231.2188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle" font-weight="bold">serverless?</text>

  <!-- Yes -> Lambda -->
  <line x1="808.75" y1="221.25" x2="911.875" y2="221.25" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="855.625" y="214" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Yes</text>

  <rect x="916.5625" y="189.5312" width="206.25" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1019.6875" y="216.7188" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Lambda</text>
  <text x="1019.6875" y="237.5625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Event-driven, pay-per-invoke</text>

  <!-- No -> Q2 -->
  <line x1="640" y1="284.6875" x2="640" y2="320.9375" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="654.0625" y="308.25" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)" font-weight="bold">No</text>

  <!-- Q2: Needs containers? -->
  <polygon points="640,320.9375 808.75,384.375 640,447.8125 471.25,384.375" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="378.0312" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle" font-weight="bold">Needs</text>
  <text x="640" y="394.3438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle" font-weight="bold">containers?</text>

  <!-- Yes -> EKS/ECS -->
  <line x1="808.75" y1="384.375" x2="911.875" y2="384.375" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="855.625" y="377.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Yes</text>

  <rect x="916.5625" y="352.6562" width="206.25" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1019.6875" y="379.8438" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">EKS / ECS</text>
  <text x="1019.6875" y="400.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Container orchestration</text>

  <!-- No -> Q3 -->
  <line x1="640" y1="447.8125" x2="640" y2="475" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="654.0625" y="466.8438" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)" font-weight="bold">No</text>

  <!-- Q3: Needs PaaS? -->
  <polygon points="640,475 790,529.375 640,583.75 490,529.375" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="524.8438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle" font-weight="bold">Want managed</text>
  <text x="640" y="541.1562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle" font-weight="bold">PaaS?</text>

  <!-- Yes -> Beanstalk -->
  <line x1="790" y1="529.375" x2="911.875" y2="529.375" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="846.25" y="522.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Yes</text>

  <rect x="916.5625" y="497.6562" width="206.25" height="63.4375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1019.6875" y="524.8438" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Elastic Beanstalk</text>
  <text x="1019.6875" y="545.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Managed platform</text>

  <!-- No -> EC2 -->
  <line x1="490" y1="529.375" x2="368.125" y2="529.375" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="433.75" y="522.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)" font-weight="bold">No</text>

  <rect x="152.5" y="497.6562" width="215.625" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260.3125" y="524.8438" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">EC2</text>
  <text x="260.3125" y="545.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Full control, any workload</text>

  <!-- Side annotations -->
  <rect x="77.5" y="85.3125" width="187.5" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="171.25" y="107.9688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle" font-weight="bold">Decision Criteria</text>
  <text x="86.875" y="126.0938" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Start serverless-first,</text>
  <text x="86.875" y="139.6875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">add complexity only as needed</text>

  <!-- Fargate note -->
  <rect x="916.5625" y="425.1562" width="206.25" height="22.6562" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1019.6875" y="440.5625" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">+ Fargate for serverless containers</text>

  <!-- Lambda note -->
  <rect x="916.5625" y="257.5" width="206.25" height="22.6562" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1019.6875" y="272.9062" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">15 min max, 10 GB RAM limit</text>

  <!-- Management spectrum arrow -->
  <text x="115" y="320.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle" transform="rotate(-90,80,400)">Less management ← → More control</text>
</svg>
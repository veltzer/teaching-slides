<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="436.610169491525" y="40" width="406.779661016949" height="154.666666666667" rx="8.479572377175" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="78.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.198930942939" font-weight="bold" fill="var(--primary-text)">EC2 Instance</text>
  <text x="640" y="111.809523809524" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" fill="var(--primary-text)">Two storage options</text>
  <rect x="467.118644067797" y="133.904761904762" width="101.694915254237" height="44.190476190476" rx="5.299732735735" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="517.966101694915" y="161.523809523809" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--primary-text)">vCPUs</text>
  <rect x="589.152542372881" y="133.904761904762" width="101.694915254237" height="44.190476190476" rx="5.299732735735" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="640" y="161.523809523809" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--primary-text)">RAM</text>
  <rect x="711.186440677966" y="133.904761904762" width="101.694915254237" height="44.190476190476" rx="5.299732735735" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="762.033898305085" y="161.523809523809" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--primary-text)">NIC</text>

  <line x1="538.305084745763" y1="194.666666666667" x2="253.559322033898" y2="260.952380952381" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="741.694915254237" y1="194.666666666667" x2="1026.440677966101" y2="260.952380952381" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="266.476190476191" width="427.118644067797" height="353.523809523809" rx="8.479572377175" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.559322033898" y="310.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.198930942939" font-weight="bold" fill="var(--warn-text)">Instance Store</text>
  <text x="253.559322033898" y="343.809523809524" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" fill="var(--warn-text)">Local NVMe on host</text>

  <rect x="60.338983050847" y="365.904761904762" width="386.440677966102" height="44.190476190476" rx="5.299732735735" fill="var(--warn-accent)" stroke="var(--warn-border)"/>
  <text x="253.559322033898" y="393.52380952381" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" font-weight="bold" fill="var(--warn-text)">Ephemeral — lost on stop</text>

  <text x="70.508474576271" y="443.238095238095" font-family="Arial, sans-serif" font-size="14.839251660057" fill="var(--warn-text)">Extremely fast NVMe</text>
  <text x="70.508474576271" y="476.380952380953" font-family="Arial, sans-serif" font-size="14.839251660057" fill="var(--warn-text)">Included in price</text>
  <text x="70.508474576271" y="509.52380952381" font-family="Arial, sans-serif" font-size="14.839251660057" fill="var(--warn-text)">No snapshots</text>
  <text x="70.508474576271" y="559.238095238095" font-family="Arial, sans-serif" font-size="13.77930511291" font-weight="bold" fill="var(--warn-text)">Use: caches, temp, scratch</text>
  <text x="70.508474576271" y="592.380952380953" font-family="Arial, sans-serif" font-size="13.77930511291" font-weight="bold" fill="var(--warn-text)">Not for: kept data</text>

  <rect x="812.881355932203" y="266.476190476191" width="427.118644067797" height="353.523809523809" rx="8.479572377175" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1026.440677966101" y="310.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.198930942939" font-weight="bold" fill="var(--primary-text)">EBS</text>
  <text x="1026.440677966101" y="343.809523809524" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" fill="var(--primary-text)">Network-attached</text>

  <rect x="833.220338983051" y="365.904761904762" width="386.440677966102" height="44.190476190476" rx="5.299732735735" fill="var(--primary-accent)" stroke="var(--primary-border)"/>
  <text x="1026.440677966101" y="393.52380952381" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" font-weight="bold" fill="var(--primary-text)">Persistent</text>

  <text x="843.389830508475" y="443.238095238095" font-family="Arial, sans-serif" font-size="14.839251660057" fill="var(--primary-text)">gp3: 3K-16K IOPS</text>
  <text x="843.389830508475" y="476.380952380953" font-family="Arial, sans-serif" font-size="14.839251660057" fill="var(--primary-text)">Snapshots to S3</text>
  <text x="843.389830508475" y="509.52380952381" font-family="Arial, sans-serif" font-size="14.839251660057" fill="var(--primary-text)">Detach + reattach</text>
  <text x="843.389830508475" y="559.238095238095" font-family="Arial, sans-serif" font-size="13.77930511291" font-weight="bold" fill="var(--primary-text)">Use: boot, DBs, app data</text>
  <text x="843.389830508475" y="592.380952380953" font-family="Arial, sans-serif" font-size="13.77930511291" font-weight="bold" fill="var(--primary-text)">~$0.08/GB-month (gp3)</text>
</svg>

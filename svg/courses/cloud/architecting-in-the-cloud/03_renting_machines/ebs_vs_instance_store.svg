<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- EC2 Instance (center) -->
  <rect x="452.5" y="76.25" width="375" height="163.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="107.9688" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">EC2 Instance</text>
  <text x="640" y="130.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">Running application with two storage options</text>

  <!-- CPU/RAM boxes inside instance -->
  <rect x="480.625" y="144.2188" width="103.125" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="532.1875" y="166.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle">vCPUs</text>
  <rect x="602.5" y="144.2188" width="103.125" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="654.0625" y="166.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle">RAM</text>
  <rect x="724.375" y="144.2188" width="84.375" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="766.5625" y="166.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle">NIC</text>

  <!-- Left: Instance Store -->
  <line x1="546.25" y1="239.375" x2="274.375" y2="302.8125" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="377.5" y="266.5625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" font-weight="bold">Local NVMe</text>

  <rect x="77.5" y="302.8125" width="393.75" height="299.0625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="274.375" y="330" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Instance Store (NVMe)</text>
  <text x="274.375" y="349.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Physically attached to host</text>

  <!-- Instance store properties -->
  <rect x="96.25" y="366.25" width="356.25" height="31.7188" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="274.375" y="387.0938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Ephemeral - Data lost on stop/terminate</text>

  <text x="105.625" y="420.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Speed: Extremely fast (local NVMe)</text>
  <text x="105.625" y="443.2812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">IOPS: Up to 3.3M random read</text>
  <text x="105.625" y="465.9375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Cost: Included in instance price</text>
  <text x="105.625" y="488.5938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Persistence: None (ephemeral)</text>
  <text x="105.625" y="511.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Snapshots: Not supported</text>

  <text x="105.625" y="542.9688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" font-weight="bold">Use for: caches, temp files, scratch data</text>
  <text x="105.625" y="561.0938" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" font-weight="bold">Not for: anything you need to keep!</text>

  <!-- Right: EBS -->
  <line x1="733.75" y1="239.375" x2="1005.625" y2="302.8125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="902.5" y="266.5625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" font-weight="bold">Network (EBS)</text>

  <rect x="808.75" y="302.8125" width="393.75" height="299.0625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1005.625" y="330" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">EBS (Elastic Block Store)</text>
  <text x="1005.625" y="349.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Network-attached storage</text>

  <rect x="827.5" y="366.25" width="356.25" height="31.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1005.625" y="387.0938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Persistent - Survives stop/terminate</text>

  <text x="836.875" y="420.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Speed: Fast (gp3: 3K-16K IOPS)</text>
  <text x="836.875" y="443.2812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">IOPS: Up to 256K (io2 Block Express)</text>
  <text x="836.875" y="465.9375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Cost: $0.08/GB-month (gp3)</text>
  <text x="836.875" y="488.5938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Persistence: Independent lifecycle</text>
  <text x="836.875" y="511.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Snapshots: To S3 (incremental)</text>

  <text x="836.875" y="542.9688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" font-weight="bold">Use for: boot volumes, databases, app data</text>
  <text x="836.875" y="561.0938" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" font-weight="bold">Can detach and attach to another instance</text>

  <!-- S3 snapshot arrow -->
  <rect x="1071.25" y="194.0625" width="131.25" height="49.8438" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.875" y="216.7188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">S3</text>
  <text x="1136.875" y="232.125" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Snapshots stored</text>
  <line x1="1136.875" y1="243.9062" x2="1136.875" y2="301" stroke="var(--ok-border)" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="1150.9375" y="275.625" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Snapshot</text>
</svg>
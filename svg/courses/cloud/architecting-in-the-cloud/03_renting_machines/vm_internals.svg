<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Physical Host -->
  <rect x="77.5" y="67.1875" width="1125" height="534.6875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="94.375" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--text)" text-anchor="middle" font-weight="bold">Physical Host Server</text>

  <!-- Hardware layer -->
  <rect x="96.25" y="520.3125" width="1087.5" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="542.9688" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--text)" text-anchor="middle" font-weight="bold">Physical Hardware</text>

  <!-- CPU slices -->
  <rect x="115" y="556.5625" width="131.25" height="18.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180.625" y="569.25" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">96 CPU Cores</text>

  <!-- RAM slices -->
  <rect x="265" y="556.5625" width="131.25" height="18.125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="330.625" y="569.25" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">768 GB RAM</text>

  <!-- Network -->
  <rect x="415" y="556.5625" width="131.25" height="18.125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="480.625" y="569.25" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">100 Gbps NIC</text>

  <!-- Storage -->
  <rect x="565" y="556.5625" width="131.25" height="18.125" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="630.625" y="569.25" font-family="Arial, sans-serif" font-size="10" fill="var(--info-accent)" text-anchor="middle">NVMe SSDs</text>

  <!-- Hypervisor layer -->
  <rect x="96.25" y="456.875" width="1087.5" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="488.5938" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Hypervisor (e.g., Nitro / KVM / Xen)</text>
  <text x="640" y="504" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Manages resource allocation, isolation, and scheduling</text>

  <!-- VM 1 (ok) -->
  <rect x="115" y="117.0312" width="318.75" height="326.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="274.375" y="141.5" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">VM 1 (m5.xlarge)</text>

  <rect x="133.75" y="153.2812" width="281.25" height="40.7812" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="274.375" y="174.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Application: Web Server</text>
  <text x="274.375" y="187.7188" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">nginx + Node.js</text>

  <rect x="133.75" y="203.125" width="281.25" height="31.7188" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="274.375" y="223.9688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">Guest OS: Ubuntu 22.04</text>

  <!-- CPU/RAM allocation for VM1 -->
  <rect x="133.75" y="248.4375" width="131.25" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="199.375" y="268.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">4 vCPUs</text>
  <text x="199.375" y="284.6875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Allocated cores</text>

  <rect x="283.75" y="248.4375" width="131.25" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="349.375" y="268.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">16 GB RAM</text>
  <text x="349.375" y="284.6875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Allocated memory</text>

  <!-- VM 2 (warn) -->
  <rect x="480.625" y="117.0312" width="318.75" height="326.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="141.5" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">VM 2 (r5.2xlarge)</text>

  <rect x="499.375" y="153.2812" width="281.25" height="40.7812" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="174.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Application: Database</text>
  <text x="640" y="187.7188" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">PostgreSQL</text>

  <rect x="499.375" y="203.125" width="281.25" height="31.7188" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="223.9688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">Guest OS: Amazon Linux 2</text>

  <rect x="499.375" y="248.4375" width="131.25" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="565" y="268.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">8 vCPUs</text>
  <text x="565" y="284.6875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Allocated cores</text>

  <rect x="649.375" y="248.4375" width="131.25" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="715" y="268.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">64 GB RAM</text>
  <text x="715" y="284.6875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Allocated memory</text>

  <!-- VM 3 (info) -->
  <rect x="846.25" y="117.0312" width="318.75" height="326.25" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1005.625" y="141.5" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">VM 3 (c5.xlarge)</text>

  <rect x="865" y="153.2812" width="281.25" height="40.7812" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1005.625" y="174.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Application: ML Worker</text>
  <text x="1005.625" y="187.7188" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">TensorFlow batch jobs</text>

  <rect x="865" y="203.125" width="281.25" height="31.7188" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1005.625" y="223.9688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">Guest OS: CentOS 9</text>

  <rect x="865" y="248.4375" width="131.25" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="930.625" y="268.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">4 vCPUs</text>
  <text x="930.625" y="284.6875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Allocated cores</text>

  <rect x="1015" y="248.4375" width="131.25" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1080.625" y="268.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">8 GB RAM</text>
  <text x="1080.625" y="284.6875" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Allocated memory</text>

  <!-- Isolation note -->
  <text x="274.375" y="420.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">Fully isolated</text>
  <text x="640" y="420.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">Fully isolated</text>
  <text x="1005.625" y="420.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">Fully isolated</text>

  <!-- Arrows from VMs to Hypervisor -->
  <line x1="274.375" y1="443.2812" x2="274.375" y2="455.0625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="443.2812" x2="640" y2="455.0625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1005.625" y1="443.2812" x2="1005.625" y2="455.0625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Physical Host -->

  <!-- Hardware layer -->
  <rect x="40" y="541.165057408426" width="1200" height="78.834942591574" rx="7.02608764527" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="569.320455830515" font-family="Arial, sans-serif" font-size="16.190566546854" fill="var(--text)" text-anchor="middle" font-weight="bold">Physical Hardware</text>

  <!-- CPU slices -->
  <rect x="60.689655172414" y="586.213596359505" width="144.827586206897" height="22.52426947554" rx="7.02608764527" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="601.980583961316" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--primary-accent)" text-anchor="middle">96 CPU Cores</text>

  <!-- RAM slices -->
  <rect x="226.206896551724" y="586.213596359505" width="144.827586206897" height="22.52426947554" rx="7.02608764527" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="298.620689655172" y="601.980583961316" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--ok-accent)" text-anchor="middle">768 GB RAM</text>

  <!-- Network -->
  <rect x="391.724137931034" y="586.213596359505" width="144.827586206897" height="22.52426947554" rx="7.02608764527" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.137931034483" y="601.980583961316" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--warn-accent)" text-anchor="middle">100 Gbps NIC</text>

  <!-- Storage -->
  <rect x="557.241379310345" y="586.213596359505" width="144.827586206897" height="22.52426947554" rx="7.02608764527" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.655172413793" y="601.980583961316" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--info-accent)" text-anchor="middle">NVMe SSDs</text>

  <!-- Hypervisor layer -->
  <rect x="40" y="462.330113671221" width="1200" height="67.57280842662" rx="7.02608764527" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="501.747647403894" font-family="Arial, sans-serif" font-size="17.270007903498" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Hypervisor (e.g., Nitro / KVM / Xen)</text>
  <text x="640" y="520.893214078498" font-family="Arial, sans-serif" font-size="11.873151662121" fill="var(--text-muted)" text-anchor="middle">Manages resource allocation, isolation, and scheduling</text>

  <!-- VM 1 (ok) -->
  <rect x="60.689655172414" y="40" width="351.724137931035" height="405.436849414087" rx="7.02608764527" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="70.407825713331" font-family="Arial, sans-serif" font-size="16.190566546854" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">VM 1 (m5.xlarge)</text>

  <rect x="81.379310344828" y="85.04853895108" width="310.344827586207" height="50.679544169486" rx="7.02608764527" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="110.951511227555" font-family="Arial, sans-serif" font-size="14.031917891008" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Application: Web Server</text>
  <text x="236.551724137931" y="127.844775484689" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--text-muted)" text-anchor="middle">nginx + Node.js</text>

  <rect x="81.379310344828" y="146.990342159293" width="310.344827586207" height="39.417533732674" rx="7.02608764527" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="236.551724137931" y="172.893314435769" font-family="Arial, sans-serif" font-size="12.952476534364" fill="var(--text)" text-anchor="middle">Guest OS: Ubuntu 22.04</text>

  <!-- CPU/RAM allocation for VM1 -->
  <rect x="81.379310344828" y="203.301015275328" width="144.827586206897" height="56.310673116034" rx="7.02608764527" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.793103448276" y="228.07771204211" font-family="Arial, sans-serif" font-size="12.952476534364" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">4 vCPUs</text>
  <text x="153.793103448276" y="248.349554226407" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--text-muted)" text-anchor="middle">Allocated cores</text>

  <rect x="246.896551724138" y="203.301015275328" width="144.827586206897" height="56.310673116034" rx="7.02608764527" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="319.310344827586" y="228.07771204211" font-family="Arial, sans-serif" font-size="12.952476534364" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">16 GB RAM</text>
  <text x="319.310344827586" y="248.349554226407" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--text-muted)" text-anchor="middle">Allocated memory</text>

  <!-- VM 2 (warn) -->
  <rect x="464.137931034483" y="40" width="351.724137931035" height="405.436849414087" rx="7.02608764527" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="70.407825713331" font-family="Arial, sans-serif" font-size="16.190566546854" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">VM 2 (r5.2xlarge)</text>

  <rect x="484.827586206897" y="85.04853895108" width="310.344827586207" height="50.679544169486" rx="7.02608764527" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="110.951511227555" font-family="Arial, sans-serif" font-size="14.031917891008" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Application: Database</text>
  <text x="640" y="127.844775484689" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--text-muted)" text-anchor="middle">PostgreSQL</text>

  <rect x="484.827586206897" y="146.990342159293" width="310.344827586207" height="39.417533732674" rx="7.02608764527" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="172.893314435769" font-family="Arial, sans-serif" font-size="12.952476534364" fill="var(--text)" text-anchor="middle">Guest OS: Amazon Linux 2</text>

  <rect x="484.827586206897" y="203.301015275328" width="144.827586206897" height="56.310673116034" rx="7.02608764527" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="557.241379310345" y="228.07771204211" font-family="Arial, sans-serif" font-size="12.952476534364" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">8 vCPUs</text>
  <text x="557.241379310345" y="248.349554226407" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--text-muted)" text-anchor="middle">Allocated cores</text>

  <rect x="650.344827586207" y="203.301015275328" width="144.827586206897" height="56.310673116034" rx="7.02608764527" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="722.758620689655" y="228.07771204211" font-family="Arial, sans-serif" font-size="12.952476534364" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">64 GB RAM</text>
  <text x="722.758620689655" y="248.349554226407" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--text-muted)" text-anchor="middle">Allocated memory</text>

  <!-- VM 3 (info) -->
  <rect x="867.586206896552" y="40" width="351.724137931035" height="405.436849414087" rx="7.02608764527" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448275862069" y="70.407825713331" font-family="Arial, sans-serif" font-size="16.190566546854" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">VM 3 (c5.xlarge)</text>

  <rect x="888.275862068966" y="85.04853895108" width="310.344827586207" height="50.679544169486" rx="7.02608764527" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448275862069" y="110.951511227555" font-family="Arial, sans-serif" font-size="14.031917891008" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Application: ML Worker</text>
  <text x="1043.448275862069" y="127.844775484689" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--text-muted)" text-anchor="middle">TensorFlow batch jobs</text>

  <rect x="888.275862068966" y="146.990342159293" width="310.344827586207" height="39.417533732674" rx="7.02608764527" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1043.448275862069" y="172.893314435769" font-family="Arial, sans-serif" font-size="12.952476534364" fill="var(--text)" text-anchor="middle">Guest OS: CentOS 9</text>

  <rect x="888.275862068966" y="203.301015275328" width="144.827586206897" height="56.310673116034" rx="7.02608764527" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960.689655172414" y="228.07771204211" font-family="Arial, sans-serif" font-size="12.952476534364" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">4 vCPUs</text>
  <text x="960.689655172414" y="248.349554226407" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--text-muted)" text-anchor="middle">Allocated cores</text>

  <rect x="1053.793103448276" y="203.301015275328" width="144.827586206897" height="56.310673116034" rx="7.02608764527" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.206896551724" y="228.07771204211" font-family="Arial, sans-serif" font-size="12.952476534364" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">8 GB RAM</text>
  <text x="1126.206896551724" y="248.349554226407" font-family="Arial, sans-serif" font-size="11.710146438331" fill="var(--text-muted)" text-anchor="middle">Allocated memory</text>

  <!-- Isolation note -->
  <text x="236.551724137931" y="417.281575865772" font-family="Arial, sans-serif" font-size="11.873151662121" fill="var(--text-faint)" text-anchor="middle">Fully isolated</text>
  <text x="640" y="417.281575865772" font-family="Arial, sans-serif" font-size="11.873151662121" fill="var(--text-faint)" text-anchor="middle">Fully isolated</text>
  <text x="1043.448275862069" y="417.281575865772" font-family="Arial, sans-serif" font-size="11.873151662121" fill="var(--text-faint)" text-anchor="middle">Fully isolated</text>

  <!-- Arrows from VMs to Hypervisor -->
  <line x1="236.551724137931" y1="445.436849414087" x2="236.551724137931" y2="460.077687525608" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="445.436849414087" x2="640" y2="460.077687525608" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1043.448275862069" y1="445.436849414087" x2="1043.448275862069" y2="460.077687525608" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

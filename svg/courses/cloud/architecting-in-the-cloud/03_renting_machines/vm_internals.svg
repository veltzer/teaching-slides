<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Physical Host -->
  <rect x="40" y="40" width="1200" height="580" rx="6.454009" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="69.491525" font-family="Arial, sans-serif" font-size="19.829836" fill="var(--text)" text-anchor="middle" font-weight="bold">Physical Host Server</text>

  <!-- Hardware layer -->
  <rect x="60" y="531.525424" width="1160" height="68.813559" rx="6.454009" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="556.101749" font-family="Arial, sans-serif" font-size="14.872297" fill="var(--text)" text-anchor="middle" font-weight="bold">Physical Hardware</text>

  <!-- CPU slices -->
  <rect x="80" y="570.847458" width="140" height="19.661017" rx="6.454009" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="584.610169" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--primary-accent)" text-anchor="middle">96 CPU Cores</text>

  <!-- RAM slices -->
  <rect x="240" y="570.847458" width="140" height="19.661017" rx="6.454009" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="584.610169" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--ok-accent)" text-anchor="middle">768 GB RAM</text>

  <!-- Network -->
  <rect x="400" y="570.847458" width="140" height="19.661017" rx="6.454009" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="584.610169" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--warn-accent)" text-anchor="middle">100 Gbps NIC</text>

  <!-- Storage -->
  <rect x="560" y="570.847458" width="140" height="19.661017" rx="6.454009" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="584.610169" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--info-accent)" text-anchor="middle">NVMe SSDs</text>

  <!-- Hypervisor layer -->
  <rect x="60" y="462.711864" width="1160" height="58.983051" rx="6.454009" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="497.118698" font-family="Arial, sans-serif" font-size="15.863848" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Hypervisor (e.g., Nitro / KVM / Xen)</text>
  <text x="640" y="513.830508" font-family="Arial, sans-serif" font-size="10.906415" fill="var(--text-muted)" text-anchor="middle">Manages resource allocation, isolation, and scheduling</text>

  <!-- VM 1 (ok) -->
  <rect x="80" y="94.067742" width="340" height="353.898305" rx="6.454009" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="120.610169" font-family="Arial, sans-serif" font-size="14.872297" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">VM 1 (m5.xlarge)</text>

  <rect x="100" y="133.389776" width="300" height="44.237234" rx="6.454009" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="156" font-family="Arial, sans-serif" font-size="12.88941" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Application: Web Server</text>
  <text x="250" y="170.745817" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--text-muted)" text-anchor="middle">nginx + Node.js</text>

  <rect x="100" y="187.457627" width="300" height="34.406834" rx="6.454009" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="250" y="210.067851" font-family="Arial, sans-serif" font-size="11.897859" fill="var(--text)" text-anchor="middle">Guest OS: Ubuntu 22.04</text>

  <!-- CPU/RAM allocation for VM1 -->
  <rect x="100" y="236.610169" width="140" height="49.152542" rx="6.454009" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="258.237288" font-family="Arial, sans-serif" font-size="11.897859" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">4 vCPUs</text>
  <text x="170" y="275.932203" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--text-muted)" text-anchor="middle">Allocated cores</text>

  <rect x="260" y="236.610169" width="140" height="49.152542" rx="6.454009" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="258.237288" font-family="Arial, sans-serif" font-size="11.897859" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">16 GB RAM</text>
  <text x="330" y="275.932203" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--text-muted)" text-anchor="middle">Allocated memory</text>

  <!-- VM 2 (warn) -->
  <rect x="470" y="94.067742" width="340" height="353.898305" rx="6.454009" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="120.610169" font-family="Arial, sans-serif" font-size="14.872297" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">VM 2 (r5.2xlarge)</text>

  <rect x="490" y="133.389776" width="300" height="44.237234" rx="6.454009" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="156" font-family="Arial, sans-serif" font-size="12.88941" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Application: Database</text>
  <text x="640" y="170.745817" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--text-muted)" text-anchor="middle">PostgreSQL</text>

  <rect x="490" y="187.457627" width="300" height="34.406834" rx="6.454009" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="210.067851" font-family="Arial, sans-serif" font-size="11.897859" fill="var(--text)" text-anchor="middle">Guest OS: Amazon Linux 2</text>

  <rect x="490" y="236.610169" width="140" height="49.152542" rx="6.454009" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="258.237288" font-family="Arial, sans-serif" font-size="11.897859" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">8 vCPUs</text>
  <text x="560" y="275.932203" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--text-muted)" text-anchor="middle">Allocated cores</text>

  <rect x="650" y="236.610169" width="140" height="49.152542" rx="6.454009" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="258.237288" font-family="Arial, sans-serif" font-size="11.897859" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">64 GB RAM</text>
  <text x="720" y="275.932203" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--text-muted)" text-anchor="middle">Allocated memory</text>

  <!-- VM 3 (info) -->
  <rect x="860" y="94.067742" width="340" height="353.898305" rx="6.454009" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="120.610169" font-family="Arial, sans-serif" font-size="14.872297" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">VM 3 (c5.xlarge)</text>

  <rect x="880" y="133.389776" width="300" height="44.237234" rx="6.454009" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="156" font-family="Arial, sans-serif" font-size="12.88941" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Application: ML Worker</text>
  <text x="1030" y="170.745817" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--text-muted)" text-anchor="middle">TensorFlow batch jobs</text>

  <rect x="880" y="187.457627" width="300" height="34.406834" rx="6.454009" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1030" y="210.067851" font-family="Arial, sans-serif" font-size="11.897859" fill="var(--text)" text-anchor="middle">Guest OS: CentOS 9</text>

  <rect x="880" y="236.610169" width="140" height="49.152542" rx="6.454009" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="258.237288" font-family="Arial, sans-serif" font-size="11.897859" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">4 vCPUs</text>
  <text x="950" y="275.932203" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--text-muted)" text-anchor="middle">Allocated cores</text>

  <rect x="1040" y="236.610169" width="140" height="49.152542" rx="6.454009" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="258.237288" font-family="Arial, sans-serif" font-size="11.897859" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">8 GB RAM</text>
  <text x="1110" y="275.932203" font-family="Arial, sans-serif" font-size="10.756682" fill="var(--text-muted)" text-anchor="middle">Allocated memory</text>

  <!-- Isolation note -->
  <text x="250" y="423.389831" font-family="Arial, sans-serif" font-size="10.906415" fill="var(--text-faint)" text-anchor="middle">Fully isolated</text>
  <text x="640" y="423.389831" font-family="Arial, sans-serif" font-size="10.906415" fill="var(--text-faint)" text-anchor="middle">Fully isolated</text>
  <text x="1030" y="423.389831" font-family="Arial, sans-serif" font-size="10.906415" fill="var(--text-faint)" text-anchor="middle">Fully isolated</text>

  <!-- Arrows from VMs to Hypervisor -->
  <line x1="250" y1="447.966047" x2="250" y2="460.745763" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="447.966047" x2="640" y2="460.745763" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1030" y1="447.966047" x2="1030" y2="460.745763" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
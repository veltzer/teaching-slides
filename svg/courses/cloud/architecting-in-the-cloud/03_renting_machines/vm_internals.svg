<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Physical Host -->
  <text x="640" y="40" font-family="Arial, sans-serif" font-size="21.081906196363" fill="var(--text)" text-anchor="middle" font-weight="bold">Physical Host Server</text>

  <!-- Hardware layer -->
  <rect x="40" y="544.814815219479" width="1200" height="75.185184780521" rx="6.861519799179" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="571.666725848766" font-family="Arial, sans-serif" font-size="15.811344596014" fill="var(--text)" text-anchor="middle" font-weight="bold">Physical Hardware</text>

  <!-- CPU slices -->
  <rect x="60.689655172414" y="587.777778263374" width="144.827586206897" height="21.481481521948" rx="6.861519799179" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="602.814814345405" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--primary-accent)" text-anchor="middle">96 CPU Cores</text>

  <!-- RAM slices -->
  <rect x="226.206896551724" y="587.777778263374" width="144.827586206897" height="21.481481521948" rx="6.861519799179" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="298.620689655172" y="602.814814345405" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--ok-accent)" text-anchor="middle">768 GB RAM</text>

  <!-- Network -->
  <rect x="391.724137931034" y="587.777778263374" width="144.827586206897" height="21.481481521948" rx="6.861519799179" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.137931034483" y="602.814814345405" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--warn-accent)" text-anchor="middle">100 Gbps NIC</text>

  <!-- Storage -->
  <rect x="557.241379310345" y="587.777778263374" width="144.827586206897" height="21.481481521948" rx="6.861519799179" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.655172413793" y="602.814814345405" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--info-accent)" text-anchor="middle">NVMe SSDs</text>

  <!-- Hypervisor layer -->
  <rect x="40" y="469.629629346365" width="1200" height="64.444444565844" rx="6.861519799179" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="507.222281282922" font-family="Arial, sans-serif" font-size="16.865502843763" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Hypervisor (e.g., Nitro / KVM / Xen)</text>
  <text x="640" y="525.481481084911" font-family="Arial, sans-serif" font-size="11.595053936331" fill="var(--text-muted)" text-anchor="middle">Manages resource allocation, isolation, and scheduling</text>

  <!-- VM 1 (ok) -->
  <rect x="60.689655172414" y="66.851792629287" width="351.724137931035" height="386.666666302469" rx="6.861519799179" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="95.851851738546" font-family="Arial, sans-serif" font-size="15.811344596014" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">VM 1 (m5.xlarge)</text>

  <rect x="81.379310344828" y="109.814755673183" width="310.344827586207" height="48.333274151235" rx="6.861519799179" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="134.518518915089" font-family="Arial, sans-serif" font-size="13.703256675772" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Application: Web Server</text>
  <text x="236.551724137931" y="150.629689329698" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--text-muted)" text-anchor="middle">nginx + Node.js</text>

  <rect x="81.379310344828" y="168.888889131687" width="310.344827586207" height="37.592651936557" rx="6.861519799179" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="236.551724137931" y="193.592652373594" font-family="Arial, sans-serif" font-size="12.649098428023" fill="var(--text)" text-anchor="middle">Guest OS: Ubuntu 22.04</text>

  <!-- CPU/RAM allocation for VM1 -->
  <rect x="81.379310344828" y="222.592592390261" width="144.827586206897" height="53.703703258573" rx="6.861519799179" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.793103448276" y="246.222222392181" font-family="Arial, sans-serif" font-size="12.649098428023" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">4 vCPUs</text>
  <text x="153.793103448276" y="265.555555434156" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--text-muted)" text-anchor="middle">Allocated cores</text>

  <rect x="246.896551724138" y="222.592592390261" width="144.827586206897" height="53.703703258573" rx="6.861519799179" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="319.310344827586" y="246.222222392181" font-family="Arial, sans-serif" font-size="12.649098428023" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">16 GB RAM</text>
  <text x="319.310344827586" y="265.555555434156" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--text-muted)" text-anchor="middle">Allocated memory</text>

  <!-- VM 2 (warn) -->
  <rect x="464.137931034483" y="66.851792629287" width="351.724137931035" height="386.666666302469" rx="6.861519799179" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="95.851851738546" font-family="Arial, sans-serif" font-size="15.811344596014" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">VM 2 (r5.2xlarge)</text>

  <rect x="484.827586206897" y="109.814755673183" width="310.344827586207" height="48.333274151235" rx="6.861519799179" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="134.518518915089" font-family="Arial, sans-serif" font-size="13.703256675772" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Application: Database</text>
  <text x="640" y="150.629689329698" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--text-muted)" text-anchor="middle">PostgreSQL</text>

  <rect x="484.827586206897" y="168.888889131687" width="310.344827586207" height="37.592651936557" rx="6.861519799179" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="193.592652373594" font-family="Arial, sans-serif" font-size="12.649098428023" fill="var(--text)" text-anchor="middle">Guest OS: Amazon Linux 2</text>

  <rect x="484.827586206897" y="222.592592390261" width="144.827586206897" height="53.703703258573" rx="6.861519799179" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="557.241379310345" y="246.222222392181" font-family="Arial, sans-serif" font-size="12.649098428023" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">8 vCPUs</text>
  <text x="557.241379310345" y="265.555555434156" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--text-muted)" text-anchor="middle">Allocated cores</text>

  <rect x="650.344827586207" y="222.592592390261" width="144.827586206897" height="53.703703258573" rx="6.861519799179" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="722.758620689655" y="246.222222392181" font-family="Arial, sans-serif" font-size="12.649098428023" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">64 GB RAM</text>
  <text x="722.758620689655" y="265.555555434156" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--text-muted)" text-anchor="middle">Allocated memory</text>

  <!-- VM 3 (info) -->
  <rect x="867.586206896552" y="66.851792629287" width="351.724137931035" height="386.666666302469" rx="6.861519799179" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448275862069" y="95.851851738546" font-family="Arial, sans-serif" font-size="15.811344596014" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">VM 3 (c5.xlarge)</text>

  <rect x="888.275862068966" y="109.814755673183" width="310.344827586207" height="48.333274151235" rx="6.861519799179" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448275862069" y="134.518518915089" font-family="Arial, sans-serif" font-size="13.703256675772" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Application: ML Worker</text>
  <text x="1043.448275862069" y="150.629689329698" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--text-muted)" text-anchor="middle">TensorFlow batch jobs</text>

  <rect x="888.275862068966" y="168.888889131687" width="310.344827586207" height="37.592651936557" rx="6.861519799179" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1043.448275862069" y="193.592652373594" font-family="Arial, sans-serif" font-size="12.649098428023" fill="var(--text)" text-anchor="middle">Guest OS: CentOS 9</text>

  <rect x="888.275862068966" y="222.592592390261" width="144.827586206897" height="53.703703258573" rx="6.861519799179" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960.689655172414" y="246.222222392181" font-family="Arial, sans-serif" font-size="12.649098428023" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">4 vCPUs</text>
  <text x="960.689655172414" y="265.555555434156" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--text-muted)" text-anchor="middle">Allocated cores</text>

  <rect x="1053.793103448276" y="222.592592390261" width="144.827586206897" height="53.703703258573" rx="6.861519799179" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.206896551724" y="246.222222392181" font-family="Arial, sans-serif" font-size="12.649098428023" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">8 GB RAM</text>
  <text x="1126.206896551724" y="265.555555434156" font-family="Arial, sans-serif" font-size="11.435866686346" fill="var(--text-muted)" text-anchor="middle">Allocated memory</text>

  <!-- Isolation note -->
  <text x="236.551724137931" y="426.666667395062" font-family="Arial, sans-serif" font-size="11.595053936331" fill="var(--text-faint)" text-anchor="middle">Fully isolated</text>
  <text x="640" y="426.666667395062" font-family="Arial, sans-serif" font-size="11.595053936331" fill="var(--text-faint)" text-anchor="middle">Fully isolated</text>
  <text x="1043.448275862069" y="426.666667395062" font-family="Arial, sans-serif" font-size="11.595053936331" fill="var(--text-faint)" text-anchor="middle">Fully isolated</text>

  <!-- Arrows from VMs to Hypervisor -->
  <line x1="236.551724137931" y1="453.518458931756" x2="236.551724137931" y2="467.481481958985" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="453.518458931756" x2="640" y2="467.481481958985" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1043.448275862069" y1="453.518458931756" x2="1043.448275862069" y2="467.481481958985" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

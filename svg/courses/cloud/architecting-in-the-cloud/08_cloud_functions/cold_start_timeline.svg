<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Cold Start Label -->
  <text x="40" y="40" font-family="Arial, sans-serif" font-size="24.717029" font-weight="bold" fill="var(--text)">Cold Start</text>
  <text x="40" y="71.182731" font-family="Arial, sans-serif" font-size="17.30188" fill="var(--text-faint)">~500ms total</text>
  <!-- Cold start timeline bar -->
  <rect x="40" y="114.838719" width="269.387755" height="87.311838" rx="8.044642" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="174.693878" y="154.752702" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.066089" font-weight="bold" fill="var(--text)">Download Code</text>
  <text x="174.693878" y="179.698941" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.830164" fill="var(--text-muted)">~150ms</text>
  <rect x="309.387755" y="114.838719" width="269.387755" height="87.311838" rx="8.044642" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="444.081633" y="154.752702" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.066089" font-weight="bold" fill="var(--text)">Init Runtime</text>
  <text x="444.081633" y="179.698941" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.830164" fill="var(--text-muted)">~150ms</text>
  <rect x="578.77551" y="114.838719" width="269.387755" height="87.311838" rx="8.044642" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="713.469388" y="154.752702" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.066089" font-weight="bold" fill="var(--text)">Init Handler</text>
  <text x="713.469388" y="179.698941" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.830164" fill="var(--text-muted)">~150ms</text>
  <rect x="848.163265" y="114.838719" width="220.408163" height="87.311838" rx="8.044642" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.367347" y="154.752702" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.066089" font-weight="bold" fill="var(--text)">Execute</text>
  <text x="958.367347" y="179.698941" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.830164" fill="var(--text-muted)">~50ms</text>
  <!-- Total cold start bracket -->
  <line x1="40" y1="227.096796" x2="40" y2="252.043036" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="40" y1="252.043036" x2="1068.571429" y2="252.043036" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="1068.571429" y1="227.096796" x2="1068.571429" y2="252.043036" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="554.285714" y="283.225904" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.773596" font-weight="bold" fill="var(--danger-accent)">~500ms Total Latency</text>
  <!-- Warm Start Label -->
  <text x="40" y="389.247353" font-family="Arial, sans-serif" font-size="24.717029" font-weight="bold" fill="var(--text)">Warm Start</text>
  <text x="40" y="420.430084" font-family="Arial, sans-serif" font-size="17.30188" fill="var(--text-faint)">~5ms total</text>
  <!-- Warm start: skipped phases -->
  <rect x="40" y="451.612952" width="808.163265" height="87.311838" rx="8.044642" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="444.081633" y="504.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.773596" fill="var(--text-faint)">Skipped (already initialized)</text>
  <rect x="848.163265" y="451.612952" width="220.408163" height="87.311838" rx="8.044642" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.367347" y="491.526935" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.066089" font-weight="bold" fill="var(--text)">Execute</text>
  <text x="958.367347" y="516.473175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.830164" fill="var(--text-muted)">~5ms</text>
  <!-- Total warm start bracket -->
  <line x1="848.163265" y1="563.87103" x2="848.163265" y2="588.817269" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="848.163265" y1="588.817269" x2="1068.571429" y2="588.817269" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="1068.571429" y1="563.87103" x2="1068.571429" y2="588.817269" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="958.367347" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.773596" font-weight="bold" fill="var(--ok-accent)">~5ms Total Latency</text>
  <!-- Speed comparison -->
  <text x="1240" y="283.225904" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.245313" font-weight="bold" fill="var(--ok-accent)">100x</text>
  <text x="1240" y="314.408635" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.30188" fill="var(--ok-accent)">faster</text>
</svg>
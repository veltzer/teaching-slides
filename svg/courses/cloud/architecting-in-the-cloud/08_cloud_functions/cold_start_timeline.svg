<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Cold Start Label -->
  <text x="133.75" y="130.625" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text)">Cold Start</text>
  <text x="133.75" y="153.2812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">~500ms total</text>
  <!-- Cold start timeline bar -->
  <rect x="133.75" y="185" width="206.25" height="63.4375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="236.875" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Download Code</text>
  <text x="236.875" y="232.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">~150ms</text>
  <rect x="340" y="185" width="206.25" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="443.125" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Init Runtime</text>
  <text x="443.125" y="232.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">~150ms</text>
  <rect x="546.25" y="185" width="206.25" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="649.375" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Init Handler</text>
  <text x="649.375" y="232.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">~150ms</text>
  <rect x="752.5" y="185" width="168.75" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="836.875" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Execute</text>
  <text x="836.875" y="232.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">~50ms</text>
  <!-- Total cold start bracket -->
  <line x1="133.75" y1="266.5625" x2="133.75" y2="284.6875" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="133.75" y1="284.6875" x2="921.25" y2="284.6875" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="921.25" y1="266.5625" x2="921.25" y2="284.6875" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="527.5" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)">~500ms Total Latency</text>
  <!-- Warm Start Label -->
  <text x="133.75" y="384.375" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text)">Warm Start</text>
  <text x="133.75" y="407.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)">~5ms total</text>
  <!-- Warm start: skipped phases -->
  <rect x="133.75" y="429.6875" width="618.75" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="443.125" y="467.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-faint)">Skipped (already initialized)</text>
  <rect x="752.5" y="429.6875" width="168.75" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="836.875" y="458.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Execute</text>
  <text x="836.875" y="476.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">~5ms</text>
  <!-- Total warm start bracket -->
  <line x1="752.5" y1="511.25" x2="752.5" y2="529.375" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="752.5" y1="529.375" x2="921.25" y2="529.375" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="921.25" y1="511.25" x2="921.25" y2="529.375" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="836.875" y="552.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">~5ms Total Latency</text>
  <!-- Speed comparison -->
  <text x="1052.5" y="307.3438" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--ok-accent)">100x</text>
  <text x="1052.5" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)">faster</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Center: Lambda Function -->
  <rect x="552.364" y="253.964" width="175.271" height="175.271" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="332.32" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.527144" font-weight="bold" fill="var(--text)">Lambda</text>
  <text x="640" y="357.84" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.336236" fill="var(--text-muted)">Function</text>
  <!-- API Gateway - top left -->
  <rect x="60.689655" y="40" width="165.517241" height="69.6" rx="7.130701" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448276" y="81.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.336236" font-weight="bold" fill="var(--text)">API Gateway</text>
  <line x1="226.206897" y1="92.199936" x2="565.517241" y2="306.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- S3 - top right -->
  <rect x="1053.793103" y="40" width="165.517241" height="69.6" rx="7.130701" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.551724" y="81.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.336236" font-weight="bold" fill="var(--text)">S3 Bucket</text>
  <line x1="1053.793103" y1="92.199936" x2="714.482759" y2="306.8" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- SQS - middle left -->
  <rect x="40" y="295.2" width="165.517241" height="69.6" rx="7.130701" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.758621" y="336.96" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.336236" font-weight="bold" fill="var(--text)">SQS Queue</text>
  <line x1="205.517241" y1="330" x2="555.172414" y2="339.28" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DynamoDB Streams - middle right -->
  <rect x="1074.482759" y="295.2" width="165.517241" height="69.6" rx="7.130701" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.241379" y="327.68" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.240842" font-weight="bold" fill="var(--text)">DynamoDB</text>
  <text x="1157.241379" y="348.56" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.240842" fill="var(--text-muted)">Streams</text>
  <line x1="1074.482759" y1="330" x2="724.827586" y2="339.28" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- EventBridge - bottom left -->
  <rect x="60.689655" y="550.4" width="165.517241" height="69.6" rx="7.130701" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448276" y="592.16" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.336236" font-weight="bold" fill="var(--text)">EventBridge</text>
  <line x1="226.206897" y1="567.800064" x2="565.517241" y2="376.4" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Schedule/Cron - bottom right -->
  <rect x="1053.793103" y="550.4" width="165.517241" height="69.6" rx="7.130701" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.551724" y="585.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.336236" font-weight="bold" fill="var(--text)">Schedule</text>
  <text x="1136.551724" y="606.08" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.145328" fill="var(--text-muted)">(Cron)</text>
  <line x1="1053.793103" y1="567.800064" x2="714.482759" y2="376.4" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
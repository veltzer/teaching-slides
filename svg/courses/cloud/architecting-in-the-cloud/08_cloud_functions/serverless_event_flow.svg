<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Center: Lambda Function -->
  <circle cx="640" cy="320" r="80" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Lambda</text>
  <text x="640" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Function</text>
  <!-- API Gateway - top left -->
  <rect x="80" y="60" width="160" height="60" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">API Gateway</text>
  <line x1="240" y1="105" x2="568" y2="290" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- S3 - top right -->
  <rect x="1040" y="60" width="160" height="60" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">S3 Bucket</text>
  <line x1="1040" y1="105" x2="712" y2="290" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- SQS - middle left -->
  <rect x="60" y="280" width="160" height="60" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">SQS Queue</text>
  <line x1="220" y1="310" x2="558" y2="318" stroke="var(--info)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DynamoDB Streams - middle right -->
  <rect x="1060" y="280" width="160" height="60" rx="8" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">DynamoDB</text>
  <text x="1140" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Streams</text>
  <line x1="1060" y1="310" x2="722" y2="318" stroke="var(--danger)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- EventBridge - bottom left -->
  <rect x="80" y="500" width="160" height="60" rx="8" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">EventBridge</text>
  <line x1="240" y1="515" x2="568" y2="350" stroke="var(--primary-dk)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Schedule/Cron - bottom right -->
  <rect x="1040" y="500" width="160" height="60" rx="8" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Schedule</text>
  <text x="1120" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">(Cron)</text>
  <line x1="1040" y1="515" x2="712" y2="350" stroke="var(--warn-dk)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
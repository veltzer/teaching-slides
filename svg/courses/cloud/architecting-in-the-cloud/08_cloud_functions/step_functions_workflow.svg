<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Start -->
  <circle cx="71.061935" cy="335.089971" r="31.061935" fill="var(--surface)" stroke="var(--border)" stroke-width="3"/>
  <text x="71.061935" y="341.197935" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.495562" font-weight="bold" fill="var(--text)">Start</text>
  <line x1="102.654856" y1="335.089971" x2="165.840697" y2="335.089971" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Process Order -->
  <rect x="176.371671" y="304.550147" width="157.964603" height="61.079647" rx="6.739823" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="255.353972" y="341.197935" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.495562" font-weight="bold" fill="var(--text)">Process Order</text>
  <line x1="334.336274" y1="335.089971" x2="397.522115" y2="335.089971" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Parallel split -->
  <rect x="408.053089" y="319.820115" width="31.592921" height="30.539823" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.739823"/>
  <text x="423.849549" y="340.179997" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.637183" fill="var(--text)">+</text>
  <!-- Send Email (top branch) -->
  <line x1="439.64601" y1="324.910029" x2="492.300877" y2="223.110618" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="502.831851" y="192.570795" width="168.495577" height="61.079647" rx="6.739823" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="587.079639" y="229.218583" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.495562" font-weight="bold" fill="var(--text)">Send Email</text>
  <line x1="671.327428" y1="223.110618" x2="723.982296" y2="324.910029" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Update Inventory (bottom branch) -->
  <line x1="439.64601" y1="345.269912" x2="492.300877" y2="447.069323" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="502.831851" y="416.529499" width="168.495577" height="61.079647" rx="6.739823" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="587.079639" y="447.069323" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.460213" font-weight="bold" fill="var(--text)">Update</text>
  <text x="587.079639" y="465.393217" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.460213" font-weight="bold" fill="var(--text)">Inventory</text>
  <line x1="671.327428" y1="447.069323" x2="723.982296" y2="345.269912" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Parallel join -->
  <rect x="734.513269" y="319.820115" width="31.592921" height="30.539823" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.739823"/>
  <text x="750.30973" y="340.179997" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.637183" fill="var(--text)">+</text>
  <line x1="766.10619" y1="335.089971" x2="829.292031" y2="335.089971" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Check Result -->
  <polygon points="913.53982,284.190265 997.787608,335.089971 913.53982,385.989676 829.292031,335.089971" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="913.53982" y="331.017994" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.460213" font-weight="bold" fill="var(--text)">Check</text>
  <text x="913.53982" y="347.3059" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.460213" font-weight="bold" fill="var(--text)">Result</text>
  <!-- Success -->
  <line x1="997.787608" y1="314.730088" x2="1082.035397" y2="223.110618" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1092.56637" y="192.570795" width="147.43363" height="61.079647" rx="6.739823" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1166.283185" y="229.218583" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.566373" font-weight="bold" fill="var(--ok-accent)">Success</text>
  <text x="1005.625" y="248.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" transform="rotate(-25,1030,230)">pass</text>
  <!-- Fail -->
  <line x1="997.787608" y1="355.449853" x2="1082.035397" y2="447.069323" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1092.56637" y="416.529499" width="147.43363" height="61.079647" rx="6.739823" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1166.283185" y="453.177287" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.566373" font-weight="bold" fill="var(--danger-accent)">Fail</text>
  <text x="1005.625" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" transform="rotate(25,1030,400)">fail</text>
  <!-- Label: Parallel -->
  <text x="587.079639" y="162.030972" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.424752" fill="var(--text-faint)">Parallel Execution</text>
  <rect x="429.115036" y="172.210913" width="315.929207" height="325.758115" rx="6.739823" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Start -->
  <circle cx="133.75" cy="320.9375" r="27.6523" fill="var(--surface)" stroke="var(--border)" stroke-width="3"/>
  <text x="133.75" y="326.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Start</text>
  <line x1="161.875" y1="320.9375" x2="218.125" y2="320.9375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Process Order -->
  <rect x="227.5" y="293.75" width="140.625" height="54.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.8125" y="326.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Process Order</text>
  <line x1="368.125" y1="320.9375" x2="424.375" y2="320.9375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Parallel split -->
  <rect x="433.75" y="307.3438" width="28.125" height="27.1875" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="447.8125" y="325.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)">+</text>
  <!-- Send Email (top branch) -->
  <line x1="461.875" y1="311.875" x2="508.75" y2="221.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="518.125" y="194.0625" width="150" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="593.125" y="226.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Send Email</text>
  <line x1="668.125" y1="221.25" x2="715" y2="311.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Update Inventory (bottom branch) -->
  <line x1="461.875" y1="330" x2="508.75" y2="420.625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="518.125" y="393.4375" width="150" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="593.125" y="420.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Update</text>
  <text x="593.125" y="436.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Inventory</text>
  <line x1="668.125" y1="420.625" x2="715" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Parallel join -->
  <rect x="724.375" y="307.3438" width="28.125" height="27.1875" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="738.4375" y="325.4688" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--text)">+</text>
  <line x1="752.5" y1="320.9375" x2="808.75" y2="320.9375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Check Result -->
  <polygon points="883.75,275.625 958.75,320.9375 883.75,366.25 808.75,320.9375" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.75" y="317.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Check</text>
  <text x="883.75" y="331.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)">Result</text>
  <!-- Success -->
  <line x1="958.75" y1="302.8125" x2="1033.75" y2="221.25" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1043.125" y="194.0625" width="131.25" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.75" y="226.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">Success</text>
  <text x="1005.625" y="248.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" transform="rotate(-25,1030,230)">pass</text>
  <!-- Fail -->
  <line x1="958.75" y1="339.0625" x2="1033.75" y2="420.625" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1043.125" y="393.4375" width="131.25" height="54.375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.75" y="426.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)">Fail</text>
  <text x="1005.625" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" transform="rotate(25,1030,400)">fail</text>
  <!-- Label: Parallel -->
  <text x="593.125" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Parallel Execution</text>
  <rect x="452.5" y="175.9375" width="281.25" height="290" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
</svg>
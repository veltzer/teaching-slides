<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Start -->
  <rect x="40" y="285.159114" width="62.1239" height="107.257458" rx="18.395535" fill="var(--surface)" stroke="var(--border)" stroke-width="3"/>
  <text x="71.061935" y="349.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.046687" font-weight="bold" fill="var(--text)">Start</text>
  <line x1="102.654856" y1="338.78788" x2="165.840697" y2="338.78788" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Process Order -->
  <rect x="176.371671" y="286.060606" width="157.964603" height="105.454546" rx="8.855904" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="255.353972" y="349.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.046687" font-weight="bold" fill="var(--text)">Process Order</text>
  <line x1="334.336274" y1="338.78788" x2="397.522115" y2="338.78788" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Parallel split -->
  <rect x="408.053089" y="312.424339" width="31.592921" height="52.727272" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.855904"/>
  <text x="423.849549" y="347.575854" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.48864" fill="var(--text)">+</text>
  <!-- Send Email (top branch) -->
  <line x1="439.64601" y1="321.21212" x2="492.300877" y2="145.454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="502.831851" y="92.727272" width="168.495577" height="105.454546" rx="8.855904" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="587.079639" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.046687" font-weight="bold" fill="var(--text)">Send Email</text>
  <line x1="671.327428" y1="145.454545" x2="723.982296" y2="321.21212" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Update Inventory (bottom branch) -->
  <line x1="439.64601" y1="356.363637" x2="492.300877" y2="532.121213" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="502.831851" y="479.393939" width="168.495577" height="105.454546" rx="8.855904" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="587.079639" y="532.121213" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.686273" font-weight="bold" fill="var(--text)">Update</text>
  <text x="587.079639" y="563.757577" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.686273" font-weight="bold" fill="var(--text)">Inventory</text>
  <line x1="671.327428" y1="532.121213" x2="723.982296" y2="356.363637" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Parallel join -->
  <rect x="734.513269" y="312.424339" width="31.592921" height="52.727272" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.855904"/>
  <text x="750.30973" y="347.575854" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.48864" fill="var(--text)">+</text>
  <line x1="766.10619" y1="338.78788" x2="829.292031" y2="338.78788" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Check Result -->
  <polygon points="913.53982,250.909091 997.787608,338.78788 913.53982,426.666667 829.292031,338.78788" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="913.53982" y="331.757576" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.686273" font-weight="bold" fill="var(--text)">Check</text>
  <text x="913.53982" y="359.878788" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.686273" font-weight="bold" fill="var(--text)">Result</text>
  <!-- Success -->
  <line x1="997.787608" y1="303.636363" x2="1082.035397" y2="145.454545" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1092.56637" y="92.727272" width="147.43363" height="105.454546" rx="8.855904" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1166.283185" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.767664" font-weight="bold" fill="var(--ok-accent)">Success</text>
  <text x="1005.625" y="248.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)" transform="rotate(-25,1030,230)">pass</text>
  <!-- Fail -->
  <line x1="997.787608" y1="373.939394" x2="1082.035397" y2="532.121213" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1092.56637" y="479.393939" width="147.43363" height="105.454546" rx="8.855904" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1166.283185" y="542.666666" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.767664" font-weight="bold" fill="var(--danger-accent)">Fail</text>
  <text x="1005.625" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" transform="rotate(25,1030,400)">fail</text>
  <!-- Label: Parallel -->
  <text x="587.079639" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.325712" fill="var(--text-faint)">Parallel Execution</text>
  <rect x="429.115036" y="57.575757" width="315.929207" height="562.424243" rx="8.855904" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
</svg>

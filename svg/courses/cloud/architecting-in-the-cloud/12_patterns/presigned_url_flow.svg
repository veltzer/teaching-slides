<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Three vertical swim lanes -->
  <!-- Client lane -->
  <rect x="115" y="67.1875" width="225" height="525.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="227.5" y="98.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--text)">Client</text>
  <line x1="115" y1="112.5" x2="340" y2="112.5" stroke="var(--border)" stroke-width="1"/>
  <!-- Application lane -->
  <rect x="490" y="67.1875" width="243.75" height="525.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="611.875" y="98.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Application</text>
  <line x1="490" y1="112.5" x2="733.75" y2="112.5" stroke="var(--primary-border)" stroke-width="1"/>
  <!-- S3 lane -->
  <rect x="883.75" y="67.1875" width="262.5" height="525.625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1015" y="98.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--warn-accent)">Amazon S3</text>
  <line x1="883.75" y1="112.5" x2="1146.25" y2="112.5" stroke="var(--warn-border)" stroke-width="1"/>
  <!-- Vertical lifelines -->
  <line x1="227.5" y1="112.5" x2="227.5" y2="583.75" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="611.875" y1="112.5" x2="611.875" y2="583.75" stroke="var(--primary-border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="1015" y1="112.5" x2="1015" y2="583.75" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Step 1: Request download URL -->
  <rect x="246.25" y="157.8125" width="346.875" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="227.5" y1="175.9375" x2="593.125" y2="175.9375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="424.375" y="172.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">1. Request download URL</text>
  <!-- Step: Application generates signed URL (internal) -->
  <rect x="527.5" y="221.25" width="168.75" height="54.375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="611.875" y="243.9062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)">Generate</text>
  <text x="611.875" y="262.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)">Pre-signed URL</text>
  <!-- Step 2: Return signed URL -->
  <rect x="246.25" y="302.8125" width="346.875" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="593.125" y1="320.9375" x2="246.25" y2="320.9375" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="424.375" y="317.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">2. Return pre-signed URL</text>
  <!-- Time-limited badge -->
  <rect x="133.75" y="357.1875" width="187.5" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="227.5" y="377.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Time-Limited URL</text>
  <text x="227.5" y="393.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Expires in N minutes</text>
  <!-- Step 3: Direct download -->
  <rect x="246.25" y="429.6875" width="750" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="227.5" y1="447.8125" x2="996.25" y2="447.8125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="621.25" y="444.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">3. Direct download with pre-signed URL</text>
  <!-- Return data -->
  <line x1="996.25" y1="502.1875" x2="246.25" y2="502.1875" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="621.25" y="498.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--warn-accent)">File data (direct from S3)</text>
  <!-- Note: No server bandwidth used -->
  <rect x="499.375" y="538.4375" width="234.375" height="36.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="616.5625" y="561.0938" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Server bandwidth not used!</text>
</svg>
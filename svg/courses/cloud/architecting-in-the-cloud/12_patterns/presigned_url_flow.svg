<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Three vertical swim lanes -->
  <!-- Client lane -->
  <rect x="40" y="40" width="261.818182" height="580" rx="6.798857" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="170.909091" y="74.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.800425" font-weight="bold" fill="var(--text)">Client</text>
  <line x1="40" y1="90" x2="301.818182" y2="90" stroke="var(--border)" stroke-width="1"/>
  <!-- Application lane -->
  <rect x="476.363636" y="40" width="283.636364" height="580" rx="6.798857" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="618.181818" y="74.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.800425" font-weight="bold" fill="var(--primary-accent)">Application</text>
  <line x1="476.363636" y1="90" x2="760" y2="90" stroke="var(--primary-border)" stroke-width="1"/>
  <!-- S3 lane -->
  <rect x="934.545455" y="40" width="305.454545" height="580" rx="6.798857" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.272727" y="74.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.800425" font-weight="bold" fill="var(--warn-accent)">Amazon S3</text>
  <line x1="934.545455" y1="90" x2="1240" y2="90" stroke="var(--warn-border)" stroke-width="1"/>
  <!-- Vertical lifelines -->
  <line x1="170.909091" y1="90" x2="170.909091" y2="610" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="618.181818" y1="90" x2="618.181818" y2="610" stroke="var(--primary-border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="1087.272727" y1="90" x2="1087.272727" y2="610" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Step 1: Request download URL -->
  <rect x="192.727273" y="140" width="403.636364" height="40" rx="6.798857" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="170.909091" y1="160" x2="596.363636" y2="160" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57811" font-weight="bold" fill="var(--primary-accent)">1. Request download URL</text>
  <!-- Step: Application generates signed URL (internal) -->
  <rect x="520" y="210" width="196.363636" height="60" rx="6.798857" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="618.181818" y="234.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.533579" font-weight="bold" fill="var(--info-accent)">Generate</text>
  <text x="618.181818" y="254.999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.533579" font-weight="bold" fill="var(--info-accent)">Pre-signed URL</text>
  <!-- Step 2: Return signed URL -->
  <rect x="192.727273" y="300" width="403.636364" height="40" rx="6.798857" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="596.363636" y1="320" x2="192.727273" y2="320" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57811" font-weight="bold" fill="var(--ok-accent)">2. Return pre-signed URL</text>
  <!-- Time-limited badge -->
  <rect x="61.818182" y="360" width="218.181818" height="50" rx="6.798857" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.909091" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.533579" font-weight="bold" fill="var(--warn-accent)">Time-Limited URL</text>
  <text x="170.909091" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.489161" fill="var(--text-muted)">Expires in N minutes</text>
  <!-- Step 3: Direct download -->
  <rect x="192.727273" y="440" width="872.727273" height="40" rx="6.798857" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="170.909091" y1="460" x2="1065.454545" y2="460" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="629.090909" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622528" font-weight="bold" fill="var(--ok-accent)">3. Direct download with pre-signed URL</text>
  <!-- Return data -->
  <line x1="1065.454545" y1="520" x2="192.727273" y2="520" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="629.090909" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57811" fill="var(--warn-accent)">File data (direct from S3)</text>
  <!-- Note: No server bandwidth used -->
  <rect x="487.272727" y="560" width="272.727273" height="40" rx="6.798857" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="623.636364" y="585.000055" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.533579" fill="var(--text-faint)">Server bandwidth not used!</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Three vertical swim lanes -->
  <!-- Client lane -->
  <rect x="80" y="30" width="240" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="200" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Client</text>
  <line x1="80" y1="80" x2="320" y2="80" stroke="var(--border)" stroke-width="1"/>
  <!-- Application lane -->
  <rect x="480" y="30" width="260" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="610" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">Application</text>
  <line x1="480" y1="80" x2="740" y2="80" stroke="var(--primary-border)" stroke-width="1"/>
  <!-- S3 lane -->
  <rect x="900" y="30" width="280" height="580" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1040" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-accent)">Amazon S3</text>
  <line x1="900" y1="80" x2="1180" y2="80" stroke="var(--warn-border)" stroke-width="1"/>
  <!-- Vertical lifelines -->
  <line x1="200" y1="80" x2="200" y2="600" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="610" y1="80" x2="610" y2="600" stroke="var(--primary-border)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="1040" y1="80" x2="1040" y2="600" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Step 1: Request download URL -->
  <rect x="220" y="130" width="370" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="200" y1="150" x2="590" y2="150" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">1. Request download URL</text>
  <!-- Step: Application generates signed URL (internal) -->
  <rect x="520" y="200" width="180" height="60" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-accent)">Generate</text>
  <text x="610" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-accent)">Pre-signed URL</text>
  <!-- Step 2: Return signed URL -->
  <rect x="220" y="290" width="370" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="590" y1="310" x2="220" y2="310" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">2. Return pre-signed URL</text>
  <!-- Time-limited badge -->
  <rect x="100" y="350" width="200" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="200" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-accent)">Time-Limited URL</text>
  <text x="200" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Expires in N minutes</text>
  <!-- Step 3: Direct download -->
  <rect x="220" y="430" width="800" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="200" y1="450" x2="1020" y2="450" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">3. Direct download with pre-signed URL</text>
  <!-- Return data -->
  <line x1="1020" y1="510" x2="220" y2="510" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="620" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">File data (direct from S3)</text>
  <!-- Note: No server bandwidth used -->
  <rect x="490" y="550" width="250" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="615" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Server bandwidth not used!</text>
</svg>
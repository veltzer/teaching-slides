<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Three vertical swim lanes -->
  <!-- Client lane -->
  <rect x="80" y="30" width="240" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="200" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Client</text>
  <line x1="80" y1="80" x2="320" y2="80" stroke="var(--border)" stroke-width="1"/>
  <!-- Application lane -->
  <rect x="480" y="30" width="260" height="580" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="610" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Application</text>
  <line x1="480" y1="80" x2="740" y2="80" stroke="var(--primary)" stroke-width="1"/>
  <!-- S3 lane -->
  <rect x="900" y="30" width="280" height="580" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="1040" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-dk)">Amazon S3</text>
  <line x1="900" y1="80" x2="1180" y2="80" stroke="var(--warn)" stroke-width="1"/>
  <!-- Vertical lifelines -->
  <line x1="200" y1="80" x2="200" y2="600" stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="610" y1="80" x2="610" y2="600" stroke="var(--primary)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="1040" y1="80" x2="1040" y2="600" stroke="var(--warn)" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Step 1: Request download URL -->
  <rect x="220" y="130" width="370" height="40" rx="6" fill="var(--primary-lt)" stroke="var(--primary)" stroke-width="1"/>
  <line x1="200" y1="150" x2="590" y2="150" stroke="var(--primary)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">1. Request download URL</text>
  <!-- Step: Application generates signed URL (internal) -->
  <rect x="520" y="200" width="180" height="60" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-dk)">Generate</text>
  <text x="610" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-dk)">Pre-signed URL</text>
  <!-- Step 2: Return signed URL -->
  <rect x="220" y="290" width="370" height="40" rx="6" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="1"/>
  <line x1="590" y1="310" x2="220" y2="310" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">2. Return pre-signed URL</text>
  <!-- Time-limited badge -->
  <rect x="100" y="350" width="200" height="50" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
  <text x="200" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-dk)">Time-Limited URL</text>
  <text x="200" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Expires in N minutes</text>
  <!-- Step 3: Direct download -->
  <rect x="220" y="430" width="800" height="40" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <line x1="200" y1="450" x2="1020" y2="450" stroke="var(--ok)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">3. Direct download with pre-signed URL</text>
  <!-- Return data -->
  <line x1="1020" y1="510" x2="220" y2="510" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="620" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">File data (direct from S3)</text>
  <!-- Note: No server bandwidth used -->
  <rect x="490" y="550" width="250" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="615" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Server bandwidth not used!</text>
</svg>
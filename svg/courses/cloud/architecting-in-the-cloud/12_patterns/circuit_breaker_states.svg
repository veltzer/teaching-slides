<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- CLOSED state -->
  <circle cx="220" cy="280" r="110" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="4" filter="url(#shadow)"/>
  <text x="220" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-dk)">CLOSED</text>
  <text x="220" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Normal operation</text>
  <text x="220" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Requests pass</text>
  <text x="220" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">through</text>
  <!-- OPEN state -->
  <circle cx="1060" cy="280" r="110" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="4" filter="url(#shadow)"/>
  <text x="1060" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-dk)">OPEN</text>
  <text x="1060" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Service failing</text>
  <text x="1060" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Requests rejected</text>
  <text x="1060" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">immediately</text>
  <!-- HALF-OPEN state -->
  <circle cx="640" cy="520" r="100" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="4" filter="url(#shadow)"/>
  <text x="640" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-dk)">HALF-OPEN</text>
  <text x="640" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Testing</text>
  <text x="640" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Limited requests</text>
  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">allowed</text>
  <!-- Arrow: Closed -> Open (failures exceed threshold) -->
  <path d="M330,260 Q640,100 950,260" fill="none" stroke="var(--danger)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="500" y="130" width="280" height="40" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1"/>
  <text x="640" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-dk)">Failures exceed threshold</text>
  <!-- Arrow: Open -> Half-Open (timeout expires) -->
  <path d="M1000,370 Q900,520 742,520" fill="none" stroke="var(--warn)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="860" y="440" width="180" height="35" rx="6" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="950" y="463" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-dk)">Timeout expires</text>
  <!-- Arrow: Half-Open -> Closed (test succeeds) -->
  <path d="M542,490 Q350,440 260,390" fill="none" stroke="var(--ok)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="310" y="420" width="170" height="35" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="395" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">Test succeeds</text>
  <!-- Arrow: Half-Open -> Open (test fails) -->
  <path d="M738,500 Q900,440 1010,370" fill="none" stroke="var(--danger)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="830" y="370" width="130" height="35" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1"/>
  <text x="895" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--danger-dk)">Test fails</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect width="963.324594" height="440.571" fill="var(--bg)" rx="5.992695" x="40" y="40"/>
  <rect x="449.464318" y="303.632" width="158.351736" height="158.352" rx="13.999988" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1218" filter="url(#shadow)"/>
  <text x="528.640286" y="369.0404" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" font-weight="bold" fill="var(--ok-accent)">CLOSED</text>
  <text x="528.640286" y="389.6921" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" fill="var(--text-muted)">Normal operation</text>
  <text x="528.640286" y="403.4599" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" fill="var(--text-muted)">Requests pass</text>
  <text x="528.640286" y="417.2279" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" fill="var(--text-muted)">through</text>
  <rect x="1081.648264" y="303.632" width="158.351736" height="158.352" rx="13.999988" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.1218" filter="url(#shadow)"/>
  <text x="1160.822132" y="369.0404" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" font-weight="bold" fill="var(--danger-accent)">OPEN</text>
  <text x="1160.822132" y="389.6921" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" fill="var(--text-muted)">Service failing</text>
  <text x="1160.822132" y="403.4599" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" fill="var(--text-muted)">Requests rejected</text>
  <text x="1160.822132" y="417.2279" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" fill="var(--text-muted)">immediately</text>
  <rect x="772.753779" y="476.045" width="143.95476" height="143.955" rx="13.999988" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1218" filter="url(#shadow)"/>
  <text x="844.731359" y="534.2547" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" font-weight="bold" fill="var(--warn-accent)">HALF-OPEN</text>
  <text x="844.731359" y="551.4644" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" fill="var(--text-muted)">Testing</text>
  <text x="844.731359" y="565.2321" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" fill="var(--text-muted)">Limited requests</text>
  <text x="844.731359" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" fill="var(--text-muted)">allowed</text>
  <path d="M 611.426148 369.0404 Q 844.731359 258.8974 1078.03647 369.0404" fill="none" stroke="var(--danger-border)" stroke-width="0.8413" marker-end="url(#arrow)" />
  <rect x="739.367834" y="279.5493" width="210.727249" height="27.5358" rx="5.992695" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="844.731359" y="297.4476" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" font-weight="bold" fill="var(--danger-accent)">Failures exceed threshold</text>
  <path d="M 1115.666307 444.7636 Q 1040.406733 548.0223 921.496231 548.0223" fill="none" stroke="var(--warn-border)" stroke-width="0.8413" marker-end="url(#arrow)" />
  <rect x="1010.302683" y="492.9509" width="135.467374" height="24.0937" rx="5.992695" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1078.03647" y="508.7839" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" font-weight="bold" fill="var(--warn-accent)">Timeout expires</text>
  <path d="M 770.976582 527.3704 Q 626.478023 492.9509 558.744435 458.5313" fill="none" stroke="var(--ok-border)" stroke-width="0.8413" marker-end="url(#arrow)" />
  <rect x="596.374173" y="479.1831" width="127.941687" height="24.0937" rx="5.992695" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.344966" y="495.0162" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" font-weight="bold" fill="var(--ok-accent)">Test succeeds</text>
  <path d="M 918.485736 534.2547 Q 1040.406733 492.9509 1123.192295 444.7636" fill="none" stroke="var(--danger-border)" stroke-width="0.8413" marker-end="url(#arrow)" />
  <rect x="987.72492" y="444.7636" width="97.837437" height="24.0937" rx="5.992695" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036.643439" y="460.5967" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.186887" font-weight="bold" fill="var(--danger-accent)">Test fails</text>
</svg>
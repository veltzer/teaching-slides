<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Three states arranged in a triangle: CLOSED top-left, OPEN top-right, HALF-OPEN bottom-center -->
  <rect x="40" y="40" width="323.076923" height="241.666666666667" rx="16.530856537814" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="201.538462" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.784815885781" font-weight="bold" fill="var(--ok-text)">CLOSED</text>
  <text x="201.538462" y="172.916666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509653803" fill="var(--ok-text)">Normal operation</text>
  <text x="201.538462" y="209.166666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509653803" fill="var(--ok-text)">Requests pass</text>
  <text x="201.538462" y="245.416666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509653803" fill="var(--ok-text)">through normally</text>

  <rect x="916.923077" y="40" width="323.076923" height="241.666666666667" rx="16.530856537814" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1078.461538" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.784815885781" font-weight="bold" fill="var(--danger-text)">OPEN</text>
  <text x="1078.461538" y="172.916666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509653803" fill="var(--danger-text)">Service failing</text>
  <text x="1078.461538" y="209.166666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509653803" fill="var(--danger-text)">Requests rejected</text>
  <text x="1078.461538" y="245.416666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509653803" fill="var(--danger-text)">immediately</text>

  <rect x="478.461538" y="378.333333333333" width="323.076923" height="241.666666666667" rx="16.530856537814" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="450.833333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="35.423264480704" font-weight="bold" fill="var(--warn-text)">HALF-OPEN</text>
  <text x="640" y="511.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509653803" fill="var(--warn-text)">Probationary</text>
  <text x="640" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509653803" fill="var(--warn-text)">Limited requests</text>
  <text x="640" y="583.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509653803" fill="var(--warn-text)">allowed through</text>

  <!-- CLOSED -> OPEN (top edge) -->
  <line x1="363.076923" y1="136.666666666667" x2="916.923077" y2="136.666666666667" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="640" y="124.583333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.892407942891" font-weight="bold" fill="var(--danger-accent)">failures exceed threshold</text>

  <!-- OPEN -> HALF-OPEN (right diagonal) -->
  <line x1="997.692308" y1="281.666666666667" x2="778.461538" y2="378.333333333333" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="940" y="348.125" font-family="Arial, sans-serif" font-size="18.892407942891" font-weight="bold" fill="var(--warn-accent)">timeout expires</text>

  <!-- HALF-OPEN -> CLOSED (left diagonal, success) -->
  <line x1="478.461538" y1="438.75" x2="270.769231" y2="281.666666666667" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="270.769231" y="366.25" font-family="Arial, sans-serif" font-size="18.892407942891" font-weight="bold" fill="var(--ok-accent)">test succeeds</text>

  <!-- HALF-OPEN -> OPEN (right diagonal back, failure) -->
  <line x1="801.538462" y1="438.75" x2="997.692308" y2="293.75" stroke="var(--text-muted)" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="824.615385" y="426.666666666667" font-family="Arial, sans-serif" font-size="18.892407942891" font-weight="bold" fill="var(--danger-accent)">test fails</text>
</svg>

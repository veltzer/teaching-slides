<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect width="688.8664" height="344.4332" fill="var(--bg)" rx="5.0959" />
  <circle cx="214.8402" cy="205.7988" r="59.1995" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.7461" filter="url(#shadow)" />
  <text x="214.8402" y="195.0353" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8399" font-weight="bold" fill="var(--ok-accent)">CLOSED</text>
  <text x="214.8402" y="211.1806" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Normal operation</text>
  <text x="214.8402" y="221.9441" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Requests pass</text>
  <text x="214.8402" y="232.7077" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">through</text>
  <circle cx="666.9088" cy="205.7988" r="59.1995" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.7461" filter="url(#shadow)" />
  <text x="666.9088" y="195.0353" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8399" font-weight="bold" fill="var(--danger-accent)">OPEN</text>
  <text x="666.9088" y="211.1806" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Service failing</text>
  <text x="666.9088" y="221.9441" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Requests rejected</text>
  <text x="666.9088" y="232.7077" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">immediately</text>
  <circle cx="440.8746" cy="334.9613" r="53.8176" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.7461" filter="url(#shadow)" />
  <text x="440.8746" y="324.1978" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.7635" font-weight="bold" fill="var(--warn-accent)">HALF-OPEN</text>
  <text x="440.8746" y="337.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Testing</text>
  <text x="440.8746" y="348.4157" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Limited requests</text>
  <text x="440.8746" y="359.1792" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">allowed</text>
  <path d="M 274.0397 195.0353 Q 440.8746 108.9269 607.7094 195.0353" fill="none" stroke="var(--danger-border)" stroke-width="1.3095" marker-end="url(#arrow)" />
  <rect x="365.5298" y="125.0722" width="150.6895" height="21.5271" rx="5.0959" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.3777" />
  <text x="440.8746" y="139.0649" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">Failures exceed threshold</text>
  <path d="M 634.6182 254.2347 Q 580.8005 334.9613 495.7686 334.9613" fill="none" stroke="var(--warn-border)" stroke-width="1.3095" marker-end="url(#arrow)" />
  <rect x="559.2735" y="291.9072" width="96.8718" height="18.8362" rx="5.0959" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.3777" />
  <text x="607.7094" y="304.2852" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">Timeout expires</text>
  <path d="M 388.1332 318.8159 Q 284.8033 291.9072 236.3674 264.9982" fill="none" stroke="var(--ok-border)" stroke-width="1.3095" marker-end="url(#arrow)" />
  <rect x="263.2762" y="281.1436" width="91.4901" height="18.8362" rx="5.0959" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.3777" />
  <text x="309.0212" y="293.5217" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Test succeeds</text>
  <path d="M 493.6159 324.1978 Q 580.8005 291.9072 640 254.2347" fill="none" stroke="var(--danger-border)" stroke-width="1.3095" marker-end="url(#arrow)" />
  <rect x="543.1282" y="254.2347" width="69.9629" height="18.8362" rx="5.0959" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.3777" />
  <text x="578.1096" y="266.6128" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">Test fails</text>
</svg>
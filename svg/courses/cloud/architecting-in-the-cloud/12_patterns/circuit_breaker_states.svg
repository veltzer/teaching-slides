<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
      }
    </style>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,2 L11,6 L1,10 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="36.521859" font-weight="bold" fill="var(--primary-accent)">Circuit Breaker States</text>

  <!-- Three states arranged in a triangle: CLOSED top-left, OPEN top-right, HALF-OPEN bottom-center -->
  <rect x="40" y="140" width="323.076923" height="200" rx="15.038412"
        fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="201.538462" y="200" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="34.373514" font-weight="bold" fill="var(--ok-text)">CLOSED</text>
  <text x="201.538462" y="250" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="21.483446" fill="var(--ok-text)">Normal operation</text>
  <text x="201.538462" y="280" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="21.483446" fill="var(--ok-text)">Requests pass</text>
  <text x="201.538462" y="310" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="21.483446" fill="var(--ok-text)">through normally</text>

  <rect x="916.923077" y="140" width="323.076923" height="200" rx="15.038412"
        fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1078.461538" y="200" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="34.373514" font-weight="bold" fill="var(--danger-text)">OPEN</text>
  <text x="1078.461538" y="250" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="21.483446" fill="var(--danger-text)">Service failing</text>
  <text x="1078.461538" y="280" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="21.483446" fill="var(--danger-text)">Requests rejected</text>
  <text x="1078.461538" y="310" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="21.483446" fill="var(--danger-text)">immediately</text>

  <rect x="478.461538" y="420" width="323.076923" height="200" rx="15.038412"
        fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="480" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="32.225169" font-weight="bold" fill="var(--warn-text)">HALF-OPEN</text>
  <text x="640" y="530" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="21.483446" fill="var(--warn-text)">Probationary</text>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="21.483446" fill="var(--warn-text)">Limited requests</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="21.483446" fill="var(--warn-text)">allowed through</text>

  <!-- CLOSED -> OPEN (top edge) -->
  <line x1="363.076923" y1="220" x2="916.923077" y2="220" stroke="var(--text-muted)" stroke-width="2.5"
        marker-end="url(#arrow)"/>
  <text x="640" y="210" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="17.186757" font-weight="bold" fill="var(--danger-accent)">failures exceed threshold</text>

  <!-- OPEN -> HALF-OPEN (right diagonal) -->
  <line x1="997.692308" y1="340" x2="778.461538" y2="420" stroke="var(--text-muted)" stroke-width="2.5"
        marker-end="url(#arrow)"/>
  <text x="940" y="395" font-family="Arial, sans-serif"
        font-size="17.186757" font-weight="bold" fill="var(--warn-accent)">timeout expires</text>

  <!-- HALF-OPEN -> CLOSED (left diagonal, success) -->
  <line x1="478.461538" y1="470" x2="270.769231" y2="340" stroke="var(--text-muted)" stroke-width="2.5"
        marker-end="url(#arrow)"/>
  <text x="270.769231" y="410" font-family="Arial, sans-serif"
        font-size="17.186757" font-weight="bold" fill="var(--ok-accent)">test succeeds</text>

  <!-- HALF-OPEN -> OPEN (right diagonal back, failure) -->
  <line x1="801.538462" y1="470" x2="997.692308" y2="350" stroke="var(--text-muted)" stroke-width="2.5"
        marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="824.615385" y="460" font-family="Arial, sans-serif"
        font-size="17.186757" font-weight="bold" fill="var(--danger-accent)">test fails</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect width="960.4369" height="442.9681" fill="var(--bg)" rx="6" x="40" y="40"/>
  <circle cx="527.1755" cy="384.6733" r="79.2719" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1218" filter="url(#shadow)" />
  <text x="527.1755" y="370.8307" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" font-weight="bold" fill="var(--ok-accent)">CLOSED</text>
  <text x="527.1755" y="391.5947" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" fill="var(--text-muted)">Normal operation</text>
  <text x="527.1755" y="405.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" fill="var(--text-muted)">Requests pass</text>
  <text x="527.1755" y="419.2804" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" fill="var(--text-muted)">through</text>
  <circle cx="1157.4623" cy="384.6733" r="79.2719" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.1218" filter="url(#shadow)" />
  <text x="1157.4623" y="370.8307" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" font-weight="bold" fill="var(--danger-accent)">OPEN</text>
  <text x="1157.4623" y="391.5947" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" fill="var(--text-muted)">Service failing</text>
  <text x="1157.4623" y="405.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" fill="var(--text-muted)">Requests rejected</text>
  <text x="1157.4623" y="419.2804" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" fill="var(--text-muted)">immediately</text>
  <circle cx="842.3191" cy="550.7864" r="72.065" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1218" filter="url(#shadow)" />
  <text x="842.3191" y="536.9438" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" font-weight="bold" fill="var(--warn-accent)">HALF-OPEN</text>
  <text x="842.3191" y="554.2472" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" fill="var(--text-muted)">Testing</text>
  <text x="842.3191" y="568.0898" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" fill="var(--text-muted)">Limited requests</text>
  <text x="842.3191" y="581.9326" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" fill="var(--text-muted)">allowed</text>
  <path d="M 609.7132 370.8307 Q 842.3191 260.0885 1074.9248 370.8307" fill="none" stroke="var(--danger-border)" stroke-width="0.8413" marker-end="url(#arrow)" />
  <rect x="737.2713" y="280.8527" width="210.0956" height="27.6855" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="842.3191" y="298.8484" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" font-weight="bold" fill="var(--danger-accent)">Failures exceed threshold</text>
  <path d="M 1112.4419 446.9658 Q 1037.4077 550.7864 918.8538 550.7864" fill="none" stroke="var(--warn-border)" stroke-width="0.8413" marker-end="url(#arrow)" />
  <rect x="1007.3941" y="495.4155" width="135.0613" height="24.2248" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1074.9248" y="511.3345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" font-weight="bold" fill="var(--warn-accent)">Timeout expires</text>
  <path d="M 768.7854 530.0221 Q 624.72 495.4155 557.1894 460.8084" fill="none" stroke="var(--ok-border)" stroke-width="0.8413" marker-end="url(#arrow)" />
  <rect x="594.7063" y="481.5727" width="127.5581" height="24.2248" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="658.4854" y="497.4919" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" font-weight="bold" fill="var(--ok-accent)">Test succeeds</text>
  <path d="M 915.8524 536.9438 Q 1037.4077 495.4155 1119.9453 446.9658" fill="none" stroke="var(--danger-border)" stroke-width="0.8413" marker-end="url(#arrow)" />
  <rect x="984.884" y="446.9658" width="97.5442" height="24.2248" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1033.656" y="462.885" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2065" font-weight="bold" fill="var(--danger-accent)">Test fails</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
  </defs>
  <rect width="811.0891" height="405.5446" fill="var(--bg)" rx="0" />
  <circle cx="139.4059" cy="177.4257" r="69.703" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2.5347" filter="url(#shadow)" />
  <text x="139.4059" y="164.7525" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9406" font-weight="bold" fill="var(--ok-dk)">CLOSED</text>
  <text x="139.4059" y="183.7624" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Normal operation</text>
  <text x="139.4059" y="196.4356" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Requests pass</text>
  <text x="139.4059" y="209.1089" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">through</text>
  <circle cx="671.6832" cy="177.4257" r="69.703" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2.5347" filter="url(#shadow)" />
  <text x="671.6832" y="164.7525" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9406" font-weight="bold" fill="var(--danger-dk)">OPEN</text>
  <text x="671.6832" y="183.7624" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Service failing</text>
  <text x="671.6832" y="196.4356" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Requests rejected</text>
  <text x="671.6832" y="209.1089" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">immediately</text>
  <circle cx="405.5446" cy="329.505" r="63.3663" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2.5347" filter="url(#shadow)" />
  <text x="405.5446" y="316.8317" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6733" font-weight="bold" fill="var(--warn-dk)">HALF-OPEN</text>
  <text x="405.5446" y="332.6733" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Testing</text>
  <text x="405.5446" y="345.3465" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Limited requests</text>
  <text x="405.5446" y="358.0198" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">allowed</text>
  <path d="M 209.1089 164.7525 Q 405.5446 63.3663 601.9802 164.7525" fill="none" stroke="var(--danger)" stroke-width="1.901" marker-end="url(#arrow)" />
  <rect x="316.8317" y="82.3762" width="177.4257" height="25.3465" rx="3.802" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="0.6337" />
  <text x="405.5446" y="98.8515" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--danger-dk)">Failures exceed threshold</text>
  <path d="M 633.6634 234.4554 Q 570.297 329.505 470.1782 329.505" fill="none" stroke="var(--warn)" stroke-width="1.901" marker-end="url(#arrow)" />
  <rect x="544.9505" y="278.8119" width="114.0594" height="22.1782" rx="3.802" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="0.6337" />
  <text x="601.9802" y="293.3861" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-dk)">Timeout expires</text>
  <path d="M 343.4455 310.495 Q 221.7822 278.8119 164.7525 247.1287" fill="none" stroke="var(--ok)" stroke-width="1.901" marker-end="url(#arrow)" />
  <rect x="196.4356" y="266.1386" width="107.7228" height="22.1782" rx="3.802" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="0.6337" />
  <text x="250.297" y="280.7129" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-dk)">Test succeeds</text>
  <path d="M 467.6436 316.8317 Q 570.297 278.8119 640 234.4554" fill="none" stroke="var(--danger)" stroke-width="1.901" marker-end="url(#arrow)" />
  <rect x="525.9406" y="234.4554" width="82.3762" height="22.1782" rx="3.802" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="0.6337" />
  <text x="567.1287" y="249.0297" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--danger-dk)">Test fails</text>
</svg>
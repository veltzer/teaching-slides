<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect width="569.1766" height="284.5884" fill="var(--bg)" rx="4.9575" />
  <circle cx="288.7112" cy="221.4381" r="48.9137" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1218" filter="url(#shadow)" />
  <text x="288.7112" y="212.5448" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">CLOSED</text>
  <text x="288.7112" y="225.8848" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Normal operation</text>
  <text x="288.7112" y="234.7782" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Requests pass</text>
  <text x="288.7112" y="243.6717" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">through</text>
  <circle cx="662.2334" cy="221.4381" r="48.9137" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.1218" filter="url(#shadow)" />
  <text x="662.2334" y="212.5448" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">OPEN</text>
  <text x="662.2334" y="225.8848" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Service failing</text>
  <text x="662.2334" y="234.7782" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Requests rejected</text>
  <text x="662.2334" y="243.6717" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">immediately</text>
  <circle cx="475.4724" cy="328.1588" r="44.4668" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1218" filter="url(#shadow)" />
  <text x="475.4724" y="319.2655" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">HALF-OPEN</text>
  <text x="475.4724" y="330.3822" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Testing</text>
  <text x="475.4724" y="339.2755" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Limited requests</text>
  <text x="475.4724" y="348.1689" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">allowed</text>
  <path d="M 337.6249 212.5448 Q 475.4724 141.3976 613.3198 212.5448" fill="none" stroke="var(--danger-border)" stroke-width="0.8413" marker-end="url(#arrow)" />
  <rect x="413.2187" y="154.7377" width="124.5074" height="17.7868" rx="4.9575" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2849" />
  <text x="475.4724" y="166.2992" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">Failures exceed threshold</text>
  <path d="M 635.5533 261.4584 Q 591.0863 328.1588 520.8286 328.1588" fill="none" stroke="var(--warn-border)" stroke-width="0.8413" marker-end="url(#arrow)" />
  <rect x="573.2996" y="292.5853" width="80.0404" height="15.5634" rx="4.9575" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.2849" />
  <text x="613.3198" y="302.8126" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">Timeout expires</text>
  <path d="M 431.8947 314.8186 Q 346.5183 292.5853 306.4981 270.3517" fill="none" stroke="var(--ok-border)" stroke-width="0.8413" marker-end="url(#arrow)" />
  <rect x="328.7315" y="283.6919" width="75.5938" height="15.5634" rx="4.9575" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2849" />
  <text x="366.5284" y="293.9193" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Test succeeds</text>
  <path d="M 519.0499 319.2655 Q 591.0863 292.5853 640 261.4584" fill="none" stroke="var(--danger-border)" stroke-width="0.8413" marker-end="url(#arrow)" />
  <rect x="559.9596" y="261.4584" width="57.8069" height="15.5634" rx="4.9575" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2849" />
  <text x="588.863" y="271.6858" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">Test fails</text>
</svg>
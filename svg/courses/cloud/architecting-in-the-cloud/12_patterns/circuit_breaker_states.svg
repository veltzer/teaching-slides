<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="999.9999" height="500" fill="var(--bg)" rx="7.3975" />
  <circle cx="311.875" cy="298.7499" r="85.9375" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.5347" filter="url(#shadow)" />
  <text x="311.875" y="283.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1875" font-weight="bold" fill="var(--ok-accent)">CLOSED</text>
  <text x="311.875" y="306.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" fill="var(--text-muted)">Normal operation</text>
  <text x="311.875" y="322.1874" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" fill="var(--text-muted)">Requests pass</text>
  <text x="311.875" y="337.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" fill="var(--text-muted)">through</text>
  <circle cx="968.125" cy="298.7499" r="85.9375" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.5347" filter="url(#shadow)" />
  <text x="968.125" y="283.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1875" font-weight="bold" fill="var(--danger-accent)">OPEN</text>
  <text x="968.125" y="306.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" fill="var(--text-muted)">Service failing</text>
  <text x="968.125" y="322.1874" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" fill="var(--text-muted)">Requests rejected</text>
  <text x="968.125" y="337.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" fill="var(--text-muted)">immediately</text>
  <circle cx="640.0001" cy="486.25" r="78.1249" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.5347" filter="url(#shadow)" />
  <text x="640.0001" y="470.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.625" font-weight="bold" fill="var(--warn-accent)">HALF-OPEN</text>
  <text x="640.0001" y="490.1562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" fill="var(--text-muted)">Testing</text>
  <text x="640.0001" y="505.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" fill="var(--text-muted)">Limited requests</text>
  <text x="640.0001" y="521.4062" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" fill="var(--text-muted)">allowed</text>
  <path d="M 397.8125 283.125 Q 640.0001 158.1249 882.1875 283.125" fill="none" stroke="var(--danger-border)" stroke-width="1.901" marker-end="url(#arrow)" />
  <rect x="530.625" y="181.5624" width="218.7499" height="31.25" rx="7.3975" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640.0001" y="201.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" font-weight="bold" fill="var(--danger-accent)">Failures exceed threshold</text>
  <path d="M 921.25 369.0624 Q 843.1249 486.25 719.6875 486.25" fill="none" stroke="var(--warn-border)" stroke-width="1.901" marker-end="url(#arrow)" />
  <rect x="811.875" y="423.75" width="140.625" height="27.3437" rx="7.3975" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="882.1875" y="441.7187" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" font-weight="bold" fill="var(--warn-accent)">Timeout expires</text>
  <path d="M 563.4375 462.8124 Q 413.4376 423.75 343.1251 384.6874" fill="none" stroke="var(--ok-border)" stroke-width="1.901" marker-end="url(#arrow)" />
  <rect x="382.1875" y="408.1249" width="132.8125" height="27.3437" rx="7.3975" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="448.5937" y="426.0937" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" font-weight="bold" fill="var(--ok-accent)">Test succeeds</text>
  <path d="M 716.5625 470.625 Q 843.1249 423.75 929.0625 369.0624" fill="none" stroke="var(--danger-border)" stroke-width="1.901" marker-end="url(#arrow)" />
  <rect x="788.4375" y="369.0624" width="101.5624" height="27.3437" rx="7.3975" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="839.2187" y="387.0312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3291" font-weight="bold" fill="var(--danger-accent)">Test fails</text>
</svg>
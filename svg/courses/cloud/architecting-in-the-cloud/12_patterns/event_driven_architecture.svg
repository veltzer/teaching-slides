<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Labels -->
  <text x="190" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text-muted)">Producers</text>
  <text x="1071.25" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text-muted)">Consumers</text>
  <!-- Center: EventBridge -->
  <rect x="508.75" y="221.25" width="262.5" height="181.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="284.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--primary-accent)">EventBridge</text>
  <text x="640" y="311.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Event Bus</text>
  <text x="640" y="348.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Filter, Route, Transform</text>
  <text x="640" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Schema Registry</text>
  <!-- Producer 1: Order Service -->
  <rect x="77.5" y="130.625" width="187.5" height="58.9062" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.25" y="157.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Order Service</text>
  <text x="171.25" y="175.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">order.placed</text>
  <line x1="265" y1="157.8125" x2="506.875" y2="266.5625" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Producer 2: Payment Service -->
  <rect x="77.5" y="284.6875" width="187.5" height="58.9062" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.25" y="311.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Payment Service</text>
  <text x="171.25" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">payment.completed</text>
  <line x1="265" y1="313.6875" x2="506.875" y2="311.875" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Producer 3: Inventory -->
  <rect x="77.5" y="438.75" width="187.5" height="58.9062" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.25" y="465.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Inventory</text>
  <text x="171.25" y="484.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--info-accent)">stock.updated</text>
  <line x1="265" y1="467.75" x2="506.875" y2="357.1875" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Rules/Filters on right side -->
  <rect x="799.375" y="157.8125" width="93.75" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="846.25" y="175.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Rule: order.*</text>
  <rect x="799.375" y="293.75" width="93.75" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="846.25" y="311.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Rule: pay.*</text>
  <rect x="799.375" y="429.6875" width="93.75" height="27.1875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="846.25" y="447.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Rule: stock.*</text>
  <!-- Consumer 1: Email Service -->
  <rect x="940" y="130.625" width="206.25" height="58.9062" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.125" y="157.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Email Service</text>
  <text x="1043.125" y="175.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)">Send notifications</text>
  <line x1="771.25" y1="275.625" x2="938.125" y2="171.4062" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Consumer 2: Analytics -->
  <rect x="940" y="284.6875" width="206.25" height="58.9062" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.125" y="311.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Analytics</text>
  <text x="1043.125" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)">Track all events</text>
  <line x1="771.25" y1="311.875" x2="938.125" y2="311.875" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Consumer 3: Warehouse -->
  <rect x="940" y="438.75" width="206.25" height="58.9062" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.125" y="465.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Warehouse</text>
  <text x="1043.125" y="484.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--info-accent)">Fulfill orders</text>
  <line x1="771.25" y1="348.125" x2="938.125" y2="452.3438" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Benefits -->
  <rect x="227.5" y="547.5" width="825" height="45.3125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="576.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Loose coupling | Independent scaling | Easy to add new consumers | Event replay</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Labels -->
  <text x="160" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-muted)">Producers</text>
  <text x="1100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-muted)">Consumers</text>
  <!-- Center: EventBridge -->
  <rect x="500" y="200" width="280" height="200" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-accent)">EventBridge</text>
  <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Event Bus</text>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Filter, Route, Transform</text>
  <text x="640" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Schema Registry</text>
  <!-- Producer 1: Order Service -->
  <rect x="40" y="100" width="200" height="65" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Order Service</text>
  <text x="140" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">order.placed</text>
  <line x1="240" y1="130" x2="498" y2="250" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Producer 2: Payment Service -->
  <rect x="40" y="270" width="200" height="65" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Payment Service</text>
  <text x="140" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">payment.completed</text>
  <line x1="240" y1="302" x2="498" y2="300" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Producer 3: Inventory -->
  <rect x="40" y="440" width="200" height="65" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Inventory</text>
  <text x="140" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--info-accent)">stock.updated</text>
  <line x1="240" y1="472" x2="498" y2="350" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Rules/Filters on right side -->
  <rect x="810" y="130" width="100" height="30" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Rule: order.*</text>
  <rect x="810" y="280" width="100" height="30" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Rule: pay.*</text>
  <rect x="810" y="430" width="100" height="30" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Rule: stock.*</text>
  <!-- Consumer 1: Email Service -->
  <rect x="960" y="100" width="220" height="65" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Email Service</text>
  <text x="1070" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">Send notifications</text>
  <line x1="780" y1="260" x2="958" y2="145" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Consumer 2: Analytics -->
  <rect x="960" y="270" width="220" height="65" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Analytics</text>
  <text x="1070" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">Track all events</text>
  <line x1="780" y1="300" x2="958" y2="300" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Consumer 3: Warehouse -->
  <rect x="960" y="440" width="220" height="65" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Warehouse</text>
  <text x="1070" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--info-accent)">Fulfill orders</text>
  <line x1="780" y1="340" x2="958" y2="455" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Benefits -->
  <rect x="200" y="560" width="880" height="50" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Loose coupling | Independent scaling | Easy to add new consumers | Event replay</text>
</svg>
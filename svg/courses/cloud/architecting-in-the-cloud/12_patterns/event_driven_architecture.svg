<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Labels -->
  <text x="160" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-muted)">Producers</text>
  <text x="1100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-muted)">Consumers</text>
  <!-- Center: EventBridge -->
  <rect x="500" y="200" width="280" height="200" rx="16" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-dk)">EventBridge</text>
  <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Event Bus</text>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Filter, Route, Transform</text>
  <text x="640" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Schema Registry</text>
  <!-- Producer 1: Order Service -->
  <rect x="40" y="100" width="200" height="65" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Order Service</text>
  <text x="140" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok)">order.placed</text>
  <line x1="240" y1="130" x2="498" y2="250" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Producer 2: Payment Service -->
  <rect x="40" y="270" width="200" height="65" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Payment Service</text>
  <text x="140" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn)">payment.completed</text>
  <line x1="240" y1="302" x2="498" y2="300" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Producer 3: Inventory -->
  <rect x="40" y="440" width="200" height="65" rx="10" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Inventory</text>
  <text x="140" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--info)">stock.updated</text>
  <line x1="240" y1="472" x2="498" y2="350" stroke="var(--info)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Rules/Filters on right side -->
  <rect x="810" y="130" width="100" height="30" rx="4" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="860" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Rule: order.*</text>
  <rect x="810" y="280" width="100" height="30" rx="4" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="860" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Rule: pay.*</text>
  <rect x="810" y="430" width="100" height="30" rx="4" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="860" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Rule: stock.*</text>
  <!-- Consumer 1: Email Service -->
  <rect x="960" y="100" width="220" height="65" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Email Service</text>
  <text x="1070" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok)">Send notifications</text>
  <line x1="780" y1="260" x2="958" y2="145" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Consumer 2: Analytics -->
  <rect x="960" y="270" width="220" height="65" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Analytics</text>
  <text x="1070" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn)">Track all events</text>
  <line x1="780" y1="300" x2="958" y2="300" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Consumer 3: Warehouse -->
  <rect x="960" y="440" width="220" height="65" rx="10" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Warehouse</text>
  <text x="1070" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--info)">Fulfill orders</text>
  <line x1="780" y1="340" x2="958" y2="455" stroke="var(--info)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Benefits -->
  <rect x="200" y="560" width="880" height="50" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Loose coupling | Independent scaling | Easy to add new consumers | Event replay</text>
</svg>
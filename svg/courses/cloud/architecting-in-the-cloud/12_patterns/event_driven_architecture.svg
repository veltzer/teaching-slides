<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Labels -->
  <text x="166.315789" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.559046" font-weight="bold" fill="var(--text-muted)">Producers</text>
  <text x="1155.789474" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.559046" font-weight="bold" fill="var(--text-muted)">Consumers</text>
  <!-- Center: EventBridge -->
  <rect x="524.210526" y="202.807018" width="294.736842" height="203.508772" rx="6.736842" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="671.578947" y="274.035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.698835" font-weight="bold" fill="var(--primary-accent)">EventBridge</text>
  <text x="671.578947" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.489151" fill="var(--text-muted)">Event Bus</text>
  <text x="671.578947" y="345.263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.419256" fill="var(--text-faint)">Filter, Route, Transform</text>
  <text x="671.578947" y="365.614035" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.419256" fill="var(--text-faint)">Schema Registry</text>
  <!-- Producer 1: Order Service -->
  <rect x="40" y="101.052632" width="210.526316" height="66.140295" rx="6.736842" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.263158" y="131.578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.489151" font-weight="bold" fill="var(--text)">Order Service</text>
  <text x="145.263158" y="151.929825" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.384365" fill="var(--ok-accent)">order.placed</text>
  <line x1="250.526316" y1="131.578947" x2="522.105263" y2="253.684211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Producer 2: Payment Service -->
  <rect x="40" y="274.035088" width="210.526316" height="66.140295" rx="6.736842" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.263158" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.489151" font-weight="bold" fill="var(--text)">Payment Service</text>
  <text x="145.263158" y="324.912281" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.384365" fill="var(--warn-accent)">payment.completed</text>
  <line x1="250.526316" y1="306.596491" x2="522.105263" y2="304.561404" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Producer 3: Inventory -->
  <rect x="40" y="447.017544" width="210.526316" height="66.140295" rx="6.736842" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.263158" y="477.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.489151" font-weight="bold" fill="var(--text)">Inventory</text>
  <text x="145.263158" y="497.894737" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.384365" fill="var(--info-accent)">stock.updated</text>
  <line x1="250.526316" y1="479.578947" x2="522.105263" y2="355.438596" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Rules/Filters on right side -->
  <rect x="850.526316" y="131.578947" width="105.263158" height="30.526316" rx="6.736842" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="903.157895" y="151.929825" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.384365" fill="var(--text-faint)">Rule: order.*</text>
  <rect x="850.526316" y="284.210526" width="105.263158" height="30.526316" rx="6.736842" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="903.157895" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.384365" fill="var(--text-faint)">Rule: pay.*</text>
  <rect x="850.526316" y="436.842105" width="105.263158" height="30.526316" rx="6.736842" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="903.157895" y="457.192982" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.384365" fill="var(--text-faint)">Rule: stock.*</text>
  <!-- Consumer 1: Email Service -->
  <rect x="1008.421053" y="101.052632" width="231.578947" height="66.140295" rx="6.736842" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.210526" y="131.578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.489151" font-weight="bold" fill="var(--text)">Email Service</text>
  <text x="1124.210526" y="151.929825" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.384365" fill="var(--ok-accent)">Send notifications</text>
  <line x1="818.947368" y1="263.859649" x2="1006.315789" y2="146.842049" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Consumer 2: Analytics -->
  <rect x="1008.421053" y="274.035088" width="231.578947" height="66.140295" rx="6.736842" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.210526" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.489151" font-weight="bold" fill="var(--text)">Analytics</text>
  <text x="1124.210526" y="324.912281" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.384365" fill="var(--warn-accent)">Track all events</text>
  <line x1="818.947368" y1="304.561404" x2="1006.315789" y2="304.561404" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Consumer 3: Warehouse -->
  <rect x="1008.421053" y="447.017544" width="231.578947" height="66.140295" rx="6.736842" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.210526" y="477.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.489151" font-weight="bold" fill="var(--text)">Warehouse</text>
  <text x="1124.210526" y="497.894737" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.384365" fill="var(--info-accent)">Fulfill orders</text>
  <line x1="818.947368" y1="345.263158" x2="1006.315789" y2="462.280758" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Benefits -->
  <rect x="208.421053" y="569.122807" width="926.315789" height="50.877193" rx="6.736842" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="671.578947" y="601.684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.489151" fill="var(--text-muted)">Loose coupling | Independent scaling | Easy to add new consumers | Event replay</text>
</svg>
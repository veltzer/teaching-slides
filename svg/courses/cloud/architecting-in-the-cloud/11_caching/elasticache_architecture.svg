<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>
  <!-- Client connections -->
  <rect x="490" y="20" width="300" height="50" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Client Connections</text>
  <!-- Arrows from client to shards -->
  <line x1="540" y1="70" x2="210" y2="138" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="70" x2="640" y2="138" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="70" x2="1070" y2="138" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- AZ backgrounds -->
  <!-- AZ 1 background -->
  <rect x="30" y="120" width="380" height="160" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="50" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-faint)">AZ 1</text>
  <!-- AZ 2 background -->
  <rect x="450" y="120" width="380" height="160" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="470" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-faint)">AZ 2</text>
  <!-- AZ 3 background -->
  <rect x="870" y="120" width="380" height="160" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="890" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-faint)">AZ 3</text>
  <!-- Shard 1 -->
  <text x="210" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)">Shard 1</text>
  <rect x="50" y="180" width="130" height="45" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Primary</text>
  <rect x="200" y="180" width="100" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="250" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Replica</text>
  <rect x="310" y="180" width="100" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="360" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Replica</text>
  <!-- Replication arrows shard 1 -->
  <line x1="180" y1="202" x2="198" y2="200" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="180" y1="202" x2="308" y2="200" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <!-- Shard 2 -->
  <text x="640" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)">Shard 2</text>
  <rect x="470" y="180" width="130" height="45" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="535" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Primary</text>
  <rect x="620" y="180" width="100" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="670" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Replica</text>
  <rect x="730" y="180" width="100" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Replica</text>
  <!-- Replication arrows shard 2 -->
  <line x1="600" y1="202" x2="618" y2="200" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="600" y1="202" x2="728" y2="200" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <!-- Shard 3 -->
  <text x="1060" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)">Shard 3</text>
  <rect x="890" y="180" width="130" height="45" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Primary</text>
  <rect x="1040" y="180" width="100" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1090" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Replica</text>
  <rect x="1150" y="180" width="100" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1200" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Replica</text>
  <!-- Replication arrows shard 3 -->
  <line x1="1020" y1="202" x2="1038" y2="200" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="1020" y1="202" x2="1148" y2="200" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <!-- Data distribution explanation -->
  <rect x="80" y="340" width="1120" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Data Distribution via Consistent Hashing</text>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Keys are distributed across shards. Each shard has a primary node for writes and replica nodes for reads.</text>
  <text x="640" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Replicas are placed in different AZs for high availability.</text>
  <!-- Legend -->
  <rect x="80" y="470" width="500" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="100" y="490" width="30" height="18" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="145" y="504" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Primary (read/write)</text>
  <rect x="280" y="490" width="30" height="18" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="325" y="504" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Replica (read only)</text>
  <line x1="100" y1="530" x2="140" y2="530" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="160" y="534" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Async replication</text>
</svg>
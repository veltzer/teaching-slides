<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Client connections -->
  <rect x="499.375" y="58.125" width="281.25" height="45.3125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="87.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Client Connections</text>
  <!-- Arrows from client to shards -->
  <line x1="546.25" y1="103.4375" x2="236.875" y2="165.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="103.4375" x2="640" y2="165.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="733.75" y1="103.4375" x2="1043.125" y2="165.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- AZ backgrounds -->
  <!-- AZ 1 background -->
  <rect x="68.125" y="148.75" width="356.25" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="86.875" y="171.4062" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--text-faint)">AZ 1</text>
  <!-- AZ 2 background -->
  <rect x="461.875" y="148.75" width="356.25" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="480.625" y="171.4062" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--text-faint)">AZ 2</text>
  <!-- AZ 3 background -->
  <rect x="855.625" y="148.75" width="356.25" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="874.375" y="171.4062" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--text-faint)">AZ 3</text>
  <!-- Shard 1 -->
  <text x="236.875" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text-muted)">Shard 1</text>
  <rect x="86.875" y="203.125" width="121.875" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.8125" y="228.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Primary</text>
  <rect x="227.5" y="203.125" width="93.75" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="274.375" y="225.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Replica</text>
  <rect x="330.625" y="203.125" width="93.75" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="377.5" y="225.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Replica</text>
  <!-- Replication arrows shard 1 -->
  <line x1="208.75" y1="223.0625" x2="225.625" y2="221.25" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="208.75" y1="223.0625" x2="328.75" y2="221.25" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <!-- Shard 2 -->
  <text x="640" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text-muted)">Shard 2</text>
  <rect x="480.625" y="203.125" width="121.875" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="541.5625" y="228.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Primary</text>
  <rect x="621.25" y="203.125" width="93.75" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="668.125" y="225.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Replica</text>
  <rect x="724.375" y="203.125" width="93.75" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="771.25" y="225.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Replica</text>
  <!-- Replication arrows shard 2 -->
  <line x1="602.5" y1="223.0625" x2="619.375" y2="221.25" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="602.5" y1="223.0625" x2="722.5" y2="221.25" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <!-- Shard 3 -->
  <text x="1033.75" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text-muted)">Shard 3</text>
  <rect x="874.375" y="203.125" width="121.875" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.3125" y="228.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Primary</text>
  <rect x="1015" y="203.125" width="93.75" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1061.875" y="225.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Replica</text>
  <rect x="1118.125" y="203.125" width="93.75" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1165" y="225.7812" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Replica</text>
  <!-- Replication arrows shard 3 -->
  <line x1="996.25" y1="223.0625" x2="1013.125" y2="221.25" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="996.25" y1="223.0625" x2="1116.25" y2="221.25" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <!-- Data distribution explanation -->
  <rect x="115" y="348.125" width="1050" height="81.5625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="375.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--primary-accent)">Data Distribution via Consistent Hashing</text>
  <text x="640" y="397.9688" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Keys are distributed across shards. Each shard has a primary node for writes and replica nodes for reads.</text>
  <text x="640" y="418.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Replicas are placed in different AZs for high availability.</text>
  <!-- Legend -->
  <rect x="115" y="465.9375" width="468.75" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="133.75" y="484.0625" width="28.125" height="16.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="175.9375" y="496.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Primary (read/write)</text>
  <rect x="302.5" y="484.0625" width="28.125" height="16.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="344.6875" y="496.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Replica (read only)</text>
  <line x1="133.75" y1="520.3125" x2="171.25" y2="520.3125" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="190" y="523.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Async replication</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Client connections -->
  <rect x="492.459016" y="40" width="295.081967" height="54.716981" rx="6.753492" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="75.018868" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.59997" font-weight="bold" fill="var(--text)">Client Connections</text>
  <!-- Arrows from client to shards -->
  <line x1="541.639344" y1="94.716981" x2="217.04918" y2="169.132075" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="94.716981" x2="640" y2="169.132075" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="738.360656" y1="94.716981" x2="1062.95082" y2="169.132075" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- AZ backgrounds -->
  <!-- AZ 1 background -->
  <rect x="40" y="149.433962" width="373.770492" height="175.09434" rx="6.753492" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="59.672131" y="176.792392" font-family="Arial, sans-serif" font-size="12.449949" font-weight="bold" fill="var(--text-faint)">AZ 1</text>
  <!-- AZ 2 background -->
  <rect x="453.114754" y="149.433962" width="373.770492" height="175.09434" rx="6.753492" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="472.786885" y="176.792392" font-family="Arial, sans-serif" font-size="12.449949" font-weight="bold" fill="var(--text-faint)">AZ 2</text>
  <!-- AZ 3 background -->
  <rect x="866.229508" y="149.433962" width="373.770492" height="175.09434" rx="6.753492" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="885.901639" y="176.792392" font-family="Arial, sans-serif" font-size="12.449949" font-weight="bold" fill="var(--text-faint)">AZ 3</text>
  <!-- Shard 1 -->
  <text x="217.04918" y="204.150943" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.52496" font-weight="bold" fill="var(--text-muted)">Shard 1</text>
  <rect x="59.672131" y="215.09434" width="127.868852" height="49.245223" rx="6.753492" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="123.606557" y="245.735849" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.487511" font-weight="bold" fill="var(--primary-accent)">Primary</text>
  <rect x="207.213115" y="215.09434" width="98.360656" height="43.773585" rx="6.753492" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="256.393443" y="242.45277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.449949" fill="var(--ok-accent)">Replica</text>
  <rect x="315.409836" y="215.09434" width="98.360656" height="43.773585" rx="6.753492" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="364.590164" y="242.45277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.449949" fill="var(--ok-accent)">Replica</text>
  <!-- Replication arrows shard 1 -->
  <line x1="187.540984" y1="239.169811" x2="205.245902" y2="236.981132" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="187.540984" y1="239.169811" x2="313.442623" y2="236.981132" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <!-- Shard 2 -->
  <text x="640" y="204.150943" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.52496" font-weight="bold" fill="var(--text-muted)">Shard 2</text>
  <rect x="472.786885" y="215.09434" width="127.868852" height="49.245223" rx="6.753492" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="536.721311" y="245.735849" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.487511" font-weight="bold" fill="var(--primary-accent)">Primary</text>
  <rect x="620.327869" y="215.09434" width="98.360656" height="43.773585" rx="6.753492" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="669.508197" y="242.45277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.449949" fill="var(--ok-accent)">Replica</text>
  <rect x="728.52459" y="215.09434" width="98.360656" height="43.773585" rx="6.753492" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="777.704918" y="242.45277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.449949" fill="var(--ok-accent)">Replica</text>
  <!-- Replication arrows shard 2 -->
  <line x1="600.655738" y1="239.169811" x2="618.360656" y2="236.981132" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="600.655738" y1="239.169811" x2="726.557377" y2="236.981132" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <!-- Shard 3 -->
  <text x="1053.114754" y="204.150943" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.52496" font-weight="bold" fill="var(--text-muted)">Shard 3</text>
  <rect x="885.901639" y="215.09434" width="127.868852" height="49.245223" rx="6.753492" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.836066" y="245.735849" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.487511" font-weight="bold" fill="var(--primary-accent)">Primary</text>
  <rect x="1033.442623" y="215.09434" width="98.360656" height="43.773585" rx="6.753492" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.622951" y="242.45277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.449949" fill="var(--ok-accent)">Replica</text>
  <rect x="1141.639344" y="215.09434" width="98.360656" height="43.773585" rx="6.753492" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1190.819672" y="242.45277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.449949" fill="var(--ok-accent)">Replica</text>
  <!-- Replication arrows shard 3 -->
  <line x1="1013.770492" y1="239.169811" x2="1031.47541" y2="236.981132" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="1013.770492" y1="239.169811" x2="1139.672131" y2="236.981132" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <!-- Data distribution explanation -->
  <rect x="89.180328" y="390.188679" width="1101.639344" height="98.490566" rx="6.753492" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="423.018868" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.562409" font-weight="bold" fill="var(--primary-accent)">Data Distribution via Consistent Hashing</text>
  <text x="640" y="450.377419" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.487511" fill="var(--text-muted)">Keys are distributed across shards. Each shard has a primary node for writes and replica nodes for reads.</text>
  <text x="640" y="475.54717" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.487511" fill="var(--text-muted)">Replicas are placed in different AZs for high availability.</text>
  <!-- Legend -->
  <rect x="89.180328" y="532.45283" width="491.803279" height="87.54717" rx="6.753492" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="108.852459" y="554.339623" width="29.508197" height="19.698113" rx="6.753492" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.114754" y="569.660377" font-family="Arial, sans-serif" font-size="12.449949" fill="var(--text)">Primary (read/write)</text>
  <rect x="285.901639" y="554.339623" width="29.508197" height="19.698113" rx="6.753492" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.163934" y="569.660377" font-family="Arial, sans-serif" font-size="12.449949" fill="var(--text)">Replica (read only)</text>
  <line x1="108.852459" y1="598.113208" x2="148.196721" y2="598.113208" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="167.868852" y="602.490566" font-family="Arial, sans-serif" font-size="12.449949" fill="var(--text)">Async replication</text>
</svg>

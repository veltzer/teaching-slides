<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Arrow: Closer to user = faster -->
  <line x1="80" y1="50" x2="1200" y2="50" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)">Closer to user = Faster                                                                    Closer to data = Slower</text>
  <!-- Layer 1: Browser Cache -->
  <rect x="40" y="100" width="200" height="380" rx="12" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Browser</text>
  <text x="140" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Cache</text>
  <rect x="70" y="200" width="140" height="40" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="140" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok)">&lt;1ms</text>
  <text x="140" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Local storage</text>
  <text x="140" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Service worker</text>
  <!-- Arrow -->
  <line x1="240" y1="290" x2="280" y2="290" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 2: CDN -->
  <rect x="290" y="100" width="200" height="380" rx="12" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">CDN</text>
  <text x="390" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">CloudFront</text>
  <rect x="320" y="200" width="140" height="40" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="390" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok)">~5ms</text>
  <text x="390" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Edge locations</text>
  <text x="390" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Static assets</text>
  <!-- Arrow -->
  <line x1="490" y1="290" x2="530" y2="290" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 3: API Gateway Cache -->
  <rect x="540" y="100" width="200" height="380" rx="12" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">API Gateway</text>
  <text x="640" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Cache</text>
  <rect x="570" y="200" width="140" height="40" rx="6" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="640" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn)">~10ms</text>
  <text x="640" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Response caching</text>
  <text x="640" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">TTL-based</text>
  <!-- Arrow -->
  <line x1="740" y1="290" x2="780" y2="290" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 4: App Cache / Redis -->
  <rect x="790" y="100" width="200" height="380" rx="12" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">App Cache</text>
  <text x="890" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Redis / Memcached</text>
  <rect x="820" y="200" width="140" height="40" rx="6" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="890" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn)">~50ms</text>
  <text x="890" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Session data</text>
  <text x="890" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Query results</text>
  <!-- Arrow -->
  <line x1="990" y1="290" x2="1030" y2="290" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 5: Database -->
  <rect x="1040" y="100" width="200" height="380" rx="12" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Database</text>
  <text x="1140" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Source of Truth</text>
  <rect x="1070" y="200" width="140" height="40" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1"/>
  <text x="1140" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger)">~200ms</text>
  <text x="1140" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Persistent data</text>
  <text x="1140" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Full queries</text>
  <!-- Speed gradient bar -->
  <rect x="40" y="530" width="1200" height="20" rx="10" fill="var(--surface)"/>
  <rect x="40" y="530" width="300" height="20" rx="10" fill="var(--ok)" opacity="0.5"/>
  <rect x="340" y="530" width="300" height="20" fill="var(--warn)" opacity="0.4"/>
  <rect x="640" y="530" width="300" height="20" fill="var(--warn)" opacity="0.6"/>
  <rect x="940" y="530" width="300" height="20" rx="10" fill="var(--danger)" opacity="0.5"/>
  <text x="140" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok)">Fast</text>
  <text x="1140" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger)">Slow</text>
</svg>
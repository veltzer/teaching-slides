<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Arrow: Closer to user = faster -->
  <line x1="80" y1="50.740741" x2="1200" y2="50.740741" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509261" font-weight="bold" fill="var(--text-muted)">Closer to user = Faster                                                                    Closer to data = Slower</text>
  <!-- Layer 1: Browser Cache -->
  <rect x="40" y="104.444444" width="200" height="408.148148" rx="6.746192" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="140" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582028" font-weight="bold" fill="var(--text)">Browser</text>
  <text x="140" y="171.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)">Cache</text>
  <rect x="70" y="211.851852" width="140" height="42.962963" rx="6.746192" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="239.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.872986" font-weight="bold" fill="var(--ok-accent)">&lt;1ms</text>
  <text x="140" y="297.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)">Local storage</text>
  <text x="140" y="317.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)">Service worker</text>
  <!-- Arrow -->
  <line x1="240" y1="308.518519" x2="280" y2="308.518519" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 2: CDN -->
  <rect x="290" y="104.444444" width="200" height="408.148148" rx="6.746192" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582028" font-weight="bold" fill="var(--text)">CDN</text>
  <text x="390" y="171.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)">CloudFront</text>
  <rect x="320" y="211.851852" width="140" height="42.962963" rx="6.746192" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="239.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.872986" font-weight="bold" fill="var(--ok-accent)">~5ms</text>
  <text x="390" y="297.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)">Edge locations</text>
  <text x="390" y="317.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)">Static assets</text>
  <!-- Arrow -->
  <line x1="490" y1="308.518519" x2="530" y2="308.518519" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 3: API Gateway Cache -->
  <rect x="540" y="104.444444" width="200" height="408.148148" rx="6.746192" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582028" font-weight="bold" fill="var(--text)">API Gateway</text>
  <text x="640" y="171.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)">Cache</text>
  <rect x="570" y="211.851852" width="140" height="42.962963" rx="6.746192" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="239.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.872986" font-weight="bold" fill="var(--warn-accent)">~10ms</text>
  <text x="640" y="297.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)">Response caching</text>
  <text x="640" y="317.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)">TTL-based</text>
  <!-- Arrow -->
  <line x1="740" y1="308.518519" x2="780" y2="308.518519" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 4: App Cache / Redis -->
  <rect x="790" y="104.444444" width="200" height="408.148148" rx="6.746192" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582028" font-weight="bold" fill="var(--text)">App Cache</text>
  <text x="890" y="171.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)">Redis / Memcached</text>
  <rect x="820" y="211.851852" width="140" height="42.962963" rx="6.746192" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="239.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.872986" font-weight="bold" fill="var(--warn-accent)">~50ms</text>
  <text x="890" y="297.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)">Session data</text>
  <text x="890" y="317.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)">Query results</text>
  <!-- Arrow -->
  <line x1="990" y1="308.518519" x2="1030" y2="308.518519" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 5: Database -->
  <rect x="1040" y="104.444444" width="200" height="408.148148" rx="6.746192" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582028" font-weight="bold" fill="var(--text)">Database</text>
  <text x="1140" y="171.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509261" fill="var(--text-muted)">Source of Truth</text>
  <rect x="1070" y="211.851852" width="140" height="42.962963" rx="6.746192" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="239.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.872986" font-weight="bold" fill="var(--danger-accent)">~200ms</text>
  <text x="1140" y="297.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)">Persistent data</text>
  <text x="1140" y="317.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436493" fill="var(--text-faint)">Full queries</text>
  <!-- Speed gradient bar -->
  <rect x="40" y="566.296296" width="1200" height="21.481481" rx="6.746192" fill="var(--surface)"/>
  <rect x="40" y="566.296296" width="300" height="21.481481" rx="6.746192" fill="var(--ok-fill)" opacity="0.5" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="340" y="566.296296" width="300" height="21.481481" fill="var(--warn-fill)" opacity="0.4" rx="6.746192" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="566.296296" width="300" height="21.481481" fill="var(--warn-fill)" opacity="0.6" rx="6.746192" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="566.296296" width="300" height="21.481481" rx="6.746192" fill="var(--danger-fill)" opacity="0.5" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472933" font-weight="bold" fill="var(--ok-accent)">Fast</text>
  <text x="1140" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472933" font-weight="bold" fill="var(--danger-accent)">Slow</text>
</svg>
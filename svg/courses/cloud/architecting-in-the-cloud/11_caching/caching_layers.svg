<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <!-- Arrow: Closer to user = faster -->
  <line x1="115" y1="85.3125" x2="1165" y2="85.3125" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text-muted)">Closer to user = Faster                                                                    Closer to data = Slower</text>
  <!-- Layer 1: Browser Cache -->
  <rect x="77.5" y="130.625" width="187.5" height="344.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="171.25" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Browser</text>
  <text x="171.25" y="186.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Cache</text>
  <rect x="105.625" y="221.25" width="131.25" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="171.25" y="244.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--ok-accent)">&lt;1ms</text>
  <text x="171.25" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Local storage</text>
  <text x="171.25" y="310.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Service worker</text>
  <!-- Arrow -->
  <line x1="265" y1="302.8125" x2="302.5" y2="302.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 2: CDN -->
  <rect x="311.875" y="130.625" width="187.5" height="344.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="405.625" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">CDN</text>
  <text x="405.625" y="186.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">CloudFront</text>
  <rect x="340" y="221.25" width="131.25" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="405.625" y="244.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--ok-accent)">~5ms</text>
  <text x="405.625" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Edge locations</text>
  <text x="405.625" y="310.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Static assets</text>
  <!-- Arrow -->
  <line x1="499.375" y1="302.8125" x2="536.875" y2="302.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 3: API Gateway Cache -->
  <rect x="546.25" y="130.625" width="187.5" height="344.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">API Gateway</text>
  <text x="640" y="186.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Cache</text>
  <rect x="574.375" y="221.25" width="131.25" height="36.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="244.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--warn-accent)">~10ms</text>
  <text x="640" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Response caching</text>
  <text x="640" y="310.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">TTL-based</text>
  <!-- Arrow -->
  <line x1="733.75" y1="302.8125" x2="771.25" y2="302.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 4: App Cache / Redis -->
  <rect x="780.625" y="130.625" width="187.5" height="344.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="874.375" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">App Cache</text>
  <text x="874.375" y="186.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Redis / Memcached</text>
  <rect x="808.75" y="221.25" width="131.25" height="36.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="874.375" y="244.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--warn-accent)">~50ms</text>
  <text x="874.375" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Session data</text>
  <text x="874.375" y="310.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Query results</text>
  <!-- Arrow -->
  <line x1="968.125" y1="302.8125" x2="1005.625" y2="302.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 5: Database -->
  <rect x="1015" y="130.625" width="187.5" height="344.375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.75" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text)">Database</text>
  <text x="1108.75" y="186.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Source of Truth</text>
  <rect x="1043.125" y="221.25" width="131.25" height="36.25" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1108.75" y="244.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1218" font-weight="bold" fill="var(--danger-accent)">~200ms</text>
  <text x="1108.75" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Persistent data</text>
  <text x="1108.75" y="310.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Full queries</text>
  <!-- Speed gradient bar -->
  <rect x="77.5" y="520.3125" width="1125" height="18.125" rx="6" fill="var(--surface)"/>
  <rect x="77.5" y="520.3125" width="281.25" height="18.125" rx="6" fill="var(--ok-fill)" opacity="0.5" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="358.75" y="520.3125" width="281.25" height="18.125" fill="var(--warn-fill)" opacity="0.4" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="640" y="520.3125" width="281.25" height="18.125" fill="var(--warn-fill)" opacity="0.6" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="921.25" y="520.3125" width="281.25" height="18.125" rx="6" fill="var(--danger-fill)" opacity="0.5" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="171.25" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Fast</text>
  <text x="1108.75" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--danger-accent)">Slow</text>
</svg>
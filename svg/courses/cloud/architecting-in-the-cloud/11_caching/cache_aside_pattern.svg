<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --surface-alt: #eeeeee;
        --border: #e0e0e0; --border-strong: #bdbdbd;
        --text: #212121; --text-dark: #333333; --text-muted: #555555; --text-faint: #888888;
        --primary: #1e88e5; --primary-dk: #1565c0; --primary-lt: #bbdefb; --primary-pale: #e3f2fd;
        --ok: #43a047; --ok-dk: #2e7d32; --ok-lt: #c8e6c9; --ok-pale: #e8f5e9;
        --warn: #fb8c00; --warn-dk: #e65100; --warn-lt: #ffe0b2; --warn-pale: #fff3e0;
        --danger: #e53935; --danger-dk: #c62828; --danger-lt: #ffcdd2; --danger-pale: #ffebee;
        --info: #8e24aa; --info-dk: #6a1b9a; --info-lt: #ce93d8; --info-pale: #f3e5f5;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/><stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/><stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="0"/>
  <!-- Request -->
  <rect x="60" y="250" width="150" height="60" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Request</text>
  <!-- Arrow: Request to Check Cache -->
  <line x1="210" y1="280" x2="290" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">1</text>
  <!-- Check Cache -->
  <rect x="300" y="240" width="180" height="80" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Check Cache</text>
  <text x="390" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">(Redis/Memcached)</text>
  <!-- Decision Diamond: Hit? -->
  <polygon points="640,220 730,280 640,340 550,280" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Hit?</text>
  <line x1="480" y1="280" x2="548" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">2</text>
  <!-- YES path: Cache Hit -->
  <line x1="730" y1="260" x2="850" y2="160" stroke="var(--ok)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="800" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok)">Yes</text>
  <rect x="860" y="120" width="200" height="80" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-dk)">Return Cached</text>
  <text x="960" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok)">Data (fast!)</text>
  <!-- NO path: Cache Miss -->
  <line x1="640" y1="340" x2="640" y2="388" stroke="var(--danger)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="660" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger)">No</text>
  <!-- Query Database -->
  <rect x="540" y="390" width="200" height="70" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-dk)">Query Database</text>
  <text x="640" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">3. Fetch from DB</text>
  <!-- Store in Cache -->
  <line x1="740" y1="425" x2="838" y2="425" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="850" y="390" width="200" height="70" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-dk)">Store in Cache</text>
  <text x="950" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">4. Update cache</text>
  <!-- Return Data -->
  <line x1="1050" y1="410" x2="1098" y2="350" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1080" y="290" width="160" height="60" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-dk)">Return Data</text>
  <text x="1160" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">5. Respond</text>
  <!-- Summary boxes -->
  <rect x="60" y="530" width="250" height="70" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="185" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">Cache Hit Path</text>
  <text x="185" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Steps: 1 -> 2 -> Return (fast)</text>
  <rect x="340" y="530" width="300" height="70" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="490" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)">Cache Miss Path</text>
  <text x="490" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Steps: 1 -> 2 -> 3 -> 4 -> 5 (slower)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Request -->
  <rect x="40" y="197.083333" width="152.542373" height="72.5" rx="7.215802" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="116.271186" y="240.583333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.736321" font-weight="bold" fill="var(--text)">Request</text>
  <!-- Arrow: Request to Check Cache -->
  <line x1="192.542373" y1="233.333333" x2="273.898305" y2="233.333333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="233.220339" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.30221" fill="var(--text-faint)">1</text>
  <!-- Check Cache -->
  <rect x="284.067797" y="185" width="183.050847" height="96.666667" rx="7.215802" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="375.59322" y="228.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.627733" font-weight="bold" fill="var(--text)">Check Cache</text>
  <text x="375.59322" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.30221" fill="var(--text-muted)">(Redis/Memcached)</text>
  <!-- Decision Diamond: Hit? -->
  <polygon points="629.830508,160.833333 721.355932,233.333333 629.830508,305.833333 538.305085,233.333333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.830508" y="228.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.736321" font-weight="bold" fill="var(--text)">Hit?</text>
  <line x1="467.118644" y1="233.333333" x2="536.271186" y2="233.333333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="502.711864" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.30221" fill="var(--text-faint)">2</text>
  <!-- YES path: Cache Hit -->
  <line x1="721.355932" y1="209.166667" x2="843.389831" y2="88.333333" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="792.542373" y="130.625067" font-family="Arial, sans-serif" font-size="15.519266" font-weight="bold" fill="var(--ok-accent)">Yes</text>
  <rect x="853.559322" y="40" width="203.389831" height="96.666667" rx="7.215802" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955.254237" y="82.291733" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.627733" font-weight="bold" fill="var(--ok-accent)">Return Cached</text>
  <text x="955.254237" y="110.083333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.410798" fill="var(--ok-accent)">Data (fast!)</text>
  <!-- NO path: Cache Miss -->
  <line x1="629.830508" y1="305.833333" x2="629.830508" y2="363.833333" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650.169492" y="342.083333" font-family="Arial, sans-serif" font-size="15.519266" font-weight="bold" fill="var(--danger-accent)">No</text>
  <!-- Query Database -->
  <rect x="528.135593" y="366.25" width="203.389831" height="84.583333" rx="7.215802" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.830508" y="407.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.627733" font-weight="bold" fill="var(--primary-accent)">Query Database</text>
  <text x="629.830508" y="433.916667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.30221" fill="var(--text-muted)">3. Fetch from DB</text>
  <!-- Store in Cache -->
  <line x1="731.525424" y1="408.5416" x2="831.186441" y2="408.5416" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="843.389831" y="366.25" width="203.389831" height="84.583333" rx="7.215802" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.084746" y="407.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.627733" font-weight="bold" fill="var(--warn-accent)">Store in Cache</text>
  <text x="945.084746" y="433.916667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.30221" fill="var(--text-muted)">4. Update cache</text>
  <!-- Return Data -->
  <line x1="1046.779661" y1="390.416667" x2="1095.59322" y2="317.916667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1077.288136" y="245.416667" width="162.711864" height="72.5" rx="7.215802" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1158.644068" y="279.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.627733" font-weight="bold" fill="var(--ok-accent)">Return Data</text>
  <text x="1158.644068" y="303.416667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.30221" fill="var(--text-muted)">5. Respond</text>
  <!-- Summary boxes -->
  <rect x="40" y="535.416667" width="254.237288" height="84.583333" rx="7.215802" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.118644" y="569.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.519266" font-weight="bold" fill="var(--ok-accent)">Cache Hit Path</text>
  <text x="167.118644" y="595.833333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.30221" fill="var(--text-muted)">Steps: 1 -> 2 -> Return (fast)</text>
  <rect x="324.745763" y="535.416667" width="305.084746" height="84.583333" rx="7.215802" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.288136" y="569.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.519266" font-weight="bold" fill="var(--warn-accent)">Cache Miss Path</text>
  <text x="477.288136" y="595.833333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.30221" fill="var(--text-muted)">Steps: 1 -> 2 -> 3 -> 4 -> 5 (slower)</text>
</svg>
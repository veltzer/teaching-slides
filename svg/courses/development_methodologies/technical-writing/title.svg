<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Technical Writing</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Documentation that gets read</text>

  <!-- Stylised document layout -->
  <rect x="280" y="240" width="720" height="280" fill="var(--surface)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <rect x="320" y="280" width="400" height="20" fill="var(--text)"/>
  <rect x="320" y="320" width="640" height="6" fill="var(--text-muted)"/>
  <rect x="320" y="340" width="640" height="6" fill="var(--text-muted)"/>
  <rect x="320" y="360" width="500" height="6" fill="var(--text-muted)"/>
  <rect x="320" y="400" width="200" height="14" fill="var(--text)"/>
  <rect x="320" y="430" width="640" height="6" fill="var(--text-muted)"/>
  <rect x="320" y="450" width="640" height="6" fill="var(--text-muted)"/>
  <rect x="320" y="470" width="400" height="6" fill="var(--text-muted)"/>

  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">audience &#8226; structure &#8226; style &#8226; ADRs &#8226; APIs &#8226; diagrams &#8226; review</text>
</svg>

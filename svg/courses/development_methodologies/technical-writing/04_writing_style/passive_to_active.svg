<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.727393858384" font-weight="bold" fill="var(--text)">Active Voice for Technical Writing</text>

  <rect x="40" y="90.877192982456" width="579.310344827586" height="203.508771929825" rx="10.259783520852" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.519567041703" font-weight="bold" fill="var(--danger-text)">Passive (avoid)</text>
  <text x="329.655172413793" y="172.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389675281277" fill="var(--danger-text)">"The cache is invalidated by the worker."</text>
  <text x="329.655172413793" y="212.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389675281277" fill="var(--danger-text)">"Errors are returned by the API."</text>
  <text x="329.655172413793" y="253.684210526316" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389675281277" fill="var(--danger-text)">"It is recommended to use HTTPS."</text>

  <rect x="660.689655172414" y="90.877192982456" width="579.310344827586" height="203.508771929825" rx="10.259783520852" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.519567041703" font-weight="bold" fill="var(--ok-text)">Active (prefer)</text>
  <text x="950.344827586207" y="172.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389675281277" fill="var(--ok-text)">"The worker invalidates the cache."</text>
  <text x="950.344827586207" y="212.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389675281277" fill="var(--ok-text)">"The API returns errors."</text>
  <text x="950.344827586207" y="253.684210526316" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.389675281277" fill="var(--ok-text)">"Use HTTPS."</text>

  <rect x="40" y="335.087719298246" width="1200" height="122.105263157895" rx="10.259783520852" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="370.701754385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.467610337533" font-weight="bold" fill="var(--warn-text)">Why active</text>
  <text x="640" y="401.228070175439" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.363696929192" fill="var(--warn-text)">Active names the actor. The reader knows who does what.</text>
  <text x="640" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.363696929192" fill="var(--warn-text)">Shorter, faster to read, more direct. Easier to translate.</text>

  <rect x="40" y="487.719298245614" width="1200" height="132.280701754386" rx="10.259783520852" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.415653633362" font-weight="bold" fill="var(--text)">Other rules of thumb</text>
  <text x="60.689655172414" y="553.859649122807" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--text-muted)">- Cut "in order to", "due to the fact that", "it should be noted"</text>
  <text x="60.689655172414" y="577.263157894737" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--text-muted)">- Prefer present tense ("returns" not "will return")</text>
  <text x="60.689655172414" y="600.666666666667" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--text-muted)">- One idea per sentence; one topic per paragraph</text>
</svg>

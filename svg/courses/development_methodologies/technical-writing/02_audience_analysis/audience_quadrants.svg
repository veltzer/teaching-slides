<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.26339891413" font-weight="bold" fill="var(--text)">Audience Quadrants</text>

  <line x1="640" y1="89.152542372881" x2="640" y2="580.677966101695" stroke="var(--text)" stroke-width="2"/>
  <line x1="40" y1="334.915254237288" x2="1240" y2="334.915254237288" stroke="var(--text)" stroke-width="2"/>

  <text x="40" y="113.728813559322" font-family="Arial, sans-serif" font-size="14.631699457065" font-weight="bold" fill="var(--text-muted)">Expert</text>
  <text x="40" y="565.932203389831" font-family="Arial, sans-serif" font-size="14.631699457065" font-weight="bold" fill="var(--text-muted)">Beginner</text>
  <text x="106.666666666667" y="354.576271186441" font-family="Arial, sans-serif" font-size="14.631699457065" font-weight="bold" fill="var(--text-muted)">Internal</text>
  <text x="1128.888888888889" y="354.576271186441" font-family="Arial, sans-serif" font-size="14.631699457065" font-weight="bold" fill="var(--text-muted)">External</text>

  <rect x="62.222222222222" y="128.474576271186" width="555.555555555556" height="186.779661016949" rx="10.451213897904" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="162.881355932203" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--primary-text)">Expert + Internal</text>
  <text x="84.444444444444" y="197.28813559322" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">e.g., teammates</text>
  <text x="84.444444444444" y="226.779661016949" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">- Skip basics</text>
  <text x="84.444444444444" y="251.35593220339" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">- Use jargon</text>
  <text x="84.444444444444" y="275.932203389831" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">- Focus on decisions</text>
  <text x="84.444444444444" y="300.508474576271" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">- Link, don't repeat</text>

  <rect x="662.222222222222" y="128.474576271186" width="555.555555555556" height="186.779661016949" rx="10.451213897904" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="162.881355932203" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--ok-text)">Expert + External</text>
  <text x="684.444444444444" y="197.28813559322" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--ok-text)">e.g., other devs evaluating</text>
  <text x="684.444444444444" y="226.779661016949" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--ok-text)">- Concise, technical</text>
  <text x="684.444444444444" y="251.35593220339" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--ok-text)">- Real code samples</text>
  <text x="684.444444444444" y="275.932203389831" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--ok-text)">- Reference docs</text>
  <text x="684.444444444444" y="300.508474576271" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--ok-text)">- Compare alternatives</text>

  <rect x="62.222222222222" y="354.576271186441" width="555.555555555556" height="186.779661016949" rx="10.451213897904" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="388.983050847458" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--warn-text)">Beginner + Internal</text>
  <text x="84.444444444444" y="423.389830508475" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--warn-text)">e.g., new hires</text>
  <text x="84.444444444444" y="452.881355932203" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--warn-text)">- Onboarding guides</text>
  <text x="84.444444444444" y="477.457627118644" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--warn-text)">- Project history + why</text>
  <text x="84.444444444444" y="502.033898305085" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--warn-text)">- Glossary of acronyms</text>
  <text x="84.444444444444" y="526.610169491525" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--warn-text)">- Step-by-step tasks</text>

  <rect x="662.222222222222" y="354.576271186441" width="555.555555555556" height="186.779661016949" rx="10.451213897904" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="388.983050847458" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--info-text)">Beginner + External</text>
  <text x="684.444444444444" y="423.389830508475" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">e.g., users / customers</text>
  <text x="684.444444444444" y="452.881355932203" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">- Tutorials</text>
  <text x="684.444444444444" y="477.457627118644" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">- Plain language</text>
  <text x="684.444444444444" y="502.033898305085" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">- Visuals heavy</text>
  <text x="684.444444444444" y="526.610169491525" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--info-text)">- Define before using</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.631699457065" font-style="italic" fill="var(--text-muted)">Pick a quadrant; one document rarely serves all four well</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Audience First, Words Second</text>

  <rect x="40" y="80" width="380" height="260" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Who reads this?</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Job role, seniority</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Existing knowledge</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Time available</text>
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">If unsure, ask one</text>

  <rect x="450" y="80" width="380" height="260" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Why are they reading?</text>
  <text x="470" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Solve a specific problem?</text>
  <text x="470" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Evaluate a decision?</text>
  <text x="470" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Learn a new system?</text>
  <text x="470" y="280" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">Different goal, different doc</text>

  <rect x="860" y="80" width="380" height="260" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">What changes for them?</text>
  <text x="880" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Vocabulary they accept</text>
  <text x="880" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Depth they tolerate</text>
  <text x="880" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">What they will skim</text>
  <text x="880" y="280" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">Most readers skim</text>

  <rect x="40" y="380" width="1200" height="240" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Practical effect</text>
  <text x="60" y="460" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Engineer and exec docs share zero structure</text>
  <text x="60" y="495" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Lead with what the reader cares about</text>
  <text x="60" y="530" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Cut sentences that help only the writer</text>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--text-muted)">If it doesn't serve the reader, drop it</text>
</svg>

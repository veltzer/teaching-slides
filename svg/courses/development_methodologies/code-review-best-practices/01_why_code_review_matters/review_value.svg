<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">What Code Review Is For</text>

  <rect x="40" y="80" width="382" height="260" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Catch bugs</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Fresh eyes spot what author missed</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Edge cases, off-by-ones, races</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Cheaper than fixing in prod</text>
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">But not the main reason</text>

  <rect x="448" y="80" width="382" height="260" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Spread knowledge</text>
  <text x="468" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Two people now understand it</text>
  <text x="468" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Onboards juniors, mentors</text>
  <text x="468" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Reduces single-owner risk</text>
  <text x="468" y="280" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">The compounding benefit</text>

  <rect x="856" y="80" width="382" height="260" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Sustain the codebase</text>
  <text x="876" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Enforce conventions gently</text>
  <text x="876" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Resist creeping complexity</text>
  <text x="876" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Keep architecture coherent</text>
  <text x="876" y="280" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Slow drift, not big rewrites</text>

  <rect x="40" y="380" width="1200" height="240" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">What review is not</text>
  <text x="60" y="460" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Not a substitute for tests</text>
  <text x="60" y="495" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Not a rubber-stamp gate</text>
  <text x="60" y="530" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Not for arguing style — let the linter do that</text>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--text-muted)">If review only catches bugs, it's underused</text>
</svg>

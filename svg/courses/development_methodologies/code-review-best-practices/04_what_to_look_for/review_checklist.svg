<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="641.001669449082" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.023362540568" font-weight="bold" fill="var(--text)">A Reviewer's Lens</text>

  <rect x="40" y="80" width="382.637729549249" height="540" rx="10.008343764489" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.318864774624" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.016687528977" font-weight="bold" fill="var(--info-text)">Correctness</text>
  <text x="60.033388981636" y="155" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--info-text)">Does it solve the stated problem?</text>
  <text x="60.033388981636" y="185" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--info-text)">Edge cases handled?</text>
  <text x="60.033388981636" y="215" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--info-text)">Error paths sensible?</text>
  <text x="60.033388981636" y="245" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--info-text)">Tests exercise the change?</text>
  <text x="60.033388981636" y="275" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--info-text)">Concurrency, retries safe?</text>
  <text x="60.033388981636" y="320" font-family="Arial, sans-serif" font-size="14.011681270284" font-weight="bold" fill="var(--info-text)">First pass questions</text>

  <rect x="448.681135225376" y="80" width="382.637729549249" height="540" rx="10.008343764489" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="641.001669449082" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.016687528977" font-weight="bold" fill="var(--primary-text)">Design</text>
  <text x="468.714524207012" y="155" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--primary-text)">Right place in the codebase?</text>
  <text x="468.714524207012" y="185" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--primary-text)">Coupling reasonable?</text>
  <text x="468.714524207012" y="215" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--primary-text)">Abstractions earning keep?</text>
  <text x="468.714524207012" y="245" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--primary-text)">Names tell the truth?</text>
  <text x="468.714524207012" y="275" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--primary-text)">Future change tolerable?</text>
  <text x="468.714524207012" y="320" font-family="Arial, sans-serif" font-size="14.011681270284" font-weight="bold" fill="var(--primary-text)">The expensive feedback</text>

  <rect x="857.362270450751" y="80" width="382.637729549249" height="540" rx="10.008343764489" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.681135225376" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.016687528977" font-weight="bold" fill="var(--warn-text)">Operational</text>
  <text x="877.395659432387" y="155" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--warn-text)">Logging useful, not noisy?</text>
  <text x="877.395659432387" y="185" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--warn-text)">Metrics on the new path?</text>
  <text x="877.395659432387" y="215" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--warn-text)">Backward compatible?</text>
  <text x="877.395659432387" y="245" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--warn-text)">Rollback path?</text>
  <text x="877.395659432387" y="275" font-family="Arial, sans-serif" font-size="14.011681270284" fill="var(--warn-text)">Migration safe?</text>
  <text x="877.395659432387" y="320" font-family="Arial, sans-serif" font-size="14.011681270284" font-weight="bold" fill="var(--warn-text)">Often missed</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="577.931034482759" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.901529839255" font-weight="bold" fill="var(--text)">PR Size vs Defect Detection</text>

  <line x1="40" y1="477.230769230769" x2="1136.551724137931" y2="477.230769230769" stroke="var(--text)" stroke-width="2"/>
  <line x1="40" y1="84.615384615385" x2="40" y2="477.230769230769" stroke="var(--text)" stroke-width="2"/>

  <text x="588.275862068966" y="517.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.450764919627" fill="var(--text)">Lines changed</text>
  <text x="50" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)" transform="rotate(-90 50 320)">% of bugs caught</text>

  <text x="143.448275862069" y="495.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.529227073966" fill="var(--text)">&lt;100</text>
  <text x="360.689655172414" y="495.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.529227073966" fill="var(--text)">100-200</text>
  <text x="577.931034482759" y="495.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.529227073966" fill="var(--text)">200-400</text>
  <text x="795.172413793103" y="495.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.529227073966" fill="var(--text)">400-1000</text>
  <text x="1012.413793103448" y="495.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.529227073966" fill="var(--text)">&gt;1000</text>

  <path d="M 143.448275862069 129.230769230769 Q 360.689655172414 151.538461538462 577.931034482759 245.230769230769 T 1012.413793103448 441.538461538462" stroke="var(--primary-border)" stroke-width="4" fill="none"/>

  <rect x="102.068965517241" y="106.923076923077" width="82.758620689655" height="44.615384615385" rx="5.764613536983" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="143.448275862069" y="133.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.450764919627" font-weight="bold" fill="var(--ok-text)">90%</text>

  <rect x="536.551724137931" y="222.923076923077" width="82.758620689655" height="44.615384615385" rx="5.764613536983" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="577.931034482759" y="249.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.450764919627" font-weight="bold" fill="var(--warn-text)">60%</text>

  <rect x="971.034482758621" y="419.230769230769" width="82.758620689655" height="44.615384615385" rx="5.764613536983" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="1012.413793103448" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.450764919627" font-weight="bold" fill="var(--danger-text)">20%</text>

  <rect x="40" y="530.769230769231" width="1200" height="89.230769230769" rx="7.686151382644" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="577.931034482759" y="557.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.372302765288" font-weight="bold" fill="var(--text)">Reviewers fatigue past ~200 lines</text>
  <text x="577.931034482759" y="584.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.450764919627" fill="var(--text-muted)">Stack small PRs. Refactor in a separate PR before/after the feature.</text>
  <text x="577.931034482759" y="606.615384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.489995996797" fill="var(--text-muted)">Big PR = rubber-stamping. Small PR = real review.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Superstep: vertices send, receive, update</text>

  <rect x="125" y="155" width="110" height="110" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">V1</text>
  <text x="180" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">state=5</text>

  <rect x="585" y="155" width="110" height="110" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">V2</text>
  <text x="640" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">merge</text>

  <rect x="1045" y="155" width="110" height="110" rx="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1100" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">V3</text>
  <text x="1100" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">state=7</text>

  <line x1="235" y1="210" x2="585" y2="210" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">msg: 5</text>

  <line x1="695" y1="210" x2="1045" y2="210" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">msg: 7</text>

  <rect x="40" y="350" width="380" height="270" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="230" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">sendMsg</text>
  <text x="230" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">runs on each edge,</text>
  <text x="230" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">emits to src or dst</text>
  <text x="230" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">EdgeContext =&gt; Unit</text>

  <rect x="450" y="350" width="380" height="270" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">mergeMsg</text>
  <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">combines messages</text>
  <text x="640" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">per destination vertex</text>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">(A, A) =&gt; A</text>

  <rect x="860" y="350" width="380" height="270" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1050" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">vprog</text>
  <text x="1050" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">updates vertex state</text>
  <text x="1050" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">from merged message</text>
  <text x="1050" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">(Id, V, A) =&gt; V</text>
</svg>

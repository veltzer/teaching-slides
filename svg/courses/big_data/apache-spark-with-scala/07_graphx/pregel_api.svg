<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="280" height="241.666666666667" rx="10.992421631894" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="88.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.183327590167" font-weight="bold" fill="var(--primary-text)">1. vprog</text>
  <text x="180" y="136.666666666667" text-anchor="middle" font-family="Courier New, monospace" font-size="15.389390284651" fill="var(--primary-text)">(id, attr, msg) =&gt; attr</text>
  <text x="180" y="184.999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--primary-text)">update vertex state</text>
  <text x="180" y="227.291666666666" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--primary-text)">active vertices only</text>

  <rect x="340" y="40" width="280" height="241.666666666667" rx="10.992421631894" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="88.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.183327590167" font-weight="bold" fill="var(--ok-text)">2. sendMsg</text>
  <text x="480" y="136.666666666667" text-anchor="middle" font-family="Courier New, monospace" font-size="15.389390284651" fill="var(--ok-text)">triplet =&gt; Iterator[msg]</text>
  <text x="480" y="184.999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--ok-text)">emit along edges</text>
  <text x="480" y="227.291666666666" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--ok-text)">empty halts vertex</text>

  <rect x="640" y="40" width="280" height="241.666666666667" rx="10.992421631894" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="88.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.183327590167" font-weight="bold" fill="var(--warn-text)">3. mergeMsg</text>
  <text x="780" y="136.666666666667" text-anchor="middle" font-family="Courier New, monospace" font-size="15.389390284651" fill="var(--warn-text)">(a, b) =&gt; combined</text>
  <text x="780" y="184.999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--warn-text)">combine inbound</text>
  <text x="780" y="227.291666666666" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--warn-text)">commutative, associative</text>

  <rect x="940" y="40" width="300" height="241.666666666667" rx="10.992421631894" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="88.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.183327590167" font-weight="bold" fill="var(--info-text)">Superstep Barrier</text>
  <text x="1090" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--info-text)">all workers sync</text>
  <text x="1090" y="178.958333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--info-text)">step N msgs → N+1</text>
  <text x="1090" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--info-text)">deterministic</text>

  <line x1="320" y1="160.833333333333" x2="340" y2="160.833333333333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="160.833333333333" x2="640" y2="160.833333333333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="160.833333333333" x2="940" y2="160.833333333333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="329.999999999999" width="380" height="290.000000000001" rx="10.992421631894" fill="var(--surface)" stroke="var(--border)"/>
  <text x="230" y="372.291666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.984843263789" font-weight="bold" fill="var(--text)">Example: Shortest Path</text>
  <text x="230" y="420.624999999999" text-anchor="middle" font-family="Courier New, monospace" font-size="15.389390284651" fill="var(--text-muted)">vprog: min(dist, msg)</text>
  <text x="230" y="462.916666666667" text-anchor="middle" font-family="Courier New, monospace" font-size="15.389390284651" fill="var(--text-muted)">sendMsg: newDist &lt; dst</text>
  <text x="230" y="505.208333333334" text-anchor="middle" font-family="Courier New, monospace" font-size="15.389390284651" fill="var(--text-muted)">mergeMsg: min</text>
  <text x="230" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--text-muted)">halts in ≤ diameter steps</text>

  <rect x="450" y="329.999999999999" width="380" height="290.000000000001" rx="10.992421631894" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="372.291666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.984843263789" font-weight="bold" fill="var(--text)">Convergence</text>
  <text x="640" y="420.624999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--text-muted)">no messages sent</text>
  <text x="640" y="462.916666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--text-muted)">or maxIter reached</text>
  <text x="640" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--text-muted)">active set shrinks</text>
  <text x="640" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--text-muted)">bitmask tracks activity</text>

  <rect x="860" y="329.999999999999" width="380" height="290.000000000001" rx="10.992421631894" fill="var(--surface)" stroke="var(--border)"/>
  <text x="1050" y="372.291666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.984843263789" font-weight="bold" fill="var(--text)">Why BSP?</text>
  <text x="1050" y="420.624999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--text-muted)">simpler than async</text>
  <text x="1050" y="462.916666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--text-muted)">fits Spark stages</text>
  <text x="1050" y="505.208333333334" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--text-muted)">superstep = one job</text>
  <text x="1050" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.58787461103" fill="var(--text-muted)">lineage fault tolerance</text>
</svg>

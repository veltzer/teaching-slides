<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="380" height="284.727273" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="230" y="76.909091" text-anchor="middle" font-family="monospace" font-size="20.538213" font-weight="bold" fill="var(--primary-text)">mapVertices</text>
  <text x="230" y="103.272727" text-anchor="middle" font-family="Arial" font-size="13.349838" fill="var(--primary-text)">transform every vertex attribute</text>
  <text x="230" y="156" text-anchor="middle" font-family="monospace" font-size="14.376749" fill="var(--primary-text)">(id, attr) =&gt; newAttr</text>
  <rect x="80" y="187.636364" width="300" height="105.454545" rx="4.107643" fill="var(--shadow)"/>
  <text x="230" y="219.272727" text-anchor="middle" font-family="monospace" font-size="13.349838" fill="var(--bg)">g.mapVertices((id, a) =&gt;</text>
  <text x="230" y="242.472727" text-anchor="middle" font-family="monospace" font-size="13.349838" fill="var(--bg)">  a.age * 2)</text>
  <text x="230" y="277.272727" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--primary-text)">edges unchanged, vertex type may change</text>

  <rect x="440" y="40" width="380" height="284.727273" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="630" y="76.909091" text-anchor="middle" font-family="monospace" font-size="20.538213" font-weight="bold" fill="var(--ok-text)">mapEdges</text>
  <text x="630" y="103.272727" text-anchor="middle" font-family="Arial" font-size="13.349838" fill="var(--ok-text)">transform every edge attribute</text>
  <text x="630" y="156" text-anchor="middle" font-family="monospace" font-size="14.376749" fill="var(--ok-text)">edge =&gt; newAttr</text>
  <rect x="480" y="187.636364" width="300" height="105.454545" rx="4.107643" fill="var(--shadow)"/>
  <text x="630" y="219.272727" text-anchor="middle" font-family="monospace" font-size="13.349838" fill="var(--bg)">g.mapEdges(e =&gt;</text>
  <text x="630" y="242.472727" text-anchor="middle" font-family="monospace" font-size="13.349838" fill="var(--bg)">  e.attr.length.toDouble)</text>
  <text x="630" y="277.272727" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--ok-text)">sees only the edge, not its endpoints</text>

  <rect x="840" y="40" width="400" height="284.727273" rx="6.161464" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1040" y="76.909091" text-anchor="middle" font-family="monospace" font-size="20.538213" font-weight="bold" fill="var(--warn-text)">mapTriplets</text>
  <text x="1040" y="103.272727" text-anchor="middle" font-family="Arial" font-size="13.349838" fill="var(--warn-text)">edge + both vertex attrs</text>
  <text x="1040" y="156" text-anchor="middle" font-family="monospace" font-size="13.349838" fill="var(--warn-text)">(srcAttr, edge, dstAttr) =&gt; newAttr</text>
  <rect x="880" y="187.636364" width="320" height="105.454545" rx="4.107643" fill="var(--shadow)"/>
  <text x="1040" y="219.272727" text-anchor="middle" font-family="monospace" font-size="13.349838" fill="var(--bg)">g.mapTriplets(t =&gt;</text>
  <text x="1040" y="242.472727" text-anchor="middle" font-family="monospace" font-size="13.349838" fill="var(--bg)">  t.srcAttr.age - t.dstAttr.age)</text>
  <text x="1040" y="277.272727" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--warn-text)">richest edge-level rewrite</text>

  <rect x="40" y="356.363636" width="590" height="263.636364" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="335" y="393.272727" text-anchor="middle" font-family="monospace" font-size="20.538213" font-weight="bold" fill="var(--danger-text)">reverse</text>
  <text x="335" y="419.636364" text-anchor="middle" font-family="Arial" font-size="13.349838" fill="var(--danger-text)">flip every edge direction; structure preserved</text>
  <circle cx="160" cy="504" r="26.699677" fill="var(--bg)"/>
  <text x="160" y="510.327273" text-anchor="middle" font-family="Arial" font-size="14.376749" font-weight="bold" fill="var(--danger-border)">A</text>
  <circle cx="310" cy="504" r="26.699677" fill="var(--bg)"/>
  <text x="310" y="510.327273" text-anchor="middle" font-family="Arial" font-size="14.376749" font-weight="bold" fill="var(--danger-border)">B</text>
  <line x1="186" y1="504" x2="278" y2="504" stroke="var(--bg)" stroke-width="3"/>
  <polygon points="284,504 272,497.672727 272,510.327273" fill="var(--bg)"/>
  <text x="410" y="510.327273" font-family="Arial" font-size="22.592034" font-weight="bold" fill="var(--bg)">=&gt;</text>
  <circle cx="490" cy="504" r="26.699677" fill="var(--bg)"/>
  <text x="490" y="510.327273" text-anchor="middle" font-family="Arial" font-size="14.376749" font-weight="bold" fill="var(--danger-border)">A</text>
  <circle cx="600" cy="504" r="26.699677" fill="var(--bg)"/>
  <text x="600" y="510.327273" text-anchor="middle" font-family="Arial" font-size="14.376749" font-weight="bold" fill="var(--danger-border)">B</text>
  <line x1="578" y1="504" x2="520" y2="504" stroke="var(--bg)" stroke-width="3"/>
  <polygon points="516,504 528,497.672727 528,510.327273" fill="var(--bg)"/>
  <text x="335" y="588.363636" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--danger-text)">graph.reverse - no data shuffled</text>

  <rect x="650" y="356.363636" width="590" height="263.636364" rx="6.161464" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="945" y="393.272727" text-anchor="middle" font-family="monospace" font-size="20.538213" font-weight="bold" fill="var(--info-text)">subgraph</text>
  <text x="945" y="419.636364" text-anchor="middle" font-family="Arial" font-size="13.349838" fill="var(--info-text)">filter with epred and vpred</text>
  <circle cx="720" cy="493.454545" r="22.592034" fill="var(--bg)"/>
  <circle cx="830" cy="461.818182" r="22.592034" fill="var(--bg)"/>
  <circle cx="940" cy="504" r="22.592034" fill="var(--bg)"/>
  <circle cx="830" cy="567.272727" r="22.592034" fill="var(--text-faint)" opacity="0.4"/>
  <circle cx="1080" cy="472.363636" r="22.592034" fill="var(--text-faint)" opacity="0.4"/>
  <line x1="742" y1="493.454545" x2="808" y2="463.927273" stroke="var(--bg)" stroke-width="2"/>
  <line x1="852" y1="463.927273" x2="918" y2="501.890909" stroke="var(--bg)" stroke-width="2"/>
  <line x1="830" y1="485.018182" x2="830" y2="544.072727" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="962" y1="504" x2="1058" y2="474.472727" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="945" y="598.909091" text-anchor="middle" font-family="monospace" font-size="12.322928" fill="var(--info-text)">g.subgraph(e =&gt; e.attr &gt; 0, (id,a) =&gt; a.active)</text>
</svg>

    <line x1="100" y1="25.236364" x2="65" y2="65.309091" stroke="var(--bg)" stroke-width="2" opacity="0.7" stroke-dasharray="4,2"/>
    <text x="65" y="145.454545" text-anchor="middle" font-size="14.376749" fill="var(--bg)" font-family="Arial, sans-serif">graph B</text>
  </g>

  <text x="490" y="198.181818" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">=</text>

  <text x="560" y="166.545455" text-anchor="middle" font-size="14.376749" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">outerJoin</text>
  <text x="560" y="198.181818" text-anchor="middle" font-size="14.376749" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">joinVertices</text>

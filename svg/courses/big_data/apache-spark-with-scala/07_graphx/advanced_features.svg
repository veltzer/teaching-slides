  <text x="945" y="282.545455" text-anchor="middle" font-size="13.349838" fill="var(--bg)" font-family="Arial, sans-serif">trade replication vs locality; default is 2D</text>
  <text x="945" y="308.909091" text-anchor="middle" font-size="12.322928" fill="var(--bg)" font-family="Arial, sans-serif">re-partition before iterative algorithms</text>


    <text x="125" y="50.545455" text-anchor="middle" font-size="13.349838" fill="var(--bg)" font-family="Arial, sans-serif">cache + checkpoint</text>
    <text x="125" y="82.181818" text-anchor="middle" font-size="12.322928" fill="var(--bg)" font-family="Arial, sans-serif">g.cache()</text>
    <text x="125" y="103.272727" text-anchor="middle" font-size="12.322928" fill="var(--bg)" font-family="Arial, sans-serif">g.checkpoint()</text>
    <text x="125" y="124.363636" text-anchor="middle" font-size="12.322928" fill="var(--bg)" font-family="Arial, sans-serif">unpersistVertices</text>

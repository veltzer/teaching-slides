<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="290" height="270" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">PageRank</text>
  <text x="185" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">rank vertices by</text>
  <text x="185" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">inbound links</text>
  <text x="185" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">graph.pageRank</text>

  <rect x="350" y="40" width="290" height="270" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Connected Comp.</text>
  <text x="495" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">label each vertex</text>
  <text x="495" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">with component id</text>
  <text x="495" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">connectedComponents</text>

  <rect x="660" y="40" width="290" height="270" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">Shortest Paths</text>
  <text x="805" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">distance from</text>
  <text x="805" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">landmark vertices</text>
  <text x="805" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">ShortestPaths.run</text>

  <rect x="970" y="40" width="270" height="270" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Label Propagation</text>
  <text x="1105" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">community</text>
  <text x="1105" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">detection</text>
  <text x="1105" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">LabelPropagation</text>

  <rect x="40" y="340" width="1200" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Built on Pregel message-passing API</text>
  <text x="640" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Iterate until convergence or max-iteration cap.</text>
  <text x="640" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Cache input graph; unpersist when done.</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">org.apache.spark.graphx.lib</text>
</svg>

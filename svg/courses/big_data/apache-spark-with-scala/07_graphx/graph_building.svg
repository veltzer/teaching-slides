<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="390" height="580" rx="6.218253" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="40" width="390" height="64.444444" rx="6.218253" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="235" y="82.962963" text-anchor="middle" font-size="20.727509" font-weight="bold" fill="var(--primary-text)" font-family="Courier New, monospace">Graph(vertices, edges)</text>

  <text x="235" y="136.666667" text-anchor="middle" font-size="14.509256" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">when you have typed attrs</text>

  <rect x="60" y="163.518519" width="350" height="139.62963" rx="4.145502" fill="var(--code-bg)"/>
  <text x="75" y="190.37037" font-size="12.436505" fill="var(--primary-fill)" font-family="Courier New, monospace">val v = sc.parallelize(Seq(</text>
  <text x="75" y="211.851852" font-size="12.436505" fill="var(--bg)" font-family="Courier New, monospace">  (1L, ("Alice", 28)),</text>
  <text x="75" y="233.333333" font-size="12.436505" fill="var(--bg)" font-family="Courier New, monospace">  (2L, ("Bob", 27))))</text>
  <text x="75" y="256.962963" font-size="12.436505" fill="var(--primary-fill)" font-family="Courier New, monospace">val e = sc.parallelize(Seq(</text>
  <text x="75" y="278.444444" font-size="12.436505" fill="var(--bg)" font-family="Courier New, monospace">  Edge(1L, 2L, "friend")))</text>
  <text x="75" y="297.777778" font-size="12.436505" fill="var(--ok-fill)" font-family="Courier New, monospace">Graph(v, e)</text>

  <text x="235" y="346.111111" text-anchor="middle" font-size="14.509256" font-weight="bold" fill="var(--primary-border)" font-family="Arial, sans-serif">inputs</text>
  <text x="235" y="378.333333" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">RDD[(VertexId, VD)]</text>
  <text x="235" y="405.185185" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">RDD[Edge[ED]]</text>

  <text x="235" y="458.888889" text-anchor="middle" font-size="14.509256" font-weight="bold" fill="var(--primary-border)" font-family="Arial, sans-serif">use when</text>
  <text x="235" y="491.111111" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">vertex attrs matter</text>
  <text x="235" y="517.962963" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">edge attrs matter</text>
  <text x="235" y="544.814815" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">most common choice</text>

  <rect x="450" y="40" width="390" height="580" rx="6.218253" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="450" y="40" width="390" height="64.444444" rx="6.218253" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="645" y="82.962963" text-anchor="middle" font-size="20.727509" font-weight="bold" fill="var(--ok-text)" font-family="Courier New, monospace">Graph.fromEdges</text>

  <text x="645" y="136.666667" text-anchor="middle" font-size="14.509256" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">edges only, default vtx attr</text>

  <rect x="470" y="163.518519" width="350" height="139.62963" rx="4.145502" fill="var(--code-bg)"/>
  <text x="485" y="190.37037" font-size="12.436505" fill="var(--primary-fill)" font-family="Courier New, monospace">val e = sc.parallelize(Seq(</text>
  <text x="485" y="211.851852" font-size="12.436505" fill="var(--bg)" font-family="Courier New, monospace">  Edge(1L, 2L, 0.5),</text>
  <text x="485" y="233.333333" font-size="12.436505" fill="var(--bg)" font-family="Courier New, monospace">  Edge(2L, 3L, 0.8)))</text>
  <text x="485" y="270.925926" font-size="12.436505" fill="var(--ok-fill)" font-family="Courier New, monospace">Graph.fromEdges(e,</text>
  <text x="485" y="292.407407" font-size="12.436505" fill="var(--ok-fill)" font-family="Courier New, monospace">  defaultValue = 1)</text>

  <text x="645" y="346.111111" text-anchor="middle" font-size="14.509256" font-weight="bold" fill="var(--ok-border)" font-family="Arial, sans-serif">inputs</text>
  <text x="645" y="378.333333" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">RDD[Edge[ED]]</text>
  <text x="645" y="405.185185" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">defaultValue: VD</text>

  <text x="645" y="458.888889" text-anchor="middle" font-size="14.509256" font-weight="bold" fill="var(--ok-border)" font-family="Arial, sans-serif">use when</text>
  <text x="645" y="491.111111" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">vertices inferred from edges</text>
  <text x="645" y="517.962963" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">edge-only datasets</text>
  <text x="645" y="544.814815" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">loading from edge file</text>

  <rect x="860" y="40" width="380" height="580" rx="6.218253" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="860" y="40" width="380" height="64.444444" rx="6.218253" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="1050" y="82.962963" text-anchor="middle" font-size="18.654758" font-weight="bold" fill="var(--warn-text)" font-family="Courier New, monospace">fromEdgeTuples</text>

  <text x="1050" y="136.666667" text-anchor="middle" font-size="14.509256" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">src/dst pairs, no attrs</text>

  <rect x="880" y="163.518519" width="340" height="139.62963" rx="4.145502" fill="var(--code-bg)"/>
  <text x="895" y="190.37037" font-size="12.436505" fill="var(--primary-fill)" font-family="Courier New, monospace">val pairs =</text>
  <text x="895" y="211.851852" font-size="12.436505" fill="var(--bg)" font-family="Courier New, monospace">  sc.parallelize(Seq(</text>
  <text x="895" y="233.333333" font-size="12.436505" fill="var(--bg)" font-family="Courier New, monospace">    (1L, 2L),</text>
  <text x="895" y="254.814815" font-size="12.436505" fill="var(--bg)" font-family="Courier New, monospace">    (2L, 3L)))</text>
  <text x="895" y="287.037037" font-size="12.436505" fill="var(--ok-fill)" font-family="Courier New, monospace">Graph.fromEdgeTuples(</text>
  <text x="895" y="303.148148" font-size="12.436505" fill="var(--ok-fill)" font-family="Courier New, monospace">  pairs, defaultValue=1)</text>

  <text x="1050" y="346.111111" text-anchor="middle" font-size="14.509256" font-weight="bold" fill="var(--warn-border)" font-family="Arial, sans-serif">inputs</text>
  <text x="1050" y="378.333333" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">RDD[(VertexId, VertexId)]</text>
  <text x="1050" y="405.185185" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">default VD</text>

  <text x="1050" y="458.888889" text-anchor="middle" font-size="14.509256" font-weight="bold" fill="var(--warn-border)" font-family="Arial, sans-serif">use when</text>
  <text x="1050" y="491.111111" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">unweighted graph</text>
  <text x="1050" y="517.962963" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">edges count as weight 1</text>
  <text x="1050" y="544.814815" text-anchor="middle" font-size="13.472881" fill="var(--text-muted)" font-family="Arial, sans-serif">adj-list style input</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="290" height="269.285714" rx="6.106203" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="76.25" text-anchor="middle" font-family="monospace" font-size="20.35401" font-weight="bold" fill="var(--primary-text)">reverse</text>
  <text x="185" y="102.142857" text-anchor="middle" font-family="Arial" font-size="13.230106" fill="var(--primary-text)">flip every edge direction</text>
  <rect x="77.6106" y="162.611" width="44.7788" height="44.7788" rx="14" fill="var(--bg)"/>
  <text x="100" y="190.178571" text-anchor="middle" font-family="Arial" font-size="14.247807" font-weight="bold" fill="var(--primary-border)">A</text>
  <rect x="247.611" y="162.611" width="44.7788" height="44.7788" rx="14" fill="var(--bg)"/>
  <text x="270" y="190.178571" text-anchor="middle" font-family="Arial" font-size="14.247807" font-weight="bold" fill="var(--primary-border)">B</text>
  <line x1="122" y1="185" x2="240" y2="185" stroke="var(--bg)" stroke-width="3"/>
  <polygon points="240,185 232,180.857143 232,189.142857" fill="var(--bg)"/>
  <text x="185" y="247.142857" text-anchor="middle" font-family="Arial" font-size="12.212406" fill="var(--primary-text)">A to B becomes B to A</text>
  <line x1="122" y1="273.035714" x2="240" y2="273.035714" stroke="var(--bg)" stroke-width="3" stroke-dasharray="4,3"/>
  <polygon points="122,273.035714 130,268.892857 130,277.178571" fill="var(--bg)"/>

  <rect x="350" y="40" width="290" height="269.285714" rx="6.106203" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="76.25" text-anchor="middle" font-family="monospace" font-size="20.35401" font-weight="bold" fill="var(--ok-text)">subgraph</text>
  <text x="495" y="102.142857" text-anchor="middle" font-family="Arial" font-size="13.230106" fill="var(--ok-text)">filter edges and vertices</text>
  <rect x="381.681" y="166.681" width="36.6372" height="36.6372" rx="14" fill="var(--bg)"/>
  <rect x="476.681" y="145.967" width="36.6372" height="36.6372" rx="14" fill="var(--bg)"/>
  <rect x="571.681" y="177.039" width="36.6372" height="36.6372" rx="14" fill="var(--bg)"/>
  <rect x="421.681" y="239.181" width="36.6372" height="36.6372" rx="14" fill="var(--text-faint)" opacity="0.4"/>
  <rect x="541.681" y="239.181" width="36.6372" height="36.6372" rx="14" fill="var(--text-faint)" opacity="0.4"/>
  <line x1="418" y1="185" x2="477" y2="166.357143" stroke="var(--bg)" stroke-width="2"/>
  <line x1="513" y1="164.285714" x2="572" y2="193.285714" stroke="var(--bg)" stroke-width="2"/>
  <line x1="410" y1="203.642857" x2="430" y2="240.928571" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="446" y1="257.5" x2="554" y2="257.5" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="495" y="298.928571" text-anchor="middle" font-family="Arial" font-size="12.212406" fill="var(--ok-text)">keep only edges where pred=true</text>

  <rect x="660" y="40" width="290" height="269.285714" rx="6.106203" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="76.25" text-anchor="middle" font-family="monospace" font-size="20.35401" font-weight="bold" fill="var(--warn-text)">groupEdges</text>
  <text x="805" y="102.142857" text-anchor="middle" font-family="Arial" font-size="13.230106" fill="var(--warn-text)">merge parallel edges</text>
  <rect x="687.611" y="178.146" width="44.7788" height="44.7788" rx="14" fill="var(--bg)"/>
  <text x="710" y="205.714286" text-anchor="middle" font-family="Arial" font-size="14.247807" font-weight="bold" fill="var(--warn-border)">A</text>
  <rect x="877.611" y="178.146" width="44.7788" height="44.7788" rx="14" fill="var(--bg)"/>
  <text x="900" y="205.714286" text-anchor="middle" font-family="Arial" font-size="14.247807" font-weight="bold" fill="var(--warn-border)">B</text>
  <path d="M 732 185 Q 805 143.571429 878 185" stroke="var(--bg)" stroke-width="2" fill="none"/>
  <path d="M 732 200.535714 L 878 200.535714" stroke="var(--bg)" stroke-width="2"/>
  <path d="M 732 216.071429 Q 805 257.5 878 216.071429" stroke="var(--bg)" stroke-width="2" fill="none"/>
  <text x="805" y="278.214286" text-anchor="middle" font-family="Arial" font-size="12.212406" fill="var(--warn-text)">3 edges + merge fn = 1 edge</text>

  <rect x="970" y="40" width="270" height="269.285714" rx="6.106203" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="76.25" text-anchor="middle" font-family="monospace" font-size="20.35401" font-weight="bold" fill="var(--info-text)">mapEdges</text>
  <text x="1105" y="102.142857" text-anchor="middle" font-family="Arial" font-size="13.230106" fill="var(--info-text)">transform edge attrs</text>
  <rect x="987.611" y="172.968" width="44.7788" height="44.7788" rx="14" fill="var(--bg)"/>
  <rect x="1177.61" y="172.968" width="44.7788" height="44.7788" rx="14" fill="var(--bg)"/>
  <line x1="1032" y1="195.357143" x2="1178" y2="195.357143" stroke="var(--bg)" stroke-width="3"/>
  <text x="1105" y="174.642857" text-anchor="middle" font-family="monospace" font-size="14.247807" font-weight="bold" fill="var(--bg)">"friend"</text>
  <text x="1105" y="234.714286" text-anchor="middle" font-family="Arial" font-size="18.318609" fill="var(--bg)">v</text>
  <text x="1105" y="267.857143" text-anchor="middle" font-family="monospace" font-size="14.247807" font-weight="bold" fill="var(--bg)">0.8</text>
  <text x="1105" y="293.75" text-anchor="middle" font-family="Arial" font-size="12.212406" fill="var(--info-text)">preserves structure</text>

  <rect x="40" y="350.714286" width="1200" height="269.285714" rx="6.106203" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="392.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" font-weight="bold" fill="var(--text)">Edge Operations Cheat Sheet</text>

  <text x="80" y="438.75" font-family="monospace" font-size="16.283208" font-weight="bold" fill="var(--primary-border)">graph.reverse</text>
  <text x="80" y="464.642857" font-family="Arial" font-size="13.230106" fill="var(--text-muted)">swaps src and dst - no data moves</text>

  <text x="80" y="511.25" font-family="monospace" font-size="16.283208" font-weight="bold" fill="var(--ok-border)">graph.subgraph(epred, vpred)</text>
  <text x="80" y="537.142857" font-family="Arial" font-size="13.230106" fill="var(--text-muted)">prune by edge and vertex predicates</text>

  <text x="680" y="438.75" font-family="monospace" font-size="16.283208" font-weight="bold" fill="var(--warn-border)">graph.groupEdges((a,b) =&gt; a+b)</text>
  <text x="680" y="464.642857" font-family="Arial" font-size="13.230106" fill="var(--text-muted)">collapse parallel edges (needs partitionBy first)</text>

  <text x="680" y="511.25" font-family="monospace" font-size="16.283208" font-weight="bold" fill="var(--info-border)">graph.mapEdges(e =&gt; f(e.attr))</text>
  <text x="680" y="537.142857" font-family="Arial" font-size="13.230106" fill="var(--text-muted)">rewrite each edge attribute in place</text>

  <text x="640" y="588.928571" text-anchor="middle" font-family="Arial" font-size="13.230106" fill="var(--text-muted)">All return a new Graph - RDDs are immutable</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="560" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Sample triangle</text>

  <rect x="152" y="172" width="96" height="96" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">A</text>

  <rect x="412" y="172" width="96" height="96" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">B</text>

  <rect x="282" y="402" width="96" height="96" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">C</text>

  <line x1="248" y1="220" x2="412" y2="220" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="222" y1="262" x2="308" y2="408" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="438" y1="262" x2="352" y2="408" stroke="var(--text-muted)" stroke-width="2"/>

  <text x="320" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Each vertex counts 1 triangle it belongs to.</text>

  <rect x="620" y="40" width="620" height="180" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">What it measures</text>
  <text x="930" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">How tightly connected a vertex is</text>
  <text x="930" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">with its neighbors.</text>

  <rect x="620" y="240" width="620" height="180" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Use cases</text>
  <text x="930" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Social clustering, fraud rings,</text>
  <text x="930" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">community density scoring.</text>

  <rect x="620" y="440" width="620" height="180" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">API</text>
  <text x="930" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">graph.triangleCount()</text>
  <text x="930" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">returns VertexRDD of counts.</text>
</svg>

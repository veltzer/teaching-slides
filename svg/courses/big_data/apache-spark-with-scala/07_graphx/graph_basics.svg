<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.699676538728" font-weight="bold" fill="var(--text)">GraphX Basics</text>

  <!-- Left: example graph -->
  <rect x="40" y="76.909090909091" width="600" height="326.909090909091" rx="6.16146381663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="340" y="108.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" font-weight="bold" fill="var(--text)">Social graph example</text>

  <ellipse cx="150" cy="203.454545454545" rx="55" ry="37.963636363636" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="200.290909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--primary-text)">1: Alice</text>
  <text x="150" y="219.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--primary-text)">29</text>

  <ellipse cx="350" cy="166.545454545455" rx="55" ry="37.963636363636" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="163.381818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--primary-text)">2: Bob</text>
  <text x="350" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--primary-text)">35</text>

  <ellipse cx="550" cy="203.454545454545" rx="55" ry="37.963636363636" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="200.290909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--primary-text)">3: Carol</text>
  <text x="550" y="219.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--primary-text)">41</text>

  <ellipse cx="350" cy="335.272727272727" rx="55" ry="37.963636363636" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="332.109090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--primary-text)">4: Dan</text>
  <text x="350" y="351.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--primary-text)">22</text>

  <line x1="205" y1="198.181818181818" x2="295" y2="177.090909090909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="171.818181818182" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">follows</text>

  <line x1="405" y1="182.363636363636" x2="495" y2="198.181818181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="171.818181818182" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">follows</text>

  <line x1="205" y1="219.272727272727" x2="295" y2="324.727272727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="287.818181818182" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">manages</text>

  <line x1="550" y1="242.472727272727" x2="405" y2="335.272727272727" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="308.909090909091" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">mentors</text>

  <!-- Right: data model -->
  <rect x="660" y="76.909090909091" width="580" height="326.909090909091" rx="6.16146381663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="113.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--ok-text)">Data model</text>
  <text x="950" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--ok-text)">VertexRDD[(VertexId, VD)]</text>
  <text x="950" y="182.363636363636" text-anchor="middle" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--ok-text)">(1L, ("Alice", 29))</text>
  <text x="950" y="224.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--ok-text)">EdgeRDD[Edge[ED]]</text>
  <text x="950" y="250.909090909091" text-anchor="middle" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--ok-text)">Edge(1L, 2L, "follows")</text>
  <text x="950" y="293.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--ok-text)">EdgeTriplet[VD, ED]</text>
  <text x="950" y="319.454545454545" text-anchor="middle" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--ok-text)">src + dst + edge attrs</text>
  <text x="950" y="366.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--ok-text)">Joined view for algorithms</text>

  <!-- Bottom: construction -->
  <rect x="40" y="430.181818181818" width="1200" height="189.818181818182" rx="6.16146381663" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="467.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--warn-text)">Building a Graph</text>
  <text x="80" y="504" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">val users = sc.parallelize(Seq((1L, ("Alice", 29)), (2L, ("Bob", 35))))</text>
  <text x="80" y="535.636363636364" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">val edges = sc.parallelize(Seq(Edge(1L, 2L, "follows")))</text>
  <text x="80" y="567.272727272727" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">val graph = Graph(users, edges)</text>
  <text x="80" y="598.909090909091" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">graph.triplets.filter(t =&gt; t.attr == "follows")</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Left: example graph -->
  <rect x="40" y="40" width="600" height="349.126213592233" rx="6.367392662652" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="340" y="73.786407766991" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.979713767071" font-weight="bold" fill="var(--text)">Social graph example</text>

  <ellipse cx="150" cy="175.145631067961" rx="55" ry="40.543689320388" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="171.766990291262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--primary-text)">1: Alice</text>
  <text x="150" y="192.038834951456" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.734785325303" fill="var(--primary-text)">29</text>

  <ellipse cx="350" cy="135.728155339806" rx="55" ry="40.543689320388" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="132.349514563107" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--primary-text)">2: Bob</text>
  <text x="350" y="152.621359223301" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.734785325303" fill="var(--primary-text)">35</text>

  <ellipse cx="550" cy="175.145631067961" rx="55" ry="40.543689320388" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="171.766990291262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--primary-text)">3: Carol</text>
  <text x="550" y="192.038834951456" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.734785325303" fill="var(--primary-text)">41</text>

  <ellipse cx="350" cy="315.922330097087" rx="55" ry="40.543689320388" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="312.543689320388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--primary-text)">4: Dan</text>
  <text x="350" y="332.815533980582" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.734785325303" fill="var(--primary-text)">22</text>

  <line x1="205" y1="169.514563106796" x2="295" y2="146.990291262136" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="240" y="141.359223300971" font-family="Arial, sans-serif" font-size="12.734785325303" fill="var(--text-muted)">follows</text>

  <line x1="405" y1="152.621359223301" x2="495" y2="169.514563106796" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="440" y="141.359223300971" font-family="Arial, sans-serif" font-size="12.734785325303" fill="var(--text-muted)">follows</text>

  <line x1="205" y1="192.038834951456" x2="295" y2="304.660194174758" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="225" y="265.242718446602" font-family="Arial, sans-serif" font-size="12.734785325303" fill="var(--text-muted)">manages</text>

  <line x1="550" y1="216.815533980582" x2="405" y2="315.922330097087" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="455" y="287.766990291262" font-family="Arial, sans-serif" font-size="12.734785325303" fill="var(--text-muted)">mentors</text>

  <!-- Right: data model -->
  <rect x="660" y="40" width="580" height="349.126213592233" rx="6.367392662652" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="79.417475728155" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.102177987955" font-weight="bold" fill="var(--ok-text)">Data model</text>
  <text x="950" y="124.466019417476" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--ok-text)">VertexRDD[(VertexId, VD)]</text>
  <text x="950" y="152.621359223301" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--ok-text)">(1L, ("Alice", 29))</text>
  <text x="950" y="197.669902912622" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--ok-text)">EdgeRDD[Edge[ED]]</text>
  <text x="950" y="225.825242718447" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--ok-text)">Edge(1L, 2L, "follows")</text>
  <text x="950" y="270.873786407767" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--ok-text)">EdgeTriplet[VD, ED]</text>
  <text x="950" y="299.029126213592" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--ok-text)">src + dst + edge attrs</text>
  <text x="950" y="349.708737864078" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--ok-text)">Joined view for algorithms</text>

  <!-- Bottom: construction -->
  <rect x="40" y="417.281553398058" width="1200" height="202.718446601942" rx="6.367392662652" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="456.699029126214" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.102177987955" font-weight="bold" fill="var(--warn-text)">Building a Graph</text>
  <text x="80" y="496.116504854369" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--warn-text)">val users = sc.parallelize(Seq((1L, ("Alice", 29)), (2L, ("Bob", 35))))</text>
  <text x="80" y="529.90291262136" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--warn-text)">val edges = sc.parallelize(Seq(Edge(1L, 2L, "follows")))</text>
  <text x="80" y="563.689320388349" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--warn-text)">val graph = Graph(users, edges)</text>
  <text x="80" y="597.47572815534" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--warn-text)">graph.triplets.filter(t =&gt; t.attr == "follows")</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.2346" font-weight="bold" fill="var(--text)">Connected Components</text>

  <text x="640" y="79.0385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7856" fill="var(--text-muted)">Label each vertex with the lowest vertex id it can reach (treating the graph as undirected).</text>

  <rect x="40" y="106.9231" width="580" height="513.0769" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="145.9615" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8979" font-weight="bold" fill="var(--text)">Input graph</text>

  <ellipse cx="120" cy="212.8846" rx="30" ry="27.8846" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="120" y="218.4615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" font-weight="bold" fill="var(--primary-text)">1</text>

  <ellipse cx="250" cy="212.8846" rx="30" ry="27.8846" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250" y="218.4615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" font-weight="bold" fill="var(--primary-text)">2</text>

  <ellipse cx="185" cy="313.2692" rx="30" ry="27.8846" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="318.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" font-weight="bold" fill="var(--primary-text)">3</text>

  <line x1="150" y1="212.8846" x2="220" y2="212.8846" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="140" y1="237.4231" x2="170" y2="288.7308" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="230" y1="237.4231" x2="200" y2="288.7308" stroke="var(--text-muted)" stroke-width="2"/>

  <ellipse cx="440" cy="212.8846" rx="30" ry="27.8846" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="440" y="218.4615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" font-weight="bold" fill="var(--ok-text)">4</text>

  <ellipse cx="560" cy="212.8846" rx="30" ry="27.8846" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="560" y="218.4615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" font-weight="bold" fill="var(--ok-text)">5</text>

  <line x1="470" y1="212.8846" x2="530" y2="212.8846" stroke="var(--text-muted)" stroke-width="2"/>

  <ellipse cx="330" cy="458.2692" rx="30" ry="27.8846" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="330" y="463.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" font-weight="bold" fill="var(--warn-text)">6</text>

  <text x="185" y="385.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">component A</text>
  <text x="500" y="274.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">component B</text>
  <text x="330" y="525.1923" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">component C (isolated)</text>

  <rect x="40" y="569.8077" width="580" height="39.0385" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="595.4615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" font-weight="bold" fill="var(--info-text)">val cc = graph.connectedComponents()</text>

  <rect x="640" y="106.9231" width="600" height="513.0769" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="145.9615" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8979" font-weight="bold" fill="var(--ok-text)">Output</text>
  <text x="940" y="179.4231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" fill="var(--ok-text)">cc.vertices — VertexRDD[VertexId]</text>
  <text x="940" y="207.3077" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--ok-text)">vertex id → component representative (min id)</text>

  <text x="680" y="251.9231" font-size="13.7295" fill="var(--ok-text)" font-family="Courier New, monospace">(1L, 1L)</text>
  <text x="680" y="279.8077" font-size="13.7295" fill="var(--ok-text)" font-family="Courier New, monospace">(2L, 1L)</text>
  <text x="680" y="307.6923" font-size="13.7295" fill="var(--ok-text)" font-family="Courier New, monospace">(3L, 1L)</text>
  <text x="680" y="335.5769" font-size="13.7295" fill="var(--ok-text)" font-family="Courier New, monospace">(4L, 4L)</text>
  <text x="680" y="363.4615" font-size="13.7295" fill="var(--ok-text)" font-family="Courier New, monospace">(5L, 4L)</text>
  <text x="680" y="391.3462" font-size="13.7295" fill="var(--ok-text)" font-family="Courier New, monospace">(6L, 6L)</text>

  <text x="940" y="447.1154" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7856" font-weight="bold" fill="var(--ok-text)">Common follow-ups</text>
  <text x="680" y="480.5769" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--ok-text)">• count by component — cc.vertices.map(_._2).countByValue</text>
  <text x="680" y="508.4615" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--ok-text)">• largest component — same, take .max</text>
  <text x="680" y="536.3462" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--ok-text)">• filter by component — cc.subgraph(vpred = (id, c) =&gt; c == 1L)</text>
  <text x="680" y="569.8077" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--ok-text)">• stronglyConnectedComponents(numIter) for directed</text>
  <text x="680" y="592.1154" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--ok-text)">• Implementation: Pregel-style label propagation;</text>
  <text x="680" y="608.8462" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--ok-text)">   each vertex adopts the min id from its neighbours.</text>
</svg>

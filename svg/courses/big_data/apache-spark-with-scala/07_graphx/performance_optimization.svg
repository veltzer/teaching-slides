<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.01851260961" font-weight="bold" fill="var(--text)">GraphX Performance Optimization</text>

  <rect x="40" y="82.962962962963" width="590" height="257.777777777778" rx="10.363754503432" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="123.777777777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80025990755" font-weight="bold" fill="var(--primary-text)">Partition Strategy</text>
  <text x="70" y="168.888888888889" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--primary-text)">EdgePartition2D</text>
  <text x="70" y="192.518518518519" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--primary-text)">Best for power-law graphs</text>
  <text x="70" y="229.037037037037" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--primary-text)">RandomVertexCut</text>
  <text x="70" y="252.666666666667" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--primary-text)">Balanced, higher replication</text>
  <text x="70" y="289.185185185185" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--primary-text)">CanonicalRandomVertexCut</text>
  <text x="70" y="312.814814814815" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--primary-text)">Co-locates both directions</text>

  <rect x="650" y="82.962962962963" width="590" height="257.777777777778" rx="10.363754503432" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="123.777777777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80025990755" font-weight="bold" fill="var(--ok-text)">Cache / Persist</text>
  <text x="680" y="168.888888888889" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--ok-text)">graph.cache()</text>
  <text x="680" y="192.518518518519" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">Pin across Pregel supersteps</text>
  <text x="680" y="229.037037037037" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--ok-text)">MEMORY_ONLY_SER</text>
  <text x="680" y="252.666666666667" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">Shrinks big graphs</text>
  <text x="680" y="289.185185185185" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--ok-text)">graph.unpersist()</text>
  <text x="680" y="312.814814814815" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">Drop stale versions</text>

  <rect x="40" y="362.222222222222" width="590" height="257.777777777778" rx="10.363754503432" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="403.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80025990755" font-weight="bold" fill="var(--info-text)">Pregel Convergence</text>
  <text x="70" y="448.148148148148" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--info-text)">activeDirection = Out</text>
  <text x="70" y="471.777777777778" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--info-text)">Skip idle vertex edges</text>
  <text x="70" y="508.296296296296" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--info-text)">Halt on empty messages</text>
  <text x="70" y="531.925925925926" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--info-text)">Vote to stop supersteps</text>
  <text x="70" y="568.444444444444" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--info-text)">Tolerance threshold</text>
  <text x="70" y="592.074074074074" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--info-text)">Skip small deltas</text>

  <rect x="650" y="362.222222222222" width="590" height="257.777777777778" rx="10.363754503432" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="403.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80025990755" font-weight="bold" fill="var(--warn-text)">VertexRDD Indexing</text>
  <text x="680" y="448.148148148148" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--warn-text)">O(1) lookup</text>
  <text x="680" y="471.777777777778" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">No shuffle on joinVertices</text>
  <text x="680" y="508.296296296296" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--warn-text)">Index reuse</text>
  <text x="680" y="531.925925925926" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">mapValues preserves index</text>
  <text x="680" y="568.444444444444" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--warn-text)">leftZipJoin / innerZipJoin</text>
  <text x="680" y="592.074074074074" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Same partitioner, no shuffle</text>
</svg>
